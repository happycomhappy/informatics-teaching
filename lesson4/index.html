    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 15px;
  cursor: pointer;
}

.select:hover {
  border-color: var(--color-primary);
}

.select.is-correct {
  border-color: var(--color-true);

  border-radius: var(--radius);

}

.choice:hover {

.choice input {

.choice__body {

}

.choice__label {

}

.choice__sub {

}

.choice.is-selected {

  background: var(--color-primary-soft);
}

.choice--true.is-selected {

  background: var(--color-true-soft);
}

.choice--false.is-selected {

}

}

.console__head {

}

}

}

}

  }

.modal__title {

.modal__text {

.modal__actions {

  z-index: 20;
}

.has-tip:hover::after,

/* ------------------------------------------------------------------
 * 3차시 전용 스타일 (반복문 학습에서만 쓰는 조각들)
 *
 * 앞선 파일과 역할을 나눈다.
 *   tokens.css     : 색·글꼴·간격 값
 *   base.css       : 앱 골격 · 상단 진행 바 · 하단 이동 바
 *   components.css : 버튼 · 패널 · 입력 · 콘솔 · 배지 · 표
 *   code.css       : 코드 뷰와 실행 상태 표시
 *   steps.css      : 시작 화면 · 선택지 · 채점 결과 등 공통 화면 조각
 *   lesson.css     : ↓ 반복 회차 · 값 카드 · 흐름 고리 · 로봇 트랙 …
 * ------------------------------------------------------------------ */

/* ===================== 공통 작은 조각 ===================== */
.note-line {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  min-height: 1.6em;
}

.meta-count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.callout--warn {
  background: var(--color-false-soft);
  border-color: var(--color-false);
  color: var(--color-false-dark);
}

/* 세 칸 배치 (화면 4 : 같은 결과를 내는 세 가지 코드) */
.triple {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}

@media (max-width: 1023px) {
  .triple {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* 오답 해설에서 관련 학습 화면으로 이동하는 줄 */
.linkline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px dashed var(--color-border);
}

.linkline__label {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 화면 1 : 시작 및 선수 학습 확인 =====================
   1·2차시 시작 화면과 같은 형식을 쓴다. 뼈대(.hero / .goal-card / .agenda)는
   steps.css 에 있고, 여기서는 그 위에 얹는 보정만 한다. */

/* 단계 표기(1단계 · 시작 및 선수 학습 확인) */
.hero__eyebrow {
  margin-bottom: var(--space-3);
}

.hero__note strong {
  color: var(--color-primary-dark);
  font-weight: 800;
}

/* 가운데 정렬된 hero 안에서도 문장·문항은 왼쪽 정렬로 읽는다 */
.hero__feedback {
  margin-top: var(--space-5);
  text-align: left;
}

.hero__quiz {
  margin-top: var(--space-6);
  text-align: left;
}

/* 학습 시작 버튼 아래 안내(남은 활동 / 준비 완료) */
.hero__hint {
  margin-top: var(--space-2);
  text-align: center;
}

/* 지난 시간 핵심 내용 — 학습 순서 칩과 같은 모양이되,
   앞쪽 낱말이 열쇠말임이 드러나도록 색과 굵기만 달리한다. */
.recall__key {
  flex: 0 0 auto;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.recall__key::after {
  content: '·';
  margin-left: var(--space-2);
  color: var(--color-border-strong);
  font-weight: 700;
}

.recall__text {
  color: var(--color-text-sub);
  font-weight: 600;
}

/* 선수 학습 미니 문항 · 생각 열기 카드 */
.mini-quiz {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.mini-quiz__q {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
}

/* 미니 문항 안의 소제목(Q1 · Q2)은 위쪽 여백을 줄인다 */
.mini-quiz .section-title {
  margin: var(--space-2) 0 0;
  font-size: 17px;
}

/* ===================== 화면 1 : 생각 열기 ===================== */
.bigq {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.6;
}

.options--row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (max-width: 767px) {
  .options--row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.option--big {
  align-items: center;
  min-height: 72px;
}

.option--big .option__text {
  display: flex;
  flex-direction: column;
}

.compare-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
}

.compare-card.is-picked {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.compare-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.compare-card__title {
  font-weight: 800;
}

/* 100줄이 쌓이는 모습 : 높이를 고정하고 안에서만 스크롤한다 */
.longcode {
  max-height: 220px;
  overflow: auto;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
}

.longcode__lines {
  display: flex;
  flex-direction: column;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: #334155;
}

.longcode__line {
  white-space: pre;
  animation: screen-fade 120ms ease;
}

.longcode__dots {
  color: var(--color-text-sub);
  font-size: 18px;
  letter-spacing: 0.3em;
}

.longcode__count {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

/* ===================== 변수 상태 상자 (11.4) ===================== */
.varbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.varbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 96px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.varbox__label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.varbox__value {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--color-primary-dark);
}

.varbox.is-changed {
  animation: varbox-pop 420ms ease;
}

@keyframes varbox-pop {
  0% {
    transform: scale(1);
    border-color: var(--color-border-strong);
    background: var(--color-surface);
  }
  40% {
    transform: scale(1.08);
    border-color: var(--color-primary);
    background: var(--color-primary-soft);
  }
  100% {
    transform: scale(1);
    border-color: var(--color-primary);
    background: var(--color-surface);
  }
}

/* ===================== 반복 회차 표시 (11.3) ===================== */
.round-meter {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.round-meter__text {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.round-meter__bar {
  flex: 1 1 auto;
  height: 8px;
  min-width: 60px;
  border-radius: 99px;
  background: rgba(37, 99, 235, 0.18);
  overflow: hidden;
}

.round-meter__fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: var(--color-primary);
  transition: width var(--dur-progress) ease;
}

/* ===================== 값 카드 (7.1 · 7.3) ===================== */
.valuecards-wrap {
  position: relative;
  overflow-x: auto;
  padding-bottom: var(--space-5);
}

.valuecards {
  display: flex;
  gap: var(--space-2);
  min-width: max-content;
}

.valuecard {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-2);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  transition: all var(--dur-highlight) ease;
}

.valuecard.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: translateY(-3px) scale(1.06);
  box-shadow: var(--shadow);
}

.valuecard.is-used {
  opacity: 0.5;
  border-style: solid;
  background: var(--color-muted-bg);
}

/* 끝값은 점선 카드로 따로 표시한다(명세 7.3) */
.valuecard--excluded {
  position: relative;
  flex-direction: column;
  margin-left: var(--space-5);
  border-style: dashed;
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.valuecard__note {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.valuecards__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.valuecards__pointer {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 44px;
  transition: transform var(--dur-highlight) ease;
  pointer-events: none;
}

.valuecards__pointer.is-hidden {
  visibility: hidden;
}

.valuecards__arrow {
  color: var(--color-primary);
  font-weight: 900;
  line-height: 1;
}

.valuecards__pointer-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================

    <script data-from="js/00-core.js">
/**
 * 코어 — 전역 네임스페이스 · 단계 등록 · 단계 이동 중개 (명세 4장)
 *
 * 이번 차시의 모든 JS 는 ES 모듈이 아니라 "고전 스크립트"다.
 * import / export 를 쓰지 않고, 각 파일이 즉시실행 함수로 자신을 감싼 뒤
 * window.L 아래에만 필요한 것을 붙인다. (인터넷 없이 file:// 로 열어도 동작해야 하므로)
 *
 * 로드 순서 : 00-core → 10-ui → 20-codeview → 30-state → 40-engine
 *             → 45-quiz → 50-flow → 60-step1 → 61~65-step2~6 → 90-app
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  // 하위 네임스페이스를 미리 만들어 두어 로드 순서 실수에 덜 민감하게 한다.
  L.ui = L.ui || {};
  L.codeview = L.codeview || {};
  L.state = L.state || {};
  L.engine = L.engine || {};
  L.quiz = L.quiz || {};
  L.flow = L.flow || {};
  L.steps = L.steps || {};
  L.nav = L.nav || {};
  L.app = L.app || {};

  /* ------------------------------------------------------------------ */
  /* 공용 상수                                                            */
  /* ------------------------------------------------------------------ */

  /** 단계 제목 (명세 5장) */
  var STEP_TITLES = {
    1: '수업 시작 및 선수 학습 확인',
    2: '청소 당번 뽑기의 문제 발견',
    3: 'while문으로 중복 없는 반 3개 뽑기',
    4: 'break와 continue 몬스터 게임',
    // 명세 10장의 「리스트의 짝수·홀수 개수 구하기」는 이 화면의 «첫 번째 문제»다.
    // 화면 자체는 조건문+반복문을 함께 쓰는 «복합 제어 구조 활용»을 다룬다.
    5: '복합 제어 구조 활용',
    6: '형성평가 및 학습 정리'
  };

  /** 상단 스테퍼에 쓰는 짧은 이름(2~5자) */
  var STEP_SHORTS = {
    1: '시작',
    2: '문제 발견',
    3: 'while',
    4: 'break · continue',
    5: '복합 제어 활용',
    6: '형성평가'
  };

  L.CONST = {
    LESSON_ID: 'lesson3_7_4',
    STORAGE_KEY: 'lesson3_7_4_state',
    /** 명세 12.1 : 제출 주소는 학습 상태와 다른 키에 따로 저장한다. */
    ENDPOINT_KEY: 'lesson3_7_4_endpoint',
    TOTAL_STEPS: 6,
    LESSON_TITLE: '반복하면서 판단하기',
    LESSON_SUBTITLE: '조건문과 반복문을 함께 사용한 문제 해결',
    STUDY_TIME: '45~50분',
    /** 명세 8.3 : 학습용 안전 제한. while 시뮬레이션은 이 횟수에서 멈춘다. */
    MAX_LOOP: 30,
    /** 명세 11장 : 형성평가 배점 */
    QUIZ_COUNT: 5,
    POINT_PER_QUESTION: 2,
    MAX_SCORE: 10,
    PASS_SCORE: 6,

     * false 로 두면 [답안 제출하기] 없이 채점만 한다(인터넷 없이도 그대로 수업 가능).
     */
    SUBMIT_ENABLED: true,
    /** Apps Script Code.gs 를 배포한 /exec 주소. 비워 두면 학생 화면에서 직접 입력한다. */
    SUBMIT_URL: '',
    STEP_TITLES: STEP_TITLES,
    STEP_SHORTS: STEP_SHORTS
  };

  /** 아무 일도 하지 않는 함수 (선택 콜백 자리에 넣는다) */
  L.noop = function () {};

  /* ------------------------------------------------------------------ */
  /* 단계 등록                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 단계 화면 모듈 등록.
   * L.registerStep(n, { title, short, render(container), onEnter(), onLeave() })
   *  - render(container) : 부팅 시 1회만 호출. container 는 이미 만들어진 section.step-screen
   *  - onEnter()         : 그 단계로 이동할 때마다 호출(선택). 저장된 상태를 화면에 되살릴 때 쓴다.
   *  - onLeave()         : 그 단계를 떠날 때 호출(선택). 돌아가는 시뮬레이션을 멈출 때 쓴다.
   */
  L.registerStep = function (n, def) {
    var id = Number(n) || 0;
    var d = def || {};
    var entry = {
      id: id,
      title: d.title || STEP_TITLES[id] || (id + '단계'),
      short: d.short || STEP_SHORTS[id] || String(id),
      render: typeof d.render === 'function' ? d.render : L.noop,
      onEnter: typeof d.onEnter === 'function' ? d.onEnter : null,
      onLeave: typeof d.onLeave === 'function' ? d.onLeave : null,
      rendered: false
    };
    L.steps[id] = entry;
    return entry;
  };

  /** 등록된 단계 정의를 돌려준다(없으면 null). */
  L.getStep = function (n) {
    return L.steps[Number(n)] || null;
  };

  /* ------------------------------------------------------------------ */
  /* 단계 이동 중개                                                       */
  /* ------------------------------------------------------------------ */
  // 90-app.js 가 실제 이동 함수를 등록하고, 각 단계 모듈은 L.nav.goToStep 만 호출한다.
  var navigate = null;

  L.nav.setNavigator = function (fn) {
    navigate = typeof fn === 'function' ? fn : null;
  };

  /**
   * 지정한 단계로 이동한다.
   * options.force = true 면 이동 조건을 무시하고 이동한다(오답 복습 바로가기 · 상단 메뉴).
   */
  L.nav.goToStep = function (step, options) {
    if (typeof navigate === 'function') navigate(step, options || {});
  };

  L.nav.isReady = function () {
    return typeof navigate === 'function';
  };
})();

    <script data-from="js/10-ui.js">
/**
 * 공용 UI 헬퍼 (명세 11.2 코드 표시 / 11.4 접근성 / 11.5 반응형)
 * 이전 차시 ui.js 를 고전 스크립트로 옮긴 것이라 함수 이름과 사용법이 같다.
 * 모든 단계 모듈은 이 헬퍼로 화면을 조립한다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var ui = L.ui || (L.ui = {});

  /* ------------------------------ DOM 유틸 ------------------------------ */
  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  // el() 에서 특별 취급하는 키 (나머지는 속성/프로퍼티로 그대로 넘긴다)
  var RESERVED = {
    'class': true,
    className: true,
    text: true,
    html: true,
    on: true,
    attrs: true,
    dataset: true,
    style: true
  };

  /**
   * 엘리먼트 생성 헬퍼.
   * el('div', { class:'panel', text:'안녕', on:{click:fn}, attrs:{'aria-label':'x'} }, [child, ...])
   */
  function el(tag, props, children) {
    var node = document.createElement(tag);
    var p = props || {};

    if (p['class'] || p.className) node.className = p['class'] || p.className;
    if (p.text !== undefined && p.text !== null) node.textContent = String(p.text);
    if (p.html !== undefined && p.html !== null) node.innerHTML = p.html;

    Object.keys(p).forEach(function (key) {
      if (RESERVED[key]) return;
      var value = p[key];
      if (value === undefined || value === null || value === false) return;
      if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    });

    if (p.attrs) {
      Object.keys(p.attrs).forEach(function (key) {
        var value = p.attrs[key];
        if (value === undefined || value === null || value === false) return;
        node.setAttribute(key, value);
      });
    }
    if (p.dataset) {
      Object.keys(p.dataset).forEach(function (key) {
        node.dataset[key] = p.dataset[key];
      });
    }
    if (p.style) {
      Object.keys(p.style).forEach(function (key) {
        node.style[key] = p.style[key];
      });
    }
    if (p.on) {
      Object.keys(p.on).forEach(function (evt) {
        node.addEventListener(evt, p.on[evt]);
      });
    }

    var list = Array.isArray(children) ? children : children === undefined ? [] : [children];
    list.forEach(function (child) {
      if (child === null || child === undefined || child === false) return;
      node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));

  // 빌드(build.mjs)가 스크립트를 HTML 안에 넣을 때 "</" 를 모두 "<\/" 로 바꾸는데,
  // /</g 라고 쓰면 정규식이 /<\/g 로 망가져 파일 전체가 문법 오류가 된다.

      buffer += ch;
      i += 1;
    }
    flush();
    return out;
  }

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */
  function indentHtml(spaces) {
    if (spaces <= 0) return '';
    var html = '';
    var left = spaces;
    var first = true;
    while (left > 0) {
      var width = Math.min(4, left);
      html +=
        '<span class="indent' +
        (first ? ' indent--first' : '') +
        '"' +
        (width === 4 ? '' : ' style="width:' + width + 'ch"') +
        '></span>';
      left -= width;
      first = false;
    }
    return html;
  }

  function splitIndent(code) {
    var normalized = String(code === undefined || code === null ? '' : code).replace(/\t/g, '    ');
    var match = normalized.match(/^ */);
    var spaces = match ? match[0].length : 0;
    return { spaces: spaces, rest: normalized.slice(spaces) };
  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{
   *   code?: string,                 // 원본 코드 한 줄(앞 공백 = 들여쓰기)
   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁
   * }>
   */
  function createCodeView(opts) {
    var o = opts || {};
    var showLineNumbers = o.showLineNumbers !== false;
    var linesWrap = el('div', { 'class': 'codeview__lines' });
    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);
    var head =
      o.title || o.headExtra
        ? el('div', { 'class': 'codeview__head' }, [
            o.title ? el('span', { 'class': 'codeview__title', html: o.title }) : el('span'),
            o.headExtra || null
          ])
        : null;
    var children = [];
    if (head) children.push(head);
    children.push(scroll);
    var root = el(
      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },
      children
    );

    var current = [];
    var lineEls = [];

    function build(nextLines) {
      current = nextLines || [];
      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }
        });

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.
        var usesParts = Array.isArray(line.parts);
        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  L.codeview = {
    createCodeView: createCodeView,
    highlightPython: highlightPython
  };
})();

   * 값은 문항 id 이며, 배열의 자리(0~4)가 화면에 나오는 차례다.
   */
  var ORDERS = [

    [2, 4, 1, 5, 3], // 재도전 1
    [3, 1, 5, 2, 4] // 재도전 2
  ];

  function orderFor(attempt) {
    var n = Number(attempt) || 0;
    var i = ((n % ORDERS.length) + ORDERS.length) % ORDERS.length;

  }

  function byId(id) {
    for (var i = 0; i < QUESTIONS.length; i += 1) {

   * @param {object} answers  { 문항id : 고른 보기 번호 }  미응답은 null / undefined

      return sum + d.points;

      maxScore: MAX_SCORE,
      passed: score >= PASS_SCORE,
      correctCount: details.filter(function (d) {
        return d.state === 'correct';
      }).length,
      details: details
    };

    MAX_SCORE: MAX_SCORE,
    PASS_SCORE: PASS_SCORE,
    QUESTIONS: QUESTIONS,
    ORDERS: ORDERS,
    orderFor: orderFor,
    byId: byId,
    grade: grade,
    passLabel: passLabel
  };

 * .xlsx  : 브라우저 내장 기능만으로 처리한다. 외부 라이브러리를 쓰지 않는다(명세 25장).

  /* xlsx → 2차원 배열                                                    */
  /* ------------------------------------------------------------------ */

            .map(function (t) {

      .then(function (buffer) {

          .sort()[0];

  /* ------------------------------------------------------------------ */
  /* csv · tsv → 2차원 배열                                               */
  /* ------------------------------------------------------------------ */

    var row = [];

    for (var i = 0; i < clean.length; i += 1) {

      row.some(function (c) {

      })

  }

  /* ------------------------------------------------------------------ */
  /* 행 배열 → 학생 명단                                                   */
  /* ------------------------------------------------------------------ */
  function pickColumns(rows) {
    // 앞쪽 5줄 안에서 머리글을 찾는다(표 위에 제목 줄이 있는 명단이 흔하다).

  }

  /**

   */

      rowsPromise = readXlsx(file);

        new Error('예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV UTF-8 로 저장해 올려 주세요.')

    } else {
      rowsPromise = file.text().then(splitDelimited);
    }

    return rowsPromise.then(function (rows) {
      var picked = pickColumns(rows);
      var students = [];
      var warnings = [];
      var seen = {};

      rows.forEach(function (cells, r) {
        if (r <= picked.headerRow) return;
        var list = cells || [];
        var id = String(list[picked.idCol] === undefined ? '' : list[picked.idCol]).trim();
        var studentName = String(list[picked.nameCol] === undefined ? '' : list[picked.nameCol]).trim();
        if (!id && !studentName) return;

        // 머리글을 못 찾은 경우, 첫 줄이 「학번/이름」 같은 글자면 건너뛴다.
        if (
          picked.headerRow < 0 &&
          r === 0 &&
          (ID_HEADERS.indexOf(norm(id)) !== -1 || NAME_HEADERS.indexOf(norm(studentName)) !== -1)
        ) {
          return;
        }
        if (!id) {
          warnings.push(r + 1 + '행: 학번이 비어 있어 건너뛰었어요. (' + (studentName || '이름 없음') + ')');
          return;
        }
        if (seen[id]) {
          warnings.push(r + 1 + '행: 학번 ' + id + ' 이 여러 번 나와 한 번만 사용했어요.');
          return;
        }
        seen[id] = true;
        students.push({ id: id, name: studentName });
      });

      if (!students.length) {
        throw new Error('명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.');
      }

      return { students: students, warnings: warnings, columns: picked };
    });
  }

  /** 학번 비교용 표준형 (앞의 0 과 공백·기호를 없앤다) */
  function normalizeId(value) {
    var raw = String(value === undefined || value === null ? '' : value).trim();
    var digits = raw.replace(/[^0-9]/g, '');

    return raw.toLowerCase();

    <script data-from="teacher/t20-analysis.js">
/**
 * 교사용 분석 로직 (명세 15장 · 18장)
 *
 *  · 학생 JSON 의 totalScore 를 그대로 믿지 않고 «교사용에서 다시 채점»한다.
 *  · 같은 학생의 제출이 여러 건이면 가장 최근 것만 쓴다.
 *  · 정오 판정 근거가 없으면 `?` 로 표시하고 0점 처리한다.
 *  · 화면을 만들지 않는 순수 계산부라, 브라우저 밖으로 아무것도 내보내지 않는다.

(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var QUIZ = L.quiz;
  var LESSON_ID = L.CONST.LESSON_ID;

  var CIRCLED = '①②③④⑤';

  /** "② [4, 7] — …" 처럼 시작하는 답에서 보기 번호를 뽑는다. 없으면 0. */
  function pickNumber(text) {
    var s = String(text === undefined || text === null ? '' : text).trim();
    if (!s) return 0;
    var idx = CIRCLED.indexOf(s.charAt(0));
    if (idx !== -1) return idx + 1;
    var m = s.match(/^([1-5])[).\s]/);

  }

  /* ------------------------------------------------------------------ */
  /* 읽어들이기                                                           */
  /* ------------------------------------------------------------------ */

  /** 어떤 모양으로 오든 「제출 객체 배열」로 펴 준다. */
  function flatten(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) {
      return raw.reduce(function (acc, item) {

      }, []);
    }
    if (typeof raw === 'object') {

      if (Array.isArray(raw.data)) return flatten(raw.data);
      if (Array.isArray(raw.rows)) return flatten(raw.rows);

  }

  /** 이번 차시 자료만 남긴다(명세 13.1). lesson 값이 없으면 문항 구성으로 판단한다. */
  function isThisLesson(sub) {
    if (!sub || typeof sub !== 'object') return false;
    if (sub.lesson) return String(sub.lesson) === LESSON_ID;
    return Array.isArray(sub.answers);
  }

  /* ------------------------------------------------------------------ */
  /* 재채점 (명세 18장)                                                    */
  /* ------------------------------------------------------------------ */

  /**
   * 한 명의 제출을 다시 채점한다.

    var marks = {};
    var picks = {};

    QUIZ.QUESTIONS.forEach(function (q) {
      var row = null;
      for (var i = 0; i < answers.length; i += 1) {
        if (Number(answers[i].questionId) === q.id) {

      if (!row) {
        marks[q.id] = '-';
        return;
      }

      var answerText = String(row.answer === undefined || row.answer === null ? '' : row.answer).trim();
      if (!answerText) {

        return;
      }

      var picked = pickNumber(answerText);
      picks[q.id] = picked || null;

      // ① 문항 은행의 정답 규칙으로 판정 (가장 믿을 만하다)
      if (picked) {
        var ok = picked === q.answer;
        marks[q.id] = ok ? 'O' : 'X';
        if (ok) score += q.points;
        return;
      }
      // ② 보기 번호를 못 읽으면 correctAnswer 와 글자 비교
      if (row.correctAnswer) {
        var same = answerText === String(row.correctAnswer).trim();

        return;

        return;

  function keyOf(row) {
    return (row.studentId || '') + '|' + (row.name || '');
  }

  function timeValue(text) {

  }

  /**
   * 제출 목록을 정리한다.
   *  - 다른 차시 제외

  /* ------------------------------------------------------------------ */

  /** 학번 비교용 표준형. t15-roster.js 가 있으면 그것을 쓴다(같은 규칙을 두 벌 두지 않는다). */

  /**
   * CSV · TSV · TXT 한 장을 [{id, name}] 로 바꾼다(간단 처리용).

      .slice(hasHead ? 1 : 0)
      .map(function (line) {

   * 학번은 표준형(앞의 0 · 공백 · 기호를 없앤 값)으로 맞춰 본다.

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 15.3 ~ 15.6)                                               */
  /* ------------------------------------------------------------------ */
  function summarize(rows) {

      return r.submitted;
    });

      return r.score;
    });

      submitted: submitted.length,

  /** 명세 15.4 : 점수 높은 순 → 동점이면 제출 시각 빠른 순 */

    return rows
      .filter(function (r) {

      })
      .slice()

  /** 명세 15.5 : 오답률 → 오답 인원 → 문항 번호 순으로 정렬한 문항 분석 */
  function questionStats(rows) {
    var submitted = rows.filter(function (r) {
      return r.submitted;
    });
    var stats = QUIZ.QUESTIONS.map(function (q) {
      var wrong = 0;
      var none = 0;
      var unknown = 0;
      var dist = [0, 0, 0, 0, 0];
      submitted.forEach(function (r) {

        if (picked >= 1 && picked <= 5) dist[picked - 1] += 1;
      });
      var missCount = wrong + none + unknown; // 점수를 받지 못한 인원
      return {
        question: q,
        wrong: wrong,
        none: none,
        unknown: unknown,
        missCount: missCount,
        total: submitted.length,
        rate: submitted.length ? Math.round((missCount / submitted.length) * 100) : 0,
        dist: dist
      };
    });
    return stats.sort(function (a, b) {
      if (b.rate !== a.rate) return b.rate - a.rate;
      if (b.missCount !== a.missCount) return b.missCount - a.missCount;
      return a.question.id - b.question.id;
    });
  }

  /* ------------------------------------------------------------------ */
  /* CSV (명세 15.7)                                                       */
  /* ------------------------------------------------------------------ */
  function toCSV(rows) {
    var head = ['학번', '이름'];
    QUIZ.QUESTIONS.forEach(function (q) {
      head.push(q.id + '번');
    });
    head.push('총점', '이수', '제출 시각');

    var lines = [head];
    rows.forEach(function (r) {
      var line = [r.studentId, r.name];
      QUIZ.QUESTIONS.forEach(function (q) {
        line.push(r.submitted ? markSymbol(r.marks[q.id]) : '미제출');
      });
      line.push(r.submitted ? String(r.score) : '');
      line.push(r.submitted ? QUIZ.passLabel(r.score) : '미제출');
      line.push(r.receivedAt || '');
      lines.push(line);
    });

    var body = lines
      .map(function (cells) {
        return cells
          .map(function (cell) {
            var text = String(cell === undefined || cell === null ? '' : cell);
            return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          })
          .join(',');
      })
      .join('\r\n');

    // 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다.
    return '﻿' + body;
  }

  /** 색 없이도 읽히도록 기호로 바꾼다(명세 15.6). */
  function markSymbol(mark) {
    if (mark === 'O') return '○';
    if (mark === 'X') return '✕';
    if (mark === '?') return '?';
    return '−';
  }

  L.analysis = {
    flatten: flatten,
    isThisLesson: isThisLesson,
    regrade: regrade,
    buildRows: buildRows,
    parseRoster: parseRoster,
    mergeRoster: mergeRoster,
    summarize: summarize,
    top3: top3,
    questionStats: questionStats,
    toCSV: toCSV,
    markSymbol: markSymbol,
    pickNumber: pickNumber,
    normalizeId: normalizeId
  };
})();

    <script data-from="teacher/t90-main.js">
/**
 * 교사용 페이지 조립 (명세 14장 · 15장)

 * 1차시 교사용(`../lesson3_7/dist/lesson3_7_1_teacher.html`)과 같은 «4장 구성»을 쓴다.

 *   2장 전체 요약 · 상위 3명

 * 위쪽에 장 이동 버튼(t-steps), 아래쪽에 [← 이전] · [다음 →] · [마침](t-pager)을 둔다.

 *   함께 있고 그 둘은 «제출물이 없어도 즉시 열려야 하므로»(명세 14장) 장을 잠그지 않는다.
 *   대신 아직 자료가 없는 자리에는 「아직 불러온 제출이 없어요」 안내를 보여 준다.
 *
 * 학생용 6단계 학습 화면은 이 파일에 넣지 않는다(명세 1.2 완전 분리).
 */
(function () {

    allWrongSeen: false,

  };

  var refs = {};

  /* ------------------------------------------------------------------ */
  /* 머리말 · 인쇄 날짜                                                    */

  function buildHeader(root) {

  /* ------------------------------------------------------------------ */
  function buildStepper(root) {
    refs.stepper = el('ol', { 'class': 't-steps', attrs: { 'aria-label': '페이지 이동' } });

    PAGES.forEach(function (p) {

      }, [
        el('span', { 'class': 't-steps__no', text: String(p.no) }),

      ]);
      refs.stepper.appendChild(el('li', { 'class': 't-steps__item' }, [btn]));
    });

    root.appendChild(el('nav', { 'class': 't-steps-wrap no-print' }, [refs.stepper]));
  }

  function buildPager(root) {
    refs.btnPrev = ui.button({
      label: '← 이전',
      variant: 'secondary',
      onClick: function () {
        goToPage(currentPage - 1);
      }
    });
    refs.btnNext = ui.button({
      label: '다음 →',
      variant: 'primary',
      onClick: function () {
        if (currentPage === PAGES.length) finishReview();

    });
    refs.pageHint = el('p', { 'class': 't-pager__hint', attrs: { 'aria-live': 'polite' } });

    root.appendChild(el('footer', { 'class': 't-pager no-print' }, [refs.btnPrev, refs.pageHint, refs.btnNext]));
  }

  /**
   * 하단 이동 버튼 상태.
   *  · 3장에서는 오답률 상위 문항을 모두 확인해야 다음 장이 열린다.
   *  · 마지막 장에서는 「마침」 버튼이 된다.
   */
  function updatePager() {
    var last = currentPage === PAGES.length;
    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = '다음 →';
      refs.btnNext.classList.remove('btn--finish');
      refs.btnNext.setAttribute('aria-label', '다음 장 보기');

      if (currentPage === 3 && state.dataLoaded) {
        var total = wrongList().length;
        refs.btnNext.disabled = !state.allWrongSeen;
        refs.btnNext.title = state.allWrongSeen
          ? ''
          : '문항 ' + total + '개를 모두 확인하면 넘어갈 수 있어요. (' +
            Math.max(0, state.wrongIndex + 1) + ' / ' + total + ')';
        return;
      }
      refs.btnNext.disabled = false;
      refs.btnNext.title = '';
      return;
    }

    refs.btnNext.textContent = '마침';
    refs.btnNext.classList.add('btn--finish');
    refs.btnNext.disabled = false;
    refs.btnNext.title = '';
    refs.btnNext.setAttribute('aria-label', '분석 마치기');
  }

  function finishReview() {
    refs.pageHint.textContent = '분석을 마쳤어요 🎉 위 탭이나 [← 이전]으로 다시 볼 수 있어요.';
    refs.btnNext.disabled = true;
    ui.toast('결과 분석을 마쳤어요.');
    ui.announce('결과 분석을 마쳤습니다.');
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;
    var pages = [refs.page1, refs.page2, refs.page3, refs.page4];

    pages.forEach(function (page, i) {
      page.classList.toggle('is-active', i + 1 === no);
    });
    Array.prototype.slice.call(refs.stepper.querySelectorAll('.t-steps__btn')).forEach(function (btn) {
      var n = Number(btn.dataset.page);
      btn.classList.toggle('is-current', n === no);
      btn.setAttribute('aria-current', n === no ? 'page' : 'false');
    });

    updatePager();
    refs.pageHint.textContent = no + ' / ' + PAGES.length + '장 · ' + PAGES[no - 1].label;

    window.scrollTo(0, 0);
    var page = pages[no - 1];
    if (page && typeof page.focus === 'function') page.focus({ preventScroll: true });
    ui.announce(no + '장 ' + PAGES[no - 1].label);
  }

  /* ------------------------------------------------------------------ */
  /* 1장 — 결과 불러오기 (명세 15.1)                                       */
  /* ------------------------------------------------------------------ */
  function setStatus(kind, text) {
    refs.status.className = 't-status' + (kind ? ' is-' + kind : '');
    refs.status.textContent = text;
  }

  function refresh(label, kind) {
    state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
    state.dataLoaded = state.rows.some(function (r) {
      return r.submitted;
    });
    state.wrongIndex = -1;
    state.allWrongSeen = false;
    renderAll();
    if (label) setStatus(kind || 'ok', label);
  }

  function addRaw(items, label) {
    state.raw = state.raw.concat(items);
    refresh(null);
    var count = state.rows.filter(function (r) {
      return r.submitted;
    }).length;
    setStatus('ok', label + ' — 지금까지 제출 ' + count + '명');
    if (state.dataLoaded && currentPage === 1) showPage(2);
  }

  function readFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    var jsons = list.filter(function (f) {
      return /\.json$/i.test(f.name);
    });
    var skipped = list.length - jsons.length;
    if (!jsons.length) {
      setStatus('error', 'JSON 파일이 없어요. (건너뛴 파일 ' + skipped + '개)');
      return;
    }
    setStatus('loading', jsons.length + '개 파일을 읽는 중…');

    var results = [];
    var done = 0;
    jsons.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          results.push(JSON.parse(String(reader.result)));
        } catch (err) {
          if (window.console) console.warn('[teacher] JSON 을 읽지 못했습니다 : ' + file.name, err);
        }
        done += 1;
        if (done === jsons.length) {
          addRaw(
            results,
            'JSON 파일 ' + jsons.length + '개를 읽었어요' + (skipped ? ' (건너뛴 파일 ' + skipped + '개)' : '')
          );
        }
      };
      reader.onerror = function () {
        done += 1;
        if (done === jsons.length) addRaw(results, '일부 파일을 읽지 못했어요');
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  function loadFromUrl() {
    var url = String(refs.urlInput.value || '').trim();
    if (!/^https?:\/\//i.test(url)) {
      setStatus('error', 'Analytics.gs 를 배포한 /exec 주소를 넣어 주세요.');
      return;
    }
    saveEndpoint(url);
    setStatus('loading', '주소에서 결과를 불러오는 중…');
    window
      .fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('서버 응답 ' + res.status);
        return res.text();
      })
      .then(function (text) {
        addRaw([JSON.parse(text)], '주소에서 결과를 불러왔어요');
      })
      .catch(function (err) {
        setStatus(
          'error',
          '불러오지 못했어요 (' + (err && err.message ? err.message : '연결 실패') +

        );
      });
  }

  var ENDPOINT_KEY = 'lesson3_7_4_analytics_endpoint';

  function savedEndpoint() {
    try {

  function buildSource(root) {
