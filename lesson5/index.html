        if (mark === 'X') wrong += 1;
        else if (mark === '-') none += 1;
        else if (mark === '?') unknown += 1;
        var picked = r.picks[q.id];
        if (picked >= 1 && picked <= 5) dist[picked - 1] += 1;
      });
      var missCount = wrong + none + unknown; // 점수를 받지 못한 인원
      return {
        question: q,
        wrong: wrong,
        none: none,
        unknown: unknown,
        missCount: missCount,
        correct: submitted.length - missCount,
        total: submitted.length,
        rate: submitted.length ? Math.round((missCount / submitted.length) * 100) : 0,
        correctRate: submitted.length
          ? Math.round(((submitted.length - missCount) / submitted.length) * 100)
          : 0,
        dist: dist
      };
    });
    return stats.sort(function (a, b) {
      if (b.rate !== a.rate) return b.rate - a.rate;
      if (b.missCount !== a.missCount) return b.missCount - a.missCount;
      return a.question.id - b.question.id;
    });
  }

  /**
   * 명세 38장 : 6개 오답 영역별 정답률.
   * 정답률이 낮은 순으로 정렬해 돌려주므로 앞의 두 개가 「먼저 다시 볼 영역」이다.
   */
  function categoryStats(rows) {
    var byId = {};
    questionStats(rows).forEach(function (item) {
      byId[item.question.id] = item;
    });
    var submitted = rows.filter(function (r) {
      return r.submitted;
    }).length;

    var list = QUIZ.byCategory().map(function (group) {
      var correct = 0;
      var total = 0;
      group.questions.forEach(function (q) {
        var item = byId[q.id];
        if (!item) return;
        correct += item.correct;
        total += item.total;
      });
      return {
        category: group.category,
        questions: group.questions.map(function (q) {
          return q.id;
        }),
        correct: correct,
        total: total,
        correctRate: total ? Math.round((correct / total) * 100) : 0
      };
    });
    void submitted;
    return list.sort(function (a, b) {
      return a.correctRate - b.correctRate;
    });
  }

  /* ------------------------------------------------------------------ */
  /* CSV (명세 40장)                                                       */
  /* ------------------------------------------------------------------ */
  function toCSV(rows) {
    var head = ['학번', '이름'];
    QUIZ.QUESTIONS.forEach(function (q) {
      head.push(q.id + '번');
    });
    head.push('총점', '종합 이수', '프로젝트 점수', '프로젝트 이수', '프로젝트 도전 과제', '제출 시각');

    var lines = [head];
    rows.forEach(function (r) {
      var line = [r.studentId, r.name];
      QUIZ.QUESTIONS.forEach(function (q) {
        line.push(r.submitted ? markSymbol(r.marks[q.id]) : '미제출');
      });
      line.push(r.submitted ? String(r.score) : '');
      line.push(r.submitted ? QUIZ.passLabel(r.score) : '미제출');
      var p = r.project || { has: false };
      line.push(r.submitted && p.has ? String(p.score) : '');
      line.push(r.submitted ? (p.has ? (p.passed ? '프로젝트 이수' : '프로젝트 보충 필요') : '기록 없음') : '미제출');
      line.push(r.submitted && p.has ? p.challenge || '' : '');
      line.push(r.receivedAt || '');
      lines.push(line);
    });

    var body = lines
      .map(function (cells) {
        return cells
          .map(function (cell) {
            var text = String(cell === undefined || cell === null ? '' : cell);
            return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          })
          .join(',');
      })
      .join('\r\n');

    // 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다.
    return '﻿' + body;
  }

  /** 색 없이도 읽히도록 기호로 바꾼다(명세 39장). */
  function markSymbol(mark) {
    if (mark === 'O') return '○';
    if (mark === 'X') return '✕';
    if (mark === '?') return '?';
    return '−';
  }

  L.analysis = {
    flatten: flatten,
    isThisLesson: isThisLesson,
    regrade: regrade,
    regradeProject: regradeProject,
    buildRows: buildRows,
    parseRoster: parseRoster,
    mergeRoster: mergeRoster,
    summarize: summarize,
    projectSummary: projectSummary,
    top3: top3,
    questionStats: questionStats,
    categoryStats: categoryStats,
    toCSV: toCSV,
    markSymbol: markSymbol,
    pickNumber: pickNumber,
    normalizeId: normalizeId
  };
})();
    </script>
    <script data-from="teacher/t90-main.js">
/**
 * 교사용 페이지 조립 (명세 31장 ~ 40장 · 49장)
 *
 * 1차시 교사용(`../lesson3_7_1/dist/lesson3_7_1_teacher.html`)과 같은 «4장 구성»을 쓴다.
 *   1장 결과 불러오기
 *   2장 전체 요약 · 프로젝트 · 상위 3명
 *   3장 가장 많이 틀린 문제 · 영역별 오답 분석   (문항을 다 봐야 다음 장이 열린다)
 *   4장 전체 명단 · 정답표 · 수업 지도 자료
 *
 * 위쪽에 장 이동 버튼(t-steps), 아래쪽에 [← 이전] · [다음 →] · [마침](t-pager)을 둔다.
 *
 * 1차시와 «다른» 점 한 가지 :
 *   1차시는 자료를 불러오기 전 2~4장을 잠근다. 이번 차시는 4장에 정답표와 수업 지도 자료가
 *   함께 있고 그 둘은 «제출물이 없어도 즉시 열려야 하므로»(명세 31장) 장을 잠그지 않는다.
 *   대신 아직 자료가 없는 자리에만 「아직 불러온 제출이 없어요」 안내를 보여 준다.
 *
 * 학생용 6단계 학습 화면은 이 파일에 넣지 않는다(명세 1.2 완전 분리).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var A = L.analysis;
  var QUIZ = L.quiz;
  var C = L.CONST;

  /** 명세 49장 : 교사용 브라우저에는 이 두 키만 저장한다. */
  var ENDPOINT_KEY = 'lesson3_7_5_analytics_endpoint';
  var PAGE_KEY = 'lesson3_7_5_teacher_page';

  /** 4장 구성 */
  var PAGES = [
    { no: 1, label: '결과 불러오기' },
    { no: 2, label: '요약 · 상위 3명' },
    { no: 3, label: '문항 · 영역 분석' },
    { no: 4, label: '명단 · 정답표 · 지도 자료' }
  ];

  /** 3장에서 넘겨 볼 문항 수(오답률 상위) */
  var WRONG_LIMIT = 3;

  var state = {
    raw: [], // 읽어들인 제출 원본 (화면 메모리에만 둔다)
    rows: [], // 재채점 결과
    roster: [], // 학생 명단
    wrongIndex: -1, // 3장에서 지금 보고 있는 순위(-1 이면 아직 열지 않음)
    allWrongSeen: false,
    dataLoaded: false
  };

  var refs = {};
  var currentPage = 1;

  function readStore(key) {
    try {
      return window.localStorage.getItem(key) || '';
    } catch (err) {
      return '';
    }
  }

  function writeStore(key, value) {
    try {
      if (value) window.localStorage.setItem(key, value);
      else window.localStorage.removeItem(key);
    } catch (err) {
      /* 무시 */
    }
  }

  /* ------------------------------------------------------------------ */
  /* 머리말 · 인쇄 날짜                                                    */
  /* ------------------------------------------------------------------ */
  function buildHeader(root) {
    root.appendChild(
      el('header', { 'class': 't-header' }, [
        el('p', { 'class': 't-header__eyebrow', text: '교사용 · 반복 속의 반복, 패턴을 코드로' }),
        el('h1', {
          'class': 't-header__title',
          text: '종합 형성평가 결과 분석과 프로젝트·수업 지도 자료'
        }),
        el('p', {
          'class': 't-header__sub',
          text:
            '고등학교 1학년 정보 · 다양한 제어 구조 5차시 · ' +
            '종합 형성평가 12점 만점 · 8점 이상이면 이수입니다. ' +
            '프로젝트는 100점 만점 · 60점 이상이면 프로젝트 이수입니다.'
        })
      ])
    );

    // 인쇄할 때만 보이는 날짜 한 줄. 문서 흐름 안의 보통 요소라 첫 장에 한 번만 찍힌다.
    refs.printDate = el('p', { 'class': 't-printdate' });
    root.appendChild(refs.printDate);
    stampPrintDate();
    window.addEventListener('beforeprint', stampPrintDate);
  }

  function stampPrintDate() {
    if (!refs.printDate) return;
    var now = new Date();
    var day = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
    refs.printDate.textContent =
      now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + day + ') 출력';
  }

  /* ------------------------------------------------------------------ */
  /* 장 이동 (위 · 아래)                                                   */
  /* ------------------------------------------------------------------ */
  function buildStepper(root) {
    refs.stepper = el('ol', { 'class': 't-steps', attrs: { 'aria-label': '페이지 이동' } });

    PAGES.forEach(function (p) {
      var btn = el('button', {
        type: 'button',
        'class': 't-steps__btn',
        dataset: { page: String(p.no) },
        attrs: { 'aria-label': p.no + '장 ' + p.label + ' 보기' },
        on: {
          click: function () {
            goToPage(p.no);
          }
        }
      }, [
        el('span', { 'class': 't-steps__no', text: String(p.no) }),
        el('span', { 'class': 't-steps__label', text: p.label })
      ]);
      refs.stepper.appendChild(el('li', { 'class': 't-steps__item' }, [btn]));
    });

    root.appendChild(el('nav', { 'class': 't-steps-wrap no-print' }, [refs.stepper]));
  }

  function buildPager(root) {
    refs.btnPrev = ui.button({
      label: '← 이전',
      variant: 'secondary',
      onClick: function () {
        goToPage(currentPage - 1);
      }
    });
    refs.btnNext = ui.button({
      label: '다음 →',
      variant: 'primary',
      onClick: function () {
        if (currentPage === PAGES.length) finishReview();
        else goToPage(currentPage + 1);
      }
    });
    refs.pageHint = el('p', { 'class': 't-pager__hint', attrs: { 'aria-live': 'polite' } });

    root.appendChild(el('footer', { 'class': 't-pager no-print' }, [refs.btnPrev, refs.pageHint, refs.btnNext]));
  }

  /**
   * 하단 이동 버튼 상태.
   *  · 3장에서는 표시된 문항을 모두 확인해야 다음 장이 열린다.
   *  · 마지막 장에서는 「마침」 버튼이 된다.
   */
  function updatePager() {
    var last = currentPage === PAGES.length;
    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = '다음 →';
      refs.btnNext.classList.remove('btn--finish');
      refs.btnNext.setAttribute('aria-label', '다음 장 보기');

      if (currentPage === 3 && state.dataLoaded) {
        var total = wrongList().length;
        refs.btnNext.disabled = !state.allWrongSeen;
        refs.btnNext.title = state.allWrongSeen
          ? ''
          : '문항 ' + total + '개를 모두 확인하면 넘어갈 수 있어요. (' +
            Math.max(0, state.wrongIndex + 1) + ' / ' + total + ')';
        return;
      }
      refs.btnNext.disabled = false;
      refs.btnNext.title = '';
      return;
    }

    refs.btnNext.textContent = '마침';
    refs.btnNext.classList.add('btn--finish');
    refs.btnNext.disabled = false;
    refs.btnNext.title = '';
    refs.btnNext.setAttribute('aria-label', '분석 마치기');
  }

  function finishReview() {
    refs.pageHint.textContent = '분석을 마쳤어요 🎉 위 탭이나 [← 이전]으로 다시 볼 수 있어요.';
    refs.btnNext.disabled = true;
    ui.toast('결과 분석을 마쳤어요.');
    ui.announce('결과 분석을 마쳤습니다.');
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;
    var pages = [refs.page1, refs.page2, refs.page3, refs.page4];

    pages.forEach(function (page, i) {
      page.classList.toggle('is-active', i + 1 === no);
    });
    Array.prototype.slice.call(refs.stepper.querySelectorAll('.t-steps__btn')).forEach(function (btn) {
      var n = Number(btn.dataset.page);
      btn.classList.toggle('is-current', n === no);
      btn.setAttribute('aria-current', n === no ? 'page' : 'false');
    });

    updatePager();
    refs.pageHint.textContent = no + ' / ' + PAGES.length + '장 · ' + PAGES[no - 1].label;
    writeStore(PAGE_KEY, String(no));

    window.scrollTo(0, 0);
    var page = pages[no - 1];
    if (page && typeof page.focus === 'function') page.focus({ preventScroll: true });
    ui.announce(no + '장 ' + PAGES[no - 1].label);
  }

  /* ------------------------------------------------------------------ */
  /* 1장 — 결과 불러오기 (명세 32장 · 33장)                                 */
  /* ------------------------------------------------------------------ */
  function setStatus(kind, text) {
    refs.status.className = 't-status' + (kind ? ' is-' + kind : '');
    refs.status.textContent = text;
  }

  function refresh() {
    state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
    state.dataLoaded = state.rows.some(function (r) {
      return r.submitted;
    });
    state.wrongIndex = -1;
    state.allWrongSeen = false;
    renderAll();
  }

  function addRaw(items, label) {
    state.raw = state.raw.concat(items);
    refresh();
    var count = state.rows.filter(function (r) {
      return r.submitted;
    }).length;
    setStatus('ok', label + ' — 지금까지 제출 ' + count + '명');
    if (state.dataLoaded && currentPage === 1) showPage(2);
  }

  function readFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    var jsons = list.filter(function (f) {
      return /\.json$/i.test(f.name);
    });
    var skipped = list.length - jsons.length;
    if (!jsons.length) {
      setStatus('error', 'JSON 파일이 없어요. (건너뛴 파일 ' + skipped + '개)');
      return;
    }
    setStatus('loading', jsons.length + '개 파일을 읽는 중…');

    var results = [];
    var done = 0;
    jsons.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          results.push(JSON.parse(String(reader.result)));
        } catch (err) {
          if (window.console) console.warn('[teacher] JSON 을 읽지 못했습니다 : ' + file.name, err);
        }
        done += 1;
        if (done === jsons.length) {
          addRaw(
            results,
            'JSON 파일 ' + jsons.length + '개를 읽었어요' +
              (skipped ? ' (건너뛴 파일 ' + skipped + '개)' : '')
          );
        }
      };
      reader.onerror = function () {
        done += 1;
        if (done === jsons.length) addRaw(results, '일부 파일을 읽지 못했어요');
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  function loadFromUrl() {
    var url = String(refs.urlInput.value || '').trim();
    if (!/^https?:\/\//i.test(url)) {
      setStatus('error', 'Analytics.gs 를 배포한 /exec 주소를 넣어 주세요.');
      return;
    }
    setStatus('loading', '주소에서 결과를 불러오는 중…');
    window
      .fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('서버 응답 ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var data = JSON.parse(text);
        if (data && data.lesson && data.lesson !== C.LESSON_ID) {
          throw new Error('이 차시(' + C.LESSON_ID + ') 의 조회 주소가 아닌 것 같아요');
        }
        // 성공한 주소만 기억한다(명세 32.1).
        writeStore(ENDPOINT_KEY, url);
        addRaw([data], '주소에서 결과를 불러왔어요');
      })
      .catch(function (err) {
        setStatus(
          'error',
          '불러오지 못했어요 (' + (err && err.message ? err.message : '연결 실패') +
            '). [JSON 파일 열기]나 끌어다 놓기를 사용해 주세요.'
        );
      });
  }

  function buildSource(root) {
    refs.urlInput = el('input', {
      type: 'url',
      'class': 't-source__input',
      value: readStore(ENDPOINT_KEY),
      placeholder: 'https://script.google.com/macros/s/…/exec',
      attrs: { 'aria-label': 'Analytics.gs 배포 주소' }
    });
    refs.status = el('p', { 'class': 't-status', text: '아직 불러온 제출이 없어요.' });

    var fileInput = el('input', {
      type: 'file',
      accept: '.json,application/json',
      multiple: true,
      'class': 'sr-only',
      id: 't-file',
      on: {
        change: function (e) {
          readFiles(e.target.files);
          e.target.value = '';
        }
      }
    });

    var drop = el('div', {
      'class': 't-drop',
      text: '또는 제출 JSON 파일들을 이 페이지 위로 끌어다 놓으세요.'
    });
    ['dragenter', 'dragover'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove('is-over');
      });
    });
    drop.addEventListener('drop', function (e) {
      readFiles(e.dataTransfer.files);
    });
    // 페이지 어디든 떨어뜨려도 받아 준다(명세 32.3).
    document.addEventListener('dragover', function (e) {
      e.preventDefault();
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        readFiles(e.dataTransfer.files);
      }
    });

    var box = ui.panel({
      title: '📥 제출 결과 불러오기',
      className: 't-source',
      hint:
        '세 가지 방법 중 편한 것을 쓰면 됩니다. 계산은 모두 이 브라우저 안에서만 이루어지고, ' +
        '결과가 없어도 「정답표」와 「수업 지도 자료」는 4장에서 바로 볼 수 있어요.'
    });
    box.body.appendChild(
      el('div', { 'class': 't-source__row' }, [
        refs.urlInput,
        ui.button({ label: '주소에서 불러오기', onClick: loadFromUrl })
      ])
    );
    box.body.appendChild(
      el('div', { 'class': 't-source__row' }, [
        fileInput,
        el('label', { 'class': 'btn btn--secondary', htmlFor: 't-file', text: '📄 JSON 파일 열기' }),
        ui.button({
          label: '불러온 자료 지우기',
          variant: 'ghost',
          onClick: function () {
            state.raw = [];
            refresh();
            setStatus('', '화면에서 불러온 자료를 지웠어요. (Drive 원본 파일은 지우지 않습니다)');
          }
        })
      ])
    );
    box.body.appendChild(refs.status);
    box.body.appendChild(drop);
    box.body.appendChild(
      el('ul', { 'class': 't-hint-list' }, [
        el('li', {
          html:
            '주소에서 바로 읽으려면 <code>apps-script/Analytics.gs</code> 를 «별도 프로젝트»로 배포한 ' +
            '<code>/exec</code> 주소가 필요합니다. (답안을 저장하는 <code>Code.gs</code> 주소로는 목록을 읽을 수 없어요)'
        }),
        el('li', { html: '학생 답안 파일 이름은 <code>학번_이름.json</code> 입니다.' }),
        el('li', { html: '다른 차시(<code>lesson</code> 값이 다른) 자료는 자동으로 제외합니다.' }),
        el('li', { text: '[불러온 자료 지우기] 는 화면 메모리만 비웁니다. Drive 파일은 그대로 남습니다.' })
      ])
    );
    root.appendChild(box.root);
  }

  /* ------------------------------------------------------------------ */
  /* 2장 — 전체 요약 · 프로젝트 · 상위 3명 (명세 35장 · 36장)                */
  /* ------------------------------------------------------------------ */
  function statCard(label, value, unit) {
    return el('div', { 'class': 't-stat' }, [
      el('p', { 'class': 't-stat__label', text: label }),
      el('p', { 'class': 't-stat__value' }, [
        el('span', { text: String(value) }),
        unit ? el('small', { text: unit }) : null
      ])
    ]);
  }

  function emptyBox(message) {
    return el('div', { 'class': 'panel t-empty' }, [
      el('p', { text: '아직 불러온 제출이 없어요.' }),
      el('p', { 'class': 'panel__hint', text: message })
    ]);
  }

  function renderSummary() {
    var box = refs.summaryBox;
    ui.clear(box);
    if (!state.dataLoaded) {
      box.appendChild(emptyBox('1장에서 제출 결과를 먼저 불러와 주세요.'));
      return;
    }

    var s = A.summarize(state.rows);
    var panel = ui.panel({
      title: '전체 요약 — 종합 형성평가',
      hint: '종합 형성평가 12점 만점 · <strong>8점 이상이면 이수</strong>입니다.'
    });
    panel.body.appendChild(
      el('div', { 'class': 't-stats' }, [
        statCard('제출 학생', s.submitted, '명'),
        statCard('평균 점수', s.average, ' / 12'),
        statCard('최고 점수', s.max, ' / 12'),
        statCard('최저 점수', s.min, ' / 12'),
        statCard('만점자', s.perfect, '명'),
        statCard('종합 평가 이수', s.passCount, '명 · ' + s.passRate + '%')
      ])
    );
    if (s.missing > 0) {
      panel.body.appendChild(
        el('p', {
          'class': 't-warn',
          text: '명단 기준 미제출 학생이 ' + s.missing + '명 있습니다. (4장에서 확인)'
        })
      );
    }
    if (s.mismatch > 0) {
      panel.body.appendChild(
        el('p', {
          'class': 't-warn',
          text:
            '학생 파일에 저장된 총점과 교사용 재채점 점수가 다른 제출이 ' + s.mismatch +
            '건 있습니다. 표의 총점은 재채점 결과입니다.'
        })
      );
    }
    box.appendChild(panel.root);
  }

  /** 명세 35.2 : 프로젝트 요약 카드 */
  function renderProject() {
    var box = refs.projectBox;
    ui.clear(box);
    if (!state.dataLoaded) return;

    var p = A.projectSummary(state.rows);
    var panel = ui.panel({
      title: '전체 요약 — 프로젝트',
      hint: '프로젝트 100점 만점 · <strong>60점 이상이면 프로젝트 이수</strong>입니다.'
    });

    if (!p.counted) {
      panel.body.appendChild(
        el('p', { 'class': 't-empty', text: '프로젝트 기록이 있는 제출이 아직 없어요.' })
      );
      if (p.skipped) {
        panel.body.appendChild(
          el('p', {
            'class': 't-warn',
            text: '프로젝트 기록이 없는 제출 ' + p.skipped + '건은 프로젝트 통계에서 제외했습니다.'
          })
        );
      }
      box.appendChild(panel.root);
      return;
    }

    panel.body.appendChild(
      el('div', { 'class': 't-stats' }, [
        statCard('프로젝트 평균', p.average, ' / 100'),
        statCard('프로젝트 이수', p.passCount, '명 · ' + p.passRate + '%'),
        statCard('평균 도전 횟수', p.avgAttempts, '회'),
        statCard('최고 / 최저', p.max + ' / ' + p.min, '점')
      ])
    );
    panel.body.appendChild(
      el('p', { 'class': 'meta-count', text: '가장 많이 선택한 도전 과제 : ' + p.topChallenge })
    );
    if (p.skipped) {
      panel.body.appendChild(
        el('p', {
          'class': 't-warn',
          text: '프로젝트 기록이 없는 제출 ' + p.skipped + '건은 프로젝트 통계에서 제외했습니다.'
        })
      );
    }
    if (p.mismatch) {
      panel.body.appendChild(
        el('p', {
          'class': 't-warn',
          text:
            '저장된 프로젝트 점수와 루브릭 합계가 다른 제출이 ' + p.mismatch +
            '건 있습니다. 표의 점수는 루브릭 합계입니다.'
        })
      );
    }
    box.appendChild(panel.root);
  }

  /* ------------------------------------------------------------------ */
  /* 상위 3명 (명세 36장)                                                  */
  /* ------------------------------------------------------------------ */
  function renderPodium() {
    var box = refs.podiumBox;
    ui.clear(box);
    if (!state.dataLoaded) return;

    var medals = ['🥇', '🥈', '🥉'];
    var praise = [
      '중첩 반복과 패턴 표현을 정확히 이해했습니다. 프로젝트에서도 행의 규칙을 코드로 잘 바꾸었어요.',
      '실행 흐름을 끝까지 따라가는 힘이 좋아요. 친구에게 설명하는 역할을 맡겨 보세요.',

    });

            el('span', { 'class': 't-card__rank', text: i + 1 + '등' }),
            el('p', { 'class': 't-card__name', text: row.name || '(이름 없음)' }),
            el('p', { 'class': 't-card__meta', text: '학번 ' + (row.studentId || '-') }),
            el('p', { 'class': 't-card__score' }, [
              el('span', { text: String(row.score) }),
              el('small', { text: ' / 12 · ' + QUIZ.passLabel(row.score) })
            ]),
            el('p', {
              'class': 't-card__meta',
              text: '프로젝트 ' + (p.has ? p.score + ' / 100' : '기록 없음')
            }),
            el('p', { 'class': 't-card__praise', text: i + 1 + '등 — ' + praise[i] })
          ]);
        })
      )
    );

  /* ------------------------------------------------------------------ */
  /* 3장 — 가장 많이 틀린 문제 · 영역별 오답 분석 (명세 37장 · 38장)          */
  /* ------------------------------------------------------------------ */
  function wrongList() {
    return A.questionStats(state.rows).slice(0, WRONG_LIMIT);
  }

  function renderWrong() {
    var box = refs.wrongBox;
    ui.clear(box);

    if (!state.dataLoaded) {
      box.appendChild(emptyBox('결과를 불러오면 오답률이 높은 순서로 한 문항씩 보여 드려요.'));
      return;
    }

    var stats = wrongList();
    var panel = ui.panel({
      title: '가장 많이 틀린 문제',
      hint: '버튼을 누를 때마다 오답률이 높은 순서로 <strong>한 문항씩</strong> 보여 줍니다.'
    });

    var progress = el('p', {
      'class': 't-wrong__progress',
      text: Math.max(0, state.wrongIndex + 1) + ' / ' + stats.length + '개 확인'
    });
    panel.body.appendChild(
      el('div', { 'class': 't-wrong__controls no-print' }, [
        ui.button({
          label: state.wrongIndex < 0 ? '가장 많이 틀린 문제 보기' : '다음 문제 보기',
          onClick: function () {
            if (state.wrongIndex >= stats.length - 1) {
              ui.toast('마지막 문항까지 모두 확인했어요.');
              return;
            }
            state.wrongIndex += 1;
            if (state.wrongIndex >= stats.length - 1) state.allWrongSeen = true;
            renderWrong();
            updatePager();
          }
        }),
        ui.button({
          label: '처음부터',
          variant: 'ghost',
          onClick: function () {
            state.wrongIndex = -1;
            renderWrong();
            updatePager();
          }
        }),
        progress
      ])
    );

    if (state.wrongIndex < 0) {
      panel.body.appendChild(
        el('p', { 'class': 't-empty', text: '[가장 많이 틀린 문제 보기]를 누르면 1위 문항부터 나옵니다.' })
      );
      box.appendChild(panel.root);
      return;
    }

    for (var i = 0; i <= state.wrongIndex; i += 1) {
      panel.body.appendChild(wrongCard(stats[i], i));
    }
    box.appendChild(panel.root);
  }

  function wrongCard(item, rankIndex) {
    var q = item.question;
    // 정답을 뺀 보기 중 가장 많이 고른 것(=대표 오답)을 찾는다.
    var topWrong = -1;
    var bestCount = 0;
    item.dist.forEach(function (count, i) {
      if (i + 1 === q.answer) return;
      if (count > bestCount) {
        bestCount = count;
        topWrong = i;
      }
    });

    return el('div', { 'class': 't-wrong__card' }, [
      el('span', { 'class': 't-wrong__rank', text: '오답 순위 ' + (rankIndex + 1) + '위' }),
      el('p', { 'class': 't-wrong__title', text: '문항 ' + q.id + '. ' + q.title + ' — ' + q.short }),
      el('p', {
        'class': 'meta-count',
        text: '생활 속 문제 상황 : ' + q.situation + ' · ' + q.lessonRef
      }),
      el('p', { 'class': 't-wrong__prompt' }, [
        el('span', { text: q.context }),
        el('br'),
        el('strong', { text: q.prompt })
      ]),
      el('div', { 'class': 't-bar' }, [
        el('div', { 'class': 't-bar__fill', style: { width: item.rate + '%' } }),
        el('div', {
          'class': 't-bar__label',
          text: '오답 ' + item.missCount + ' / ' + item.total + '명 · 오답률 ' + item.rate + '%'
        })
      ]),
      // 선택형은 보기별 분포를, 그 밖의 유형(실행 결과 쓰기 · 프로그램 완성하기)은 정답을 보여 준다.
      q.type === 'choice'
        ? el(
            'div',
            { 'class': 't-options' },
            q.options.map(function (text, i) {
              return el('div', {
                'class':
                  't-option' +
                  (i + 1 === q.answer ? ' is-answer' : '') +
                  (i === topWrong ? ' is-top-wrong' : '')
              }, [
                el('span', { 'class': 't-option__num', text: '①②③④⑤'[i] }),
                el('span', { 'class': 't-option__text', text: text }),
                el('span', { 'class': 't-option__count', text: item.dist[i] + '명' })
              ]);
            })
          )
        : el('div', { 'class': 'expected' }, [
            el('p', { 'class': 'expected__title', text: '정답' }),
            el('pre', { 'class': 'expected__body', text: QUIZ.correctToText(q) })
          ]),
      el('p', {
        'class': 'meta-count',
        text: '미응답 ' + item.none + '명 · 판정 불가 ' + item.unknown + '명'
      }),
      el('div', { 'class': 't-explain' }, [
        el('p', {
          'class': 't-explain__label',
          text:
            '정답 ' +
            (q.type === 'choice'
              ? '①②③④⑤'[q.answer - 1]
              : QUIZ.correctToText(q).replace(/\n/g, ' / ')) +
            ' · 해설'
        }),
        el('p', { html: q.explain })
      ]),
      el('div', { 'class': 't-teach' }, [
        el('p', { html: '<strong>💡 이렇게 짚어 주세요</strong> — ' + q.teach }),
        el('p', { text: '오답 유형 : ' + q.category + ' · 보충 화면 : 화면 ' + q.reviewStep })
      ])
    ]);
  }

    var box = refs.categoryBox;
    ui.clear(box);
    if (!state.dataLoaded) return;

            })

            .slice(0, 2)

              return x.category;
            })

          ')은 다음 수업 또는 보충 활동에서 먼저 다시 확인하세요.'

  /* ------------------------------------------------------------------ */
  /* 4장 — 전체 명단 · 정답표 · 수업 지도 자료 (명세 33장 · 39장 · 40장)      */
  /* ------------------------------------------------------------------ */
  function setRosterStatus(kind, text) {
    refs.rosterStatus.className = 't-status' + (kind ? ' is-' + kind : '');
    refs.rosterStatus.textContent = text;
  }

  /** 엑셀(.xlsx) · CSV · TSV · TXT 를 모두 읽는다(명세 33장). */
  function readRoster(file) {
    if (!file) return;
    setRosterStatus('loading', file.name + ' 을(를) 읽는 중…');

    L.roster
      .parseRosterFile(file)
      .then(function (result) {
        state.roster = result.students;
        state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
        renderAll();

        var message = '학생 명단 ' + result.students.length + '명을 읽었어요. 미제출 학생도 표에 나옵니다.';
        if (result.warnings.length) message += ' (건너뛴 줄 ' + result.warnings.length + '개)';
        setRosterStatus('ok', message);
        renderRosterWarnings(result.warnings);
      })
      .catch(function (err) {
        setRosterStatus('error', (err && err.message) || '명단을 읽지 못했어요.');
        renderRosterWarnings([]);
      });
  }

  function renderRosterWarnings(warnings) {
    ui.clear(refs.rosterWarn);
    if (!warnings || !warnings.length) return;
    refs.rosterWarn.appendChild(
      el('div', { 'class': 't-warn' }, [
        el('p', { text: '아래 줄은 명단에 넣지 않았어요.' }),
        el(
          'ul',
          { 'class': 't-hint-list' },
          warnings.slice(0, 10).map(function (text) {
            return el('li', { text: text });
          })
        ),
        warnings.length > 10
          ? el('p', { 'class': 'meta-count', text: '그 밖에 ' + (warnings.length - 10) + '줄 더 있어요.' })
          : null
      ])
    );
  }

  function buildRosterUpload(root) {
    var input = el('input', {
      type: 'file',
      accept: '.xlsx,.csv,.tsv,.txt',
      'class': 'sr-only',
      id: 't-roster-file',
      on: {
        change: function (e) {
          readRoster(e.target.files[0]);
          e.target.value = '';
        }
      }
    });
    refs.rosterStatus = el('p', {
      'class': 't-status',
      text: '명단을 올리지 않아도 제출한 학생만으로 분석할 수 있어요.'
    });

    var box = ui.panel({
      title: '📋 학생 명단 올리기 <span class="t-optional">(선택)</span>',
      className: 'no-print',
      hint: '엑셀(.xlsx) 또는 CSV · TSV · TXT 파일을 올리면 «제출하지 않은 학생»까지 전체 명단에 표시됩니다.'
    });
    box.body.appendChild(
      el('div', { 'class': 't-source__row' }, [
        input,
        el('label', { 'class': 'btn btn--secondary', htmlFor: 't-roster-file', text: '명단 파일 열기' }),
        ui.button({
          label: '명단 지우기',
          variant: 'ghost',
          onClick: function () {
            state.roster = [];
            state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
            renderAll();
            renderRosterWarnings([]);
            setRosterStatus('', '명단을 지웠어요. 제출한 학생만 표시합니다.');
          }
        })
      ])
    );
    box.body.appendChild(refs.rosterStatus);
    refs.rosterWarn = el('div');
    box.body.appendChild(refs.rosterWarn);
    box.body.appendChild(
      el('ul', { 'class': 't-hint-list' }, [
        el('li', { html: '엑셀 파일(<code>.xlsx</code>)을 그대로 올려도 됩니다. 첫 번째 시트를 읽습니다.' }),
        el('li', {
          html:
            '앞쪽 다섯 줄 안에 <code>학번</code>(학번호 · 번호 · id) · <code>이름</code>(성명 · name) ' +
            '머리글이 있으면 자동으로 찾습니다.'
        }),
        el('li', { text: '머리글이 없으면 첫 열을 학번, 둘째 열을 이름으로 읽습니다.' }),
        el('li', {
          html: '예전 형식(<code>.xls</code>)은 읽지 못해요. 엑셀에서 <code>.xlsx</code> 나 CSV 로 저장해 주세요.'
        })
      ])
    );
    root.appendChild(box.root);
  }

  function renderList() {
    var box = refs.listBox;
    ui.clear(box);

    var panel = ui.panel({
      title: '전체 명단 · 정오표',
      hint: '색이 없어도 읽히도록 <strong>○ 정답 · ✕ 오답 · − 미응답 · ? 판정 불가</strong> 기호를 씁니다.'
    });

    if (!state.rows.length) {
      panel.body.appendChild(
        el('p', { 'class': 't-empty', text: '결과를 불러오거나 학생 명단을 올리면 전체 명단이 표시돼요.' })
      );
      box.appendChild(panel.root);
      return;
    }

    var table = el('table', { 'class': 'data-table t-list-table' });
    var headRow = el('tr', {}, [
      el('th', { scope: 'col', text: '학번' }),
      el('th', { scope: 'col', text: '이름' })
    ]);
    QUIZ.QUESTIONS.forEach(function (q) {
      headRow.appendChild(el('th', { scope: 'col', text: q.id + '번' }));
    });
    ['총점', '종합 이수', '프로젝트', '프로젝트 이수', '제출 시각'].forEach(function (text) {
      headRow.appendChild(el('th', { scope: 'col', text: text }));
    });
    table.appendChild(el('thead', {}, [headRow]));

    var tbody = el('tbody');
    state.rows
      .slice()
      .sort(function (a, b) {
        return String(a.studentId).localeCompare(String(b.studentId), 'ko');
      })
      .forEach(function (row) {
        var tr = el('tr', { 'class': row.submitted ? '' : 'is-missing' }, [
          el('th', { scope: 'row', text: row.studentId || '-' }),
          el('td', { text: row.name || '(이름 없음)' })
        ]);
        QUIZ.QUESTIONS.forEach(function (q) {
          if (!row.submitted) {
            tr.appendChild(el('td', { 'class': 't-mark is-none', text: '−' }));
            return;
          }
          var mark = row.marks[q.id];
          var cls =
            mark === 'O' ? 'is-o' : mark === 'X' ? 'is-x' : mark === '?' ? 'is-partial' : 'is-none';
          tr.appendChild(el('td', { 'class': 't-mark ' + cls, text: A.markSymbol(mark) }));
        });
        tr.appendChild(el('td', { 'class': 't-score', text: row.submitted ? String(row.score) : '' }));
        tr.appendChild(
          el('td', {
            'class': row.submitted ? '' : 't-missing',
            text: row.submitted ? QUIZ.passLabel(row.score) : '미제출'
          })
        );
        var p = row.project || { has: false };
        tr.appendChild(
          el('td', { 'class': 't-score', text: row.submitted && p.has ? String(p.score) : '' })
        );
        tr.appendChild(
          el('td', {
            text: !row.submitted ? '미제출' : p.has ? (p.passed ? '이수' : '보충 필요') : '기록 없음'
          })
        );
        tr.appendChild(el('td', { text: row.receivedAt || '' }));
        tbody.appendChild(tr);
      });
    table.appendChild(tbody);

    panel.body.appendChild(el('div', { 'class': 't-table-wrap' }, [table]));
    panel.body.appendChild(
      el('div', { 'class': 'btn-row no-print' }, [
        ui.button({ label: '⬇ CSV로 내려받기', variant: 'secondary', onClick: downloadCSV }),
        ui.button({
          label: '🖨 이 표 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
    box.appendChild(panel.root);
  }

  function downloadCSV() {
    if (!state.rows.length) {
      ui.toast('먼저 결과를 불러와 주세요.');
      return;
    }
    var csv = A.toCSV(state.rows);
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: '반복속의반복_종합형성평가_결과.csv' });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /* ------------------------------------------------------------------ */
  function renderAll() {
    renderSummary();
    renderProject();
    renderPodium();
    renderWrong();
    renderCategories();
    renderList();
  }

  function boot() {
    var main = document.getElementById('teacher-main');
    if (!main) return;
    ui.clear(main);

    buildHeader(main);
    main.appendChild(
      ui.callout(
        '🔒 불러온 자료는 <strong>이 브라우저 안에서만</strong> 처리되며 어디로도 전송되지 않습니다. ' +
          '창을 닫으면 사라지므로, 남겨야 할 자료는 CSV 로 내려받거나 인쇄해 주세요.',
        { muted: true }
      )
    );
    buildStepper(main);

    /* ── 1장 ── */
    refs.page1 = el('section', {
      'class': 't-page',
      dataset: { page: '1' },
      attrs: { 'aria-label': '1장 결과 불러오기', tabindex: '-1' }
    });
    buildSource(refs.page1);

    /* ── 2장 ── */
    refs.page2 = el('section', {
      'class': 't-page',
      dataset: { page: '2' },
      attrs: { 'aria-label': '2장 전체 요약과 상위 3명', tabindex: '-1' }
    });
    refs.summaryBox = el('div', { 'class': 'stack' });
    refs.projectBox = el('div', { 'class': 'stack' });
    refs.podiumBox = el('div', { 'class': 'stack' });
    refs.page2.appendChild(refs.summaryBox);
    refs.page2.appendChild(refs.projectBox);
    refs.page2.appendChild(refs.podiumBox);

    /* ── 3장 ── */
    refs.page3 = el('section', {
      'class': 't-page',
      dataset: { page: '3' },
      attrs: { 'aria-label': '3장 가장 많이 틀린 문제와 영역별 분석', tabindex: '-1' }
    });
    refs.wrongBox = el('div', { 'class': 'stack' });
    refs.categoryBox = el('div', { 'class': 'stack' });
    refs.page3.appendChild(refs.wrongBox);
    refs.page3.appendChild(refs.categoryBox);

    /* ── 4장 : 명단 · 정답표 · 지도 자료 ── */
    refs.page4 = el('section', {
      'class': 't-page',
      dataset: { page: '4' },
      attrs: { 'aria-label': '4장 전체 명단과 정답표, 수업 지도 자료', tabindex: '-1' }
    });
    buildRosterUpload(refs.page4);
    refs.listBox = el('div', { 'class': 'stack' });
    refs.page4.appendChild(refs.listBox);

    // 정답표와 수업 지도 자료는 «제출물이 없어도» 항상 보인다(명세 31장).
    var keyBox = el('div', { 'class': 'stack' });
    var teachBox = el('div', { 'class': 'stack' });
    refs.page4.appendChild(
      ui.activityHeader({
        tag: '📄 정답표',
        title: '종합 형성평가 정답과 해설',
        sub: '학생용 형성평가와 같은 문항 은행을 읽습니다. 제출물이 없어도 언제든 볼 수 있어요.',
        divided: true
      })
    );
    refs.page4.appendChild(keyBox);
    refs.page4.appendChild(
      ui.activityHeader({
        tag: '🧭 수업 지도 자료',
        title: '화면별 초점 · 발문 · 오개념 · 바로잡기',
        sub: '프로젝트 루브릭과 수업 운영 자료를 함께 담았습니다.',
        divided: true
      })
    );
    refs.page4.appendChild(teachBox);

    main.appendChild(refs.page1);
    main.appendChild(refs.page2);
    main.appendChild(refs.page3);
    main.appendChild(refs.page4);

    buildPager(main);

    L.teacherKey.renderAnswerKey(keyBox);
    L.teacherKey.renderTeaching(teachBox);

    renderAll();
    showPage(1);
  }

  // render 를 함께 내보내면, 자료를 코드로 넣어 화면을 확인해 볼 수 있다(점검용).
  L.teacherApp = { boot: boot, state: state, render: renderAll, goToPage: goToPage };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
