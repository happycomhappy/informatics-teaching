    <title>종합 형성평가 결과 분석 | 반복 속의 반복, 패턴을 코드로 (교사용)</title>

    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 15px;
  cursor: pointer;
}

.select:hover {

  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.choice:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.choice input {

.choice__body {

}

.choice__label {

}

.choice__sub {

}

.choice.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.choice--true.is-selected {

  background: var(--color-true-soft);
}

.choice--false.is-selected {

}

/* 탭 */
.tabs {

}

/* 11.5 : 터치 대상 최소 44 × 44 px */

/* ------------------------- 출력 창 (콘솔) ------------------------- */
.console {

}

.console__head {
  display: flex;

  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);

}

}

}

}

.feedback--error {

  color: var(--color-primary-dark);
  background: var(--color-primary-soft);

}

}

@keyframes toast-in {

  }

/* ---------------------------- 모달 ---------------------------- */
.modal {

.modal::backdrop {

}

.modal__body {

}

.modal__title {

  font-weight: 800;

}

.modal__text {

}

.modal__actions {

}

.has-tip {

.has-tip::after {

  z-index: 20;
}

.has-tip:hover::after,
.has-tip:focus-visible::after,

/* ===================== 화면 1 : 시작 및 선수 학습 확인 =====================
   1·2차시 시작 화면과 같은 형식을 쓴다. 뼈대(.hero / .goal-card / .agenda)는
   steps.css 에 있고, 여기서는 그 위에 얹는 보정만 한다. */

/* 단계 표기(1단계 · 시작 및 선수 학습 확인) */
.hero__eyebrow {
  margin-bottom: var(--space-3);
}

.hero__note strong {
  color: var(--color-primary-dark);
  font-weight: 800;
}

/* 가운데 정렬된 hero 안에서도 문장·문항은 왼쪽 정렬로 읽는다 */
.hero__feedback {
  margin-top: var(--space-5);
  text-align: left;
}

.hero__quiz {
  margin-top: var(--space-6);
  text-align: left;
}

/* 학습 시작 버튼 아래 안내(남은 활동 / 준비 완료) */
.hero__hint {
  margin-top: var(--space-2);
  text-align: center;
}

/* 지난 시간 핵심 내용 — 학습 순서 칩과 같은 모양이되,
   앞쪽 낱말이 열쇠말임이 드러나도록 색과 굵기만 달리한다. */
.recall__key {
  flex: 0 0 auto;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.recall__key::after {
  content: '·';
  margin-left: var(--space-2);
  color: var(--color-border-strong);
  font-weight: 700;
}

.recall__text {
  color: var(--color-text-sub);
  font-weight: 600;
}

/* 선수 학습 미니 문항 · 생각 열기 카드 */
.mini-quiz {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.mini-quiz__q {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
}

/* 미니 문항 안의 소제목(Q1 · Q2)은 위쪽 여백을 줄인다 */
.mini-quiz .section-title {
  margin: var(--space-2) 0 0;
  font-size: 17px;
}

/* ===================== 화면 1 : 생각 열기 ===================== */
.bigq {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.6;
}

.options--row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (max-width: 767px) {
  .options--row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.option--big {
  align-items: center;
  min-height: 72px;
}

.option--big .option__text {
  display: flex;
  flex-direction: column;
}

.compare-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
}

.compare-card.is-picked {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.compare-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.compare-card__title {
  font-weight: 800;
}

/* 100줄이 쌓이는 모습 : 높이를 고정하고 안에서만 스크롤한다 */
.longcode {
  max-height: 220px;
  overflow: auto;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
}

.longcode__lines {
  display: flex;
  flex-direction: column;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: #334155;
}

.longcode__line {
  white-space: pre;
  animation: screen-fade 120ms ease;
}

.longcode__dots {
  color: var(--color-text-sub);
  font-size: 18px;
  letter-spacing: 0.3em;
}

.longcode__count {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

/* ===================== 변수 상태 상자 (11.4) ===================== */
.varbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.varbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 96px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.varbox__label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.varbox__value {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--color-primary-dark);
}

.varbox.is-changed {
  animation: varbox-pop 420ms ease;
}

@keyframes varbox-pop {
  0% {
    transform: scale(1);
    border-color: var(--color-border-strong);
    background: var(--color-surface);
  }
  40% {
    transform: scale(1.08);
    border-color: var(--color-primary);
    background: var(--color-primary-soft);
  }
  100% {
    transform: scale(1);
    border-color: var(--color-primary);
    background: var(--color-surface);
  }
}

/* ===================== 반복 회차 표시 (11.3) ===================== */
.round-meter {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.round-meter__text {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.round-meter__bar {
  flex: 1 1 auto;
  height: 8px;
  min-width: 60px;
  border-radius: 99px;
  background: rgba(37, 99, 235, 0.18);
  overflow: hidden;
}

.round-meter__fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: var(--color-primary);
  transition: width var(--dur-progress) ease;
}

/* ===================== 값 카드 (7.1 · 7.3) ===================== */
.valuecards-wrap {
  position: relative;
  overflow-x: auto;
  padding-bottom: var(--space-5);
}

.valuecards {
  display: flex;
  gap: var(--space-2);
  min-width: max-content;
}

.valuecard {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-2);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  transition: all var(--dur-highlight) ease;
}

.valuecard.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: translateY(-3px) scale(1.06);
  box-shadow: var(--shadow);
}

.valuecard.is-used {
  opacity: 0.5;
  border-style: solid;
  background: var(--color-muted-bg);
}

/* 끝값은 점선 카드로 따로 표시한다(명세 7.3) */
.valuecard--excluded {
  position: relative;
  flex-direction: column;
  margin-left: var(--space-5);
  border-style: dashed;
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.valuecard__note {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.valuecards__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.valuecards__pointer {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 44px;
  transition: transform var(--dur-highlight) ease;
  pointer-events: none;
}

.valuecards__pointer.is-hidden {
  visibility: hidden;
}

.valuecards__arrow {
  color: var(--color-primary);
  font-weight: 900;
  line-height: 1;
}

.valuecards__pointer-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);

 *

      if (key in node) node[key] = value;

  /** 라디오 카드 그룹 (True/False 선택 등) */
  function radioGroup(opts) {
    var o = opts || {};
    var options = o.options || [];
    var items = options.map(function (opt) {
      var input = el('input', {
        type: 'radio',
        name: o.name,
        value: String(opt.value),
        checked: String(opt.value) === String(o.value),
        attrs: { 'aria-label': opt.ariaLabel || opt.label }
      });
      var wrap = el('label', { 'class': ('choice ' + (opt.className || '')).trim() }, [
        input,
        el('span', { 'class': 'choice__body' }, [
          el('span', { 'class': 'choice__label', html: opt.label }),
          opt.sub ? el('span', { 'class': 'choice__sub', html: opt.sub }) : null
        ])
      ]);
      input.addEventListener('change', function () {
        if (!input.checked) return;
        update(opt.value);
        if (o.onChange) o.onChange(opt.value);
      });
      return { opt: opt, input: input, wrap: wrap };
    });

    function update(next) {
      items.forEach(function (item) {
        var on = String(item.opt.value) === String(next);
        item.input.checked = on;
        item.wrap.classList.toggle('is-selected', on);
      });
    }

    var root = el(
      'div',
      { 'class': 'choice-group', attrs: { role: 'radiogroup', 'aria-label': o.legend } },
      items.map(function (i) {
        return i.wrap;
      })
    );
    update(o.value === undefined ? null : o.value);

    return {
      root: root,
      setValue: update,
      getValue: function () {
        for (var i = 0; i < items.length; i += 1) {
          if (items[i].input.checked) return items[i].opt.value;
        }
        return null;
      },
      /** 정답/오답 표시를 지운다(다시 풀기). */
      clearMarks: function () {
        items.forEach(function (item) {
          item.wrap.classList.remove('is-correct', 'is-wrong');
        });
      },
      /** 특정 선택지에 정답/오답 표시를 붙인다. */
      mark: function (value, kind) {
        items.forEach(function (item) {
          if (String(item.opt.value) !== String(value)) return;
          item.wrap.classList.toggle('is-correct', kind === 'correct');
          item.wrap.classList.toggle('is-wrong', kind === 'wrong');
        });
      },
      setDisabled: function (flag) {
        items.forEach(function (item) {
          item.input.disabled = Boolean(flag);
        });
      }
    };

  function tabs(opts) {

    var buttons = items.map(function (item) {

      'div',

  /**
   * 좁은 화면(768px 미만)에서만 켜지는 구역 탭 (명세 51장)
   *   768px 이상에서는 탭 줄을 숨기고 모든 구역을 한 화면에 나란히 보여 준다.
   *   768px 미만에서는 [코드] [규칙] [출력] 처럼 한 구역씩만 보여 준다.
   *
   * items: Array<{ id, label, node }>
   */
  function mobileTabs(opts) {
    var o = opts || {};
    var items = (o.items || []).filter(function (item) {
      return item && item.node;
    });
    var current = items.length ? items[0].id : null;

    var query =
      typeof window.matchMedia === 'function' ? window.matchMedia('(max-width: 767px)') : null;

    var buttons = items.map(function (item) {
      return el('button', {
        type: 'button',
        'class': 'tab',
        text: item.label,
        dataset: { id: item.id },
        attrs: { role: 'tab', 'aria-selected': String(item.id === current) },
        on: {
          click: function () {
            setActive(item.id);
          }
        }
      });
    });

    var bar = el(
      'div',
      {
        'class': 'tabs mtabs__bar',
        attrs: { role: 'tablist', 'aria-label': o.ariaLabel || '구역 전환' }
      },
      buttons
    );

    var root = el('div', { 'class': 'mtabs' }, [bar].concat(
      items.map(function (item) {
        item.node.classList.add('mtabs__panel');
        item.node.dataset.mtab = item.id;
        return item.node;
      })
    ));

    function isMobile() {
      return query ? query.matches : window.innerWidth < 768;
    }

    function paint() {
      var mobile = isMobile();
      bar.style.display = mobile ? '' : 'none';
      items.forEach(function (item) {
        var on = !mobile || item.id === current;
        item.node.classList.toggle('is-mtab-hidden', !on);
      });
      buttons.forEach(function (btn) {
        var on = btn.dataset.id === current;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', String(on));
      });
    }

    function setActive(id) {
      current = id;
      paint();
    }

    // 좌우 화살표로도 이동할 수 있게 한다(명세 52장).
    bar.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var index = items.findIndex(function (item) {
        return item.id === current;
      });
      var next = (index + (e.key === 'ArrowRight' ? 1 : items.length - 1)) % items.length;
      setActive(items[next].id);
      buttons[next].focus();
      e.preventDefault();
    });

    if (query) {
      if (typeof query.addEventListener === 'function') query.addEventListener('change', paint);
      else if (typeof query.addListener === 'function') query.addListener(paint);
    }
    // 창 크기 변경(화면 회전 · 창 조절)에도 반드시 다시 그린다.
    window.addEventListener('resize', debounce(paint, 150));
    paint();

    return { root: root, setActive: setActive, isMobile: isMobile };
  }

  /** 숫자 입력 + 슬라이더 */
  function numberField(opts) {
    var o = opts || {};
    var min = o.min === undefined ? 0 : o.min;
    var max = o.max === undefined ? 100 : o.max;
    var step = o.step === undefined ? 1 : o.step;
    var value = o.value === undefined ? 0 : o.value;
    var withSlider = o.withSlider !== false;

    var input = el('input', {
      type: 'number',
      'class': 'num-input',
      min: min,
      max: max,
      step: step,
      value: String(value),
      id: o.id,
      attrs: { 'aria-label': o.label, inputmode: 'numeric' }
    });
    var slider = withSlider
      ? el('input', {
          type: 'range',
          'class': 'slider',
          min: min,
          max: max,
          step: step,
          value: String(value),
          attrs: { 'aria-label': (o.label || '값') + ' 슬라이더' }
        })
      : null;

    var current = value;

    function apply(next, from) {
      var n = Number(next);
      if (isNaN(n)) return;
      n = Math.min(max, Math.max(min, n));
      current = n;
      if (from !== 'input') input.value = String(n);
      if (slider && from !== 'slider') slider.value = String(n);
      if (o.onChange) o.onChange(n);
    }

    input.addEventListener('input', function () {
      var raw = input.value;
      if (raw === '' || raw === '-') return;
      apply(raw, 'input');
    });
    input.addEventListener('blur', function () {
      apply(input.value === '' ? current : input.value);
    });
    if (slider) {
      slider.addEventListener('input', function () {
        apply(slider.value, 'slider');
      });
    }

    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [
        input,
        o.suffix ? el('span', { text: o.suffix }) : null,
        slider
      ])
    ]);

    return {
      root: root,
      input: input,
      slider: slider,
      getValue: function () {
        return current;
      },
      setValue: function (v) {
        apply(v);
      }
    };
  }

  /** 한 줄 텍스트 입력 (이번 차시 추가 헬퍼) */
  function textField(opts) {

  /* ------------------------ 실행 결과 출력 창 ------------------------ */
  function createConsole(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '실행 버튼을 누르면 결과가 여기에 표시돼요.';
    var body = el('div', {
      'class': 'console__body',
      attrs: {
        role: 'log',
        'aria-live': 'polite',
        'aria-label': o.ariaLabel || '프로그램 실행 결과',
        tabindex: '0'
      }
    });
    var root = el('div', { 'class': 'console' }, [
      el('div', { 'class': 'console__head' }, [
        el('span', { 'class': 'console__dot' }),
        el('span', { text: o.title || '실행 결과' })
      ]),
      body
    ]);

    function showEmpty() {
      clear(body);
      body.appendChild(el('p', { 'class': 'console__empty', text: emptyText }));
    }

    function line(text, modifier) {
      if (body.querySelector('.console__empty')) clear(body);
      var node = el('div', { 'class': ('console__line ' + (modifier || '')).trim() }, [

      ]);
      body.appendChild(node);
      body.scrollTop = body.scrollHeight;
      return node;
    }

    showEmpty();

    return {
      root: root,
      body: body,
      write: function (text) {
        return line(text);
      },
      writeMuted: function (text) {
        return line(text, 'console__line--muted');
      },
      writeError: function (text) {
        return line(text, 'console__line--error');
      },
      writeHint: function (text) {
        return line(text, 'console__line--hint');

      clear: showEmpty,
      isEmpty: function () {

      }

/**
 * 파이썬 코드 표시 컴포넌트 (명세 11.2 코드 표시 / 11.3 조건 실행 상태)

(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  // 3차시는 반복문이 주제이므로 for · while · break · continue · import 를 키워드로 추가한다.
  var KEYWORDS = /^(if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {

      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);

    return out;
  }

  /**
   * 파이썬 한 줄(들여쓰기 제외)을 하이라이팅한 HTML 문자열로 바꾼다.
   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.

        out += highlightSegment(buffer);
        buffer = '';

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {
        flush();
        out += span('tok-comment', src.slice(i));

      i += 1;

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */

        '"' +

      first = false;

   * 코드 뷰를 만든다.
   *
   * lines: Array<{

   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')

  function createCodeView(opts) {

    var showLineNumbers = o.showLineNumbers !== false;

      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {

          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }

        if (showLineNumbers) {

        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.

        if (line.indentNote) {

        }

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  L.codeview = {
    createCodeView: createCodeView,
    highlightPython: highlightPython
  };
})();

   */
  var ORDERS = [
    [1, 2, 3, 4], // 기본
    [3, 1, 4, 2], // 재도전 1
    [4, 3, 2, 1] // 재도전 2
  ];

  /** attempt(0부터) 에 맞는 제시 순서를 돌려준다. 3벌을 순환한다. */
  function orderFor(attempt) {
    var n = Number(attempt) || 0;
    var i = ((n % ORDERS.length) + ORDERS.length) % ORDERS.length;
    return ORDERS[i].slice();

  function byId(id) {
    for (var i = 0; i < QUESTIONS.length; i += 1) {
      if (QUESTIONS[i].id === Number(id)) return QUESTIONS[i];
    }
    return null;

  /* ------------------------------------------------------------------ */
  /* 유형별 응답 처리                                                      */
  /* ------------------------------------------------------------------ */

  /** 응답이 있는가(미응답과 구분) */
  function isAnswered(q, answer) {
    if (answer === null || answer === undefined) return false;
    if (q.type === 'choice') return answer !== '' && !isNaN(Number(answer));
    if (q.type === 'text') return outputLines(answer).length > 0;
    if (q.type === 'blanks') {
      return q.blanks.some(function (b) {
        return String((answer || {})[b.key] || '').trim().length > 0;

    }
    return false;
  }

  /** 빈칸 하나가 정답인가 */

    if (!got) return false;
    return blank.accepted.some(function (ok) {

  }

  /** 문항 하나를 채점한다. 부분 점수는 주지 않는다(명세 15.1). */
  function gradeAnswer(q, answer) {
    if (!isAnswered(q, answer)) return false;
    if (q.type === 'choice') return Number(answer) === q.answer;
    if (q.type === 'text') {
      var got = outputLines(answer);
      if (got.length !== q.expected.length) return false;
      return got.every(function (line, i) {
        return line === q.expected[i];

    if (q.type === 'blanks') {

  function answerToText(q, answer) {

  /**
   * answerToText() 로 저장된 문자열을 응답 값으로 되돌린다.
   * 교사용이 제출 JSON 만으로 다시 채점할 때 쓴다(명세 34장).

  function answerFromText(q, text) {
    var s = String(text === undefined || text === null ? '' : text).trim();

    }
    return null;
  }

  /**
   * 채점 (명세 15.1)
   * @param {object} answers  { 문항id : 응답 }  미응답은 null / undefined
   * @returns {{score, maxScore, passed, correctCount, details:Array}}
   *   details[i] = { id, answer, state:'correct'|'wrong'|'none', points, category }
   */
  function grade(answers) {
    var a = answers || {};
    var details = QUESTIONS.map(function (q) {
      var picked = a[q.id];
      var answered = isAnswered(q, picked);
      var state = !answered ? 'none' : gradeAnswer(q, picked) ? 'correct' : 'wrong';
      return {
        id: q.id,
        answer: answered ? picked : null,
        // 예전 형식과의 호환 : 선택형은 picked 번호를 그대로 둔다
        picked: q.type === 'choice' && answered ? Number(picked) : null,
        state: state,
        points: state === 'correct' ? q.points : 0,
        category: q.category
      };
    });
    var score = details.reduce(function (sum, d) {
      return sum + d.points;
    }, 0);
    return {
      score: score,
      maxScore: MAX_SCORE,
      passed: score >= PASS_SCORE,
      correctCount: details.filter(function (d) {
        return d.state === 'correct';
      }).length,
      details: details

  }

  /** 이수 여부를 글자로. 색에 기대지 않도록 항상 이 문자열을 함께 쓴다(명세 50.4). */
  function passLabel(score) {
    return Number(score) >= PASS_SCORE ? '이수' : '보충 학습 대상';
  }

  /** 영역(오답 유형)별 문항 묶음 — 교사용 38장 영역 분석에 쓴다. */
  function byCategory() {
    return CATEGORIES.map(function (name) {
      return {
        category: name,
        questions: QUESTIONS.filter(function (q) {
          return q.category === name;
        })
      };
    });
  }

  return {
    POINT: POINT,
    MAX_SCORE: MAX_SCORE,
    PASS_SCORE: PASS_SCORE,
    CATEGORIES: CATEGORIES,
    QUESTIONS: QUESTIONS,
    ORDERS: ORDERS,
    orderFor: orderFor,
    byId: byId,
    // 유형별 응답 처리
    isAnswered: isAnswered,
    gradeAnswer: gradeAnswer,
    blankMarks: blankMarks,
    answerToText: answerToText,
    correctToText: correctToText,
    answerFromText: answerFromText,
    outputLines: outputLines,
    squeeze: squeeze,
    // 채점
    grade: grade,
    passLabel: passLabel,
    byCategory: byCategory
  };
});

      }
      if (a === e) {
        marks.push('ok');
        sameRows += 1;
        continue;
      }
      marks.push('diff');
      var ae = leadingSpaces(a);
      var ee = leadingSpaces(e);
      if (ae !== ee) {
        spaceOk = false;
        messages.push(
          k + 1 + '번째 줄의 `@` 앞 공백은 ' + ee + '칸이어야 하는데 현재 ' + ae + '칸입니다.'
        );
      } else if (a.replace(/ /g, '').length !== e.replace(/ /g, '').length) {
        messages.push(
          k + 1 + '번째 줄의 `@` 개수가 ' + e.replace(/ /g, '').length + '개여야 하는데 현재 ' +
            a.replace(/ /g, '').length + '개입니다.'
        );
      } else {
        messages.push(k + 1 + '번째 줄이 달라요. 기대 `' + spaceView(e) + '` · 현재 `' + spaceView(a) + '`');
      }
      if (a.indexOf(' ') !== -1 || e.indexOf(' ') !== -1) {
        if (a !== e) spaceOk = spaceOk && ae === ee;
      }
    }

    var lineCountOk = actual.length === expected.length;
    if (!lineCountOk) {
      messages.unshift(
        '줄 수가 달라요. ' + expected.length + '줄이어야 하는데 현재 ' + actual.length + '줄입니다.'
      );
    }
    return {
      same: lineCountOk && sameRows === total,
      lineCountOk: lineCountOk,
      sameRows: sameRows,
      total: total,
      spaceOk: spaceOk,
      messages: messages,
      marks: marks

  }

  /* ================================================================== */
  /* 6. 프로젝트 루브릭 채점 (명세 12장)                                   */
  /* ================================================================== */

  /** 명세 12장 : 100점 만점 배점표 */
  var RUBRIC = [
    { key: 'syntaxIndent', label: '문법과 들여쓰기', max: 30 },
    { key: 'condition', label: '행을 구분하는 조건식', max: 30 },
    { key: 'output', label: '출력 모양과 공백', max: 30 },
    { key: 'predictionRule', label: '실행 전 예측 · 규칙 설명', max: 10 }
  ];

  /**
   * 학생 답이 기대한 «행 분류»를 만들어 내는지 본다(명세 62.6 : 일반화된 조건식).
   * 조건식이 눈앞의 한 행만 맞히는 것이 아니라, 같은 규칙의 행들을 함께 묶는지 확인한다.
   */
  function branchMatch(rows, expectedBranch, branchIndex) {
    if (!rows || !rows.length) return false;
    for (var k = 0; k < rows.length; k += 1) {
      var want = expectedBranch[k];
      var got = rows[k].branch;
      // branchIndex 번째 분기가 «맡아야 하는 행»과 «실제로 맡은 행»이 정확히 같아야 한다.
      if ((want === branchIndex) !== (got === branchIndex)) return false;
    }
    return true;

  /**
   * 프로젝트 자동 채점 (명세 12.2 세부 채점 예).
   *
   * @param {object} input
   *   taskId       'base' | 'A' | 'B' | 'C'
   *   spec         { range, branches:[{cond,out}], elseOut }
   *   predicted    실행 전 예측을 제출했는가(boolean)
   *   ruleText     행별 규칙 한 문장 설명(string)
   * @returns {{
   *   score:number, maxScore:number, passed:boolean,
   *   rubric:object, detail:Array, run:object, compare:object, messages:Array<string>
   * }}
   */
  function scoreProject(input) {
    var o = input || {};
    var t = task(o.taskId) || TASKS.base;
    var spec = o.spec || {};
    var messages = [];

    var rubric = { syntaxIndent: 0, condition: 0, output: 0, predictionRule: 0 };
    var detail = [];

    /* --- 문법과 들여쓰기 30점 : 반복 구조 10 · 분기 구조 10 · print 위치 10 --- */
    var range = parseRange(spec.range);
    if (range.ok && range.values.length === t.lines.length) {
      rubric.syntaxIndent += 10;
      detail.push({ label: '반복 구조(range) 정상', point: 10, max: 10 });
    } else {
      detail.push({
        label: '반복 구조(range) 정상',
        point: 0,
        max: 10,
        note: range.ok
          ? 'range 가 만드는 행 수가 ' + range.values.length + '개예요. ' + t.lines.length + '개가 필요해요.'
          : range.message
      });
      messages.push(
        range.ok
          ? '반복 범위를 확인해 주세요. 행이 ' + t.lines.length + '개 필요합니다.'
          : range.message
      );
    }

    var branches = (spec.branches || []).filter(function (b) {
      return b && String(b.cond || '').trim();
    });
    var needBranches = t.useElif ? 2 : 1;
    var hasElse = String(spec.elseOut || '').trim().length > 0;
    if (branches.length >= needBranches && hasElse) {
      rubric.syntaxIndent += 10;
      detail.push({ label: 'if / ' + (t.useElif ? 'elif / ' : '') + 'else 구조 정상', point: 10, max: 10 });
    } else {
      detail.push({
        label: 'if / ' + (t.useElif ? 'elif / ' : '') + 'else 구조 정상',
        point: 0,
        max: 10,
        note: '조건식과 else 출력식을 모두 채워야 해요.'
      });
    }

    var allOutputsFilled = branches.every(function (b) {
      return String(b.out || '').trim().length > 0;
    }) && hasElse;
    if (allOutputsFilled) {
      rubric.syntaxIndent += 10;
      detail.push({ label: 'print 위치와 출력식 정상', point: 10, max: 10 });
    } else {
      detail.push({
        label: 'print 위치와 출력식 정상',
        point: 0,
        max: 10,
        note: '각 분기의 print(...) 안에 출력식을 넣어야 해요.'
      });
    }

    /* --- 실행 --- */
    var run = runProgram(spec);
    if (!run.ok) messages.push(run.error);

    /* --- 조건식 30점 : 첫 분기 15 · 두 번째 분기/else 15 --- */
    if (run.ok) {
      var first = branchMatch(run.rows, t.rowBranch, 0);
      if (first) {
        rubric.condition += 15;
        detail.push({ label: '첫 번째 분기가 맡을 행을 정확히 구분', point: 15, max: 15 });
      } else {
        detail.push({
          label: '첫 번째 분기가 맡을 행을 정확히 구분',
          point: 0,
          max: 15,
          note: '첫 조건식이 골라야 하는 행과 실제로 고른 행이 달라요.'
        });
      }
      var secondIndex = t.useElif ? 1 : null;
      var secondOk = t.useElif
        ? branchMatch(run.rows, t.rowBranch, 1) && branchMatch(run.rows, t.rowBranch, 2)
        : branchMatch(run.rows, t.rowBranch, 1);
      if (secondOk) {
        rubric.condition += 15;
        detail.push({
          label: t.useElif ? '두 번째 분기와 else 가 정확' : 'else 가 맡을 행이 정확',
          point: 15,
          max: 15
        });
      } else {
        detail.push({
          label: t.useElif ? '두 번째 분기와 else 가 정확' : 'else 가 맡을 행이 정확',
          point: 0,
          max: 15,
          note: '나머지 행을 어느 분기가 맡는지 다시 확인해 주세요.'
        });
      }
      if (secondIndex === null && !secondOk) {
        messages.push('나머지 행(else)이 맡아야 하는 모양을 확인해 주세요.');
      }
    } else {
      detail.push({ label: '조건식', point: 0, max: 30, note: run.error });
    }

    /* --- 출력 30점 : 행 수 5 · 각 행 문자열 15 · 공백 위치 5 · 줄 바꿈 5 --- */
    var cmp = compareOutput(run.ok ? run.lines : [], t.lines);
    if (cmp.lineCountOk) {
      rubric.output += 5;
      detail.push({ label: '행 수 정확 (' + t.lines.length + '줄)', point: 5, max: 5 });
    } else {
      detail.push({ label: '행 수 정확 (' + t.lines.length + '줄)', point: 0, max: 5 });
    }
    var rowPoint = cmp.total ? Math.round((cmp.sameRows / cmp.total) * 15) : 0;
    rubric.output += rowPoint;
    detail.push({
      label: '각 행 문자열 정확 (' + cmp.sameRows + ' / ' + cmp.total + '줄)',
      point: rowPoint,
      max: 15
    });
    if (cmp.spaceOk) {
      rubric.output += 5;
      detail.push({ label: '공백 위치 정확', point: 5, max: 5 });
    } else {
      detail.push({ label: '공백 위치 정확', point: 0, max: 5, note: '공백도 출력 결과의 일부예요.' });
    }
    var newlineOk =
      cmp.lineCountOk &&
      (run.lines || []).every(function (line) {
        return String(line).indexOf('\n') === -1;
      });
    if (newlineOk) {
      rubric.output += 5;
      detail.push({ label: '줄 바꿈 정확', point: 5, max: 5 });
    } else {
      detail.push({ label: '줄 바꿈 정확', point: 0, max: 5 });
    }

    /* --- 예측 · 설명 10점 : 예측 제출 4 · 규칙 설명 6 --- */
    if (o.predicted) {
      rubric.predictionRule += 4;
      detail.push({ label: '실행 전 예측 제출', point: 4, max: 4 });
    } else {
      detail.push({ label: '실행 전 예측 제출', point: 0, max: 4, note: '실행 전 예측을 한 번 제출해 주세요.' });
    }
    var ruleText = String(o.ruleText || '').trim();
    if (ruleText.length >= 5) {
      rubric.predictionRule += 6;
      detail.push({ label: '행별 규칙 한 문장 설명', point: 6, max: 6 });
    } else {
      detail.push({
        label: '행별 규칙 한 문장 설명',
        point: 0,
        max: 6,
        note: '어떤 행들을 같은 규칙으로 묶었는지 한 문장으로 적어 주세요(5자 이상).'
      });
    }

    var score =
      rubric.syntaxIndent + rubric.condition + rubric.output + rubric.predictionRule;

    return {
      score: score,
      maxScore: 100,
      passed: score >= 60,
      rubric: rubric,
      detail: detail,
      run: run,
      compare: cmp,
      messages: messages.concat(cmp.messages)
    };
  }

  /** 명세 12.1 : 프로젝트 이수 여부를 글자로 */
  function projectLabel(score) {
    return Number(score) >= 60 ? '프로젝트 이수' : '프로젝트 보충 필요';
  }

  /** 명세 11.5 : 실패 횟수에 따른 단계형 힌트. 완성 코드 전체는 절대 자동 공개하지 않는다. */
  function hintFor(taskId, failCount) {
    var t = task(taskId) || TASKS.base;
    var n = Math.max(0, Number(failCount) || 0);
    if (n <= 0) return null;
    var index = Math.min(n, t.hints.length) - 1;
    return { level: index + 1, text: t.hints[index] };
  }

  /** 명세 11.5 : 학생이 [완성 코드 보기]를 명시적으로 눌렀을 때만 쓰는 학습용 정답 코드 */
  function answerCode(taskId) {
    var t = task(taskId) || TASKS.base;
    var lines = ['for i in ' + t.rangeAnswer[0] + ':'];
    lines.push('    if ' + t.condAnswer[0][0] + ':');
    lines.push('        print(' + t.outAnswer[0][0] + ')');
    if (t.useElif) {
      lines.push('    elif ' + t.condAnswer[1][0] + ':');
      lines.push('        print(' + t.outAnswer[1][0] + ')');
      lines.push('    else:');
      lines.push('        print(' + t.outAnswer[2][0] + ')');
    } else {
      lines.push('    else:');
      lines.push('        print(' + t.outAnswer[1][0] + ')');
    }
    return lines.join('\n');
  }

  return {
    SPACE_DOT: SPACE_DOT,
    TASKS: TASKS,
    COMPARE_TABS: COMPARE_TABS,
    task: task,
    // 공백
    spaceView: spaceView,
    viewLines: viewLines,
    describeLine: describeLine,
    // 제한 문법 파서
    tokenize: tokenize,
    evaluate: evaluate,
    evalCondition: evalCondition,
    evalOutput: evalOutput,
    parseRange: parseRange,
    // 실행 · 채점
    runProgram: runProgram,
    compareOutput: compareOutput,
    RUBRIC: RUBRIC,
    scoreProject: scoreProject,
    projectLabel: projectLabel,
    hintFor: hintFor,
    answerCode: answerCode
  };
});

/**

 * ------------------------------------------------------------------
 * .xlsx  : 브라우저 내장 기능만으로 처리한다. 외부 라이브러리를 쓰지 않는다.
 *          ZIP(중앙 디렉터리) 직접 해석 + DecompressionStream('deflate-raw') 로 압축 해제
 *          + DOMParser 로 sharedStrings.xml · sheet XML 파싱.
 * .csv / .tsv / .txt : 텍스트로 바로 읽는다(따옴표로 감싼 칸도 처리).
 *
 * 1차시 교사용(`../../lesson3_7_1/src/teacher/roster.js`)의 방식을 그대로 옮겨 왔다.
 * 4차시(`../../lesson3_7_4/src/teacher/t15-roster.js`)와 같은 파일이다.
 * 고칠 일이 생기면 세 차시를 함께 맞춘다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  /** 학번으로 볼 만한 열 이름 */
  var ID_HEADERS = ['학번', '학번호', '번호', 'id', 'studentid', 'student_id', '학생번호'];
  /** 이름으로 볼 만한 열 이름 */
  var NAME_HEADERS = ['이름', '성명', '학생이름', '학생명', 'name', 'studentname', 'student_name'];

  function norm(v) {
    return String(v === undefined || v === null ? '' : v)
      .trim()
      .replace(/\s+/g, '')
      .toLowerCase();
  }

  /* ------------------------------------------------------------------ */
  /* ZIP(xlsx) 풀기                                                       */
  /* ------------------------------------------------------------------ */

  /** 끝에서부터 EOCD 시그니처(0x06054b50)를 찾는다(뒤에 주석이 붙어 있을 수 있다). */
  function findEocd(view) {
    var max = Math.min(view.byteLength, 66000);
    for (var i = view.byteLength - 22; i >= view.byteLength - max && i >= 0; i -= 1) {
      if (view.getUint32(i, true) === 0x06054b50) return i;
    }
    return -1;
  }

  function inflateRaw(bytes) {
    if (typeof window.DecompressionStream !== 'function') {
      return Promise.reject(
        new Error('이 브라우저에서는 엑셀 파일을 직접 읽을 수 없어요. CSV UTF-8 로 저장해 올려 주세요.')
      );
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new window.DecompressionStream('deflate-raw'));
    return new Response(stream).arrayBuffer().then(function (buf) {
      return new Uint8Array(buf);
    });
  }

  /** xlsx(zip) 안에서 필요한 항목만 { 경로: 문자열 } 로 돌려준다. */
  function readZipEntries(buffer, wanted) {
    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var eocd = findEocd(view);
    if (eocd < 0) return Promise.reject(new Error('엑셀 파일 형식을 읽지 못했어요.'));

    var count = view.getUint16(eocd + 10, true);
    var offset = view.getUint32(eocd + 16, true);
    var decoder = new TextDecoder('utf-8');
    var out = {};
    var chain = Promise.resolve();

    for (var i = 0; i < count; i += 1) {
      if (view.getUint32(offset, true) !== 0x02014b50) break;
      var method = view.getUint16(offset + 10, true);
      var compressedSize = view.getUint32(offset + 20, true);
      var nameLen = view.getUint16(offset + 28, true);
      var extraLen = view.getUint16(offset + 30, true);
      var commentLen = view.getUint16(offset + 32, true);
      var localOffset = view.getUint32(offset + 42, true);
      var name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));

      if (wanted(name)) {
        // 지역 헤더에서 실제 자료가 시작하는 자리를 다시 계산한다.
        chain = chain.then(

            return function () {
              var lNameLen = view.getUint16(lo + 26, true);
              var lExtraLen = view.getUint16(lo + 28, true);
              var start = lo + 30 + lNameLen + lExtraLen;
              var raw = bytes.subarray(start, start + size);
              if (entryMethod === 0) {
                out[entryName] = decoder.decode(raw);

              }
              return inflateRaw(raw).then(function (data) {
                out[entryName] = decoder.decode(data);

  /* xlsx → 2차원 배열                                                    */
  /* ------------------------------------------------------------------ */

        var ref = c.getAttribute('r') || '';

        } else if (type === 'inlineStr') {

            .map(function (t) {
              return t.textContent;
            })

        } else {

      rows.push(cells);
    });

  }

  function readXlsx(file) {

      var warnings = [];
      var seen = {};

        var id = String(list[picked.idCol] === undefined ? '' : list[picked.idCol]).trim();

        if (

        }

        students.push({ id: id, name: studentName });
      });

      if (!students.length) {
        throw new Error('명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.');
      }

      return { students: students, warnings: warnings, columns: picked };
    });

  /** 학번 비교용 표준형 (앞의 0 과 공백·기호를 없앤다) */
  function normalizeId(value) {
    var raw = String(value === undefined || value === null ? '' : value).trim();
    var digits = raw.replace(/[^0-9]/g, '');

  /* 프로젝트 재계산 (명세 34장)                                            */

    var topChallenge = '-';
    var best = 0;
    Object.keys(challengeCount).forEach(function (name) {
      if (challengeCount[name] > best) {
        best = challengeCount[name];
        topChallenge = name + ' (' + challengeCount[name] + '명)';
      }
    });

    var passCount = withProject.filter(function (r) {
      return r.project.passed;
    }).length;
    return {
      counted: withProject.length,
      skipped: submitted.length - withProject.length,
      average: withProject.length ? Math.round((sum / withProject.length) * 10) / 10 : 0,
      max: withProject.length ? Math.max.apply(null, scores) : 0,
      min: withProject.length ? Math.min.apply(null, scores) : 0,
      passCount: passCount,
      passRate: withProject.length ? Math.round((passCount / withProject.length) * 100) : 0,
      avgAttempts: withProject.length ? Math.round((attempts / withProject.length) * 10) / 10 : 0,

  function top3(rows) {

      .filter(function (r) {
        return r.submitted;
      })
      .slice()
      .sort(function (a, b) {
