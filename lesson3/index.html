    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 15px;
  cursor: pointer;
}

.select:hover {
  border-color: var(--color-primary);
}

.select.is-correct {

      var node = el('div', { 'class': ('console__line ' + (modifier || '')).trim() }, [
        el('span', { 'class': 'console__prompt', text: '>' }),
        el('span', { 'class': 'console__text', text: text })
      ]);
      body.appendChild(node);
      body.scrollTop = body.scrollHeight;
      return node;
    }

    showEmpty();

    return {
      root: root,
      body: body,
      write: function (text) {
        return line(text);
      },
      writeMuted: function (text) {
        return line(text, 'console__line--muted');
      },
      writeError: function (text) {
        return line(text, 'console__line--error');
      },
      writeHint: function (text) {
        return line(text, 'console__line--hint');
      },
      clear: showEmpty,
      isEmpty: function () {
        return Boolean(body.querySelector('.console__empty'));
      }
    };
  }

  /* ------------------------ 피드백 영역 ------------------------ */
  var FEEDBACK_ICON = { success: '✅', info: '💡', warning: '⚠️', error: '❌' };

  function createFeedback(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '조작하면 이곳에 안내가 표시돼요.';
    var icon = el('span', { 'class': 'feedback__icon', text: '💬' });
    var textNode = el('div', { 'class': 'feedback__text', text: emptyText });
    var root = el('div', {
      'class': 'feedback is-empty',
      attrs: { 'aria-live': 'assertive', role: 'status' }
    });
    root.appendChild(icon);
    root.appendChild(textNode);

    return {
      root: root,
      /**
       * @param {'success'|'info'|'warning'|'error'} type
       * @param {string} html 표시할 내용(HTML 허용)
       * @param {string} [customIcon] 🎉 · 🏅 등 다른 아이콘을 쓰고 싶을 때
       */
      show: function (type, html, customIcon) {
        root.className = 'feedback feedback--' + type;
        icon.textContent = customIcon || FEEDBACK_ICON[type] || '💬';
        textNode.innerHTML = html;
      },
      clear: function () {
        root.className = 'feedback is-empty';
        icon.textContent = '💬';
        textNode.textContent = emptyText;
      }
    };
  }

  /* ------------------------------ 배지 · 표 ------------------------------ */
  function badge(kind, text) {
    var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
    return el('span', { 'class': ('badge ' + (map[kind] || '')).trim(), text: text });
  }

  function boolBadge(value) {

  }

  function dataTable(opts) {
    var o = opts || {};
    var head = o.head || [];
    var rows = o.rows || [];
    var table = el('table', { 'class': ('data-table ' + (o.className || '')).trim() }, [
      o.caption ? el('caption', { 'class': 'sr-only', text: o.caption }) : null,
      el('thead', {}, [
        el(
          'tr',
          {},
          head.map(function (h) {
            return el('th', { scope: 'col', html: h });
          })
        )
      ]),
      el(
        'tbody',
        {},
        rows.map(function (row) {
          return el(
            'tr',
            {},
            row.map(function (cell, i) {
              var tag = i === 0 ? 'th' : 'td';
              var props = i === 0 ? { scope: 'row' } : {};
              if (cell instanceof Node) {
                var td = el(tag, props);
                td.appendChild(cell);
                return td;
              }
              props.html = cell;
              return el(tag, props);
            })
          );
        })
      )
    ]);
    return el('div', { 'class': 'table-scroll' }, [table]);
  }

  function callout(html, opts) {
    var o = opts || {};
    return el('div', { 'class': ('callout ' + (o.muted ? 'callout--muted' : '')).trim(), html: html });
  }

  /** 🏅 배지 카드 (명세 9.11 · 이번 차시 추가 헬퍼) */
  function award(opts) {
    var o = opts || {};
    return el('div', { 'class': 'award' }, [
      el('span', { 'class': 'award__icon', text: o.icon || '🏅', attrs: { 'aria-hidden': 'true' } }),
      el('div', { 'class': 'award__body' }, [
        el('p', { 'class': 'award__title', text: o.title || '' }),
        o.text ? el('p', { 'class': 'award__text', html: o.text }) : null
      ])
    ]);
  }

  /** 보충 학습 바로가기 줄 (명세 10.3 · 이번 차시 추가 헬퍼) */
  function linkLine(opts) {
    var o = opts || {};
    return el('div', { 'class': 'linkline' }, [
      el('span', { 'class': 'linkline__label', html: o.text || '' }),
      button({
        label: o.label || o.step + '단계로 이동',
        variant: 'secondary',
        className: 'linkline__link',
        ariaLabel: o.step + '단계 화면으로 이동',
        onClick: function () {
          L.nav.goToStep(o.step, { force: true });
        }
      })
    ]);
  }

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {
    var region = document.getElementById('toast-region');
    if (!region) return;
    var node = el('div', { 'class': 'toast', text: message });
    region.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, duration || 2600);
  }

  function announce(message) {
    var live = document.getElementById('sr-live');
    if (!live) return;
    live.textContent = '';
    setTimeout(function () {
      live.textContent = message;
    }, 30);
  }

  /**
   * 확인 대화상자 (저장된 진행 복원 · 초기화 확인)
   * dismissValue: Esc 키·백드롭 등으로 그냥 닫았을 때 돌려줄 값.
   */
  function confirmDialog(opts) {
    var o = opts || {};
    var dismissValue = o.dismissValue === undefined ? false : o.dismissValue;
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,
      tabindex: '0',
      dataset: { tip: tip },
      attrs: { 'aria-label': text + '. ' + tip }
    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');
    });
    return node;
  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;
  ui.badge = badge;
  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;
})();

    <script data-from="js/20-codeview.js">
/**
 * 파이썬 코드 표시 컴포넌트 (명세 11.2 코드 표시 / 11.3 조건 실행 상태)
 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (중첩 조건의 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시
 *
 * 이번 차시에서 추가된 것 : setState(index, 'unchecked')
 *   → 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다(명세 11.3 '검사 안 함').
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  // 3차시는 반복문이 주제이므로 for · while · break · continue · import 를 키워드로 추가한다.
  var KEYWORDS = /^(if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

  var TOKEN_RE = /(\b(?:if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range|sum|random|randint)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\+=|-=|\/\/|[%+\-*/<>=])/g;

  function span(cls, textContent) {
    return '<span class="' + cls + '">' + escapeHtml(textContent) + '</span>';
  }

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */
  function highlightSegment(segment) {
    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);
    }
    if (last < segment.length) out += escapeHtml(segment.slice(last));
    return out;
  }

  /**
   * 파이썬 한 줄(들여쓰기 제외)을 하이라이팅한 HTML 문자열로 바꾼다.
   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.
   */
  function highlightPython(source) {
    var src = String(source === undefined || source === null ? '' : source);
    var out = '';
    var i = 0;
    var buffer = '';

    var flush = function () {
      if (buffer) {
        out += highlightSegment(buffer);
        buffer = '';
      }
    };

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {
        flush();
        out += span('tok-comment', src.slice(i));
        return out;
      }
      if (ch === '"' || ch === "'") {
        flush();
        var j = i + 1;
        while (j < src.length && src[j] !== ch) {
          if (src[j] === '\\') j += 1;
          j += 1;
        }
        out += span('tok-str', src.slice(i, Math.min(j + 1, src.length)));
        i = j + 1;
        continue;
      }
      buffer += ch;
      i += 1;
    }
    flush();
    return out;
  }

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */
  function indentHtml(spaces) {
    if (spaces <= 0) return '';
    var html = '';
    var left = spaces;
    var first = true;
    while (left > 0) {
      var width = Math.min(4, left);
      html +=
        '<span class="indent' +
        (first ? ' indent--first' : '') +
        '"' +
        (width === 4 ? '' : ' style="width:' + width + 'ch"') +
        '></span>';
      left -= width;
      first = false;
    }
    return html;
  }

  function splitIndent(code) {
    var normalized = String(code === undefined || code === null ? '' : code).replace(/\t/g, '    ');
    var match = normalized.match(/^ */);
    var spaces = match ? match[0].length : 0;
    return { spaces: spaces, rest: normalized.slice(spaces) };
  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{
   *   code?: string,                 // 원본 코드 한 줄(앞 공백 = 들여쓰기)
   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁
   * }>
   */
  function createCodeView(opts) {
    var o = opts || {};
    var showLineNumbers = o.showLineNumbers !== false;
    var linesWrap = el('div', { 'class': 'codeview__lines' });
    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);
    var head =
      o.title || o.headExtra
        ? el('div', { 'class': 'codeview__head' }, [
            o.title ? el('span', { 'class': 'codeview__title', html: o.title }) : el('span'),
            o.headExtra || null
          ])
        : null;
    var children = [];
    if (head) children.push(head);
    children.push(scroll);
    var root = el(
      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },
      children
    );

    var current = [];
    var lineEls = [];

    function build(nextLines) {
      current = nextLines || [];
      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }
        });

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.
        var usesParts = Array.isArray(line.parts);
        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  L.codeview = {
    createCodeView: createCodeView,
    highlightPython: highlightPython
  };
})();
    </script>
    <script data-from="teacher/t10-answerkey.js">
/**
 * 교사용 ① 정답표 · 수업 지도 자료 (자료만 담은 파일)
 *
 * 학생용 65-step6.js 의 QUESTIONS 와 «같은 내용»이어야 한다.
 * 문항을 고치면 두 곳을 함께 고친다(문항 본문·정답·해설·평가 요소).
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var T = L.teacher || (L.teacher = {});

  T.LESSON_ID = 'lesson3_7_3';

  /** 답안이 모이는 드라이브 폴더 (apps-script/Code.gs 의 FOLDER_ID 와 같은 곳) */
  T.DRIVE_FOLDER_URL =
    'https://drive.google.com/drive/folders/1Gi6qPzAoD1j9sX_9BdDnDB03b89N7mFD';

  /** 형성평가 5문항 (명세 10.2 ~ 10.6) */
  T.QUESTIONS = [
    {
      no: 1,

        var shared = [];
        if (entries['xl/sharedStrings.xml']) {
          var doc = new DOMParser().parseFromString(entries['xl/sharedStrings.xml'], 'application/xml');
          Array.prototype.slice.call(doc.getElementsByTagName('si')).forEach(function (si) {
            shared.push(
              Array.prototype.slice
                .call(si.getElementsByTagName('t'))
                .map(function (t) {
                  return t.textContent;
                })
                .join('')
            );
          });
        }
        var sheetName = Object.keys(entries)
          .filter(function (n) {
            return /^xl\/worksheets\/sheet\d+\.xml$/.test(n);
          })
          .sort()[0];
        if (!sheetName) throw new Error('엑셀에서 시트를 찾지 못했어요.');
        return sheetToRows(entries[sheetName], shared);
      });
    });
  }

  /* --------------------------- 행 → 학생 명단 --------------------------- */
  function pickColumns(rows) {
    // 앞쪽 5줄 안에서 머리글을 찾는다.
    for (var r = 0; r < Math.min(rows.length, 5); r += 1) {
      var cells = rows[r] || [];
      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = headerKey(cell);
        if (idCol < 0 && ID_HEADERS.indexOf(v) !== -1) idCol = c;
        if (nameCol < 0 && NAME_HEADERS.indexOf(v) !== -1) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    // 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다.
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /**
   * 명단 파일(.xlsx / .csv / .tsv / .txt)을 읽어 { students, warnings } 를 돌려준다.
   * students : [{ id, name }] — 파일에 적힌 순서를 그대로 지킨다.
   */
  function parseRosterFile(file) {
    var lower = String(file && file.name ? file.name : '').toLowerCase();
    var rowsPromise;

    if (/\.xlsx$/.test(lower)) rowsPromise = readXlsx(file);
    else if (/\.xls$/.test(lower)) {
      return Promise.reject(
        new Error('예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV 로 저장해 올려 주세요.')
      );
    } else {
      rowsPromise = file.text().then(splitDelimited);
    }

    return rowsPromise.then(function (rows) {
      var picked = pickColumns(rows || []);
      var students = [];
      var warnings = [];
      var seen = {};

      (rows || []).forEach(function (cells, index) {
        if (index <= picked.headerRow) return;
        var id = String((cells || [])[picked.idCol] || '').trim();
        var name = String((cells || [])[picked.nameCol] || '').trim();
        if (!id && !name) return;
        // 머리글이 중간에 다시 나오는 경우 건너뛴다.
        if (ID_HEADERS.indexOf(headerKey(id)) !== -1 || NAME_HEADERS.indexOf(headerKey(name)) !== -1) return;
        if (!id) {
          warnings.push((index + 1) + '번째 줄 : 학번이 비어 있어 건너뛰었어요.');
          return;
        }
        var key = normalizeId(id);
        if (seen[key]) {
          warnings.push('학번 ' + id + ' 이(가) 여러 번 있어 한 번만 셌어요.');
          return;
        }
        seen[key] = true;
        students.push({ id: id, name: name });
      });

      if (!students.length) {
        throw new Error('학번과 이름을 찾지 못했어요. 첫 줄에 「학번」「이름」 머리글이 있는지 확인해 주세요.');
      }
      return { students: students, warnings: warnings };
    });
  }

  /** 제출 기록과 명단을 합쳐 «미제출까지» 담은 표 자료를 만든다. */
  function mergeRoster(records, roster) {
    var list = Array.isArray(records) ? records : [];
    var byId = {};
    list.forEach(function (r) {
      var key = normalizeId(r.studentId);
      if (key && byId[key] === undefined) byId[key] = r;
    });

    if (!roster || !roster.students || !roster.students.length) {
      return {
        rows: list.map(function (r) {
          return { studentId: r.studentId, name: r.name, record: r, submitted: true, inRoster: false };
        }),
        hasRoster: false,
        submittedCount: list.length,
        missingCount: 0,
        extraCount: 0,
        missing: []
      };
    }

    var rows = [];
    var used = {};
    roster.students.forEach(function (s) {
      var key = normalizeId(s.id);
      var found = byId[key] || null;
      if (found) used[key] = true;
      rows.push({
        studentId: s.id,
        name: s.name || (found ? found.name : ''),
        record: found,
        submitted: Boolean(found),
        inRoster: true
      });
    });

    // 명단에 없는 제출자(학번 오타 등)도 빠뜨리지 않는다.
    var extra = 0;
    list.forEach(function (r) {
      var key = normalizeId(r.studentId);
      if (used[key]) return;
      extra += 1;
      rows.push({ studentId: r.studentId, name: r.name, record: r, submitted: true, inRoster: false });
    });

    var missing = rows.filter(function (row) {
      return row.inRoster && !row.submitted;
    });

    return {
      rows: rows,
      hasRoster: true,
      submittedCount: roster.students.length - missing.length,
      missingCount: missing.length,
      extraCount: extra,
      missing: missing
    };
  }

  /** 표에 찍는 기호 : ○ 정답 · ✕ 오답 · − 무응답 */
  function markSymbol(item) {
    if (!item || !item.answered) return '−';
    return item.correct ? '○' : '✕';
  }

  function markLabel(item) {
    if (!item || !item.answered) return '무응답';
    return item.correct ? '정답' : '오답';
  }

  /** 명단 표에 쓸 행 (학번 순) */
  function rosterRows(records) {
    return (records || []).map(function (r) {
      return {
        studentId: r.studentId || '-',
        name: r.name || '(이름 없음)',
        marks: r.items.map(function (item) {
          return item.answered ? (item.correct ? 'O' : 'X') : '-';
        }),
        score: r.score,
        passed: r.passed,
        receivedAt: r.receivedAt ? r.receivedAt.replace('T', ' ').slice(0, 16) : ''
      };
    });
  }

  /**
   * 엑셀에서 바로 열 수 있는 CSV 문자열 (BOM 포함)
   * 명단(roster)을 함께 주면 «미제출» 학생도 한 줄로 들어간다.
   */
  function toCsv(records, roster) {
    var head = ['학번', '이름'];
    QUESTIONS.forEach(function (q) {
      head.push(q.no + '번');
    });
    head.push('점수', '이수 여부', '제출 시각');

    var merged = mergeRoster(records, roster);
    var rows = merged.rows.map(function (row) {
      if (!row.record) {
        return [row.studentId, row.name]
          .concat(
            QUESTIONS.map(function () {
              return '';
            })
          )
          .concat(['', '미제출', '']);
      }
      var r = row.record;
      return [row.studentId, row.name]
        .concat(
          r.items.map(function (item) {
            return markSymbol(item);
          })
        )
        .concat([r.score, r.passed ? '이수' : '미이수', r.receivedAt ? r.receivedAt.replace('T', ' ').slice(0, 16) : '']);
    });

    var escape = function (value) {
      var text = String(value === null || value === undefined ? '' : value);
      return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
    };
    var lines = [head].concat(rows).map(function (row) {
      return row.map(escape).join(',');
    });
    return '﻿' + lines.join('\r\n');
  }

  A.MAX_SCORE = MAX_SCORE;
  A.PASS_SCORE = PASS_SCORE;
  A.QUESTION_IDS = QUESTIONS.map(function (q) {
    return q.no;
  });
  A.looksLikeSubmission = looksLikeSubmission;
  A.parseRosterFile = parseRosterFile;
  A.mergeRoster = mergeRoster;
  A.markSymbol = markSymbol;
  A.markLabel = markLabel;
  A.normalizeId = normalizeId;
  A.build = build;
  A.summary = summary;
  A.topStudents = topStudents;
  A.praiseFor = praiseFor;
  A.hardest = hardest;
  A.rosterRows = rosterRows;
  A.toCsv = toCsv;
})();
    </script>
    <script data-from="teacher/t90-main.js">
/**
 * 교사용 ③ 화면 (형성평가 제출 결과 분석)
 *
 * 1차시 교사용 페이지와 «같은 형식»의 4장 구성이다.
 *   1장 결과 불러오기      — 조회 주소 / JSON 파일 / 끌어다 놓기
 *   2장 요약 · 상위 3명
 *   3장 가장 많이 틀린 문제 — 한 문항씩 열어 보고, 모두 확인해야 다음 장으로
 *   4장 전체 명단 · 정오표  — 학생 명단(선택) · 미제출 · 인쇄 · CSV
 *
 * 위에는 장 이동 스테퍼, 아래에는 [← 이전] [다음 →] 페이저가 있다.
 * 자료를 불러오기 전에는 2~4장이 잠긴다. 마지막 장의 [다음]은 「마침」이 된다.
 *
 * 학생 답안은 이 브라우저 안에서만 다룬다. 어디로도 보내지 않는다.
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var T = L.teacher;
  var A = T.analysis;

  /**
   * 조회용(Analytics.gs) 주소를 기억해 두는 자리.
   * 학생용이 쓰는 «저장용»(Code.gs) 주소와 다른 배포이므로 열쇠를 따로 쓴다.
   */
  var ENDPOINT_KEY = 'lesson3_7_3_analytics_endpoint';

  /** 4장 구성 */
  var PAGES = [
    { no: 1, label: '결과 불러오기' },
    { no: 2, label: '요약 · 상위 3명' },
    { no: 3, label: '가장 많이 틀린 문제' },
    { no: 4, label: '전체 명단 · 정오표' }
  ];

  /** 지금 화면이 들고 있는 것 */
  var view = {
    records: [],
    roster: null,
    load: null,
    hard: [],
    hardIndex: -1
  };

  var currentPage = 1;
  var dataLoaded = false;
  var allWrongSeen = false;

  var refs = {};

  /* ================================================================== */
  /* 작은 조립 도우미                                                     */
  /* ================================================================== */
  function statCard(label, value, unit) {
    return el('div', { 'class': 't-stat' }, [
      el('p', { 'class': 't-stat__label', text: label }),
      el('p', { 'class': 't-stat__value' }, [
        el('span', { text: String(value) }),
        unit ? el('small', { text: ' ' + unit }) : null
      ])
    ]);
  }

  function codeBlock(lines, ariaLabel) {
    return L.codeview.createCodeView({
      lines: (lines || []).map(function (line) {
        return { code: line };
      }),
      showLineNumbers: false,
      ariaLabel: ariaLabel || '코드'
    }).root;
  }

  function bulletList(items, className) {
    return el(
      'ul',
      { 'class': className || 't-hint-list' },
      (items || []).map(function (text) {
        return el('li', { html: text });
      })
    );
  }

  function setStatus(node, kind, message) {
    if (!node) return;
    node.className = 't-status' + (kind ? ' is-' + kind : '');
    node.textContent = message;
    node.hidden = !message;
  }

  /* ================================================================== */
  /* 화면 뼈대                                                            */
  /* ================================================================== */
  function mount() {
    var root = document.getElementById('teacher-main');
    if (!root) return;

    /* --- 머리말 --- */
    root.appendChild(
      el('header', { 'class': 't-header' }, [
        el('p', { 'class': 't-header__eyebrow', text: '교사용 · ' + T.LESSON_TITLE }),
        el('h1', { 'class': 't-header__title', text: '형성평가 결과 분석' }),
        el('p', {
          'class': 't-header__sub',
          text:
            '학생들이 제출한 답안을 읽어 요약과 상위 3명, 가장 많이 틀린 문제, 전체 정오표를 정리해 보여 줍니다.'
        })
      ])
    );

    /* --- 개인정보 안내 (화면 맨 위 한 줄) --- */
    root.appendChild(
      ui.callout(
        '🔒 <strong>불러온 자료는 이 브라우저 안에서만 처리되며 어디로도 전송되지 않습니다.</strong> ' +
          '창을 닫으면 사라지므로, 남겨야 할 자료는 CSV 로 내려받거나 인쇄해 주세요.',
        { muted: true }
      )
    );

    /* --- 인쇄물 맨 위 날짜 (출력할 때만 보인다) --- */
    refs.printDate = el('p', { 'class': 't-printdate' });
    root.appendChild(refs.printDate);
    stampPrintDate();
    window.addEventListener('beforeprint', stampPrintDate);

    buildStepper(root);

    /* ── 1장 : 결과 불러오기 ── */
    refs.page1 = el('section', {
      'class': 't-page',
      dataset: { page: '1' },
      attrs: { 'aria-label': '1장 결과 불러오기', tabindex: '-1' }
    });
    refs.page1.appendChild(buildSource());
    refs.empty = el('div', { 'class': 'panel t-empty' }, [
      el('p', { text: '아직 불러온 제출이 없어요.' }),
      el('p', {
        'class': 'panel__hint',
        text: '위에서 「제출 결과 불러오기」를 누르거나, 드라이브에서 내려받은 JSON 파일을 열어 주세요.'
      })
    ]);
    refs.page1.appendChild(refs.empty);

    /* ── 2장 : 요약 · 상위 3명 ── */
    refs.page2 = el('section', {
      'class': 't-page',
      dataset: { page: '2' },
      attrs: { 'aria-label': '2장 전체 요약과 상위 3명', tabindex: '-1' }
    });
    refs.summarySection = el('div', { 'class': 'stack stack--lg' });
    refs.page2.appendChild(refs.summarySection);

    /* ── 3장 : 가장 많이 틀린 문제 ── */
    refs.page3 = el('section', {
      'class': 't-page',
      dataset: { page: '3' },
      attrs: { 'aria-label': '3장 가장 많이 틀린 문제', tabindex: '-1' }
    });
    refs.wrongSection = el('div', { 'class': 'stack stack--lg' });
    refs.page3.appendChild(refs.wrongSection);

    /* ── 4장 : 전체 명단 · 정오표 ── */
    refs.page4 = el('section', {
      'class': 't-page',
      dataset: { page: '4' },
      attrs: { 'aria-label': '4장 전체 명단과 정오표', tabindex: '-1' }
    });
    refs.page4.appendChild(buildRosterSource());
    refs.rosterSection = el('div', { 'class': 'stack stack--lg' });
    refs.page4.appendChild(refs.rosterSection);

    root.appendChild(refs.page1);
    root.appendChild(refs.page2);
    root.appendChild(refs.page3);
    root.appendChild(refs.page4);

    buildPager(root);
    renderAll(true);
    showPage(1);
  }

  /* ------------------------------------------------------------------ */
  /* 장 이동 (스테퍼 · 페이저)                                             */
  /* ------------------------------------------------------------------ */
  function buildStepper(root) {
    refs.stepper = el('ol', { 'class': 't-steps', attrs: { 'aria-label': '페이지 이동' } });

    PAGES.forEach(function (p) {
      var btn = el('button', {
        type: 'button',
        'class': 't-steps__btn',
        dataset: { page: String(p.no) },
        attrs: { 'aria-label': p.no + '장 ' + p.label + ' 보기' },
        on: {
          click: function () {
            goToPage(p.no);
          }
        }
      });
      btn.appendChild(el('span', { 'class': 't-steps__no', text: String(p.no) }));
      btn.appendChild(el('span', { 'class': 't-steps__label', text: p.label }));
      refs.stepper.appendChild(el('li', { 'class': 't-steps__item' }, [btn]));
    });

    root.appendChild(el('nav', { 'class': 't-steps-wrap no-print' }, [refs.stepper]));
  }

  function buildPager(root) {
    refs.btnPrev = ui.button({
      label: '← 이전',
      variant: 'secondary',
      onClick: function () {
        goToPage(currentPage - 1);
      }
    });
    refs.btnNext = ui.button({
      label: '다음 →',
      variant: 'primary',
      onClick: function () {
        // 마지막 장에서는 「마침」 버튼으로 바뀐다.
        if (currentPage === PAGES.length) finishReview();
        else goToPage(currentPage + 1);
      }
    });
    refs.pageHint = el('p', { 'class': 't-pager__hint', attrs: { 'aria-live': 'polite' } });

    root.appendChild(
      el('footer', { 'class': 't-pager no-print' }, [refs.btnPrev, refs.pageHint, refs.btnNext])
    );
  }

  /**
   * 하단 이동 버튼 상태를 정한다.
   *  · 1장에서는 자료를 불러와야 다음으로 넘어갈 수 있다.
   *  · 3장에서는 틀린 문제를 모두 확인해야 다음 장으로 넘어갈 수 있다.
   *  · 마지막 장에서는 「마침」 버튼이 된다.
   */
  function updatePager() {
    var last = currentPage === PAGES.length;
    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = '다음 →';
      refs.btnNext.classList.remove('btn--finish');
      refs.btnNext.setAttribute('aria-label', '다음 장 보기');

      if (currentPage === 3) {
        var total = wrongList().length;
        refs.btnNext.disabled = !allWrongSeen;
        refs.btnNext.title = allWrongSeen
          ? ''
          : '틀린 문제 ' + total + '개를 모두 확인하면 넘어갈 수 있어요. (' +
            Math.max(0, view.hardIndex + 1) + ' / ' + total + ')';
        return;
      }

      refs.btnNext.disabled = !dataLoaded && currentPage === 1;
      refs.btnNext.title = !dataLoaded && currentPage === 1 ? '먼저 제출 결과를 불러와 주세요.' : '';
      return;
    }

    refs.btnNext.textContent = '마침';
    refs.btnNext.classList.add('btn--finish');
    refs.btnNext.disabled = false;
    refs.btnNext.title = '';
    refs.btnNext.setAttribute('aria-label', '분석 마치기');
  }

  /** 「마침」을 눌렀을 때 */
  function finishReview() {
    refs.pageHint.textContent = '분석을 마쳤어요 🎉 위 번호나 「← 이전」으로 다시 볼 수 있어요.';
    refs.btnNext.disabled = true;
    ui.toast('결과 분석을 마쳤어요.');
    ui.announce('결과 분석을 마쳤습니다.');
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    if (next > 1 && !dataLoaded) {
      setStatus(refs.status, 'error', '먼저 제출 결과를 불러와 주세요.');
      return;
    }
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;
    var pages = [refs.page1, refs.page2, refs.page3, refs.page4];

    pages.forEach(function (page, i) {
      page.classList.toggle('is-active', i + 1 === no);
    });

    Array.prototype.slice.call(refs.stepper.querySelectorAll('.t-steps__btn')).forEach(function (btn) {
      var n = Number(btn.dataset.page);
      btn.classList.toggle('is-current', n === no);
      btn.classList.toggle('is-locked', n > 1 && !dataLoaded);
      btn.setAttribute('aria-current', n === no ? 'page' : 'false');
    });

    updatePager();
    refs.pageHint.textContent = no + ' / ' + PAGES.length + '장 · ' + PAGES[no - 1].label;

    window.scrollTo({ top: 0, behavior: 'auto' });
    var page = pages[no - 1];
    if (page && typeof page.focus === 'function') page.focus({ preventScroll: true });
    ui.announce(no + '장 ' + PAGES[no - 1].label);
  }

  /** 자료를 불러온 뒤 나머지 장을 열어 준다. */
  function unlockPages() {
    var first = !dataLoaded;
    dataLoaded = true;
    // 처음 불러왔을 때만 2장으로 넘어간다. (4장에서 명단을 올렸다면 그 자리에 머문다)
    showPage(first ? 2 : currentPage);
  }

  /** 인쇄물 맨 위에 찍는 날짜 (예 : 2026년 8월 10일 (월) 출력) */
  function stampPrintDate() {
    if (!refs.printDate) return;
    var now = new Date();

  /** 페이지 어디에 놓아도 파일을 받는다. */
  function setupDragAndDrop() {
    var over = 0;
    window.addEventListener('dragenter', function (e) {
      e.preventDefault();
      over += 1;
      if (refs.drop) refs.drop.classList.add('is-over');
    });
    window.addEventListener('dragover', function (e) {
      e.preventDefault();
    });
    window.addEventListener('dragleave', function () {
      over = Math.max(0, over - 1);
      if (!over && refs.drop) refs.drop.classList.remove('is-over');
    });
    window.addEventListener('drop', function (e) {
      e.preventDefault();
      over = 0;
      if (refs.drop) refs.drop.classList.remove('is-over');
      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      var list = Array.prototype.slice.call(files);
      var roster = list.filter(function (f) {
        return /\.(xlsx|xls|csv|tsv|txt)$/i.test(f.name);
      });
      var jsons = list.filter(function (f) {
        return /\.json$/i.test(f.name);
      });
      if (jsons.length) readFiles(jsons);
      if (roster.length) loadRoster(roster[0]);
      if (!jsons.length && !roster.length) {
        setStatus(refs.status, 'error', 'JSON 또는 명단(xlsx·csv) 파일만 읽을 수 있어요.');
      }
    });
  }

  function loadRoster(file) {
    setStatus(refs.rosterStatus, 'loading', '명단을 읽는 중…');
    A.parseRosterFile(file)
      .then(function (roster) {
        view.roster = roster;
        var message = '명단 ' + roster.students.length + '명을 읽었습니다.';
        if (roster.warnings.length) message += ' (' + roster.warnings.slice(0, 2).join(' / ') + ')';
        setStatus(refs.rosterStatus, 'ok', message);
        renderAll(false);
      })
      .catch(function (err) {
        setStatus(refs.rosterStatus, 'error', err && err.message ? err.message : '명단을 읽지 못했어요.');
      });
  }

  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    setStatus(refs.status, 'loading', files.length + '개 파일을 읽는 중…');

    var readers = files.map(function (file) {
      return new Promise(function (resolve) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            resolve(JSON.parse(String(reader.result)));
          } catch (err) {
            resolve(null);
          }
        };
        reader.onerror = function () {
          resolve(null);
        };
        reader.readAsText(file, 'utf-8');
      });
    });

    Promise.all(readers).then(function (list) {
      applyRecords(
        list.filter(function (item) {
          return item !== null;
        }),
        files.length + '개 파일을 읽었습니다.'
      );
    });
  }

  /* ------------------------------ 주소에서 ------------------------------ */

  function addParam(url, key, value) {
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + key + '=' + encodeURIComponent(value);
  }

  /**
   * JSONP 로 읽는다.
   * 교사용 페이지를 file:// 로 열면 fetch 는 CORS 에 막히지만,
   * <script> 태그로 불러오는 JSONP 는 막히지 않는다. (Analytics.gs 가 ?callback= 을 지원한다)
   */
  function jsonp(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var name = '__t3cb' + String(Date.now()) + String(Math.floor(Math.random() * 1000));
      var script = el('script', { src: addParam(url, 'callback', name), async: true });
      var settled = false;

      var cleanup = function () {
        try {
          delete window[name];
        } catch (err) {
          window[name] = undefined;
        }
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      window[name] = function (data) {
        settled = true;
        cleanup();
        resolve(data);
      };
      script.onerror = function () {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('주소를 불러오지 못했습니다.'));
      };
      setTimeout(function () {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('응답이 없어 시간이 초과되었습니다.'));
      }, timeoutMs || 20000);

      document.head.appendChild(script);
    });
  }

  /** fetch 를 먼저 써 보고, 막히면 JSONP 로 다시 시도한다. */
  function loadJson(url) {
    return fetch(url, { method: 'GET', redirect: 'follow' })
      .then(function (res) {
        return res.json();
      })
      .catch(function () {
        return jsonp(url);
      });
  }

  function readEndpointValue() {
    var url = String(refs.endpointInput.value || '').trim();
    if (!url) {
      setStatus(refs.status, 'error', '조회용 주소를 입력해 주세요.');
      return '';
    }
    try {
      window.localStorage.setItem(ENDPOINT_KEY, url);
    } catch (err) {
      /* 저장 못 해도 불러오기는 된다 */
    }
    return url;
  }

  /** 주소가 «조회용» 인지 먼저 확인한다(파일을 읽지 않아 빠르다). */
  function pingEndpoint() {
    var url = readEndpointValue();
    if (!url) return;
    setStatus(refs.status, 'loading', '주소를 확인하는 중…');

    loadJson(addParam(url, 'mode', 'ping'))
      .then(function (data) {
        if (data && data.ok && String(data.service || '') === 'lesson3_7_3-analytics') {
          setStatus(
            refs.status,
            'ok',
            '연결되었습니다. 폴더 「' + (data.folderName || '이름 없음') + '」 에서 읽어 옵니다.'
          );
          return;
        }
        if (data && String(data.service || '').indexOf('formative-assessment') >= 0) {
          setStatus(
            refs.status,
            'error',
            '이 주소는 «답안 저장용»(Code.gs)입니다. 조회용(Analytics.gs) 주소를 넣어 주세요.'
          );
          return;
        }
        setStatus(refs.status, 'error', '이 차시의 조회용 주소가 아닙니다. 주소를 다시 확인해 주세요.');
      })
      .catch(function (err) {
        setStatus(
          refs.status,
          'error',
          '주소에 연결하지 못했습니다(' + err.message + '). 배포 시 액세스 권한이 「모든 사용자」인지 확인해 주세요.'
        );
      });
  }

  function loadFromEndpoint() {
    var url = readEndpointValue();
    if (!url) return;
    setStatus(refs.status, 'loading', '폴더에서 답안을 받아오는 중…');

    loadJson(url)
      .then(function (data) {
        if (data && data.ok === false) {
          setStatus(refs.status, 'error', data.error || '답안을 읽지 못했습니다.');
          return;
        }
        var items = Array.isArray(data) ? data : data && (data.items || data.records);
        if (!Array.isArray(items)) {
          setStatus(
            refs.status,
            'error',
            '이 주소는 답안 목록을 돌려주지 않습니다. Analytics.gs 를 배포한 주소인지 확인해 주세요.'
          );
          return;
        }
        var where = data && data.folderName ? '폴더 「' + data.folderName + '」 에서 ' : '';
        applyRecords(items, where + items.length + '건을 받았습니다.');
      })
      .catch(function (err) {
        setStatus(
          refs.status,
          'error',
          '주소에 연결하지 못했습니다(' + err.message + '). 아래 파일 고르기로도 불러올 수 있습니다.'
        );
      });
  }

  function applyRecords(rawList, headline) {
    var load = A.build(rawList);
    view.records = load.records;
    view.load = load;

    var extra = [];
    if (load.skipped) extra.push('이 차시 답안이 아닌 파일 ' + load.skipped + '건은 건너뛰었습니다.');
    if (load.replaced) extra.push('같은 학생의 재제출 ' + load.replaced + '건은 나중 것만 셌습니다.');

    if (!load.records.length) {
      setStatus(refs.status, 'error', headline + ' 하지만 쓸 수 있는 답안이 없습니다. ' + extra.join(' '));
      renderAll(true);
      return;
    }

    setStatus(
      refs.status,
      'ok',
      headline + ' 학생 ' + load.records.length + '명의 답안을 불러왔습니다. ' + extra.join(' ')
    );
    renderAll(true);
    unlockPages();
  }

  /* ================================================================== */
  /* 2~4장 그리기                                                         */
  /* ================================================================== */

  /**
   * 지금 자료로 2 · 3 · 4장을 모두 다시 그린다.
   * @param {boolean} resetProgress 제출 자료가 새로 바뀌었으면 true.
   *   명단만 바뀐 경우에는 false 를 넘겨 3장에서 확인해 둔 진행을 지우지 않는다.
   */
  function renderAll(resetProgress) {
    var has = view.records.length > 0;
    refs.empty.hidden = has;

    view.hard = has ? A.hardest(view.records) : [];
    if (resetProgress) {
      view.hardIndex = -1;
      allWrongSeen = has ? wrongList().length === 0 : false;
    } else if (has && wrongList().length === 0) {
      allWrongSeen = true;
    }

    /* 2장 */
    ui.clear(refs.summarySection);
    if (has) {
      refs.summarySection.appendChild(renderSummary());
      refs.summarySection.appendChild(renderPodium());
    } else {
      refs.summarySection.appendChild(emptyBox());
    }

    /* 3장 */
    ui.clear(refs.wrongSection);
    if (has) {
      refs.wrongSection.appendChild(renderHardest());
      refs.wrongSection.appendChild(buildKeyPanel());
    } else {
      refs.wrongSection.appendChild(emptyBox());
    }

    /* 4장 */
    ui.clear(refs.rosterSection);
    if (has) {
      refs.rosterSection.appendChild(renderRoster());
      refs.rosterSection.appendChild(buildGuidePanel());
    } else {
      refs.rosterSection.appendChild(emptyBox());
    }

    if (refs.btnNext) updatePager();
  }

    return el('div', { 'class': 'panel t-empty' }, [
      el('p', { text: '아직 불러온 제출이 없어요.' }),
