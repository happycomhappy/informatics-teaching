    return (view.hard || []).filter(function (item) {
      return item.wrong > 0;
    });
  }

  function renderSummary() {
    var s = A.summary(view.records);
    var box = ui.panel({
      title: '📊 전체 요약',
      hint: '총 ' + s.maxScore + '점 만점 · ' + s.passScore + '점 이상이면 이수입니다.'
    });

    box.body.appendChild(
      el('div', { 'class': 't-stats' }, [
        statCard('제출 학생', s.count, '명'),
        statCard('평균 점수', s.average, '/ ' + s.maxScore + '점'),
        statCard('최고 점수', s.highest, '점'),
        statCard('최저 점수', s.lowest, '점'),
        statCard('만점자', s.perfect, '명'),
        statCard('이수', s.passedCount, '명 (' + s.passRate + '%)')
      ])
    );

    if (s.latest) {
      box.body.appendChild(el('p', { 'class': 'panel__hint', text: '마지막 제출 : ' + s.latest }));
    }
    if (s.failedCount) {
      box.body.appendChild(
        el('p', {
          'class': 'panel__hint',
          text:
            '미이수 ' + s.failedCount + '명은 틀린 문항의 보충 화면으로 돌아가 다시 학습하도록 안내해 주세요.'
        })
      );
    }
    if (s.mismatch) {
      box.body.appendChild(
        el('div', { 'class': 't-warn' }, [
          el('p', {
            html:
              '파일에 적힌 점수와 다시 채점한 점수가 다른 제출이 <strong>' +
              s.mismatch +
              '명</strong> 있습니다. 이 화면의 점수는 답안의 정오 표시를 근거로 <strong>다시 채점한 값</strong>입니다.'
          })
        ])
      );
    }
    return box.root;
  }

  function renderPodium() {
    var top = A.topStudents(view.records, 3);
    var box = ui.panel({ title: '🏆 상위 3명', hint: '점수가 같으면 먼저 제출한 학생을 앞에 둡니다.' });

    box.body.appendChild(
      el(
        'div',
        { 'class': 't-podium' },
        top.map(function (student) {
          var praise = A.praiseFor(student.rank);
          return el('article', { 'class': 't-card t-card--' + Math.min(student.rank, 3) }, [
            el('div', {}, [
              el('span', {
                'class': 't-card__medal',
                text: praise.medal,
                attrs: { 'aria-hidden': 'true' }
              }),
              el('span', { 'class': 't-card__rank', text: praise.title })
            ]),
            el('h3', { 'class': 't-card__name', text: student.name || '(이름 없음)' }),
            el('p', { 'class': 't-card__meta', text: '학번 ' + (student.studentId || '-') }),
            el('p', {
              'class': 't-card__score',
              html: student.score + ' <small>점 / ' + A.MAX_SCORE + '점</small>'
            }),
            el('p', {
              'class': 't-card__praise',
              text: (student.name || '학생') + ' 님, ' + praise.message
            })
          ]);
        })
      )
    );
    return box.root;
  }

  /** 가장 많이 틀린 문제를 한 문항씩 넘겨 본다. */
  function renderHardest() {
    var box = ui.panel({
      title: '📌 가장 많이 틀린 문제',
      hint: '버튼을 누를 때마다 오답이 많은 순서로 한 문항씩 보여 줍니다.'
    });

    refs.hardProgress = el('p', { 'class': 't-wrong__progress', attrs: { 'aria-live': 'polite' } });
    refs.hardCard = el('div', {});

    var withWrong = wrongList();

    if (!withWrong.length) {
      box.body.appendChild(
        el('p', { 'class': 't-empty', text: '모든 학생이 다 맞혔습니다. 훌륭합니다! 🎉' })
      );
      allWrongSeen = true;
      return box.root;
    }

    box.body.appendChild(
      el('div', { 'class': 't-wrong__controls no-print' }, [
        ui.button({
          label: '가장 많이 틀린 문제 보기',
          variant: 'primary',
          onClick: function () {
            view.hardIndex += 1;
            if (view.hardIndex >= withWrong.length) view.hardIndex = 0;
            showHard(withWrong[view.hardIndex], view.hardIndex, withWrong.length);
          }
        }),
        ui.button({
          label: '모두 펼치기',
          variant: 'secondary',
          onClick: function () {
            ui.clear(refs.hardCard);
            withWrong.forEach(function (item, i) {
              refs.hardCard.appendChild(hardCard(item, i, withWrong.length));
            });
            refs.hardProgress.textContent = '문항 ' + withWrong.length + '개를 모두 펼쳤습니다.';
            view.hardIndex = withWrong.length - 1;
            allWrongSeen = true;
            updatePager();
          }
        })
      ])
    );
    box.body.appendChild(refs.hardProgress);
    box.body.appendChild(refs.hardCard);
    return box.root;
  }

  function showHard(item, index, total) {
    ui.clear(refs.hardCard);
    refs.hardCard.appendChild(hardCard(item, index, total));
    refs.hardProgress.textContent = index + 1 + ' / ' + total + ' 번째로 많이 틀린 문항';
    // 마지막 문항까지 열어 보면 다음 장으로 넘어갈 수 있다.
    if (index + 1 >= total) allWrongSeen = true;
    updatePager();
  }

  function hardCard(item, index, total) {
    var q = item.q;
    var card = el('article', { 'class': 't-wrong__card' }, [
      el('p', { 'class': 't-wrong__rank', text: index + 1 + '위 · 오답률 ' + item.wrongRate + '%' }),
      el('h3', { 'class': 't-wrong__title', text: q.no + '번 (' + q.tag + ')' }),
      el('p', { 'class': 't-wrong__prompt', text: q.title })
    ]);

    if (q.code) card.appendChild(codeBlock(q.code, q.no + '번 문항 코드'));

    card.appendChild(
      el('div', { 'class': 't-bar' }, [
        el('span', {
          'class': 't-bar__fill',
          style: { width: item.wrongRate + '%' }
        }),
        el('span', {
          'class': 't-bar__label',
          text: '틀림 ' + item.wrong + '명 · 맞음 ' + item.right + '명'
        })
      ])
    );

    if (q.type === 'choice') {
      card.appendChild(
        el(
          'ul',
          { 'class': 't-options' },
          q.options.map(function (text, i) {
            var num = i + 1;
            var count = item.counts[i];
            var isAnswer = num === q.answer;
            var maxWrong = Math.max.apply(
              null,
              item.counts.filter(function (c, ci) {
                return ci + 1 !== q.answer;
              })
            );
            var topWrong = !isAnswer && count > 0 && count === maxWrong;
            return el(
              'li',
              {
                'class':
                  't-option' + (isAnswer ? ' is-answer' : '') + (topWrong ? ' is-top-wrong' : '')
              },
              [
                el('span', { 'class': 't-option__num', text: '①②③④⑤'.charAt(i) }),
                el('span', { 'class': 't-option__text' }, [
                  el('span', { text: text }),
                  !isAnswer && count > 0 && q.wrongWhy && q.wrongWhy[num]
                    ? el('span', { 'class': 'choice__sub', text: '→ ' + q.wrongWhy[num] })
                    : null
                ]),
                el('span', {
                  'class': 't-option__count',
                  text: count + '명' + (isAnswer ? ' (정답)' : '')
                })
              ]
            );
          })
        )
      );
    } else {
      card.appendChild(
        el('div', { 'class': 't-explain' }, [
          el('p', { 'class': 't-explain__label', text: '줄별로 비어 있던 학생 수' }),
          bulletList(
            q.answerLines.map(function (line, i) {
              return (
                '<code>' + ui.escapeHtml(line) + '</code> — ' + item.wrongLines[i] + '명이 비워 둠'
              );
            })
          ),
          bulletList(q.lineHints)
        ])
      );
    }

    card.appendChild(
      el('div', { 'class': 't-explain' }, [
        el('p', { 'class': 't-explain__label', text: '해설' }),
        el('p', { html: q.explain })
      ])
    );
    card.appendChild(
      el('div', { 'class': 't-teach' }, [
        el('p', { html: '<strong>다시 짚어 줄 화면</strong> — ' + q.relatedStep }),
        el('p', { html: '<strong>평가 요소</strong> — ' + q.point })
      ])
    );
    return card;
  }

  function renderRoster() {
    var merged = A.mergeRoster(view.records, view.roster);

    var box = ui.panel({
      title: '📋 전체 명단',
      hint:
        '문항별 정오와 총점, 이수 여부를 한 표로 봅니다. ○ 정답 · ✕ 오답 · − 무응답' +
        (merged.hasRoster ? ' · 제출하지 않은 학생은 「미제출」로 표시합니다.' : ''),
      className: 't-fulllist'
    });

    if (merged.hasRoster) {
      box.body.appendChild(
        el('div', { 'class': 't-stats' }, [
          statCard('명단 인원', view.roster.students.length, '명'),
          statCard('제출', merged.submittedCount, '명'),
          statCard('미제출', merged.missingCount, '명')
        ])
      );
      if (merged.missingCount) {
        box.body.appendChild(
          el('p', {
            'class': 'panel__hint',
            text:
              '미제출 ' +
              merged.missingCount +
              '명 : ' +
              merged.missing
                .map(function (row) {
                  return (row.name || '이름 없음') + '(' + row.studentId + ')';
                })
                .join(' · ')
          })
        );
      }
      if (merged.extraCount) {
        box.body.appendChild(
          el('div', { 'class': 't-warn' }, [
            el('p', {
              html:
                '명단에 없는 학번으로 제출한 학생이 <strong>' +
                merged.extraCount +
                '명</strong> 있어요. 표 아래쪽에 「명단 밖」으로 표시했습니다. 학번을 잘못 적었는지 확인해 주세요.'
            })
          ])
        );
      }
    }

    var head = el('tr', {}, [
      el('th', { scope: 'col', text: '학번' }),
      el('th', { scope: 'col', text: '이름' })
    ]);
    A.QUESTION_IDS.forEach(function (id) {
      head.appendChild(el('th', { scope: 'col', text: id + '번' }));
    });
    head.appendChild(el('th', { scope: 'col', text: '총점' }));
    head.appendChild(el('th', { scope: 'col', text: '이수' }));
    head.appendChild(el('th', { scope: 'col', text: '제출 시각' }));

    var body = merged.rows.map(function (item) {
      var r = item.record;
      var tr = el('tr', { 'class': r ? '' : 'is-missing' }, [
        el('th', { scope: 'row', text: item.studentId || '-' }),
        el('td', {
          text: (item.name || '-') + (merged.hasRoster && !item.inRoster ? ' (명단 밖)' : '')
        })
      ]);

      if (!r) {
        // 제출하지 않은 학생 — 문항 칸을 통째로 묶어 「미제출」이라고 적는다.
        tr.appendChild(
          el('td', {
            'class': 't-missing',
            colSpan: A.QUESTION_IDS.length + 3,
            text: '미제출',
            attrs: { 'aria-label': (item.name || item.studentId) + ' 미제출' }
          })
        );
        return tr;
      }

      r.items.forEach(function (answer) {
        var symbol = A.markSymbol(answer);
        tr.appendChild(
          el('td', {
            'class':
              't-mark ' + (symbol === '○' ? 'is-o' : symbol === '✕' ? 'is-x' : 'is-none'),
            text: symbol,
            attrs: { 'aria-label': answer.no + '번 ' + A.markLabel(answer) }
          })
        );
      });
      tr.appendChild(el('td', { 'class': 't-score', text: r.score + '점' }));
      tr.appendChild(el('td', { text: r.passed ? '이수' : '미이수' }));
      tr.appendChild(
        el('td', { text: r.receivedAt ? r.receivedAt.replace('T', ' ').slice(0, 16) : '-' })
      );
      return tr;
    });

    box.body.appendChild(
      // 좁은 화면에서는 표만 옆으로 밀린다. 키보드로도 밀 수 있게 초점을 받게 한다.
      el(
        'div',
        {
          'class': 't-table-wrap',
          attrs: {
            tabindex: '0',
            role: 'region',
            'aria-label': '전체 명단 표 (좌우로 밀어서 볼 수 있어요)'
          }
        },
        [
          el('table', { 'class': 'data-table t-list-table' }, [
            el('caption', { 'class': 'sr-only', text: '형성평가 제출 학생 전체 명단과 문항별 정오표' }),
            el('thead', {}, [head]),
            el('tbody', {}, body)
          ])
        ]
      )
    );

    box.body.appendChild(
      ui.buttonRow([
        ui.button({
          label: '🖨 이 표 인쇄하기',
          variant: 'primary',
          onClick: function () {
            stampPrintDate();
            window.print();
          }
        }),
        ui.button({ label: '⬇ CSV 로 내려받기', variant: 'secondary', onClick: downloadCsv })
      ])
    );
    box.body.appendChild(
      el('p', {
        'class': 'panel__hint no-print',
        text:
          '인쇄하면 지금 보고 있는 탭만 나옵니다. 인쇄 창에서 「머리글/바닥글」을 끄면 ' +
          '브라우저가 장마다 넣는 날짜와 주소가 사라져 깔끔합니다.'
      })
    );

    return box.root;
  }

  function downloadCsv() {
    var text = A.toCsv(view.records, view.roster);
    var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = el('a', { href: url, download: '반복제어_3차시_형성평가_결과.csv' });
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
    ui.toast('CSV 파일로 저장했어요.');
  }

  /* ================================================================== */
  /* ③ 정답표                                                            */
  /* ================================================================== */
  function buildKeyPanel() {
    var box = ui.panel({
      title: '📄 형성평가 정답표',
      hint: '5문항 · 각 2점 · 만점 10점 · 6점 이상 이수'
    });

    T.QUESTIONS.forEach(function (q) {
      var item = el('div', { 'class': 't-wrong__card' }, [
        el('p', { 'class': 't-wrong__rank', text: q.tag + ' · 2점' }),
        el('h3', { 'class': 't-wrong__title', text: q.no + '번' }),
        el('p', { 'class': 't-wrong__prompt', text: q.title })
      ]);
      if (q.code) item.appendChild(codeBlock(q.code, q.no + '번 문항 코드'));

      if (q.type === 'choice') {
        item.appendChild(
          el(
            'ul',
            { 'class': 't-options' },
            q.options.map(function (text, i) {
              return el('li', { 'class': 't-option' + (i + 1 === q.answer ? ' is-answer' : '') }, [
                el('span', { 'class': 't-option__num', text: '①②③④⑤'.charAt(i) }),
                el('span', { 'class': 't-option__text', text: text }),
                i + 1 === q.answer
                  ? el('span', { 'class': 't-option__count', text: '정답' })
                  : null
              ]);
            })
          )
        );
      } else {
        item.appendChild(
          el('div', { 'class': 't-explain' }, [
            el('p', { 'class': 't-explain__label', text: '정답 (세 줄 모두 맞아야 2점)' }),
            codeBlock(
              ['count = 1'].concat(
                q.answerLines.map(function (line, i) {
                  return i === 0 ? line : '    ' + line;
                })
              ).concat(['print("응원 완료!")']),
              '5번 정답 코드'
            ),
            el('p', {
              html:
                '<code>count = count + 1</code> 도 <code>count += 1</code> 과 같은 뜻이므로 정답으로 인정합니다. ' +
                '공백 차이는 채점에 영향을 주지 않습니다.'
            })
          ])
        );
      }

      item.appendChild(
        el('div', { 'class': 't-explain' }, [
          el('p', { 'class': 't-explain__label', text: '해설' }),
          el('p', { html: q.explain }),
          el('p', {
            'class': 't-explain__label',
            style: { marginTop: '10px' },
            text: '틀렸을 때 돌아갈 화면'
          }),
          el('p', { text: q.relatedStep }),
          el('p', { 'class': 't-explain__label', style: { marginTop: '10px' }, text: '평가 요소' }),
          el('p', { text: q.point })
        ])
      );

      var guide = T.questionGuide(q.no);
      if (guide) {
        item.appendChild(
          el('div', { 'class': 't-teach' }, [
            el('p', { html: '<strong>💡 지도 포인트</strong>' }),
            el('p', { text: '자주 나오는 오답 — ' + guide.watch }),
            el('p', { text: '왜 그럴까요 — ' + guide.why }),
            el('p', { text: '수업에서 — ' + guide.tip })
          ])
        );
      }
      box.body.appendChild(item);
    });

    return box.root;
  }

  /* ================================================================== */
  /* ④ 수업 지도 자료                                                     */
  /* ================================================================== */
  /** 「흔한 생각 → 이렇게 바로잡기」 한 줄 */
  function misconceptionRow(item) {
    return el('li', { 'class': 't-explain' }, [
      el('p', { 'class': 't-explain__label', text: '흔한 생각' }),
      el('p', { html: item.wrong }),
      el('p', { 'class': 't-explain__label', style: { marginTop: '8px' }, text: '이렇게 바로잡기' }),
      el('p', { html: item.right })
    ]);
  }

  function buildGuidePanel() {
    var wrap = el('div', { 'class': 'stack stack--lg' });

    /* --- 오늘 꼭 잡아야 할 오개념 --- */
    var topBox = ui.panel({
      title: '🧭 오늘 꼭 잡아야 할 세 가지',
      hint: '이번 차시 전체를 관통하는 오개념입니다. 수업을 마칠 때 다시 한 번 짚어 주세요.'
    });
    topBox.body.appendChild(
      el(
        'ul',
        { 'class': 'stack' },
        T.COMMON_MISCONCEPTIONS.map(function (item) {
          var li = misconceptionRow(item);
          li.appendChild(
            el('p', {
              'class': 'panel__hint',
              text:
                '관련 화면 : ' +
                item.screens
                  .map(function (n) {
                    return '화면 ' + n;
                  })
                  .join(' · ')
            })
          );
          return li;
        })
      )
    );
    topBox.body.appendChild(
      el('p', {
        'class': 'panel__hint',
        text:
          '형성평가 채점 기준 : 5문항 × ' + T.POINT_PER_ITEM + '점 = ' + T.MAX_SCORE + '점 만점, ' +
          T.PASS_SCORE + '점 이상 이수. 예상 학습 시간 45~50분.'
      })
    );
    wrap.appendChild(topBox.root);

    /* --- 오답이 많을 때의 처방 --- */
    var fixBox = ui.panel({
      title: '📌 오답이 많은 문항별 처방',
      hint: '분석 탭에서 오답률이 높게 나온 문항을 찾아 여기에서 방법을 확인하세요.'
    });
    T.TEACHING_NOTES.forEach(function (note) {
      fixBox.body.appendChild(
        el('div', { 'class': 't-wrong__card' }, [
          el('p', { 'class': 't-wrong__rank', text: note.when }),
          el('h3', { 'class': 't-wrong__title', text: note.title }),
          el('p', { html: note.how })
        ])
      );
    });
    wrap.appendChild(fixBox.root);

    /* --- 화면 1~6 지도 자료 --- */
    T.SCREEN_GUIDE.forEach(function (guide) {
      var box = ui.panel({
        title: '화면 ' + guide.step + ' · ' + guide.title,
        hint: guide.focus
      });

      box.body.appendChild(ui.sectionTitle('지도', '이렇게 진행해 주세요'));
      box.body.appendChild(bulletList(guide.points));

      box.body.appendChild(ui.sectionTitle('오개념', '학생이 자주 갖는 생각'));
      box.body.appendChild(
        el('ul', { 'class': 'stack' }, guide.misconceptions.map(misconceptionRow))
      );

      box.body.appendChild(ui.sectionTitle('발문', '이렇게 물어보세요'));
      box.body.appendChild(bulletList(guide.asks));

      wrap.appendChild(box.root);
    });

    wrap.appendChild(
      el('div', { 'class': 't-teach' }, [
        el('p', {
          html:
            '<strong>다음 차시 연결</strong> — 조건문과 반복문을 함께 사용하는 문제로 이어집니다. ' +
            '오늘 무한 반복을 다뤄 본 경험을 「조건이 언제 False 가 되는가」로 되짚어 주면 자연스럽게 연결됩니다.'
        })
      ])
    );
      return wrap;
  }

/* ================================================================== */
  /* 시작                                                                */
  /* ================================================================== */

  /**
   * 콘솔에서 답안 배열을 바로 넣어 볼 수 있는 통로.
   * 파일 고르기가 막힌 환경(원격 수업 화면 공유 등)에서 확인할 때 쓴다.
   *   L.teacher.loadRecords([{...}, {...}])
   */
  T.loadRecords = function (list, headline) {
    applyRecords(list || [], headline || '직접 넣은 자료입니다.');
    return view.records.length + '명의 답안을 불러왔습니다.';
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount, { once: true });
  } else {
    mount();
  }
})();
    </script>
  </body>
</html>
