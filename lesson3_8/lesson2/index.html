   * silent = true 면 «읽어 주는» 안내(피드백)는 띄우지 않는다.
   * 화면에 들어오자마자 안내가 뜨면 「5단계로 이동했습니다」 안내를 덮어쓰기 때문이다.
   */
  function restoreDone(key, silent) {
    var result = O.methodResult(key);
    var m = O.methodChoice(key);
    if (!result) return;
    paintElements(O.checkMethod(key, st().picks[key] || {}));
    refs.methodConsole.clear();
    result.output.forEach(function (line) {
      refs.methodConsole.write(line);
    });
    if (silent) return;
    refs.methodFeedback.show(
      'success',
      '<strong>' + ui.escapeHtml(m ? m.label : '') + '</strong> 메소드는 이미 완성했어요. ' +
        '조각을 바꾸면 완료 표시가 지워지고 다시 확인해야 해요.',
      '✅'
    );
  }

  /** 명세 10.2 : 「완성한 메소드 n / 3」 과 남은 메소드 이름 */
  function paintMethodProgress() {
    if (!refs.methodProgress) return;
    var left = L.state.methodsLeft();
    var total = O.METHOD_CHOICES.length;
    var text =
      '완성한 메소드 ' + (total - left.length) + ' / ' + total + '개' +
      (left.length
        ? ' · 남은 메소드 : ' +
          left
            .map(function (m) {
              return m.label;
            })
            .join(' · ')
        : ' — 세 가지를 모두 완성했어요.');
    // 내용이 그대로면 다시 쓰지 않는다. 같은 문장을 반복해서 읽어 주지 않도록.
    if (refs.methodProgress.textContent !== text) refs.methodProgress.textContent = text;
    refs.methodProgress.classList.toggle('is-ok', left.length === 0);
  }

  function checkMethodNow() {
    var key = st().method;
    if (!key) return;
    var check = O.checkMethod(key, st().picks[key] || {});
    if (check.ok) st().methodDone[key] = true;
    else delete st().methodDone[key];
    L.state.markChanged();
    paintElements(check);
    paintMethod();

    if (check.ok) {
      var result = O.methodResult(key);
      var m = O.methodChoice(key);
      var left = L.state.methodsLeft();
      refs.methodFeedback.show(
        'success',
        '<strong>' + ui.escapeHtml(m ? m.label : '') + '</strong> 메소드를 완성했어요! 실행하면 <code>' +
          ui.escapeHtml(result.output.join(' / ')) +
          '</code> 가 출력됩니다.<br />' +
          (left.length
            ? '남은 메소드 <strong>' + left.length + '개</strong> — ' +
              left
                .map(function (x) {
                  return ui.escapeHtml(x.label);
                })
                .join(' · ') +
              ' 도 완성하면 다음 단계로 넘어갈 수 있어요.'
            : '<strong>세 메소드를 모두 완성했어요.</strong> 이제 다음 단계로 넘어갈 수 있어요.'),
        left.length ? '🎉' : '🏆'
      );
      refs.methodConsole.clear();
      result.output.forEach(function (line) {
        refs.methodConsole.write(line);
      });
      ui.toast(
        left.length ? (m ? m.label : '메소드') + ' 완성! 남은 메소드 ' + left.length + '개' : '세 메소드를 모두 완성했어요.'
      );
      // 피드백 영역이 aria-live 로 같은 내용을 이미 읽어 준다. 중복 낭독을 만들지 않는다.
      return;
    }

    var okCount = check.elements.filter(function (e) {
      return e.ok;
    }).length;
    refs.methodFeedback.show(
      'warning',
      '<strong>' + O.METHOD_ELEMENTS.length + '개 요소 중 ' + okCount + '개</strong>를 갖췄어요.<br />' +
        (check.problems.length
          ? check.problems
              .map(function (why) {
                return '· ' + why;
              })
              .join('<br />')
          : '아래 목록에서 ✕ 표시된 요소를 다시 확인해 보세요.')
    );
    ui.announce('아직 고칠 부분이 있어요.');
  }

  function buildMethod(body) {
    refs.methodCards = [];
    var grid = el('div', { 'class': 'mchoice' });
    O.METHOD_CHOICES.forEach(function (m) {
      var card = el('button', {
        type: 'button',
        'class': 'mchoice__card',
        dataset: { key: m.key },
        attrs: { 'aria-pressed': 'false', 'aria-label': m.label + ' 메소드 ' + m.name + ' 고르기' }
      }, [
        el('span', { 'class': 'mchoice__head' }, [
          el('span', { 'class': 'mchoice__icon', text: m.icon, attrs: { 'aria-hidden': 'true' } }),
          // 명세 10.2 · 21장 : 완료 여부를 색이 아니라 «글자»로도 알 수 있게 한다.
          el('span', { 'class': 'mchoice__state', text: '아직' })
        ]),
        el('span', { 'class': 'mchoice__name', text: m.label }),
        el('code', { 'class': 'mchoice__code', text: 'def ' + m.name + '(self):' }),
        el('span', { 'class': 'mchoice__desc', text: m.desc })
      ]);
      card.addEventListener('click', function () {
        if (st().method !== m.key) {
          st().method = m.key;
          // 메소드마다 고른 조각을 따로 보관하므로 다른 메소드의 진행 상황은 지우지 않는다.
          if (!st().picks[m.key]) st().picks[m.key] = {};
          L.state.markChanged();
          refs.methodFeedback.clear();
          refs.methodConsole.clear();
          refs.methodElements.hidden = true;
        }
        paintMethod();
        // 이미 완성한 메소드를 다시 고르면 확인 결과와 실행 결과를 되살린다.
        if (st().methodDone[m.key]) restoreDone(m.key);
      });
      grid.appendChild(card);
      refs.methodCards.push(card);
    });
    body.appendChild(grid);

    refs.methodProgress = el('p', {
      'class': 'mprogress',
      attrs: { role: 'status', 'aria-live': 'polite' }
    });
    body.appendChild(refs.methodProgress);

    // 왼쪽에 «내가 만든 코드»(결과), 오른쪽에 «조각 고르기»(조작)를 둔다.
    // 다른 화면들과 같이 코드가 왼쪽 넓은 칸에 오도록 자리를 맞췄다.
    var layout = ui.split({ className: 'split--wide-left' });
    refs.slotBox = el('div', { 'class': 'stack' });
    refs.methodNote = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });

    refs.methodPreview = el('div', { 'class': 'stack' });
    refs.methodElements = el('div', { 'class': 'stack' });
    refs.methodElements.hidden = true;
    refs.methodConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '자동 확인을 통과하면 실행 결과가 나타나요.',
      ariaLabel: '새 메소드 실행 결과'
    });
    refs.methodFeedback = ui.createFeedback({
      emptyText: '세 자리를 고른 뒤 [자동 확인] 을 눌러 보세요.'
    });
    layout.left.appendChild(refs.methodPreview);
    layout.left.appendChild(refs.methodElements);
    layout.left.appendChild(refs.methodConsole.root);
    layout.left.appendChild(refs.methodFeedback.root);
    layout.right.appendChild(refs.slotBox);
    layout.right.appendChild(refs.methodNote);
    body.appendChild(layout.root);

    refs.btnCheckMethod = ui.button({ label: '자동 확인', onClick: checkMethodNow, disabled: true });
    body.appendChild(
      ui.buttonRow([
        refs.btnCheckMethod,
        ui.button({
          label: '고른 조각 지우기',
          variant: 'ghost',
          onClick: function () {
            var key = st().method;
            if (!key) return;
            // 지금 고른 메소드의 조각만 지운다. 다른 메소드의 완성 기록은 그대로 둔다.
            st().picks[key] = {};
            delete st().methodDone[key];
            L.state.markChanged();
            refs.methodFeedback.clear();
            refs.methodConsole.clear();
            refs.methodElements.hidden = true;
            paintMethod();
          }
        })
      ])
    );
    body.appendChild(
      ui.callout(
        '<strong>자동 확인은 여러분이 입력한 파이썬을 실행하지 않습니다.</strong> ' +
          '고른 조각이 <code>def 메소드명(self):</code> · 클래스 안 들여쓰기 · 본문 한 단계 더 들여쓰기 · ' +
          '<code>self.속성</code> 사용 · 호출문의 소괄호를 갖추었는지 <strong>구조만</strong> 살펴봅니다.<br />' +
          '<strong>세 메소드를 각각 확인</strong>하며, 통과한 메소드에는 <strong>완료 ○</strong> 표시가 남습니다.',
        { muted: true }
      )
    );
  }

  /* ------------------------------------------------------------------ */
  /* ④ 형성평가 대비 미니 활동 (명세 10.4)                                     */
  /* ------------------------------------------------------------------ */
  function buildMini(body) {
    body.appendChild(
      L.codeview.createCodeView({
        title: '주어진 클래스',
        showLineNumbers: false,
        ariaLabel: '연습용 StudentCard 클래스',
        lines: [
          { code: 'class StudentCard:' },
          { code: '    owner = "이름 없음"' },
          { code: '' },
          { code: '    def show(self):' },
          { code: '        print(f"학생증 주인: {self.owner}")' }
        ]
      }).root
    );
    body.appendChild(
      el('ul', { 'class': 'hint-list' }, [
        el('li', { html: '<code>StudentCard</code> 클래스로 <code>card1</code> 객체를 생성한다.' }),
        el('li', { html: '<code>card1</code> 의 주인을 <code>"하린"</code> 으로 바꾼다.' }),
        el('li', { html: '<code>card1</code> 의 <code>show()</code> 메소드를 호출한다.' })
      ])
    );

    refs.miniInputs = [];
    [0, 1, 2].forEach(function (i) {
      var input = el('input', {
        type: 'text',
        'class': 'codeinput__field',
        id: 'step5-mini-' + i,
        value: st().mini[i] || '',
        maxLength: QUIZ.MAX_LINE_LEN,
        attrs: {
          spellcheck: 'false',
          autocomplete: 'off',
          'aria-label': i + 1 + '번째 줄 코드 입력',
          placeholder: '예) ' + ['객체를 만드는 줄', '주인을 바꾸는 줄', '메소드를 호출하는 줄'][i]
        }
      });
      input.addEventListener(
        'input',
        ui.debounce(function () {
          st().mini[i] = input.value;
          st().miniOk = false;
          input.classList.remove('is-ok');
          L.state.markChanged();
        }, 300)
      );
      refs.miniInputs.push(input);
      body.appendChild(
        el('div', { 'class': 'codeinput' }, [
          el('label', { 'class': 'codeinput__no', text: i + 1 + '번째', htmlFor: 'step5-mini-' + i }),
          input
        ])
      );
    });

    body.appendChild(
      ui.buttonRow([
        ui.button({
          label: '코드 확인하기',
          onClick: function () {
            var lines = refs.miniInputs.map(function (input) {
              return input.value;
            });
            st().mini = lines;
            // 미니 활동은 «학생증» 규격으로 채점한다. 형성평가 5번은 도서 대출이므로 규격이 다르다(명세 10.4).
            var check = QUIZ.checkCode(lines, QUIZ.PRACTICE_SPEC);
            st().miniOk = check.ok;
            L.state.markChanged();

            refs.miniInputs.forEach(function (input) {
              input.classList.toggle('is-ok', check.ok);
            });

            if (check.ok) {
              refs.miniFeedback.show(
                'success',
                '세 줄을 모두 바르게 입력했어요. 실행하면 <code>학생증 주인: 하린</code> 이 출력됩니다.' +
                  (L.state.canProceed(5)
                    ? '<br />이제 <strong>다음 단계</strong>로 넘어갈 수 있어요.'
                    : '<br />남은 활동을 마치면 다음 단계로 넘어갈 수 있어요.'),
                '🎉'
              );
              ui.toast('코드 완성!');
            } else {
              refs.miniFeedback.show(
                'warning',
                '<strong>' + check.total + '개 요소 중 ' + check.matched + '개</strong>를 충족했어요.<br />' +
                  check.feedback
                    .map(function (line) {
                      return '· ' + ui.escapeHtml(line);
                    })
                    .join('<br />')
              );
            }
            ui.announce(check.ok ? '코드를 완성했어요.' : '아직 고칠 부분이 있어요.');
          }
        })
      ])
    );
    refs.miniFeedback = ui.createFeedback({
      emptyText: '세 줄을 입력한 뒤 [코드 확인하기] 를 눌러 보세요.'
    });
    body.appendChild(refs.miniFeedback.root);
    body.appendChild(
      el('p', {
        'class': 'obj-note',
        text:
          '이 활동은 화면 6 형성평가 5번(도서 대출)을 준비하는 연습이에요. ' +
          '평가에서는 소재가 달라지고 답을 미리 채워 주지 않습니다. ' +
          '세 줄(객체 생성 · 주인 변경 · 메소드 호출)을 모두 맞혀야 다음 단계가 열립니다.'
      })
    );
  }

  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 5,
        title: C.STEP_TITLES[5],
        lead: [
          '같은 클래스로 만든 객체라도 <strong>각자의 속성값을 독립적으로</strong> 유지합니다. ' +
            '코드를 한 줄씩 실행하며 직접 확인해 봅시다.',
          '확인이 끝나면 <code>Phone</code> 클래스에 <strong>새 메소드 세 가지</strong>' +
            '(<code>charge</code> · <code>take_photo</code> · <code>show_info</code>)를 차례로 추가해 봅니다.'
        ]
      })
    );

    // 명세 10.0 : 프로그램 전체를 «먼저» 읽고 → 예측 → 시뮬레이션 순서로 배치한다.
    var predict = ui.panel({
      title: '① 프로그램 읽고 최종 색상 예측하기',
      hint:
        '먼저 아래 <strong>프로그램 전체</strong>를 읽어 보세요. ' +
        '그다음 <code>phone1.color = "red"</code> 를 실행하기 <strong>전에</strong> 최종 색상을 예측합니다.'
    });
    buildPredict(predict.body);
    root.appendChild(predict.root);

    var trace = ui.panel({
      title: '② 객체 독립성 실험',
      hint: '한 줄씩 실행하며 <strong>어느 객체가 바뀌는지</strong> 카드로 확인하세요.'
    });
    buildTrace(trace.body);
    root.appendChild(trace.root);

    var method = ui.panel({
      title: '③ 새 메소드 추가하고 자동 확인',
      hint:
        '<strong>세 가지를 모두</strong> 완성해야 다음 단계로 넘어갈 수 있어요. ' +
        '하나를 고른 뒤 <strong>정의 줄 · 본문 줄 · 호출 줄</strong>을 각각 고르고 [자동 확인] 을 누르세요.'
    });
    buildMethod(method.body);
    root.appendChild(method.root);

    var mini = ui.panel({
      title: '④ 형성평가 대비 미니 활동',
      hint:
        '학생증 클래스로 <strong>세 줄</strong>을 직접 입력해 보세요. ' +
        '<strong>이 활동까지 마쳐야 다음 단계로 넘어갈 수 있어요.</strong>'
    });
    buildMini(mini.body);
    root.appendChild(mini.root);

    paintPredict();
    paintTrace();
    paintMethod();
  }

  function onEnter() {
    paintPredict();
    paintTrace();
    paintMethod();
    if (refs.miniInputs) {
      refs.miniInputs.forEach(function (input, i) {
        input.value = st().mini[i] || '';
        input.classList.toggle('is-ok', Boolean(st().miniOk));
      });
    }
    if (st().traceDone && refs.traceFeedback) finishTrace();
    // 화면에 들어오는 순간에는 안내를 «읽어 주지» 않는다(단계 이동 안내를 덮지 않도록).
    if (st().method && st().methodDone[st().method]) restoreDone(st().method, true);
  }

  L.registerStep(5, {
    title: C.STEP_TITLES[5],
    short: C.STEP_SHORTS[5],
    render: render,
    onEnter: onEnter
  });
})();
    </script>
    <script data-from="js/65-step6.js">
/**
 * 화면 6 — 형성평가 및 학습 정리 (명세 11장 · 12장 · 13장)
 *
 *   ① 형성평가 (왼쪽) + 채점·제출 진행 상황 · 피드백 (오른쪽)
 *   ② 채점 결과 및 해설
 *   ③ 학습 정리 (문장 완성 · 핵심어)
 *   ④ 마무리 (다음 차시 예고 · 기록 내려받기)
 *
 *   · 문항 · 정답 · 해설은 45-quiz.js(문항 은행) 하나만 본다.
 *   · 5문항에 모두 답하기 전에는 정답과 해설을 절대 노출하지 않는다(명세 1.2 · 11.1).
 *   · 학번·이름이 없어도 학습·채점·해설·재도전이 모두 가능하다(명세 11.2).
 *   · 제출 실패가 채점을 막지 않는다(명세 11.8).
 *   · 학생이 입력한 코드는 실행하지 않고, 화면에는 textContent 로만 넣는다(명세 22장).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var QUIZ = L.quiz;

  var CIRCLED = '①②③④⑤';

  /** ③ 학습 정리 — 문장 완성 (명세 11.10) */
  var WRAP_UP = [
    {
      key: 'a1',
      before: '객체는 「클래스명()」 형식으로 ',
      after: ' 한다.',
      accepted: ['생성', '만들기', '만든다', '생성한다']
    },
    {
      key: 'a2',
      before: '객체의 속성에는 「객체이름.',
      after: '」 형식으로 접근한다.',
      accepted: ['속성이름', '속성명', '속성']
    },
    {
      key: 'a3',
      before: 'self 는 메소드를 ',
      after: ' 객체 자신을 가리킨다.',
      accepted: ['호출한', '실행한', '부른', '호출하는']
    }
  ];

  /** 명세 11.10 : 핵심어 */
  var KEYWORDS = [
    ['class', '클래스를 선언하는 명령어 (소문자)'],
    ['객체 생성', '클래스명() 을 실행해 새 객체를 만드는 것'],
    ['점 표기법', '객체이름.속성이름 · 객체이름.메소드이름()'],
    ['속성 사용·변경', '점 표기법으로 값을 읽거나 대입하는 것'],
    ['메소드', '클래스 안에 def 로 정의한 함수'],
    ['def', '메소드를 정의하는 명령어'],
    ['self', '메소드를 호출한 객체 자신 (파이썬이 자동 전달)'],
    ['메소드 호출', '소괄호를 붙여 기능을 실제로 실행하는 것'],
    ['객체의 독립성', '한 객체의 변경이 다른 객체에 영향을 주지 않음']
  ];

  var NEXT_LESSON = '반려동물 클래스를 설계하고 여러 객체를 활용한 생활 문제 해결 프로그램을 만듭니다.';

  var refs = {};

  /**
   * 명세 11.8 : 제출이 실패했을 때 학생이 [채점 계속하기] 를 고르면 채점을 열어 준다.
   * (제출 장애가 학습을 막아서는 안 된다)
   */
  var gradeUnlocked = false;

  function st() {
    return L.state.appState.step6;
  }

  /* ------------------------------------------------------------------ */
  /* 판정                                                                 */
  /* ------------------------------------------------------------------ */
  /** 5번에서 «세 줄을 다 썼지만 순서가 어긋난» 경우인가 (명세 11.7) */
  function orderProblem(q, d) {
    if (!q || q.type !== 'code' || !d || !d.codeErrors) return false;
    return d.codeErrors.indexOf(q.codeSpec.errorOrder) !== -1;
  }

  function verdictOf(score) {
    if (score >= QUIZ.MAX_SCORE) return { icon: '🎉', text: '만점이에요. 오늘 배운 내용을 정확히 이해했습니다.' };
    if (score >= QUIZ.PASS_SCORE) return { icon: '✅', text: '이수 기준(6점)을 넘었어요. 틀린 문항만 다시 확인해 보세요.' };
    return { icon: '💪', text: '아직 미이수예요. 아래 해설과 보충 화면으로 다시 확인해 보세요.' };
  }

  function studentLabel() {
    var id = String(st().student.id || '').trim();
    var name = String(st().student.name || '').trim();
    if (!id && !name) return '';
    return (id ? '학번 ' + id : '') + (id && name ? ' · ' : '') + (name ? '이름 ' + name : '');
  }

  function validStudent() {
    var id = String(st().student.id || '').trim();
    var name = String(st().student.name || '').trim();
    if (!/^[0-9]{3,10}$/.test(id)) return '학번을 숫자 3~10자리로 입력해 주세요.';
    if (!name) return '이름을 입력해 주세요.';
    if (name.length > 20) return '이름은 20자 이내로 입력해 주세요.';
    return '';
  }

  /* ------------------------------------------------------------------ */
  /* 응시자 정보 카드 (명세 11.2)                                            */
  /* ------------------------------------------------------------------ */
  function studentField(opts) {
    var input = el('input', {
      type: 'text',
      'class': 'student-field__input',
      id: opts.id,
      value: opts.value || '',
      maxLength: opts.maxLength,
      attrs: {
        inputmode: opts.inputmode || undefined,
        autocomplete: 'off',
        placeholder: opts.placeholder || '',
        'aria-label': opts.label
      }
    });
    input.addEventListener(
      'input',
      ui.debounce(function () {
        opts.onInput(input.value);
        updateStudentUI();
      }, 300)
    );
    return {
      input: input,
      root: el('div', { 'class': 'student-field' }, [
        el('label', { 'class': 'student-field__label', text: opts.label, htmlFor: opts.id }),
        input
      ])
    };
  }

  function buildStudentCard(container) {
    var idField = studentField({
      id: 'step6-student-id',
      label: '학번 (숫자 3~10자리)',
      inputmode: 'numeric',
      maxLength: 10,
      placeholder: '예) 10101',
      value: st().student.id || '',
      onInput: function (v) {
        st().student.id = v.replace(/[^0-9]/g, '');
        L.state.markChanged();
      }
    });
    var nameField = studentField({
      id: 'step6-student-name',
      label: '이름 (20자 이내)',
      maxLength: 20,
      placeholder: '예) 김정보',
      value: st().student.name || '',
      onInput: function (v) {
        st().student.name = v;
        L.state.markChanged();
      }
    });
    refs.idField = idField;
    refs.nameField = nameField;

    refs.studentNote = el('p', { 'class': 'student-card__note', attrs: { 'aria-live': 'polite' } });
    refs.studentCard = el('div', { 'class': 'student-card' }, [
      el('div', { 'class': 'student-card__head' }, [
        el('span', { 'class': 'student-card__title', text: '👤 응시자 정보' }),
        el('span', { 'class': 'student-card__badge', text: '선택 · 제출할 때만 필요' })
      ]),
      el('div', { 'class': 'student-card__fields' }, [idField.root, nameField.root]),
      refs.studentNote,
      el('p', {
        'class': 'student-card__privacy',
        text:
          '학번과 이름은 이 기기에 저장되며, 선생님께 답안을 제출할 때만 함께 전송됩니다. ' +
          '비워 두어도 학습 · 채점 · 해설 · 다시 풀기 · 기록 내려받기는 모두 할 수 있어요.'
      })
    ]);
    container.appendChild(refs.studentCard);
    updateStudentUI();
  }

  function updateStudentUI() {
    if (!refs.studentCard) return;
    var problem = validStudent();
    var label = studentLabel();
    refs.studentCard.classList.toggle('is-ready', !problem);
    refs.studentNote.classList.toggle('is-ok', !problem);
    if (!problem) refs.studentNote.textContent = '✓ ' + label + ' — 답안을 제출할 수 있어요.';
    else if (!label) refs.studentNote.textContent = '';
    else refs.studentNote.textContent = '! ' + problem;
  }

  /* ------------------------------------------------------------------ */
  /* ① 형성평가 문항 (한 번에 한 문항 · 명세 11.1)                            */
  /* ------------------------------------------------------------------ */
  function currentQuestion() {
    return QUIZ.QUESTIONS[st().index] || QUIZ.QUESTIONS[0];
  }

  function buildDots() {
    ui.clear(refs.quizDots);
    QUIZ.QUESTIONS.forEach(function (q, i) {
      var answered = QUIZ.isAnswered(q, st().answers[q.id]);
      refs.quizDots.appendChild(
        el('button', {
          type: 'button',
          'class':
            'quiz__dot' + (answered ? ' is-answered' : '') + (i === st().index ? ' is-current' : ''),
          attrs: {
            'aria-label': i + 1 + '번 문항으로 이동. ' + (answered ? '응답함' : '미응답'),
            title: i + 1 + '번 문항'
          },
          on: {
            click: function () {
              st().index = i;
              L.state.markChanged();
              renderQuestion();
            }
          }
        })
      );
    });
  }

  function renderQuestion() {
    var q = currentQuestion();
    var total = QUIZ.QUESTIONS.length;
    var index = st().index;
    var answers = st().answers || {};
    var locked = Boolean(st().submitLocked);

    refs.quizCounter.textContent = '문항 ' + (index + 1) + ' / ' + total;
    buildDots();

    ui.clear(refs.quizBody);
    if (!q) return;

    refs.quizBody.appendChild(
      el('div', { 'class': 'quiz__tags' }, [
        ui.badge('primary', q.category),
        ui.badge('primary', q.typeLabel),
        ui.badge('primary', q.points + '점')
      ])
    );
    refs.quizBody.appendChild(
      el('p', { 'class': 'quiz__question' }, [
        el('span', { 'class': 'quiz__no', text: '문항 ' + (index + 1) + '.' }),
        el('span', { text: ' ' + q.title })
      ])
    );
    refs.quizBody.appendChild(el('p', { 'class': 'quiz-context pre-line', text: q.context }));

    if (q.code) {
      refs.quizBody.appendChild(
        L.codeview.createCodeView({
          lines: q.code.split('\n').map(function (line) {
            return { code: line };
          }),
          showLineNumbers: false,
          ariaLabel: '문항 파이썬 코드'
        }).root
      );
    }
    if (q.codeHead) {
      refs.quizBody.appendChild(
        L.codeview.createCodeView({
          title: '주어진 클래스',
          lines: q.codeHead.split('\n').map(function (line) {
            return { code: line };
          }),
          showLineNumbers: false,
          ariaLabel: '문항 준비 코드'
        }).root
      );
    }
    if (q.conditions) {
      refs.quizBody.appendChild(
        el(
          'ul',
          { 'class': 'hint-list' },
          q.conditions.map(function (text) {
            return el('li', { text: text });
          })
        )
      );
    }
    if (q.expected) {
      refs.quizBody.appendChild(
        el('div', { 'class': 'expected' }, [
          el('p', { 'class': 'expected__title', text: '기대 실행 결과' }),
          el('pre', { 'class': 'expected__body', text: q.expected.join('\n') })
        ])
      );
    }
    if (q.note) refs.quizBody.appendChild(el('p', { 'class': 'quiz-note', text: q.note }));
    refs.quizBody.appendChild(el('p', { 'class': 'bigq', text: q.prompt }));

    if (q.type === 'choice') renderChoices(q, answers, locked);
    else if (q.type === 'code') renderCodeAnswer(q, answers, locked);

    // 채점을 마친 뒤에만 정답과 해설을 보여 준다(명세 1.2 · 11.1).
    if (st().graded) {
      var given = answers[q.id];
      var state = QUIZ.stateAnswer(q, given);
      refs.quizBody.appendChild(reviewBox(q, given, state));
    }

    refs.btnPrevQ.disabled = index === 0;
    refs.btnNextQ.disabled = index === total - 1;
    updateQuizNote();
  }

  function afterAnswer() {
    L.state.markChanged();
    buildDots();
    updateQuizNote();
  }

  function answerFeedback(message) {
    var left = QUIZ.QUESTIONS.length - L.state.answeredCount();
    refs.feedback.show(
      'info',
      message +
        (left === 0
          ? ' 모든 문항에 답했어요. 이제 다음 단계로 넘어갈 수 있어요.'
          : ' 남은 문항 ' + left + '개예요.')
    );
  }

  /** 오지선다형 · 결과 선택형 */
  function renderChoices(q, answers, locked) {
    var buttons = [];
    var blocks = q.optionBlocks || null;

    refs.quizBody.appendChild(
      el(
        'div',
        { 'class': 'options', attrs: { role: 'group', 'aria-label': q.prompt } },
        q.options.map(function (text, i) {
          var selected = Number(answers[q.id]) === i + 1;
          var btn;
          if (blocks) {
            // 실행 결과 보기 — 여러 줄 출력을 그대로 보여 준다(명세 11.6).
            btn = el('button', {
              type: 'button',
              'class': 'outopt' + (selected ? ' is-selected' : ''),
              disabled: locked,
              attrs: { 'aria-label': CIRCLED[i] + '번 보기. ' + blocks[i].join(', ') }
            }, [
              el('span', { 'class': 'outopt__num', text: CIRCLED[i] }),
              el('pre', { 'class': 'outopt__body', text: blocks[i].join('\n') })
            ]);
          } else {
            btn = el('button', {
              type: 'button',
              'class': 'option' + (selected ? ' is-selected' : ''),
              disabled: locked
            }, [
              el('span', { 'class': 'option__num', text: CIRCLED[i] }),
              el('span', { 'class': 'option__text', text: text })
            ]);
          }
          btn.addEventListener('click', function () {
            st().answers[q.id] = i + 1;
            buttons.forEach(function (b, k) {
              b.classList.toggle('is-selected', k === i);
            });
            afterAnswer();
            answerFeedback('<strong>' + CIRCLED[i] + '</strong> 를 골랐어요.');
          });
          buttons.push(btn);
          return btn;
        })
      )
    );
  }

  /** 프로그램 직접 입력 — 세 줄의 개별 입력칸 (명세 27.1) */
  function renderCodeAnswer(q, answers, locked) {
    var stored = Array.isArray(answers[q.id]) ? answers[q.id] : ['', '', ''];
    var inputs = [];

    var box = el('div', { 'class': 'stack' });
    [0, 1, 2].forEach(function (i) {
      var input = el('input', {
        type: 'text',
        'class': 'codeinput__field',
        id: 'quiz-code-' + i,
        value: String(stored[i] || ''),
        disabled: locked,
        maxLength: QUIZ.MAX_LINE_LEN,
        attrs: {
          spellcheck: 'false',
          autocomplete: 'off',
          'aria-label': '입력 ' + (i + 1)
        }
      });
      input.addEventListener(
        'input',
        ui.debounce(function () {
          var cur = Array.isArray(st().answers[q.id]) ? st().answers[q.id] : ['', '', ''];
          cur[i] = input.value;
          st().answers[q.id] = cur;
          afterAnswer();
        }, 300)
      );
      inputs.push(input);
      box.appendChild(
        el('div', { 'class': 'codeinput' }, [
          el('label', { 'class': 'codeinput__no', text: '입력 ' + (i + 1), htmlFor: 'quiz-code-' + i }),
          input
        ])
      );
    });
    refs.quizBody.appendChild(box);
    // 이어지는 코드가 있는 문항에서만 보여 준다(이 차시 5번은 세 줄로 끝난다).
    if (q.codeTail) {
      refs.quizBody.appendChild(
        L.codeview.createCodeView({
          title: '이어지는 코드',
          showLineNumbers: false,
          ariaLabel: '이어지는 코드',
          lines: q.codeTail.split('\n').map(function (line) {
            return { code: line };
          })
        }).root
      );
    }
    refs.quizBody.appendChild(
      ui.buttonRow([
        ui.button({
          label: '입력 확인',
          variant: 'secondary',
          disabled: locked,
          onClick: function () {
            var cur = inputs.map(function (input) {
              return input.value;
            });
            st().answers[q.id] = cur;
            afterAnswer();
            // 채점 전이므로 «정답 여부»는 알려 주지 않고 입력한 줄 수만 알려 준다(명세 11.1).
            answerFeedback('<strong>' + QUIZ.codeLines(cur).length + '줄</strong>을 입력했어요.');
          }
        })
      ])
    );
  }

  /**
   * 명세 11.8 : 진행 순서는 «모두 응답 → 답안 제출 → 채점 → 결과·해설» 이다.
   *   · 제출 기능을 쓰는 수업에서는 제출을 마쳐야 [채점하기] 가 열린다.
   *   · 제출이 실패하면 [채점 계속하기] 로 채점을 열어 준다(제출 실패가 채점을 막지 않는다).
   */
  function updateQuizNote() {
    var total = QUIZ.QUESTIONS.length;
    var answered = L.state.answeredCount();
    var all = answered === total;
    var submitted = Boolean(st().submitted);
    var needSubmit = C.SUBMIT_ENABLED && !submitted && !gradeUnlocked;

    if (C.SUBMIT_ENABLED && refs.btnSubmit) {
      refs.btnSubmit.disabled = !all || submitted;
      refs.btnSubmit.textContent = submitted ? '제출 완료 ✓ (1회)' : '답안 제출하기';
      refs.btnSubmit.classList.toggle('btn--submitted', submitted);
      refs.btnSubmit.title = submitted
        ? '답안은 한 번만 제출할 수 있어요. 이미 제출을 마쳤습니다.'
        : all
        ? '답안을 선생님께 보냅니다.'
        : '5문항에 모두 답하면 제출할 수 있어요.';
    }
    refs.btnGrade.disabled = !all || needSubmit;
    refs.btnGrade.title = !all
      ? '5문항에 모두 답해 주세요.'
      : needSubmit
      ? '먼저 [답안 제출하기] 로 답안을 제출해 주세요.'
      : '';

    refs.quizNote.textContent =
      '응답 ' + answered + ' / ' + total + '개 · ' +
      (!all
        ? '5문항에 모두 답하면 채점할 수 있어요. (정답과 해설은 채점 뒤에 공개돼요)'
        : needSubmit
        ? '먼저 [답안 제출하기] 로 답안을 보낸 뒤 [채점하기] 를 누를 수 있어요.'
        : submitted
        ? '제출을 마쳤어요. 이제 [채점하기] 로 총점과 해설을 볼 수 있어요.'
        : '[채점하기] 를 누르면 총점과 해설을 볼 수 있어요.');

    paintSubmitNotice(all, submitted);
  }

  function paintSubmitNotice(all, submitted) {
    if (!refs.submitNotice) return;
    var box = refs.submitNotice;
    ui.clear(box);
    if (!C.SUBMIT_ENABLED) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    if (submitted) {
      box.className = 'submit-notice is-done';
      box.appendChild(
        el('p', {
          html:
            '✓ <strong>제출 완료</strong>' +
            (st().submitInfo.at ? ' — ' + ui.escapeHtml(st().submitInfo.at) : '') +
            '<br />이제 <strong>[채점하기]</strong> 로 결과를 확인하세요.'
        })
      );
      return;
    }
    box.className = 'submit-notice';
    box.appendChild(
      el('p', {
        html:
          '⚠ <strong>답안은 한 번만 제출할 수 있어요.</strong> 제출한 뒤에는 답을 고칠 수 없습니다.<br />' +
          (all
            ? '제출하려면 위쪽 <strong>응시자 정보</strong>(학번 · 이름)를 채운 뒤 <strong>[답안 제출하기]</strong> 를 누르세요.'
            : '5문항에 모두 답하면 <strong>[답안 제출하기]</strong> 가 열립니다.')
      })
    );
  }

  /** 명세 11.9 : 문항별 내 답 · 정답 · 해설 · 보충 화면 이동 */
  function reviewBox(q, given, state) {
    var mark = QUIZ.stateMark(state);
    var earned = QUIZ.scoreAnswer(q, given);
    var myText = QUIZ.answerToText(q, given);
    var rows = [
      el('dt', { text: '내 답' }),
      // 학생이 입력한 코드는 반드시 «글자»로만 넣는다(명세 11.7 · 22장).
      el('dd', { 'class': q.type === 'code' ? 'pre-line' : '', text: myText || '응답하지 않음' }),
      el('dt', { text: '정답' }),
      el('dd', { 'class': q.type === 'code' ? 'pre-line' : '', text: QUIZ.correctToText(q) })
    ];
    if (q.type === 'code' && state !== 'none') {
      var check = QUIZ.checkCode(given, q.codeSpec);
      rows.push(el('dt', { text: '충족한 요소' }));
      rows.push(
        el('dd', {
          text:
            check.total + '개 중 ' + check.matched + '개 — ' +
            check.steps
              .map(function (step) {
                return (step.ok ? '○' : '✕') + ' ' + step.label;
              })
              .join(' · ')
        })
      );
      if (check.feedback.length) {
        rows.push(el('dt', { text: '다시 볼 점' }));
        rows.push(
          el('dd', {
            html: check.feedback
              .map(function (line) {
                return ui.escapeHtml(line);
              })
              .join('<br />')
          })
        );
      }
    }
    rows.push(el('dt', { text: '해설' }));
    rows.push(el('dd', { html: q.explain }));

    var box = el('div', {
      'class':
        'quiz-review ' +
        (state === 'correct' ? 'is-correct' : state === 'partial' ? 'is-partial' : state === 'wrong' ? 'is-wrong' : '')
    }, [
      el('p', { 'class': 'quiz-review__head', text: mark + ' · ' + earned + ' / ' + q.points + '점' }),
      el('dl', { 'class': 'quiz-review__rows' }, rows)
    ]);
    if (q.type === 'code' && state !== 'correct') {
      box.appendChild(
        L.codeview.createCodeView({
          title: '모범 답안',
          showLineNumbers: false,
          ariaLabel: '모범 답안',
          lines: q.modelLines.map(function (line) {
            return { code: line };
          })
        }).root
      );
    }
    if (state !== 'correct') {
      box.appendChild(
        ui.linkLine({
          text:
            '이 문항은 <strong>화면 ' + (q.reviewSteps || [q.reviewStep]).join(' · ') + '</strong> 에서 다시 확인할 수 있어요.',
          label: '보충 화면으로 돌아가기',
          step: q.reviewStep
        })
      );
    }
    return box;
  }

  /* ------------------------------------------------------------------ */
  /* 채점 (명세 11.9)                                                       */
  /* ------------------------------------------------------------------ */
  function grade() {
    var result = QUIZ.grade(st().answers);
    st().graded = true;
    st().score = result.score;
    st().passed = result.passed;
    st().lastScore = result.score;
    st().attempts = (st().attempts || 0) + 1;
    if (st().bestScore === null || result.score > st().bestScore) st().bestScore = result.score;
    L.state.markChanged();

    refs.console.clear();
    refs.console.write(QUIZ.QUESTIONS.length + '문항 채점을 시작합니다.');
    result.details.forEach(function (d) {
      var q = QUIZ.byId(d.id);
      refs.console.write(
        d.id + '번 [' + q.category + '] ' +
          (d.state === 'correct'
            ? '정답 ○ +' + d.points + '점'
            : d.state === 'partial'
            ? '부분 정답 △ +' + d.points + '점'
            : d.state === 'wrong'
            ? '오답 ✕ 0점'
            : '미응답 − 0점') +
          (q.type === 'code' && d.matchedElements !== null
            ? ' (' + q.codeSpec.steps.length + '개 요소 중 ' + d.matchedElements + '개 충족' +
              (orderProblem(q, d) ? ' · 순서 오류' : '') + ')'
            : '')
      );
    });
    refs.console.write('총점 ' + result.score + ' / ' + result.maxScore + '점');
    refs.console.writeHint('판정 : ' + QUIZ.passLabel(result.score) + ' (6점 이상 이수)');

    renderResult(result);
    renderQuestion();
    applySections(true);
    refs.feedback.show(
      result.passed ? 'success' : 'warning',
      '채점을 마쳤어요. <strong>' + result.score + ' / ' + result.maxScore + '점</strong> · ' +
        QUIZ.passLabel(result.score) + '. 아래 <strong>② 채점 결과 및 해설</strong>을 확인해 보세요.',
      verdictOf(result.score).icon
    );
    ui.announce('채점을 마쳤어요. ' + result.score + '점, ' + QUIZ.passLabel(result.score) + '입니다.');
    ui.scrollToNode(refs.resultSection);
  }

  function applySections(graded) {
    if (refs.resultSection) refs.resultSection.hidden = !graded;
  }

  function accordionItem(opts) {
    var body = el('div', { 'class': 'accordion__body' });
    (opts.rows || []).forEach(function (row) {
      body.appendChild(
        el('dl', { 'class': 'accordion__row' }, [el('dt', { text: row[0] }), el('dd', { html: row[1] })])
      );
    });
    if (opts.extra) body.appendChild(opts.extra);

    var item = el('div', { 'class': 'accordion__item' + (opts.open ? ' is-open' : '') });
    var head = el('button', {
      type: 'button',
      'class': 'accordion__head',
      attrs: { 'aria-expanded': String(Boolean(opts.open)), 'aria-label': opts.title + ' 해설 펼치기/접기' },
      on: {
        click: function () {
          var next = !item.classList.contains('is-open');
          item.classList.toggle('is-open', next);
          head.setAttribute('aria-expanded', String(next));
        }
      }
    }, [
      el('span', { 'class': ('accordion__mark ' + (opts.markClass || '')).trim(), text: opts.mark }),
      el('span', { 'class': 'accordion__title', text: opts.title }),
      el('span', { 'class': 'accordion__chevron', text: '▾', attrs: { 'aria-hidden': 'true' } })
    ]);
    item.appendChild(head);
    item.appendChild(body);
    return item;
  }

  function renderResult(result) {
    var body = refs.resultBody;
    ui.clear(body);

    var dots = el(
      'div',
      { 'class': 'score-dots', attrs: { role: 'list', 'aria-label': '문항별 결과' } },
      result.details.map(function (d, i) {
        return el('span', {
          'class':
            'score-dot' +
            (d.state === 'correct' ? ' is-correct' : '') +
            (d.state === 'partial' ? ' is-partial' : ''),
          text: String(i + 1),
          attrs: {
            role: 'listitem',
            'aria-label':
              i + 1 + '번 문항 ' + QUIZ.stateMark(d.state).replace(/^[○△✕−]\s*/, ''),
            title: i + 1 + '번 ' + d.points + ' / ' + QUIZ.POINT + '점'
          }
        });
      })
    );

    var v = verdictOf(result.score);
    var label = studentLabel();
    body.appendChild(
      el('div', { 'class': 'score-card' }, [
        el('p', { 'class': 'score-card__title', text: '형성평가 결과' }),
        label ? el('p', { 'class': 'score-card__student', html: ui.escapeHtml(label) }) : null,
        el('p', { 'class': 'score-card__value' }, [
          el('span', { text: String(result.score) }),
          el('small', { text: ' 점 / ' + result.maxScore + ' 점' })
        ]),
        dots,
        el('p', {
          'class': 'score-card__count',
          text:
            '(' + result.correctCount + ' / ' + QUIZ.QUESTIONS.length + ' 문항 정답' +
            (result.partialCount ? ' · 부분 정답 ' + result.partialCount + '문항' : '') +
            ' · 1~4번 각 ' + QUIZ.POINT + '점 · 5번 ' + QUIZ.POINT + ' · ' + QUIZ.PARTIAL_POINT + ' · 0점)'
        }),
        el('p', {
          'class': 'score-card__level',
          html: '판정 <strong>' + QUIZ.passLabel(result.score) + '</strong> — 6점 이상이면 이수입니다.'
        }),
        el('p', { 'class': 'score-card__comment', text: v.icon + ' ' + v.text }),
        el('p', {
          'class': 'score-card__meta',
          text:
            '도전 ' + (st().attempts || 0) + '회 · 최고 ' + (st().bestScore === null ? '-' : st().bestScore) +
            '점 · 최근 ' + (st().lastScore === null ? '-' : st().lastScore) + '점'
        })
      ])
    );

    /* 문항별 정오표 (색에 기대지 않도록 기호와 글자를 함께 쓴다) */
    body.appendChild(ui.sectionTitle('정오', '문항별 결과'));
    body.appendChild(
      ui.dataTable({
        head: ['문항', '평가 내용', '결과', '배점', '보충 화면'],
        caption: '문항별 결과',
        rows: result.details.map(function (d) {
          var q = QUIZ.byId(d.id);
          return [
            q.id + '번',
            q.short,
            QUIZ.stateMark(d.state),
            d.points + ' / ' + q.points,
            '화면 ' + (q.reviewSteps || [q.reviewStep]).join(' · ')
          ];
        })
      })
    );

    /* 오답 복습 바로가기 */
    var wrong = result.details.filter(function (d) {
      return d.state !== 'correct';
    });
    if (wrong.length) {
      var steps = [];
      wrong.forEach(function (d) {
        var q = QUIZ.byId(d.id);
        (q.reviewSteps || [q.reviewStep]).forEach(function (n) {
          if (steps.indexOf(n) === -1) steps.push(n);
        });
      });
      steps.sort(function (a, b) {
        return a - b;
      });
      body.appendChild(
        el('div', { 'class': 'review-links' }, [
          el('p', {
            'class': 'review-links__title',
            text: '헷갈린 개념을 다시 보고 오면 좋아요. 아래 버튼으로 바로 이동할 수 있어요.'
          }),
          ui.buttonRow(
            steps.map(function (n) {
              return ui.button({
                label: n + '단계 · ' + C.STEP_SHORTS[n] + ' 다시 보기',
                variant: 'secondary',
                ariaLabel: n + '단계 화면으로 이동해 복습하기',
                onClick: function () {
                  L.nav.goToStep(n, { force: true });
                }
              });
            })
          )
        ])
      );
    }

    /* 문항별 해설 아코디언 */
    body.appendChild(ui.sectionTitle('해설', '문항별 정답과 해설'));
    var accordion = el('div', { 'class': 'accordion' });
    result.details.forEach(function (d) {
      var q = QUIZ.byId(d.id);
      var ok = d.state === 'correct';
      var partial = d.state === 'partial';
      var myText = QUIZ.answerToText(q, d.answer);
      var toHtml = function (text) {
        return ui.escapeHtml(text).replace(/\n/g, '<br />');
      };
      var rows = [
        ['내 답', myText ? toHtml(myText) : '<span class="is-muted">응답하지 않음</span>'],
        ['정답', toHtml(QUIZ.correctToText(q))],
        ['해설', q.explain]
      ];
      if (q.type === 'code' && d.matchedElements !== null) {
        rows.push([
          '충족한 요소',
          q.codeSpec.steps.length + '개 중 ' + d.matchedElements + '개' +
            (orderProblem(q, d)
              ? ' — 세 줄을 모두 썼지만 <strong>순서가 조건과 달라</strong> ' + QUIZ.PARTIAL_POINT + '점입니다.'
              : '')
        ]);
      }
      accordion.appendChild(
        accordionItem({
          open: !ok,
          mark: ok ? '○' : partial ? '△' : d.state === 'wrong' ? '✕' : '−',
          markClass: ok ? 'is-correct' : partial ? 'is-partial' : d.state === 'wrong' ? 'is-wrong' : '',
          title:
            '문항 ' + q.id + ' · ' + q.title + ' — ' +
            (ok ? '정답' : partial ? '부분 정답' : d.state === 'wrong' ? '오답' : '미응답') +
            ' (' + d.points + ' / ' + q.points + '점)',
          rows: rows,
          extra: ok
            ? null
            : ui.buttonRow(
                (q.reviewSteps || [q.reviewStep]).map(function (n) {
                  return ui.button({
                    label: '화면 ' + n + ' 다시 보기',
                    variant: 'ghost',
                    ariaLabel: '문항 ' + q.id + ' 복습을 위해 ' + n + '단계로 이동',
                    onClick: function () {
                      L.nav.goToStep(n, { force: true });
                    }
                  });
                })
              )
        })
      );
    });
    body.appendChild(accordion);

    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '🔁 다시 풀기', variant: 'secondary', onClick: retry }),
        ui.button({ label: '⬇ 학습 기록 내려받기', variant: 'ghost', onClick: downloadRecord }),
        ui.button({
          label: '🖨 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
  }

  function retry() {
    var wasSubmitted = Boolean(st().submitted);
    st().answers = {};
    st().index = 0;
    st().graded = false;
    st().score = null;
    st().passed = null;
    st().submitLocked = false;
    L.state.markChanged();
    if (wasSubmitted) gradeUnlocked = true;

    ui.clear(refs.resultBody);
    applySections(false);
    refs.console.clear();
    refs.feedback.show(
      'info',
      '처음부터 다시 시작했어요. 최고 점수 <strong>' + (st().bestScore === null ? '-' : st().bestScore) +
        '점</strong>은 그대로 남아 있어요.' +
        (wasSubmitted ? '<br />답안은 <strong>이미 제출</strong>했으므로 연습으로 다시 풀어 보세요.' : '')
    );
    renderQuestion();
    ui.scrollToNode(refs.quizPanel);

  /* ------------------------------------------------------------------ */
  /* 답안 제출 (명세 11.8 · 13장)                                            */
  /* ------------------------------------------------------------------ */
  function buildPayload() {
    var result = QUIZ.grade(st().answers);
    var answers = QUIZ.QUESTIONS.map(function (q) {
      var picked = st().answers[q.id];
      var d = result.details.filter(function (x) {
        return x.id === q.id;
      })[0];
      var row = {
        questionId: q.id,
        type: q.type === 'choice' ? 'multipleChoice' : 'codeInput',
        answer: q.type === 'code' ? QUIZ.codeLines(picked) : picked ? String(picked) : '',
        isCorrect: d.state === 'correct',
        // 명세 11.7 · 13장 : 5번은 부분 점수(2 · 1 · 0)를 받을 수 있으므로 점수도 함께 보낸다.
        points: d.points,
        maxPoints: q.points,
        category: q.category
      };
      if (q.type === 'code') {
        row.matchedElements = d.matchedElements;
        row.partial = d.state === 'partial';
      }
      return row;
    });
    return {
      lesson: C.LESSON_ID,
      lessonTitle: C.LESSON_TITLE + ' · ' + C.LESSON_SUBTITLE,
      studentId: st().student.id || '',
      name: st().student.name || '',
      answers: answers,
      totalScore: result.score,
      maxScore: result.maxScore,
      passed: result.passed,
      attempts: (st().attempts || 0) + (st().graded ? 0 : 1)
    };
  }

  /** 제출 전 「무엇이 전송되는지」 확인 모달 (명세 11.8 · 22장) */
  function openSubmitDialog() {

      ui.announce(problem);
      return;
    }

    var payload = buildPayload();
    var endpoint = L.state.readEndpoint();

    var urlInput = el('input', {
      type: 'url',
      'class': 'endpoint-modal__input',
      value: endpoint,
      placeholder: 'https://script.google.com/macros/s/…/exec',
      attrs: { 'aria-label': '선생님이 알려 준 제출 주소' }

    function close() {

      if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
    }

    var btnKeepGrading = ui.button({
      label: '채점 계속하기',
      variant: 'secondary',
      onClick: function () {
        gradeUnlocked = true;
        close();

        refs.feedback.show(
          'info',
          '제출은 하지 못했지만 <strong>채점을 계속할 수 있어요.</strong> 나중에 다시 제출할 수 있습니다.'
        );
        ui.scrollToNode(refs.quizPanel);
      }
    });
    btnKeepGrading.hidden = true;

    var btnSend = ui.button({
      label: '보내기',
      onClick: function () {
        if (busy) return;
        var url = String(urlInput.value || '').trim();
        if (!/^https?:\/\//i.test(url)) {
          errorLine.textContent = '제출 주소를 확인해 주세요. https:// 로 시작하는 주소가 필요해요.';
          return;
        }
        busy = true;
        btnSend.disabled = true;
        errorLine.textContent = '보내는 중이에요…';
        L.state.saveEndpoint(url);
        refs.console.write('답안을 보내는 중… (' + url.replace(/^https?:\/\//, '').split('/')[0] + ')');
        send(url, payload)
          .then(function () {
            st().submitted = true;
            st().submitLocked = true;
            st().submitInfo = { at: new Date().toLocaleString('ko-KR'), mode: 'online', fileName: '' };
            L.state.markChanged();
            close();
            refs.console.write('제출 완료 (' + st().submitInfo.at + ') · 답안을 잠갔어요.');
            refs.feedback.show(
              'success',
              '제출을 마쳤어요. 이어서 <strong>[채점하기]</strong> 를 눌러 결과를 확인해 보세요.',
              '📨'
            );
            ui.toast('제출을 마쳤어요. 이제 채점할 수 있어요.');
            renderQuestion();
            ui.announce('제출을 마쳤습니다. 채점하기 버튼을 사용할 수 있습니다.');
          })
          .catch(function (err) {
            busy = false;
            btnSend.disabled = false;
            var message = err && err.message ? err.message : '연결 실패';
            errorLine.textContent =
              '보내지 못했어요 (' + message + '). [답안 파일로 저장] 으로 파일을 만들어 선생님께 제출해도 되고, ' +
              '[채점 계속하기] 로 채점만 먼저 할 수도 있어요.';
            btnKeepGrading.hidden = false;
            refs.console.writeError('제출 실패 : ' + message);
            refs.feedback.show(
              'warning',
              '제출에 실패했어요. <strong>[답안 파일로 저장]</strong> 으로 파일을 만들어 제출하거나, ' +
                '<strong>[채점 계속하기]</strong> 로 채점만 먼저 할 수 있어요.'
            );
          });
      }
    });

    dialog.appendChild(
      el('div', { 'class': 'modal__body' }, [
        el('h2', { 'class': 'modal__title', text: '이 내용을 선생님께 보냅니다' }),
        el('div', { 'class': 'modal__text' }, [
          el('p', {
            html:
              '<strong>학번</strong> ' + ui.escapeHtml(payload.studentId) +
              ' · <strong>이름</strong> ' + ui.escapeHtml(payload.name)
          }),
          el('p', {
            text:
              '형성평가 ' + QUIZ.QUESTIONS.length + '문항의 답과 총점(' + payload.totalScore + ' / ' +
              payload.maxScore + ')이 함께 전송돼요.'
          }),
          el('p', {
            'class': 'endpoint-modal__notice',
            html: '⚠ <strong>답안은 한 번만 제출할 수 있어요.</strong> 보내고 나면 답을 고칠 수 없습니다.'
          }),
          el('p', { 'class': 'meta-count', text: '[취소] 를 누르면 아무것도 전송하지 않습니다.' })
        ]),
        urlInput,

        el('div', { 'class': 'modal__actions' }, [
          ui.button({ label: '취소', variant: 'ghost', onClick: close }),
          ui.button({ label: '답안 파일로 저장', variant: 'secondary', onClick: downloadAnswers }),
          btnKeepGrading,
          btnSend
        ])
      ])
    );
    dialog.addEventListener('cancel', function (e) {
      e.preventDefault();
      close();
    });
    document.body.appendChild(dialog);
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
  }

  /** Apps Script 로 보낸다. 미리 검사 요청(preflight)이 생기지 않도록 text/plain 으로 보낸다. */
  function send(url, payload) {
    if (typeof window.fetch !== 'function') {
      return Promise.reject(new Error('이 브라우저에서는 전송을 지원하지 않아요'));
    }
    return window
      .fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(function (res) {
        if (!res.ok) throw new Error('서버 응답 ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var data = null;
        try {
          data = JSON.parse(text);
        } catch (err) {
          data = null;
        }
        if (data && data.ok === false) throw new Error(data.message || '서버가 거절했어요');
        if (data && data.lesson && data.lesson !== C.LESSON_ID) {
          throw new Error('응답은 왔지만 이 차시의 답안 수집 주소가 아닌 것 같아요');
        }
        return data;
      });
  }

  function saveFile(name, text) {
    try {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: name });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (err) {
      ui.toast('파일을 만들지 못했어요.');
      return false;
    }
  }

  function downloadAnswers() {
    var payload = buildPayload();
    var name = (payload.studentId || '학번없음') + '_' + (payload.name || '이름없음') + '.json';
    if (saveFile(name, JSON.stringify(payload, null, 2))) {
      st().submitInfo = { at: new Date().toLocaleString('ko-KR'), mode: 'file', fileName: name };
      L.state.markChanged();
      gradeUnlocked = true;
      updateQuizNote();
      refs.console.write(name + ' 파일로 저장했어요. 채점을 계속할 수 있어요.');
      ui.toast(name + ' 파일을 저장했어요. 이제 채점할 수 있어요.');
    }
  }

  /** 명세 12.3 : 학습 기록 내려받기 (채점 전에는 정답·해설을 넣지 않는다) */
  function downloadRecord() {
    var lines = [];
    var graded = st().graded;
    var all = L.state.appState;

    lines.push(C.LESSON_TITLE + ' — 학습 기록');
    lines.push(C.LESSON_SUBTITLE + ' (객체를 구현하는 클래스 2차시)');
    lines.push('');
    lines.push('[1] 응시자 정보');
    lines.push('  학번 : ' + (st().student.id || '(입력하지 않음)'));
    lines.push('  이름 : ' + (st().student.name || '(입력하지 않음)'));
    lines.push('');
    lines.push('[2] 학습 활동');
    lines.push('  생각 열기 : ' + (all.step1.answered ? '응답함' : '아직'));
    lines.push('  선수 학습 2문항 : ' + (all.step1.preOk ? '모두 정답' : '아직'));
    lines.push('  잘못된 코드 찾기 : ' + (all.step2.errorDone ? '세 사례 정답' : '아직'));
    lines.push('  클래스 코드 조립 : ' + (all.step2.orderDone ? '정답' : '아직'));
    lines.push(
      '  객체 생성·속성 변경 : ' +
        (all.step3.created ? '두 객체 생성' : '아직') +
        ' / ' + (all.step3.changed ? '속성 변경 실행' : '아직') +
        ' / ' + (all.step3.printed ? '출력 확인' : '아직')
    );
    lines.push('  출력 결과 예측 : ' + (all.step3.predict ? all.step3.predict + '번 보기' : '아직'));
    lines.push('  점 표기법 연결 : ' + (all.step3.dotDone ? '완료' : '아직'));
    lines.push('  메소드 호출 실행 : ' + (all.step4.callDone ? '실행함' : '아직'));
    lines.push('  self 흐름 4단계 : ' + (all.step4.selfDone ? '확인함' : '아직'));
    lines.push('  개념 연결 활동 : ' + (all.step4.matchDone ? '완료' : '아직'));
    lines.push('  객체 독립성 예측 : ' + (all.step5.predict ? all.step5.predict + '번 보기' : '아직'));
    lines.push('  객체 독립성 실험 : ' + (all.step5.traceDone ? '실행함' : '아직'));
    // 명세 10.2 : 세 메소드를 모두 완성해야 한다. 완성한 것만 이름으로 남긴다.
    // 세는 규칙은 30-state.js 한 곳(methodsDone)만 본다. 화면 5 표시와 어긋나지 않게 하기 위해서다.
    var methodList = L.objects && L.objects.METHOD_CHOICES ? L.objects.METHOD_CHOICES : [];
    var doneNames = L.state.methodsDone().map(function (m) {
      return m.name + '()';
    });
    lines.push(
      '  완성한 메소드 : ' +
        (doneNames.length
          ? doneNames.join(' · ') + ' (' + doneNames.length + ' / ' + methodList.length + ')'
          : '아직 없음')
    );
    lines.push('  미니 활동 코드 : ' + (all.step5.mini || []).filter(Boolean).join(' / '));
    lines.push('');
    lines.push('[3] 형성평가');
    if (graded) {
      lines.push('  총점 : ' + st().score + ' / ' + QUIZ.MAX_SCORE);
      lines.push('  판정 : ' + QUIZ.passLabel(st().score) + ' (6점 이상 이수)');
      lines.push('  최고 점수 : ' + st().bestScore + '점 · 도전 횟수 : ' + st().attempts + '회');
    } else {
      lines.push('  아직 채점하지 않았어요. (채점 전에는 정답과 해설을 기록하지 않습니다)');
    }
    QUIZ.QUESTIONS.forEach(function (q, i) {
      var given = st().answers[q.id];
      var answered = QUIZ.isAnswered(q, given);
      lines.push(
        '  ' + (i + 1) + '. ' + q.title + ' [' + q.category + '] → ' +
          (answered ? QUIZ.answerToText(q, given).replace(/\n/g, ' / ') : '응답하지 않음') +
          (graded ? '  [' + QUIZ.stateMark(QUIZ.stateAnswer(q, given)) + ' ' + QUIZ.scoreAnswer(q, given) + '점]' : '')
      );
    });
    lines.push('');
    lines.push('[4] 학습 정리 문장');
    WRAP_UP.forEach(function (w, i) {
      lines.push('  ' + (i + 1) + '. ' + w.before + '(' + (st().wrapUp[w.key] || '미작성') + ')' + w.after);
    });
    lines.push('');
    lines.push('[5] 답안 제출 상태');
    lines.push(
      '  ' +
        (st().submitted
          ? '제출 완료 (' + st().submitInfo.at + ')'
          : st().submitInfo.fileName
          ? '파일로 저장함 (' + st().submitInfo.fileName + ')'
          : '아직 제출하지 않음')
    );

    // 엑셀·메모장에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다.
    if (saveFile('lesson3_8_2_학습기록.txt', '﻿' + lines.join('\r\n'))) {
      refs.console.write('학습 기록 파일을 저장했어요.');
    }
  }

  /* ------------------------------------------------------------------ */
  /* ③ 학습 정리 (명세 11.10)                                                */
  /* ------------------------------------------------------------------ */
  function buildSummary(body) {
    body.appendChild(ui.sectionTitle('①', '문장을 완성해 보세요'));
    refs.wrapInputs = {};
    WRAP_UP.forEach(function (w, i) {
      var input = el('input', {
        type: 'text',
        'class': 'fillline__input',
        id: 'step6-wrap-' + w.key,
        value: st().wrapUp[w.key] || '',
        maxLength: 20,
        attrs: { 'aria-label': i + 1 + '번 문장의 빈칸', autocomplete: 'off' }
      });
      input.addEventListener(
        'input',
        ui.debounce(function () {
          st().wrapUp[w.key] = input.value;
          L.state.markChanged();
        }, 300)
      );
      refs.wrapInputs[w.key] = input;
      body.appendChild(
        el('div', { 'class': 'fillline' }, [
          el('span', { 'class': 'fillline__text' }, [
            el('span', { text: i + 1 + '. ' + w.before }),
            input,
            el('span', { text: w.after })
          ])
        ])
      );
    });
    refs.wrapFeedback = ui.createFeedback({ emptyText: '세 문장을 채운 뒤 확인해 보세요.' });
    body.appendChild(
      ui.buttonRow([
        ui.button({

              });
            });
            if (!wrong.length) {
              refs.wrapFeedback.show('success', '세 문장을 모두 바르게 완성했어요. 오늘 배운 내용을 잘 정리했습니다.', '🎉');
            } else {
              refs.wrapFeedback.show(
                'info',
                '다시 볼 문장이 ' + wrong.length + '개 있어요. 위쪽 <strong>핵심어</strong> 목록에서 알맞은 낱말을 찾아보세요.'
              );
            }
          }
        })
      ])
    );
    body.appendChild(refs.wrapFeedback.root);

    body.appendChild(ui.sectionTitle('②', '오늘의 핵심어'));
    body.appendChild(
      el(
        'div',
        { 'class': 'concept-grid' },
        KEYWORDS.map(function (k) {
          return el('div', { 'class': 'concept-card' }, [
            el('span', { 'class': 'concept-card__key', text: k[0] }),
            el('span', { 'class': 'concept-card__desc', text: k[1] })
          ]);
        })
      )
    );

    body.appendChild(ui.sectionTitle('③', '핵심 문법 카드'));
    var cards = ui.split({});
    cards.left.appendChild(
      L.codeview.createCodeView({
        title: '클래스 선언과 객체 생성',
        showLineNumbers: false,
        ariaLabel: '클래스 선언과 객체 생성 문법',
        lines: [
          { code: 'class Phone:', note: '클래스 선언' },
          { code: '    user = "김정보"', note: '클래스 속성' },
          { code: '' },
          { code: 'phone1 = Phone()', note: '객체 생성' },
          { code: 'phone1.user = "민준"', note: '속성 변경' },
          { code: 'print(phone1.user)', note: '점 표기법' }
        ]
      }).root
    );
    cards.right.appendChild(
      L.codeview.createCodeView({
        title: '메소드 정의와 호출',
        showLineNumbers: false,
        ariaLabel: '메소드 정의와 호출 문법',
        lines: [
          { code: 'class Phone:' },
          { code: '    user = "김정보"' },
          { code: '    def call(self):', note: '메소드 정의' },
          { code: '        print(f"{self.user}님이 전화를 겁니다.")', note: 'self = 호출한 객체' },
          { code: '' },
          { code: 'phone1.call()', note: '메소드 호출 (소괄호 필수)' }
        ]
      }).root
    );
    body.appendChild(cards.root);
  }

  /* ------------------------------------------------------------------ */
  /* ④ 마무리                                                              */
  /* ------------------------------------------------------------------ */
  function buildClosing(body) {
    body.appendChild(
      el('div', { 'class': 'next-lesson' }, [
        el('p', { 'class': 'next-lesson__label', text: '다음 차시 예고' }),
        el('p', { text: NEXT_LESSON })
      ])
    );
    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '⬇ 학습 기록 내려받기', variant: 'secondary', onClick: downloadRecord }),
        ui.button({
          label: '🖨 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
  }

  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 6,
        title: C.STEP_TITLES[6],
        lead: [
          '오늘 배운 내용을 <strong>5문항</strong>으로 확인합니다. 문항은 <strong>한 번에 하나씩</strong> 나와요.',
          '1~4번은 각 2점이고, <strong>5번(코드 직접 입력)만 부분 점수</strong>(2 · 1 · 0점)가 있어요. ' +
            '총 <strong>10점 만점</strong>이며 <strong>6점 이상이면 이수</strong>입니다.',
          '<strong>5문항에 모두 답하기 전에는 정답과 해설을 공개하지 않아요.</strong> ' +
            '채점이 끝나면 문항별 해설이 이어서 나타납니다.'
        ]
      })
    );

    /* ---------------- ① 형성평가 ---------------- */
    var layout = ui.split({ className: 'split--wide-left' });
    var quiz = ui.panel({
      title: '① 형성평가 (5문항 · 10점)',
      hint:
        '문항을 읽고 답한 뒤 <strong>다음 문항</strong>으로 이동해요. ' +
        '<strong>이전 문항</strong>으로 돌아가 답을 고칠 수 있고, 위쪽 점을 눌러 바로 이동할 수도 있어요.',
      className: 'quiz'
    });
    refs.quizPanel = quiz.root;

    buildStudentCard(quiz.body);

    refs.quizCounter = el('span', { 'class': 'quiz__counter', text: '문항 1 / ' + QUIZ.QUESTIONS.length });
    refs.quizDots = el('div', {
      'class': 'quiz__dots',
      attrs: { role: 'group', 'aria-label': '형성평가 문항 이동' }
    });
    quiz.body.appendChild(el('div', { 'class': 'quiz__meta' }, [refs.quizCounter, refs.quizDots]));

    refs.quizBody = el('div', { 'class': 'stack' });
    quiz.body.appendChild(refs.quizBody);

    refs.btnPrevQ = ui.button({
      label: '← 이전 문항',
      variant: 'secondary',
      ariaLabel: '이전 문항 보기',
      onClick: function () {
        if (st().index > 0) {
          st().index -= 1;
          L.state.markChanged();
          renderQuestion();
        }
      }
    });
    refs.btnNextQ = ui.button({
      label: '다음 문항 →',
      variant: 'secondary',
      ariaLabel: '다음 문항 보기',
      onClick: function () {
        if (st().index < QUIZ.QUESTIONS.length - 1) {
          st().index += 1;
          L.state.markChanged();
          renderQuestion();
        }
      }
    });
    refs.btnGrade = ui.button({ label: '채점하기', ariaLabel: '형성평가 채점하기', onClick: grade });
    refs.btnSubmit = C.SUBMIT_ENABLED
      ? ui.button({ label: '답안 제출하기', onClick: openSubmitDialog })
      : null;
    quiz.body.appendChild(ui.buttonRow([refs.btnPrevQ, refs.btnNextQ, refs.btnGrade, refs.btnSubmit]));

    refs.quizNote = el('p', { 'class': 'quiz__note', attrs: { 'aria-live': 'polite' } });
    quiz.body.appendChild(refs.quizNote);
    refs.submitNotice = el('div', { 'class': 'submit-notice', attrs: { role: 'status' } });
    quiz.body.appendChild(refs.submitNotice);
    layout.left.appendChild(quiz.root);

    refs.console = ui.createConsole({
      title: '채점·제출 진행 상황',
      emptyText: '5문항에 모두 답한 뒤 [채점하기] 를 누르면 채점 과정이 여기에 표시돼요.',
      ariaLabel: '형성평가 채점 및 답안 제출 진행 상황'
    });
    refs.feedback = ui.createFeedback({ emptyText: '문항에 답하면 이곳에 안내가 표시돼요.' });
    layout.right.appendChild(refs.console.root);
    layout.right.appendChild(refs.feedback.root);
    root.appendChild(layout.root);

    /* ---------------- ② 채점 결과 및 해설 ---------------- */
    var result = ui.panel({ title: '② 채점 결과 및 해설', className: 'step6-result' });
    refs.resultSection = result.root;
    refs.resultBody = result.body;
    refs.resultSection.hidden = true;
    root.appendChild(refs.resultSection);

    /* ---------------- ③ 학습 정리 ---------------- */
    var summary = ui.panel({ title: '③ 학습 정리', className: 'step6-summary' });
    buildSummary(summary.body);
    root.appendChild(summary.root);

    /* ---------------- ④ 마무리 ---------------- */
    var closing = ui.panel({ title: '④ 마무리', className: 'step6-closing' });
    buildClosing(closing.body);
    root.appendChild(closing.root);

    renderQuestion();
  }

  L.registerStep(6, {
    title: C.STEP_TITLES[6],
    short: C.STEP_SHORTS[6],
    render: render,
    onEnter: function () {
      if (refs.idField) refs.idField.input.value = st().student.id || '';
      if (refs.nameField) refs.nameField.input.value = st().student.name || '';
      if (refs.wrapInputs) {
        WRAP_UP.forEach(function (w) {
          refs.wrapInputs[w.key].value = st().wrapUp[w.key] || '';
        });
      }
      updateStudentUI();
      renderQuestion();
      if (st().graded) {
        renderResult(QUIZ.grade(st().answers));
        applySections(true);
      } else {
        applySections(false);
      }
    }
  });
})();

    <script data-from="js/90-app.js">
/**
 * 앱 부팅 (명세 4장 단계 구성 / 11.1 상태 복원 / 11.4 접근성)
 *  - 상단 스테퍼 생성·갱신, 진행률 바
 *  - 하단 [이전] / [다음] 버튼, 이동 조건 미충족 안내
 *  - 상단 메뉴로는 조건과 관계없이 자유 이동(교사 시연용, 명세 4장)
 *  - 저장된 진행 복원 확인 대화상자
 *  - 주소창 해시(#step3) 동기화
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var TOTAL = L.CONST.TOTAL_STEPS;

  var refs = {
    main: null,
    stepperList: null,
    progressCurrent: null,
    progressBar: null,
    progressFill: null,
    btnPrev: null,
    btnNext: null,
    navHint: null,
    nav: null
  };

  var sections = {};
  var hashLock = false;

  /* ------------------------------------------------------------------ */
  /* 화면 골격 확보                                                       */
  /* ------------------------------------------------------------------ */
  /**
   * index.html 에 골격이 이미 있으면 그대로 쓰고, 없으면 여기서 만든다.
   * (index.html 이 아주 단순해도 앱이 뜨도록 하기 위한 안전장치)
   */
  function ensureShell() {
    if (!document.getElementById('app-main')) {
      var stepperList = el('ol', { 'class': 'stepper__list', id: 'stepper-list' });
      var progressFill = el('div', { 'class': 'progressbar__fill', id: 'progressbar-fill' });
      var app = el('div', { 'class': 'app' }, [
        el('header', { 'class': 'app-progress', id: 'app-progress' }, [
          el('div', { 'class': 'app-progress__inner' }, [
            el(
              'nav',
              { 'class': 'stepper', id: 'stepper', attrs: { 'aria-label': '학습 단계 이동' } },
              [stepperList]
            ),
            el('div', { 'class': 'app-progress__meter' }, [
              el('p', { 'class': 'app-progress__count' }, [
                el('span', { id: 'progress-current', text: '1' }),
                el('span', { 'class': 'app-progress__count-sep', text: ' / ' }),
                el('span', { text: String(TOTAL) })
              ]),
              el(
                'div',
                {
                  'class': 'progressbar',
                  id: 'progressbar',
                  attrs: {
                    role: 'progressbar',
                    'aria-label': '학습 진행률',
                    'aria-valuemin': '0',
                    'aria-valuemax': '100',
                    'aria-valuenow': '0'
                  }
                },
                [progressFill]
              )
            ])
          ])
        ]),
        el('main', { 'class': 'app-main', id: 'app-main' }),
        el('footer', { 'class': 'app-nav', id: 'app-nav' }, [
          el('div', { 'class': 'app-nav__inner' }, [
            el('button', { type: 'button', 'class': 'btn btn--secondary', id: 'btn-prev', text: '← 이전' }),
            el('p', { 'class': 'app-nav__hint', id: 'nav-hint', attrs: { 'aria-live': 'polite' } }),
            el('button', { type: 'button', 'class': 'btn btn--primary', id: 'btn-next', text: '다음 →' })
          ])
        ])
      ]);
      document.body.appendChild(app);
    }

    if (!document.getElementById('toast-region')) {
      document.body.appendChild(
        el('div', {
          'class': 'toast-region',
          id: 'toast-region',
          attrs: { 'aria-live': 'polite', 'aria-atomic': 'true' }
        })
      );
    }
    if (!document.getElementById('sr-live')) {
      document.body.appendChild(
        el('div', {
          'class': 'sr-only',
          id: 'sr-live',
          attrs: { role: 'status', 'aria-live': 'polite' }
        })
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 화면 · 스테퍼 만들기                                             */
  /* ------------------------------------------------------------------ */
  function eachStep(fn) {
    for (var i = 1; i <= TOTAL; i += 1) fn(i, L.steps[i] || null);
  }

  function buildSections() {
    eachStep(function (id, step) {
      var section = el('section', {
        'class': 'step-screen',
        id: 'step-' + id,
        dataset: { step: String(id) },
        attrs: {
          'aria-label': id + '단계 ' + (step ? step.title : ''),
          tabindex: '-1'
        }
      });
      refs.main.appendChild(section);
      sections[id] = section;

      if (!step) {
        section.appendChild(el('p', { text: id + '단계가 아직 등록되지 않았어요.' }));
        return;
      }
      try {
        step.render(section);
        step.rendered = true;
      } catch (err) {
        if (window.console) console.error('[app] ' + id + '단계 화면을 만들지 못했습니다.', err);
        section.appendChild(el('p', { text: id + '단계 화면을 불러오지 못했어요.' }));
      }
    });
  }

  function buildStepper() {
    ui.clear(refs.stepperList);
    eachStep(function (id, step) {
      var title = step ? step.title : id + '단계';
      var node = el('button', {
        type: 'button',
        'class': 'stepper__node',
        text: String(id),
        attrs: { 'aria-label': id + '단계 ' + title + '로 이동' },
        on: {
          click: function () {
            // 명세 4장 : 교사의 시연을 위해 상단 메뉴에서는 자유롭게 이동할 수 있다.
            goToStep(id, { force: true });
          }
        }
      });
      refs.stepperList.appendChild(
        el('li', { 'class': 'stepper__item', dataset: { step: String(id) } }, [
          node,
          el('span', { 'class': 'stepper__label', text: step ? step.short : String(id) })
        ])
      );
    });
  }

  /* ------------------------------------------------------------------ */
  /* 진행 상태 · 이동 버튼 갱신                                            */
  /* ------------------------------------------------------------------ */
  function updateChrome() {
    var current = L.state.appState.currentStep;

    Array.prototype.slice.call(refs.stepperList.children).forEach(function (item) {
      var step = Number(item.dataset.step);
      var visited = L.state.isVisited(step);
      item.classList.toggle('is-current', step === current);
      item.classList.toggle('is-done', visited && step !== current);
      item.classList.toggle('is-locked', !visited);
      var node = item.querySelector('.stepper__node');
      node.textContent = visited && step !== current ? '✔' : String(step);
      node.setAttribute('aria-current', step === current ? 'step' : 'false');
    });

    refs.progressCurrent.textContent = String(current);
    var percent = Math.round(((current - 1) / (TOTAL - 1)) * 100);
    refs.progressFill.style.width = percent + '%';
    refs.progressBar.setAttribute('aria-valuenow', String(percent));
    refs.progressBar.setAttribute(
      'aria-valuetext',
      TOTAL + '단계 중 ' + current + '단계, ' + percent + '%'
    );

    refs.btnPrev.disabled = current === 1;
    refs.nav.classList.toggle('app-nav--start', current === 1);

    var last = current === TOTAL;
    refs.btnNext.textContent = last ? '학습 마치기' : '다음 →';

    var ok = L.state.canProceed(current);
    refs.btnNext.disabled = !ok;
    refs.btnNext.title = ok ? '' : L.state.blockedMessage(current);

    if (ok) {
      refs.navHint.textContent = '';
    } else {
      var left = L.state.remainingHint(current);
      refs.navHint.textContent = left.length
        ? L.state.blockedMessage(current) + ' (남은 활동: ' + left.join(', ') + ')'
        : L.state.blockedMessage(current);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function showStep(step) {
    Object.keys(sections).forEach(function (key) {
      sections[key].classList.toggle('is-active', Number(key) === step);
    });
  }

  function syncHash(step) {
    hashLock = true;
    try {
      if (window.location.hash !== '#step' + step) window.location.hash = 'step' + step;
    } catch (err) {
      /* file:// 등에서 실패해도 학습에는 지장이 없다. */
    }
    setTimeout(function () {
      hashLock = false;
    }, 0);
  }

  /**
   * 단계 이동.
   * options.force  = true 면 이동 조건을 무시한다(상단 메뉴 · 오답 복습 바로가기).
   * options.silent = true 면 막혔을 때 안내를 띄우지 않는다.
   */
  function goToStep(target, options) {
    var o = options || {};
    var current = L.state.appState.currentStep;
    var next = L.state.clampStep(target);

    // 같은 단계로의 이동이라도 화면은 다시 맞춰 준다.
    // (학습 기록 초기화 후처럼 상태만 바뀌고 화면이 그대로 남는 일을 막는다)
    if (next === current) {
      showStep(next);
      var same = L.steps[next];
      if (same && typeof same.onEnter === 'function') {
        try {
          same.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      return;
    }

    // 앞으로 이동할 때만 이동 조건을 확인한다(되돌아가는 것은 언제나 자유).
    if (!o.force && next > current && !L.state.canProceed(current)) {
      var message = L.state.blockedMessage(current);
      if (!o.silent && message) {
        ui.toast(message);
        ui.announce(message);
      }
      return;
    }

    var from = L.steps[current];
    if (from && typeof from.onLeave === 'function') {
      try {
        from.onLeave();
      } catch (err) {
        if (window.console) console.error('[app] onLeave 오류', err);
      }
    }

    L.state.visitStep(next);
    showStep(next);

    var to = L.steps[next];
    if (to && typeof to.onEnter === 'function') {
      try {
        to.onEnter();
      } catch (err) {
        if (window.console) console.error('[app] onEnter 오류', err);
      }
    }

    updateChrome();
    syncHash(next);

    var section = sections[next];
    if (section && typeof section.focus === 'function') section.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    ui.announce(next + '단계 ' + (to ? to.title : '') + ' 화면으로 이동했습니다.');
  }

  function finishLearning() {
    return ui.confirmDialog({
      title: '학습을 모두 마쳤어요 🎉',
      message:
        '오늘은 <code>class Phone:</code> 을 직접 선언하고 <code>Phone()</code> 으로 ' +
        '<strong>phone1 · phone2 두 객체</strong>를 만들었어요.<br />' +
        '점 표기법으로 <strong>속성을 바꾸고</strong>, <code>def</code> 로 정의한 <strong>메소드를 호출</strong>하며 ' +
        '<code>self</code> 가 <strong>호출한 객체</strong>로 연결되는 과정을 확인했습니다.<br />' +
        '다음 차시에는 <strong>반려동물 클래스</strong>를 설계해 생활 문제 해결 프로그램을 만듭니다. ' +
        '상단 메뉴를 눌러 오늘 배운 화면을 다시 살펴볼 수 있어요.',
      okLabel: '닫기',
      cancelLabel: '되돌아가기',
      dismissValue: true
    });
  }

  /* ------------------------------------------------------------------ */
  /* 해시 동기화                                                          */
  /* ------------------------------------------------------------------ */
  function stepFromHash() {
    var match = String(window.location.hash || '').match(/^#step(\d+)$/);
    if (!match) return null;
    return L.state.clampStep(Number(match[1]));
  }

  function onHashChange() {
    if (hashLock) return;
    var target = stepFromHash();
    if (target === null) return;
    if (target === L.state.appState.currentStep) return;
    goToStep(target, { force: true });
  }

  /* ------------------------------------------------------------------ */
  /* 부팅                                                                */
  /* ------------------------------------------------------------------ */
  function boot() {
    ensureShell();

    refs.main = document.getElementById('app-main');
    refs.stepperList = document.getElementById('stepper-list');
    refs.progressCurrent = document.getElementById('progress-current');
    refs.progressBar = document.getElementById('progressbar');
    refs.progressFill = document.getElementById('progressbar-fill');
    refs.btnPrev = document.getElementById('btn-prev');
    refs.btnNext = document.getElementById('btn-next');
    refs.navHint = document.getElementById('nav-hint');
    refs.nav = document.getElementById('app-nav');

    L.nav.setNavigator(goToStep);

    // 저장된 진행 기록이 있으면 이어서 학습할지 확인한다(명세 11.1).
    var saved = L.state.readSavedState();
    var restore = Promise.resolve();
    if (L.state.hasMeaningfulProgress(saved)) {
      restore = ui
        .confirmDialog({
          title: '이어서 학습하시겠어요?',
          message:
            '이전에 <strong>' +
            (saved.currentStep || 1) +
            '단계</strong>까지 진행한 기록이 남아 있어요.<br />처음부터 다시 시작하면 이전 기록은 지워집니다.',
          okLabel: '이어서 학습하기',
          cancelLabel: '처음부터 시작',
          // Esc 등으로 그냥 닫으면 기록을 지우지 않고 이어서 학습하는 쪽으로 처리한다.
          dismissValue: true
        })
        .then(function (resume) {
          if (resume) L.state.applySavedState(saved);
          else L.state.resetState();
        });
    } else if (saved) {
      L.state.resetState();
    }

    restore.then(function () {
      buildStepper();
      buildSections();

      refs.btnPrev.addEventListener('click', function () {
        goToStep(L.state.appState.currentStep - 1, { force: true });
      });
      refs.btnNext.addEventListener('click', function () {
        if (L.state.appState.currentStep === TOTAL) {
          if (L.state.canProceed(TOTAL)) finishLearning();
          else ui.toast(L.state.blockedMessage(TOTAL));
          return;
        }
        goToStep(L.state.appState.currentStep + 1);
      });

      // 상태가 바뀌면 이동 가능 여부·진행 표시를 즉시 갱신한다.
      L.state.onChange(function () {
        updateChrome();
      });

      window.addEventListener('hashchange', onHashChange);

      // 첫 화면 : 주소창 해시가 있으면 그 단계, 없으면 복원된 단계
      var start = stepFromHash();
      if (start === null) start = L.state.appState.currentStep;
      L.state.visitStep(start);
      showStep(start);
      var startStep = L.steps[start];
      if (startStep && typeof startStep.onEnter === 'function') {
        try {
          startStep.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      syncHash(start);
    });
  }

  L.app = {
    boot: boot,
    goToStep: goToStep,
    refresh: updateChrome,
    /** 저장된 학습 기록을 지우고 1단계로 되돌린다(교사용). */
    resetAll: function () {
      L.state.resetState();
      goToStep(1, { force: true });
      updateChrome();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
