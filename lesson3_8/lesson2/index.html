    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 15px;
  cursor: pointer;
}

.select:hover {
  border-color: var(--color-primary);
}

/* ------------------------------------------------------------------
 * 3차시 전용 스타일 (반복문 학습에서만 쓰는 조각들)
 *
 * 앞선 파일과 역할을 나눈다.
 *   tokens.css     : 색·글꼴·간격 값
 *   base.css       : 앱 골격 · 상단 진행 바 · 하단 이동 바
 *   components.css : 버튼 · 패널 · 입력 · 콘솔 · 배지 · 표
 *   code.css       : 코드 뷰와 실행 상태 표시
 *   steps.css      : 시작 화면 · 선택지 · 채점 결과 등 공통 화면 조각
 *   lesson.css     : ↓ 반복 회차 · 값 카드 · 흐름 고리 · 로봇 트랙 …
 * ------------------------------------------------------------------ */

/* ===================== 공통 작은 조각 ===================== */
.note-line {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  min-height: 1.6em;
}

.meta-count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.callout--warn {
  background: var(--color-false-soft);
  border-color: var(--color-false);
  color: var(--color-false-dark);
}

.triple {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}

@media (max-width: 1023px) {
  .triple {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* 오답 해설에서 관련 학습 화면으로 이동하는 줄 */
.linkline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px dashed var(--color-border);
}

.linkline__label {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

   1·2차시 시작 화면과 같은 형식을 쓴다. 뼈대(.hero / .goal-card / .agenda)는
   steps.css 에 있고, 여기서는 그 위에 얹는 보정만 한다. */

/* 단계 표기(1단계 · 시작 및 선수 학습 확인) */
.hero__eyebrow {
  margin-bottom: var(--space-3);
}

.hero__note strong {
  color: var(--color-primary-dark);
  font-weight: 800;
}

/* 가운데 정렬된 hero 안에서도 문장·문항은 왼쪽 정렬로 읽는다 */
.hero__feedback {
  margin-top: var(--space-5);
  text-align: left;
}

.hero__quiz {
  margin-top: var(--space-6);
  text-align: left;
}

/* 학습 시작 버튼 아래 안내(남은 활동 / 준비 완료) */
.hero__hint {
  margin-top: var(--space-2);
  text-align: center;
}

/* 지난 시간 핵심 내용 — 학습 순서 칩과 같은 모양이되,
   앞쪽 낱말이 열쇠말임이 드러나도록 색과 굵기만 달리한다. */
.recall__key {
  flex: 0 0 auto;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.recall__key::after {
  content: '·';
  margin-left: var(--space-2);
  color: var(--color-border-strong);
  font-weight: 700;
}

.recall__text {
  color: var(--color-text-sub);
  font-weight: 600;
}

/* 선수 학습 미니 문항 · 생각 열기 카드 */
.mini-quiz {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.mini-quiz__q {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
}

/* 미니 문항 안의 소제목(Q1 · Q2)은 위쪽 여백을 줄인다 */
.mini-quiz .section-title {
  margin: var(--space-2) 0 0;
  font-size: 17px;
}

/* ===================== 화면 1 : 생각 열기 ===================== */
.bigq {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.6;
}

.options--row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (max-width: 767px) {
  .options--row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.option--big {
  align-items: center;
  min-height: 72px;
}

.option--big .option__text {
  display: flex;
  flex-direction: column;
}

.compare-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
}

.compare-card.is-picked {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.compare-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.compare-card__title {
  font-weight: 800;
}

/* 100줄이 쌓이는 모습 : 높이를 고정하고 안에서만 스크롤한다 */
.longcode {
  max-height: 220px;
  overflow: auto;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
}

.longcode__lines {
  display: flex;
  flex-direction: column;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: #334155;
}

.longcode__line {
  white-space: pre;
  animation: screen-fade 120ms ease;
}

.longcode__dots {
  color: var(--color-text-sub);
  font-size: 18px;
  letter-spacing: 0.3em;
}

.longcode__count {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

/* ===================== 변수 상태 상자 (11.4) ===================== */
.varbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.varbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 96px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.varbox__label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.varbox__value {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--color-primary-dark);
}

.varbox.is-changed {
  animation: varbox-pop 420ms ease;
}

@keyframes varbox-pop {
  0% {
    transform: scale(1);
    border-color: var(--color-border-strong);
    background: var(--color-surface);
  }
  40% {
    transform: scale(1.08);
    border-color: var(--color-primary);
    background: var(--color-primary-soft);
  }
  100% {
    transform: scale(1);
    border-color: var(--color-primary);
    background: var(--color-surface);
  }
}

/* ===================== 반복 회차 표시 (11.3) ===================== */
.round-meter {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.round-meter__text {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.round-meter__bar {
  flex: 1 1 auto;
  height: 8px;
  min-width: 60px;
  border-radius: 99px;
  background: rgba(37, 99, 235, 0.18);
  overflow: hidden;
}

.round-meter__fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: var(--color-primary);
  transition: width var(--dur-progress) ease;
}

/* ===================== 값 카드 (7.1 · 7.3) ===================== */
.valuecards-wrap {
  position: relative;
  overflow-x: auto;
  padding-bottom: var(--space-5);
}

.valuecards {
  display: flex;
  gap: var(--space-2);
  min-width: max-content;
}

.valuecard {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-2);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  transition: all var(--dur-highlight) ease;
}

.valuecard.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: translateY(-3px) scale(1.06);
  box-shadow: var(--shadow);
}

.valuecard.is-used {
  opacity: 0.5;
  border-style: solid;
  background: var(--color-muted-bg);
}

/* 끝값은 점선 카드로 따로 표시한다(명세 7.3) */
.valuecard--excluded {
  position: relative;
  flex-direction: column;
  margin-left: var(--space-5);
  border-style: dashed;
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.valuecard__note {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.valuecards__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.valuecards__pointer {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 44px;
  transition: transform var(--dur-highlight) ease;
  pointer-events: none;
}

.valuecards__pointer.is-hidden {
  visibility: hidden;
}

.valuecards__arrow {
  color: var(--color-primary);
  font-weight: 900;
  line-height: 1;
}

.valuecards__pointer-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================

  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: 999px;
  background: var(--color-surface);
  font-size: var(--fs-body);

/* ------------------------------------------------------------------ */
/* 화면 4 · 5 공용 — 줄별 주석                                             */
/* ------------------------------------------------------------------ */

/* 들여쓰기 배지 바로 뒤에 코드가 붙지 않도록 한 칸 띄운다.
   (배지는 화면 4 ① 클래스 기본 구조에서만 쓴다) */

}

/* 줄별 주석 (코드 한 줄 ↔ 설명을 같은 행에) — 화면 4 ② · 화면 5 ① 이 함께 쓴다 */
.annot {
  display: grid;
  grid-template-columns: minmax(240px, 1.05fr) minmax(220px, 1fr);
  gap: var(--space-2) var(--space-3);

}

.annot__head {

  font-family: var(--font-sans);

}

  white-space: pre;
}

/* 들여쓰기 한 칸(4칸) — 왼쪽에 안내선을 두어 «클래스 안»임을 보인다. */
.annot__indent {
  display: inline-block;
  width: 4ch;
  border-left: 1px solid var(--color-indent-guide);
}

.annot__note {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: var(--space-2) var(--space-3);
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-left: 4px solid var(--color-teal);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.annot__note-key {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-teal-dark);
}

.annot__note-text {
  font-size: var(--fs-small);
  line-height: 1.55;
}

@media (max-width: 700px) {
  /* 좁은 화면에서는 «코드 줄 → 그 줄의 설명» 순서로 번갈아 쌓인다. */
  .annot {
    grid-template-columns: 1fr;
    gap: var(--space-1);

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */

}

}

/* 저장을 눌렀을 때 비어 있던 칸 — 색 말고 글자 안내도 함께 준다(명세 21장) */

}

/* ------------------------------------------------------------------ */
/* 코드 순서 조립 (명세 9.4)                                              */
/* ------------------------------------------------------------------ */
.asm-pool,
.asm-slots {

}

}

}

/* 들여쓰기 표시는 줄 «앞부분»에 두고, 폭을 고정해 코드 시작 위치를 맞춘다.
   그래야 들여쓴 조각(안내선 한 칸 만큼 밀린)과 그렇지 않은 조각이 한눈에 비교된다. */

  min-width: 0;

.asm-slot {

  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-sm);

.asm-slot.is-wrong {

/* ------------------------------------------------------------------ */

}

.s1-card {

.s1-card__title {

  background: var(--color-teal-soft);
  padding: var(--space-3);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.selfchain {

/* ------------------------------------------------------------------ */
.mchoice {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

.mchoice__card {

  gap: var(--space-1);

  text-align: left;

}

.mchoice__card:hover {

.mchoice__card.is-selected {

/* 명세 10.2 : 세 메소드를 모두 완성해야 한다. 완료 여부는 «글자와 테두리»로 함께 나타낸다.
   단, «지금 고른 카드»(is-selected)의 보라 강조를 덮지 않는다.
   두 가지는 서로 다른 정보이므로 카드 안 글자(▶ 고르는 중 · 완료 ○)로도 함께 구분한다. */
.mchoice__card.is-done:not(.is-selected) {

.mchoice__card.is-done.is-selected {

}

}

/**

      else if (typeof query.addListener === 'function') query.addListener(paint);
    }
    // 창 크기 변경(화면 회전 · 창 조절)에도 반드시 다시 그린다.

  /** 숫자 입력 + 슬라이더 */
  function numberField(opts) {
    var o = opts || {};
    var min = o.min === undefined ? 0 : o.min;
    var max = o.max === undefined ? 100 : o.max;
    var step = o.step === undefined ? 1 : o.step;
    var value = o.value === undefined ? 0 : o.value;
    var withSlider = o.withSlider !== false;

    var input = el('input', {
      type: 'number',
      'class': 'num-input',
      min: min,
      max: max,
      step: step,
      value: String(value),
      id: o.id,
      attrs: { 'aria-label': o.label, inputmode: 'numeric' }
    });
    var slider = withSlider
      ? el('input', {
          type: 'range',
          'class': 'slider',
          min: min,
          max: max,
          step: step,
          value: String(value),
          attrs: { 'aria-label': (o.label || '값') + ' 슬라이더' }
        })
      : null;

    var current = value;

    function apply(next, from) {
      var n = Number(next);
      if (isNaN(n)) return;
      n = Math.min(max, Math.max(min, n));
      current = n;
      if (from !== 'input') input.value = String(n);
      if (slider && from !== 'slider') slider.value = String(n);
      if (o.onChange) o.onChange(n);
    }

    input.addEventListener('input', function () {
      var raw = input.value;
      if (raw === '' || raw === '-') return;
      apply(raw, 'input');
    });
    input.addEventListener('blur', function () {
      apply(input.value === '' ? current : input.value);
    });
    if (slider) {
      slider.addEventListener('input', function () {
        apply(slider.value, 'slider');
      });
    }

    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [
        input,
        o.suffix ? el('span', { text: o.suffix }) : null,
        slider
      ])
    ]);

    return {
      root: root,
      input: input,
      slider: slider,
      getValue: function () {
        return current;
      },
      setValue: function (v) {
        apply(v);
      }
    };
  }

  /** 한 줄 텍스트 입력 (이번 차시 추가 헬퍼) */
  function textField(opts) {
    var o = opts || {};
    var input = el('input', {
      type: 'text',
      'class': ('num-input ' + (o.className || '')).trim(),
      id: o.id,

      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [input, o.suffix ? el('span', { text: o.suffix }) : null])

    return {
      root: root,

  /** 여러 줄 입력 (생각해 보기 · 학습 정리 문장 완성 · 이번 차시 추가 헬퍼) */

  function createFeedback(opts) {

      o.caption ? el('caption', { 'class': 'sr-only', text: o.caption }) : null,

        'tbody',

  /** 🏅 배지 카드 (명세 9.11 · 이번 차시 추가 헬퍼) */
  function award(opts) {

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {

   */
  function confirmDialog(opts) {
    var o = opts || {};
    var dismissValue = o.dismissValue === undefined ? false : o.dismissValue;
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;

        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);

      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,
      tabindex: '0',
      dataset: { tip: tip },
      attrs: { 'aria-label': text + '. ' + tip }
    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');
    });
    return node;
  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.scrollToNode = scrollToNode;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.mobileTabs = mobileTabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;
  ui.badge = badge;
  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;
})();

    <script data-from="js/20-codeview.js">
/**

 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (중첩 조건의 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시

(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  // 이 차시는 클래스 구현이 주제이므로 class · def · self · return 을 키워드로 추가한다.
  // self 는 파이썬 예약어가 아니지만, «호출한 객체»를 가리키는 이름이라는 것을 눈에 띄게 하려고
  // 키워드와 같은 색으로 칠한다(명세 20.2 : 코드의 구조가 잘 보이게 한다).
  var KEYWORDS = /^(class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

  var TOKEN_RE = /(\b(?:class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range|sum|random|randint)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\+=|-=|\/\/|[%+\-*/<>=])/g;

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */

    TOKEN_RE.lastIndex = 0;

      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);

      else out += span('tok-op', value);
      last = match.index + value.length;

  function highlightPython(source) {

    var match = normalized.match(/^ */);

  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{

   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)

        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));

   *          headCode?:string, headNote?:string, ariaLabel?:string}} opts
   *   note 에는 <code> 같은 간단한 태그를 쓸 수 있다(우리가 쓴 고정 문구만 넣는다).

        });
        return {
          className: name,
          objectName: objectName || '',
          values: values,
          /** 기본값에서 바뀐 속성 이름들 */
          changed: [],
          /** 마지막으로 바뀐 속성 이름 (화면에서 «최근 변경 속성» 으로 보여 준다) */
          lastChanged: null,
          /** 지금 호출 중인 메소드 이름 */
          runningMethod: null,
          get: function (key) {
            return this.values[key];
          },
          set: function (key, value) {
            this.values[key] = value;
            if (this.changed.indexOf(key) === -1) this.changed.push(key);
            this.lastChanged = key;
            return this;
          },
          isChanged: function (key) {
            return this.changed.indexOf(key) !== -1;
          }
        };
      }
    };
  }

  function phoneClass() {
    return makeClass('Phone', PHONE_DEFAULTS);
  }

  /**
   * 대본 한 편을 처음부터 upto 줄까지 실행한다.
   *
   * 각 줄은 { code, act, say } 이며 act 는 다음 넷 중 하나다.
   *   { type:'create', object }                        객체 생성
   *   { type:'set',    object, key, value }            속성 변경
   *   { type:'print',  object, keys }                  속성 출력
   *   { type:'call',   object, method, output(user) }   메소드 호출
   *
   * @param {Array} script 실행할 대본
   * @param {number} upto  -1 이면 아직 아무 줄도 실행하지 않은 상태
   * @returns {{objects:{}, order:string[], output:string[], lastAct:object|null,
   *            changes:Array<{object:string,key:string,from:*,to:*}>}}
   */
  function runScript(script, upto) {
    var Phone = phoneClass();
    var objects = {};
    var order = [];
    var output = [];
    var changes = [];
    var lastAct = null;
    var limit = Math.min(script.length - 1, Number(upto));

    for (var i = 0; i <= limit; i += 1) {
      var act = script[i].act;
      if (!act) continue;
      lastAct = act;
      var obj = objects[act.object];

      if (act.type === 'create') {
        objects[act.object] = Phone.create(act.object);
        order.push(act.object);
      } else if (act.type === 'set' && obj) {
        changes.push({ object: act.object, key: act.key, from: obj.get(act.key), to: act.value });
        obj.set(act.key, act.value);
      } else if (act.type === 'print' && obj) {
        output.push(
          act.keys
            .map(function (key) {
              return String(obj.get(key));
            })
            .join(' ')
        );
      } else if (act.type === 'call' && obj) {
        obj.runningMethod = act.method;
        output.push(act.output(obj));
      }
    }

    // 「지금 호출 중인 메소드」는 마지막 줄에서만 표시한다.
    Object.keys(objects).forEach(function (name) {
      if (!lastAct || lastAct.type !== 'call' || lastAct.object !== name) {
        objects[name].runningMethod = null;
      }
    });

    return {
      objects: objects,
      order: order,
      output: output,
      changes: changes,
      lastAct: lastAct,
      /** 마지막 실행 줄에서 생긴 변경 (이전 값 → 새 값 표시용) */
      lastChange: changes.length && lastAct && lastAct.type === 'set' ? changes[changes.length - 1] : null
    };
  }

  /**

        chosen.every(function (item) {

      filled: chosen.filter(function (item) {

      total: METHOD_SLOTS.length,
      elements: elements,
      problems: problems

  function methodResult(key) {

        '    user = "김정보"',
        '    color = "white"',
        '    company = "A사"',
        '',
        '    def ' + m.name + '(self):',
        '        ' + m.body,

        'phone1 = Phone()',
        'phone1.user = "민준"',
        'phone1.' + m.name + '()'

    PHONE_ATTR_NAMES: PHONE_ATTR_NAMES,
    CLASS_CODE: CLASS_CODE,
    CLASS_PARTS: CLASS_PARTS,
    /* 화면 2 */
    ERROR_KINDS: ERROR_KINDS,
    ERROR_CASES: ERROR_CASES,
    ASSEMBLY_PIECES: ASSEMBLY_PIECES,
    ASSEMBLY_POOL: ASSEMBLY_POOL,
    ASSEMBLY_SLOTS: ASSEMBLY_SLOTS,
    ATTR_PIECE_IDS: ATTR_PIECE_IDS,
    assemblyPiece: assemblyPiece,
    checkAssembly: checkAssembly,
    /* 화면 3 */
    ATTR_SCRIPT: ATTR_SCRIPT,
    ATTR_PREDICT: ATTR_PREDICT,
    DOT_MATCHES: DOT_MATCHES,
    DOT_OPTIONS: DOT_OPTIONS,
    /* 화면 4 */
    METHOD_CLASS_CODE: METHOD_CLASS_CODE,
    INDENT_LEVELS: INDENT_LEVELS,

    METHOD_SLOTS: METHOD_SLOTS,

    checkMethod: checkMethod,
    methodResult: methodResult,
    /* 모형 */
    makeClass: makeClass,
    runScript: runScript,
    runIndependence: runIndependence,
    independenceOutput: independenceOutput
  };
});

  /**
   * 코드 답안 판정 (명세 11.7)
   *
   * 규격의 세 요소를 «순서대로» 모두 충족하면 ok:true(만점 2점)다.
   * ok:false 라도 부분 점수가 있을 수 있으며, 점수는 이 함수가 아니라
   * scoreAnswer() 가 missing(틀린 빈칸 수) · ordered 로 정한다(명세 11.7).
   * 교사용 분석을 위해 「3개 중 몇 개 충족」과 오류 유형도 함께 돌려준다.
   *
   * @param {string[]|string} answer 학생이 입력한 줄
   * @param {object} spec 코드 완성 문항의 규격(없으면 5번 문항의 규격)
   * @returns {{
   *   lines:string[], matched:number, total:number, ok:boolean,
   *   elements:object,                       // { 요소key : 충족 여부 }
   *   steps:Array<{key,label,ok}>,           // 화면에 「○ 객체 생성 · ✕ …」 로 보여 줄 때 쓴다
   *   errors:string[],                       // 명세 15.5 오류 유형
   *   feedback:string[]                      // 학생에게 보여 줄 구체적 안내 (명세 20.4)
   * }}
   */
  function checkCode(answer, spec) {
    var s = spec || specOf(byId(5)) || PRACTICE_SPEC;
    var lines = codeLines(answer);
    var parsed = lines.map(parseLine);

    var elements = {};
    var at = {}; // 요소별로 «몇 번째 줄에서» 처음 마주쳤는가
    var errors = [];
    var feedback = [];
    var pushErr = function (name) {
      if (name && errors.indexOf(name) === -1) errors.push(name);
    };

    s.steps.forEach(function (step) {
      elements[step.key] = false;
      at[step.key] = -1;
    });

    parsed.forEach(function (p, i) {
      s.steps.forEach(function (step) {
        /* ① 객체 생성 */
        if (step.kind === 'create') {
          if (p.kind !== 'create') return;
          if (p.className !== s.className) {
            if (at[step.key] === -1) at[step.key] = i;
            pushErr(s.errorClassName);
            return;
          }
          if (p.target === s.objectName) {
            if (!elements[step.key]) {
              elements[step.key] = true;
              at[step.key] = i;
            }
          } else if (at[step.key] === -1) {
            at[step.key] = i;
            pushErr(step.errorWrongTarget);
          }
          return;
        }

        /* ② 속성 대입 */
        if (step.kind === 'attr') {
          if (p.kind === 'attr' && p.attr === step.attr) {
            if (p.target !== s.objectName) {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(s.errorAttrTarget);
              return;
            }
            if (p.value === step.value) {
              if (!elements[step.key]) {
                elements[step.key] = true;
                at[step.key] = i;
              }
            } else {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(step.errorValue);
            }
            return;
          }
          // 객체를 만들지 않고 속성 이름을 단독 변수로 쓴 경우
          if (p.kind === 'assign' && p.target === step.attr) pushErr(s.errorAttrTarget);
          return;
        }

        /* ③ 메소드 호출 */
        if (step.kind === 'call') {
          if (p.kind === 'call' && p.method === step.method) {
            if (p.target !== s.objectName) {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(step.errorWrongTarget);
              return;
            }
            // 소괄호 «안»도 본다. self 는 파이썬이 자동으로 전달하므로 인수를 적지 않는다.
            // book1.borrow(self) · borrow(book1) 은 이 차시가 화면 4 ⑤ 에서 오개념으로 다루는 표현이라
            // 호출로 인정하지 않는다(명세 4.6 · 28장 7).
            if (String(p.args || '').trim() !== '') {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(step.errorArgs);
              return;
            }
            if (!elements[step.key]) {
              elements[step.key] = true;
              at[step.key] = i;
            }
            return;
          }
          // 소괄호를 빼면 호출이 아니다(명세 4.5 · 28장 8).
          if (p.kind === 'ref' && p.attr === step.method) {
            if (at[step.key] === -1) at[step.key] = i;
            pushErr(step.errorNoParen);
          }
        }
      });
    });

    var matched = s.steps.filter(function (step) {
      return elements[step.key];
    }).length;

    // 순서 검사 — 세 요소를 모두 갖췄을 때만 본다(명세 11.7 「제시 조건 순서」).
    var ordered = true;
    if (matched === s.steps.length) {
      for (var k = 1; k < s.steps.length; k += 1) {
        if (at[s.steps[k].key] < at[s.steps[k - 1].key]) ordered = false;
      }
      if (!ordered) pushErr(s.errorOrder);
    }

    // 충족하지 못한 요소는 반드시 오류 유형 하나로 분류한다(명세 15.5).
    // 「줄이 아예 없는 경우」도 값이 어긋난 경우와 같은 유형으로 묶는다.
    s.steps.forEach(function (step) {
      if (elements[step.key]) return;

      if (step.kind === 'create') {
        if (
          errors.indexOf(step.errorWrongTarget) === -1 &&
          errors.indexOf(s.errorClassName) === -1
        ) {
          pushErr(step.errorMissing);
        }
        feedback.push(step.hint);
        return;
      }

      if (step.kind === 'call') {
        if (errors.indexOf(step.errorNoParen) !== -1) {
          feedback.push(step.hintNoParen || step.hint);
          return;
        }
        if (errors.indexOf(step.errorArgs) !== -1) {
          feedback.push(step.hintArgs || step.hint);
          return;
        }
        if (errors.indexOf(step.errorWrongTarget) === -1) pushErr(step.errorMissing);
        feedback.push(step.hint);
        return;
      }

      // 속성 대입
      if (errors.indexOf(s.errorAttrTarget) !== -1 && at[step.key] !== -1) {
        feedback.push(step.hintTarget || step.hint);
        return;
      }
      if (errors.indexOf(step.errorValue) !== -1) {
        feedback.push(step.hintWrongValue || step.hint);
        return;
      }
      pushErr(step.errorValue);
      feedback.push(step.hint);
    });

    if (matched === s.steps.length && !ordered) {
      feedback.push(
        '세 줄의 순서를 확인해 보세요. ' +
          s.steps
            .map(function (step) {
              return step.label;
            })
            .join(' → ') +
          ' 순서예요.'
      );
    }

    return {
      lines: lines,
      matched: matched,
      total: s.steps.length,
      /** 틀린 빈칸 수 — 부분 점수 계산의 기준이다(명세 11.7) */
      missing: s.steps.length - matched,
      ok: matched === s.steps.length && ordered,
      /** 세 요소를 모두 갖췄을 때 순서가 조건과 같은가 */
      ordered: ordered,
      elements: elements,
      steps: s.steps.map(function (step) {
        return { key: step.key, label: step.label, ok: elements[step.key] };
      }),
      errors: errors,
      feedback: feedback
    };
  }

  function scoreAnswer(q, answer) {

  }

  function correctToText(q) {
    if (q.type === 'choice') return '①②③④⑤'[q.answer - 1] + ' ' + q.options[q.answer - 1];

   * answerToText() 로 저장된 문자열을 응답 값으로 되돌린다.
   * 교사용이 제출 JSON 만으로 다시 채점할 때 쓴다(명세 18장).

  function answerFromText(q, text) {
    if (Array.isArray(text)) return q.type === 'code' ? text.slice() : null;
    var s = String(text === undefined || text === null ? '' : text).trim();

      var m = s.match(/^([1-5])[).\s]/);

   * 채점 (명세 11.1)
   * @param {object} answers  { 문항id : 응답 }  미응답은 null / undefined
   * @returns {{score, maxScore, passed, correctCount, details:Array}}
   *   details[i] = { id, answer, state:'correct'|'wrong'|'none', points, category, matchedElements }

        answer: answered ? picked : null,

        points: scoreAnswer(q, picked),
        category: q.category,

        codeErrors: check ? check.errors : null

      correctCount: details.filter(function (d) {
        return d.state === 'correct';
      }).length,
      /** 부분 점수를 받은 문항 수 (명세 11.9 결과 표시) */
      partialCount: details.filter(function (d) {
        return d.state === 'partial';
      }).length,
      details: details
    };
  }

  function passLabel(score) {

        })

  return {

    answerFromText: answerFromText,
    // 채점
    grade: grade,
    passLabel: passLabel,
    byCategory: byCategory
  };
});

    <script data-from="teacher/t15-roster.js">
/**
 * 학생 명단 파일 읽기 (교사용 · 명세 33장)
 * ------------------------------------------------------------------
 * .xlsx  : 브라우저 내장 기능만으로 처리한다. 외부 라이브러리를 쓰지 않는다.
 *          ZIP(중앙 디렉터리) 직접 해석 + DecompressionStream('deflate-raw') 로 압축 해제
 *          + DOMParser 로 sharedStrings.xml · sheet XML 파싱.
 * .csv / .tsv / .txt : 텍스트로 바로 읽는다(따옴표로 감싼 칸도 처리).
 *
 * 1차시 교사용(`../../lesson3_7_1/src/teacher/roster.js`)의 방식을 그대로 옮겨 왔다.
 * 4차시(`../../lesson3_7_4/src/teacher/t15-roster.js`)와 같은 파일이다.
 * 고칠 일이 생기면 세 차시를 함께 맞춘다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  /** 학번으로 볼 만한 열 이름 */
  var ID_HEADERS = ['학번', '학번호', '번호', 'id', 'studentid', 'student_id', '학생번호'];
  /** 이름으로 볼 만한 열 이름 */
  var NAME_HEADERS = ['이름', '성명', '학생이름', '학생명', 'name', 'studentname', 'student_name'];

  function norm(v) {
    return String(v === undefined || v === null ? '' : v)
      .trim()
      .replace(/\s+/g, '')
      .toLowerCase();
  }

  /* ------------------------------------------------------------------ */
  /* ZIP(xlsx) 풀기                                                       */
  /* ------------------------------------------------------------------ */

  /** 끝에서부터 EOCD 시그니처(0x06054b50)를 찾는다(뒤에 주석이 붙어 있을 수 있다). */
  function findEocd(view) {
    var max = Math.min(view.byteLength, 66000);
    for (var i = view.byteLength - 22; i >= view.byteLength - max && i >= 0; i -= 1) {
      if (view.getUint32(i, true) === 0x06054b50) return i;
    }
    return -1;
  }

  function inflateRaw(bytes) {
    if (typeof window.DecompressionStream !== 'function') {
      return Promise.reject(
        new Error('이 브라우저에서는 엑셀 파일을 직접 읽을 수 없어요. CSV UTF-8 로 저장해 올려 주세요.')
      );
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new window.DecompressionStream('deflate-raw'));
    return new Response(stream).arrayBuffer().then(function (buf) {
      return new Uint8Array(buf);
    });
  }

  /** xlsx(zip) 안에서 필요한 항목만 { 경로: 문자열 } 로 돌려준다. */
  function readZipEntries(buffer, wanted) {
    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var eocd = findEocd(view);
    if (eocd < 0) return Promise.reject(new Error('엑셀 파일 형식을 읽지 못했어요.'));

    var count = view.getUint16(eocd + 10, true);
    var offset = view.getUint32(eocd + 16, true);
    var decoder = new TextDecoder('utf-8');
    var out = {};
    var chain = Promise.resolve();

    for (var i = 0; i < count; i += 1) {
      if (view.getUint32(offset, true) !== 0x02014b50) break;
      var method = view.getUint16(offset + 10, true);
      var compressedSize = view.getUint32(offset + 20, true);
      var nameLen = view.getUint16(offset + 28, true);
      var extraLen = view.getUint16(offset + 30, true);
      var commentLen = view.getUint16(offset + 32, true);
      var localOffset = view.getUint32(offset + 42, true);
      var name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));

      if (wanted(name)) {
        // 지역 헤더에서 실제 자료가 시작하는 자리를 다시 계산한다.
        chain = chain.then(
          (function (entryName, entryMethod, size, lo) {
            return function () {
              var lNameLen = view.getUint16(lo + 26, true);
              var lExtraLen = view.getUint16(lo + 28, true);
              var start = lo + 30 + lNameLen + lExtraLen;
              var raw = bytes.subarray(start, start + size);
              if (entryMethod === 0) {
                out[entryName] = decoder.decode(raw);
                return null;
              }
              return inflateRaw(raw).then(function (data) {
                out[entryName] = decoder.decode(data);
              });
            };
          })(name, method, compressedSize, localOffset)
        );
      }

      offset += 46 + nameLen + extraLen + commentLen;
    }

    return chain.then(function () {
      return out;
    });
  }

  /* ------------------------------------------------------------------ */
  /* xlsx → 2차원 배열                                                    */
  /* ------------------------------------------------------------------ */

  /** 'C7' 같은 셀 주소에서 열 번호(0부터)를 얻는다. */
  function colIndex(ref) {
    var letters = String(ref).replace(/[0-9]/g, '');
    var n = 0;
    for (var i = 0; i < letters.length; i += 1) n = n * 26 + (letters.charCodeAt(i) - 64);
    return Math.max(0, n - 1);
  }

  function sheetToRows(xml, shared) {
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var rows = [];

    Array.prototype.slice.call(doc.getElementsByTagName('row')).forEach(function (rowEl) {
      var cells = [];
      Array.prototype.slice.call(rowEl.getElementsByTagName('c')).forEach(function (c) {
        var ref = c.getAttribute('r') || '';
        var type = c.getAttribute('t');
        var text = '';

        if (type === 's') {
          var v = c.getElementsByTagName('v')[0];
          var idx = v ? Number(v.textContent) : -1;
          text = shared[idx] === undefined ? '' : shared[idx];
        } else if (type === 'inlineStr') {
          text = Array.prototype.slice.call(c.getElementsByTagName('t'))
            .map(function (t) {
              return t.textContent;
            })
            .join('');
        } else {
          var v2 = c.getElementsByTagName('v')[0];
          text = v2 ? v2.textContent : '';
        }

        cells[ref ? colIndex(ref) : cells.length] = String(text === undefined || text === null ? '' : text).trim();
      });
      rows.push(cells);
    });

    return rows;
  }

  function readXlsx(file) {
    return file
      .arrayBuffer()
      .then(function (buffer) {
        return readZipEntries(buffer, function (name) {
          return (
            name === 'xl/sharedStrings.xml' ||
            name === 'xl/workbook.xml' ||
            /^xl\/worksheets\/sheet\d+\.xml$/.test(name)
          );
        });
      })
      .then(function (entries) {
        // 공유 문자열(셀에 실제 글자 대신 번호가 들어 있다)
        var shared = [];
        if (entries['xl/sharedStrings.xml']) {
          var doc = new DOMParser().parseFromString(entries['xl/sharedStrings.xml'], 'application/xml');
          Array.prototype.slice.call(doc.getElementsByTagName('si')).forEach(function (si) {
            shared.push(
              Array.prototype.slice.call(si.getElementsByTagName('t'))
                .map(function (t) {
                  return t.textContent;
                })
                .join('')
            );
          });
        }

        // 첫 번째 시트를 쓴다.
        var sheetName = Object.keys(entries)
          .filter(function (n) {
            return /^xl\/worksheets\/sheet\d+\.xml$/.test(n);
          })
          .sort()[0];
        if (!sheetName) throw new Error('엑셀에서 시트를 찾지 못했어요.');

        return sheetToRows(entries[sheetName], shared);
      });
  }

  /* ------------------------------------------------------------------ */
  /* csv · tsv → 2차원 배열                                               */
  /* ------------------------------------------------------------------ */
  function splitDelimited(text) {
    var clean = String(text || '').replace(/^﻿/, '');
    var delimiter = clean.indexOf('\t') !== -1 && clean.indexOf(',') === -1 ? '\t' : ',';
    var rows = [];
    var row = [];
    var cell = '';
    var quoted = false;

    for (var i = 0; i < clean.length; i += 1) {
      var ch = clean[i];
      if (quoted) {
        if (ch === '"') {
          if (clean[i + 1] === '"') {
            cell += '"';
            i += 1;
          } else {
            quoted = false;
          }
        } else {
          cell += ch;
        }
        continue;
      }
      if (ch === '"') quoted = true;
      else if (ch === delimiter) {
        row.push(cell.trim());
        cell = '';
      } else if (ch === '\n') {
        row.push(cell.trim());
        rows.push(row);
        row = [];
        cell = '';
      } else if (ch !== '\r') {
        cell += ch;
      }
    }
    row.push(cell.trim());
    if (
      row.some(function (c) {
        return c !== '';
      })
    ) {
      rows.push(row);
    }
    return rows;
  }

  /* ------------------------------------------------------------------ */
  /* 행 배열 → 학생 명단                                                   */
  /* ------------------------------------------------------------------ */
  function pickColumns(rows) {
    // 앞쪽 5줄 안에서 머리글을 찾는다(표 위에 제목 줄이 있는 명단이 흔하다).
    for (var r = 0; r < Math.min(rows.length, 5); r += 1) {
      var cells = rows[r] || [];
      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = norm(cell);
        if (idCol < 0 && ID_HEADERS.indexOf(v) !== -1) idCol = c;
        if (nameCol < 0 && NAME_HEADERS.indexOf(v) !== -1) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    // 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다.
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /**
   * 명단 파일을 읽는다.
   * @returns Promise<{ students:[{id,name}], warnings:string[], columns:object }>
   */
  function parseRosterFile(file) {
    var name = String(file.name || '').toLowerCase();
    var rowsPromise;

    if (/\.xlsx$/.test(name)) {
      rowsPromise = readXlsx(file);
    } else if (/\.xls$/.test(name)) {
      rowsPromise = Promise.reject(
        new Error('예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV UTF-8 로 저장해 올려 주세요.')
      );
    } else {
      rowsPromise = file.text().then(splitDelimited);
    }

    return rowsPromise.then(function (rows) {
      var picked = pickColumns(rows);
      var students = [];
      var warnings = [];
      var seen = {};

      rows.forEach(function (cells, r) {
        if (r <= picked.headerRow) return;
        var list = cells || [];
        var id = String(list[picked.idCol] === undefined ? '' : list[picked.idCol]).trim();
        var studentName = String(list[picked.nameCol] === undefined ? '' : list[picked.nameCol]).trim();
        if (!id && !studentName) return;

        // 머리글을 못 찾은 경우, 첫 줄이 「학번/이름」 같은 글자면 건너뛴다.
        if (
          picked.headerRow < 0 &&
          r === 0 &&
          (ID_HEADERS.indexOf(norm(id)) !== -1 || NAME_HEADERS.indexOf(norm(studentName)) !== -1)
        ) {
          return;
        }
        if (!id) {
          warnings.push(r + 1 + '행: 학번이 비어 있어 건너뛰었어요. (' + (studentName || '이름 없음') + ')');
          return;
        }
        if (seen[id]) {
          warnings.push(r + 1 + '행: 학번 ' + id + ' 이 여러 번 나와 한 번만 사용했어요.');
          return;
        }
        seen[id] = true;
        students.push({ id: id, name: studentName });
      });

      if (!students.length) {
        throw new Error('명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.');
      }

      return { students: students, warnings: warnings, columns: picked };
    });
  }

  /** 학번 비교용 표준형 (앞의 0 과 공백·기호를 없앤다) */
  function normalizeId(value) {
    var raw = String(value === undefined || value === null ? '' : value).trim();
    var digits = raw.replace(/[^0-9]/g, '');
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  L.roster = {
    parseRosterFile: parseRosterFile,
    normalizeId: normalizeId,
    splitDelimited: splitDelimited
  };
})();
