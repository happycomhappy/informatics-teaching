    <script data-from="teacher/t20-analysis.js">
/**
 * 교사용 분석 로직 (명세 15장 · 18장)
 *
 *  · 학생 JSON 의 totalScore 를 그대로 믿지 않고 «교사용에서 모든 문항을 다시 채점»한다(명세 18장).
 *  · 같은 학생의 제출이 여러 건이면 가장 최근 것만 쓴다.
 *  · 정오 판정 근거가 없으면 `?` 로 표시하고 0점 처리한다.
 *  · 5번(코드 입력)은 정규화된 세 줄과 필수 요소를 다시 검사하고, 오류 유형을 함께 모은다(명세 15.5).
 *  · 화면을 만들지 않는 순수 계산부라, 브라우저 밖으로 아무것도 내보내지 않는다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var QUIZ = L.quiz;
  var LESSON_ID = L.CONST.LESSON_ID;

  var CIRCLED = '①②③④⑤';

  /** 5번 코드 문항의 요소 수 (문항 규격에서 읽는다. 소재가 바뀌어도 따라온다) */
  var CODE_STEP_COUNT = (function () {
    var q = QUIZ.QUESTIONS.filter(function (x) {
      return x.type === 'code';
    })[0];
    return q && q.codeSpec ? q.codeSpec.steps.length : 3;
  })();

  /** "② …" 또는 "2" 처럼 적힌 답에서 보기 번호를 뽑는다. 없으면 0. */
  function pickNumber(text) {
    var s = String(text === undefined || text === null ? '' : text).trim();
    if (!s) return 0;
    var idx = CIRCLED.indexOf(s.charAt(0));
    if (idx !== -1) return idx + 1;
    if (/^[1-5]$/.test(s)) return Number(s);
    var m = s.match(/^([1-5])[).\s]/);
    if (m) return Number(m[1]);
    return 0;
  }

  /* ------------------------------------------------------------------ */
  /* 읽어들이기 (명세 15.1)                                                */
  /* ------------------------------------------------------------------ */

  /** 어떤 모양으로 오든 「제출 객체 배열」로 펴 준다. */
  function flatten(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) {
      return raw.reduce(function (acc, item) {
        return acc.concat(flatten(item));
      }, []);
    }
    if (typeof raw === 'object') {
      if (Array.isArray(raw.items)) return flatten(raw.items);
      if (Array.isArray(raw.data)) return flatten(raw.data);
      if (Array.isArray(raw.rows)) return flatten(raw.rows);
      if (Array.isArray(raw.submissions)) return flatten(raw.submissions);
      return [raw];
    }
    return [];
  }

  /** 이번 차시 자료만 남긴다. lesson 값이 없으면 문항 구성으로 판단한다. */
  function isThisLesson(sub) {
    if (!sub || typeof sub !== 'object') return false;
    if (sub.lesson) return String(sub.lesson) === LESSON_ID;
    return Array.isArray(sub.answers);
  }

  /** 다른 차시로 걸러진 건수 (명세 15.1 : 제외 건수를 알린다) */
  function countExcluded(raw) {
    var all = flatten(raw);
    return all.length - all.filter(isThisLesson).length;
  }

  /* ------------------------------------------------------------------ */
  /* 재채점 (명세 18장)                                                    */
  /* ------------------------------------------------------------------ */

  /**
   * 한 명의 제출을 다시 채점한다.
   * @returns {{studentId, name, receivedAt, marks, picks, code, score, storedScore,
   *            mismatch, passed, submitted}}
   */
  function regrade(sub) {
    var answers = Array.isArray(sub.answers) ? sub.answers : [];
    var marks = {};
    var picks = {};
    var code = null; // 5번 코드 분석 결과
    var score = 0;

    QUIZ.QUESTIONS.forEach(function (q) {
      var row = null;
      for (var i = 0; i < answers.length; i += 1) {
        if (Number(answers[i].questionId) === q.id) {
          row = answers[i];
          break;
        }
      }
      if (!row) {
        marks[q.id] = '-';
        return;
      }

      var raw = row.answer;
      var isEmpty =
        raw === undefined ||
        raw === null ||
        (Array.isArray(raw) ? QUIZ.codeLines(raw).length === 0 : String(raw).trim() === '');
      if (isEmpty) {
        marks[q.id] = '-';
        return;
      }

      if (q.type === 'choice') picks[q.id] = pickNumber(raw) || null;

      // ① 문항 은행의 정답 규칙으로 다시 판정한다(가장 믿을 만하다).
      //    5번은 부분 점수(2 · 1 · 0)를 가지므로 점수를 그대로 더한다(명세 11.7 · 18장).
      var restored = QUIZ.answerFromText(q, raw);
      if (restored !== null && restored !== undefined && QUIZ.isAnswered(q, restored)) {
        var state = QUIZ.stateAnswer(q, restored);
        marks[q.id] = state === 'correct' ? 'O' : state === 'partial' ? 'P' : 'X';
        score += QUIZ.scoreAnswer(q, restored);
        if (q.type === 'code') code = QUIZ.checkCode(restored, q.codeSpec);
        return;
      }
      // ② 학생 파일의 isCorrect 를 참고
      if (row.isCorrect === true || row.isCorrect === '정답') {
        marks[q.id] = 'O';
        score += q.points;
        return;
      }
      if (row.isCorrect === false || row.isCorrect === '오답') {
        marks[q.id] = 'X';
        return;
      }
      marks[q.id] = '?'; // 판정 근거 없음 → 0점
    });

    var stored = Number(sub.totalScore);
    return {
      studentId: String(sub.studentId || '').trim(),
      name: String(sub.name || '').trim(),
      receivedAt: sub.receivedAt || sub.submittedAt || '',
      marks: marks,
      picks: picks,
      code: code,
      matched: code ? code.matched : null,
      // 세 줄을 다 썼는데 순서만 어긋난 경우를 표에서 구분하기 위해 함께 담는다(명세 11.7).
      codeOrdered: code ? code.ordered : null,
      score: score,
      storedScore: isNaN(stored) ? null : stored,
      mismatch: !isNaN(stored) && stored !== score,
      passed: score >= QUIZ.PASS_SCORE,
      submitted: true
    };
  }

  function keyOf(row) {
    return (row.studentId || '') + '|' + (row.name || '');
  }

  function timeValue(text) {
    var t = Date.parse(text);
    return isNaN(t) ? 0 : t;
  }

  /** 제출 목록 정리 — 다른 차시 제외 · 같은 학생은 가장 최근 제출만 (명세 18장) */
  function buildRows(raw) {
    var list = flatten(raw).filter(isThisLesson).map(regrade);
    var map = {};
    list.forEach(function (row) {
      var key = keyOf(row);
      var prev = map[key];
      if (!prev || timeValue(row.receivedAt) >= timeValue(prev.receivedAt)) map[key] = row;
    });
    return Object.keys(map).map(function (k) {
      return map[k];
    });
  }

  /* ------------------------------------------------------------------ */
  /* 학생 명단 병합 (명세 15.2)                                             */
  /* ------------------------------------------------------------------ */

  /** CSV · TSV · TXT 한 장을 [{id, name}] 로 바꾼다. 머리글 「학번 / 이름」을 자동 인식한다. */
  function parseRoster(text) {
    var lines = String(text || '')
      .replace(/^﻿/, '')
      .split(/\r?\n/)
      .filter(function (line) {
        return line.trim().length > 0;
      });
    if (!lines.length) return [];

    var sep = lines[0].indexOf('\t') !== -1 ? '\t' : lines[0].indexOf(',') !== -1 ? ',' : /\s{2,}/;
    var split = function (line) {
      return line.split(sep).map(function (cell) {
        return cell.trim().replace(/^"|"$/g, '');
      });
    };

    var head = split(lines[0]);
    var idCol = 0;
    var nameCol = 1;
    var hasHead = false;
    head.forEach(function (cell, i) {
      if (/학번|번호|id/i.test(cell)) {
        idCol = i;
        hasHead = true;
      }
      if (/이름|성명|name/i.test(cell)) {
        nameCol = i;
        hasHead = true;
      }
    });

    return lines
      .slice(hasHead ? 1 : 0)
      .map(function (line) {
        var cells = split(line);
        return {
          id: String(cells[idCol] || '').trim(),
          name: String(cells[nameCol] || '').trim()
        };
      })
      .filter(function (row) {
        return row.id || row.name;
      });
  }

  /** 학번 비교용 표준형. t15-roster.js 가 있으면 그것을 쓴다. */
  function normalizeId(value) {
    if (L.roster && typeof L.roster.normalizeId === 'function') return L.roster.normalizeId(value);
    var raw = String(value === undefined || value === null ? '' : value).trim();
    var digits = raw.replace(/[^0-9]/g, '');
    return digits ? String(Number(digits)) : raw.toLowerCase();
  }

  /** 명단을 붙여 미제출 학생도 표에 넣는다(명세 15.2). */
  function mergeRoster(rows, roster) {
    if (!roster || !roster.length) return rows.slice();
    var byId = {};
    rows.forEach(function (row) {
      byId[normalizeId(row.studentId)] = row;
    });
    var merged = roster.map(function (person) {
      var found = byId[normalizeId(person.id)];
      if (found) {
        found.name = found.name || person.name;
        if (person.id) found.studentId = person.id;
        return found;
      }
      return {
        studentId: person.id,
        name: person.name,
        receivedAt: '',
        marks: {},
        picks: {},
        code: null,
        matched: null,
        codeOrdered: null,
        score: 0,
        storedScore: null,
        mismatch: false,
        passed: false,
        submitted: false
      };
    });
    var inRoster = {};
    roster.forEach(function (p) {
      inRoster[normalizeId(p.id)] = true;
    });
    rows.forEach(function (row) {
      if (!inRoster[normalizeId(row.studentId)]) merged.push(row);
    });
    return merged;
  }

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 15.3 · 15.4)                                                */
  /* ------------------------------------------------------------------ */
  function summarize(rows) {
    var submitted = rows.filter(function (r) {
      return r.submitted;
    });
    var scores = submitted.map(function (r) {
      return r.score;
    });
    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);
    var passCount = submitted.filter(function (r) {
      return r.passed;
    }).length;
    return {
      total: rows.length,
      submitted: submitted.length,
      missing: rows.length - submitted.length,
      average: submitted.length ? Math.round((sum / submitted.length) * 10) / 10 : 0,
      max: submitted.length ? Math.max.apply(null, scores) : 0,
      min: submitted.length ? Math.min.apply(null, scores) : 0,
      perfect: submitted.filter(function (r) {
        return r.score === QUIZ.MAX_SCORE;
      }).length,
      passCount: passCount,
      passRate: submitted.length ? Math.round((passCount / submitted.length) * 100) : 0,
      mismatch: submitted.filter(function (r) {
        return r.mismatch;
      }).length
    };
  }

  /** 명세 15.4 : 점수 높은 순 → 동점이면 제출 시각 빠른 순 */
  function top3(rows) {
    return rows
      .filter(function (r) {
        return r.submitted;
      })
      .slice()
      .sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return timeValue(a.receivedAt) - timeValue(b.receivedAt);
      })
      .slice(0, 3);
  }

  /** 명세 15.5 : 오답률 → 오답 인원 → 문항 번호 순으로 정렬한 문항 분석 */
  function questionStats(rows) {
    var submitted = rows.filter(function (r) {
      return r.submitted;
    });
    var stats = QUIZ.QUESTIONS.map(function (q) {
      var wrong = 0;
      var partial = 0; // 5번 부분 정답(명세 11.7)
      var none = 0;
      var unknown = 0;
      var dist = [0, 0, 0, 0, 0];
      var errors = {}; // 코드 오류 유형 분포
      var matchedSum = 0;
      var matchedCount = 0;

      submitted.forEach(function (r) {
        var mark = r.marks[q.id];
        if (mark === 'X') wrong += 1;
        else if (mark === 'P') partial += 1;
        else if (mark === '-') none += 1;
        else if (mark === '?') unknown += 1;

        var picked = r.picks[q.id];
        if (picked >= 1 && picked <= 5) dist[picked - 1] += 1;

        if (q.type === 'code' && r.code) {
          matchedSum += r.code.matched;
          matchedCount += 1;
          if (mark !== 'O') {
            (r.code.errors || []).forEach(function (name) {
              errors[name] = (errors[name] || 0) + 1;
            });
          }
        }
      });

      // 만점을 받지 못한 인원 — 부분 정답도 «다시 짚어야 할» 대상이므로 포함한다(명세 15.5).
      var missCount = wrong + partial + none + unknown;
      return {
        question: q,
        wrong: wrong,
        partial: partial,
        none: none,
        unknown: unknown,
        missCount: missCount,
        correct: submitted.length - missCount,
        total: submitted.length,
        rate: submitted.length ? Math.round((missCount / submitted.length) * 100) : 0,
        correctRate: submitted.length
          ? Math.round(((submitted.length - missCount) / submitted.length) * 100)
          : 0,
        dist: dist,
        errors: errors,
        avgMatched: matchedCount ? Math.round((matchedSum / matchedCount) * 10) / 10 : null
      };
    });
    return stats.sort(function (a, b) {
      if (b.rate !== a.rate) return b.rate - a.rate;
      if (b.missCount !== a.missCount) return b.missCount - a.missCount;
      return a.question.id - b.question.id;
    });
  }

  /** 영역별 정답률 — 정답률이 낮은 순으로 돌려준다. */
  function categoryStats(rows) {
    var byId = {};
    questionStats(rows).forEach(function (item) {
      byId[item.question.id] = item;
    });
    return QUIZ.byCategory()
      .map(function (group) {
        var correct = 0;
        var total = 0;
        // 명세 11.7 : 5번은 부분 점수가 있으므로 «맞힌 사람 수»가 아니라 «획득 점수»로 정답률을 낸다.
        // 그러지 않으면 부분 정답이 완전 오답과 같아져 「코드 직접 작성」 영역이 늘 최하위로 보인다.
        var earned = 0;
        var possible = 0;
        group.questions.forEach(function (q) {
          var item = byId[q.id];
          if (!item) return;
          correct += item.correct;
          total += item.total;
          earned += item.correct * q.points + item.partial * QUIZ.PARTIAL_POINT;
          possible += item.total * q.points;
        });
        return {
          category: group.category,
          questions: group.questions.map(function (q) {
            return q.id;
          }),
          correct: correct,
          total: total,
          earned: earned,
          possible: possible,
          correctRate: possible ? Math.round((earned / possible) * 100) : 0
        };
      })
      .sort(function (a, b) {
        return a.correctRate - b.correctRate;
      });
  }

  /* ------------------------------------------------------------------ */
  /* CSV (명세 15.7)                                                       */
  /* ------------------------------------------------------------------ */
  function toCSV(rows) {
    var head = ['학번', '이름'];
    QUIZ.QUESTIONS.forEach(function (q) {
      head.push(q.id + '번');
    });
    head.push('5번 충족 요소 수', '총점', '이수 여부', '제출 시각');

    var lines = [head];
    rows.forEach(function (r) {
      var line = [r.studentId, r.name];
      QUIZ.QUESTIONS.forEach(function (q) {
        line.push(r.submitted ? markSymbol(r.marks[q.id]) : '미제출');
      });
      line.push(
        r.submitted && r.matched !== null
          ? r.matched + ' / ' + CODE_STEP_COUNT + (r.codeOrdered === false ? ' (순서 오류)' : '')
          : ''
      );
      line.push(r.submitted ? String(r.score) : '');
      line.push(r.submitted ? QUIZ.passLabel(r.score) : '미제출');
      line.push(r.receivedAt || '');
      lines.push(line);
    });

    var body = lines
      .map(function (cells) {
        return cells
          .map(function (cell) {
            var text = String(cell === undefined || cell === null ? '' : cell);
            return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          })
          .join(',');
      })
      .join('\r\n');

    // 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다(명세 15.7).
    return '﻿' + body;
  }

  /** 색 없이도 읽히도록 기호로 바꾼다(명세 15.6). P 는 5번의 부분 정답이다. */
  function markSymbol(mark) {
    if (mark === 'O') return '○';
    if (mark === 'P') return '△';
    if (mark === 'X') return '✕';
    if (mark === '?') return '?';
    return '−';
  }

  L.analysis = {
    flatten: flatten,
    isThisLesson: isThisLesson,
    countExcluded: countExcluded,
    regrade: regrade,
    buildRows: buildRows,
    parseRoster: parseRoster,
    mergeRoster: mergeRoster,
    summarize: summarize,
    top3: top3,
    questionStats: questionStats,
    categoryStats: categoryStats,
    toCSV: toCSV,
    markSymbol: markSymbol,
    pickNumber: pickNumber,
    normalizeId: normalizeId
  };
})();

 *   4장 명단 · 정답표 · 지도 자료  (제출물이 없어도 언제든 열린다 · 명세 14장)

  /**

        attrs: { 'aria-label': p.no + '장 ' + p.label + ' 보기' },
        on: {
          click: function () {
            goToPage(p.no);
          }
        }
      }, [
        el('span', { 'class': 't-steps__no', text: String(p.no) }),
        el('span', { 'class': 't-steps__label', text: p.label })
      ]);
      refs.stepper.appendChild(el('li', { 'class': 't-steps__item' }, [btn]));
    });
    root.appendChild(el('nav', { 'class': 't-steps-wrap no-print' }, [refs.stepper]));
  }

  function buildPager(root) {
    refs.btnPrev = ui.button({
      label: '← 이전',
      variant: 'secondary',
      onClick: function () {
        goToPage(currentPage - 1);
      }
    });
    refs.btnNext = ui.button({
      label: '다음 →',
      variant: 'primary',
      onClick: function () {
        if (currentPage === PAGES.length) finishReview();
        else goToPage(currentPage + 1);
      }
    });
    refs.pageHint = el('p', { 'class': 't-pager__hint', attrs: { 'aria-live': 'polite' } });
    root.appendChild(
      el('footer', { 'class': 't-pager no-print' }, [refs.btnPrev, refs.pageHint, refs.btnNext])
    );
  }

  /** 3장에서는 문항 카드를 모두 확인해야 다음 장이 열린다(명세 14장). */
  function updatePager() {
    var last = currentPage === PAGES.length;
    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = '다음 →';
      refs.btnNext.classList.remove('btn--finish');
      refs.btnNext.setAttribute('aria-label', '다음 장 보기');

      if (currentPage === 3 && state.dataLoaded) {
        var total = wrongList().length;
        // 틀린 문항이 없으면 확인할 것도 없으므로 잠그지 않는다.
        var done = total === 0 || state.allWrongSeen;
        refs.btnNext.disabled = !done;
        refs.btnNext.title = done
          ? ''
          : '문항 ' + total + '개를 모두 확인하면 넘어갈 수 있어요. (' +
            Math.max(0, state.wrongIndex + 1) + ' / ' + total + ')';
        return;
      }
      refs.btnNext.disabled = false;
      refs.btnNext.title = '';
      return;
    }

    refs.btnNext.textContent = '마침';
    refs.btnNext.classList.add('btn--finish');
    refs.btnNext.disabled = false;
    refs.btnNext.title = '';
    refs.btnNext.setAttribute('aria-label', '분석 마치기');
  }

  function finishReview() {
    refs.pageHint.textContent = '분석을 마쳤어요 🎉 위 탭이나 [← 이전]으로 다시 볼 수 있어요.';
    refs.btnNext.disabled = true;
    ui.toast('결과 분석을 마쳤어요.');
    ui.announce('결과 분석을 마쳤습니다.');
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;
    var pages = [refs.page1, refs.page2, refs.page3, refs.page4];
    pages.forEach(function (page, i) {
      page.classList.toggle('is-active', i + 1 === no);
    });
    Array.prototype.slice.call(refs.stepper.querySelectorAll('.t-steps__btn')).forEach(function (btn) {
      var n = Number(btn.dataset.page);
      btn.classList.toggle('is-current', n === no);
      btn.setAttribute('aria-current', n === no ? 'page' : 'false');
    });

    updatePager();
    refs.pageHint.textContent = no + ' / ' + PAGES.length + '장 · ' + PAGES[no - 1].label;
    writeStore(PAGE_KEY, String(no));

    window.scrollTo(0, 0);
    var page = pages[no - 1];
    if (page && typeof page.focus === 'function') page.focus({ preventScroll: true });
    ui.announce(no + '장 ' + PAGES[no - 1].label);
  }

  /* ------------------------------------------------------------------ */
  /* 1장 — 결과 불러오기 (명세 15.1)                                        */
  /* ------------------------------------------------------------------ */
  function setStatus(kind, text) {
    refs.status.className = 't-status' + (kind ? ' is-' + kind : '');
    refs.status.textContent = text;
  }

  function refresh() {
    state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
    state.excluded = A.countExcluded(state.raw);
    state.dataLoaded = state.rows.some(function (r) {
      return r.submitted;
    });
    state.wrongIndex = -1;
    state.allWrongSeen = wrongList().length === 0;
    renderAll();
  }

  function addRaw(items, label) {
    state.raw = state.raw.concat(items);
    refresh();
    var count = state.rows.filter(function (r) {
      return r.submitted;
    }).length;
    setStatus(
      'ok',
      label + ' — 지금까지 제출 ' + count + '명' +
        (state.excluded ? ' · 다른 차시 자료 ' + state.excluded + '건 제외' : '')
    );
    if (state.dataLoaded && currentPage === 1) showPage(2);
  }

  function readFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    var jsons = list.filter(function (f) {
      return /\.json$/i.test(f.name);
    });
    var skipped = list.length - jsons.length;
    if (!jsons.length) {
      setStatus('error', 'JSON 파일이 없어요. (건너뛴 파일 ' + skipped + '개)');
      return;
    }
    setStatus('loading', jsons.length + '개 파일을 읽는 중…');

    var results = [];
    var done = 0;
    jsons.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          results.push(JSON.parse(String(reader.result)));
        } catch (err) {
          if (window.console) console.warn('[teacher] JSON 을 읽지 못했습니다 : ' + file.name, err);
        }
        done += 1;
        if (done === jsons.length) {
          addRaw(
            results,
            'JSON 파일 ' + jsons.length + '개를 읽었어요' + (skipped ? ' (건너뛴 파일 ' + skipped + '개)' : '')
          );
        }
      };
      reader.onerror = function () {
        done += 1;
        if (done === jsons.length) addRaw(results, '일부 파일을 읽지 못했어요');
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  function loadFromUrl() {
    var url = String(refs.urlInput.value || '').trim();
    if (!/^https?:\/\//i.test(url)) {
      setStatus('error', 'Analytics.gs 를 배포한 /exec 주소를 넣어 주세요.');
      return;
    }
    setStatus('loading', '주소에서 결과를 불러오는 중…');
    window
      .fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('서버 응답 ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var data = JSON.parse(text);
        if (data && data.lesson && data.lesson !== C.LESSON_ID) {
          throw new Error('이 차시(' + C.LESSON_ID + ') 의 조회 주소가 아닌 것 같아요');
        }
        writeStore(ENDPOINT_KEY, url);
        addRaw([data], '주소에서 결과를 불러왔어요');
      })
      .catch(function (err) {
        setStatus(
          'error',
          '불러오지 못했어요 (' + (err && err.message ? err.message : '연결 실패') +
            '). [JSON 파일 열기]나 끌어다 놓기를 사용해 주세요.'
        );
      });
  }

  function buildSource(root) {
    refs.urlInput = el('input', {
      type: 'url',
      'class': 't-source__input',
      value: readStore(ENDPOINT_KEY),
      placeholder: 'https://script.google.com/macros/s/…/exec',
      attrs: { 'aria-label': 'Analytics.gs 배포 주소' }
    });
    refs.status = el('p', { 'class': 't-status', text: '아직 불러온 제출이 없어요.' });

    var fileInput = el('input', {
      type: 'file',
      accept: '.json,application/json',
      multiple: true,
      'class': 'sr-only',
      id: 't-file',
      on: {
        change: function (e) {
          readFiles(e.target.files);
          e.target.value = '';
        }
      }
    });

    var drop = el('div', {
      'class': 't-drop',
      text: '또는 제출 JSON 파일들을 이 페이지 위로 끌어다 놓으세요.'
    });
    ['dragenter', 'dragover'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove('is-over');
      });
    });
    drop.addEventListener('drop', function (e) {
      readFiles(e.dataTransfer.files);
    });
    document.addEventListener('dragover', function (e) {
      e.preventDefault();
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        readFiles(e.dataTransfer.files);
      }
    });

    var box = ui.panel({
      title: '📥 제출 결과 불러오기',
      className: 't-source',
      hint:
        '세 가지 방법 중 편한 것을 쓰면 됩니다. 계산은 모두 이 브라우저 안에서만 이루어지고, ' +
        '결과가 없어도 「정답표」와 「수업 지도 자료」는 4장에서 바로 볼 수 있어요.'
    });
    box.body.appendChild(
      el('div', { 'class': 't-source__row' }, [
        refs.urlInput,
        ui.button({ label: '주소에서 불러오기', onClick: loadFromUrl })
      ])
    );
    box.body.appendChild(
      el('div', { 'class': 't-source__row' }, [
        fileInput,
        el('label', { 'class': 'btn btn--secondary', htmlFor: 't-file', text: '📄 JSON 파일 열기' }),
        ui.button({
          label: '불러온 자료 지우기',
          variant: 'ghost',
          onClick: function () {
            state.raw = [];
            refresh();
            setStatus('', '화면에서 불러온 자료를 지웠어요. (Drive 원본 파일은 지우지 않습니다)');
          }
        })
      ])
    );
    box.body.appendChild(refs.status);
    box.body.appendChild(drop);
    box.body.appendChild(
      el('ul', { 'class': 't-hint-list' }, [
        el('li', {
          html:
            '주소에서 바로 읽으려면 <code>apps-script/Analytics.gs</code> 를 «별도 프로젝트»로 배포한 ' +
            '<code>/exec</code> 주소가 필요합니다. (답안을 저장하는 <code>Code.gs</code> 주소로는 목록을 읽을 수 없어요)'
        }),
        el('li', { html: '학생 답안 파일 이름은 <code>학번_이름.json</code> 입니다.' }),
        el('li', { html: '다른 차시(<code>lesson</code> 값이 다른) 자료는 자동으로 제외하고 건수를 알려 줍니다.' }),
        el('li', { text: '[불러온 자료 지우기] 는 화면 메모리만 비웁니다. Drive 파일은 그대로 남습니다.' })
      ])
    );
    root.appendChild(box.root);
  }

  /* ------------------------------------------------------------------ */
  /* 2장 — 전체 요약 · 상위 3명 (명세 15.3 · 15.4)                           */
  /* ------------------------------------------------------------------ */
  function statCard(label, value, unit) {
    return el('div', { 'class': 't-stat' }, [
      el('p', { 'class': 't-stat__label', text: label }),
      el('p', { 'class': 't-stat__value' }, [
        el('span', { text: String(value) }),
        unit ? el('small', { text: unit }) : null
      ])
    ]);
  }

  function emptyBox(message) {
    return el('div', { 'class': 'panel t-empty' }, [
      el('p', { text: '아직 불러온 제출이 없어요.' }),
      el('p', { 'class': 'panel__hint', text: message })
    ]);
  }

  function renderSummary() {
    var box = refs.summaryBox;
    ui.clear(box);
    if (!state.dataLoaded) {
      box.appendChild(emptyBox('1장에서 제출 결과를 먼저 불러와 주세요.'));
      return;
    }

    var s = A.summarize(state.rows);
    var panel = ui.panel({
      title: '전체 요약',
      hint: '형성평가 10점 만점 · <strong>6점 이상이면 이수</strong>입니다.'
    });
    panel.body.appendChild(
      el('div', { 'class': 't-stats' }, [
        statCard('제출 학생', s.submitted, '명'),
        statCard('평균 점수', s.average, ' / 10'),
        statCard('최고 점수', s.max, ' / 10'),
        statCard('최저 점수', s.min, ' / 10'),
        statCard('만점자', s.perfect, '명'),
        statCard('이수 인원', s.passCount, '명 · ' + s.passRate + '%')
      ])
    );
    if (s.missing > 0) {
      panel.body.appendChild(
        el('p', {
          'class': 't-warn',
          text: '명단 기준 미제출 학생이 ' + s.missing + '명 있습니다. (4장에서 확인)'
        })
      );
    }
    if (s.mismatch > 0) {
      panel.body.appendChild(
        el('p', {
          'class': 't-warn',
          // 여기에는 태그가 들어 있으므로 html 로 넣는다. text 로 넣으면 <strong> 이 글자로 보인다.
          html:
            '학생 파일에 저장된 총점과 교사용 재채점 점수가 다른 제출이 ' + s.mismatch +
            '건 있습니다. 표의 총점은 <strong>재채점 결과</strong>입니다.'
        })
      );
    }
    if (state.excluded > 0) {
      panel.body.appendChild(
        el('p', {
          'class': 't-warn',
          text: '다른 차시의 자료 ' + state.excluded + '건은 분석에서 제외했습니다.'
        })
      );
    }
    box.appendChild(panel.root);
  }

  function renderPodium() {
    var box = refs.podiumBox;
    ui.clear(box);
    if (!state.dataLoaded) return;

    var medals = ['🥇', '🥈', '🥉'];
    var praise = [
      '클래스 선언 문법과 self 의 역할을 정확히 이해했습니다.',
      '코드를 한 줄씩 끝까지 따라 읽는 힘이 좋아요. 친구에게 설명하는 역할을 맡겨 보세요.',
      '객체마다 속성값이 따로 저장된다는 점을 스스로 확인하며 푼 태도가 돋보여요.'
    ];
    var list = A.top3(state.rows);
    var panel = ui.panel({
      title: '상위 3명',
      hint: '점수가 같으면 <strong>먼저 제출한 학생</strong>을 앞에 둡니다.'
    });
    panel.body.appendChild(
      el(
        'div',
        { 'class': 't-podium' },
        list.map(function (row, i) {
          return el('div', { 'class': 't-card t-card--' + (i + 1) }, [
            el('span', { 'class': 't-card__medal', text: medals[i] }),
            el('span', { 'class': 't-card__rank', text: i + 1 + '등' }),
            el('p', { 'class': 't-card__name', text: row.name || '(이름 없음)' }),
            el('p', { 'class': 't-card__meta', text: '학번 ' + (row.studentId || '-') }),
            el('p', { 'class': 't-card__score' }, [
              el('span', { text: String(row.score) }),
              el('small', { text: ' / 10 · ' + QUIZ.passLabel(row.score) })
            ]),
            el('p', { 'class': 't-card__praise', text: i + 1 + '등 — ' + praise[i] })
          ]);
        })
      )
    );
    box.appendChild(panel.root);
  }

  /* ------------------------------------------------------------------ */
  /* 3장 — 가장 많이 틀린 문제 (명세 15.5)                                   */
  /* ------------------------------------------------------------------ */
  /**
   * 명세 15.5 : 「가장 많이 틀린 문제」 목록
   *
   *   · **오답이 있는 문항만** 넣는다. 아무도 틀리지 않은 문항은 «많이 틀린 문제»가 아니다.
   *     (한 명이 3번만 틀렸다면 이 목록에는 3번 한 개만 나온다)
   *   · 만점 미달률(오답 + 5번 부분 정답)이 높은 순서로 **최대 2개**만 보여 준다.
   *     수업 시간에 짚을 문항을 좁혀 주는 것이 목적이다.
   *   · 문항 전체의 정오는 4장의 정오표에서 볼 수 있다.
   */
  function wrongList() {
    // 같은 문항이 두 번 들어가지 않게 한다.
    // (문항 통계는 문항마다 한 줄이지만, 자료를 겹쳐 읽는 등 어떤 경우에도
    //  «1위와 2위가 같은 문항» 으로 보이는 일이 생기지 않도록 여기서 한 번 더 막는다)
    var seen = {};
    return A.questionStats(state.rows)
      .filter(function (item) {
        if (!item || !item.question) return false;
        if (item.missCount <= 0) return false;
        var id = item.question.id;
        if (seen[id]) return false;
        seen[id] = true;
        return true;
      })
      .slice(0, WRONG_LIMIT);
  }

  function renderWrong() {
    var box = refs.wrongBox;
    ui.clear(box);

    if (!state.dataLoaded) {
      box.appendChild(emptyBox('결과를 불러오면 만점 미달률이 높은 순서로 한 문항씩 보여 드려요.'));
      return;
    }

    var stats = wrongList();
    var panel = ui.panel({
      title: '가장 많이 틀린 문제',
      hint:
        '<strong>만점을 받지 못한 문항만</strong> 비율이 높은 순서로 <strong>최대 ' + WRONG_LIMIT +
        '개</strong> 보여 줍니다. (정렬 기준 : 만점 미달률 → 인원 → 문항 번호 · 5번 부분 정답도 포함)'
    });

    // 모두 정답이면 짚을 문항이 없다. 다음 장으로 그냥 넘어갈 수 있게 한다.
    if (!stats.length) {
      panel.body.appendChild(
        el('p', {
          'class': 't-empty',
          text: '만점을 받지 못한 문항이 없어요. 불러온 제출에서는 모든 문항을 맞혔습니다.'
        })
      );
      panel.body.appendChild(
        el('p', {
          'class': 'meta-count',
          text: '문항별 정오는 4장 「전체 명단 · 정오표」에서 확인할 수 있어요.'
        })
      );
      box.appendChild(panel.root);
      return;
    }

    var progress = el('p', {
      'class': 't-wrong__progress',
      text: Math.max(0, state.wrongIndex + 1) + ' / ' + stats.length + '개 확인'
    });
    panel.body.appendChild(
      el('div', { 'class': 't-wrong__controls no-print' }, [
        ui.button({
          label: state.wrongIndex < 0 ? '가장 많이 틀린 문제 보기' : '다음 문제 보기',
          onClick: function () {
            if (state.wrongIndex >= stats.length - 1) {
              ui.toast('마지막 문항까지 모두 확인했어요.');
              return;
            }
            state.wrongIndex += 1;
            if (state.wrongIndex >= stats.length - 1) state.allWrongSeen = true;
            renderWrong();
            updatePager();
          }
        }),
        ui.button({
          label: '처음부터',
          variant: 'ghost',
          onClick: function () {
            state.wrongIndex = -1;
            renderWrong();
            updatePager();
          }
        }),
        progress
      ])
    );

    if (state.wrongIndex < 0) {
      panel.body.appendChild(
        el('p', {
          'class': 't-empty',
          text:
            '[가장 많이 틀린 문제 보기]를 누르면 1위 문항부터 나옵니다. (짚어 볼 문항 ' +
            stats.length +
            '개)'
        })
      );
      box.appendChild(panel.root);
      return;
    }

    // 한 번에 «한 문항»만 보여 준다. [다음 문제 보기] 를 누르면 그 문항으로 넘어간다.
    // (카드를 쌓아 두면 수업 중에 지금 짚는 문항이 어느 것인지 흐려진다)
    panel.body.appendChild(wrongCard(stats[state.wrongIndex], state.wrongIndex));
    box.appendChild(panel.root);
  }

  function wrongCard(item, rankIndex) {
    var q = item.question;

    // 정답을 뺀 보기 중 가장 많이 고른 것(=대표 오답)
    var topWrong = -1;
    var bestCount = 0;
    item.dist.forEach(function (count, i) {
      if (i + 1 === q.answer) return;
      if (count > bestCount) {
        bestCount = count;
        topWrong = i;
      }
    });

    var distBox;
    if (q.type === 'choice') {
      distBox = el(
        'div',
        { 'class': 't-options' },
        q.options.map(function (text, i) {
          return el('div', {
            'class':
              't-option' + (i + 1 === q.answer ? ' is-answer' : '') + (i === topWrong ? ' is-top-wrong' : '')
          }, [
            el('span', { 'class': 't-option__num', text: '①②③④⑤'[i] }),
            q.optionBlocks
              ? el('pre', { 'class': 'outopt__body', text: q.optionBlocks[i].join('\n') })
              : el('span', { 'class': 't-option__text', text: text }),
            el('span', { 'class': 't-option__count', text: item.dist[i] + '명' })
          ]);
        })
      );
    } else {
      // 명세 15.5 : 5번은 코드 오류 유형 분포를 보여 준다.
      var names = Object.keys(item.errors || {});
      names.sort(function (a, b) {
        return item.errors[b] - item.errors[a];
      });
      distBox = el('div', {}, [
        el('p', {
          'class': 'meta-count',
          text:
            '평균 충족 요소 ' + (item.avgMatched === null ? '-' : item.avgMatched) + ' / 3개'
        }),
        names.length
          ? ui.dataTable({
              head: ['코드 오류 유형', '인원'],
              caption: '5번 코드 오류 유형 분포',
              rows: names.map(function (name) {
                return [name, item.errors[name] + '명'];
              })
            })
          : el('p', { 'class': 't-empty', text: '분류된 코드 오류가 없습니다.' }),
        el('div', { 'class': 'expected' }, [
          el('p', { 'class': 'expected__title', text: '모범 답안' }),
          el('pre', { 'class': 'expected__body', text: QUIZ.correctToText(q) })
        ])
      ]);
    }

    return el('div', { 'class': 't-wrong__card' }, [
      // 순위와 «문항 번호»를 함께 적는다. 어느 문항의 카드인지 한눈에 구분된다.
      el('span', {
        'class': 't-wrong__rank',
        text: '만점 미달 순위 ' + (rankIndex + 1) + '위 · 문항 ' + q.id + '번'
      }),
      el('p', { 'class': 't-wrong__title', text: '문항 ' + q.id + '. ' + q.title + ' — ' + q.short }),
      el('p', { 'class': 'meta-count', text: '유형 : ' + q.typeLabel + ' · 영역 : ' + q.category }),
      el('p', { 'class': 't-wrong__prompt' }, [
        el('span', { text: q.context }),
        el('br'),
        el('strong', { text: q.prompt })
      ]),
      q.code
        ? L.codeview.createCodeView({
            lines: q.code.split('\n').map(function (line) {
              return { code: line };
            }),
            showLineNumbers: false,
            ariaLabel: '문항 ' + q.id + ' 코드'
          }).root
        : null,
      q.codeHead
        ? L.codeview.createCodeView({
            title: '주어진 클래스',
            lines: q.codeHead.split('\n').map(function (line) {
              return { code: line };
            }),
            showLineNumbers: false,
            ariaLabel: '문항 ' + q.id + ' 준비 코드'
          }).root
        : null,
      el('div', { 'class': 't-bar' }, [
        el('div', { 'class': 't-bar__fill', style: { width: item.rate + '%' } }),
        el('div', {
          'class': 't-bar__label',
          text:
            '만점 못 받음 ' + item.missCount + ' / ' + item.total + '명 · ' + item.rate + '%' +
            (item.partial ? ' (부분 정답 ' + item.partial + '명 포함)' : '')
        })
      ]),
      distBox,
      el('p', {
        'class': 'meta-count',
        text:
          '오답 ' + item.wrong + '명' +
          (item.partial ? ' · 부분 정답 ' + item.partial + '명' : '') +
          ' · 미응답 ' + item.none + '명 · 판정 불가 ' + item.unknown + '명'
      }),
      el('div', { 'class': 't-explain' }, [
        el('p', {
          'class': 't-explain__label',
          text:
            '정답 ' +
            (q.type === 'choice' ? '①②③④⑤'[q.answer - 1] : QUIZ.correctToText(q).replace(/\n/g, ' / ')) +
            ' · 해설'
        }),
        el('p', { html: q.explain })
      ]),
      el('div', { 'class': 't-teach' }, [
        el('p', { html: '<strong>💡 이렇게 짚어 주세요</strong> — ' + q.teach }),
        el('p', {
          text:
            '보충 화면 : 화면 ' + (q.reviewSteps || [q.reviewStep]).join(' · ') + ' · 영역 : ' + q.category
        })
      ])
    ]);
  }

  function renderCategories() {
    var box = refs.categoryBox;
    ui.clear(box);
    if (!state.dataLoaded) return;

    var list = A.categoryStats(state.rows);
    var panel = ui.panel({
      title: '영역별 정답률',
      hint:
        '정답률이 낮은 영역부터 보여 줍니다. 5번은 부분 점수가 있어 «획득 점수 ÷ 배점» 으로 계산합니다. ' +
        '다음 수업의 보충 순서를 정할 때 참고하세요.'
    });
    panel.body.appendChild(
      el(
        'div',
        { 'class': 't-cats' },
        list.map(function (item, i) {
          return el('div', { 'class': 't-cat' + (i < 2 ? ' is-low' : '') }, [
            el('p', { 'class': 't-cat__name', text: item.category }),
            el('p', { 'class': 't-cat__rate', text: '정답률 ' + item.correctRate + '%' }),
            el('p', {
              'class': 't-cat__meta',
              text:
                '해당 문항 ' + item.questions.join(', ') + '번 · 획득 ' + item.earned + ' / ' +
                item.possible + '점 (만점 ' + item.correct + ' / ' + item.total + '명)'
            })
          ]);
        })
      )
    );
    box.appendChild(panel.root);
  }

  /* ------------------------------------------------------------------ */
  /* 4장 — 명단 · 정답표 · 지도 자료 (명세 15.2 · 15.6 · 15.7)                */
  /* ------------------------------------------------------------------ */
  function setRosterStatus(kind, text) {
    refs.rosterStatus.className = 't-status' + (kind ? ' is-' + kind : '');
    refs.rosterStatus.textContent = text;
  }

  function readRoster(file) {
    if (!file) return;
    setRosterStatus('loading', file.name + ' 을(를) 읽는 중…');

    L.roster
      .parseRosterFile(file)
      .then(function (result) {
        state.roster = result.students;
        state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
        renderAll();

        var message = '학생 명단 ' + result.students.length + '명을 읽었어요. 미제출 학생도 표에 나옵니다.';
        if (result.warnings.length) message += ' (건너뛴 줄 ' + result.warnings.length + '개)';
        setRosterStatus('ok', message);
        renderRosterWarnings(result.warnings);
      })
      .catch(function (err) {
        setRosterStatus('error', (err && err.message) || '명단을 읽지 못했어요.');
        renderRosterWarnings([]);
      });
  }

  function renderRosterWarnings(warnings) {
    ui.clear(refs.rosterWarn);
    if (!warnings || !warnings.length) return;
    refs.rosterWarn.appendChild(
      el('div', { 'class': 't-warn' }, [
        el('p', { text: '아래 줄은 명단에 넣지 않았어요.' }),
        el(
          'ul',
          { 'class': 't-hint-list' },
          warnings.slice(0, 10).map(function (text) {
            return el('li', { text: text });
          })
        ),
        warnings.length > 10
          ? el('p', { 'class': 'meta-count', text: '그 밖에 ' + (warnings.length - 10) + '줄 더 있어요.' })
          : null
      ])
    );
  }

  function buildRosterUpload(root) {
    var input = el('input', {
      type: 'file',
      accept: '.xlsx,.csv,.tsv,.txt',
      'class': 'sr-only',
      id: 't-roster-file',
      on: {
        change: function (e) {
          readRoster(e.target.files[0]);
          e.target.value = '';
        }
      }
    });
    refs.rosterStatus = el('p', {
      'class': 't-status',
      text: '명단을 올리지 않아도 제출한 학생만으로 분석할 수 있어요.'
    });

    var box = ui.panel({
      title: '📋 학생 명단 올리기 <span class="t-optional">(선택)</span>',
      className: 'no-print',
      hint: '엑셀(.xlsx) 또는 CSV · TSV · TXT 파일을 올리면 «제출하지 않은 학생»까지 전체 명단에 표시됩니다.'
    });
    box.body.appendChild(
      el('div', { 'class': 't-source__row' }, [
        input,
        el('label', { 'class': 'btn btn--secondary', htmlFor: 't-roster-file', text: '명단 파일 열기' }),
        ui.button({
          label: '명단 지우기',
          variant: 'ghost',
          onClick: function () {
            state.roster = [];
            state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
            renderAll();
            renderRosterWarnings([]);
            setRosterStatus('', '명단을 지웠어요. 제출한 학생만 표시합니다.');
          }
        })
      ])
    );
    box.body.appendChild(refs.rosterStatus);
    refs.rosterWarn = el('div');
    box.body.appendChild(refs.rosterWarn);
    box.body.appendChild(
      el('ul', { 'class': 't-hint-list' }, [
        el('li', { html: '엑셀 파일(<code>.xlsx</code>)을 그대로 올려도 됩니다. 첫 번째 시트를 읽습니다.' }),
        el('li', {
          html:
            '앞쪽 다섯 줄 안에 <code>학번</code>(학번호 · 번호 · id) · <code>이름</code>(성명 · name) ' +
            '머리글이 있으면 자동으로 찾습니다.'
        }),
        el('li', { text: '머리글이 없으면 첫 열을 학번, 둘째 열을 이름으로 읽습니다.' }),
        el('li', {
          html: '예전 형식(<code>.xls</code>)은 읽지 못해요. 엑셀에서 <code>.xlsx</code> 나 CSV 로 저장해 주세요.'
        })
      ])
    );
    root.appendChild(box.root);
  }

  function renderList() {
    var box = refs.listBox;
    ui.clear(box);

    var panel = ui.panel({
      title: '전체 명단 · 정오표',
      hint:
        '색이 없어도 읽히도록 <strong>○ 정답 · △ 부분 정답(5번 1점) · ✕ 오답 · − 미응답 · ? 판정 불가</strong> ' +
        '기호를 씁니다.'
    });

    if (!state.rows.length) {
      panel.body.appendChild(
        el('p', { 'class': 't-empty', text: '결과를 불러오거나 학생 명단을 올리면 전체 명단이 표시돼요.' })
      );
      box.appendChild(panel.root);
      return;
    }

    var table = el('table', { 'class': 'data-table t-list-table' });
    var headRow = el('tr', {}, [
      el('th', { scope: 'col', text: '학번' }),
      el('th', { scope: 'col', text: '이름' })
    ]);
    QUIZ.QUESTIONS.forEach(function (q) {
      headRow.appendChild(el('th', { scope: 'col', text: q.id + '번' }));
    });
    ['5번 충족 요소', '총점', '이수 여부', '제출 시각'].forEach(function (text) {
      headRow.appendChild(el('th', { scope: 'col', text: text }));
    });
    table.appendChild(el('thead', {}, [headRow]));

    var tbody = el('tbody');
    state.rows
      .slice()
      .sort(function (a, b) {
        return String(a.studentId).localeCompare(String(b.studentId), 'ko');
      })
      .forEach(function (row) {
        var tr = el('tr', { 'class': row.submitted ? '' : 'is-missing' }, [
          el('th', { scope: 'row', text: row.studentId || '-' }),
          el('td', { text: row.name || '(이름 없음)' })
        ]);
        QUIZ.QUESTIONS.forEach(function (q) {
          if (!row.submitted) {
            tr.appendChild(el('td', { 'class': 't-mark is-none', text: '−' }));
            return;
          }
          var mark = row.marks[q.id];
          var cls =
            mark === 'O'
              ? 'is-o'
              : mark === 'P'
              ? 'is-partial'
              : mark === 'X'
              ? 'is-x'
              : mark === '?'
              ? 'is-partial'
              : 'is-none';
          tr.appendChild(el('td', { 'class': 't-mark ' + cls, text: A.markSymbol(mark) }));
        });
        tr.appendChild(
          el('td', {
            text:
              row.submitted && row.matched !== null
                ? row.matched + ' / 3' + (row.codeOrdered === false ? ' (순서 오류)' : '')
                : ''
          })
        );
        tr.appendChild(el('td', { 'class': 't-score', text: row.submitted ? String(row.score) : '' }));
        tr.appendChild(
          el('td', {
            'class': row.submitted ? '' : 't-missing',
            text: row.submitted ? QUIZ.passLabel(row.score) : '미제출'
          })
        );
        tr.appendChild(el('td', { text: row.receivedAt || '' }));
        tbody.appendChild(tr);
      });
    table.appendChild(tbody);

    panel.body.appendChild(el('div', { 'class': 't-table-wrap' }, [table]));
    panel.body.appendChild(
      el('div', { 'class': 'btn-row no-print' }, [
        ui.button({ label: '⬇ CSV로 내려받기', variant: 'secondary', onClick: downloadCSV }),
        ui.button({
          label: '🖨 이 표 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
    box.appendChild(panel.root);
  }

  function downloadCSV() {
    if (!state.rows.length) {
      ui.toast('먼저 결과를 불러와 주세요.');
      return;
    }
    var csv = A.toCSV(state.rows);
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: '객체를구현하는클래스_2차시_형성평가_결과.csv' });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /* ------------------------------------------------------------------ */
  function renderAll() {
    renderSummary();
    renderPodium();
    renderWrong();
    renderCategories();
    renderList();
  }

  function boot() {
    var main = document.getElementById('teacher-main');
    if (!main) return;
    ui.clear(main);

    buildHeader(main);
    main.appendChild(
      ui.callout(
        '🔒 불러온 자료는 <strong>이 브라우저 안에서만</strong> 처리되며 어디로도 전송되지 않습니다. ' +
          '창을 닫으면 사라지므로, 남겨야 할 자료는 CSV 로 내려받거나 인쇄해 주세요.',
        { muted: true }
      )
    );
    buildStepper(main);

    /* ── 1장 ── */
    refs.page1 = el('section', {
      'class': 't-page',
      dataset: { page: '1' },
      attrs: { 'aria-label': '1장 결과 불러오기', tabindex: '-1' }
    });
    buildSource(refs.page1);

    /* ── 2장 ── */
    refs.page2 = el('section', {
      'class': 't-page',
      dataset: { page: '2' },
      attrs: { 'aria-label': '2장 요약과 상위 3명', tabindex: '-1' }
    });
    refs.summaryBox = el('div', { 'class': 'stack' });
    refs.podiumBox = el('div', { 'class': 'stack' });
    refs.page2.appendChild(refs.summaryBox);
    refs.page2.appendChild(refs.podiumBox);

    /* ── 3장 ── */
    refs.page3 = el('section', {
      'class': 't-page',
      dataset: { page: '3' },
      attrs: { 'aria-label': '3장 가장 많이 틀린 문제', tabindex: '-1' }
    });
    refs.wrongBox = el('div', { 'class': 'stack' });
    refs.categoryBox = el('div', { 'class': 'stack' });
    refs.page3.appendChild(refs.wrongBox);
    refs.page3.appendChild(refs.categoryBox);

    /* ── 4장 ── */
    refs.page4 = el('section', {
      'class': 't-page',
      dataset: { page: '4' },
      attrs: { 'aria-label': '4장 전체 명단과 정답표, 수업 지도 자료', tabindex: '-1' }
    });
    buildRosterUpload(refs.page4);
    refs.listBox = el('div', { 'class': 'stack' });
    refs.page4.appendChild(refs.listBox);

    // 정답표와 수업 지도 자료는 «제출물이 없어도» 항상 보인다(명세 14장).
    var keyBox = el('div', { 'class': 'stack' });
    var teachBox = el('div', { 'class': 'stack' });
    refs.page4.appendChild(
      ui.activityHeader({
        tag: '📄 정답표',
        title: '형성평가 정답과 해설',
        sub: '학생용 형성평가와 같은 문항 은행을 읽습니다. 제출물이 없어도 언제든 볼 수 있어요.',
        divided: true
      })
    );
    refs.page4.appendChild(keyBox);
    refs.page4.appendChild(
      ui.activityHeader({
        tag: '🧭 수업 지도 자료',
        title: '오늘의 핵심 · 화면별 오개념과 바로잡기 · 발문',
        sub: '권장 시간 배분과 문항별 오답 지도를 함께 담았습니다.',
        divided: true
      })
    );
    refs.page4.appendChild(teachBox);

    main.appendChild(refs.page1);
    main.appendChild(refs.page2);
    main.appendChild(refs.page3);
    main.appendChild(refs.page4);

    buildPager(main);

    L.teacherKey.renderAnswerKey(keyBox);
    L.teacherKey.renderTeaching(teachBox);

    renderAll();
    showPage(1);
  }

  L.teacherApp = { boot: boot, state: state, render: renderAll, goToPage: goToPage };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
