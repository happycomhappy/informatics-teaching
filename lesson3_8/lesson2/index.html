  }

  /** 입력 변경 후 약 0.5초 지연하여 한 번만 저장한다(명세 12.1). */
  function saveState() {
    if (!hasStorage()) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        appState.savedAt = new Date().toLocaleString('ko-KR');
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        // 저장에 실패해도 학습은 계속한다(명세 12.1). 경고는 한 번만 띄운다.
        if (!warnedOnce) {
          warnedOnce = true;
          if (L.ui && L.ui.toast) L.ui.toast('학습 기록을 저장하지 못했어요. 학습은 그대로 계속할 수 있어요.');
          if (window.console) console.warn('[state] 저장에 실패했습니다.', err);
        }
      }
    }, 500);
  }

  function markChanged() {
    saveState();
    emit();
  }

  function readSavedState() {
    if (!hasStorage()) return null;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (err) {
      return null;
    }
  }

  /** 제출 주소는 학습 상태와 별도 키로 보관한다(명세 12.1). */
  function readEndpoint() {
    if (!hasStorage()) return L.CONST.SUBMIT_URL || '';
    try {
      return window.localStorage.getItem(ENDPOINT_KEY) || L.CONST.SUBMIT_URL || '';
    } catch (err) {
      return L.CONST.SUBMIT_URL || '';
    }
  }

  function saveEndpoint(url) {
    if (!hasStorage()) return;
    try {
      if (url) window.localStorage.setItem(ENDPOINT_KEY, String(url));
      else window.localStorage.removeItem(ENDPOINT_KEY);
    } catch (err) {
      /* 무시 */
    }
  }

  function deepCopy(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function mergeInto(target, source) {
    Object.keys(source).forEach(function (key) {
      var value = source[key];
      if (!(key in target)) return;
      var cur = target[key];
      if (Array.isArray(value)) {
        target[key] = deepCopy(value);
        return;
      }
      if (value && typeof value === 'object') {
        if (cur && typeof cur === 'object' && !Array.isArray(cur)) {
          // answers · picks 처럼 「키가 자유로운」 객체는 통째로 바꾼다.
          if (Object.keys(cur).length === 0) target[key] = deepCopy(value);
          else mergeInto(cur, value);
        }
        return;
      }
      if (value !== undefined) target[key] = value;
    });
  }

  /** 키가 자유로운(카드 key · 문항 id 등) 객체는 통째로 복원한다. */
  var FREE_MAPS = [
    ['step1', 'pre'],
    ['step2', 'errorPicks'],
    ['step3', 'dots'],
    ['step4', 'matches'],
    ['step5', 'picks'],
    ['step5', 'methodDone'],
    ['step6', 'answers']
  ];

  /** 「키가 자유로운」 자리는 반드시 «객체»여야 한다. 손상된 저장본이 들어와도 화면이 멈추지 않게 한다. */
  function isPlainObject(value) {
    return Boolean(value) && typeof value === 'object' && !Array.isArray(value);
  }

  /**
   * 화면 5 의 저장 형식을 손질한다.
   *  · methodDone · picks 가 객체가 아니면(null 등) 빈 객체로 되돌린다.
   *  · 옛 형식(메소드 하나만 쓰던 시절)의 평면 picks `{def,body,call}` 은
   *    저장본에 남은 method 아래로 옮겨 담는다. 옮길 곳이 없으면 버린다.
   */
  function normalizeStep5(saved) {
    var s5 = appState.step5;
    if (!isPlainObject(s5.methodDone)) s5.methodDone = {};
    if (!isPlainObject(s5.picks)) s5.picks = {};

    var legacy = {};
    Object.keys(s5.picks).forEach(function (key) {
      var value = s5.picks[key];
      if (typeof value === 'string') {
        legacy[key] = value;
        delete s5.picks[key];
        return;
      }
      if (!isPlainObject(value)) delete s5.picks[key];
    });

    if (Object.keys(legacy).length === 0) return;
    var method = saved && saved.step5 ? saved.step5.method : null;
    var known = (L.objects && L.objects.METHOD_CHOICES ? L.objects.METHOD_CHOICES : []).filter(
      function (m) {
        return m.key === method;
      }
    ).length > 0;
    if (known) s5.picks[method] = legacy;
  }

  function applySavedState(saved) {
    if (!saved) return;
    mergeInto(appState, saved);
    FREE_MAPS.forEach(function (path) {
      var savedGroup = saved[path[0]];
      if (savedGroup && isPlainObject(savedGroup[path[1]])) {
        appState[path[0]][path[1]] = deepCopy(savedGroup[path[1]]);
      }
      // 저장본이 null · 배열 · 숫자 등 «객체가 아닌 값»을 들고 있어도 빈 객체로 되돌린다.
      if (!isPlainObject(appState[path[0]][path[1]])) appState[path[0]][path[1]] = {};
    });
    normalizeStep5(saved);
    if (!Array.isArray(appState.visitedSteps) || appState.visitedSteps.length === 0) {
      appState.visitedSteps = [1];
    }
    appState.currentStep = clampStep(appState.currentStep);
    emit();
  }

  function resetState() {
    if (hasStorage()) {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        /* 무시 */
      }
    }
    var fresh = createInitialState();
    mergeInto(appState, fresh);
    appState.step1.pre = {};
    appState.step2.seenParts = [];
    appState.step2.errorPicks = {};
    appState.step2.order = [];
    appState.step3.dots = {};
    appState.step4.matches = {};
    appState.step4.compareSeen = [];
    appState.step5.picks = {};
    appState.step5.methodDone = {};
    appState.step5.mini = ['', '', ''];
    appState.step6.answers = {};
    appState.visitedSteps = [1];
    appState.currentStep = 1;
    emit();
  }

  /** 「이어서 학습하기」를 물어볼 만한 기록이 있는지(명세 12.2) */
  function hasMeaningfulProgress(saved) {
    if (!saved) return false;
    if (typeof saved.currentStep === 'number' && saved.currentStep > 1) return true;
    if (Array.isArray(saved.visitedSteps) && saved.visitedSteps.length > 1) return true;

    var s1 = saved.step1 || {};
    var s2 = saved.step2 || {};
    var s3 = saved.step3 || {};
    var s4 = saved.step4 || {};
    var s5 = saved.step5 || {};
    var s6 = saved.step6 || {};

    if (s1.answered || s1.preOk) return true;
    if (s2.errorDone || s2.orderDone || (s2.order && s2.order.length)) return true;
    if (s3.created || s3.printed || s3.predict) return true;
    if (s4.callDone || s4.selfDone || s4.matchDone) return true;
    if (s5.traceDone || s5.method || s5.miniOk) return true;
    if (s5.methodDone && Object.keys(s5.methodDone).length > 0) return true;
    if (s6.graded || (s6.bestScore !== null && s6.bestScore !== undefined)) return true;
    if (s6.answers && Object.keys(s6.answers).length > 0) return true;
    return false;
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function clampStep(step) {
    var n = Number(step) || 1;
    return Math.min(TOTAL_STEPS, Math.max(1, Math.round(n)));
  }

  function visitStep(step) {
    var n = clampStep(step);
    if (appState.visitedSteps.indexOf(n) === -1) {
      appState.visitedSteps.push(n);
      appState.visitedSteps.sort(function (a, b) {
        return a - b;
      });
    }
    appState.currentStep = n;
    markChanged();
  }

  function isVisited(step) {
    return appState.visitedSteps.indexOf(clampStep(step)) !== -1;
  }

  /* ------------------------------------------------------------------ */
  /* 단계 통과 판정 (명세 5장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 화면 5 ③ : 아직 완성하지 못한 메소드 목록 (명세 10.2)
   * 세 메소드를 «모두» 완성해야 다음 단계로 넘어간다.
   */
  function methodsLeft() {
    var done = appState.step5.methodDone || {};
    var list = L.objects && L.objects.METHOD_CHOICES ? L.objects.METHOD_CHOICES : [];
    return list.filter(function (m) {
      return done[m.key] !== true;
    });
  }

  /** 완성한 메소드 목록 (화면 표시 · 학습 기록이 함께 쓴다) */
  function methodsDone() {
    var done = appState.step5.methodDone || {};
    var list = L.objects && L.objects.METHOD_CHOICES ? L.objects.METHOD_CHOICES : [];
    return list.filter(function (m) {
      return done[m.key] === true;
    });
  }

  /** 세 메소드를 모두 완성했는가 */
  function methodsAllDone() {
    var list = L.objects && L.objects.METHOD_CHOICES ? L.objects.METHOD_CHOICES : [];
    return list.length > 0 && methodsLeft().length === 0;
  }

  /** 형성평가에서 응답을 마친 문항 수 (유형별 판정은 45-quiz.js 가 한다) */
  function answeredCount() {
    var answers = appState.step6.answers || {};
    var n = 0;
    (L.quiz ? L.quiz.QUESTIONS : []).forEach(function (q) {
      if (L.quiz.isAnswered(q, answers[q.id])) n += 1;
    });
    return n;
  }

  function canProceed(step) {
    var s = clampStep(step);
    var st = appState;

    if (s === 1) {
      // 명세 6.3 : 선수 학습 2문항을 모두 맞히면 [학습 시작] 이 열린다.
      return Boolean(st.step1.answered && st.step1.preOk);
    }
    if (s === 2) {
      // 명세 5장 : 오류 찾기 + 코드 조립 정답
      return Boolean(st.step2.errorDone && st.step2.orderDone);
    }
    if (s === 3) {
      // 명세 5장 : 두 객체 생성 + 속성 변경 + 출력 확인
      return Boolean(st.step3.created && st.step3.changed && st.step3.printed);
    }
    if (s === 4) {
      // 명세 5장 : 호출 시뮬레이션 + 연결 활동 정답 (self 흐름 확인 포함)
      return Boolean(st.step4.callDone && st.step4.selfDone && st.step4.matchDone);
    }
    if (s === 5) {
      // 명세 5장 · 10.2 · 10.4 : 독립성 실험 + 세 메소드 모두 완성 + 미니 활동 완성
      return Boolean(st.step5.traceDone && methodsAllDone() && st.step5.miniOk);
    }
    if (s === 6) {
      // 명세 11.1 : 5문항 모두 응답
      return answeredCount() === (L.quiz ? L.quiz.QUESTIONS.length : 5);
    }
    return true;
  }

  function blockedMessage(step) {
    var s = clampStep(step);
    if (s === 1) return '생각 열기에 답하고 선수 학습 2문항을 맞혀 주세요.';
    if (s === 2) return '잘못된 코드 세 사례를 모두 찾고 코드 조립을 완성해 주세요.';
    if (s === 3) return '두 객체를 만들고 속성 변경과 출력까지 실행해 주세요.';
    if (s === 4) return '메소드 호출과 self 흐름을 확인하고 개념 연결을 완성해 주세요.';
    if (s === 5) return '객체 독립성 실험 · 세 메소드 완성 · 미니 활동을 모두 마쳐 주세요.';
    if (s === 6) return '아직 답하지 않은 문항이 있어요.';
    return '';
  }

  /** 명세 5장 : 남은 활동을 구체적으로 알려 준다. */
  function remainingHint(step) {
    var s = clampStep(step);
    var st = appState;
    var parts = [];

    if (s === 1) {
      if (!st.step1.answered) parts.push('생각 열기 응답');
      if (!st.step1.preOk) parts.push('선수 학습 2문항');
    } else if (s === 2) {
      var picks = st.step2.errorPicks || {};
      var left = (L.objects ? L.objects.ERROR_CASES : []).filter(function (c) {
        return picks[c.key] !== c.answer;
      }).length;
      if (left > 0) parts.push('오류 찾기 ' + left + '사례');
      if (!st.step2.orderDone) parts.push('코드 조립');
    } else if (s === 3) {
      if (!st.step3.created) parts.push('두 객체 생성');
      if (!st.step3.changed) parts.push('속성 변경 실행');
      if (!st.step3.printed) parts.push('출력 확인');
    } else if (s === 4) {
      if (!st.step4.callDone) parts.push('메소드 호출 실행');
      if (!st.step4.selfDone) parts.push('self 흐름 4단계');
      if (!st.step4.matchDone) parts.push('개념 연결 활동');
    } else if (s === 5) {
      if (!st.step5.traceDone) parts.push('독립성 실험 실행');
      // 명세 10.2 : 남은 메소드가 무엇인지 이름으로 알려 준다.
      // (같은 함수 위쪽 화면 2 분기에서 이미 left 를 쓰므로 이름을 달리 둔다)
      var leftMethods = methodsLeft();
      if (leftMethods.length) {
        parts.push(
          '메소드 ' + leftMethods.length + '개 (' +
            leftMethods
              .map(function (m) {
                return m.label;
              })
              .join(' · ') +
            ')'
        );
      }
      // 명세 10.4 : 미니 활동(학생증 세 줄)도 마쳐야 한다.
      if (!st.step5.miniOk) parts.push('미니 활동 세 줄 입력');
    } else if (s === 6) {
      var rest = (L.quiz ? L.quiz.QUESTIONS.length : 5) - answeredCount();
      if (rest > 0) parts.push('남은 문항 ' + rest + '개');
    }
    return parts;
  }

  L.state = {
    STORAGE_KEY: STORAGE_KEY,
    ENDPOINT_KEY: ENDPOINT_KEY,
    TOTAL_STEPS: TOTAL_STEPS,
    appState: appState,
    createInitialState: createInitialState,
    onChange: onChange,
    markChanged: markChanged,
    saveState: saveState,
    readSavedState: readSavedState,
    applySavedState: applySavedState,
    resetState: resetState,
    readEndpoint: readEndpoint,
    saveEndpoint: saveEndpoint,
    hasMeaningfulProgress: hasMeaningfulProgress,
    clampStep: clampStep,
    visitStep: visitStep,
    isVisited: isVisited,
    canProceed: canProceed,
    blockedMessage: blockedMessage,
    remainingHint: remainingHint,
    answeredCount: answeredCount,
    methodsLeft: methodsLeft,
    methodsDone: methodsDone,
    methodsAllDone: methodsAllDone
  };
})();

  var PRE = [

          refs.startHint.textContent = '선수 학습 2문항을 모두 맞혀야 학습을 시작할 수 있어요. 다시 골라 보세요.';

  function paint() {

      el('div', { 'class': 's1-wrap' }, [

    <script data-from="js/61-step2.js">
/**
 * 화면 2 — 클래스 선언 (명세 7장)
 *
 *   ① 클래스 구조 분석 — 코드 줄이나 요소 칩을 누르면 그 부분의 뜻이 나온다 (명세 7.1)
 *   ② 잘못된 코드 찾기 — 세 사례의 오류 유형을 «실행 전에» 고른다 (명세 7.2)
 *   ③ 코드 조립 활동 — 클릭과 드래그 모두 지원 (명세 7.3 · 21장)
 *
 * 통과 조건 : 오류 찾기 세 사례 정답 + 코드 조립 정답 (명세 5장)
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var O = L.objects;

  var SLOT_COUNT = O.ASSEMBLY_SLOTS.length;

  /** 코드 줄 → 그 줄에서 설명할 요소 key (명세 7.1) */
  var LINE_PARTS = [['class', 'name', 'colon'], ['attrs', 'indent'], ['attrs', 'indent'], ['attrs', 'indent']];

  var refs = {};

  function st() {
    return L.state.appState.step2;
  }

  function partOf(key) {
    return (
      O.CLASS_PARTS.filter(function (p) {
        return p.key === key;
      })[0] || null
    );
  }

  /* ------------------------------------------------------------------ */
  /* ① 클래스 구조 분석 (명세 7.1)                                           */
  /* ------------------------------------------------------------------ */
  function showParts(keys, fromLine) {
    var list = keys
      .map(partOf)
      .filter(Boolean);
    if (!list.length) return;

    (st().seenParts = st().seenParts || []);
    list.forEach(function (p) {
      if (st().seenParts.indexOf(p.key) === -1) st().seenParts.push(p.key);
    });
    L.state.markChanged();

    ui.clear(refs.partBox);
    list.forEach(function (p) {
      refs.partBox.appendChild(
        el('div', { 'class': 'cpart' }, [
          el('p', { 'class': 'cpart__title' }, [
            el('code', { 'class': 'cpart__token', text: p.token }),
            el('span', { text: ' ' + p.title.replace(/^[^—]*—\s*/, '') })
          ]),
          el('p', { 'class': 'cpart__note', html: p.note })
        ])
      );
    });

    refs.chips.forEach(function (chip) {
      chip.classList.toggle('is-active', keys.indexOf(chip.dataset.key) !== -1);
    });
    refs.structCode.lineEls.forEach(function (row, i) {
      row.classList.toggle('is-picked', fromLine === i);
    });

    refs.partCount.textContent =
      '살펴본 요소 ' + st().seenParts.length + ' / ' + O.CLASS_PARTS.length + '개';
    ui.announce(list[0].title);
  }

  function buildStruct(body) {
    var view = L.codeview.createCodeView({
      title: 'class Phone: — 오늘 만들 클래스',
      showLineNumbers: true,
      ariaLabel: 'Phone 클래스 선언 코드. 줄을 누르면 그 줄의 뜻이 나옵니다.',
      lines: O.CLASS_CODE.map(function (line, i) {
        return { code: line, indentNote: i > 0 ? '들여쓰기 4칸' : null };
      })
    });
    // 코드 줄을 누르면 그 줄에서 다룰 요소를 보여 준다(명세 7.1).
    var lineEls = [];
    O.CLASS_CODE.forEach(function (line, i) {
      var row = view.lineEl(i);

          e.preventDefault();

        }
      });

    refs.structCode = view;

    var split = ui.split({ className: 'split--wide-left' });

    refs.chips = O.CLASS_PARTS.map(function (p) {

        type: 'button',

    );
    split.right.appendChild(refs.partBox);
    body.appendChild(split.root);

    // 명세 7.1 : 다섯 요소의 뜻을 «정적인 표»로 한 번 더 보여 주지 않는다.
    // 표가 있으면 학생이 코드 줄과 요소 버튼을 눌러 보지 않고 표만 읽게 된다.
    // 설명은 위 오른쪽 설명 상자(cparts)에서 하나씩 나타난다.
  }

  /* ------------------------------------------------------------------ */
  /* ② 잘못된 코드 찾기 (명세 7.2)                                           */
  /* ------------------------------------------------------------------ */
  function currentCase() {
    return O.ERROR_CASES[refs.caseIndex] || O.ERROR_CASES[0];
  }

  function errorDone() {
    var picks = st().errorPicks || {};
    return O.ERROR_CASES.every(function (c) {
      return picks[c.key] === c.answer;
    });
  }

  function paintErrorCase() {
    var c = currentCase();
    var picked = (st().errorPicks || {})[c.key] || null;

    refs.caseTabs.setValue(c.key);
    ui.clear(refs.caseBody);

    // 오류가 있는 줄을 «색과 기호로 함께» 표시한다(명세 20.2 · 21장).
    var view = L.codeview.createCodeView({
      title: c.label + ' — 이 코드에는 오류가 하나 있어요',
      showLineNumbers: true,

      el('p', { 'class': 'bigq', text: '이 코드에서 잘못된 점은 무엇일까요? 실행하기 전에 먼저 골라 보세요.' })
    );

    var buttons = [];
    refs.caseBody.appendChild(
      el(
        'div',
        { 'class': 'options', attrs: { role: 'group', 'aria-label': '오류 유형 선택' } },
        O.ERROR_KINDS.map(function (kind, i) {
          var chosen = picked === kind.value;
          var btn = el('button', {
            type: 'button',
            'class':
              'option' +
              (chosen ? ' is-selected' : '') +
              (chosen && kind.value === c.answer ? ' is-correct' : '') +
              (chosen && kind.value !== c.answer ? ' is-wrong' : '')
          }, [
            el('span', { 'class': 'option__num', text: '①②③'[i] }),
            el('span', { 'class': 'option__text', text: kind.label }),
            el('span', {

            })

    refs.caseCount.textContent = '맞힌 사례 ' + solved + ' / ' + O.ERROR_CASES.length + '개';
    if (picked) showErrorFeedback(c, picked, true);
    else refs.caseFeedback.clear();
  }

  /** 명세 20.4 : ① 잘못된 코드 → ② 그 코드가 만드는 문제 → ③ 확인할 문법 → ④ 수정 방법 */
  function showErrorFeedback(c, picked, quiet) {
    if (picked === c.answer) {
      refs.caseFeedback.show(
        'success',
        '① <strong>' + c.title + '</strong> — ' + c.why + '<br />' +
          '② <strong>무슨 문제가 생기나요?</strong> ' + c.makes + '<br />' +
          '③ <strong>다시 확인할 문법</strong> ' + c.recheck + '<br />' +
          '④ <strong>수정 방법</strong> 아래 «고친 코드» 를 확인하세요.',
        '✅'
      );
      if (!quiet) ui.toast('오류를 정확히 찾았어요.');
      return;
    }
    var chosen = O.ERROR_KINDS.filter(function (k) {
      return k.value === picked;
    })[0];
    refs.caseFeedback.show(
      'warning',
      '① 고른 것 : <strong>' + (chosen ? chosen.label : '') + '</strong><br />' +
        '② 이 코드에서는 그 부분이 문제가 아니에요.<br />' +
        '③ <strong>다시 확인할 문법</strong> 클래스 선언은 <code>class 클래스명:</code> 이고, 내부 코드는 들여씁니다.<br />' +
        '④ 코드의 <strong>' + (c.errorLine + 1) + '번째 줄</strong>을 한 글자씩 다시 살펴보세요.'
    );
  }

  function fixBox(c) {
    return el('div', { 'class': 'fixbox' }, [
      el('p', { 'class': 'fixbox__title', text: '④ 수정 방법 — 고친 코드' }),
      L.codeview.createCodeView({
        showLineNumbers: false,
        ariaLabel: '고친 코드',
        lines: c.fix.map(function (line) {
          return { code: line };
        })
      }).root
    ]);
  }

  function buildErrors(body) {
    refs.caseIndex = 0;
    refs.caseTabs = ui.tabs({
      ariaLabel: '잘못된 코드 사례 전환',
      value: O.ERROR_CASES[0].key,
      items: O.ERROR_CASES.map(function (c) {
        return { id: c.key, label: c.label };
      }),
      onChange: function (id) {
        O.ERROR_CASES.forEach(function (c, i) {
          if (c.key === id) refs.caseIndex = i;
        });
        paintErrorCase();
      }
    });
    body.appendChild(refs.caseTabs.root);

    refs.caseBody = el('div', { 'class': 'stack' });
    body.appendChild(refs.caseBody);

    refs.caseCount = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.caseCount);

    refs.caseFeedback = ui.createFeedback({
      emptyText: '오류 유형을 고르면 무엇이 문제인지 알려 드릴게요.'
    });
    body.appendChild(refs.caseFeedback.root);
    body.appendChild(
      el('p', {
        'class': 'obj-note',
        text: '세 사례를 모두 맞혀야 다음 단계로 넘어갈 수 있어요. 틀려도 다시 고를 수 있습니다.'
      })
    );
  }

  /* ------------------------------------------------------------------ */
  /* ③ 코드 조립 활동 (명세 7.3 · 21장 : 클릭과 드래그 모두 지원)                 */
  /* ------------------------------------------------------------------ */

  /**
   * 조각 한 개의 «몸통»을 만든다. 조각 목록과 조립한 자리가 같은 모양을 쓴다.
   *
   * 들여쓰기는 반드시 줄 «앞부분»에 나타낸다.
   *   ① 들여쓰기 표시 배지(폭을 고정해 코드 시작 위치를 맞춘다)
   *   ② 들여쓰기 칸(안내선) — 들여쓴 조각만
   *   ③ 코드
   * 앞에 공백 문자를 넣는 방법은 쓰지 않는다. HTML 에서 잇단 공백은 한 칸으로 합쳐져 사라진다.
   */
  function pieceBody(p) {
    var nodes = [
      el('span', { 'class': 'asm-mark', text: p.indent ? '들여쓰기 ' + p.indent + '칸' : '왼쪽 끝' })
    ];
    var code = el('span', { 'class': 'asm-code' });
    if (p.indent) {
      for (var k = 0; k < Math.floor(p.indent / 4); k += 1) {
        code.appendChild(el('span', { 'class': 'annot__indent', attrs: { 'aria-hidden': 'true' } }));
      }
    }
    code.appendChild(el('span', { text: p.text }));
    nodes.push(code);
    return nodes;
  }

  function placePiece(id) {
    if ((st().order || []).indexOf(id) !== -1) return;
    if ((st().order || []).length >= SLOT_COUNT) return;
    st().order.push(id);
    st().orderDone = false;
    refs.asmMarked = false;
    L.state.markChanged();
    paintAssemble();
  }

  function paintAssemble() {
    if (!refs.pool) return;
    var order = st().order || [];
    var result = O.checkAssembly(order);

    ui.clear(refs.pool);
    O.ASSEMBLY_POOL.forEach(function (id) {
      var p = O.assemblyPiece(id);
      var used = order.indexOf(id) !== -1;
      var btn = el('button', {
        type: 'button',
        'class': 'asm-piece',
        disabled: used || order.length >= SLOT_COUNT,
        draggable: !used && order.length < SLOT_COUNT,
        dataset: { id: id },
        attrs: {
          'aria-label':
            p.text + (p.indent ? ' (들여쓰기 ' + p.indent + '칸)' : ' (들여쓰기 없음)') + '. 다음 자리에 넣기'
        },
        on: {
          click: function () {
            placePiece(id);
          },
          dragstart: function (e) {
            if (e.dataTransfer) {
              e.dataTransfer.setData('text/plain', id);
              e.dataTransfer.effectAllowed = 'move';
            }
            btn.classList.add('is-dragging');
          },
          dragend: function () {
            btn.classList.remove('is-dragging');
          }
        }
      }, pieceBody(p));
      refs.pool.appendChild(btn);
    });

    ui.clear(refs.slots);
    O.ASSEMBLY_SLOTS.forEach(function (def, i) {
      var id = order[i];
      var slot = el('div', { 'class': 'asm-slot' }, [
        el('span', { 'class': 'asm-slot__no', text: i + 1 + '.' })
      ]);
      if (id) {
        var p = O.assemblyPiece(id);
        pieceBody(p).forEach(function (node) {
          slot.appendChild(node);
        });
        if (refs.asmMarked) {
          var ok = result.slots[i].ok;
          slot.classList.add(ok ? 'is-correct' : 'is-wrong');
          slot.appendChild(el('span', { 'class': 'sortcard__mark', text: ok ? '○' : '✕' }));
        }
      } else {
        slot.appendChild(el('span', { 'class': 'obj-note', text: '(' + def.label + ' 자리)' }));
      }
      // 드래그로도 놓을 수 있게 한다(명세 21장). 놓는 자리는 «다음 빈 자리»다.
      slot.addEventListener('dragover', function (e) {
        e.preventDefault();
        slot.classList.add('is-over');
      });
      slot.addEventListener('dragleave', function () {
        slot.classList.remove('is-over');
      });
      slot.addEventListener('drop', function (e) {
        e.preventDefault();
        slot.classList.remove('is-over');
        var dropped = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
        if (dropped) placePiece(dropped);
      });
      refs.slots.appendChild(slot);
    });

    refs.asmNote.textContent =
      order.length < SLOT_COUNT
        ? '조각을 눌러(또는 끌어다 놓아) 위에서부터 차례로 채워요. 남은 자리 ' + (SLOT_COUNT - order.length) + '칸.'
        : '네 자리를 모두 채웠어요. [조립 확인하기] 를 눌러 보세요.';
    refs.btnCheckAsm.disabled = order.length < SLOT_COUNT;
  }

  function checkAssemble() {
    var order = st().order || [];
    refs.asmMarked = true;
    var result = O.checkAssembly(order);
    st().orderDone = result.ok;
    L.state.markChanged();
    paintAssemble();

    if (result.ok) {
      refs.asmFeedback.show(
        'success',
        '정확해요! <strong>class Phone: → 세 속성이 모두 들여쓰기</strong> 구조입니다.<br />' +
          '<code>user</code> · <code>color</code> · <code>company</code> 는 모두 클래스 속성이라 ' +
          '<strong>서로 순서가 바뀌어도 정답</strong>이에요.',
        '🎉'
      );
      ui.toast('코드 조립을 완성했어요.');
      ui.announce('코드 조립을 완성했어요.');
      return;
    }

    var TEXT = {
      classFirst:
        '① 첫 자리에 <code>class Phone:</code> 이 없어요. ② 틀이 없으면 속성을 적을 곳이 없습니다. ' +
        '③ 클래스 선언이 언제나 먼저입니다. ④ 첫 자리를 <code>class Phone:</code> 으로 바꿔 보세요.',
      indent:
        '① 들여쓰기가 없는 속성 조각을 골랐어요. ② 그러면 속성이 <strong>클래스 밖</strong>의 변수가 됩니다. ' +
        '③ 클래스 내부 코드는 들여씁니다. ④ <strong>들여쓰기 4칸</strong> 조각을 고르세요.',
      duplicate:
        '① 같은 속성을 두 번 놓았어요. ② 그러면 세 속성 중 하나가 빠집니다. ' +
        '③ 이 클래스의 속성은 <code>user</code> · <code>color</code> · <code>company</code> 세 개입니다. ' +
        '④ [처음부터] 로 다시 조립해 세 속성을 각각 한 번씩 놓아 보세요.'
    };
    var msgs = result.problems
      .map(function (key) {
        return TEXT[key];
      })
      .filter(Boolean);
    if (!msgs.length) {
      msgs.push('조각의 차례를 다시 살펴보세요. 클래스 선언 → 들여쓴 속성 세 줄 순서예요.');
    }
    refs.asmFeedback.show(
      'warning',
      msgs.join('<br />') + '<br />[마지막 조각 빼기] 나 [처음부터] 로 다시 조립해 볼 수 있어요.'
    );
    ui.announce('조립을 다시 확인해 주세요.');
  }

  function buildAssemble(body) {
    refs.asmNote = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.asmNote);
    refs.asmFeedback = ui.createFeedback({ emptyText: '네 자리를 채운 뒤 [조립 확인하기] 를 눌러 보세요.' });
    body.appendChild(refs.asmFeedback.root);
    body.appendChild(
      ui.callout(
        '<strong>채점 요소</strong> — ① <code>class Phone:</code> 이 첫 줄인가 ' +
          '② 세 속성이 <strong>모두 클래스 안에 들여쓰기</strong>되었는가 ③ 세 속성이 각각 한 번씩 있는가<br />' +
          '<code>user</code> · <code>color</code> · <code>company</code> 의 <strong>순서는 바뀌어도 정답</strong>입니다.',
        { muted: true }
      )
    );

    var split = ui.split({});
    refs.pool = el('div', { 'class': 'asm-pool', attrs: { role: 'group', 'aria-label': '코드 조각' } });
    refs.slots = el('div', {
      'class': 'asm-slots',
      attrs: { role: 'group', 'aria-label': '조립한 클래스' }
    });
    split.left.appendChild(el('p', { 'class': 'field__label', text: '코드 조각 (누르거나 끌어다 놓기)' }));
    split.left.appendChild(refs.pool);
    split.right.appendChild(el('p', { 'class': 'field__label', text: '조립한 클래스' }));
    split.right.appendChild(refs.slots);
    body.appendChild(split.root);

    refs.btnCheckAsm = ui.button({ label: '조립 확인하기', onClick: checkAssemble, disabled: true });
    body.appendChild(
      ui.buttonRow([
        refs.btnCheckAsm,
        ui.button({
          label: '마지막 조각 빼기',
          variant: 'secondary',
          onClick: function () {
            st().order.pop();
            st().orderDone = false;
            refs.asmMarked = false;
            L.state.markChanged();
            paintAssemble();
          }
        }),
        ui.button({
          label: '처음부터',
          variant: 'ghost',
          onClick: function () {
            st().order = [];
            st().orderDone = false;
            refs.asmMarked = false;
            L.state.markChanged();
            paintAssemble();
            refs.asmFeedback.clear();
          }
        })
      ])
    );
  }

  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 2,
        title: C.STEP_TITLES[2],
        lead: [
          '파이썬에서 클래스는 <code>class 클래스명:</code> 형식으로 선언하고, ' +
            '속성과 메소드는 <strong>클래스 안에 들여씁니다.</strong>',
          '문법을 외우기보다 <strong>어디가 빠지면 오류가 나는지</strong>를 직접 찾아봅니다.'
        ]
      })
    );

    var struct = ui.panel({
      title: '① 클래스 구조 분석',
      hint: '코드 줄이나 아래 <strong>요소 버튼</strong>을 누르면 그 부분의 뜻이 오른쪽에 나와요.'
    });
    buildStruct(struct.body);
    root.appendChild(struct.root);

    var errors = ui.panel({
      title: '② 잘못된 코드 찾기',
      hint: '세 사례를 탭으로 비교하며 <strong>실행 전에</strong> 오류 유형을 골라 보세요.'
    });
    buildErrors(errors.body);
    root.appendChild(errors.root);

    var asm = ui.panel({
      title: '③ 코드 조립 활동',
      hint: '네 줄짜리 클래스를 올바른 <strong>순서와 들여쓰기</strong>로 완성해 보세요.'
    });
    buildAssemble(asm.body);
    root.appendChild(asm.root);

    paintErrorCase();
    paintAssemble();
    refs.partCount.textContent =
      '살펴본 요소 ' + ((st().seenParts || []).length) + ' / ' + O.CLASS_PARTS.length + '개';
  }

  function onEnter() {
    paintErrorCase();
    paintAssemble();
  }

  L.registerStep(2, {
    title: C.STEP_TITLES[2],
    short: C.STEP_SHORTS[2],
    render: render,
    onEnter: onEnter
  });
})();
    </script>
    <script data-from="js/62-step3.js">
/**
 * 화면 3 — 객체 생성과 속성 사용·변경 (명세 8장)
 *
 *   ① 실행 전 예측 — print 결과를 먼저 예측한다 (명세 8.3)
 *   ② 객체 생성과 속성 변경 시뮬레이션 (명세 8.1 · 8.2 · 8.3)
 *        · 현재 실행 줄 · 변경 대상 객체 · 이전 값 → 새 값 · 변경되지 않은 객체의 상태를 함께 표시
 *   ③ 점 표기법 확인 활동 (명세 8.4)
 *
 * 통과 조건 : 두 객체 생성 + 속성 변경 + 출력 확인 (명세 5장)
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var O = L.objects;

  var SCRIPT = O.ATTR_SCRIPT;
  var LAST = SCRIPT.length - 1;
  var CIRCLED = '①②③④⑤';

  var refs = {};

  function st() {
    return L.state.appState.step3;
  }

  /* ------------------------------------------------------------------ */
  /* ① 실행 전 예측 (명세 8.3)                                              */
  /* ------------------------------------------------------------------ */
  function paintPredict() {
    if (!refs.predictButtons) return;
    var picked = Number(st().predict) || 0;
    refs.predictButtons.forEach(function (btn, i) {
      btn.classList.toggle('is-selected', picked === i + 1);
    });
    if (!picked) {
      refs.predictNote.textContent = '아직 예측하지 않았어요. 실행 결과를 먼저 짐작해 보세요.';
      return;
    }
    // 명세 8.3 : 예측 단계에서는 «정답을 알려 주지 않는다». 실행 후에 비교한다.
    refs.predictNote.textContent = O.ATTR_PREDICT.replies[picked] || '';
  }

  function buildPredict(body) {
    /**
     * 명세 8.0 : 예측은 «무엇을 실행하는지 이미 본 뒤»에 받는다.
     * 그래서 클래스 선언과 실행할 프로그램을 통째로 먼저 보여 준다.
     * 출력 두 줄만 보여 주면 객체가 어떻게 만들어지고 속성이 어떻게 바뀌었는지 알 수 없어
     * 예측 자체가 성립하지 않는다.
     */
    var programLines = O.CLASS_CODE.map(function (line) {
      return { code: line };
    });
    programLines.push({ code: '' });
    SCRIPT.forEach(function (line) {
      var row = { code: line.code };
      if (line.act && line.act.type === 'print') row.note = '이 줄의 출력을 예측하세요';
      programLines.push(row);
    });

    body.appendChild(
      L.codeview.createCodeView({
        title: '실행할 프로그램 — 클래스 선언부터 출력까지',
        showLineNumbers: true,
        ariaLabel: '실행할 프로그램 전체 코드',
        lines: programLines
      }).root
    );

    body.appendChild(el('p', { 'class': 'bigq', text: O.ATTR_PREDICT.question }));

    refs.predictButtons = [];
    body.appendChild(
      el(
        'div',
        { 'class': 'options', attrs: { role: 'group', 'aria-label': '실행 결과 예측' } },
        O.ATTR_PREDICT.options.map(function (opt, i) {
          var btn = el('button', {
            type: 'button',
            'class': 'outopt',
            attrs: { 'aria-label': CIRCLED[i] + '번 예측. ' + opt.blocks.join(', ') }
          }, [
            el('span', { 'class': 'outopt__num', text: CIRCLED[i] }),
            el('pre', { 'class': 'outopt__body', text: opt.blocks.join('\n') })
          ]);
          btn.addEventListener('click', function () {
            st().predict = opt.value;
            L.state.markChanged();
            paintPredict();
            ui.announce('예측을 기록했어요. 아래에서 코드를 실행해 확인해 보세요.');
          });
          refs.predictButtons.push(btn);
          return btn;
        })
      )
    );
    refs.predictNote = el('p', { 'class': 'obj-quote', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.predictNote);
  }

  /* ------------------------------------------------------------------ */
  /* ② 시뮬레이션 (명세 8.1 · 8.2)                                           */
  /* ------------------------------------------------------------------ */

  /** 클래스 카드 — 객체 카드와 «시각적으로 구분»한다(명세 8.1). */
  function classCard() {
    return el('div', { 'class': 'objcard objcard--class' }, [
      el('div', { 'class': 'objcard__head' }, [
        el('span', { 'class': 'objcard__name', text: 'class Phone' }),
        el('span', { 'class': 'objcard__class', text: '클래스(틀)' })
      ]),
      el('div', { 'class': 'objcard__section' }, [
        el('p', { 'class': 'objcard__section-title', text: '클래스 속성 기본값' }),
        el(
          'div',
          {},
          O.PHONE_ATTR_NAMES.map(function (key) {
            return el('div', { 'class': 'objattr' }, [
              el('span', { 'class': 'objattr__key', text: key }),
              el('span', { 'class': 'objattr__val', text: String(O.PHONE_DEFAULTS[key]) })
            ]);
          })
        )
      ]),
      el('div', { 'class': 'objcard__section' }, [
        el('span', { 'class': 'obj-note', text: '틀 자체는 값을 저장하지 않습니다. Phone() 을 실행해야 객체가 생깁니다.' })
      ])
    ]);
  }

  /** 객체 카드 (명세 20.3 : 객체명 · 클래스명 · 속성 · 최근 변경 속성 · 호출 중인 메소드) */
  function objectCard(obj, act) {
    var isTarget = Boolean(act && act.object === obj.objectName && act.type === 'set');
    var isReading = Boolean(act && act.object === obj.objectName && act.type === 'print');
    return el('div', {
      'class': 'objcard' + (isTarget ? ' is-target' : '') + (isReading ? ' is-reading-card' : '')
    }, [
      el('div', { 'class': 'objcard__head' }, [
        el('span', { 'class': 'objcard__name', text: obj.objectName }),
        el('span', { 'class': 'objcard__class', text: 'class ' + obj.className })
      ]),
      el('div', { 'class': 'objcard__section' }, [
        el('p', { 'class': 'objcard__section-title', text: '속성' }),
        el(
          'div',
          {},
          O.PHONE_ATTR_NAMES.map(function (key) {
            var changed = obj.isChanged(key);
            var justSet = Boolean(act && act.type === 'set' && act.object === obj.objectName && act.key === key);
            return el('div', { 'class': 'objattr' + (justSet ? ' is-changed' : '') }, [
              el('span', { 'class': 'objattr__key', text: key }),
              el('span', { 'class': 'objattr__val', text: String(obj.get(key)) }),
              el('span', {
                'class': 'obj-badge ' + (changed ? 'obj-badge--changed' : 'obj-badge--kept'),
                text: changed ? '변경됨' : '유지됨'
              })
            ]);
          })
        )
      ]),
      el('div', { 'class': 'objcard__section' }, [
        el('span', {
          'class': 'obj-note',
          text: '최근 변경 속성 : ' + (obj.lastChanged || '아직 없음')
        }),
        el('span', { 'class': 'obj-badge obj-badge--instance', text: 'Phone 클래스의 객체' })
      ])
    ]);
  }

  function paintSim() {
    if (!refs.simCode) return;
    var upto = st().step;
    var result = O.runScript(SCRIPT, upto);
    var act = result.lastAct;

    /* 코드 줄 상태 — 현재 실행 줄 ▶ · 실행 완료 줄 ✔ (명세 20.2) */
    refs.simCode.clearStates();
    for (var i = 0; i <= Math.min(upto, LAST); i += 1) {
      refs.simCode.setState(i, i === upto ? 'running' : 'done');
    }
    if (upto >= 0 && upto <= LAST) refs.simCode.scrollToLine(upto);

    /* 카드 — 클래스 카드는 한 줄 전체, 그 아래 phone1 · phone2 를 «나란히» 놓는다.
       세 장을 같은 격자에 넣으면 [클래스][phone1] / [phone2] 로 어긋나 두 객체를 비교하기 어렵다. */
    ui.clear(refs.cards);
    refs.cards.appendChild(classCard());
    var pair = el('div', { 'class': 'objpair' });
    if (!result.order.length) {
      pair.appendChild(
        el('p', { 'class': 'bun-tray__empty', text: '아직 객체가 없어요. [한 줄 실행] 을 눌러 보세요.' })
      );
    }
    result.order.forEach(function (name) {
      pair.appendChild(objectCard(result.objects[name], act));
    });
    refs.cards.appendChild(pair);

    /* 현재 실행 줄 · 변경 대상 · 이전 값 → 새 값 (명세 8.2) */
    var line = SCRIPT[upto];
    ui.clear(refs.changeBox);
    if (line && line.code) {
      refs.changeBox.appendChild(
        el('p', { 'class': 'chg__line' }, [
          el('span', { 'class': 'chg__label', text: '현재 실행 줄' }),
          el('code', { text: line.code.trim() })
        ])
      );
    }
    var change = result.lastChange;
    if (change) {
      var other = result.order.filter(function (name) {
        return name !== change.object;
      })[0];
      refs.changeBox.appendChild(
        el('p', { 'class': 'chg__line' }, [
          el('span', { 'class': 'chg__label', text: '변경 대상 객체' }),
          el('code', { text: change.object })
        ])
      );
      refs.changeBox.appendChild(
        el('p', { 'class': 'chg__line' }, [
          el('span', { 'class': 'chg__label', text: '속성 변화' }),
          el('code', {
            text: change.object + '.' + change.key + ': ' + change.from + ' → ' + change.to
          })
        ])
      );
      if (other) {
        refs.changeBox.appendChild(
          el('p', { 'class': 'chg__line' }, [
            el('span', { 'class': 'chg__label', text: '바뀌지 않은 객체' }),
            el('code', {
              text: other + '.' + change.key + ': ' + result.objects[other].get(change.key) + ' 유지'
            })
          ])
        );
      }
    }
    if (!refs.changeBox.firstChild) {
      refs.changeBox.appendChild(
        el('p', { 'class': 'obj-note', text: '실행하면 어떤 객체의 어떤 속성이 바뀌는지 이곳에 표시돼요.' })
      );
    }

    refs.simSay.textContent = line && line.say ? line.say : '[한 줄 실행] 을 눌러 코드를 따라가 보세요.';
    refs.btnStep.textContent = upto >= LAST ? '↺ 다시 실행' : upto < 0 ? '▶ 한 줄 실행' : '▶ 다음 줄 실행';
    refs.simCount.textContent = '실행한 줄 ' + Math.max(0, upto + 1) + ' / ' + SCRIPT.length;
  }

  /** 실행 상태를 기록한다(단계 통과 판정에 쓰인다). */
  function markProgress(upto) {
    var result = O.runScript(SCRIPT, upto);
    if (result.order.length >= 2) st().created = true;
    if (result.changes.length > 0) st().changed = true;
    if (result.output.length >= 2) {
      st().printed = true;
      compareWithPredict(result.output);
    }
    L.state.markChanged();
  }

  /** 명세 8.3 : 실행 후 예측과 비교한다. */
  function compareWithPredict(output) {
    var predict = Number(st().predict) || 0;
    var real = output.join(' / ');
    if (!predict) {
      refs.simFeedback.show(
        'info',
        '실행 결과는 <strong>' + ui.escapeHtml(real) + '</strong> 입니다.<br />' +
          '같은 클래스로 만들어도 <strong>객체마다 속성값을 따로 저장</strong>합니다.',
        '🔎'
      );
      return;
    }
    if (predict === O.ATTR_PREDICT.answer) {
      refs.simFeedback.show(
        'success',
        '예측이 맞았어요! 실행 결과는 <strong>' + ui.escapeHtml(real) + '</strong> 입니다.<br />' +
          '<code>phone1</code> 과 <code>phone2</code> 는 <strong>서로 다른 객체</strong>라서 각자의 속성값을 가집니다.',
        '🎯'
      );
      return;
    }
    var mine = O.ATTR_PREDICT.options.filter(function (o) {
      return o.value === predict;
    })[0];
    refs.simFeedback.show(
      'info',
      '예측은 <strong>' + ui.escapeHtml(mine ? mine.blocks.join(' / ') : '') + '</strong> 였고, ' +
        '실제 결과는 <strong>' + ui.escapeHtml(real) + '</strong> 입니다.<br />' +
        '대입문 <strong>왼쪽에 적힌 객체만</strong> 바뀌기 때문이에요. ' +
        '<code>phone1.color = "black"</code> 줄에는 <code>phone2</code> 가 등장하지 않습니다.',
      '🔎'
    );
  }

  function buildSim(body) {
    var layout = ui.split({ className: 'split--wide-left' });
    var left = el('div', { 'class': 'stack' });

    refs.simCode = L.codeview.createCodeView({
      title: '실행할 코드 — 객체 생성 → 속성 변경 → 출력',
      showLineNumbers: true,
      ariaLabel: '객체 생성과 속성 변경 코드',
      lines: SCRIPT.map(function (line) {
        return { code: line.code };
      })
    });
    left.appendChild(refs.simCode.root);

    refs.btnStep = ui.button({
      label: '▶ 한 줄 실행',
      onClick: function () {
        if (st().step >= LAST) {
          st().step = -1;
          refs.console.clear();
        } else {
          st().step += 1;
          var line = SCRIPT[st().step];
          if (line && line.act && line.act.type === 'print') {
            var out = O.runScript(SCRIPT, st().step).output;
            refs.console.write(out[out.length - 1]);
          }
          markProgress(st().step);
        }
        L.state.markChanged();
        paintSim();
        var cur = SCRIPT[st().step];
        if (cur && cur.say) ui.announce(cur.say);
      }
    });

    left.appendChild(
      ui.buttonRow([
        refs.btnStep,
        ui.button({
          label: '끝까지 실행',
          variant: 'secondary',
          onClick: function () {
            st().step = LAST;
            refs.console.clear();
            O.runScript(SCRIPT, LAST).output.forEach(function (line) {
              refs.console.write(line);
            });
            markProgress(LAST);
            paintSim();
          }
        }),
        ui.button({
          label: '처음부터',
          variant: 'ghost',
          onClick: function () {
            st().step = -1;
            L.state.markChanged();
            refs.console.clear();
            refs.simFeedback.clear();
            paintSim();
          }
        })
      ])
    );
    refs.simCount = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    refs.simSay = el('p', { 'class': 'obj-quote', attrs: { 'aria-live': 'polite' } });
    refs.changeBox = el('div', { 'class': 'chg', attrs: { role: 'status', 'aria-live': 'polite' } });
    left.appendChild(refs.simCount);
    left.appendChild(refs.simSay);
    left.appendChild(refs.changeBox);
    layout.left.appendChild(left);

    refs.cards = el('div', { 'class': 'objcards objcards--stack' });
    refs.console = ui.createConsole({
      title: '실행 결과',
      emptyText: 'print() 줄을 실행하면 결과가 여기에 표시돼요.',
      ariaLabel: '속성 출력 결과'
    });
    refs.simFeedback = ui.createFeedback({ emptyText: '끝까지 실행하면 위 예측과 비교해 드릴게요.' });
    layout.right.appendChild(refs.cards);
    layout.right.appendChild(refs.console.root);
    layout.right.appendChild(refs.simFeedback.root);
    body.appendChild(layout.root);

    body.appendChild(
      ui.callout(
        '<strong>점 표기법</strong> — <code>객체이름.속성이름</code> 형식으로 속성을 사용하거나 바꿉니다. ' +
          '대입문 <strong>왼쪽에 적힌 객체</strong>만 값이 바뀌므로, 코드를 읽을 때 <strong>점 앞의 이름</strong>을 먼저 확인하세요.'
      )
    );
  }

  /* ------------------------------------------------------------------ */
  /* ③ 점 표기법 확인 활동 (명세 8.4)                                         */
  /* ------------------------------------------------------------------ */
  function paintDots() {
    if (!refs.dotRows) return;
    var picks = st().dots || {};
    var okCount = 0;

    refs.dotRows.forEach(function (row) {
      var value = picks[row.def.key] || '';
      row.select.setValue(value);
      var ok = value === row.def.answer;
      if (ok) okCount += 1;
      row.mark.textContent = !value ? '' : ok ? '○ 정답' : '✕ 다시';
      row.mark.className = 'dot-row__mark' + (!value ? '' : ok ? ' is-ok' : ' is-no');
      row.hint.textContent = !value || ok ? '' : row.def.hint;
    });

    st().dotDone = okCount === O.DOT_MATCHES.length;
    refs.dotCount.textContent = '맞힌 연결 ' + okCount + ' / ' + O.DOT_MATCHES.length + '개';
    if (st().dotDone) {
      refs.dotFeedback.show(
        'success',
        '모두 맞았어요. <code>phone1.color</code> 는 <strong>phone1 객체의 색상</strong>을 뜻합니다.',
        '🎉'
      );
    }
  }

  function buildDots(body) {
    refs.dotRows = [];
    var rows = O.DOT_MATCHES.map(function (def) {
      var mark = el('span', { 'class': 'dot-row__mark' });
      var hint = el('span', { 'class': 'dot-row__hint' });
      var select = ui.selectField({
        label: null,
        value: (st().dots || {})[def.key] || '',
        options: [{ value: '', label: '골라 주세요' }].concat(
          O.DOT_OPTIONS.map(function (o) {
            return { value: o.value, label: o.label };
          })
        ),
        onChange: function (value) {
          st().dots[def.key] = value;
          L.state.markChanged();
          paintDots();
        }
      });
      refs.dotRows.push({ def: def, select: select, mark: mark, hint: hint });
      return [
        '<code>' + ui.escapeHtml(def.left) + '</code>',
        select.root,
        el('span', {}, [mark, hint])
      ];
    });

    body.appendChild(
      ui.dataTable({
        head: ['코드', '무엇을 뜻할까요?', '확인'],
        caption: '점 표기법 연결 활동',
        className: 'dot-table',
        rows: rows
      })
    );
    refs.dotCount = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.dotCount);
    refs.dotFeedback = ui.createFeedback({ emptyText: '네 가지를 모두 연결해 보세요.' });
    body.appendChild(refs.dotFeedback.root);
  }

  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 3,
        title: C.STEP_TITLES[3],
        lead: [
          '<code>phone1 = Phone()</code> 처럼 <strong>클래스명()</strong> 을 실행하면 새 객체가 만들어집니다.',
          '<code>객체이름.속성이름</code> 형식(점 표기법)으로 속성을 사용하거나 바꿀 수 있어요. ' +
            '<strong>한 객체의 변경은 다른 객체를 바꾸지 않습니다.</strong>'
        ]
      })
    );

    // 명세 8.0 : 프로그램 전체를 «먼저» 읽고 → 예측 → 시뮬레이션 순서로 배치한다.
    var predict = ui.panel({
      title: '① 프로그램 읽고 실행 결과 예측하기',
      hint:
        '먼저 아래 <strong>프로그램 전체</strong>를 읽어 보세요. ' +
        '그다음 실행해 보기 <strong>전에</strong> 결과를 짐작해 봅니다. 맞히지 못해도 괜찮아요.'
    });
    buildPredict(predict.body);
    root.appendChild(predict.root);

    var sim = ui.panel({
      title: '② 객체 생성과 속성 변경 시뮬레이션',
      hint: '한 줄씩 실행하며 <strong>어떤 객체의 어떤 속성이 바뀌는지</strong> 확인하세요.'
    });
    buildSim(sim.body);
    root.appendChild(sim.root);

    var dots = ui.panel({
      title: '③ 점 표기법 확인',
      hint: '<code>phone1.color</code> 를 세 부분으로 나누어 각각의 뜻을 골라 보세요.'
    });
    buildDots(dots.body);
    root.appendChild(dots.root);

    paintPredict();
    paintSim();
    paintDots();
  }

  function onEnter() {
    paintPredict();
    paintSim();
    paintDots();
    if (st().printed) compareWithPredict(O.runScript(SCRIPT, LAST).output);
  }

  L.registerStep(3, {
    title: C.STEP_TITLES[3],
    short: C.STEP_SHORTS[3],
    render: render,
    onEnter: onEnter
  });
})();
    </script>
    <script data-from="js/63-step4.js">
/**
 * 화면 4 — 메소드와 self (명세 9장)
 *
 *   ① 메소드 정의 구조 — 들여쓰기 0 · 1 · 2단계를 안내선과 글자로 함께 표시 (명세 9.1)
 *   ② 메소드 호출 — phone1.call() · phone1.answer() 를 순서대로 실행 (명세 9.2)
 *   ③ self 실행 흐름 — phone1 → self → self.user → "민준" (명세 9.3)
 *   ④ 개념 연결 활동 (명세 9.4)
 *   ⑤ 오개념 비교 — call · call() · call(phone1) (명세 9.5)
 *
 * 통과 조건 : 호출 시뮬레이션 + self 흐름 확인 + 연결 활동 정답 (명세 5장)
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var O = L.objects;

  var SCRIPT = O.CALL_SCRIPT;
  var LAST = SCRIPT.length - 1;

  var refs = {};

  function st() {
    return L.state.appState.step4;
  }

  /* ------------------------------------------------------------------ */
  /* ① 메소드 정의 구조 (명세 9.1)                                            */
  /* ------------------------------------------------------------------ */
  function buildDefine(body) {
    body.appendChild(
      L.codeview.createCodeView({
        title: '메소드가 있는 Phone 클래스',
        showLineNumbers: true,
        ariaLabel: '메소드를 정의한 Phone 클래스 코드',
        lines: O.METHOD_CLASS_CODE.map(function (line) {
          return { code: line.code, note: line.note || null };
        })
      }).root
    );

    body.appendChild(
      el(
        'div',
        { 'class': 'levels' },
        O.INDENT_LEVELS.map(function (lv) {
          return el('div', { 'class': 'levels__item levels__item--' + lv.level }, [
            el('span', { 'class': 'levels__no', text: lv.label }),
            el('span', { 'class': 'levels__desc', text: lv.desc })
          ]);
        })
      )
    );

    body.appendChild(
      L.codeview.createAnnotated({
        ariaLabel: '메소드 정의 줄별 설명',
        items: [
          {
            code: '    def call(self):',
            key: 'def',
            note:
              '클래스 안에 <code>def</code> 로 정의한 함수를 <strong>메소드</strong>라고 합니다. ' +
              '메소드 정의도 클래스 안이므로 <strong>들여쓰기</strong>합니다.'
          },
          {
            code: '        print(f"{self.user}님이 전화를 겁니다.")',
            key: 'self.user',
            note:
              '메소드 내부 코드는 <strong>한 단계 더</strong> 들여씁니다. ' +
              '<code>self.user</code> 는 <strong>지금 이 메소드를 실행하고 있는 객체</strong>의 user 속성이에요.'
          }
        ]
      })
    );
    body.appendChild(
      ui.callout(
        '<code>call()</code> 과 <code>answer()</code> 는 <strong>객체가 수행하는 기능</strong>입니다. ' +
          '정의만 해 두면 실행되지 않고, <strong>호출</strong>해야 실행됩니다.'
      )
    );
  }

  /* ------------------------------------------------------------------ */
  /* ② 메소드 호출 (명세 9.2)                                                */
  /* ------------------------------------------------------------------ */
  function paintCall() {
    if (!refs.callCode) return;
    var upto = st().callStep;
    var result = O.runScript(SCRIPT, upto);
    var act = result.lastAct;

    refs.callCode.clearStates();
    for (var i = 0; i <= Math.min(upto, LAST); i += 1) {
      refs.callCode.setState(i, i === upto ? 'running' : 'done');
    }

    ui.clear(refs.callCards);
    if (!result.order.length) {
      refs.callCards.appendChild(
        el('p', { 'class': 'bun-tray__empty', text: '아직 객체가 없어요. 위에서부터 한 줄씩 실행해 보세요.' })
      );
    }
    result.order.forEach(function (name) {
      var obj = result.objects[name];
      refs.callCards.appendChild(
        el('div', { 'class': 'objcard' + (obj.runningMethod ? ' is-running-card' : '') }, [
          el('div', { 'class': 'objcard__head' }, [
            el('span', { 'class': 'objcard__name', text: name }),
            el('span', { 'class': 'objcard__class', text: 'class Phone' })
          ]),
          el('div', { 'class': 'objcard__section' }, [
            el('p', { 'class': 'objcard__section-title', text: '속성' }),
            el(
              'div',
              {},
              ['user', 'color'].map(function (key) {
                return el('div', { 'class': 'objattr' }, [
                  el('span', { 'class': 'objattr__key', text: key }),
                  el('span', { 'class': 'objattr__val', text: String(obj.get(key)) })
                ]);
              })
            )
          ]),
          el('div', { 'class': 'objcard__section' }, [
            el('span', {
              'class': 'obj-badge ' + (obj.runningMethod ? 'obj-badge--changed' : 'obj-badge--kept'),
              text: obj.runningMethod ? '호출 중 : ' + obj.runningMethod + '()' : '대기 중'
            }),
            el('span', {
              'class': 'obj-note',
              text: obj.runningMethod ? 'self = ' + name : 'self 는 호출할 때 연결됩니다.'
            })
          ])
        ])
      );
    });

    var line = SCRIPT[upto];
    refs.callSay.textContent = line && line.say ? line.say : '[한 줄 실행] 을 눌러 호출 과정을 따라가 보세요.';
    refs.btnCall.textContent = upto >= LAST ? '↺ 다시 실행' : upto < 0 ? '▶ 한 줄 실행' : '▶ 다음 줄 실행';
    refs.callCount.textContent = '실행한 줄 ' + Math.max(0, upto + 1) + ' / ' + SCRIPT.length;
    void act;
  }

  function buildCall(body) {
    var layout = ui.split({ className: 'split--wide-left' });
    var left = el('div', { 'class': 'stack' });

    refs.callCode = L.codeview.createCodeView({
      title: '실행할 코드',
      showLineNumbers: true,
      ariaLabel: '메소드 호출 코드',
      lines: SCRIPT.map(function (line) {
        return { code: line.code };
      })
    });
    left.appendChild(refs.callCode.root);

    refs.btnCall = ui.button({
      label: '▶ 한 줄 실행',
      onClick: function () {
        if (st().callStep >= LAST) {
          st().callStep = -1;
          refs.callConsole.clear();
        } else {
          st().callStep += 1;
          var line = SCRIPT[st().callStep];
          if (line && line.act && line.act.type === 'call') {
            var out = O.runScript(SCRIPT, st().callStep).output;
            refs.callConsole.write(out[out.length - 1]);
          }
          if (st().callStep >= LAST) {
            st().callDone = true;
            refs.callFeedback.show(
              'success',
              '두 메소드를 순서대로 호출했어요. 출력 메시지의 <strong>이름이 민준</strong>인 것은 ' +
                '<code>self.user</code> 가 <strong>호출한 객체의 user</strong> 를 읽었기 때문이에요.',
              '📞'
            );
          }
        }
        L.state.markChanged();
        paintCall();
        var cur = SCRIPT[st().callStep];
        if (cur && cur.say) ui.announce(cur.say);
      }
    });

    left.appendChild(
      ui.buttonRow([
        refs.btnCall,
        ui.button({
          label: '끝까지 실행',
          variant: 'secondary',
          onClick: function () {
            st().callStep = LAST;
            st().callDone = true;
            L.state.markChanged();
            refs.callConsole.clear();
            O.runScript(SCRIPT, LAST).output.forEach(function (line) {
              refs.callConsole.write(line);
            });
            paintCall();
            refs.callFeedback.show(
              'success',
              '두 메소드를 순서대로 호출했어요. <code>phone1.call()</code> → <code>phone1.answer()</code> 순서로 출력됩니다.',
              '📞'
            );
          }
        }),
        ui.button({
          label: '처음부터',
          variant: 'ghost',
          onClick: function () {
            st().callStep = -1;
            L.state.markChanged();
            refs.callConsole.clear();
            refs.callFeedback.clear();
            paintCall();
          }
        })
      ])
    );
    refs.callCount = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    refs.callSay = el('p', { 'class': 'obj-quote', attrs: { 'aria-live': 'polite' } });
    left.appendChild(refs.callCount);
    left.appendChild(refs.callSay);
    layout.left.appendChild(left);

    refs.callCards = el('div', { 'class': 'objcards' });
    refs.callConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '메소드를 호출하면 메시지가 순서대로 나타나요.',
      ariaLabel: '메소드 호출 실행 결과'
    });
    refs.callFeedback = ui.createFeedback({ emptyText: '끝까지 실행하면 무슨 일이 있었는지 정리해 드릴게요.' });
    layout.right.appendChild(refs.callCards);
    layout.right.appendChild(refs.callConsole.root);
    layout.right.appendChild(refs.callFeedback.root);
    body.appendChild(layout.root);
  }

  /* ------------------------------------------------------------------ */
  /* ③ self 실행 흐름 (명세 9.3)                                             */
  /* ------------------------------------------------------------------ */
  function paintSelf() {
    if (!refs.selfItems) return;
    var step = st().selfStep;
    refs.selfItems.forEach(function (node, i) {
      node.classList.toggle('is-on', i <= step);
    });
    refs.selfChips.forEach(function (chip, i) {
      chip.classList.toggle('is-on', i <= step);
    });
    refs.btnSelf.textContent =
      step < 0 ? '▶ phone1.call() 실행하기' : step >= O.SELF_STEPS.length - 1 ? '↺ 다시 보기' : '다음 단계 ▶';
    refs.selfCount.textContent = '흐름 ' + Math.max(0, step + 1) + ' / ' + O.SELF_STEPS.length + '단계';
  }

  function buildSelf(body) {
    body.appendChild(
      L.codeview.createCodeView({
        title: '실행할 코드',
        showLineNumbers: false,
        ariaLabel: 'self 흐름 확인용 코드',
        lines: [{ code: 'phone1 = Phone()' }, { code: 'phone1.user = "민준"' }, { code: 'phone1.call()' }]
      }).root
    );

    // phone1 → self → self.user → "민준" 흐름 (명세 9.3)
    refs.selfChips = [];
    var flow = el('div', { 'class': 'selfchain' });
    O.SELF_STEPS.forEach(function (s, i) {
      if (i > 0) {
        flow.appendChild(el('span', { 'class': 'selfchain__arrow', text: '➜', attrs: { 'aria-hidden': 'true' } }));
      }
      var chip = el('span', { 'class': 'selfchain__node', text: s.chip });
      refs.selfChips.push(chip);
      flow.appendChild(chip);
    });
    body.appendChild(flow);

    refs.selfItems = [];
    body.appendChild(
      el(
        'div',
        { 'class': 'selfflow' },
        O.SELF_STEPS.map(function (s, i) {
          var node = el('div', { 'class': 'selfflow__item' }, [
            el('span', { 'class': 'selfflow__no', text: String(i + 1) }),
            el('div', {}, [
              el('p', { 'class': 'selfflow__title', text: s.title }),
              el('p', { 'class': 'selfflow__detail', html: s.detail })
            ])
          ]);
          refs.selfItems.push(node);
          return node;
        })
      )
    );

    refs.selfCount = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    refs.btnSelf = ui.button({
      label: '▶ phone1.call() 실행하기',
      onClick: function () {
        if (st().selfStep >= O.SELF_STEPS.length - 1) {
          st().selfStep = -1;
          refs.selfConsole.clear();
        } else {
          st().selfStep += 1;
          if (st().selfStep === O.SELF_STEPS.length - 1) {
            st().selfDone = true;
            refs.selfConsole.write('민준님이 전화를 겁니다.');
          }
        }
        L.state.markChanged();
        paintSelf();
        var cur = O.SELF_STEPS[st().selfStep];
        if (cur) ui.announce(cur.title);
      }
    });
    body.appendChild(ui.buttonRow([refs.btnSelf]));
    body.appendChild(refs.selfCount);
    refs.selfConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '흐름을 끝까지 따라가면 출력 결과가 나타나요.',
      ariaLabel: 'self 흐름 실행 결과'
    });
    body.appendChild(refs.selfConsole.root);
    body.appendChild(
      ui.callout(
        '<strong>self 는 “지금 이 메소드를 실행하고 있는 객체”를 가리킵니다.</strong> ' +
          '호출할 때 직접 적지 않아도 파이썬이 자동으로 전달하므로, ' +
          '<code>phone2.call()</code> 을 실행하면 그때의 <code>self</code> 는 <code>phone2</code> 가 됩니다.'
      )
    );
  }

  /* ------------------------------------------------------------------ */
  /* ④ 개념 연결 활동 (명세 9.4)                                              */
  /* ------------------------------------------------------------------ */
  function paintMatches() {
    if (!refs.matchRows) return;
    var picks = st().matches || {};
    var okCount = 0;

    refs.matchRows.forEach(function (row) {
      var value = picks[row.def.key] || '';
      row.select.setValue(value);
      var ok = value === row.def.answer;
      if (ok) okCount += 1;
      row.mark.textContent = !value ? '' : ok ? '○ 정답' : '✕ 다시';
      row.mark.className = 'dot-row__mark' + (!value ? '' : ok ? ' is-ok' : ' is-no');
      row.hint.textContent = !value || ok ? '' : row.def.hint;
    });

    st().matchDone = okCount === O.CONCEPT_MATCHES.length;
    refs.matchCount.textContent = '맞힌 연결 ' + okCount + ' / ' + O.CONCEPT_MATCHES.length + '개';
    if (st().matchDone) {
      refs.matchFeedback.show(
        'success',
        '모두 맞았어요. <strong>정의는 def, 실행은 호출</strong>이고, <code>self</code> 는 <strong>호출한 객체</strong>입니다.',
        '🎉'
      );
    }
  }

  function buildMatches(body) {
    refs.matchRows = [];
    var rows = O.CONCEPT_MATCHES.map(function (def) {
      var mark = el('span', { 'class': 'dot-row__mark' });
      var hint = el('span', { 'class': 'dot-row__hint' });
      var select = ui.selectField({
        value: (st().matches || {})[def.key] || '',
        options: [{ value: '', label: '골라 주세요' }].concat(
          O.CONCEPT_OPTIONS.map(function (o) {
            return { value: o.value, label: o.label };
          })
        ),
        onChange: function (value) {
          st().matches[def.key] = value;
          L.state.markChanged();
          paintMatches();
        }
      });
      refs.matchRows.push({ def: def, select: select, mark: mark, hint: hint });
      return ['<code>' + ui.escapeHtml(def.left) + '</code>', select.root, el('span', {}, [mark, hint])];
    });

    body.appendChild(
      ui.dataTable({
        head: ['코드', '무엇을 뜻할까요?', '확인'],
        caption: '메소드와 self 개념 연결 활동',
        className: 'dot-table',
        rows: rows
      })
    );
    refs.matchCount = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.matchCount);
    refs.matchFeedback = ui.createFeedback({ emptyText: '네 가지를 모두 연결해 보세요.' });
    body.appendChild(refs.matchFeedback.root);
  }

  /* ------------------------------------------------------------------ */
  /* ⑤ 오개념 비교 (명세 9.5)                                                */
  /* ------------------------------------------------------------------ */
  function buildCompare(body) {
    refs.compareCards = [];
    var grid = el('div', { 'class': 'cmp' });

    O.CALL_COMPARE.forEach(function (item) {
      var out = el('p', { 'class': 'cmp__out', attrs: { 'aria-live': 'polite' } });
      var card = el('div', { 'class': 'cmp__card' }, [
        el('code', { 'class': 'cmp__code', text: item.code }),
        el('p', { 'class': 'cmp__verdict' }, [
          el('span', { 'class': 'cmp__mark', text: item.ok ? '○' : '✕' }),
          el('span', { text: ' ' + item.verdict })
        ]),
        el('p', { 'class': 'cmp__note', html: item.note }),
        ui.button({
          label: '실행해 보기',
          variant: 'secondary',
          onClick: function () {
            out.textContent = item.ok
              ? '출력 : 민준님이 전화를 겁니다.'
              : item.code === 'phone1.call'
              ? '출력 없음 — 메소드를 가리키기만 했습니다.'
              : '오류 — self 는 자동으로 전달되므로 객체를 직접 넘기지 않습니다.';
            var seen = st().compareSeen || (st().compareSeen = []);
            if (seen.indexOf(item.code) === -1) seen.push(item.code);
            L.state.markChanged();
            ui.announce(out.textContent);
          }
        }),
        out
      ]);
      card.classList.add(item.ok ? 'is-ok' : 'is-no');
      grid.appendChild(card);
      refs.compareCards.push(card);
    });

    body.appendChild(grid);
    body.appendChild(
      el('p', {
        'class': 'obj-note',
        text: '메소드를 실행하려면 반드시 소괄호가 필요합니다. 형성평가 5번에서도 이 차이를 확인합니다.'
      })
    );
  }

  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 4,
        title: C.STEP_TITLES[4],
        lead: [
          '클래스 안에 <code>def</code> 로 정의한 함수를 <strong>메소드</strong>라고 합니다. ' +
            '메소드는 <code>객체이름.메소드이름()</code> 형식으로 호출합니다.',
          '<code>self</code> 는 <strong>메소드를 호출한 객체 자신</strong>을 가리키며, ' +
            '호출할 때 직접 적지 않아도 <strong>파이썬이 자동으로 전달</strong>합니다.'
        ]
      })
    );

    var define = ui.panel({
      title: '① 메소드 정의 구조',
      hint: '들여쓰기 <strong>0단계 · 1단계 · 2단계</strong>가 각각 무엇인지 확인하세요.'
    });
    buildDefine(define.body);
    root.appendChild(define.root);

    var call = ui.panel({
      title: '② 메소드 호출',
      hint: '한 줄씩 실행하면 출력창에 메시지가 <strong>순서대로</strong> 나타납니다.'
    });
    buildCall(call.body);
    root.appendChild(call.root);

    var self = ui.panel({
      title: '③ self 는 어떻게 연결될까?',
      hint: '버튼을 누를 때마다 한 단계씩 <code>phone1 → self → self.user → "민준"</code> 흐름을 보여 줍니다.'
    });
    buildSelf(self.body);
    root.appendChild(self.root);

    var match = ui.panel({ title: '④ 개념 연결 활동', hint: '네 가지 표현의 뜻을 골라 연결해 보세요.' });
    buildMatches(match.body);
    root.appendChild(match.root);

    var compare = ui.panel({
      title: '⑤ 헷갈리는 세 가지',
      hint: '<code>call</code> · <code>call()</code> · <code>call(phone1)</code> 의 차이를 확인하세요.'
    });
    buildCompare(compare.body);
    root.appendChild(compare.root);

    paintCall();
    paintSelf();
    paintMatches();
  }

  function onEnter() {
    paintCall();
    paintSelf();
    paintMatches();
  }

  L.registerStep(4, {
    title: C.STEP_TITLES[4],
    short: C.STEP_SHORTS[4],
    render: render,
    onEnter: onEnter
  });
})();
    </script>
    <script data-from="js/64-step5.js">
/**
 * 화면 5 — 객체 독립성과 기능 확장 (명세 10장)
 *
 *   ① 객체 독립성 실험 — 한 줄씩 실행하며 두 객체 카드를 비교 (명세 10.1)
 *        · phone1.color = "red" 를 실행하기 «전»에 최종 색상을 예측한다.
 *   ② 새 메소드 추가 — 세 가지를 «모두» 완성한다. 한 번에 하나씩 골라 조각으로 완성 (명세 10.2)
 *   ③ 자동 확인 — 구조 요소를 검사 (명세 10.3 · 목록은 40-object-engine.js 의 METHOD_ELEMENTS)
 *   ④ 형성평가 대비 미니 활동 — 학생증 세 줄 직접 입력 (명세 10.4)
 *
 * 통과 조건 : 독립성 실험 실행 + 세 메소드(charge · take_photo · show_info) 모두 완성
 *            + 미니 활동 세 줄 완성 (명세 5장 · 10.2 · 10.4)
 *
 * ※ 학생이 입력한 코드는 절대로 실행하지 않는다. 45-quiz.js 의 구문 규칙으로만 판정한다(명세 22장).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var O = L.objects;
  var QUIZ = L.quiz;

  var SCRIPT = O.INDEPENDENCE_CODE;
  var LAST = SCRIPT.length - 1;
  var PREDICT = O.INDEPENDENCE_PREDICT;
  var CIRCLED = '①②③④';

  var refs = {};

  function st() {
    return L.state.appState.step5;
  }

  /* ------------------------------------------------------------------ */
  /* ① 객체 독립성 실험 (명세 10.1)                                           */
  /* ------------------------------------------------------------------ */
  function paintPredict() {
    if (!refs.predictButtons) return;
    var picked = Number(st().predict) || 0;
    refs.predictButtons.forEach(function (btn, i) {
      var on = picked === i + 1;
      // 고른 보기를 색만으로 나타내지 않는다(명세 21장).
      btn.classList.toggle('is-selected', on);
      btn.setAttribute('aria-pressed', String(on));
      var mark = btn.querySelector('.option__mark');
      if (mark) mark.textContent = on ? '내 예측' : '';
    });
    refs.predictNote.textContent = !picked
      ? 'phone1.color = "red" 줄을 실행하기 전에 예측을 골라 주세요.'
      : PREDICT.replies[picked] || '';
  }

  function buildPredict(body) {
    /**
     * 명세 10.0 : 예측은 «무엇을 실행하는지 이미 본 뒤»에 받는다.
     * 그래서 실험할 프로그램 전체를 먼저 보여 준다.
     * 예측 대상인 phone1.color = "red" 줄과 출력 줄에는 라벨을 붙인다.
     */
    var programLines = SCRIPT.map(function (line, i) {
      var row = { code: line.code };
      if (i === PREDICT.beforeLine) row.note = '이 줄을 실행한 뒤의 색상을 예측하세요';
      else if (line.act && line.act.type === 'call') row.note = '최종 색상이 출력됩니다';
      return row;
    });
    body.appendChild(
      L.codeview.createCodeView({
        title: '실험할 프로그램 — 클래스 선언부터 출력까지',
        showLineNumbers: true,
        ariaLabel: '실험할 프로그램 전체 코드',
        lines: programLines
      }).root
    );

    body.appendChild(el('p', { 'class': 'bigq', html: PREDICT.question }));
    refs.predictButtons = [];
    body.appendChild(
      el(
        'div',
        { 'class': 'options', attrs: { role: 'group', 'aria-label': '최종 색상 예측' } },
        PREDICT.options.map(function (opt, i) {
          var btn = el('button', {
            type: 'button',
            'class': 'option',
            attrs: { 'aria-pressed': 'false', 'aria-label': CIRCLED[i] + '번 예측. ' + opt.label }
          }, [
            el('span', { 'class': 'option__num', text: CIRCLED[i] }),
            el('span', { 'class': 'option__text', text: opt.label }),
            el('span', { 'class': 'option__mark' })
          ]);
          btn.addEventListener('click', function () {
            st().predict = opt.value;
            L.state.markChanged();
            paintPredict();
            ui.announce('예측을 기록했어요. 이어서 실험을 계속하세요.');
          });
          refs.predictButtons.push(btn);
          return btn;
        })
      )
    );
    refs.predictNote = el('p', { 'class': 'obj-quote', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.predictNote);
  }

  function objectCard(obj, act) {
    var isTarget = Boolean(act && act.object === obj.objectName && act.type === 'set');
    return el('div', {
      'class': 'objcard' + (isTarget ? ' is-target' : '') + (obj.runningMethod ? ' is-running-card' : '')
    }, [
      el('div', { 'class': 'objcard__head' }, [
        el('span', { 'class': 'objcard__name', text: obj.objectName }),
        el('span', { 'class': 'objcard__class', text: 'class Phone' })
      ]),
      el('div', { 'class': 'objcard__section' }, [
        el('p', { 'class': 'objcard__section-title', text: '속성' }),
        el(
          'div',
          {},
          ['user', 'color'].map(function (key) {
            var changed = obj.isChanged(key);
            var justSet = Boolean(act && act.type === 'set' && act.object === obj.objectName && act.key === key);
            return el('div', { 'class': 'objattr' + (justSet ? ' is-changed' : '') }, [
              el('span', { 'class': 'objattr__key', text: key }),
              el('span', { 'class': 'objattr__val', text: String(obj.get(key)) }),
              el('span', {
                'class': 'obj-badge ' + (changed ? 'obj-badge--changed' : 'obj-badge--kept'),
                text: changed ? '변경됨' : '유지됨'
              })
            ]);
          })
        )
      ]),
      el('div', { 'class': 'objcard__section' }, [
        el('span', {
          'class': 'obj-note',
          text: obj.runningMethod ? '호출 중 : ' + obj.runningMethod + '() · self = ' + obj.objectName : '최근 변경 속성 : ' + (obj.lastChanged || '아직 없음')
        })
      ])
    ]);
  }

  function paintTrace() {
    if (!refs.traceCode) return;
    var upto = st().traceStep;
    var result = O.runScript(SCRIPT, upto);
    var act = result.lastAct;

    refs.traceCode.clearStates();
    for (var i = 0; i <= Math.min(upto, LAST); i += 1) {
      refs.traceCode.setState(i, i === upto ? 'running' : 'done');
    }
    if (upto >= 0 && upto <= LAST) refs.traceCode.scrollToLine(upto);

    ui.clear(refs.traceCards);
    if (!result.order.length) {
      refs.traceCards.appendChild(
        el('p', { 'class': 'bun-tray__empty', text: '아직 객체를 만들지 않았어요. [한 줄 실행] 을 눌러 보세요.' })
      );
    }
    result.order.forEach(function (name) {
      refs.traceCards.appendChild(objectCard(result.objects[name], act));
    });

    var line = SCRIPT[upto];
    refs.traceSay.textContent = line && line.say ? line.say : '[한 줄 실행] 을 눌러 코드를 따라가 보세요.';
    refs.btnTrace.textContent = upto >= LAST ? '↺ 다시 실행' : upto < 0 ? '▶ 한 줄 실행' : '▶ 다음 줄 실행';
    refs.traceCount.textContent = '실행한 줄 ' + Math.max(0, upto + 1) + ' / ' + SCRIPT.length;
  }

  /** 명세 10.1 : 예측을 받기 «전»에는 phone1.color = "red" 줄을 실행하지 않는다. */
  function predictNeeded(nextStep) {
    if (st().predict) return false;
    return nextStep >= PREDICT.beforeLine;
  }

  function askPredict() {
    refs.traceFeedback.show(
      'info',
      '<code>phone1.color = "red"</code> 를 실행하기 전에 <strong>위 ① 예측</strong>을 먼저 골라 주세요.',
      '🔮'
    );
    ui.toast('먼저 최종 색상을 예측해 주세요.');
    ui.scrollToNode(refs.predictButtons[0]);
  }

  function finishTrace() {
    st().traceDone = true;
    L.state.markChanged();
    var picked = Number(st().predict) || 0;
    var core =
      '<strong>같은 클래스로 만든 객체라도 각각 독립적이므로, 한 객체의 속성 변경이 ' +
      '다른 객체의 속성값을 자동으로 바꾸지 않습니다.</strong>';
    if (picked === PREDICT.answer) {
      refs.traceFeedback.show(
        'success',
        '예측이 맞았어요! 최종 결과는 <code>민준 red</code> · <code>지현 blue</code> 입니다.<br />' + core,
        '🎯'
      );
    } else if (picked) {
      var mine = PREDICT.options.filter(function (o) {
        return o.value === picked;
      })[0];
      refs.traceFeedback.show(
        'info',
        '예측은 <strong>' + ui.escapeHtml(mine ? mine.label : '') + '</strong> 였지만, ' +
          '실제 결과는 <code>민준 red</code> · <code>지현 blue</code> 입니다.<br />' +
          core + '<br /><code>phone1.color = "red"</code> 줄에 <strong>phone2 는 등장하지 않습니다.</strong>',
        '🔎'
      );
    } else {
      refs.traceFeedback.show('info', core, '🔎');
    }
  }

  function buildTrace(body) {
    var layout = ui.split({ className: 'split--wide-left' });
    var left = el('div', { 'class': 'stack' });

    refs.traceCode = L.codeview.createCodeView({
      title: '객체 독립성 실험',
      showLineNumbers: true,
      ariaLabel: '객체 독립성 실험 코드',
      lines: SCRIPT.map(function (line) {
        return { code: line.code };
      })
    });
    left.appendChild(refs.traceCode.root);

    refs.btnTrace = ui.button({
      label: '▶ 한 줄 실행',
      onClick: function () {
        if (st().traceStep >= LAST) {
          st().traceStep = -1;
          refs.traceConsole.clear();
        } else {
          if (predictNeeded(st().traceStep + 1)) {
            askPredict();
            return;
          }
          st().traceStep += 1;
          var line = SCRIPT[st().traceStep];
          if (line && line.act && line.act.type === 'call') {
            var out = O.runScript(SCRIPT, st().traceStep).output;
            refs.traceConsole.write(out[out.length - 1]);
          }
          if (st().traceStep >= LAST) finishTrace();
        }
        L.state.markChanged();
        paintTrace();
        var cur = SCRIPT[st().traceStep];
        if (cur && cur.say) ui.announce(cur.say);
      }
    });

    left.appendChild(
      ui.buttonRow([
        refs.btnTrace,
        ui.button({
          label: '끝까지 실행',
          variant: 'secondary',
          onClick: function () {
            if (predictNeeded(LAST)) {
              askPredict();
              return;
            }
            st().traceStep = LAST;
            refs.traceConsole.clear();
            O.independenceOutput().forEach(function (line) {
              refs.traceConsole.write(line);
            });
            finishTrace();
            paintTrace();
          }
        }),
        ui.button({
          label: '처음부터',
          variant: 'ghost',
          onClick: function () {
            st().traceStep = -1;
            L.state.markChanged();
            refs.traceConsole.clear();
            refs.traceFeedback.clear();
            paintTrace();
          }
        })
      ])
    );
    refs.traceCount = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });
    refs.traceSay = el('p', { 'class': 'obj-quote', attrs: { 'aria-live': 'polite' } });
    left.appendChild(refs.traceCount);
    left.appendChild(refs.traceSay);
    layout.left.appendChild(left);

    refs.traceCards = el('div', { 'class': 'objcards' });
    refs.traceConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: 'show_info() 를 호출하면 결과가 여기에 표시돼요.',
      ariaLabel: '객체 독립성 실험 실행 결과'
    });
    refs.traceFeedback = ui.createFeedback({ emptyText: '끝까지 실행하면 예측과 비교해 드릴게요.' });
    layout.right.appendChild(refs.traceCards);
    layout.right.appendChild(refs.traceConsole.root);
    layout.right.appendChild(refs.traceFeedback.root);
    body.appendChild(layout.root);

    body.appendChild(ui.sectionTitle('상태', '실행 시점별 객체 상태'));
    body.appendChild(
      ui.dataTable({
        head: ['실행 시점', 'phone1', 'phone2'],
        caption: '실행 시점별 두 객체의 상태',
        rows: O.STATE_TABLE
      })
    );
  }

  /* ------------------------------------------------------------------ */
  /* ② · ③ 새 메소드 추가와 자동 확인 (명세 10.2 · 10.3)                        */
  /* ------------------------------------------------------------------ */
  function paintMethod() {
    if (!refs.methodCards) return;
    var key = st().method;

    // 명세 10.2 : 완성한 메소드는 «완료 ○» 로 표시한다(색만으로 나타내지 않는다).
    var done = st().methodDone || {};
    refs.methodCards.forEach(function (card) {
      var isDone = done[card.dataset.key] === true;
      card.classList.toggle('is-selected', card.dataset.key === key);
      card.classList.toggle('is-done', isDone);
      card.setAttribute('aria-pressed', String(card.dataset.key === key));
      // 「고르는 중」과 「완료」는 서로 다른 정보다. 색이 아니라 글자로 둘 다 알려 준다.
      var isCurrent = card.dataset.key === key;
      var mark = card.querySelector('.mchoice__state');
      if (mark) mark.textContent = (isCurrent ? '▶ 고르는 중 · ' : '') + (isDone ? '완료 ○' : '아직');
      var m = O.methodChoice(card.dataset.key);
      card.setAttribute(
        'aria-label',
        (m ? m.label + ' 메소드 ' + m.name : '') + ' 고르기. ' +
          (isDone ? '완성함' : '아직 완성하지 않음') +
          (isCurrent ? '. 지금 고른 메소드' : '')
      );
    });
    paintMethodProgress();

    ui.clear(refs.slotBox);
    if (!key) {
      refs.slotBox.appendChild(
        el('p', { 'class': 'obj-note', text: '위에서 추가할 메소드를 먼저 골라 주세요.' })
      );
      refs.btnCheckMethod.disabled = true;
      refs.methodElements.hidden = true;
      return;
    }

    var picksOf = st().picks[key] || (st().picks[key] = {});
    var options = O.methodOptions(key);
    O.METHOD_SLOTS.forEach(function (slot) {
      var picked = picksOf[slot.key];
      var group = el('div', { 'class': 'mslot' }, [
        el('p', { 'class': 'mslot__title', text: slot.label })
      ]);
      var list = el('div', {
        'class': 'mslot__opts',
        attrs: { role: 'group', 'aria-label': slot.label + ' 조각 고르기' }
      });
      options[slot.key].forEach(function (opt) {
        var chosen = picked === opt.id;
        var btn = el('button', {
          type: 'button',
          'class': 'mopt' + (chosen ? ' is-selected' : ''),
          dataset: { id: opt.id },
          attrs: {
            'aria-pressed': String(chosen),
            'aria-label':
              opt.code + (opt.indent ? ' (들여쓰기 ' + opt.indent + '칸)' : ' (들여쓰기 없음)')
          }
        }, [
          el('span', { 'class': 'mopt__mark', text: opt.indent ? '들여쓰기 ' + opt.indent + '칸' : '왼쪽 끝' }),
          el('code', { 'class': 'mopt__code', text: opt.code })
        ]);
        btn.addEventListener('click', function () {
          // 이미 고른 조각을 다시 누른 것이라면 아무것도 바꾸지 않는다.
          // (그냥 두면 코드가 그대로인데도 «완료» 표시가 풀려 3/3 이 2/3 으로 떨어진다)
          if (st().picks[key][slot.key] === opt.id) return;

          st().picks[key][slot.key] = opt.id;
          // 조각을 «실제로 바꾸면» 그 메소드의 완료 표시를 지운다. 다시 확인해야 한다.
          delete st().methodDone[key];
          L.state.markChanged();
          // 완료가 풀렸으므로 이전 확인 결과 · 성공 안내 · 실행 결과도 함께 지운다.
          // (지우지 않으면 «완성했어요» 문구가 남아 «아직» 배지와 서로 어긋난다)
          refs.methodElements.hidden = true;
          refs.methodFeedback.clear();
          refs.methodConsole.clear();
          paintMethod();
        });
        list.appendChild(btn);
      });
      group.appendChild(list);
      refs.slotBox.appendChild(group);
    });

    var check = O.checkMethod(key, picksOf);
    refs.btnCheckMethod.disabled = check.filled < check.total;
    refs.methodNote.textContent = done[key]
      ? '이 메소드는 완성했어요. 위에서 다른 메소드를 골라 이어서 완성해 보세요.'
      : check.filled < check.total
      ? '세 자리 중 ' + check.filled + '자리를 골랐어요. 남은 자리 ' + (check.total - check.filled) + '개.'
      : '세 자리를 모두 골랐어요. [자동 확인] 을 눌러 보세요.';

    // 고른 조각으로 만들어진 코드를 미리 보여 준다.
    var m = O.methodChoice(key);
    var options2 = O.methodOptions(key);
    var pickOf = function (slotKey) {
      var id = picksOf[slotKey];
      return options2[slotKey].filter(function (o) {
        return o.id === id;
      })[0];
    };
    var defPick = pickOf('def');
    var bodyPick = pickOf('body');
    var callPick = pickOf('call');
    var lines = [
      { code: 'class Phone:' },
      { code: '    user = "김정보"' },
      { code: '    color = "white"' },
      { code: '    company = "A사"' },
      { code: '' },
      defPick
        ? { code: new Array(defPick.indent + 1).join(' ') + defPick.code }
        : { code: '(메소드 정의 줄을 고르세요)' },
      bodyPick
        ? { code: new Array(bodyPick.indent + 1).join(' ') + bodyPick.code }
        : { code: '(메소드 본문 줄을 고르세요)' },
      { code: '' },
      { code: 'phone1 = Phone()' },
      { code: 'phone1.user = "민준"' },
      callPick ? { code: callPick.code } : { code: '(호출 줄을 고르세요)' }
    ];
    ui.clear(refs.methodPreview);
    refs.methodPreview.appendChild(
      L.codeview.createCodeView({
        title: '내가 만든 코드 (' + (m ? m.name + '()' : '') + ')',
        showLineNumbers: true,
        ariaLabel: '학생이 조립한 메소드 코드',
        lines: lines
      }).root
    );
  }

  function paintElements(check) {
    refs.methodElements.hidden = false;
    ui.clear(refs.methodElements);
    refs.methodElements.appendChild(
      el('p', { 'class': 'field__label', text: '자동 확인 — 구조 요소 ' + O.METHOD_ELEMENTS.length + '가지' })
    );
    refs.methodElements.appendChild(
      el(
        'ul',
        { 'class': 'elems' },
        check.elements.map(function (e) {
          return el('li', { 'class': 'elems__item ' + (e.ok ? 'is-ok' : 'is-no') }, [
            el('span', { 'class': 'elems__mark', text: e.ok ? '○' : '✕' }),
            el('span', { text: e.label })
          ]);
        })
      )
    );
  }

  /**
   * 이미 완성한 메소드를 다시 골랐을 때 확인 결과와 실행 결과를 되살린다(명세 10.2).
