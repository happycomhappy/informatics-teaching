    <!-- 스타일은 나열한 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다.
         lesson2.css 가 이 차시에서 새로 만든 부품과 강조색(보라 계열)을 담당한다. -->
    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

  font-size: 11px;
  font-weight: 700;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================
   가운데 코드 칸의 너비는 «가장 긴 코드 줄» 에 맞춘다(max-content).
   남은 자리를 설명이 모두 쓰므로, 코드 상자가 필요 이상으로 넓어지지 않는다. */
.linenotes {
  display: grid;
  grid-template-columns: auto max-content minmax(0, 1fr);
  align-items: stretch;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow-x: auto;
  line-height: 1.9;
}

.linenotes__num,
.linenotes__code {
  background: var(--color-code-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.linenotes__num {
  padding: 2px var(--space-2);
  text-align: right;
  color: #94a3b8;
  user-select: none;
}

.linenotes__code {
  padding: 2px var(--space-4) 2px var(--space-1);
  white-space: pre;
}

.linenotes__desc {
  display: flex;
  align-items: center;
  padding: 2px var(--space-3);
  border-left: 1px dashed var(--color-border-strong);
  background: var(--color-surface);
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  line-height: 1.5;
}

/* 줄 사이 구분선. 마지막 줄에는 넣지 않는다(바깥 테두리와 겹친다). */
.linenotes > * {
  border-bottom: 1px solid var(--color-border);
}

.linenotes > *:nth-last-child(-n + 3) {
  border-bottom: none;
}

/* 모바일에서는 설명을 코드 아래 줄로 내린다 */
@media (max-width: 767px) {
  .linenotes {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .linenotes__desc {
    grid-column: 1 / -1;
    border-left: none;
    border-top: 1px dashed var(--color-border-strong);
    padding: var(--space-2) var(--space-3);
  }

  .linenotes__desc.is-empty {
    display: none;
  }
}

/* ===================== 용어 설명 · 묻고 답하기 (9.6) ===================== */
/* 교과 자료의 「용어 설명」 상자와 같은 모양으로 맞춘다. */
.term-card {
  padding: var(--space-3) var(--space-4);
  border-left: 5px solid var(--color-text);
  background: var(--color-muted-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.term-card__title {
  font-size: 17px;
  font-weight: 800;
}

.term-card__desc {
  margin-top: 2px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.qa {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: var(--fs-small);
  line-height: 1.75;
}

.qa__row {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
}

.qa__mark {
  flex: 0 0 auto;
  width: 1.4em;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
}

.qa__mark--q {
  color: var(--color-true-dark);
}

.qa__mark--a {
  color: var(--color-error);
}

.qa__row--q {
  font-weight: 700;
}

/* ===================== 안전 장치 안내 (11.6) ===================== */
/* 무한 반복 예제에서 반드시 읽어야 하는 문구라 상자로 크게 보인다. */
.safety-notice {
  display: flex;
  width: 100%;
  font-size: 15px;
}

/* ===================== 무작위 뽑기 (9.6) ===================== */
.dice-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.dice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: 17px;
  font-weight: 800;
  animation: dice-roll 600ms ease infinite;
}

.dice.is-done {
  animation: none;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
}

@keyframes dice-roll {
  0%,
  100% {
    transform: rotate(-8deg);
  }
  50% {
    transform: rotate(8deg);
  }
}

/* ===================== 형성평가 (10장) ===================== */
.quiz-item .panel__title {
  align-items: flex-start;
  line-height: 1.5;
}

.expected {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.expected__title {
  padding: 4px var(--space-3);
  background: var(--color-muted-bg);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.expected__body {
  margin: 0;
  padding: var(--space-3);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  white-space: pre-wrap;
}

/* 문항 진행 표시 (문항 n / 5) */
.quiz-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.quiz-progress__text {
  font-weight: 800;
  color: var(--color-primary-dark);
}

.quiz-progress__dots {
  display: flex;
  gap: var(--space-2);
}

.quiz-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.quiz-dot.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.quiz-dot.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.1);
}

/* 문항 아래 버튼 줄 (이전 · 다음 · 채점 · 제출) */
.quiz-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.quiz-nav__hint {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  min-height: 1.4em;
}

.quiz-retry {
  margin-top: var(--space-3);
}

/* 제출 결과 안내 */
.submit-note {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-true);
  border-left-width: 5px;
  background: var(--color-true-soft);
  font-size: var(--fs-small);
  line-height: 1.7;
}

.submit-note code {
  font-family: var(--font-mono);
  font-weight: 700;
}

/* 제출 대화상자의 오류 문구 */
.modal__error {
  margin-top: var(--space-2);
  color: var(--color-error);
  font-size: var(--fs-small);
  font-weight: 700;
  min-height: 1.2em;
}

@media (max-width: 767px) {
  .quiz-nav .btn {
    flex: 1 1 46%;
  }
}

.quiz-review {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-muted-bg);
  font-size: var(--fs-small);
}

.quiz-review.is-correct {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}

.quiz-review.is-wrong {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.quiz-review__head {
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.quiz-review__rows dt {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);

  flex: 1 1 180px;
  min-width: 160px;
  background: var(--color-surface);
  border: 2px solid var(--color-teal-line);
  border-radius: var(--radius);
  padding: var(--space-4);
  text-align: center;
}

.obj-flow__node--object {
  border-color: var(--color-border-strong);
}

.obj-flow__label {
  display: block;
  font-weight: 700;
  color: var(--color-teal-dark);
  margin-bottom: var(--space-1);
}

.obj-flow__desc {
  display: block;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 인스턴스화 화살표 — 이번 차시의 강조색(주황) */
.obj-flow__arrow {
  flex: 0 0 auto;
  align-self: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  color: var(--color-inst);
  font-weight: 700;
  padding: var(--space-2) var(--space-3);
  background: var(--color-inst-soft);
  border: 1px dashed var(--color-inst-line);
  border-radius: var(--radius);
  min-width: 96px;
  text-align: center;
}

.obj-flow__arrow-mark {
  font-size: 22px;
  line-height: 1;
}

.obj-flow__arrow-text {
  font-size: var(--fs-small);
}

@media (max-width: 767px) {
  .obj-flow {
    flex-direction: column;
  }
  /* 세로로 쌓일 때 flex-basis 는 «높이»가 되므로, 내용 높이에 맞추도록 되돌린다. */
  .obj-flow__node {
    flex: 0 0 auto;
  }
  .obj-flow__arrow {
    width: 100%;
    flex-direction: row;
    justify-content: center;
  }
  /* 세로로 쌓일 때는 아래를 가리키는 화살표로 바꾼다(글자 화살표 · 그림 화살표 모두). */
  .obj-flow__arrow-mark,
  .s2-arrow__art {
    transform: rotate(90deg);
  }
  .s2-arrow__art {
    width: 56px;
  }
}

/* ------------------------------------------------------------------ */
/* 개념 정의 카드 (명세 7.1)                                             */
/* ------------------------------------------------------------------ */
.cdef-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-3);
}

.cdef-card {
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-left: 5px solid var(--color-teal);
  border-radius: var(--radius);
  padding: var(--space-4);
}

.cdef-card__name {
  font-weight: 700;
  font-size: 18px;
  color: var(--color-teal-dark);
  margin-bottom: var(--space-1);
}

.cdef-card__def {
  margin-bottom: var(--space-2);
}

.cdef-card__ex {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 객체 카드 (명세 20.2 : 클래스명 · 객체명 · 속성 · 기능을 구획해 표시)     */
/* ------------------------------------------------------------------ */
.objcards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
}

.objcard {
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color var(--dur-highlight) ease, box-shadow var(--dur-highlight) ease;
}

.objcard.is-target {
  border-color: var(--color-inst);
  box-shadow: 0 0 0 3px var(--color-inst-soft);
}

.objcard.is-new {
  border-color: var(--color-teal);
}

.objcard__head {
  background: var(--color-teal-soft);
  border-bottom: 1px solid var(--color-teal-line);
  padding: var(--space-2) var(--space-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.objcard__name {
  font-weight: 700;
  font-family: var(--font-mono);
}

.objcard__class {
  font-size: var(--fs-small);
  color: var(--color-teal-dark);
}

.objcard__section {
  padding: var(--space-2) var(--space-3);
}

.objcard__section + .objcard__section {
  border-top: 1px dashed var(--color-border);
}

.objcard__section-title {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-1);
}

.objattr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: 3px 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.objattr.is-changed {
  background: var(--color-inst-soft);
  outline: 1px solid var(--color-inst-line);
}

.objattr.is-reading {
  background: var(--color-primary-soft);
  outline: 1px solid var(--color-primary);
}

.objattr__key {
  color: var(--color-text-sub);
}

.objattr__val {
  font-weight: 700;
}

/* 색에만 기대지 않도록 «글자 배지»를 함께 쓴다(명세 20.2). */
.obj-badge {
  display: inline-block;
  max-width: 100%;
  font-size: 12px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  /* 좁은 카드 안에서도 배지가 밖으로 삐져나가지 않도록 줄바꿈을 허용한다. */
  overflow-wrap: anywhere;
}

.obj-badge--changed {
  background: var(--color-inst-soft);
  border-color: var(--color-inst-line);
  color: var(--color-inst);
}

.obj-badge--kept {
  background: var(--color-muted-bg);
}

.obj-badge--created {
  background: var(--color-true-soft);
  border-color: var(--color-true);
  color: var(--color-true-dark);
}

.obj-badge--instance {
  background: var(--color-teal-soft);
  border-color: var(--color-teal-line);
  color: var(--color-teal-dark);
}

/* ------------------------------------------------------------------ */
/* 붕어빵 인스턴스화 시뮬레이션 (명세 7.2)                                 */
/* ------------------------------------------------------------------ */
.bun-stage {
  display: grid;
  grid-template-columns: minmax(160px, 1fr) auto minmax(220px, 1.4fr);
  gap: var(--space-3);
  align-items: center;
}

@media (max-width: 900px) {
  .bun-stage {
    grid-template-columns: 1fr;
  }
}

.bun-mold {
  background: var(--color-teal-soft);
  border: 2px dashed var(--color-teal);
  border-radius: var(--radius);
  padding: var(--space-4);
  text-align: center;
}

.bun-mold__shape {
  font-size: 44px;
  line-height: 1.1;
}

/* 틀 그림은 카드 안에서 너무 커지지 않게 한다. */
.bun-mold .s2-art {
  max-width: 190px;
  margin: 0 auto var(--space-2);
}

.bun-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 96px;
  align-content: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.bun-tray__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.bun {
  width: 104px;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  padding: var(--space-2);
  text-align: center;
}

.bun__face {
  font-size: 28px;
  line-height: 1.1;
}

.bun__name {
  font-size: var(--fs-small);
  font-weight: 700;
}

.bun__fill {
  font-size: 12px;
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 화면 2 전용 — 그림(인라인 SVG) 배치                                     */
/*                                                                     */
/* `s2-` 로 시작하는 클래스는 화면 2 에서만 쓴다.                            */
/* ------------------------------------------------------------------ */
.s2-art {
  display: block;
}

.s2-art svg {
  display: block;
  width: 100%;
  height: auto;
}

/* 개념 카드 위의 작은 그림 */
.s2-mini {
  max-width: 132px;
  margin: 0 auto var(--space-2);
}

.s2-cdef {
  text-align: center;
}

.s2-cdef .cdef-card__name {
  margin-top: var(--space-1);
}

/* 흐름 안의 주황 화살표 그림 */
.s2-arrow {
  gap: var(--space-1);
}

.s2-arrow__art {
  width: 84px;
}

/* 한 클래스 → 여러 객체 무대 (설계도 · 화살표 · 객체 묶음) */
.s2-stage {
  display: grid;
  grid-template-columns: minmax(200px, 1fr) 116px minmax(240px, 1.25fr);
  gap: var(--space-3);
  align-items: center;
}

.s2-stage__arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  color: var(--color-inst);
  font-weight: 700;
}

.s2-stage__arrow .s2-art {
  width: 100%;
}

/* 설계도 카드 — 점선으로 «아직 실체가 아님»을 나타낸다 */
.s2-blueprint {
  background: var(--color-teal-soft);
  border: 1.5px dashed var(--color-teal);
  border-radius: var(--radius);
  padding: var(--space-3);
  text-align: center;
}

.s2-blueprint .s2-art {
  max-width: 260px;
  margin: 0 auto;
}

.s2-blueprint__title {
  font-weight: 700;
  color: var(--color-teal-dark);
  margin-top: var(--space-1);
}

.s2-slot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  justify-content: center;
  margin: var(--space-2) 0;
}

/* 객체 카드 묶음 (세로로 두 개) */
.s2-objcol {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* 그림이 있는 객체 카드 — 그림(왼쪽) + 속성(오른쪽) */
.objcard--art {
  display: flex;
  align-items: stretch;
}

.objcard--art .objcard__body {
  flex: 1 1 auto;
  min-width: 0;
}

.objcard__art {
  flex: 0 0 168px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-2);
  background: var(--color-muted-bg);
  border-right: 1px solid var(--color-border);
}

.objcard__art svg {
  max-height: 132px;
  width: auto;
}

.objcard__art--hero svg {
  max-height: 116px;
}

@media (max-width: 560px) {
  .objcard--art {
    flex-direction: column;
  }
  .objcard__art {
    flex: 0 0 auto;
    border-right: none;
    border-bottom: 1px solid var(--color-border);
  }
}

/* 붕어빵 카드 안의 그림 */
.bun__art {
  width: 84px;
  margin: 0 auto var(--space-1);
}

@media (max-width: 900px) {
  .s2-stage {
    grid-template-columns: 1fr;
  }
  /* 세로로 쌓이면 화살표도 아래를 향하게 돌린다. */
  .s2-stage__arrow .s2-art {
    width: 96px;
    margin: 0 auto;
    transform: rotate(90deg);
  }
}

/* ------------------------------------------------------------------ */
/* 속성 · 기능 분류 활동 (명세 8.2)                                        */
/* ------------------------------------------------------------------ */
.sort-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-3);
}

.sortzone {
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-surface);
  min-height: 140px;
}

.sortzone.is-over {
  border-color: var(--color-teal);
  background: var(--color-teal-soft);
}

.sortzone__title {
  font-weight: 700;
  color: var(--color-teal-dark);
  margin-bottom: var(--space-1);
}

.sortzone__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-2);
}

.sortzone__body {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.sortcard {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: 999px;
  background: var(--color-surface);
  font-size: var(--fs-body);
  cursor: pointer;
}

.sortcard:hover {
  border-color: var(--color-teal);
}

.sortcard.is-selected {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-primary-soft);
}

.sortcard.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.sortcard.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.sortcard__mark {
  font-weight: 700;
}

/* ------------------------------------------------------------------ */
/* 화면 4 · 5 공용 — 줄별 주석                                             */
/* ------------------------------------------------------------------ */

/* 들여쓰기 배지 바로 뒤에 코드가 붙지 않도록 한 칸 띄운다.
   (배지는 화면 4 ① 클래스 기본 구조에서만 쓴다) */
.indent-note {
  margin-right: 6px;
}

/* 줄별 주석 (코드 한 줄 ↔ 설명을 같은 행에) — 화면 4 ② · 화면 5 ① 이 함께 쓴다 */
.annot {
  display: grid;
  grid-template-columns: minmax(240px, 1.05fr) minmax(220px, 1fr);
  gap: var(--space-2) var(--space-3);
  align-items: stretch;
}

.annot__head {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.annot__code {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  overflow-x: auto;
}

.annot__no {
  flex: 0 0 auto;
  min-width: 14px;
  text-align: right;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--color-text-sub);
}

.annot__text {
  white-space: pre;
}

/* 들여쓰기 한 칸(4칸) — 왼쪽에 안내선을 두어 «클래스 안»임을 보인다. */
.annot__indent {
  display: inline-block;
  width: 4ch;
  border-left: 1px solid var(--color-indent-guide);
}

.annot__note {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: var(--space-2) var(--space-3);
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-left: 4px solid var(--color-teal);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.annot__note-key {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-teal-dark);
}

.annot__note-text {
  font-size: var(--fs-small);
  line-height: 1.55;
}

@media (max-width: 700px) {
  /* 좁은 화면에서는 «코드 줄 → 그 줄의 설명» 순서로 번갈아 쌓인다. */
  .annot {
    grid-template-columns: 1fr;
    gap: var(--space-1);
  }
  .annot__head {
    display: none;
  }
  .annot__note {
    margin: 0 0 var(--space-3) var(--space-4);
  }
}

/* ------------------------------------------------------------------ */
/* 화면 3 — 설계 카드 빈칸 안내 (명세 8.3)                                  */
/* ------------------------------------------------------------------ */
.s3-gap {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-false-dark);
}

.s3-gap.is-ok {
  color: var(--color-true-dark);
}

/* 저장을 눌렀을 때 비어 있던 칸 — 색 말고 글자 안내도 함께 준다(명세 21장) */
.num-input.is-blank {
  border-color: var(--color-false);
  background: var(--color-false-soft);
  box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12);
}

/* ------------------------------------------------------------------ */
/* 코드 순서 조립 (명세 9.4)                                              */
/* ------------------------------------------------------------------ */
.asm-pool,
.asm-slots {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.asm-piece {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  min-height: var(--touch-min);
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-code-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  cursor: pointer;
}

.asm-piece:hover {
  border-color: var(--color-teal);
}

.asm-piece[disabled] {
  opacity: 0.45;
  cursor: default;
}

.asm-piece__indent {
  color: var(--color-text-sub);
  font-size: 12px;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: 0 6px;
  white-space: nowrap;
}

/* 들여쓰기 표시는 줄 «앞부분»에 두고, 폭을 고정해 코드 시작 위치를 맞춘다.
   그래야 들여쓴 조각(안내선 한 칸 만큼 밀린)과 그렇지 않은 조각이 한눈에 비교된다. */
.asm-mark {
  flex: 0 0 auto;
  min-width: 84px;
  text-align: center;
  color: var(--color-text-sub);
  font-family: var(--font-sans);
  font-size: 12px;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: 0 6px;
  white-space: nowrap;
}

.asm-code {
  flex: 1 1 auto;
  min-width: 0;
  white-space: pre;
  overflow-x: auto;
}

.asm-slot {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.asm-slot__no {
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--color-text-sub);
  min-width: 22px;
}

.asm-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.asm-slot.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ------------------------------------------------------------------ */
/* self 흐름 단계 (명세 10.2)                                             */
/* ------------------------------------------------------------------ */
.selfflow {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  counter-reset: selfstep;
}

.selfflow__item {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  opacity: 0.45;
}

.selfflow__item.is-on {
  opacity: 1;
  border-color: var(--color-teal);
  background: var(--color-teal-soft);
}

.selfflow__no {
  flex: 0 0 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--color-teal);
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.selfflow__title {
  font-weight: 700;
}

.selfflow__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 학습 정리 문장 완성 (명세 11.10)                                        */
/* ------------------------------------------------------------------ */
.fillline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-2) 0;
}

.fillline__text {
  flex: 1 1 220px;
}

.fillline__input {
  min-height: var(--touch-min);
  min-width: 140px;
  padding: var(--space-2);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);

  gap: var(--space-2);
  margin: var(--space-3) 0;
}

.selfchain__node {
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);

  color: #ffffff;

}

.selfchain__arrow {
  color: var(--color-text-sub);
}

/* call · call() · call(phone1) 비교 (명세 9.5) */
.cmp {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-3);
}

.cmp__card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-surface);
}

.cmp__card.is-ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.cmp__card.is-no {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.cmp__code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  word-break: break-all;
}

.cmp__verdict {
  margin: 0;
  font-weight: 700;
}

.cmp__mark {
  font-size: 1.1em;
}

.cmp__card.is-ok .cmp__verdict {
  color: var(--color-true-dark);
}

.cmp__card.is-no .cmp__verdict {
  color: var(--color-false-dark);
}

.cmp__note {
  margin: 0;
  font-size: var(--fs-small);
  line-height: 1.7;
}

.cmp__out {
  margin: 0;
  min-height: 1.5em;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 화면 5 — 메소드 고르기 · 조각 선택 · 자동 확인                           */
/* ------------------------------------------------------------------ */
.mchoice {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.mchoice__card {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.mchoice__card:hover {
  border-color: var(--accent2);
  background: var(--accent2-soft);
}

.mchoice__card.is-selected {
  border: 2px solid var(--accent2);
  background: var(--accent2-soft);
}

/* 명세 10.2 : 세 메소드를 모두 완성해야 한다. 완료 여부는 «글자와 테두리»로 함께 나타낸다.
   단, «지금 고른 카드»(is-selected)의 보라 강조를 덮지 않는다.
   두 가지는 서로 다른 정보이므로 카드 안 글자(▶ 고르는 중 · 완료 ○)로도 함께 구분한다. */
.mchoice__card.is-done:not(.is-selected) {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

/* 고른 카드이면서 완성한 카드 — 보라 테두리를 유지하되 완료를 초록 밑줄로 덧붙인다. */
.mchoice__card.is-done.is-selected {
  box-shadow: inset 0 -4px 0 var(--color-true);
}

.mchoice__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.mchoice__state {
  font-size: var(--fs-small);
  font-weight: 700;
  /* 연한 보라 · 연한 초록 배경 위에서도 대비 4.5:1 을 넘기도록 본문 색을 쓴다(명세 21장). */
  color: var(--color-text);
  text-align: right;
}

.mchoice__card.is-done .mchoice__state {
  color: var(--color-true-dark);
}

.mprogress {
  margin: 0 0 var(--space-4);
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-text-sub);
}

.mprogress.is-ok {
  color: var(--color-true-dark);
}

.mchoice__icon {
  font-size: 1.6em;
}

.mchoice__name {
  font-weight: 700;
}

.mchoice__code {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--accent2-dark);
  word-break: break-all;
}

.mchoice__desc {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

 * 조각 고르기(오른쪽 칸)의 크기 — 왼쪽 「내가 만든 코드」 칸과 높이를 맞추기 위한 값이다.
 * 조각의 코드가 두 줄로 접히면 오른쪽 칸이 왼쪽보다 120px 가까이 길어져 두 칸이 어긋나 보인다.

 * 조각 버튼 자체는 그대로 44px 이상이라 터치 대상 최소 크기(명세 21장)를 지킨다.
 */
.mslot {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-2);
  background: var(--color-surface);
}

.mslot__title {
  margin: 0 0 6px;
  font-weight: 700;
  color: var(--accent2-dark);
}

.mslot__opts {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mopt {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.mopt:hover {
  border-color: var(--accent2);
}

.mopt.is-selected {
  border: 2px solid var(--accent2);
  background: var(--accent2-soft);
}

.mopt__mark {
  flex: none;
  min-width: 5em;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.mopt__code {
  font-family: var(--font-mono);
  /*
   * 15px 이면 긴 조각이 두 줄로 접혀 오른쪽 칸이 왼쪽보다 120px 가까이 길어진다.
   * 13px 이면 한 줄에 들어가지만 여유가 10px 안팎이라, 세로 스크롤바가 생기거나
   * 학교 PC 에 D2Coding 이 없어 다른 글꼴로 대체되면 다시 두 줄이 된다.
   * 12px 로 두어 40px 가까운 여유를 둔다(조각 버튼 높이는 44px 그대로).
   */
  font-size: 12px;
  word-break: break-all;
}

/* 자동 확인 결과 목록 (명세 10.3) */
.elems {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  list-style: none;
}

.elems__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: var(--fs-small);
}

.elems__item.is-ok {
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.elems__item.is-no {
  background: var(--color-false-soft);
  color: var(--color-false-dark);
}

.elems__mark {
  flex: none;
  font-weight: 700;
}

/* ------------------------------------------------------------------ */
/* 화면 6 — 5번 부분 정답 표시 (명세 11.7 · 21장)                          */
/*   부분 정답은 정답도 오답도 아니므로 «주황 계열 + △ 기호»로 함께 나타낸다. */
/* ------------------------------------------------------------------ */
.score-dot.is-partial {
  background: var(--color-false);
  border-color: var(--color-false);
  color: var(--color-surface);
}

.accordion__mark.is-partial {
  color: var(--color-false-dark);
}

.quiz-review.is-partial {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}

/* ------------------------------------------------------------------ */
/* 좁은 화면 (명세 21장 : 768px 미만은 모두 1열)                            */
/* ------------------------------------------------------------------ */
@media (max-width: 767px) {
  .cmp,
  .mchoice {
    grid-template-columns: 1fr;
  }

  .chg__label {
    min-width: 0;
  }

  .levels__item--1,
  .levels__item--2 {
    margin-left: 0;
  }

  .mopt {
    flex-direction: column;
    align-items: flex-start;
  }

  .mopt__mark {
    min-width: 0;
  }
}

/* 인쇄에서는 입력·버튼을 제외한다(명세 15.7 · print.css 와 함께 동작) */
@media print {
  .mchoice,
  .mslot__opts,
  .cmp__out {
    display: none;
  }

  /* 고르는 버튼을 감췄으므로 진행 문구도 함께 감춘다(인쇄본에는 남지 않는다). */
  .mprogress {
    display: none;
  }
}

  // 이 차시는 클래스 구현이 주제이므로 class · def · self · return 을 키워드로 추가한다.
  // self 는 파이썬 예약어가 아니지만, «호출한 객체»를 가리키는 이름이라는 것을 눈에 띄게 하려고
  // 키워드와 같은 색으로 칠한다(명세 20.2 : 코드의 구조가 잘 보이게 한다).
  var KEYWORDS = /^(class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

  var TOKEN_RE = /(\b(?:class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range|sum|random|randint)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\+=|-=|\/\/|[%+\-*/<>=])/g;

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */

    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);

   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.

      first = false;

    return html;

  /**
   * 코드 뷰를 만든다.

   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)

        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.

   * 규격의 세 요소를 «순서대로» 모두 충족하면 ok:true(만점 2점)다.
   * ok:false 라도 부분 점수가 있을 수 있으며, 점수는 이 함수가 아니라
   * scoreAnswer() 가 missing(틀린 빈칸 수) · ordered 로 정한다(명세 11.7).
   * 교사용 분석을 위해 「3개 중 몇 개 충족」과 오류 유형도 함께 돌려준다.
   *
   * @param {string[]|string} answer 학생이 입력한 줄
   * @param {object} spec 코드 완성 문항의 규격(없으면 5번 문항의 규격)
   * @returns {{
   *   lines:string[], matched:number, total:number, ok:boolean,
   *   elements:object,                       // { 요소key : 충족 여부 }
   *   steps:Array<{key,label,ok}>,           // 화면에 「○ 객체 생성 · ✕ …」 로 보여 줄 때 쓴다
   *   errors:string[],                       // 명세 15.5 오류 유형
   *   feedback:string[]                      // 학생에게 보여 줄 구체적 안내 (명세 20.4)
   * }}
   */
  function checkCode(answer, spec) {
    var s = spec || specOf(byId(5)) || PRACTICE_SPEC;
    var lines = codeLines(answer);
    var parsed = lines.map(parseLine);

    var elements = {};
    var at = {}; // 요소별로 «몇 번째 줄에서» 처음 마주쳤는가
    var errors = [];
    var feedback = [];
    var pushErr = function (name) {
      if (name && errors.indexOf(name) === -1) errors.push(name);
    };

    s.steps.forEach(function (step) {
      elements[step.key] = false;
      at[step.key] = -1;
    });

    parsed.forEach(function (p, i) {
      s.steps.forEach(function (step) {
        /* ① 객체 생성 */
        if (step.kind === 'create') {
          if (p.kind !== 'create') return;
          if (p.className !== s.className) {
            if (at[step.key] === -1) at[step.key] = i;
            pushErr(s.errorClassName);
            return;
          }
          if (p.target === s.objectName) {
            if (!elements[step.key]) {
              elements[step.key] = true;
              at[step.key] = i;
            }
          } else if (at[step.key] === -1) {
            at[step.key] = i;
            pushErr(step.errorWrongTarget);
          }
          return;
        }

        /* ② 속성 대입 */
        if (step.kind === 'attr') {
          if (p.kind === 'attr' && p.attr === step.attr) {
            if (p.target !== s.objectName) {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(s.errorAttrTarget);
              return;
            }
            if (p.value === step.value) {
              if (!elements[step.key]) {
                elements[step.key] = true;
                at[step.key] = i;
              }
            } else {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(step.errorValue);
            }
            return;
          }
          // 객체를 만들지 않고 속성 이름을 단독 변수로 쓴 경우
          if (p.kind === 'assign' && p.target === step.attr) pushErr(s.errorAttrTarget);
          return;
        }

        /* ③ 메소드 호출 */
        if (step.kind === 'call') {
          if (p.kind === 'call' && p.method === step.method) {
            if (p.target !== s.objectName) {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(step.errorWrongTarget);
              return;
            }
            // 소괄호 «안»도 본다. self 는 파이썬이 자동으로 전달하므로 인수를 적지 않는다.
            // book1.borrow(self) · borrow(book1) 은 이 차시가 화면 4 ⑤ 에서 오개념으로 다루는 표현이라
            // 호출로 인정하지 않는다(명세 4.6 · 28장 7).
            if (String(p.args || '').trim() !== '') {
              if (at[step.key] === -1) at[step.key] = i;
              pushErr(step.errorArgs);
              return;
            }
            if (!elements[step.key]) {
              elements[step.key] = true;
              at[step.key] = i;
            }
            return;
          }
          // 소괄호를 빼면 호출이 아니다(명세 4.5 · 28장 8).
          if (p.kind === 'ref' && p.attr === step.method) {
            if (at[step.key] === -1) at[step.key] = i;
            pushErr(step.errorNoParen);
          }
        }
      });
    });

    var matched = s.steps.filter(function (step) {
      return elements[step.key];
    }).length;

    // 순서 검사 — 세 요소를 모두 갖췄을 때만 본다(명세 11.7 「제시 조건 순서」).
    var ordered = true;
    if (matched === s.steps.length) {
      for (var k = 1; k < s.steps.length; k += 1) {
        if (at[s.steps[k].key] < at[s.steps[k - 1].key]) ordered = false;
      }
      if (!ordered) pushErr(s.errorOrder);
    }

    // 충족하지 못한 요소는 반드시 오류 유형 하나로 분류한다(명세 15.5).
    // 「줄이 아예 없는 경우」도 값이 어긋난 경우와 같은 유형으로 묶는다.
    s.steps.forEach(function (step) {
      if (elements[step.key]) return;

      if (step.kind === 'create') {
        if (
          errors.indexOf(step.errorWrongTarget) === -1 &&
          errors.indexOf(s.errorClassName) === -1
        ) {
          pushErr(step.errorMissing);
        }
        feedback.push(step.hint);
        return;
      }

      if (step.kind === 'call') {
        if (errors.indexOf(step.errorNoParen) !== -1) {
          feedback.push(step.hintNoParen || step.hint);
          return;
        }
        if (errors.indexOf(step.errorArgs) !== -1) {
          feedback.push(step.hintArgs || step.hint);
          return;
        }
        if (errors.indexOf(step.errorWrongTarget) === -1) pushErr(step.errorMissing);
        feedback.push(step.hint);
        return;
      }

      // 속성 대입
      if (errors.indexOf(s.errorAttrTarget) !== -1 && at[step.key] !== -1) {
        feedback.push(step.hintTarget || step.hint);
        return;
      }
      if (errors.indexOf(step.errorValue) !== -1) {
        feedback.push(step.hintWrongValue || step.hint);
        return;
      }
      pushErr(step.errorValue);
      feedback.push(step.hint);
    });

    if (matched === s.steps.length && !ordered) {
      feedback.push(
        '세 줄의 순서를 확인해 보세요. ' +
          s.steps
            .map(function (step) {
              return step.label;
            })
            .join(' → ') +
          ' 순서예요.'
      );
    }

    return {
      lines: lines,
      matched: matched,
      total: s.steps.length,
      /** 틀린 빈칸 수 — 부분 점수 계산의 기준이다(명세 11.7) */
      missing: s.steps.length - matched,
      ok: matched === s.steps.length && ordered,
      /** 세 요소를 모두 갖췄을 때 순서가 조건과 같은가 */
      ordered: ordered,
      elements: elements,
      steps: s.steps.map(function (step) {
        return { key: step.key, label: step.label, ok: elements[step.key] };
      }),
      errors: errors,
      feedback: feedback
    };
  }

  function byId(id) {

  /* ------------------------------------------------------------------ */
  /* 유형별 응답 처리                                                      */

  /** 응답이 있는가(미응답과 구분) */
  function isAnswered(q, answer) {
    if (!q) return false;
    if (answer === null || answer === undefined) return false;
    if (q.type === 'choice') return answer !== '' && !isNaN(Number(answer));
    if (q.type === 'code') return codeLines(answer).length > 0;
    return false;
  }

  /** 문항 하나가 «만점 정답»인가 (부분 정답은 false 다). */
  function gradeAnswer(q, answer) {
    if (!isAnswered(q, answer)) return false;
    if (q.type === 'choice') return Number(answer) === q.answer;
    if (q.type === 'code') return checkCode(answer, q.codeSpec).ok;
    return false;
  }

   * 문항 하나의 점수 (명세 11.7)
   *   1~4번(오지선다·결과 선택) : 맞으면 2점, 아니면 0점
   *   5번(코드 입력)            : 틀린 빈칸 0개 → 2점 · 1개 → 1점 · 2개 이상 → 0점
   *                               세 줄을 다 썼지만 순서가 어긋나면 1점
   */
  function scoreAnswer(q, answer) {
    if (!q || !isAnswered(q, answer)) return 0;
    if (q.type === 'choice') return Number(answer) === q.answer ? q.points : 0;
    if (q.type !== 'code') return 0;

    var check = checkCode(answer, q.codeSpec);
    if (check.missing === 0) return check.ordered ? q.points : PARTIAL_POINT;
    if (check.missing === 1) return PARTIAL_POINT;

   *   'correct' 만점 · 'partial' 부분 정답 · 'wrong' 오답 · 'none' 미응답

  function stateAnswer(q, answer) {
    if (!isAnswered(q, answer)) return 'none';
    var points = scoreAnswer(q, answer);
    if (points >= q.points) return 'correct';
    if (points > 0) return 'partial';
    return 'wrong';
  }

  function stateMark(state) {
    if (state === 'correct') return '○ 정답';
    if (state === 'partial') return '△ 부분 정답';
    if (state === 'wrong') return '✕ 오답';
    return '− 미응답';
  }

  /** 화면·기록·제출에 쓰는 「내 답」 문자열 */
  function answerToText(q, answer) {
    if (!isAnswered(q, answer)) return '';
    if (q.type === 'choice') {
      var i = Number(answer) - 1;
      return '①②③④⑤'[i] + ' ' + q.options[i];
    }
    if (q.type === 'code') return codeLines(answer).join('\n');
    return '';
  }

  /** 정답 문자열 */
  function correctToText(q) {
    if (q.type === 'choice') return '①②③④⑤'[q.answer - 1] + ' ' + q.options[q.answer - 1];
    if (q.type === 'code') return q.modelLines.join('\n');
    return '';
  }

  /**
   * answerToText() 로 저장된 문자열을 응답 값으로 되돌린다.
   * 교사용이 제출 JSON 만으로 다시 채점할 때 쓴다(명세 18장).
   */
  function answerFromText(q, text) {
    if (Array.isArray(text)) return q.type === 'code' ? text.slice() : null;
    var s = String(text === undefined || text === null ? '' : text).trim();
    if (!s) return null;
    if (q.type === 'choice') {
      var idx = '①②③④⑤'.indexOf(s.charAt(0));
      if (idx !== -1) return idx + 1;
      // 제출 JSON 은 "3" 처럼 번호만 담을 수도 있다(명세 13장).
      if (/^[1-5]$/.test(s)) return Number(s);
      var m = s.match(/^([1-5])[).\s]/);
      return m ? Number(m[1]) : null;
    }
    if (q.type === 'code') return codeLines(s);
    return null;
  }

  /**
   * 채점 (명세 11.1)
   * @param {object} answers  { 문항id : 응답 }  미응답은 null / undefined
   * @returns {{score, maxScore, passed, correctCount, details:Array}}
   *   details[i] = { id, answer, state:'correct'|'wrong'|'none', points, category, matchedElements }
   */
  function grade(answers) {
    var a = answers || {};
    var details = QUESTIONS.map(function (q) {
      var picked = a[q.id];
      var answered = isAnswered(q, picked);
      var state = stateAnswer(q, picked);
      var check = q.type === 'code' ? checkCode(picked, q.codeSpec) : null;
      return {
        id: q.id,
        answer: answered ? picked : null,
        picked: q.type === 'choice' && answered ? Number(picked) : null,
        state: state,
        // 명세 11.7 : 5번은 부분 점수(2 · 1 · 0)를 가진다.
        points: scoreAnswer(q, picked),
        category: q.category,
        matchedElements: check ? check.matched : null,
        codeErrors: check ? check.errors : null
      };
    });
    var score = details.reduce(function (sum, d) {
      return sum + d.points;
    }, 0);
    return {
      score: score,
      maxScore: MAX_SCORE,
      passed: score >= PASS_SCORE,
      correctCount: details.filter(function (d) {
        return d.state === 'correct';
      }).length,
      /** 부분 점수를 받은 문항 수 (명세 11.9 결과 표시) */
      partialCount: details.filter(function (d) {
        return d.state === 'partial';
      }).length,
      details: details
    };
  }

  /** 이수 여부를 글자로. 색에 기대지 않도록 항상 이 문자열을 함께 쓴다(명세 21장). */
  function passLabel(score) {
    return Number(score) >= PASS_SCORE ? '이수' : '미이수';
  }

  /** 영역별 문항 묶음 — 교사용 영역 분석에 쓴다. */
  function byCategory() {
    return CATEGORIES.map(function (name) {
      return {
        category: name,
        questions: QUESTIONS.filter(function (q) {
          return q.category === name;
        })
      };
    });
  }

  return {
    POINT: POINT,
    PARTIAL_POINT: PARTIAL_POINT,
    MAX_SCORE: MAX_SCORE,
    PASS_SCORE: PASS_SCORE,
    CATEGORIES: CATEGORIES,
    QUESTIONS: QUESTIONS,
    MAX_LINE_LEN: MAX_LINE_LEN,
    MAX_CODE_LEN: MAX_CODE_LEN,
    byId: byId,
    // 코드 답안
    codeLines: codeLines,
    squeeze: squeeze,
    parseLine: parseLine,
    checkCode: checkCode,
    /** 화면 5 ⑤ 미니 활동 규격 — 형성평가 5번과 소재가 다르므로 따로 쓴다(명세 10.4) */
    PRACTICE_SPEC: PRACTICE_SPEC,
    // 유형별 응답 처리
    isAnswered: isAnswered,
    gradeAnswer: gradeAnswer,
    scoreAnswer: scoreAnswer,
    stateAnswer: stateAnswer,
    stateMark: stateMark,
    answerToText: answerToText,
    correctToText: correctToText,
    answerFromText: answerFromText,
    // 채점
    grade: grade,
    passLabel: passLabel,
    byCategory: byCategory
  };
});
