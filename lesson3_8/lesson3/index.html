  function buildPetCards(body) {
    ui.clear(body);
    refs.petPreviews = {};

    var methods = PET.availableMethods(project());
    var grid = el('div', { 'class': 'petgrid' });

    PETS.forEach(function (name) {
      var values = project().values[name];
      var rows = el('div', { 'class': 'petcard__rows' });

      /* 이름 */
      var nameField = ui.textField({
        id: 'v-name-' + name,
        value: values.name,
        maxLength: 10,
        onInput: ui.debounce(function (value) {
          project().values[name].name = value;
          refresh();
        }, 300)
      });
      nameField.input.setAttribute('aria-label', name + ' 의 이름');
      rows.appendChild(petRow('이름', nameField.root));

      /* 종류 */
      var animalField = ui.selectField({
        id: 'v-animal-' + name,
        value: values.animal,
        options: animalOptions(),
        onChange: function (value) {
          project().values[name].animal = value;
          refresh();
        }
      });
      animalField.select.setAttribute('aria-label', name + ' 의 종류');
      rows.appendChild(petRow('종류', animalField.root));

      /* 나이 */

        var ageField = ui.numberField({
          id: 'v-age-' + name,
          min: 0,
          max: 30,
          value: values.age === '' ? 1 : values.age,
          withSlider: false,
          onChange: function (n) {
            project().values[name].age = n;
            refresh();
          }
        });
        ageField.input.setAttribute('aria-label', name + ' 의 나이');
        rows.appendChild(petRow('나이', ageField.root));
      }

      /* 배고픔 */
      if (hasExt('hungry')) {
        var hungryField = ui.selectField({
          id: 'v-hungry-' + name,
          value: values.hungry ? 'True' : 'False',
          options: [
            { value: 'True', label: 'True — 배고파요' },
            { value: 'False', label: 'False — 배불러요' }
          ],
          onChange: function (value) {
            project().values[name].hungry = value === 'True';
            refresh();
          }
        });
        hungryField.select.setAttribute('aria-label', name + ' 의 배고픔 상태');
        rows.appendChild(petRow('배고픔', hungryField.root));
      }

      /* 직접 만든 속성 */
      project().customProperties.forEach(function (prop) {
        var field = ui.textField({
          id: 'v-' + prop.name + '-' + name,
          value: String(values[prop.name] || ''),
          maxLength: 30,
          placeholder: '값을 적어요',
          onInput: ui.debounce(function (value) {
            project().values[name][prop.name] = value;
            refresh();
          }, 300)
        });
        field.input.setAttribute('aria-label', name + ' 의 ' + prop.name);
        rows.appendChild(petRow(prop.name, field.root));
      });

      /* 실행할 기능 */
      var callBox = el('div', { 'class': 'petcard__calls' });
      methods.forEach(function (method) {
        var input = el('input', {
          type: 'checkbox',
          checked: (project().calls[name] || []).indexOf(method) !== -1,
          attrs: { 'aria-label': name + ' 이(가) ' + method + '() 실행하기' }
        });
        input.addEventListener('change', function () {
          var list = project().calls[name] || (project().calls[name] = []);
          var i = list.indexOf(method);
          if (input.checked && i === -1) list.push(method);
          if (!input.checked && i !== -1) list.splice(i, 1);
          refresh();

        callBox.appendChild(
          el('label', { 'class': 'inline-check' }, [input, el('code', { text: method + '()' })])

      refs.petPreviews[name] = preview;

      grid.appendChild(
        el('article', { 'class': 'petcard' }, [
          el('div', { 'class': 'petcard__head' }, [
            el('span', { 'class': 'petcard__face', text: PET_FACE[name], attrs: { 'aria-hidden': 'true' } }),

    body.appendChild(grid);
    refs.petNote = el('p', { 'class': 'picksum', attrs: { 'aria-live': 'polite' } });

  function petRow(label, control) {
    return el('div', { 'class': 'petcard__row' }, [

      control
    ]);

  function animalOptions() {
    var list = PET.ANIMAL_CHOICES.slice();
    var extra = project().branches.newAnimal.animal;
    if (hasExt('newAnimal') && extra && list.indexOf(extra) === -1) list.push(extra);
    return list.map(function (name) {
      return { value: name, label: name };
    });
  }

  function paintPetPreviews() {
    if (!refs.petPreviews) return;
    var run = PET.runProject(project());
    PETS.forEach(function (name) {
      var node = refs.petPreviews[name];
      if (!node) return;
      var lines = run.perObject[name];
      node.textContent = lines.length ? lines.join('\n') : '아직 실행할 기능을 고르지 않았어요.';
      node.classList.toggle('is-empty', !lines.length);
    });

    if (!refs.petNote) return;
    var v1 = project().values.pet1;
    var v2 = project().values.pet2;
    var same = v1.name === v2.name && v1.animal === v2.animal;
    var noCall = PETS.filter(function (name) {
      return (project().calls[name] || []).length === 0;
    });

    if (same) {
      refs.petNote.className = 'picksum';
      refs.petNote.innerHTML = '두 반려동물의 <strong>이름이나 종류</strong>를 서로 다르게 정해 주세요.';
    } else if (noCall.length) {
      refs.petNote.className = 'picksum';
      refs.petNote.innerHTML =
        '<strong>' + noCall.join(' · ') + '</strong> 이(가) 실행할 기능을 하나 이상 골라 주세요.';
    } else {
      refs.petNote.className = 'picksum is-ok';
      refs.petNote.innerHTML = '✓ 두 반려동물이 서로 다르고, 각자 실행할 기능도 골랐어요.';
    }
  }

  function paintCode(result) {
    if (!refs.code) return;
    refs.code.setLines(
      result.code.map(function (line) {
        return { code: line };
      })
    );
  }

  function runProject() {
    var run = PET.runProject(project());
    refs.console.clear();
    if (!run.output.length) {
      refs.console.writeHint('3단계에서 실행할 기능을 골라 주세요. 고르지 않으면 아무것도 출력되지 않아요.');
    } else {
      run.output.forEach(function (line) {
        refs.console.write(line);
      });
    }
    st().ran = true;
    st().lastRunAt = new Date().toLocaleString('ko-KR');
    refresh();
    ui.announce('프로그램을 실행했어요. 출력 ' + run.output.length + '줄이 나왔습니다.');
  }

  function downloadCode() {
    var text = PET.projectCode(project()).join('\r\n');
    try {
      var blob = new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: 'lesson3_8_3_나의_Pet_클래스.py' });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      ui.toast('코드를 파일로 저장했어요.');
    } catch (err) {
      ui.toast('파일을 만들지 못했어요.');
    }
  }

  /** 점검 항목을 학생의 말로 묶는다 (명세 10.4 아홉 항목은 그대로 검사한다) */
  var CHECK_GROUPS = [

  function paintChecks(result) {
    if (!refs.checkGroups) return;
    var byKey = {};
    result.checks.forEach(function (c) {
      byKey[c.key] = c;
    });

    refs.checkSummary.textContent = result.total + '개 중 ' + result.passed + '개 완성';
    refs.checkSummary.classList.toggle('is-ok', result.ok);

    ui.clear(refs.checkGroups);
    CHECK_GROUPS.forEach(function (group) {
      var items = group.keys.map(function (key) {
        return byKey[key];
      });
      var done = items.every(function (c) {
        return c.ok;
      });
      var list = el('ul', { 'class': 'elems' });
      items.forEach(function (check) {
        var item = el('li', { 'class': 'elems__item ' + (check.ok ? 'is-ok' : 'is-no') }, [
          el('span', { 'class': 'elems__mark', text: check.ok ? '○' : '✕' }),
          el('span', { 'class': 'elems__text', text: check.label })
        ]);
        if (!check.ok) {
          item.appendChild(el('span', { 'class': 'elems__where', text: check.fix || check.where }));
          item.appendChild(
            el('button', {
              type: 'button',
              'class': 'elems__btn',
              text: '고치러 가기',
              attrs: { 'aria-label': check.label + ' 을(를) 고칠 곳으로 이동' },

                  if (target) ui.scrollToNode(target);

              }
            })
          );

        list.appendChild(item);

      refs.checkGroups.appendChild(
        el('section', { 'class': 'checkgroup' + (done ? ' is-done' : '') }, [
          el('p', { 'class': 'checkgroup__title' }, [

            el('span', { text: group.title }),
            el('span', {
              'class': 'checkgroup__count',
              text:
                items.filter(function (c) {
                  return c.ok;
                }).length + ' / ' + items.length
            })

          list
        ])
      );
    });

    var failed = result.checks.filter(function (c) {
      return !c.ok;
    });

      refs.checkFeedback.show(
        'success',
        '점검표를 모두 채웠어요. 아래 <strong>설명 다섯 문항</strong>까지 쓰면 다음 단계로 넘어갈 수 있어요.',
        '🎉'
      );
    } else {
      // 명세 20.4 : 빠진 것 → 그래서 생기는 문제 → 다시 볼 개념 → 고치는 방법
      var first = failed[0];
      refs.checkFeedback.show(
        'warning',
        '<strong>지금 빠진 것</strong> — ' + ui.escapeHtml(first.label) + '<br />' +
          '<strong>그래서</strong> — ' + (CHECK_WHY[first.key] || '프로그램이 아직 완성되지 않았어요.') + '<br />' +
          '<strong>다시 볼 것</strong> — 값(속성)은 «가지고 있는 것», 기능(메소드)은 «하는 일» 이며 ' +
          '기능은 <strong>실행해야</strong> 결과가 나옵니다.<br />' +
          '<strong>고치는 방법</strong> — ' + ui.escapeHtml(first.fix || first.where) +
          (failed.length > 1 ? '<br />남은 항목 ' + (failed.length - 1) + '개도 이어서 확인해 보세요.' : '')
      );
    }
  }

  function paintExplainCount(result) {
    if (!refs.explainItems) return;
    var byKey = {};
    result.explanation.items.forEach(function (item) {
      byKey[item.key] = item;

    refs.explainItems.forEach(function (item) {

      item.count.classList.toggle('is-ok', info.ok);

    refs.explainNote.className = 'picksum' + (result.explanation.ok ? ' is-ok' : '');
    refs.explainNote.textContent = result.explanation.ok
      ? '✓ 다섯 문항을 모두 썼어요.'
      : '쓴 문항 ' + result.explanation.filled + ' / ' + result.explanation.total + '개';
  }

  /* ================================================================== */
  /* 공통 조각                                                            */
  /* ================================================================== */
  function stepHead(opts) {
    return el('header', { 'class': 'mkstep' }, [
      el('p', { 'class': 'mkstep__eyebrow' }, [
        el('span', { 'class': 'mkstep__no', text: String(opts.no) }),
        el('span', { text: opts.no + '단계' })
      ]),
      el('h3', { 'class': 'mkstep__title', text: opts.title }),
      el('p', { 'class': 'mkstep__sub', html: opts.sub }),
      opts.rule
        ? el('p', { 'class': 'mkstep__rule' }, [
            el('span', { text: '✔ ', attrs: { 'aria-hidden': 'true' } }),
            el('span', { text: opts.rule })
          ])
        : null
    ]);
  }

  /* ================================================================== */
  function paint() {
    // 화면 2 에서 미리 고른 항목을 아직 손대지 않았다면 그대로 반영한다(명세 7.2).
    var plan = L.state.appState.step2.plan || [];
    if (!st().ran && plan.length && project().extensions.length === 0) {
      project().extensions = plan.slice();
    }
    rebuild();
    if (refs.explainItems) {
      refs.explainItems.forEach(function (item) {
        item.field.setValue(explain()[item.q.key] || '');
      });
    }
    refresh(true);
  }

  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 5,
        title: C.STEP_TITLES[5],
        lead: [
          '이제 <code>Pet</code> 클래스를 <strong>나만의 프로그램</strong>으로 바꿉니다.',
          '아래 <strong>네 단계</strong>를 차례로 따라가면 완성돼요. 쓴 내용은 자동으로 저장됩니다.'
        ]
      })
    );

    refs.saveNote = el('p', {
      'class': 'savenote',
      attrs: { 'aria-live': 'polite' },
      text: '💾 쓰는 대로 자동 저장돼요'
    });
    root.appendChild(refs.saveNote);
    L.state.onSaved(function (at) {
      if (refs.saveNote) refs.saveNote.textContent = '💾 자동 저장됨 · ' + at;
    });

    var main = ui.panel({ title: '나만의 반려동물 프로그램 만들기', className: 'step5-main' });

    buildFlow(main.body);

    sections.pick = el('section', { 'class': 'mkbox' });
    sections.fill = el('section', { 'class': 'mkbox' });
    sections.pets = el('section', { 'class': 'mkbox' });
    sections.run = el('section', { 'class': 'mkbox' });

    buildStep1(sections.pick);
    buildStep2(sections.fill);
    buildStep3(sections.pets);
    buildStep4(sections.run);

    [sections.pick, sections.fill, sections.pets, sections.run].forEach(function (node) {
      main.body.appendChild(node);
    });
    root.appendChild(main.root);

    paint();
  }

  L.registerStep(5, {
    title: C.STEP_TITLES[5],
    short: C.STEP_SHORTS[5],
    render: render,
    onEnter: paint
  });
})();

    <script data-from="js/65-step6.js">
/**

 *
 *   ① 형성평가 (왼쪽) + 채점·제출 진행 상황 · 피드백 (오른쪽)

 *   ④ 학습 정리 (문장 완성 · 핵심어)
 *   ⑤ 마무리 (기록 내려받기 · 인쇄)

 *   · 문항 · 정답 · 해설은 45-quiz.js(문항 은행) 하나만 본다.
 *   · 5문항에 모두 답하기 전에는 정답과 해설을 절대 노출하지 않는다(명세 1.2 · 11.1).
 *   · 학번·이름이 없어도 학습·채점·해설·재도전이 모두 가능하다(명세 11.2).
 *   · 제출 실패가 채점을 막지 않는다(명세 11.8).
 *   · 학생이 입력한 코드는 실행하지 않고, 화면에는 textContent 로만 넣는다(명세 22장).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var QUIZ = L.quiz;
  var PET = L.pet;
  var PROJ = L.project;

  var CIRCLED = '①②③④⑤';

  /** ④ 학습 정리 — 문장 완성 (명세 11.9) */
  var WRAP_UP = [
    {
      key: 'a1',
      before: '같은 클래스로 만든 객체도 서로 다른 ',

  function verdictOf(score) {
    if (score >= QUIZ.MAX_SCORE) return { icon: '🎉', text: '만점이에요. 오늘 배운 내용을 정확히 이해했습니다.' };

  }

  function studentLabel() {
    var id = String(st().student.id || '').trim();

  /* ------------------------------------------------------------------ */
  /* ① 형성평가 문항 (한 번에 한 문항 · 명세 11.1)                            */
  /* ------------------------------------------------------------------ */
  function currentQuestion() {

  }

  function buildDots() {
    ui.clear(refs.quizDots);

      var answered = QUIZ.isAnswered(q, st().answers[q.id]);
      refs.quizDots.appendChild(
        el('button', {
          type: 'button',
          'class':
            'quiz__dot' + (answered ? ' is-answered' : '') + (i === st().index ? ' is-current' : ''),

  function renderQuestion() {
    var q = currentQuestion();
    var total = QUIZ.QUESTIONS.length;

    var locked = Boolean(st().submitLocked);

    refs.quizCounter.textContent = '문항 ' + (index + 1) + ' / ' + total;
    buildDots();

    ui.clear(refs.quizBody);
    if (!q) return;

    refs.quizBody.appendChild(
      el('div', { 'class': 'quiz__tags' }, [
        ui.badge('primary', q.category),
        ui.badge('primary', q.typeLabel),
        ui.badge('primary', q.points + '점')
      ])
    );
    refs.quizBody.appendChild(
      el('p', { 'class': 'quiz__question' }, [
        el('span', { 'class': 'quiz__no', text: '문항 ' + (index + 1) + '.' }),
        el('span', { text: ' ' + q.title })
      ])
    );
    refs.quizBody.appendChild(el('p', { 'class': 'quiz-context pre-line', text: q.context }));

    if (q.code) {
      refs.quizBody.appendChild(
        L.codeview.createCodeView({
          lines: q.code.split('\n').map(function (line) {
            return { code: line };
          }),
          showLineNumbers: false,
          ariaLabel: '문항 파이썬 코드'
        }).root
      );
    }
    if (q.codeHead) {
      refs.quizBody.appendChild(
        L.codeview.createCodeView({
          title: '주어진 클래스',
          lines: q.codeHead.split('\n').map(function (line) {
            return { code: line };
          }),
          showLineNumbers: false,
          ariaLabel: '문항 준비 코드'
        }).root
      );
    }
    // 코드 입력 문항은 조건과 기대 결과를 «입력칸 바로 위»에 둔다.
    // 위아래로 화면을 오가지 않고 한자리에서 쓸 수 있게 하기 위해서다.
    if (q.type !== 'code') {
      if (q.conditions) {
        refs.quizBody.appendChild(
          el(
            'ul',
            { 'class': 'hint-list' },
            q.conditions.map(function (text) {
              return el('li', { text: text });
            })
          )
        );
      }
      if (q.expected) {
        refs.quizBody.appendChild(
          el('div', { 'class': 'expected' }, [
            el('p', { 'class': 'expected__title', text: '기대 실행 결과' }),
            el('pre', { 'class': 'expected__body', text: q.expected.join('\n') })
          ])
        );
      }
    }
    if (q.note) refs.quizBody.appendChild(el('p', { 'class': 'quiz-note', text: q.note }));
    refs.quizBody.appendChild(el('p', { 'class': 'bigq', text: q.prompt }));

    if (q.type === 'choice') renderChoices(q, answers, locked);
    else if (q.type === 'code') renderCodeAnswer(q, answers, locked);

    // 채점을 마친 뒤에만 정답과 해설을 보여 준다(명세 1.2 · 11.1).
    if (st().graded) {
      var given = answers[q.id];
      var earned = QUIZ.scoreAnswer(q, given);
      var state = !QUIZ.isAnswered(q, given)
        ? 'none'
        : QUIZ.gradeAnswer(q, given)
        ? 'correct'
        : earned > 0
        ? 'partial'
        : 'wrong';
      refs.quizBody.appendChild(reviewBox(q, given, state, earned));
    }

    refs.btnPrevQ.disabled = index === 0;
    refs.btnNextQ.disabled = index === total - 1;
    updateQuizNote();
  }

  function afterAnswer() {
    L.state.markChanged();
    buildDots();
    updateQuizNote();
  }

  function answerFeedback(message) {
    var left = QUIZ.QUESTIONS.length - L.state.answeredCount();
    refs.feedback.show(
      'info',
      message +
        (left === 0
          ? ' 모든 문항에 답했어요. 이제 채점하거나 제출할 수 있어요.'
          : ' 남은 문항 ' + left + '개예요.')
    );
  }

  /** 오지선다형 · 결과 선택형 */
  function renderChoices(q, answers, locked) {
    var buttons = [];
    var blocks = q.optionBlocks || null;

    refs.quizBody.appendChild(
      el(
        'div',
        { 'class': 'options', attrs: { role: 'group', 'aria-label': q.prompt } },
        q.options.map(function (text, i) {
          var selected = Number(answers[q.id]) === i + 1;
          var btn;
          if (blocks) {
            // 실행 결과 보기 — 여러 줄 출력을 그대로 보여 준다(명세 11.6).
            btn = el(
              'button',
              {
                type: 'button',
                'class': 'outopt' + (selected ? ' is-selected' : ''),
                disabled: locked,
                attrs: { 'aria-label': CIRCLED[i] + '번 보기. ' + blocks[i].join(', ') }
              },
              [
                el('span', { 'class': 'outopt__num', text: CIRCLED[i] }),
                el('pre', { 'class': 'outopt__body', text: blocks[i].join('\n') })
              ]
            );
          } else {
            btn = el(
              'button',
              {
                type: 'button',
                'class': 'option' + (selected ? ' is-selected' : ''),
                disabled: locked
              },
              [
                el('span', { 'class': 'option__num', text: CIRCLED[i] }),
                el('span', { 'class': 'option__text', text: text })
              ]
            );
          }
          btn.addEventListener('click', function () {
            st().answers[q.id] = i + 1;
            buttons.forEach(function (b, k) {
              b.classList.toggle('is-selected', k === i);
            });
            afterAnswer();
            answerFeedback('<strong>' + CIRCLED[i] + '</strong> 를 골랐어요.');
          });
          buttons.push(btn);
          return btn;
        })
      )
    );
  }

  /** 프로그램 직접 입력 — 문항이 요구하는 줄 수만큼 입력칸을 만든다 (명세 11.7) */
  function renderCodeAnswer(q, answers, locked) {
    var count = QUIZ.inputLineCount(q);
    var stored = Array.isArray(answers[q.id]) ? answers[q.id] : [];
    var hints = q.inputHints || [];
    var inputs = [];

    // 조건과 기대 결과를 입력칸 바로 위에 나란히 둔다(넓은 화면에서는 두 칸).
    if (q.conditions || q.expected) {
      refs.quizBody.appendChild(
        el('div', { 'class': 'qbrief' }, [
          q.conditions
            ? el('div', { 'class': 'qbrief__box' }, [
                el('p', { 'class': 'qbrief__title', text: '조건' }),
                el(
                  'ul',
                  { 'class': 'hint-list' },
                  q.conditions.map(function (text) {
                    return el('li', { text: text });
                  })
                )
              ])
            : null,
          q.expected
            ? el('div', { 'class': 'expected' }, [
                el('p', { 'class': 'expected__title', text: '기대 실행 결과' }),
                el('pre', { 'class': 'expected__body', text: q.expected.join('\n') })
              ])
            : null
        ])
      );
    }

    var box = el('div', { 'class': 'stack codeinputs' });
    for (var i = 0; i < count; i += 1) {
      (function (index) {
        var hint = hints[index] || '';
        var input = el('input', {
          type: 'text',
          'class': 'codeinput__field',
          id: 'quiz-code-' + index,
          value: String(stored[index] || ''),
          disabled: locked,
          maxLength: QUIZ.MAX_LINE_LEN,
          attrs: {
            spellcheck: 'false',
            autocomplete: 'off',
            // 칸 안에 «무엇을 적는 자리인지»를 흐린 글씨로 보여 준다(위로 올라가 조건을 다시 볼 필요가 없다).
            placeholder: hint,
            'aria-label': '입력 ' + (index + 1) + (hint ? ' — ' + hint : '')
          }
        });
        input.addEventListener(
          'input',
          ui.debounce(function () {
            var cur = Array.isArray(st().answers[q.id]) ? st().answers[q.id] : [];
            while (cur.length < count) cur.push('');
            cur[index] = input.value;
            st().answers[q.id] = cur;
            afterAnswer();
          }, 300)
        );
        inputs.push(input);
        box.appendChild(
          el('div', { 'class': 'codeinput' }, [
            el('label', {
              'class': 'codeinput__no',
              text: '입력 ' + (index + 1),
              htmlFor: 'quiz-code-' + index
            }),
            input
          ])
        );
      })(i);
    }
    refs.quizBody.appendChild(box);
    refs.quizBody.appendChild(
      el('p', {
        'class': 'quiz-note',
        text:
          '흐린 글씨는 «그 줄에 무엇을 적는지» 알려 주는 안내예요. 안내를 지우고 파이썬 명령어를 직접 적으세요. ' +
          '생성 줄끼리, 변경 줄끼리는 순서를 바꿔도 됩니다.'
      })
    );

    if (q.codeTail) {
      refs.quizBody.appendChild(
        L.codeview.createCodeView({
          title: '이어지는 코드',
          showLineNumbers: false,
          ariaLabel: '이어지는 코드',
          lines: q.codeTail.split('\n').map(function (line) {
            return { code: line };
          })
        }).root
      );
    }
    refs.quizBody.appendChild(
      ui.buttonRow([
        ui.button({
          label: '입력 확인',
          variant: 'secondary',
          disabled: locked,
          onClick: function () {
            var cur = inputs.map(function (input) {
              return input.value;
            });
            st().answers[q.id] = cur;
            afterAnswer();
            // 채점 전이므로 «정답 여부»는 알려 주지 않고 입력한 줄 수만 알려 준다(명세 11.1).
            answerFeedback('<strong>' + QUIZ.codeLines(cur).length + '줄</strong>을 입력했어요.');
          }
        })
      ])
    );
  }

  /**
   * 명세 11.8 : 진행 순서는 «모두 응답 → 답안 제출 → 채점 → 결과·해설» 이다.
   *   · 제출 기능을 쓰는 수업에서는 제출을 마쳐야 [채점하기] 가 열린다.
   *   · 제출이 실패하면 [채점 계속하기] 로 채점을 열어 준다.
   */
  function updateQuizNote() {
    var total = QUIZ.QUESTIONS.length;
    var answered = L.state.answeredCount();
    var all = answered === total;
    var submitted = Boolean(st().submitted);
    var needSubmit = C.SUBMIT_ENABLED && !submitted && !gradeUnlocked;

    if (C.SUBMIT_ENABLED && refs.btnSubmit) {
      refs.btnSubmit.disabled = !all || submitted;
      refs.btnSubmit.textContent = submitted ? '제출 완료 ✓ (1회)' : '답안 · 프로젝트 제출하기';
      refs.btnSubmit.classList.toggle('btn--submitted', submitted);
      refs.btnSubmit.title = submitted
        ? '답안은 한 번만 제출할 수 있어요. 이미 제출을 마쳤습니다.'
        : all
        ? '답안과 프로젝트 요약을 선생님께 보냅니다.'
        : '5문항에 모두 답하면 제출할 수 있어요.';
    }
    refs.btnGrade.disabled = !all || needSubmit;
    refs.btnGrade.title = !all
      ? '5문항에 모두 답해 주세요.'
      : needSubmit
      ? '먼저 [답안 · 프로젝트 제출하기] 로 제출해 주세요.'
      : '';

    refs.quizNote.textContent =
      '응답 ' + answered + ' / ' + total + '개 · ' +
      (!all
        ? '5문항에 모두 답하면 채점할 수 있어요. (정답과 해설은 채점 뒤에 공개돼요)'
        : needSubmit
        ? '먼저 [답안 · 프로젝트 제출하기] 로 보낸 뒤 [채점하기] 를 누를 수 있어요.'
        : submitted
        ? '제출을 마쳤어요. 이제 [채점하기] 로 총점과 해설을 볼 수 있어요.'
        : '[채점하기] 를 누르면 총점과 해설을 볼 수 있어요.');

    paintSubmitNotice(all, submitted);
  }

  function paintSubmitNotice(all, submitted) {
    if (!refs.submitNotice) return;
    var box = refs.submitNotice;
    ui.clear(box);
    if (!C.SUBMIT_ENABLED) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    if (submitted) {
      box.className = 'submit-notice is-done';
      box.appendChild(
        el('p', {
          html:
            '✓ <strong>제출 완료</strong>' +
            (st().submitInfo.at ? ' — ' + ui.escapeHtml(st().submitInfo.at) : '') +
            '<br />이제 <strong>[채점하기]</strong> 로 결과를 확인하세요.'
        })
      );
      return;
    }
    box.className = 'submit-notice';
    box.appendChild(
      el('p', {
        html:
          '⚠ <strong>답안은 한 번만 제출할 수 있어요.</strong> 제출한 뒤에는 답을 고칠 수 없습니다.<br />' +
          (all
            ? '제출하려면 위쪽 <strong>응시자 정보</strong>(학번 · 이름)를 채운 뒤 <strong>[답안 · 프로젝트 제출하기]</strong> 를 누르세요.'
            : '5문항에 모두 답하면 <strong>[답안 · 프로젝트 제출하기]</strong> 가 열립니다.')
      })
    );
  }

  /** 명세 11.8 : 문항별 내 답 · 정답 · 해설 · 보충 화면 이동 */
  function reviewBox(q, given, state, earned) {
    var points = earned === undefined ? QUIZ.scoreAnswer(q, given) : earned;
    var mark =
      state === 'correct'
        ? '○ 정답'
        : state === 'partial'
        ? '◐ 부분 정답'
        : state === 'wrong'
        ? '✕ 오답'
        : '− 미응답';
    var myText = QUIZ.answerToText(q, given);
    var rows = [
      el('dt', { text: '내 답' }),
      // 학생이 입력한 코드는 반드시 «글자»로만 넣는다(명세 11.7 · 22장).
      el('dd', { 'class': q.type === 'code' ? 'pre-line' : '', text: myText || '응답하지 않음' }),
      el('dt', { text: '정답' }),
      el('dd', { 'class': q.type === 'code' ? 'pre-line' : '', text: QUIZ.correctToText(q) })
    ];
    if (q.type === 'code' && state !== 'none') {
      var check = QUIZ.checkCode(given, q.codeSpec);
      rows.push(el('dt', { text: '충족한 요소' }));
      rows.push(
        el('dd', {
          text:
            check.total + '개 중 ' + check.matched + '개 → ' + QUIZ.formatScore(points) + '점 — ' +
            check.steps
              .map(function (step) {
                return (step.ok ? '○' : '✕') + ' ' + step.label;
              })
              .join(' · ')
        })
      );
      rows.push(el('dt', { text: '부분 점수 기준' }));
      rows.push(
        el('dd', {
          text: QUIZ.partialTable(q)
            .map(function (row) {
              return row[0] + ' → ' + row[1];
            })
            .join(' · ')
        })
      );
      if (check.feedback.length) {
        rows.push(el('dt', { text: '다시 볼 점' }));
        rows.push(
          el('dd', {
            html: check.feedback
              .map(function (line) {
                return ui.escapeHtml(line);
              })
              .join('<br />')
          })
        );
      }
    }
    rows.push(el('dt', { text: '해설' }));
    rows.push(el('dd', { html: q.explain }));

    var box = el(
      'div',
      {
        'class':
          'quiz-review ' +
          (state === 'correct'
            ? 'is-correct'
            : state === 'partial'
            ? 'is-partial'
            : state === 'wrong'
            ? 'is-wrong'
            : '')
      },
      [
        el('p', {
          'class': 'quiz-review__head',
          text: mark + ' · ' + QUIZ.formatScore(points) + ' / ' + QUIZ.formatScore(q.points) + '점'
        }),
        el('dl', { 'class': 'quiz-review__rows' }, rows)
      ]
    );
    if (q.type === 'code' && state !== 'correct') {
      box.appendChild(
        L.codeview.createCodeView({
          title: '모범 답안',
          showLineNumbers: false,
          ariaLabel: '모범 답안',
          lines: q.modelLines.map(function (line) {
            return { code: line };
          })
        }).root
      );
    }
    if (state !== 'correct') {
      box.appendChild(
        ui.linkLine({
          text:
            '이 문항은 <strong>화면 ' + (q.reviewSteps || [q.reviewStep]).join(' · ') +
            '</strong> 에서 다시 확인할 수 있어요.',
          label: '보충 화면으로 돌아가기',
          step: q.reviewStep
        })
      );
    }
    return box;
  }

  /* ------------------------------------------------------------------ */
  /* 채점 (명세 11.8)                                                       */
  /* ------------------------------------------------------------------ */
  function grade() {
    var result = QUIZ.grade(st().answers);
    st().graded = true;
    st().score = result.score;
    st().passed = result.passed;
    st().lastScore = result.score;
    st().attempts = (st().attempts || 0) + 1;
    if (st().bestScore === null || result.score > st().bestScore) st().bestScore = result.score;
    L.state.markChanged();

    refs.console.clear();
    refs.console.write(QUIZ.QUESTIONS.length + '문항 채점을 시작합니다.');
    result.details.forEach(function (d) {
      var q = QUIZ.byId(d.id);
      refs.console.write(
        d.id + '번 [' + q.category + '] ' +
          (d.state === 'correct'
            ? '정답 ○ +' + QUIZ.formatScore(d.points) + '점'
            : d.state === 'partial'
            ? '부분 정답 ◐ +' + QUIZ.formatScore(d.points) + '점'
            : d.state === 'wrong'
            ? '오답 ✕ 0점'
            : '미응답 − 0점') +
          (q.type === 'code' && d.matchedElements !== null
            ? ' (' + d.totalElements + '개 요소 중 ' + d.matchedElements + '개 충족)'
            : '')
      );
    });
    refs.console.write('총점 ' + QUIZ.formatScore(result.score) + ' / ' + result.maxScore + '점');
    refs.console.writeHint('판정 : ' + QUIZ.passLabel(result.score) + ' (6점 이상 이수)');

    renderResult(result);
    renderQuestion();
    applySections(true);
    refs.feedback.show(
      result.passed ? 'success' : 'warning',
      '채점을 마쳤어요. <strong>' + QUIZ.formatScore(result.score) + ' / ' + result.maxScore + '점</strong> · ' +
        QUIZ.passLabel(result.score) + '. 아래 <strong>② 채점 결과 및 해설</strong>을 확인해 보세요.',
      verdictOf(result.score).icon
    );
    ui.announce(
      '채점을 마쳤어요. ' + QUIZ.formatScore(result.score) + '점, ' + QUIZ.passLabel(result.score) + '입니다.'
    );
    ui.scrollToNode(refs.resultSection);
  }

  function applySections(graded) {
    if (refs.resultSection) refs.resultSection.hidden = !graded;
  }

  function accordionItem(opts) {
    var body = el('div', { 'class': 'accordion__body' });
    (opts.rows || []).forEach(function (row) {
      body.appendChild(
        el('dl', { 'class': 'accordion__row' }, [
          el('dt', { text: row[0] }),
          el('dd', { html: row[1] })
        ])
      );
    });
    if (opts.extra) body.appendChild(opts.extra);

    var item = el('div', { 'class': 'accordion__item' + (opts.open ? ' is-open' : '') });
    var head = el(
      'button',
      {
        type: 'button',
        'class': 'accordion__head',
        attrs: {
          'aria-expanded': String(Boolean(opts.open)),
          'aria-label': opts.title + ' 해설 펼치기/접기'
        },
        on: {
          click: function () {
            var next = !item.classList.contains('is-open');
            item.classList.toggle('is-open', next);
            head.setAttribute('aria-expanded', String(next));
          }
        }
      },
      [
        el('span', { 'class': ('accordion__mark ' + (opts.markClass || '')).trim(), text: opts.mark }),
        el('span', { 'class': 'accordion__title', text: opts.title }),
        el('span', { 'class': 'accordion__chevron', text: '▾', attrs: { 'aria-hidden': 'true' } })
      ]
    );
    item.appendChild(head);
    item.appendChild(body);
    return item;
  }

  function renderResult(result) {
    var body = refs.resultBody;
    ui.clear(body);

    var dots = el(
      'div',
      { 'class': 'score-dots', attrs: { role: 'list', 'aria-label': '문항별 결과' } },
      result.details.map(function (d, i) {
        var label =
          d.state === 'correct'
            ? '정답'
            : d.state === 'partial'
            ? '부분 정답'
            : d.state === 'wrong'
            ? '오답'
            : '미응답';
        return el('span', {
          'class':
            'score-dot' +
            (d.state === 'correct' ? ' is-correct' : '') +
            (d.state === 'partial' ? ' is-partial' : ''),
          text: String(i + 1),
          attrs: {
            role: 'listitem',
            'aria-label': i + 1 + '번 문항 ' + label + ' ' + QUIZ.formatScore(d.points) + '점',
            title: i + 1 + '번 ' + QUIZ.formatScore(d.points) + ' / ' + QUIZ.POINT + '점 · ' + label
          }
        });
      })
    );

    var v = verdictOf(result.score);
    var label = studentLabel();
    body.appendChild(
      el('div', { 'class': 'score-card' }, [
        el('p', { 'class': 'score-card__title', text: '형성평가 결과' }),
        label ? el('p', { 'class': 'score-card__student', html: ui.escapeHtml(label) }) : null,
        el('p', { 'class': 'score-card__value' }, [
          el('span', { text: QUIZ.formatScore(result.score) }),
          el('small', { text: ' 점 / ' + result.maxScore + ' 점' })
        ]),
        dots,
        el('p', {
          'class': 'score-card__count',
          text:
            '(' + result.correctCount + ' / ' + QUIZ.QUESTIONS.length + ' 문항 정답' +
            (result.partialCount ? ' · 부분 정답 ' + result.partialCount + '문항' : '') +
            ' · 문항당 ' + QUIZ.POINT + '점)'
        }),
        el('p', {
          'class': 'score-card__level',
          html: '판정 <strong>' + QUIZ.passLabel(result.score) + '</strong> — 6점 이상이면 이수입니다.'
        }),
        el('p', { 'class': 'score-card__comment', text: v.icon + ' ' + v.text }),
        el('p', {
          'class': 'score-card__meta',
          text:
            '도전 ' + (st().attempts || 0) + '회 · 최고 ' +
            (st().bestScore === null ? '-' : QUIZ.formatScore(st().bestScore)) + '점 · 최근 ' +
            (st().lastScore === null ? '-' : QUIZ.formatScore(st().lastScore)) + '점'
        })
      ])
    );

    /* 문항별 정오표 (색에 기대지 않도록 기호와 글자를 함께 쓴다) */
    body.appendChild(ui.sectionTitle('정오', '문항별 결과'));
    body.appendChild(
      ui.dataTable({
        head: ['문항', '평가 내용', '결과', '배점', '보충 화면'],
        caption: '문항별 결과',
        rows: result.details.map(function (d) {
          var q = QUIZ.byId(d.id);
          return [
            q.id + '번',
            q.short,
            d.state === 'correct'
              ? '○ 정답'
              : d.state === 'partial'
              ? '◐ 부분 정답 (' + d.matchedElements + ' / ' + d.totalElements + '개 요소)'
              : d.state === 'wrong'
              ? '✕ 오답'
              : '− 미응답',
            QUIZ.formatScore(d.points) + ' / ' + QUIZ.formatScore(q.points),
            '화면 ' + (q.reviewSteps || [q.reviewStep]).join(' · ')
          ];
        })
      })
    );

    /* 오답 복습 바로가기 */
    var wrong = result.details.filter(function (d) {
      return d.state !== 'correct';
    });
    if (wrong.length) {
      var steps = [];
      wrong.forEach(function (d) {
        var q = QUIZ.byId(d.id);
        (q.reviewSteps || [q.reviewStep]).forEach(function (n) {
          if (steps.indexOf(n) === -1) steps.push(n);
        });
      });
      steps.sort(function (a, b) {
        return a - b;
      });
      body.appendChild(
        el('div', { 'class': 'review-links' }, [
          el('p', {
            'class': 'review-links__title',
            text: '헷갈린 개념을 다시 보고 오면 좋아요. 아래 버튼으로 바로 이동할 수 있어요.'
          }),
          ui.buttonRow(
            steps.map(function (n) {
              return ui.button({
                label: n + '단계 · ' + C.STEP_SHORTS[n] + ' 다시 보기',
                variant: 'secondary',
                ariaLabel: n + '단계 화면으로 이동해 복습하기',
                onClick: function () {
                  L.nav.goToStep(n, { force: true });
                }
              });
            })
          )
        ])
      );
    }

    /* 문항별 해설 아코디언 */
    body.appendChild(ui.sectionTitle('해설', '문항별 정답과 해설'));
    var accordion = el('div', { 'class': 'accordion' });
    result.details.forEach(function (d) {
      var q = QUIZ.byId(d.id);
      var ok = d.state === 'correct';
      var myText = QUIZ.answerToText(q, d.answer);
      var toHtml = function (text) {
        return ui.escapeHtml(text).replace(/\n/g, '<br />');
      };
      var rows = [
        ['내 답', myText ? toHtml(myText) : '<span class="is-muted">응답하지 않음</span>'],
        ['정답', toHtml(QUIZ.correctToText(q))],
        ['해설', q.explain]
      ];
      if (q.type === 'code' && d.matchedElements !== null) {
        rows.push([
          '충족한 요소',
          d.totalElements + '개 중 ' + d.matchedElements + '개 → ' + QUIZ.formatScore(d.points) + '점'
        ]);
        rows.push([
          '부분 점수 기준',
          QUIZ.partialTable(q)
            .map(function (row) {
              return ui.escapeHtml(row[0] + ' → ' + row[1]);
            })
            .join('<br />')
        ]);
      }
      var stateLabel =
        ok ? '정답' : d.state === 'partial' ? '부분 정답' : d.state === 'wrong' ? '오답' : '미응답';
      accordion.appendChild(
        accordionItem({
          open: !ok,
          mark: ok ? '○' : d.state === 'partial' ? '◐' : d.state === 'wrong' ? '✕' : '−',
          markClass: ok
            ? 'is-correct'
            : d.state === 'partial'
            ? 'is-partial'
            : d.state === 'wrong'
            ? 'is-wrong'
            : '',
          title:
            '문항 ' + q.id + ' · ' + q.title + ' — ' + stateLabel +
            ' (' + QUIZ.formatScore(d.points) + ' / ' + QUIZ.formatScore(q.points) + '점)',
          rows: rows,
          extra: ok
            ? null
            : ui.buttonRow(
                (q.reviewSteps || [q.reviewStep]).map(function (n) {
                  return ui.button({
                    label: '화면 ' + n + ' 다시 보기',
                    variant: 'ghost',
                    ariaLabel: '문항 ' + q.id + ' 복습을 위해 ' + n + '단계로 이동',
                    onClick: function () {
                      L.nav.goToStep(n, { force: true });
                    }
                  });
                })
              )
        })
      );
    });
    body.appendChild(accordion);

    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '🔁 다시 풀기', variant: 'secondary', onClick: retry }),
        ui.button({ label: '⬇ 학습 기록 내려받기', variant: 'ghost', onClick: downloadRecord }),
        ui.button({
          label: '🖨 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
  }

  /* ------------------------------------------------------------------ */
  /* 답안 제출 (명세 11.8 · 13장)                                            */
  /* ------------------------------------------------------------------ */
  function buildPayload() {
    var result = QUIZ.grade(st().answers);
    var answers = QUIZ.QUESTIONS.map(function (q) {
      var picked = st().answers[q.id];
      var d = result.details.filter(function (x) {
        return x.id === q.id;
      })[0];
      var row = {
        questionId: q.id,
        type: q.type === 'choice' ? 'multipleChoice' : 'codeInput',
        answer: q.type === 'code' ? QUIZ.codeLines(picked) : picked ? String(picked) : '',
        isCorrect: d.state === 'correct',
        // 부분 점수를 쓰므로 «받은 점수»를 함께 보낸다(교사용이 다시 계산하되 비교에 쓴다).
        points: d.points,
        category: q.category
      };
      if (q.type === 'code') {
        row.matchedElements = d.matchedElements;
        row.totalElements = d.totalElements;
      }
      return row;
    });
    return {
      lesson: C.LESSON_ID,
      lessonTitle: C.LESSON_TITLE,
      studentId: st().student.id || '',
      name: st().student.name || '',
      project: projectSummary(),
      answers: answers,
      totalScore: result.score,
      maxScore: result.maxScore,
      passed: result.passed,
      attempts: (st().attempts || 0) + (st().graded ? 0 : 1)
    };
  }

  /** 제출 전 「무엇이 전송되는지」 확인 모달 (명세 11.8 · 22장) */
  function openSubmitDialog() {
    if (st().submitted) {
      ui.toast('답안은 한 번만 제출할 수 있어요. 이미 제출을 마쳤습니다.');
      return;
    }
    if (L.state.answeredCount() !== QUIZ.QUESTIONS.length) {
      ui.toast('5문항에 모두 답한 뒤 제출할 수 있어요.');
      return;
    }
    var problem = validStudent();
    if (problem) {
      ui.clear(refs.submitNotice);
      refs.submitNotice.hidden = false;
      refs.submitNotice.className = 'submit-notice is-blocked';
      refs.submitNotice.appendChild(
        el('p', {
          html:
            '! <strong>' + ui.escapeHtml(problem) + '</strong><br />' +
            '제출에는 <strong>학번과 이름</strong>이 필요해요. 위쪽 <strong>응시자 정보</strong> 칸을 채운 뒤 다시 눌러 주세요. ' +
            '(학습과 채점은 학번·이름 없이도 할 수 있어요)'
        })
      );
      refs.feedback.show('warning', '! ' + problem + ' 위쪽 <strong>응시자 정보</strong>를 채워 주세요.');
      ui.toast(problem);
      ui.scrollToNode(refs.studentCard);
      if (refs.idField) refs.idField.input.focus();
      ui.announce(problem);
      return;
    }

    var payload = buildPayload();
    var endpoint = L.state.readEndpoint();

    var urlInput = el('input', {
      type: 'url',
      'class': 'endpoint-modal__input',
      value: endpoint,
      placeholder: 'https://script.google.com/macros/s/…/exec',
      attrs: { 'aria-label': '선생님이 알려 준 제출 주소' }
    });
    var errorLine = el('p', { 'class': 'endpoint-modal__error' });

    var dialog = el('dialog', { 'class': 'modal endpoint-modal' });
    var busy = false;

    function close() {
      if (dialog.open) dialog.close();
      if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
    }

    var btnKeepGrading = ui.button({
      label: '채점 계속하기',
      variant: 'secondary',
      onClick: function () {
        gradeUnlocked = true;
        close();
        updateQuizNote();
        refs.feedback.show(
          'info',
          '제출은 하지 못했지만 <strong>채점을 계속할 수 있어요.</strong> 나중에 다시 제출할 수 있습니다.'
        );
        ui.scrollToNode(refs.quizPanel);
      }
    });
    btnKeepGrading.hidden = true;

    var btnSend = ui.button({
      label: '보내기',
      onClick: function () {
        if (busy) return;
        var url = String(urlInput.value || '').trim();
        if (!/^https?:\/\//i.test(url)) {
          errorLine.textContent = '제출 주소를 확인해 주세요. https:// 로 시작하는 주소가 필요해요.';
          return;
        }
        busy = true;
        btnSend.disabled = true;
        errorLine.textContent = '보내는 중이에요…';
        L.state.saveEndpoint(url);
        refs.console.write('답안과 프로젝트를 보내는 중… (' + url.replace(/^https?:\/\//, '').split('/')[0] + ')');
        send(url, payload)
          .then(function () {
            st().submitted = true;
            st().submitLocked = true;
            st().submitInfo = { at: new Date().toLocaleString('ko-KR'), mode: 'online', fileName: '' };
            L.state.markChanged();
            close();
            refs.console.write('제출 완료 (' + st().submitInfo.at + ') · 답안을 잠갔어요.');
            refs.feedback.show(
              'success',
              '제출을 마쳤어요. 이어서 <strong>[채점하기]</strong> 를 눌러 결과를 확인해 보세요.',
              '📨'
            );
            ui.toast('제출을 마쳤어요. 이제 채점할 수 있어요.');
            renderQuestion();
            ui.announce('제출을 마쳤습니다. 채점하기 버튼을 사용할 수 있습니다.');
          })
          .catch(function (err) {
            busy = false;
            btnSend.disabled = false;
            var message = err && err.message ? err.message : '연결 실패';
            errorLine.textContent =
              '보내지 못했어요 (' + message + '). [답안 파일로 저장] 으로 파일을 만들어 선생님께 제출해도 되고, ' +
              '[채점 계속하기] 로 채점만 먼저 할 수도 있어요.';
            btnKeepGrading.hidden = false;
            refs.console.writeError('제출 실패 : ' + message);
            refs.feedback.show(
              'warning',
              '제출에 실패했어요. <strong>[답안 파일로 저장]</strong> 으로 파일을 만들어 제출하거나, ' +
                '<strong>[채점 계속하기]</strong> 로 채점만 먼저 할 수 있어요.'
            );
          });
      }
    });

    var proj = payload.project;
    dialog.appendChild(
      el('div', { 'class': 'modal__body' }, [
        el('h2', { 'class': 'modal__title', text: '이 내용을 선생님께 보냅니다' }),
        el('div', { 'class': 'modal__text' }, [
          el('p', {
            html:
              '<strong>학번</strong> ' + ui.escapeHtml(payload.studentId) +
              ' · <strong>이름</strong> ' + ui.escapeHtml(payload.name)
          }),
          el('p', {
            text:
              '형성평가 ' + QUIZ.QUESTIONS.length + '문항의 답과 총점(' +
              QUIZ.formatScore(payload.totalScore) + ' / ' + payload.maxScore + ')'
          }),
          el('p', {
            text:
              '프로젝트 요약 — 클래스 ' + proj.className + ' · 객체 ' + proj.instances.length +
              '개 · 확장 ' + proj.extensions.length + '개 · 자동 확인 ' + proj.checksPassed + ' / ' +
              proj.checksTotal + ' · 설명 5항목'
          }),
          el('p', {
            'class': 'endpoint-modal__notice',
            html: '⚠ <strong>답안은 한 번만 제출할 수 있어요.</strong> 보내고 나면 답을 고칠 수 없습니다.'
          }),
          el('p', { 'class': 'meta-count', text: '[취소] 를 누르면 아무것도 전송하지 않습니다.' })
        ]),
        urlInput,
        errorLine,
        el('div', { 'class': 'modal__actions' }, [
          ui.button({ label: '취소', variant: 'ghost', onClick: close }),
          ui.button({ label: '답안 파일로 저장', variant: 'secondary', onClick: downloadAnswers }),
          btnKeepGrading,
          btnSend
        ])
      ])
    );
    dialog.addEventListener('cancel', function (e) {
      e.preventDefault();
      close();
    });
    document.body.appendChild(dialog);
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
  }

  /** Apps Script 로 보낸다. 미리 검사 요청(preflight)이 생기지 않도록 text/plain 으로 보낸다. */
  function send(url, payload) {
    if (typeof window.fetch !== 'function') {
      return Promise.reject(new Error('이 브라우저에서는 전송을 지원하지 않아요'));
    }
    return window
      .fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(function (res) {
        if (!res.ok) throw new Error('서버 응답 ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var data = null;
        try {
          data = JSON.parse(text);
        } catch (err) {
          data = null;
        }
        if (data && data.ok === false) throw new Error(data.message || '서버가 거절했어요');
        if (data && data.lesson && data.lesson !== C.LESSON_ID) {
          throw new Error('응답은 왔지만 이 차시의 답안 수집 주소가 아닌 것 같아요');
        }
        return data;
      });
  }

  function saveFile(name, text) {
    try {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: name });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (err) {
      ui.toast('파일을 만들지 못했어요.');
      return false;
    }
  }

  function downloadAnswers() {
    var payload = buildPayload();
    var name = (payload.studentId || '학번없음') + '_' + (payload.name || '이름없음') + '.json';
    if (saveFile(name, JSON.stringify(payload, null, 2))) {
      st().submitInfo = { at: new Date().toLocaleString('ko-KR'), mode: 'file', fileName: name };
      L.state.markChanged();
      gradeUnlocked = true;
      updateQuizNote();
      refs.console.write(name + ' 파일로 저장했어요. 채점을 계속할 수 있어요.');
      ui.toast(name + ' 파일을 저장했어요. 이제 채점할 수 있어요.');
    }
  }

  /** 명세 12.3 : 학습 기록 내려받기 (채점 전에는 정답·해설을 넣지 않는다) */
  function downloadRecord() {
    var lines = [];
    var graded = st().graded;
    var all = L.state.appState;
    var result = L.state.projectResult();
    var summary = projectSummary();

    lines.push(C.LESSON_TITLE + ' — 학습 기록');
    lines.push(C.LESSON_SUBTITLE + ' (' + C.UNIT_TITLE + ' ' + C.LESSON_NO + ')');
    lines.push('');
    lines.push('[1] 응시자 정보');
    lines.push('  학번 : ' + (st().student.id || '(입력하지 않음)'));
    lines.push('  이름 : ' + (st().student.name || '(입력하지 않음)'));
    lines.push('');
    lines.push('[2] 프로젝트 설계');
    lines.push('  선수 학습 2문항 : ' + (all.step1.preOk ? '모두 정답' : '아직'));
    lines.push('  속성·기능 분류 : ' + (all.step2.sortDone ? '정답' : '아직'));
    lines.push('  객체 지향 네 특징 : ' + (all.step2.conceptDone ? '네 카드 확인' : '아직'));
    lines.push('  설계 확인 질문 : ' + (all.step2.reasonDone ? '정답' : '아직'));
    lines.push('  확장 예비 선택 : ' + ((all.step2.plan || []).join(', ') || '없음'));
    lines.push('');
    lines.push('[3] 기본 클래스와 두 인스턴스');
    lines.push('  코드 조립 4구역 : ' + (all.step3.zonesDone ? '정답 (기본 클래스 완성)' : '아직'));
    lines.push('  객체 생성·변경 실행 : ' + (all.step4.instDone ? '끝까지 실행' : '아직'));
    lines.push('  출력 순서 배열 : ' + (all.step4.orderDone ? '정답' : '아직'));
    lines.push('  self 흐름 : ' + ((all.step4.selfSeen || []).join(', ') || '아직'));
    lines.push('  객체 독립성 실험 : ' + (all.step4.indepDone ? '실행함' : '아직'));
    lines.push('  결과 설명 빈칸 : ' + (all.step4.sentence || '미작성') + (all.step4.sentenceOk ? ' (정답)' : ''));
    lines.push('');
    lines.push('[4] 나만의 프로그램 (확장)');
    lines.push('  클래스 : ' + summary.className);
    lines.push('  기본 속성 : ' + summary.baseProperties.join(', '));
    lines.push('  기본 메소드 : ' + summary.baseMethods.join(', '));
    lines.push('  추가한 속성 : ' + (summary.newProperties.join(', ') || '없음'));
    lines.push('  추가한 메소드·조건 : ' + (summary.newMethods.join(', ') || '없음'));
    lines.push('  확장 항목 : ' + (summary.extensions.join(', ') || '없음'));
    lines.push('  자동 확인 : ' + result.total + '개 중 ' + result.passed + '개 충족');
    result.checks.forEach(function (check) {
      lines.push('    ' + (check.ok ? '○' : '✕') + ' ' + check.label + (check.ok ? '' : ' → ' + check.where));
    });
    lines.push('  객체별 속성값');
    PET.valueTable(all.step5.project).forEach(function (row) {
      lines.push('    ' + row[0] + ' : pet1 = ' + row[1] + ' / pet2 = ' + row[2]);
    });
    lines.push('  호출한 메소드');
    ['pet1', 'pet2'].forEach(function (name) {
      lines.push('    ' + name + ' : ' + ((all.step5.project.calls[name] || []).join(', ') || '없음'));
    });
    lines.push('  실행 결과');
    var run = PET.runProject(all.step5.project);
    if (!run.output.length) lines.push('    (호출한 메소드가 없습니다)');
    run.output.forEach(function (line) {
      lines.push('    ' + line);
    });
    lines.push('  완성 코드');
    summary.code.forEach(function (line) {
      lines.push('    ' + line);
    });
    lines.push('');
    lines.push('[5] 코드 설명 5항목');
    result.explanation.items.forEach(function (item) {
      lines.push('  ' + item.no + '. ' + item.prompt);
      lines.push('     ' + (item.text || '(미작성)'));
    });
    lines.push('');
    lines.push('[6] 형성평가');
    if (graded) {
      lines.push('  총점 : ' + QUIZ.formatScore(st().score) + ' / ' + QUIZ.MAX_SCORE);
      lines.push('  판정 : ' + QUIZ.passLabel(st().score) + ' (6점 이상 이수)');
      lines.push(
        '  최고 점수 : ' + QUIZ.formatScore(st().bestScore) + '점 · 도전 횟수 : ' + st().attempts + '회'
      );
    } else {
      lines.push('  아직 채점하지 않았어요. (채점 전에는 정답과 해설을 기록하지 않습니다)');
    }
    QUIZ.QUESTIONS.forEach(function (q, i) {
      var given = st().answers[q.id];
      var answered = QUIZ.isAnswered(q, given);
      var earned = QUIZ.scoreAnswer(q, given);
      var mark = !answered
        ? '미응답'
        : QUIZ.gradeAnswer(q, given)
        ? '정답'
        : earned > 0
        ? '부분 정답'
        : '오답';
      lines.push(
        '  ' + (i + 1) + '. ' + q.title + ' [' + q.category + '] → ' +
          (answered ? QUIZ.answerToText(q, given).replace(/\n/g, ' / ') : '응답하지 않음') +
          (graded ? '  [' + mark + ' ' + QUIZ.formatScore(earned) + '점]' : '')
      );
    });
    lines.push('');
    lines.push('[7] 학습 정리 문장');
    WRAP_UP.forEach(function (w, i) {
      lines.push('  ' + (i + 1) + '. ' + w.before + '(' + (st().wrapUp[w.key] || '미작성') + ')' + w.after);
    });
    lines.push('');
    lines.push('[8] 제출 상태');
    lines.push(
      '  ' +
        (st().submitted
          ? '제출 완료 (' + st().submitInfo.at + ')'
          : st().submitInfo.fileName
          ? '파일로 저장함 (' + st().submitInfo.fileName + ')'
          : '아직 제출하지 않음')
    );

    // 엑셀·메모장에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다.
    if (saveFile('lesson3_8_3_학습기록.txt', '﻿' + lines.join('\r\n'))) {
      refs.console.write('학습 기록 파일을 저장했어요.');
    }
  }

  /* ------------------------------------------------------------------ */
  /* ④ 학습 정리 (명세 11.9)                                                 */
  /* ------------------------------------------------------------------ */
  function buildSummary(body) {
    body.appendChild(ui.sectionTitle('①', '문장을 완성해 보세요'));
    refs.wrapInputs = {};
    WRAP_UP.forEach(function (w, i) {
      var input = el('input', {
        type: 'text',
        'class': 'fillline__input',
        id: 'step6-wrap-' + w.key,
        value: st().wrapUp[w.key] || '',
        maxLength: 20,
        attrs: { 'aria-label': i + 1 + '번 문장의 빈칸', autocomplete: 'off' }
      });
      input.addEventListener(
        'input',
        ui.debounce(function () {
          st().wrapUp[w.key] = input.value;
          L.state.markChanged();
        }, 300)
      );
      refs.wrapInputs[w.key] = input;
      body.appendChild(
        el('div', { 'class': 'fillline' }, [
          el('span', { 'class': 'fillline__text' }, [
            el('span', { text: i + 1 + '. ' + w.before }),
            input,
            el('span', { text: w.after })
          ])
        ])
      );
    });
    refs.wrapFeedback = ui.createFeedback({ emptyText: '세 문장을 채운 뒤 확인해 보세요.' });
    body.appendChild(
      ui.buttonRow([
        ui.button({
          label: '정리 확인하기',
          variant: 'secondary',
          onClick: function () {
            var wrong = WRAP_UP.filter(function (w) {
              var value = String(st().wrapUp[w.key] || '').replace(/\s/g, '');
              return w.accepted.every(function (ok) {
                return ok.replace(/\s/g, '') !== value;
              });
            });
            if (!wrong.length) {
              refs.wrapFeedback.show(
                'success',
                '세 문장을 모두 바르게 완성했어요. 오늘 배운 내용을 잘 정리했습니다.',
                '🎉'
              );
            } else {
              refs.wrapFeedback.show(
                'info',
                '다시 볼 문장이 ' + wrong.length + '개 있어요. 아래 <strong>핵심어</strong> 목록에서 알맞은 낱말을 찾아보세요.'
              );
            }
          }
        })
      ])
    );
    body.appendChild(refs.wrapFeedback.root);

    body.appendChild(ui.sectionTitle('②', '오늘의 핵심어'));
    body.appendChild(
      el(
        'div',
        { 'class': 'concept-grid' },
        KEYWORDS.map(function (k) {
          return el('div', { 'class': 'concept-card' }, [
            el('span', { 'class': 'concept-card__key', text: k[0] }),
            el('span', { 'class': 'concept-card__desc', text: k[1] })
          ]);
        })
      )
    );

    body.appendChild(ui.sectionTitle('③', '핵심 문법 카드'));
    var cards = ui.split({});
    cards.left.appendChild(
      L.codeview.createCodeView({
        title: '클래스와 조건 분기',
        showLineNumbers: false,
        ariaLabel: '클래스와 조건 분기 문법',
        lines: [
          { code: 'class Pet:', note: '클래스 선언' },
          { code: '    name = "펫"', note: '클래스 속성' },
          { code: '    def sound(self):', note: '메소드 정의' },
          { code: '        if self.animal == "강아지":', note: '조건 검사' },
          { code: '            print("멍멍")', note: '한 단계 더 들여쓰기' }
        ]
      }).root
    );
    cards.right.appendChild(
      L.codeview.createCodeView({
        title: '두 인스턴스와 호출',
        showLineNumbers: false,
        ariaLabel: '두 인스턴스 생성과 호출 문법',
        lines: [
          { code: 'pet1 = Pet()', note: '인스턴스 생성' },
          { code: 'pet1.name = "초코"', note: '객체별 속성값' },
          { code: 'pet2 = Pet()' },
          { code: 'pet2.name = "구름"' },
          { code: 'pet1.introduce()', note: 'self = pet1' },
          { code: 'pet2.introduce()', note: 'self = pet2' }
        ]
      }).root
    );
    body.appendChild(cards.root);
  }

  /* ------------------------------------------------------------------ */
  /* ⑤ 마무리                                                              */
  /* ------------------------------------------------------------------ */
  function buildClosing(body) {
    body.appendChild(
      el('div', { 'class': 'next-lesson' }, [
        el('p', { 'class': 'next-lesson__label', text: '다음 차시 예고' }),
        el('p', { text: NEXT_LESSON })
      ])
    );
    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '⬇ 학습 기록 내려받기', variant: 'secondary', onClick: downloadRecord }),
        ui.button({
          label: '🖨 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
  }

  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 6,
        title: C.STEP_TITLES[6],
        lead: [
          '오늘 만든 프로그램을 <strong>5문항</strong>으로 확인합니다. 문항은 <strong>한 번에 하나씩</strong> 나와요.',
          '각 문항 2점 · 총 <strong>10점 만점</strong>이며 <strong>6점 이상이면 이수</strong>입니다.',
          '<strong>5문항에 모두 답하기 전에는 정답과 해설을 공개하지 않아요.</strong> ' +
            '채점이 끝나면 문항별 해설이 이어서 나타납니다.'
        ]
      })
    );

    /* ---------------- ① 형성평가 ---------------- */
    var layout = ui.split({ className: 'split--wide-left' });
    var quiz = ui.panel({
      title: '① 형성평가 (5문항 · 10점)',
      hint:
        '문항을 읽고 답한 뒤 <strong>다음 문항</strong>으로 이동해요. ' +
        '<strong>이전 문항</strong>으로 돌아가 답을 고칠 수 있고, 위쪽 점을 눌러 바로 이동할 수도 있어요.',
      className: 'quiz'
    });
    refs.quizPanel = quiz.root;

    buildStudentCard(quiz.body);

    refs.quizCounter = el('span', {
      'class': 'quiz__counter',
      text: '문항 1 / ' + QUIZ.QUESTIONS.length
    });
    refs.quizDots = el('div', {
      'class': 'quiz__dots',
      attrs: { role: 'group', 'aria-label': '형성평가 문항 이동' }
    });
    quiz.body.appendChild(el('div', { 'class': 'quiz__meta' }, [refs.quizCounter, refs.quizDots]));

    refs.quizBody = el('div', { 'class': 'stack' });
    quiz.body.appendChild(refs.quizBody);

    refs.btnPrevQ = ui.button({
      label: '← 이전 문항',
      variant: 'secondary',
      ariaLabel: '이전 문항 보기',
      onClick: function () {
        if (st().index > 0) {
          st().index -= 1;
          L.state.markChanged();
          renderQuestion();
        }
      }
    });
    refs.btnNextQ = ui.button({
      label: '다음 문항 →',
      variant: 'secondary',
      ariaLabel: '다음 문항 보기',
      onClick: function () {
        if (st().index < QUIZ.QUESTIONS.length - 1) {
          st().index += 1;
          L.state.markChanged();
          renderQuestion();
        }
      }
    });
    refs.btnGrade = ui.button({ label: '채점하기', ariaLabel: '형성평가 채점하기', onClick: grade });
    refs.btnSubmit = C.SUBMIT_ENABLED
      ? ui.button({ label: '답안 · 프로젝트 제출하기', onClick: openSubmitDialog })
      : null;
    quiz.body.appendChild(ui.buttonRow([refs.btnPrevQ, refs.btnNextQ, refs.btnGrade, refs.btnSubmit]));

    refs.quizNote = el('p', { 'class': 'quiz__note', attrs: { 'aria-live': 'polite' } });
    quiz.body.appendChild(refs.quizNote);
    refs.submitNotice = el('div', { 'class': 'submit-notice', attrs: { role: 'status' } });
    quiz.body.appendChild(refs.submitNotice);
    layout.left.appendChild(quiz.root);

    refs.console = ui.createConsole({
      title: '채점·제출 진행 상황',
      emptyText: '5문항에 모두 답한 뒤 [채점하기] 를 누르면 채점 과정이 여기에 표시돼요.',
      ariaLabel: '형성평가 채점 및 답안 제출 진행 상황'
    });
    refs.feedback = ui.createFeedback({ emptyText: '문항에 답하면 이곳에 안내가 표시돼요.' });
    layout.right.appendChild(refs.console.root);
    layout.right.appendChild(refs.feedback.root);
    root.appendChild(layout.root);

    /* ---------------- ② 채점 결과 및 해설 ---------------- */
    var result = ui.panel({ title: '② 채점 결과 및 해설', className: 'step6-result' });
    refs.resultSection = result.root;
    refs.resultBody = result.body;
    refs.resultSection.hidden = true;
    root.appendChild(refs.resultSection);

    /* ---------------- ③ 프로젝트 요약 ---------------- */
    var proj = ui.panel({
      title: '③ 프로젝트 요약',
      hint: '제출할 때 함께 전송되는 내용입니다. 자동 확인 결과는 <strong>참고 자료</strong>이며 등급이 아닙니다.',
      className: 'step6-project'
    });
    refs.projectBody = proj.body;
    root.appendChild(proj.root);

    /* ---------------- ④ 학습 정리 ---------------- */
    var summary = ui.panel({ title: '④ 학습 정리', className: 'step6-summary' });
    buildSummary(summary.body);
    root.appendChild(summary.root);

    /* ---------------- ⑤ 마무리 ---------------- */
    var closing = ui.panel({ title: '⑤ 마무리', className: 'step6-closing' });
    buildClosing(closing.body);
    root.appendChild(closing.root);

    renderQuestion();
    renderProjectSummary();
  }

  L.registerStep(6, {
    title: C.STEP_TITLES[6],
    short: C.STEP_SHORTS[6],
    render: render,
    onEnter: function () {
      if (refs.idField) refs.idField.input.value = st().student.id || '';
      if (refs.nameField) refs.nameField.input.value = st().student.name || '';
      if (refs.wrapInputs) {
        WRAP_UP.forEach(function (w) {
          refs.wrapInputs[w.key].value = st().wrapUp[w.key] || '';
        });
      }
      updateStudentUI();
      renderQuestion();
      renderProjectSummary();
      if (st().graded) {
        renderResult(QUIZ.grade(st().answers));
        applySections(true);
      } else {
        applySections(false);
      }
    }
  });
})();
    </script>
    <script data-from="js/90-app.js">
/**
 * 앱 부팅 (명세 5장 단계 구성 / 12장 상태 복원 / 21장 접근성)
 *  - 상단 스테퍼 생성·갱신, 진행률 바
 *  - 모바일에서는 «번호 + 현재 단계명» 만 간결하게 보여 준다(명세 5장)
 *  - 하단 [이전] / [다음] 버튼, 이동 조건 미충족 안내
 *  - 상단 메뉴로는 조건과 관계없이 자유 이동(교사 시연용, 명세 5장)
 *  - 저장된 진행 복원 확인 대화상자
 *  - 주소창 해시(#step3) 동기화
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var TOTAL = L.CONST.TOTAL_STEPS;

  var refs = {
    main: null,
    stepperList: null,
    progressCurrent: null,
    progressBar: null,
    progressFill: null,
    btnPrev: null,
    btnNext: null,
    navHint: null,
    nav: null,
    now: null
  };

  var sections = {};
  var hashLock = false;

  /* ------------------------------------------------------------------ */
  /* 화면 골격 확보                                                       */
  /* ------------------------------------------------------------------ */
  /**
   * index.html 에 골격이 이미 있으면 그대로 쓰고, 없으면 여기서 만든다.
   * (index.html 이 아주 단순해도 앱이 뜨도록 하기 위한 안전장치)
   */
  function ensureShell() {
    if (!document.getElementById('app-main')) {
      var stepperList = el('ol', { 'class': 'stepper__list', id: 'stepper-list' });
      var progressFill = el('div', { 'class': 'progressbar__fill', id: 'progressbar-fill' });
      var app = el('div', { 'class': 'app' }, [
        el('header', { 'class': 'app-progress', id: 'app-progress' }, [
          el('div', { 'class': 'app-progress__inner' }, [
            el(
              'nav',
              { 'class': 'stepper', id: 'stepper', attrs: { 'aria-label': '학습 단계 이동' } },
              [stepperList]
            ),
            el('div', { 'class': 'app-progress__meter' }, [
              el('p', { 'class': 'app-progress__count' }, [
                el('span', { id: 'progress-current', text: '1' }),
                el('span', { 'class': 'app-progress__count-sep', text: ' / ' }),
                el('span', { text: String(TOTAL) })
              ]),
              el(
                'div',
                {
                  'class': 'progressbar',
                  id: 'progressbar',
                  attrs: {
                    role: 'progressbar',
                    'aria-label': '학습 진행률',
                    'aria-valuemin': '0',
                    'aria-valuemax': '100',
                    'aria-valuenow': '0'
                  }
                },
                [progressFill]
              )
            ])
          ]),
          el('p', { 'class': 'app-progress__now', id: 'progress-now' })
        ]),
        el('main', { 'class': 'app-main', id: 'app-main' }),
        el('footer', { 'class': 'app-nav', id: 'app-nav' }, [
          el('div', { 'class': 'app-nav__inner' }, [
            el('button', {
              type: 'button',
              'class': 'btn btn--secondary',
              id: 'btn-prev',
              text: '← 이전'
            }),
            el('p', { 'class': 'app-nav__hint', id: 'nav-hint', attrs: { 'aria-live': 'polite' } }),
            el('button', { type: 'button', 'class': 'btn btn--primary', id: 'btn-next', text: '다음 →' })
          ])
        ])
      ]);
      document.body.appendChild(app);
    }

    if (!document.getElementById('toast-region')) {
      document.body.appendChild(
        el('div', {
          'class': 'toast-region',
          id: 'toast-region',
          attrs: { 'aria-live': 'polite', 'aria-atomic': 'true' }
        })
      );
    }
    if (!document.getElementById('sr-live')) {
      document.body.appendChild(
        el('div', {
          'class': 'sr-only',
          id: 'sr-live',
          attrs: { role: 'status', 'aria-live': 'polite' }
        })
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 화면 · 스테퍼 만들기                                             */
  /* ------------------------------------------------------------------ */
  function eachStep(fn) {
    for (var i = 1; i <= TOTAL; i += 1) fn(i, L.steps[i] || null);
  }

  function buildSections() {
    eachStep(function (id, step) {
      var section = el('section', {
        'class': 'step-screen',
        id: 'step-' + id,
        dataset: { step: String(id) },
        attrs: { 'aria-label': id + '단계 ' + (step ? step.title : ''), tabindex: '-1' }
      });
      refs.main.appendChild(section);
      sections[id] = section;

      if (!step) {
        section.appendChild(el('p', { text: id + '단계가 아직 등록되지 않았어요.' }));
        return;
      }
      try {
        step.render(section);
        step.rendered = true;
      } catch (err) {
        if (window.console) console.error('[app] ' + id + '단계 화면을 만들지 못했습니다.', err);
        section.appendChild(el('p', { text: id + '단계 화면을 불러오지 못했어요.' }));
      }
    });
  }

  function buildStepper() {
    ui.clear(refs.stepperList);
    eachStep(function (id, step) {
      var title = step ? step.title : id + '단계';
      var node = el('button', {
        type: 'button',
        'class': 'stepper__node',
        text: String(id),
        attrs: { 'aria-label': id + '단계 ' + title + '로 이동' },
        on: {
          click: function () {
            // 명세 5장 : 교사의 시연을 위해 상단 메뉴에서는 자유롭게 이동할 수 있다.
            goToStep(id, { force: true });
          }
        }
      });
      refs.stepperList.appendChild(
        el('li', { 'class': 'stepper__item', dataset: { step: String(id) } }, [
          node,
          el('span', { 'class': 'stepper__label' }, [
            el('span', { text: step ? step.short : String(id) }),
            // 명세 5장 : 완료한 단계는 「✓ 완료」로 표시한다(좁은 화면에서는 스테퍼 번호의 ✔ 로만 보인다).
            el('span', { 'class': 'stepper__done', text: '✓ 완료' })
          ])
        ])
      );
    });
  }

  /* ------------------------------------------------------------------ */
  /* 진행 상태 · 이동 버튼 갱신                                            */
  /* ------------------------------------------------------------------ */
  function updateChrome() {
    var current = L.state.appState.currentStep;

    Array.prototype.slice.call(refs.stepperList.children).forEach(function (item) {
      var step = Number(item.dataset.step);
      var visited = L.state.isVisited(step);
      item.classList.toggle('is-current', step === current);
      item.classList.toggle('is-done', visited && step !== current);
      item.classList.toggle('is-locked', !visited);
      var node = item.querySelector('.stepper__node');
      var done = visited && step !== current;
      node.textContent = done ? '✔' : String(step);
      node.setAttribute('aria-current', step === current ? 'step' : 'false');
      node.setAttribute(
        'aria-label',
        step + '단계 ' + L.CONST.STEP_TITLES[step] + (done ? ' (완료)' : '') + '로 이동'
      );
    });

    refs.progressCurrent.textContent = String(current);
    if (refs.now) {
      refs.now.textContent = current + '단계 · ' + L.CONST.STEP_TITLES[current];
    }
    var percent = Math.round(((current - 1) / (TOTAL - 1)) * 100);
    refs.progressFill.style.width = percent + '%';
    refs.progressBar.setAttribute('aria-valuenow', String(percent));
    refs.progressBar.setAttribute(
      'aria-valuetext',
      TOTAL + '단계 중 ' + current + '단계, ' + percent + '%'
    );

    refs.btnPrev.disabled = current === 1;
    refs.nav.classList.toggle('app-nav--start', current === 1);

    var last = current === TOTAL;
    refs.btnNext.textContent = last ? '학습 마치기' : '다음 →';

    var ok = L.state.canProceed(current);
    refs.btnNext.disabled = !ok;
    refs.btnNext.title = ok ? '' : L.state.blockedMessage(current);

    if (ok) {
      refs.navHint.textContent = '';
    } else {
      var left = L.state.remainingHint(current);
      refs.navHint.textContent = left.length
        ? L.state.blockedMessage(current) + ' (남은 활동: ' + left.join(', ') + ')'
        : L.state.blockedMessage(current);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function showStep(step) {
    Object.keys(sections).forEach(function (key) {
      sections[key].classList.toggle('is-active', Number(key) === step);
    });
  }

  function syncHash(step) {
    hashLock = true;
    try {
      if (window.location.hash !== '#step' + step) window.location.hash = 'step' + step;
    } catch (err) {
      /* file:// 등에서 실패해도 학습에는 지장이 없다. */
    }
    setTimeout(function () {
      hashLock = false;
    }, 0);
  }

  /**
   * 단계 이동.
   * options.force  = true 면 이동 조건을 무시한다(상단 메뉴 · 오답 복습 바로가기).
   * options.silent = true 면 막혔을 때 안내를 띄우지 않는다.
   */
  function goToStep(target, options) {
    var o = options || {};
    var current = L.state.appState.currentStep;
    var next = L.state.clampStep(target);

    // 같은 단계로의 이동이라도 화면은 다시 맞춰 준다.
    if (next === current) {
      showStep(next);
      var same = L.steps[next];
      if (same && typeof same.onEnter === 'function') {
        try {
          same.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      return;
    }

    // 앞으로 이동할 때만 이동 조건을 확인한다(되돌아가는 것은 언제나 자유).
    if (!o.force && next > current && !L.state.canProceed(current)) {
      var message = L.state.blockedMessage(current);
      if (!o.silent && message) {
        ui.toast(message);
        ui.announce(message);
      }
      return;
    }

    var from = L.steps[current];
    if (from && typeof from.onLeave === 'function') {
      try {
        from.onLeave();
      } catch (err) {
        if (window.console) console.error('[app] onLeave 오류', err);
      }
    }

    L.state.visitStep(next);
    showStep(next);

    var to = L.steps[next];
    if (to && typeof to.onEnter === 'function') {
      try {
        to.onEnter();
      } catch (err) {
        if (window.console) console.error('[app] onEnter 오류', err);
      }
    }

    updateChrome();
    syncHash(next);

    var section = sections[next];
    if (section && typeof section.focus === 'function') section.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    ui.announce(next + '단계 ' + (to ? to.title : '') + ' 화면으로 이동했습니다.');
  }

  function finishLearning() {
    var result = L.state.projectResult();
    return ui.confirmDialog({
      title: '프로젝트를 모두 마쳤어요 🎉',
      message:
        '오늘은 실생활의 반려동물에서 <strong>속성과 기능</strong>을 뽑아 <code>Pet</code> 클래스를 설계하고, ' +
        '<code>sound()</code> 의 조건 분기와 <code>introduce()</code> 를 완성했어요.<br />' +
        '<strong>pet1 · pet2 두 인스턴스</strong>를 만들어 같은 메소드가 <strong>객체별 속성값</strong>에 따라 ' +
        '다른 결과를 내는 것을 확인했고, 자동 확인 <strong>' + result.passed + ' / ' + result.total +
        '</strong> 항목을 채우며 나만의 기능을 더했습니다.<br />' +
        '상단 메뉴를 눌러 오늘 만든 화면을 다시 살펴볼 수 있어요.',
      okLabel: '닫기',
      cancelLabel: '되돌아가기',
      dismissValue: true
    });
  }

  /* ------------------------------------------------------------------ */
  /* 해시 동기화                                                          */
  /* ------------------------------------------------------------------ */
  function stepFromHash() {
    var match = String(window.location.hash || '').match(/^#step(\d+)$/);
    if (!match) return null;
    return L.state.clampStep(Number(match[1]));
  }

  function onHashChange() {
    if (hashLock) return;
    var target = stepFromHash();
    if (target === null) return;
    if (target === L.state.appState.currentStep) return;
    goToStep(target, { force: true });
  }

  /* ------------------------------------------------------------------ */
  /* 부팅                                                                */
  /* ------------------------------------------------------------------ */
  function boot() {
    ensureShell();

    refs.main = document.getElementById('app-main');
    refs.stepperList = document.getElementById('stepper-list');
    refs.progressCurrent = document.getElementById('progress-current');
    refs.progressBar = document.getElementById('progressbar');
    refs.progressFill = document.getElementById('progressbar-fill');
    refs.btnPrev = document.getElementById('btn-prev');
    refs.btnNext = document.getElementById('btn-next');
    refs.navHint = document.getElementById('nav-hint');
    refs.nav = document.getElementById('app-nav');
    refs.now = document.getElementById('progress-now');

    L.nav.setNavigator(goToStep);

    // 저장된 진행 기록이 있으면 이어서 학습할지 확인한다(명세 12장).
    var saved = L.state.readSavedState();
    var restore = Promise.resolve();
    if (L.state.hasMeaningfulProgress(saved)) {
      restore = ui
        .confirmDialog({
          title: '이어서 학습하시겠어요?',
          message:
            '이전에 <strong>' +
            (saved.currentStep || 1) +
            '단계</strong>까지 진행한 기록이 남아 있어요.<br />처음부터 다시 시작하면 이전 기록과 ' +
            '<strong>프로젝트 내용</strong>이 지워집니다.',
          okLabel: '이어서 학습하기',
          cancelLabel: '처음부터 시작',
          // Esc 등으로 그냥 닫으면 기록을 지우지 않고 이어서 학습하는 쪽으로 처리한다.
          dismissValue: true
        })
        .then(function (resume) {
          if (resume) L.state.applySavedState(saved);
          else L.state.resetState();
        });
    } else if (saved) {
      L.state.resetState();
    }

    restore.then(function () {
      buildStepper();
      buildSections();

      refs.btnPrev.addEventListener('click', function () {
        goToStep(L.state.appState.currentStep - 1, { force: true });
      });
      refs.btnNext.addEventListener('click', function () {
        if (L.state.appState.currentStep === TOTAL) {
          if (L.state.canProceed(TOTAL)) finishLearning();
          else ui.toast(L.state.blockedMessage(TOTAL));
          return;
        }
        goToStep(L.state.appState.currentStep + 1);
      });

      // 상태가 바뀌면 이동 가능 여부·진행 표시를 즉시 갱신한다.
      L.state.onChange(function () {
        updateChrome();
      });

      window.addEventListener('hashchange', onHashChange);

      // 첫 화면 : 주소창 해시가 있으면 그 단계, 없으면 복원된 단계
      var start = stepFromHash();
      if (start === null) start = L.state.appState.currentStep;
      L.state.visitStep(start);
      showStep(start);
      var startStep = L.steps[start];
      if (startStep && typeof startStep.onEnter === 'function') {
        try {
          startStep.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      syncHash(start);
    });
  }

  L.app = {
    boot: boot,
    goToStep: goToStep,
    refresh: updateChrome,
    /** 저장된 학습 기록을 지우고 1단계로 되돌린다. */
    resetAll: function () {
      L.state.resetState();
      goToStep(1, { force: true });
      updateChrome();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
