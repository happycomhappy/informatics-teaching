  /**
   * 좁은 화면(768px 미만)에서만 켜지는 구역 탭 (명세 51장)
   *   768px 이상에서는 탭 줄을 숨기고 모든 구역을 한 화면에 나란히 보여 준다.
   *   768px 미만에서는 [코드] [규칙] [출력] 처럼 한 구역씩만 보여 준다.
   *
   * items: Array<{ id, label, node }>
   */
  function mobileTabs(opts) {
    var o = opts || {};
    var items = (o.items || []).filter(function (item) {
      return item && item.node;
    });
    var current = items.length ? items[0].id : null;

    var query =
      typeof window.matchMedia === 'function' ? window.matchMedia('(max-width: 767px)') : null;

    var buttons = items.map(function (item) {
      return el('button', {
        type: 'button',
        'class': 'tab',
        text: item.label,
        dataset: { id: item.id },
        attrs: { role: 'tab', 'aria-selected': String(item.id === current) },
        on: {
          click: function () {
            setActive(item.id);
          }
        }
      });
    });

    var bar = el(
      'div',
      {
        'class': 'tabs mtabs__bar',
        attrs: { role: 'tablist', 'aria-label': o.ariaLabel || '구역 전환' }
      },
      buttons
    );

    var root = el('div', { 'class': 'mtabs' }, [bar].concat(
      items.map(function (item) {
        item.node.classList.add('mtabs__panel');
        item.node.dataset.mtab = item.id;
        return item.node;
      })
    ));

    /* 폭 판단은 «지금 창 너비»로만 한다.
       matchMedia 의 matches 는 환경에 따라 한 박자 늦게 갱신되는 일이 있는데,
       그때 값을 믿으면 넓은 화면인데도 한 구역만 보이는 상태로 굳어 버린다.
       (matchMedia 는 «바뀌었다»는 신호를 받는 용도로만 쓴다) */
    function isMobile() {
      return window.innerWidth < 768;
    }

    // 마지막으로 그린 모드(좁은 화면인가). 폭 경계를 넘었는지 판단하는 데 쓴다.
    var lastMobile = null;

    function paint() {
      var mobile = isMobile();
      lastMobile = mobile;
      bar.style.display = mobile ? '' : 'none';
      items.forEach(function (item) {
        var on = !mobile || item.id === current;
        item.node.classList.toggle('is-mtab-hidden', !on);
      });
      buttons.forEach(function (btn) {
        var on = btn.dataset.id === current;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', String(on));
      });
    }

    function setActive(id) {
      current = id;
      paint();
    }

    // 좌우 화살표로도 이동할 수 있게 한다(명세 52장).
    bar.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var index = items.findIndex(function (item) {
        return item.id === current;
      });
      var next = (index + (e.key === 'ArrowRight' ? 1 : items.length - 1)) % items.length;
      setActive(items[next].id);
      buttons[next].focus();
      e.preventDefault();
    });

    if (query) {
      if (typeof query.addEventListener === 'function') query.addEventListener('change', paint);
      else if (typeof query.addListener === 'function') query.addListener(paint);
    }
    // 창 크기 변경(화면 회전 · 창 조절)에도 반드시 다시 그린다.
    window.addEventListener('resize', debounce(paint, 150));

    /* 위의 두 신호(matchMedia · resize)를 놓치는 환경이 있다. 그러면 화면은 좁아졌는데
       탭 줄이 나오지 않아 세 구역이 그대로 쌓여 버린다. 실제 크기 변화를 보는 관찰자를
       하나 더 두되, «768px 경계를 넘었을 때만» 다시 그려 무한 반복을 막는다. */
    if (typeof window.ResizeObserver === 'function') {
      try {
        new window.ResizeObserver(function () {
          if (isMobile() !== lastMobile) paint();
        }).observe(root);
      } catch (err) {
        /* 지원하지 않는 브라우저는 위의 resize 로도 충분하다. */
      }
    }

    paint();

    return { root: root, setActive: setActive, isMobile: isMobile, repaint: paint };
  }

  /** 숫자 입력 + 슬라이더 */
  function numberField(opts) {
    var o = opts || {};
    var min = o.min === undefined ? 0 : o.min;
    var max = o.max === undefined ? 100 : o.max;
    var step = o.step === undefined ? 1 : o.step;
    var value = o.value === undefined ? 0 : o.value;
    var withSlider = o.withSlider !== false;

    var input = el('input', {
      type: 'number',
      'class': 'num-input',
      min: min,
      max: max,
      step: step,
      value: String(value),
      id: o.id,
      attrs: { 'aria-label': o.label, inputmode: 'numeric' }
    });
    var slider = withSlider
      ? el('input', {
          type: 'range',
          'class': 'slider',
          min: min,
          max: max,
          step: step,
          value: String(value),
          attrs: { 'aria-label': (o.label || '값') + ' 슬라이더' }
        })
      : null;

    var current = value;

    function apply(next, from) {
      var n = Number(next);
      if (isNaN(n)) return;
      n = Math.min(max, Math.max(min, n));
      current = n;
      if (from !== 'input') input.value = String(n);
      if (slider && from !== 'slider') slider.value = String(n);
      if (o.onChange) o.onChange(n);
    }

    input.addEventListener('input', function () {
      var raw = input.value;
      if (raw === '' || raw === '-') return;
      apply(raw, 'input');
    });
    input.addEventListener('blur', function () {
      apply(input.value === '' ? current : input.value);
    });
    if (slider) {
      slider.addEventListener('input', function () {
        apply(slider.value, 'slider');
      });
    }

    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [
        input,
        o.suffix ? el('span', { text: o.suffix }) : null,
        slider
      ])
    ]);

    return {
      root: root,
      input: input,
      slider: slider,
      getValue: function () {
        return current;
      },
      setValue: function (v) {
        apply(v);
      }
    };
  }

        'tbody',
        {},
        rows.map(function (row) {
          return el(
            'tr',
            {},
            row.map(function (cell, i) {
              var tag = i === 0 ? 'th' : 'td';
              var props = i === 0 ? { scope: 'row' } : {};
              if (cell instanceof Node) {
                var td = el(tag, props);
                td.appendChild(cell);
                return td;
              }
              props.html = cell;
              return el(tag, props);
            })
          );
        })
      )
    ]);
    return el('div', { 'class': 'table-scroll' }, [table]);
  }

  function callout(html, opts) {
    var o = opts || {};
    return el('div', { 'class': ('callout ' + (o.muted ? 'callout--muted' : '')).trim(), html: html });
  }

  /** 🏅 배지 카드 (명세 9.11 · 이번 차시 추가 헬퍼) */
  function award(opts) {
    var o = opts || {};
    return el('div', { 'class': 'award' }, [
      el('span', { 'class': 'award__icon', text: o.icon || '🏅', attrs: { 'aria-hidden': 'true' } }),
      el('div', { 'class': 'award__body' }, [
        el('p', { 'class': 'award__title', text: o.title || '' }),
        o.text ? el('p', { 'class': 'award__text', html: o.text }) : null
      ])
    ]);
  }

  /** 보충 학습 바로가기 줄 (명세 10.3 · 이번 차시 추가 헬퍼) */
  function linkLine(opts) {
    var o = opts || {};
    return el('div', { 'class': 'linkline' }, [
      el('span', { 'class': 'linkline__label', html: o.text || '' }),
      button({
        label: o.label || o.step + '단계로 이동',
        variant: 'secondary',
        className: 'linkline__link',
        ariaLabel: o.step + '단계 화면으로 이동',
        onClick: function () {
          L.nav.goToStep(o.step, { force: true });
        }
      })
    ]);
  }

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {
    var region = document.getElementById('toast-region');
    if (!region) return;
    var node = el('div', { 'class': 'toast', text: message });
    region.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, duration || 2600);
  }

  function announce(message) {
    var live = document.getElementById('sr-live');
    if (!live) return;
    live.textContent = '';
    setTimeout(function () {
      live.textContent = message;
    }, 30);
  }

  /**
   * 확인 대화상자 (저장된 진행 복원 · 초기화 확인)
   * dismissValue: Esc 키·백드롭 등으로 그냥 닫았을 때 돌려줄 값.
   */
  function confirmDialog(opts) {
    var o = opts || {};
    var dismissValue = o.dismissValue === undefined ? false : o.dismissValue;
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,
      tabindex: '0',
      dataset: { tip: tip },
      attrs: { 'aria-label': text + '. ' + tip }
    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');
    });
    return node;
  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.scrollToNode = scrollToNode;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.mobileTabs = mobileTabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;
  ui.badge = badge;
  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;
})();
    </script>
    <script data-from="js/20-codeview.js">
/**
 * 파이썬 코드 표시 컴포넌트 (명세 8.2 들여쓰기 안내선 / 8.3 조건 실행 상태 / 20.2 코드 화면)
 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (0~3단계 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시
 *  - 조건식 결과 배지(True ✓ · False ✕)를 줄 옆에 붙인다
 *
 * 1·2차시와 «같은 파일»이다. 고칠 일이 생기면 세 차시를 함께 맞춘다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  // 이 차시는 클래스 구현이 주제이므로 class · def · self · return 을 키워드로 추가한다.
  // self 는 파이썬 예약어가 아니지만, «호출한 객체»를 가리키는 이름이라는 것을 눈에 띄게 하려고
  // 키워드와 같은 색으로 칠한다(명세 20.2 : 코드의 구조가 잘 보이게 한다).
  var KEYWORDS = /^(class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

  var TOKEN_RE = /(\b(?:class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range|sum|random|randint)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\+=|-=|\/\/|[%+\-*/<>=])/g;

  function span(cls, textContent) {
    return '<span class="' + cls + '">' + escapeHtml(textContent) + '</span>';
  }

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */
  function highlightSegment(segment) {
    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);
    }
    if (last < segment.length) out += escapeHtml(segment.slice(last));
    return out;
  }

  /**
   * 파이썬 한 줄(들여쓰기 제외)을 하이라이팅한 HTML 문자열로 바꾼다.
   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.
   */
  function highlightPython(source) {
    var src = String(source === undefined || source === null ? '' : source);
    var out = '';
    var i = 0;
    var buffer = '';

    var flush = function () {
      if (buffer) {
        out += highlightSegment(buffer);
        buffer = '';
      }
    };

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {
        flush();
        out += span('tok-comment', src.slice(i));
        return out;
      }
      if (ch === '"' || ch === "'") {
        flush();
        var j = i + 1;
        while (j < src.length && src[j] !== ch) {
          if (src[j] === '\\') j += 1;
          j += 1;
        }
        out += span('tok-str', src.slice(i, Math.min(j + 1, src.length)));
        i = j + 1;
        continue;
      }
      buffer += ch;
      i += 1;
    }
    flush();
    return out;
  }

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */
  function indentHtml(spaces) {
    if (spaces <= 0) return '';
    var html = '';
    var left = spaces;
    var first = true;
    while (left > 0) {
      var width = Math.min(4, left);
      html +=
        '<span class="indent' +
        (first ? ' indent--first' : '') +
        '"' +
        (width === 4 ? '' : ' style="width:' + width + 'ch"') +
        '></span>';
      left -= width;
      first = false;
    }
    return html;
  }

  function splitIndent(code) {
    var normalized = String(code === undefined || code === null ? '' : code).replace(/\t/g, '    ');
    var match = normalized.match(/^ */);
    var spaces = match ? match[0].length : 0;
    return { spaces: spaces, rest: normalized.slice(spaces) };
  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{
   *   code?: string,                 // 원본 코드 한 줄(앞 공백 = 들여쓰기)
   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁
   * }>
   */
  function createCodeView(opts) {
    var o = opts || {};
    var showLineNumbers = o.showLineNumbers !== false;
    var linesWrap = el('div', { 'class': 'codeview__lines' });
    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);
    var head =
      o.title || o.headExtra
        ? el('div', { 'class': 'codeview__head' }, [
            o.title ? el('span', { 'class': 'codeview__title', html: o.title }) : el('span'),
            o.headExtra || null
          ])
        : null;
    var children = [];
    if (head) children.push(head);
    children.push(scroll);
    var root = el(
      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },
      children
    );

    var current = [];
    var lineEls = [];

    function build(nextLines) {
      current = nextLines || [];
      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }
        });

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.
        var usesParts = Array.isArray(line.parts);
        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  /* ------------------------------------------------------------------ */
  /* 줄별 주석 (이번 차시에 추가 · 명세 9.2)                                  */
  /* ------------------------------------------------------------------ */

  /**
   * 코드 한 줄과 그 줄의 설명을 «같은 행»에 나란히 놓는다.
   *
   * 설명 카드를 따로 모아 두면 어느 카드가 어느 줄의 설명인지 다시 찾아야 하고,
   * 카드 수와 줄 수가 맞지 않으면 줄바꿈이 어긋난다. 그래서 자리를 격자로 묶는다.
   * 화면 4 ②(Phone 클래스)와 화면 5 ①(메소드와 self)이 이 부품을 함께 쓴다.
   *
   * @param {{items:Array<{code:string, key?:string, note:string, no?:number|string}>,
   *          headCode?:string, headNote?:string, ariaLabel?:string}} opts
   *   note 에는 <code> 같은 간단한 태그를 쓸 수 있다(우리가 쓴 고정 문구만 넣는다).
   */
  function createAnnotated(opts) {
    var o = opts || {};
    var items = o.items || [];
    var grid = el('div', {
      'class': 'annot',
      attrs: { role: 'group', 'aria-label': o.ariaLabel || '줄별 코드 설명' }
    });

    grid.appendChild(el('p', { 'class': 'annot__head', text: o.headCode || '코드' }));
    grid.appendChild(el('p', { 'class': 'annot__head', text: o.headNote || '이 줄은 무슨 뜻인가요?' }));

    items.forEach(function (item, index) {
      var source = String(item.code === undefined || item.code === null ? '' : item.code);
      var sp = splitIndent(source);
      var text = el('code', { 'class': 'annot__text' });

      // 들여쓰기 4칸마다 안내선이 있는 칸을 하나 그린다(코드 뷰와 같은 규칙).
      var depth = Math.floor(sp.spaces / 4);
      for (var k = 0; k < depth; k += 1) {
        text.appendChild(el('span', { 'class': 'annot__indent', attrs: { 'aria-hidden': 'true' } }));
      }
      var rest = sp.spaces - depth * 4;
      if (rest > 0) text.appendChild(document.createTextNode(new Array(rest + 1).join(' ')));
      text.insertAdjacentHTML('beforeend', highlightPython(sp.rest));

      grid.appendChild(
        el('div', { 'class': 'annot__code' }, [
          el('span', {
            'class': 'annot__no',
            text: String(item.no === undefined ? index + 1 : item.no),
            attrs: { 'aria-hidden': 'true' }
          }),
          text
        ])
      );
      grid.appendChild(
        el('div', { 'class': 'annot__note' }, [
          item.key ? el('p', { 'class': 'annot__note-key', text: item.key }) : null,
          el('p', { 'class': 'annot__note-text', html: item.note || '' })
        ])
      );
    });
    return grid;
  }

  L.codeview = {
    createCodeView: createCodeView,
    createAnnotated: createAnnotated,
    highlightPython: highlightPython
  };
})();
    </script>
    <script data-from="js/40-pet-engine.js">
/**
 * 반려동물 클래스 자료와 시뮬레이션 엔진 (명세 4장 · 7~10장 · 26장)
 *
 *  · 이 차시에서 다루는 «모든 파이썬 코드»를 한곳에 모아 둔다.
 *    학생 화면과 교사용 지도 자료가 같은 자료를 읽으므로 코드가 서로 어긋나지 않는다(명세 1.3).

    ZONES.forEach(function (zone, i) {

      if (i > 0) out.push('');
      if (!option) {

  /**
   * 명세 8.3 : 조건 분기 시뮬레이션.
   * 어떤 조건을 검사했고, 어디서 참이 되었고, 이후 조건은 검사하지 않았음을 함께 돌려준다.
   *
   * @param {string} animal 지금 self.animal 값
   * @param {Array<{animal:string,sound:string}>} [extra] 학생이 추가한 조건 분기
   */
  function runSound(animal, extra) {
    var rules = SOUND_RULES.concat(Array.isArray(extra) ? extra : []);
    var steps = [];
    var matchedIndex = -1;

    rules.forEach(function (rule, i) {
      var keyword = i === 0 ? 'if' : 'elif';
      if (matchedIndex !== -1) {
        steps.push({
          kind: keyword,
          cond: 'self.animal == "' + rule.animal + '"',
          result: 'unchecked',
          out: rule.sound
        });
        return;
      }
      var hit = String(animal) === String(rule.animal);
      steps.push({
        kind: keyword,
        cond: 'self.animal == "' + rule.animal + '"',
        result: hit ? 'true' : 'false',
        out: rule.sound
      });
      if (hit) matchedIndex = i;
    });

    steps.push({
      kind: 'else',
      cond: '위 조건이 모두 거짓일 때',
      result: matchedIndex === -1 ? 'true' : 'unchecked',
      out: UNKNOWN_SOUND
    });

    return {
      animal: String(animal),
      steps: steps,
      matchedIndex: matchedIndex,
      /** 실행되는 print() 자리 (steps 기준) */
      chosen: matchedIndex === -1 ? steps.length - 1 : matchedIndex,
      output: matchedIndex === -1 ? UNKNOWN_SOUND : rules[matchedIndex].sound
    };
  }

        return p.name;
      }),
      (project.customMethods || []).map(function (m) {
        return m.name;
      })
    );
  }

  /**
   * 학생이 적은 이름을 검사한다. 쓸 수 있으면 빈 문자열, 아니면 «왜 안 되는지» 한 문장.
   * @param {string} name
   * @param {object} project
   * @param {'property'|'method'} kind
   */
  function nameProblem(name, project, kind) {
    var value = String(name === undefined || name === null ? '' : name).trim();
    var what = kind === 'method' ? '기능' : '속성';
    if (!value) return what + ' 이름을 적어 주세요.';
    if (/[가-힣]/.test(value)) return '이름은 영문자로 적어요. (예 : ' + (kind === 'method' ? 'sleep' : 'weight') + ')';
    if (!isValidName(value)) {
      return '영문자나 밑줄로 시작하고, 영문자 · 숫자 · 밑줄만 쓸 수 있어요. (' + CUSTOM_NAME_MAX + '자 이내)';
    }
    if (usedNames(project).indexOf(value) !== -1) return '「' + value + '」 은(는) 이미 쓰고 있는 이름이에요.';
    return '';
  }

  /** 직접 만든 속성 더하기 */
  function addCustomProperty(project, name) {
    var problem = nameProblem(name, project, 'property');
    if (problem) return { ok: false, message: problem };
    if ((project.customProperties || []).length >= CUSTOM_LIMIT.properties) {
      return { ok: false, message: '직접 만든 속성은 ' + CUSTOM_LIMIT.properties + '개까지 넣을 수 있어요.' };
    }
    project.customProperties.push({ name: String(name).trim() });
    return { ok: true, message: '' };
  }

  /** 직접 만든 기능(메소드) 더하기 */
  function addCustomMethod(project, name) {
    var problem = nameProblem(name, project, 'method');
    if (problem) return { ok: false, message: problem };
    if ((project.customMethods || []).length >= CUSTOM_LIMIT.methods) {
      return { ok: false, message: '직접 만든 기능은 ' + CUSTOM_LIMIT.methods + '개까지 넣을 수 있어요.' };
    }
    project.customMethods.push({
      name: String(name).trim(),
      tail: '',
      useSelf: true,
      bodyIndent: 8
    });
    return { ok: true, message: '' };
  }

  function removeCustomProperty(project, name) {
    project.customProperties = (project.customProperties || []).filter(function (p) {
      return p.name !== name;
    });
    ['pet1', 'pet2'].forEach(function (objectName) {
      if (project.values[objectName]) delete project.values[objectName][name];
    });
  }

  function removeCustomMethod(project, name) {
    project.customMethods = (project.customMethods || []).filter(function (m) {
      return m.name !== name;
    });
    ['pet1', 'pet2'].forEach(function (objectName) {
      project.calls[objectName] = (project.calls[objectName] || []).filter(function (m) {
        return m !== name;
      });
    });
  }

  /** 직접 만든 항목 수 */
  function customCount(project) {
    var p = project || {};
    return (p.customProperties || []).length + (p.customMethods || []).length;
  }

  function customMethod(project, name) {
    return (
      (project.customMethods || []).filter(function (m) {
        return m.name === name;
      })[0] || null
    );
  }

  /** 명세 10.3 : 객체별 속성값 기본값 */
  function defaultProject() {
    return {
      className: 'Pet',
      extensions: [],
      /** 학생이 직접 만든 속성 [{ name }] · 값은 values 안에 함께 담는다 */
      customProperties: [],
      /** 학생이 직접 만든 기능 [{ name, tail, useSelf, bodyIndent }] */
      customMethods: [],
      /** 객체별 속성값 */
      values: {
        pet1: { name: '초코', animal: '고양이', age: 3, hungry: false },
        pet2: { name: '구름', animal: '강아지', age: 1, hungry: true }
      },
      /** 확장 메소드 구조 */
      methods: {
        eat: { tail: METHOD_DEFAULT_TAIL.eat, useSelf: true, bodyIndent: 8 },
        play: { tail: METHOD_DEFAULT_TAIL.play, useSelf: true, bodyIndent: 8 },
        show_info: { fields: ['name', 'animal'], useSelf: true, bodyIndent: 8 }
      },
      /** 확장 조건 분기 */
      branches: {
        newAnimal: { animal: '', sound: '' },
        ageBranch: { threshold: 2, useSelf: true, bodyIndent: 12 }
      },
      /** 객체별로 호출할 메소드 */
      calls: { pet1: ['introduce', 'sound'], pet2: ['introduce', 'sound'] }
    };
  }

  /** 빠진 칸을 기본값으로 메워 «항상 같은 모양»의 프로젝트 객체를 만든다. */
  function normalizeProject(raw) {
    var base = defaultProject();
    var p = raw && typeof raw === 'object' ? raw : {};
    var out = {
      className: 'Pet',
      extensions: (Array.isArray(p.extensions) ? p.extensions : []).filter(function (key) {
        return Boolean(extensionByKey(key));
      }),
      customProperties: [],
      customMethods: [],
      values: { pet1: {}, pet2: {} },
      methods: {},
      branches: {},
      calls: { pet1: [], pet2: [] }
    };

    /* 직접 만든 속성 · 기능 — 이름 규칙에 맞는 것만, 정해진 개수까지 */
    var seen = TAKEN_NAMES.slice();
    (Array.isArray(p.customProperties) ? p.customProperties : []).forEach(function (item) {
      if (out.customProperties.length >= CUSTOM_LIMIT.properties) return;
      var name = String((item && item.name) || '').trim();
      if (!isValidName(name) || seen.indexOf(name) !== -1) return;
      seen.push(name);
      out.customProperties.push({ name: name });
    });
    (Array.isArray(p.customMethods) ? p.customMethods : []).forEach(function (item) {
      if (out.customMethods.length >= CUSTOM_LIMIT.methods) return;
      var name = String((item && item.name) || '').trim();
      if (!isValidName(name) || seen.indexOf(name) !== -1) return;
      seen.push(name);
      out.customMethods.push({
        name: name,
        tail: String(item.tail === undefined || item.tail === null ? '' : item.tail).slice(0, 40),
        useSelf: item.useSelf === undefined ? true : Boolean(item.useSelf),
        bodyIndent: Number(item.bodyIndent) === 4 ? 4 : 8
      });
    });

    ['pet1', 'pet2'].forEach(function (name) {
      var src = (p.values && p.values[name]) || {};
      var def = base.values[name];
      out.values[name] = {
        name: src.name === undefined || src.name === null || src.name === '' ? def.name : String(src.name),
        animal:
          src.animal === undefined || src.animal === null || src.animal === ''
            ? def.animal
            : String(src.animal),
        age: src.age === undefined || src.age === null || src.age === '' ? '' : Number(src.age),
        hungry: src.hungry === undefined || src.hungry === null ? def.hungry : Boolean(src.hungry)
      };
      // 직접 만든 속성의 값도 같은 자리에 담는다(글자로만 다룬다).
      out.customProperties.forEach(function (prop) {
        var value = src[prop.name];
        out.values[name][prop.name] = String(
          value === undefined || value === null ? '' : value
        ).slice(0, 30);
      });
      var calls = (p.calls && p.calls[name]) || [];
      out.calls[name] = Array.isArray(calls) ? calls.slice() : [];
    });

    ['eat', 'play'].forEach(function (key) {
      var src = (p.methods && p.methods[key]) || {};
      out.methods[key] = {
        tail: src.tail === undefined || src.tail === null ? base.methods[key].tail : String(src.tail),
        useSelf: src.useSelf === undefined ? true : Boolean(src.useSelf),
        bodyIndent: Number(src.bodyIndent) === 4 ? 4 : 8
      };
    });
    var info = (p.methods && p.methods.show_info) || {};
    out.methods.show_info = {
      fields: Array.isArray(info.fields) ? info.fields.slice() : base.methods.show_info.fields.slice(),
      useSelf: info.useSelf === undefined ? true : Boolean(info.useSelf),
      bodyIndent: Number(info.bodyIndent) === 4 ? 4 : 8
    };

    var na = (p.branches && p.branches.newAnimal) || {};
    out.branches.newAnimal = {
      animal: String(na.animal === undefined || na.animal === null ? '' : na.animal).trim(),
      sound: String(na.sound === undefined || na.sound === null ? '' : na.sound).trim()
    };
    var ab = (p.branches && p.branches.ageBranch) || {};
    out.branches.ageBranch = {
      threshold: isNaN(Number(ab.threshold)) ? 2 : Number(ab.threshold),
      useSelf: ab.useSelf === undefined ? true : Boolean(ab.useSelf),
      bodyIndent: Number(ab.bodyIndent) === 8 ? 8 : 12
    };
    return out;
  }

  function hasExt(project, key) {
    return (project.extensions || []).indexOf(key) !== -1;
  }

  /** «새로 추가된» 속성 이름 (고른 것 + 직접 만든 것) */
  function newProperties(project) {
    return ['age', 'hungry']
      .filter(function (key) {
        return hasExt(project, key);
      })
      .concat(
        (project.customProperties || []).map(function (p) {
          return p.name;
        })
      );
  }

  /** «새로 추가된» 메소드 이름 (고른 것 + 직접 만든 것) */
  function newMethods(project) {
    var list = ['eat', 'play', 'show_info'].filter(function (key) {
      return hasExt(project, key);
    });
    if (hasExt(project, 'ageBranch')) list.push('introduce_age');
    return list.concat(
      (project.customMethods || []).map(function (m) {
        return m.name;
      })
    );
  }

  /** 이 프로젝트에서 부를 수 있는 메소드 전체 */
  function availableMethods(project) {
    return BASE_METHODS.concat(newMethods(project));
  }

  /** show_info() 가 실제로 출력할 항목 (선택하지 않은 속성은 뺀다) */
  function infoFieldsOf(project) {
    return (project.methods.show_info.fields || []).filter(function (key) {
      var field = INFO_FIELDS.filter(function (f) {
        return f.key === key;
      })[0];
      if (!field) return false;
      if (field.needs && !hasExt(project, field.needs)) return false;
      return true;
    });
  }

  /* ------------------------- 코드 만들기 (명세 10.2) ------------------------- */

  function pad(n) {
    return new Array(Number(n) + 1).join(' ');
  }

  function pyValue(value) {
    if (typeof value === 'boolean') return value ? 'True' : 'False';
    if (typeof value === 'number') return String(value);
    return '"' + String(value) + '"';
  }

  /**
   * 학생이 직접 적은 값을 파이썬 값으로 적는다.
   * 숫자처럼 보이면 숫자로, True · False 면 참·거짓으로, 그 밖에는 문자열로 적는다.
   */
  function customLiteral(value) {
    var s = String(value === undefined || value === null ? '' : value).trim();
    if (s === '') return '""';
    if (/^-?\d+(\.\d+)?$/.test(s)) return s;
    if (s === 'True' || s === 'False') return s;
    return '"' + s + '"';
  }

  /** 직접 만든 속성의 «클래스 기본값» — 두 객체 값의 모양을 보고 정한다. */
  function customDefault(project, propName) {
    var values = ['pet1', 'pet2'].map(function (objectName) {
      return String(project.values[objectName][propName] || '').trim();
    });
    var filled = values.filter(function (v) {
      return v !== '';
    });
    if (filled.length && filled.every(function (v) {
      return /^-?\d+(\.\d+)?$/.test(v);
    })) {
      return '0';
    }
    if (filled.length && filled.every(function (v) {
      return v === 'True' || v === 'False';
    })) {
      return 'False';
    }
    return '""';
  }

  /**
   * 구조화된 입력을 «완성 파이썬 코드»로 만든다.
   * 학생 입력을 실행하지 않고 글자로만 다룬다(명세 22장).
   */
  function projectCode(raw) {
    var project = normalizeProject(raw);
    var lines = ['class Pet:', '    name = "펫"', '    animal = "강아지"'];

    if (hasExt(project, 'age')) lines.push('    age = 1');
    if (hasExt(project, 'hungry')) lines.push('    hungry = True');
    // 직접 만든 속성 — 클래스에는 기본값을, 객체별 값은 아래에서 정한다.
    project.customProperties.forEach(function (prop) {
      lines.push('    ' + prop.name + ' = ' + customDefault(project, prop.name));
    });

    /* sound() — 확장한 조건 분기를 포함한다 */
    lines.push('');
    lines.push('    def sound(self):');
    SOUND_RULES.forEach(function (rule, i) {
      lines.push('        ' + (i === 0 ? 'if' : 'elif') + ' self.animal == "' + rule.animal + '":');
      lines.push('            print("' + rule.sound + '")');
    });
    var na = project.branches.newAnimal;
    if (hasExt(project, 'newAnimal') && na.animal && na.sound) {
      lines.push('        elif self.animal == "' + na.animal + '":');
      lines.push('            print("' + na.sound + '")');
    }
    lines.push('        else:');
    lines.push('            print("' + UNKNOWN_SOUND + '")');

    /* introduce() */
    lines.push('');
    lines.push('    def introduce(self):');
    lines.push('        print(f"안녕하세요. 저는 {self.animal} {self.name}입니다.")');

    /* 확장 메소드 */
    ['eat', 'play'].forEach(function (key) {
      if (!hasExt(project, key)) return;
      var m = project.methods[key];
      var who = m.useSelf ? '{self.name}' : '{name}';
      lines.push('');
      lines.push('    def ' + key + '(self):');
      lines.push(pad(m.bodyIndent) + 'print(f"' + who + '이(가) ' + m.tail + '")');
    });

    if (hasExt(project, 'show_info')) {
      var info = project.methods.show_info;
      lines.push('');
      lines.push('    def show_info(self):');
      var fields = infoFieldsOf(project);
      if (!fields.length) {
        lines.push(pad(info.bodyIndent) + '# 출력할 항목을 골라 주세요');
      }
      fields.forEach(function (key) {
        var field = INFO_FIELDS.filter(function (f) {
          return f.key === key;
        })[0];
        var code = info.useSelf ? field.code : field.code.replace(/self\./g, '');
        lines.push(pad(info.bodyIndent) + code);
      });
    }

    /* 직접 만든 기능 */
    project.customMethods.forEach(function (m) {
      var who = m.useSelf ? '{self.name}' : '{name}';
      lines.push('');
      lines.push('    def ' + m.name + '(self):');
      lines.push(pad(m.bodyIndent) + 'print(f"' + who + '이(가) ' + (m.tail || '…') + '")');
    });

    if (hasExt(project, 'ageBranch')) {
      var ab = project.branches.ageBranch;
      var owner = ab.useSelf ? 'self.' : '';
      lines.push('');
      lines.push('    def introduce_age(self):');
      lines.push('        if ' + owner + 'age < ' + ab.threshold + ':');
      lines.push(pad(ab.bodyIndent) + 'print(f"{' + owner + 'name}은(는) 어린 반려동물입니다.")');
      lines.push('        else:');
      lines.push(pad(ab.bodyIndent) + 'print(f"{' + owner + 'name}은(는) 다 자란 반려동물입니다.")');
    }

    /* 객체 생성 · 속성 변경 */
    ['pet1', 'pet2'].forEach(function (objectName) {
      var v = project.values[objectName];
      lines.push('');
      lines.push(objectName + ' = Pet()');
      lines.push(objectName + '.name = ' + pyValue(v.name));
      lines.push(objectName + '.animal = ' + pyValue(v.animal));
      if (hasExt(project, 'age') && v.age !== '') {
        lines.push(objectName + '.age = ' + pyValue(Number(v.age)));
      }
      if (hasExt(project, 'hungry')) {
        lines.push(objectName + '.hungry = ' + pyValue(Boolean(v.hungry)));
      }
      project.customProperties.forEach(function (prop) {
        var value = String(v[prop.name] || '').trim();
        if (value !== '') lines.push(objectName + '.' + prop.name + ' = ' + customLiteral(value));
      });
    });

    /* 메소드 호출 */
    var anyCall = false;
    ['pet1', 'pet2'].forEach(function (objectName) {
      var calls = project.calls[objectName] || [];
      if (!calls.length) return;
      if (!anyCall) lines.push('');
      anyCall = true;
      calls.forEach(function (method) {
        lines.push(objectName + '.' + method + '()');
      });
    });

    return lines;
  }

  /* ------------------------- 실행 결과 (명세 10.4) ------------------------- */

  /** 메소드 한 번 호출의 출력 줄들 */
  function callOutput(project, objectName, method) {
    var v = project.values[objectName];
    var name = v.name;
    var animal = v.animal;

    if (method === 'introduce') {
      return ['안녕하세요. 저는 ' + animal + ' ' + name + '입니다.'];
    }
    if (method === 'sound') {
      var extra =
        hasExt(project, 'newAnimal') && project.branches.newAnimal.animal
          ? [project.branches.newAnimal]
          : [];
      return [soundOf(animal, extra)];
    }
    if (method === 'eat' || method === 'play') {
      return [name + '이(가) ' + project.methods[method].tail];
    }
    if (method === 'show_info') {
      return infoFieldsOf(project).map(function (key) {
        if (key === 'name') return '이름: ' + name;
        if (key === 'animal') return '종류: ' + animal;
        if (key === 'age') return '나이: ' + (v.age === '' ? '?' : v.age) + '살';
        return '배고픔: ' + (v.hungry ? 'True' : 'False');
      });
    }
    if (method === 'introduce_age') {
      var age = v.age === '' ? 0 : Number(v.age);
      var threshold = project.branches.ageBranch.threshold;
      return [
        name + '은(는) ' + (age < threshold ? '어린' : '다 자란') + ' 반려동물입니다.'
      ];
    }
    // 학생이 직접 만든 기능
    var custom = customMethod(project, method);
    if (custom) return [name + '이(가) ' + (custom.tail || '…')];
    return [];
  }

  /**
   * 프로젝트를 실행한 결과. 실제 파이썬을 돌리지 않고 위 규칙으로만 만든다.
   * @returns {{output:string[], perObject:{pet1:string[], pet2:string[]}, calls:Array}}
   */
  function runProject(raw) {
    var project = normalizeProject(raw);
    var output = [];
    var perObject = { pet1: [], pet2: [] };
    var calls = [];

    ['pet1', 'pet2'].forEach(function (objectName) {
      (project.calls[objectName] || []).forEach(function (method) {
        var produced = callOutput(project, objectName, method);
        calls.push({ object: objectName, method: method, output: produced });
        produced.forEach(function (line) {
          output.push(line);
          perObject[objectName].push(line);
        });
      });
    });

    return { output: output, perObject: perObject, calls: calls };
  }

  /** 명세 10.3 : 객체별 속성값 표 (확장한 속성만 줄을 늘린다) */
  function valueTable(raw) {
    var project = normalizeProject(raw);
    var rows = [
      ['name', project.values.pet1.name, project.values.pet2.name],
      ['animal', project.values.pet1.animal, project.values.pet2.animal]
    ];
    if (hasExt(project, 'age')) {
      rows.push([
        'age',
        project.values.pet1.age === '' ? '(미입력)' : String(project.values.pet1.age),
        project.values.pet2.age === '' ? '(미입력)' : String(project.values.pet2.age)
      ]);
    }
    if (hasExt(project, 'hungry')) {
      rows.push([
        'hungry',
        project.values.pet1.hungry ? 'True' : 'False',
        project.values.pet2.hungry ? 'True' : 'False'
      ]);
    }
    project.customProperties.forEach(function (prop) {
      rows.push([
        prop.name,
        String(project.values.pet1[prop.name] || '') || '(미입력)',
        String(project.values.pet2[prop.name] || '') || '(미입력)'
      ]);
    });
    return rows;
  }

  /* ================================================================== */
  /* 7. 명세 4.6 : 핵심 문제 해결 흐름                                       */
  /* ================================================================== */
  var SOLVE_FLOW = [
    '실생활 대상 분석',
    '공통 속성과 기능 추출',
    '클래스 설계',
    '객체 생성',
    '객체별 속성 변경',
    '메소드 실행',
    '기능 확장',
    '결과 설명'
  ];

  return {
    /* 기준 클래스 */
    PET_DEFAULTS: PET_DEFAULTS,
    BASE_PROPERTIES: BASE_PROPERTIES,
    BASE_METHODS: BASE_METHODS,
    SOUND_RULES: SOUND_RULES,
    UNKNOWN_SOUND: UNKNOWN_SOUND,
    ANIMAL_CHOICES: ANIMAL_CHOICES,
    CLASS_CODE: CLASS_CODE,
    CLASS_NOTES: CLASS_NOTES,
    soundOf: soundOf,
    introduceText: introduceText,
    /* 모형 */
    makeClass: makeClass,
    petClass: petClass,
    runScript: runScript,
    /* 화면 2 */
    TARGET_CARDS: TARGET_CARDS,
    SORT_CARDS: SORT_CARDS,
    SORT_ZONES: SORT_ZONES,
    DESIGN_BOARD: DESIGN_BOARD,
    OOP_CARDS: OOP_CARDS,
    oopOptions: oopOptions,
    oopTable: oopTable,
    REASON_OPTIONS: REASON_OPTIONS,
    REASON_ROWS: REASON_ROWS,
    /* 화면 3 */
    INDENT_LEVELS: INDENT_LEVELS,
    ZONES: ZONES,
    zoneByKey: zoneByKey,
    zoneOption: zoneOption,
    checkZones: checkZones,
    zonesToCode: zonesToCode,
    runSound: runSound,
    SOUND_TESTS: SOUND_TESTS,
    runSoundTests: runSoundTests,

        feedback.push(step.hint);
        return;
      }

      if (step.kind === 'call') {
        if (seenAt[step.key] !== -1 && errors.indexOf(CODE_ERRORS.noParen) !== -1) {
          feedback.push(step.hintNoParen);
          return;
        }
        pushErr(CODE_ERRORS.missingCall);
        feedback.push(step.hint);
        return;
      }

      // 속성 대입
      if (seenAt[step.key] !== -1 && errors.indexOf(CODE_ERRORS.attrTarget) !== -1) {
        feedback.push(step.hintTarget);
        return;
      }
      if (seenAt[step.key] !== -1 && errors.indexOf(CODE_ERRORS.attrValue) !== -1) {
        feedback.push(step.hintWrongValue);
        return;
      }
      pushErr(CODE_ERRORS.attrValue);
      feedback.push(step.hint);
    });

    if (!ordered) {
      if (errors.indexOf(CODE_ERRORS.createOrder) !== -1) {
        feedback.push('객체를 «먼저 만든 뒤» 그 객체의 속성을 바꾸고 메소드를 호출해야 해요.');
      }
      if (errors.indexOf(CODE_ERRORS.callOrder) !== -1) {
        feedback.push(
          '기대 결과의 순서대로 출력되려면 ' + (s.requiredCallOrder || []).join(' → ') + ' 순서로 호출해야 해요.'
        );
      }
    }

    return {
      lines: lines,
      matched: matched,
      total: steps.length,
      ok: matched === steps.length && ordered,
      ordered: ordered,
      elements: elements,
      steps: steps.map(function (step) {
        return { key: step.key, label: step.label, ok: elements[step.key] };
      }),
      errors: errors,
      feedback: feedback
    };
  }

    MAX_LINE_LEN: MAX_LINE_LEN,

    CODE_ERRORS: CODE_ERRORS,

        emitSaved();
      } catch (err) {
        // 저장에 실패해도 학습은 계속한다(명세 12.1). 경고는 한 번만 띄운다.
        if (!warnedOnce) {
          warnedOnce = true;
          if (L.ui && L.ui.toast) {
            L.ui.toast('학습 기록을 저장하지 못했어요. 학습은 그대로 계속할 수 있어요.');
          }
          if (window.console) console.warn('[state] 저장에 실패했습니다.', err);
        }
      }
    }, 500);
  }

  /** 명세 20.3 : 자동 저장 상태 표시를 위한 알림 */
  var savedListeners = [];

  function onSaved(fn) {
    if (typeof fn === 'function') savedListeners.push(fn);
  }

  function emitSaved() {
    savedListeners.slice().forEach(function (fn) {
      try {
        fn(appState.savedAt);
      } catch (err) {
        /* 무시 */
      }
    });
  }

  function markChanged() {
    saveState();
    emit();
  }

  function readSavedState() {
    if (!hasStorage()) return null;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (err) {
      return null;
    }
  }

  /** 제출 주소는 학습 상태와 별도 키로 보관한다(명세 12.1). */
  function readEndpoint() {
    if (!hasStorage()) return L.CONST.SUBMIT_URL || '';
    try {
      return window.localStorage.getItem(ENDPOINT_KEY) || L.CONST.SUBMIT_URL || '';
    } catch (err) {
      return L.CONST.SUBMIT_URL || '';
    }
  }

  function saveEndpoint(url) {
    if (!hasStorage()) return;
    try {
      if (url) window.localStorage.setItem(ENDPOINT_KEY, String(url));
      else window.localStorage.removeItem(ENDPOINT_KEY);
    } catch (err) {
      /* 무시 */
    }
  }

  function deepCopy(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function mergeInto(target, source) {
    Object.keys(source).forEach(function (key) {
      var value = source[key];
      if (!(key in target)) return;
      var cur = target[key];
      if (Array.isArray(value)) {
        target[key] = deepCopy(value);
        return;
      }
      if (value && typeof value === 'object') {
        if (cur && typeof cur === 'object' && !Array.isArray(cur)) {
          // answers · picks 처럼 「키가 자유로운」 객체는 통째로 바꾼다.
          if (Object.keys(cur).length === 0) target[key] = deepCopy(value);
          else mergeInto(cur, value);
        } else if (cur === null) {
          target[key] = deepCopy(value);
        }
        return;
      }
      if (value !== undefined) target[key] = value;
    });
  }

  /** 키가 자유로운(카드 key · 문항 id 등) 객체는 통째로 복원한다. */
  var FREE_MAPS = [
    ['step1', 'pre'],
    ['step2', 'sort'],
    ['step2', 'conceptPicks'],
    ['step2', 'reasons'],
    ['step3', 'picks'],
    ['step5', 'explain'],
    ['step6', 'answers']
  ];

  function applySavedState(saved) {
    if (!saved) return;
    mergeInto(appState, saved);
    FREE_MAPS.forEach(function (path) {
      var savedGroup = saved[path[0]];
      if (savedGroup && savedGroup[path[1]] && typeof savedGroup[path[1]] === 'object') {
        appState[path[0]][path[1]] = deepCopy(savedGroup[path[1]]);
      }
    });
    // 프로젝트 구조는 빠진 칸을 기본값으로 메워 항상 같은 모양으로 만든다.
    appState.step5.project = L.pet.normalizeProject(
      saved.step5 && saved.step5.project ? saved.step5.project : appState.step5.project
    );
    if (!Array.isArray(appState.visitedSteps) || appState.visitedSteps.length === 0) {
      appState.visitedSteps = [1];
    }
    appState.currentStep = clampStep(appState.currentStep);
    emit();
  }

  function resetState() {
    if (hasStorage()) {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        /* 무시 */
      }
    }
    var fresh = createInitialState();
    mergeInto(appState, fresh);
    appState.step1.pre = {};
    appState.step2.sort = {};
    appState.step2.conceptSeen = [];
    appState.step2.conceptPicks = {};
    appState.step2.reasons = {};
    appState.step2.plan = [];
    appState.step3.picks = {};
    appState.step4.order = [];
    appState.step4.selfSeen = [];
    appState.step5.project = L.pet.defaultProject();
    appState.step5.explain = {};
    appState.step6.answers = {};
    appState.visitedSteps = [1];
    appState.currentStep = 1;
    emit();
  }

  /** 「이어서 학습하기」를 물어볼 만한 기록이 있는지(명세 12.2) */
  function hasMeaningfulProgress(saved) {
    if (!saved) return false;
    if (typeof saved.currentStep === 'number' && saved.currentStep > 1) return true;
    if (Array.isArray(saved.visitedSteps) && saved.visitedSteps.length > 1) return true;

    var s1 = saved.step1 || {};
    var s2 = saved.step2 || {};
    var s3 = saved.step3 || {};
    var s4 = saved.step4 || {};
    var s5 = saved.step5 || {};
    var s6 = saved.step6 || {};

    if (s1.preOk || (s1.pre && Object.keys(s1.pre).length)) return true;
    if (s2.sortDone || s2.conceptDone || s2.reasonDone || (s2.plan && s2.plan.length)) return true;
    if (s3.zonesDone || s3.simRan || (s3.picks && Object.keys(s3.picks).length)) return true;
    if (s4.instDone || s4.orderDone || s4.indepDone || s4.sentenceOk) return true;
    if (s5.ran || (s5.explain && Object.keys(s5.explain).length)) return true;
    if (s5.project && Array.isArray(s5.project.extensions) && s5.project.extensions.length) return true;
    if (s5.project && L.pet.customCount(s5.project) > 0) return true;
    if (s6.graded || (s6.bestScore !== null && s6.bestScore !== undefined)) return true;
    if (s6.answers && Object.keys(s6.answers).length > 0) return true;
    return false;
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function clampStep(step) {
    var n = Number(step) || 1;
    return Math.min(TOTAL_STEPS, Math.max(1, Math.round(n)));
  }

  function visitStep(step) {
    var n = clampStep(step);
    if (appState.visitedSteps.indexOf(n) === -1) {
      appState.visitedSteps.push(n);
      appState.visitedSteps.sort(function (a, b) {
        return a - b;
      });
    }
    appState.currentStep = n;
    markChanged();
  }

  function isVisited(step) {
    return appState.visitedSteps.indexOf(clampStep(step)) !== -1;
  }

  /* ------------------------------------------------------------------ */
  /* 프로젝트 검사 결과 (화면 5 · 6 · 기록 내려받기가 함께 쓴다)                  */
  /* ------------------------------------------------------------------ */
  function projectResult() {
    return L.project.checkProject(appState.step5.project, appState.step5.explain);
  }

  /* ------------------------------------------------------------------ */
  /* 단계 통과 판정 (명세 5장)                                              */
  /* ------------------------------------------------------------------ */

  /** 형성평가에서 응답을 마친 문항 수 (유형별 판정은 45-quiz.js 가 한다) */
  function answeredCount() {
    var answers = appState.step6.answers || {};
    var n = 0;
    (L.quiz ? L.quiz.QUESTIONS : []).forEach(function (q) {
      if (L.quiz.isAnswered(q, answers[q.id])) n += 1;
    });
    return n;
  }

  /** 화면 2 에서 «정한» 확장 수 — 고른 카드 + 직접 만든 속성·기능 */
  function planCount() {
    var plan = appState.step2.plan || [];
    return plan.length + L.pet.customCount(appState.step5.project || {});
  }

  function selfDone() {
    var seen = appState.step4.selfSeen || [];
    return seen.indexOf('pet1') !== -1 && seen.indexOf('pet2') !== -1;
  }

  function canProceed(step) {
    var s = clampStep(step);
    var st = appState;

    if (s === 1) {
      // 명세 6.3 : 선수 학습 2문항을 모두 맞히면 [프로젝트 시작] 이 열린다.
      return Boolean(st.step1.preOk);
    }
    if (s === 2) {
      // 명세 5장 : 분류 정답 + 개념 카드 확인 + 설계 확인 + 확장 예비 선택 2개 이상
      // (고른 카드와 «직접 만든» 속성 · 기능을 함께 센다)
      return Boolean(
        st.step2.sortDone && st.step2.conceptDone && st.step2.reasonDone && planCount() >= 2
      );
    }
    if (s === 3) {
      // 명세 5장 : 네 구역 조립이 모두 정답이면 기본 클래스 완성으로 본다.
      return Boolean(st.step3.zonesDone);
    }
    if (s === 4) {
      // 명세 5장 : 두 객체 실행과 결과 설명
      return Boolean(
        st.step4.instDone &&
          st.step4.orderDone &&
          st.step4.callDone &&
          selfDone() &&
          st.step4.indepDone &&
          st.step4.sentenceOk
      );
    }
    if (s === 5) {
      // 명세 5장 : 확장 2개 이상(자동 확인 9항목) + 설명 5항목
      var result = projectResult();
      return Boolean(result.complete);
    }
    if (s === 6) {
      // 명세 11.1 : 5문항 모두 응답
      return answeredCount() === (L.quiz ? L.quiz.QUESTIONS.length : 5);
    }
    return true;
  }

  function blockedMessage(step) {
    var s = clampStep(step);
    if (s === 1) return '선수 학습 2문항을 모두 맞혀 주세요.';
    if (s === 2) return '속성·기능 분류와 네 특징 확인, 설계 확인 질문, 확장 예비 선택을 마쳐 주세요.';
    if (s === 3) return '네 구역 코드를 모두 올바르게 골라 주세요.';
    if (s === 4) return '두 인스턴스를 끝까지 실행하고 결과 설명을 완성해 주세요.';
    if (s === 5) return '자동 확인 9개 항목과 설명 5항목을 모두 채워 주세요.';
    if (s === 6) return '아직 답하지 않은 문항이 있어요.';
    return '';
  }

  /** 명세 5장 : 남은 활동을 구체적으로 알려 준다. */
  function remainingHint(step) {
    var s = clampStep(step);
    var st = appState;
    var parts = [];

    if (s === 1) {
      if (!st.step1.preOk) parts.push('선수 학습 2문항');
    } else if (s === 2) {
      if (!st.step2.sortDone) parts.push('속성·기능 분류');
      if (!st.step2.conceptDone) parts.push('네 특징 카드 확인');
      if (!st.step2.reasonDone) parts.push('설계 확인 질문');
      if (planCount() < 2) parts.push('확장 예비 선택 ' + (2 - planCount()) + '개');
    } else if (s === 3) {
      if (!st.step3.zonesDone) {
        var zones = L.pet.checkZones(st.step3.picks);
        var left = zones.zones.filter(function (z) {
          return !z.ok;
        }).length;
        parts.push('코드 조립 ' + left + '구역');
      }
    } else if (s === 4) {
      if (!st.step4.instDone) parts.push('객체 생성·변경 한 줄 실행');
      if (!st.step4.orderDone) parts.push('출력 순서 배열');
      if (!st.step4.callDone) parts.push('메소드 호출 실행');
      if (!selfDone()) parts.push('self 흐름 (pet1 · pet2)');
      if (!st.step4.indepDone) parts.push('객체 독립성 실험');
      if (!st.step4.sentenceOk) parts.push('결과 설명 빈칸');
    } else if (s === 5) {
      var result = projectResult();
      var failed = result.checks.filter(function (c) {
        return !c.ok;
      });
      if (failed.length) parts.push('자동 확인 ' + failed.length + '항목');
      if (!result.explanation.ok) {
        parts.push('설명 ' + (result.explanation.total - result.explanation.filled) + '항목');
      }
    } else if (s === 6) {
      var rest = (L.quiz ? L.quiz.QUESTIONS.length : 5) - answeredCount();
      if (rest > 0) parts.push('남은 문항 ' + rest + '개');
    }
    return parts;
  }

  L.state = {
    STORAGE_KEY: STORAGE_KEY,
    ENDPOINT_KEY: ENDPOINT_KEY,
    TOTAL_STEPS: TOTAL_STEPS,
    appState: appState,
    createInitialState: createInitialState,
    onChange: onChange,
    onSaved: onSaved,
    markChanged: markChanged,
    saveState: saveState,
    readSavedState: readSavedState,
    applySavedState: applySavedState,
    resetState: resetState,
    readEndpoint: readEndpoint,
    saveEndpoint: saveEndpoint,
    hasMeaningfulProgress: hasMeaningfulProgress,
    clampStep: clampStep,
    visitStep: visitStep,
    isVisited: isVisited,
    canProceed: canProceed,
    blockedMessage: blockedMessage,
    remainingHint: remainingHint,
    answeredCount: answeredCount,
    planCount: planCount,
    selfDone: selfDone,
    projectResult: projectResult
  };
})();
    </script>
    <script data-from="js/60-step1.js">
/**
 * 화면 1 — 프로젝트 시작 (명세 6장)
 *
 * 구성 (가운데 한 줄로 쌓는 카드 레이아웃)
 *   ① 1단계 · 프로젝트 시작 / 제목 / 부제
 *   ② 🎯 오늘의 학습 목표 (명세 3장의 세 문장)
 *   ③ 🐾 프로젝트 상황 (명세 6.2)
 *   ④ 🧠 선수 학습 2문항 — 두 문항을 모두 맞히면 [프로젝트 시작] 이 열린다 (명세 6.3)

 * 이 화면의 스타일은 1·2차시와 같은 `s1-` 계열을 그대로 쓴다(styles/common.css).
 */
(function () {

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var PET = L.pet;

  var CIRCLED = '①②③④⑤⑥';

  /** 명세 3장 : 학습 목표 세 문장 */
  var GOALS = [
    '반려동물의 공통 속성과 기능을 분석하여 Pet 클래스로 구현할 수 있다.',

  ];

  /** 명세 6.2 : 프로젝트 상황 */
  var SITUATION =
    '서로 다른 반려동물의 <strong>이름과 종류</strong>를 저장하고, 각 반려동물이 ' +
    '<strong>자기소개</strong>와 <strong>울음소리</strong>를 출력하는 프로그램을 만들어 봅시다. ' +
    '기본 기능을 완성한 뒤 <strong>나이 · 배고픔 · 먹이 먹기 · 놀기</strong> 등의 기능을 추가합니다.';

  /** 명세 6.3 : 선수 학습 2문항 (1·2차시 개념 확인 · 두 문항 모두 맞히면 통과) */
  var PRE = [
    {

      code: 'pet1 = Pet()',
      options: [

        '<code>self</code> 는 <strong>메소드를 호출한 객체 자신</strong>입니다. ' +

      wrongWhy: {

      }
    }
  ];

  /** 명세 5장 : 오늘의 학습 순서 (이름은 단계 제목과 같게 둔다) */
  var PLAN_DESC = {
    1: '목표 · 프로젝트 상황 · 선수 학습',
    2: '속성·기능 분류와 객체 지향 네 특징',
    3: 'Pet 클래스와 sound() · introduce() 완성',
    4: 'pet1 · pet2 를 만들고 실행 결과 비교',
    5: '두 가지 이상 확장하고 코드 설명',
    6: '형성평가 5문항과 프로젝트 제출'
  };

  var refs = {};

  function st() {
    return L.state.appState.step1;
  }

  /* ------------------------------------------------------------------ */
  /* 선수 학습 2문항 (명세 6.3)                                             */
  /* ------------------------------------------------------------------ */
  function preOk() {
    return PRE.every(function (item) {
      return Number(st().pre[item.key]) === item.answer;
    });
  }

  function paintPre(quiet) {
    if (!refs.preItems) return;
    refs.preItems.forEach(function (item) {
      var picked = Number(st().pre[item.def.key]) || 0;
      item.buttons.forEach(function (btn, i) {

        btn.classList.toggle('is-selected', chosen);
        // 정답·오답을 색만으로 나타내지 않는다(명세 21장). 표시 글자를 함께 바꾼다.
        btn.classList.toggle('is-correct', chosen && i + 1 === item.def.answer);
        btn.classList.toggle('is-wrong', chosen && i + 1 !== item.def.answer);
        var mark = btn.querySelector('.s1-pre__mark');
        if (mark) {

      });

      } else {

      }
    });

    var ok = preOk();
    st().preOk = ok;

  function buildPre() {
    refs.preItems = [];

    PRE.forEach(function (def, index) {

      var row = el(
        'div',
        { 'class': 's1-pre__opts', attrs: { role: 'group', 'aria-label': def.prompt } },
        def.options.map(function (text, i) {

            'button',
            {

      );

      wrap.appendChild(
        el('div', { 'class': 's1-pre__item' }, [
          el('p', { 'class': 's1-pre__q' }, [
            el('span', { 'class': 's1-pre__qno', text: '문항 ' + (index + 1) }),
            el('span', { text: ' ' + def.prompt })

          def.code
            ? L.codeview.createCodeView({
                showLineNumbers: false,
                ariaLabel: '선수 학습 문항 ' + (index + 1) + ' 코드',
                lines: [{ code: def.code }]
              }).root

          row,
          note
        ])
      );
      refs.preItems.push({ def: def, buttons: buttons, note: note });
    });

    refs.preSummary = el('p', { 'class': 's1-pre__summary', attrs: { 'aria-live': 'polite' } });

    return el('section', { 'class': 's1-card' }, [
      el('h3', { 'class': 's1-card__title' }, [
        el('span', { 'class': 's1-card__icon', text: '🧠', attrs: { 'aria-hidden': 'true' } }),
        el('span', { text: '선수 학습 확인' }),
        el('span', { 'class': 's1-card__tag', text: '1·2차시에서 배운 내용' })
      ]),
      wrap,
      refs.preSummary

  }

  /* ------------------------------------------------------------------ */
  /* 조각 만들기                                                          */
  /* ------------------------------------------------------------------ */
  function buildHero() {
    return el('header', { 'class': 's1-hero' }, [
      el('p', { 'class': 's1-hero__eyebrow', text: '1단계 · ' + C.STEP_TITLES[1] }),

      el('p', { 'class': 's1-hero__sub', text: C.LESSON_SUBTITLE })
    ]);
  }

  function buildGoals() {
    return el('section', { 'class': 's1-card' }, [
      el('h3', { 'class': 's1-card__title' }, [
        el('span', { 'class': 's1-card__icon', text: '🎯', attrs: { 'aria-hidden': 'true' } }),
        el('span', { text: '오늘의 학습 목표' })
      ]),
      el(
        'ol',
        { 'class': 's1-goals' },
        GOALS.map(function (text, i) {
          return el('li', { 'class': 's1-goal' }, [
            el('span', { 'class': 's1-goal__no', text: String(i + 1), attrs: { 'aria-hidden': 'true' } }),
            el('span', { 'class': 's1-goal__text', text: text })
          ]);
        })

    ]);

  function buildSituation() {
    return el('section', { 'class': 's1-card' }, [
      el('h3', { 'class': 's1-card__title' }, [
        el('span', { 'class': 's1-card__icon', text: '🐾', attrs: { 'aria-hidden': 'true' } }),
        el('span', { text: '프로젝트 상황' })
      ]),
      el('p', { 'class': 'obj-quote', html: SITUATION }),
      el(
        'div',
        { 'class': 'pet-targets' },
        PET.TARGET_CARDS.map(function (card) {
          return el('div', { 'class': 'pet-target' }, [

          ]);
        })

      el('p', {
        'class': 's1-note',
        html:
          '오늘은 <strong>설계 → 구현 → 두 인스턴스 실행 → 확장 → 설명</strong>까지 ' +
          '한 편의 프로젝트를 직접 완성합니다.'
      })
    ]);
  }

  function buildFlow() {
    return el('section', { 'class': 's1-card' }, [
      el('h3', { 'class': 's1-card__title' }, [
        el('span', { 'class': 's1-card__icon', text: '🧭', attrs: { 'aria-hidden': 'true' } }),
        el('span', { text: '문제 해결 흐름' })
      ]),
      el(
        'ol',
        { 'class': 'flowline' },
        PET.SOLVE_FLOW.map(function (text, i) {
          return el('li', { 'class': 'flowline__item' }, [
            el('span', { 'class': 'flowline__no', text: String(i + 1), attrs: { 'aria-hidden': 'true' } }),
            el('span', { 'class': 'flowline__text', text: text })
          ]);
        })
      )
    ]);
  }

  function buildPlan() {
    return el('section', { 'class': 's1-plan' }, [
      el('p', { 'class': 's1-plan__label', text: '학습 순서' }),
      el(
        'ol',
        { 'class': 's1-plan__grid' },
        [1, 2, 3, 4, 5, 6].map(function (n) {
          return el(
            'li',
            {
              'class': 's1-plan__item',
              attrs: { 'aria-label': n + '단계 ' + C.STEP_TITLES[n] + ' — ' + PLAN_DESC[n] }
            },
            [
              el('span', { 'class': 's1-plan__no', text: CIRCLED[n - 1], attrs: { 'aria-hidden': 'true' } }),
              el('span', { 'class': 's1-plan__name', text: C.STEP_TITLES[n] })
            ]
          );
        })
      )
    ]);
  }

  function buildStart() {
    refs.startHint = el('p', { 'class': 's1-hint', attrs: { 'aria-live': 'polite' } });

    refs.startBtn = ui.button({
      label: '프로젝트 시작',
      className: 's1-start__btn',
      ariaLabel: '2단계 반려동물 설계 화면으로 이동',
      onClick: function () {
        if (!preOk()) {
          // 명세 6.3 : 두 문항을 모두 맞혀야 시작한다. 막기만 하지 않고 어디를 볼지 알려 준다.
          refs.startHint.textContent =
            '선수 학습 2문항을 모두 맞혀야 프로젝트를 시작할 수 있어요. 다시 골라 보세요.';
          ui.toast('선수 학습 2문항을 다시 확인해 주세요.');
          ui.scrollToNode(refs.preSummary);
          return;
        }
        L.nav.goToStep(2);
      }
    });

    return el('div', { 'class': 's1-foot' }, [
      el('p', { 'class': 's1-time', text: '⏱ 예상 학습 시간 : 약 ' + C.STUDY_TIME }),
      el('div', { 'class': 's1-start' }, [refs.startBtn]),
      refs.startHint
    ]);
  }

  /* ------------------------------------------------------------------ */
  function paint() {
    paintPre(true);
  }

  function render(root) {
    root.appendChild(
      el('div', { 'class': 's1-wrap' }, [
        buildHero(),
        buildGoals(),
        buildSituation(),
        buildPre(),
        buildFlow(),
        buildPlan(),
        buildStart()
      ])
    );
    paint();
  }

  L.registerStep(1, {
    title: C.STEP_TITLES[1],
    short: C.STEP_SHORTS[1],
    render: render,
    onEnter: paint
  });
})();
