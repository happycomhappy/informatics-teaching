    <script data-from="js/61-step2.js">
/**
 * 화면 2 — 반려동물 클래스 설계 (명세 7장)
 *
 *   ① 대상 분석과 속성 · 기능 분류 (드래그 · 클릭 두 방식 모두 제공 · 명세 7.1 · 21장)
 *   ② 클래스 설계판과 확장 예비 선택 (두 가지 이상 · 명세 7.2)
 *   ③ 객체 지향 네 가지 특징 — 한 장씩 넘겨 보고 확인 질문에 답한다 (명세 7.3)
 *   ④ 설계 확인 질문 — 왜 속성이고 왜 메소드인가 (명세 7.4)
 *
 * 색만으로 정오를 나타내지 않고 기호(○ · ✕)와 글자를 함께 쓴다(명세 21장).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var PET = L.pet;

  var CIRCLED = '①②③④⑤';

  var refs = {};

  function st() {
    return L.state.appState.step2;
  }

  /* ================================================================== */
  /* ① 속성 · 기능 분류 (명세 7.1)                                          */
  /* ================================================================== */
  function assign(cardKey, zone) {
    if (zone === null) delete st().sort[cardKey];
    else st().sort[cardKey] = zone;
    paintSort();
    L.state.markChanged();
  }

  function sortCard(card, placed) {
    var picked = st().sort[card.key] || null;
    var ok = picked === card.answer;

    var node = el('div', {
      'class':
        'sortcard' +
        (placed ? (ok ? ' is-correct' : ' is-wrong') : '') +
        (placed ? ' is-placed' : ''),
      draggable: true,
      attrs: {
        'aria-label':
          card.label + ' (' + card.code + ')' + (placed ? (ok ? ' — 알맞게 놓았어요' : ' — 다시 옮겨 보세요') : '')
      }
    });

    node.addEventListener('dragstart', function (e) {
      try {
        e.dataTransfer.setData('text/plain', card.key);
        e.dataTransfer.effectAllowed = 'move';
      } catch (err) {
        /* 무시 */
      }
      node.classList.add('is-dragging');
    });
    node.addEventListener('dragend', function () {
      node.classList.remove('is-dragging');
    });

    if (placed) {
      node.appendChild(el('span', { 'class': 'sortcard__mark', text: ok ? '○' : '✕' }));
    }
    node.appendChild(
      el('span', { 'class': 'sortcard__text' }, [
        el('span', { text: card.label }),
        el('code', { 'class': 'sortcard__code', text: card.code })
      ])
    );

    var acts = el('span', { 'class': 'sortcard__acts' });
    if (placed) {
      acts.appendChild(
        el('button', {
          type: 'button',
          'class': 'sortcard__btn',
          text: '↩ 되돌리기',
          attrs: { 'aria-label': card.label + ' 카드를 다시 아래로 내리기' },
          on: {
            click: function () {
              assign(card.key, null);
            }
          }
        })
      );
    } else {
      PET.SORT_ZONES.forEach(function (zone) {
        acts.appendChild(
          el('button', {
            type: 'button',
            'class': 'sortcard__btn',
            text: zone.value === 'attr' ? '속성' : '기능',
            attrs: { 'aria-label': card.label + ' 카드를 ' + zone.title + ' 로 놓기' },
            on: {
              click: function () {
                assign(card.key, zone.value);
              }
            }
          })
        );
      });
    }
    node.appendChild(acts);
    return node;
  }

  function makeZone(opts) {
    var body = el('div', { 'class': 'sortzone__body' });
    var zone = el('div', { 'class': 'sortzone ' + (opts.className || '') }, [
      el('p', { 'class': 'sortzone__title' }, [
        opts.icon
          ? el('span', { text: opts.icon + ' ', attrs: { 'aria-hidden': 'true' } })
          : null,
        el('span', { text: opts.title })
      ]),
      el('p', { 'class': 'sortzone__hint', text: opts.hint }),
      body
    ]);

    ['dragenter', 'dragover'].forEach(function (evt) {
      zone.addEventListener(evt, function (e) {
        e.preventDefault();
        zone.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
      zone.addEventListener(evt, function () {
        zone.classList.remove('is-over');
      });
    });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      var key = '';
      try {
        key = e.dataTransfer.getData('text/plain');
      } catch (err) {
        key = '';
      }
      if (!key) return;
      assign(key, opts.value);
    });

    return { root: zone, body: body };
  }

  function paintSort() {
    if (!refs.zones) return;
    ui.clear(refs.pool.body);
    PET.SORT_ZONES.forEach(function (zone) {
      ui.clear(refs.zones[zone.value].body);
    });

    var unplaced = 0;
    var wrong = [];
    PET.SORT_CARDS.forEach(function (card) {
      var picked = st().sort[card.key] || null;
      if (!picked) {
        unplaced += 1;
        refs.pool.body.appendChild(sortCard(card, false));
        return;
      }
      refs.zones[picked].body.appendChild(sortCard(card, true));
      if (picked !== card.answer) wrong.push(card);
    });

    if (!unplaced) {
      refs.pool.body.appendChild(
        el('p', { 'class': 'sortzone__empty', text: '카드를 모두 옮겼어요.' })
      );
    }

    var done = unplaced === 0 && wrong.length === 0;
    st().sortDone = done;

    if (unplaced > 0) {
      refs.sortFeedback.show(
        'info',
        '남은 카드 <strong>' + unplaced + '개</strong>. 카드를 끌어다 놓거나 카드 안의 ' +
          '<strong>[속성] · [기능]</strong> 버튼을 눌러도 됩니다.'
      );
    } else if (wrong.length) {
      refs.sortFeedback.show(
        'warning',
        '✕ 표시된 카드 <strong>' + wrong.length + '개</strong>를 다시 볼까요?<br />' +
          wrong
            .map(function (card) {
              return '<strong>' + ui.escapeHtml(card.label) + '</strong> — ' + card.why;
            })
            .join('<br />')
      );
    } else {
      refs.sortFeedback.show(
        'success',
        '여덟 카드를 모두 알맞게 분류했어요. <strong>값 · 상태는 속성</strong>, ' +
          '<strong>동작은 메소드</strong>입니다.',
        '🎉'
      );
    }
  }

  function buildSort(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '① 대상 분석',
        title: '반려동물에서 공통으로 표현할 것 고르기',
        sub: '강아지 · 고양이 · 앵무새 · 햄스터가 공통으로 가지는 것을 속성과 기능으로 나눠 봅시다.',
        notice: '카드를 끌어다 놓거나, 카드 안의 버튼을 눌러도 됩니다.'
      })
    );

    body.appendChild(
      el(
        'div',
        { 'class': 'pet-targets' },
        PET.TARGET_CARDS.map(function (card) {
          return el('div', { 'class': 'pet-target' }, [
            el('span', { 'class': 'pet-target__icon', text: card.icon, attrs: { 'aria-hidden': 'true' } }),
            el('span', { 'class': 'pet-target__name', text: card.animal }),
            el('span', { 'class': 'pet-target__sound', text: card.sound })
          ]);
        })
      )
    );

    refs.zones = {};
    var boards = [];
    PET.SORT_ZONES.forEach(function (zone) {
      var made = makeZone({
        value: zone.value,
        title: zone.title,
        hint: zone.hint,
        icon: zone.icon,
        className: 'sortzone--' + zone.value
      });
      refs.zones[zone.value] = made;
      boards.push(made.root);
    });
    body.appendChild(el('div', { 'class': 'sort-board' }, boards));

    refs.pool = makeZone({
      value: null,
      title: '아직 고르지 않은 카드',
      hint: '여기 있는 카드를 위의 두 칸으로 옮기세요.',
      icon: '🃏',
      className: 'sortzone--pool'
    });
    body.appendChild(refs.pool.root);

    refs.sortFeedback = ui.createFeedback({ emptyText: '카드를 옮기면 이곳에 안내가 표시돼요.' });
    body.appendChild(refs.sortFeedback.root);
  }

  /* ================================================================== */
  /* ② 클래스 설계판과 확장 예비 선택 (명세 7.2)                              */
  /* ================================================================== */
  function togglePlan(key) {
    var plan = st().plan || (st().plan = []);
    var i = plan.indexOf(key);
    if (i === -1) plan.push(key);
    else plan.splice(i, 1);

    // 명세 7.2 : 화면 5 에서 바꿀 수 있다. 아직 확장 작업을 시작하지 않았다면 미리 반영해 둔다.
    var step5 = L.state.appState.step5;
    if (!step5.ran) step5.project.extensions = plan.slice();

    paintPlan();
    L.state.markChanged();
  }

  function paintPlan() {
    if (!refs.planItems) return;
    var plan = st().plan || [];
    refs.planItems.forEach(function (item) {
      var on = plan.indexOf(item.key) !== -1;
      item.input.checked = on;
      item.root.classList.toggle('is-selected', on);
    });
    paintCustomList();

    // 고른 카드와 «직접 만든 것»을 함께 센다(명세 7.2 : 두 가지 이상).
    var custom = PET.customCount(petProject());
    var total = plan.length + custom;
    var ok = total >= 2;
    refs.planNote.textContent = ok
      ? '✓ ' + total + '가지를 정했어요' +
        (custom ? ' (직접 만든 것 ' + custom + '개 포함)' : '') + '. 화면 5 에서 바꿀 수 있어요.'
      : '두 가지 이상 정해 주세요. (지금 ' + total + '개) 카드를 고르거나 직접 만들어도 돼요.';
    refs.planNote.classList.toggle('is-ok', ok);
  }

  function buildBlueprint(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '② 클래스 설계판',
        title: 'Pet 클래스 설계도 확인하기',
        sub: '오늘 만들 클래스의 기본 뼈대입니다. 확장 항목은 화면 5 에서 직접 구현합니다.',
        divided: true
      })
    );

    body.appendChild(
      el('div', { 'class': 's2-blueprint' }, [
        el('p', { 'class': 's2-blueprint__title', text: '설계판' }),
        ui.dataTable({
          head: ['구분', '내용'],
          caption: 'Pet 클래스 설계판',
          rows: PET.DESIGN_BOARD.map(function (row) {
            return [row[0], '<code>' + ui.escapeHtml(row[1]) + '</code>'];
          })
        })
      ])
    );

    body.appendChild(
      ui.sectionTitle('예비 선택', '오늘 추가하고 싶은 확장을 두 가지 이상 고르세요')
    );

    refs.planItems = [];
    var grid = el(
      'div',
      { 'class': 'extpick', attrs: { role: 'group', 'aria-label': '확장 예비 선택' } },
      PET.EXTENSIONS.map(function (ext) {
        var input = el('input', {
          type: 'checkbox',
          attrs: { 'aria-label': ext.label + ' — ' + ext.desc }
        });
        var root = el('label', { 'class': 'extpick__item' }, [
          input,
          el('span', { 'class': 'extpick__body' }, [
            el('span', { 'class': 'extpick__head' }, [
              el('span', { 'class': 'extpick__icon', text: ext.icon, attrs: { 'aria-hidden': 'true' } }),
              el('span', { 'class': 'extpick__label', text: ext.label }),
              el('span', {
                'class': 'extpick__type',
                text: ext.type === 'attr' ? '속성' : ext.type === 'method' ? '메소드' : '조건 분기'
              })
            ]),
            el('span', { 'class': 'extpick__desc', text: ext.desc })
          ])
        ]);
        input.addEventListener('change', function () {
          togglePlan(ext.key);
        });
        refs.planItems.push({ key: ext.key, input: input, root: root });
        return root;
      })
    );
    body.appendChild(grid);

    body.appendChild(buildCustomBox());

    refs.planNote = el('p', { 'class': 'extpick__note', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.planNote);
  }

  /* ---------------- 직접 만들기 (명세 7.2 · 10.2) ---------------- */

  /** 화면 5 와 «같은 자료»를 고친다. 여기서 만든 것이 화면 5 에 그대로 나타난다. */
  function petProject() {
    var step5 = L.state.appState.step5;
    if (!step5.project) step5.project = PET.defaultProject();
    return step5.project;
  }

  function buildCustomBox() {
    var message = el('p', { 'class': 'custombox__msg', attrs: { 'aria-live': 'polite' } });

    function add(kind, field) {
      var name = String(field.getValue() || '').trim();
      var result =
        kind === 'property'
          ? PET.addCustomProperty(petProject(), name)
          : PET.addCustomMethod(petProject(), name);
      if (!result.ok) {
        message.className = 'custombox__msg is-no';
        message.textContent = '✕ ' + result.message;
        field.input.focus();
        return;
      }
      field.setValue('');
      message.className = 'custombox__msg is-ok';
      message.textContent =
        '✓ ' + name + (kind === 'property' ? ' 속성을 적어 두었어요.' : '() 기능을 적어 두었어요.') +
        ' 화면 5 에서 내용을 채웁니다.';
      paintPlan();
      L.state.markChanged();
    }

    var propField = ui.textField({
      id: 's2-custom-prop',
      label: '속성 이름 (영문)',
      placeholder: '예) weight',
      maxLength: PET.CUSTOM_NAME_MAX,
      onEnter: function () {
        add('property', propField);
      }
    });
    var methodField = ui.textField({
      id: 's2-custom-method',
      label: '기능 이름 (영문)',
      placeholder: '예) sleep',
      maxLength: PET.CUSTOM_NAME_MAX,
      onEnter: function () {
        add('method', methodField);
      }
    });

    refs.customList = el('div', { 'class': 'customlist' });

    return el('section', { 'class': 'custombox' }, [
      el('p', { 'class': 'custombox__title' }, [
        el('span', { text: '✏️ ', attrs: { 'aria-hidden': 'true' } }),
        el('span', { text: '직접 만들기 — 내가 지은 이름으로 더하기' })
      ]),
      el('p', {
        'class': 'custombox__hint',
        html:
          '위 카드에 없는 속성과 기능도 직접 만들 수 있어요. 이름은 <strong>영문자</strong>로 시작하고 ' +
          '<strong>영문자 · 숫자 · 밑줄(_)</strong> 만 씁니다. ' +
          '(예 : 속성 <code>weight</code> · <code>color</code>, 기능 <code>sleep</code> · <code>walk</code>)<br />' +
          '여기서 이름만 정해 두고, <strong>화면 5</strong> 에서 실제 값과 출력 문장을 채웁니다.'
      }),
      el('div', { 'class': 'customadd' }, [
        el('div', { 'class': 'customadd__row' }, [
          propField.root,
          ui.button({
            label: '+ 속성 만들기',
            variant: 'secondary',
            onClick: function () {
              add('property', propField);
            }
          })
        ]),
        el('div', { 'class': 'customadd__row' }, [
          methodField.root,
          ui.button({
            label: '+ 기능 만들기',
            variant: 'secondary',
            onClick: function () {
              add('method', methodField);
            }
          })
        ])
      ]),
      message,
      refs.customList
    ]);
  }

  function paintCustomList() {
    if (!refs.customList) return;
    ui.clear(refs.customList);

    var items = petProject()
      .customProperties.map(function (p) {
        return { kind: 'property', name: p.name, type: '값' };
      })
      .concat(
        petProject().customMethods.map(function (m) {
          return { kind: 'method', name: m.name, type: '기능' };
        })
      );

    if (!items.length) {
      refs.customList.appendChild(
        el('p', {
          'class': 'customlist__empty',
          text: '아직 직접 만든 것이 없어요. 위 카드에서 골라도 되고, 여기서 새로 만들어도 돼요.'
        })
      );
      return;
    }

    items.forEach(function (item) {
      refs.customList.appendChild(
        el('div', { 'class': 'customchip' }, [
          el('span', { 'class': 'customchip__type', text: item.type }),
          el('code', {
            'class': 'customchip__name',
            text: item.kind === 'method' ? item.name + '()' : item.name
          }),
          el('span', { 'class': 'customchip__state', text: '화면 5 에서 채워요' }),
          el('button', {
            type: 'button',
            'class': 'customchip__del',
            text: '✕',
            attrs: { 'aria-label': item.name + ' 지우기' },
            on: {
              click: function () {
                if (item.kind === 'property') PET.removeCustomProperty(petProject(), item.name);
                else PET.removeCustomMethod(petProject(), item.name);
                paintPlan();
                L.state.markChanged();
              }
            }
          })
        ])
      );
    });
  }

  /* ================================================================== */
  /* ③ 객체 지향 네 가지 특징 (명세 7.3)                                     */
  /* ================================================================== */
  var conceptIndex = 0;

  function markSeen(key) {
    var seen = st().conceptSeen || (st().conceptSeen = []);
    if (seen.indexOf(key) === -1) seen.push(key);
  }

  function conceptDone() {
    return PET.OOP_CARDS.every(function (card) {
      return (
        (st().conceptSeen || []).indexOf(card.key) !== -1 && st().conceptPicks[card.key] === card.answer
      );
    });
  }

  function paintConcept() {
    if (!refs.conceptBody) return;
    var card = PET.OOP_CARDS[conceptIndex];
    markSeen(card.key);

    ui.clear(refs.conceptBody);
    refs.conceptCounter.textContent = conceptIndex + 1 + ' / ' + PET.OOP_CARDS.length;

    refs.conceptBody.appendChild(
      el('div', { 'class': 'cdef-card oop-card' }, [
        el('p', { 'class': 'cdef-card__name' }, [
          el('span', { text: card.icon + ' ', attrs: { 'aria-hidden': 'true' } }),
          el('span', { text: card.name })
        ]),
        el('p', { 'class': 'cdef-card__def', text: card.easy }),
        el('p', { 'class': 'cdef-card__ex', html: '💡 ' + card.example })
      ])
    );

    var picked = st().conceptPicks[card.key] || null;
    refs.conceptBody.appendChild(el('p', { 'class': 'bigq', html: card.ask }));

    var buttons = [];
    refs.conceptBody.appendChild(
      el(
        'div',
        { 'class': 'options options--row', attrs: { role: 'group', 'aria-label': '확인 질문 보기' } },
        PET.oopOptions().map(function (opt, i) {
          var chosen = picked === opt.value;
          var btn = el(
            'button',
            {
              type: 'button',
              'class':
                'option' +
                (chosen ? ' is-selected' : '') +
                (chosen && opt.value === card.answer ? ' is-correct' : '') +
                (chosen && opt.value !== card.answer ? ' is-wrong' : ''),
              attrs: { 'aria-label': CIRCLED[i] + '번 ' + opt.label }
            },
            [
              el('span', { 'class': 'option__num', text: CIRCLED[i] }),
              el('span', { 'class': 'option__text', text: opt.label }),
              el('span', {
                'class': 'option__mark',
                text: !chosen ? '' : opt.value === card.answer ? '○ 정답' : '✕ 다시'
              })
            ]
          );
          btn.addEventListener('click', function () {
            st().conceptPicks[card.key] = opt.value;
            st().conceptDone = conceptDone();
            L.state.markChanged();
            paintConcept();
            paintConceptNote();
          });
          buttons.push(btn);
          return btn;
        })
      )
    );

    refs.btnPrevConcept.disabled = conceptIndex === 0;
    refs.btnNextConcept.disabled = conceptIndex === PET.OOP_CARDS.length - 1;
    paintConceptNote();
  }

  function paintConceptNote() {
    var card = PET.OOP_CARDS[conceptIndex];
    var picked = st().conceptPicks[card.key] || null;
    var done = conceptDone();
    st().conceptDone = done;

    if (picked === card.answer) {
      refs.conceptFeedback.show(
        'success',
        '○ 맞았어요. 이 사례는 <strong>' + card.name + '</strong> 입니다.' +
          (done
            ? ' 네 카드를 모두 확인했어요.'
            : ' 다음 카드로 넘어가 볼까요?')
      );
    } else if (picked) {
      refs.conceptFeedback.show(
        'warning',
        '✕ 다시 생각해 볼까요? 위 카드의 설명과 사례를 다시 읽어 보세요.'
      );
    } else {
      refs.conceptFeedback.show('info', '카드를 읽고 확인 질문에 답해 보세요.');
    }

    var left = PET.OOP_CARDS.filter(function (c) {
      return st().conceptPicks[c.key] !== c.answer;
    }).length;
    refs.conceptProgress.textContent = done
      ? '✓ 네 특징을 모두 확인했어요.'
      : '남은 카드 ' + left + '개 — 네 카드의 확인 질문을 모두 맞히면 완료돼요.';
    refs.conceptProgress.classList.toggle('is-ok', done);
  }

  function buildConcepts(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '③ 객체 지향의 네 특징',
        title: '한 장씩 넘겨 보며 생활 사례로 이해하기',
        sub: '정의를 외우지 않습니다. 오늘은 «의미와 사례»만 연결해 봅니다.',
        divided: true
      })
    );

    refs.conceptCounter = el('span', { 'class': 'quiz__counter', text: '1 / 4' });
    refs.btnPrevConcept = ui.button({
      label: '← 이전 카드',
      variant: 'secondary',
      onClick: function () {
        if (conceptIndex > 0) {
          conceptIndex -= 1;
          paintConcept();
        }
      }
    });
    refs.btnNextConcept = ui.button({
      label: '다음 카드 →',
      variant: 'secondary',
      onClick: function () {
        if (conceptIndex < PET.OOP_CARDS.length - 1) {
          conceptIndex += 1;
          paintConcept();
        }
      }
    });

    body.appendChild(el('div', { 'class': 'quiz__meta' }, [refs.conceptCounter]));
    refs.conceptBody = el('div', { 'class': 'stack' });
    body.appendChild(refs.conceptBody);
    body.appendChild(ui.buttonRow([refs.btnPrevConcept, refs.btnNextConcept]));
    refs.conceptFeedback = ui.createFeedback({ emptyText: '카드를 읽고 확인 질문에 답해 보세요.' });
    body.appendChild(refs.conceptFeedback.root);
    refs.conceptProgress = el('p', { 'class': 'extpick__note', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.conceptProgress);
    body.appendChild(
      ui.callout(
        '이번 차시에서는 <strong>상속과 오버라이딩 문법을 직접 구현하지 않습니다.</strong> ' +
          '오늘의 구현 목표는 <strong>클래스 · 속성 · 메소드 · 여러 인스턴스 · 객체별 결과</strong>입니다.',
        { muted: true }
      )
    );
  }

  /* ================================================================== */
  /* ④ 설계 확인 질문 (명세 7.4)                                            */
  /* ================================================================== */
  function paintReasons() {
    if (!refs.reasonRows) return;
    var wrong = 0;
    var blank = 0;
    refs.reasonRows.forEach(function (row) {
      var picked = st().reasons[row.def.key] || '';
      row.select.setValue(picked);
      if (!picked) {
        blank += 1;
        row.mark.textContent = '';
        row.mark.className = 'reason__mark';
        return;
      }
      var ok = picked === row.def.answer;
      if (!ok) wrong += 1;
      row.mark.textContent = ok ? '○ 알맞아요' : '✕ 다시';
      row.mark.className = 'reason__mark ' + (ok ? 'is-ok' : 'is-no');
    });

    var done = blank === 0 && wrong === 0;
    st().reasonDone = done;
    if (blank) {
      refs.reasonFeedback.show('info', '네 줄의 근거를 모두 골라 주세요. (남은 ' + blank + '줄)');
    } else if (wrong) {
      refs.reasonFeedback.show(
        'warning',
        '다시 볼 줄이 ' + wrong + '개 있어요. <strong>값 · 상태</strong>인지 ' +
          '<strong>객체가 수행하는 동작</strong>인지 구분해 보세요.'
      );
    } else {
      refs.reasonFeedback.show(
        'success',
        '좋아요. <code>name</code> · <code>animal</code> 은 <strong>값</strong>이므로 속성이고, ' +
          '<code>sound()</code> · <code>introduce()</code> 는 <strong>동작</strong>이므로 메소드입니다.',
        '🎉'
      );
    }
  }

  function buildReasons(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '④ 설계 확인',
        title: 'name 은 왜 속성이고 introduce() 는 왜 메소드일까?',
        sub: '각 줄에 알맞은 근거를 연결해 보세요.',
        divided: true
      })
    );

    refs.reasonRows = [];
    var table = el('div', { 'class': 'reason-table' });
    PET.REASON_ROWS.forEach(function (def) {
      var mark = el('span', { 'class': 'reason__mark', attrs: { 'aria-live': 'polite' } });
      var select = ui.selectField({
        id: 'reason-' + def.key,
        value: st().reasons[def.key] || '',
        options: [{ value: '', label: '근거를 고르세요' }].concat(
          PET.REASON_OPTIONS.map(function (o) {
            return { value: o.value, label: o.label };
          })
        ),
        label: null,
        onChange: function (value) {
          st().reasons[def.key] = value;
          paintReasons();
          L.state.markChanged();
        }
      });
      table.appendChild(
        el('div', { 'class': 'reason-row' }, [
          el('code', { 'class': 'reason__left', text: def.left }),
          el('span', { 'class': 'reason__kind', text: def.kind }),
          select.root,
          mark
        ])
      );
      refs.reasonRows.push({ def: def, select: select, mark: mark });
    });
    body.appendChild(table);

    refs.reasonFeedback = ui.createFeedback({ emptyText: '근거를 고르면 이곳에 안내가 표시돼요.' });
    body.appendChild(refs.reasonFeedback.root);
  }

  /* ================================================================== */
  function paint() {
    paintSort();
    paintPlan();
    paintConcept();
    paintReasons();
  }

  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 2,
        title: C.STEP_TITLES[2],
        lead: [
          '실생활의 반려동물을 살펴보고 <strong>공통 속성과 기능</strong>을 뽑아 <code>Pet</code> 클래스를 설계합니다.',
          '객체 지향의 네 가지 특징은 <strong>생활 사례</strong>로만 가볍게 확인합니다.'
        ]
      })
    );

    var main = ui.panel({ title: '반려동물 클래스 설계', className: 'step2-main' });
    buildSort(main.body);
    buildBlueprint(main.body);
    buildConcepts(main.body);
    buildReasons(main.body);
    root.appendChild(main.root);

    paint();
  }

  L.registerStep(2, {
    title: C.STEP_TITLES[2],
    short: C.STEP_SHORTS[2],
    render: render,
    onEnter: paint
  });
})();
    </script>
    <script data-from="js/62-step3.js">
/**
 * 화면 3 — 기본 Pet 클래스 완성 (명세 8장)
 *
 *   ① 들여쓰기 층 안내 (0~3단계 · 명세 8.2)
 *   ② 네 구역 코드 조립 + 조립한 코드 미리 보기 (명세 8.2)
 *   ③ 조건 분기 시뮬레이션 — 검사 중인 조건 · True/False · 검사하지 않은 조건 (명세 8.3)
 *
 * 네 구역을 모두 알맞게 고르면 기본 클래스 완성으로 본다.
 * 잘못 고른 조각은 무엇이 어긋났는지 그 자리에서 알려 준다(파이썬을 실행하지 않는다 · 명세 22장).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var PET = L.pet;

  var refs = {};

  function st() {
    return L.state.appState.step3;
  }

  /* ================================================================== */
  /* ② 네 구역 코드 조립 (명세 8.2)                                          */
  /* ================================================================== */
  function pickZone(zoneKey, optionId) {
    st().picks[zoneKey] = optionId;
    paintZones();
    L.state.markChanged();
  }

  function buildZones(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '② 코드 조립',
        title: '네 구역을 하나씩 완성하기',
        sub: '구역마다 «올바른 조각 하나»가 있습니다. 들여쓰기와 self 를 잘 살펴보세요.',
        notice: '네 구역을 모두 알맞게 고르면 기본 클래스가 완성돼요.'
      })
    );

    refs.zoneNodes = {};
    PET.ZONES.forEach(function (zone) {
      var opts = el('div', {
        'class': 'zone__opts',
        attrs: { role: 'radiogroup', 'aria-label': zone.no + ' ' + zone.title }
      });
      var buttons = [];

      zone.options.forEach(function (option) {
        var btn = el(
          'button',
          {
            type: 'button',
            'class': 'zopt',
            dataset: { id: option.id },
            attrs: { 'aria-label': zone.title + ' 보기 — ' + option.lines.join(' / ') }
          },
          [
            el('span', { 'class': 'zopt__mark', text: '' }),
            el('pre', { 'class': 'zopt__code', text: option.lines.join('\n') })
          ]
        );
        btn.addEventListener('click', function () {
          pickZone(zone.key, option.id);
        });
        buttons.push({ id: option.id, node: btn, option: option });
        opts.appendChild(btn);
      });

      var note = el('p', { 'class': 'zone__note', attrs: { 'aria-live': 'polite' } });
      body.appendChild(
        el('section', { 'class': 'zone' }, [
          el('div', { 'class': 'zone__head' }, [
            el('span', { 'class': 'zone__no', text: zone.no }),
            el('span', { 'class': 'zone__title', text: zone.title }),
            el('span', { 'class': 'zone__hint', text: zone.hint })
          ]),
          opts,
          note
        ])
      );
      refs.zoneNodes[zone.key] = { buttons: buttons, note: note, opts: opts };
    });

    refs.assembled = L.codeview.createCodeView({
      title: '조립한 코드',
      showLineNumbers: true,
      ariaLabel: '조립한 Pet 클래스 코드',
      lines: []
    });
    body.appendChild(refs.assembled.root);

    refs.zoneFeedback = ui.createFeedback({ emptyText: '구역을 고르면 이곳에 안내가 표시돼요.' });
    body.appendChild(refs.zoneFeedback.root);

    // 코드 조각의 «실제 너비»를 재어 한 줄에 몇 개를 놓을지 정한다.
    // 조각마다 가로 스크롤이 생기면 세 코드를 나란히 비교할 수 없다.
    window.addEventListener('resize', ui.debounce(fitZoneOptions, 200));
  }

  /**
   * 구역마다 «가장 긴 코드 조각»의 너비를 재어 칸 최소 너비(--zopt-min)로 정한다.
   * 짧은 구역은 세 조각이 한 줄에 들어가고, 긴 구역은 한 줄에 하나씩 놓여
   * 어느 조각도 가로로 잘리지 않는다.
   *
   * ★ 화면에 있는 <pre> 의 scrollWidth 를 그냥 재면 «칸 너비»가 섞여 들어온다.
   *   (내용이 칸보다 좁으면 scrollWidth 가 칸 너비를 돌려준다)
   *   그대로 쓰면 잴 때마다 칸이 조금씩 넓어지는 되먹임이 생기므로,
   *   폭 제한이 없는 «보이지 않는 자»를 따로 두고 «글자 자체»의 너비만 잰다.
   */
  function fitZoneOptions() {
    if (!refs.zoneNodes) return;

    var ruler = el('pre', {
      'class': 'zopt__code',
      style: {
        position: 'absolute',
        left: '-9999px',
        top: '0',
        visibility: 'hidden',
        width: 'auto',
        maxWidth: 'none',
        overflow: 'visible',
        whiteSpace: 'pre'
      },
      attrs: { 'aria-hidden': 'true' }
    });

    PET.ZONES.forEach(function (zone) {
      var box = refs.zoneNodes[zone.key];
      if (!box || !box.opts) return;
      box.opts.appendChild(ruler);

      var widest = 0;
      zone.options.forEach(function (option) {
        ruler.textContent = option.lines.join('\n');
        widest = Math.max(widest, ruler.scrollWidth);
      });
      box.opts.removeChild(ruler);

      if (!widest) return;
      // 글자 너비 + 조각의 안쪽 여백
      box.opts.style.setProperty('--zopt-min', Math.ceil(widest) + 32 + 'px');
    });
  }

  function paintZones() {
    if (!refs.zoneNodes) return;
    var check = PET.checkZones(st().picks);

    check.zones.forEach(function (zoneResult) {
      var box = refs.zoneNodes[zoneResult.key];
      if (!box) return;
      box.buttons.forEach(function (item) {
        var chosen = item.id === zoneResult.id;
        item.node.classList.toggle('is-selected', chosen);
        item.node.classList.toggle('is-correct', chosen && item.option.ok);
        item.node.classList.toggle('is-wrong', chosen && !item.option.ok);
        var mark = item.node.querySelector('.zopt__mark');
        if (mark) mark.textContent = !chosen ? '' : item.option.ok ? '○ 알맞아요' : '✕ 다시';
      });
      if (!zoneResult.id) {
        box.note.textContent = '';
        box.note.className = 'zone__note';
      } else if (zoneResult.ok) {
        box.note.className = 'zone__note is-ok';
        box.note.textContent = '○ 이 구역을 알맞게 골랐어요.';
      } else {
        box.note.className = 'zone__note is-no';
        box.note.innerHTML = '✕ ' + zoneResult.why;
      }
    });

    refs.assembled.setLines(
      PET.zonesToCode(st().picks).map(function (line) {
        return { code: line };
      })
    );

    st().zonesDone = check.ok;

    if (check.filled < check.total) {
      refs.zoneFeedback.show(
        'info',
        '남은 구역 <strong>' + (check.total - check.filled) + '개</strong>. 네 구역을 모두 고르면 테스트할 수 있어요.'
      );
    } else if (!check.ok) {
      refs.zoneFeedback.show(
        'warning',
        '<strong>다시 볼 구역</strong><br />' + check.problems.join('<br />')
      );
    } else {
      refs.zoneFeedback.show(
        'success',
        '네 구역을 모두 알맞게 골랐어요. <strong>기본 클래스가 완성</strong>되었습니다. ' +
          '아래 시뮬레이션으로 <code>sound()</code> 가 어떻게 갈라지는지 확인해 보세요.',
        '🎉'
      );
    }
  }

  /* ================================================================== */
  /* ③ 조건 분기 시뮬레이션 (명세 8.3)                                       */
  /* ================================================================== */

  /** sound() 코드 뷰의 줄 자리 — 조건 줄과 print 줄을 짝지어 둔다. */
  var SOUND_VIEW = (function () {
    var lines = [{ code: '    def sound(self):' }];
    var map = [];
    PET.SOUND_RULES.forEach(function (rule, i) {
      map.push({ cond: lines.length, print: lines.length + 1 });
      lines.push({ code: '        ' + (i === 0 ? 'if' : 'elif') + ' self.animal == "' + rule.animal + '":' });
      lines.push({ code: '            print("' + rule.sound + '")' });
    });
    map.push({ cond: lines.length, print: lines.length + 1 });
    lines.push({ code: '        else:' });
    lines.push({ code: '            print("' + PET.UNKNOWN_SOUND + '")' });
    return { lines: lines, map: map };
  })();

  function buildSim(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '③ 조건 분기 시뮬레이션',
        title: 'self.animal 값에 따라 어느 print() 가 실행될까?',
        sub: '동물을 고르고 실행하면 검사한 조건과 검사하지 않은 조건이 함께 표시됩니다.',
        divided: true
      })
    );

    refs.animalChips = ui.chipRow({
      values: PET.ANIMAL_CHOICES,
      ariaLabel: 'self.animal 값 고르기',
      onSelect: function (value) {
        st().simAnimal = value;
        refs.animalChips.setActive(value);
        runSim();
        L.state.markChanged();
      }
    });

    refs.simCode = L.codeview.createCodeView({
      title: 'sound() 메소드',
      showLineNumbers: false,
      ariaLabel: 'sound 메소드 코드',
      lines: SOUND_VIEW.lines
    });

    refs.simSteps = el('div', { 'class': 'condsteps', attrs: { 'aria-live': 'polite' } });
    refs.simConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '동물을 고르고 [조건 검사 실행] 을 누르면 결과가 표시돼요.',
      ariaLabel: 'sound 메소드 실행 결과'
    });

    var codeArea = el('div', { 'class': 'stack simcol simcol--code' }, [
      el('div', { 'class': 'condstate' }, [
        el('span', { 'class': 'condstate__label', text: '현재 self.animal' }),
        (refs.simCurrent = el('code', { 'class': 'condstate__value', text: '강아지' }))
      ]),
      refs.simCode.root
    ]);
    var stateArea = el('div', { 'class': 'stack simcol simcol--state' }, [
      el('p', { 'class': 'simcol__title', text: '조건 검사' }),
      refs.simSteps
    ]);
    var outArea = el('div', { 'class': 'stack simcol simcol--out' }, [refs.simConsole.root]);

    // 명세 21장 : 768px 미만에서는 한 구역씩 탭으로 보여 준다.
    refs.simTabs = ui.mobileTabs({
      ariaLabel: '조건 분기 구역 전환',
      items: [
        { id: 'code', label: '코드', node: codeArea },
        { id: 'state', label: '조건 검사', node: stateArea },
        { id: 'out', label: '출력', node: outArea }
      ]
    });

    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '▶ 조건 검사 실행', onClick: runSim }),
        ui.button({
          label: '↺ 지우기',
          variant: 'ghost',
          onClick: function () {
            st().simRan = false;
            refs.simCode.clearStates();
            ui.clear(refs.simSteps);
            refs.simConsole.clear();
            L.state.markChanged();
          }
        })
      ])
    );
    body.appendChild(refs.animalChips.root);
    // 코드는 넓게, 오른쪽에 「조건 검사」와 「출력」을 위아래로 둔다(명세 21장).
    body.appendChild(el('div', { 'class': 'simboard' }, [refs.simTabs.root]));
  }

  function runSim() {
    var animal = st().simAnimal || PET.ANIMAL_CHOICES[0];
    var result = PET.runSound(animal);
    st().simRan = true;

    refs.simCurrent.textContent = animal;
    refs.animalChips.setActive(animal);

    refs.simCode.clearStates();
    ui.clear(refs.simSteps);

    result.steps.forEach(function (step, i) {
      var place = SOUND_VIEW.map[i];
      if (step.result === 'true') {
        refs.simCode.setState(place.cond, 'done');
        refs.simCode.showBadge(place.cond, 'True ✓', 'true');
        refs.simCode.setState(place.print, 'running');
      } else if (step.result === 'false') {
        refs.simCode.setState(place.cond, 'done');
        refs.simCode.showBadge(place.cond, 'False ✕', 'false');
        refs.simCode.setState(place.print, 'skipped');
      } else {
        refs.simCode.setState(place.cond, 'unchecked');
        refs.simCode.setState(place.print, 'unchecked');
      }

      refs.simSteps.appendChild(
        el(
          'div',
          {
            'class':
              'condstep' +
              (step.result === 'true' ? ' is-true' : step.result === 'false' ? ' is-false' : ' is-unchecked')
          },
          [
            el('span', { 'class': 'condstep__kind', text: step.kind }),
            el('code', { 'class': 'condstep__cond', text: step.cond }),
            el('span', {
              'class': 'condstep__mark',
              text:
                step.result === 'true' ? 'True ✓' : step.result === 'false' ? 'False ✕' : '— 검사하지 않음'
            }),
            el('span', {
              'class': 'condstep__out',
              text: step.result === 'true' ? 'print("' + step.out + '") 실행' : ''
            })
          ]
        )
      );
    });

    refs.simConsole.clear();
    refs.simConsole.writeMuted('self.animal = "' + animal + '"');
    refs.simConsole.write(result.output);
    if (result.matchedIndex === -1) {
      refs.simConsole.writeHint(
        '위 조건이 모두 거짓이므로 else 의 print() 가 실행됩니다.'
      );
    } else {
      refs.simConsole.writeHint(
        '조건 ' + (result.matchedIndex + 1) + '번이 참이 되면 그 아래 조건은 «검사하지 않습니다».'
      );
    }
    ui.announce(animal + ' 의 울음소리는 ' + result.output + ' 입니다.');
    L.state.markChanged();
  }

  /* ================================================================== */
  function paint() {
    refs.animalChips.setActive(st().simAnimal || PET.ANIMAL_CHOICES[0]);
    refs.simCurrent.textContent = st().simAnimal || PET.ANIMAL_CHOICES[0];
    paintZones();
    // 화면에 붙은 뒤에야 코드 너비를 잴 수 있다(첫 렌더 때는 0 이 나온다).
    fitZoneOptions();
    // 이 화면을 떠나 있는 동안 창 크기가 바뀌었을 수 있으므로 구역 배치를 다시 맞춘다.
    if (refs.simTabs && refs.simTabs.repaint) refs.simTabs.repaint();
  }

  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 3,
        title: C.STEP_TITLES[3],
        lead: [
          '<code>Pet</code> 클래스와 <code>sound()</code> · <code>introduce()</code> 를 완성합니다.',
          '들여쓰기는 <strong>0단계 → 1단계 → 2단계 → 3단계</strong> 로 깊어집니다. 세로 안내선을 함께 보세요.'
        ]
      })
    );

    var main = ui.panel({ title: '기본 Pet 클래스 완성', className: 'step3-main' });

    /* ① 들여쓰기 층 안내 */
    main.body.appendChild(
      ui.activityHeader({
        tag: '① 들여쓰기 층',
        title: '어느 깊이에 무엇이 오는가',
        sub: '깊이가 곧 «무엇에 속해 있는가» 를 나타냅니다.'
      })
    );
    main.body.appendChild(
      el(
        'ol',
        { 'class': 'levels' },
        PET.INDENT_LEVELS.map(function (item) {
          return el('li', { 'class': 'levels__item levels__item--' + item.level }, [
            el('span', { 'class': 'levels__no', text: item.label }),
            el('span', { 'class': 'levels__desc', text: item.desc })
          ]);
        })
      )
    );
    main.body.appendChild(
      L.codeview.createCodeView({
        title: '완성할 코드 (전체 모습)',
        showLineNumbers: true,
        ariaLabel: '완성할 Pet 클래스 코드',
        lines: PET.CLASS_CODE.map(function (line) {
          return { code: line };
        })
      }).root
    );
    main.body.appendChild(
      el(
        'ul',
        { 'class': 'hint-list' },
        PET.CLASS_NOTES.map(function (note) {
          return el('li', { html: '<strong>' + ui.escapeHtml(note.title) + '</strong> — ' + note.note });
        })
      )
    );

    buildZones(main.body);
    buildSim(main.body);
    root.appendChild(main.root);

    paint();
  }

  L.registerStep(3, {
    title: C.STEP_TITLES[3],
    short: C.STEP_SHORTS[3],
    render: render,
    onEnter: paint
  });
})();
    </script>
    <script data-from="js/63-step4.js">
/**
 * 화면 4 — 두 인스턴스 생성과 실행 (명세 9장)
 *
 *   ① 객체 생성 · 속성 변경 — [한 줄 실행] 로 시점별 상태 확인 (명세 9.1)
 *   ② 메소드 호출 — 출력 순서를 카드로 먼저 배열한 뒤 실행 (명세 9.2)
 *   ③ 호출 객체와 self — pet1 · pet2 를 번갈아 시각화 (명세 9.3)
 *   ④ 객체 독립성 실험 — pet1.name 만 "초롱" 으로 바꾼다 (명세 9.4)

 */
(function () {

  function st() {
    return L.state.appState.step4;
  }

  /* ------------------------------------------------------------------ */
  /* 공용 — 객체 카드                                                      */
  /* ------------------------------------------------------------------ */
  function objCard(name, obj, opts) {
    var o = opts || {};
    if (!obj) {
      return el('div', { 'class': 'objcard is-empty' }, [
        el('div', { 'class': 'objcard__head' }, [

    PET.BASE_PROPERTIES.forEach(function (key) {
      attrs.appendChild(
        el('div', { 'class': 'objattr' + (obj.isChanged(key) ? ' is-changed' : '') }, [
          el('span', { 'class': 'objattr__key', text: key }),
          el('span', { 'class': 'objattr__val', text: String(obj.get(key)) }),
          obj.isChanged(key)
            ? el('span', { 'class': 'obj-badge obj-badge--changed', text: '변경됨' })

  /* ================================================================== */
  /* ① 객체 생성과 속성 변경 (명세 9.1)                                      */

  function buildInstances(body) {

      ui.activityHeader({

    body.appendChild(

      ])

  }

  function stepInstance() {
    if (st().instStep >= PET.INSTANCE_SCRIPT.length - 1) {
      ui.toast('마지막 줄까지 실행했어요. [↺ 처음부터] 로 다시 볼 수 있어요.');
      return;
    }
    st().instStep += 1;
    // 빈 줄은 건너뛴다.
    while (
      st().instStep < PET.INSTANCE_SCRIPT.length - 1 &&
      !PET.INSTANCE_SCRIPT[st().instStep].act
    ) {
      st().instStep += 1;
    }
    if (st().instStep >= PET.INSTANCE_SCRIPT.length - 1) st().instDone = true;
    paintInstances();
    L.state.markChanged();
  }

  function runAllInstance() {
    st().instStep = PET.INSTANCE_SCRIPT.length - 1;
    st().instDone = true;
    paintInstances();
    L.state.markChanged();
  }

  function resetInstance() {
    st().instStep = -1;

      if (!line.act) return;

      else if (i === upto) refs.instCode.setState(i, 'running');
    });
    if (upto >= 0) refs.instCode.scrollToLine(upto);

    ui.clear(refs.instCards);
    refs.instCards.appendChild(
      objCard('pet1', run.objects.pet1, {
        highlight: run.lastAct && run.lastAct.object === 'pet1'
      })

    refs.instCards.appendChild(
      objCard('pet2', run.objects.pet2, {
        highlight: run.lastAct && run.lastAct.object === 'pet2'
      })
    );

    refs.instSay.textContent =
      upto < 0
        ? '[▶ 한 줄 실행] 을 누르면 한 줄씩 실행됩니다.'
        : PET.INSTANCE_SCRIPT[upto].say || '';

    // 시점별 상태 표 — 지금 시점의 줄을 강조한다(명세 9.1).
    var current = -1;
    PET.STATE_CHECKPOINTS.forEach(function (row, i) {
      if (upto >= row.upto) current = i;
    });
    ui.clear(refs.instTable);
    var table = el('table', { 'class': 'data-table' }, [
      el('caption', { 'class': 'sr-only', text: '시점별 두 객체의 상태' }),
      el('thead', {}, [
        el('tr', {}, [
          el('th', { scope: 'col', text: '시점' }),
          el('th', { scope: 'col', text: 'pet1' }),
          el('th', { scope: 'col', text: 'pet2' })
        ])
      ]),
      el(
        'tbody',
        {},
        PET.STATE_CHECKPOINTS.map(function (row, i) {
          return el('tr', { 'class': i === current ? 'is-current-row' : '' }, [
            el('th', { scope: 'row' }, [
              el('span', { text: row.label }),
              i === current ? el('span', { 'class': 'rowmark', text: ' ◀ 지금' }) : null
            ]),

          ]);
        })
      )
    ]);
    refs.instTable.appendChild(el('div', { 'class': 'table-scroll' }, [table]));
  }

  /* ================================================================== */
  /* ② 메소드 호출과 출력 순서 예측 (명세 9.2)                                */
  /* ================================================================== */
  function orderAnswer() {

      ])
    );
    refs.orderFeedback = ui.createFeedback({ emptyText: '카드를 눌러 순서를 배열해 보세요.' });
    body.appendChild(refs.orderFeedback.root);

    /* 실행 부분 */
    refs.callCode = L.codeview.createCodeView({
      title: '한 줄씩 실행',
      showLineNumbers: false,
      ariaLabel: '메소드 호출 한 줄 실행',
      lines: PET.CALL_SCRIPT.map(function (line) {
        return { code: line.code };
      })
    });
    refs.callConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '[▶ 한 줄 실행] 을 누르면 출력이 하나씩 나타나요.',
      ariaLabel: '메소드 호출 실행 결과'
    });
    refs.callSay = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });

    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '▶ 한 줄 실행', onClick: stepCall }),
        ui.button({ label: '⏭ 끝까지 실행', variant: 'secondary', onClick: runAllCall }),
        ui.button({
          label: '↺ 처음부터',
          variant: 'ghost',
          onClick: function () {
            st().callStep = -1;
            paintCalls();
            L.state.markChanged();
          }
        })
      ])
    );
    body.appendChild(
      el('div', { 'class': 'split' }, [
        el('div', { 'class': 'stack' }, [refs.callCode.root, refs.callSay]),
        el('div', { 'class': 'stack' }, [refs.callConsole.root])
      ])
    );
  }

  function placeCard(text) {
    var order = st().order || (st().order = []);
    if (order.indexOf(text) !== -1) return;
    if (order.length >= PET.ORDER_POOL.length) return;
    order.push(text);
    paintOrder();
    L.state.markChanged();
  }

  function removeCard(index) {
    var order = st().order || [];
    order.splice(index, 1);
    st().orderDone = false;
    paintOrder();
    L.state.markChanged();
  }

  function paintOrder() {
    if (!refs.orderSlots) return;
    var order = st().order || [];
    var answer = orderAnswer();

    ui.clear(refs.orderSlots);
    for (var i = 0; i < PET.ORDER_POOL.length; i += 1) {
      var text = order[i];
      var isSet = text !== undefined;
      var marked = st().orderDone && isSet;
      refs.orderSlots.appendChild(
        el(
          'li',
          {
            'class':
              'orderslot' +
              (isSet ? ' is-filled' : '') +
              (marked ? (text === answer[i] ? ' is-correct' : ' is-wrong') : '')
          },
          [
            el('span', { 'class': 'orderslot__no', text: String(i + 1) }),
            isSet
              ? el('span', { 'class': 'orderslot__text', text: text })
              : el('span', { 'class': 'orderslot__empty', text: '카드를 눌러 놓으세요' }),
            isSet
              ? (function (index) {
                  return el('button', {
                    type: 'button',
                    'class': 'orderslot__btn',
                    text: '↩',
                    attrs: { 'aria-label': index + 1 + '번 자리의 카드 빼기' },
                    on: {
                      click: function () {
                        removeCard(index);
                      }
                    }
                  });
                })(i)
              : null
          ]
        )
      );
    }

    ui.clear(refs.orderPool);
    var left = PET.ORDER_POOL.filter(function (text) {
      return order.indexOf(text) === -1;
    });
    if (!left.length) {
      refs.orderPool.appendChild(el('p', { 'class': 'orderpool__empty', text: '카드를 모두 놓았어요.' }));
    }
    left.forEach(function (text) {
      refs.orderPool.appendChild(
        el('button', {
          type: 'button',
          'class': 'ordercard',
          text: text,
          attrs: { 'aria-label': text + ' 카드를 다음 자리에 놓기' },
          on: {
            click: function () {
              placeCard(text);
            }
          }
        })
      );
    });

    refs.orderNote.textContent =
      order.length < PET.ORDER_POOL.length
        ? '남은 카드 ' + (PET.ORDER_POOL.length - order.length) + '개'
        : st().orderDone
        ? '✓ 순서를 맞혔어요.'
        : '네 자리를 모두 채웠어요. [순서 확인하기] 를 누르세요.';
    refs.orderNote.classList.toggle('is-ok', Boolean(st().orderDone));
  }

  function checkOrder() {
    var order = st().order || [];
    if (order.length < PET.ORDER_POOL.length) {
      refs.orderFeedback.show('info', '네 자리를 모두 채운 뒤 확인해 주세요.');
      return;
    }
    var answer = orderAnswer();
    var wrong = order.filter(function (text, i) {
      return text !== answer[i];
    }).length;
    st().orderDone = wrong === 0;
    paintOrder();
    L.state.markChanged();

    if (wrong === 0) {
      refs.orderFeedback.show(
        'success',
        '맞았어요. <code>introduce()</code> → <code>sound()</code> 순서로 호출했으므로 ' +
          '각 객체의 소개 뒤에 울음소리가 나옵니다.',
        '🎉'
      );
    } else {
      refs.orderFeedback.show(
        'warning',
        '자리가 어긋난 카드가 ' + wrong + '개 있어요.<br />' +
          '코드에 적힌 순서(<code>pet1.introduce()</code> → <code>pet1.sound()</code> → ' +
          '<code>pet2.introduce()</code> → <code>pet2.sound()</code>)를 다시 보세요.'
      );
    }
  }

  function stepCall() {
    if (st().callStep >= PET.CALL_SCRIPT.length - 1) {
      ui.toast('마지막 줄까지 실행했어요.');
      return;
    }
    st().callStep += 1;
    while (st().callStep < PET.CALL_SCRIPT.length - 1 && !PET.CALL_SCRIPT[st().callStep].act) {
      st().callStep += 1;
    }
    if (st().callStep >= PET.CALL_SCRIPT.length - 1) st().callDone = true;
    paintCalls();
    L.state.markChanged();
  }

  function runAllCall() {
    st().callStep = PET.CALL_SCRIPT.length - 1;
    st().callDone = true;
    paintCalls();
    L.state.markChanged();
  }

  function paintCalls() {
    if (!refs.callCode) return;
    var upto = st().callStep;
    var run = PET.runScript(PET.CALL_SCRIPT, upto, PET.PAIR);

    refs.callCode.clearStates();
    PET.CALL_SCRIPT.forEach(function (line, i) {
      if (!line.act) return;
      if (i < upto) refs.callCode.setState(i, 'done');
      else if (i === upto) refs.callCode.setState(i, 'running');
    });

    refs.callConsole.clear();
    run.output.forEach(function (line) {
      refs.callConsole.write(line);
    });
    refs.callSay.textContent =
      upto < 0 ? '[▶ 한 줄 실행] 을 누르면 출력이 하나씩 나타나요.' : PET.CALL_SCRIPT[upto].say || '';

    if (st().callDone && st().orderDone) {
      refs.orderFeedback.show(
        'success',
        '예측한 순서와 실행 결과가 같습니다. 같은 메소드라도 <strong>호출 객체의 속성값</strong>에 따라 결과가 달라집니다.',
        '🎉'
      );
    }
  }

  /* ================================================================== */
  /* ③ 호출 객체와 self (명세 9.3)                                          */
  /* ================================================================== */
  function buildSelf(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '③ 호출 객체와 self',
        title: '같은 코드가 왜 다른 결과를 낼까?',
        sub: 'pet1 과 pet2 를 번갈아 눌러 흐름을 끝까지 확인해 보세요.',
        divided: true
      })
    );

    refs.selfTabs = ui.tabs({
      ariaLabel: '호출 객체 전환',
      value: st().selfObject || 'pet1',
      items: [
        { id: 'pet1', label: 'pet1 (고양이 초코)' },
        { id: 'pet2', label: 'pet2 (강아지 구름)' }
      ],
      onChange: function (id) {
        st().selfObject = id;
        st().selfStep = -1;
        paintSelf();
        L.state.markChanged();
      }
    });
    body.appendChild(refs.selfTabs.root);

    refs.selfFlow = el('div', { 'class': 'selfflow' });
    body.appendChild(refs.selfFlow);
    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '▶ 다음 단계', onClick: stepSelf }),
        ui.button({
          label: '↺ 처음부터',
          variant: 'ghost',
          onClick: function () {
            st().selfStep = -1;
            paintSelf();
            L.state.markChanged();
          }
        })
      ])
    );
    refs.selfNote = el('p', { 'class': 'extpick__note', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.selfNote);
  }

  function stepSelf() {
    var flow = PET.selfFlow(st().selfObject || 'pet1');
    if (st().selfStep >= flow.length - 1) {
      ui.toast(
        L.state.selfDone()
          ? '두 객체의 흐름을 모두 확인했어요.'
          : '다른 객체 탭을 눌러 나머지 흐름도 확인해 보세요.'
      );
      return;
    }
    st().selfStep += 1;
    if (st().selfStep >= flow.length - 1) {
      var seen = st().selfSeen || (st().selfSeen = []);
      var name = st().selfObject || 'pet1';
      if (seen.indexOf(name) === -1) seen.push(name);
    }
    paintSelf();
    L.state.markChanged();
  }

  function paintSelf() {
    if (!refs.selfFlow) return;
    var name = st().selfObject || 'pet1';
    var flow = PET.selfFlow(name);
    refs.selfTabs.setValue(name);

    ui.clear(refs.selfFlow);
    flow.forEach(function (item, i) {
      refs.selfFlow.appendChild(
        el('div', { 'class': 'selfflow__item' + (i <= st().selfStep ? ' is-on' : '') }, [
          el('span', { 'class': 'selfflow__no', text: String(i + 1) }),
          el('div', {}, [
            el('p', { 'class': 'selfflow__title' }, [
              el('code', { 'class': 'selfflow__chip', text: item.chip }),
              el('span', { text: ' ' + item.title })
            ]),
            el('p', { 'class': 'selfflow__detail', html: item.detail })
          ])
        ])
      );
    });

    var seen = st().selfSeen || [];
    var done = L.state.selfDone();
    refs.selfNote.textContent = done
      ? '✓ pet1 · pet2 두 흐름을 모두 확인했어요.'
      : '확인한 객체 : ' + (seen.length ? seen.join(', ') : '없음') + ' — 두 객체 모두 끝까지 보세요.';
    refs.selfNote.classList.toggle('is-ok', done);
  }

  /* ================================================================== */
  /* ④ 객체 독립성 실험 (명세 9.4)                                          */
  /* ================================================================== */
  function buildIndep(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '④ 객체 독립성 실험',
        title: 'pet1.name 만 "초롱" 으로 바꾸면?',
        sub: 'pet2 의 "구름" 이 그대로 남는지 직접 확인해 보세요.',
        divided: true
      })
    );

    refs.indepCode = L.codeview.createCodeView({
      title: '실험 코드 (pet1 · pet2 는 이미 만들어져 있음)',
      showLineNumbers: false,
      ariaLabel: '객체 독립성 실험 코드',
      lines: PET.INDEP_SCRIPT.map(function (line) {
        return { code: line.code };
      })
    });
    refs.indepCards = el('div', { 'class': 'objcards' });
    refs.indepConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '[▶ 한 줄 실행] 을 누르면 결과가 나타나요.',
      ariaLabel: '객체 독립성 실험 결과'
    });
    refs.indepSay = el('p', { 'class': 'obj-note', attrs: { 'aria-live': 'polite' } });

    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '▶ 한 줄 실행', onClick: stepIndep }),
        ui.button({ label: '⏭ 끝까지 실행', variant: 'secondary', onClick: runAllIndep }),
        ui.button({
          label: '↺ 처음부터',
          variant: 'ghost',
          onClick: function () {
            st().indepStep = -1;
            paintIndep();
            L.state.markChanged();
          }
        })
      ])
    );
    body.appendChild(
      el('div', { 'class': 'split' }, [
        el('div', { 'class': 'stack' }, [refs.indepCode.root, refs.indepSay]),
        el('div', { 'class': 'stack' }, [refs.indepCards, refs.indepConsole.root])
      ])
    );
    refs.indepFeedback = ui.createFeedback({ emptyText: '실험을 끝까지 실행해 보세요.' });
    body.appendChild(refs.indepFeedback.root);
  }

  function stepIndep() {
    if (st().indepStep >= PET.INDEP_SCRIPT.length - 1) {
      ui.toast('마지막 줄까지 실행했어요.');
      return;
    }
    st().indepStep += 1;
    while (st().indepStep < PET.INDEP_SCRIPT.length - 1 && !PET.INDEP_SCRIPT[st().indepStep].act) {
      st().indepStep += 1;
    }
    if (st().indepStep >= PET.INDEP_SCRIPT.length - 1) st().indepDone = true;
    paintIndep();
    L.state.markChanged();
  }

  function runAllIndep() {
    st().indepStep = PET.INDEP_SCRIPT.length - 1;
    st().indepDone = true;
    paintIndep();
    L.state.markChanged();
  }

  function paintIndep() {
    if (!refs.indepCode) return;
    var upto = st().indepStep;
    var run = PET.runIndep(upto);

    refs.indepCode.clearStates();
    PET.INDEP_SCRIPT.forEach(function (line, i) {
      if (!line.act) return;
      if (i < upto) refs.indepCode.setState(i, 'done');
      else if (i === upto) refs.indepCode.setState(i, 'running');
    });

    ui.clear(refs.indepCards);
    refs.indepCards.appendChild(
      objCard('pet1', run.objects.pet1, { highlight: run.lastAct && run.lastAct.object === 'pet1' })
    );
    refs.indepCards.appendChild(
      objCard('pet2', run.objects.pet2, { highlight: run.lastAct && run.lastAct.object === 'pet2' })
    );

    refs.indepConsole.clear();
    run.output.forEach(function (line) {
      refs.indepConsole.write(line);
    });
    refs.indepSay.textContent =
      upto < 0 ? '[▶ 한 줄 실행] 을 누르면 한 줄씩 실행됩니다.' : PET.INDEP_SCRIPT[upto].say || '';

    if (st().indepDone) {
      refs.indepFeedback.show(
        'success',
        'pet1 의 소개만 <strong>초롱</strong> 으로 바뀌고, pet2 는 <strong>구름</strong> 을 그대로 유지했습니다.<br />' +
          '한 객체의 속성을 바꾸어도 <strong>다른 객체의 값은 자동으로 바뀌지 않습니다.</strong>',
        '🎉'
      );
    }
  }

  /* ================================================================== */
  /* ⑤ 결과 설명 (명세 9.5)                                                 */
  /* ================================================================== */
  function buildSentence(body) {
    body.appendChild(
      ui.activityHeader({
        tag: '⑤ 결과 설명',
        title: '왜 결과가 달랐을까?',
        sub: '빈칸에 알맞은 낱말을 넣어 문장을 완성해 보세요.',
        divided: true
      })
    );

    refs.sentenceInput = el('input', {
      type: 'text',
      'class': 'fillline__input',
      id: 'step4-sentence',
      value: st().sentence || '',
      maxLength: 20,
      attrs: { 'aria-label': '결과 설명 빈칸', autocomplete: 'off' }
    });
    refs.sentenceInput.addEventListener(
      'input',
      ui.debounce(function () {
        st().sentence = refs.sentenceInput.value;
        L.state.markChanged();
      }, 300)
    );

    body.appendChild(
      el('div', { 'class': 'fillline' }, [
        el('span', { 'class': 'fillline__text' }, [
          el('span', { text: PET.RESULT_SENTENCE.before }),
          refs.sentenceInput,
          el('span', { text: PET.RESULT_SENTENCE.after })
        ])
      ])
    );
    body.appendChild(
      ui.buttonRow([ui.button({ label: '문장 확인하기', variant: 'secondary', onClick: checkSentence })])
    );
    refs.sentenceFeedback = ui.createFeedback({ emptyText: '빈칸을 채운 뒤 확인해 보세요.' });
    body.appendChild(refs.sentenceFeedback.root);
  }

  function checkSentence() {
    var value = String(st().sentence || '').replace(/\s/g, '');
    var ok = PET.RESULT_SENTENCE.accepted.some(function (word) {
      return word.replace(/\s/g, '') === value;
    });
    st().sentenceOk = ok;
    L.state.markChanged();
    if (ok) {
      refs.sentenceFeedback.show('success', '맞았어요. ' + PET.RESULT_SENTENCE.why, '🎉');
    } else {
      refs.sentenceFeedback.show(
        'info',
        '조금 다른 낱말이에요. 두 객체가 서로 다르게 가지고 있던 것이 무엇이었는지 ' +
          '<strong>① 객체 카드</strong>를 다시 보세요. (두 글자 + 한 글자)'
      );
    }
  }

  /* ================================================================== */
  function paint() {
    paintInstances();
    paintOrder();
    paintCalls();
    paintSelf();
    paintIndep();
    if (refs.sentenceInput) refs.sentenceInput.value = st().sentence || '';
    if (st().sentenceOk) {
      refs.sentenceFeedback.show('success', '맞았어요. ' + PET.RESULT_SENTENCE.why, '🎉');
    }
  }

  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 4,
        title: C.STEP_TITLES[4],
        lead: [
          '같은 <code>Pet</code> 클래스로 <strong>pet1 · pet2 두 인스턴스</strong>를 만들고 실행합니다.',
          '같은 메소드라도 <code>self</code> 가 가리키는 객체에 따라 결과가 달라지는 것을 확인합니다.'
        ]
      })
    );

    var main = ui.panel({ title: '두 인스턴스 생성과 실행', className: 'step4-main' });
    buildInstances(main.body);
    buildCalls(main.body);
    buildSelf(main.body);
    buildIndep(main.body);
    buildSentence(main.body);
    root.appendChild(main.root);

    paint();
  }

  L.registerStep(4, {
    title: C.STEP_TITLES[4],
    short: C.STEP_SHORTS[4],
    render: render,
    onEnter: paint
  });
})();
    </script>
    <script data-from="js/64-step5.js">
/**
 * 화면 5 — 나만의 프로그램 확장 · 설명 (명세 10장)
 *
 * 학생이 «지금 무엇을 하면 되는지»를 언제나 알 수 있도록 네 단계로 안내한다.
 *
 *   0  만들기 순서 — 네 단계와 지금 상태를 한 줄로 (누르면 그 단계로 이동)
 *   1  무엇을 더 넣을지 고르기      (명세 10.1 확장 선택판)
 *   2  고른 기능의 내용 채우기      (명세 10.2 구조화된 입력)
 *   3  두 반려동물을 서로 다르게    (명세 10.3 객체별 값 + 객체별 호출)
 *   4  실행하고 설명하기           (명세 10.4 자동 확인 · 10.5 설명 5문항)
 *
 * 어려운 말(«구조 입력» · «자동 확인» 같은 이름)을 쓰지 않고,
 * 각 칸이 «무엇을 정하는 칸인지»와 «지금 어떤 결과가 나오는지»를 바로 옆에 보여 준다.
 *
 * 학생이 쓴 내용은 절대 실행하지 않는다. 고른 값으로 코드 문자열을 만들고,
 * 같은 값으로 결과를 흉내내어 보여 준다(명세 22장).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var PET = L.pet;
  var PROJ = L.project;

  var PETS = ['pet1', 'pet2'];

  var refs = {};
  var sections = {};

  function st() {
    return L.state.appState.step5;
  }

  function project() {
    if (!st().project) st().project = PET.defaultProject();
    return st().project;
  }

  function explain() {
    if (!st().explain) st().explain = {};
    return st().explain;
  }

  function hasExt(key) {
    return PET.hasExt(project(), key);
  }

  /** 확장 종류를 학생의 말로 */
  function kindLabel(type) {
    if (type === 'attr') return '값';
    return '기능';
  }

  /** 고르거나 직접 만든 «기능» 이름 */
  function pickedFeatures() {
    return project()
      .extensions.filter(function (key) {
        var ext = PET.extensionByKey(key);
        return ext && ext.type !== 'attr';
      })
      .map(function (key) {
        var ext = PET.extensionByKey(key);
        return ext.type === 'method' ? ext.name + '()' : ext.label.replace(/ 추가$/, '');
      })
      .concat(
        project().customMethods.map(function (m) {
          return m.name + '()';
        })
      );
  }

  /** 고르거나 직접 만든 «값(속성)» 이름 */
  function pickedValues() {
    return project()
      .extensions.filter(function (key) {
        var ext = PET.extensionByKey(key);
        return ext && ext.type === 'attr';
      })
      .map(function (key) {
        return PET.extensionByKey(key).name;
      })
      .concat(
        project().customProperties.map(function (p) {
          return p.name;
        })
      );
  }

  /* ================================================================== */
  /* 다시 그리기 갈래                                                     */
  /* ================================================================== */

  /** 값만 바뀌었을 때 — 미리보기 · 코드 · 점검표만 새로 그린다(입력 포커스를 지킨다). */
  function refresh(quiet) {
    var result = PROJ.checkProject(project(), explain());
    st().checksPassed = result.passed;

    paintFlow(result);
    paintPickSummary();
    paintCustomList();
    paintMethodPreviews();
    paintPetPreviews();
    paintCode(result);
    paintChecks(result);
    paintExplainCount(result);

    if (!quiet) L.state.markChanged();
    return result;
  }

  /** 고른 확장이 바뀌었을 때 — 입력 칸 구성 자체가 달라지므로 2·3단계를 다시 만든다. */
  function rebuild() {
    buildStep2Body(sections.step2Body);
    buildPetCards(sections.step3Body);
    paintExtCards();
    refresh();
  }

  /* ================================================================== */
  /* 0. 만들기 순서 (진행 안내)                                            */
  /* ================================================================== */
  var FLOW = [
    { key: 'pick', no: 1, name: '무엇을 더 넣을지 고르기' },
    { key: 'fill', no: 2, name: '기능 내용 채우기' },
    { key: 'pets', no: 3, name: '두 반려동물 정하기' },
    { key: 'run', no: 4, name: '실행하고 설명하기' }
  ];

  function buildFlow(body) {
    refs.flowItems = {};
    var list = el(
      'ol',
      { 'class': 'mkflow', attrs: { 'aria-label': '만들기 순서' } },
      FLOW.map(function (step) {
        var mark = el('span', { 'class': 'mkflow__no', text: String(step.no) });
        var state = el('span', { 'class': 'mkflow__state' });
        var node = el(
          'li',
          { 'class': 'mkflow__item' },
          [
            el(
              'button',
              {
                type: 'button',
                'class': 'mkflow__btn',
                attrs: { 'aria-label': step.no + '단계 ' + step.name + ' 으로 이동' },
                on: {
                  click: function () {
                    var target = sections[step.key];
                    if (target) ui.scrollToNode(target);
                  }
                }
              },
              [mark, el('span', { 'class': 'mkflow__name', text: step.name }), state]
            )
          ]
        );
        refs.flowItems[step.key] = { node: node, mark: mark, state: state, no: step.no };
        return node;
      })
    );
    body.appendChild(list);
  }

  function setFlow(key, done, text) {
    var item = refs.flowItems[key];
    if (!item) return;
    item.node.classList.toggle('is-done', done);
    item.mark.textContent = done ? '✓' : String(item.no);
    item.state.textContent = text;
  }

  function paintFlow(result) {
    var values = pickedValues();
    var features = pickedFeatures();
    var status = PROJ.extensionStatus(project());
    var undone = status.filter(function (s) {
      return !s.done;
    });

    setFlow(
      'pick',
      values.length > 0 && features.length > 0,
      values.length + features.length === 0
        ? '아직 고르지 않았어요'
        : '값 ' + values.length + '개 · 기능 ' + features.length + '개'
    );

    setFlow(
      'fill',
      features.length > 0 && undone.length === 0,
      features.length === 0 ? '기능을 먼저 고르세요' : undone.length === 0 ? '다 채웠어요' : '남은 칸 ' + undone.length + '개'
    );

    var callsOk = PETS.every(function (name) {
      return (project().calls[name] || []).length > 0;
    });
    var v1 = project().values.pet1;
    var v2 = project().values.pet2;
    var different = v1.name !== v2.name || v1.animal !== v2.animal;
    setFlow(
      'pets',
      different && callsOk,
      !different ? '두 반려동물이 똑같아요' : callsOk ? '서로 다르게 정했어요' : '실행할 기능을 고르세요'
    );

    setFlow(
      'run',
      result.complete,
      '점검 ' + result.passed + ' / ' + result.total + ' · 설명 ' + result.explanation.filled + ' / ' + result.explanation.total
    );
  }

  /* ================================================================== */
  /* 1단계 — 무엇을 더 넣을지 고르기 (명세 10.1)                              */
  /* ================================================================== */

  /** 고르면 무엇을 하게 되는지 (학생의 말로) */
  var EXT_TODO = {
    age: '3단계에서 pet1 · pet2 의 나이를 정해요.',
    hungry: '3단계에서 pet1 · pet2 의 배고픔을 정해요.',
    eat: '2단계에서 출력할 문장을 쓰고, 3단계에서 실행할 반려동물을 골라요.',
    play: '2단계에서 출력할 문장을 쓰고, 3단계에서 실행할 반려동물을 골라요.',
    show_info: '2단계에서 보여 줄 항목을 고르고, 3단계에서 실행할 반려동물을 골라요.',
    newAnimal: '2단계에서 동물과 소리를 쓰고, 3단계에서 그 동물로 바꿔 소리를 들어요.',
    ageBranch: '2단계에서 기준 나이를 정하고, 3단계에서 실행할 반려동물을 골라요. (나이 값이 함께 필요해요)'
  };

  function toggleExt(key) {
    var list = project().extensions;
    var i = list.indexOf(key);
    if (i === -1) {
      list.push(key);
    } else {
      list.splice(i, 1);
      var removed = PET.extensionByKey(key);
      var methodName =
        removed && removed.type !== 'attr'
          ? key === 'ageBranch'
            ? 'introduce_age'
            : key === 'newAnimal'
            ? null
            : key
          : null;
      if (methodName) dropCall(methodName);
      if (key === 'age') {
        // 나이 값을 빼면 «나이에 따른 소개»도 쓸 수 없다.
        project().extensions = project().extensions.filter(function (k) {
          return k !== 'ageBranch';
        });
        dropCall('introduce_age');
      }
    }
    st().ran = true; // 화면 2 의 예비 선택을 더 이상 덮어쓰지 않는다
    rebuild();
  }

  function dropCall(method) {
    PETS.forEach(function (name) {
      project().calls[name] = (project().calls[name] || []).filter(function (m) {
        return m !== method;
      });
    });
  }

  function buildStep1(body) {
    body.appendChild(
      stepHead({
        no: 1,
        title: '무엇을 더 넣을지 고르기',
        sub:
          '기본 <code>Pet</code> 클래스에는 이미 이름 · 종류와 <code>sound()</code> · <code>introduce()</code> 가 있어요. ' +
          '여기에 <strong>새로운 값</strong>과 <strong>새로운 기능</strong>을 더해 봅시다.',
        rule: '값 1개 이상 + 기능 1개 이상 (모두 두 가지 이상)'
      })
    );

    refs.extItems = [];
    body.appendChild(
      el(
        'div',
        { 'class': 'extpick', attrs: { role: 'group', 'aria-label': '더 넣을 값과 기능 고르기' } },
        PET.EXTENSIONS.map(function (ext) {
          var input = el('input', {
            type: 'checkbox',
            attrs: { 'aria-label': ext.label + ' — ' + ext.desc }
          });
          var status = el('span', { 'class': 'extpick__status' });
          var root = el('label', { 'class': 'extpick__item' }, [
            input,
            el('span', { 'class': 'extpick__body' }, [
              el('span', { 'class': 'extpick__head' }, [
                el('span', { 'class': 'extpick__icon', text: ext.icon, attrs: { 'aria-hidden': 'true' } }),
                el('span', { 'class': 'extpick__label', text: ext.label.replace(/ 추가$/, '') }),
                el('span', {
                  'class': 'extpick__type is-' + ext.type,
                  text: kindLabel(ext.type)
                })
              ]),
              el('span', { 'class': 'extpick__desc', text: ext.desc }),
              el('span', { 'class': 'extpick__need', text: '고르면 → ' + EXT_TODO[ext.key] }),
              status
            ])
          ]);
          input.addEventListener('change', function () {
            toggleExt(ext.key);
          });
          refs.extItems.push({ key: ext.key, input: input, root: root, status: status });
          return root;
        })
      )
    );

    body.appendChild(buildCustomBox());

    refs.pickSummary = el('p', { 'class': 'picksum', attrs: { 'aria-live': 'polite' } });
    body.appendChild(refs.pickSummary);
  }

  /* ---------------- 직접 만들기 (명세 10.2 «메소드 이름 선택 또는 입력») ---------------- */
  function buildCustomBox() {
    var message = el('p', { 'class': 'custombox__msg', attrs: { 'aria-live': 'polite' } });

    function add(kind, field) {
      var name = String(field.getValue() || '').trim();
      var result =
        kind === 'property'
          ? PET.addCustomProperty(project(), name)
          : PET.addCustomMethod(project(), name);
      if (!result.ok) {
        message.className = 'custombox__msg is-no';
        message.textContent = '✕ ' + result.message;
        field.input.focus();
        return;
      }
      field.setValue('');
      st().ran = true;
      message.className = 'custombox__msg is-ok';
      message.textContent =
        '✓ ' + name + (kind === 'property' ? ' 속성을 만들었어요. 3단계에서 값을 적어 주세요.' : '() 기능을 만들었어요. 2단계에서 문장을 적어 주세요.');
      rebuild();
    }

    var propField = ui.textField({
      id: 'custom-prop',
      label: '속성 이름 (영문)',
      placeholder: '예) weight',
      maxLength: PET.CUSTOM_NAME_MAX,
      onEnter: function () {
        add('property', propField);
      }
    });
    var methodField = ui.textField({
      id: 'custom-method',
      label: '기능 이름 (영문)',
      placeholder: '예) sleep',
      maxLength: PET.CUSTOM_NAME_MAX,
      onEnter: function () {
        add('method', methodField);
      }
    });
    refs.customFields = { property: propField, method: methodField };

    refs.customList = el('div', { 'class': 'customlist' });

    return el('section', { 'class': 'custombox', id: 'custombox' }, [
      el('p', { 'class': 'custombox__title' }, [
        el('span', { text: '✏️ ', attrs: { 'aria-hidden': 'true' } }),
        el('span', { text: '직접 만들기 — 내가 지은 이름으로 더하기' })
      ]),
      el('p', {
        'class': 'custombox__hint',
        html:
          '위 카드에 없는 것도 만들 수 있어요. 이름은 <strong>영문자</strong>로 시작하고 ' +
          '<strong>영문자 · 숫자 · 밑줄(_)</strong> 만 쓸 수 있어요. ' +
          '(예 : 속성 <code>weight</code> · <code>color</code>, 기능 <code>sleep</code> · <code>walk</code>)'
      }),
      el('div', { 'class': 'customadd' }, [
        el('div', { 'class': 'customadd__row' }, [
          propField.root,
          ui.button({
            label: '+ 속성 만들기',
            variant: 'secondary',
            onClick: function () {
              add('property', propField);
            }
          })
        ]),
        el('div', { 'class': 'customadd__row' }, [
          methodField.root,
          ui.button({
            label: '+ 기능 만들기',
            variant: 'secondary',
            onClick: function () {
              add('method', methodField);
            }
          })
        ])
      ]),
      message,
      refs.customList
    ]);
  }

  function paintCustomList() {
    if (!refs.customList) return;
    ui.clear(refs.customList);

    var status = {};
    PROJ.extensionStatus(project()).forEach(function (s) {
      status[s.key] = s;
    });

    var items = project()
      .customProperties.map(function (p) {
        return { kind: 'property', name: p.name, key: 'prop:' + p.name, type: '값' };
      })
      .concat(
        project().customMethods.map(function (m) {
          return { kind: 'method', name: m.name, key: 'method:' + m.name, type: '기능' };
        })
      );

    if (!items.length) {
      refs.customList.appendChild(
        el('p', {
          'class': 'customlist__empty',
          text: '아직 직접 만든 것이 없어요. 위 칸에 이름을 적고 버튼을 누르면 여기에 나타나요.'
        })
      );
      return;
    }

    items.forEach(function (item) {
      var s = status[item.key];
      refs.customList.appendChild(
        el('div', { 'class': 'customchip' + (s && s.done ? ' is-done' : '') }, [
          el('span', { 'class': 'customchip__type', text: item.type }),
          el('code', { 'class': 'customchip__name', text: item.kind === 'method' ? item.name + '()' : item.name }),
          el('span', {
            'class': 'customchip__state',
            text: s && s.done ? '✓ 준비 끝' : s ? '남은 일 : ' + s.todo : ''
          }),
          el('button', {
            type: 'button',
            'class': 'customchip__del',
            text: '✕',
            attrs: { 'aria-label': item.name + ' 지우기' },
            on: {
              click: function () {
                if (item.kind === 'property') PET.removeCustomProperty(project(), item.name);
                else PET.removeCustomMethod(project(), item.name);
                rebuild();
              }
            }
          })
        ])
      );
    });
  }

  function paintExtCards() {
    if (!refs.extItems) return;
    var status = {};
    PROJ.extensionStatus(project()).forEach(function (s) {
      status[s.key] = s;
    });

    refs.extItems.forEach(function (item) {
      var on = hasExt(item.key);
      item.input.checked = on;
      item.root.classList.toggle('is-selected', on);
      var s = status[item.key];
      if (!on) {
        item.status.textContent = '';
        item.status.className = 'extpick__status';
        return;
      }
      if (s && s.done) {
        item.status.textContent = '✓ 준비 끝';
        item.status.className = 'extpick__status is-ok';
      } else {
        item.status.textContent = '남은 일 : ' + (s ? s.todo : '내용을 채워 주세요.');
        item.status.className = 'extpick__status is-no';
      }
    });
  }

  function paintPickSummary() {
    if (!refs.pickSummary) return;
    var values = pickedValues();
    var features = pickedFeatures();

    var need = [];
    if (!values.length) need.push('값 1개');
    if (!features.length) need.push('기능 1개');

    if (!need.length) {
      refs.pickSummary.className = 'picksum is-ok';
      refs.pickSummary.innerHTML =
        '✓ 고른 값 : <strong>' + ui.escapeHtml(values.join(', ')) + '</strong> · ' +
        '고른 기능 : <strong>' + ui.escapeHtml(features.join(', ')) + '</strong>';
    } else {
      refs.pickSummary.className = 'picksum';
      refs.pickSummary.innerHTML =
        '더 필요해요 : <strong>' + need.join(' · ') + '</strong><br />' +
        (values.length || features.length
          ? '지금 고른 것 : ' + ui.escapeHtml(values.concat(features).join(', '))
          : '위 카드를 눌러 골라 보세요. (값은 «가지고 있는 것», 기능은 «하는 일» 이에요)');
    }
  }

  /* ================================================================== */
  /* 2단계 — 고른 기능의 내용 채우기 (명세 10.2)                              */
  /* ================================================================== */
  function buildStep2(body) {
    body.appendChild(
      stepHead({
        no: 2,
        title: '고른 기능의 내용 채우기',
        sub:
          '고른 기능이 <strong>화면에 무엇을 출력할지</strong> 정합니다. ' +
          '적는 대로 옆의 <strong>미리보기</strong>가 바로 바뀌어요.',
        rule: '고른 기능만 아래에 나타납니다'
      })
    );
    sections.step2Body = el('div', { 'class': 'stack' });
    body.appendChild(sections.step2Body);
    buildStep2Body(sections.step2Body);
  }

  /** 미리보기 한 줄 (지금 값으로 pet1 이 실행하면 무엇이 나오는지) */
  function previewLine(method) {
    var lines = PET.callOutput(PET.normalizeProject(project()), 'pet1', method);
    return lines.length ? lines.join('\n') : '…';
  }

  function methodCard(opts) {
    var preview = el('pre', { 'class': 'mcard__preview', text: opts.preview });
    refs.previews[opts.key] = { node: preview, method: opts.method };
    return el('section', { 'class': 'mcard', id: 'mcard-' + opts.key }, [
      el('div', { 'class': 'mcard__head' }, [
        el('span', { 'class': 'mcard__icon', text: opts.icon, attrs: { 'aria-hidden': 'true' } }),
        el('span', { 'class': 'mcard__title', text: opts.title }),
        el('span', { 'class': 'mcard__tag', text: opts.tag })
      ]),
      el('div', { 'class': 'mcard__preview-wrap' }, [
        el('p', { 'class': 'mcard__preview-label', text: '미리보기 — 초코가 실행하면' }),
        preview
      ]),
      el('div', { 'class': 'mcard__body' }, opts.children)
    ]);
  }

  /** 켜고 끄는 한 줄 설정 */
  function switchRow(opts) {
    var input = el('input', {
      type: 'checkbox',
      checked: Boolean(opts.value),
      attrs: { 'aria-label': opts.label }
    });
    input.addEventListener('change', function () {
      opts.onChange(input.checked);
      refresh();
    });
    return el('label', { 'class': 'switchrow' }, [
      input,
      el('span', { 'class': 'switchrow__body' }, [
        el('span', { 'class': 'switchrow__label', text: opts.label }),
        opts.note ? el('span', { 'class': 'switchrow__note', html: opts.note }) : null
      ])
    ]);
  }

  function buildStep2Body(body) {
    ui.clear(body);
    refs.previews = {};

    var features = pickedFeatures();
    if (!features.length) {
      body.appendChild(
        el('div', { 'class': 'emptyhint' }, [
          el('p', { 'class': 'emptyhint__title', text: '아직 채울 내용이 없어요' }),
          el('p', {
            html: pickedValues().length
              ? '지금은 <strong>값</strong>만 골랐어요. 값은 <strong>3단계</strong>에서 pet1 · pet2 의 값을 정하면 끝납니다.<br />' +
                '새로운 <strong>기능</strong>도 하나 이상 골라야 프로그램이 새로운 일을 할 수 있어요.'
              : '<strong>1단계</strong>에서 더 넣을 값과 기능을 먼저 골라 주세요.'
          }),
          ui.button({
            label: '↑ 1단계에서 기능 고르기',
            variant: 'secondary',
            onClick: function () {
              ui.scrollToNode(sections.pick);
            }
          })
        ])
      );
      return;
    }

    /* eat() · play() — 출력할 문장 한 줄 */
    ['eat', 'play'].forEach(function (key) {
      if (!hasExt(key)) return;
      var ext = PET.extensionByKey(key);
      var m = project().methods[key];

      var field = ui.textField({
        id: 'm-' + key + '-tail',
        label: '무엇이라고 출력할까요?',
        value: m.tail,
        maxLength: 40,
        placeholder: PET.METHOD_DEFAULT_TAIL[key],
        onInput: ui.debounce(function (value) {
          project().methods[key].tail = value;
          refresh();
        }, 300)
      });
      field.input.setAttribute('aria-label', key + '() 이 출력할 문장');

      body.appendChild(
        methodCard({
          key: key,
          method: key,
          icon: ext.icon,
          title: key + '() — ' + ext.desc.replace(/\.$/, ''),
          tag: '새 기능',
          preview: previewLine(key),
          children: [
            field.root,
            el('p', { 'class': 'mcard__hint', text: '앞에는 반려동물의 이름이 자동으로 붙어요.' }),
            switchRow({
              label: '반려동물 이름을 자동으로 넣기',
              note:
                '코드에서는 <code>self.name</code> 입니다. 끄면 어느 반려동물인지 알 수 없게 돼요.',
              value: m.useSelf,
              onChange: function (v) {
                project().methods[key].useSelf = v;
              }
            }),
            switchRow({
              label: '본문을 한 단계 더 들여쓰기 (파이썬 규칙)',
              note: '<code>def</code> 줄보다 한 단계 더 들여써야 «이 기능의 내용»이 됩니다.',
              value: m.bodyIndent === 8,
              onChange: function (v) {
                project().methods[key].bodyIndent = v ? 8 : 4;
              }
            })
          ]
        })
      );
    });

  function buildStep3(body) {

      stepHead({
