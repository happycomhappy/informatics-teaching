  font-size: var(--fs-small);
  line-height: 1.7;
}

.cmp__out {
  margin: 0;
  min-height: 1.5em;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 화면 5 — 메소드 고르기 · 조각 선택 · 자동 확인                           */
/* ------------------------------------------------------------------ */
.mchoice {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.mchoice__card {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.mchoice__card:hover {
  border-color: var(--accent2);
  background: var(--accent2-soft);
}

.mchoice__card.is-selected {
  border: 2px solid var(--accent2);
  background: var(--accent2-soft);
}

.mchoice__icon {
  font-size: 1.6em;
}

.mchoice__name {
  font-weight: 700;
}

.mchoice__code {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--accent2-dark);
  word-break: break-all;
}

.mchoice__desc {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.mslot {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-surface);
}

.mslot__title {
  margin: 0 0 var(--space-2);
  font-weight: 700;
  color: var(--accent2-dark);
}

.mslot__opts {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.mopt {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.mopt:hover {
  border-color: var(--accent2);
}

.mopt.is-selected {
  border: 2px solid var(--accent2);
  background: var(--accent2-soft);
}

.mopt__mark {
  flex: none;
  min-width: 6.5em;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.mopt__code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  word-break: break-all;
}

/* 자동 확인 결과 목록 (명세 10.3) */
.elems {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  list-style: none;
}

.elems__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: var(--fs-small);
}

.elems__item.is-ok {
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.elems__item.is-no {
  background: var(--color-false-soft);
  color: var(--color-false-dark);
}

.elems__mark {
  flex: none;
  font-weight: 700;
}

/* ------------------------------------------------------------------ */
/* 좁은 화면 (명세 21장 : 768px 미만은 모두 1열)                            */
/* ------------------------------------------------------------------ */
@media (max-width: 767px) {
  .cmp,
  .mchoice {
    grid-template-columns: 1fr;
  }

  .chg__label {
    min-width: 0;
  }

  .levels__item--1,
  .levels__item--2 {
    margin-left: 0;
  }

  .mopt {
    flex-direction: column;
    align-items: flex-start;
  }

  .mopt__mark {
    min-width: 0;
  }
}

/* 인쇄에서는 입력·버튼을 제외한다(명세 15.7 · print.css 와 함께 동작) */
@media print {
  .mchoice,
  .mslot__opts,
  .cmp__out {
    display: none;
  }
}


/* ===== lesson4.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 4차시 전용 스타일 — 「반복하면서 판단하기」에서만 쓰는 조각들
 *
 * 앞선 파일과 역할을 나눈다.
 *   tokens.css     : 색·글꼴·간격 값
 *   base.css       : 앱 골격 · 상단 진행 바 · 하단 이동 바
 *   components.css : 버튼 · 패널 · 입력 · 콘솔 · 배지 · 표
 *   code.css       : 코드 뷰와 실행 상태 표시
 *   steps.css      : 시작 화면 · 선택지 · 채점 결과 등 공통 화면 조각
 *   lesson.css     : 앞 차시에서 물려받은 부품(변수 상자 · 값 카드 · 추적표 · 흐름 고리 …)
 *   lesson4.css    : ↓ 반 공 · 몬스터 트랙 · 코드 조립 · 자동 테스트 …
 *
 * 색만으로 뜻을 전하지 않는다. 모든 상태 표시에 글자나 기호를 함께 넣는다(명세 21.5).
 * ------------------------------------------------------------------ */

/* ===================== 공통 ===================== */
.bigresult {
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
  font-size: 17px;
  font-weight: 700;
  min-height: 1.2em;
}

.bigresult:empty {
  display: none;
}

/* 접었다 펼치는 상태 패널 (명세 20.2) */
.fold {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  overflow: hidden;
}

.fold__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  width: 100%;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: none;
  background: var(--color-muted-bg);
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text-sub);
  cursor: pointer;
}

.fold__chevron {
  transition: transform var(--dur-highlight) ease;
}

.fold.is-open .fold__chevron {
  transform: rotate(180deg);
}

.fold__body {
  display: none;
  padding: var(--space-3);
}

.fold.is-open .fold__body {
  display: block;
}

/* ===================== 화면 2 : 1~8반 공 ===================== */
.ball-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
  gap: var(--space-2);
}

.ball {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 64px;
  padding: var(--space-2);
  border: 2px solid var(--color-border-strong);
  border-radius: 50% 50% var(--radius) var(--radius);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.ball__no {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 800;
}

.ball__tag {
  font-size: 11px;
  font-weight: 800;
  color: var(--color-text-sub);
  min-height: 1em;
}

.ball.is-picked {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.ball.is-picked .ball__tag {
  color: var(--color-true-dark);
}

.ball.is-dup {
  border-style: dashed;
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.ball.is-dup .ball__tag {
  color: var(--color-false-dark);
}

.ball.is-current {
  transform: translateY(-4px) scale(1.06);
  box-shadow: var(--shadow);
}

/* ===================== 리스트 상태 상자 ===================== */
.listview {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.listview__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.listview__name {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

/* ===================== 조건 한 줄 표시 ===================== */
.condline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.condline__label {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.condline__text {
  flex: 1 1 auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
}

.condline__mark {
  flex: 0 0 auto;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.condline__mark.is-true {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.condline__mark.is-false {
  border-color: var(--color-false);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
}

/* ===================== 화면 3 : 코드 조립 ===================== */
.asm-row {
  display: grid;
  grid-template-columns: 96px 150px minmax(0, 1fr);
  align-items: center;
  gap: var(--space-2);
}

@media (max-width: 767px) {
  .asm-row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.asm-row__no {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text-sub);
}

.asm-preview {
  margin: 0;
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  white-space: pre;
  overflow-x: auto;
}

/* ===================== 화면 4 : 몬스터 트랙 ===================== */
.mtrack {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
  gap: 6px;
  max-height: 320px;
  overflow-y: auto;
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.mcell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 2px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.mcell__no {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.mcell__mark {
  font-size: 10px;
  font-weight: 800;
  line-height: 1.2;
  text-align: center;
}

.mcell.is-kill {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.mcell.is-continue {
  border-style: dashed;
  border-color: var(--color-false);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
}

.mcell.is-break {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
  color: var(--color-error);
}

.mcell.is-notrun {
  opacity: 0.55;
  border-style: dotted;
  background: var(--color-muted-bg);
}

.mcell.is-here {
  outline: 3px solid var(--color-primary);
  outline-offset: 1px;
  transform: scale(1.06);
}

/* break / continue 흐름 설명 */
.flownote:empty {
  display: none;
}

.flownote {
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-primary);
  border-left-width: 5px;
  background: var(--color-primary-soft);
}

.flownote__title {
  font-weight: 800;
  color: var(--color-primary-dark);
  margin-bottom: var(--space-2);
}

.flownote__list {
  margin: 0;
  padding-left: 1.3em;
  font-size: var(--fs-small);
  line-height: 1.9;
}

/* 개념 연결 줄 */
.link-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.link-row__cmd {
  min-width: 96px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  background: var(--color-console-bg);
  color: var(--color-console-text);
  font-family: var(--font-mono);
  font-weight: 800;
  text-align: center;
}

.link-row__arrow {
  color: var(--color-text-sub);
  font-weight: 900;
}

.link-row .select {
  flex: 1 1 240px;
}

/* ===================== 화면 5 : 숫자 카드 · 빈칸 · 자동 테스트 ===================== */
.numcard-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard--static {
  cursor: default;
}

.numcard.is-current {
  border-color: var(--color-primary);
  box-shadow: var(--shadow);
  transform: translateY(-3px);
}

.numcard.is-even {
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
}

.numcard.is-odd {
  background: var(--color-false-soft);
  color: var(--color-false-dark);
}

.blank-row {
  display: grid;
  grid-template-columns: 140px minmax(0, 1fr);
  align-items: center;
  gap: var(--space-2);
}

@media (max-width: 767px) {
  .blank-row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.blank-row__label {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text-sub);
}

.test-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.test-summary {
  font-size: 17px;
  font-weight: 900;
  color: var(--color-false-dark);
}

.test-summary.is-pass {
  color: var(--color-true-dark);
}

.test-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: var(--fs-small);
}

.test-row.is-pass {
  border-left-color: var(--color-true);
}

.test-row.is-fail {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.test-row__mark {
  flex: 0 0 auto;
  font-weight: 800;
}

.test-row.is-pass .test-row__mark {
  color: var(--color-true-dark);
}

.test-row.is-fail .test-row__mark {
  color: var(--color-error);
}

.test-row__input {
  font-family: var(--font-mono);
  font-weight: 700;
}

.test-row__expect {
  color: var(--color-text-sub);
}

/* ===================== 화면 6 : 형성평가 지문 ===================== */
.quiz-context {
  line-height: 1.8;
}

.quiz-note {
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  font-weight: 700;
}

/* ===================== 인쇄 ===================== */
@media print {
  .fold__body {
    display: block !important;
  }

  .mtrack {
    max-height: none;
    overflow: visible;
  }
}

/* 교사용 : 패널 제목 옆의 「(선택)」 표시 (4장 명단 올리기) */
.t-optional {
  margin-left: var(--space-2);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-sub);
}


/* ===== object.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 객체를 구현하는 클래스 1차시 전용 스타일 (명세 20장 · 21장)
 *
 *  · 첨부 자료의 «청록색 제목선 + 밝은 카드» 분위기를 참고하되 그대로 복제하지 않는다.
 *  · 인스턴스화 화살표만 주황색으로 강조한다(명세 20.1).
 *  · 정답/오답/변경 여부는 색뿐 아니라 «글자 배지»로도 함께 나타낸다(명세 20.2 · 21장).
 *  · 외부 웹폰트·이미지를 쓰지 않고 도형과 글자만으로 사례를 표현한다(명세 25장).
 * ------------------------------------------------------------------ */

:root {
  --color-teal: #0f766e;
  --color-teal-dark: #115e59;
  --color-teal-soft: #f0fdfa;
  --color-teal-line: #99f6e4;
  --color-inst: #c2410c; /* 인스턴스화 강조(주황) */
  --color-inst-soft: #fff7ed;
  --color-inst-line: #fdba74;
  --color-bg: #f4fbfa; /* 흰색·연한 청록색 바탕 */
}

/* 단계 제목 아래 청록색 선 */
.step-header__title,
.act-head__title {
  border-bottom: 3px solid var(--color-teal-line);
  padding-bottom: var(--space-2);
}

/* ------------------------------------------------------------------ */
/* 클래스 → 인스턴스화 → 객체 흐름 (명세 20.2 : 언제나 같은 방향)          */
/* ------------------------------------------------------------------ */
.obj-flow {
  display: flex;
  align-items: stretch;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.obj-flow__node {
  flex: 1 1 180px;
  min-width: 160px;
  background: var(--color-surface);
  border: 2px solid var(--color-teal-line);
  border-radius: var(--radius);
  padding: var(--space-4);
  text-align: center;
}

.obj-flow__node--object {
  border-color: var(--color-border-strong);
}

.obj-flow__label {
  display: block;
  font-weight: 700;
  color: var(--color-teal-dark);
  margin-bottom: var(--space-1);
}

.obj-flow__desc {
  display: block;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 인스턴스화 화살표 — 이번 차시의 강조색(주황) */
.obj-flow__arrow {
  flex: 0 0 auto;
  align-self: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  color: var(--color-inst);
  font-weight: 700;
  padding: var(--space-2) var(--space-3);
  background: var(--color-inst-soft);
  border: 1px dashed var(--color-inst-line);
  border-radius: var(--radius);
  min-width: 96px;
  text-align: center;
}

.obj-flow__arrow-mark {
  font-size: 22px;
  line-height: 1;
}

.obj-flow__arrow-text {
  font-size: var(--fs-small);
}

@media (max-width: 767px) {
  .obj-flow {
    flex-direction: column;
  }
  /* 세로로 쌓일 때 flex-basis 는 «높이»가 되므로, 내용 높이에 맞추도록 되돌린다. */
  .obj-flow__node {
    flex: 0 0 auto;
  }
  .obj-flow__arrow {
    width: 100%;
    flex-direction: row;
    justify-content: center;
  }
  /* 세로로 쌓일 때는 아래를 가리키는 화살표로 바꾼다(글자 화살표 · 그림 화살표 모두). */
  .obj-flow__arrow-mark,
  .s2-arrow__art {
    transform: rotate(90deg);
  }
  .s2-arrow__art {
    width: 56px;
  }
}

/* ------------------------------------------------------------------ */
/* 개념 정의 카드 (명세 7.1)                                             */
/* ------------------------------------------------------------------ */
.cdef-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-3);
}

.cdef-card {
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-left: 5px solid var(--color-teal);
  border-radius: var(--radius);
  padding: var(--space-4);
}

.cdef-card__name {
  font-weight: 700;
  font-size: 18px;
  color: var(--color-teal-dark);
  margin-bottom: var(--space-1);
}

.cdef-card__def {
  margin-bottom: var(--space-2);
}

.cdef-card__ex {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 객체 카드 (명세 20.2 : 클래스명 · 객체명 · 속성 · 기능을 구획해 표시)     */
/* ------------------------------------------------------------------ */
.objcards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
}

.objcard {
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color var(--dur-highlight) ease, box-shadow var(--dur-highlight) ease;
}

.objcard.is-target {
  border-color: var(--color-inst);
  box-shadow: 0 0 0 3px var(--color-inst-soft);
}

.objcard.is-new {
  border-color: var(--color-teal);
}

.objcard__head {
  background: var(--color-teal-soft);
  border-bottom: 1px solid var(--color-teal-line);
  padding: var(--space-2) var(--space-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.objcard__name {
  font-weight: 700;
  font-family: var(--font-mono);
}

.objcard__class {
  font-size: var(--fs-small);
  color: var(--color-teal-dark);
}

.objcard__section {
  padding: var(--space-2) var(--space-3);
}

.objcard__section + .objcard__section {
  border-top: 1px dashed var(--color-border);
}

.objcard__section-title {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-1);
}

.objattr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: 3px 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.objattr.is-changed {
  background: var(--color-inst-soft);
  outline: 1px solid var(--color-inst-line);
}

.objattr.is-reading {
  background: var(--color-primary-soft);
  outline: 1px solid var(--color-primary);
}

.objattr__key {
  color: var(--color-text-sub);
}

.objattr__val {
  font-weight: 700;
}

/* 색에만 기대지 않도록 «글자 배지»를 함께 쓴다(명세 20.2). */
.obj-badge {
  display: inline-block;
  max-width: 100%;
  font-size: 12px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  /* 좁은 카드 안에서도 배지가 밖으로 삐져나가지 않도록 줄바꿈을 허용한다. */
  overflow-wrap: anywhere;
}

.obj-badge--changed {
  background: var(--color-inst-soft);
  border-color: var(--color-inst-line);
  color: var(--color-inst);
}

.obj-badge--kept {
  background: var(--color-muted-bg);
}

.obj-badge--created {
  background: var(--color-true-soft);
  border-color: var(--color-true);
  color: var(--color-true-dark);
}

.obj-badge--instance {
  background: var(--color-teal-soft);
  border-color: var(--color-teal-line);
  color: var(--color-teal-dark);
}

/* ------------------------------------------------------------------ */
/* 붕어빵 인스턴스화 시뮬레이션 (명세 7.2)                                 */
/* ------------------------------------------------------------------ */
.bun-stage {
  display: grid;
  grid-template-columns: minmax(160px, 1fr) auto minmax(220px, 1.4fr);
  gap: var(--space-3);
  align-items: center;
}

@media (max-width: 900px) {
  .bun-stage {
    grid-template-columns: 1fr;
  }
}

.bun-mold {
  background: var(--color-teal-soft);
  border: 2px dashed var(--color-teal);
  border-radius: var(--radius);
  padding: var(--space-4);
  text-align: center;
}

.bun-mold__shape {
  font-size: 44px;
  line-height: 1.1;
}

/* 틀 그림은 카드 안에서 너무 커지지 않게 한다. */
.bun-mold .s2-art {
  max-width: 190px;
  margin: 0 auto var(--space-2);
}

.bun-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 96px;
  align-content: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.bun-tray__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.bun {
  width: 104px;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  padding: var(--space-2);
  text-align: center;
}

.bun__face {
  font-size: 28px;
  line-height: 1.1;
}

.bun__name {
  font-size: var(--fs-small);
  font-weight: 700;
}

.bun__fill {
  font-size: 12px;
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 화면 2 전용 — 그림(인라인 SVG) 배치                                     */
/*                                                                     */
/* `s2-` 로 시작하는 클래스는 화면 2 에서만 쓴다.                            */
/* ------------------------------------------------------------------ */
.s2-art {
  display: block;
}

.s2-art svg {
  display: block;
  width: 100%;
  height: auto;
}

/* 개념 카드 위의 작은 그림 */
.s2-mini {
  max-width: 132px;
  margin: 0 auto var(--space-2);
}

.s2-cdef {
  text-align: center;
}

.s2-cdef .cdef-card__name {
  margin-top: var(--space-1);
}

/* 흐름 안의 주황 화살표 그림 */
.s2-arrow {
  gap: var(--space-1);
}

.s2-arrow__art {
  width: 84px;
}

/* 한 클래스 → 여러 객체 무대 (설계도 · 화살표 · 객체 묶음) */
.s2-stage {
  display: grid;
  grid-template-columns: minmax(200px, 1fr) 116px minmax(240px, 1.25fr);
  gap: var(--space-3);
  align-items: center;
}

.s2-stage__arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  color: var(--color-inst);
  font-weight: 700;
}

.s2-stage__arrow .s2-art {
  width: 100%;
}

/* 설계도 카드 — 점선으로 «아직 실체가 아님»을 나타낸다 */
.s2-blueprint {
  background: var(--color-teal-soft);
  border: 1.5px dashed var(--color-teal);
  border-radius: var(--radius);
  padding: var(--space-3);
  text-align: center;
}

.s2-blueprint .s2-art {
  max-width: 260px;
  margin: 0 auto;
}

.s2-blueprint__title {
  font-weight: 700;
  color: var(--color-teal-dark);
  margin-top: var(--space-1);
}

.s2-slot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  justify-content: center;
  margin: var(--space-2) 0;
}

/* 객체 카드 묶음 (세로로 두 개) */
.s2-objcol {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* 그림이 있는 객체 카드 — 그림(왼쪽) + 속성(오른쪽) */
.objcard--art {
  display: flex;
  align-items: stretch;
}

.objcard--art .objcard__body {
  flex: 1 1 auto;
  min-width: 0;
}

.objcard__art {
  flex: 0 0 168px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-2);
  background: var(--color-muted-bg);
  border-right: 1px solid var(--color-border);
}

.objcard__art svg {
  max-height: 132px;
  width: auto;
}

.objcard__art--hero svg {
  max-height: 116px;
}

@media (max-width: 560px) {
  .objcard--art {
    flex-direction: column;
  }
  .objcard__art {
    flex: 0 0 auto;
    border-right: none;
    border-bottom: 1px solid var(--color-border);
  }
}

/* 붕어빵 카드 안의 그림 */
.bun__art {
  width: 84px;
  margin: 0 auto var(--space-1);
}

@media (max-width: 900px) {
  .s2-stage {
    grid-template-columns: 1fr;
  }
  /* 세로로 쌓이면 화살표도 아래를 향하게 돌린다. */
  .s2-stage__arrow .s2-art {
    width: 96px;
    margin: 0 auto;
    transform: rotate(90deg);
  }
}

/* ------------------------------------------------------------------ */
/* 속성 · 기능 분류 활동 (명세 8.2)                                        */
/* ------------------------------------------------------------------ */
.sort-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-3);
}

.sortzone {
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-surface);
  min-height: 140px;
}

.sortzone.is-over {
  border-color: var(--color-teal);
  background: var(--color-teal-soft);
}

.sortzone__title {
  font-weight: 700;
  color: var(--color-teal-dark);
  margin-bottom: var(--space-1);
}

.sortzone__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-2);
}

.sortzone__body {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.sortcard {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: 999px;
  background: var(--color-surface);
  font-size: var(--fs-body);
  cursor: pointer;
}

.sortcard:hover {
  border-color: var(--color-teal);
}

.sortcard.is-selected {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-primary-soft);
}

.sortcard.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.sortcard.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.sortcard__mark {
  font-weight: 700;
}

/* ------------------------------------------------------------------ */
/* 화면 4 · 5 공용 — 줄별 주석                                             */
/* ------------------------------------------------------------------ */

/* 들여쓰기 배지 바로 뒤에 코드가 붙지 않도록 한 칸 띄운다.
   (배지는 화면 4 ① 클래스 기본 구조에서만 쓴다) */
.indent-note {
  margin-right: 6px;
}

/* 줄별 주석 (코드 한 줄 ↔ 설명을 같은 행에) — 화면 4 ② · 화면 5 ① 이 함께 쓴다 */
.annot {
  display: grid;
  grid-template-columns: minmax(240px, 1.05fr) minmax(220px, 1fr);
  gap: var(--space-2) var(--space-3);
  align-items: stretch;
}

.annot__head {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.annot__code {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  overflow-x: auto;
}

.annot__no {
  flex: 0 0 auto;
  min-width: 14px;
  text-align: right;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--color-text-sub);
}

.annot__text {
  white-space: pre;
}

/* 들여쓰기 한 칸(4칸) — 왼쪽에 안내선을 두어 «클래스 안»임을 보인다. */
.annot__indent {
  display: inline-block;
  width: 4ch;
  border-left: 1px solid var(--color-indent-guide);
}

.annot__note {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: var(--space-2) var(--space-3);
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-left: 4px solid var(--color-teal);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.annot__note-key {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-teal-dark);
}

.annot__note-text {
  font-size: var(--fs-small);
  line-height: 1.55;
}

@media (max-width: 700px) {
  /* 좁은 화면에서는 «코드 줄 → 그 줄의 설명» 순서로 번갈아 쌓인다. */
  .annot {
    grid-template-columns: 1fr;
    gap: var(--space-1);
  }
  .annot__head {
    display: none;
  }
  .annot__note {
    margin: 0 0 var(--space-3) var(--space-4);
  }
}

/* ------------------------------------------------------------------ */
/* 화면 3 — 설계 카드 빈칸 안내 (명세 8.3)                                  */
/* ------------------------------------------------------------------ */
.s3-gap {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-false-dark);
}

.s3-gap.is-ok {
  color: var(--color-true-dark);
}

/* 저장을 눌렀을 때 비어 있던 칸 — 색 말고 글자 안내도 함께 준다(명세 21장) */
.num-input.is-blank {
  border-color: var(--color-false);
  background: var(--color-false-soft);
  box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12);
}

/* ------------------------------------------------------------------ */
/* 코드 순서 조립 (명세 9.4)                                              */
/* ------------------------------------------------------------------ */
.asm-pool,
.asm-slots {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.asm-piece {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  min-height: var(--touch-min);
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-code-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  cursor: pointer;
}

.asm-piece:hover {
  border-color: var(--color-teal);
}

.asm-piece[disabled] {
  opacity: 0.45;
  cursor: default;
}

.asm-piece__indent {
  color: var(--color-text-sub);
  font-size: 12px;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: 0 6px;
  white-space: nowrap;
}

/* 들여쓰기 표시는 줄 «앞부분»에 두고, 폭을 고정해 코드 시작 위치를 맞춘다.
   그래야 들여쓴 조각(안내선 한 칸 만큼 밀린)과 그렇지 않은 조각이 한눈에 비교된다. */
.asm-mark {
  flex: 0 0 auto;
  min-width: 84px;
  text-align: center;
  color: var(--color-text-sub);
  font-family: var(--font-sans);
  font-size: 12px;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: 0 6px;
  white-space: nowrap;
}

.asm-code {
  flex: 1 1 auto;
  min-width: 0;
  white-space: pre;
  overflow-x: auto;
}

.asm-slot {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.asm-slot__no {
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--color-text-sub);
  min-width: 22px;
}

.asm-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.asm-slot.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ------------------------------------------------------------------ */
/* self 흐름 단계 (명세 10.2)                                             */
/* ------------------------------------------------------------------ */
.selfflow {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  counter-reset: selfstep;
}

.selfflow__item {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  opacity: 0.45;
}

.selfflow__item.is-on {
  opacity: 1;
  border-color: var(--color-teal);
  background: var(--color-teal-soft);
}

.selfflow__no {
  flex: 0 0 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--color-teal);
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.selfflow__title {
  font-weight: 700;
}

.selfflow__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 학습 정리 문장 완성 (명세 11.10)                                        */
/* ------------------------------------------------------------------ */
.fillline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-2) 0;
}

.fillline__text {
  flex: 1 1 220px;
}

.fillline__input {
  min-height: var(--touch-min);
  min-width: 140px;
  padding: var(--space-2);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
}

.fillline__input:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 1px;
}

/* ------------------------------------------------------------------ */
/* 5번 문항 · 연습용 코드 입력칸                                            */
/* ------------------------------------------------------------------ */
.codeinput {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.codeinput__no {
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--color-text-sub);
  min-width: 46px;
}

.codeinput__field {
  flex: 1 1 auto;
  min-height: var(--touch-min);
  padding: var(--space-2);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.codeinput__field:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 1px;
}

.codeinput__field.is-ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

/* 실행 결과 보기(4번 문항) — 여러 줄 출력을 그대로 보여 준다. */
.outopt {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  padding: var(--space-3);
  cursor: pointer;
}

.outopt.is-selected {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-primary-soft);
}

.outopt__num {
  font-weight: 700;
  margin-right: var(--space-2);
}

.outopt__body {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  margin: var(--space-1) 0 0;
}

/* ------------------------------------------------------------------ */
/* 화면 1 전용 — 가운데 한 줄로 쌓는 카드 레이아웃                          */
/*                                                                     */
/* 이 구역의 클래스는 모두 `s1-` 로 시작한다. 화면 1 에서만 쓰므로            */
/* 다른 화면의 패널 · 표 · 선택지 모양에는 전혀 영향을 주지 않는다.           */
/* ------------------------------------------------------------------ */
.s1-wrap {
  max-width: 880px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* 머리말 */
.s1-hero {
  text-align: center;
  padding: var(--space-4) 0 var(--space-1);
}

.s1-hero__eyebrow {
  display: inline-block;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-teal-dark);
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-radius: 999px;
  padding: 4px 14px;
}

.s1-hero__title {
  font-size: var(--fs-h1);
  font-weight: 800;
  line-height: 1.3;
  margin: var(--space-3) 0 var(--space-2);
}

.s1-hero__sub {
  color: var(--color-text-sub);
  font-size: 17px;
}

/* 카드 공통 */
.s1-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
}

.s1-card__title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: var(--space-4);
}

.s1-card__icon {
  font-size: 20px;
  line-height: 1;
}

.s1-card__tag {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-sub);
  background: var(--color-muted-bg);
  border-radius: 999px;
  padding: 3px 10px;
}

/* 학습 목표 */
.s1-goals {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.s1-goal {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
}

.s1-goal__no {
  flex: 0 0 26px;
  height: 26px;
  margin-top: 2px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.s1-goal__text {
  font-weight: 600;
  line-height: 1.7;
}

/* 카드 사이의 한 줄 안내 */
.s1-note {
  text-align: center;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
  margin: calc(var(--space-3) * -1) 0 0;
}

.s1-note strong {
  color: var(--color-primary);
}

/* 생각 열기 */
.s1-question {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.6;
  background: var(--color-teal-soft);
  border-left: 4px solid var(--color-teal);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
}

.s1-opts {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.s1-opt {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-3) var(--space-4);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.s1-opt:hover {
  border-color: var(--color-teal);
  background: var(--color-teal-soft);
}

/* 라디오 버튼은 눈에서만 감춘다. 키보드 초점과 화살표 이동은 그대로 살아 있다. */
.s1-opt input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
}

.s1-opt:focus-within {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.s1-opt__no {
  flex: 0 0 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--color-border-strong);
  color: var(--color-text-sub);
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.s1-opt__text {
  line-height: 1.6;
}

.s1-opt.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.s1-opt.is-selected .s1-opt__no {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.s1-opt.is-selected .s1-opt__text {
  font-weight: 600;
}

/* 응답 뒤에 나타나는 연결 문장 */
/* display 를 지정한 요소는 hidden 속성이 무시되므로(브라우저 기본값을 덮는다)
   응답 전에는 확실히 감추도록 규칙을 하나 더 둔다. */
.s1-result[hidden] {
  display: none;
}

.s1-result {
  display: flex;
  gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-4);
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-radius: var(--radius);
}

.s1-result__icon {
  font-size: 20px;
  line-height: 1.5;
}

.s1-result__reply {
  margin-bottom: var(--space-2);
  line-height: 1.7;
}

.s1-result__bridge {
  font-weight: 600;
  line-height: 1.7;
  color: var(--color-teal-dark);
}

.s1-result__bridge strong {
  color: var(--color-inst);
}

/* 학습 순서 */
.s1-plan__label {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-2);
}

.s1-plan__grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
}

.s1-plan__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  font-size: var(--fs-small);
  font-weight: 600;
  line-height: 1.4;
}

.s1-plan__no {
  color: var(--color-teal);
  font-weight: 700;
}

/* 예상 시간과 학습 시작 */
.s1-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  padding-bottom: var(--space-4);
}

.s1-time {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.s1-start {
  display: flex;
  justify-content: center;
  width: 100%;
}

.s1-start__btn {
  min-width: 220px;
  min-height: 52px;
  font-size: 17px;
}

.s1-hint {
  min-height: 20px;
  color: var(--color-false-dark);
  font-size: var(--fs-small);
  text-align: center;
}

@media (max-width: 900px) {
  .s1-plan__grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 560px) {
  .s1-card {
    padding: var(--space-4);
  }
  .s1-plan__grid {
    grid-template-columns: 1fr;
  }
  .s1-card__tag {
    margin-left: 0;
  }
  .s1-start__btn {
    width: 100%;
  }
}

/* 사례 비교표 · 작은 안내 */
.obj-note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.obj-quote {
  border-left: 4px solid var(--color-teal);
  background: var(--color-teal-soft);
  padding: var(--space-3);
  border-radius: 0 var(--radius) var(--radius) 0;
}


/* ===== pattern.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 5차시 전용 스타일
 *   화면 1 핵심어 연결 · 화면 2 행·열 격자 · 화면 3 조합 · 화면 4 패턴 · 화면 5 프로젝트
 *   (명세 55장의 pattern.css 자리. 공통 부품은 components.css · lesson.css 를 그대로 쓴다)
 *
 * 색만으로 상태를 알리지 않는다(명세 50.4). 모든 상태 표시에는 ✓ ✕ — ↵ 같은 글자를 함께 둔다.
 * ------------------------------------------------------------------ */

/* 화면 1 은 2차시와 같은 hero 구성을 쓰므로 별도 스타일이 필요하지 않다.
   (goal-card · agenda · recall · mini-quiz · choice 는 steps.css · lesson.css · components.css 에 있다) */

/* ============================ 화면 2 — 행·열 격자 ============================ */

/* 원본 코드와 격자를 나란히 둔다. 코드가 조금 좁고 격자가 넓다. */
.nl-run {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: var(--space-4);
  align-items: start;
}

.nl-grid {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  padding: var(--space-2);
}

.nl-grid__scroll {
  overflow-x: auto;
}

.nl-grid__table {
  border-collapse: separate;
  border-spacing: 4px;
  min-width: 100%;
}

.nl-grid__corner,
.nl-grid__colhead,
.nl-grid__rowhead,
.nl-grid__tail {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  padding: var(--space-1) var(--space-2);
  white-space: nowrap;
  text-align: center;
}

.nl-grid__rowhead {
  text-align: right;
}

.nl-grid__colhead.is-emph,
.nl-grid__rowhead.is-emph {
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius-sm);
  font-weight: 700;
}

.nl-grid__cell {
  width: 48px;
  height: 44px;
  text-align: center;
  vertical-align: middle;
  border: 2px dashed var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.nl-grid__cell.is-filled {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
  font-weight: 700;
}

.nl-grid__cell.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
}

.nl-grid__row.is-current-row .nl-grid__rowhead {
  color: var(--color-primary-dark);
  font-weight: 700;
}

.nl-grid__newline {
  width: 40px;
  text-align: center;
  font-family: var(--font-mono);
  color: var(--color-text-sub);
}

.nl-grid__newline.is-on {
  color: var(--color-false-dark);
  font-weight: 700;
}

.nl-state-card {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  padding: var(--space-3);
}

.nl-state-card__title {
  margin: 0 0 var(--space-2);
  font-weight: 700;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.nl-state {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-1) var(--space-3);
  margin: 0;
}

.nl-state__label {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.nl-state__value {
  margin: 0;
  font-family: var(--font-mono);
  font-weight: 700;
}

.nl-math {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  width: 100%;
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  font: inherit;
  color: var(--color-text);
  text-align: left;
}

.nl-math.is-on {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.nl-math__eq {
  font-weight: 700;
  font-size: 1.05em;
}

.nl-math__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ============================ 화면 3 — 조합 ============================ */
.combo-board {
  display: grid;
  grid-template-columns: repeat(3, minmax(150px, 1fr));
  gap: var(--space-3);
  align-items: start;
}

.combo-col {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.combo-col__title {
  margin: 0;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.combo-col__cards {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.combo-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.combo-card.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  box-shadow: var(--shadow-sm);
}

.combo-card.is-visited {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.combo-card__name {
  font-weight: 700;
}

.combo-result__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  max-height: 320px;
  overflow-y: auto;
}

.combo-row {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex-wrap: wrap;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--color-muted-bg);
  font-size: var(--fs-small);
}

.combo-row__no {
  min-width: 20px;
  font-family: var(--font-mono);
  color: var(--color-text-sub);
}

.combo-row__plus,
.combo-row__arrow {
  color: var(--color-text-sub);
}

.combo-row__menu {
  font-weight: 700;
  color: var(--color-primary-dark);
}

/* ============================ 화면 4 · 5 — 텍스트 도형 ============================ */
.pat-shape {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  overflow-x: auto;
}

.pat-shape__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.pat-shape__no {
  min-width: 22px;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.pat-shape__text {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  letter-spacing: 0.08em;
}

.pat-shape__text.is-spacevis {
  color: var(--color-primary-dark);
}

.pat-rows {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.pat-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font: inherit;
  color: var(--color-text);
  cursor: pointer;
  text-align: left;
}

.pat-row__no {
  min-width: 42px;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.pat-row__text {
  flex: 1 1 auto;
  font-family: var(--font-mono);
  white-space: pre;
  letter-spacing: 0.08em;
}

.pat-row__pick {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.pat-row.is-set {
  background: var(--color-muted-bg);
}

.pat-row.is-set .pat-row__pick {
  color: var(--color-primary-dark);
}

.pat-row.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.pat-row.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.pat-group {
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-4);
  border: 2px solid var(--color-border);
  border-radius: 999px;
  background: var(--color-surface);
  font: inherit;
  font-weight: 700;
  color: var(--color-text);
  cursor: pointer;
}

.pat-group.is-picked {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
}

.pat-rulerow {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.pat-rulerow.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.pat-rulerow.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.pat-rulerow__label {
  min-width: 92px;
  font-weight: 700;
}

.pat-mini {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  line-height: 1.35;
  white-space: pre;
  letter-spacing: 0.08em;
}

/* 조건 검사 줄 (lesson4.css 의 .condline 을 이번 차시 상태에 맞게 덧칠한다) */
.condline.is-true {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.condline.is-false {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.condline.is-unchecked {
  border-color: var(--color-border);
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
}

/* ============================ 화면 5 — 출력 창 · 토큰 · 루브릭 ============================ */
.pat-out__body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--space-3);
  min-height: 120px;
  background: var(--color-console-bg);
  color: var(--color-console-text);
  border-radius: 0 0 var(--radius) var(--radius);
  overflow-x: auto;
}

.pat-out__line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.pat-out__no {
  min-width: 18px;
  color: #94a3b8;
  font-size: var(--fs-small);
}

.pat-out__text {
  white-space: pre;
  letter-spacing: 0.08em;
}

.pat-out__mark {
  font-weight: 700;
}

.pat-out__line.is-ok .pat-out__mark {
  color: #6ee7b7;
}

.pat-out__line.is-diff .pat-out__mark,
.pat-out__line.is-diff .pat-out__text {
  color: var(--color-error-on-dark);
}

/* 코드와 토큰 카드 상자를 좌우로 나란히 둔다 (명세 11.4) */
.proj-code {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: var(--space-4);
  align-items: start;
}

.token-box {
  padding: var(--space-3);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.token-card {
  min-height: 40px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  font-weight: 700;
  cursor: pointer;
}

.token-card:hover {
  background: var(--color-surface);
}

.rubric {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.rubric__row {
  display: grid;
  grid-template-columns: minmax(120px, 1fr) minmax(80px, 2fr) auto;
  gap: var(--space-3);
  align-items: center;
}

.rubric__label {
  font-size: var(--fs-small);
  font-weight: 700;
}

.rubric__bar {
  height: 12px;
  border-radius: 999px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.rubric__fill {
  display: block;
  height: 100%;
  background: var(--color-primary);
  transition: width var(--dur-progress) ease-out;
}

.rubric__score {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  white-space: nowrap;
}

/* 빈칸 입력의 정오 표시 */
.blank-input.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.blank-input.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.blank-input[readonly] {
  background: var(--color-muted-bg);
  cursor: pointer;
}

/* 토큰 카드로 채운 칸은 「채워졌다」는 것이 한눈에 보이게 한다. */
.blank-input.is-filled {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  font-weight: 700;
}

/* ============================ 화면 6 — 1차시와 같은 형식 ============================
 * 공용 부품(.score-card · .accordion · .summary-list · .check-btn · .next-lesson ·
 * .options / .option)은 steps.css 에 있고, 여기에는 화면 6 에서만 쓰는 것만 둔다.
 * (1차시 lesson3_7_1 의 steps.css · step6.css 와 같은 모양을 유지한다)
 * ------------------------------------------------------------------ */

.quiz {
  max-width: 820px;
}

/* 문항 진행 표시 「문항 N / 6」 + 진행 점 */
.quiz__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.quiz__counter {
  flex: 0 0 auto;
  font-weight: 800;
  white-space: nowrap;
}

.quiz__dots {
  display: flex;
  gap: 6px;
}

.quiz__dot {
  position: relative;
  width: 10px;
  height: 10px;
  padding: 0;
  border: 2px solid var(--color-border-strong);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

/* 점은 10px 이지만 터치 대상은 44px 을 확보한다(명세 51장) */
.quiz__dot::after {
  content: '';
  position: absolute;
  inset: -17px;
}

.quiz__dot.is-answered {
  background: var(--color-primary);
  border-color: var(--color-primary);
}

.quiz__dot.is-current {
  transform: scale(1.35);
  border-color: var(--color-primary);
}

.quiz__tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.quiz__question {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.6;
}

.quiz__no {
  margin-right: var(--space-1);
  color: var(--color-primary-dark);
}

.quiz__note {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.option:focus-within {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/* 응시자 정보 카드 — 5차시에서는 «선택»이므로 문제 풀이를 잠그지 않는다(명세 14장) */
.student-card {
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.student-card.is-ready {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.student-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.student-card__title {
  font-size: 15px;
  font-weight: 800;
}

.student-card__badge {
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.student-card__fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  gap: var(--space-3);
}

.student-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.student-field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.student-field__input {
  width: 100%;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: 16px; /* iOS 자동 확대 방지 */
  font-weight: 600;
}

.student-field__input:hover:not(:disabled) {
  border-color: var(--color-primary);
}

.student-card__note {
  margin-top: var(--space-2);
  min-height: 1.4em;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-false-dark);
}

.student-card__note.is-ok {
  color: var(--color-true-dark);
}

.student-card__privacy {
  margin-top: 4px;
  font-size: 12px;
  color: var(--color-text-sub);
}

/* 「답안은 한 번만 제출할 수 있어요」 안내 — 버튼 바로 아래 (명세 23.1) */
.submit-notice {
  margin-top: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-small);
  font-weight: 600;
  line-height: 1.6;
}

.submit-notice p {
  margin: 0;
}

.submit-notice.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.submit-notice.is-blocked {
  border-color: var(--color-error);

      write: function (text) {
        return line(text);
      },
      writeMuted: function (text) {
        return line(text, 'console__line--muted');
      },
      writeError: function (text) {

      },
      writeHint: function (text) {
        return line(text, 'console__line--hint');
      },
      clear: showEmpty,
      isEmpty: function () {
        return Boolean(body.querySelector('.console__empty'));
      }
    };
  }

  /* ------------------------ 피드백 영역 ------------------------ */
  var FEEDBACK_ICON = { success: '✅', info: '💡', warning: '⚠️', error: '❌' };

  function createFeedback(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '조작하면 이곳에 안내가 표시돼요.';
    var icon = el('span', { 'class': 'feedback__icon', text: '💬' });
    var textNode = el('div', { 'class': 'feedback__text', text: emptyText });
    var root = el('div', {
      'class': 'feedback is-empty',
      attrs: { 'aria-live': 'assertive', role: 'status' }
    });
    root.appendChild(icon);
    root.appendChild(textNode);

    return {
      root: root,
      /**
       * @param {'success'|'info'|'warning'|'error'} type
       * @param {string} html 표시할 내용(HTML 허용)
       * @param {string} [customIcon] 🎉 · 🏅 등 다른 아이콘을 쓰고 싶을 때
       */
      show: function (type, html, customIcon) {
        root.className = 'feedback feedback--' + type;
        icon.textContent = customIcon || FEEDBACK_ICON[type] || '💬';
        textNode.innerHTML = html;
      },
      clear: function () {
        root.className = 'feedback is-empty';
        icon.textContent = '💬';
        textNode.textContent = emptyText;
      }

  }

  }

  function dataTable(opts) {

    var head = o.head || [];
    var rows = o.rows || [];
    var table = el('table', { 'class': ('data-table ' + (o.className || '')).trim() }, [
      o.caption ? el('caption', { 'class': 'sr-only', text: o.caption }) : null,
      el('thead', {}, [
        el(
          'tr',
          {},
          head.map(function (h) {
            return el('th', { scope: 'col', html: h });
          })
        )
      ]),
      el(
        'tbody',
        {},
        rows.map(function (row) {
          return el(
            'tr',
            {},
            row.map(function (cell, i) {
              var tag = i === 0 ? 'th' : 'td';
              var props = i === 0 ? { scope: 'row' } : {};
              if (cell instanceof Node) {
                var td = el(tag, props);
                td.appendChild(cell);
                return td;
              }
              props.html = cell;

  }

  function callout(html, opts) {
    var o = opts || {};
    return el('div', { 'class': ('callout ' + (o.muted ? 'callout--muted' : '')).trim(), html: html });
  }

  /** 🏅 배지 카드 (명세 9.11 · 이번 차시 추가 헬퍼) */
  function award(opts) {
    var o = opts || {};
    return el('div', { 'class': 'award' }, [
      el('span', { 'class': 'award__icon', text: o.icon || '🏅', attrs: { 'aria-hidden': 'true' } }),
      el('div', { 'class': 'award__body' }, [
        el('p', { 'class': 'award__title', text: o.title || '' }),
        o.text ? el('p', { 'class': 'award__text', html: o.text }) : null

    ]);
  }

  /** 보충 학습 바로가기 줄 (명세 10.3 · 이번 차시 추가 헬퍼) */
  function linkLine(opts) {
    var o = opts || {};
    return el('div', { 'class': 'linkline' }, [
      el('span', { 'class': 'linkline__label', html: o.text || '' }),
      button({
        label: o.label || o.step + '단계로 이동',
        variant: 'secondary',
        className: 'linkline__link',
        ariaLabel: o.step + '단계 화면으로 이동',
        onClick: function () {

        }
      })

  }

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {
    var region = document.getElementById('toast-region');
    if (!region) return;
    var node = el('div', { 'class': 'toast', text: message });
    region.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, duration || 2600);
  }

  function announce(message) {
    var live = document.getElementById('sr-live');
    if (!live) return;
    live.textContent = '';
    setTimeout(function () {
      live.textContent = message;
    }, 30);
  }

  /**
   * 확인 대화상자 (저장된 진행 복원 · 초기화 확인)
   * dismissValue: Esc 키·백드롭 등으로 그냥 닫았을 때 돌려줄 값.
   */
  function confirmDialog(opts) {
    var o = opts || {};
    var dismissValue = o.dismissValue === undefined ? false : o.dismissValue;
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,
      tabindex: '0',
      dataset: { tip: tip },
      attrs: { 'aria-label': text + '. ' + tip }
    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');
    });
    return node;
  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.scrollToNode = scrollToNode;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.mobileTabs = mobileTabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;
  ui.badge = badge;
  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;
})();
    </script>
    <script data-from="js/20-codeview.js">
/**
 * 파이썬 코드 표시 컴포넌트 (명세 8.2 들여쓰기 안내선 / 8.3 조건 실행 상태 / 20.2 코드 화면)
 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (0~3단계 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시
 *  - 조건식 결과 배지(True ✓ · False ✕)를 줄 옆에 붙인다
 *
 * 1·2차시와 «같은 파일»이다. 고칠 일이 생기면 세 차시를 함께 맞춘다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  // 이 차시는 클래스 구현이 주제이므로 class · def · self · return 을 키워드로 추가한다.
  // self 는 파이썬 예약어가 아니지만, «호출한 객체»를 가리키는 이름이라는 것을 눈에 띄게 하려고
  // 키워드와 같은 색으로 칠한다(명세 20.2 : 코드의 구조가 잘 보이게 한다).
  var KEYWORDS = /^(class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

  var TOKEN_RE = /(\b(?:class|def|self|return|if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range|sum|random|randint)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\+=|-=|\/\/|[%+\-*/<>=])/g;

  function span(cls, textContent) {
    return '<span class="' + cls + '">' + escapeHtml(textContent) + '</span>';
  }

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */
  function highlightSegment(segment) {
    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);
    }
    if (last < segment.length) out += escapeHtml(segment.slice(last));
    return out;
  }

  /**
   * 파이썬 한 줄(들여쓰기 제외)을 하이라이팅한 HTML 문자열로 바꾼다.
   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.
   */
  function highlightPython(source) {
    var src = String(source === undefined || source === null ? '' : source);
    var out = '';
    var i = 0;
    var buffer = '';

    var flush = function () {
      if (buffer) {
        out += highlightSegment(buffer);
        buffer = '';
      }
    };

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {
        flush();
        out += span('tok-comment', src.slice(i));
        return out;
      }
      if (ch === '"' || ch === "'") {
        flush();
        var j = i + 1;
        while (j < src.length && src[j] !== ch) {
          if (src[j] === '\\') j += 1;
          j += 1;
        }
        out += span('tok-str', src.slice(i, Math.min(j + 1, src.length)));
        i = j + 1;
        continue;
      }
      buffer += ch;
      i += 1;
    }
    flush();
    return out;
  }

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */
  function indentHtml(spaces) {
    if (spaces <= 0) return '';
    var html = '';
    var left = spaces;
    var first = true;
    while (left > 0) {
      var width = Math.min(4, left);
      html +=
        '<span class="indent' +
        (first ? ' indent--first' : '') +
        '"' +
        (width === 4 ? '' : ' style="width:' + width + 'ch"') +
        '></span>';
      left -= width;
      first = false;
    }
    return html;
  }

  function splitIndent(code) {
    var normalized = String(code === undefined || code === null ? '' : code).replace(/\t/g, '    ');
    var match = normalized.match(/^ */);
    var spaces = match ? match[0].length : 0;
    return { spaces: spaces, rest: normalized.slice(spaces) };
  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{
   *   code?: string,                 // 원본 코드 한 줄(앞 공백 = 들여쓰기)
   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁
   * }>
   */
  function createCodeView(opts) {
    var o = opts || {};
    var showLineNumbers = o.showLineNumbers !== false;
    var linesWrap = el('div', { 'class': 'codeview__lines' });
    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);
    var head =
      o.title || o.headExtra
        ? el('div', { 'class': 'codeview__head' }, [
            o.title ? el('span', { 'class': 'codeview__title', html: o.title }) : el('span'),
            o.headExtra || null
          ])
        : null;
    var children = [];
    if (head) children.push(head);
    children.push(scroll);
    var root = el(
      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },
      children
    );

    var current = [];
    var lineEls = [];

    function build(nextLines) {
      current = nextLines || [];
      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }
        });

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.
        var usesParts = Array.isArray(line.parts);
        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  /* ------------------------------------------------------------------ */
  /* 줄별 주석 (이번 차시에 추가 · 명세 9.2)                                  */
  /* ------------------------------------------------------------------ */

  /**
   * 코드 한 줄과 그 줄의 설명을 «같은 행»에 나란히 놓는다.
   *
   * 설명 카드를 따로 모아 두면 어느 카드가 어느 줄의 설명인지 다시 찾아야 하고,
   * 카드 수와 줄 수가 맞지 않으면 줄바꿈이 어긋난다. 그래서 자리를 격자로 묶는다.
   * 화면 4 ②(Phone 클래스)와 화면 5 ①(메소드와 self)이 이 부품을 함께 쓴다.
   *
   * @param {{items:Array<{code:string, key?:string, note:string, no?:number|string}>,
   *          headCode?:string, headNote?:string, ariaLabel?:string}} opts
   *   note 에는 <code> 같은 간단한 태그를 쓸 수 있다(우리가 쓴 고정 문구만 넣는다).
   */
  function createAnnotated(opts) {
    var o = opts || {};
    var items = o.items || [];

  /**
   * 명세 8.2 : 네 구역 조립 채점.
   * @param {{cls:string, sound:string, branch:string, intro:string}} picks 구역별로 고른 조각 id
   */
  function checkZones(picks) {
    var p = picks || {};
    var zones = ZONES.map(function (zone) {
      var option = zoneOption(zone.key, p[zone.key]);
      return {
        key: zone.key,
        no: zone.no,
        title: zone.title,
        id: option ? option.id : null,
        ok: Boolean(option && option.ok),
        why: option && !option.ok ? option.why : ''
      };
    });
    return {
      zones: zones,
      filled: zones.filter(function (z) {
        return z.id;
      }).length,
      total: ZONES.length,
      ok: zones.every(function (z) {
        return z.ok;
      }),
      problems: zones
        .filter(function (z) {
          return z.id && !z.ok;
        })
        .map(function (z) {
          return z.no + ' ' + z.title + ' — ' + z.why;
        })
    };
  }

  /** 고른 조각을 이어 붙인 «완성 코드» (빈 줄로 구역을 나눈다) */
  function zonesToCode(picks) {
    var out = [];
    ZONES.forEach(function (zone, i) {
      var option = zoneOption(zone.key, (picks || {})[zone.key]);
      if (i > 0) out.push('');
      if (!option) {
        out.push('# ' + zone.no + ' ' + zone.title + ' — 아직 고르지 않았어요');
        return;
      }
      option.lines.forEach(function (line) {
        out.push(line);
      });
    });
    return out;
  }

  /**
   * 명세 8.3 : 조건 분기 시뮬레이션.
   * 어떤 조건을 검사했고, 어디서 참이 되었고, 이후 조건은 검사하지 않았음을 함께 돌려준다.
   *
   * @param {string} animal 지금 self.animal 값
   * @param {Array<{animal:string,sound:string}>} [extra] 학생이 추가한 조건 분기
   */
  function runSound(animal, extra) {
    var rules = SOUND_RULES.concat(Array.isArray(extra) ? extra : []);
    var steps = [];
    var matchedIndex = -1;

    rules.forEach(function (rule, i) {
      var keyword = i === 0 ? 'if' : 'elif';
      if (matchedIndex !== -1) {
        steps.push({
          kind: keyword,
          cond: 'self.animal == "' + rule.animal + '"',
          result: 'unchecked',
          out: rule.sound
        });
        return;
      }
      var hit = String(animal) === String(rule.animal);
      steps.push({
        kind: keyword,
        cond: 'self.animal == "' + rule.animal + '"',
        result: hit ? 'true' : 'false',
        out: rule.sound
      });
      if (hit) matchedIndex = i;
    });

    steps.push({
      kind: 'else',
      cond: '위 조건이 모두 거짓일 때',
      result: matchedIndex === -1 ? 'true' : 'unchecked',
      out: UNKNOWN_SOUND
    });

    return {
      animal: String(animal),
      steps: steps,
      matchedIndex: matchedIndex,
      /** 실행되는 print() 자리 (steps 기준) */
      chosen: matchedIndex === -1 ? steps.length - 1 : matchedIndex,
      output: matchedIndex === -1 ? UNKNOWN_SOUND : rules[matchedIndex].sound
    };
  }
