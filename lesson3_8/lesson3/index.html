    { key: 'name', label: '이름', code: 'print(f"이름: {self.name}")' },
    { key: 'animal', label: '종류', code: 'print(f"종류: {self.animal}")' },
    { key: 'age', label: '나이', code: 'print(f"나이: {self.age}살")', needs: 'age' },
    { key: 'hungry', label: '배고픔', code: 'print(f"배고픔: {self.hungry}")', needs: 'hungry' }
  ];

  /** eat() · play() 본문의 기본 문구 (학생이 뒷말을 고쳐 쓴다) */
  var METHOD_DEFAULT_TAIL = { eat: '먹이를 먹습니다.', play: '즐겁게 놉니다.' };

  /** 새 동물과 울음소리 예시 (버튼으로 빠르게 채운다) */
  var NEW_ANIMAL_PRESETS = [
    { animal: '햄스터', sound: '찍찍' },
    { animal: '토끼', sound: '깡총' },
    { animal: '거북이', sound: '조용…' },
    { animal: '병아리', sound: '삐약' }
  ];

  /* ------------------ 학생이 «직접 만드는» 속성과 메소드 ------------------ */

  /** 한 번에 너무 많이 만들지 않도록 (명세 22장 : 입력 제한) */
  var CUSTOM_LIMIT = { properties: 3, methods: 3 };
  var CUSTOM_NAME_MAX = 20;

  /** 이미 쓰고 있거나 파이썬이 다른 뜻으로 쓰는 이름 */
  var TAKEN_NAMES = [
    'name', 'animal', 'age', 'hungry',
    'sound', 'introduce', 'eat', 'play', 'show_info', 'introduce_age',
    'self', 'class', 'def', 'if', 'elif', 'else', 'for', 'while', 'return',
    'print', 'True', 'False', 'None', 'Pet'
  ];

  /** 파이썬에서 쓸 수 있는 이름인가 (영문자·밑줄로 시작, 영문자·숫자·밑줄) */
  function isValidName(name) {
    return new RegExp('^[A-Za-z_][A-Za-z0-9_]{0,' + (CUSTOM_NAME_MAX - 1) + '}$').test(String(name || ''));
  }

  /** 이미 이 프로젝트에서 쓰고 있는 이름 목록 */
  function usedNames(raw) {
    var project = raw && raw.customProperties ? raw : normalizeProject(raw);
    return TAKEN_NAMES.concat(
      (project.customProperties || []).map(function (p) {
        return p.name;
      }),
      (project.customMethods || []).map(function (m) {
        return m.name;
      })
    );
  }

  /**
   * 학생이 적은 이름을 검사한다. 쓸 수 있으면 빈 문자열, 아니면 «왜 안 되는지» 한 문장.
   * @param {string} name
   * @param {object} project
   * @param {'property'|'method'} kind
   */
  function nameProblem(name, project, kind) {
    var value = String(name === undefined || name === null ? '' : name).trim();
    var what = kind === 'method' ? '기능' : '속성';
    if (!value) return what + ' 이름을 적어 주세요.';
    if (/[가-힣]/.test(value)) return '이름은 영문자로 적어요. (예 : ' + (kind === 'method' ? 'sleep' : 'weight') + ')';
    if (!isValidName(value)) {
      return '영문자나 밑줄로 시작하고, 영문자 · 숫자 · 밑줄만 쓸 수 있어요. (' + CUSTOM_NAME_MAX + '자 이내)';
    }
    if (usedNames(project).indexOf(value) !== -1) return '「' + value + '」 은(는) 이미 쓰고 있는 이름이에요.';
    return '';
  }

  /** 직접 만든 속성 더하기 */
  function addCustomProperty(project, name) {
    var problem = nameProblem(name, project, 'property');
    if (problem) return { ok: false, message: problem };
    if ((project.customProperties || []).length >= CUSTOM_LIMIT.properties) {
      return { ok: false, message: '직접 만든 속성은 ' + CUSTOM_LIMIT.properties + '개까지 넣을 수 있어요.' };
    }
    project.customProperties.push({ name: String(name).trim() });
    return { ok: true, message: '' };
  }

  /** 직접 만든 기능(메소드) 더하기 */
  function addCustomMethod(project, name) {
    var problem = nameProblem(name, project, 'method');
    if (problem) return { ok: false, message: problem };
    if ((project.customMethods || []).length >= CUSTOM_LIMIT.methods) {
      return { ok: false, message: '직접 만든 기능은 ' + CUSTOM_LIMIT.methods + '개까지 넣을 수 있어요.' };
    }
    project.customMethods.push({
      name: String(name).trim(),
      tail: '',
      useSelf: true,
      bodyIndent: 8
    });
    return { ok: true, message: '' };
  }

  function removeCustomProperty(project, name) {
    project.customProperties = (project.customProperties || []).filter(function (p) {
      return p.name !== name;
    });
    ['pet1', 'pet2'].forEach(function (objectName) {
      if (project.values[objectName]) delete project.values[objectName][name];
    });
  }

  function removeCustomMethod(project, name) {
    project.customMethods = (project.customMethods || []).filter(function (m) {
      return m.name !== name;
    });
    ['pet1', 'pet2'].forEach(function (objectName) {
      project.calls[objectName] = (project.calls[objectName] || []).filter(function (m) {
        return m !== name;
      });
    });
  }

  /** 직접 만든 항목 수 */
  function customCount(project) {
    var p = project || {};
    return (p.customProperties || []).length + (p.customMethods || []).length;
  }

  function customMethod(project, name) {
    return (
      (project.customMethods || []).filter(function (m) {
        return m.name === name;
      })[0] || null
    );
  }

  /** 명세 10.3 : 객체별 속성값 기본값 */
  function defaultProject() {
    return {
      className: 'Pet',
      extensions: [],
      /** 학생이 직접 만든 속성 [{ name }] · 값은 values 안에 함께 담는다 */
      customProperties: [],
      /** 학생이 직접 만든 기능 [{ name, tail, useSelf, bodyIndent }] */
      customMethods: [],
      /** 객체별 속성값 */
      values: {
        pet1: { name: '초코', animal: '고양이', age: 3, hungry: false },
        pet2: { name: '구름', animal: '강아지', age: 1, hungry: true }
      },
      /** 확장 메소드 구조 */
      methods: {
        eat: { tail: METHOD_DEFAULT_TAIL.eat, useSelf: true, bodyIndent: 8 },
        play: { tail: METHOD_DEFAULT_TAIL.play, useSelf: true, bodyIndent: 8 },
        show_info: { fields: ['name', 'animal'], useSelf: true, bodyIndent: 8 }
      },
      /** 확장 조건 분기 */
      branches: {
        newAnimal: { animal: '', sound: '' },
        ageBranch: { threshold: 2, useSelf: true, bodyIndent: 12 }
      },
      /** 객체별로 호출할 메소드 */
      calls: { pet1: ['introduce', 'sound'], pet2: ['introduce', 'sound'] }
    };
  }

  /** 빠진 칸을 기본값으로 메워 «항상 같은 모양»의 프로젝트 객체를 만든다. */
  function normalizeProject(raw) {
    var base = defaultProject();
    var p = raw && typeof raw === 'object' ? raw : {};
    var out = {
      className: 'Pet',
      extensions: (Array.isArray(p.extensions) ? p.extensions : []).filter(function (key) {
        return Boolean(extensionByKey(key));
      }),
      customProperties: [],
      customMethods: [],
      values: { pet1: {}, pet2: {} },
      methods: {},
      branches: {},
      calls: { pet1: [], pet2: [] }
    };

    /* 직접 만든 속성 · 기능 — 이름 규칙에 맞는 것만, 정해진 개수까지 */
    var seen = TAKEN_NAMES.slice();
    (Array.isArray(p.customProperties) ? p.customProperties : []).forEach(function (item) {
      if (out.customProperties.length >= CUSTOM_LIMIT.properties) return;
      var name = String((item && item.name) || '').trim();
      if (!isValidName(name) || seen.indexOf(name) !== -1) return;
      seen.push(name);
      out.customProperties.push({ name: name });
    });
    (Array.isArray(p.customMethods) ? p.customMethods : []).forEach(function (item) {
      if (out.customMethods.length >= CUSTOM_LIMIT.methods) return;
      var name = String((item && item.name) || '').trim();
      if (!isValidName(name) || seen.indexOf(name) !== -1) return;
      seen.push(name);
      out.customMethods.push({
        name: name,
        tail: String(item.tail === undefined || item.tail === null ? '' : item.tail).slice(0, 40),
        useSelf: item.useSelf === undefined ? true : Boolean(item.useSelf),
        bodyIndent: Number(item.bodyIndent) === 4 ? 4 : 8
      });
    });

    ['pet1', 'pet2'].forEach(function (name) {
      var src = (p.values && p.values[name]) || {};
      var def = base.values[name];
      out.values[name] = {
        name: src.name === undefined || src.name === null || src.name === '' ? def.name : String(src.name),
        animal:
          src.animal === undefined || src.animal === null || src.animal === ''
            ? def.animal
            : String(src.animal),
        age: src.age === undefined || src.age === null || src.age === '' ? '' : Number(src.age),
        hungry: src.hungry === undefined || src.hungry === null ? def.hungry : Boolean(src.hungry)
      };
      // 직접 만든 속성의 값도 같은 자리에 담는다(글자로만 다룬다).
      out.customProperties.forEach(function (prop) {
        var value = src[prop.name];
        out.values[name][prop.name] = String(
          value === undefined || value === null ? '' : value
        ).slice(0, 30);
      });
      var calls = (p.calls && p.calls[name]) || [];
      out.calls[name] = Array.isArray(calls) ? calls.slice() : [];
    });

    ['eat', 'play'].forEach(function (key) {
      var src = (p.methods && p.methods[key]) || {};
      out.methods[key] = {
        tail: src.tail === undefined || src.tail === null ? base.methods[key].tail : String(src.tail),
        useSelf: src.useSelf === undefined ? true : Boolean(src.useSelf),
        bodyIndent: Number(src.bodyIndent) === 4 ? 4 : 8
      };
    });
    var info = (p.methods && p.methods.show_info) || {};
    out.methods.show_info = {
      fields: Array.isArray(info.fields) ? info.fields.slice() : base.methods.show_info.fields.slice(),
      useSelf: info.useSelf === undefined ? true : Boolean(info.useSelf),
      bodyIndent: Number(info.bodyIndent) === 4 ? 4 : 8
    };

    var na = (p.branches && p.branches.newAnimal) || {};
    out.branches.newAnimal = {
      animal: String(na.animal === undefined || na.animal === null ? '' : na.animal).trim(),
      sound: String(na.sound === undefined || na.sound === null ? '' : na.sound).trim()
    };
    var ab = (p.branches && p.branches.ageBranch) || {};
    out.branches.ageBranch = {
      threshold: isNaN(Number(ab.threshold)) ? 2 : Number(ab.threshold),
      useSelf: ab.useSelf === undefined ? true : Boolean(ab.useSelf),
      bodyIndent: Number(ab.bodyIndent) === 8 ? 8 : 12
    };
    return out;
  }

  function hasExt(project, key) {
    return (project.extensions || []).indexOf(key) !== -1;
  }

  /** «새로 추가된» 속성 이름 (고른 것 + 직접 만든 것) */
  function newProperties(project) {
    return ['age', 'hungry']
      .filter(function (key) {
        return hasExt(project, key);
      })
      .concat(
        (project.customProperties || []).map(function (p) {
          return p.name;
        })
      );
  }

  /** «새로 추가된» 메소드 이름 (고른 것 + 직접 만든 것) */
  function newMethods(project) {
    var list = ['eat', 'play', 'show_info'].filter(function (key) {
      return hasExt(project, key);
    });
    if (hasExt(project, 'ageBranch')) list.push('introduce_age');
    return list.concat(
      (project.customMethods || []).map(function (m) {
        return m.name;
      })
    );
  }

  /** 이 프로젝트에서 부를 수 있는 메소드 전체 */
  function availableMethods(project) {
    return BASE_METHODS.concat(newMethods(project));
  }

  /** show_info() 가 실제로 출력할 항목 (선택하지 않은 속성은 뺀다) */
  function infoFieldsOf(project) {
    return (project.methods.show_info.fields || []).filter(function (key) {
      var field = INFO_FIELDS.filter(function (f) {
        return f.key === key;
      })[0];
      if (!field) return false;
      if (field.needs && !hasExt(project, field.needs)) return false;
      return true;
    });
  }

  /* ------------------------- 코드 만들기 (명세 10.2) ------------------------- */

  function pad(n) {
    return new Array(Number(n) + 1).join(' ');
  }

  function pyValue(value) {
    if (typeof value === 'boolean') return value ? 'True' : 'False';
    if (typeof value === 'number') return String(value);
    return '"' + String(value) + '"';
  }

  /**
   * 학생이 직접 적은 값을 파이썬 값으로 적는다.
   * 숫자처럼 보이면 숫자로, True · False 면 참·거짓으로, 그 밖에는 문자열로 적는다.
   */
  function customLiteral(value) {
    var s = String(value === undefined || value === null ? '' : value).trim();
    if (s === '') return '""';
    if (/^-?\d+(\.\d+)?$/.test(s)) return s;
    if (s === 'True' || s === 'False') return s;
    return '"' + s + '"';
  }

  /** 직접 만든 속성의 «클래스 기본값» — 두 객체 값의 모양을 보고 정한다. */
  function customDefault(project, propName) {
    var values = ['pet1', 'pet2'].map(function (objectName) {
      return String(project.values[objectName][propName] || '').trim();
    });
    var filled = values.filter(function (v) {
      return v !== '';
    });
    if (filled.length && filled.every(function (v) {
      return /^-?\d+(\.\d+)?$/.test(v);
    })) {
      return '0';
    }
    if (filled.length && filled.every(function (v) {
      return v === 'True' || v === 'False';
    })) {
      return 'False';
    }
    return '""';
  }

  /**
   * 구조화된 입력을 «완성 파이썬 코드»로 만든다.
   * 학생 입력을 실행하지 않고 글자로만 다룬다(명세 22장).
   */
  function projectCode(raw) {
    var project = normalizeProject(raw);
    var lines = ['class Pet:', '    name = "펫"', '    animal = "강아지"'];

    if (hasExt(project, 'age')) lines.push('    age = 1');
    if (hasExt(project, 'hungry')) lines.push('    hungry = True');
    // 직접 만든 속성 — 클래스에는 기본값을, 객체별 값은 아래에서 정한다.
    project.customProperties.forEach(function (prop) {
      lines.push('    ' + prop.name + ' = ' + customDefault(project, prop.name));
    });

    /* sound() — 확장한 조건 분기를 포함한다 */
    lines.push('');
    lines.push('    def sound(self):');
    SOUND_RULES.forEach(function (rule, i) {
      lines.push('        ' + (i === 0 ? 'if' : 'elif') + ' self.animal == "' + rule.animal + '":');
      lines.push('            print("' + rule.sound + '")');
    });
    var na = project.branches.newAnimal;
    if (hasExt(project, 'newAnimal') && na.animal && na.sound) {
      lines.push('        elif self.animal == "' + na.animal + '":');
      lines.push('            print("' + na.sound + '")');
    }
    lines.push('        else:');
    lines.push('            print("' + UNKNOWN_SOUND + '")');

    /* introduce() */
    lines.push('');
    lines.push('    def introduce(self):');
    lines.push('        print(f"안녕하세요. 저는 {self.animal} {self.name}입니다.")');

    /* 확장 메소드 */
    ['eat', 'play'].forEach(function (key) {
      if (!hasExt(project, key)) return;
      var m = project.methods[key];
      var who = m.useSelf ? '{self.name}' : '{name}';
      lines.push('');
      lines.push('    def ' + key + '(self):');
      lines.push(pad(m.bodyIndent) + 'print(f"' + who + '이(가) ' + m.tail + '")');
    });

    if (hasExt(project, 'show_info')) {
      var info = project.methods.show_info;
      lines.push('');
      lines.push('    def show_info(self):');
      var fields = infoFieldsOf(project);
      if (!fields.length) {
        lines.push(pad(info.bodyIndent) + '# 출력할 항목을 골라 주세요');
      }
      fields.forEach(function (key) {
        var field = INFO_FIELDS.filter(function (f) {
          return f.key === key;
        })[0];
        var code = info.useSelf ? field.code : field.code.replace(/self\./g, '');
        lines.push(pad(info.bodyIndent) + code);
      });
    }

    /* 직접 만든 기능 */
    project.customMethods.forEach(function (m) {
      var who = m.useSelf ? '{self.name}' : '{name}';
      lines.push('');
      lines.push('    def ' + m.name + '(self):');
      lines.push(pad(m.bodyIndent) + 'print(f"' + who + '이(가) ' + (m.tail || '…') + '")');
    });

    if (hasExt(project, 'ageBranch')) {
      var ab = project.branches.ageBranch;
      var owner = ab.useSelf ? 'self.' : '';
      lines.push('');
      lines.push('    def introduce_age(self):');
      lines.push('        if ' + owner + 'age < ' + ab.threshold + ':');
      lines.push(pad(ab.bodyIndent) + 'print(f"{' + owner + 'name}은(는) 어린 반려동물입니다.")');
      lines.push('        else:');
      lines.push(pad(ab.bodyIndent) + 'print(f"{' + owner + 'name}은(는) 다 자란 반려동물입니다.")');
    }

    /* 객체 생성 · 속성 변경 */
    ['pet1', 'pet2'].forEach(function (objectName) {
      var v = project.values[objectName];
      lines.push('');
      lines.push(objectName + ' = Pet()');
      lines.push(objectName + '.name = ' + pyValue(v.name));
      lines.push(objectName + '.animal = ' + pyValue(v.animal));
      if (hasExt(project, 'age') && v.age !== '') {
        lines.push(objectName + '.age = ' + pyValue(Number(v.age)));
      }
      if (hasExt(project, 'hungry')) {
        lines.push(objectName + '.hungry = ' + pyValue(Boolean(v.hungry)));
      }
      project.customProperties.forEach(function (prop) {
        var value = String(v[prop.name] || '').trim();
        if (value !== '') lines.push(objectName + '.' + prop.name + ' = ' + customLiteral(value));
      });
    });

    /* 메소드 호출 */
    var anyCall = false;
    ['pet1', 'pet2'].forEach(function (objectName) {
      var calls = project.calls[objectName] || [];
      if (!calls.length) return;
      if (!anyCall) lines.push('');
      anyCall = true;
      calls.forEach(function (method) {
        lines.push(objectName + '.' + method + '()');
      });
    });

    return lines;
  }

  /* ------------------------- 실행 결과 (명세 10.4) ------------------------- */

  /** 메소드 한 번 호출의 출력 줄들 */
  function callOutput(project, objectName, method) {
    var v = project.values[objectName];
    var name = v.name;
    var animal = v.animal;

    if (method === 'introduce') {
      return ['안녕하세요. 저는 ' + animal + ' ' + name + '입니다.'];
    }
    if (method === 'sound') {
      var extra =
        hasExt(project, 'newAnimal') && project.branches.newAnimal.animal
          ? [project.branches.newAnimal]
          : [];
      return [soundOf(animal, extra)];
    }
    if (method === 'eat' || method === 'play') {
      return [name + '이(가) ' + project.methods[method].tail];
    }
    if (method === 'show_info') {
      return infoFieldsOf(project).map(function (key) {
        if (key === 'name') return '이름: ' + name;
        if (key === 'animal') return '종류: ' + animal;
        if (key === 'age') return '나이: ' + (v.age === '' ? '?' : v.age) + '살';
        return '배고픔: ' + (v.hungry ? 'True' : 'False');
      });
    }
    if (method === 'introduce_age') {
      var age = v.age === '' ? 0 : Number(v.age);
      var threshold = project.branches.ageBranch.threshold;
      return [
        name + '은(는) ' + (age < threshold ? '어린' : '다 자란') + ' 반려동물입니다.'
      ];
    }
    // 학생이 직접 만든 기능
    var custom = customMethod(project, method);
    if (custom) return [name + '이(가) ' + (custom.tail || '…')];
    return [];
  }

  /**
   * 프로젝트를 실행한 결과. 실제 파이썬을 돌리지 않고 위 규칙으로만 만든다.
   * @returns {{output:string[], perObject:{pet1:string[], pet2:string[]}, calls:Array}}
   */
  function runProject(raw) {
    var project = normalizeProject(raw);
    var output = [];
    var perObject = { pet1: [], pet2: [] };
    var calls = [];

    ['pet1', 'pet2'].forEach(function (objectName) {
      (project.calls[objectName] || []).forEach(function (method) {
        var produced = callOutput(project, objectName, method);
        calls.push({ object: objectName, method: method, output: produced });
        produced.forEach(function (line) {
          output.push(line);
          perObject[objectName].push(line);
        });
      });
    });

    return { output: output, perObject: perObject, calls: calls };
  }

  /** 명세 10.3 : 객체별 속성값 표 (확장한 속성만 줄을 늘린다) */
  function valueTable(raw) {
    var project = normalizeProject(raw);
    var rows = [

          // 객체를 만들지 않고 속성 이름을 단독 변수로 쓴 경우
          if (p.kind === 'assign' && p.target === step.attr) pushErr(CODE_ERRORS.attrTarget);
          return;
        }

        /* ③ 메소드 호출 */
        if (step.kind === 'call') {
          if (p.kind === 'call' && p.method === step.method) {
            if (p.target !== step.object) {
              if (names.indexOf(p.target) === -1) pushErr(CODE_ERRORS.objectName);
              return;
            }
            if (!elements[step.key]) {
              elements[step.key] = true;
              at[step.key] = i;
            }
            return;
          }
          // 소괄호를 빼면 호출이 아니다(명세 11.7).
          if (p.kind === 'ref' && p.attr === step.method && p.target === step.object) {
            if (seenAt[step.key] === -1) seenAt[step.key] = i;
            pushErr(CODE_ERRORS.noParen);
          }
        }
      });
    });

    var matched = steps.filter(function (step) {
      return elements[step.key];
    }).length;

    /* ------------------------- 선후 관계 검사 ------------------------- */
    var ordered = true;

    // (1) 각 객체는 «자신의» 속성 변경과 메소드 호출 전에 생성되어야 한다.
    (s.objects || []).forEach(function (obj, i) {
      var no = i + 1;
      var createAt = at['create' + no];
      if (createAt === -1) return;
      ['attr' + no, 'call' + no].forEach(function (key) {
        if (at[key] !== -1 && at[key] < createAt) {
          ordered = false;
          pushErr(CODE_ERRORS.createOrder);
        }
      });
    });

    // (2) 기대 출력 순서를 위해 첫 객체의 호출이 먼저 와야 한다.
    var callKeys = (s.objects || []).map(function (_, i) {
      return 'call' + (i + 1);
    });
    for (var k = 1; k < callKeys.length; k += 1) {
      var prev = at[callKeys[k - 1]];
      var cur = at[callKeys[k]];
      if (prev !== -1 && cur !== -1 && cur < prev) {
        ordered = false;
        pushErr(CODE_ERRORS.callOrder);
      }
    }

    /* --------------- 충족하지 못한 요소를 오류 유형으로 분류 --------------- */
    steps.forEach(function (step) {
      if (elements[step.key]) return;

      if (step.kind === 'create') {
        // seenAt 이 있으면 «그 객체를 만들려 한 줄»은 있었고 클래스 이름이 어긋난 경우다.
        // 그때는 클래스명 오류만 남기고 생성 누락으로 중복 분류하지 않는다.
        if (seenAt[step.key] === -1) pushErr(CODE_ERRORS.missingCreate);
        feedback.push(step.hint);
        return;
      }

      if (step.kind === 'call') {
        if (seenAt[step.key] !== -1 && errors.indexOf(CODE_ERRORS.noParen) !== -1) {
          feedback.push(step.hintNoParen);
          return;
        }
        pushErr(CODE_ERRORS.missingCall);
        feedback.push(step.hint);
        return;
      }

      // 속성 대입
      if (seenAt[step.key] !== -1 && errors.indexOf(CODE_ERRORS.attrTarget) !== -1) {
        feedback.push(step.hintTarget);
        return;
      }
      if (seenAt[step.key] !== -1 && errors.indexOf(CODE_ERRORS.attrValue) !== -1) {
        feedback.push(step.hintWrongValue);
        return;
      }
      pushErr(CODE_ERRORS.attrValue);
      feedback.push(step.hint);
    });

    if (!ordered) {
      if (errors.indexOf(CODE_ERRORS.createOrder) !== -1) {
        feedback.push('객체를 «먼저 만든 뒤» 그 객체의 속성을 바꾸고 메소드를 호출해야 해요.');
      }
      if (errors.indexOf(CODE_ERRORS.callOrder) !== -1) {
        feedback.push(
          '기대 결과의 순서대로 출력되려면 ' + (s.requiredCallOrder || []).join(' → ') + ' 순서로 호출해야 해요.'
        );
      }
    }

    return {
      lines: lines,
      matched: matched,
      total: steps.length,
      ok: matched === steps.length && ordered,
      ordered: ordered,
      elements: elements,
      steps: steps.map(function (step) {
        return { key: step.key, label: step.label, ok: elements[step.key] };
      }),
      errors: errors,
      feedback: feedback
    };
  }

            '추가한 조건을 확인하려면 pet1 이나 pet2 의 animal 을 «' + na.animal + '» 로 설정해 sound() 를 호출해 보세요.';
        }
      } else if (key === 'ageBranch') {
        if (!PET.hasExt(project, 'age')) {
          done = false;
          todo = '나이 조건을 쓰려면 age 속성을 함께 선택해야 해요.';
        } else if (!calledAnywhere('introduce_age')) {
          done = false;
          todo = 'introduce_age() 을 pet1 이나 pet2 에서 호출해 주세요.';
        }
      }

      return {
        key: key,
        name: ext.name,
        label: ext.label,
        type: ext.type,
        custom: false,
        done: done,
        todo: todo
      };
    }).concat(customProps, customMethods);
  }

  /** 확장 선택 전체 요약 (명세 10.1) */
  function extensionSummary(raw) {
    var project = PET.normalizeProject(raw);
    var status = extensionStatus(project);
    var done = status.filter(function (s) {
      return s.done;
    });
    var pick = function (type) {
      return done
        .filter(function (s) {
          return s.type === type;
        })
        .map(function (s) {
          return s.name || s.key;
        });
    };

    var newProps = pick('attr');
    var methodNames = pick('method');
    var branchNames = pick('branch');

    return {
      selected: project.extensions.slice(),
      status: status,
      doneCount: done.length,
      incomplete: status.filter(function (s) {
        return !s.done;
      }),
      newProperties: newProps,
      newMethods: methodNames,
      newBranches: branchNames,
      hasNewProperty: newProps.length > 0,
      hasNewMethodOrBranch: methodNames.length + branchNames.length > 0,
      /** 명세 27.1 : 새 속성 1개 이상 + 새 메소드 또는 조건 분기 1개 이상 */
      ok: newProps.length > 0 && methodNames.length + branchNames.length > 0 && done.length >= 2
    };
  }

  /* ------------------------------------------------------------------ */
  /* 자동 확인 아홉 항목 (명세 10.4)                                         */
  /* ------------------------------------------------------------------ */

  /**
   * @param {object} raw       구조화된 프로젝트 입력
   * @param {object} [explain] 설명 5항목 (없어도 아홉 항목 검사는 된다)
   */
  function checkProject(raw, explain) {
    var project = PET.normalizeProject(raw);
    var code = PET.projectCode(project);
    var indent = checkIndent(code);
    var ext = extensionSummary(project);

    var v1 = project.values.pet1;
    var v2 = project.values.pet2;
    var callsPet1 = (project.calls.pet1 || []).length > 0;
    var callsPet2 = (project.calls.pet2 || []).length > 0;

    var results = {
      hasClass: {
        ok: project.className === 'Pet',
        where: '1단계 고르기',
        fix: '클래스 이름은 Pet 으로 두세요.'
      },
      baseProperties: {
        ok: PET.BASE_PROPERTIES.every(function (key) {
          return String(v1[key] || '').length > 0 && String(v2[key] || '').length > 0;
        }),
        where: '3단계 두 반려동물',
        fix: '두 반려동물의 이름과 종류를 모두 채워 주세요.'
      },
      baseMethods: {
        ok: true, // 기본 클래스가 sound() · introduce() 를 항상 포함한다(명세 4.1)
        where: '기본 클래스',
        fix: ''
      },
      twoObjects: {
        ok: true, // pet1 · pet2 두 객체를 항상 다룬다(명세 4.1)
        where: '3단계 두 반려동물',
        fix: ''
      },
      differentValues: {
        ok: v1.name !== v2.name || v1.animal !== v2.animal,
        where: '3단계 두 반려동물',
        fix: 'pet1 과 pet2 의 이름이나 종류를 서로 다르게 정해 주세요.'
      },
      callsEachObject: {
        ok: callsPet1 && callsPet2,
        where: '3단계 두 반려동물 — 실행할 기능',
        fix:
          (!callsPet1 ? 'pet1 ' : '') + (!callsPet1 && !callsPet2 ? '· ' : '') + (!callsPet2 ? 'pet2 ' : '') +
          '이(가) 실행할 기능을 한 개 이상 골라 주세요.'
      },
      newProperty: {
        ok: ext.hasNewProperty,
        where: '1단계 고르기 · 3단계 두 반려동물',
        fix:
          ext.incomplete.filter(function (s) {
            return s.type === 'attr';
          })[0]
            ? ext.incomplete.filter(function (s) {
                return s.type === 'attr';
              })[0].todo
            : 'age · hungry 를 고르거나 속성을 직접 만들고, 두 반려동물의 값을 적어 주세요.'
      },
      newMethodOrBranch: {
        ok: ext.hasNewMethodOrBranch,
        where: '1단계 고르기 · 2단계 기능 내용 채우기',
        fix:
          ext.incomplete.filter(function (s) {
            return s.type !== 'attr';
          })[0]
            ? ext.incomplete.filter(function (s) {
                return s.type !== 'attr';
              })[0].todo
            : 'eat() · play() · show_info() · 새 조건을 고르거나 기능을 직접 만들어 완성해 주세요.'
      },
      indentOk: {
        ok: indent.ok,
        where: '2단계 기능 내용 채우기 (본문 들여쓰기)',
        fix: indent.problems.length
          ? indent.problems[0].code + ' — ' + indent.problems[0].after
          : '기능과 조건의 본문은 한 단계 더 들여씁니다.'
      }
    };

    var checks = CHECK_LABELS.map(function (item) {
      var r = results[item.key];
      return {
        key: item.key,
        label: item.label,
        ok: Boolean(r && r.ok),
        where: r ? r.where : '',
        fix: r && !r.ok ? r.fix : ''
      };
    });

    var passed = checks.filter(function (c) {
      return c.ok;
    }).length;

    var explanation = checkExplanation(explain);

    return {
      project: project,
      code: code,
      checks: checks,
      passed: passed,
      total: CHECK_TOTAL,
      ok: passed === CHECK_TOTAL,
      indent: indent,
      extensions: ext,
      explanation: explanation,
      /** 화면 5 통과 조건 (명세 5장) : 아홉 항목 + 설명 5항목 */
      complete: passed === CHECK_TOTAL && explanation.ok
    };
  }

  /* ------------------------------------------------------------------ */
  /* 설명 5항목 (명세 10.5)                                                 */
  /* ------------------------------------------------------------------ */
  function checkExplanation(raw) {
    var source = raw && typeof raw === 'object' ? raw : {};
    var items = EXPLAIN_QUESTIONS.map(function (q) {
      var text = String(source[q.key] === undefined || source[q.key] === null ? '' : source[q.key]).trim();
      var length = text.length;
      return {
        key: q.key,
        no: q.no,
        prompt: q.prompt,
        text: text,
        length: length,
        ok: length >= EXPLAIN_MIN && length <= EXPLAIN_MAX,
        tooShort: length > 0 && length < EXPLAIN_MIN,
        empty: length === 0
      };
    });
    return {
      items: items,
      filled: items.filter(function (i) {
        return i.ok;
      }).length,
      total: items.length,
      ok: items.every(function (i) {
        return i.ok;
      })
    };
  }

  /* ------------------------------------------------------------------ */
  /* 제출용 요약 (명세 13장)                                                */
  /* ------------------------------------------------------------------ */

  /**
   * 제출 JSON 의 project 항목을 만든다. 교사용도 이 모양을 그대로 읽는다.
   */
  function summarize(raw, explain) {
    var result = checkProject(raw, explain);
    var project = result.project;

    var instances = ['pet1', 'pet2'].map(function (objectName) {
      var v = project.values[objectName];
      var row = { objectName: objectName, name: v.name, animal: v.animal };
      if (PET.hasExt(project, 'age') && v.age !== '') row.age = Number(v.age);
      if (PET.hasExt(project, 'hungry')) row.hungry = Boolean(v.hungry);
      // 직접 만든 속성의 값도 함께 담는다(글자로만 다룬다).
      project.customProperties.forEach(function (prop) {
        var value = String(v[prop.name] || '').trim();
        if (value !== '') row[prop.name] = value;
      });
      row.calls = (project.calls[objectName] || []).slice();
      return row;
    });

    var explanation = {};
    EXPLAIN_QUESTIONS.forEach(function (q) {
      var text = String((explain || {})[q.key] === undefined ? '' : (explain || {})[q.key]).trim();
      explanation[q.key] = text.slice(0, EXPLAIN_MAX);
    });
    // 명세 10.5 : 객체 수는 숫자로도 따로 저장한다.
    explanation.instanceCount = instances.length;

    return {
      className: project.className,
      baseProperties: PET.BASE_PROPERTIES.slice(),
      baseMethods: PET.BASE_METHODS.slice(),
      newProperties: PET.newProperties(project),
      newMethods: PET.newMethods(project),
      /** 학생이 직접 지은 이름 (교사가 한눈에 보도록 따로 담는다) */
      customProperties: project.customProperties.map(function (p) {
        return p.name;
      }),
      customMethods: project.customMethods.map(function (m) {
        return m.name;
      }),
      instances: instances,
      extensions: project.extensions.slice(),
      checksPassed: result.passed,
      checksTotal: result.total,
      failedChecks: result.checks
        .filter(function (c) {
          return !c.ok;
        })
        .map(function (c) {
          return c.label;
        }),
      explanation: explanation,
      /** 교사용이 코드 구조를 그대로 볼 수 있게 생성 코드도 함께 담는다(글자로만 다룬다). */
      code: result.code
    };
  }

  /* ------------------------------------------------------------------ */
  /* 교사용 재확인 (명세 18장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 제출된 project 요약만으로 «다시» 확인한다.
   * 학생 파일의 checksPassed 를 그대로 믿지 않는다(명세 18장).
   * 최종 루브릭 점수는 자동으로 확정하지 않는다(명세 10.6 · 17.1).
   */
  function reviewSubmitted(raw) {
    var p = raw && typeof raw === 'object' ? raw : {};
    var instances = Array.isArray(p.instances) ? p.instances : [];
    var extensions = Array.isArray(p.extensions) ? p.extensions : [];
    var explanation = p.explanation && typeof p.explanation === 'object' ? p.explanation : {};

    var names = instances.map(function (i) {
      return String(i && i.name === undefined ? '' : i.name);
    });
    var animals = instances.map(function (i) {
      return String(i && i.animal === undefined ? '' : i.animal);
    });
    var unique = function (list) {
      return list.filter(function (v, i) {
        return list.indexOf(v) === i;
      }).length;
    };

    /* 제출본이 이름 목록을 담고 있으면 그것을 쓴다(직접 만든 속성 · 기능이 여기 들어 있다).
       옛 형식이면 고른 확장 목록에서 유형을 뽑아 센다. */
    var newProps = Array.isArray(p.newProperties)
      ? p.newProperties.slice()
      : extensions.filter(function (key) {
          var ext = PET.extensionByKey(key);
          return ext && ext.type === 'attr';
        });
    var newFeats = Array.isArray(p.newMethods)
      ? p.newMethods.slice()
      : extensions.filter(function (key) {
          var ext = PET.extensionByKey(key);
          return ext && (ext.type === 'method' || ext.type === 'branch');
        });

    var callsEach =
      instances.length >= 2 &&
      instances.every(function (i) {
        return Array.isArray(i && i.calls) ? i.calls.length > 0 : false;
      });

    var explain = checkExplanation(explanation);
    var indent = checkIndent(Array.isArray(p.code) ? p.code : []);

    var checks = [
      { key: 'hasClass', label: CHECK_LABELS[0].label, ok: String(p.className || '') === 'Pet' },
      {
        key: 'baseProperties',
        label: CHECK_LABELS[1].label,
        ok: PET.BASE_PROPERTIES.every(function (key) {
          return (Array.isArray(p.baseProperties) ? p.baseProperties : []).indexOf(key) !== -1;
        })
      },
      {
        key: 'baseMethods',
        label: CHECK_LABELS[2].label,
        ok: PET.BASE_METHODS.every(function (key) {
          return (Array.isArray(p.baseMethods) ? p.baseMethods : []).indexOf(key) !== -1;
        })
      },
      { key: 'twoObjects', label: CHECK_LABELS[3].label, ok: instances.length >= 2 },
      {
        key: 'differentValues',
        label: CHECK_LABELS[4].label,
        ok: instances.length >= 2 && (unique(names) > 1 || unique(animals) > 1)
      },
      { key: 'callsEachObject', label: CHECK_LABELS[5].label, ok: callsEach },
      { key: 'newProperty', label: CHECK_LABELS[6].label, ok: newProps.length > 0 },
      { key: 'newMethodOrBranch', label: CHECK_LABELS[7].label, ok: newFeats.length > 0 },
      {
        key: 'indentOk',
        label: CHECK_LABELS[8].label,
        // 코드를 함께 보내지 않은 옛 제출은 «판정 불가»로 두지 않고 통과로 본다(제출 형식 차이).
        ok: Array.isArray(p.code) && p.code.length ? indent.ok : true
      }
    ];

    var passed = checks.filter(function (c) {
      return c.ok;
    }).length;
    var stored = Number(p.checksPassed);

    return {
      checks: checks,
      passed: passed,
      total: CHECK_TOTAL,
      storedPassed: isNaN(stored) ? null : stored,
      mismatch: !isNaN(stored) && stored !== passed,
      instanceCount: instances.length,
      extensions: extensions,
      newProperties: newProps,
      newFeatures: newFeats,
      customProperties: Array.isArray(p.customProperties) ? p.customProperties.slice() : [],
      customMethods: Array.isArray(p.customMethods) ? p.customMethods.slice() : [],
      explanation: explain,
      /** 명세 15.3 : 프로젝트 카드 통계에 쓰는 요약 */
      baseComplete: checks[0].ok && checks[1].ok && checks[2].ok,
      twoOrMore: instances.length >= 2,
      extensionOk: newProps.length > 0 && newFeats.length > 0 && newProps.length + newFeats.length >= 2,
      explanationOk: explain.ok
    };
  }

  /* ------------------------------------------------------------------ */
  /* 명세 10.6 · 17.1 : 수행 결과 평가 기준 (교사 확인 자료)                    */
  /* ------------------------------------------------------------------ */
  var RUBRIC = [
    {
      key: 'design',
      element: '클래스 설계',
      content: '대상의 속성과 기능을 적절하게 구분했는가?',
      source: '설계판 (화면 2)',
      high: '속성과 기능을 모두 적절히 구분',
      mid: '일부 구분이 불명확',
      low: '구분하지 못함'
    },
    {
      key: 'implement',
      element: '클래스 구현',
      content: '클래스 · 메소드 · 조건문을 문법에 맞게 작성했는가?',
      source: '기본 · 확장 코드 (화면 3 · 5)',
      high: '클래스 · 메소드 · 조건 · 들여쓰기가 정확',
      mid: '경미한 오류가 있으나 수정 가능',
      low: '실행 구조를 완성하지 못함'
    },
    {
      key: 'instances',
      element: '객체 활용',
      content: '두 개 이상의 객체를 만들고 속성값을 다르게 설정했는가?',
      source: '객체 상태표 (화면 4 · 5)',
      high: '두 객체 이상, 서로 다른 값, 각각 메소드 호출',
      mid: '두 객체는 있으나 값 또는 호출 일부 부족',
      low: '객체가 하나이거나 생성하지 못함'
    },
    {
      key: 'extend',
      element: '기능 확장',
      content: '새 속성과 새 메소드 또는 조건 분기를 추가했는가?',
      source: '확장 선택 · 자동 확인 결과 (화면 5)',
      high: '새 속성과 새 메소드 · 조건을 의미 있게 추가',
      mid: '두 확장 중 하나가 단순하거나 미완성',
      low: '확장하지 못함'
    },
    {
      key: 'explain',
      element: '코드 설명',
      content: '코드의 작동 원리와 객체별 결과 차이를 설명했는가?',
      source: '설명 5문항 (화면 5)',
      high: '다섯 질문에 구체적으로 설명',
      mid: '일부 설명이 짧거나 불명확',
      low: '코드 작동을 설명하지 못함'
    }
  ];

  return {
    EXPLAIN_QUESTIONS: EXPLAIN_QUESTIONS,
    EXPLAIN_MIN: EXPLAIN_MIN,
    EXPLAIN_MAX: EXPLAIN_MAX,
    CHECK_LABELS: CHECK_LABELS,
    CHECK_TOTAL: CHECK_TOTAL,
    RUBRIC: RUBRIC,
    checkIndent: checkIndent,
    extensionStatus: extensionStatus,
    extensionSummary: extensionSummary,
    checkProject: checkProject,
    checkExplanation: checkExplanation,
    summarize: summarize,
    reviewSubmitted: reviewSubmitted
  };
});

    <script data-from="teacher/t10-answerkey.js">

 */
(function () {

  var PET = L.pet;

  /** 흔한 오답 표기 — 선택형은 보기 번호, 코드형은 설명 글로 적는다. */
  function wrongLabel(q) {

  /** 명세 17.2 : 오늘 꼭 잡아야 할 핵심 다섯 가지 */
  var CORE = [

  function codeErrorRows(q) {
    var spec = q.codeSpec;
    var E = QUIZ.CODE_ERRORS;
    var first = spec.objects[0];
    return [
      [E.missingCreate, '<code>' + first.name + ' = ' + spec.className + '()</code> 같은 생성 줄이 없다'],
      [E.className, '객체를 만들었으나 클래스 이름이 <code>' + spec.className + '</code> 가 아니다'],
      [
        E.objectName,
        '객체 이름 또는 호출 대상이 <code>' +
          spec.objects
            .map(function (o) {
              return o.name;
            })
            .join('</code> · <code>') +
          '</code> 가 아니다'
      ],
      [
        E.attrTarget,
        '<code>' + first.property + '</code> 를 객체가 아닌 대상(클래스 · 단독 변수)에 대입했다'
      ],
      [
        E.attrValue,
        '<code>"' +
          spec.objects
            .map(function (o) {
              return o.value;
            })
            .join('" · "') +
          '"</code> 이 아니거나 표기가 다르다 (그 줄이 아예 없는 경우 포함)'
      ],
      [E.missingCall, '<code>' + first.name + '.' + first.method + '()</code> 같은 호출 줄이 없다'],
      [
        E.noParen,
        '<code>' + first.name + '.' + first.method + '</code> 처럼 소괄호를 빠뜨려 호출이 되지 않는다'
      ],
      [E.createOrder, '객체를 만들기 «전»에 그 객체의 속성을 바꾸거나 메소드를 호출했다'],
      [E.callOrder, '두 호출을 모두 썼지만 <code>' + (spec.requiredCallOrder || []).join('</code> → <code>') + '</code> 순서가 아니다']
    ];
  }

      row.some(function (c) {

      })

    }

  }

  /* ------------------------------------------------------------------ */
  /* 행 배열 → 학생 명단                                                   */
  /* ------------------------------------------------------------------ */
  function pickColumns(rows) {
    // 앞쪽 5줄 안에서 머리글을 찾는다(표 위에 제목 줄이 있는 명단이 흔하다).
    for (var r = 0; r < Math.min(rows.length, 5); r += 1) {
      var cells = rows[r] || [];
      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = norm(cell);
        if (idCol < 0 && ID_HEADERS.indexOf(v) !== -1) idCol = c;
        if (nameCol < 0 && NAME_HEADERS.indexOf(v) !== -1) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }

  /**
   * 명단 파일을 읽는다.
   * @returns Promise<{ students:[{id,name}], warnings:string[], columns:object }>
   */
  function parseRosterFile(file) {

    var rowsPromise;

    if (/\.xlsx$/.test(name)) {
      rowsPromise = readXlsx(file);
    } else if (/\.xls$/.test(name)) {
      rowsPromise = Promise.reject(
        new Error('예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV UTF-8 로 저장해 올려 주세요.')
      );
    } else {
      rowsPromise = file.text().then(splitDelimited);
    }

    return rowsPromise.then(function (rows) {
      var picked = pickColumns(rows);
      var students = [];
      var warnings = [];
      var seen = {};

      rows.forEach(function (cells, r) {
        if (r <= picked.headerRow) return;
        var list = cells || [];
        var id = String(list[picked.idCol] === undefined ? '' : list[picked.idCol]).trim();
        var studentName = String(list[picked.nameCol] === undefined ? '' : list[picked.nameCol]).trim();
        if (!id && !studentName) return;

        // 머리글을 못 찾은 경우, 첫 줄이 「학번/이름」 같은 글자면 건너뛴다.
        if (
          picked.headerRow < 0 &&
          r === 0 &&
          (ID_HEADERS.indexOf(norm(id)) !== -1 || NAME_HEADERS.indexOf(norm(studentName)) !== -1)
        ) {
          return;
        }
        if (!id) {
          warnings.push(r + 1 + '행: 학번이 비어 있어 건너뛰었어요. (' + (studentName || '이름 없음') + ')');
          return;
        }
        if (seen[id]) {
          warnings.push(r + 1 + '행: 학번 ' + id + ' 이 여러 번 나와 한 번만 사용했어요.');
          return;
        }
        seen[id] = true;
        students.push({ id: id, name: studentName });
      });

      if (!students.length) {
        throw new Error('명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.');
      }

      return { students: students, warnings: warnings, columns: picked };
    });
  }

  /** 학번 비교용 표준형 (앞의 0 과 공백·기호를 없앤다) */
  function normalizeId(value) {
    var raw = String(value === undefined || value === null ? '' : value).trim();
    var digits = raw.replace(/[^0-9]/g, '');
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

    parseRosterFile: parseRosterFile,
    normalizeId: normalizeId,
    splitDelimited: splitDelimited

    <script data-from="teacher/t20-analysis.js">
/**
 * 교사용 분석 로직 (명세 15장 · 18장)
 *
 *  · 학생 JSON 의 totalScore 를 그대로 믿지 않고 «교사용에서 모든 문항을 다시 채점»한다(명세 18장).
 *  · 프로젝트 요약도 checksPassed 를 그대로 믿지 않고 다시 확인한다(명세 18장).
 *  · 같은 학생의 제출이 여러 건이면 가장 최근 것만 쓴다.
 *  · 정오 판정 근거가 없으면 `?` 로 표시하고 0점 처리한다.
 *  · 5번(코드 입력)은 정규화된 여섯 줄과 선후 관계를 다시 검사하고, 오류 유형을 함께 모은다(명세 15.5).

 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var QUIZ = L.quiz;
  var PROJ = L.project;
  var PET = L.pet;
  var LESSON_ID = L.CONST.LESSON_ID;

  var CIRCLED = '①②③④⑤';

  /** "② …" 또는 "2" 처럼 적힌 답에서 보기 번호를 뽑는다. 없으면 0. */
  function pickNumber(text) {
    var s = String(text === undefined || text === null ? '' : text).trim();
    if (!s) return 0;
    var idx = CIRCLED.indexOf(s.charAt(0));
    if (idx !== -1) return idx + 1;
    if (/^[1-5]$/.test(s)) return Number(s);

  }

  /* ------------------------------------------------------------------ */
  /* 읽어들이기 (명세 15.1)                                                */
  /* ------------------------------------------------------------------ */

  /** 어떤 모양으로 오든 「제출 객체 배열」로 펴 준다. */
  function flatten(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) {
      return raw.reduce(function (acc, item) {
        return acc.concat(flatten(item));
      }, []);
    }
    if (typeof raw === 'object') {
      if (Array.isArray(raw.items)) return flatten(raw.items);
      if (Array.isArray(raw.data)) return flatten(raw.data);
      if (Array.isArray(raw.rows)) return flatten(raw.rows);

      return [raw];

  }

  /** 이번 차시 자료만 남긴다. lesson 값이 없으면 문항 구성으로 판단한다. */
  function isThisLesson(sub) {
    if (!sub || typeof sub !== 'object') return false;
    if (sub.lesson) return String(sub.lesson) === LESSON_ID;
    return Array.isArray(sub.answers);
  }

  /** 다른 차시로 걸러진 건수 (명세 15.1 : 제외 건수를 알린다) */
  function countExcluded(raw) {
    var all = flatten(raw);
    return all.length - all.filter(isThisLesson).length;
  }

  /* ------------------------------------------------------------------ */
  /* 재채점 (명세 18장)                                                    */
  /* ------------------------------------------------------------------ */

  /** 한 명의 제출을 다시 채점하고 프로젝트를 다시 확인한다. */
  function regrade(sub) {
    var answers = Array.isArray(sub.answers) ? sub.answers : [];
    var marks = {};
    var picks = {};
    var points = {}; // 문항별로 다시 계산한 점수(5번은 부분 점수가 나올 수 있다)
    var code = null; // 5번 코드 분석 결과
    var score = 0;

    QUIZ.QUESTIONS.forEach(function (q) {
      var row = null;
      for (var i = 0; i < answers.length; i += 1) {
        if (Number(answers[i].questionId) === q.id) {
          row = answers[i];
          break;
        }
      }
      if (!row) {
        marks[q.id] = '-';
        return;
      }

      var raw = row.answer;

        raw === null ||
        (Array.isArray(raw) ? QUIZ.codeLines(raw).length === 0 : String(raw).trim() === '');
      if (isEmpty) {
        marks[q.id] = '-';
        return;
      }

      if (q.type === 'choice') picks[q.id] = pickNumber(raw) || null;

      // ① 문항 은행의 정답 규칙으로 다시 판정한다(가장 믿을 만하다).
      var restored = QUIZ.answerFromText(q, raw);
      if (restored !== null && restored !== undefined && QUIZ.isAnswered(q, restored)) {
        var ok = QUIZ.gradeAnswer(q, restored);
        var earned = QUIZ.scoreAnswer(q, restored);
        // 'P' — 부분 점수를 받은 상태(코드 입력형에서만 생긴다)
        marks[q.id] = ok ? 'O' : earned > 0 ? 'P' : 'X';
        points[q.id] = earned;
        score += earned;
        if (q.type === 'code') code = QUIZ.checkCode(restored, q.codeSpec);
        return;
      }
      // ② 학생 파일의 isCorrect 를 참고
      if (row.isCorrect === true || row.isCorrect === '정답') {
        marks[q.id] = 'O';
        points[q.id] = q.points;
        score += q.points;
        return;
      }
      if (row.isCorrect === false || row.isCorrect === '오답') {
        marks[q.id] = 'X';
        return;
      }
      marks[q.id] = '?'; // 판정 근거 없음 → 0점
    });

    var stored = Number(sub.totalScore);
    var project = sub.project && typeof sub.project === 'object' ? sub.project : null;
    var review = PROJ.reviewSubmitted(project || {});

    return {
      studentId: String(sub.studentId || '').trim(),
      name: String(sub.name || '').trim(),
      receivedAt: sub.receivedAt || sub.submittedAt || '',
      marks: marks,
      picks: picks,
      points: points,
      code: code,
      matched: code ? code.matched : null,
      codeTotal: code ? code.total : null,
      score: Math.round(score * 10) / 10,
      storedScore: isNaN(stored) ? null : stored,
      // 부분 점수가 있어 소수가 나올 수 있으므로 0.05 안이면 같은 값으로 본다.
      mismatch: !isNaN(stored) && Math.abs(stored - score) > 0.05,
      passed: score >= QUIZ.PASS_SCORE,
      submitted: true,
      /** 프로젝트 원본과 재확인 결과 (명세 15.7 · 18장) */
      project: project,
      hasProject: Boolean(project),

  }

  /** 제출 목록 정리 — 다른 차시 제외 · 같은 학생은 가장 최근 제출만 (명세 18장) */

      if (!prev || timeValue(row.receivedAt) >= timeValue(prev.receivedAt)) map[key] = row;
    });
    return Object.keys(map).map(function (k) {
      return map[k];
    });
  }

  /* ------------------------------------------------------------------ */
  /* 학생 명단 병합 (명세 15.2)                                             */
  /* ------------------------------------------------------------------ */

  /** CSV · TSV · TXT 한 장을 [{id, name}] 로 바꾼다. */
  function parseRoster(text) {
    var lines = String(text || '')
      .replace(/^﻿/, '')
      .split(/\r?\n/)
      .filter(function (line) {
        return line.trim().length > 0;
      });
    if (!lines.length) return [];

    var sep = lines[0].indexOf('\t') !== -1 ? '\t' : lines[0].indexOf(',') !== -1 ? ',' : /\s{2,}/;
    var split = function (line) {
      return line.split(sep).map(function (cell) {
        return cell.trim().replace(/^"|"$/g, '');
      });
    };

    var head = split(lines[0]);
    var idCol = 0;
    var nameCol = 1;
    var hasHead = false;
    head.forEach(function (cell, i) {
      if (/학번|번호|id/i.test(cell)) {
        idCol = i;
        hasHead = true;
      }
      if (/이름|성명|name/i.test(cell)) {
        nameCol = i;
        hasHead = true;
      }
    });

    return lines
      .slice(hasHead ? 1 : 0)
      .map(function (line) {
        var cells = split(line);
        return {
          id: String(cells[idCol] || '').trim(),
          name: String(cells[nameCol] || '').trim()

      })
      .filter(function (row) {

      });

  /** 학번 비교용 표준형. t15-roster.js 가 있으면 그것을 쓴다. */
  function normalizeId(value) {

    var digits = raw.replace(/[^0-9]/g, '');

  }

  function emptyRow(person) {
    return {
      studentId: person.id,
      name: person.name,
      receivedAt: '',
      marks: {},
      picks: {},
      points: {},
      code: null,
      matched: null,
      codeTotal: null,
      score: 0,
      storedScore: null,
      mismatch: false,
      passed: false,
      submitted: false,
      project: null,
      hasProject: false,

    };
  }

  /** 명단을 붙여 미제출 학생도 표에 넣는다(명세 15.2). */
  function mergeRoster(rows, roster) {
    if (!roster || !roster.length) return rows.slice();
    var byId = {};
    rows.forEach(function (row) {
      byId[normalizeId(row.studentId)] = row;
    });
    var merged = roster.map(function (person) {
      var found = byId[normalizeId(person.id)];
      if (found) {
        found.name = found.name || person.name;
        if (person.id) found.studentId = person.id;
        return found;
      }
      return emptyRow(person);
    });
    var inRoster = {};
    roster.forEach(function (p) {

    });

    });

  }

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 15.3 · 15.4)                                                */
  /* ------------------------------------------------------------------ */
  function submittedOf(rows) {
    return rows.filter(function (r) {
      return r.submitted;
    });
  }

  function summarize(rows) {
    var submitted = submittedOf(rows);
    var scores = submitted.map(function (r) {
      return r.score;
    });
    var sum = Math.round(
      scores.reduce(function (a, b) {
        return a + b;
      }, 0) * 10
    ) / 10;
    var passCount = submitted.filter(function (r) {
      return r.passed;
    }).length;
    return {
      total: rows.length,
      submitted: submitted.length,
      missing: rows.length - submitted.length,
      average: submitted.length ? Math.round((sum / submitted.length) * 10) / 10 : 0,
      max: submitted.length ? Math.max.apply(null, scores) : 0,
      min: submitted.length ? Math.min.apply(null, scores) : 0,
      perfect: submitted.filter(function (r) {
        return r.score === QUIZ.MAX_SCORE;
      }).length,
      passCount: passCount,
      passRate: submitted.length ? Math.round((passCount / submitted.length) * 100) : 0,

        return r.mismatch;
      }).length,
      projectMismatch: submitted.filter(function (r) {

  }

  /** 명세 15.3 : 프로젝트 카드 통계 */
  function projectStats(rows) {

    });

      });

      if (counts[b] !== counts[a]) return counts[b] - counts[a];
      return a.localeCompare(b, 'ko');
    });
    var topKey = names[0] || '';
    var topExt = PET.extensionByKey(topKey);

    return {
      total: submitted.length,
      baseComplete: submitted.filter(function (r) {
        return r.review.baseComplete;
      }).length,
      twoOrMore: submitted.filter(function (r) {
        return r.review.twoOrMore;
      }).length,
      extensionOk: submitted.filter(function (r) {
        return r.review.extensionOk;
      }).length,
      explanationOk: submitted.filter(function (r) {
        return r.review.explanationOk;
      }).length,
      allChecks: submitted.filter(function (r) {
        return r.review.passed === r.review.total;

  }

  /**
   * 명세 15.4 : 점수 높은 순 → 프로젝트 자동 확인 충족 수 높은 순 → 제출 시각 빠른 순
   */
  function top3(rows) {
    return submittedOf(rows)
      .slice()
      .sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        var pa = a.review ? a.review.passed : 0;
        var pb = b.review ? b.review.passed : 0;
        if (pb !== pa) return pb - pa;
        return timeValue(a.receivedAt) - timeValue(b.receivedAt);
      })
      .slice(0, 3);
  }

  /** 명세 15.5 : 오답률 → 오답 인원 → 문항 번호 순으로 정렬한 문항 분석 */
  function questionStats(rows) {
    var submitted = submittedOf(rows);
    var stats = QUIZ.QUESTIONS.map(function (q) {
      var wrong = 0;
      var none = 0;
      var unknown = 0;
      var partial = 0;
      var dist = [0, 0, 0, 0, 0];
      var errors = {}; // 코드 오류 유형 분포
      var matchedSum = 0;
      var matchedCount = 0;

      submitted.forEach(function (r) {
        var mark = r.marks[q.id];
        if (mark === 'X') wrong += 1;
        else if (mark === 'P') partial += 1;
        else if (mark === '-') none += 1;
        else if (mark === '?') unknown += 1;

        var picked = r.picks[q.id];
        if (picked >= 1 && picked <= 5) dist[picked - 1] += 1;

        if (q.type === 'code' && r.code) {
          matchedSum += r.code.matched;
          matchedCount += 1;
          if (mark !== 'O') {
            (r.code.errors || []).forEach(function (name) {
              errors[name] = (errors[name] || 0) + 1;
            });
          }
        }
      });

      // «완전히 맞히지 못한» 인원 — 부분 점수를 받은 학생도 여기에 넣는다(짚어 볼 문항이므로).
      var missCount = wrong + none + unknown + partial;
      return {
        question: q,
        wrong: wrong,
        none: none,
        unknown: unknown,
        partial: partial,
        missCount: missCount,
        correct: submitted.length - missCount,
        total: submitted.length,
        rate: submitted.length ? Math.round((missCount / submitted.length) * 100) : 0,
        correctRate: submitted.length
          ? Math.round(((submitted.length - missCount) / submitted.length) * 100)
          : 0,
        dist: dist,
        errors: errors,
        avgMatched: matchedCount ? Math.round((matchedSum / matchedCount) * 10) / 10 : null
      };
    });
    return stats.sort(function (a, b) {
      if (b.rate !== a.rate) return b.rate - a.rate;
      if (b.missCount !== a.missCount) return b.missCount - a.missCount;
      return a.question.id - b.question.id;

  /** 영역별 정답률 — 정답률이 낮은 순으로 돌려준다. */
  function categoryStats(rows) {
    var byId = {};
    questionStats(rows).forEach(function (item) {
      byId[item.question.id] = item;
    });
    return QUIZ.byCategory()
      .map(function (group) {
        var correct = 0;
        var total = 0;
        group.questions.forEach(function (q) {
          var item = byId[q.id];
          if (!item) return;
          correct += item.correct;
          total += item.total;
        });
        return {
          category: group.category,
          questions: group.questions.map(function (q) {
            return q.id;
          }),
          correct: correct,
          total: total,
          correctRate: total ? Math.round((correct / total) * 100) : 0
        };
      })
      .sort(function (a, b) {
        return a.correctRate - b.correctRate;
      });
  }

  /* ------------------------------------------------------------------ */
  /* CSV (명세 15.8)                                                       */
  /* ------------------------------------------------------------------ */
  /** 고른 확장 + 학생이 «직접 만든» 속성 · 기능 이름 */
  function extensionLabels(row) {
    if (!row.hasProject) return '';
    var picked = (row.review.extensions || []).map(function (key) {
      var ext = PET.extensionByKey(key);
      return ext ? ext.label : key;
    });
    var custom = (row.review.customProperties || [])
      .map(function (name) {
        return name + ' (직접 만든 속성)';
      })
      .concat(
        (row.review.customMethods || []).map(function (name) {
          return name + '() (직접 만든 기능)';
        })
      );
    return picked.concat(custom).join(' / ');
  }

  function toCSV(rows) {
    var head = ['학번', '이름'];
    QUIZ.QUESTIONS.forEach(function (q) {
      head.push(q.id + '번');
    });
    head.push(
      '5번 충족 요소 수',
      '총점',
      '이수 여부',
      '프로젝트 검사',
      '객체 수',
      '확장 항목',
      '설명 5항목',
      '제출 시각'
    );

    var lines = [head];
    rows.forEach(function (r) {
      var line = [r.studentId, r.name];
      QUIZ.QUESTIONS.forEach(function (q) {
        line.push(r.submitted ? markSymbol(r.marks[q.id]) : '미제출');
      });
      line.push(r.submitted && r.matched !== null ? r.matched + ' / ' + r.codeTotal : '');
      line.push(r.submitted ? QUIZ.formatScore(r.score) : '');
      line.push(r.submitted ? QUIZ.passLabel(r.score) : '미제출');
      line.push(r.submitted && r.hasProject ? r.review.passed + ' / ' + r.review.total : '');
      line.push(r.submitted && r.hasProject ? String(r.review.instanceCount) : '');
      line.push(extensionLabels(r));
      line.push(
        r.submitted && r.hasProject
          ? r.review.explanation.filled + ' / ' + r.review.explanation.total
          : ''
      );
      line.push(r.receivedAt || '');
      lines.push(line);
    });

    var body = lines
      .map(function (cells) {
        return cells
          .map(function (cell) {
            var text = String(cell === undefined || cell === null ? '' : cell);
            return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          })
          .join(',');
      })
      .join('\r\n');

    // 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다(명세 15.8).
    return '﻿' + body;
  }

  /** 색 없이도 읽히도록 기호로 바꾼다(명세 15.6). */
  function markSymbol(mark) {
    if (mark === 'O') return '○';
    if (mark === 'P') return '◐'; // 부분 점수
    if (mark === 'X') return '✕';
    if (mark === '?') return '?';
    return '−';
  }

  L.analysis = {
    flatten: flatten,
    isThisLesson: isThisLesson,
    countExcluded: countExcluded,
    regrade: regrade,
    buildRows: buildRows,
    parseRoster: parseRoster,
    mergeRoster: mergeRoster,
    summarize: summarize,
    projectStats: projectStats,
    top3: top3,
    questionStats: questionStats,
    categoryStats: categoryStats,
    extensionLabels: extensionLabels,
    toCSV: toCSV,
    markSymbol: markSymbol,
    pickNumber: pickNumber,
    normalizeId: normalizeId
  };
})();

    <script data-from="teacher/t30-project-review.js">
/**
 * 교사용 — 학생별 프로젝트 보기 (명세 15.7 · 17.1 · 18장)
 *
 *  · 제출된 project 요약을 «다시 확인»해서 보여 준다(학생 파일의 checksPassed 를 믿지 않는다).
 *  · 학생 자유 입력(설명 · 코드 문자열)은 HTML 이 아니라 «글자»로만 렌더링한다(명세 15.7 · 22장).
 *  · 자동 확인은 참고 자료이며 최종 루브릭 등급을 자동으로 확정하지 않는다(명세 10.6 · 17.1).
 *  · 교사 메모용 인쇄 영역을 함께 둔다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var ui = L.ui;
  var el = ui.el;
  var PET = L.pet;
  var PROJ = L.project;

  /** 확장 key 목록을 사람이 읽는 이름으로 */
  function extLabels(keys) {
    return (keys || []).map(function (key) {
      var ext = PET.extensionByKey(key);
      return ext ? ext.label : key;
    });
  }

  /** 제출 project 요약 → 화면 조각 (인쇄에도 그대로 쓴다) */
  function buildBody(row) {
    var project = row.project || {};
    var review = row.review || PROJ.reviewSubmitted(project);
    var box = el('div', { 'class': 'stack projreview' });

    box.appendChild(
      el('div', { 'class': 'projreview__head' }, [
        el('p', { 'class': 'projreview__name' }, [
          el('span', { text: row.name || '(이름 없음)' }),
          el('span', { 'class': 'projreview__id', text: ' · 학번 ' + (row.studentId || '-') })
        ]),
        el('p', {
          'class': 'projreview__meta',
          text:
            '형성평가 ' + row.score + ' / ' + L.quiz.MAX_SCORE + '점 · ' +
            L.quiz.passLabel(row.score) + ' · 제출 ' + (row.receivedAt || '시각 없음')
        })
      ])
    );

    if (!row.hasProject) {
      box.appendChild(
        el('p', {
          'class': 't-empty',
          text: '이 제출에는 프로젝트 요약이 없습니다. (형성평가만 제출한 경우입니다)'
        })
      );
      return box;
    }

    /* ① 클래스 · 속성 · 메소드 */
    box.appendChild(ui.sectionTitle('①', '클래스 설계'));
    box.appendChild(
      ui.dataTable({
        head: ['항목', '내용'],
        caption: '클래스 설계',
        rows: [
          ['클래스명', '<code>' + ui.escapeHtml(String(project.className || '-')) + '</code>'],
          [
            '기본 속성',
            '<code>' + ui.escapeHtml((project.baseProperties || []).join(', ') || '-') + '</code>'
          ],
          [
            '기본 메소드',
            '<code>' + ui.escapeHtml((project.baseMethods || []).join(', ') || '-') + '</code>'
          ],
          [
            '추가한 속성',
            '<code>' + ui.escapeHtml((project.newProperties || []).join(', ') || '없음') + '</code>'
          ],
          [
            '추가한 메소드 · 조건',
            '<code>' + ui.escapeHtml((project.newMethods || []).join(', ') || '없음') + '</code>'
          ],
          ['확장 항목 (고른 것)', ui.escapeHtml(extLabels(project.extensions).join(' · ') || '없음')],
          [
            '직접 만든 것',
            (project.customProperties || []).length || (project.customMethods || []).length
              ? '속성 <code>' + ui.escapeHtml((project.customProperties || []).join(', ') || '-') +
                '</code> · 기능 <code>' + ui.escapeHtml((project.customMethods || []).join(', ') || '-') + '</code>'
              : '없음'
          ]
        ]
      })
    );

    /* ② 객체별 속성값 */
    box.appendChild(ui.sectionTitle('②', '객체 수와 객체별 속성값'));
    var instances = Array.isArray(project.instances) ? project.instances : [];
    box.appendChild(
      el('p', { 'class': 'meta-count', text: '객체 수 : ' + instances.length + '개' })
    );
    if (instances.length) {
      var keys = ['name', 'animal'];
      instances.forEach(function (inst) {
        Object.keys(inst || {}).forEach(function (key) {
          if (key === 'objectName' || key === 'calls') return;
          if (keys.indexOf(key) === -1) keys.push(key);
        });
      });
      box.appendChild(
        ui.dataTable({
          head: ['속성'].concat(
            instances.map(function (inst) {
              return ui.escapeHtml(String(inst.objectName || '?'));
            })
          ),
          caption: '객체별 속성값',
          rows: keys
            .map(function (key) {
              return ['<code>' + ui.escapeHtml(key) + '</code>'].concat(
                instances.map(function (inst) {
                  var value = inst ? inst[key] : undefined;
                  if (value === undefined || value === null || value === '') return '-';
                  if (typeof value === 'boolean') return value ? 'True' : 'False';
                  return ui.escapeHtml(String(value));
                })
              );
            })
            .concat([
              ['<code>호출한 메소드</code>'].concat(
                instances.map(function (inst) {
                  var calls = inst && Array.isArray(inst.calls) ? inst.calls : [];
                  return calls.length
                    ? ui.escapeHtml(
                        calls
                          .map(function (m) {
                            return m + '()';
                          })
                          .join(', ')
                      )
                    : '없음';
                })
              )
            ])
        })
      );
    }

    /* ③ 자동 확인 재확인 */
    box.appendChild(ui.sectionTitle('③', '자동 확인 재확인 결과'));
    box.appendChild(
      el('p', { 'class': 'projreview__checks' }, [
        el('strong', { text: review.passed + ' / ' + review.total + ' 항목 충족' }),
        review.storedPassed !== null
          ? el('span', {
              text:
                ' (학생 파일 기록 : ' + review.storedPassed + ' / ' + review.total + ')' +
                (review.mismatch ? ' ⚠ 다릅니다' : '')
            })
          : null
      ])
    );
    box.appendChild(
      el(
        'ul',
        { 'class': 'elems' },
        review.checks.map(function (check) {
          return el('li', { 'class': 'elems__item ' + (check.ok ? 'is-ok' : 'is-no') }, [
            el('span', { 'class': 'elems__mark', text: check.ok ? '○' : '✕' }),
            el('span', { 'class': 'elems__text', text: check.label })
          ]);
        })
      )
    );
    box.appendChild(
      ui.callout(
        '자동 확인은 <strong>참고 자료</strong>입니다. 최종 평가는 아래 루브릭으로 선생님이 판단합니다.',
        { muted: true }
      )
    );

    /* ④ 설명 5항목 */
    box.appendChild(ui.sectionTitle('④', '수행 결과 설명 5항목'));
    var dl = el('dl', { 'class': 'quiz-review__rows' });
    PROJ.EXPLAIN_QUESTIONS.forEach(function (q) {
      var text = String(
        (project.explanation || {})[q.key] === undefined ? '' : (project.explanation || {})[q.key]
      ).trim();
      dl.appendChild(el('dt', { text: q.no + '. ' + q.prompt }));
      // ★ 학생 자유 입력은 반드시 textContent 로만 넣는다(명세 15.7).
      dl.appendChild(el('dd', { 'class': 'pre-line', text: text || '(작성하지 않음)' }));
    });
    box.appendChild(dl);
    box.appendChild(
      el('p', {
        'class': 'meta-count',
        text:
          '작성한 항목 ' + review.explanation.filled + ' / ' + review.explanation.total +
          '개 (10자 이상을 «작성»으로 봅니다)'
      })
    );

    /* ⑤ 제출된 코드 */
    if (Array.isArray(project.code) && project.code.length) {
      box.appendChild(ui.sectionTitle('⑤', '학생이 만든 코드'));
      // ★ 코드도 글자로만 표시한다(실행하지 않는다).
      box.appendChild(el('pre', { 'class': 'projreview__code', text: project.code.join('\n') }));
    }

    /* ⑥ 루브릭 · 교사 메모 */
    box.appendChild(ui.sectionTitle('⑥', '수행 결과 평가 기준 (교사 판단)'));
    box.appendChild(
      ui.dataTable({
        head: ['평가 요소', '평가 내용', '확인 자료', '상', '중', '하'],
        caption: '수행 결과 평가 기준',
        rows: PROJ.RUBRIC.map(function (item) {
          return [item.element, item.content, item.source, item.high, item.mid, item.low];
        })
      })
    );
    box.appendChild(
      el('div', { 'class': 'projreview__memo' }, [
        el('p', { 'class': 'projreview__memo-title', text: '교사 메모 (인쇄용)' }),
        el('div', { 'class': 'projreview__memo-lines' }, [
          el('span'),
          el('span'),
          el('span'),
          el('span')
        ])
      ])
    );

    return box;
  }

  /** 학생 한 명의 프로젝트를 큰 대화상자로 연다. */
  function open(row) {
    var dialog = el('dialog', { 'class': 'modal modal--wide projreview-modal' });

    function close() {
      if (dialog.open) dialog.close();
      if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
    }

    dialog.appendChild(
      el('div', { 'class': 'modal__body' }, [
        el('h2', { 'class': 'modal__title', text: '프로젝트 보기 — ' + (row.name || '(이름 없음)') }),
        buildBody(row),
        el('div', { 'class': 'modal__actions no-print' }, [
          ui.button({
            label: '🖨 이 학생 자료 인쇄',
            variant: 'secondary',
            onClick: function () {
              window.print();
            }
          }),
          ui.button({ label: '닫기', onClick: close })
        ])
      ])
    );
    dialog.addEventListener('cancel', function (e) {
      e.preventDefault();
      close();
    });
    document.body.appendChild(dialog);
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
  }

  L.projectReview = { open: open, buildBody: buildBody, extLabels: extLabels };
})();

    <script data-from="teacher/t90-main.js">
/**
 * 교사용 페이지 조립 (명세 14장 ~ 18장)
 *
 *   1장 결과 불러오기               (주소 · JSON 파일 · 끌어다 놓기)
 *   2장 전체 요약 · 상위 3명         (형성평가 카드 + 프로젝트 카드)
 *   3장 가장 많이 틀린 문제          (오답률 상위 최대 2문항 · 명세 15.5)
 *   4장 명단 · 프로젝트 · 정답표      (제출물이 없어도 언제든 열린다 · 명세 14장)
 *
 * 위쪽에 장 이동 버튼(t-steps), 아래쪽에 [← 이전] · [다음 →] · [마침](t-pager)을 둔다.
 * 학생용 6단계 학습 화면은 이 파일에 넣지 않는다(명세 1.2 완전 분리).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var A = L.analysis;
  var QUIZ = L.quiz;
  var C = L.CONST;

  /** 교사용 브라우저에는 이 두 키만 저장한다. */
  var ENDPOINT_KEY = 'lesson3_8_3_analytics_endpoint';
  var PAGE_KEY = 'lesson3_8_3_teacher_page';

  /** 명세 15.5 : 3장에서 짚어 볼 «가장 많이 틀린 문제» 개수 (최대 2개) */
  var WRONG_LIMIT = 2;

  var PAGES = [
    { no: 1, label: '결과 불러오기' },
    { no: 2, label: '요약 · 상위 3명' },
    { no: 3, label: '가장 많이 틀린 문제' },
    { no: 4, label: '명단 · 프로젝트 · 정답표' }
  ];

  var state = {
    raw: [], // 읽어들인 제출 원본 (화면 메모리에만 둔다)
    rows: [], // 재채점 결과
    roster: [], // 학생 명단
    excluded: 0, // 다른 차시라 제외한 건수
    wrongIndex: -1, // 3장에서 지금 보고 있는 순위(-1 이면 아직 열지 않음)
    allWrongSeen: false,
    dataLoaded: false
  };

  var refs = {};
  var currentPage = 1;

  function readStore(key) {
    try {
      return window.localStorage.getItem(key) || '';
    } catch (err) {
      return '';
    }
  }

  function writeStore(key, value) {
    try {
      if (value) window.localStorage.setItem(key, value);
      else window.localStorage.removeItem(key);
    } catch (err) {
      /* 무시 */
    }
  }

  /* ------------------------------------------------------------------ */
  /* 머리말 · 인쇄 날짜                                                    */
  /* ------------------------------------------------------------------ */
  function buildHeader(root) {
    root.appendChild(
      el('header', { 'class': 't-header' }, [
        el('p', { 'class': 't-header__eyebrow', text: '교사용 · ' + C.LESSON_TITLE }),
        el('h1', { 'class': 't-header__title', text: '프로젝트 결과와 형성평가 분석' }),
        el('p', {
          'class': 't-header__sub',
          text:
            '고등학교 1학년 정보 · ' + C.UNIT_TITLE + ' ' + C.LESSON_NO + ' · ' +
            '형성평가 5문항 · 각 2점 · 10점 만점 · 6점 이상이면 이수입니다. ' +
            '프로젝트 결과는 자동 점수로 확정하지 않고 교사 확인 자료로 제공합니다.'
        })
      ])
    );

    refs.printDate = el('p', { 'class': 't-printdate' });
    root.appendChild(refs.printDate);
    stampPrintDate();
    window.addEventListener('beforeprint', stampPrintDate);
  }

  function stampPrintDate() {
    if (!refs.printDate) return;
    var now = new Date();
    var day = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
    refs.printDate.textContent =
      now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + day + ') 출력';
  }

  /* ------------------------------------------------------------------ */
  /* 장 이동                                                              */
  /* ------------------------------------------------------------------ */
  function buildStepper(root) {
    refs.stepper = el('ol', { 'class': 't-steps', attrs: { 'aria-label': '페이지 이동' } });
    PAGES.forEach(function (p) {
      var btn = el(
        'button',
        {
          type: 'button',
          'class': 't-steps__btn',
          dataset: { page: String(p.no) },
          attrs: { 'aria-label': p.no + '장 ' + p.label + ' 보기' },
          on: {
            click: function () {
              goToPage(p.no);
            }
          }
        },
        [
          el('span', { 'class': 't-steps__no', text: String(p.no) }),
          el('span', { 'class': 't-steps__label', text: p.label })
        ]
      );
      refs.stepper.appendChild(el('li', { 'class': 't-steps__item' }, [btn]));
    });
    root.appendChild(el('nav', { 'class': 't-steps-wrap no-print' }, [refs.stepper]));
  }

  function buildPager(root) {
    refs.btnPrev = ui.button({
      label: '← 이전',
      variant: 'secondary',
      onClick: function () {
        goToPage(currentPage - 1);
      }
    });
    refs.btnNext = ui.button({
      label: '다음 →',
      variant: 'primary',
      onClick: function () {
        if (currentPage === PAGES.length) finishReview();
        else goToPage(currentPage + 1);
      }
    });
    refs.pageHint = el('p', { 'class': 't-pager__hint', attrs: { 'aria-live': 'polite' } });
    root.appendChild(
      el('footer', { 'class': 't-pager no-print' }, [refs.btnPrev, refs.pageHint, refs.btnNext])
    );
  }

  /** 3장에서는 문항 카드를 모두 확인해야 다음 장이 열린다(명세 14장). */
  function updatePager() {
    var last = currentPage === PAGES.length;
    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = '다음 →';
      refs.btnNext.classList.remove('btn--finish');
      refs.btnNext.setAttribute('aria-label', '다음 장 보기');

      if (currentPage === 3 && state.dataLoaded) {
        var total = wrongList().length;
        // 틀린 문항이 없으면 확인할 것도 없으므로 잠그지 않는다(명세 15.5).
        var done = total === 0 || state.allWrongSeen;
        refs.btnNext.disabled = !done;
        refs.btnNext.title = done
          ? ''
          : '문항 ' + total + '개를 모두 확인하면 넘어갈 수 있어요. (' +
            Math.max(0, state.wrongIndex + 1) + ' / ' + total + ')';
        return;
      }
      refs.btnNext.disabled = false;
      refs.btnNext.title = '';
      return;
    }

    refs.btnNext.textContent = '마침';
    refs.btnNext.classList.add('btn--finish');
    refs.btnNext.disabled = false;
    refs.btnNext.title = '';
    refs.btnNext.setAttribute('aria-label', '분석 마치기');
  }

  function finishReview() {
    refs.pageHint.textContent = '분석을 마쳤어요 🎉 위 탭이나 [← 이전]으로 다시 볼 수 있어요.';
    refs.btnNext.disabled = true;
    ui.toast('결과 분석을 마쳤어요.');
    ui.announce('결과 분석을 마쳤습니다.');
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;
    var pages = [refs.page1, refs.page2, refs.page3, refs.page4];
    pages.forEach(function (page, i) {
      page.classList.toggle('is-active', i + 1 === no);
    });
    Array.prototype.slice.call(refs.stepper.querySelectorAll('.t-steps__btn')).forEach(function (btn) {
      var n = Number(btn.dataset.page);
      btn.classList.toggle('is-current', n === no);
      btn.setAttribute('aria-current', n === no ? 'page' : 'false');
    });

    updatePager();
    refs.pageHint.textContent = no + ' / ' + PAGES.length + '장 · ' + PAGES[no - 1].label;
    writeStore(PAGE_KEY, String(no));

    window.scrollTo(0, 0);
    var page = pages[no - 1];
    if (page && typeof page.focus === 'function') page.focus({ preventScroll: true });
    ui.announce(no + '장 ' + PAGES[no - 1].label);
  }

  /* ------------------------------------------------------------------ */
  /* 1장 — 결과 불러오기 (명세 15.1)                                        */
  /* ------------------------------------------------------------------ */
  function setStatus(kind, text) {
    refs.status.className = 't-status' + (kind ? ' is-' + kind : '');
    refs.status.textContent = text;
  }

  function refresh() {
    state.rows = A.mergeRoster(A.buildRows(state.raw), state.roster);
    state.excluded = A.countExcluded(state.raw);
    state.dataLoaded = state.rows.some(function (r) {
      return r.submitted;
    });
    state.wrongIndex = -1;
    state.allWrongSeen = wrongList().length === 0;
    renderAll();
  }

  function addRaw(items, label) {
    state.raw = state.raw.concat(items);
    refresh();
    var count = state.rows.filter(function (r) {
      return r.submitted;
    }).length;
    setStatus(
      'ok',
      label + ' — 지금까지 제출 ' + count + '명' +
        (state.excluded ? ' · 다른 차시 자료 ' + state.excluded + '건 제외' : '')
    );
    if (state.dataLoaded && currentPage === 1) showPage(2);
  }

  function readFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    var jsons = list.filter(function (f) {
      return /\.json$/i.test(f.name);
    });
    var skipped = list.length - jsons.length;
    if (!jsons.length) {
      setStatus('error', 'JSON 파일이 없어요. (건너뛴 파일 ' + skipped + '개)');
      return;
    }
    setStatus('loading', jsons.length + '개 파일을 읽는 중…');

    var results = [];
    var done = 0;
    jsons.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          results.push(JSON.parse(String(reader.result)));
        } catch (err) {
          if (window.console) console.warn('[teacher] JSON 을 읽지 못했습니다 : ' + file.name, err);
        }
        done += 1;
        if (done === jsons.length) {
          addRaw(
            results,
            'JSON 파일 ' + jsons.length + '개를 읽었어요' +
              (skipped ? ' (건너뛴 파일 ' + skipped + '개)' : '')
          );
        }
      };
      reader.onerror = function () {
        done += 1;
        if (done === jsons.length) addRaw(results, '일부 파일을 읽지 못했어요');
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  function loadFromUrl() {
    var url = String(refs.urlInput.value || '').trim();
    if (!/^https?:\/\//i.test(url)) {
      setStatus('error', 'Analytics.gs 를 배포한 /exec 주소를 넣어 주세요.');
      return;
    }
    setStatus('loading', '주소에서 결과를 불러오는 중…');
    window
      .fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('서버 응답 ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var data = JSON.parse(text);
        if (data && data.lesson && data.lesson !== C.LESSON_ID) {
          throw new Error('이 차시(' + C.LESSON_ID + ') 의 조회 주소가 아닌 것 같아요');
        }
        writeStore(ENDPOINT_KEY, url);
        addRaw([data], '주소에서 결과를 불러왔어요');
      })
      .catch(function (err) {
        setStatus(
          'error',
          '불러오지 못했어요 (' + (err && err.message ? err.message : '연결 실패') +
            '). [JSON 파일 열기]나 끌어다 놓기를 사용해 주세요.'
        );
      });
  }

  function buildSource(root) {
    refs.urlInput = el('input', {
      type: 'url',
      'class': 't-source__input',
      value: readStore(ENDPOINT_KEY),
      placeholder: 'https://script.google.com/macros/s/…/exec',
      attrs: { 'aria-label': 'Analytics.gs 배포 주소' }
    });
    refs.status = el('p', { 'class': 't-status', text: '아직 불러온 제출이 없어요.' });

    var fileInput = el('input', {
      type: 'file',
      accept: '.json,application/json',
      multiple: true,
      'class': 'sr-only',
      id: 't-file',
      on: {
        change: function (e) {
          readFiles(e.target.files);
          e.target.value = '';
        }
      }
    });

    var drop = el('div', {
      'class': 't-drop',
      text: '또는 제출 JSON 파일들을 이 페이지 위로 끌어다 놓으세요.'
    });
    ['dragenter', 'dragover'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove('is-over');
      });
    });
    drop.addEventListener('drop', function (e) {
      readFiles(e.dataTransfer.files);
    });
    document.addEventListener('dragover', function (e) {
      e.preventDefault();
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        readFiles(e.dataTransfer.files);
      }
    });

    var box = ui.panel({
      title: '📥 제출 결과 불러오기',

        '세 가지 방법 중 편한 것을 쓰면 됩니다. 계산은 모두 이 브라우저 안에서만 이루어지고, ' +
        '결과가 없어도 「정답표」와 「지도 자료」는 4장에서 바로 볼 수 있어요.'

          label: '불러온 자료 지우기',
          variant: 'ghost',
          onClick: function () {
            state.raw = [];

          }
        })
      ])
    );
    box.body.appendChild(refs.status);
    box.body.appendChild(drop);
    box.body.appendChild(
      el('ul', { 'class': 't-hint-list' }, [
        el('li', {
          html:
            '주소에서 바로 읽으려면 <code>apps-script/Analytics.gs</code> 를 «별도 프로젝트»로 배포한 ' +
            '<code>/exec</code> 주소가 필요합니다. (답안을 저장하는 <code>Code.gs</code> 주소로는 목록을 읽을 수 없어요)'
        }),
        el('li', { html: '학생 답안 파일 이름은 <code>학번_이름.json</code> 입니다.' }),
        el('li', {
          html: '다른 차시(<code>lesson</code> 값이 다른) 자료는 자동으로 제외하고 건수를 알려 줍니다.'
        }),
        el('li', {
          text: '제출 JSON 에는 형성평가 답안과 프로젝트 요약(설명 5항목 · 자동 확인 결과)이 함께 들어 있습니다.'
        }),
        el('li', { text: '[불러온 자료 지우기] 는 화면 메모리만 비웁니다. Drive 파일은 그대로 남습니다.' })
      ])
    );
    root.appendChild(box.root);
  }
