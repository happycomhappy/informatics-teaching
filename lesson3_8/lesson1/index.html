    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 15px;
  cursor: pointer;
}

.select:hover {
  border-color: var(--color-primary);
}

.select.is-correct {
  border-color: var(--color-true);

  border-radius: var(--radius);

}

.choice:hover {

.choice input {

.choice__body {

}

.choice__label {

}

.choice__sub {

}

.choice.is-selected {

  background: var(--color-primary-soft);
}

.choice--true.is-selected {

  background: var(--color-true-soft);
}

.choice--false.is-selected {

}

}

.console__head {

}

}

}

}

  }

.modal__title {

.modal__text {

.modal__actions {

  z-index: 20;
}

.has-tip:hover::after,

/* ------------------------------------------------------------------
 * 3차시 전용 스타일 (반복문 학습에서만 쓰는 조각들)
 *
 * 앞선 파일과 역할을 나눈다.
 *   tokens.css     : 색·글꼴·간격 값
 *   base.css       : 앱 골격 · 상단 진행 바 · 하단 이동 바
 *   components.css : 버튼 · 패널 · 입력 · 콘솔 · 배지 · 표
 *   code.css       : 코드 뷰와 실행 상태 표시
 *   steps.css      : 시작 화면 · 선택지 · 채점 결과 등 공통 화면 조각
 *   lesson.css     : ↓ 반복 회차 · 값 카드 · 흐름 고리 · 로봇 트랙 …
 * ------------------------------------------------------------------ */

/* ===================== 공통 작은 조각 ===================== */
.note-line {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  min-height: 1.6em;
}

.meta-count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.callout--warn {
  background: var(--color-false-soft);
  border-color: var(--color-false);
  color: var(--color-false-dark);
}

/* 세 칸 배치 (화면 4 : 같은 결과를 내는 세 가지 코드) */
.triple {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}

@media (max-width: 1023px) {
  .triple {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* 오답 해설에서 관련 학습 화면으로 이동하는 줄 */
.linkline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px dashed var(--color-border);
}

.linkline__label {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 화면 1 : 시작 및 선수 학습 확인 =====================
   1·2차시 시작 화면과 같은 형식을 쓴다. 뼈대(.hero / .goal-card / .agenda)는
   steps.css 에 있고, 여기서는 그 위에 얹는 보정만 한다. */

/* 단계 표기(1단계 · 시작 및 선수 학습 확인) */
.hero__eyebrow {
  margin-bottom: var(--space-3);
}

.hero__note strong {
  color: var(--color-primary-dark);
  font-weight: 800;
}

/* 가운데 정렬된 hero 안에서도 문장·문항은 왼쪽 정렬로 읽는다 */
.hero__feedback {
  margin-top: var(--space-5);
  text-align: left;
}

.hero__quiz {
  margin-top: var(--space-6);
  text-align: left;
}

/* 학습 시작 버튼 아래 안내(남은 활동 / 준비 완료) */
.hero__hint {
  margin-top: var(--space-2);
  text-align: center;
}

/* 지난 시간 핵심 내용 — 학습 순서 칩과 같은 모양이되,
   앞쪽 낱말이 열쇠말임이 드러나도록 색과 굵기만 달리한다. */
.recall__key {
  flex: 0 0 auto;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.recall__key::after {
  content: '·';
  margin-left: var(--space-2);
  color: var(--color-border-strong);
  font-weight: 700;
}

.recall__text {
  color: var(--color-text-sub);
  font-weight: 600;
}

/* 선수 학습 미니 문항 · 생각 열기 카드 */
.mini-quiz {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.mini-quiz__q {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
}

/* 미니 문항 안의 소제목(Q1 · Q2)은 위쪽 여백을 줄인다 */
.mini-quiz .section-title {
  margin: var(--space-2) 0 0;
  font-size: 17px;
}

/* ===================== 화면 1 : 생각 열기 ===================== */
.bigq {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.6;
}

.options--row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (max-width: 767px) {
  .options--row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.option--big {
  align-items: center;
  min-height: 72px;
}

.option--big .option__text {
  display: flex;
  flex-direction: column;
}

.compare-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
}

.compare-card.is-picked {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.compare-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.compare-card__title {
  font-weight: 800;
}

/* 100줄이 쌓이는 모습 : 높이를 고정하고 안에서만 스크롤한다 */
.longcode {
  max-height: 220px;
  overflow: auto;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
}

.longcode__lines {
  display: flex;
  flex-direction: column;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: #334155;
}

.longcode__line {
  white-space: pre;
  animation: screen-fade 120ms ease;
}

.longcode__dots {
  color: var(--color-text-sub);
  font-size: 18px;
  letter-spacing: 0.3em;
}

.longcode__count {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

/* ===================== 변수 상태 상자 (11.4) ===================== */
.varbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.varbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 96px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.varbox__label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.varbox__value {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--color-primary-dark);
}

.varbox.is-changed {
  animation: varbox-pop 420ms ease;
}

@keyframes varbox-pop {
  0% {
    transform: scale(1);
    border-color: var(--color-border-strong);
    background: var(--color-surface);
  }
  40% {
    transform: scale(1.08);
    border-color: var(--color-primary);
    background: var(--color-primary-soft);
  }
  100% {
    transform: scale(1);
    border-color: var(--color-primary);
    background: var(--color-surface);
  }
}

/* ===================== 반복 회차 표시 (11.3) ===================== */
.round-meter {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.round-meter__text {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.round-meter__bar {
  flex: 1 1 auto;
  height: 8px;
  min-width: 60px;
  border-radius: 99px;
  background: rgba(37, 99, 235, 0.18);
  overflow: hidden;
}

.round-meter__fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: var(--color-primary);
  transition: width var(--dur-progress) ease;
}

/* ===================== 값 카드 (7.1 · 7.3) ===================== */
.valuecards-wrap {
  position: relative;
  overflow-x: auto;
  padding-bottom: var(--space-5);
}

.valuecards {
  display: flex;
  gap: var(--space-2);
  min-width: max-content;
}

.valuecard {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-2);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  transition: all var(--dur-highlight) ease;
}

.valuecard.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: translateY(-3px) scale(1.06);
  box-shadow: var(--shadow);
}

.valuecard.is-used {
  opacity: 0.5;
  border-style: solid;
  background: var(--color-muted-bg);
}

/* 끝값은 점선 카드로 따로 표시한다(명세 7.3) */
.valuecard--excluded {
  position: relative;
  flex-direction: column;
  margin-left: var(--space-5);
  border-style: dashed;
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.valuecard__note {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.valuecards__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.valuecards__pointer {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 44px;
  transition: transform var(--dur-highlight) ease;
  pointer-events: none;
}

.valuecards__pointer.is-hidden {
  visibility: hidden;
}

.valuecards__arrow {
  color: var(--color-primary);
  font-weight: 900;
  line-height: 1;
}

.valuecards__pointer-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================

/* ------------------------------------------------------------------ */
/* 화면 4 · 5 공용 — 줄별 주석                                             */
/* ------------------------------------------------------------------ */

/* 들여쓰기 배지 바로 뒤에 코드가 붙지 않도록 한 칸 띄운다.

.annot {

}

.annot__note {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: var(--space-2) var(--space-3);
  background: var(--color-teal-soft);
  border: 1px solid var(--color-teal-line);
  border-left: 4px solid var(--color-teal);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.annot__note-key {
  font-family: var(--font-mono);
  font-size: var(--fs-small);

  color: var(--color-teal-dark);

}

@media (max-width: 700px) {

  .annot {

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
.asm-pool,

}

}

.asm-piece__indent {

  border: 1px solid var(--color-border);

}

/* 들여쓰기 표시는 줄 «앞부분»에 두고, 폭을 고정해 코드 시작 위치를 맞춘다.
   그래야 들여쓴 조각(안내선 한 칸 만큼 밀린)과 그렇지 않은 조각이 한눈에 비교된다. */

}

/* ------------------------------------------------------------------ */

  background: var(--color-teal-soft);
  padding: var(--space-3);
  border-radius: 0 var(--radius) var(--radius) 0;
}

  /** 숫자 입력 + 슬라이더 */
  function numberField(opts) {
    var o = opts || {};
    var min = o.min === undefined ? 0 : o.min;
    var max = o.max === undefined ? 100 : o.max;
    var step = o.step === undefined ? 1 : o.step;
    var value = o.value === undefined ? 0 : o.value;
    var withSlider = o.withSlider !== false;

    var input = el('input', {
      type: 'number',
      'class': 'num-input',

      max: max,
      step: step,
      value: String(value),
      id: o.id,
      attrs: { 'aria-label': o.label, inputmode: 'numeric' }
    });

      ? el('input', {
          type: 'range',
          'class': 'slider',
          min: min,
          max: max,
          step: step,
          value: String(value),

        })
      : null;

    var current = value;

    function apply(next, from) {
      var n = Number(next);
      if (isNaN(n)) return;
      n = Math.min(max, Math.max(min, n));
      current = n;
      if (from !== 'input') input.value = String(n);
      if (slider && from !== 'slider') slider.value = String(n);
      if (o.onChange) o.onChange(n);
    }

    input.addEventListener('input', function () {
      var raw = input.value;
      if (raw === '' || raw === '-') return;
      apply(raw, 'input');
    });
    input.addEventListener('blur', function () {
      apply(input.value === '' ? current : input.value);
    });
    if (slider) {
      slider.addEventListener('input', function () {
        apply(slider.value, 'slider');
      });
    }

    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [
        input,
        o.suffix ? el('span', { text: o.suffix }) : null,
        slider
      ])
    ]);

    return {
      root: root,
      input: input,
      slider: slider,
      getValue: function () {
        return current;
      },
      setValue: function (v) {
        apply(v);
      }
    };
  }

  /** 한 줄 텍스트 입력 (이번 차시 추가 헬퍼) */
  function textField(opts) {

    var input = el('input', {

      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {

  function confirmDialog(opts) {

    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;

        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,

    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');

  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.scrollToNode = scrollToNode;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.mobileTabs = mobileTabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;

  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;

    <script data-from="js/20-codeview.js">
/**

 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (중첩 조건의 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시

 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  // 3차시는 반복문이 주제이므로 for · while · break · continue · import 를 키워드로 추가한다.
  var KEYWORDS = /^(if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

  var TOKEN_RE = /(\b(?:if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range|sum|random|randint)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\+=|-=|\/\/|[%+\-*/<>=])/g;

  }

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */
  function highlightSegment(segment) {
    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;

        var j = i + 1;

   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨

  function createCodeView(opts) {

            o.headExtra || null

        : null;

      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },

        if (kind !== groupKind) {

        if (kind && !group) {

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.

        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {

      },
      count: function () {

      },
      /**

       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.

   *
   * 설명 카드를 따로 모아 두면 어느 카드가 어느 줄의 설명인지 다시 찾아야 하고,
   * 카드 수와 줄 수가 맞지 않으면 줄바꿈이 어긋난다. 그래서 자리를 격자로 묶는다.
   * 화면 4 ②(Phone 클래스)와 화면 5 ①(메소드와 self)이 이 부품을 함께 쓴다.
   *
   * @param {{items:Array<{code:string, key?:string, note:string, no?:number|string}>,
   *          headCode?:string, headNote?:string, ariaLabel?:string}} opts
   *   note 에는 <code> 같은 간단한 태그를 쓸 수 있다(우리가 쓴 고정 문구만 넣는다).
   */
  function createAnnotated(opts) {
    var o = opts || {};
    var items = o.items || [];
    var grid = el('div', {
      'class': 'annot',
      attrs: { role: 'group', 'aria-label': o.ariaLabel || '줄별 코드 설명' }
    });

    grid.appendChild(el('p', { 'class': 'annot__head', text: o.headCode || '코드' }));
    grid.appendChild(el('p', { 'class': 'annot__head', text: o.headNote || '이 줄은 무슨 뜻인가요?' }));

    items.forEach(function (item, index) {
      var source = String(item.code === undefined || item.code === null ? '' : item.code);
      var sp = splitIndent(source);
      var text = el('code', { 'class': 'annot__text' });

      // 들여쓰기 4칸마다 안내선이 있는 칸을 하나 그린다(코드 뷰와 같은 규칙).
      var depth = Math.floor(sp.spaces / 4);
      for (var k = 0; k < depth; k += 1) {
        text.appendChild(el('span', { 'class': 'annot__indent', attrs: { 'aria-hidden': 'true' } }));
      }
      var rest = sp.spaces - depth * 4;
      if (rest > 0) text.appendChild(document.createTextNode(new Array(rest + 1).join(' ')));
      text.insertAdjacentHTML('beforeend', highlightPython(sp.rest));

      grid.appendChild(
        el('div', { 'class': 'annot__code' }, [
          el('span', {
            'class': 'annot__no',
            text: String(item.no === undefined ? index + 1 : item.no),
            attrs: { 'aria-hidden': 'true' }
          }),
          text
        ])
      );
      grid.appendChild(
        el('div', { 'class': 'annot__note' }, [
          item.key ? el('p', { 'class': 'annot__note-key', text: item.key }) : null,
          el('p', { 'class': 'annot__note-text', html: item.note || '' })
        ])
      );
    });
    return grid;
  }

  L.codeview = {
    createCodeView: createCodeView,
    createAnnotated: createAnnotated,
    highlightPython: highlightPython
  };
})();

      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = norm(cell);
        if (idCol < 0 && ID_HEADERS.indexOf(v) !== -1) idCol = c;
        if (nameCol < 0 && NAME_HEADERS.indexOf(v) !== -1) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    // 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다.
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /**
   * 명단 파일을 읽는다.
   * @returns Promise<{ students:[{id,name}], warnings:string[], columns:object }>
   */
  function parseRosterFile(file) {
    var name = String(file.name || '').toLowerCase();
    var rowsPromise;

    if (/\.xlsx$/.test(name)) {
      rowsPromise = readXlsx(file);
    } else if (/\.xls$/.test(name)) {
      rowsPromise = Promise.reject(
        new Error('예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV UTF-8 로 저장해 올려 주세요.')
      );
    } else {
      rowsPromise = file.text().then(splitDelimited);
    }

    return rowsPromise.then(function (rows) {
      var picked = pickColumns(rows);
      var students = [];
      var warnings = [];
      var seen = {};

      rows.forEach(function (cells, r) {
        if (r <= picked.headerRow) return;
        var list = cells || [];
        var id = String(list[picked.idCol] === undefined ? '' : list[picked.idCol]).trim();
        var studentName = String(list[picked.nameCol] === undefined ? '' : list[picked.nameCol]).trim();
        if (!id && !studentName) return;

        // 머리글을 못 찾은 경우, 첫 줄이 「학번/이름」 같은 글자면 건너뛴다.
        if (
          picked.headerRow < 0 &&
          r === 0 &&
          (ID_HEADERS.indexOf(norm(id)) !== -1 || NAME_HEADERS.indexOf(norm(studentName)) !== -1)
        ) {
          return;
        }
        if (!id) {
          warnings.push(r + 1 + '행: 학번이 비어 있어 건너뛰었어요. (' + (studentName || '이름 없음') + ')');
          return;
        }
        if (seen[id]) {
          warnings.push(r + 1 + '행: 학번 ' + id + ' 이 여러 번 나와 한 번만 사용했어요.');
          return;
        }
        seen[id] = true;
        students.push({ id: id, name: studentName });
      });

      if (!students.length) {
        throw new Error('명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.');
      }

      return { students: students, warnings: warnings, columns: picked };
    });
  }

  /** 학번 비교용 표준형 (앞의 0 과 공백·기호를 없앤다) */
  function normalizeId(value) {
    var raw = String(value === undefined || value === null ? '' : value).trim();
    var digits = raw.replace(/[^0-9]/g, '');
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  L.roster = {
    parseRosterFile: parseRosterFile,
    normalizeId: normalizeId,
    splitDelimited: splitDelimited
  };
})();

    <script data-from="teacher/t20-analysis.js">
/**
 * 교사용 분석 로직 (명세 15장 · 18장)
 *
 *  · 학생 JSON 의 totalScore 를 그대로 믿지 않고 «교사용에서 모든 문항을 다시 채점»한다(명세 18장).
 *  · 같은 학생의 제출이 여러 건이면 가장 최근 것만 쓴다.
 *  · 정오 판정 근거가 없으면 `?` 로 표시하고 0점 처리한다.
 *  · 5번(코드 입력)은 정규화된 세 줄과 필수 요소를 다시 검사하고, 오류 유형을 함께 모은다(명세 15.5).
 *  · 화면을 만들지 않는 순수 계산부라, 브라우저 밖으로 아무것도 내보내지 않는다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var QUIZ = L.quiz;
  var LESSON_ID = L.CONST.LESSON_ID;

  var CIRCLED = '①②③④⑤';

  /** "② …" 또는 "2" 처럼 적힌 답에서 보기 번호를 뽑는다. 없으면 0. */
  function pickNumber(text) {
    var s = String(text === undefined || text === null ? '' : text).trim();
    if (!s) return 0;
    var idx = CIRCLED.indexOf(s.charAt(0));
    if (idx !== -1) return idx + 1;
    if (/^[1-5]$/.test(s)) return Number(s);
    var m = s.match(/^([1-5])[).\s]/);
    if (m) return Number(m[1]);
    return 0;
  }

  /* ------------------------------------------------------------------ */
  /* 읽어들이기 (명세 15.1)                                                */
  /* ------------------------------------------------------------------ */

  /** 어떤 모양으로 오든 「제출 객체 배열」로 펴 준다. */
  function flatten(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) {
      return raw.reduce(function (acc, item) {
        return acc.concat(flatten(item));
      }, []);
    }
    if (typeof raw === 'object') {
      if (Array.isArray(raw.items)) return flatten(raw.items);
      if (Array.isArray(raw.data)) return flatten(raw.data);
      if (Array.isArray(raw.rows)) return flatten(raw.rows);
      if (Array.isArray(raw.submissions)) return flatten(raw.submissions);
      return [raw];
    }
    return [];
  }

  /** 이번 차시 자료만 남긴다. lesson 값이 없으면 문항 구성으로 판단한다. */
  function isThisLesson(sub) {
    if (!sub || typeof sub !== 'object') return false;
    if (sub.lesson) return String(sub.lesson) === LESSON_ID;
    return Array.isArray(sub.answers);
  }

  /** 다른 차시로 걸러진 건수 (명세 15.1 : 제외 건수를 알린다) */
  function countExcluded(raw) {
    var all = flatten(raw);
    return all.length - all.filter(isThisLesson).length;
  }

  /* ------------------------------------------------------------------ */
  /* 재채점 (명세 18장)                                                    */
  /* ------------------------------------------------------------------ */

  /**
   * 한 명의 제출을 다시 채점한다.
   * @returns {{studentId, name, receivedAt, marks, picks, code, score, storedScore,
   *            mismatch, passed, submitted}}
   */
  function regrade(sub) {
    var answers = Array.isArray(sub.answers) ? sub.answers : [];
    var marks = {};
    var picks = {};
    var code = null; // 5번 코드 분석 결과
    var score = 0;

    QUIZ.QUESTIONS.forEach(function (q) {
      var row = null;
      for (var i = 0; i < answers.length; i += 1) {
        if (Number(answers[i].questionId) === q.id) {
          row = answers[i];
          break;
        }
      }
      if (!row) {
        marks[q.id] = '-';
        return;
      }

      var raw = row.answer;
      var isEmpty =
        raw === undefined ||
        raw === null ||
        (Array.isArray(raw) ? QUIZ.codeLines(raw).length === 0 : String(raw).trim() === '');
      if (isEmpty) {
        marks[q.id] = '-';
        return;
      }

      if (q.type === 'choice') picks[q.id] = pickNumber(raw) || null;

      // ① 문항 은행의 정답 규칙으로 다시 판정한다(가장 믿을 만하다).
      var restored = QUIZ.answerFromText(q, raw);
      if (restored !== null && restored !== undefined && QUIZ.isAnswered(q, restored)) {
        var ok = QUIZ.gradeAnswer(q, restored);
        marks[q.id] = ok ? 'O' : 'X';
        if (ok) score += q.points;
        if (q.type === 'code') code = QUIZ.checkCode(restored, q.codeSpec);
        return;
      }
      // ② 학생 파일의 isCorrect 를 참고
      if (row.isCorrect === true || row.isCorrect === '정답') {
        marks[q.id] = 'O';
        score += q.points;
        return;
      }
      if (row.isCorrect === false || row.isCorrect === '오답') {
        marks[q.id] = 'X';
        return;
      }
      marks[q.id] = '?'; // 판정 근거 없음 → 0점
    });

    var stored = Number(sub.totalScore);
    return {
      studentId: String(sub.studentId || '').trim(),
      name: String(sub.name || '').trim(),
      receivedAt: sub.receivedAt || sub.submittedAt || '',
      marks: marks,
      picks: picks,
      code: code,
      matched: code ? code.matched : null,
      score: score,
      storedScore: isNaN(stored) ? null : stored,
      mismatch: !isNaN(stored) && stored !== score,
      passed: score >= QUIZ.PASS_SCORE,
      submitted: true
    };
  }

  function keyOf(row) {
    return (row.studentId || '') + '|' + (row.name || '');
  }

  function timeValue(text) {
    var t = Date.parse(text);
    return isNaN(t) ? 0 : t;
  }

  /** 제출 목록 정리 — 다른 차시 제외 · 같은 학생은 가장 최근 제출만 (명세 18장) */
  function buildRows(raw) {
    var list = flatten(raw).filter(isThisLesson).map(regrade);
    var map = {};
    list.forEach(function (row) {
      var key = keyOf(row);
      var prev = map[key];
      if (!prev || timeValue(row.receivedAt) >= timeValue(prev.receivedAt)) map[key] = row;
    });
    return Object.keys(map).map(function (k) {
      return map[k];
    });
  }

  /* ------------------------------------------------------------------ */
  /* 학생 명단 병합 (명세 15.2)                                             */
  /* ------------------------------------------------------------------ */

  /** CSV · TSV · TXT 한 장을 [{id, name}] 로 바꾼다. 머리글 「학번 / 이름」을 자동 인식한다. */
  function parseRoster(text) {
    var lines = String(text || '')
      .replace(/^﻿/, '')
      .split(/\r?\n/)
      .filter(function (line) {
        return line.trim().length > 0;
      });
    if (!lines.length) return [];

    var sep = lines[0].indexOf('\t') !== -1 ? '\t' : lines[0].indexOf(',') !== -1 ? ',' : /\s{2,}/;
    var split = function (line) {
      return line.split(sep).map(function (cell) {
        return cell.trim().replace(/^"|"$/g, '');
      });
    };

    var head = split(lines[0]);
    var idCol = 0;
    var nameCol = 1;
    var hasHead = false;
    head.forEach(function (cell, i) {
      if (/학번|번호|id/i.test(cell)) {
        idCol = i;
        hasHead = true;
      }
      if (/이름|성명|name/i.test(cell)) {
        nameCol = i;
        hasHead = true;
      }
    });

    return lines
      .slice(hasHead ? 1 : 0)
      .map(function (line) {
        var cells = split(line);
        return {
          id: String(cells[idCol] || '').trim(),
          name: String(cells[nameCol] || '').trim()
        };
      })
      .filter(function (row) {
        return row.id || row.name;
      });
  }

  /** 학번 비교용 표준형. t15-roster.js 가 있으면 그것을 쓴다. */
  function normalizeId(value) {
    if (L.roster && typeof L.roster.normalizeId === 'function') return L.roster.normalizeId(value);
    var raw = String(value === undefined || value === null ? '' : value).trim();
    var digits = raw.replace(/[^0-9]/g, '');
    return digits ? String(Number(digits)) : raw.toLowerCase();
  }

  /** 명단을 붙여 미제출 학생도 표에 넣는다(명세 15.2). */
  function mergeRoster(rows, roster) {
    if (!roster || !roster.length) return rows.slice();
    var byId = {};
    rows.forEach(function (row) {
      byId[normalizeId(row.studentId)] = row;
    });
    var merged = roster.map(function (person) {
      var found = byId[normalizeId(person.id)];
      if (found) {
        found.name = found.name || person.name;
        if (person.id) found.studentId = person.id;
        return found;
      }
      return {
        studentId: person.id,
        name: person.name,
        receivedAt: '',
        marks: {},
        picks: {},
        code: null,
        matched: null,
        score: 0,
        storedScore: null,
        mismatch: false,
        passed: false,
        submitted: false
      };
    });
    var inRoster = {};
    roster.forEach(function (p) {
      inRoster[normalizeId(p.id)] = true;
    });
    rows.forEach(function (row) {
      if (!inRoster[normalizeId(row.studentId)]) merged.push(row);
    });
    return merged;
  }

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 15.3 · 15.4)                                                */
  /* ------------------------------------------------------------------ */
  function summarize(rows) {
    var submitted = rows.filter(function (r) {
      return r.submitted;
    });
    var scores = submitted.map(function (r) {
      return r.score;
    });
    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);
    var passCount = submitted.filter(function (r) {
      return r.passed;
    }).length;
    return {
      total: rows.length,
      submitted: submitted.length,
      missing: rows.length - submitted.length,
      average: submitted.length ? Math.round((sum / submitted.length) * 10) / 10 : 0,
      max: submitted.length ? Math.max.apply(null, scores) : 0,
      min: submitted.length ? Math.min.apply(null, scores) : 0,
      perfect: submitted.filter(function (r) {
        return r.score === QUIZ.MAX_SCORE;
      }).length,
      passCount: passCount,
      passRate: submitted.length ? Math.round((passCount / submitted.length) * 100) : 0,
      mismatch: submitted.filter(function (r) {
        return r.mismatch;
      }).length
    };
  }

  /** 명세 15.4 : 점수 높은 순 → 동점이면 제출 시각 빠른 순 */
  function top3(rows) {
    return rows
      .filter(function (r) {
        return r.submitted;
      })
      .slice()
      .sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return timeValue(a.receivedAt) - timeValue(b.receivedAt);
      })
      .slice(0, 3);
  }

  /** 명세 15.5 : 오답률 → 오답 인원 → 문항 번호 순으로 정렬한 문항 분석 */
  function questionStats(rows) {
    var submitted = rows.filter(function (r) {
      return r.submitted;
    });
    var stats = QUIZ.QUESTIONS.map(function (q) {
      var wrong = 0;
      var none = 0;
      var unknown = 0;
      var dist = [0, 0, 0, 0, 0];
      var errors = {}; // 코드 오류 유형 분포
      var matchedSum = 0;
      var matchedCount = 0;

      submitted.forEach(function (r) {
        var mark = r.marks[q.id];
        if (mark === 'X') wrong += 1;
        else if (mark === '-') none += 1;
        else if (mark === '?') unknown += 1;

        var picked = r.picks[q.id];
        if (picked >= 1 && picked <= 5) dist[picked - 1] += 1;

        if (q.type === 'code' && r.code) {
          matchedSum += r.code.matched;
          matchedCount += 1;
          if (mark !== 'O') {
            (r.code.errors || []).forEach(function (name) {
              errors[name] = (errors[name] || 0) + 1;
            });
          }
        }
      });

      var missCount = wrong + none + unknown; // 점수를 받지 못한 인원
      return {
        question: q,
        wrong: wrong,
        none: none,
        unknown: unknown,
        missCount: missCount,
        correct: submitted.length - missCount,
        total: submitted.length,
        rate: submitted.length ? Math.round((missCount / submitted.length) * 100) : 0,
        correctRate: submitted.length
          ? Math.round(((submitted.length - missCount) / submitted.length) * 100)
          : 0,
        dist: dist,
        errors: errors,
        avgMatched: matchedCount ? Math.round((matchedSum / matchedCount) * 10) / 10 : null
      };
    });
    return stats.sort(function (a, b) {
      if (b.rate !== a.rate) return b.rate - a.rate;
      if (b.missCount !== a.missCount) return b.missCount - a.missCount;
      return a.question.id - b.question.id;
    });
  }

  /** 영역별 정답률 — 정답률이 낮은 순으로 돌려준다. */
  function categoryStats(rows) {
    var byId = {};
    questionStats(rows).forEach(function (item) {
      byId[item.question.id] = item;
    });
    return QUIZ.byCategory()
      .map(function (group) {
        var correct = 0;
        var total = 0;
        group.questions.forEach(function (q) {
          var item = byId[q.id];
          if (!item) return;
          correct += item.correct;
          total += item.total;
        });
        return {
          category: group.category,
          questions: group.questions.map(function (q) {
            return q.id;
          }),
          correct: correct,
          total: total,
          correctRate: total ? Math.round((correct / total) * 100) : 0
        };
      })
      .sort(function (a, b) {
        return a.correctRate - b.correctRate;
      });
  }

  /* ------------------------------------------------------------------ */
  /* CSV (명세 15.7)                                                       */
  /* ------------------------------------------------------------------ */
  function toCSV(rows) {
    var head = ['학번', '이름'];
    QUIZ.QUESTIONS.forEach(function (q) {
      head.push(q.id + '번');
    });
    head.push('5번 충족 요소 수', '총점', '이수 여부', '제출 시각');

    var lines = [head];
    rows.forEach(function (r) {
      var line = [r.studentId, r.name];
      QUIZ.QUESTIONS.forEach(function (q) {
        line.push(r.submitted ? markSymbol(r.marks[q.id]) : '미제출');
      });
      line.push(r.submitted && r.matched !== null ? r.matched + ' / 3' : '');
      line.push(r.submitted ? String(r.score) : '');
      line.push(r.submitted ? QUIZ.passLabel(r.score) : '미제출');
      line.push(r.receivedAt || '');
      lines.push(line);
    });

    var body = lines
      .map(function (cells) {
        return cells
          .map(function (cell) {
            var text = String(cell === undefined || cell === null ? '' : cell);
            return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          })
          .join(',');
      })
      .join('\r\n');

    // 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다(명세 15.7).
    return '﻿' + body;
  }

  /** 색 없이도 읽히도록 기호로 바꾼다(명세 15.6). */
  function markSymbol(mark) {
    if (mark === 'O') return '○';
    if (mark === 'X') return '✕';
    if (mark === '?') return '?';
    return '−';
  }

  L.analysis = {
    flatten: flatten,
    isThisLesson: isThisLesson,
    countExcluded: countExcluded,
    regrade: regrade,
    buildRows: buildRows,
    parseRoster: parseRoster,
    mergeRoster: mergeRoster,
    summarize: summarize,
    top3: top3,
    questionStats: questionStats,
    categoryStats: categoryStats,
    toCSV: toCSV,
    markSymbol: markSymbol,
    pickNumber: pickNumber,
    normalizeId: normalizeId
  };
})();
