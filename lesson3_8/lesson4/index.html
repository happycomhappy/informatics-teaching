  }

  /** 숫자 입력 + 슬라이더 */
  function numberField(opts) {
    var o = opts || {};
    var min = o.min === undefined ? 0 : o.min;
    var max = o.max === undefined ? 100 : o.max;
    var step = o.step === undefined ? 1 : o.step;
    var value = o.value === undefined ? 0 : o.value;
    var withSlider = o.withSlider !== false;

    var input = el('input', {
      type: 'number',
      'class': 'num-input',
      min: min,
      max: max,
      step: step,
      value: String(value),
      id: o.id,
      attrs: { 'aria-label': o.label, inputmode: 'numeric' }
    });
    var slider = withSlider
      ? el('input', {
          type: 'range',
          'class': 'slider',
          min: min,
          max: max,
          step: step,
          value: String(value),
          attrs: { 'aria-label': (o.label || '값') + ' 슬라이더' }
        })
      : null;

    var current = value;

    function apply(next, from) {
      var n = Number(next);
      if (isNaN(n)) return;
      n = Math.min(max, Math.max(min, n));
      current = n;
      if (from !== 'input') input.value = String(n);
      if (slider && from !== 'slider') slider.value = String(n);
      if (o.onChange) o.onChange(n);
    }

    input.addEventListener('input', function () {
      var raw = input.value;
      if (raw === '' || raw === '-') return;
      apply(raw, 'input');
    });
    input.addEventListener('blur', function () {
      apply(input.value === '' ? current : input.value);
    });
    if (slider) {
      slider.addEventListener('input', function () {
        apply(slider.value, 'slider');
      });
    }

    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [
        input,
        o.suffix ? el('span', { text: o.suffix }) : null,
        slider
      ])
    ]);

    return {
      root: root,
      input: input,
      slider: slider,
      getValue: function () {
        return current;
      },
      setValue: function (v) {
        apply(v);
      }
    };
  }

  /** 한 줄 텍스트 입력 (이번 차시 추가 헬퍼) */
  function textField(opts) {
    var o = opts || {};
    var input = el('input', {
      type: 'text',
      'class': ('num-input ' + (o.className || '')).trim(),

        inputmode: o.inputmode || undefined,
        maxlength: o.maxLength || undefined
      }
    });

    if (o.onEnter) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') o.onEnter(input.value);
      });
    }
    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [input, o.suffix ? el('span', { text: o.suffix }) : null])
    ]);
    return {
      root: root,
      input: input,
      getValue: function () {
        return input.value;

      setValue: function (v) {

      }

  /* ------------------------ 실행 결과 출력 창 ------------------------ */
  function createConsole(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '실행 버튼을 누르면 결과가 여기에 표시돼요.';

/* ==================================================================
 * 4차시에서 새로 필요한 UI 부품
 *
 * 위 블록은 1~3차시와 «같은 파일»이라 손대지 않는다.
 * 협력 프로젝트에만 필요한 것(여러 개 고르기 · 큰 모달 · 코드 보기 ·
 * 파일 내려받기 · 시각 표시)만 여기에 이어 붙인다.
 * ================================================================== */

  "use strict";

  var L = window.L || (window.L = {});
  var ui = L.ui || (L.ui = {});
  var el = ui.el;

  /* ---------------------------- 여러 개 고르기 ---------------------------- */
  /**
   * 체크박스 묶음 (협력 약속 · 기여 항목 등).
   *   options : [{ value, label, sub }]
   *   values  : 지금 선택된 값 배열

        attrs: { 'aria-label': opt.ariaLabel || opt.label }

      input.addEventListener('change', function () {
        var at = selected.indexOf(opt.value);
        if (input.checked && at < 0) selected.push(opt.value);
        if (!input.checked && at >= 0) selected.splice(at, 1);
        if (o.onChange) o.onChange(selected.slice());
      });
      return el('label', { 'class': 'choice' }, [
        input,
        el('span', { 'class': 'choice__body' }, [
          el('span', { 'class': 'choice__label', text: opt.label }),
          opt.sub ? el('span', { 'class': 'choice__sub', text: opt.sub }) : null
        ])
      ]);
    });
    var root = el(
      'div',
      {
        'class': 'choice-group ' + (o.className || ''),
        attrs: { role: 'group', 'aria-label': o.ariaLabel || o.label || '여러 개 고르기' }
      },
      items
    );
    return {
      root: root,
      getValues: function () {
        return selected.slice();
      }
    };
  }

  /** 체크 한 칸 (한 줄 확인용) */
  function checkLine(opts) {
    var o = opts || {};
    var input = el('input', {
      type: 'checkbox',
      checked: o.checked === true,
      attrs: { 'aria-label': o.label }
    });
    input.addEventListener('change', function () {
      if (o.onChange) o.onChange(input.checked);
    });
    var root = el('label', { 'class': 'choice choice--line' }, [
      input,
      el('span', { 'class': 'choice__body' }, [
        el('span', { 'class': 'choice__label', text: o.label }),
        o.sub ? el('span', { 'class': 'choice__sub', text: o.sub }) : null
      ])
    ]);
    return { root: root, input: input };
  }

  /* ------------------------------ 큰 모달 ------------------------------ */
  /**
   * 내용을 직접 넣는 모달 (제출 미리보기 · 버전 복원 확인 등).
   *   title / body(노드) / actions([{label, variant, value, close}])
   * 반환 : Promise — 누른 버튼의 value (그냥 닫으면 null)
   */
  function modal(opts) {
    var o = opts || {};
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal modal--wide' });
      var settled = false;
      function done(value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      }

      var actions = (o.actions || [{ label: '닫기', value: null }]).map(function (a) {
        return ui.button({
          label: a.label,
          variant: a.variant || 'ghost',
          onClick: function () {
            if (typeof a.onClick === 'function') {
              var keep = a.onClick(done);
              if (keep === false) return; // 모달을 열어 둔 채로 계속
            }
            if (a.close === false) return;
            done(a.value === undefined ? null : a.value);
          }
        });
      });

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          o.lead ? el('p', { 'class': 'modal__text', text: o.lead }) : null,
          el('div', { 'class': 'modal__content stack' }, [o.body || null]),
          el('div', { 'class': 'modal__actions' }, actions)
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(null);
      });
      dialog.addEventListener('close', function () {
        done(null);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /* ----------------------------- 코드 보기 ----------------------------- */
  /**
   * 읽기 전용 Python 코드 블록.
   *   code / title / badge('예시 전용' 등) / copy(기본 true) / lineNumbers
   * 명세 8.1 : 복사 버튼은 허용하되 팀 편집기에 자동으로 넣지 않는다.
   */
  function codeBlock(opts) {
    var o = opts || {};
    var code = String(o.code || '').replace(/\s+$/, '');
    var lines = code.split('\n');

    var pre = el('pre', { 'class': 'codeblock__pre' });
    var codeNode = el('code', { 'class': 'codeblock__code' });
    if (o.lineNumbers === false) {
      codeNode.innerHTML = L.highlightPython ? L.highlightPython(code) : ui.escapeHtml(code);
    } else {
      codeNode.innerHTML = lines
        .map(function (line, i) {
          var no = String(i + 1);
          return (
            '<span class="codeblock__line"><span class="codeblock__no" aria-hidden="true">' +
            no +
            '</span><span class="codeblock__text">' +
            (L.highlightPython ? L.highlightPython(line) : ui.escapeHtml(line)) +
            '</span></span>'
          );
        })
        // 줄 사이에 \n 을 넣지 않는다.
        // .codeblock__line 은 그 자체로 한 줄(flex)이고 pre 는 \n 을 그대로 살리므로,
        // 둘을 함께 쓰면 줄 간격이 두 배로 벌어진다.
        .join('');
    }
    pre.appendChild(codeNode);

    var head =
      o.title || o.badge || o.copy !== false
        ? el('div', { 'class': 'codeblock__head' }, [
            el('span', { 'class': 'codeblock__title', text: o.title || 'Python' }),
            o.badge
              ? el('span', {
                  'class': 'badge badge--false codeblock__badge',
                  text: o.badge,
                  attrs: { title: o.badgeTitle || undefined }
                })
              : null,
            o.copy === false
              ? null
              : ui.button({
                  label: '복사',
                  variant: 'ghost',
                  className: 'btn--sm',
                  onClick: function (e) {
                    copyText(code).then(function (ok) {
                      ui.toast(ok ? '코드를 복사했어요.' : '복사하지 못했어요. 직접 선택해 주세요.');
                      if (e && e.target) e.target.textContent = ok ? '복사됨' : '복사';
                      setTimeout(function () {
                        if (e && e.target) e.target.textContent = '복사';
                      }, 1500);
                    });
                  }
                })
          ])
        : null;

    return el('div', { 'class': ('codeblock ' + (o.className || '')).trim() }, [
      head,
      el('div', { 'class': 'codeblock__scroll' }, [pre]),
      o.note ? el('p', { 'class': 'codeblock__note', text: o.note }) : null
    ]);
  }

  /**
   * 코드와 설명을 «좌우로» 나란히 놓는다 (명세 8.2 페이지 3).
   *   codeWithNotes({ code: 코드블록노드, notes: [설명노드…] })
   * 넓은 화면에서는 왼쪽 코드 · 오른쪽 설명,
   * 좁은 화면에서는 코드 아래에 설명이 오도록 자동으로 쌓인다.
   */
  function codeWithNotes(opts) {
    var o = opts || {};
    var notes = (o.notes || []).filter(Boolean);
    return el('div', { 'class': ('codepair ' + (o.className || '')).trim() }, [
      el('div', { 'class': 'codepair__code' }, [o.code || null]),
      notes.length ? el('div', { 'class': 'codepair__notes' }, notes) : null
    ]);
  }

  /**
   * 코드 한 줄씩 붙이는 설명 목록.
   *   items : [{ token:'open()', text:'파일을 연다.' }] 또는 문자열
   */
  function codeNotes(items) {
    return el(
      'ul',
      { 'class': 'codenotes' },
      (items || []).map(function (item) {
        if (typeof item === 'string') {
          return el('li', { 'class': 'codenotes__item' }, [
            el('span', { 'class': 'codenotes__text', html: item })
          ]);
        }
        return el('li', { 'class': 'codenotes__item' }, [
          item.token ? el('code', { 'class': 'codenotes__token', text: item.token }) : null,
          el('span', { 'class': 'codenotes__text', html: item.text })
        ]);
      })
    );
  }

  /** 글자를 클립보드로 복사한다(옛 브라우저 대비 포함). */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (err) {
      return false;
    }
  }

  /* ---------------------------- 파일 내려받기 ---------------------------- */
  /** 글자 내용을 파일로 저장한다 (명세 13.5 제출 실패 대비). */
  function downloadText(filename, text, mime) {
    try {
      var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (err) {
      return false;
    }
  }

  /* ------------------------------ 시각 표시 ------------------------------ */
  /** 2026-08-15 10:04 형식 */
  function formatTime(value) {
    var d = value ? new Date(value) : new Date();
    if (isNaN(d.getTime())) return '';
    function two(n) {
      return n < 10 ? '0' + n : String(n);
    }
    return (
      d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) +
      ' ' + two(d.getHours()) + ':' + two(d.getMinutes())
    );
  }

  /** 시:분:초 만 */
  function formatClock(value) {
    var d = value ? new Date(value) : new Date();
    if (isNaN(d.getTime())) return '';
    function two(n) {
      return n < 10 ? '0' + n : String(n);
    }
    return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
  }

  /** 현재 시각을 +09:00 같은 시간대까지 붙은 문자열로 (명세 16장 submittedAtClient) */
  function isoWithOffset(date) {
    var d = date || new Date();
    var offMin = -d.getTimezoneOffset();
    var sign = offMin >= 0 ? '+' : '-';
    var abs = Math.abs(offMin);
    function two(n) {
      return n < 10 ? '0' + n : String(n);
    }
    return (
      d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) +
      'T' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) +
      sign + two(Math.floor(abs / 60)) + ':' + two(abs % 60)
    );
  }

  /* ---------------------------- 진행 상황 표시 ---------------------------- */
  /**
   * `9개 중 n개 충족` 같은 카운터 배지 (명세 11.5).
   *   items : [{ ok:boolean, label:string, hint:string }]
   */
  function checklist(items) {
    var list = items || [];
    return el(
      'ul',
      { 'class': 'checklist' },
      list.map(function (item) {
        return el(
          'li',
          { 'class': 'checklist__item ' + (item.ok ? 'is-ok' : 'is-todo') },
          [
            el('span', {
              'class': 'checklist__mark',
              text: item.ok ? '✓' : '·',
              attrs: { 'aria-hidden': 'true' }
            }),
            el('span', { 'class': 'checklist__body' }, [
              el('span', { 'class': 'checklist__label', text: item.label }),
              item.hint ? el('span', { 'class': 'checklist__hint', text: item.hint }) : null
            ]),
            // 색만으로 구분하지 않는다(명세 22장)
            el('span', {
              'class': 'checklist__state',
              text: item.ok ? '충족' : '미충족'
            })
          ]
        );
      })
    );
  }

  /* ----------------------------- 페이지 머리말 ----------------------------- */
  /**
   * 이 차시는 «단계» 가 아니라 «페이지» 로 센다(명세 7장 — 전체 10페이지).
   * 1~3차시의 stepHeader 와 모양은 같고 눈썹 글자만 다르다.
   */
  function pageHeader(opts) {
    var o = opts || {};
    var lead = o.lead || [];
    var total = (L.CONST && L.CONST.TOTAL_PAGES) || 10;
    var kind = (L.CONST && L.CONST.PAGE_KIND && L.CONST.PAGE_KIND[o.page]) || 'project';
    return el('header', { 'class': 'step-header' }, [
      el('p', {
        'class': 'step-header__eyebrow',
        text:
          o.page + ' / ' + total + ' 페이지 · ' +
          (kind === 'example' ? '학교 급식 조회 예시' : '우리 팀 프로젝트')
      }),
      el('h2', { 'class': 'step-header__title', text: o.title }),
      lead.length
        ? el(
            'div',
            { 'class': 'step-header__lead' },
            lead.map(function (line) {
              return el('p', { html: line });
            })
          )
        : null
    ]);
  }
  ui.pageHeader = pageHeader;

  /* ---------------------------- 안내 상자 보강 ---------------------------- */
  // 1~3차시의 callout(html, {muted:true}) 은 그대로 두고,
  // { className:'callout--warn' } 처럼 꾸밈 이름을 직접 주는 방식도 받도록 감싼다.
  var baseCallout = ui.callout;
  ui.callout = function (html, opts) {
    var o = opts || {};
    var node = baseCallout(html, o);
    if (o.className) {
      o.className.split(/\s+/).forEach(function (name) {
        if (name) node.classList.add(name);
      });
    }
    return node;
  };

  ui.checkboxGroup = checkboxGroup;
  ui.checkLine = checkLine;
  ui.modal = modal;
  ui.codeBlock = codeBlock;
  ui.codeWithNotes = codeWithNotes;
  ui.codeNotes = codeNotes;
  ui.copyText = copyText;
  ui.downloadText = downloadText;
  ui.formatTime = formatTime;
  ui.formatClock = formatClock;
  ui.isoWithOffset = isoWithOffset;
  ui.checklist = checklist;
})();

/* ==================================================================
 * Python 구문 강조 (명세 11.1 · 19.4)
 * 외부 라이브러리 없이 아주 작은 규칙만 쓴다.
 * 문자열 → 주석 → 키워드 → 숫자 순서로 겹치지 않게 잘라 낸다.
 * ================================================================== */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  var KEYWORDS = [
    'False', 'None', 'True', 'and', 'as', 'assert', 'break', 'class', 'continue',
    'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global',
    'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass',
    'raise', 'return', 'try', 'while', 'with', 'yield'
  ];
  var BUILTINS = ['print', 'len', 'range', 'int', 'str', 'float', 'bool', 'list', 'input', 'self'];

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /**
   * 한 덩어리의 Python 코드를 <span class="tok-…"> 이 섞인 HTML 로 바꾼다.
   * 여러 줄 문자열(''' … ''')까지 완벽히 처리하지는 않는다. 학습용 짧은 코드 기준이다.
   */
  L.highlightPython = function (code) {
    var src = String(code === undefined || code === null ? '' : code);
    var out = '';
    var i = 0;

    while (i < src.length) {
      var ch = src[i];

      // 주석
      if (ch === '#') {
        var endC = src.indexOf('\n', i);
        if (endC < 0) endC = src.length;
        out += '<span class="tok-comment">' + esc(src.slice(i, endC)) + '</span>';
        i = endC;
        continue;
      }

      // 문자열 (f-string 접두어 포함)
      if (ch === '"' || ch === "'") {
        var quote = ch;
        var triple = src.substr(i, 3) === quote + quote + quote;
        var j = i + (triple ? 3 : 1);
        while (j < src.length) {
          if (src[j] === '\\') { j += 2; continue; }
          if (triple && src.substr(j, 3) === quote + quote + quote) { j += 3; break; }
          if (!triple && src[j] === quote) { j += 1; break; }
          if (!triple && src[j] === '\n') break;
          j += 1;
        }
        out += '<span class="tok-str">' + esc(src.slice(i, j)) + '</span>';
        i = j;
        continue;
      }

      // 이름 / 키워드 / 숫자
      if (/[A-Za-z_]/.test(ch)) {
        var k = i;
        while (k < src.length && /[A-Za-z0-9_]/.test(src[k])) k += 1;
        var word = src.slice(i, k);
        // 문자열 접두어 f'' r'' 는 문자열 쪽에서 다시 처리하도록 넘긴다
        if (/^[fFrRbBuU]{1,2}$/.test(word) && (src[k] === '"' || src[k] === "'")) {
          out += '<span class="tok-str">' + esc(word) + '</span>';
          i = k;
          continue;
        }
        if (KEYWORDS.indexOf(word) >= 0) out += '<span class="tok-kw">' + esc(word) + '</span>';
        else if (BUILTINS.indexOf(word) >= 0) out += '<span class="tok-fn">' + esc(word) + '</span>';
        else out += esc(word);
        i = k;
        continue;
      }

      if (/[0-9]/.test(ch)) {
        var n = i;
        while (n < src.length && /[0-9._]/.test(src[n])) n += 1;
        out += '<span class="tok-num">' + esc(src.slice(i, n)) + '</span>';
        i = n;
        continue;
      }

      out += esc(ch);
      i += 1;
    }
    return out;
  };
})();

    <script data-from="js/20-state.js">
/**
 * 팀 프로젝트 상태 저장 (명세 15장 · 16장)
 *
 * 저장 위치는 팀 코드마다 따로 둔다(명세 15.3).
 *   lesson3_8_4_team_C01, lesson3_8_4_team_C02, …
 * 아직 팀 코드를 정하지 않았을 때는 임시 키 lesson3_8_4_team_state 를 쓰고,
 * 팀 코드가 정해지는 순간 그 키로 옮겨 담는다.
 *
 * 저장이 실패해도(사생활 보호 모드 · 용량 초과) 코드 작성과 실행을 막지 않는다(명세 15.1).
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var state = L.state || (L.state = {});
  var C = L.CONST || {};

  /* ------------------------------------------------------------------ */
  /* 저장소 접근 — 실패해도 앱이 멈추지 않게 감싼다                        */
  /* ------------------------------------------------------------------ */

  var memoryStore = {}; // localStorage 를 못 쓸 때 쓰는 임시 보관소
  var storageOk = true;

  function store() {
    try {
      if (typeof window !== 'undefined' && window.localStorage) return window.localStorage;
    } catch (err) {
      /* 접근 자체가 막힌 경우 */
    }
    return null;
  }

  function readRaw(key) {
    var s = store();
    if (s) {
      try {
        return s.getItem(key);
      } catch (err) {
        storageOk = false;
      }
    }
    return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
  }

  function writeRaw(key, value) {
    memoryStore[key] = value;
    var s = store();
    if (!s) return false;
    try {
      s.setItem(key, value);
      storageOk = true;
      return true;
    } catch (err) {
      storageOk = false;
      return false;
    }
  }

  function removeRaw(key) {
    delete memoryStore[key];
    var s = store();
    if (!s) return;
    try {
      s.removeItem(key);
    } catch (err) {
      /* 무시 */
    }
  }

  state.isStorageHealthy = function () {
    return storageOk;
  };

  /* ------------------------------------------------------------------ */
  /* 기본 데이터 모양                                                     */
  /* ------------------------------------------------------------------ */

  /** 팀원 한 명의 빈 칸 */
  function emptyMember(index) {
    var roles = C.ROLES || [];
    return {
      seat: index + 1,
      studentId: '',
      name: '',
      role: '', // 역할 id (coordinator/designer/developer/tester)
      contributions: [], // 명세 6.4 단계별 기여 기록
      contributionNote: ''
    };
  }

  /** 명세 16장의 제출 JSON 과 같은 뼈대를 그대로 화면 상태로 쓴다. */
  function createEmpty() {
    var members = [];
    for (var i = 0; i < (C.TEAM_SIZE || 4); i += 1) members.push(emptyMember(i));
    return {
      lesson: C.LESSON_ID || 'lesson3_8_4',
      lessonTitle: C.LESSON_TITLE || '',
      teamCode: '',
      teamName: '',
      motto: '',
      members: members,
      roleSwap: { from: '', to: '', reason: '' },

      // 페이지 1~4 : 급식 조회 예시 학습 기록
      example: {
        p1Problem: '',
        p1Checked: false,
        p2Reasons: [],
        p2Order: [],
        p2Vars: {},
        p3Checked: [],
        p4Runs: {},
        p4Answer: '',
        bridge: { pain: '', program: '' }
      },

      // 페이지 5
      topic: {
        type: '',
        title: '',
        problem: '',
        user: '',
        expectedResult: '',
        reason: '',
        approval: 'none' // none | pending | approved
      },
      agreements: [],
      agreementCustom: '',
      selfCheck: {}, // 자유 주제 자기 점검 (명세 5.3)

      // 페이지 6
      design: {
        className: '',
        classDescription: '',
        properties: ['', '', ''],
        methods: ['', ''],
        conditionalMethod: '',
        conditionalRule: '',
        instances: [
          { objectName: '', values: {} },
          { objectName: '', values: {} }
        ],
        expectedOutput: ''
      },
      designChecks: [], // [{ seat, item, note, at }] — 네 명이 각각 한 항목씩 (명세 10.4)

      // 페이지 7
      code: '',
      codeLogs: [], // [{ summary, author, reviewers[], savedAt }] (명세 11.6)
      // 실행은 웹앱 «밖» 에서 한다(명세 2.2). 여기에는 그 «기록» 만 남는다.
      runtime: {
        engine: 'external-python',
        ranOutside: true,
        lastRunSucceeded: false, // 팀이 「정상 실행되었다」 를 체크했는가
        stdout: '', // 밖에서 실행한 결과를 붙여 넣은 것
        stderr: '',
        recordedAt: '', // 결과를 기록한 시각
        checkedAt: '', // 구조 검사를 한 시각
        exportedAt: '', // 코드를 복사·저장한 시각
        exportedHow: '',
        structureChecks: { passed: 0, total: C.STRUCTURE_TOTAL || 9, details: [] }
      },

      // 페이지 8
      tests: [],
      improvements: [],
      finalChecks: [], // 최종 확인을 마친 팀원의 자리 번호 (명세 12.5)

      // 페이지 9
      explanation: {},
      presentation: '',
      contributionRecords: {}, // 자리번호 -> { role, did, understood, next } (명세 13.3)

      // 페이지 10 — 자리번호를 열쇠로 쓰는 객체다 (배열이 아니다)
      mutualChecks: {}, // 자리번호 -> { topic, code, run, contribution }
      reflections: {}, // 자리번호 -> { personal, suggestion }

      // 진행 관리
      page: 1,
      maxPage: 1,
      submitted: false,
      submittedAt: '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
  }

  /** 저장된 옛 데이터에 빠진 칸이 있으면 기본값으로 채운다(형태만 맞춘다). */
  function normalize(raw) {
    var base = createEmpty();
    if (!raw || typeof raw !== 'object') return base;

    Object.keys(base).forEach(function (key) {
      var value = raw[key];
      if (value === undefined || value === null) return;
      if (Array.isArray(base[key])) {
        base[key] = Array.isArray(value) ? value : base[key];
      } else if (typeof base[key] === 'object') {
        base[key] = mergeObject(base[key], value);
      } else {
        base[key] = value;
      }
    });

    // 팀원 칸 수는 반드시 맞춘다
    var size = C.TEAM_SIZE || 4;
    var members = [];
    for (var i = 0; i < size; i += 1) {
      var src = base.members[i] || {};
      var m = emptyMember(i);
      m.studentId = String(src.studentId || '');
      m.name = String(src.name || '');
      m.role = String(src.role || '');
      m.contributions = Array.isArray(src.contributions) ? src.contributions : [];
      m.contributionNote = String(src.contributionNote || '');
      members.push(m);
    }
    base.members = members;

    // 설계 배열 최소 길이 보정
    while (base.design.properties.length < 3) base.design.properties.push('');
    while (base.design.methods.length < 2) base.design.methods.push('');
    while (base.design.instances.length < 2) base.design.instances.push({ objectName: '', values: {} });

    return base;
  }

  function mergeObject(target, source) {
    if (!source || typeof source !== 'object') return target;
    var out = {};
    Object.keys(target).forEach(function (k) {
      out[k] = target[k];
    });
    Object.keys(source).forEach(function (k) {
      var sv = source[k];
      if (sv === undefined || sv === null) return;
      if (
        Object.prototype.hasOwnProperty.call(target, k) &&
        target[k] && typeof target[k] === 'object' && !Array.isArray(target[k]) &&
        typeof sv === 'object' && !Array.isArray(sv)
      ) {
        out[k] = mergeObject(target[k], sv);
      } else {
        out[k] = sv;
      }
    });
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 키 계산                                                              */
  /* ------------------------------------------------------------------ */

  /** 팀 코드를 저장 키에 넣어도 안전한 글자로 다듬는다. */
  function safeTeamCode(code) {
    return String(code || '')
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9_-]/g, '')
      .slice(0, 10);
  }

  /** 팀 코드에 해당하는 저장 키 (코드가 없으면 임시 키) */
  function keyFor(code) {
    var safe = safeTeamCode(code);
    if (!safe) return C.STATE_KEY || 'lesson3_8_4_team_state';
    return (C.STORAGE_PREFIX || 'lesson3_8_4_team_') + safe;
  }

  state.safeTeamCode = safeTeamCode;
  state.keyFor = keyFor;

  /* ------------------------------------------------------------------ */
  /* 현재 상태                                                            */
  /* ------------------------------------------------------------------ */

  var data = createEmpty();
  var currentKey = keyFor('');
  var listeners = [];
  var saveTimer = null;
  var lastSavedAt = '';

  state.createEmpty = createEmpty;
  state.normalize = normalize;

  state.get = function () {
    return data;
  };

  state.currentKey = function () {
    return currentKey;
  };

  state.lastSavedAt = function () {
    return lastSavedAt;
  };

  /** 상태가 바뀔 때마다 부를 함수를 등록한다. */
  state.onChange = function (fn) {
    if (typeof fn === 'function') listeners.push(fn);
  };

  function notify(reason) {
    listeners.forEach(function (fn) {
      try {
        fn(data, reason);
      } catch (err) {
        /* 한 청취자의 오류가 다른 곳을 막지 않게 한다 */
      }
    });
  }

  /**
   * 상태를 고치고 저장을 예약한다.
   *   L.state.update(function (d) { d.teamName = '그린코더'; })
   *   options.immediate = true  → 기다리지 않고 바로 저장 (실행 직전·성공 직후)
   *   options.delay            → 지연 시간 직접 지정 (코드 편집은 1000ms)
   */
  state.update = function (mutator, options) {
    var o = options || {};
    if (typeof mutator === 'function') mutator(data);
    data.updatedAt = new Date().toISOString();

    if (o.immediate) {
      state.saveNow();
    } else {
      scheduleSave(o.delay === undefined ? (C.SAVE_DELAY_MS || 500) : o.delay);
    }
    notify(o.reason || 'update');
    return data;
  };

  function scheduleSave(delay) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      state.saveNow();
    }, delay);
  }

  /** 지금 즉시 저장한다. 성공 여부를 돌려준다. */
  state.saveNow = function () {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    // 팀 코드가 생겼으면 저장 키를 옮긴다 (명세 15.3)
    var wanted = keyFor(data.teamCode);
    if (wanted !== currentKey) {
      removeRaw(currentKey);
      currentKey = wanted;
    }
    var ok = writeRaw(currentKey, JSON.stringify(data));
    if (ok) {
      lastSavedAt = new Date().toISOString();
      rememberTeam(data);

    return ok;

  /** 저장된 팀 상태를 불러온다. 없으면 false. */
  state.load = function (teamCode) {

    var raw = readRaw(key);
    if (!raw) return false;
    try {
      data = normalize(JSON.parse(raw));
      currentKey = key;
      notify('load');
      return true;
    } catch (err) {
      return false;
    }

  /** 외부에서 받은 데이터(JSON 파일 불러오기)로 통째로 바꾼다. */
  state.replace = function (raw, options) {

    var o = options || {};
    if (o.save !== false) state.saveNow();
    notify('replace');
    return data;
  };

  /** 새 프로젝트 (명세 15.2 — 확인 모달은 부르는 쪽에서) */
  state.reset = function () {
    data = createEmpty();
    currentKey = keyFor('');
    removeRaw(currentKey);
    notify('reset');
    return data;
  };

  /* ------------------------------------------------------------------ */
  /* 최근 팀 목록 (명세 15.2 · 15.3)                                      */
  /* ------------------------------------------------------------------ */

  state.recentTeams = function () {
    try {
      var raw = readRaw(C.RECENT_KEY || 'lesson3_8_4_recent_teams');

      return Array.isArray(list) ? list : [];
    } catch (err) {
      return [];
    }
  };

  function rememberTeam(d) {

      return item && item.teamCode !== code;

    list.unshift({

      teamName: d.teamName || '',
      topic: (d.topic && d.topic.title) || '',

      savedAt: new Date().toISOString()

    var max = C.MAX_RECENT_TEAMS || 10;
    if (list.length > max) {
      // 넘치는 팀의 상태 자체는 지우지 않는다. 목록에서만 뺀다.
      list = list.slice(0, max);

    writeRaw(C.RECENT_KEY || 'lesson3_8_4_recent_teams', JSON.stringify(list));
  }

  /** 이어서 하기 안내에 쓸 마지막 기록 (팀 코드 없이 저장된 임시 상태 포함) */
  state.lastSession = function () {
    var recent = state.recentTeams();
    if (recent.length > 0) {
      var top = recent[0];
      var raw = readRaw(keyFor(top.teamCode));
      if (raw) {
        try {
          return { key: keyFor(top.teamCode), data: normalize(JSON.parse(raw)) };
        } catch (err) {
          /* 다음 후보로 */
        }
      }
    }
    var tmp = readRaw(C.STATE_KEY || 'lesson3_8_4_team_state');
    if (tmp) {
      try {
        return { key: C.STATE_KEY, data: normalize(JSON.parse(tmp)) };
      } catch (err) {
        return null;
      }
    }
    return null;
  };

  /* ------------------------------------------------------------------ */
  /* 코드 버전 기록 (명세 12.4)                                           */
  /* ------------------------------------------------------------------ */

  function versionsKey() {
    var code = safeTeamCode(data.teamCode);
    return (C.VERSIONS_KEY || 'lesson3_8_4_versions') + (code ? '_' + code : '');
  }

  state.versions = function () {
    try {
      var raw = readRaw(versionsKey());
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (err) {
      return [];
    }
  };

  /**
   * 버전 하나를 저장한다. 최근 것이 앞에 오고 최대 10개만 남는다.
   *   { code, summary, author, reviewers, succeeded, stdout }
   */
  state.saveVersion = function (entry) {
    var e = entry || {};
    var list = state.versions();
    var next = {
      no: (list.length > 0 ? (list[0].no || 0) : 0) + 1,
      savedAt: new Date().toISOString(),
      code: String(e.code === undefined ? data.code : e.code),
      summary: String(e.summary || ''),
      author: String(e.author || ''),
      reviewers: Array.isArray(e.reviewers) ? e.reviewers : [],
      succeeded: e.succeeded === true,
      stdout: String(e.stdout || '').slice(0, 500)
    };
    list.unshift(next);
    var max = C.MAX_VERSIONS || 10;
    if (list.length > max) list = list.slice(0, max);
    writeRaw(versionsKey(), JSON.stringify(list));
    notify('version');
    return next;
  };

  state.clearVersions = function () {
    removeRaw(versionsKey());
    notify('version');
  };

  /* ------------------------------------------------------------------ */
  /* 제출 주소 (명세 15.1)                                                */
  /* ------------------------------------------------------------------ */

  state.getEndpoint = function () {
    var saved = readRaw(C.ENDPOINT_KEY || 'lesson3_8_4_endpoint');
    return saved || C.SUBMIT_URL || '';
  };

  state.setEndpoint = function (url) {
    var clean = String(url || '').trim();
    if (clean) writeRaw(C.ENDPOINT_KEY || 'lesson3_8_4_endpoint', clean);
    else removeRaw(C.ENDPOINT_KEY || 'lesson3_8_4_endpoint');
    return clean;
  };

  /* ------------------------------------------------------------------ */
  /* 제출 JSON 만들기 (명세 16장)                                         */
  /* ------------------------------------------------------------------ */

  /** 역할 id 를 사람이 읽는 이름으로 */
  function roleName(roleId) {
    var role = L.findRole ? L.findRole(roleId) : null;
    return role ? role.name : '';
  }

  /**
   * 제출용 JSON 을 만든다.
   * 버전 전체는 넣지 않고 최종 코드와 핵심 수정 기록만 넣는다(명세 17.2).
   */
  state.toSubmission = function () {
    var d = data;
    var maxCode = C.MAX_CODE_LENGTH || 30000;
    var maxOut = C.MAX_STDOUT || 10000;

    return {
      lesson: d.lesson || 'lesson3_8_4',
      lessonTitle: d.lessonTitle || (C.LESSON_TITLE || ''),
      teamCode: safeTeamCode(d.teamCode),
      teamName: String(d.teamName || '').trim(),
      motto: String(d.motto || '').trim(),
      members: d.members
        .filter(function (m) {
          return m.studentId || m.name;
        })
        .map(function (m) {
          return {
            studentId: String(m.studentId || '').trim(),
            name: String(m.name || '').trim(),
            role: roleName(m.role)
          };
        }),
      topic: {
        type: d.topic.type ? (L.findTopic ? (L.findTopic(d.topic.type) || {}).name || d.topic.type : d.topic.type) : '',
        title: d.topic.title || '',
        problem: d.topic.problem || '',
        user: d.topic.user || '',
        expectedResult: d.topic.expectedResult || '',
        reason: d.topic.reason || ''
      },
      design: {
        className: d.design.className || '',
        classDescription: d.design.classDescription || '',
        properties: d.design.properties.filter(Boolean),
        methods: d.design.methods.filter(Boolean),
        conditionalMethod: d.design.conditionalMethod || '',
        instances: d.design.instances
          .filter(function (inst) {
            return inst && inst.objectName;
          })
          .map(function (inst) {
            return { objectName: inst.objectName, values: inst.values || {} };
          }),
        expectedOutput: d.design.expectedOutput || ''
      },
      code: String(d.code || '').slice(0, maxCode),
      runtime: {
        engine: 'external-python',
        ranOutside: true,
        lastRunSucceeded: d.runtime.lastRunSucceeded === true,
        recordedAt: d.runtime.recordedAt || '',
        stdout: String(d.runtime.stdout || '').slice(0, maxOut),
        stderr: String(d.runtime.stderr || '').slice(0, maxOut),
        structureChecks: {
          passed: (d.runtime.structureChecks && d.runtime.structureChecks.passed) || 0,
          total: (d.runtime.structureChecks && d.runtime.structureChecks.total) || (C.STRUCTURE_TOTAL || 9),
          details: ((d.runtime.structureChecks && d.runtime.structureChecks.details) || []).map(
            function (item) {
              return { id: item.id, label: item.label, ok: item.ok === true };
            }
          )
        }
      },
      tests: (d.tests || []).slice(0, C.MAX_TESTS || 10).map(function (t) {
        return {
          name: t.name || '',
          setup: t.setup || '',
          call: t.call || '',
          expected: t.expected || '',
          actual: String(t.actual || '').slice(0, 2000),
          passedByTeam: t.passedByTeam === true
        };
      }),
      improvements: (d.improvements || []).map(function (imp) {
        return {
          problem: imp.problem || '',
          message: imp.message || '',
          cause: imp.cause || '',
          change: imp.change || '',
          result: imp.result || '',
          members: Array.isArray(imp.members) ? imp.members : []
        };
      }),
      codeLogs: (d.codeLogs || []).slice(-10),
      collaboration: {
        agreements: (d.agreements || []).concat(d.agreementCustom ? [d.agreementCustom] : []),
        roleSwap: d.roleSwap && d.roleSwap.reason ? d.roleSwap : null,
        contributions: d.members
          .filter(function (m) {
            return m.name || m.studentId;
          })
          .map(function (m) {
            return {
              studentId: m.studentId,
              name: m.name,
              role: roleName(m.role),
              kinds: m.contributions || [],
              note: m.contributionNote || ''
            };
          }),
        designChecks: d.designChecks || [],
        // 자리번호로 나뉜 기록을 «팀원 이름이 붙은 목록» 으로 바꾸어 보낸다 (교사용에서 읽기 쉽게)
        mutualChecks: d.members.map(function (m, index) {
          var mine = (d.mutualChecks || {})[index] || {};
          return {
            studentId: m.studentId,
            name: m.name,
            topic: mine.topic === true,
            code: mine.code === true,
            run: mine.run === true,
            contribution: mine.contribution === true
          };
        }).filter(function (row) {
          return row.name || row.studentId;
        }),
        individualReflections: d.members.map(function (m, index) {
          var ref = (d.reflections || {})[index] || {};
          var rec = (d.contributionRecords || {})[index] || {};
          return {
            studentId: m.studentId,
            name: m.name,
            role: roleName(m.role),
            myRole: rec.role || '',
            did: rec.did || '',
            understood: rec.understood || '',
            nextTime: rec.next || '',
            personal: ref.personal || '',
            suggestion: ref.suggestion || ''
          };
        }).filter(function (row) {
          return row.name || row.studentId;
        })
      },
      explanation: d.explanation || {},
      presentation: d.presentation || '',
      example: d.example || {},
      submittedAtClient: L.ui && L.ui.isoWithOffset ? L.ui.isoWithOffset() : new Date().toISOString()
    };
  };

  /* ------------------------------------------------------------------ */
  /* 테스트용 내보내기 (node)                                             */
  /* ------------------------------------------------------------------ */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = state;

(function () {

  /* ------------------------------------------------------------------ */
  /* 예시에 쓰는 자료                                                     */

  /** PDF 예시 식단 (앞 네 글자가 mmdd 날짜) */
  var SAMPLE_MENU = [
    '0601 기장밥 미니고기국수 돈육강정 잡채어묵볶음 배추겉절이',

  /** 명세 4장 페이지 3 — 브라우저 실행용 급식 조회 코드 (파일·input 없음) */
  var BROWSER_CODE = [

    "    '0602 현미밥 된장국 닭갈비 계란찜 깍두기',",

  /** 알고리즘 카드 배열 활동을 그린다. */
  function renderAlgorithmSort(board, feedback) {
    function order() {
      return (ex().p2Order || []).slice();
    }

    function setOrder(next) {
      saveExample(function (e) {
        e.p2Order = next;
      });
      paint();
    }

    var pool = el('div', { 'class': 'cardsort__pool' });
    var slots = el('ol', { 'class': 'cardsort__slots' });
    board.appendChild(
      el('div', { 'class': 'cardsort__col' }, [
        el('h4', { 'class': 'cardsort__title', text: '카드 (누르면 순서표로 들어간다)' }),
        pool
      ])
    );
    board.appendChild(
      el('div', { 'class': 'cardsort__col' }, [
        el('h4', { 'class': 'cardsort__title', text: '알고리즘 순서표' }),
        slots
      ])
    );

    function cardById(id) {
      for (var i = 0; i < ALGORITHM_CARDS.length; i += 1) {
        if (ALGORITHM_CARDS[i].id === id) return ALGORITHM_CARDS[i];
      }
      return null;
    }

    function paint() {
      var placed = order();
      ui.clear(pool);
      ui.clear(slots);

      // 아직 놓지 않은 카드 (원래 순서를 그대로 보여 주면 답이 되므로 고정된 섞음 순서를 쓴다)
      var shuffled = ['a3', 'a1', 'a4', 'a2'];
      var remain = shuffled.filter(function (id) {
        return placed.indexOf(id) < 0;
      });

      if (remain.length === 0) {
        pool.appendChild(el('p', { 'class': 'cardsort__empty', text: '카드를 모두 놓았어요.' }));
      }
      remain.forEach(function (id) {
        var card = cardById(id);
        pool.appendChild(
          el('button', {
            type: 'button',
            'class': 'sortcard',
            text: card.text,
            attrs: { 'aria-label': '순서표에 넣기: ' + card.text },
            on: {
              click: function () {
                setOrder(order().concat([id]));
              }
            }
          })
        );
      });

      for (var i = 0; i < ALGORITHM_CARDS.length; i += 1) {
        var id = placed[i];
        var card = id ? cardById(id) : null;
        var right = card && card.order === i + 1;
        slots.appendChild(
          el(
            'li',
            {
              'class':
                'cardsort__slot' +
                (card ? ' is-filled' : '') +
                (card ? (right ? ' is-right' : ' is-wrong') : '')
            },
            [
              el('span', { 'class': 'cardsort__no', text: String(i + 1) }),
              card
                ? el('button', {
                    type: 'button',
                    'class': 'cardsort__card',
                    text: card.text,

  /**
   * 이진 탐색 단계 시각화 (명세 4장 페이지 3 · 8.2)
   * 정렬된 날짜 카드 위에서 left · mid · right 와 버리는 범위, 탐색 횟수를 보여 준다.
   */
  function renderBinaryVisual() {
    var dates = ['0601', '0602', '0603', '0605', '0608', '0609', '0610'];
    var target = '0609';
    var stepIndex = 0;

    /** 미리 계산해 둔 단계들 */
    function buildSteps(day) {
      var steps = [];
      var left = 0;
      var right = dates.length - 1;
      var count = 0;
      while (left <= right) {
        var mid = Math.floor((left + right) / 2);
        count += 1;
        var current = dates[mid];
        var move;
        if (current === day) move = 'found';
        else if (current < day) move = 'right';
        else move = 'left';
        steps.push({ left: left, right: right, mid: mid, count: count, move: move, current: current });
        if (move === 'found') break;
        if (move === 'right') left = mid + 1;
        else right = mid - 1;
      }
      if (steps.length === 0 || steps[steps.length - 1].move !== 'found') {
        steps.push({ left: left, right: right, mid: -1, count: count, move: 'none', current: '' });
      }
      return steps;
    }

    var steps = buildSteps(target);

    var cards = el('div', { 'class': 'bsearch__cards' });
    var info = el('div', { 'class': 'bsearch__info' });
    var controls = el('div', { 'class': 'btn-row' });

    function paint() {
      var s = steps[stepIndex];
      ui.clear(cards);
      dates.forEach(function (date, i) {
        var out = i < s.left || i > s.right;
        var tags = [];
        if (i === s.left) tags.push('left');
        if (i === s.mid) tags.push('mid');
        if (i === s.right) tags.push('right');
        cards.appendChild(
          el(
            'div',
            {
              'class':
                'bsearch__card' +
                (out ? ' is-out' : '') +
                (i === s.mid ? ' is-mid' : '') +
                (s.move === 'found' && i === s.mid ? ' is-found' : '')
            },
            [
              el('span', { 'class': 'bsearch__index', text: '[' + i + ']' }),
              el('span', { 'class': 'bsearch__date', text: date }),
              el('span', { 'class': 'bsearch__tags', text: tags.join(' · ') }),
              out ? el('span', { 'class': 'bsearch__out', text: '버림' }) : null
            ]
          )
        );
      });

      ui.clear(info);

      // 마지막 단계의 횟수가 곧 «다 찾는 데 걸린 횟수» 다.
      var lastStep = steps[steps.length - 1];
      var totalCount = lastStep.count;

      // ① 몇 단계 중 몇 번째인지 — 지금 숫자가 «중간 경과» 임을 분명히 한다
      info.appendChild(
        el('p', { 'class': 'bsearch__step' }, [
          el('span', {
            'class': 'bsearch__step-no',
            text: '단계 ' + (stepIndex + 1) + ' / ' + steps.length
          }),
          el('span', {
            'class': 'bsearch__step-count',
            text:
              stepIndex + 1 < steps.length
                ? '여기까지 비교 ' + s.count + '회 (아직 진행 중)'
                : '비교 ' + s.count + '회로 끝'
          })
        ])
      );

      var lines = [
        'left = ' + s.left + ' · mid = ' + (s.mid < 0 ? '없음' : s.mid) + ' · right = ' + s.right
      ];
      if (s.move === 'found') {
        lines.push("menu[mid][:4] == day → '" + s.current + "' 를 찾았다. break 로 반복을 멈춘다.");
      } else if (s.move === 'right') {
        lines.push("menu[mid][:4] < day → '" + s.current + "' 는 너무 작다. left = mid + 1 (왼쪽 절반을 버린다)");
      } else if (s.move === 'left') {
        lines.push("menu[mid][:4] > day → '" + s.current + "' 는 너무 크다. right = mid - 1 (오른쪽 절반을 버린다)");
      } else {
        lines.push('left > right 가 되어 반복이 끝났다. find 는 False 그대로다.');
      }
      lines.forEach(function (line) {
        info.appendChild(el('p', { 'class': 'bsearch__line', text: line }));
      });

      // ② 마지막 단계에서는 «모두 몇 회였는지» 를 결론으로 적는다
      if (stepIndex + 1 === steps.length) {
        info.appendChild(
          el('p', {
            'class': 'bsearch__total',
            text:
              lastStep.move === 'found'
                ? "'" + target + "' 은(는) 모두 " + totalCount + '회 비교해서 찾았다.'
                : "'" + target + "' 은(는) " + totalCount + '회 비교했지만 찾지 못했다.'
          })
        );
      }

    <script data-from="js/40-team.js">
/**
 * 페이지 5 — 팀 구성과 주제 결정 (명세 6장 · 9장 · 5장)
 *
 * 여기서 정하는 것
 *   팀명 · 팀 코드 · 팀원 4명 · 네 역할 · 주제 · 문제 정의 · 협력 약속
 *
 * 역할은 «일을 나누기» 위한 것이 아니라 «첫 책임자» 를 정하는 것이다(명세 1.5 · 6.2).
 * 그래서 역할 담당자만 그 영역을 고칠 수 있게 잠그지 않는다(명세 6.3).
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var team = L.team || (L.team = {});
  var C = L.CONST || {};

  /* ================================================================== */
  /* 검사 함수 (화면 없이도 확인할 수 있게 순수 함수로 둔다)               */
  /* ================================================================== */

  /**
   * 팀 정보 검사 (명세 6.1 · 6.3 · 9.2 · 26.1)
   *   { ok, problems:[문장], filled:몇 명 채웠는지 }
   */
  team.validateTeam = function (data, options) {
    var o = options || {};
    var d = data || {};
    var problems = [];
    var members = Array.isArray(d.members) ? d.members : [];
    var need = o.teamSize || C.TEAM_SIZE || 4;
    var min = o.allowThree ? (C.MIN_TEAM_SIZE || 3) : need;

    var name = String(d.teamName || '').trim();
    if (name.length < 2 || name.length > 20) {
      problems.push('팀명은 2~20자로 입력해 주세요.');
    }
    var code = String(d.teamCode || '').trim();
    if (code.length < 1 || code.length > 10) {
      problems.push('팀 코드를 1~10자로 입력해 주세요. (예: C01)');
    }

    var filled = members.filter(function (m) {
      return String(m.studentId || '').trim() && String(m.name || '').trim();
    });
    if (filled.length < min) {
      problems.push('팀원 ' + min + '명의 학번과 이름을 모두 입력해 주세요. (지금 ' + filled.length + '명)');
    }

    // 학번 중복 검사 (명세 6.1)
    var seen = {};
    var duplicated = [];
    filled.forEach(function (m) {
      var id = String(m.studentId).trim();
      if (seen[id]) {
        if (duplicated.indexOf(id) < 0) duplicated.push(id);
      }
      seen[id] = true;
    });
    if (duplicated.length > 0) {
      problems.push('학번이 겹칩니다 : ' + duplicated.join(', '));
    }

    // 역할 배정 검사 (명세 6.3)
    var roles = (C.ROLES || []).map(function (r) {
      return r.id;
    });
    var used = {};
    var noRole = 0;
    var doubled = [];
    filled.forEach(function (m) {
      var role = String(m.role || '');
      if (!role) {
        noRole += 1;
        return;
      }
      if (used[role]) doubled.push(role);
      used[role] = true;
    });
    if (noRole > 0) problems.push('역할을 정하지 않은 팀원이 ' + noRole + '명 있어요.');

    var missing = roles.filter(function (r) {
      return !used[r];
    });
    // 3명 팀은 한 학생이 두 역할을 맡을 수 있으므로 «네 역할이 모두 채워졌는지» 만 본다(명세 3장).
    if (missing.length > 0) {
      var names = missing.map(function (id) {
        var role = L.findRole ? L.findRole(id) : null;
        return role ? role.name : id;
      });
      problems.push('아직 맡을 사람이 없는 역할 : ' + names.join(', '));
    }
    if (doubled.length > 0 && filled.length >= need) {
      problems.push('같은 역할을 두 사람이 맡았어요. 네 역할을 하나씩 나눠 주세요.');
    }

    return { ok: problems.length === 0, problems: problems, filled: filled.length };
  };

  /** 주제·문제 정의 검사 (명세 9.3) */
  team.validateTopic = function (data) {
    var d = (data && data.topic) || {};
    var problems = [];
    if (!d.type) problems.push('주제 카드를 하나 고르거나 자유 주제를 선택해 주세요.');
    if (String(d.title || '').trim().length < 2) problems.push('주제명을 입력해 주세요.');
    if (String(d.problem || '').trim().length < 10) {
      problems.push('해결할 문제를 10자 이상으로 적어 주세요.');
    }
    if (String(d.user || '').trim().length < 2) problems.push('프로그램 사용자를 적어 주세요.');
    if (String(d.expectedResult || '').trim().length < 5) {
      problems.push('기대하는 결과를 적어 주세요.');
    }
    if (String(d.reason || '').trim().length < 5) problems.push('선택 이유를 적어 주세요.');
    return { ok: problems.length === 0, problems: problems };
  };

  /** 협력 약속 검사 (명세 9.4 — 세 가지 이상) */
  team.validateAgreements = function (data) {
    var d = data || {};
    var picked = (d.agreements || []).length + (String(d.agreementCustom || '').trim() ? 1 : 0);
    if (picked < 3) {
      return { ok: false, problems: ['협력 약속을 세 가지 이상 골라 주세요. (지금 ' + picked + '개)'] };
    }
    return { ok: true, problems: [] };
  };

  /* ================================================================== */
  /* 화면                                                                */
  /* ================================================================== */

  if (typeof document === 'undefined' || !L.registerPage) {
    if (typeof module !== 'undefined' && module.exports) module.exports = team;
    return;
  }

  var ui = L.ui;
  var el = ui.el;

  function d() {
    return L.state.get();
  }

  function save(mutator) {
    L.state.update(mutator);
    L.nav.refresh();
  }

  L.registerPage(5, {
    render: function (container) {
      container.appendChild(
        ui.pageHeader({

          { key: 'reason', label: '이 주제를 고른 이유', placeholder: '예) 두 화분의 상태를 한 구조로 관리할 수 있다.', rows: 2 }
        ];
        fields.forEach(function (f) {
          var field =
            f.rows > 1
              ? ui.textAreaField({
                  label: f.label,
                  rows: f.rows,
                  value: d().topic[f.key],
                  placeholder: f.placeholder,
                  onInput: function (v) {
                    save(function (s) {
                      s.topic[f.key] = v;

                })
              : ui.textField({
                  label: f.label,
                  value: d().topic[f.key],
                  placeholder: f.placeholder,
                  width: '100%',
                  align: 'left',
                  onInput: function (v) {
                    save(function (s) {
                      s.topic[f.key] = v;

                    paintTopicFeedback();

          topicFields.appendChild(field.root);

        topicFields.appendChild(ui.sectionTitle('팀 대화', '주제를 고르기 전에 다섯 질문에 답해 본다'));
        topicFields.appendChild(
          el(
            'ol',
            { 'class': 'qlist' },
            [
              '우리가 해결하려는 생활 문제는 무엇인가?',
              '왜 이 문제를 클래스로 표현하면 좋은가?',
              '어떤 실제 대상을 객체로 만들 것인가?',
              '두 인스턴스는 무엇이 서로 다른가?',
              '어떤 조건에서 메소드의 결과가 달라지는가?'
            ].map(function (q) {
              return el('li', { text: q });
            })
          )

        topicFields.appendChild(topicFeedback.root);
        paintTopicFeedback();
      }

      var topicFeedback = ui.createFeedback({});
      function paintTopicFeedback() {
        var result = team.validateTopic(d());
        if (result.ok) topicFeedback.show('success', '주제와 문제 정의가 준비되었어요.');
        else topicFeedback.show('info', result.problems.map(ui.escapeHtml).join('<br>'));
      }
      paintTopicFields();
      container.appendChild(topicPanel.root);

      /* ---------------- 협력 약속 ---------------- */
      var promise = ui.panel({
        title: '④ 협력 약속',
        hint: '세 가지 이상 고른다. 팀이 만든 약속을 하나 더 추가할 수 있다.'
      });
      var agreeGroup = ui.checkboxGroup({
        ariaLabel: '협력 약속',
        values: d().agreements,
        options: (C.AGREEMENTS || []).map(function (a) {
          return { value: a, label: a };
        }),
        onChange: function (values) {
          save(function (s) {
            s.agreements = values;
          });
          paintPromise();
        }
      });
      promise.body.appendChild(agreeGroup.root);
      promise.body.appendChild(
        ui.textField({
          label: '우리 팀이 만든 약속 (선택)',
          value: d().agreementCustom,
          width: '100%',
          align: 'left',
          onInput: function (v) {
            save(function (s) {
              s.agreementCustom = v;
            });
            paintPromise();
          }
        }).root
      );
      var promiseFeedback = ui.createFeedback({});
      promise.body.appendChild(promiseFeedback.root);
      function paintPromise() {
        var result = team.validateAgreements(d());
        if (result.ok) promiseFeedback.show('success', '협력 약속을 정했어요. 잊지 말고 지키자.');
        else promiseFeedback.show('info', result.problems.join('<br>'));
      }
      paintPromise();
      container.appendChild(promise.root);
    },

    check: function () {
      var t = team.validateTeam(d());
      if (!t.ok) return { ok: false, hint: t.problems[0] };
      var topic = team.validateTopic(d());
      if (!topic.ok) return { ok: false, hint: topic.problems[0] };
      var agree = team.validateAgreements(d());
      if (!agree.ok) return { ok: false, hint: agree.problems[0] };
      return { ok: true, hint: '' };
    }
  });

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = team;
  }
})();
