    <!-- 스타일은 나열한 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다.
         tokens·common·print 는 1~3차시에서 이어받은 부품,

    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색상 · 글꼴 · 간격 토큰 (명세 20.1 : 1·2차시와 같은 디자인 체계)
 * 2차시(lesson3_8_2/src/styles/tokens.css)와 같은 내용이다.
 * ------------------------------------------------------------------ */

/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 공통 부품 (명세 20.1 · 24장)
 *
 * 1·2차시에서 검증된 부품 스타일을 그대로 이어받았다. 학생용과 교사용이
 * 같은 부품(패널 · 버튼 · 코드 뷰 · 표 · 문항 카드 · 점수 카드)을 쓰므로
 * 두 화면이 이 파일 하나를 함께 읽는다.
 *
 * 이 차시에서 «새로 만든» 부품은 styles/student.css 에 둔다.
 * ------------------------------------------------------------------ */

/* ===== base.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}


/* ===== components.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 15px;
  cursor: pointer;
}

.select:hover {
  border-color: var(--color-primary);
}

.select.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.select.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.textarea {
  width: 100%;
  min-height: 96px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  resize: vertical;
}

.textarea--code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  min-height: 150px;
  white-space: pre;
  overflow-wrap: normal;
  overflow-x: auto;
  tab-size: 4;
}

.textarea:hover {
  border-color: var(--color-primary);
}

.char-count {
  font-size: 12px;
  color: var(--color-text-sub);
  text-align: right;
}

/* 프리셋 값 칩 */
.chip {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.chip:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.chip.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

/* 라디오 카드 (True/False 선택 등) */
.choice-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choice {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.choice:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.choice input {
  width: 20px;
  height: 20px;
  accent-color: var(--color-primary);
  cursor: pointer;
  flex: 0 0 auto;
}

.choice__body {
  display: flex;
  flex-direction: column;
}

.choice__label {
  font-weight: 700;
}

.choice__sub {
  font-size: 13px;
  color: var(--color-text-sub);
}

.choice.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.choice--true.is-selected {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.choice--false.is-selected {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

/* 탭 */
.tabs {
  display: inline-flex;
  padding: 4px;
  gap: 4px;
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

/* 11.5 : 터치 대상 최소 44 × 44 px */
.tab {
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text-sub);
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.tab.is-active {
  background: var(--color-surface);
  color: var(--color-primary-dark);
  box-shadow: var(--shadow-sm);
}

/* ------------------------- 출력 창 (콘솔) ------------------------- */
.console {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.console__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.console__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.console__body {
  min-height: 132px;
  max-height: 320px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.75;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.console__line {
  display: flex;
  gap: 8px;
  animation: console-in var(--dur-highlight) ease;
}

@keyframes console-in {
  from {
    opacity: 0;
    transform: translateX(-4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.console__prompt {
  flex: 0 0 auto;
  color: #38bdf8;
  user-select: none;
}

.console__text {
  flex: 1 1 auto;
}

.console__line--error .console__text {
  color: var(--color-error-on-dark);
}

.console__line--hint .console__text {
  color: var(--color-hint-on-dark);
}

.console__line--muted .console__text {
  color: #94a3b8;
}

.console__empty {
  color: #64748b;
  font-style: normal;
}

/* --------------------------- 피드백 영역 --------------------------- */
.feedback {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-surface);
  font-size: 15px;
  min-height: 56px;
  align-items: flex-start;
}

.feedback__icon {
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1.5;
}

.feedback__text {
  flex: 1 1 auto;
}

.feedback__text strong {
  font-weight: 800;
}

.feedback.is-empty {
  color: var(--color-text-sub);
  border-left-color: var(--color-border-strong);
  background: var(--color-muted-bg);
}

.feedback--success {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}

.feedback--success .feedback__text strong {
  color: var(--color-true-dark);
}

.feedback--info {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.feedback--info .feedback__text strong {
  color: var(--color-primary-dark);
}

.feedback--warning {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}

.feedback--warning .feedback__text strong {
  color: var(--color-false-dark);
}

.feedback--error {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.feedback--error .feedback__text strong {
  color: var(--color-error);
}

/* ---------------------------- 배지 · 콜아웃 ---------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.badge--true {
  border-color: var(--color-true);
  color: var(--color-true-dark);
  background: var(--color-true-soft);
}

.badge--false {
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.badge--primary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
}

.callout {
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px dashed var(--color-primary);
  font-size: 15px;
}

.callout--muted {
  background: var(--color-muted-bg);
  border-color: var(--color-border-strong);
  color: var(--color-text-sub);
}

/* ------------------------------ 표 ------------------------------ */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-small);
  background: var(--color-surface);
  overflow: hidden;
  border-radius: var(--radius);
}

.data-table th,
.data-table td {
  border: 1px solid var(--color-border);
  padding: var(--space-2) var(--space-3);
  text-align: left;
  vertical-align: top;
}

.data-table thead th {
  background: var(--color-muted-bg);
  font-weight: 700;
}

.table-scroll {
  overflow-x: auto;
}

/* ---------------------------- 토스트 ---------------------------- */
.toast-region {
  position: fixed;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  pointer-events: none;
}

.toast {
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  background: rgba(31, 41, 55, 0.95);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  animation: toast-in var(--dur-highlight) ease;
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ---------------------------- 모달 ---------------------------- */
.modal {
  border: none;
  padding: 0;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: min(440px, calc(100vw - 32px));
  color: var(--color-text);
}

.modal::backdrop {
  background: rgba(15, 23, 42, 0.45);
}

.modal__body {
  padding: var(--space-5);
}

.modal__title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.modal__text {
  color: var(--color-text-sub);
  font-size: 15px;
}

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-5);
}

/* --------------------------- 툴팁 --------------------------- */
.has-tip {
  position: relative;
  cursor: help;
  border-bottom: 1px dotted var(--color-text-sub);
}

.has-tip::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  background: rgba(31, 41, 55, 0.96);
  color: #fff;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-highlight) ease;
  z-index: 20;
}

.has-tip:hover::after,
.has-tip:focus-visible::after,
.has-tip.is-tip-open::after {
  opacity: 1;
}


/* ===== code.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 코드 뷰 (명세 3.3 들여쓰기 시각화 / 7.2 / 8.2 / 13장 오류 표시)
 * ------------------------------------------------------------------ */
.codeview {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  overflow: hidden;
}

.codeview__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #e2e8f0;
  border-bottom: 1px solid var(--color-border);
  font-size: 13px;
  font-weight: 700;
  color: #334155;
}

.codeview__title {
  font-weight: 700;
  color: #334155;
}

/* 11.5 : 코드는 줄바꿈하지 않고 컨테이너만 가로 스크롤 */
.codeview__scroll {
  overflow-x: auto;
  overflow-y: hidden;
}

.codeview__lines {
  display: flex;
  flex-direction: column;
  padding: var(--space-3) 0;
  min-width: max-content;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.9;
  tab-size: 4;
}

/* 블록 박스 : if / else 블록을 연한 배경으로 감싼다 */
.code-group {
  position: relative;
  margin: 2px var(--space-3);
  padding: 2px 0;
  border-radius: var(--radius-sm);
}

.code-group--true {
  background: var(--color-true-soft);
  box-shadow: inset 3px 0 0 var(--color-true);
}

.code-group--false {
  background: var(--color-false-soft);
  box-shadow: inset 3px 0 0 var(--color-false);
}

.code-group--none {
  background: transparent;
}

.code-group__note {
  display: inline-block;
  margin-left: var(--space-2);
  padding: 0 6px;
  border-radius: 4px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.code-group--true .code-group__note {
  color: var(--color-true-dark);
  background: rgba(5, 150, 105, 0.12);
}

.code-group--false .code-group__note {
  color: var(--color-false-dark);
  background: rgba(217, 119, 6, 0.12);
}

.code-line {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 1px var(--space-3);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease,
    opacity var(--dur-highlight) ease;
  white-space: pre;
}

.code-group .code-line {
  padding-left: var(--space-2);
}

.code-line__num {
  flex: 0 0 auto;
  width: 1.6em;
  text-align: right;
  color: #94a3b8;
  font-size: 13px;
  user-select: none;
}

.code-line__marker {
  flex: 0 0 auto;
  width: 1.1em;
  text-align: center;
  font-size: 12px;
  color: transparent;
  user-select: none;
}

.code-line__code {
  flex: 1 1 auto;
  white-space: pre;
}

/* 실행 상태 (6.2.3 / 8.3) — 현재 실행 중인 줄은 굵은 테두리 + 강조 배경 + ▶ 마커 */
.code-line.is-running {
  background: #fef9c3;
  border-color: #eab308;
  border-width: 3px;
  padding: 0 calc(var(--space-3) - 1px);
  font-weight: 700;
}

.code-group .code-line.is-running {
  padding-left: calc(var(--space-2) - 1px);
}

.code-line.is-running .code-line__marker {
  color: #a16207;
}

.code-line.is-done {
  background: rgba(5, 150, 105, 0.08);
}

.code-line.is-done .code-line__marker {
  color: var(--color-true);
}

.code-line.is-skipped {
  opacity: 0.4;
}

.code-line.is-skipped .code-line__marker {
  color: var(--color-text-sub);
}

.code-line.is-error {
  background: var(--color-error-soft);
  border-color: var(--color-error);
}

.code-line.is-error .code-line__marker {
  color: var(--color-error);
}

.code-line__badge {
  flex: 0 0 auto;
  margin-left: var(--space-2);
  animation: badge-pop var(--dur-highlight) ease;
  font-family: var(--font-sans);
}

@keyframes badge-pop {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* 들여쓰기 가이드선 (명세 3.3) */
.indent {
  display: inline-block;
  width: 4ch;
  border-left: 1px dashed var(--color-indent-guide);
  vertical-align: baseline;
}

.indent--first {
  border-left-style: solid;
  border-left-color: var(--color-primary);
}

.indent-note {
  display: inline-flex;
  align-items: center;
  margin-left: var(--space-2);
  padding: 0 6px;
  border-radius: 4px;
  background: rgba(37, 99, 235, 0.1);
  color: var(--color-primary-dark);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

/* 정규식 기반 토큰 색칠 (명세 16장: 외부 라이브러리 없이 자체 구현) */
.tok-kw {
  color: #7c3aed;
  font-weight: 700;
}

.tok-fn {
  color: #0369a1;
}

.tok-str {
  color: #b45309;
}

.tok-num {
  color: #be123c;
}

.tok-op {
  color: #475569;
}

.tok-colon {
  color: #dc2626;
  font-weight: 800;
  background: rgba(220, 38, 38, 0.1);
  border-radius: 3px;
  padding: 0 2px;
}

.tok-comment {
  color: #64748b;
  font-style: italic;
}

.tok-ph {
  color: #334155;
}

/* 명령 목록(생활 예시) — 코드가 아닌 문장 명령의 3상태 표시 */
.cmd-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cmd-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.cmd-item__marker {
  flex: 0 0 auto;
  width: 1.4em;
  text-align: center;
  color: transparent;
  font-weight: 800;
}

.cmd-item__order {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-border);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}

.cmd-item__text {
  flex: 1 1 auto;
}

/* 6.2.3 '실행 중' : 굵은 테두리 + 강조 배경 + ▶ 마커 (두께 변화로 줄이 밀리지 않게 여백 보정) */
.cmd-item.is-running {
  background: #fef9c3;
  border-color: #eab308;
  border-width: 3px;
  padding: calc(var(--space-2) - 1px) calc(var(--space-3) - 1px);
  color: var(--color-text);
  font-weight: 700;
}

.cmd-item.is-running .cmd-item__marker {
  color: #a16207;
}

.cmd-item.is-running .cmd-item__order {
  background: #eab308;
}

.cmd-item.is-done {
  background: var(--color-true-soft);
  border-color: rgba(5, 150, 105, 0.35);
  color: var(--color-text);
}

.cmd-item.is-done .cmd-item__marker {
  color: var(--color-true);
}

.cmd-item.is-done .cmd-item__order {
  background: var(--color-true);
}


/* ===== steps.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 단계 화면 공통 레이아웃 (화면 1 · 5 · 6 에서 되풀이해 쓰는 조각들)
 *
 * 화면 골격은 이미 앞선 파일에 있으므로 여기서 다시 만들지 않는다.
 *   - .step-screen (화면 전환)            → base.css
 *   - .step-header / .act-head / .stack   → components.css
 *   - .codeview / .code-line              → code.css
 * 이 파일은 그 위에 얹는 「단계 화면 전용」 조각만 담는다.
 * 2차시에서 새로 필요한 활동용 클래스는 lesson.css 에 따로 정의한다.
 * ------------------------------------------------------------------ */

/* ===================== 단계 화면 공통 다듬기 ===================== */

/* 단계를 옮긴 뒤 화면 첫머리로 포커스를 보낼 때, 큰 파란 테두리가 화면을
   가리지 않도록 화면 자체의 외곽선은 지운다(제목에는 그대로 표시된다). */
.step-screen:focus {
  outline: none;
}

/* 활동이 여러 개인 화면에서 활동 사이 간격을 일정하게 유지한다 */
.step-screen .section-title:first-child {
  margin-top: 0;
}

/* 코드·흐름도가 나란히 놓이는 2단 배치에서 자식이 화면을 밀어내지 않게 한다 */
.split > .stack {
  min-width: 0;
}

/* ========================= 화면 1 : 시작 화면 ========================= */
.hero {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}

.hero__title {
  font-size: var(--fs-h1);
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: -0.02em;
}

.hero__subtitle {
  margin-top: var(--space-2);
  font-size: 17px;
  color: var(--color-text-sub);
  font-weight: 600;
}

.hero__note {
  margin-top: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.hero__time {
  margin-top: var(--space-5);
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.hero__cta {
  margin-top: var(--space-4);
}

/* 학습 목표 카드 */
.goal-card {
  margin-top: var(--space-5);
  padding: var(--space-5);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow);
  text-align: left;
}

.goal-card__title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 17px;
  font-weight: 800;
  margin-bottom: var(--space-3);
}

.goal-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.goal-item {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
}

.goal-item__num {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--color-primary);
  color: var(--color-surface);
  font-weight: 800;
  font-size: 14px;
}

.goal-item__text {
  flex: 1 1 auto;
  font-weight: 600;
}

/* 오늘 배울 차례 · 지난 시간 핵심 카드 목록 */
.agenda {
  margin-top: var(--space-5);
  text-align: left;
}

.agenda__title {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text-sub);
  margin-bottom: var(--space-2);
}

.agenda__list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-2);
}

.agenda__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  font-size: var(--fs-small);
  font-weight: 600;
}

.agenda__marker {
  color: var(--color-primary);
  font-weight: 800;
}

/* ===================== 공통 : 선택지 버튼 ===================== */
/* 선수 학습 미니 문항(화면 1)과 형성평가(화면 6)가 같은 모양을 쓴다. */
.options {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.option {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  text-align: left;
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.option:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option__num {
  flex: 0 0 auto;
  font-weight: 800;
  color: var(--color-primary-dark);
}

.option__text {
  flex: 1 1 auto;
}

/* 채점 뒤 정오 표시 — 테두리 모양까지 달라 색만으로 구분하지 않는다 */
.option.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.option.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* 라디오 입력은 감추고 카드 전체를 누를 수 있게 한다 */
.option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* ===================== 공통 : 단계형 힌트 ===================== */
/* 화면 5 자동 채점 피드백(위치 → 힌트 → 부분 정답)이 쌓이는 자리 */
.hint-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.hint-item {
  display: flex;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  border: 1px solid var(--color-false);
  border-left-width: 5px;
  font-size: var(--fs-small);
  animation: screen-fade var(--dur-highlight) ease;
}

.hint-item__num {
  flex: 0 0 auto;
  font-weight: 800;
  color: var(--color-false-dark);
}

/* ===================== 화면 6 : 채점 결과 ===================== */
.score-card {
  text-align: center;
  padding: var(--space-6) var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow);
}

.score-card__title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.score-card__value {
  margin-top: var(--space-2);
  font-size: 46px;
  font-weight: 900;
  line-height: 1.1;
  color: var(--color-primary-dark);
}

.score-card__value small {
  font-size: 20px;
  color: var(--color-text-sub);
  font-weight: 700;
}

.score-card__comment {
  margin-top: var(--space-4);
  font-size: 16px;
  font-weight: 700;
}

.score-dots {
  display: flex;
  justify-content: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.score-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.score-dot.is-correct {
  background: var(--color-true);
  border-color: var(--color-true);
  color: var(--color-surface);
}

/* ===================== 화면 6 : 문항별 해설 ===================== */
.accordion {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accordion__item {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  overflow: hidden;
}

.accordion__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: none;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}

.accordion__head:hover {
  background: var(--color-muted-bg);
}

.accordion__mark {
  flex: 0 0 auto;
  font-weight: 800;
}

.accordion__mark.is-correct {
  color: var(--color-true-dark);
}

.accordion__mark.is-wrong {
  color: var(--color-error);
}

.accordion__title {
  flex: 1 1 auto;
}

.accordion__chevron {
  flex: 0 0 auto;
  transition: transform var(--dur-highlight) ease;
  color: var(--color-text-sub);
}

.accordion__item.is-open .accordion__chevron {
  transform: rotate(180deg);
}

.accordion__body {
  display: none;
  padding: 0 var(--space-3) var(--space-3);
  border-top: 1px dashed var(--color-border);
  font-size: var(--fs-small);
}

.accordion__item.is-open .accordion__body {
  display: block;
}

.accordion__row {
  margin-top: var(--space-2);
}

.accordion__row dt {
  font-weight: 800;
  color: var(--color-text-sub);
  font-size: 12px;
}

.accordion__row dd {
  margin: 2px 0 0;
}

/* ===================== 화면 6 : 학습 정리 ===================== */
.summary-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.summary-item {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.summary-item__num {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--color-primary);
  color: var(--color-surface);
  font-weight: 800;
  font-size: 13px;
}

/* 학생이 직접 쓴 문장을 그대로 되돌려 보여 주는 상자 */
.my-answer {
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px dashed var(--color-border-strong);
  background: var(--color-muted-bg);
  white-space: pre-wrap;
  min-height: 60px;
}

.my-answer.is-empty {
  color: var(--color-text-sub);
}

/* 스스로 점검 · 자신감 선택 줄에서 함께 쓰는 알약 버튼 */
.check-btn {
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.check-btn:hover {
  border-color: var(--color-primary);
}

.check-btn.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: var(--color-surface);
}

/* 다음 차시 안내 */
.next-lesson {
  padding: var(--space-4);
  border-radius: var(--radius);
  background: var(--color-console-bg);
  color: var(--color-console-text);
  font-weight: 600;
}

.next-lesson strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 모바일 세로 화면 보정 ===================== */
@media (max-width: 767px) {
  .goal-card {
    padding: var(--space-4);
  }

  .score-card {
    padding: var(--space-5) var(--space-3);
  }

  .score-card__value {
    font-size: 38px;
  }
}


/* ===== lesson.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 3차시 전용 스타일 (반복문 학습에서만 쓰는 조각들)
 *
 * 앞선 파일과 역할을 나눈다.
 *   tokens.css     : 색·글꼴·간격 값
 *   base.css       : 앱 골격 · 상단 진행 바 · 하단 이동 바
 *   components.css : 버튼 · 패널 · 입력 · 콘솔 · 배지 · 표
 *   code.css       : 코드 뷰와 실행 상태 표시
 *   steps.css      : 시작 화면 · 선택지 · 채점 결과 등 공통 화면 조각
 *   lesson.css     : ↓ 반복 회차 · 값 카드 · 흐름 고리 · 로봇 트랙 …
 * ------------------------------------------------------------------ */

/* ===================== 공통 작은 조각 ===================== */
.note-line {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  min-height: 1.6em;
}

.meta-count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.callout--warn {
  background: var(--color-false-soft);
  border-color: var(--color-false);
  color: var(--color-false-dark);
}

/* 세 칸 배치 (화면 4 : 같은 결과를 내는 세 가지 코드) */
.triple {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}

@media (max-width: 1023px) {
  .triple {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* 오답 해설에서 관련 학습 화면으로 이동하는 줄 */
.linkline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px dashed var(--color-border);
}

.linkline__label {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 화면 1 : 시작 및 선수 학습 확인 =====================
   1·2차시 시작 화면과 같은 형식을 쓴다. 뼈대(.hero / .goal-card / .agenda)는
   steps.css 에 있고, 여기서는 그 위에 얹는 보정만 한다. */

/* 단계 표기(1단계 · 시작 및 선수 학습 확인) */
.hero__eyebrow {
  margin-bottom: var(--space-3);
}

.hero__note strong {
  color: var(--color-primary-dark);
  font-weight: 800;
}

/* 가운데 정렬된 hero 안에서도 문장·문항은 왼쪽 정렬로 읽는다 */
.hero__feedback {
  margin-top: var(--space-5);
  text-align: left;
}

.hero__quiz {
  margin-top: var(--space-6);
  text-align: left;
}

/* 학습 시작 버튼 아래 안내(남은 활동 / 준비 완료) */
.hero__hint {
  margin-top: var(--space-2);
  text-align: center;
}

/* 지난 시간 핵심 내용 — 학습 순서 칩과 같은 모양이되,
   앞쪽 낱말이 열쇠말임이 드러나도록 색과 굵기만 달리한다. */
.recall__key {
  flex: 0 0 auto;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.recall__key::after {
  content: '·';
  margin-left: var(--space-2);
  color: var(--color-border-strong);
  font-weight: 700;
}

.recall__text {
  color: var(--color-text-sub);
  font-weight: 600;
}

/* 선수 학습 미니 문항 · 생각 열기 카드 */
.mini-quiz {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.mini-quiz__q {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
}

/* 미니 문항 안의 소제목(Q1 · Q2)은 위쪽 여백을 줄인다 */
.mini-quiz .section-title {
  margin: var(--space-2) 0 0;
  font-size: 17px;
}

/* ===================== 화면 1 : 생각 열기 ===================== */
.bigq {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.6;
}

.options--row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (max-width: 767px) {
  .options--row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.option--big {
  align-items: center;
  min-height: 72px;
}

.option--big .option__text {
  display: flex;
  flex-direction: column;
}

.compare-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
}

.compare-card.is-picked {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.compare-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.compare-card__title {
  font-weight: 800;
}

/* 100줄이 쌓이는 모습 : 높이를 고정하고 안에서만 스크롤한다 */
.longcode {
  max-height: 220px;
  overflow: auto;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-code-bg);
  border: 1px solid var(--color-border);
}

.longcode__lines {
  display: flex;
  flex-direction: column;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: #334155;
}

.longcode__line {
  white-space: pre;
  animation: screen-fade 120ms ease;
}

.longcode__dots {
  color: var(--color-text-sub);
  font-size: 18px;
  letter-spacing: 0.3em;
}

.longcode__count {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

/* ===================== 변수 상태 상자 (11.4) ===================== */
.varbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.varbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 96px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.varbox__label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.varbox__value {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--color-primary-dark);
}

.varbox.is-changed {
  animation: varbox-pop 420ms ease;
}

@keyframes varbox-pop {
  0% {
    transform: scale(1);
    border-color: var(--color-border-strong);
    background: var(--color-surface);
  }
  40% {
    transform: scale(1.08);
    border-color: var(--color-primary);
    background: var(--color-primary-soft);
  }
  100% {
    transform: scale(1);
    border-color: var(--color-primary);
    background: var(--color-surface);
  }
}

/* ===================== 반복 회차 표시 (11.3) ===================== */
.round-meter {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.round-meter__text {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.round-meter__bar {
  flex: 1 1 auto;
  height: 8px;
  min-width: 60px;
  border-radius: 99px;
  background: rgba(37, 99, 235, 0.18);
  overflow: hidden;
}

.round-meter__fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: var(--color-primary);
  transition: width var(--dur-progress) ease;
}

/* ===================== 값 카드 (7.1 · 7.3) ===================== */
.valuecards-wrap {
  position: relative;
  overflow-x: auto;
  padding-bottom: var(--space-5);
}

.valuecards {
  display: flex;
  gap: var(--space-2);
  min-width: max-content;
}

.valuecard {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-2);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  transition: all var(--dur-highlight) ease;
}

.valuecard.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: translateY(-3px) scale(1.06);
  box-shadow: var(--shadow);
}

.valuecard.is-used {
  opacity: 0.5;
  border-style: solid;
  background: var(--color-muted-bg);
}

/* 끝값은 점선 카드로 따로 표시한다(명세 7.3) */
.valuecard--excluded {
  position: relative;
  flex-direction: column;
  margin-left: var(--space-5);
  border-style: dashed;
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.valuecard__note {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.valuecards__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.valuecards__pointer {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 44px;
  transition: transform var(--dur-highlight) ease;
  pointer-events: none;
}

.valuecards__pointer.is-hidden {
  visibility: hidden;
}

.valuecards__arrow {
  color: var(--color-primary);
  font-weight: 900;
  line-height: 1;
}

.valuecards__pointer-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================
   가운데 코드 칸의 너비는 «가장 긴 코드 줄» 에 맞춘다(max-content).
   남은 자리를 설명이 모두 쓰므로, 코드 상자가 필요 이상으로 넓어지지 않는다. */
.linenotes {
  display: grid;
  grid-template-columns: auto max-content minmax(0, 1fr);
  align-items: stretch;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow-x: auto;
  line-height: 1.9;
}

.linenotes__num,
.linenotes__code {
  background: var(--color-code-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.linenotes__num {
  padding: 2px var(--space-2);
  text-align: right;
  color: #94a3b8;
  user-select: none;
}

.linenotes__code {
  padding: 2px var(--space-4) 2px var(--space-1);
  white-space: pre;
}

.linenotes__desc {
  display: flex;
  align-items: center;
  padding: 2px var(--space-3);
  border-left: 1px dashed var(--color-border-strong);
  background: var(--color-surface);
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  line-height: 1.5;
}

/* 줄 사이 구분선. 마지막 줄에는 넣지 않는다(바깥 테두리와 겹친다). */
.linenotes > * {
  border-bottom: 1px solid var(--color-border);
}

.linenotes > *:nth-last-child(-n + 3) {
  border-bottom: none;
}

/* 모바일에서는 설명을 코드 아래 줄로 내린다 */
@media (max-width: 767px) {
  .linenotes {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .linenotes__desc {
    grid-column: 1 / -1;
    border-left: none;
    border-top: 1px dashed var(--color-border-strong);
    padding: var(--space-2) var(--space-3);
  }

  .linenotes__desc.is-empty {
    display: none;
  }
}

/* ===================== 용어 설명 · 묻고 답하기 (9.6) ===================== */
/* 교과 자료의 「용어 설명」 상자와 같은 모양으로 맞춘다. */
.term-card {
  padding: var(--space-3) var(--space-4);
  border-left: 5px solid var(--color-text);
  background: var(--color-muted-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.term-card__title {
  font-size: 17px;
  font-weight: 800;
}

.term-card__desc {
  margin-top: 2px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.qa {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: var(--fs-small);
  line-height: 1.75;
}

.qa__row {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
}

.qa__mark {
  flex: 0 0 auto;
  width: 1.4em;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
}

.qa__mark--q {
  color: var(--color-true-dark);
}

.qa__mark--a {
  color: var(--color-error);
}

.qa__row--q {
  font-weight: 700;
}

/* ===================== 안전 장치 안내 (11.6) ===================== */
/* 무한 반복 예제에서 반드시 읽어야 하는 문구라 상자로 크게 보인다. */
.safety-notice {
  display: flex;
  width: 100%;
  font-size: 15px;
}

/* ===================== 무작위 뽑기 (9.6) ===================== */
.dice-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.dice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: 17px;
  font-weight: 800;
  animation: dice-roll 600ms ease infinite;
}

.dice.is-done {
  animation: none;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
}

@keyframes dice-roll {
  0%,
  100% {
    transform: rotate(-8deg);
  }
  50% {
    transform: rotate(8deg);
  }
}

/* ===================== 형성평가 (10장) ===================== */
.quiz-item .panel__title {
  align-items: flex-start;
  line-height: 1.5;
}

.expected {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.expected__title {
  padding: 4px var(--space-3);
  background: var(--color-muted-bg);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.expected__body {
  margin: 0;
  padding: var(--space-3);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  white-space: pre-wrap;
}

/* 문항 진행 표시 (문항 n / 5) */
.quiz-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.quiz-progress__text {
  font-weight: 800;
  color: var(--color-primary-dark);
}

.quiz-progress__dots {
  display: flex;
  gap: var(--space-2);
}

.quiz-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.quiz-dot.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.quiz-dot.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.1);
}

/* 문항 아래 버튼 줄 (이전 · 다음 · 채점 · 제출) */
.quiz-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.quiz-nav__hint {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  min-height: 1.4em;
}

.quiz-retry {
  margin-top: var(--space-3);
}

/* 제출 결과 안내 */
.submit-note {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-true);
  border-left-width: 5px;
  background: var(--color-true-soft);
  font-size: var(--fs-small);
  line-height: 1.7;
}

.submit-note code {
  font-family: var(--font-mono);
  font-weight: 700;
}

/* 제출 대화상자의 오류 문구 */
.modal__error {
  margin-top: var(--space-2);
  color: var(--color-error);
  font-size: var(--fs-small);
  font-weight: 700;
  min-height: 1.2em;
}

@media (max-width: 767px) {
  .quiz-nav .btn {
    flex: 1 1 46%;
  }
}

.quiz-review {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-muted-bg);
  font-size: var(--fs-small);
}

.quiz-review.is-correct {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}

.quiz-review.is-wrong {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.quiz-review__head {
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.quiz-review__rows dt {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
  margin-top: var(--space-2);
}

.quiz-review__rows dd {
  margin: 2px 0 0;
}

.pre-line {
  white-space: pre-line;
  font-family: var(--font-mono);
}

/* 핵심 개념 카드 */
.concept-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-2);
}

.concept-card {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.concept-card__key {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.concept-card__desc {
  font-size: 12px;
  color: var(--color-text-sub);
}

/* 스스로 점검 */
.self-check__row {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) 0;
}

.self-check__row + .self-check__row {
  border-top: 1px dashed var(--color-border);
}

.self-check__text {
  font-weight: 700;
}

/* ===================== 모바일 세로 배치 (11.1) ===================== */
@media (max-width: 767px) {
  .varbox {
    min-width: 84px;
  }

  .varbox__value {
    font-size: 20px;
  }

  .accum-chain__value {
    font-size: 18px;
  }

  .flowring {
    flex-direction: column;
    align-items: stretch;
  }

  .flowring__node + .flowring__node::before {
    content: '↓';
    position: static;
    margin: 0 0 0 4px;
  }

  .longcode {
    max-height: 160px;
  }

  /* 화면 1 : 모바일에서 스크롤을 줄이도록 여백을 좁힌다 */
  .hero .goal-card {
    margin-top: var(--space-4);
    padding: var(--space-4);
  }

  .hero .agenda,
  .hero .hero__time {
    margin-top: var(--space-4);
  }

  .hero .agenda__list {
    grid-template-columns: minmax(0, 1fr);
  }

  .hero__quiz {
    margin-top: var(--space-5);
  }

  .hero .hero__cta .btn {
    width: 100%;
  }
}


/* ===== lesson2.css (2차시에서 이어받은 공통 부품) ===== */
/* ------------------------------------------------------------------
 * 「객체를 구현하는 클래스 2차시」 전용 스타일 (명세 20장 · 21장)
 *
 * 앞 차시의 스타일(base · components · code · steps · lesson · object …)을 그대로 물려받고,
 * 이 차시에서 새로 만든 부품만 여기에 둔다. 다른 화면의 모양을 건드리지 않기 위해서다.
 *
 * 색 규칙 (명세 20.1 · 21장)
 *   · 제목선과 카드형 UI 는 앞 차시와 같게 유지한다.
 *   · 2차시 강조색만 보라 계열(--accent2)로 구분한다.
 *   · 정답 · 오답 · 변경 · 유지는 색만으로 나타내지 않고 항상 기호와 글자를 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  --accent2: #7c3aed;
  --accent2-dark: #6d28d9;
  --accent2-soft: #f5f3ff;
  --accent2-border: #ddd6fe;
}

/* ------------------------------------------------------------------ */
/* 화면 1 — 선수 학습 2문항                                             */
/* ------------------------------------------------------------------ */
.s1-pre {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.s1-pre__item {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-surface);
}

.s1-pre__q {
  margin: 0 0 var(--space-2);
  font-weight: 600;
  line-height: 1.5;
}

.s1-pre__qno {
  display: inline-block;
  margin-right: var(--space-2);
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent2-soft);
  border: 1px solid var(--accent2-border);
  color: var(--accent2-dark);
  font-size: var(--fs-small);
  font-weight: 700;
}

.s1-pre__opts {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.s1-pre__opt {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.s1-pre__opt:hover {
  border-color: var(--accent2);
  background: var(--accent2-soft);
}

.s1-pre__no {
  flex: none;
  font-weight: 700;
  color: var(--accent2-dark);
}

.s1-pre__text {
  flex: 1 1 auto;
}

.s1-pre__mark {
  flex: none;
  font-size: var(--fs-small);
  font-weight: 700;
}

.s1-pre__opt.is-selected {
  border-width: 2px;
}

.s1-pre__opt.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.s1-pre__opt.is-correct .s1-pre__mark {
  color: var(--color-true-dark);
}

.s1-pre__opt.is-wrong {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.s1-pre__opt.is-wrong .s1-pre__mark {
  color: var(--color-false-dark);
}

.s1-pre__note {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
  line-height: 1.6;
  color: var(--color-text-sub);
}

.s1-pre__note.is-ok {
  color: var(--color-true-dark);
}

.s1-pre__note.is-no {
  color: var(--color-false-dark);
}

.s1-pre__summary {
  margin: var(--space-3) 0 0;
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-text-sub);
}

.s1-pre__summary.is-ok {
  color: var(--color-true-dark);
}

/* ------------------------------------------------------------------ */
/* 화면 2 — 클래스 구조 분석 · 오류 사례 · 조립                            */
/* ------------------------------------------------------------------ */

/* 누를 수 있는 코드 줄 (명세 7.1) */
.code-line.is-clickable {
  cursor: pointer;
  border-radius: var(--radius-sm);
}

.code-line.is-clickable:hover {
  background: rgba(124, 58, 237, 0.08);
}

.code-line.is-clickable:focus-visible {
  outline: 2px solid var(--accent2);
  outline-offset: 1px;
}

.code-line.is-picked {
  background: rgba(124, 58, 237, 0.14);
}

.cparts {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.cpart {
  border: 1px solid var(--accent2-border);
  border-left: 4px solid var(--accent2);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--accent2-soft);
}

.cpart__title {
  margin: 0 0 var(--space-1);
  font-weight: 700;
  line-height: 1.5;
}

.cpart__token {
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  border: 1px solid var(--accent2-border);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--accent2-dark);
}

.cpart__note {
  margin: 0;
  font-size: var(--fs-small);
  line-height: 1.7;
}

/* 오류 유형 선택지의 정오 표시 글자 (색만으로 나타내지 않는다) */
.option__mark {
  flex: none;
  margin-left: auto;
  font-size: var(--fs-small);
  font-weight: 700;
}

.option.is-correct .option__mark {
  color: var(--color-true-dark);
}

.option.is-wrong .option__mark {
  color: var(--color-false-dark);
}

/* 고친 코드 상자 (명세 20.4 ④ 수정 방법) */
.fixbox {
  margin-top: var(--space-3);
  border: 1px solid var(--color-true);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-true-soft);
}

.fixbox__title {
  margin: 0 0 var(--space-2);
  font-weight: 700;
  color: var(--color-true-dark);
}

/* 드래그 상태 (명세 21장 : 클릭과 드래그 모두 지원) */
.asm-piece.is-dragging {
  opacity: 0.5;
}

.asm-slot.is-over {
  border-color: var(--accent2);
  background: var(--accent2-soft);
}

/* ------------------------------------------------------------------ */
/* 화면 3 — 클래스 카드 · 변경 내용 · 점 표기법 연결                        */
/* ------------------------------------------------------------------ */

/* 클래스 카드는 객체 카드와 «시각적으로 구분»한다(명세 8.1). */
.objcard--class {
  border-style: dashed;
  border-color: var(--color-border-strong);
  background: var(--color-muted-bg);
}

.objcard--class .objcard__name {
  font-family: var(--font-mono);
}

.objcard.is-reading-card {
  box-shadow: 0 0 0 2px var(--color-primary-soft);
  border-color: var(--color-primary);
}

.objcard.is-running-card {
  box-shadow: 0 0 0 2px var(--accent2-soft);
  border-color: var(--accent2);
}

/* 현재 실행 줄 · 변경 대상 · 이전 값 → 새 값 (명세 8.2) */
.chg {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-surface);
}

.chg__line {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0;
}

.chg__line code {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  word-break: break-all;
}

.chg__label {
  flex: none;
  min-width: 7.5em;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--accent2-dark);
}

/* 연결 활동 표 */
.dot-table code {
  font-family: var(--font-mono);
}

.dot-row__mark {
  display: inline-block;
  margin-right: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  white-space: nowrap;
}

.dot-row__mark.is-ok {
  color: var(--color-true-dark);
}

.dot-row__mark.is-no {
  color: var(--color-false-dark);
}

.dot-row__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ------------------------------------------------------------------ */
/* 화면 4 — 들여쓰기 층 · self 흐름 · 오개념 비교                          */
/* ------------------------------------------------------------------ */
.levels {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin: var(--space-3) 0;
}

.levels__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  border-left: 4px solid var(--accent2);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3);
  background: var(--accent2-soft);
}

.levels__item--1 {
  margin-left: var(--space-4);
}

.levels__item--2 {
  margin-left: calc(var(--space-4) * 2);
}

.levels__no {
  flex: none;
  font-weight: 700;
  color: var(--accent2-dark);
}

.levels__desc {
  font-size: var(--fs-small);
}

/* phone1 → self → self.user → "민준" 흐름 (명세 9.3) */
.selfchain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-3) 0;
}

.selfchain__node {
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.selfchain__node.is-on {
  border-color: var(--accent2);
  background: var(--accent2);
  color: #ffffff;
  font-weight: 700;
}

.selfchain__arrow {
  color: var(--color-text-sub);
}

/* call · call() · call(phone1) 비교 (명세 9.5) */
.cmp {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-3);
}

.cmp__card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-3);
  background: var(--color-surface);
}

.cmp__card.is-ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.cmp__card.is-no {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.cmp__code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  word-break: break-all;
}

.cmp__verdict {
  margin: 0;
  font-weight: 700;
}

.cmp__mark {
  font-size: 1.1em;
}
