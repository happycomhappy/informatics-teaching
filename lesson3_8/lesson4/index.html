      current = id;
      paint();
    }

    // 좌우 화살표로도 이동할 수 있게 한다(명세 52장).
    bar.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var index = items.findIndex(function (item) {
        return item.id === current;
      });
      var next = (index + (e.key === 'ArrowRight' ? 1 : items.length - 1)) % items.length;
      setActive(items[next].id);
      buttons[next].focus();
      e.preventDefault();
    });

    if (query) {
      if (typeof query.addEventListener === 'function') query.addEventListener('change', paint);
      else if (typeof query.addListener === 'function') query.addListener(paint);
    }
    // 창 크기 변경(화면 회전 · 창 조절)에도 반드시 다시 그린다.
    window.addEventListener('resize', debounce(paint, 150));
    paint();

    return { root: root, setActive: setActive, isMobile: isMobile };
  }

  /** 숫자 입력 + 슬라이더 */
  function numberField(opts) {
    var o = opts || {};
    var min = o.min === undefined ? 0 : o.min;
    var max = o.max === undefined ? 100 : o.max;
    var step = o.step === undefined ? 1 : o.step;
    var value = o.value === undefined ? 0 : o.value;
    var withSlider = o.withSlider !== false;

    var input = el('input', {
      type: 'number',
      'class': 'num-input',
      min: min,
      max: max,
      step: step,
      value: String(value),
      id: o.id,
      attrs: { 'aria-label': o.label, inputmode: 'numeric' }
    });
    var slider = withSlider
      ? el('input', {
          type: 'range',
          'class': 'slider',
          min: min,
          max: max,
          step: step,
          value: String(value),
          attrs: { 'aria-label': (o.label || '값') + ' 슬라이더' }
        })
      : null;

    var current = value;

    function apply(next, from) {
      var n = Number(next);
      if (isNaN(n)) return;
      n = Math.min(max, Math.max(min, n));
      current = n;
      if (from !== 'input') input.value = String(n);
      if (slider && from !== 'slider') slider.value = String(n);
      if (o.onChange) o.onChange(n);
    }

    input.addEventListener('input', function () {
      var raw = input.value;
      if (raw === '' || raw === '-') return;
      apply(raw, 'input');
    });
    input.addEventListener('blur', function () {
      apply(input.value === '' ? current : input.value);
    });
    if (slider) {
      slider.addEventListener('input', function () {
        apply(slider.value, 'slider');
      });
    }

    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [
        input,
        o.suffix ? el('span', { text: o.suffix }) : null,
        slider
      ])
    ]);

    return {
      root: root,
      input: input,
      slider: slider,
      getValue: function () {
        return current;
      },
      setValue: function (v) {
        apply(v);
      }
    };
  }

  /** 한 줄 텍스트 입력 (이번 차시 추가 헬퍼) */
  function textField(opts) {
    var o = opts || {};
    var input = el('input', {
      type: 'text',
      'class': ('num-input ' + (o.className || '')).trim(),
      id: o.id,
      value: o.value === undefined || o.value === null ? '' : String(o.value),
      placeholder: o.placeholder || '',
      style: o.width ? { width: o.width, textAlign: o.align || 'center' } : null,
      attrs: {
        'aria-label': o.label || o.placeholder || '입력',
        inputmode: o.inputmode || undefined,
        maxlength: o.maxLength || undefined
      }
    });
    if (o.onInput) input.addEventListener('input', function () { o.onInput(input.value); });
    if (o.onEnter) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') o.onEnter(input.value);
      });
    }
    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [input, o.suffix ? el('span', { text: o.suffix }) : null])
    ]);
    return {
      root: root,
      input: input,
      getValue: function () {
        return input.value;
      },
      setValue: function (v) {
        input.value = v === undefined || v === null ? '' : String(v);
      }
    };
  }

  /* ------------------------ 실행 결과 출력 창 ------------------------ */
  function createConsole(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '실행 버튼을 누르면 결과가 여기에 표시돼요.';

  /* ------------------------ 피드백 영역 ------------------------ */

        el('div', { 'class': 'modal__body' }, [

/* ==================================================================
 * 4차시에서 새로 필요한 UI 부품
 *
 * 위 블록은 1~3차시와 «같은 파일»이라 손대지 않는다.
 * 협력 프로젝트에만 필요한 것(여러 개 고르기 · 큰 모달 · 코드 보기 ·
 * 파일 내려받기 · 시각 표시)만 여기에 이어 붙인다.
 * ================================================================== */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var ui = L.ui || (L.ui = {});
  var el = ui.el;

  /* ---------------------------- 여러 개 고르기 ---------------------------- */
  /**
   * 체크박스 묶음 (협력 약속 · 기여 항목 등).
   *   options : [{ value, label, sub }]
   *   values  : 지금 선택된 값 배열
   *   onChange(values)

  function checkboxGroup(opts) {
    var o = opts || {};

    var items = (o.options || []).map(function (opt) {

        type: 'checkbox',

        attrs: { 'aria-label': opt.ariaLabel || opt.label }
      });
      input.addEventListener('change', function () {
        var at = selected.indexOf(opt.value);
        if (input.checked && at < 0) selected.push(opt.value);
        if (!input.checked && at >= 0) selected.splice(at, 1);
        if (o.onChange) o.onChange(selected.slice());
      });
      return el('label', { 'class': 'choice' }, [
        input,
        el('span', { 'class': 'choice__body' }, [
          el('span', { 'class': 'choice__label', text: opt.label }),
          opt.sub ? el('span', { 'class': 'choice__sub', text: opt.sub }) : null
        ])
      ]);
    });
    var root = el(
      'div',
      {
        'class': 'choice-group ' + (o.className || ''),
        attrs: { role: 'group', 'aria-label': o.ariaLabel || o.label || '여러 개 고르기' }
      },
      items
    );
    return {
      root: root,
      getValues: function () {
        return selected.slice();
      }
    };
  }

  /** 체크 한 칸 (한 줄 확인용) */
  function checkLine(opts) {
    var o = opts || {};
    var input = el('input', {
      type: 'checkbox',
      checked: o.checked === true,
      attrs: { 'aria-label': o.label }
    });
    input.addEventListener('change', function () {
      if (o.onChange) o.onChange(input.checked);
    });
    var root = el('label', { 'class': 'choice choice--line' }, [
      input,
      el('span', { 'class': 'choice__body' }, [
        el('span', { 'class': 'choice__label', text: o.label }),
        o.sub ? el('span', { 'class': 'choice__sub', text: o.sub }) : null
      ])
    ]);
    return { root: root, input: input };
  }

  /* ------------------------------ 큰 모달 ------------------------------ */
  /**
   * 내용을 직접 넣는 모달 (제출 미리보기 · 버전 복원 확인 등).
   *   title / body(노드) / actions([{label, variant, value, close}])
   * 반환 : Promise — 누른 버튼의 value (그냥 닫으면 null)
   */
  function modal(opts) {
    var o = opts || {};
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal modal--wide' });
      var settled = false;
      function done(value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      }

      var actions = (o.actions || [{ label: '닫기', value: null }]).map(function (a) {
        return ui.button({
          label: a.label,
          variant: a.variant || 'ghost',
          onClick: function () {
            if (typeof a.onClick === 'function') {
              var keep = a.onClick(done);
              if (keep === false) return; // 모달을 열어 둔 채로 계속
            }
            if (a.close === false) return;
            done(a.value === undefined ? null : a.value);
          }
        });
      });

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          o.lead ? el('p', { 'class': 'modal__text', text: o.lead }) : null,
          el('div', { 'class': 'modal__content stack' }, [o.body || null]),
          el('div', { 'class': 'modal__actions' }, actions)
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(null);
      });
      dialog.addEventListener('close', function () {
        done(null);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /* ----------------------------- 코드 보기 ----------------------------- */
  /**
   * 읽기 전용 Python 코드 블록.
   *   code / title / badge('예시 전용' 등) / copy(기본 true) / lineNumbers
   * 명세 8.1 : 복사 버튼은 허용하되 팀 편집기에 자동으로 넣지 않는다.
   */
  function codeBlock(opts) {
    var o = opts || {};
    var code = String(o.code || '').replace(/\s+$/, '');
    var lines = code.split('\n');

    var pre = el('pre', { 'class': 'codeblock__pre' });
    var codeNode = el('code', { 'class': 'codeblock__code' });
    if (o.lineNumbers === false) {
      codeNode.innerHTML = L.highlightPython ? L.highlightPython(code) : ui.escapeHtml(code);
    } else {
      codeNode.innerHTML = lines
        .map(function (line, i) {
          var no = String(i + 1);
          return (
            '<span class="codeblock__line"><span class="codeblock__no" aria-hidden="true">' +
            no +
            '</span><span class="codeblock__text">' +
            (L.highlightPython ? L.highlightPython(line) : ui.escapeHtml(line)) +
            '</span></span>'
          );
        })
        // 줄 사이에 \n 을 넣지 않는다.
        // .codeblock__line 은 그 자체로 한 줄(flex)이고 pre 는 \n 을 그대로 살리므로,
        // 둘을 함께 쓰면 줄 간격이 두 배로 벌어진다.
        .join('');
    }
    pre.appendChild(codeNode);

    var head =
      o.title || o.badge || o.copy !== false
        ? el('div', { 'class': 'codeblock__head' }, [
            el('span', { 'class': 'codeblock__title', text: o.title || 'Python' }),
            o.badge
              ? el('span', {
                  'class': 'badge badge--false codeblock__badge',
                  text: o.badge,
                  attrs: { title: o.badgeTitle || undefined }
                })
              : null,
            o.copy === false
              ? null
              : ui.button({
                  label: '복사',
                  variant: 'ghost',
                  className: 'btn--sm',
                  onClick: function (e) {
                    copyText(code).then(function (ok) {
                      ui.toast(ok ? '코드를 복사했어요.' : '복사하지 못했어요. 직접 선택해 주세요.');
                      if (e && e.target) e.target.textContent = ok ? '복사됨' : '복사';
                      setTimeout(function () {
                        if (e && e.target) e.target.textContent = '복사';
                      }, 1500);
                    });
                  }
                })
          ])
        : null;

    return el('div', { 'class': ('codeblock ' + (o.className || '')).trim() }, [
      head,
      el('div', { 'class': 'codeblock__scroll' }, [pre]),
      o.note ? el('p', { 'class': 'codeblock__note', text: o.note }) : null
    ]);
  }

  /**
   * 코드와 설명을 «좌우로» 나란히 놓는다 (명세 8.2 페이지 3).
   *   codeWithNotes({ code: 코드블록노드, notes: [설명노드…] })
   * 넓은 화면에서는 왼쪽 코드 · 오른쪽 설명,
   * 좁은 화면에서는 코드 아래에 설명이 오도록 자동으로 쌓인다.
   */
  function codeWithNotes(opts) {
    var o = opts || {};
    var notes = (o.notes || []).filter(Boolean);
    return el('div', { 'class': ('codepair ' + (o.className || '')).trim() }, [
      el('div', { 'class': 'codepair__code' }, [o.code || null]),
      notes.length ? el('div', { 'class': 'codepair__notes' }, notes) : null
    ]);
  }

  /**
   * 코드 한 줄씩 붙이는 설명 목록.
   *   items : [{ token:'open()', text:'파일을 연다.' }] 또는 문자열
   */
  function codeNotes(items) {
    return el(
      'ul',
      { 'class': 'codenotes' },
      (items || []).map(function (item) {
        if (typeof item === 'string') {
          return el('li', { 'class': 'codenotes__item' }, [
            el('span', { 'class': 'codenotes__text', html: item })
          ]);
        }
        return el('li', { 'class': 'codenotes__item' }, [
          item.token ? el('code', { 'class': 'codenotes__token', text: item.token }) : null,
          el('span', { 'class': 'codenotes__text', html: item.text })
        ]);
      })
    );
  }

  /** 글자를 클립보드로 복사한다(옛 브라우저 대비 포함). */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (err) {
      return false;
    }
  }

  /* ---------------------------- 파일 내려받기 ---------------------------- */
  /** 글자 내용을 파일로 저장한다 (명세 13.5 제출 실패 대비). */
  function downloadText(filename, text, mime) {
    try {
      var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (err) {
      return false;
    }
  }

  /* ------------------------------ 시각 표시 ------------------------------ */
  /** 2026-08-15 10:04 형식 */
  function formatTime(value) {
    var d = value ? new Date(value) : new Date();
    if (isNaN(d.getTime())) return '';
    function two(n) {
      return n < 10 ? '0' + n : String(n);
    }
    return (
      d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) +
      ' ' + two(d.getHours()) + ':' + two(d.getMinutes())
    );
  }

  /** 시:분:초 만 */
  function formatClock(value) {
    var d = value ? new Date(value) : new Date();
    if (isNaN(d.getTime())) return '';
    function two(n) {
      return n < 10 ? '0' + n : String(n);
    }
    return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
  }

  /** 현재 시각을 +09:00 같은 시간대까지 붙은 문자열로 (명세 16장 submittedAtClient) */
  function isoWithOffset(date) {
    var d = date || new Date();
    var offMin = -d.getTimezoneOffset();
    var sign = offMin >= 0 ? '+' : '-';
    var abs = Math.abs(offMin);
    function two(n) {
      return n < 10 ? '0' + n : String(n);
    }
    return (
      d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) +
      'T' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) +
      sign + two(Math.floor(abs / 60)) + ':' + two(abs % 60)
    );
  }

  /* ---------------------------- 진행 상황 표시 ---------------------------- */
  /**
   * `9개 중 n개 충족` 같은 카운터 배지 (명세 11.5).
   *   items : [{ ok:boolean, label:string, hint:string }]
   */
  function checklist(items) {
    var list = items || [];
    return el(
      'ul',
      { 'class': 'checklist' },
      list.map(function (item) {
        return el(
          'li',
          { 'class': 'checklist__item ' + (item.ok ? 'is-ok' : 'is-todo') },
          [
            el('span', {
              'class': 'checklist__mark',
              text: item.ok ? '✓' : '·',
              attrs: { 'aria-hidden': 'true' }
            }),
            el('span', { 'class': 'checklist__body' }, [
              el('span', { 'class': 'checklist__label', text: item.label }),
              item.hint ? el('span', { 'class': 'checklist__hint', text: item.hint }) : null
            ]),
            // 색만으로 구분하지 않는다(명세 22장)
            el('span', {
              'class': 'checklist__state',
              text: item.ok ? '충족' : '미충족'
            })
          ]
        );
      })
    );
  }

  /* ----------------------------- 페이지 머리말 ----------------------------- */
  /**
   * 이 차시는 «단계» 가 아니라 «페이지» 로 센다(명세 7장 — 전체 10페이지).
   * 1~3차시의 stepHeader 와 모양은 같고 눈썹 글자만 다르다.
   */
  function pageHeader(opts) {
    var o = opts || {};
    var lead = o.lead || [];
    var total = (L.CONST && L.CONST.TOTAL_PAGES) || 10;
    var kind = (L.CONST && L.CONST.PAGE_KIND && L.CONST.PAGE_KIND[o.page]) || 'project';
    return el('header', { 'class': 'step-header' }, [
      el('p', {
        'class': 'step-header__eyebrow',
        text:
          o.page + ' / ' + total + ' 페이지 · ' +
          (kind === 'example' ? '학교 급식 조회 예시' : '우리 팀 프로젝트')
      }),
      el('h2', { 'class': 'step-header__title', text: o.title }),
      lead.length
        ? el(
            'div',
            { 'class': 'step-header__lead' },
            lead.map(function (line) {
              return el('p', { html: line });
            })
          )
        : null
    ]);
  }
  ui.pageHeader = pageHeader;

  /* ---------------------------- 안내 상자 보강 ---------------------------- */
  // 1~3차시의 callout(html, {muted:true}) 은 그대로 두고,
  // { className:'callout--warn' } 처럼 꾸밈 이름을 직접 주는 방식도 받도록 감싼다.
  var baseCallout = ui.callout;
  ui.callout = function (html, opts) {
    var o = opts || {};
    var node = baseCallout(html, o);
    if (o.className) {
      o.className.split(/\s+/).forEach(function (name) {
        if (name) node.classList.add(name);
      });
    }
    return node;
  };

  ui.checkboxGroup = checkboxGroup;
  ui.checkLine = checkLine;
  ui.modal = modal;
  ui.codeBlock = codeBlock;
  ui.codeWithNotes = codeWithNotes;
  ui.codeNotes = codeNotes;
  ui.copyText = copyText;
  ui.downloadText = downloadText;
  ui.formatTime = formatTime;
  ui.formatClock = formatClock;
  ui.isoWithOffset = isoWithOffset;
  ui.checklist = checklist;
})();

/* ==================================================================
 * Python 구문 강조 (명세 11.1 · 19.4)
 * 외부 라이브러리 없이 아주 작은 규칙만 쓴다.
 * 문자열 → 주석 → 키워드 → 숫자 순서로 겹치지 않게 잘라 낸다.
 * ================================================================== */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  var KEYWORDS = [
    'False', 'None', 'True', 'and', 'as', 'assert', 'break', 'class', 'continue',
    'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global',
    'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass',
    'raise', 'return', 'try', 'while', 'with', 'yield'
  ];
  var BUILTINS = ['print', 'len', 'range', 'int', 'str', 'float', 'bool', 'list', 'input', 'self'];

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /**
   * 한 덩어리의 Python 코드를 <span class="tok-…"> 이 섞인 HTML 로 바꾼다.
   * 여러 줄 문자열(''' … ''')까지 완벽히 처리하지는 않는다. 학습용 짧은 코드 기준이다.
   */
  L.highlightPython = function (code) {
    var src = String(code === undefined || code === null ? '' : code);
    var out = '';
    var i = 0;

    while (i < src.length) {
      var ch = src[i];

      // 주석
      if (ch === '#') {
        var endC = src.indexOf('\n', i);
        if (endC < 0) endC = src.length;
        out += '<span class="tok-comment">' + esc(src.slice(i, endC)) + '</span>';
        i = endC;
        continue;
      }

      // 문자열 (f-string 접두어 포함)
      if (ch === '"' || ch === "'") {
        var quote = ch;
        var triple = src.substr(i, 3) === quote + quote + quote;
        var j = i + (triple ? 3 : 1);
        while (j < src.length) {
          if (src[j] === '\\') { j += 2; continue; }
          if (triple && src.substr(j, 3) === quote + quote + quote) { j += 3; break; }
          if (!triple && src[j] === quote) { j += 1; break; }
          if (!triple && src[j] === '\n') break;
          j += 1;
        }
        out += '<span class="tok-str">' + esc(src.slice(i, j)) + '</span>';
        i = j;
        continue;
      }

      // 이름 / 키워드 / 숫자
      if (/[A-Za-z_]/.test(ch)) {
        var k = i;
        while (k < src.length && /[A-Za-z0-9_]/.test(src[k])) k += 1;
        var word = src.slice(i, k);
        // 문자열 접두어 f'' r'' 는 문자열 쪽에서 다시 처리하도록 넘긴다
        if (/^[fFrRbBuU]{1,2}$/.test(word) && (src[k] === '"' || src[k] === "'")) {
          out += '<span class="tok-str">' + esc(word) + '</span>';
          i = k;
          continue;
        }
        if (KEYWORDS.indexOf(word) >= 0) out += '<span class="tok-kw">' + esc(word) + '</span>';
        else if (BUILTINS.indexOf(word) >= 0) out += '<span class="tok-fn">' + esc(word) + '</span>';
        else out += esc(word);
        i = k;
        continue;
      }

      if (/[0-9]/.test(ch)) {
        var n = i;
        while (n < src.length && /[0-9._]/.test(src[n])) n += 1;
        out += '<span class="tok-num">' + esc(src.slice(i, n)) + '</span>';
        i = n;
        continue;
      }

      out += esc(ch);
      i += 1;
    }
    return out;
  };
})();

    <script data-from="js/62-structure-check.js">
/**
 * 필수 구조 검사 (명세 11.5 · 20.4)
 *
 * ★ 이 웹앱은 Python 을 실행하지 않는다(명세 2.2).
 *   그래서 «코드의 글자를 읽어» 아홉 항목을 확인한다.
 *   실행이 아니므로 결과가 실제 동작과 다를 수 있고, 화면에 그 사실을 밝힌다.
 *
 * 읽는 방법 (명세 20.4)
 *   1) 주석을 뗀다. 문자열 안의 # 은 주석으로 보지 않는다.
 *   2) 들여쓰기 깊이로 «클래스 안» 과 «메소드 안» 을 가른다.
 *   3) 클래스 · self.속성 · def · 객체 = 클래스() · 객체.메소드() · print() 를 찾는다.
 *
 * 이 파일은 화면(document)이 없어도 동작한다. Node 테스트에서 그대로 불러 쓴다.
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var structure = L.structure || (L.structure = {});

  /** 아홉 항목 (명세 11.5) */
  var DEFS = [
    { id: 'class', label: '클래스 1개 이상', help: 'class 이름: 으로 클래스를 만든다.' },
    { id: 'attributes', label: '속성 대입 3개 이상', help: '__init__ 안에서 self.속성 = 값 을 세 번 이상 쓴다.' },
    { id: 'methods', label: '메소드 정의 2개 이상', help: '클래스 안에 def 를 두 개 이상 만든다.' },
    { id: 'self', label: '메소드의 첫 매개변수가 self', help: 'def 메소드이름(self): 형태로 쓴다.' },
    { id: 'condition', label: '메소드 안 조건문 1개 이상', help: '메소드 안에서 if 로 상황을 나눈다.' },
    { id: 'instances', label: '객체 생성 2개 이상', help: '객체1 = 클래스(), 객체2 = 클래스() 처럼 두 개를 만든다.' },
    { id: 'different', label: '두 객체에 넣은 값이 서로 다름', help: '두 객체에 서로 다른 값을 넣는다.' },
    { id: 'calls', label: '두 객체에서 메소드 호출', help: '객체1.메소드(), 객체2.메소드() 를 모두 부른다.' },
    { id: 'output', label: '출력 2줄 이상', help: 'print() 로 결과를 두 줄 이상 보여 준다.' }
  ];

  structure.DEFS = DEFS;
  structure.TOTAL = DEFS.length;

  /** 화면에 늘 함께 보여 줄 한계 안내 (명세 20.4) */
  structure.LIMIT_NOTE =
    '이 검사는 코드를 «읽어» 확인한 결과이며 실제 실행이 아니다. 정확한 동작은 직접 실행해 확인한다.';

  /* ================================================================== */
  /* 코드 읽기 도구                                                      */
  /* ================================================================== */

  /** 한 줄에서 주석을 뗀다. 문자열 안의 # 은 그대로 둔다. */
  function stripComment(line) {
    var out = '';
    var quote = null;
    for (var i = 0; i < line.length; i += 1) {
      var ch = line[i];
      if (quote) {
        out += ch;
        if (ch === '\\') {
          if (i + 1 < line.length) {
            out += line[i + 1];
            i += 1;
          }
          continue;
        }
        if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'") {
        quote = ch;
        out += ch;
        continue;
      }
      if (ch === '#') break;
      out += ch;
    }
    return out;
  }

  /** 한 줄에서 주석과 «문자열 속 내용» 을 함께 뗀다(이름을 찾을 때 쓴다). */
  function stripStrings(line) {
    var out = '';
    var quote = null;
    for (var i = 0; i < line.length; i += 1) {
      var ch = line[i];
      if (quote) {
        if (ch === '\\') {
          i += 1;
          continue;
        }
        if (ch === quote) {
          quote = null;
          out += '""'; // 문자열이 있었다는 자리만 남긴다
        }
        continue;
      }
      if (ch === '"' || ch === "'") {
        quote = ch;
        continue;
      }
      if (ch === '#') break;
      out += ch;
    }
    if (quote) out += '""'; // 줄 안에서 닫히지 않은 문자열
    return out;
  }

  /** 코드를 줄 단위 정보로 바꾼다. */
  function readLines(code) {
    return String(code === undefined || code === null ? '' : code)
      .split('\n')
      .map(function (raw, index) {
        var noComment = stripComment(raw);
        var bare = stripStrings(raw);
        var match = noComment.match(/^[ \t]*/);
        var indentText = match ? match[0] : '';
        var indent = indentText.replace(/\t/g, '    ').length;
        return {
          no: index + 1,
          raw: raw,
          code: noComment, // 문자열은 살아 있다 (값 비교에 쓴다)
          bare: bare.trim(), // 이름만 남긴 형태
          text: noComment.trim(),
          indent: noComment.trim() === '' ? -1 : indent
        };
      });
  }

  /** start 다음 줄부터, 들여쓰기가 baseIndent 보다 깊은 «블록» 을 돌려준다. */
  function blockOf(lines, start, baseIndent) {
    var body = [];
    for (var i = start + 1; i < lines.length; i += 1) {
      var line = lines[i];
      if (line.indent < 0) {
        body.push(line); // 빈 줄은 블록을 끊지 않는다
        continue;
      }
      if (line.indent <= baseIndent) break;
      body.push(line);
    }
    return body;
  }

  /* ================================================================== */
  /* 코드 살펴보기                                                       */
  /* ================================================================== */

  /**
   * 코드에서 클래스·메소드·속성·객체·호출·출력을 찾아낸다.
   * (검사 결과를 만들기 전 단계. 테스트에서 이 결과를 직접 확인한다.)
   */
  structure.inspect = function (code) {
    var lines = readLines(code);

    var classes = [];
    var methods = []; // { className, name, params, selfOk, ifs, prints, attributes[] }
    var attributes = {};
    var instances = []; // { objectName, className, args }
    var calls = []; // { objectName, methodName }
    var assigns = []; // { objectName, attribute, value }  (객체.속성 = 값)
    var modulePrints = 0;

    lines.forEach(function (line, index) {
      if (line.indent < 0) return;

      /* --- 클래스 --- */
      var classMatch = line.bare.match(/^class\s+([A-Za-z_][A-Za-z0-9_]*)\s*(\([^)]*\))?\s*:/);
      if (classMatch) {
        var className = classMatch[1];
        classes.push({ name: className, line: line.no, indent: line.indent });

        blockOf(lines, index, line.indent).forEach(function (inner, innerIndex) {
          if (inner.indent < 0) return;
          var defMatch = inner.bare.match(/^(?:async\s+)?def\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(([^)]*)\)\s*:/);
          if (!defMatch) return;

          var params = defMatch[2]
            .split(',')
            .map(function (p) {
              return p.trim();
            })
            .filter(Boolean);
          var absoluteIndex = lines.indexOf(inner);
          var body = blockOf(lines, absoluteIndex, inner.indent);

          var method = {
            className: className,
            name: defMatch[1],
            params: params,
            selfOk: params.length > 0 && params[0].split('=')[0].trim() === 'self',
            line: inner.no,
            ifs: 0,
            prints: 0,
            attributes: []
          };

          body.forEach(function (b) {
            if (b.indent < 0) return;
            if (/^(if|elif)\s+/.test(b.bare)) method.ifs += 1;
            var printCount = (b.bare.match(/\bprint\s*\(/g) || []).length;
            method.prints += printCount;
            var attrMatch = b.code.trim().match(/^self\.([A-Za-z_][A-Za-z0-9_]*)\s*(?::[^=]+)?=[^=]/);
            if (attrMatch) {
              method.attributes.push(attrMatch[1]);
              attributes[attrMatch[1]] = true;
            }
          });

          methods.push(method);
        });
        return;
      }

      /* --- 클래스 밖(모듈 수준)에서 하는 일 --- */
      if (line.indent > 0) return;

      // 객체 = 클래스(...)
      var newMatch = line.code.trim().match(
        /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*([A-Za-z_][A-Za-z0-9_]*)\s*\((.*)\)\s*$/
      );
      if (newMatch) {
        instances.push({
          objectName: newMatch[1],
          className: newMatch[2],
          args: newMatch[3].trim(),
          line: line.no
        });
      }

      // 객체.속성 = 값
      var setMatch = line.code.trim().match(
        /^([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/
      );
      if (setMatch && !/==/.test(setMatch[3].slice(0, 1))) {
        assigns.push({
          objectName: setMatch[1],
          attribute: setMatch[2],
          value: setMatch[3].trim(),
          line: line.no
        });
      }

      // 객체.메소드(...)
      var callRe = /([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)\s*\(/g;
      var found;
      while ((found = callRe.exec(line.bare)) !== null) {
        calls.push({ objectName: found[1], methodName: found[2] });
      }

      modulePrints += (line.bare.match(/\bprint\s*\(/g) || []).length;
    });

    // 우리가 만든 클래스로 만든 객체만 남긴다
    var classNames = classes.map(function (c) {
      return c.name;
    });
    var ownInstances = instances.filter(function (inst) {
      return classNames.indexOf(inst.className) >= 0;
    });
    var instanceNames = ownInstances.map(function (inst) {
      return inst.objectName;
    });

    return {
      lines: lines,
      classes: classes,
      classNames: classNames,
      methods: methods,
      attributes: Object.keys(attributes),
      instances: ownInstances,
      instanceNames: instanceNames,
      calls: calls.filter(function (call) {
        return instanceNames.indexOf(call.objectName) >= 0;
      }),
      assigns: assigns.filter(function (a) {
        return instanceNames.indexOf(a.objectName) >= 0;
      }),
      modulePrints: modulePrints
    };
  };

  /* ------------------------------------------------------------------ */
  /* 두 객체에 넣은 값이 다른지                                           */
  /* ------------------------------------------------------------------ */

  function valuesDiffer(info) {
    var instances = info.instances;
    if (instances.length < 2) return { ok: false, detail: '객체가 2개 미만입니다.' };

    // ① 생성자에 넣은 값 비교 : plant1 = Plant('행운목', 20) vs Plant('다육이', 80)
    for (var i = 0; i < instances.length; i += 1) {
      for (var j = i + 1; j < instances.length; j += 1) {
        var a = instances[i];
        var b = instances[j];
        var argsA = a.args.replace(/\s+/g, '');
        var argsB = b.args.replace(/\s+/g, '');
        if (argsA && argsB && argsA !== argsB) {
          return {
            ok: true,
            detail: a.objectName + ' 와 ' + b.objectName + ' 에 넣은 값이 다릅니다.'
          };
        }
      }
    }

    // ② 나중에 넣은 값 비교 : plant1.water_level = 20 / plant2.water_level = 80
    var byAttr = {};
    info.assigns.forEach(function (item) {
      byAttr[item.attribute] = byAttr[item.attribute] || {};
      byAttr[item.attribute][item.objectName] = item.value.replace(/\s+/g, '');
    });
    var attrs = Object.keys(byAttr);
    for (var k = 0; k < attrs.length; k += 1) {
      var owners = Object.keys(byAttr[attrs[k]]);
      for (var m = 0; m < owners.length; m += 1) {
        for (var n = m + 1; n < owners.length; n += 1) {
          if (byAttr[attrs[k]][owners[m]] !== byAttr[attrs[k]][owners[n]]) {
            return {
              ok: true,
              detail: owners[m] + ' 와 ' + owners[n] + ' 의 ' + attrs[k] + ' 값이 다릅니다.'
            };
          }
        }
      }
    }

    return { ok: false, detail: '두 객체에 같은 값을 넣은 것으로 보입니다.' };
  }

  /** 출력이 몇 줄쯤 나올지 어림한다 (모듈 print + 호출된 메소드 안 print) */
  function estimateOutput(info) {
    var total = info.modulePrints;
    var classOf = {};
    info.instances.forEach(function (inst) {
      classOf[inst.objectName] = inst.className;
    });
    info.calls.forEach(function (call) {
      var className = classOf[call.objectName];
      info.methods.forEach(function (method) {
        if (method.className === className && method.name === call.methodName) {
          total += method.prints;
        }
      });
    });
    return total;
  }

  /* ================================================================== */
  /* 아홉 항목 검사                                                      */
  /* ================================================================== */

  /**
   * 코드를 읽어 아홉 항목을 확인한다.
   * 결과 모양 : { passed, total, details:[{id,label,ok,detail}] }
   */
  structure.analyze = function (code) {
    var info = structure.inspect(code);
    var different = valuesDiffer(info);
    var outputLines = estimateOutput(info);

    var calledObjects = [];
    info.calls.forEach(function (call) {
      if (calledObjects.indexOf(call.objectName) < 0) calledObjects.push(call.objectName);
    });

    var withSelf = info.methods.filter(function (m) {
      return m.selfOk;
    });
    var ifCount = info.methods.reduce(function (sum, m) {
      return sum + m.ifs;
    }, 0);

    var details = [
      {
        id: 'class',
        ok: info.classes.length >= 1,
        detail: '찾은 클래스 : ' + (info.classNames.join(', ') || '없음')
      },
      {
        id: 'attributes',
        ok: info.attributes.length >= 3,
        detail: 'self 로 만든 속성 : ' + (info.attributes.join(', ') || '없음')
      },
      {
        id: 'methods',
        ok: info.methods.length >= 2,
        detail:
          '찾은 메소드 : ' +
          (info.methods
            .map(function (m) {
              return m.className + '.' + m.name;
            })
            .join(', ') || '없음')
      },
      {
        id: 'self',
        ok: info.methods.length >= 1 && withSelf.length === info.methods.length,
        detail:
          info.methods.length === 0
            ? '메소드가 없습니다.'
            : withSelf.length === info.methods.length
            ? '모든 메소드의 첫 자리가 self 입니다.'
            : '첫 자리가 self 가 아닌 메소드 : ' +
              info.methods
                .filter(function (m) {
                  return !m.selfOk;
                })
                .map(function (m) {
                  return m.name;
                })
                .join(', ')
      },
      {
        id: 'condition',
        ok: ifCount >= 1,
        detail: '메소드 안 if 개수 : ' + ifCount
      },
      {
        id: 'instances',
        ok: info.instanceNames.length >= 2,
        detail: '만든 객체 : ' + (info.instanceNames.join(', ') || '없음')
      },
      {
        id: 'different',
        ok: different.ok,
        detail: different.detail
      },
      {
        id: 'calls',
        ok: calledObjects.length >= 2,
        detail: '메소드를 부른 객체 : ' + (calledObjects.join(', ') || '없음')
      },
      {
        id: 'output',
        ok: outputLines >= 2,
        detail: '예상 출력 줄 수 : 약 ' + outputLines + '줄'
      }
    ];

    // 이름표는 DEFS 한 곳에서만 관리한다
    details.forEach(function (item) {
      var def = DEFS.filter(function (d) {
        return d.id === item.id;
      })[0];
      item.label = def ? def.label : item.id;
    });

    var passed = details.filter(function (item) {
      return item.ok;
    }).length;

    return { passed: passed, total: DEFS.length, details: details };
  };

  /**
   * 검사 결과를 화면·제출용으로 정리한다.
   * analyze() 결과를 그대로 넣어도 되고, 예전에 저장해 둔 결과를 넣어도 된다.
   */
  structure.summarize = function (raw) {
    var byId = {};
    if (raw && Array.isArray(raw.details)) {
      raw.details.forEach(function (item) {
        if (item && item.id) byId[item.id] = item;
      });
    }
    var items = DEFS.map(function (def) {
      var found = byId[def.id];
      return {
        id: def.id,
        label: def.label,
        help: def.help,
        ok: Boolean(found && found.ok),
        detail: (found && found.detail) || ''
      };
    });
    var passed = items.filter(function (i) {
      return i.ok;
    }).length;
    return {
      passed: passed,
      total: DEFS.length,
      items: items,
      allPassed: passed === DEFS.length,
      text: DEFS.length + '개 중 ' + passed + '개 충족'
    };
  };

  /* ================================================================== */
  /* 작성 규칙 안내 (명세 11.3)                                          */
  /* ================================================================== */

  var QUICK_RULES = [
    { re: /(^|[^.\w])import\s+\w/, message: 'import 는 쓰지 않는다. 기본 문법만으로 만든다.' },
    { re: /(^|[^.\w])from\s+\w+\s+import\s/, message: 'from ... import ... 는 쓰지 않는다.' },
    { re: /(^|[^.\w])open\s*\(/, message: '파일을 여는 open() 대신 리스트로 자료를 직접 준비한다.' },
    { re: /(^|[^.\w])input\s*\(/, message: 'input() 대신 코드 안에 테스트 값을 직접 적는다.' },
    { re: /(^|[^.\w])eval\s*\(/, message: 'eval() 은 쓰지 않는다.' },
    { re: /(^|[^.\w])exec\s*\(/, message: 'exec() 는 쓰지 않는다.' },
    { re: /(^|[^.\w])compile\s*\(/, message: 'compile() 은 쓰지 않는다.' },
    { re: /(^|[^.\w])globals\s*\(/, message: 'globals() 는 쓰지 않는다.' },
    { re: /(^|[^.\w])locals\s*\(/, message: 'locals() 는 쓰지 않는다.' },
    { re: /while\s+True\s*:/, message: 'while True 는 끝나지 않을 수 있다. 끝나는 조건을 정한다.' }
  ];

  /**
   * 코드를 훑어 «이 프로젝트에서 쓰지 않는 문법» 을 줄 번호와 함께 알려 준다.
   * 막는 것이 아니라 «작성 안내» 다(명세 11.3).
   */
  structure.quickScan = function (code) {
    var found = [];
    readLines(code).forEach(function (line) {
      QUICK_RULES.forEach(function (rule) {
        if (rule.re.test(line.bare)) {
          found.push({ line: line.no, message: rule.message });
        }
      });
    });
    return found;
  };

  /* ================================================================== */
  /* 설계 뼈대 만들기 (명세 10.3)                                        */
  /* ================================================================== */

  structure.buildSkeleton = function (design) {
    var d = design || {};
    var className = String(d.className || 'MyClass').trim() || 'MyClass';
    var properties = (d.properties || []).filter(Boolean);
    var methods = (d.methods || []).filter(Boolean);
    var instances = (d.instances || []).filter(function (inst) {
      return inst && inst.objectName;
    });

    var lines = [];
    if (d.classDescription) lines.push('# ' + d.classDescription);
    lines.push('class ' + className + ':');
    if (properties.length > 0) {
      lines.push('    # 속성 : ' + properties.join(', '));
    }
    lines.push('    # 속성을 작성하세요.');
    lines.push('');

    (methods.length > 0 ? methods : ['method_one', 'method_two']).forEach(function (m) {
      var name = String(m).replace(/\(.*$/, '').trim() || 'method';
      lines.push('    def ' + name + '(self):');
      if (name === d.conditionalMethod && d.conditionalRule) {
        lines.push('        # 조건 : ' + d.conditionalRule);
      }
      lines.push('        # 실행할 내용을 작성하세요.');
      lines.push('        pass');
      lines.push('');
    });

    lines.push('# 두 객체를 만들고 서로 다른 값을 설정하세요.');
    if (instances.length > 0) {
      instances.forEach(function (inst) {
        lines.push('# ' + inst.objectName + ' = ' + className + '(...)');
      });
    } else {
      lines.push('# 객체1 = ' + className + '(...)');
      lines.push('# 객체2 = ' + className + '(...)');
    }
    return lines.join('\n');
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = structure;
  }
})();
    </script>

 */
(function () {
  "use strict";

  var L = window.L;

  /* ------------------------------------------------------------------ */

  /** 명세 4장 페이지 3 — 브라우저 실행용 급식 조회 코드 (파일·input 없음) */
  var BROWSER_CODE = [

    "    '0602 현미밥 된장국 닭갈비 계란찜 깍두기',",
    "    '0603 보리밥 미역국 생선구이 떡볶이 배추김치',",

  /** 알고리즘 카드 배열 활동을 그린다. */
  function renderAlgorithmSort(board, feedback) {
    function order() {
      return (ex().p2Order || []).slice();
    }

    function setOrder(next) {
      saveExample(function (e) {
        e.p2Order = next;
      });
      paint();
    }

    var pool = el('div', { 'class': 'cardsort__pool' });
    var slots = el('ol', { 'class': 'cardsort__slots' });
    board.appendChild(
      el('div', { 'class': 'cardsort__col' }, [
        el('h4', { 'class': 'cardsort__title', text: '카드 (누르면 순서표로 들어간다)' }),
        pool
      ])
    );
    board.appendChild(
      el('div', { 'class': 'cardsort__col' }, [
        el('h4', { 'class': 'cardsort__title', text: '알고리즘 순서표' }),
        slots
      ])
    );

    function cardById(id) {
      for (var i = 0; i < ALGORITHM_CARDS.length; i += 1) {
        if (ALGORITHM_CARDS[i].id === id) return ALGORITHM_CARDS[i];
      }
      return null;
    }

    function paint() {
      var placed = order();
      ui.clear(pool);
      ui.clear(slots);

      // 아직 놓지 않은 카드 (원래 순서를 그대로 보여 주면 답이 되므로 고정된 섞음 순서를 쓴다)
      var shuffled = ['a3', 'a1', 'a4', 'a2'];
      var remain = shuffled.filter(function (id) {
        return placed.indexOf(id) < 0;
      });

      if (remain.length === 0) {
        pool.appendChild(el('p', { 'class': 'cardsort__empty', text: '카드를 모두 놓았어요.' }));
      }
      remain.forEach(function (id) {
        var card = cardById(id);
        pool.appendChild(
          el('button', {
            type: 'button',
            'class': 'sortcard',
            text: card.text,
            attrs: { 'aria-label': '순서표에 넣기: ' + card.text },
            on: {
              click: function () {
                setOrder(order().concat([id]));
              }
            }
          })
        );
      });

      for (var i = 0; i < ALGORITHM_CARDS.length; i += 1) {
        var id = placed[i];
        var card = id ? cardById(id) : null;
        var right = card && card.order === i + 1;
        slots.appendChild(
          el(
            'li',
            {
              'class':
                'cardsort__slot' +
                (card ? ' is-filled' : '') +
                (card ? (right ? ' is-right' : ' is-wrong') : '')
            },
            [
              el('span', { 'class': 'cardsort__no', text: String(i + 1) }),
              card
                ? el('button', {
                    type: 'button',
                    'class': 'cardsort__card',
                    text: card.text,
                    attrs: { 'aria-label': '빼내기: ' + card.text },
                    on: {
                      click: (function (index) {
                        return function () {
                          var next = order();
                          next.splice(index, 1);
                          setOrder(next);
                        };
                      })(i)
                    }
                  })
                : el('span', { 'class': 'cardsort__blank', text: '비어 있음' }),
              card
                ? el('span', { 'class': 'cardsort__mark', text: right ? '맞음 ✓' : '다시 ✗' })
                : null
            ]
          )
        );
      }

      var full = placed.length === ALGORITHM_CARDS.length;
      var allRight =
        full &&
        ALGORITHM_CARDS.every(function (c, idx) {
          return placed[idx] === c.id;
        });
      if (allRight) {
        feedback.show('success', '순서가 맞아요. 파일을 읽고 → 날짜를 받고 → 찾아서 출력하고 → 없으면 안내한다.');

      } else {
        feedback.show('info', ALGORITHM_CARDS.length + '장 중 ' + placed.length + '장을 놓았어요.');
      }
    }

    paint();
  }

  /**
   * 이진 탐색 단계 시각화 (명세 4장 페이지 3 · 8.2)
   * 정렬된 날짜 카드 위에서 left · mid · right 와 버리는 범위, 탐색 횟수를 보여 준다.
   */
  function renderBinaryVisual() {
    var dates = ['0601', '0602', '0603', '0605', '0608', '0609', '0610'];
    var target = '0609';
    var stepIndex = 0;

    /** 미리 계산해 둔 단계들 */
    function buildSteps(day) {
      var steps = [];
      var left = 0;
      var right = dates.length - 1;
      var count = 0;
      while (left <= right) {
        var mid = Math.floor((left + right) / 2);
        count += 1;
        var current = dates[mid];
        var move;
        if (current === day) move = 'found';
        else if (current < day) move = 'right';
        else move = 'left';
        steps.push({ left: left, right: right, mid: mid, count: count, move: move, current: current });
        if (move === 'found') break;
        if (move === 'right') left = mid + 1;
        else right = mid - 1;
      }
      if (steps.length === 0 || steps[steps.length - 1].move !== 'found') {
        steps.push({ left: left, right: right, mid: -1, count: count, move: 'none', current: '' });
      }
      return steps;
    }

    var steps = buildSteps(target);

    var cards = el('div', { 'class': 'bsearch__cards' });
    var info = el('div', { 'class': 'bsearch__info' });
    var controls = el('div', { 'class': 'btn-row' });

    function paint() {
      var s = steps[stepIndex];
      ui.clear(cards);
      dates.forEach(function (date, i) {
        var out = i < s.left || i > s.right;
        var tags = [];
        if (i === s.left) tags.push('left');
        if (i === s.mid) tags.push('mid');
        if (i === s.right) tags.push('right');
        cards.appendChild(
          el(
            'div',
            {
              'class':
                'bsearch__card' +
                (out ? ' is-out' : '') +
                (i === s.mid ? ' is-mid' : '') +
                (s.move === 'found' && i === s.mid ? ' is-found' : '')
            },
            [
              el('span', { 'class': 'bsearch__index', text: '[' + i + ']' }),
              el('span', { 'class': 'bsearch__date', text: date }),
              el('span', { 'class': 'bsearch__tags', text: tags.join(' · ') }),
              out ? el('span', { 'class': 'bsearch__out', text: '버림' }) : null
            ]
          )
        );
      });

      ui.clear(info);

      // 마지막 단계의 횟수가 곧 «다 찾는 데 걸린 횟수» 다.
      var lastStep = steps[steps.length - 1];
      var totalCount = lastStep.count;

      // ① 몇 단계 중 몇 번째인지 — 지금 숫자가 «중간 경과» 임을 분명히 한다
      info.appendChild(
        el('p', { 'class': 'bsearch__step' }, [
          el('span', {
            'class': 'bsearch__step-no',
            text: '단계 ' + (stepIndex + 1) + ' / ' + steps.length
          }),
          el('span', {
            'class': 'bsearch__step-count',
            text:
              stepIndex + 1 < steps.length
                ? '여기까지 비교 ' + s.count + '회 (아직 진행 중)'
                : '비교 ' + s.count + '회로 끝'
          })
        ])
      );

      var lines = [
        'left = ' + s.left + ' · mid = ' + (s.mid < 0 ? '없음' : s.mid) + ' · right = ' + s.right
      ];
      if (s.move === 'found') {
        lines.push("menu[mid][:4] == day → '" + s.current + "' 를 찾았다. break 로 반복을 멈춘다.");
      } else if (s.move === 'right') {
        lines.push("menu[mid][:4] < day → '" + s.current + "' 는 너무 작다. left = mid + 1 (왼쪽 절반을 버린다)");
      } else if (s.move === 'left') {
        lines.push("menu[mid][:4] > day → '" + s.current + "' 는 너무 크다. right = mid - 1 (오른쪽 절반을 버린다)");
      } else {
        lines.push('left > right 가 되어 반복이 끝났다. find 는 False 그대로다.');
      }
      lines.forEach(function (line) {
        info.appendChild(el('p', { 'class': 'bsearch__line', text: line }));
      });

      // ② 마지막 단계에서는 «모두 몇 회였는지» 를 결론으로 적는다
      if (stepIndex + 1 === steps.length) {
        info.appendChild(
          el('p', {
            'class': 'bsearch__total',
            text:
              lastStep.move === 'found'
                ? "'" + target + "' 은(는) 모두 " + totalCount + '회 비교해서 찾았다.'
                : "'" + target + "' 은(는) " + totalCount + '회 비교했지만 찾지 못했다.'
          })
        );
      }
      ui.announce(
        '단계 ' + (stepIndex + 1) + ' / ' + steps.length + '. ' + lines.join('. ')
      );
    }

    controls.appendChild(
      ui.button({

    <script data-from="js/70-collaboration.js">
/**
 * 페이지 9 — 결과 설명 · 발표 카드 · 개인별 기여 확인 (명세 13.1 ~ 13.3)
 *
 * 자동 채점하지 않는다. 팀원의 자기 확인만으로 점수를 주지 않고,
 * 교사용에서 전체 기록을 함께 보도록 한다(명세 6.4).

(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var collab = L.collab || (L.collab = {});
  var C = L.CONST || {};

  /** 팀 결과 설명 일곱 문항 (명세 13.1) */
  var QUESTIONS = [
    { id: 'q1', text: '우리 팀이 해결하려는 문제는 무엇인가?' },
    { id: 'q2', text: '어떤 클래스를 만들었는가?' },
    { id: 'q3', text: '어떤 속성과 메소드를 정의했는가?' },
    { id: 'q4', text: '어떤 인스턴스를 만들고 값을 어떻게 다르게 설정했는가?' },
    { id: 'q5', text: '조건문은 어느 메소드에서 어떤 판단을 하는가?' },
    { id: 'q6', text: '가장 중요한 오류 또는 개선은 무엇이었는가?' },
    { id: 'q7', text: '실행 결과가 문제 해결과 어떻게 연결되는가?' }
  ];
  collab.QUESTIONS = QUESTIONS;

  /** 개인별 기여 확인 항목 (명세 13.3) */
  var CONTRIB_FIELDS = [
    { id: 'role', label: '내가 맡은 역할' },
    { id: 'did', label: '내가 실제로 기여한 일 2가지' },
    { id: 'understood', label: '내가 이해한 코드 한 부분' },
    { id: 'next', label: '다음 프로젝트에서 개선할 협력 방법' }
  ];
  collab.CONTRIB_FIELDS = CONTRIB_FIELDS;

  /* ================================================================== */
  /* 검사                                                                */
  /* ================================================================== */

  /** 설명 일곱 문항 (각 20~500자) */
  collab.validateExplanation = function (data) {
    var e = (data && data.explanation) || {};
    var min = C.EXPLAIN_MIN || 20;
    var max = C.EXPLAIN_MAX || 500;
    var problems = [];
    var done = 0;
    QUESTIONS.forEach(function (q, index) {
      var text = String(e[q.id] || '').trim();
      if (text.length === 0) return;
      if (text.length < min) {
        problems.push(index + 1 + '번 답을 ' + min + '자 이상으로 적어 주세요.');
        return;
      }
      if (text.length > max) {
        problems.push(index + 1 + '번 답이 ' + max + '자를 넘었어요.');
        return;
      }
      done += 1;
    });
    if (done < QUESTIONS.length) {
      problems.unshift('일곱 문항에 모두 답해 주세요. (' + done + '/' + QUESTIONS.length + ')');
    }
    return { ok: problems.length === 0, problems: problems, done: done };
  };

  /** 개인별 기여 확인 (팀원 수만큼) */
  collab.validateContributions = function (data) {
    var d = data || {};
    var min = C.CONTRIB_MIN || 20;
    var max = C.CONTRIB_MAX || 300;
    var problems = [];
    var members = (d.members || []).filter(function (m) {
      return String(m.name || '').trim();
    });
    if (members.length === 0) {
      return { ok: false, problems: ['5페이지에서 팀원을 먼저 등록해 주세요.'], done: 0 };
    }
    var records = d.contributionRecords || {};
    var done = 0;
    members.forEach(function (m, index) {
      var rec = records[index] || {};
      var who = m.name || '학생 ' + (index + 1);

      // 네 칸을 모두 채웠는지 먼저 본다 (빈칸이 있으면 그것부터 알려 준다)
      var empty = CONTRIB_FIELDS.filter(function (f) {
        return String(rec[f.id] || '').trim().length < 2;
      });
      if (empty.length > 0) {
        problems.push(who + ' 의 “' + empty[0].label + '” 칸이 비어 있어요.');
        return;
      }

      // 명세 13.3 : 학생별 입력은 20~300자.
      // 칸마다 20자를 강요하지 않고 «그 학생이 쓴 글 전체» 를 기준으로 본다.
      var total = CONTRIB_FIELDS.reduce(function (sum, f) {
        return sum + String(rec[f.id] || '').trim().length;
      }, 0);
      var tooLong = CONTRIB_FIELDS.filter(function (f) {
        return String(rec[f.id] || '').length > max;
      });
      if (tooLong.length > 0) {
        problems.push(who + ' 의 “' + tooLong[0].label + '” 이 ' + max + '자를 넘었어요.');
        return;
      }
      if (total < min) {
        problems.push(who + ' 의 기여 기록을 모두 합쳐 ' + min + '자 이상으로 적어 주세요. (지금 ' + total + '자)');
        return;
      }
      done += 1;
    });
    return { ok: problems.length === 0, problems: problems, done: done, total: members.length };
  };

  collab.buildPresentation = function (data) {

    var methods = (design.methods || []).filter(Boolean);
    var instances = (design.instances || [])

      })
      .map(function (i) {
        return i.objectName;
      });
    var fix = (d.improvements || [])[0] || {};

    function blank(value, hint) {
      var text = String(value || '').trim();
      return text || '______(' + hint + ')';
    }

    return [
      '우리 팀의 주제는 ' + blank(topic.title, '주제') + '입니다.',
      blank(topic.problem, '문제') + ' 문제를 해결하기 위해 ' +

        var field = ui.textAreaField({
          label: index + 1 + '. ' + q.text,
          rows: 2,
          value: (d().explanation || {})[q.id] || '',
          onInput: function (v) {

          counter.className =
            'char-count ' +
            (len === 0 ? '' : len < (C.EXPLAIN_MIN || 20) ? 'is-short' : len > (C.EXPLAIN_MAX || 500) ? 'is-over' : 'is-ok');

        paintCount();

      function paintExplainFeedback() {
        var r = collab.validateExplanation(d());
        if (r.ok) explainFeedback.show('success', '일곱 문항을 모두 적었어요.');
        else explainFeedback.show('info', r.problems.slice(0, 3).map(ui.escapeHtml).join('<br>'));

      /* ---------------- 발표 카드 ---------------- */
      var cardPanel = ui.panel({

      cardPanel.body.appendChild(

      function paintPresentation() {

      /* ---------------- 개인별 기여 확인 ---------------- */
      var contribPanel = ui.panel({

      });
      var contribBox = el('div', { 'class': 'stack' });
      contribPanel.body.appendChild(contribBox);
      var contribFeedback = ui.createFeedback({});
      contribPanel.body.appendChild(contribFeedback.root);
      container.appendChild(contribPanel.root);

      function paintContrib() {
        ui.clear(contribBox);
        var members = d().members;
        members.forEach(function (m, index) {
          if (!String(m.name || '').trim()) return;
          var role = L.findRole(m.role);
          var rec = (d().contributionRecords || {})[index] || {};
          var card = el('div', { 'class': 'contribcard' }, [
            el('div', { 'class': 'contribcard__head' }, [
              el('span', { 'class': 'contribcard__name', text: m.name }),
              el('span', { 'class': 'contribcard__role', text: role ? role.icon + ' ' + role.name : '역할 미정' })
            ])
          ]);
          CONTRIB_FIELDS.forEach(function (f) {
            var value = f.id === 'role' && !rec[f.id] && role ? role.name : rec[f.id] || '';
            card.appendChild(
              ui.textAreaField({
                label: f.label,
                rows: f.id === 'role' ? 1 : 2,
                value: value,
                placeholder:
                  f.id === 'did'
                    ? '예) 조건문을 함께 고쳤고, 두 번째 테스트를 실행했다.'
                    : f.id === 'understood'
                    ? '예) check_water 안의 if 문이 어떤 값을 비교하는지 설명할 수 있다.'
                    : '',
                onInput: function (v) {
                  save(function (s) {
                    s.contributionRecords = s.contributionRecords || {};
                    s.contributionRecords[index] = s.contributionRecords[index] || {};
                    s.contributionRecords[index][f.id] = v;

                  paintContribFeedback();

              }).root

          });

          card.appendChild(el('p', { 'class': 'field__label', text: '이번 프로젝트에서 내가 한 일 (해당되는 것 모두)' }));
          card.appendChild(

              ariaLabel: m.name + ' 의 기여 항목',
              values: m.contributions || [],
              options: (C.CONTRIBUTION_KINDS || []).map(function (k) {
                return { value: k, label: k };
              }),
              onChange: function (values) {
                save(function (s) {
                  s.members[index].contributions = values;
                });
              }
            }).root
          );
          contribBox.appendChild(card);
        });
        if (contribBox.children.length === 0) {
          contribBox.appendChild(
            el('p', { 'class': 'panel__hint', text: '5페이지에서 팀원 이름을 먼저 입력해 주세요.' })
          );
        }
        paintContribFeedback();
      }

      function paintContribFeedback() {
        var r = collab.validateContributions(d());
        if (r.ok) contribFeedback.show('success', '네 명의 기여 기록을 모두 남겼어요.');
        else contribFeedback.show('info', r.problems.slice(0, 3).map(ui.escapeHtml).join('<br>'));
      }
      paintContrib();

      L.collab.repaint = function () {
        paintContrib();
        paintPresentation();
      };
    },

    onEnter: function () {
      if (L.collab.repaint) L.collab.repaint();
    },

    check: function () {
      var e = collab.validateExplanation(d());
      if (!e.ok) return { ok: false, hint: e.problems[0] };
      var c = collab.validateContributions(d());
      if (!c.ok) return { ok: false, hint: c.problems[0] };
      return { ok: true, hint: '' };
    }
  });

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = collab;
  }
})();

    <!-- 교사용 화면 -->
    <script data-from="teacher/t10-load.js">
/**
 * 교사용 1장 — 결과 불러오기 (명세 19.1)
 *
 * 세 가지 방법을 모두 지원한다.
 *   ① Analytics.gs 를 배포한 /exec 주소로 불러오기
 *   ② JSON 파일 여러 개 고르기
 *   ③ JSON 파일 드래그 앤 드롭
 *
 * 어느 방법으로 넣든 «lesson3_8_4 팀 제출» 만 남기고, 같은 팀 코드는 최신 것만 둔다.
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var T = L.teacher || (L.teacher = {});
  var C = L.CONST || {};

  var LESSON_ID = C.LESSON_ID || 'lesson3_8_4';
  var ENDPOINT_KEY = 'lesson3_8_4_teacher_endpoint';

  /* ------------------------------------------------------------------ */
  /* 자료 정리                                                            */
  /* ------------------------------------------------------------------ */

  /** 서버·파일에서 온 아무 모양의 값에서 «제출 목록» 을 뽑아낸다. */
  T.extractRows = function (raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) {
      return raw.reduce(function (all, item) {
        return all.concat(T.extractRows(item));
      }, []);
    }
    if (typeof raw !== 'object') return [];
    // { ok:true, rows:[…] } · { items:[…] } · { data:[…] } 형태를 모두 받는다
    if (Array.isArray(raw.rows)) return T.extractRows(raw.rows);
    if (Array.isArray(raw.items)) return T.extractRows(raw.items);
    if (Array.isArray(raw.data)) return T.extractRows(raw.data);
    if (Array.isArray(raw.submissions)) return T.extractRows(raw.submissions);
    if (raw.lesson || raw.teamCode) return [raw];
    return [];
  };

  /** 4차시 팀 제출만 남기고 같은 팀은 최신 것만 둔다 (명세 17.3) */
  T.normalizeRows = function (rows) {
    var mine = (rows || []).filter(function (row) {
      return row && row.lesson === LESSON_ID;
    });

    var byTeam = {};
    mine.forEach(function (row) {
      var code = String(row.teamCode || '').trim().toUpperCase() || '(코드없음)';
      var when = row.receivedAt || row.submittedAtClient || '';
      var prev = byTeam[code];
      if (!prev) {
        byTeam[code] = row;
        return;
      }
      var prevWhen = prev.receivedAt || prev.submittedAtClient || '';
      if (String(when) >= String(prevWhen)) byTeam[code] = row;
    });

    return Object.keys(byTeam)
      .sort()
      .map(function (code) {
        return byTeam[code];
      });
  };

  /** 제출 한 건에서 화면·CSV 가 쓰는 값을 계산한다. */
  T.summarizeRow = function (row) {
    var r = row || {};
    var runtime = r.runtime || {};
    var structure = runtime.structureChecks || { passed: 0, total: C.STRUCTURE_TOTAL || 9 };
    var members = r.members || [];
    var tests = r.tests || [];
    var improvements = r.improvements || [];
    var collaboration = r.collaboration || {};

    // 협력 경고 (명세 19.5) — 경고일 뿐 점수로 바꾸지 않는다
    var warnings = [];
    var logs = r.codeLogs || [];
    var codePeople = {};
    logs.forEach(function (log) {
      if (log.author) codePeople[log.author] = true;
      (log.reviewers || []).forEach(function (name) {
        codePeople[name] = true;
      });
    });
    if (Object.keys(codePeople).length <= 1) {
      warnings.push('코드 기록에 한 학생만 등장합니다.');
    }
    var contributions = collaboration.contributions || [];
    members.forEach(function (m) {
      var found = contributions.filter(function (c) {
        return c.name === m.name;
      })[0];
      if (!found || ((found.kinds || []).length === 0 && !String(found.note || '').trim())) {
        warnings.push((m.name || '이름 없음') + ' 의 기여 기록이 없습니다.');
      }
      if (!m.role) warnings.push((m.name || '이름 없음') + ' 의 역할이 배정되지 않았습니다.');
    });
    var mutual = collaboration.mutualChecks || [];
    var doneMutual = mutual.filter(function (row2) {
      return row2.topic && row2.code && row2.run && row2.contribution;
    });
    if (mutual.length === 0 || doneMutual.length < members.length) {
      warnings.push('최종 상호 확인이 끝나지 않았습니다.');
    }

    return {
      teamCode: r.teamCode || '',
      teamName: r.teamName || '',
      topicType: (r.topic && r.topic.type) || '',
      topicTitle: (r.topic && r.topic.title) || '',
      memberCount: members.length,
      memberNames: members
        .map(function (m) {
          return m.name;
        })
        .join(', '),
      className: (r.design && r.design.className) || '',
      runOk: runtime.lastRunSucceeded === true,
      runCount: runtime.runCount || 0,
      structurePassed: structure.passed || 0,
      structureTotal: structure.total || (C.STRUCTURE_TOTAL || 9),
      structureFull: (structure.passed || 0) >= (structure.total || 9),
      testCount: tests.length,
      testPassed: tests.filter(function (t) {
        return t.passedByTeam;
      }).length,
      improvementCount: improvements.length,
      submittedAt: r.receivedAt || r.submittedAtClient || '',
      warnings: warnings,
      row: r
    };
  };

  /* ------------------------------------------------------------------ */
  /* 화면                                                                */
  /* ------------------------------------------------------------------ */

  if (typeof document === 'undefined' || !L.ui || !L.ui.el) {
    if (typeof module !== 'undefined' && module.exports) module.exports = T;
    return;
  }

  var ui = L.ui;
  var el = ui.el;

  T.rows = [];
  T.summaries = [];
  var listeners = [];

  T.onData = function (fn) {
    if (typeof fn === 'function') listeners.push(fn);
  };

  T.setRows = function (rows, source) {
    T.rows = T.normalizeRows(rows);
    T.summaries = T.rows.map(T.summarizeRow);
    listeners.forEach(function (fn) {
      try {
        fn(T.summaries, source);
      } catch (err) {
        if (window.console) window.console.error(err);
      }
    });
  };

  T.renderLoad = function (container) {
    var status = el('p', { 'class': 'runstatus', attrs: { 'aria-live': 'polite' } });

    var panel = ui.panel({
      title: '① 주소로 불러오기',
      hint: 'Analytics.gs 를 배포한 /exec 주소를 넣으면 4차시 팀 제출만 가져온다.'
    });
    var urlField = ui.textField({
      label: '조회 주소',
      value: readEndpoint(),
      width: '100%',
      align: 'left',
      placeholder: 'https://script.google.com/macros/s/…/exec',
      onInput: function (v) {
        writeEndpoint(v);
      }
    });
    panel.body.appendChild(urlField.root);
    panel.body.appendChild(
      ui.buttonRow([
        ui.button({
          label: '불러오기',
          variant: 'primary',
          onClick: function () {
            loadFromUrl(urlField.getValue());
          }
        }),
        ui.button({
          label: '주소 지우기',
          variant: 'ghost',
          onClick: function () {
            urlField.setValue('');
            writeEndpoint('');
          }
        })
      ])
    );
    panel.body.appendChild(status);
    container.appendChild(panel.root);

    var filePanel = ui.panel({
      title: '② JSON 파일로 불러오기',
      hint: '학생이 저장한 팀 프로젝트 JSON 파일을 여러 개 한 번에 고를 수 있다.'
    });
    var fileInput = el('input', {
      type: 'file',
      accept: '.json,application/json',
      multiple: true,
      'class': 'tfile',
      attrs: { 'aria-label': '결과 JSON 파일 고르기' }
    });
    fileInput.addEventListener('change', function () {
      readFiles(fileInput.files);
    });
    filePanel.body.appendChild(fileInput);

    var drop = el('div', { 'class': 'dropbox', attrs: { tabindex: '0' } }, [
      el('p', { 'class': 'dropbox__title', text: '③ 여기에 JSON 파일을 끌어다 놓기' }),
      el('p', { 'class': 'dropbox__hint', text: '여러 개를 한 번에 놓아도 된다.' })
    ]);
    ['dragenter', 'dragover'].forEach(function (type) {
      drop.addEventListener(type, function (e) {
        e.preventDefault();
        drop.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach(function (type) {
      drop.addEventListener(type, function (e) {
        e.preventDefault();
        drop.classList.remove('is-over');
      });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files) readFiles(e.dataTransfer.files);
    });
    filePanel.body.appendChild(drop);
    container.appendChild(filePanel.root);

    var notice = ui.panel({ title: '제출 자료가 없어도 됩니다' });
    notice.body.appendChild(
      ui.callout(
        '결과를 불러오지 않아도 <strong>예시 프로젝트 · 평가 기준 · 수업 지도 자료</strong>는 볼 수 있다(명세 18장). ' +
          '위 장 이동에서 2~5장을 눌러 확인해 보세요.'
      )
    );
    container.appendChild(notice.root);

    /* ------------------------------ 동작 ------------------------------ */
    function loadFromUrl(url) {
      var clean = String(url || '').trim();
      if (!clean) {
        status.textContent = '주소를 입력해 주세요.';
        return;
      }
      status.textContent = '불러오는 중…';
      fetch(clean)
        .then(function (res) {
          return res.text();
        })
        .then(function (text) {
          var data = JSON.parse(text);
          var rows = T.extractRows(data);
          T.setRows(rows, 'url');
          status.textContent =
            T.rows.length > 0
              ? T.rows.length + '개 팀의 제출을 불러왔어요.'
              : '4차시(lesson3_8_4) 팀 제출을 찾지 못했어요.';
        })
        .catch(function (err) {
          status.textContent =
            '불러오지 못했어요. 주소와 배포 권한을 확인해 주세요. (' + (err && err.message) + ')';
        });
    }

    function readFiles(fileList) {
      var files = Array.prototype.slice.call(fileList || []);
      if (files.length === 0) return;
      status.textContent = files.length + '개 파일을 읽는 중…';
      var collected = [];
      var done = 0;
      files.forEach(function (file) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            collected = collected.concat(T.extractRows(JSON.parse(String(reader.result))));
          } catch (err) {
            /* 읽지 못한 파일은 건너뛴다 */
          }
          finish();
        };
        reader.onerror = finish;
        reader.readAsText(file);
      });

      function finish() {
        done += 1;
        if (done < files.length) return;
        // 이미 불러온 것과 합친다 (여러 번 나누어 불러올 수 있게)
        T.setRows(T.rows.concat(collected), 'file');
        status.textContent =
          T.rows.length > 0
            ? '모두 ' + T.rows.length + '개 팀의 제출을 읽었어요.'
            : '4차시 팀 제출을 찾지 못했어요. 파일을 확인해 주세요.';
      }
    }
  };

  function readEndpoint() {
    try {
      return window.localStorage.getItem(ENDPOINT_KEY) || '';
    } catch (err) {
      return '';
    }
  }

  function writeEndpoint(url) {
    try {
      if (url) window.localStorage.setItem(ENDPOINT_KEY, url);
      else window.localStorage.removeItem(ENDPOINT_KEY);
    } catch (err) {
      /* 무시 */
    }
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = T;
  }
})();
