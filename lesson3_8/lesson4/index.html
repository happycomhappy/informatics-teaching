    <script data-from="js/50-design.js">
/**
 * 페이지 6 — 공동 클래스 설계 (명세 10장)
 *
 * 설계표를 채우면 «정답 코드가 아닌 뼈대» 만 만들어 준다(명세 10.3).
 * 메소드 본문과 객체 값은 7페이지에서 팀이 직접 채운다.
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var design = L.design || (L.design = {});
  var C = L.CONST || {};

  /* ================================================================== */
  /* 이름 규칙 (명세 10.2)                                                */
  /* ================================================================== */

  var PY_KEYWORDS = [
    'False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break',
    'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally',
    'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal',
    'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield',
    'print', 'self'
  ];

  /** 클래스명 검사 : PascalCase 권장 */
  design.checkClassName = function (name) {
    var value = String(name || '').trim();
    if (!value) return { ok: false, message: '클래스명을 입력해 주세요.' };
    if (/[^A-Za-z0-9_]/.test(value)) {
      return { ok: false, message: '클래스명에는 영문자와 숫자, 밑줄만 사용한다. (공백·한글 사용 안 함)' };
    }
    if (PY_KEYWORDS.indexOf(value) >= 0) {
      return { ok: false, message: '“' + value + '” 은 Python 이 이미 쓰는 말이라 이름으로 쓸 수 없다.' };
    }
    if (/^[0-9]/.test(value)) return { ok: false, message: '이름은 숫자로 시작할 수 없다.' };
    if (!/^[A-Z]/.test(value)) {
      return { ok: true, warn: true, message: '클래스명은 대문자로 시작하는 것을 권장한다. (예: Plant)' };
    }
    return { ok: true, message: '' };
  };

  /** 속성·메소드·객체명 검사 : 소문자와 밑줄 */
  design.checkIdentifier = function (name, label) {
    var value = String(name || '').trim();
    var what = label || '이름';
    if (!value) return { ok: false, message: what + '을 입력해 주세요.' };
    if (/[^A-Za-z0-9_]/.test(value)) {
      return { ok: false, message: what + ' 에는 영문자와 숫자, 밑줄만 사용한다.' };
    }
    if (PY_KEYWORDS.indexOf(value) >= 0) {
      return { ok: false, message: '“' + value + '” 은 Python 이 이미 쓰는 말이다.' };
    }
    if (/^[0-9]/.test(value)) return { ok: false, message: '이름은 숫자로 시작할 수 없다.' };
    if (/[A-Z]/.test(value)) {
      return { ok: true, warn: true, message: what + ' 은 소문자와 밑줄로 쓰는 것을 권장한다. (예: water_level)' };
    }
    return { ok: true, message: '' };
  };

  /* ================================================================== */
  /* 설계 검사 (명세 10.1 · 26.2)                                         */
  /* ================================================================== */

  design.validate = function (data) {
    var d = (data && data.design) || {};
    var problems = [];

    var cls = design.checkClassName(d.className);
    if (!cls.ok) problems.push(cls.message);
    if (String(d.classDescription || '').trim().length < 5) {
      problems.push('클래스 설명을 한 문장으로 적어 주세요.');
    }

    var props = (d.properties || []).filter(function (p) {
      return String(p || '').trim();
    });
    if (props.length < 3) problems.push('속성을 3개 이상 적어 주세요. (지금 ' + props.length + '개)');
    props.forEach(function (p) {
      var r = design.checkIdentifier(p, '속성명');
      if (!r.ok) problems.push(p + ' : ' + r.message);
    });

    var methods = (d.methods || []).filter(function (m) {
      return String(m || '').trim();
    });
    if (methods.length < 2) problems.push('메소드를 2개 이상 적어 주세요. (지금 ' + methods.length + '개)');
    methods.forEach(function (m) {
      var r = design.checkIdentifier(m, '메소드명');
      if (!r.ok) problems.push(m + ' : ' + r.message);
    });

    if (!String(d.conditionalMethod || '').trim()) {
      problems.push('조건문을 사용할 메소드를 하나 고르세요.');
    } else if (methods.indexOf(String(d.conditionalMethod).trim()) < 0) {
      problems.push('조건문 메소드는 위에 적은 메소드 중에서 고르세요.');
    }
    if (String(d.conditionalRule || '').trim().length < 5) {
      problems.push('어떤 조건에서 결과가 달라지는지 적어 주세요.');
    }

    var instances = (d.instances || []).filter(function (inst) {
      return inst && String(inst.objectName || '').trim();
    });
    if (instances.length < 2) {
      problems.push('인스턴스(객체) 이름을 2개 적어 주세요. (지금 ' + instances.length + '개)');
    }
    instances.forEach(function (inst) {
      var r = design.checkIdentifier(inst.objectName, '객체명');
      if (!r.ok) problems.push(inst.objectName + ' : ' + r.message);
    });

    // 두 객체의 값이 달라야 한다 (명세 10.1 · 26.2)
    if (instances.length >= 2) {
      var differ = false;
      props.forEach(function (p) {
        var a = String((instances[0].values || {})[p] === undefined ? '' : instances[0].values[p]).trim();
        var b = String((instances[1].values || {})[p] === undefined ? '' : instances[1].values[p]).trim();
        if (a && b && a !== b) differ = true;
      });
      var filledAll = props.every(function (p) {
        return (
          String((instances[0].values || {})[p] || '').trim() &&
          String((instances[1].values || {})[p] || '').trim()
        );
      });
      if (!filledAll) problems.push('두 객체의 속성값을 모두 채워 주세요.');
      else if (!differ) problems.push('두 객체가 «서로 다른» 값을 갖도록 적어도 한 속성의 값을 다르게 해 주세요.');
    }

    if (String(d.expectedOutput || '').trim().split('\n').filter(function (line) {
      return line.trim();
    }).length < 2) {
      problems.push('예상 출력을 2줄 이상 적어 주세요.');
    }

    return { ok: problems.length === 0, problems: problems };
  };

  /** 네 명의 설계 확인 (명세 10.4) */
  design.CHECK_ITEMS = [
    { id: 'link', label: '클래스와 문제의 연결' },
    { id: 'props', label: '속성의 필요성' },
    { id: 'methods', label: '메소드의 동작' },
    { id: 'instances', label: '두 인스턴스와 예상 출력' }
  ];

  design.validateChecks = function (data) {
    var checks = (data && data.designChecks) || [];
    var done = design.CHECK_ITEMS.filter(function (item) {
      return checks.some(function (c) {
        return c.item === item.id && String(c.note || '').trim().length >= 5;
      });
    });
    if (done.length < design.CHECK_ITEMS.length) {
      return {
        ok: false,
        problems: [
          '네 가지 설계 확인을 네 명이 나누어 기록해 주세요. (' +
            done.length + '/' + design.CHECK_ITEMS.length + ')'
        ]
      };
    }
    var seats = {};
    checks.forEach(function (c) {
      if (String(c.note || '').trim()) seats[c.seat] = true;
    });
    if (Object.keys(seats).length < design.CHECK_ITEMS.length) {
      return { ok: false, problems: ['네 항목을 서로 «다른 팀원» 이 하나씩 맡아 확인해 주세요.'] };
    }
    return { ok: true, problems: [] };
  };

  /* ================================================================== */
  /* 화면                                                                */
  /* ================================================================== */

  if (typeof document === 'undefined' || !L.registerPage) {
    if (typeof module !== 'undefined' && module.exports) module.exports = design;
    return;
  }

  var ui = L.ui;
  var el = ui.el;

  function d() {
    return L.state.get();
  }
  function save(mutator) {
    L.state.update(mutator);
    L.nav.refresh();
  }

  L.registerPage(6, {
    render: function (container) {
      container.appendChild(
        ui.pageHeader({
          page: 6,
          title: '공동 클래스 설계',
          lead: [
            '코드를 쓰기 전에 <strong>무엇을 만들지 표로 먼저 정한다.</strong>',
            '클래스 설계자가 초안을 내고 <strong>네 명이 각각 한 항목씩</strong> 확인한다.'
          ]
        })
      );

      var skeletonBox = el('div');
      var canvasFeedback = ui.createFeedback({});

      /* ---------------- 설계 캔버스 ---------------- */
      var canvas = ui.panel({
        title: '설계 캔버스',
        hint: '급식 조회 프로젝트의 “변수와 데이터 준비” 단계에 해당한다.'
      });

      var classNameField = ui.textField({
        label: '클래스명 (대문자로 시작 · 예: Plant)',
        value: d().design.className,
        width: '200px',
        align: 'left',
        onInput: function (v) {
          save(function (s) {
            s.design.className = v.trim();
          });
          paintAll();
        }
      });
      var descField = ui.textField({
        label: '클래스 설명 (한 문장)',
        value: d().design.classDescription,
        width: '100%',
        align: 'left',
        onInput: function (v) {
          save(function (s) {
            s.design.classDescription = v;
          });
          paintAll();
        }
      });
      canvas.body.appendChild(el('div', { 'class': 'row' }, [classNameField.root]));
      canvas.body.appendChild(descField.root);

      /* 속성 */
      canvas.body.appendChild(ui.sectionTitle('속성', '이 객체가 «가지고 있는 값» 3개 이상'));
      var propList = el('div', { 'class': 'designlist' });
      canvas.body.appendChild(propList);
      canvas.body.appendChild(
        ui.buttonRow([
          ui.button({
            label: '+ 속성 추가',
            variant: 'secondary',
            className: 'btn--sm',
            onClick: function () {
              save(function (s) {
                s.design.properties.push('');
              });
              paintProps();
              paintInstances();
            }
          })
        ])
      );

      function paintProps() {
        ui.clear(propList);
        d().design.properties.forEach(function (prop, index) {
          var field = ui.textField({
            value: prop,
            placeholder: '예) water_level',
            width: '180px',
            align: 'left',
            onInput: function (v) {
              save(function (s) {
                s.design.properties[index] = v.trim();
              });
              paintInstances();
              paintAll();
            }
          });
          var note = el('span', { 'class': 'designlist__note' });
          if (prop) {
            var r = design.checkIdentifier(prop, '속성명');
            note.textContent = r.ok ? (r.warn ? r.message : '좋아요 ✓') : r.message;
            note.className = 'designlist__note ' + (r.ok && !r.warn ? 'is-ok' : 'is-warn');
          }
          propList.appendChild(
            el('div', { 'class': 'designlist__row' }, [
              el('span', { 'class': 'designlist__no', text: '속성 ' + (index + 1) }),
              field.root,
              note,
              d().design.properties.length > 3
                ? ui.button({
                    label: '삭제',
                    variant: 'ghost',
                    className: 'btn--sm',
                    onClick: function () {
                      save(function (s) {
                        s.design.properties.splice(index, 1);
                      });
                      paintProps();
                      paintInstances();
                      paintAll();
                    }
                  })
                : null
            ])
          );
        });
      }

      /* 메소드 */
      canvas.body.appendChild(ui.sectionTitle('메소드', '이 객체가 «할 수 있는 일» 2개 이상'));
      var methodList = el('div', { 'class': 'designlist' });
      canvas.body.appendChild(methodList);
      canvas.body.appendChild(
        ui.buttonRow([
          ui.button({
            label: '+ 메소드 추가',
            variant: 'secondary',
            className: 'btn--sm',
            onClick: function () {
              save(function (s) {
                s.design.methods.push('');
              });
              paintMethods();
              paintCondition();
            }
          })
        ])
      );

      function paintMethods() {
        ui.clear(methodList);
        d().design.methods.forEach(function (method, index) {
          var field = ui.textField({
            value: method,
            placeholder: '예) check_water',
            width: '180px',
            align: 'left',
            onInput: function (v) {
              save(function (s) {
                s.design.methods[index] = v.trim();
              });
              paintCondition();
              paintAll();
            }
          });
          var note = el('span', { 'class': 'designlist__note' });
          if (method) {
            var r = design.checkIdentifier(method, '메소드명');
            note.textContent = r.ok ? (r.warn ? r.message : '좋아요 ✓') : r.message;
            note.className = 'designlist__note ' + (r.ok && !r.warn ? 'is-ok' : 'is-warn');
          }
          methodList.appendChild(
            el('div', { 'class': 'designlist__row' }, [
              el('span', { 'class': 'designlist__no', text: '메소드 ' + (index + 1) }),
              field.root,
              note,
              d().design.methods.length > 2
                ? ui.button({
                    label: '삭제',
                    variant: 'ghost',
                    className: 'btn--sm',
                    onClick: function () {
                      save(function (s) {
                        s.design.methods.splice(index, 1);
                      });
                      paintMethods();
                      paintCondition();
                      paintAll();
                    }
                  })
                : null
            ])
          );
        });
      }

      /* 조건 메소드 */
      canvas.body.appendChild(ui.sectionTitle('조건', '어떤 메소드가 «상황에 따라» 다르게 대답하는가'));
      var conditionBox = el('div', { 'class': 'stack' });
      canvas.body.appendChild(conditionBox);

      function paintCondition() {
        ui.clear(conditionBox);
        var methods = d().design.methods.filter(Boolean);
        var sel = ui.selectField({
          label: '조건문을 사용하는 메소드',
          value: d().design.conditionalMethod,
          options: [{ value: '', label: '— 고르기 —' }].concat(
            methods.map(function (m) {
              return { value: m, label: m + '()' };
            })
          ),
          onChange: function (v) {
            save(function (s) {
              s.design.conditionalMethod = v;
            });
            paintAll();
          }
        });
        conditionBox.appendChild(sel.root);
        conditionBox.appendChild(
          ui.textField({
            label: '어떤 조건에서 결과가 달라지는가',
            value: d().design.conditionalRule,
            placeholder: '예) water_level 이 30 이하이면 물이 필요하다고 안내한다.',
            width: '100%',
            align: 'left',
            onInput: function (v) {
              save(function (s) {
                s.design.conditionalRule = v;
              });
              paintAll();
            }
          }).root
        );
      }

      /* 인스턴스 */
      canvas.body.appendChild(ui.sectionTitle('인스턴스', '서로 «다른 값» 을 가진 객체 2개'));
      var instanceBox = el('div', { 'class': 'stack' });
      canvas.body.appendChild(instanceBox);

      function paintInstances() {
        ui.clear(instanceBox);
        var props = d().design.properties.filter(Boolean);
        d().design.instances.forEach(function (inst, index) {
          var card = el('div', { 'class': 'instcard' }, [
            el('p', { 'class': 'instcard__title', text: '객체 ' + (index + 1) }),
            ui.textField({
              label: '객체 이름',
              value: inst.objectName,
              placeholder: index === 0 ? '예) plant1' : '예) plant2',
              width: '160px',
              align: 'left',
              onInput: function (v) {
                save(function (s) {
                  s.design.instances[index].objectName = v.trim();
                });
                paintAll();
              }
            }).root
          ]);
          if (props.length === 0) {
            card.appendChild(el('p', { 'class': 'panel__hint', text: '먼저 속성을 적으면 값을 넣을 칸이 생긴다.' }));
          }
          props.forEach(function (prop) {
            card.appendChild(
              ui.textField({
                label: prop,
                value: (inst.values || {})[prop] || '',
                placeholder: '값',
                width: '140px',
                align: 'left',
                onInput: function (v) {
                  save(function (s) {
                    s.design.instances[index].values = s.design.instances[index].values || {};
                    s.design.instances[index].values[prop] = v;
                  });
                  paintAll();
                }
              }).root
            );
          });
          instanceBox.appendChild(card);
        });
      }

      /* 예상 출력 */
      canvas.body.appendChild(ui.sectionTitle('예상 출력', '실행하면 어떤 글이 나올까 (2줄 이상)'));
      canvas.body.appendChild(
        ui.textAreaField({
          rows: 3,
          code: true,
          value: d().design.expectedOutput,
          placeholder: '행운목: 물이 필요합니다.\n다육이: 상태가 좋습니다.',
          onInput: function (v) {
            save(function (s) {
              s.design.expectedOutput = v;
            });
            paintAll();
          }
        }).root
      );
      canvas.body.appendChild(canvasFeedback.root);
      container.appendChild(canvas.root);

      /* ---------------- 이름 규칙 ---------------- */
      var rules = ui.panel({ title: '이름 규칙 확인' });
      rules.body.appendChild(
        ui.dataTable({
          head: ['무엇', '규칙', '예'],
          rows: [
            ['클래스명', '영문 대문자로 시작하는 PascalCase 권장', '<code>Plant</code>, <code>SchoolBus</code>'],
            ['속성·메소드·객체명', '영문 소문자와 밑줄', '<code>water_level</code>, <code>check_water</code>, <code>plant1</code>'],
            ['쓰면 안 되는 이름', 'Python 키워드', '<code>class</code>, <code>if</code>, <code>for</code>'],
            ['이 프로젝트에서 쓰지 않음', '공백·한글 식별자', '<code>물 주기</code> ✗']
          ]
        })
      );
      container.appendChild(rules.root);

      /* ---------------- 뼈대 미리 보기 ---------------- */
      var preview = ui.panel({
        title: '클래스 구조 미리 보기',
        hint: '설계표의 «이름만» 옮긴 뼈대다. 내용은 다음 페이지에서 팀이 직접 채운다.'
      });
      preview.body.appendChild(skeletonBox);
      preview.body.appendChild(
        ui.callout(
          '이 뼈대에는 <strong>정답이 들어 있지 않다.</strong> 메소드 본문과 객체의 값은 7페이지에서 직접 쓴다.',
          { className: 'callout--muted' }
        )
      );
      container.appendChild(preview.root);

      /* ---------------- 4인 설계 확인 ---------------- */
      var confirm = ui.panel({
        title: '네 명의 설계 확인',
        hint: '네 항목을 한 명씩 맡아 확인하고 한 줄로 기록한다. (명세 10.4)'
      });
      var checkBox = el('div', { 'class': 'stack' });
      confirm.body.appendChild(checkBox);
      var checkFeedback = ui.createFeedback({});
      confirm.body.appendChild(checkFeedback.root);
      container.appendChild(confirm.root);

      function paintChecks() {
        ui.clear(checkBox);
        var members = d().members;
        design.CHECK_ITEMS.forEach(function (item) {
          var saved =
            (d().designChecks || []).filter(function (c) {
              return c.item === item.id;
            })[0] || {};
          var row = el('div', { 'class': 'checkrow' }, [
            el('p', { 'class': 'checkrow__title', text: item.label }),
            ui.selectField({
              label: '확인한 사람',
              value: saved.seat === undefined ? '' : String(saved.seat),
              options: [{ value: '', label: '— 고르기 —' }].concat(
                members.map(function (m, i) {
                  var role = L.findRole(m.role);
                  return {
                    value: String(i),
                    label: (m.name || '학생 ' + (i + 1)) + (role ? ' · ' + role.name : '')
                  };
                })
              ),
              onChange: function (v) {
                setCheck(item.id, { seat: v === '' ? undefined : Number(v) });
              }
            }).root,
            ui.textField({
              label: '확인한 내용 (한 줄)',
              value: saved.note || '',
              placeholder: item.id === 'link' ? '예) 화분 상태를 한 구조로 관리해서 문제와 잘 맞는다.' : '한 줄로 적기',
              width: '100%',
              align: 'left',
              onInput: function (v) {
                setCheck(item.id, { note: v });
              }
            }).root
          ]);
          checkBox.appendChild(row);
        });
        paintCheckFeedback();
      }

      function setCheck(itemId, patch) {
        save(function (s) {
          s.designChecks = s.designChecks || [];
          var found = null;
          s.designChecks.forEach(function (c) {
            if (c.item === itemId) found = c;
          });
          if (!found) {
            found = { item: itemId, seat: undefined, note: '', at: '' };
            s.designChecks.push(found);
          }
          if (patch.seat !== undefined || 'seat' in patch) found.seat = patch.seat;
          if (patch.note !== undefined) found.note = patch.note;
          found.at = new Date().toISOString();
        });
        paintCheckFeedback();
      }

      function paintCheckFeedback() {
        var result = design.validateChecks(d());
        if (result.ok) checkFeedback.show('success', '네 명이 설계를 모두 확인했어요.');
        else checkFeedback.show('info', result.problems.join('<br>'));
      }

      /* ---------------- 다시 그리기 ---------------- */
      function paintAll() {
        ui.clear(skeletonBox);
        skeletonBox.appendChild(
          ui.codeBlock({
            title: '자동 생성된 뼈대 (정답 아님)',
            code: L.structure.buildSkeleton(d().design),
            note: '복사해서 7페이지 편집기에 붙여 넣고 직접 완성한다.'
          })
        );
        var result = design.validate(d());
        if (result.ok) canvasFeedback.show('success', '설계표의 필수 항목을 모두 채웠어요.');
        else canvasFeedback.show('info', result.problems.slice(0, 4).map(ui.escapeHtml).join('<br>'));
      }

      paintProps();
      paintMethods();
      paintCondition();
      paintInstances();
      paintChecks();
      paintAll();
    },

    onEnter: function () {
      L.nav.refresh();
    },

    check: function () {
      var r = design.validate(d());
      if (!r.ok) return { ok: false, hint: r.problems[0] };
      var c = design.validateChecks(d());
      if (!c.ok) return { ok: false, hint: c.problems[0] };
      return { ok: true, hint: '' };
    }
  });

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = design;
  }
})();
    </script>
    <script data-from="js/60-editor.js">
/**
 * 코드 편집기 + 페이지 7 (Python 공동 구현·실행) — 명세 11장
 *
 * 편집기는 외부 라이브러리 없이 만든다(명세 11.1 : 외부 CDN 에 의존하지 않는다).
 *   textarea 위에 «구문 강조된 그림» 을 겹쳐 놓는 방식이다.
 *   - 글자는 textarea 가 담당(입력·실행 취소·다시 실행·복사는 브라우저 기본 기능 그대로)
 *   - 색은 뒤에 깔린 pre 가 담당
 *   - 줄 번호는 왼쪽 칸에 따로 그린다
 *   세 층의 글꼴·줄 높이·여백이 «똑같아야» 글자가 어긋나지 않는다(editor.css).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;

  /* ================================================================== */
  /* 편집기                                                              */
  /* ================================================================== */

  /**
   * 편집기를 만든다.
   *   createEditor({ value, onChange(code), onRun() })
   */
  L.editor.create = function (opts) {
    var o = opts || {};
    var fontSize = 15;

    var gutter = el('div', { 'class': 'editor__gutter', attrs: { 'aria-hidden': 'true' } });
    var highlight = el('pre', { 'class': 'editor__highlight', attrs: { 'aria-hidden': 'true' } });
    var highlightCode = el('code');
    highlight.appendChild(highlightCode);

    var textarea = el('textarea', {
      'class': 'editor__input',
      spellcheck: false,
      value: o.value || '',
      attrs: {
        'aria-label': '팀 Python 코드 편집기',
        autocapitalize: 'off',
        autocorrect: 'off',
        wrap: 'off'
      }
    });

    var surface = el('div', { 'class': 'editor__surface' }, [highlight, textarea]);
    var body = el('div', { 'class': 'editor__body' }, [gutter, surface]);

    var findBar = el('div', { 'class': 'editor__find', hidden: true });
    var findInput = el('input', {
      type: 'text',
      'class': 'num-input',
      placeholder: '찾을 내용',
      attrs: { 'aria-label': '코드에서 찾기' }
    });
    var findInfo = el('span', { 'class': 'editor__find-info', attrs: { 'aria-live': 'polite' } });

    var root = el('div', { 'class': 'editor' }, [
      el('div', { 'class': 'editor__toolbar' }, [
        el('span', { 'class': 'editor__title', text: 'Python 코드 (팀 공동 작성)' }),
        el('div', { 'class': 'editor__tools' }, [
          toolButton('가-', '글자 작게', function () {
            setFontSize(fontSize - 1);
          }),
          toolButton('가+', '글자 크게', function () {
            setFontSize(fontSize + 1);
          }),
          toolButton('찾기', '코드에서 찾기 (Ctrl+F)', function () {
            toggleFind();
          }),

            root.classList.toggle('is-full');
            var on = root.classList.contains('is-full');
            document.body.classList.toggle('is-editor-full', on);
            ui.announce(on ? '편집기 전체 화면' : '편집기 보통 화면');
            paint();
          })
        ])
      ]),
      findBar,
      body,
      el('p', { 'class': 'editor__hint' }, [
        el('span', { text: 'Tab = 공백 4칸 · Ctrl+Enter = 실행 · Esc = 편집기 밖으로 나가기' })
      ])
    ]);

    findBar.appendChild(findInput);
    findBar.appendChild(
      ui.button({
        label: '다음 찾기',
        variant: 'secondary',
        className: 'btn--sm',
        onClick: function () {
          findNext();
        }
      })
    );

    findBar.appendChild(
      ui.button({
        label: '닫기',
        variant: 'ghost',
        className: 'btn--sm',
        onClick: function () {
          toggleFind(false);
        }
      })
    );

    function toolButton(label, title, onClick) {
      return el('button', {
        type: 'button',
        'class': 'editor__tool',
        text: label,
        attrs: { title: title, 'aria-label': title },
        on: { click: onClick }
      });
    }

    function setFontSize(next) {
      fontSize = Math.max(12, Math.min(24, next));
      root.style.setProperty('--editor-font-size', fontSize + 'px');
      ui.announce('코드 글자 크기 ' + fontSize + '픽셀');
    }
    setFontSize(fontSize);

    /* --------------------------- 그리기 --------------------------- */
    function paint() {
      var code = textarea.value;
      highlightCode.innerHTML = L.highlightPython(code) + '\n';
      var lines = code.split('\n').length;
      var wanted = String(lines);
      if (gutter.dataset.lines !== wanted) {
        gutter.dataset.lines = wanted;
        ui.clear(gutter);
        for (var i = 1; i <= lines; i += 1) {
          gutter.appendChild(el('span', { 'class': 'editor__lineno', text: String(i) }));
        }
      }
      syncScroll();
    }

    function syncScroll() {
      highlight.scrollTop = textarea.scrollTop;
      highlight.scrollLeft = textarea.scrollLeft;
      gutter.scrollTop = textarea.scrollTop;
    }

    textarea.addEventListener('input', function () {
      paint();
      if (o.onChange) o.onChange(textarea.value);
    });
    textarea.addEventListener('scroll', syncScroll);

    /* --------------------------- 키 처리 --------------------------- */
    textarea.addEventListener('keydown', function (e) {
      // Ctrl+Enter : 실행 (명세 11.1)
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (o.onRun) o.onRun();
        return;
      }
      // Ctrl+F : 찾기
      if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        toggleFind(true);
        return;
      }
      // Esc : 편집기 밖으로 (명세 22장 — 키보드 포커스 탈출)
      if (e.key === 'Escape') {
        if (!findBar.hidden) {
          toggleFind(false);
          return;
        }
        e.preventDefault();
        root.classList.remove('is-full');
        document.body.classList.remove('is-editor-full');
        var next = root.parentNode ? root.parentNode.querySelector('.btn--primary') : null;
        if (next) next.focus();
        ui.announce('편집기에서 나왔어요.');
        return;
      }
      // Tab : 공백 4칸 (Shift+Tab 은 내어쓰기)
      if (e.key === 'Tab') {
        e.preventDefault();
        if (e.shiftKey) outdent();
        else insertAtCursor('    ');
        return;
      }
      // Enter : 앞 줄의 들여쓰기를 이어 준다 (콜론 뒤에는 4칸 더)
      if (e.key === 'Enter') {
        var start = textarea.selectionStart;
        var before = textarea.value.slice(0, start);
        var lineStart = before.lastIndexOf('\n') + 1;
        var line = before.slice(lineStart);
        var indent = (line.match(/^[ ]*/) || [''])[0];
        if (/:\s*$/.test(line)) indent += '    ';
        if (indent) {
          e.preventDefault();
          insertAtCursor('\n' + indent);
        }
        return;
      }
      // 자동 닫기 최소 지원 (명세 11.1)
      var pairs = { '(': ')', '[': ']', '{': '}', "'": "'", '"': '"' };
      if (pairs[e.key] && textarea.selectionStart === textarea.selectionEnd) {
        var nextChar = textarea.value[textarea.selectionStart] || '';
        if (nextChar === '' || /[\s)\]}:,]/.test(nextChar)) {
          e.preventDefault();
          var pos = textarea.selectionStart;
          insertAtCursor(e.key + pairs[e.key]);
          textarea.selectionStart = textarea.selectionEnd = pos + 1;
        }
      }
    });

    /** 브라우저의 실행 취소 기록을 살리려면 execCommand 로 넣어야 한다. */
    function insertAtCursor(text) {
      textarea.focus();
      var inserted = false;
      try {
        inserted = document.execCommand('insertText', false, text);
      } catch (err) {
        inserted = false;
      }
      if (!inserted) {
        var start = textarea.selectionStart;
        var end = textarea.selectionEnd;
        textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
        textarea.selectionStart = textarea.selectionEnd = start + text.length;
      }
      paint();
      if (o.onChange) o.onChange(textarea.value);
    }

    function outdent() {
      var start = textarea.selectionStart;
      var value = textarea.value;
      var lineStart = value.lastIndexOf('\n', start - 1) + 1;
      var head = value.slice(lineStart, lineStart + 4);
      var remove = 0;
      for (var i = 0; i < head.length; i += 1) {
        if (head[i] === ' ') remove += 1;
        else break;
      }
      if (remove === 0) return;
      textarea.value = value.slice(0, lineStart) + value.slice(lineStart + remove);
      textarea.selectionStart = textarea.selectionEnd = Math.max(lineStart, start - remove);
      paint();
      if (o.onChange) o.onChange(textarea.value);
    }

    /* --------------------------- 찾기 --------------------------- */
    var lastFind = -1;
    function toggleFind(force) {
      var show = force === undefined ? findBar.hidden : force;
      findBar.hidden = !show;
      if (show) findInput.focus();
      else textarea.focus();
    }
    function findNext() {
      var needle = findInput.value;
      if (!needle) {
        findInfo.textContent = '';
        return;
      }
      var from = lastFind + 1;
      var at = textarea.value.indexOf(needle, from);
      if (at < 0) at = textarea.value.indexOf(needle, 0);
      if (at < 0) {
        findInfo.textContent = '찾지 못했어요.';
        lastFind = -1;
        return;
      }
      lastFind = at;
      textarea.focus();
      textarea.setSelectionRange(at, at + needle.length);
      var line = textarea.value.slice(0, at).split('\n').length;
      findInfo.textContent = line + '번째 줄';
    }
    findInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        findNext();
      }
    });

    paint();

    return {
      root: root,
      textarea: textarea,
      getValue: function () {
        return textarea.value;
      },
      setValue: function (code) {
        textarea.value = String(code === undefined || code === null ? '' : code);
        paint();
        if (o.onChange) o.onChange(textarea.value);
      },
      focus: function () {
        textarea.focus();
      },
      /** 오류가 난 줄을 표시한다. */
      markLine: function (line) {
        ui.$$('.editor__lineno', gutter).forEach(function (node, index) {
          node.classList.toggle('is-error', index + 1 === line);
        });
      },
      clearMarks: function () {
        ui.$$('.editor__lineno', gutter).forEach(function (node) {
          node.classList.remove('is-error');
        });
      }
    };
  };

   * 실행이 아니라 글자 검사이므로 언제든 즉시 끝난다.
   */
  L.editor.checkStructure = function (options) {
    var o = options || {};
    var code = d().code;
    var summary = L.structure.summarize(L.structure.analyze(code));

    L.state.update(
      function (s) {
        s.runtime.checkedAt = new Date().toISOString();
        s.runtime.structureChecks = {
          passed: summary.passed,
          total: summary.total,
          details: summary.items.map(function (i) {
            return { id: i.id, label: i.label, ok: i.ok, detail: i.detail };
          })
        };
      },
      { immediate: true }
    );

    if (o.saveVersion) {
      L.state.saveVersion({
        code: code,
        summary: o.summary || '구조 검사 · ' + summary.text,
        author: o.author || '',
        reviewers: o.reviewers || [],
        succeeded: d().runtime.lastRunSucceeded === true
      });
    }
    L.nav.refresh();
    return summary;
  };

                      savedAt: new Date().toISOString()
                    });
                  },
                  { immediate: true }
                );
                L.state.saveVersion({
                  code: d().code,
                  summary: summary,
                  author: authorField.getValue(),
                  reviewers: reviewers.getValues(),
                  succeeded: d().runtime.lastRunSucceeded
                });
                ui.toast('저장 기록을 남겼어요.');
                paintLogs();
                paintLogForm();
                L.nav.refresh();
              }
            })
          ])
        );
      }

      /** 코드를 저장하고 구조 검사를 다시 한다 (Ctrl+Enter 로도 부른다) */
      function doCheck() {
        var code = editor.getValue();
        if (!code.trim()) {
          setStatus('먼저 코드를 작성해 주세요.');
          return;
        }
        L.state.update(
          function (s) {
            s.code = code;
          },
          { immediate: true }
        );
        var summary = L.editor.checkStructure({ saveVersion: true });
        paintStructure();
        setStatus(
          '구조 검사 · ' + summary.text +
            (summary.allPassed ? ' — 필요한 구조를 모두 갖췄어요.' : ' — 남은 항목을 확인해 보세요.')
        );
        ui.announce('구조 검사 결과 ' + summary.text);
      }

      /** 코드를 밖으로 가져간 기록 (안내용) */
      function markExported(how) {
        L.state.update(
          function (s) {
            s.runtime.exportedAt = new Date().toISOString();
            s.runtime.exportedHow = how;
          },
          { immediate: true }
        );
        paintExportNote();
      }

      function paintExportNote() {
        var s = d().runtime;
        exportNote.textContent = s.exportedAt
          ? '마지막으로 코드를 가져간 때 · ' + ui.formatTime(s.exportedAt) + ' (' + (s.exportedHow || '') + ')'
          : '아직 코드를 복사하거나 저장하지 않았어요.';
      }

      paintRecap();
      paintStructure();
      paintLogs();
      paintLogForm();
      paintQuickScan(d().code);
      paintExportNote();

      L.editor.instance = editor;
      L.editor.repaint = function () {
        paintRecap();
        paintStructure();
        paintLogs();
        paintExportNote();

    },

    onEnter: function () {
      if (L.editor.repaint) L.editor.repaint();

    check: function () {

      var summary = L.editor.lastStructure();
      if (!s.code || !s.code.trim()) return { ok: false, hint: '편집기에 코드를 작성해 주세요.' };
      if (!summary.allPassed) {
        return {
          ok: false,
          hint: '필수 구조 ' + summary.text + '. 남은 항목을 채워 다시 검사해 주세요.'
        };
      }
      var people = {};
      (s.codeLogs || []).forEach(function (log) {
        if (log.author) people[log.author] = true;
        (log.reviewers || []).forEach(function (r) {
          people[r] = true;
        });
      });
      if (Object.keys(people).length < 2) {
        return { ok: false, hint: '코드 저장 기록에 두 명 이상이 등장해야 해요. (작성자 · 함께 본 사람)' };

    <script data-from="js/62-structure-check.js">
/**
 * 필수 구조 검사 (명세 11.5 · 20.4)
 *
 * ★ 이 웹앱은 Python 을 실행하지 않는다(명세 2.2).
 *   그래서 «코드의 글자를 읽어» 아홉 항목을 확인한다.
 *   실행이 아니므로 결과가 실제 동작과 다를 수 있고, 화면에 그 사실을 밝힌다.
 *
 * 읽는 방법 (명세 20.4)
 *   1) 주석을 뗀다. 문자열 안의 # 은 주석으로 보지 않는다.
 *   2) 들여쓰기 깊이로 «클래스 안» 과 «메소드 안» 을 가른다.
 *   3) 클래스 · self.속성 · def · 객체 = 클래스() · 객체.메소드() · print() 를 찾는다.
 *
 * 이 파일은 화면(document)이 없어도 동작한다. Node 테스트에서 그대로 불러 쓴다.
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var structure = L.structure || (L.structure = {});

  /** 아홉 항목 (명세 11.5) */
  var DEFS = [
    { id: 'class', label: '클래스 1개 이상', help: 'class 이름: 으로 클래스를 만든다.' },
    { id: 'attributes', label: '속성 대입 3개 이상', help: '__init__ 안에서 self.속성 = 값 을 세 번 이상 쓴다.' },
    { id: 'methods', label: '메소드 정의 2개 이상', help: '클래스 안에 def 를 두 개 이상 만든다.' },
    { id: 'self', label: '메소드의 첫 매개변수가 self', help: 'def 메소드이름(self): 형태로 쓴다.' },
    { id: 'condition', label: '메소드 안 조건문 1개 이상', help: '메소드 안에서 if 로 상황을 나눈다.' },
    { id: 'instances', label: '객체 생성 2개 이상', help: '객체1 = 클래스(), 객체2 = 클래스() 처럼 두 개를 만든다.' },
    { id: 'different', label: '두 객체에 넣은 값이 서로 다름', help: '두 객체에 서로 다른 값을 넣는다.' },
    { id: 'calls', label: '두 객체에서 메소드 호출', help: '객체1.메소드(), 객체2.메소드() 를 모두 부른다.' },
    { id: 'output', label: '출력 2줄 이상', help: 'print() 로 결과를 두 줄 이상 보여 준다.' }
  ];

  structure.DEFS = DEFS;
  structure.TOTAL = DEFS.length;

  /** 화면에 늘 함께 보여 줄 한계 안내 (명세 20.4) */
  structure.LIMIT_NOTE =
    '이 검사는 코드를 «읽어» 확인한 결과이며 실제 실행이 아니다. 정확한 동작은 직접 실행해 확인한다.';

  /* ================================================================== */
  /* 코드 읽기 도구                                                      */
  /* ================================================================== */

  /** 한 줄에서 주석을 뗀다. 문자열 안의 # 은 그대로 둔다. */
  function stripComment(line) {
    var out = '';
    var quote = null;
    for (var i = 0; i < line.length; i += 1) {
      var ch = line[i];
      if (quote) {
        out += ch;
        if (ch === '\\') {
          if (i + 1 < line.length) {
            out += line[i + 1];
            i += 1;
          }
          continue;
        }
        if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'") {
        quote = ch;
        out += ch;
        continue;
      }
      if (ch === '#') break;
      out += ch;
    }
    return out;
  }

  /** 한 줄에서 주석과 «문자열 속 내용» 을 함께 뗀다(이름을 찾을 때 쓴다). */
  function stripStrings(line) {
    var out = '';
    var quote = null;
    for (var i = 0; i < line.length; i += 1) {
      var ch = line[i];
      if (quote) {
        if (ch === '\\') {
          i += 1;
          continue;
        }
        if (ch === quote) {
          quote = null;
          out += '""'; // 문자열이 있었다는 자리만 남긴다
        }
        continue;
      }
      if (ch === '"' || ch === "'") {
        quote = ch;
        continue;
      }
      if (ch === '#') break;
      out += ch;
    }
    if (quote) out += '""'; // 줄 안에서 닫히지 않은 문자열
    return out;
  }

  /** 코드를 줄 단위 정보로 바꾼다. */
  function readLines(code) {
    return String(code === undefined || code === null ? '' : code)
      .split('\n')
      .map(function (raw, index) {
        var noComment = stripComment(raw);
        var bare = stripStrings(raw);
        var match = noComment.match(/^[ \t]*/);
        var indentText = match ? match[0] : '';
        var indent = indentText.replace(/\t/g, '    ').length;
        return {
          no: index + 1,
          raw: raw,
          code: noComment, // 문자열은 살아 있다 (값 비교에 쓴다)
          bare: bare.trim(), // 이름만 남긴 형태
          text: noComment.trim(),
          indent: noComment.trim() === '' ? -1 : indent
        };
      });
  }

  /** start 다음 줄부터, 들여쓰기가 baseIndent 보다 깊은 «블록» 을 돌려준다. */
  function blockOf(lines, start, baseIndent) {
    var body = [];
    for (var i = start + 1; i < lines.length; i += 1) {
      var line = lines[i];
      if (line.indent < 0) {
        body.push(line); // 빈 줄은 블록을 끊지 않는다
        continue;
      }
      if (line.indent <= baseIndent) break;
      body.push(line);
    }
    return body;
  }

  /* ================================================================== */
  /* 코드 살펴보기                                                       */
  /* ================================================================== */

  /**
   * 코드에서 클래스·메소드·속성·객체·호출·출력을 찾아낸다.
   * (검사 결과를 만들기 전 단계. 테스트에서 이 결과를 직접 확인한다.)
   */
  structure.inspect = function (code) {
    var lines = readLines(code);

    var classes = [];
    var methods = []; // { className, name, params, selfOk, ifs, prints, attributes[] }
    var attributes = {};
    var instances = []; // { objectName, className, args }
    var calls = []; // { objectName, methodName }
    var assigns = []; // { objectName, attribute, value }  (객체.속성 = 값)
    var modulePrints = 0;

    lines.forEach(function (line, index) {
      if (line.indent < 0) return;

      /* --- 클래스 --- */
      var classMatch = line.bare.match(/^class\s+([A-Za-z_][A-Za-z0-9_]*)\s*(\([^)]*\))?\s*:/);
      if (classMatch) {
        var className = classMatch[1];
        classes.push({ name: className, line: line.no, indent: line.indent });

        blockOf(lines, index, line.indent).forEach(function (inner, innerIndex) {
          if (inner.indent < 0) return;
          var defMatch = inner.bare.match(/^(?:async\s+)?def\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(([^)]*)\)\s*:/);
          if (!defMatch) return;

          var params = defMatch[2]
            .split(',')
            .map(function (p) {
              return p.trim();
            })
            .filter(Boolean);
          var absoluteIndex = lines.indexOf(inner);
          var body = blockOf(lines, absoluteIndex, inner.indent);

          var method = {
            className: className,
            name: defMatch[1],
            params: params,
            selfOk: params.length > 0 && params[0].split('=')[0].trim() === 'self',
            line: inner.no,
            ifs: 0,
            prints: 0,
            attributes: []
          };

          body.forEach(function (b) {
            if (b.indent < 0) return;
            if (/^(if|elif)\s+/.test(b.bare)) method.ifs += 1;
            var printCount = (b.bare.match(/\bprint\s*\(/g) || []).length;
            method.prints += printCount;
            var attrMatch = b.code.trim().match(/^self\.([A-Za-z_][A-Za-z0-9_]*)\s*(?::[^=]+)?=[^=]/);
            if (attrMatch) {
              method.attributes.push(attrMatch[1]);
              attributes[attrMatch[1]] = true;
            }
          });

          methods.push(method);
        });
        return;
      }

      /* --- 클래스 밖(모듈 수준)에서 하는 일 --- */
      if (line.indent > 0) return;

      // 객체 = 클래스(...)
      var newMatch = line.code.trim().match(
        /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*([A-Za-z_][A-Za-z0-9_]*)\s*\((.*)\)\s*$/
      );
      if (newMatch) {
        instances.push({
          objectName: newMatch[1],
          className: newMatch[2],
          args: newMatch[3].trim(),
          line: line.no
        });
      }

      // 객체.속성 = 값
      var setMatch = line.code.trim().match(
        /^([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/
      );
      if (setMatch && !/==/.test(setMatch[3].slice(0, 1))) {
        assigns.push({
          objectName: setMatch[1],
          attribute: setMatch[2],
          value: setMatch[3].trim(),
          line: line.no
        });
      }

      // 객체.메소드(...)
      var callRe = /([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)\s*\(/g;
      var found;
      while ((found = callRe.exec(line.bare)) !== null) {
        calls.push({ objectName: found[1], methodName: found[2] });
      }

      modulePrints += (line.bare.match(/\bprint\s*\(/g) || []).length;
    });

    // 우리가 만든 클래스로 만든 객체만 남긴다
    var classNames = classes.map(function (c) {
      return c.name;
    });
    var ownInstances = instances.filter(function (inst) {
      return classNames.indexOf(inst.className) >= 0;
    });
    var instanceNames = ownInstances.map(function (inst) {
      return inst.objectName;
    });

    return {
      lines: lines,
      classes: classes,
      classNames: classNames,
      methods: methods,
      attributes: Object.keys(attributes),
      instances: ownInstances,
      instanceNames: instanceNames,
      calls: calls.filter(function (call) {
        return instanceNames.indexOf(call.objectName) >= 0;
      }),
      assigns: assigns.filter(function (a) {
        return instanceNames.indexOf(a.objectName) >= 0;
      }),
      modulePrints: modulePrints
    };
  };

  /* ------------------------------------------------------------------ */
  /* 두 객체에 넣은 값이 다른지                                           */
  /* ------------------------------------------------------------------ */

  function valuesDiffer(info) {
    var instances = info.instances;
    if (instances.length < 2) return { ok: false, detail: '객체가 2개 미만입니다.' };

    // ① 생성자에 넣은 값 비교 : plant1 = Plant('행운목', 20) vs Plant('다육이', 80)
    for (var i = 0; i < instances.length; i += 1) {
      for (var j = i + 1; j < instances.length; j += 1) {
        var a = instances[i];
        var b = instances[j];
        var argsA = a.args.replace(/\s+/g, '');
        var argsB = b.args.replace(/\s+/g, '');
        if (argsA && argsB && argsA !== argsB) {
          return {
            ok: true,
            detail: a.objectName + ' 와 ' + b.objectName + ' 에 넣은 값이 다릅니다.'
          };
        }
      }
    }

    // ② 나중에 넣은 값 비교 : plant1.water_level = 20 / plant2.water_level = 80
    var byAttr = {};
    info.assigns.forEach(function (item) {
      byAttr[item.attribute] = byAttr[item.attribute] || {};
      byAttr[item.attribute][item.objectName] = item.value.replace(/\s+/g, '');
    });
    var attrs = Object.keys(byAttr);
    for (var k = 0; k < attrs.length; k += 1) {
      var owners = Object.keys(byAttr[attrs[k]]);
      for (var m = 0; m < owners.length; m += 1) {
        for (var n = m + 1; n < owners.length; n += 1) {
          if (byAttr[attrs[k]][owners[m]] !== byAttr[attrs[k]][owners[n]]) {
            return {
              ok: true,
              detail: owners[m] + ' 와 ' + owners[n] + ' 의 ' + attrs[k] + ' 값이 다릅니다.'
            };
          }
        }
      }
    }

    return { ok: false, detail: '두 객체에 같은 값을 넣은 것으로 보입니다.' };
  }

  /** 출력이 몇 줄쯤 나올지 어림한다 (모듈 print + 호출된 메소드 안 print) */
  function estimateOutput(info) {
    var total = info.modulePrints;
    var classOf = {};
    info.instances.forEach(function (inst) {
      classOf[inst.objectName] = inst.className;
    });
    info.calls.forEach(function (call) {
      var className = classOf[call.objectName];
      info.methods.forEach(function (method) {
        if (method.className === className && method.name === call.methodName) {
          total += method.prints;
        }
      });
    });
    return total;
  }

  /* ================================================================== */
  /* 아홉 항목 검사                                                      */
  /* ================================================================== */

  /**
   * 코드를 읽어 아홉 항목을 확인한다.
   * 결과 모양 : { passed, total, details:[{id,label,ok,detail}] }
   */
  structure.analyze = function (code) {
    var info = structure.inspect(code);
    var different = valuesDiffer(info);
    var outputLines = estimateOutput(info);

    var calledObjects = [];
    info.calls.forEach(function (call) {
      if (calledObjects.indexOf(call.objectName) < 0) calledObjects.push(call.objectName);
    });

    var withSelf = info.methods.filter(function (m) {
      return m.selfOk;
    });
    var ifCount = info.methods.reduce(function (sum, m) {
      return sum + m.ifs;
    }, 0);

    var details = [
      {
        id: 'class',
        ok: info.classes.length >= 1,
        detail: '찾은 클래스 : ' + (info.classNames.join(', ') || '없음')
      },
      {
        id: 'attributes',
        ok: info.attributes.length >= 3,
        detail: 'self 로 만든 속성 : ' + (info.attributes.join(', ') || '없음')
      },
      {
        id: 'methods',
        ok: info.methods.length >= 2,
        detail:
          '찾은 메소드 : ' +
          (info.methods
            .map(function (m) {
              return m.className + '.' + m.name;
            })
            .join(', ') || '없음')
      },
      {
        id: 'self',
        ok: info.methods.length >= 1 && withSelf.length === info.methods.length,
        detail:
          info.methods.length === 0
            ? '메소드가 없습니다.'
            : withSelf.length === info.methods.length
            ? '모든 메소드의 첫 자리가 self 입니다.'
            : '첫 자리가 self 가 아닌 메소드 : ' +
              info.methods
                .filter(function (m) {
                  return !m.selfOk;
                })
                .map(function (m) {
                  return m.name;
                })
                .join(', ')
      },
      {
        id: 'condition',
        ok: ifCount >= 1,
        detail: '메소드 안 if 개수 : ' + ifCount
      },
      {
        id: 'instances',
        ok: info.instanceNames.length >= 2,
        detail: '만든 객체 : ' + (info.instanceNames.join(', ') || '없음')
      },
      {
        id: 'different',
        ok: different.ok,
        detail: different.detail
      },
      {
        id: 'calls',
        ok: calledObjects.length >= 2,
        detail: '메소드를 부른 객체 : ' + (calledObjects.join(', ') || '없음')
      },
      {
        id: 'output',
        ok: outputLines >= 2,
        detail: '예상 출력 줄 수 : 약 ' + outputLines + '줄'
      }
    ];

    // 이름표는 DEFS 한 곳에서만 관리한다
    details.forEach(function (item) {
      var def = DEFS.filter(function (d) {
        return d.id === item.id;
      })[0];
      item.label = def ? def.label : item.id;
    });

    var passed = details.filter(function (item) {
      return item.ok;
    }).length;

    return { passed: passed, total: DEFS.length, details: details };
  };

  /**
   * 검사 결과를 화면·제출용으로 정리한다.
   * analyze() 결과를 그대로 넣어도 되고, 예전에 저장해 둔 결과를 넣어도 된다.
   */
  structure.summarize = function (raw) {
    var byId = {};
    if (raw && Array.isArray(raw.details)) {
      raw.details.forEach(function (item) {
        if (item && item.id) byId[item.id] = item;
      });
    }
    var items = DEFS.map(function (def) {
      var found = byId[def.id];
      return {
        id: def.id,
        label: def.label,
        help: def.help,
        ok: Boolean(found && found.ok),
        detail: (found && found.detail) || ''
      };
    });
    var passed = items.filter(function (i) {
      return i.ok;
    }).length;
    return {
      passed: passed,
      total: DEFS.length,
      items: items,
      allPassed: passed === DEFS.length,
      text: DEFS.length + '개 중 ' + passed + '개 충족'
    };
  };

  /* ================================================================== */
  /* 작성 규칙 안내 (명세 11.3)                                          */
  /* ================================================================== */

  var QUICK_RULES = [
    { re: /(^|[^.\w])import\s+\w/, message: 'import 는 쓰지 않는다. 기본 문법만으로 만든다.' },
    { re: /(^|[^.\w])from\s+\w+\s+import\s/, message: 'from ... import ... 는 쓰지 않는다.' },
    { re: /(^|[^.\w])open\s*\(/, message: '파일을 여는 open() 대신 리스트로 자료를 직접 준비한다.' },
    { re: /(^|[^.\w])input\s*\(/, message: 'input() 대신 코드 안에 테스트 값을 직접 적는다.' },
    { re: /(^|[^.\w])eval\s*\(/, message: 'eval() 은 쓰지 않는다.' },
    { re: /(^|[^.\w])exec\s*\(/, message: 'exec() 는 쓰지 않는다.' },
    { re: /(^|[^.\w])compile\s*\(/, message: 'compile() 은 쓰지 않는다.' },
    { re: /(^|[^.\w])globals\s*\(/, message: 'globals() 는 쓰지 않는다.' },
    { re: /(^|[^.\w])locals\s*\(/, message: 'locals() 는 쓰지 않는다.' },
    { re: /while\s+True\s*:/, message: 'while True 는 끝나지 않을 수 있다. 끝나는 조건을 정한다.' }
  ];

  /**
   * 코드를 훑어 «이 프로젝트에서 쓰지 않는 문법» 을 줄 번호와 함께 알려 준다.
   * 막는 것이 아니라 «작성 안내» 다(명세 11.3).
   */
  structure.quickScan = function (code) {
    var found = [];
    readLines(code).forEach(function (line) {
      QUICK_RULES.forEach(function (rule) {
        if (rule.re.test(line.bare)) {
          found.push({ line: line.no, message: rule.message });
        }
      });
    });
    return found;
  };

  /* ================================================================== */
  /* 설계 뼈대 만들기 (명세 10.3)                                        */
  /* ================================================================== */

  structure.buildSkeleton = function (design) {
    var d = design || {};
    var className = String(d.className || 'MyClass').trim() || 'MyClass';
    var properties = (d.properties || []).filter(Boolean);
    var methods = (d.methods || []).filter(Boolean);
    var instances = (d.instances || []).filter(function (inst) {
      return inst && inst.objectName;
    });

    var lines = [];
    if (d.classDescription) lines.push('# ' + d.classDescription);
    lines.push('class ' + className + ':');
    if (properties.length > 0) {
      lines.push('    # 속성 : ' + properties.join(', '));
    }
    lines.push('    # 속성을 작성하세요.');
    lines.push('');

    (methods.length > 0 ? methods : ['method_one', 'method_two']).forEach(function (m) {
      var name = String(m).replace(/\(.*$/, '').trim() || 'method';
      lines.push('    def ' + name + '(self):');
      if (name === d.conditionalMethod && d.conditionalRule) {
        lines.push('        # 조건 : ' + d.conditionalRule);
      }
      lines.push('        # 실행할 내용을 작성하세요.');
      lines.push('        pass');
      lines.push('');
    });

    lines.push('# 두 객체를 만들고 서로 다른 값을 설정하세요.');
    if (instances.length > 0) {
      instances.forEach(function (inst) {
        lines.push('# ' + inst.objectName + ' = ' + className + '(...)');
      });
    } else {
      lines.push('# 객체1 = ' + className + '(...)');
      lines.push('# 객체2 = ' + className + '(...)');
    }
    return lines.join('\n');
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = structure;
  }
})();

    <script data-from="js/63-test-runner.js">
/**
 * 페이지 8 — 테스트 · 디버깅 · 개선 (명세 12장)
 *
 * 문자열이 «완전히» 같은지로 통과를 강제하지 않는다(명세 12.2).
 * 팀이 예상 결과와 실제 출력을 비교해 스스로 판정하고,
 * 교사용에는 팀의 자기 판정과 실제 출력 원문을 함께 보여 준다.
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var tests = L.tests || (L.tests = {});
  var C = L.CONST || {};

  /* ================================================================== */
  /* 검사 함수                                                           */
  /* ================================================================== */

  /** 테스트 한 건이 «쓸 만한지» 확인한다. */
  tests.validateTest = function (test) {
    var t = test || {};
    var problems = [];
    if (String(t.name || '').trim().length < 2) problems.push('테스트 이름을 적어 주세요.');
    if (String(t.setup || '').trim().length < 2) problems.push('객체와 속성값을 적어 주세요.');
    if (String(t.call || '').trim().length < 2) problems.push('호출할 메소드를 적어 주세요.');
    if (String(t.expected || '').trim().length < 2) problems.push('예상 결과를 적어 주세요.');
    return { ok: problems.length === 0, problems: problems };
  };

  /**
   * 실제 출력 안에 예상 결과가 들어 있는지 «참고용» 으로 알려 준다.
   * 판정은 팀이 한다(명세 12.2).
   */
  tests.looksMatched = function (expected, actual) {
    var e = String(expected || '').trim();
    var a = String(actual || '');
    if (!e) return false;
    return a.indexOf(e) >= 0;
  };

  /** 페이지 8 최종 확인 (명세 12.5) */
  tests.validatePage = function (data) {
    var d = data || {};
    var problems = [];
    var list = (d.tests || []).filter(function (t) {
      return tests.validateTest(t).ok;
    });
    var min = C.MIN_TESTS || 2;
    if (list.length < min) {
      problems.push('테스트를 ' + min + '건 이상 완성해 주세요. (지금 ' + list.length + '건)');
    }
    var judged = list.filter(function (t) {
      return t.judged === true;
    });
    if (judged.length < min) {
      problems.push('각 테스트를 실행하고 통과 여부를 판정해 주세요. (' + judged.length + '/' + min + ')');
    }
    if ((d.improvements || []).length < 1) {
      problems.push('오류 수정 또는 기능 개선 기록을 1개 이상 남겨 주세요.');
    }
    if (!d.runtime || !d.runtime.lastRunSucceeded) {
      problems.push('밖에서 실행해 보고 「정상 실행되었다」 를 체크해 주세요.');
    }
    var structure = (d.runtime && d.runtime.structureChecks) || {};
    if ((structure.passed || 0) < (structure.total || C.STRUCTURE_TOTAL || 9)) {
      problems.push('필수 구조 9가지를 모두 충족해 주세요.');
    }
    if (!String((d.runtime && d.runtime.stdout) || '').trim()) {
      problems.push('실행 결과를 붙여 넣어 주세요.');
    }
    var confirmed = (d.tests || []).length > 0 ? d.finalChecks || [] : [];
    if ((d.finalChecks || []).length < (C.TEAM_SIZE || 4)) {
      problems.push('네 명이 최종 확인 체크를 해 주세요. (' + (d.finalChecks || []).length + '/4)');
    }
    return { ok: problems.length === 0, problems: problems, count: list.length, confirmed: confirmed };
  };

  /* ================================================================== */
  /* 화면                                                                */
  /* ================================================================== */

  if (typeof document === 'undefined' || !L.registerPage) {
    if (typeof module !== 'undefined' && module.exports) module.exports = tests;
    return;
  }

  var ui = L.ui;
  var el = ui.el;

  function d() {
    return L.state.get();
  }
  function save(mutator) {
    L.state.update(mutator);
    L.nav.refresh();
  }

  L.registerPage(8, {
    render: function (container) {
      container.appendChild(
        ui.pageHeader({
          page: 8,

          lead: [
            '테스트·발표자가 앞장서서 <strong>서로 다른 조건</strong>을 확인하는 테스트를 2건 이상 만든다.',
            '오류는 «누구의 잘못» 이 아니라 <strong>개선할 정보</strong>다. 무엇을 왜 고쳤는지 남긴다.'
          ]
        })
      );

      /* ---------------- 테스트 계획 ---------------- */

        title: '① 테스트 계획',
        hint: '반드시 «서로 다른 조건 분기» 를 확인하는 테스트를 포함한다. (예: 물이 부족할 때 / 충분할 때)'
      });
      var testBox = el('div', { 'class': 'stack' });
      planPanel.body.appendChild(testBox);
      planPanel.body.appendChild(
        ui.buttonRow([
          ui.button({
            label: '+ 테스트 추가',
            variant: 'secondary',
            onClick: function () {
              if ((d().tests || []).length >= (C.MAX_TESTS || 10)) {
                ui.toast('테스트는 최대 ' + (C.MAX_TESTS || 10) + '건까지 기록할 수 있어요.');
                return;
              }
              save(function (s) {
                s.tests = s.tests || [];
                s.tests.push({
                  name: '',
                  setup: '',
                  call: '',
                  expected: '',
                  actual: '',
                  passedByTeam: false,
                  judged: false
                });
              });
              paintTests();
            }
          })
        ])
      );
      container.appendChild(planPanel.root);

      /* ---------------- 실행 결과 기록 ---------------- */
      var runPanel = ui.panel({
        title: '② 밖에서 실행한 결과 기록하기',
        hint: '복사한 코드를 평소 쓰는 Python 에서 실행하고, 나온 결과를 그대로 붙여 넣는다.'
      });
      runPanel.body.appendChild(
        ui.buttonRow([
          ui.button({
            label: '코드 복사',
            variant: 'primary',
            onClick: function () {
              ui.copyText(d().code).then(function (ok) {
                ui.toast(ok ? '코드를 복사했어요. Python 에서 실행해 보세요.' : '복사하지 못했어요.');
              });
            }
          }),
          ui.button({
            label: '.py 파일로 저장',
            variant: 'secondary',
            onClick: function () {
              var name = L.editor.codeFileName();
              var ok = ui.downloadText(name, d().code, 'text/x-python');
              ui.toast(ok ? name + ' 을 저장했어요.' : '저장하지 못했어요.');
            }
          }),
          ui.button({
            label: '7페이지로 가서 코드 고치기',
            variant: 'ghost',
            onClick: function () {
              L.nav.goToPage(7, { force: true });
            }
          })
        ])
      );

      runPanel.body.appendChild(
        ui.textAreaField({
          label: '실행 결과 (화면에 나온 글을 그대로 붙여 넣기)',
          rows: 5,
          code: true,
          value: d().runtime.stdout,
          placeholder: '행운목: 물이 필요합니다.\n다육이: 상태가 좋습니다.',
          onInput: function (v) {
            save(function (s) {
              s.runtime.stdout = String(v).slice(0, C.MAX_STDOUT || 10000);
              s.runtime.recordedAt = new Date().toISOString();
            });
            paintFinal();
          }
        }).root
      );

      runPanel.body.appendChild(
        ui.textAreaField({
          label: '오류 메시지 (오류가 났다면 붙여 넣기 · 선택)',
          rows: 3,
          code: true,
          value: d().runtime.stderr,
          placeholder: 'Traceback (most recent call last): …',
          onInput: function (v) {
            save(function (s) {
              s.runtime.stderr = String(v).slice(0, C.MAX_STDERR || 10000);
            });
          }
        }).root
      );

      runPanel.body.appendChild(
        ui.checkLine({
          label: '팀 확인 — 코드가 오류 없이 정상 실행되었다.',
          sub: '네 명이 실행 결과를 함께 확인했다면 체크한다.',
          checked: d().runtime.lastRunSucceeded === true,
          onChange: function (on) {
            save(function (s) {
              s.runtime.lastRunSucceeded = on;
              s.runtime.recordedAt = new Date().toISOString();
            });
            paintFinal();
          }
        }).root
      );

      var structNote = el('p', { 'class': 'runmeta' });
      runPanel.body.appendChild(structNote);
      runPanel.body.appendChild(ui.sectionTitle('참고', '오류가 났다면 여기를 확인한다'));
      runPanel.body.appendChild(
        ui.dataTable({
          head: ['Python 오류', '확인할 곳'],
          rows: [
            ['IndentationError', '클래스·메소드·조건문의 들여쓰기 단계를 확인하세요.'],
            ['SyntaxError', '콜론, 괄호, 따옴표가 빠지지 않았는지 확인하세요.'],
            ['NameError', '사용한 클래스·객체·변수 이름이 앞에서 정의되었는지 확인하세요.'],
            ['AttributeError', '해당 객체에 그 속성이나 메소드가 정의되어 있는지 확인하세요.'],
            ['TypeError', '메소드 호출의 소괄호와 전달값을 확인하세요.']
          ]
        })
      );
      container.appendChild(runPanel.root);

      /* ---------------- 오류·수정 기록 ---------------- */
      var fixPanel = ui.panel({
        title: '③ 오류 수정 · 기능 개선 기록',
        hint: '처음부터 잘 돌아간 팀은 «기능 개선» 기록을 쓴다.'
      });
      var fixBox = el('div', { 'class': 'stack' });
      fixPanel.body.appendChild(fixBox);
      fixPanel.body.appendChild(
        ui.buttonRow([
          ui.button({
            label: '+ 오류 수정 기록',
            variant: 'secondary',
            onClick: function () {
              addImprovement('fix');
            }
          }),
          ui.button({
            label: '+ 기능 개선 기록',
            variant: 'secondary',
            onClick: function () {
              addImprovement('improve');
            }
          })
        ])
      );
      container.appendChild(fixPanel.root);

      /* ---------------- 버전 기록 ---------------- */
      var versionPanel = ui.panel({
        title: '④ 버전 기록',
        hint: '최근 ' + (C.MAX_VERSIONS || 10) + '개까지 이 기기에 남는다. 되돌리기 전에 지금 코드도 새 버전으로 저장한다.'
      });
      var versionBox = el('div', { 'class': 'versionlist' });
      versionPanel.body.appendChild(versionBox);
      container.appendChild(versionPanel.root);

      /* ---------------- 최종 확인 ---------------- */
      var finalPanel = ui.panel({ title: '⑤ 최종 확인', hint: '명세 12.5 의 여섯 가지' });
      var finalBox = el('div');
      finalPanel.body.appendChild(finalBox);
      var memberCheck = el('div', { 'class': 'stack' });
      finalPanel.body.appendChild(ui.sectionTitle('확인', '네 명이 각자 최종 확인'));
      finalPanel.body.appendChild(memberCheck);
      container.appendChild(finalPanel.root);

      /* ------------------------ 그리기 ------------------------ */

      function paintTests() {
        ui.clear(testBox);
        var list = d().tests || [];
        if (list.length === 0) {
          testBox.appendChild(
            el('p', { 'class': 'panel__hint', text: '아직 테스트가 없어요. [+ 테스트 추가] 를 눌러 보세요.' })
          );
        }
        list.forEach(function (test, index) {
          var card = el('div', { 'class': 'testcard' });
          card.appendChild(
            el('div', { 'class': 'testcard__head' }, [
              el('span', { 'class': 'testcard__no', text: '테스트 ' + (index + 1) }),
              test.judged
                ? ui.badge(test.passedByTeam ? 'true' : 'false', test.passedByTeam ? '통과' : '불일치')
                : ui.badge('primary', '판정 전'),

            { key: 'setup', label: '객체와 속성값', placeholder: '예) plant1.water_level = 20' },
            { key: 'call', label: '호출 메소드', placeholder: '예) plant1.check_water()' },
            { key: 'expected', label: '예상 결과', placeholder: '예) 물이 필요합니다.' }
          ].forEach(function (f) {
            card.appendChild(
              ui.textField({
                label: f.label,

                  });

            );
          });

          card.appendChild(
            ui.textAreaField({
              label: '실제 결과 (실행 출력에서 옮겨 적거나 [출력 가져오기])',
              rows: 2,
              code: true,
              value: test.actual,
              onInput: function (v) {
                save(function (s) {
                  s.tests[index].actual = v;
                });
              }
            }).root
          );

          var judgeNote = el('p', { 'class': 'testcard__note' });
          function paintJudgeNote() {
            var current = d().tests[index];
            if (!current.expected || !current.actual) {
              judgeNote.textContent = '';
              return;
            }
            judgeNote.textContent = tests.looksMatched(current.expected, current.actual)
              ? '참고 · 실제 출력 안에서 예상 결과 문장을 찾았어요.'
              : '참고 · 실제 출력에서 예상 결과 문장을 찾지 못했어요. 띄어쓰기까지 확인해 보세요.';
          }

          card.appendChild(
            ui.buttonRow([
              ui.button({
                label: '최근 출력 가져오기',
                variant: 'ghost',
                className: 'btn--sm',
                onClick: function () {
                  save(function (s) {
                    s.tests[index].actual = s.runtime.stdout || '';
                  });
                  paintTests();
                }
              }),
              ui.button({
                label: '✓ 통과로 판정',
                variant: 'secondary',
                className: 'btn--sm',
                onClick: function () {
                  save(function (s) {
                    s.tests[index].passedByTeam = true;
                    s.tests[index].judged = true;
                  });
                  paintTests();
                }
              }),
              ui.button({
                label: '✗ 불일치로 판정',
                variant: 'ghost',
                className: 'btn--sm',
                onClick: function () {
                  save(function (s) {
                    s.tests[index].passedByTeam = false;
                    s.tests[index].judged = true;
                  });
                  paintTests();
                }
              })
            ])
          );
          card.appendChild(judgeNote);
          paintJudgeNote();
          testBox.appendChild(card);

        // 서로 다른 분기를 확인했는지 안내
        var judged = list.filter(function (t) {

        });
        var branches = {};
        list.forEach(function (t) {

        });
        testBox.appendChild(
          el('p', {
            'class': 'panel__hint',
            text:
              '완성한 테스트 ' + list.length + '건 · 판정한 테스트 ' + judged.length + '건 · ' +
              '서로 다른 예상 결과 ' + Object.keys(branches).length + '가지' +
              (Object.keys(branches).length >= 2 ? ' (좋아요 — 다른 분기를 확인했어요)' : ' (다른 조건의 테스트를 하나 더 만들어 보세요)')
          })
        );
      }

      function addImprovement(kind) {
        save(function (s) {
          s.improvements = s.improvements || [];
          s.improvements.push({
            kind: kind,
            problem: '',
            message: '',
            cause: '',
            change: '',
            result: '',
            members: []
          });
        });
        paintFixes();
      }

      function paintFixes() {
        ui.clear(fixBox);
        var list = d().improvements || [];
        if (list.length === 0) {
          fixBox.appendChild(
            el('p', { 'class': 'panel__hint', text: '아직 기록이 없어요. 오류를 고쳤거나 기능을 더했다면 남겨 주세요.' })
          );
        }
        var names = d().members
          .filter(function (m) {
            return m.name;
          })
          .map(function (m) {
            return m.name;
          });

        list.forEach(function (item, index) {
          var isFix = item.kind !== 'improve';
          var fields = isFix
            ? [
                { key: 'problem', label: '발견한 문제', placeholder: '예) 경계값 30에서 안내가 잘못됨' },
                { key: 'message', label: '오류 메시지 또는 예상과 다른 결과', placeholder: '예) 물이 필요합니다 가 나오지 않음' },
                { key: 'cause', label: '원인 추정', placeholder: '예) < 와 <= 를 혼동함' },
                { key: 'change', label: '수정한 코드', placeholder: '예) water_level <= 30 으로 수정' },
                { key: 'result', label: '수정 후 결과', placeholder: '예) 30 에서도 물 필요 안내' }
              ]
            : [
                { key: 'problem', label: '개선 전 불편한 점', placeholder: '예) 어느 화분인지 알기 어려웠다.' },
                { key: 'change', label: '추가하거나 바꾼 기능', placeholder: '예) 이름을 함께 출력' },
                { key: 'result', label: '개선 후 결과', placeholder: '예) 행운목: 물이 필요합니다.' }
              ];

          var card = el('div', { 'class': 'fixcard' }, [
            el('div', { 'class': 'fixcard__head' }, [
              el('span', { 'class': 'fixcard__kind', text: isFix ? '오류 수정' : '기능 개선' }),
              ui.button({
                label: '삭제',
                variant: 'ghost',
                className: 'btn--sm',
                onClick: function () {
                  save(function (s) {
                    s.improvements.splice(index, 1);
                  });
                  paintFixes();
                }
              })
            ])
          ]);
          fields.forEach(function (f) {
            card.appendChild(
              ui.textField({
                label: f.label,
                value: item[f.key],
                placeholder: f.placeholder,
                width: '100%',
                align: 'left',
                onInput: function (v) {
                  save(function (s) {
                    s.improvements[index][f.key] = v;
                  });
                }
              }).root
            );
          });
          card.appendChild(el('p', { 'class': 'field__label', text: '수정에 참여한 팀원' }));
          card.appendChild(
            ui.checkboxGroup({
              ariaLabel: '수정에 참여한 팀원',
              values: item.members || [],
              options: names.map(function (n) {
                return { value: n, label: n };
              }),
              onChange: function (values) {
                save(function (s) {

      }

      function paintVersions() {
        ui.clear(versionBox);
        var list = L.state.versions();
        if (list.length === 0) {
          versionBox.appendChild(el('p', { 'class': 'panel__hint', text: '아직 저장된 버전이 없어요.' }));
          return;
        }
        list.forEach(function (v) {
          versionBox.appendChild(
            el('div', { 'class': 'versionrow' }, [
              el('span', { 'class': 'versionrow__no', text: 'v' + v.no }),
              el('span', { 'class': 'versionrow__time', text: ui.formatTime(v.savedAt) }),
              el('span', { 'class': 'versionrow__summary', text: v.summary || '(설명 없음)' }),
              el('span', {
                'class': 'versionrow__state',
                text: v.succeeded ? '실행 성공' : '실행 기록 없음'
              }),
              el('span', {
                'class': 'versionrow__who',
                text: (v.author || '-') + (v.reviewers && v.reviewers.length ? ' / ' + v.reviewers.join(', ') : '')
              }),
              ui.button({
                label: '코드 보기',
                variant: 'ghost',
                className: 'btn--sm',
                onClick: function () {
                  ui.modal({
                    title: 'v' + v.no + ' 코드',
                    body: ui.codeBlock({ title: 'v' + v.no, code: v.code }),

                  });
                }
              }),
              ui.button({
                label: '이 버전으로 복원',
                variant: 'secondary',
                className: 'btn--sm',
                onClick: function () {
                  ui.confirmDialog({
                    title: 'v' + v.no + ' 으로 되돌릴까요?',
                    message: '지금 코드는 <strong>새 버전으로 먼저 저장</strong>한 뒤 되돌린다.',
                    okLabel: '복원하기'
                  }).then(function (ok) {
                    if (!ok) return;
                    L.state.saveVersion({ code: d().code, summary: 'v' + v.no + ' 복원 직전 저장' });
                    save(function (s) {
                      s.code = v.code;
                    });
                    if (L.editor.instance) L.editor.instance.setValue(v.code);
                    ui.toast('v' + v.no + ' 으로 되돌렸어요. 7페이지에서 다시 실행해 보세요.');
                    paintVersions();
                  });
                }
              })
            ])
          );
        });
      }

      function paintFinal() {
        var s = d();
        var structure = (s.runtime && s.runtime.structureChecks) || { passed: 0, total: 9 };
        var list = (s.tests || []).filter(function (t) {
          return tests.validateTest(t).ok;
        });
        ui.clear(finalBox);
        finalBox.appendChild(
          ui.checklist([
            {
              ok: (structure.passed || 0) >= (structure.total || 9),
              label: '구조 검사 9개 모두 통과',
              hint: structure.passed + '/' + (structure.total || 9)
            },
            {
              ok: s.runtime.lastRunSucceeded === true,
              label: '팀이 「정상 실행되었다」 를 확인함',
              hint: s.runtime.recordedAt ? ui.formatTime(s.runtime.recordedAt) + ' 기록' : ''
            },
            { ok: list.length >= (C.MIN_TESTS || 2), label: '테스트 2개 이상', hint: list.length + '건' },
            {
              ok: (s.improvements || []).length >= 1,
              label: '오류 또는 개선 기록 1개 이상',
              hint: (s.improvements || []).length + '건'
            },
            {
              ok: Boolean(String(s.runtime.stdout || '').trim()),
              label: '실행 결과를 붙여 넣음',
              hint:
                String(s.runtime.stdout || '')
                  .split('\n')
                  .filter(function (t) {
                    return t.trim();
                  }).length + '줄'
            },
            {
              ok: (s.finalChecks || []).length >= (C.TEAM_SIZE || 4),
              label: '네 명의 확인 체크',
              hint: (s.finalChecks || []).length + '/4'
            }
          ])
        );
      }

      function paintMemberChecks() {
        ui.clear(memberCheck);
        d().members.forEach(function (m, index) {
          var checked = (d().finalChecks || []).indexOf(index) >= 0;
          memberCheck.appendChild(
            ui.checkLine({
              label: (m.name || '학생 ' + (index + 1)) + ' — 최종 코드와 실행 결과를 확인했다.',
              checked: checked,
              onChange: function (on) {
                save(function (s) {
                  s.finalChecks = s.finalChecks || [];
                  var at = s.finalChecks.indexOf(index);
                  if (on && at < 0) s.finalChecks.push(index);
                  if (!on && at >= 0) s.finalChecks.splice(at, 1);
                });
                paintFinal();
              }
            }).root
          );
        });
      }

      paintTests();
      paintFixes();
      paintVersions();
      paintFinal();
      paintMemberChecks();

      L.tests.repaint = function () {
        paintFinal();
        paintVersions();
      };
    },

    onEnter: function () {
      if (L.tests.repaint) L.tests.repaint();
    },

    check: function () {
      var r = tests.validatePage(d());
      if (!r.ok) return { ok: false, hint: r.problems[0] };
      return { ok: true, hint: '' };
    }
  });

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = tests;
  }
})();
