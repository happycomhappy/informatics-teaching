    <script data-from="teacher/t20-analysis.js">
/**
 * 교사용 2장 — 전체 현황 (명세 19.2 · 19.3)
 *
 * 카드 여섯 개 · 주제 분포 · 팀 목록.
 * 자동 계산은 «참고 자료» 이며 점수를 확정하지 않는다(명세 14.2).
 */
(function () {
  "use strict";

  var L = window.L;
  var T = L.teacher || (L.teacher = {});
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;

  /** 카드에 쓸 숫자를 모은다. */
  T.overview = function (summaries) {
    var list = summaries || [];
    var students = 0;
    list.forEach(function (s) {
      students += s.memberCount;
    });
    return {
      teams: list.length,
      students: students,
      runOk: list.filter(function (s) {
        return s.runOk;
      }).length,
      structureFull: list.filter(function (s) {
        return s.structureFull;
      }).length,
      testEnough: list.filter(function (s) {
        return s.testCount >= (C.MIN_TESTS || 2);
      }).length,
      improvement: list.filter(function (s) {
        return s.improvementCount >= 1;
      }).length
    };
  };

  /** 주제 분포 (기본 주제별 팀 수 + 자유 주제) */
  T.topicDistribution = function (summaries) {
    var counts = {};
    (C.TOPICS || []).forEach(function (topic) {
      counts[topic.name] = 0;
    });
    var free = 0;
    (summaries || []).forEach(function (s) {
      var name = String(s.topicType || '').trim();
      if (!name || name === '자유 주제') {
        free += 1;
        return;
      }
      if (Object.prototype.hasOwnProperty.call(counts, name)) counts[name] += 1;
      else free += 1;
    });
    counts['자유 주제'] = free;
    return counts;
  };

  T.renderAnalysis = function (container) {
    var cardBox = el('div', { 'class': 'tcards' });
    var topicBox = el('div');
    var tableBox = el('div');

    var head = ui.panel({
      title: '전체 현황',
      hint: '자동 계산 결과는 참고 자료입니다. 최종 판단은 선생님이 합니다.'
    });
    head.body.appendChild(cardBox);
    container.appendChild(head.root);

    var topicPanel = ui.panel({ title: '주제 분포' });
    topicPanel.body.appendChild(topicBox);
    container.appendChild(topicPanel.root);

    var listPanel = ui.panel({
      title: '팀 목록',
      hint: '[프로젝트 보기] 를 누르면 3장에서 그 팀의 설계·코드·출력을 볼 수 있다.'
    });
    listPanel.body.appendChild(tableBox);
    container.appendChild(listPanel.root);

    function paint(summaries) {
      var list = summaries || T.summaries || [];
      var stat = T.overview(list);

      ui.clear(cardBox);
      [
        { label: '제출 팀 수', value: stat.teams + '팀' },
        { label: '참여 학생 수', value: stat.students + '명' },
        { label: '실행 확인 팀', value: stat.runOk + ' / ' + stat.teams },
        { label: '구조 9개 충족 팀', value: stat.structureFull + ' / ' + stat.teams },
        { label: '테스트 2개 이상 팀', value: stat.testEnough + ' / ' + stat.teams },
        { label: '수정 기록 보유 팀', value: stat.improvement + ' / ' + stat.teams }
      ].forEach(function (card) {
        cardBox.appendChild(
          el('div', { 'class': 'tcard' }, [
            el('p', { 'class': 'tcard__label', text: card.label }),
            el('p', { 'class': 'tcard__value', text: card.value })
          ])
        );
      });

      ui.clear(topicBox);
      var dist = T.topicDistribution(list);
      var max = Math.max.apply(
        null,
        [1].concat(
          Object.keys(dist).map(function (k) {
            return dist[k];
          })
        )
      );
      Object.keys(dist).forEach(function (name) {
        var count = dist[name];
        topicBox.appendChild(
          el('div', { 'class': 'tbar' }, [
            el('span', { 'class': 'tbar__label', text: name }),
            el('span', { 'class': 'tbar__track' }, [
              el('span', {
                'class': 'tbar__fill',
                style: { width: Math.round((count / max) * 100) + '%' }
              })
            ]),
            el('span', { 'class': 'tbar__value', text: count + '팀' })
          ])
        );
      });

      ui.clear(tableBox);
      if (list.length === 0) {
        tableBox.appendChild(
          el('p', { 'class': 'panel__hint', text: '아직 불러온 제출이 없어요. 1장에서 결과를 불러와 주세요.' })
        );
        return;
      }
      tableBox.appendChild(
        ui.dataTable({
          head: [
            '팀 코드', '팀명', '주제', '팀원', '실행 확인', '구조', '테스트', '수정', '제출 시각', ''
          ],
          rows: list.map(function (s) {
            var button = ui.button({
              label: '프로젝트 보기',
              variant: 'secondary',
              className: 'btn--sm',
              onClick: function () {
                T.showTeam(s.teamCode);
              }
            });
            return [
              ui.escapeHtml(s.teamCode),
              ui.escapeHtml(s.teamName),
              ui.escapeHtml(s.topicTitle || s.topicType),
              ui.escapeHtml(s.memberNames),
              s.runOk ? '확인 ○' : '아직 ×',
              s.structurePassed + '/' + s.structureTotal,
              s.testCount + '건',
              s.improvementCount + '건',
              ui.escapeHtml(ui.formatTime(s.submittedAt)),
              button
            ];
          })
        })
      );
    }

    T.onData(paint);
    paint(T.summaries);
  };
})();
    </script>
    <script data-from="teacher/t30-project-view.js">
/**
 * 교사용 3장 · 4장 — 팀 프로젝트 상세 / 협력 과정 (명세 19.4 · 19.5)
 *
 * 코드는 «읽기 전용» 으로 구문 강조해 보여 준다.
 * 교사용도 학생 코드를 실행하지 않는다(명세 2.2).
 * 필요하면 .py 로 내려받아 선생님 Python 환경에서 확인한다.
 */
(function () {
  "use strict";

  var L = window.L;
  var T = L.teacher || (L.teacher = {});
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;

  var selectedCode = null;
  var projectBox = null;
  var collabBox = null;

  /** 2장의 [프로젝트 보기] 에서 부른다. */
  T.showTeam = function (teamCode) {
    selectedCode = teamCode;
    if (T.goChapter) T.goChapter(3);
    paintProject();
  };

  function current() {
    var list = T.summaries || [];
    if (list.length === 0) return null;
    var found = list.filter(function (s) {
      return s.teamCode === selectedCode;
    })[0];
    return found || list[0];
  }

  /* ================================================================== */
  /* 3장 — 팀 프로젝트 상세                                               */
  /* ================================================================== */

  T.renderProject = function (container) {
    var picker = ui.panel({ title: '팀 고르기' });
    var pickerBox = el('div', { 'class': 'tpicker' });
    picker.body.appendChild(pickerBox);
    container.appendChild(picker.root);

    projectBox = el('div', { 'class': 'stack' });
    container.appendChild(projectBox);

    function paintPicker() {
      ui.clear(pickerBox);
      var list = T.summaries || [];
      if (list.length === 0) {
        pickerBox.appendChild(
          el('p', { 'class': 'panel__hint', text: '1장에서 결과를 먼저 불러와 주세요.' })
        );
        return;
      }
      list.forEach(function (s) {
        pickerBox.appendChild(
          el('button', {
            type: 'button',
            'class': 'tpicker__btn' + (current() && current().teamCode === s.teamCode ? ' is-on' : ''),
            text: s.teamCode + ' · ' + s.teamName,
            on: {
              click: function () {
                selectedCode = s.teamCode;
                paintPicker();
                paintProject();
              }
            }
          })
        );
      });
    }

    T.onData(function () {
      paintPicker();
      paintProject();
    });
    paintPicker();
    paintProject();
  };

  function paintProject() {
    if (!projectBox) return;
    ui.clear(projectBox);
    var s = current();
    if (!s) {
      projectBox.appendChild(
        ui.callout('불러온 팀 제출이 없습니다. 1장에서 결과를 불러오면 이곳에 표시됩니다.', {
          className: 'callout--muted'
        })
      );
      return;
    }

    var row = s.row;
    var head = ui.panel({ title: s.teamCode + ' · ' + s.teamName });
    head.body.appendChild(
      ui.dataTable({
        head: ['항목', '내용'],
        rows: [
          ['주제', ui.escapeHtml(s.topicTitle + ' (' + s.topicType + ')')],
          [
            '팀원',
            ui.escapeHtml(
              (row.members || [])
                .map(function (m) {
                  return m.studentId + ' ' + m.name + ' · ' + (m.role || '역할 미정');
                })
                .join(' / ')
            )
          ],
          ['팀 실행 확인', s.runOk ? '정상 실행 ○' : '아직 ×'],
          ['구조 검사', s.structurePassed + ' / ' + s.structureTotal],
          ['제출 시각', ui.escapeHtml(ui.formatTime(s.submittedAt))]
        ]
      })
    );
    projectBox.appendChild(head.root);

    var tabs = [
      { id: 'problem', label: '문제 정의', build: buildProblem },
      { id: 'design', label: '클래스 설계', build: buildDesign },
      { id: 'code', label: '최종 코드', build: buildCode },
      { id: 'output', label: '실행 출력·오류', build: buildOutput },
      { id: 'tests', label: '테스트', build: buildTests },
      { id: 'fixes', label: '수정 기록', build: buildFixes },
      { id: 'explain', label: '설명·발표문', build: buildExplain }
    ];

    var panelBox = el('div', { 'class': 'ttab__panel' });
    var bar = el(
      'div',
      { 'class': 'ttab__bar', attrs: { role: 'tablist' } },
      tabs.map(function (tab, index) {
        return el('button', {
          type: 'button',
          'class': 'ttab__btn' + (index === 0 ? ' is-on' : ''),
          text: tab.label,
          attrs: { role: 'tab', 'aria-selected': index === 0 ? 'true' : 'false' },
          on: {
            click: function (e) {
              ui.$$('.ttab__btn', bar).forEach(function (b) {
                b.classList.remove('is-on');
                b.setAttribute('aria-selected', 'false');
              });
              e.target.classList.add('is-on');
              e.target.setAttribute('aria-selected', 'true');
              ui.clear(panelBox);
              panelBox.appendChild(tab.build(row, s));
            }
          }
        });
      })
    );
    panelBox.appendChild(tabs[0].build(row, s));
    projectBox.appendChild(el('div', { 'class': 'ttab' }, [bar, panelBox]));
  }

  function buildProblem(row) {
    var topic = row.topic || {};
    return ui.dataTable({
      head: ['항목', '내용'],
      rows: [
        ['주제 유형', ui.escapeHtml(topic.type || '')],
        ['주제명', ui.escapeHtml(topic.title || '')],
        ['해결할 문제', ui.escapeHtml(topic.problem || '')],
        ['사용자', ui.escapeHtml(topic.user || '')],
        ['기대 결과', ui.escapeHtml(topic.expectedResult || '')],
        ['선택 이유', ui.escapeHtml(topic.reason || '')]
      ]
    });
  }

  function buildDesign(row) {
    var design = row.design || {};
    var box = el('div', { 'class': 'stack' });
    box.appendChild(
      ui.dataTable({
        head: ['항목', '내용'],
        rows: [
          ['클래스', ui.escapeHtml(design.className || '')],
          ['설명', ui.escapeHtml(design.classDescription || '')],
          ['속성', ui.escapeHtml((design.properties || []).join(', '))],
          ['메소드', ui.escapeHtml((design.methods || []).join(', '))],
          ['조건 메소드', ui.escapeHtml(design.conditionalMethod || '')],
          ['예상 출력', ui.escapeHtml(design.expectedOutput || '')]
        ]
      })
    );
    (design.instances || []).forEach(function (inst) {
      var values = Object.keys(inst.values || {}).map(function (key) {
        return [ui.escapeHtml(key), ui.escapeHtml(String(inst.values[key]))];
      });
      box.appendChild(ui.sectionTitle('객체', inst.objectName));
      box.appendChild(ui.dataTable({ head: ['속성', '값'], rows: values }));
    });
    return box;
  }

  function buildCode(row) {
    var box = el('div', { 'class': 'stack' });
    box.appendChild(ui.codeBlock({ title: '최종 코드 (읽기 전용)', code: row.code || '(비어 있음)' }));

    box.appendChild(
      ui.callout(
        '교사용은 학생 코드를 <strong>실행하지 않는다.</strong> ' +
          '직접 돌려 보려면 <code>.py</code> 로 내려받아 선생님 Python 환경에서 실행한다.',
        { className: 'callout--muted' }
      )
    );

    var checkBox = el('div');
    box.appendChild(
      ui.buttonRow([
        ui.button({
          label: '.py 파일로 내려받기',
          variant: 'secondary',
          onClick: function () {
            var name = String((row.teamCode || 'team') + '_' + (row.teamName || ''))
              .replace(/[\\/:*?"<>|]/g, '_')
              .replace(/\s+/g, '_') + '.py';
            var ok = ui.downloadText(name, row.code || '', 'text/x-python');
            ui.toast(ok ? name + ' 을 저장했어요.' : '저장하지 못했어요.');
          }
        }),
        ui.button({
          label: '코드 복사',
          variant: 'ghost',
          onClick: function () {
            ui.copyText(row.code || '').then(function (ok) {
              ui.toast(ok ? '코드를 복사했어요.' : '복사하지 못했어요.');
            });
          }
        }),
        ui.button({
          label: '구조 다시 검사',
          variant: 'ghost',
          onClick: function () {
            var summary = L.structure.summarize(L.structure.analyze(row.code || ''));
            ui.clear(checkBox);
            checkBox.appendChild(
              el('p', { 'class': 'structcount' }, [el('strong', { text: '다시 검사한 결과 · ' + summary.text })])
            );
            checkBox.appendChild(
              ui.checklist(
                summary.items.map(function (item) {
                  return { ok: item.ok, label: item.label, hint: item.detail };
                })
              )
            );
            checkBox.appendChild(el('p', { 'class': 'panel__hint', text: L.structure.LIMIT_NOTE }));
          }
        })
      ])
    );
    box.appendChild(checkBox);
    return box;
  }

  function buildOutput(row) {
    var runtime = row.runtime || {};
    var structure = L.structure.summarize(runtime.structureChecks);
    var box = el('div', { 'class': 'stack' });
    box.appendChild(
      ui.dataTable({
        head: ['항목', '값'],
        rows: [
          ['실행 환경', '웹앱 밖의 Python'],
          ['팀 확인', runtime.lastRunSucceeded ? '정상 실행 ○' : '아직 ×'],
          ['기록 시각', ui.escapeHtml(ui.formatTime(runtime.recordedAt))],
          ['구조 검사', structure.text]
        ]
      })
    );
    box.appendChild(
      el('div', { 'class': 'outbox' }, [
        el('p', { 'class': 'outbox__title', text: '표준 출력' }),
        el('pre', { 'class': 'outbox__pre', text: runtime.stdout || '(없음)' })
      ])
    );
    if (runtime.stderr) {
      box.appendChild(
        el('div', { 'class': 'outbox' }, [
          el('p', { 'class': 'outbox__title', text: '오류 출력' }),
          el('pre', { 'class': 'outbox__pre', text: runtime.stderr })
        ])
      );
    }
    box.appendChild(
      ui.checklist(
        structure.items.map(function (item) {
          return { ok: item.ok, label: item.label, hint: item.detail };
        })
      )
    );
    return box;
  }

  function buildTests(row) {
    var tests = row.tests || [];
    if (tests.length === 0) return el('p', { 'class': 'panel__hint', text: '기록된 테스트가 없습니다.' });
    return ui.dataTable({
      head: ['이름', '설정', '호출', '예상', '실제 출력(원문)', '팀 판정'],
      rows: tests.map(function (t) {
        return [
          ui.escapeHtml(t.name || ''),
          ui.escapeHtml(t.setup || ''),
          ui.escapeHtml(t.call || ''),
          ui.escapeHtml(t.expected || ''),
          '<pre class="tpre">' + ui.escapeHtml(String(t.actual || '')) + '</pre>',
          t.passedByTeam ? '통과 ○' : '불일치 ×'
        ];
      })
    });
  }

  function buildFixes(row) {
    var list = row.improvements || [];
    if (list.length === 0) return el('p', { 'class': 'panel__hint', text: '기록된 수정·개선이 없습니다.' });
    return ui.dataTable({
      head: ['문제/불편', '메시지', '원인', '수정/개선', '결과', '참여'],
      rows: list.map(function (imp) {
        return [
          ui.escapeHtml(imp.problem || ''),
          ui.escapeHtml(imp.message || ''),
          ui.escapeHtml(imp.cause || ''),
          ui.escapeHtml(imp.change || ''),
          ui.escapeHtml(imp.result || ''),
          ui.escapeHtml((imp.members || []).join(', '))
        ];
      })
    });
  }

  function buildExplain(row) {
    var box = el('div', { 'class': 'stack' });
    var explanation = row.explanation || {};
    var questions = (L.collab && L.collab.QUESTIONS) || [];
    var rows = Object.keys(explanation).map(function (key, index) {
      var q = questions.filter(function (item) {
        return item.id === key;
      })[0];
      return [ui.escapeHtml(q ? q.text : index + 1 + '번'), ui.escapeHtml(explanation[key])];
    });
    if (rows.length > 0) box.appendChild(ui.dataTable({ head: ['문항', '답'], rows: rows }));
    box.appendChild(ui.sectionTitle('발표문', '1분 발표 카드'));
    box.appendChild(
      el('div', { 'class': 'outbox' }, [
        el('pre', { 'class': 'outbox__pre', text: row.presentation || '(비어 있음)' })
      ])
    );
    return box;
  }

  /* ================================================================== */
  /* 4장 — 협력 과정                                                      */
  /* ================================================================== */

  T.renderCollab = function (container) {
    var panel = ui.panel({
      title: '협력 과정 보기',
      hint: '아래 경고는 «확인해 볼 지점» 이며 협력 점수로 바로 바뀌지 않는다(명세 19.5).'
    });
    collabBox = el('div', { 'class': 'stack' });
    panel.body.appendChild(collabBox);
    container.appendChild(panel.root);

    T.onData(paintCollab);
    paintCollab();
  };

  function paintCollab() {
    if (!collabBox) return;
    ui.clear(collabBox);
    var list = T.summaries || [];
    if (list.length === 0) {
      collabBox.appendChild(
        el('p', { 'class': 'panel__hint', text: '1장에서 결과를 먼저 불러와 주세요.' })
      );
      return;
    }

    list.forEach(function (s) {
      var row = s.row;
      var collaboration = row.collaboration || {};
      var card = el('div', { 'class': 'tcollab' });
      card.appendChild(
        el('h3', { 'class': 'tcollab__title', text: s.teamCode + ' · ' + s.teamName })
      );

      card.appendChild(
        ui.dataTable({
          head: ['팀원', '역할', '기여 항목', '기여 메모'],
          rows: (collaboration.contributions || []).map(function (c) {
            return [
              ui.escapeHtml(c.name || ''),
              ui.escapeHtml(c.role || '역할 미정'),
              ui.escapeHtml((c.kinds || []).join(', ')),
              ui.escapeHtml(c.note || '')
            ];
          })
        })
      );

      if (collaboration.roleSwap && collaboration.roleSwap.reason) {
        card.appendChild(
          el('p', {
            'class': 'panel__hint',
            text:
              '역할 교대 · ' + collaboration.roleSwap.from + ' → ' + collaboration.roleSwap.to +
              ' (' + collaboration.roleSwap.reason + ')'
          })
        );
      }

      var logs = row.codeLogs || [];
      card.appendChild(ui.sectionTitle('코드 저장', '누가 쓰고 누가 검토했는가'));
      card.appendChild(
        logs.length > 0
          ? ui.dataTable({
              head: ['시각', '변경 요약', '작성', '검토'],
              rows: logs.map(function (log) {
                return [
                  ui.escapeHtml(ui.formatTime(log.savedAt)),
                  ui.escapeHtml(log.summary || ''),
                  ui.escapeHtml(log.author || ''),
                  ui.escapeHtml((log.reviewers || []).join(', '))
                ];
              })
            })
          : el('p', { 'class': 'panel__hint', text: '코드 저장 기록이 없습니다.' })
      );

      card.appendChild(ui.sectionTitle('성찰', '개인별 기록'));
      card.appendChild(
        ui.dataTable({

    <script data-from="teacher/t40-rubric.js">
/**
 * 교사용 5장 — 루브릭 · CSV · 인쇄 (명세 19.6 · 19.7)
 *
 * 루브릭 점수와 피드백은 «이 브라우저에만» 저장한다.
 * 학생 제출 JSON 은 절대 고치지 않는다(명세 19.6).
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var T = L.teacher || (L.teacher = {});
  var C = L.CONST || {};

  var RUBRIC_KEY = C.RUBRIC_KEY || 'lesson3_8_4_rubric';
  var CSV_NAME = '객체를구현하는클래스_4차시_협력프로젝트_결과.csv';

  /* ------------------------------------------------------------------ */
  /* CSV                                                                 */
  /* ------------------------------------------------------------------ */

  /** 셀 하나를 CSV 규칙에 맞게 감싼다. */
  function cell(value) {
    var text = value === undefined || value === null ? '' : String(value);
    if (/[",\n]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
    return text;
  }

  /**
   * CSV 본문을 만든다. 엑셀에서 한글이 깨지지 않도록 앞에 BOM 을 붙인다(명세 19.7).
   */
  T.buildCsv = function (summaries, scores) {
    var head = [
      '팀 코드', '팀명', '주제 유형', '주제명', '클래스',
      '팀원 수', '팀원', '실행 성공', '실행 횟수', '구조 검사',
      '테스트 수', '팀 판정 통과', '수정 기록', '제출 시각',
      '문제정의와설계(20)', '프로그램구현(30)', '실행과개선(20)', '결과설명(15)', '협력과정(15)', '합계(100)',
      '피드백', '협력 경고'
    ];
    var lines = [head.map(cell).join(',')];

    (summaries || []).forEach(function (s) {
      var score = (scores || {})[s.teamCode] || {};
      var total = (C.RUBRIC || []).reduce(function (sum, area) {
        var value = Number(score[area.id]);
        return sum + (isNaN(value) ? 0 : value);
      }, 0);
      lines.push(
        [
          s.teamCode, s.teamName, s.topicType, s.topicTitle, s.className,
          s.memberCount, s.memberNames,
          s.runOk ? '성공' : '실패', s.runCount,
          s.structurePassed + '/' + s.structureTotal,
          s.testCount, s.testPassed, s.improvementCount,
          s.submittedAt,
          score.design || '', score.implement || '', score.run || '',
          score.explain || '', score.collab || '', total,
          score.feedback || '',
          (s.warnings || []).join(' / ')
        ]
          .map(cell)
          .join(',')
      );
    });

    return '﻿' + lines.join('\r\n');
  };

  /* ------------------------------------------------------------------ */
  /* 점수 저장                                                            */
  /* ------------------------------------------------------------------ */

  T.readScores = function () {
    try {
      var raw = window.localStorage.getItem(RUBRIC_KEY);
      var data = raw ? JSON.parse(raw) : {};
      return data && typeof data === 'object' ? data : {};
    } catch (err) {
      return {};
    }
  };

  T.writeScores = function (scores) {
    try {
      window.localStorage.setItem(RUBRIC_KEY, JSON.stringify(scores || {}));
      return true;
    } catch (err) {
      return false;
    }
  };

  /* ------------------------------------------------------------------ */
  /* 화면                                                                */
  /* ------------------------------------------------------------------ */

  if (typeof document === 'undefined' || !L.ui || !L.ui.el) {
    if (typeof module !== 'undefined' && module.exports) module.exports = T;
    return;
  }

  var ui = L.ui;
  var el = ui.el;

  T.renderRubric = function (container) {
    var scores = T.readScores();

    var guide = ui.panel({
      title: '평가 기준',
      hint: '자동 구조 검사는 참고 자료이며 최종 점수를 자동 확정하지 않는다(명세 14.2).'
    });
    guide.body.appendChild(
      ui.dataTable({
        head: ['평가 영역', '배점', '평가 내용'],
        rows: (C.RUBRIC || []).map(function (area) {
          return [area.name, String(area.max), area.desc];
        })
      })
    );
    guide.body.appendChild(ui.sectionTitle('성취 수준', '상 · 중 · 하'));
    guide.body.appendChild(
      ui.dataTable({
        head: ['영역', '상', '중', '하'],
        rows: [
          ['설계', '문제와 클래스 구조가 명확히 연결됨', '일부 요소가 불명확', '문제와 클래스의 연결이 약함'],
          ['구현', '필수 구조가 정확하고 정상 실행', '일부 오류를 수정해 실행', '핵심 구조 미완성 또는 실행 실패'],
          ['객체 활용', '두 객체의 값과 결과 차이가 분명', '두 객체는 있으나 차이 설명 부족', '객체가 하나이거나 활용하지 못함'],
          ['테스트', '서로 다른 분기 2건과 개선 근거가 분명', '테스트는 있으나 근거가 약함', '테스트·개선 기록 부족'],
          ['협력', '네 명의 구체적 기여와 상호 검토 확인', '일부 기여 편중', '한 학생 중심으로 진행']
        ]
      })
    );
    container.appendChild(guide.root);

    var scorePanel = ui.panel({
      title: '팀별 루브릭 입력',
      hint: '입력한 점수는 이 브라우저에만 저장되고 학생 제출 파일은 바뀌지 않는다.'
    });
    var scoreBox = el('div', { 'class': 'stack' });
    scorePanel.body.appendChild(scoreBox);
    container.appendChild(scorePanel.root);

    var outPanel = ui.panel({ title: 'CSV · 인쇄' });
    outPanel.body.appendChild(
      ui.buttonRow([
        ui.button({
          label: 'CSV 내려받기',
          variant: 'primary',
          onClick: function () {
            var csv = T.buildCsv(T.summaries || [], T.readScores());
            var ok = ui.downloadText(CSV_NAME, csv, 'text/csv');
            ui.toast(ok ? 'CSV 파일을 저장했어요.' : '저장하지 못했어요.');
          }
        }),
        ui.button({
          label: '전체 현황 인쇄',
          variant: 'secondary',
          onClick: function () {
            printView('all');
          }
        }),
        ui.button({
          label: '팀별 보고서 인쇄',
          variant: 'secondary',
          onClick: function () {
            printView('teams');
          }
        })
      ])
    );
    outPanel.body.appendChild(
      ui.callout(
        'CSV 는 UTF-8 BOM 으로 저장되어 엑셀에서 한글이 깨지지 않는다. ' +
          '인쇄 화면은 흑백에서도 ○ × 같은 <strong>기호</strong>로 구분된다(명세 19.7).',
        { className: 'callout--muted' }
      )
    );
    container.appendChild(outPanel.root);

    var printBox = el('div', { 'class': 'tprint', hidden: true });
    container.appendChild(printBox);

    function paintScores() {
      ui.clear(scoreBox);
      var list = T.summaries || [];
      if (list.length === 0) {
        scoreBox.appendChild(
          el('p', { 'class': 'panel__hint', text: '1장에서 결과를 먼저 불러와 주세요.' })
        );
        return;
      }
      list.forEach(function (s) {
        var mine = scores[s.teamCode] || {};
        var totalNode = el('span', { 'class': 'trubric__total' });

        function paintTotal() {
          var total = (C.RUBRIC || []).reduce(function (sum, area) {
            var value = Number((scores[s.teamCode] || {})[area.id]);
            return sum + (isNaN(value) ? 0 : value);
          }, 0);
          totalNode.textContent = '합계 ' + total + ' / 100';
        }

        var card = el('div', { 'class': 'trubric' }, [
          el('div', { 'class': 'trubric__head' }, [
            el('span', { 'class': 'trubric__name', text: s.teamCode + ' · ' + s.teamName }),
            el('span', {
              'class': 'trubric__meta',
              text:
                '실행 ' + (s.runOk ? '성공' : '실패') +
                ' · 구조 ' + s.structurePassed + '/' + s.structureTotal +
                ' · 테스트 ' + s.testCount + '건'
            }),
            totalNode
          ])
        ]);

        (C.RUBRIC || []).forEach(function (area) {
          card.appendChild(
            ui.textField({
              label: area.name + ' (' + area.max + ')',
              value: mine[area.id] === undefined ? '' : mine[area.id],
              width: '80px',
              inputmode: 'numeric',
              onInput: function (v) {
                var value = v === '' ? '' : Math.max(0, Math.min(area.max, Number(v) || 0));
                scores[s.teamCode] = scores[s.teamCode] || {};
                scores[s.teamCode][area.id] = value;
                T.writeScores(scores);
                paintTotal();
              }
            }).root
          );
        });

        card.appendChild(
          ui.textAreaField({
            label: '피드백',
            rows: 2,
            value: mine.feedback || '',
            onInput: function (v) {
              scores[s.teamCode] = scores[s.teamCode] || {};
              scores[s.teamCode].feedback = v;
              T.writeScores(scores);
            }
          }).root
        );
        paintTotal();
        scoreBox.appendChild(card);
      });
    }

    /** 인쇄용 화면을 만들어 놓고 브라우저 인쇄를 부른다. */
    function printView(kind) {
      var list = T.summaries || [];
      ui.clear(printBox);
      printBox.hidden = false;
      document.body.classList.add('is-printing');

      printBox.appendChild(
        el('h2', { text: '객체를 구현하는 클래스 4차시 · 협력 프로젝트 ' + (kind === 'all' ? '전체 현황' : '팀별 보고서') })
      );

      if (kind === 'all') {
        printBox.appendChild(
          ui.dataTable({
            head: ['팀', '주제', '팀원', '실행', '구조', '테스트', '수정', '합계'],
            rows: list.map(function (s) {
              var score = T.readScores()[s.teamCode] || {};
              var total = (C.RUBRIC || []).reduce(function (sum, area) {
                var value = Number(score[area.id]);
                return sum + (isNaN(value) ? 0 : value);
              }, 0);
              return [
                ui.escapeHtml(s.teamCode + ' ' + s.teamName),
                ui.escapeHtml(s.topicTitle),
                ui.escapeHtml(s.memberNames),
                s.runOk ? '○' : '×',
                s.structurePassed + '/' + s.structureTotal,
                String(s.testCount),
                String(s.improvementCount),
                String(total)
              ];
            })
          })
        );
      } else {
        list.forEach(function (s) {
          var row = s.row;
          var score = T.readScores()[s.teamCode] || {};
          var section = el('section', { 'class': 'tprint__team' }, [
            el('h3', { text: s.teamCode + ' · ' + s.teamName + ' — ' + s.topicTitle }),
            ui.dataTable({
              head: ['팀원', '역할', '기여'],
              rows: ((row.collaboration || {}).contributions || []).map(function (c) {
                return [
                  ui.escapeHtml(c.name || ''),
                  ui.escapeHtml(c.role || ''),
                  ui.escapeHtml((c.kinds || []).join(', '))
                ];
              })
            }),
            el('p', { text: '문제 : ' + ((row.topic || {}).problem || '') }),
            el('p', {
              text:
                '설계 : ' + ((row.design || {}).className || '') +
                ' · 속성 ' + (((row.design || {}).properties) || []).join(', ') +
                ' · 메소드 ' + (((row.design || {}).methods) || []).join(', ')
            }),
            ui.codeBlock({ title: '최종 코드', code: row.code || '', copy: false }),
            el('pre', { 'class': 'tprint__out', text: '출력\n' + ((row.runtime || {}).stdout || '') }),
            el('p', {
              text:
                '실행 ' + (s.runOk ? '성공 ○' : '실패 ×') +
                ' · 구조 ' + s.structurePassed + '/' + s.structureTotal +
                ' · 테스트 ' + s.testCount + '건 · 수정 ' + s.improvementCount + '건'
            }),
            el('p', {
              text:
                '루브릭 : ' +
                (C.RUBRIC || [])
                  .map(function (area) {
                    return area.name + ' ' + (score[area.id] === undefined ? '-' : score[area.id]);
                  })
                  .join(' · ')
            }),
            el('p', { text: '피드백 : ' + (score.feedback || '') })
          ]);
          printBox.appendChild(section);
        });
      }

      window.setTimeout(function () {
        window.print();
        window.setTimeout(function () {
          printBox.hidden = true;
          document.body.classList.remove('is-printing');
        }, 300);
      }, 60);
    }

    T.onData(function () {
      scores = T.readScores();
      paintScores();
    });
    paintScores();
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = T;
  }
})();

        head: ['Python 오류', '학생 안내'],
        rows: [
          ['IndentationError', '클래스·메소드·조건문의 들여쓰기 단계를 확인하세요.'],
          ['SyntaxError', '콜론, 괄호, 따옴표가 빠지지 않았는지 확인하세요.'],
          ['NameError', '사용한 클래스·객체·변수 이름이 앞에서 정의되었는지 확인하세요.'],
          ['AttributeError', '해당 객체에 그 속성이나 메소드가 정의되어 있는지 확인하세요.'],
          ['TypeError', '메소드 호출의 소괄호와 전달값을 확인하세요.']
        ]
      })
    );
    box.appendChild(guide.root);
  }

  /* ------------------------------------------------------------------ */
  /* 장 이동                                                             */
  /* ------------------------------------------------------------------ */

  function goChapter(no) {
    var next = Math.max(1, Math.min(CHAPTERS.length, Number(no) || 1));
    Object.keys(screens).forEach(function (key) {
      screens[key].hidden = Number(key) !== next;
    });
    current = next;
    ui.$$('.t-nav__btn', navList).forEach(function (button) {
      var n = Number(button.dataset.chapter);
      button.classList.toggle('is-on', n === current);
      button.setAttribute('aria-current', n === current ? 'true' : 'false');
    });
    ui.announce(current + '장 ' + CHAPTERS[current - 1].name);
  }
  T.goChapter = goChapter;

  function boot() {
    CHAPTERS.forEach(function (chapter) {
      navList.appendChild(
        el('li', {}, [
          el('button', {
            type: 'button',
            'class': 't-nav__btn',
            text: chapter.no + '. ' + chapter.name,
            dataset: { chapter: String(chapter.no) },
            on: {
              click: function () {
                goChapter(chapter.no);
              }
            }
          })
        ])
      );

      var section = el('section', {
        'class': 't-chapter',
        hidden: true,
        attrs: { 'aria-label': chapter.no + '장 ' + chapter.name }
      });
      section.appendChild(el('h2', { 'class': 't-chapter__title', text: chapter.no + '장 · ' + chapter.name }));
      var box = el('div', { 'class': 'stack' });
      section.appendChild(box);
      main.appendChild(section);
      screens[chapter.no] = section;

      try {
        chapter.render(box);
      } catch (err) {
        box.appendChild(ui.callout('이 장을 그리는 중 문제가 생겼어요.', { className: 'callout--warn' }));
        if (window.console) window.console.error(err);
      }
    });

    goChapter(1);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
