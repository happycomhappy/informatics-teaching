    <script data-from="js/70-collaboration.js">
/**
 * 페이지 9 — 결과 설명 · 발표 카드 · 개인별 기여 확인 (명세 13.1 ~ 13.3)
 *
 * 자동 채점하지 않는다. 팀원의 자기 확인만으로 점수를 주지 않고,
 * 교사용에서 전체 기록을 함께 보도록 한다(명세 6.4).
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var collab = L.collab || (L.collab = {});
  var C = L.CONST || {};

  /** 팀 결과 설명 일곱 문항 (명세 13.1) */
  var QUESTIONS = [
    { id: 'q1', text: '우리 팀이 해결하려는 문제는 무엇인가?' },
    { id: 'q2', text: '어떤 클래스를 만들었는가?' },
    { id: 'q3', text: '어떤 속성과 메소드를 정의했는가?' },
    { id: 'q4', text: '어떤 인스턴스를 만들고 값을 어떻게 다르게 설정했는가?' },
    { id: 'q5', text: '조건문은 어느 메소드에서 어떤 판단을 하는가?' },
    { id: 'q6', text: '가장 중요한 오류 또는 개선은 무엇이었는가?' },
    { id: 'q7', text: '실행 결과가 문제 해결과 어떻게 연결되는가?' }
  ];
  collab.QUESTIONS = QUESTIONS;

  /** 개인별 기여 확인 항목 (명세 13.3) */
  var CONTRIB_FIELDS = [
    { id: 'role', label: '내가 맡은 역할' },
    { id: 'did', label: '내가 실제로 기여한 일 2가지' },
    { id: 'understood', label: '내가 이해한 코드 한 부분' },
    { id: 'next', label: '다음 프로젝트에서 개선할 협력 방법' }
  ];
  collab.CONTRIB_FIELDS = CONTRIB_FIELDS;

  /* ================================================================== */
  /* 검사                                                                */
  /* ================================================================== */

  /** 설명 일곱 문항 (각 20~500자) */
  collab.validateExplanation = function (data) {
    var e = (data && data.explanation) || {};
    var min = C.EXPLAIN_MIN || 20;
    var max = C.EXPLAIN_MAX || 500;
    var problems = [];
    var done = 0;
    QUESTIONS.forEach(function (q, index) {
      var text = String(e[q.id] || '').trim();
      if (text.length === 0) return;
      if (text.length < min) {
        problems.push(index + 1 + '번 답을 ' + min + '자 이상으로 적어 주세요.');
        return;
      }
      if (text.length > max) {
        problems.push(index + 1 + '번 답이 ' + max + '자를 넘었어요.');
        return;
      }
      done += 1;
    });
    if (done < QUESTIONS.length) {
      problems.unshift('일곱 문항에 모두 답해 주세요. (' + done + '/' + QUESTIONS.length + ')');
    }
    return { ok: problems.length === 0, problems: problems, done: done };
  };

  /** 개인별 기여 확인 (팀원 수만큼) */
  collab.validateContributions = function (data) {
    var d = data || {};
    var min = C.CONTRIB_MIN || 20;
    var max = C.CONTRIB_MAX || 300;
    var problems = [];
    var members = (d.members || []).filter(function (m) {
      return String(m.name || '').trim();
    });
    if (members.length === 0) {
      return { ok: false, problems: ['5페이지에서 팀원을 먼저 등록해 주세요.'], done: 0 };
    }
    var records = d.contributionRecords || {};
    var done = 0;
    members.forEach(function (m, index) {
      var rec = records[index] || {};
      var who = m.name || '학생 ' + (index + 1);

      // 네 칸을 모두 채웠는지 먼저 본다 (빈칸이 있으면 그것부터 알려 준다)
      var empty = CONTRIB_FIELDS.filter(function (f) {
        return String(rec[f.id] || '').trim().length < 2;
      });
      if (empty.length > 0) {
        problems.push(who + ' 의 “' + empty[0].label + '” 칸이 비어 있어요.');
        return;
      }

      // 명세 13.3 : 학생별 입력은 20~300자.
      // 칸마다 20자를 강요하지 않고 «그 학생이 쓴 글 전체» 를 기준으로 본다.
      var total = CONTRIB_FIELDS.reduce(function (sum, f) {
        return sum + String(rec[f.id] || '').trim().length;
      }, 0);
      var tooLong = CONTRIB_FIELDS.filter(function (f) {
        return String(rec[f.id] || '').length > max;
      });
      if (tooLong.length > 0) {
        problems.push(who + ' 의 “' + tooLong[0].label + '” 이 ' + max + '자를 넘었어요.');
        return;
      }
      if (total < min) {
        problems.push(who + ' 의 기여 기록을 모두 합쳐 ' + min + '자 이상으로 적어 주세요. (지금 ' + total + '자)');
        return;
      }
      done += 1;
    });
    return { ok: problems.length === 0, problems: problems, done: done, total: members.length };
  };

  /** 발표 카드 문장 만들기 (명세 13.2) — 팀 입력만으로 틀을 채운다. */
  collab.buildPresentation = function (data) {

    var topic = d.topic || {};
    var design = d.design || {};
    var props = (design.properties || []).filter(Boolean);
    var methods = (design.methods || []).filter(Boolean);
    var instances = (design.instances || [])
      .filter(function (i) {
        return i && i.objectName;
      })
      .map(function (i) {
        return i.objectName;
      });
    var fix = (d.improvements || [])[0] || {};

    function blank(value, hint) {
      var text = String(value || '').trim();
      return text || '______(' + hint + ')';
    }

    return [
      '우리 팀의 주제는 ' + blank(topic.title, '주제') + '입니다.',
      blank(topic.problem, '문제') + ' 문제를 해결하기 위해 ' +
        blank(design.className, '클래스') + ' 클래스를 만들었습니다.',
      '핵심 속성은 ' + blank(props.join(', '), '속성') + '이고, 핵심 메소드는 ' +
        blank(methods.join(', '), '메소드') + '입니다.',
      '서로 다른 두 객체인 ' + blank(instances[0], '객체1') + '과 ' +
        blank(instances[1], '객체2') + '을 만들었습니다.',
      '테스트 과정에서 ' + blank(fix.problem, '발견한 점') + '을 발견해 ' +
        blank(fix.change, '수정 내용') + '으로 수정했습니다.',
      '실행 결과 ' + blank(String(d.runtime && d.runtime.stdout).split('\n')[0], '실행 결과') + '을 확인했습니다.'
    ].join('\n');
  };

  /* ================================================================== */
  /* 화면                                                                */
  /* ================================================================== */

  if (typeof document === 'undefined' || !L.registerPage) {
    if (typeof module !== 'undefined' && module.exports) module.exports = collab;
    return;
  }

  var ui = L.ui;
  var el = ui.el;

  function d() {
    return L.state.get();
  }
  function save(mutator) {
    L.state.update(mutator);
    L.nav.refresh();
  }

  L.registerPage(9, {
    render: function (container) {
      container.appendChild(
        ui.pageHeader({
          page: 9,
          title: '결과 설명과 발표',
          lead: [
            '만든 것을 <strong>근거를 들어 설명</strong>할 수 있어야 프로젝트가 끝난 것이다.',
            '코드와 실행 결과를 가리키며 설명한다. 네 명이 각자 자신의 기여도 기록한다.'
          ]
        })
      );

      /* ---------------- 팀 결과 설명 ---------------- */
      var explainPanel = ui.panel({
        title: '① 팀 결과 설명 (7문항)',
        hint: '각 답은 ' + (C.EXPLAIN_MIN || 20) + '~' + (C.EXPLAIN_MAX || 500) + '자로 적는다.'
      });
      var explainBox = el('div', { 'class': 'stack' });
      explainPanel.body.appendChild(explainBox);
      var explainFeedback = ui.createFeedback({});
      explainPanel.body.appendChild(explainFeedback.root);

      QUESTIONS.forEach(function (q, index) {

        function paintCount() {

          counter.className =
            'char-count ' +
            (len === 0 ? '' : len < (C.EXPLAIN_MIN || 20) ? 'is-short' : len > (C.EXPLAIN_MAX || 500) ? 'is-over' : 'is-ok');
        }
        paintCount();
        explainBox.appendChild(el('div', { 'class': 'qfield' }, [field.root, counter]));
      });

      function paintExplainFeedback() {
        var r = collab.validateExplanation(d());
        if (r.ok) explainFeedback.show('success', '일곱 문항을 모두 적었어요.');

      /* ---------------- 발표 카드 ---------------- */
      var cardPanel = ui.panel({

      });
      var draftBox = el('div', { 'class': 'presentation-draft' });

      var presentField = ui.textAreaField({

              presentField.setValue(text);

      function paintContrib() {

            card.appendChild(
              ui.textAreaField({
                label: f.label,
                rows: f.id === 'role' ? 1 : 2,
                value: value,
                placeholder:
                  f.id === 'did'
                    ? '예) 조건문을 함께 고쳤고, 두 번째 테스트를 실행했다.'
                    : f.id === 'understood'
                    ? '예) check_water 안의 if 문이 어떤 값을 비교하는지 설명할 수 있다.'
                    : '',
                onInput: function (v) {
                  save(function (s) {
                    s.contributionRecords = s.contributionRecords || {};
                    s.contributionRecords[index] = s.contributionRecords[index] || {};
                    s.contributionRecords[index][f.id] = v;
                  });
                  paintContribFeedback();
                }
              }).root
            );
          });

          card.appendChild(el('p', { 'class': 'field__label', text: '이번 프로젝트에서 내가 한 일 (해당되는 것 모두)' }));
          card.appendChild(
            ui.checkboxGroup({
              ariaLabel: m.name + ' 의 기여 항목',
              values: m.contributions || [],
              options: (C.CONTRIBUTION_KINDS || []).map(function (k) {
                return { value: k, label: k };
              }),
              onChange: function (values) {
                save(function (s) {
                  s.members[index].contributions = values;
                });
              }
            }).root
          );
          contribBox.appendChild(card);
        });
        if (contribBox.children.length === 0) {
          contribBox.appendChild(
            el('p', { 'class': 'panel__hint', text: '5페이지에서 팀원 이름을 먼저 입력해 주세요.' })
          );
        }
        paintContribFeedback();
      }

      function paintContribFeedback() {
        var r = collab.validateContributions(d());
        if (r.ok) contribFeedback.show('success', '네 명의 기여 기록을 모두 남겼어요.');
        else contribFeedback.show('info', r.problems.slice(0, 3).map(ui.escapeHtml).join('<br>'));
      }
      paintContrib();

      L.collab.repaint = function () {
        paintContrib();
        paintPresentation();
      };
    },

    onEnter: function () {
      if (L.collab.repaint) L.collab.repaint();
    },

    check: function () {
      var e = collab.validateExplanation(d());
      if (!e.ok) return { ok: false, hint: e.problems[0] };
      var c = collab.validateContributions(d());
      if (!c.ok) return { ok: false, hint: c.problems[0] };
      return { ok: true, hint: '' };
    }
  });

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = collab;
  }
})();

    <script data-from="js/80-submit.js">
/**
 * 페이지 10 — 팀 상호 확인 · 성찰 · 제출 (명세 13.4 · 13.5 · 16장)
 *
 * 제출이 실패해도 프로젝트가 막히지 않는다(명세 2.4 · 27.1).
 * 실패하면 JSON · .py · .txt 로 내려받아 선생님께 낼 수 있다.
 */
(function () {
  "use strict";

  var L = (typeof window !== 'undefined' ? window : global).L || {};
  if (typeof window !== 'undefined') window.L = L;
  var submit = L.submit || (L.submit = {});
  var C = L.CONST || {};

  /** 상호 확인 네 항목 (명세 13.4) */
  var MUTUAL_ITEMS = [
    { id: 'topic', label: '주제와 문제 설명에 동의한다.' },
    { id: 'code', label: '최종 코드를 함께 확인했다.' },
    { id: 'run', label: '실행 결과를 확인했다.' },
    { id: 'contribution', label: '내 기여 기록이 사실과 맞다.' }
  ];
  submit.MUTUAL_ITEMS = MUTUAL_ITEMS;

  /* ================================================================== */
  /* 검사                                                                */
  /* ================================================================== */

  submit.validateFinal = function (data) {
    var d = data || {};
    var problems = [];
    var members = (d.members || []).filter(function (m) {
      return String(m.name || '').trim();
    });
    var checks = d.mutualChecks || {};
    var reflections = d.reflections || {};

    members.forEach(function (m, index) {
      var mine = checks[index] || {};
      var missing = MUTUAL_ITEMS.filter(function (item) {
        return mine[item.id] !== true;
      });
      if (missing.length > 0) {
        problems.push((m.name || '학생 ' + (index + 1)) + ' 의 상호 확인이 아직 남았어요.');
      }
      var ref = reflections[index] || {};
      if (String(ref.personal || '').trim().length < 5) {
        problems.push((m.name || '학생 ' + (index + 1)) + ' 의 개인 성찰 한 문장을 적어 주세요.');
      }
      if (String(ref.suggestion || '').trim().length < 5) {
        problems.push((m.name || '학생 ' + (index + 1)) + ' 의 모둠 협력 제안 한 문장을 적어 주세요.');
      }
    });
    if (members.length === 0) problems.push('5페이지에서 팀원을 먼저 등록해 주세요.');

    return { ok: problems.length === 0, problems: problems };
  };

  /* ================================================================== */
  /* 내려받기 파일 만들기 (명세 13.5)                                     */
  /* ================================================================== */

  /** 파일 이름에 쓸 수 없는 글자를 안전하게 바꾼다. */
  submit.safeFileName = function (name) {
    return String(name || '')
      .replace(/[\\/:*?"<>|]/g, '_')
      .replace(/\s+/g, '_')
      .slice(0, 60);
  };

  /** 사람이 읽는 결과 보고서 (.txt) */
  submit.buildReport = function (payload) {
    var p = payload || {};
    var lines = [];
    function head(text) {
      lines.push('');
      lines.push('=== ' + text + ' ===');
    }

    lines.push('객체를 구현하는 클래스 4차시 · 협력 프로젝트 결과 보고서');
    lines.push('팀 : ' + (p.teamCode || '') + ' ' + (p.teamName || ''));
    lines.push('작성 시각 : ' + (p.submittedAtClient || ''));

    head('팀원');
    (p.members || []).forEach(function (m) {
      lines.push('- ' + m.studentId + ' ' + m.name + ' (' + (m.role || '역할 미정') + ')');
    });

    head('주제와 문제');
    var topic = p.topic || {};
    lines.push('주제 유형 : ' + (topic.type || ''));
    lines.push('주제명 : ' + (topic.title || ''));
    lines.push('해결할 문제 : ' + (topic.problem || ''));
    lines.push('사용자 : ' + (topic.user || ''));
    lines.push('기대 결과 : ' + (topic.expectedResult || ''));
    lines.push('선택 이유 : ' + (topic.reason || ''));

    head('클래스 설계');
    var design = p.design || {};
    lines.push('클래스 : ' + (design.className || ''));
    lines.push('설명 : ' + (design.classDescription || ''));
    lines.push('속성 : ' + (design.properties || []).join(', '));
    lines.push('메소드 : ' + (design.methods || []).join(', '));
    lines.push('조건 메소드 : ' + (design.conditionalMethod || ''));
    (design.instances || []).forEach(function (inst) {
      var values = Object.keys(inst.values || {})
        .map(function (k) {
          return k + '=' + inst.values[k];
        })
        .join(', ');
      lines.push('객체 ' + inst.objectName + ' : ' + values);
    });

    head('최종 코드');
    lines.push(p.code || '');

    head('실행 결과 (팀이 밖에서 실행하고 기록)');
    var runtime = p.runtime || {};
    lines.push('실행 환경 : 웹앱 밖의 Python');
    lines.push('팀 확인 「정상 실행됨」 : ' + (runtime.lastRunSucceeded ? '예' : '아니오'));
    lines.push('기록 시각 : ' + (runtime.recordedAt || ''));
    lines.push(
      '구조 검사 : ' + ((runtime.structureChecks || {}).passed || 0) + ' / ' +
        ((runtime.structureChecks || {}).total || 9)
    );
    lines.push('--- 출력 ---');
    lines.push(runtime.stdout || '(없음)');
    if (runtime.stderr) {
      lines.push('--- 오류 ---');
      lines.push(runtime.stderr);
    }

    head('테스트');
    (p.tests || []).forEach(function (t, i) {
      lines.push(i + 1 + '. ' + t.name + ' — ' + (t.passedByTeam ? '통과(팀 판정)' : '불일치(팀 판정)'));
      lines.push('   설정 : ' + (t.setup || ''));
      lines.push('   호출 : ' + (t.call || ''));
      lines.push('   예상 : ' + (t.expected || ''));
      lines.push('   실제 : ' + String(t.actual || '').replace(/\n/g, ' / '));
    });

    head('오류·개선 기록');
    (p.improvements || []).forEach(function (imp, i) {
      lines.push(i + 1 + '. ' + (imp.problem || ''));
      if (imp.message) lines.push('   메시지 : ' + imp.message);
      if (imp.cause) lines.push('   원인 : ' + imp.cause);
      lines.push('   수정 : ' + (imp.change || ''));
      lines.push('   결과 : ' + (imp.result || ''));
      lines.push('   참여 : ' + (imp.members || []).join(', '));
    });

    head('팀 설명');
    var explanation = p.explanation || {};
    Object.keys(explanation).forEach(function (key) {
      lines.push('- ' + explanation[key]);
    });

    head('발표문');
    lines.push(p.presentation || '');

    head('협력 기록');
    var collaboration = p.collaboration || {};
    lines.push('협력 약속 : ' + (collaboration.agreements || []).join(' / '));
    (collaboration.contributions || []).forEach(function (c) {
      lines.push('- ' + c.name + ' (' + (c.role || '') + ') : ' + (c.kinds || []).join(', '));
    });

    return lines.join('\n');
  };

  /**
   * 제출한다. 실패해도 예외를 던지지 않고 { ok, message } 를 돌려준다.
   * Apps Script 는 CORS 사전 요청을 피하려고 text/plain 으로 보낸다.
   */
  submit.send = function (endpoint, payload) {
    var url = String(endpoint || '').trim();
    if (!url) {
      return Promise.resolve({ ok: false, message: '제출 주소가 없습니다. 선생님께 받은 주소를 입력해 주세요.' });
    }
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.text().then(function (text) {
          var data = null;
          try {
            data = JSON.parse(text);
          } catch (err) {
            data = null;
          }
          if (!res.ok) {
            return { ok: false, message: '서버가 오류를 돌려주었습니다. (' + res.status + ')' };
          }
          if (data && data.ok === false) {
            return { ok: false, message: data.message || '서버에서 저장하지 못했습니다.' };
          }
          return { ok: true, message: (data && data.message) || '제출을 마쳤습니다.' };
        });
      })
      .catch(function (err) {
        return {
          ok: false,
          message: '보내지 못했습니다. 인터넷 연결이나 주소를 확인해 주세요. (' + (err && err.message ? err.message : '') + ')'
        };
      });
  };

  /* ================================================================== */
  /* 화면                                                                */
  /* ================================================================== */

  if (typeof document === 'undefined' || !L.registerPage) {
    if (typeof module !== 'undefined' && module.exports) module.exports = submit;
    return;
  }

  var ui = L.ui;
  var el = ui.el;

  function d() {
    return L.state.get();
  }
  function save(mutator) {
    L.state.update(mutator);
    L.nav.refresh();
  }

  L.registerPage(10, {
    render: function (container) {
      container.appendChild(
        ui.pageHeader({
          page: 10,
          title: '성찰과 최종 제출',
          lead: [
            '네 명이 서로의 기록을 확인하고, 오늘 한 일을 <strong>한 문장으로</strong> 돌아본다.',
            '제출이 안 되어도 괜찮다. <strong>파일로 저장해</strong> 선생님께 낼 수 있다.'
          ]
        })
      );

      /* ---------------- 팀 상호 확인 + 성찰 ---------------- */
      var checkPanel = ui.panel({
        title: '① 팀 상호 확인과 성찰',
        hint: '네 명이 각자 자기 칸을 확인하고 한 문장씩 적는다.'
      });
      var checkBox = el('div', { 'class': 'stack' });
      checkPanel.body.appendChild(checkBox);
      var checkFeedback = ui.createFeedback({});
      checkPanel.body.appendChild(checkFeedback.root);
      container.appendChild(checkPanel.root);

      function paintChecks() {
        ui.clear(checkBox);
        var members = d().members;
        var any = false;
        members.forEach(function (m, index) {
          if (!String(m.name || '').trim()) return;
          any = true;
          var role = L.findRole(m.role);
          var mine = (d().mutualChecks || {})[index] || {};
          var ref = (d().reflections || {})[index] || {};

          var card = el('div', { 'class': 'checkcard' }, [
            el('div', { 'class': 'checkcard__head' }, [
              el('span', { 'class': 'checkcard__name', text: m.name }),
              el('span', { 'class': 'checkcard__role', text: role ? role.icon + ' ' + role.name : '역할 미정' })
            ])
          ]);

          MUTUAL_ITEMS.forEach(function (item) {
            card.appendChild(
              ui.checkLine({
                label: item.label,
                checked: mine[item.id] === true,
                onChange: function (on) {
                  save(function (s) {
                    s.mutualChecks = s.mutualChecks || {};
                    s.mutualChecks[index] = s.mutualChecks[index] || {};
                    s.mutualChecks[index][item.id] = on;
                  });
                  paintFeedback();
                }
              }).root
            );
          });

          card.appendChild(
            ui.textField({
              label: '오늘 내가 배운 것 (한 문장)',
              value: ref.personal || '',
              width: '100%',
              align: 'left',
              onInput: function (v) {
                save(function (s) {
                  s.reflections = s.reflections || {};
                  s.reflections[index] = s.reflections[index] || {};
                  s.reflections[index].personal = v;
                });
                paintFeedback();
              }
            }).root
          );
          card.appendChild(
            ui.textField({
              label: '다음에 우리 팀이 더 잘하려면 (한 문장)',
              value: ref.suggestion || '',
              width: '100%',
              align: 'left',
              onInput: function (v) {
                save(function (s) {
                  s.reflections = s.reflections || {};
                  s.reflections[index] = s.reflections[index] || {};
                  s.reflections[index].suggestion = v;
                });
                paintFeedback();
              }
            }).root
          );
          checkBox.appendChild(card);
        });
        if (!any) {
          checkBox.appendChild(
            el('p', { 'class': 'panel__hint', text: '5페이지에서 팀원 이름을 먼저 입력해 주세요.' })
          );
        }
        paintFeedback();
      }

      function paintFeedback() {
        var r = submit.validateFinal(d());
        if (r.ok) checkFeedback.show('success', '네 명의 확인과 성찰이 모두 기록되었어요.');
        else checkFeedback.show('info', r.problems.slice(0, 3).map(ui.escapeHtml).join('<br>'));
      }

      /* ---------------- 제출 ---------------- */
      var sendPanel = ui.panel({
        title: '② 제출',
        hint: '보내기 전에 무엇이 전달되는지 미리 볼 수 있다.'
      });

      var endpointField = ui.textField({
        label: '제출 주소 (선생님이 알려 주신 주소)',
        value: L.state.getEndpoint(),
        width: '100%',
        align: 'left',
        placeholder: 'https://script.google.com/macros/s/…/exec',
        onInput: function (v) {
          L.state.setEndpoint(v);
        }
      });
      if (!C.SUBMIT_URL) sendPanel.body.appendChild(endpointField.root);

      sendPanel.body.appendChild(
        ui.callout(
          '<strong>무엇이 전달되나요</strong> — 팀명·팀 코드, 팀원의 학번·이름·역할, 주제와 문제, 설계표, ' +
            '최종 코드와 출력, 테스트와 수정 기록, 팀 설명, 개인별 기여 기록. ' +
            '학번과 이름은 <strong>제출할 때만</strong> 전달된다(명세 23장).',
          { className: 'callout--muted' }
        )
      );

      var sendStatus = el('p', { 'class': 'runstatus', attrs: { 'aria-live': 'polite' } });

      sendPanel.body.appendChild(
        ui.buttonRow([
          ui.button({
            label: '제출 내용 미리 보고 제출하기',
            variant: 'primary',
            onClick: function () {
              openPreview();
            }
          }),
          ui.button({
            label: '팀 프로젝트 JSON 저장',
            variant: 'secondary',
            onClick: function () {
              downloadJson();
            }
          }),
          ui.button({
            label: '코드 .py 저장',
            variant: 'secondary',
            onClick: function () {
              var payload = L.state.toSubmission();
              ui.downloadText(
                submit.safeFileName(payload.teamCode + '_' + payload.teamName) + '.py',
                payload.code || '',
                'text/x-python'
              );
            }
          }),
          ui.button({
            label: '결과 보고서 .txt 저장',
            variant: 'secondary',
            onClick: function () {
              var payload = L.state.toSubmission();
              ui.downloadText(
                submit.safeFileName(payload.teamCode + '_' + payload.teamName) + '_보고서.txt',
                submit.buildReport(payload)
              );
            }
          })
        ])
      );
      sendPanel.body.appendChild(sendStatus);
      container.appendChild(sendPanel.root);

      /* ---------------- 마무리 ---------------- */
      var endPanel = ui.panel({ title: '③ 오늘의 프로젝트를 마치며' });
      endPanel.body.appendChild(
        ui.callout(
          '급식 조회 프로젝트처럼 우리 팀도 <strong>문제 정의 → 아이디어 → 설계 → 프로그래밍 → 테스트 → 공유</strong> 를 모두 거쳤다. ' +
            '클래스는 «생활 속 대상» 을 프로그램 안으로 데려오는 방법이다.'
        )
      );
      var summaryBox = el('div');
      endPanel.body.appendChild(summaryBox);
      container.appendChild(endPanel.root);

      function paintSummary() {
        var s = d();
        var structure = s.runtime.structureChecks || { passed: 0, total: 9 };
        ui.clear(summaryBox);
        summaryBox.appendChild(
          ui.dataTable({
            head: ['항목', '결과'],
            rows: [
              ['팀', ui.escapeHtml((s.teamCode || '') + ' ' + (s.teamName || ''))],
              ['주제', ui.escapeHtml(s.topic.title || '')],
              ['클래스', ui.escapeHtml(s.design.className || '')],
              ['실행', s.runtime.lastRunSucceeded ? '성공' : '아직 성공 기록 없음'],
              ['구조 검사', structure.passed + ' / ' + structure.total],
              ['테스트', (s.tests || []).length + '건'],
              ['수정·개선 기록', (s.improvements || []).length + '건'],
              ['제출', s.submitted ? '완료 · ' + ui.formatTime(s.submittedAt) : '아직']
            ]
          })
        );
      }

      /* ---------------- 미리 보기 모달 ---------------- */
      /* ---------------- 미리 보기 (명세 13.5) ---------------- */

      /** 값이 비었으면 «아직 없음» 을 눈에 띄게 표시한다 */
      function shown(value) {
        var text = String(value === undefined || value === null ? '' : value).trim();
        if (text) return ui.escapeHtml(text);
        return '<span class="preview__empty">(아직 없음)</span>';
      }

      /** 미리 보기 한 덩어리 : 제목 + 내용 */
      function section(title, node, count) {
        return el('section', { 'class': 'preview__section' }, [
          el('h3', { 'class': 'preview__title' }, [
            el('span', { text: title }),
            count ? el('span', { 'class': 'preview__count', text: count }) : null
          ]),
          node
        ]);
      }

      function previewBody(payload) {
        var box = el('div', { 'class': 'preview' });
        var runtime = payload.runtime || {};
        var structure = runtime.structureChecks || { passed: 0, total: 9 };

        /* ① 빠진 것이 있으면 맨 위에서 먼저 알려 준다 */
        var missing = [];
        if (!payload.teamName || !payload.teamCode) missing.push('팀명·팀 코드');
        if (payload.members.length < 4) missing.push('팀원 4명');
        if (!payload.topic.title) missing.push('주제');
        if (!payload.design.className) missing.push('클래스 설계');
        if (!String(payload.code || '').trim()) missing.push('최종 코드');
        if (structure.passed < structure.total) missing.push('구조 검사 ' + structure.passed + '/' + structure.total);
        if (!runtime.lastRunSucceeded) missing.push('실행 확인');
        if (!String(runtime.stdout || '').trim()) missing.push('실행 결과');
        if (payload.tests.length < 2) missing.push('테스트 2건');
        if (payload.improvements.length < 1) missing.push('수정·개선 기록');

        box.appendChild(
          missing.length > 0
            ? ui.callout(
                '<strong>아직 비어 있는 항목이 있어요</strong> — ' + ui.escapeHtml(missing.join(', ')) +
                  '<br>이대로 보내도 되지만, [취소] 하고 채운 뒤 보내는 것을 권해요.',
                { className: 'callout--warn' }
              )
            : ui.callout('필요한 내용이 모두 준비되었어요. 아래를 확인하고 보내세요.')
        );

        /* ② 팀 */
        box.appendChild(
          section(
            '팀',
            ui.dataTable({
              head: ['학번', '이름', '역할'],
              rows:
                payload.members.length > 0
                  ? payload.members.map(function (m) {
                      return [shown(m.studentId), shown(m.name), shown(m.role)];
                    })
                  : [['(아직 없음)', '', '']]
            }),
            (payload.teamCode || '(코드 없음)') + ' · ' + (payload.teamName || '(팀명 없음)')
          )
        );

        /* ③ 주제와 문제 */
        box.appendChild(
          section(
            '주제와 문제',
            ui.dataTable({
              head: ['항목', '내용'],
              rows: [
                ['주제', shown(payload.topic.title)],
                ['해결할 문제', shown(payload.topic.problem)],
                ['사용자', shown(payload.topic.user)],
                ['기대 결과', shown(payload.topic.expectedResult)]
              ]
            })
          )
        );

        /* ④ 설계 */
        box.appendChild(
          section(
            '클래스 설계',
            ui.dataTable({
              head: ['항목', '내용'],
              rows: [
                ['클래스', shown(payload.design.className)],
                ['속성', shown(payload.design.properties.join(', '))],
                ['메소드', shown(payload.design.methods.join(', '))],
                ['조건 메소드', shown(payload.design.conditionalMethod)],
                [
                  '객체',
                  shown(
                    payload.design.instances
                      .map(function (i) {
                        return i.objectName;
                      })
                      .join(', ')
                  )
                ]
              ]
            })
          )
        );

        /* ⑤ 코드 — 길면 안에서만 스크롤된다 */
        box.appendChild(
          section(
            '최종 코드',
            ui.codeBlock({ title: 'Python', code: payload.code || '(비어 있음)', className: 'codeblock--tall' }),
            String(payload.code || '').split('\n').length + '줄'
          )
        );

        /* ⑥ 실행 결과 */
        box.appendChild(
          section(
            '실행 결과 (팀이 밖에서 실행하고 기록)',
            el('div', { 'class': 'stack' }, [
              ui.dataTable({
                head: ['항목', '내용'],
                rows: [
                  ['팀 확인', runtime.lastRunSucceeded ? '정상 실행됨 ○' : '아직 확인 안 함 ×'],
                  ['구조 검사', structure.passed + ' / ' + structure.total]
                ]
              }),
              el('div', { 'class': 'outbox' }, [
                el('p', { 'class': 'outbox__title', text: '붙여 넣은 출력' }),
                el('pre', { 'class': 'outbox__pre', text: runtime.stdout || '(없음)' })
              ])
            ])
          )
        );

        /* ⑦ 테스트 */
        box.appendChild(
          section(
            '테스트',
            payload.tests.length > 0
              ? ui.dataTable({
                  head: ['이름', '예상', '실제', '판정'],
                  rows: payload.tests.map(function (t) {
                    return [
                      shown(t.name),
                      shown(t.expected),
                      shown(t.actual),
                      t.passedByTeam ? '통과 ○' : '불일치 ×'
                    ];
                  })
                })
              : el('p', { 'class': 'preview__none', text: '아직 기록한 테스트가 없어요.' }),
            payload.tests.length + '건'
          )
        );

        /* ⑧ 수정·개선 */
        box.appendChild(
          section(
            '오류 수정 · 기능 개선',
            payload.improvements.length > 0
              ? ui.dataTable({
                  head: ['문제·불편', '수정·개선', '결과'],
                  rows: payload.improvements.map(function (imp) {
                    return [shown(imp.problem), shown(imp.change), shown(imp.result)];
                  })
                })
              : el('p', { 'class': 'preview__none', text: '아직 기록이 없어요.' }),
            payload.improvements.length + '건'
          )
        );

        /* ⑨ 설명과 기여 */
        var explanation = payload.explanation || {};
        var questions = (L.collab && L.collab.QUESTIONS) || [];
        var explainRows = questions
          .filter(function (q) {
            return String(explanation[q.id] || '').trim();
          })
          .map(function (q, i) {
            return [String(i + 1), ui.escapeHtml(explanation[q.id])];
          });
        box.appendChild(
          section(
            '팀 설명',
            explainRows.length > 0
              ? ui.dataTable({ head: ['문항', '답'], rows: explainRows })
              : el('p', { 'class': 'preview__none', text: '아직 답한 문항이 없어요.' }),
            explainRows.length + ' / ' + (questions.length || 7) + '문항'
          )
        );

        var contributions = (payload.collaboration || {}).contributions || [];
        box.appendChild(
          section(
            '개인별 기여',
            contributions.length > 0
              ? ui.dataTable({
                  head: ['이름', '역할', '한 일'],
                  rows: contributions.map(function (c) {
                    return [shown(c.name), shown(c.role), shown((c.kinds || []).join(', '))];
                  })
                })
              : el('p', { 'class': 'preview__none', text: '아직 기록이 없어요.' })
          )
        );

        box.appendChild(
          ui.callout(
            '<strong>보내는 정보</strong> — 위 내용과 팀원의 학번·이름이 함께 전달된다. ' +
              '학번과 이름은 <strong>제출할 때만</strong> 전달된다(명세 23장).',
            { className: 'callout--muted' }
          )
        );
        return box;
      }

      function openPreview() {
        var payload = L.state.toSubmission();
        ui.modal({
          title: '이 내용을 선생님께 보냅니다',
          lead: '틀린 내용이 있으면 [취소] 하고 고칠 수 있어요.',
          body: previewBody(payload),
          actions: [
            { label: '취소', variant: 'ghost', value: 'cancel' },
            {
              label: '제출하기',
              variant: 'primary',
              value: 'send',
              onClick: function (done) {
                done('send');
                doSend(payload);
              }
            }
          ]
        });
      }

      function doSend(payload) {
        var endpoint = L.state.getEndpoint();
        sendStatus.textContent = '보내는 중…';
        submit.send(endpoint, payload).then(function (res) {
          if (res.ok) {
            sendStatus.textContent = '제출 완료 · ' + ui.formatTime(new Date());
            save(function (s) {
              s.submitted = true;
              s.submittedAt = new Date().toISOString();
            });
            ui.toast('제출을 마쳤어요.');
            paintSummary();
            return;
          }
          sendStatus.textContent = '제출 실패 · ' + res.message;
          ui.modal({
            title: '제출하지 못했어요',
            lead: res.message,
            body: el('p', {
              text:
                '괜찮아요. 아래 방법 중 하나로 결과를 남길 수 있어요. ' +
                '파일로 저장해 선생님께 내면 프로젝트는 그대로 인정된다.'
            }),
            actions: [
              {
                label: '다시 시도',
                variant: 'primary',
                onClick: function (done) {
                  done('retry');
                  doSend(payload);
                }
              },
              {
                label: 'JSON 저장',
                variant: 'secondary',
                close: false,
                onClick: function () {
                  downloadJson();
                  return false;
                }
              },
              {
                label: '코드 .py 저장',
                variant: 'secondary',
                close: false,
                onClick: function () {
                  ui.downloadText(
                    submit.safeFileName(payload.teamCode + '_' + payload.teamName) + '.py',
                    payload.code || '',
                    'text/x-python'
                  );
                  return false;
                }
              },
              {
                label: '보고서 .txt 저장',
                variant: 'secondary',
                close: false,
                onClick: function () {
                  ui.downloadText(
                    submit.safeFileName(payload.teamCode + '_' + payload.teamName) + '_보고서.txt',
                    submit.buildReport(payload)
                  );
                  return false;
                }
              },
              { label: '닫기', variant: 'ghost', value: null }
            ]
          });
        });
      }

      function downloadJson() {
        var payload = L.state.toSubmission();
        var ok = ui.downloadText(
          submit.safeFileName(payload.teamCode + '_' + payload.teamName) + '.json',
          JSON.stringify(payload, null, 2),
          'application/json'
        );
        ui.toast(ok ? 'JSON 파일을 저장했어요.' : '저장하지 못했어요.');
      }

      paintChecks();
      paintSummary();

      L.submit.repaint = function () {
        paintChecks();
        paintSummary();
      };
    },

    onEnter: function () {
      if (L.submit.repaint) L.submit.repaint();
    },

    check: function () {
      var r = submit.validateFinal(d());
      if (!r.ok) return { ok: false, hint: r.problems[0] };
      return { ok: true, hint: '' };
    }
  });

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = submit;
  }
})();
    </script>
    <script data-from="js/90-app.js">
/**
 * 앱 부팅 · 페이지 이동 · 진행 표시 (명세 7장 · 15.2 · 22장)
 *
 * 10개 페이지를 한 번씩 그려 두고 «보이기/숨기기» 로 넘긴다.
 * 그래야 입력 내용이 그대로 남고, 뒤로 갔다 와도 처음부터 다시 그리지 않는다.
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;

  var main = ui.$('#app-main');
  var stepperList = ui.$('#stepper-list');
  var progressCurrent = ui.$('#progress-current');
  var progressBar = ui.$('#progressbar');
  var progressFill = ui.$('#progressbar-fill');
  var progressNow = ui.$('#progress-now');
  var saveStatus = ui.$('#save-status');
  var btnPrev = ui.$('#btn-prev');
  var btnNext = ui.$('#btn-next');
  var navHint = ui.$('#nav-hint');

  var current = 1;
  var screens = {};

  /* ------------------------------------------------------------------ */
  /* 화면 만들기                                                          */
  /* ------------------------------------------------------------------ */

  function buildScreens() {
    for (var i = 1; i <= C.TOTAL_PAGES; i += 1) {
      var page = L.getPage(i);
      var section = el('section', {
        'class': 'step-screen',
        id: 'page-' + i,
        hidden: true,
        attrs: { 'aria-label': i + '페이지 · ' + (page ? page.title : '') }
      });
      main.appendChild(section);
      screens[i] = section;
    }
  }

  /**
   * 페이지는 «처음 들어갈 때» 그린다.
   *
   * 부팅하자마자 열 개를 다 그리면, 저장된 기록을 이어서 할 때
   * 이미 그려 둔 빈 칸이 그대로 남는다(입력값이 화면에 안 보인다).
   * 필요한 순간에 그리면 언제나 «지금 상태» 를 보고 그린다.
   */
  function ensureRendered(n) {
    var page = L.getPage(n);
    var section = screens[n];
    if (!page || !section || page.rendered) return;
    page.rendered = true;
    try {
      page.render(section);
    } catch (err) {
      section.appendChild(
        ui.callout('이 페이지를 그리는 중 문제가 생겼어요. 새로고침해 보세요.', {
          className: 'callout--warn'
        })
      );
      if (window.console) window.console.error(err);
    }
  }

  function buildStepper() {
    ui.clear(stepperList);
    for (var i = 1; i <= C.TOTAL_PAGES; i += 1) {
      var page = L.getPage(i);
      (function (n, def) {
        var node = el('li', { 'class': 'stepper__item', dataset: { page: String(n) } }, [
          el('button', {
            type: 'button',
            'class': 'stepper__node',
            text: String(n),
            attrs: {
              'aria-label': n + '페이지 · ' + (def ? def.title : ''),
              title: (def ? def.title : '')
            },
            on: {
              click: function () {
                goToPage(n, { force: C.FREE_PAGE_NAV });
              }
            }
          }),
          el('span', { 'class': 'stepper__label', text: def ? def.short : String(n) })
        ]);
        stepperList.appendChild(node);
      })(i, page);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 이동                                                                */
  /* ------------------------------------------------------------------ */

  function pageCheck(n) {
    var page = L.getPage(n);
    if (!page || !page.check) return { ok: true, hint: '' };
    try {
      return page.check() || { ok: true, hint: '' };
    } catch (err) {
      return { ok: true, hint: '' };
    }
  }

  function goToPage(n, options) {
    var o = options || {};
    var next = Math.max(1, Math.min(C.TOTAL_PAGES, Number(n) || 1));
    if (next === current && screens[next] && !screens[next].hidden) return;

    if (!o.force && next > current) {
      var result = pageCheck(current);
      if (!result.ok) {
        ui.toast(result.hint || '이 페이지의 활동을 마쳐 주세요.');
        ui.announce(result.hint || '이 페이지의 활동을 마쳐 주세요.');
        return;
      }
    }

    var leaving = L.getPage(current);
    if (leaving && leaving.onLeave) {
      try {
        leaving.onLeave();
      } catch (err) {
        /* 무시 */
      }
    }

    ensureRendered(next);

    // common.css 의 .step-screen 은 is-active 가 붙어야 보인다. hidden 과 함께 맞춘다.
    Object.keys(screens).forEach(function (key) {
      var on = Number(key) === next;
      screens[key].hidden = !on;
      screens[key].classList.toggle('is-active', on);
    });
    current = next;

    var entering = L.getPage(current);
    if (entering && entering.onEnter) {
      try {
        entering.onEnter();
      } catch (err) {
        /* 무시 */
      }
    }

    L.state.update(
      function (s) {
        s.page = current;
        s.maxPage = Math.max(s.maxPage || 1, current);
      },
      { reason: 'page' }
    );

    paintProgress();
    refreshNav();
    ui.scrollToNode(main, { offset: 12 });
    ui.announce(current + '페이지 · ' + (entering ? entering.title : ''));
  }

  function paintProgress() {
    progressCurrent.textContent = String(current);
    var percent = Math.round((current / C.TOTAL_PAGES) * 100);
    progressFill.style.width = percent + '%';
    progressBar.setAttribute('aria-valuenow', String(percent));

    var page = L.getPage(current);
    progressNow.textContent =
      current + ' / ' + C.TOTAL_PAGES + ' · ' + (page ? page.title : '') +
      (page && page.kind === 'example' ? ' (급식 조회 예시)' : ' (우리 팀 프로젝트)');

    ui.$$('.stepper__item', stepperList).forEach(function (item) {
      var n = Number(item.dataset.page);
      item.classList.toggle('is-current', n === current);
      item.classList.toggle('is-done', n < current);
      item.classList.toggle('is-example', (L.getPage(n) || {}).kind === 'example');
      var button = item.querySelector('.stepper__node');
      if (button) button.setAttribute('aria-current', n === current ? 'step' : 'false');
    });
  }

  function refreshNav() {
    btnPrev.disabled = current === 1;
    var last = current === C.TOTAL_PAGES;
    btnNext.textContent = last ? '마쳤어요' : '다음 →';
    btnNext.disabled = last;

    var result = pageCheck(current);
    btnNext.classList.toggle('is-locked', !result.ok);
    navHint.textContent = last
      ? '수고했어요. 결과를 저장하거나 제출했는지 확인해 주세요.'
      : result.ok
      ? '다음 페이지로 갈 수 있어요.'
      : result.hint;
  }

  btnPrev.addEventListener('click', function () {
    goToPage(current - 1, { force: true });
  });
  btnNext.addEventListener('click', function () {
    goToPage(current + 1);
  });

  // 좌우 화살표로도 이동 (입력 중일 때는 제외)
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.altKey && e.key === 'ArrowLeft') goToPage(current - 1, { force: true });
    if (e.altKey && e.key === 'ArrowRight') goToPage(current + 1);
  });

  /* ------------------------------------------------------------------ */
  /* 저장 상태 표시                                                       */
  /* ------------------------------------------------------------------ */

  function paintSaveStatus() {
    var at = L.state.lastSavedAt();
    if (!L.state.isStorageHealthy()) {
      saveStatus.textContent = '이 기기에 자동 저장을 못 하고 있어요. 끝나기 전에 JSON 으로 저장해 주세요.';
      saveStatus.className = 'app-progress__save is-warn';
      return;
    }
    saveStatus.textContent = at ? '자동 저장됨 · ' + ui.formatClock(at) : '자동 저장 준비됨';
    saveStatus.className = 'app-progress__save';
  }

  /* ------------------------------------------------------------------ */
  /* 이어서 하기 (명세 15.2)                                              */
  /* ------------------------------------------------------------------ */

  function askResume() {
    var last = L.state.lastSession();
    if (!last || !last.data) return Promise.resolve(false);
    var data = last.data;
    var hasSomething =
      data.teamName || data.teamCode || data.code || (data.topic && data.topic.title);
    if (!hasSomething) return Promise.resolve(false);

    var page = L.getPage(data.page || 1);
    var body = el('div', { 'class': 'stack' }, [
      ui.dataTable({
        head: ['항목', '내용'],
        rows: [
          ['팀', ui.escapeHtml((data.teamCode || '') + ' ' + (data.teamName || '(팀명 없음)'))],
          ['주제', ui.escapeHtml((data.topic && data.topic.title) || '(아직 없음)')],
          ['마지막 단계', (data.page || 1) + '페이지 · ' + (page ? page.title : '')],
          ['마지막 저장', ui.formatTime(data.updatedAt)]
        ]
      })
    ]);

    return ui
      .modal({
        title: '지난 기록이 있어요',
        lead: '이어서 할까요, 새로 시작할까요?',
        body: body,
        actions: [
          { label: '새 프로젝트 시작', variant: 'ghost', value: 'new' },
          { label: 'JSON 프로젝트 불러오기', variant: 'secondary', value: 'load' },
          { label: '이어서 프로젝트 하기', variant: 'primary', value: 'resume' }
        ]
      })
      .then(function (choice) {
        if (choice === 'resume' || choice === null) {
          L.state.replace(data, { save: false });
          return true;
        }
        if (choice === 'load') {
          return importJson().then(function (ok) {
            if (!ok) {
              L.state.replace(data, { save: false });
              return true;
            }
            return true;
          });
        }
        // 새 프로젝트 — 한 번 더 확인 (명세 15.2)
        return ui
          .confirmDialog({
            title: '새 프로젝트를 시작할까요?',
            message: '지난 기록은 이 기기에 남아 있지만, 화면은 «빈 상태» 로 시작한다.',
            okLabel: '새로 시작',
            danger: true
          })
          .then(function (ok) {
            if (!ok) {
              L.state.replace(data, { save: false });
              return true;
            }
            L.state.reset();
            return false;
          });
      });
  }

  /** JSON 파일 불러오기 (명세 15.2 · 21.2 — 두 기기의 기록 합치기) */
  function importJson() {
    return new Promise(function (resolve) {
      var input = el('input', {
        type: 'file',
        accept: '.json,application/json',
        style: { display: 'none' }
      });
      document.body.appendChild(input);
      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        document.body.removeChild(input);
        if (!file) {
          resolve(false);
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var data = JSON.parse(String(reader.result));
            if (data.lesson && data.lesson !== C.LESSON_ID) {
              ui.toast('이 파일은 4차시 프로젝트 파일이 아니에요.');
              resolve(false);
              return;
            }
            L.state.replace(data);
            ui.toast('프로젝트를 불러왔어요.');
            resolve(true);
          } catch (err) {
            ui.toast('파일을 읽지 못했어요.');
            resolve(false);
          }
        };
        reader.onerror = function () {
          ui.toast('파일을 읽지 못했어요.');
          resolve(false);
        };
        reader.readAsText(file);
      });
      input.click();
    });
  }
  L.app.importJson = importJson;

  /* ------------------------------------------------------------------ */
  /* 부팅                                                                */
  /* ------------------------------------------------------------------ */

  function boot() {
    L.nav.setNavigator(goToPage);
    L.nav.setRefresher(refreshNav);

    buildStepper();
    buildScreens();

    L.state.onChange(function (data, reason) {
      if (reason === 'save') paintSaveStatus();
    });

    askResume().then(function (resumed) {
      // 이어서 하기를 고르면 마지막으로 보던 페이지부터 연다.
      goToPage(resumed ? L.state.get().page || 1 : 1, { force: true });
      paintSaveStatus();
    });

    paintProgress();
    refreshNav();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
