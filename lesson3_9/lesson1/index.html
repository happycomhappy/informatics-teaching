    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값» (명세 9장)
 *
 * 주 색상은 남색·파랑, 강조는 청록과 주황을 «조금만» 쓴다.
 * 윤리적 판단의 선택지에는 빨강·초록을 쓰지 않는다.
 * 정답·오답처럼 보이면 학생이 눈치를 보며 고르기 때문이다(명세 9.1).
 * 그래서 아래에 성공(초록)·실패(빨강) 색을 아예 만들어 두지 않았다.
 * 오류는 «주황 + ⚠ 글자» 로만 알린다.
 * ------------------------------------------------------------------ */
:root {
  /* 남색 계열 — 제목·버튼·강조선 */
  --navy-900: #0f2547;
  --navy-800: #16345f;
  --navy-700: #1b3a6b;
  --navy-600: #24508f;
  --navy-100: #e5ecf7;
  --navy-050: #f2f6fc;

  /* 청록 — 보조 강조 */
  --teal-700: #0d6c7a;
  --teal-100: #dff1f3;

  /* 주황 — 주의·오류 표시(색만으로 뜻을 전하지 않는다) */
  --amber-700: #a75a06;
  --amber-100: #fdf0dd;

  /* 회색 */
  --ink-900: #16202e;
  --ink-700: #37455a;
  --ink-500: #5d6b80;
  --ink-300: #9aa6b7;
  --ink-200: #ccd4de;
  --ink-100: #e6eaf0;
  --ink-050: #f5f7fa;
  --white: #ffffff;

  /* 코드 상자 — 높은 대비 */
  --code-bg: #14243c;
  --code-fg: #eef3fb;
  --code-dim: #9fb6d6;

  /* 간격 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  --radius: 12px;
  --radius-sm: 8px;

  /* 터치 영역 최소 44px (명세 9.1) */
  --touch: 44px;

  --shadow-1: 0 1px 2px rgba(15, 37, 71, 0.08), 0 2px 8px rgba(15, 37, 71, 0.06);
  --shadow-2: 0 4px 16px rgba(15, 37, 71, 0.12);

  --font-body: "Pretendard", "Malgun Gothic", "맑은 고딕", system-ui, -apple-system, sans-serif;
  --font-code: "D2Coding", "Cascadia Mono", "Consolas", "Courier New", monospace;

  /* 본문 최대 너비 — 학생용 (명세 9.1) */
  --student-width: 760px;
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-900);
  background: var(--ink-050);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3 {
  margin: 0;
  line-height: 1.35;
  word-break: keep-all;
}

p {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

/* 초점 표시를 없애지 않는다 (명세 9.3) */
:focus-visible {
  outline: 3px solid var(--teal-700);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--sp-3) var(--sp-4);
  background: var(--navy-700);
  color: var(--white);
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--white);
  border: 1px solid var(--ink-100);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  margin-bottom: var(--sp-4);
  overflow: hidden;
}

.card--accent {
  border-left: 4px solid var(--teal-700);
}

.card__head {
  padding: var(--sp-4) var(--sp-4) 0;
}

.card__eyebrow {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--navy-600);
  margin-bottom: var(--sp-1);
}

.card__title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy-900);
}

.card__desc {
  margin-top: var(--sp-2);
  font-size: 0.95rem;
  color: var(--ink-700);
}

.card__body {
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.subhead {
  font-size: 1rem;
  font-weight: 700;
  color: var(--navy-800);
  padding-top: var(--sp-2);
  border-top: 1px solid var(--ink-100);
}

.para {
  color: var(--ink-900);
}

.quote {
  margin: 0;
  padding: var(--sp-3) var(--sp-4);
  background: var(--teal-100);
  border-radius: var(--radius-sm);
  font-weight: 600;
  color: var(--navy-900);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: var(--touch);
  padding: 0 var(--sp-5);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  background: var(--ink-100);
  color: var(--ink-900);
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.btn:hover:not(:disabled) {
  background: var(--ink-200);
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--navy-700);
  color: var(--white);
}
.btn--primary:hover:not(:disabled) {
  background: var(--navy-800);
}

.btn--ghost {
  background: var(--white);
  border-color: var(--ink-200);
  color: var(--navy-800);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--navy-050);
}

.btn--tiny {
  min-height: 36px;
  padding: 0 var(--sp-3);
  font-size: 0.85rem;
  background: var(--white);
  border-color: var(--ink-200);
  color: var(--navy-700);
}

.btn--wide {
  flex: 1 1 auto;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
}

.btn-row--tools {
  gap: var(--sp-2);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.field__label {
  font-weight: 600;
  color: var(--navy-900);
  font-size: 0.98rem;
}

.field__help {
  font-size: 0.85rem;
  color: var(--ink-500);
}

.input {
  width: 100%;
  min-height: var(--touch);
  padding: var(--sp-3);
  font-family: inherit;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--ink-900);
  background: var(--white);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius-sm);
}

.input:focus {
  border-color: var(--navy-600);
}

.input--area {
  resize: vertical;
  min-height: 96px;
}

.input--mono {
  font-family: var(--font-code);
}

.input--short {
  max-width: 220px;
}

.field__count {
  font-size: 0.82rem;
  color: var(--ink-500);
  text-align: right;
}

.field__count--ok {
  color: var(--teal-700);
  font-weight: 600;
}

/* 오류는 색 + 아이콘 + 글자로 알린다 (명세 9.3) */
.field__error {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--amber-700);
  background: var(--amber-100);
  border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3);
}

.field--invalid .input {
  border-color: var(--amber-700);
  border-width: 2px;
}

/* ------------------------------ 선택형 ------------------------------ */

.choices {
  margin: 0;
  padding: 0;
  border: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.choices--invalid {
  padding: var(--sp-3);
  border: 2px solid var(--amber-700);
  border-radius: var(--radius-sm);
}

.choice {
  position: relative;
}

.choice__radio {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

/* 선택지 색은 모두 같다. 어떤 보기도 «정답처럼» 보이지 않게 한다(명세 9.1) */
.choice__label {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  min-height: var(--touch);
  padding: var(--sp-3);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius-sm);
  background: var(--white);
  cursor: pointer;
}

.choice__label:hover {
  background: var(--navy-050);
}

.choice__mark {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  margin-top: 2px;
  border: 2px solid var(--ink-300);
  border-radius: 50%;
  background: var(--white);
}

.choice__radio:checked + .choice__label {
  border-color: var(--navy-700);
  border-width: 2px;
  background: var(--navy-050);
  padding: calc(var(--sp-3) - 1px);
}

.choice__radio:checked + .choice__label .choice__mark {
  border-color: var(--navy-700);
  box-shadow: inset 0 0 0 4px var(--navy-700);
}

.choice__radio:focus-visible + .choice__label {
  outline: 3px solid var(--teal-700);
  outline-offset: 2px;
}

.choice__text {
  color: var(--ink-900);
}

/* ------------------------------ 체크박스 ------------------------------ */

.check {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.check__row {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  min-height: var(--touch);
  padding: var(--sp-3);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius-sm);
  background: var(--white);
}

.check__box {
  width: 22px;
  height: 22px;
  margin: 2px 0 0;
  flex: 0 0 auto;
  accent-color: var(--navy-700);
}

.check__label {
  cursor: pointer;
  font-weight: 600;
  color: var(--ink-900);
}

/* ------------------------------ 힌트 조각 ------------------------------ */

.chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
}

.chips__note {
  font-size: 0.8rem;
  color: var(--ink-500);
}

.chip {
  min-height: 32px;
  padding: 0 var(--sp-3);
  font-family: var(--font-code);
  font-size: 0.85rem;
  color: var(--navy-700);
  background: var(--navy-050);
  border: 1px dashed var(--ink-200);
  border-radius: 999px;
  cursor: pointer;
}

.chip:hover {
  background: var(--navy-100);
}

.hint-notice {
  font-size: 0.88rem;
  color: var(--ink-700);
  background: var(--ink-050);
  border-left: 3px solid var(--ink-300);
  padding: var(--sp-2) var(--sp-3);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* ------------------------------ 코드 상자 ------------------------------ */

.codeblock {
  margin: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--navy-900);
}

.codeblock__cap {
  padding: var(--sp-2) var(--sp-3);
  background: var(--navy-900);
  color: var(--code-dim);
  font-size: 0.82rem;
  font-weight: 600;
}

.codeblock__pre {
  margin: 0;
  padding: var(--sp-4);
  background: var(--code-bg);
  color: var(--code-fg);
  font-family: var(--font-code);
  font-size: 0.95rem;
  line-height: 1.8;
  /* 들여쓰기와 줄바꿈을 그대로 지킨다. 가로로만 넘긴다(명세 4.1 화면2) */
  white-space: pre;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  tab-size: 4;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  border-radius: var(--radius-sm);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.alert--warn {
  background: var(--amber-100);
  border: 1px solid var(--amber-700);
  color: var(--ink-900);
}

.alert--info {
  background: var(--navy-050);
  border: 1px solid var(--navy-100);
}

.alert__title {
  font-weight: 700;
  color: var(--amber-700);
}

.alert__list {
  margin: 0;
  padding-left: 1.2em;
  font-size: 0.92rem;
}

.banner {
  border-radius: var(--radius-sm);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  align-items: flex-start;
}

.banner--warn {
  background: var(--white);
  border: 1px solid var(--amber-700);
}

.banner__title {
  font-weight: 700;
  color: var(--amber-700);
}

.banner__text {
  font-size: 0.9rem;
  color: var(--ink-700);
}

.toast-region {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  pointer-events: none;
  width: min(92vw, 520px);
}

.toast {
  background: var(--navy-900);
  color: var(--white);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-2);
  font-size: 0.92rem;
}

/* ------------------------------ 읽기 전용 되보기 ------------------------------ */

.readback {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--sp-2) 0;
  border-bottom: 1px dashed var(--ink-100);
}

.readback:last-child {
  border-bottom: 0;
}

.readback__label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink-500);
}

.readback__value {
  /* 학생이 쓴 줄바꿈을 그대로 살린다 (명세 9.2) */
  white-space: pre-wrap;
  color: var(--ink-900);
}
    </style>
    <style data-from="styles/teacher.css">
/* ------------------------------------------------------------------
 * 교사용 화면 (명세 9.2)
 *   · PC 화면에서 정보를 촘촘히 담되 복잡해 보이지 않게 한다
 *   · 요약 카드 → 거르기 → 차트 → 제출 목록 순서
 *   · 좁은 화면에서는 표가 카드로 바뀐다
 * ------------------------------------------------------------------ */

body.teacher {
  background: var(--ink-050);
}

.t-head {
  background: var(--white);
  border-bottom: 1px solid var(--ink-100);
}

.t-head__inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.t-head__eyebrow {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy-600);
}

.t-head__title {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--navy-900);
}

.t-main {
  max-width: 1400px;
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-4) var(--sp-7);
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

.t-section__title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--navy-800);
  padding-bottom: var(--sp-2);
  border-bottom: 2px solid var(--navy-100);
  margin-bottom: var(--sp-3);
}

/* ------------------------------ 안내 ------------------------------ */

.notice {
  border-radius: var(--radius-sm);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.notice--warn {
  background: var(--amber-100);
  border: 2px solid var(--amber-700);
}

.notice--info {
  background: var(--navy-050);
  border: 1px solid var(--navy-100);
}

.notice__title {
  font-weight: 700;
  color: var(--amber-700);
}

.notice--info .notice__title {
  color: var(--navy-700);
}

.notice__text {
  font-size: 0.9rem;
  color: var(--ink-700);
}

/* ------------------------------ 접근 키 ------------------------------ */

.access {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  background: var(--navy-050);
  border-radius: var(--radius-sm);
}

.access__row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  align-items: center;
}

.access__status {
  font-size: 0.85rem;
  color: var(--amber-700);
}

/* ------------------------------ 자료 불러오기 ------------------------------ */

.load {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
  padding: var(--sp-4);
  background: var(--white);
  border: 1px solid var(--ink-100);
  border-radius: var(--radius);
}

.load__title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--navy-700);
  margin-bottom: var(--sp-2);
}

.load__form {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.load__note {
  font-size: 0.82rem;
  color: var(--ink-500);
}

.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 150px;
  padding: var(--sp-4);
  text-align: center;
  border: 2px dashed var(--ink-200);
  border-radius: var(--radius-sm);
  background: var(--navy-050);
  cursor: pointer;
}

.dropzone--over {
  border-color: var(--navy-700);
  background: var(--navy-100);
}

.dropzone__title {
  font-weight: 700;
  color: var(--navy-800);
}

.dropzone__text {
  font-size: 0.85rem;
  color: var(--ink-500);
}

@media (max-width: 1024px) {
  .load {
    grid-template-columns: 1fr;
  }
}

/* ------------------------------ 도구 줄 ------------------------------ */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
}

.toolbar__left,
.toolbar__right {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
}

.toolbar__auto {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.toolbar__autolabel {
  font-size: 0.9rem;
  color: var(--ink-700);
  cursor: pointer;
}

.toolbar__time {
  font-size: 0.85rem;
  color: var(--ink-500);
}

/* ------------------------------ 요약 카드 ------------------------------ */

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--sp-3);
}

.stat {
  background: var(--white);
  border: 1px solid var(--ink-100);
  border-radius: var(--radius);
  padding: var(--sp-4);
  box-shadow: var(--shadow-1);
}

.stat--wide {
  grid-column: span 2;
}

.stat__label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink-500);
  margin-bottom: var(--sp-1);
}

.stat__value {
  font-size: 1.9rem;
  font-weight: 800;
  color: var(--navy-800);
  font-variant-numeric: tabular-nums;
}

.stat__note {
  font-size: 0.8rem;
  color: var(--ink-500);
}

.countlist {

  function text(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim();
  }

  /** 너무 긴 입력은 잘라 낸다(시트 한 칸의 한계와 통신량 보호). */
  function clip(value, max) {
    var s = text(value);
    var limit = max || LIMITS.textMax || 1000;
    return s.length > limit ? s.slice(0, limit) : s;
  }

  /** 공백을 뺀 «내용 글자 수». 스페이스만 눌러서 글자 수를 채우지 못하게 한다. */
  function contentLength(value) {
    return text(value).replace(/\s+/g, "").length;
  }

  /** 정수인지 확인하고 숫자로 돌려준다. 아니면 NaN */
  function toInt(value) {
    var s = text(value);
    if (!/^-?\d+$/.test(s)) return NaN;
    return parseInt(s, 10);
  }

  function isRange(n, min, max) {
    return typeof n === "number" && !isNaN(n) && n >= min && n <= max;
  }

  /* ------------------------------------------------------------------ */
  /* 학생 정보 검사 (명세 10장)                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 학번을 학년·반·번호로 가른다.  "10312" → { grade:1, classNumber:3, studentNumber:12 }
   *
   * 다섯 자리 숫자가 아니거나 갈라 낸 값이 범위를 벗어나면 null 을 돌려준다.
   * («99999» 처럼 자릿수만 맞는 값을 걸러 내기 위해서다)
   */
  function parseStudentId(value) {
    var s = text(value);
    if (!new RegExp("^\\d{" + LIMITS.studentIdDigits + "}$").test(s)) return null;

    var grade = parseInt(s.slice(0, 1), 10);
    var classNumber = parseInt(s.slice(1, 3), 10);
    var studentNumber = parseInt(s.slice(3, 5), 10);

    if (!isRange(grade, LIMITS.gradeMin, LIMITS.gradeMax)) return null;
    if (!isRange(classNumber, LIMITS.classMin, LIMITS.classMax)) return null;
    if (!isRange(studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return null;

    return { grade: grade, classNumber: classNumber, studentNumber: studentNumber };
  }

  /**
   * 학년·반·번호를 도로 학번으로 붙인다.  1, 3, 12 → "10312"
   *
   * 학번을 쓰기 «전» 에 저장된 옛 자료를 읽을 때 쓴다.
   * 그때는 학년·반·번호만 있고 학번이 없어서 표와 CSV 의 학번 칸이 비어 버린다.
   * 값이 온전하지 않으면 빈 문자열을 돌려준다(억지로 만들지 않는다).
   */
  function composeStudentId(seat) {
    var s = seat || {};
    if (!isRange(s.grade, LIMITS.gradeMin, LIMITS.gradeMax)) return "";
    if (!isRange(s.classNumber, LIMITS.classMin, LIMITS.classMax)) return "";
    if (!isRange(s.studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return "";
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return String(s.grade) + two(s.classNumber) + two(s.studentNumber);
  }

  /** 「1학년 3반 12번」 처럼 사람이 읽는 말로 (학번이 이상하면 빈 문자열) */
  function describeStudentId(value) {
    var p = parseStudentId(value);
    if (!p) return "";
    return p.grade + "학년 " + p.classNumber + "반 " + p.studentNumber + "번";
  }

  /**
   * 돌려주는 것 : { ok: true/false, errors: { 항목이름: "메시지" } }
   * 메시지는 그 항목 «바로 아래» 에 그대로 붙인다(명세 7.7).
   *
   * 학생이 넣는 것은 «학번» 과 «이름» 둘뿐이다.
   */
  function validateStudent(student) {
    var errors = {};
    var s = student || {};

    var id = text(s.studentId);
    if (!id) {
      errors.studentId = "학번을 입력해 주세요.";
    } else if (!/^\d+$/.test(id)) {
      errors.studentId = "학번은 숫자만 넣어 주세요.";
    } else if (id.length !== LIMITS.studentIdDigits) {
      errors.studentId = "학번은 " + LIMITS.studentIdDigits + "자리입니다. 예) 10312 (1학년 3반 12번)";
    } else if (!parseStudentId(id)) {
      errors.studentId = "학번을 다시 확인해 주세요. 앞에서부터 학년 1자리, 반 2자리, 번호 2자리입니다.";
    }

    var name = text(s.name);
    if (name.length < LIMITS.nameMin || name.length > LIMITS.nameMax) {
      errors.name = "이름은 " + LIMITS.nameMin + "~" + LIMITS.nameMax + "자로 입력해 주세요.";
    }

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 단계별 검사 — 학생용의 [다음] 버튼이 이 결과를 본다                     */
  /* ------------------------------------------------------------------ */

  /**
   * 「을 / 를」 을 바르게 붙인다.
   * 한글 마지막 글자에 받침이 있으면 «을», 없으면 «를» 이다.
   * (「이유을(를)」 처럼 어색하게 적히지 않게 하려는 것뿐이다)
   */
  function josa(word, withBatchim, withoutBatchim) {
    var s = text(word);
    if (!s) return s + withoutBatchim;
    var code = s.charCodeAt(s.length - 1);
    var isHangul = code >= 0xac00 && code <= 0xd7a3;
    if (!isHangul) return s + withBatchim + "(" + withoutBatchim + ")";
    return s + ((code - 0xac00) % 28 !== 0 ? withBatchim : withoutBatchim);
  }

  /**
   * 이름표가 「…을 쓰세요.」 같은 «안내 문장» 이면 그대로 오류 문구에 넣을 수 없다.
   * 그럴 때는 짧게 «이 칸» 이라고 부른다.
   */
  function shortLabel(label) {
    var s = text(label);
    if (!s) return "";
    if (s.length > 16) return "";
    if (/(세요|보세요|합니다|입니다)[.]?$/.test(s)) return "";
    return s.replace(/[.:]$/, "");
  }

  /** 서술형 한 칸을 본다. 최소 글자 수는 공백을 뺀 길이로 센다. */
  function checkText(value, min, label) {
    var len = contentLength(value);
    if (len === 0) {
      var name = shortLabel(label);
      return name ? josa(name, "을", "를") + " 입력해 주세요." : "이 칸을 채워 주세요.";
    }
    if (min && len < min) {
      return "조금 더 자세히 써 주세요. (공백 제외 " + len + "자 / 최소 " + min + "자)";
    }
    return null;
  }

  /** 개인 판단 단계 (명세 4.1 화면3) */
  function validateInitial(topic, answer) {
    var errors = {};
    var a = answer || {};
    if (!text(a.choice)) errors.choice = "보기 중 하나를 골라 주세요.";
    else if (topic.initial.choices.indexOf(text(a.choice)) === -1) {
      errors.choice = "보기 중 하나를 골라 주세요.";
    }

    if (topic.initial.reason) {
      var msg = checkText(a.reason, topic.initial.reason.min, "이유");
      if (msg) errors.reason = msg;
    }

    var fields = AE.topics.fieldsOf(topic, "initial");
    var task = a.taskFields || {};
    fields.forEach(function (f) {
      var m = checkText(task[f.key], f.min, f.label);
      if (m) errors["taskFields." + f.key] = m;
    });

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /** 토론 단계 (명세 4.1 화면4) */
  function validateDiscussion(discussion) {
    var errors = {};
    var d = discussion || {};
    var msg = checkText(d.newInsight, LIMITS.insightMin, "새롭게 알게 된 점");
    if (msg) errors.newInsight = msg;
    if (d.completed !== true) errors.completed = "«토론을 마쳤어요» 를 확인해 주세요.";
    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /** 최종 판단 단계 (명세 4.1 화면5) */
  function validateFinal(topic, answer, principle) {
    var errors = {};
    var a = answer || {};

    if (!text(a.choice)) errors.choice = "최종 선택을 골라 주세요.";
    else if (topic.initial.choices.indexOf(text(a.choice)) === -1) {
      errors.choice = "최종 선택을 골라 주세요.";
    }

    if (topic.final.reason) {
      var msg = checkText(a.reason, topic.final.reason.min, "최종 이유");
      if (msg) errors.reason = msg;
    }

    if (CHANGE_TYPES.indexOf(text(a.changeType)) === -1) {
      errors.changeType = "토론 후 생각이 어떻게 되었는지 골라 주세요.";
    }

    var fields = AE.topics.fieldsOf(topic, "final");
    var task = a.taskFields || {};
    fields.forEach(function (f) {
      var m = checkText(task[f.key], f.min, f.label);
      if (m) errors["taskFields." + f.key] = m;
    });

    var pm = checkText(principle, LIMITS.principleMin, "나의 AI 활용 원칙");
    if (pm) errors.personalPrinciple = pm;

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /** 제출 직전 전체 검사 (명세 4.1 화면6) */
  function validateAll(topic, state) {
    var errors = {};
    function merge(prefix, result) {
      Object.keys(result.errors).forEach(function (k) {
        errors[prefix + k] = result.errors[k];
      });
    }
    merge("student.", validateStudent(state.student));
    merge("initial.", validateInitial(topic, state.initial));
    merge("discussion.", validateDiscussion(state.discussion));
    merge("final.", validateFinal(topic, state.final, state.personalPrinciple));
    if (state.honestyConfirmed !== true) {
      errors.honestyConfirmed = "정직성 확인에 체크해 주세요.";
    }
    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 보낼 자료 만들기 (명세 7.3)                                           */
  /* ------------------------------------------------------------------ */

  /** 추가 칸을 정해진 키만 남기고 정리한다(모르는 키는 버린다). */
  function pickTaskFields(topic, phase, values) {
    var out = {};
    var src = values || {};
    AE.topics.fieldsOf(topic, phase).forEach(function (f) {
      if (Object.prototype.hasOwnProperty.call(src, f.key)) {
        out[f.key] = clip(src[f.key]);
      }
    });
    return out;
  }

  /** 현지 시각을 +09:00 형태로 (명세 7.3 clientSubmittedAt) */
  function localIsoString(date) {
    var d = date || new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var offsetMin = -d.getTimezoneOffset();
    var sign = offsetMin >= 0 ? "+" : "-";
    var abs = Math.abs(offsetMin);
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      "T" +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds()) +
      sign +
      two(Math.floor(abs / 60)) +
      ":" +
      two(abs % 60)
    );
  }

  /**
   * 학생 화면의 상태 → 서버로 보낼 JSON (명세 7.3 그대로)
   * 서버는 여기서 온 이름·시간을 그대로 믿지 않고 다시 검사한다.
   */
  function buildSubmission(state, options) {
    var opt = options || {};
    var topic = AE.topics.byId(state.topicId);
    var s = state.student || {};
    var id = text(s.studentId);
    var seat = parseStudentId(id) || {};
    return {
      action: "submit",
      schemaVersion: SCHEMA_VERSION,
      lessonId: AE.LESSON_ID || "lesson3_9_1",
      submissionId: text(state.submissionId) || "",
      student: {
        studentId: id,
        name: clip(s.name, LIMITS.nameMax),
        /* 학번에서 갈라 낸 값도 함께 보낸다.
           선생님 화면에서 학년·반으로 거르고 자리순으로 정렬하는 데 쓴다. */
        grade: seat.grade,
        classNumber: seat.classNumber,
        studentNumber: seat.studentNumber
      },
      topicId: state.topicId,
      topicTitle: topic ? topic.title : "",
      initialAnswer: {
        choice: clip(state.initial && state.initial.choice),
        reason: clip(state.initial && state.initial.reason),
        taskFields: pickTaskFields(topic, "initial", state.initial && state.initial.taskFields)
      },
      discussion: {
        newInsight: clip(state.discussion && state.discussion.newInsight),
        completed: !!(state.discussion && state.discussion.completed)
      },
      finalAnswer: {
        choice: clip(state.final && state.final.choice),
        reason: clip(state.final && state.final.reason),
        changeType: clip(state.final && state.final.changeType),
        taskFields: pickTaskFields(topic, "final", state.final && state.final.taskFields)
      },
      personalPrinciple: clip(state.personalPrinciple),
      honestyConfirmed: state.honestyConfirmed === true,
      clientSubmittedAt: opt.now ? localIsoString(opt.now) : localIsoString()
    };
  }

  /* ------------------------------------------------------------------ */
  /* 중복 제출 기준 (명세 7.6)                                             */
  /* ------------------------------------------------------------------ */

  /**
   * 둘이 같으면 «같은 학생의 같은 활동» 이다.
   *   studentId + topicId
   *
   * · 이름은 넣지 않는다. 동명이인을 같은 학생으로 보지 않기 위해서다.
   *   (반대로 학생이 이름을 고쳐 다시 내도 같은 제출로 본다)
   * · 학번 하나가 학년·반·번호를 모두 담고 있으므로 이것으로 충분하다.
   * · 대신 «학년도가 바뀌면» 10312 가 다시 생긴다.
   *   해마다 새 폴더를 쓰면 섞이지 않는다. apps-script/README.md 참고.
   *
   * ★ 이 규칙은 apps-script/student/Code.gs 의 dedupeKey_ 와 «뜻이 같아야» 한다.
   *   한쪽만 바뀌면 재제출이 갱신되지 않고 새로 쌓인다.
   *   tests/apps-script.test.js 가 두 판단이 같은지 자동으로 확인한다.
   */
  function dedupeKey(sub) {
    var s = (sub && sub.student) || {};
    return [text(s.studentId), text(sub && sub.topicId)].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 읽기 — 교사용                                               */
  /* ------------------------------------------------------------------ */

  /** 빠진 칸이 있어도 화면이 깨지지 않도록 형태를 맞춘다. */
  function normalize(raw) {
    var r = raw || {};
    var s = r.student || {};
    var id = text(s.studentId);
    /* 학년·반·번호가 빠져 있으면 학번에서 갈라 낸다 */
    var seat = parseStudentId(id);
    if (!seat) {
      seat = {
        grade: toInt(s.grade),
        classNumber: toInt(s.classNumber),
        studentNumber: toInt(s.studentNumber)
      };
      /* 거꾸로, 학번 없이 저장된 옛 자료라면 학년·반·번호로 학번을 되살린다 */
      if (!id) id = composeStudentId(seat);
    }
    return {
      submissionId: text(r.submissionId),
      student: {
        studentId: id,
        name: text(s.name),
        grade: seat.grade,
        classNumber: seat.classNumber,
        studentNumber: seat.studentNumber
      },
      topicId: text(r.topicId),
      topicTitle: text(r.topicTitle) || AE.topics.titleOf(r.topicId),
      initialAnswer: {
        choice: text(r.initialAnswer && r.initialAnswer.choice),
        reason: text(r.initialAnswer && r.initialAnswer.reason),
        taskFields: (r.initialAnswer && r.initialAnswer.taskFields) || {}
      },
      discussion: {
        newInsight: text(r.discussion && r.discussion.newInsight),
        completed: !!(r.discussion && r.discussion.completed)
      },
      finalAnswer: {
        choice: text(r.finalAnswer && r.finalAnswer.choice),
        reason: text(r.finalAnswer && r.finalAnswer.reason),
        changeType: text(r.finalAnswer && r.finalAnswer.changeType),
        taskFields: (r.finalAnswer && r.finalAnswer.taskFields) || {}
      },
      personalPrinciple: text(r.personalPrinciple),
      honestyConfirmed: r.honestyConfirmed === true,
      teacherMemo: text(r.teacherMemo),
      clientSubmittedAt: text(r.clientSubmittedAt),
      serverSubmittedAt: text(r.serverSubmittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      status: text(r.status) || "완료"
    };
  }

  /** 정렬용 숫자 — 학번이 곧 순서다 (10312) */
  function seatOrder(sub) {
    var s = (sub && sub.student) || {};
    var n = parseInt(text(s.studentId), 10);
    if (!isNaN(n)) return n;
    /* 학번이 없는 옛 자료를 대비한 뒷길 */
    var g = isNaN(s.grade) ? 0 : s.grade;
    var c = isNaN(s.classNumber) ? 0 : s.classNumber;
    var no = isNaN(s.studentNumber) ? 0 : s.studentNumber;
    return g * 10000 + c * 100 + no;
  }

  /** 「1학년 3반 12번」 */
  function seatLabel(sub) {
    var s = (sub && sub.student) || {};
    var parts = [];
    if (!isNaN(s.grade)) parts.push(s.grade + "학년");
    if (!isNaN(s.classNumber)) parts.push(s.classNumber + "반");
    if (!isNaN(s.studentNumber)) parts.push(s.studentNumber + "번");
    return parts.join(" ");
  }

  /** 「10312 홍길동」 — 표와 상세에서 학생을 가리키는 짧은 이름 */
  function studentLabel(sub) {
    var s = (sub && sub.student) || {};
    return [text(s.studentId), text(s.name)].filter(Boolean).join(" ");
  }

  /* ------------------------------------------------------------------ */
  /* 요약 (명세 6.3)                                                      */
  /* ------------------------------------------------------------------ */

  /**
   * 숫자로 «윤리 점수» 를 만들지 않는다. 세는 것만 한다(명세 6.3 마지막 문단).
   */
  function summarize(subs) {
    var list = subs || [];
    var byTopic = {};
    var changeTypeCounts = {};
    var students = {};

    CHANGE_TYPES.forEach(function (c) {
      changeTypeCounts[c] = 0;
    });

    list.forEach(function (sub) {
      var tid = sub.topicId || "(주제 없음)";
      byTopic[tid] = (byTopic[tid] || 0) + 1;

      var ct = sub.finalAnswer && sub.finalAnswer.changeType;
      if (ct) changeTypeCounts[ct] = (changeTypeCounts[ct] || 0) + 1;

      var s = sub.student || {};
      students[String(s.studentId || [s.grade, s.classNumber, s.studentNumber].join("-"))] = true;
    });

    return {
      totalSubmissions: list.length,
      uniqueStudents: Object.keys(students).length,
      byTopic: byTopic,
      changeTypeCounts: changeTypeCounts
    };
  }

  /** 선택형 문항의 응답 분포 (명세 6.6) */
  function choiceCounts(subs, topicId, phase) {
    var topic = AE.topics.byId(topicId);
    if (!topic) return [];
    var counts = {};
    topic.initial.choices.forEach(function (c) {
      counts[c] = 0;
    });
    (subs || []).forEach(function (sub) {
      if (sub.topicId !== topicId) return;
      var ans = phase === "initial" ? sub.initialAnswer : sub.finalAnswer;
      var choice = ans && ans.choice;
      if (choice && Object.prototype.hasOwnProperty.call(counts, choice)) counts[choice] += 1;
      else if (choice) counts[choice] = (counts[choice] || 0) + 1;
    });
    var total = 0;
    Object.keys(counts).forEach(function (k) {
      total += counts[k];
    });
    return Object.keys(counts).map(function (k) {
      return {
        label: k,
        count: counts[k],
        percent: total > 0 ? Math.round((counts[k] / total) * 1000) / 10 : 0
      };
    });
  }

  /* ------------------------------------------------------------------ */
  /* CSV (명세 6.7)                                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 엑셀 수식 주입 막기.
   * = + - @ 또는 탭·캐리지리턴으로 시작하는 값 앞에 작은따옴표를 붙이면
   * 엑셀이 «글자» 로 읽는다. 학생이 =1+1 이라고 써도 계산되지 않는다.
   */
  function guardFormula(value) {
    var s = value === null || value === undefined ? "" : String(value);
    if (s.length === 0) return s;
    if (/^[=+\-@\t\r]/.test(s)) return "'" + s;
    return s;
  }

  /** 한 칸을 CSV 규칙에 맞게 감싼다. */
  function csvCell(value) {
    var s = guardFormula(value);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /**
   * 지금 화면에 보이는 제출들에 필요한 열을 만든다.
   * 고정 열 + 주제별 추가 칸(있는 것만).
   */
  function csvColumns(subs) {
    var cols = [
      { key: "serverSubmittedAt", label: "제출 시각" },
      { key: "serverUpdatedAt", label: "최종 수정 시각" },
      { key: "studentId", label: "학번" },
      { key: "name", label: "이름" },
      { key: "grade", label: "학년" },
      { key: "classNumber", label: "반" },
      { key: "studentNumber", label: "번호" },
      { key: "topicId", label: "주제 ID" },
      { key: "topicTitle", label: "주제" },
      { key: "initialChoice", label: "최초 판단" },
      { key: "initialReason", label: "최초 이유" },
      { key: "newInsight", label: "토론에서 새롭게 알게 된 점" },
      { key: "finalChoice", label: "최종 판단" },
      { key: "finalReason", label: "최종 이유" },
      { key: "changeType", label: "생각 변화" },
      { key: "personalPrinciple", label: "나의 AI 활용 원칙" },
      { key: "honestyConfirmed", label: "정직성 확인" },
      { key: "status", label: "제출 상태" },
      { key: "teacherMemo", label: "교사 메모" }
    ];

    /* 화면에 있는 주제들의 추가 칸을 열로 펼친다.
       주제가 섞여 있어도 열 이름이 겹치지 않도록 주제 ID 를 앞에 붙인다. */
    var seen = {};
    (subs || []).forEach(function (sub) {
      if (seen[sub.topicId]) return;
      seen[sub.topicId] = true;
      var topic = AE.topics.byId(sub.topicId);
      if (!topic) return;
      AE.topics.fieldsOf(topic, "initial").forEach(function (f) {
        cols.push({
          key: "initial:" + topic.id + ":" + f.key,
          label: "[" + topic.id + "] 최초-" + AE.topics.labelOf(f)
        });
      });
      AE.topics.fieldsOf(topic, "final").forEach(function (f) {
        cols.push({
          key: "final:" + topic.id + ":" + f.key,
          label: "[" + topic.id + "] 최종-" + AE.topics.labelOf(f)
        });
      });
    });

    return cols;
  }

  /** 열 하나의 값을 제출에서 꺼낸다. */
  function cellValue(sub, key) {
    if (key.indexOf(":") !== -1) {
      var parts = key.split(":");
      var phase = parts[0];
      var topicId = parts[1];
      var fieldKey = parts[2];
      if (sub.topicId !== topicId) return "";
      var ans = phase === "initial" ? sub.initialAnswer : sub.finalAnswer;
      var tf = (ans && ans.taskFields) || {};
      return tf[fieldKey] === undefined ? "" : String(tf[fieldKey]);
    }
    var s = sub.student || {};
    switch (key) {
      case "studentId":
        return s.studentId || "";
      case "grade":
        return isNaN(s.grade) ? "" : String(s.grade);
      case "classNumber":
        return isNaN(s.classNumber) ? "" : String(s.classNumber);
      case "studentNumber":
        return isNaN(s.studentNumber) ? "" : String(s.studentNumber);
      case "name":
        return s.name || "";
      case "initialChoice":
        return (sub.initialAnswer && sub.initialAnswer.choice) || "";
      case "initialReason":
        return (sub.initialAnswer && sub.initialAnswer.reason) || "";
      case "newInsight":
        return (sub.discussion && sub.discussion.newInsight) || "";
      case "finalChoice":
        return (sub.finalAnswer && sub.finalAnswer.choice) || "";
      case "finalReason":
        return (sub.finalAnswer && sub.finalAnswer.reason) || "";
      case "changeType":
        return (sub.finalAnswer && sub.finalAnswer.changeType) || "";
      case "honestyConfirmed":
        return sub.honestyConfirmed ? "확인함" : "";
      default:
        return sub[key] === undefined || sub[key] === null ? "" : String(sub[key]);
    }
  }

  /**
   * CSV 본문을 만든다. 맨 앞의 ﻿ 가 «UTF-8 BOM» 이다.
   * 이것이 있어야 엑셀이 한글을 깨뜨리지 않고 연다(명세 6.7).
   */
  function toCsv(subs) {
    var cols = csvColumns(subs);
    var lines = [];
    lines.push(
      cols
        .map(function (c) {
          return csvCell(c.label);
        })
        .join(",")
    );
    (subs || []).forEach(function (sub) {
      lines.push(
        cols
          .map(function (c) {
            return csvCell(cellValue(sub, c.key));
          })
          .join(",")
      );
    });
    return "﻿" + lines.join("\r\n") + "\r\n";
  }

  /** 파일 이름 — 예) AI디지털윤리_control-1_1학년3반_2026-08-17.csv (명세 6.7) */
  function csvFileName(filters, now) {
    var d = now || new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var date = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
    var parts = ["AI디지털윤리"];
    if (filters && filters.topicId) parts.push(filters.topicId);
    var seat = "";
    if (filters && filters.grade) seat += filters.grade + "학년";
    if (filters && filters.classNumber) seat += filters.classNumber + "반";
    if (seat) parts.push(seat);
    parts.push(date);
    /* 파일 이름에 쓸 수 없는 글자를 없앤다(윈도우 기준) */
    return parts.join("_").replace(/[\\/:*?"<>|]/g, "") + ".csv";
  }

  /**
   * 오류 목록에 쓸 «어디의 무엇인지» 한 줄.
   *   "최초 판단 · 빠진 코드 한 줄 — 이 칸을 채워 주세요."
   * validateAll 이 준 열쇠(initial.taskFields.missingLine)를 사람 말로 바꾼다.
   */
  function describeError(topic, key, message) {
    var sections = {
      student: "학생 정보",
      initial: "최초 판단",
      discussion: "토론",
      final: "최종 판단",
      honestyConfirmed: "정직성 확인"
    };
    var head = key.split(".")[0];
    var section = sections[head] || "";
    var fieldName = "";

    var mark = "taskFields.";
    var at = key.indexOf(mark);
    if (at !== -1 && topic) {
      var fieldKey = key.slice(at + mark.length);
      var phase = head === "initial" ? "initial" : "final";
      AE.topics.fieldsOf(topic, phase).forEach(function (f) {
        if (f.key === fieldKey) fieldName = AE.topics.labelOf(f);
      });
    } else if (/personalPrinciple$/.test(key)) {
      fieldName = "나의 AI 활용 원칙";
    }

    return (section ? section + " · " : "") + (fieldName ? fieldName + " — " : "") + message;
  }

  AE.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    toInt: toInt,
    josa: josa,
    describeError: describeError,
    validateStudent: validateStudent,
    validateInitial: validateInitial,
    validateDiscussion: validateDiscussion,
    validateFinal: validateFinal,
    validateAll: validateAll,
    buildSubmission: buildSubmission,
    localIsoString: localIsoString,
    dedupeKey: dedupeKey,
    normalize: normalize,
    parseStudentId: parseStudentId,
    composeStudentId: composeStudentId,
    describeStudentId: describeStudentId,
    seatOrder: seatOrder,
    seatLabel: seatLabel,
    studentLabel: studentLabel,
    summarize: summarize,
    choiceCounts: choiceCounts,
    guardFormula: guardFormula,
    csvCell: csvCell,
    csvColumns: csvColumns,
    cellValue: cellValue,
    toCsv: toCsv,
    csvFileName: csvFileName
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = AE.schema;
  }
})();
    </script>

    <script data-from="teacher/t00-core.js">
/**
 * 교사용 코어 — 이름 공간과 화면 부품
 *
 * 교사용은 학생용 파일을 하나도 읽지 않는다. 공통 부품(shared/)만 함께 쓴다.
 * 그래서 학생용 빌드에 교사용 코드가 섞일 일도, 그 반대도 없다(명세 8장).
 *
 * ★ 학생이 쓴 글은 언제나 textContent 로만 넣는다.
 *   innerHTML 을 쓰지 않으므로 <script> 를 적어 낸 답변도 «글자» 로만 보인다(명세 6.5).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /** ISO 시각 → 「2026-08-17 10:20」 */
  function fmtTime(iso, withSeconds) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var base =
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes());
    return withSeconds ? base + ":" + two(d.getSeconds()) : base;
  }

  /** 표 안에서 긴 글을 짧게 (전체 내용은 상세 보기에서 본다) */
  function shorten(text, max) {
    var s = String(text || "");
    var limit = max || 18;
    return s.length > limit ? s.slice(0, limit) + "…" : s;
  }

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  /** 접었다 펼 수 있는 긴 글 (명세 9.2) */
  function longText(text) {
    var value = String(text || "");
    var body = el("p", { class: "longtext__body", text: value || "(작성하지 않음)" });
    if (value.length <= 120) return el("div", { class: "longtext" }, [body]);

    body.classList.add("longtext__body--clamp");
    var btn = el("button", {
      class: "btn btn--tiny",
      text: "펼치기",
      attrs: { type: "button", "aria-expanded": "false" },
      on: {
        click: function () {
          var open = body.classList.toggle("longtext__body--clamp");
          btn.textContent = open ? "펼치기" : "접기";
          btn.setAttribute("aria-expanded", open ? "false" : "true");
        }
      }
    });
    return el("div", { class: "longtext" }, [body, btn]);
  }

  T.core = {
    $: $,
    $$: $$,
    el: el,
    clear: clear,
    fmtTime: fmtTime,
    shorten: shorten,
    toast: toast,
    announce: announce,
    longText: longText
  };
})();
    </script>
    <script data-from="teacher/t10-api.js">
/**
 * 교사용 자료 읽기 (명세 6.1 · 7.5)
 *
 * 보안에서 지킨 것
 *   · 화면 코드 안에 «교사 비밀키» 를 적어 두지 않는다. 선생님이 그때그때 입력한다.
 *   · 입력한 키는 주소창(URL)에 넣지 않는다. POST 본문으로만 보낸다.
 *     주소에 넣으면 브라우저 기록·서버 로그·어깨너머로 남기 때문이다(명세 6.1).
 *   · 키는 sessionStorage 에만 둔다. 브라우저 탭을 닫으면 사라진다.
 *
 * 명세 7.5 의 GET ?action=list 형태도 서버가 지원하지만, 그 길은 기본으로 잠겨 있다.
 * 자세한 내용은 apps-script/README.md 를 볼 것.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});

  var KEY_STORE = "ai-ethics-teacher-key";
  var URL_STORE = "ai-ethics-teacher-url";
  var MEMO_STORE = "ai-ethics-teacher-memo";
  var TIMEOUT_MS = 20000;

  /* ------------------------------------------------------------------ */
  /* 조회 주소 (학생에게 알려 준 것과 같은 /exec 주소)                       */
  /* ------------------------------------------------------------------ */

  function getUrl() {
    var fixed = AE.config.fixedUrl();
    if (fixed) return fixed;
    try {
      return (root.localStorage && root.localStorage.getItem(URL_STORE)) || "";
    } catch (e) {
      return "";
    }
  }

  function setUrl(value) {
    try {
      if (!root.localStorage) return;
      var clean = String(value || "").trim();
      if (clean) root.localStorage.setItem(URL_STORE, clean);
      else root.localStorage.removeItem(URL_STORE);
    } catch (e) {
      /* 저장하지 못해도 이번 화면에서는 계속 쓸 수 있다 */
    }
  }

  /** 주소로 불러올 수 있는 상태인가 */
  function canFetch() {
    return !AE.config.isDemo() && !!getUrl();
  }

  function getKey() {
    try {
      return root.sessionStorage ? root.sessionStorage.getItem(KEY_STORE) || "" : "";
    } catch (e) {
      return "";
    }
  }

  function setKey(value) {
    try {
      if (!root.sessionStorage) return;
      if (value) root.sessionStorage.setItem(KEY_STORE, value);
      else root.sessionStorage.removeItem(KEY_STORE);
    } catch (e) {
      /* 저장하지 못해도 이번 화면에서는 계속 쓸 수 있다 */
    }
  }

  /* ------------------------------------------------------------------ */
  /* 데모 자료                                                            */
  /* ------------------------------------------------------------------ */

  function readDemo() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(AE.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemo(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(AE.DEMO_STORE_KEY, JSON.stringify(list));
    } catch (e) {
      /* 무시 */
    }
  }

  /* ------------------------------------------------------------------ */
  /* 통신                                                                */
  /* ------------------------------------------------------------------ */

  function post(payload) {
    if (typeof root.fetch !== "function") {
      return Promise.reject(new Error("이 브라우저에서는 조회 기능을 쓸 수 없습니다."));
    }
    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };
    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }
    return root
      .fetch(getUrl(), options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          throw new Error("서버 응답을 읽지 못했습니다. 배포 설정(액세스 권한)을 확인해 주세요.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 제출 목록을 가져온다.
   * 돌려주는 것 : { ok, generatedAt, submissions[], summary, demo }
   */
  function list(filters) {
    var f = filters || {};

    if (AE.config.isDemo()) {
      var rows = readDemo()
        .filter(function (r) {
          if (f.topicId && r.topicId !== f.topicId) return false;
          return true;
        })
        .map(AE.schema.normalize);
      return Promise.resolve({
        ok: true,
        demo: true,
        generatedAt: new Date().toISOString(),
        submissions: rows,
        summary: AE.schema.summarize(rows)
      });
    }

    if (!getUrl()) {
      return Promise.reject(
        new Error("제출 주소가 없습니다. 학생에게 알려 준 /exec 주소를 넣거나, 파일을 끌어다 놓아 주세요.")
      );
    }

    return post({
      action: "list",
      teacherKey: getKey(),
      topicId: f.topicId || ""
    }).then(function (data) {
      if (!data || data.ok !== true) {
        var err = new Error((data && data.message) || "조회하지 못했습니다.");
        err.code = data && data.code;
        throw err;
      }
      var rows = (data.submissions || []).map(AE.schema.normalize);
      return {
        ok: true,
        demo: false,
        generatedAt: data.generatedAt || new Date().toISOString(),
        submissions: rows,
        summary: data.summary || AE.schema.summarize(rows)
      };
    });
  }

  /* ------------------------------------------------------------------ */
  /* JSON 파일에서 읽기 (선생님이 드라이브에서 내려받은 파일)                */
  /* ------------------------------------------------------------------ */

  /**
   * 아무 모양의 JSON 에서 «제출 목록» 을 뽑아낸다.
   * 파일 하나에 제출 하나가 든 것도, 배열도, { submissions: [...] } 도 모두 받는다.
   */
  function extractRows(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) {
      return raw.reduce(function (all, item) {
        return all.concat(extractRows(item));
      }, []);
    }
    if (typeof raw !== "object") return [];
    if (Array.isArray(raw.submissions)) return extractRows(raw.submissions);
    if (Array.isArray(raw.rows)) return extractRows(raw.rows);
    if (Array.isArray(raw.items)) return extractRows(raw.items);
    /* 제출 한 건으로 보이는가 */
    if (raw.topicId || raw.submissionId) return [raw];
    return [];
  }

  /** 이 차시 것만 남기고, 같은 학생·같은 주제는 «최신» 것만 둔다 */
  function dedupeRows(rows) {
    var byKey = {};
    (rows || []).forEach(function (raw) {
      if (!raw) return;
      if (raw.lessonId && raw.lessonId !== AE.LESSON_ID) return;
      var sub = AE.schema.normalize(raw);
      if (!sub.topicId) return;
      var key = AE.schema.dedupeKey(sub);
      var prev = byKey[key];
      if (!prev) {
        byKey[key] = sub;
        return;
      }
      var when = sub.serverUpdatedAt || sub.serverSubmittedAt || "";
      var prevWhen = prev.serverUpdatedAt || prev.serverSubmittedAt || "";
      if (String(when) >= String(prevWhen)) byKey[key] = sub;
    });
    return Object.keys(byKey).map(function (k) {
      return byKey[k];
    });
  }

  /** 파일 하나를 글자로 읽는다 */
  function readFileText(file) {
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () {
        resolve({ name: file.name, text: String(reader.result || "") });
      };
      reader.onerror = function () {
        resolve({ name: file.name, text: "", failed: true });
      };
      reader.readAsText(file, "UTF-8");
    });
  }

  /**
   * 고른 파일들(또는 끌어다 놓은 파일들)에서 제출을 읽는다.
   * 돌려주는 것 : { ok, submissions[], readCount, skipped[] }
   */
  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) {
      return Promise.resolve({ ok: false, message: "고른 파일이 없습니다.", submissions: [], skipped: [] });
    }
    return Promise.all(files.map(readFileText)).then(function (results) {
      var rows = [];
      var skipped = [];
      results.forEach(function (r) {
        if (r.failed) {
          skipped.push(r.name + " (읽지 못함)");
          return;
        }
        var parsed;
        try {
          parsed = JSON.parse(r.text);
        } catch (e) {
          skipped.push(r.name + " (JSON 형식이 아님)");
          return;
        }
        var found = extractRows(parsed);
        if (!found.length) {
          skipped.push(r.name + " (제출 자료가 아님)");
          return;
        }
        rows = rows.concat(found);
      });

      var submissions = dedupeRows(rows);
      return {
        ok: submissions.length > 0,
        submissions: submissions,
        readCount: files.length,
        skipped: skipped,
        generatedAt: new Date().toISOString(),
        message: submissions.length === 0 ? "읽을 수 있는 제출이 없습니다." : ""
      };
    });
  }

  /* ------------------------------------------------------------------ */
  /* 교사 메모 (명세 6.5 — 선택 기능)                                      */
  /* ------------------------------------------------------------------ */

  /**
   * 파일을 끌어다 놓고 보는 중이라면 서버에 쓸 길이 없다.
   * 그럴 때는 이 브라우저에만 담아 두고 화면에 그렇게 적어 준다.
   */
  function readLocalMemos() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(MEMO_STORE) : null;
      var v = raw ? JSON.parse(raw) : {};
      return v && typeof v === "object" ? v : {};
    } catch (e) {
      return {};
    }
  }

  function writeLocalMemo(submissionId, memo) {
    try {
      if (!root.localStorage) return false;
      var all = readLocalMemos();
      if (memo) all[submissionId] = memo;
      else delete all[submissionId];
      root.localStorage.setItem(MEMO_STORE, JSON.stringify(all));
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 이 브라우저에 담아 둔 메모를 불러온 제출에 얹는다 */
  function applyLocalMemos(rows) {
    var all = readLocalMemos();
    (rows || []).forEach(function (sub) {
      if (!sub.teacherMemo && all[sub.submissionId]) sub.teacherMemo = all[sub.submissionId];
    });
    return rows;
  }

  function saveMemo(submissionId, memo) {
    if (AE.config.isDemo()) {
      var rows = readDemo();
      for (var i = 0; i < rows.length; i += 1) {
        if (rows[i].submissionId === submissionId) {
          rows[i].teacherMemo = memo;
          writeDemo(rows);
          return Promise.resolve({ ok: true, demo: true });
        }
      }
      return Promise.resolve({ ok: false, message: "해당 제출을 찾지 못했습니다." });
    }

    /* 주소가 없으면(파일을 끌어다 놓고 보는 중) 이 브라우저에만 담는다 */
    if (!canFetch()) {
      var saved = writeLocalMemo(submissionId, memo);
      return Promise.resolve({
        ok: saved,
        local: true,
        message: saved ? "" : "이 브라우저에 저장하지 못했습니다."
      });
    }

    return post({
      action: "memo",
      teacherKey: getKey(),
      submissionId: submissionId,
      teacherMemo: memo
    });
  }

  /** 서버가 살아 있는지, 키가 맞는지 확인 */
  function ping() {
    if (AE.config.isDemo()) return Promise.resolve({ ok: true, demo: true });
    return post({ action: "ping", teacherKey: getKey() });
  }

  T.api = {
    getKey: getKey,
    setKey: setKey,
    getUrl: getUrl,
    setUrl: setUrl,
    canFetch: canFetch,
    list: list,
    readFiles: readFiles,
    extractRows: extractRows,
    dedupeRows: dedupeRows,
    applyLocalMemos: applyLocalMemos,
    saveMemo: saveMemo,
    ping: ping,
    readDemo: readDemo
  };
})();
    </script>
    <script data-from="teacher/t20-filter.js">
/**
 * 거르기 · 정렬 · 쪽 나누기 (명세 6.2 · 6.4)
 *
 * 화면을 그리지 않는 «계산만 하는» 파일이라 테스트로 바로 확인할 수 있다.
 * 정렬과 쪽 이동을 해도 거르기 조건은 그대로 남는다(명세 12.2).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});

  var PAGE_SIZES = [20, 50, 100];

  function emptyFilters() {
    return {
      unitId: "",
      topicId: "",
      grade: "",
      classNumber: "",
      changeType: "",
      query: "",
      sortKey: "seat",
      sortDir: "asc",
      page: 1,
      pageSize: 20
    };
  }

  function norm(v) {
    return String(v === null || v === undefined ? "" : v).trim().toLowerCase();
  }

  /** 이름 또는 학번으로 찾기 — 「10312」 일부만 넣어도 맞는다 */
  function matchQuery(sub, query) {
    var q = norm(query);
    if (!q) return true;
    var s = sub.student || {};
    var hay = [norm(s.name), norm(s.studentId)].join(" ");
    return hay.indexOf(q) !== -1;
  }

  function applyFilters(rows, f) {
    var filters = f || emptyFilters();
    return (rows || []).filter(function (sub) {
      var s = sub.student || {};
      if (filters.topicId && sub.topicId !== filters.topicId) return false;
      if (filters.unitId) {
        var topic = AE.topics.byId(sub.topicId);
        if (!topic || topic.unitId !== filters.unitId) return false;
      }
      if (filters.grade && String(s.grade) !== String(filters.grade)) return false;
      if (filters.classNumber && String(s.classNumber) !== String(filters.classNumber)) return false;
      if (filters.changeType) {
        var ct = sub.finalAnswer && sub.finalAnswer.changeType;
        if (ct !== filters.changeType) return false;
      }
      if (!matchQuery(sub, filters.query)) return false;
      return true;
    });
  }

  /** 열 머리글을 눌렀을 때 쓰는 정렬 (명세 6.4) */
  function sortRows(rows, key, dir) {
    var sign = dir === "desc" ? -1 : 1;
    var copy = (rows || []).slice();

    function value(sub) {
      switch (key) {
        case "seat":
          /* 학번이 곧 자리 순서다 (10312 → 1학년 3반 12번) */
          return AE.schema.seatOrder(sub);
        case "name":
          return (sub.student && sub.student.name) || "";
        case "topic":
          return sub.topicId || "";
        case "initial":
          return (sub.initialAnswer && sub.initialAnswer.choice) || "";
        case "final":
          return (sub.finalAnswer && sub.finalAnswer.choice) || "";
        case "change":
          return (sub.finalAnswer && sub.finalAnswer.changeType) || "";
        case "status":
          return sub.status || "";
        case "time":
        default:
          return sub.serverUpdatedAt || sub.serverSubmittedAt || "";
      }
    }

    copy.sort(function (a, b) {
      var va = value(a);
      var vb = value(b);
      if (typeof va === "number" && typeof vb === "number") return (va - vb) * sign;
      va = String(va);
      vb = String(vb);
      if (va === vb) return AE.schema.seatOrder(a) - AE.schema.seatOrder(b);
      return va.localeCompare(vb, "ko") * sign;
    });
    return copy;
  }

  function paginate(rows, page, size) {
    var list = rows || [];
    var pageSize = size || 20;
    var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
    var current = Math.min(Math.max(1, page || 1), totalPages);
    var start = (current - 1) * pageSize;
    return {
      page: current,
      totalPages: totalPages,
      total: list.length,
      rows: list.slice(start, start + pageSize),
      from: list.length === 0 ? 0 : start + 1,
      to: Math.min(start + pageSize, list.length)
    };
  }

  /** 거르기 상자에 넣을 «실제로 존재하는 값» 목록 */
  function optionsFrom(rows) {
    var grades = {};
    var classNumbers = {};
    (rows || []).forEach(function (sub) {
      var s = sub.student || {};
      if (!isNaN(s.grade)) grades[s.grade] = true;
      if (!isNaN(s.classNumber)) classNumbers[s.classNumber] = true;
    });
    function nums(obj) {
      return Object.keys(obj)
        .map(Number)
        .sort(function (a, b) {
          return a - b;
        });
    }
    return {
      grades: nums(grades),
      classNumbers: nums(classNumbers)
    };
  }

  T.filter = {
    PAGE_SIZES: PAGE_SIZES,
    emptyFilters: emptyFilters,
    applyFilters: applyFilters,
    sortRows: sortRows,
    paginate: paginate,
    optionsFrom: optionsFrom,
    matchQuery: matchQuery
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.filter;
})();

    <script data-from="teacher/t30-summary.js">
/**
 * 요약 카드 (명세 6.3)
 *
 * 세는 것만 한다. 서술형 길이나 어떤 선택지를 골랐는지를 «윤리 점수» 로 바꾸지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});
  var c = T.core;
  var el = c.el;

  function statCard(label, value, note) {
    return el("div", { class: "stat" }, [
      el("p", { class: "stat__label", text: label }),
      el("p", { class: "stat__value", text: String(value) }),
      note ? el("p", { class: "stat__note", text: note }) : null
    ]);
  }

  /** 이름 옆에 개수를 적은 작은 목록 */
  function countList(pairs, emptyText) {
    if (!pairs.length) return el("p", { class: "stat__note", text: emptyText || "없음" });
    return el(
      "ul",
      { class: "countlist" },
      pairs.map(function (p) {
        return el("li", { class: "countlist__item" }, [
          el("span", { class: "countlist__name", text: p.label }),
          el("span", { class: "countlist__num", text: p.count + "건" })
        ]);
      })
    );
  }

  /**
   * container 에 요약을 그린다.
   * rows 는 «지금 거르기가 끝난» 목록이다.
   */
  function render(container, rows, filters) {
    c.clear(container);
    var summary = AE.schema.summarize(rows);

    var byTopic = Object.keys(summary.byTopic)
      .sort()
      .map(function (id) {
        return { label: AE.topics.titleOf(id), count: summary.byTopic[id] };
      });

    /* 지금 어떤 조건으로 걸렀는지 한 줄로 (수업 코드는 쓰지 않는다) */
    var picked = [];
    if (filters.unitId) {
      AE.UNITS.forEach(function (u) {
        if (u.id === filters.unitId) picked.push(u.title);
      });
    }
    if (filters.topicId) picked.push(filters.topicId);
    if (filters.grade) picked.push(filters.grade + "학년");
    if (filters.classNumber) picked.push(filters.classNumber + "반");
    if (filters.changeType) picked.push(filters.changeType);
    if (filters.query) picked.push("찾기 “" + filters.query + "”");

    container.appendChild(
      el("div", { class: "stat-grid" }, [
        statCard("전체 제출 수", summary.totalSubmissions, "지금 거르기 결과 기준"),
        statCard("고유 학생 수", summary.uniqueStudents, "학번 기준"),
        statCard("지금 거르기 조건", picked.length, picked.length ? picked.join(" · ") : "조건 없음 (전체)"),
        el("div", { class: "stat stat--wide" }, [
          el("p", { class: "stat__label", text: "주제별 제출 수" }),
          countList(byTopic, "제출이 없습니다")
        ])
        /* 「토론 후 생각 변화」 요약 카드는 두지 않는다(2026-08-17).
           같은 내용을 «주제별 분석» 의 막대그래프가 주제마다 더 자세히 보여 준다. */
      ])
    );
  }

  T.summary = { render: render };
})();
