    <script data-from="teacher/t40-table.js">
/**
 * 제출 목록 표 (명세 6.4)
 *
 *   · 열 머리글을 눌러 정렬한다 (aria-sort 로 스크린 리더에도 알린다)
 *   · 한 쪽에 20 · 50 · 100 개 중에서 고른다
 *   · 좁은 화면에서는 표가 «카드» 로 바뀐다 (CSS 가 처리하도록 각 칸에 이름표를 붙여 둔다)
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});
  var c = T.core;
  var el = c.el;

  /**
   * 표에 「학번」 열은 두지 않는다(2026-08-17).
   * 「학년·반·번호」가 같은 내용을 더 읽기 쉽게 보여 주기 때문이다.
   * 학번 자체는 상세 보기와 CSV 에서 볼 수 있다.
   */
  var COLUMNS = [
    { key: "time", label: "제출 시각", sortable: true },
    { key: "name", label: "이름", sortable: true },
    { key: "seat", label: "학년·반·번호", sortable: true },
    { key: "topic", label: "주제", sortable: true },
    { key: "initial", label: "최초 판단", sortable: true },
    { key: "final", label: "최종 판단", sortable: true },
    { key: "change", label: "생각 변화", sortable: true },
    { key: "status", label: "제출 상태", sortable: true },
    { key: "detail", label: "상세 보기", sortable: false }
  ];

  function cellText(sub, key) {
    switch (key) {
      case "time":
        return c.fmtTime(sub.serverUpdatedAt || sub.serverSubmittedAt);
      case "seat":
        return AE.schema.seatLabel(sub);
      case "name":
        return sub.student.name || "";
      case "topic":
        return AE.topics.titleOf(sub.topicId);
      case "initial":
        return sub.initialAnswer.choice || "";
      case "final":
        return sub.finalAnswer.choice || "";
      case "change":
        return sub.finalAnswer.changeType || "";
      case "status":
        return sub.status || "완료";
      default:
        return "";
    }
  }

  /**
   * options : { rows, page, filters, onSort(key), onDetail(sub), onPage(n) }
   */
  function render(container, options) {
    var o = options;
    c.clear(container);

    var page = o.page;

    /* ── 머리글 ── */
    var headCells = COLUMNS.map(function (col) {
      var isSorted = o.filters.sortKey === col.key;
      var th = el("th", {
        attrs: {
          scope: "col",
          "aria-sort": col.sortable ? (isSorted ? (o.filters.sortDir === "asc" ? "ascending" : "descending") : "none") : null
        }
      });
      if (!col.sortable) {
        th.textContent = col.label;
        return th;
      }
      th.appendChild(
        el("button", {
          class: "th-sort" + (isSorted ? " th-sort--on" : ""),
          attrs: { type: "button" },
          text: col.label + (isSorted ? (o.filters.sortDir === "asc" ? " ▲" : " ▼") : ""),
          on: {
            click: function () {
              o.onSort(col.key);
            }
          }
        })
      );
      return th;
    });

    /* ── 본문 ── */
    var bodyRows = page.rows.map(function (sub) {
      var cells = COLUMNS.map(function (col) {
        if (col.key === "detail") {
          return el("td", { attrs: { "data-label": col.label } }, [
            el("button", {
              class: "btn btn--tiny",
              text: "상세",
              attrs: {
                type: "button",
                "aria-label": (sub.student.name || "학생") + " 상세 보기"
              },
              on: {
                click: function () {
                  o.onDetail(sub);
                }
              }
            })
          ]);
        }
        var full = cellText(sub, col.key);
        var short = col.key === "initial" || col.key === "final" ? c.shorten(full, 14) : full;
        var td = el("td", { attrs: { "data-label": col.label }, text: short });
        if (short !== full) td.setAttribute("title", full);
        return td;
      });
      return el("tr", {}, cells);
    });

    var table = el("table", { class: "dtable" }, [
      el("caption", { class: "sr-only", text: "제출 목록" }),
      el("thead", {}, [el("tr", {}, headCells)]),
      el(
        "tbody",
        {},
        bodyRows.length
          ? bodyRows
          : [
              el("tr", {}, [
                el("td", {
                  class: "dtable__empty",
                  attrs: { colspan: String(COLUMNS.length) },
                  text: "조건에 맞는 제출이 없습니다."
                })
              ])
            ]
      )
    ]);

    container.appendChild(el("div", { class: "dtable-wrap" }, [table]));

    /* ── 쪽 이동 ──
       「한 쪽에 ○개씩」 고르는 칸은 여기 두지 않는다.
       위쪽 [2 제출 목록] 단추 옆에 나란히 있다(t90-main.js 의 pageSizeControl). */
    container.appendChild(
      el("div", { class: "pager" }, [
        el("p", {
          class: "pager__info",
          text: page.total === 0 ? "0건" : page.from + "–" + page.to + " / 전체 " + page.total + "건"
        }),
        el("div", { class: "pager__right" }, [
          el("button", {
            class: "btn btn--tiny",
            text: "◀ 이전",
            attrs: { type: "button", disabled: page.page <= 1 },
            on: {
              click: function () {
                o.onPage(page.page - 1);
              }
            }
          }),
          el("span", { class: "pager__num", text: page.page + " / " + page.totalPages }),
          el("button", {
            class: "btn btn--tiny",
            text: "다음 ▶",
            attrs: { type: "button", disabled: page.page >= page.totalPages },
            on: {
              click: function () {
                o.onPage(page.page + 1);
              }
            }
          })
        ])
      ])
    );
  }

  T.table = { render: render, COLUMNS: COLUMNS };
})();
    </script>
    <script data-from="teacher/t50-detail.js">
/**
 * 학생별 상세 보기 (명세 6.5)
 *
 * 모달로 띄운다.
 *   · 학생이 쓴 글은 모두 textContent — 스크립트로 실행되지 않는다
 *   · 긴 글은 접었다 펼 수 있다
 *   · Esc 로 닫고, 닫으면 원래 있던 버튼으로 초점이 돌아간다
 *   · [인쇄] 는 이 모달만 인쇄한다(styles/print.css)
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});
  var c = T.core;
  var el = c.el;

  var openEl = null;
  var lastFocus = null;

  function row(label, value) {
    return el("div", { class: "drow" }, [
      el("p", { class: "drow__label", text: label }),
      c.longText(value)
    ]);
  }

  function close() {
    if (!openEl) return;
    document.body.classList.remove("modal-open");
    if (openEl.parentNode) openEl.parentNode.removeChild(openEl);
    openEl = null;
    document.removeEventListener("keydown", onKey);
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }

  function onKey(e) {
    if (e.key === "Escape") {
      e.preventDefault();
      close();
      return;
    }
    /* 탭이 모달 밖으로 나가지 않게 한다 */
    if (e.key === "Tab" && openEl) {
      var focusables = openEl.querySelectorAll(
        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
      );
      if (!focusables.length) return;
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  }

  function open(sub, options) {
    close();
    lastFocus = document.activeElement;
    var opt = options || {};
    var topic = AE.topics.byId(sub.topicId);

    var titleId = "detail-title";
    var blocks = [];

    /* 학생 정보 */
    blocks.push(
      el("div", { class: "dgroup" }, [
        el("h3", { class: "dgroup__title", text: "학생 정보" }),
        row("학번", sub.student.studentId || ""),
        row("이름", sub.student.name || ""),
        row("학년·반·번호", AE.schema.seatLabel(sub)),
        row("최초 제출 시각", c.fmtTime(sub.serverSubmittedAt, true)),
        row("최종 수정 시각", c.fmtTime(sub.serverUpdatedAt, true)),
        row("제출 상태", sub.status || "완료"),
        row("정직성 확인", sub.honestyConfirmed ? "확인함" : "확인하지 않음")
      ])
    );

    /* 활동 주제 */
    blocks.push(
      el("div", { class: "dgroup" }, [
        el("h3", { class: "dgroup__title", text: "활동 주제" }),
        row("주제", sub.topicId + " · " + AE.topics.titleOf(sub.topicId)),
        row("연계 개념", topic ? topic.concepts : ""),
        row("핵심 질문", topic ? topic.coreQuestion : "")
      ])
    );

    /* 최초 판단 */
    var initialRows = [
      el("h3", { class: "dgroup__title", text: "최초 판단" }),
      row("선택", sub.initialAnswer.choice)
    ];
    if (!topic || topic.initial.reason) initialRows.push(row("이유", sub.initialAnswer.reason));
    if (topic) {
      AE.topics.fieldsOf(topic, "initial").forEach(function (f) {
        initialRows.push(row(AE.topics.labelOf(f), sub.initialAnswer.taskFields[f.key]));
      });
    }
    blocks.push(el("div", { class: "dgroup" }, initialRows));

    /* 토론 */
    blocks.push(
      el("div", { class: "dgroup" }, [
        el("h3", { class: "dgroup__title", text: "토론" }),
        row("새롭게 알게 된 점", sub.discussion.newInsight),
        row("토론 완료 표시", sub.discussion.completed ? "예" : "아니오")
      ])
    );

    /* 최종 판단 */
    var finalRows = [
      el("h3", { class: "dgroup__title", text: "최종 판단" }),
      row("선택", sub.finalAnswer.choice),
      row("이유", sub.finalAnswer.reason),
      row("생각 변화", sub.finalAnswer.changeType)
    ];
    if (topic) {
      /* class-3 의 «AI 활용 기록» 5개 항목도 여기에서 모두 보인다 (명세 6.5) */
      AE.topics.fieldsOf(topic, "final").forEach(function (f) {
        finalRows.push(row(AE.topics.labelOf(f), sub.finalAnswer.taskFields[f.key]));
      });
      if (topic.final.sentence) {
        finalRows.push(row("완성 문장", AE.topics.sentencePreview(topic, sub.finalAnswer.taskFields)));
      }
    }
    blocks.push(el("div", { class: "dgroup" }, finalRows));

    blocks.push(
      el("div", { class: "dgroup" }, [
        el("h3", { class: "dgroup__title", text: "나의 AI 활용 원칙" }),
        c.longText(sub.personalPrinciple)
      ])
    );

    /* 교사 메모 */
    var memoInput = el("textarea", {
      class: "input input--area",
      id: "detail-memo",
      attrs: { rows: 3, placeholder: "이 학생에 대한 메모 (학생에게는 보이지 않습니다)" }
    });
    memoInput.value = sub.teacherMemo || "";
    var memoStatus = el("p", { class: "dmemo__status", attrs: { "aria-live": "polite" } });
    var memoBtn = el("button", {
      class: "btn btn--tiny",
      text: "메모 저장",
      attrs: { type: "button" },
      on: {
        click: function () {
          memoBtn.disabled = true;
          memoStatus.textContent = "저장 중…";
          T.api.saveMemo(sub.submissionId, memoInput.value).then(
            function (res) {
              memoBtn.disabled = false;
              if (res && res.ok) {
                sub.teacherMemo = memoInput.value;
                /* 파일을 끌어다 놓고 보는 중이면 서버에 쓸 길이 없다. 그 사실을 분명히 적는다. */
                memoStatus.textContent = res.local
                  ? "이 브라우저에만 저장했습니다. (다른 컴퓨터에서는 보이지 않습니다)"
                  : "저장했습니다.";
                if (opt.onMemoSaved) opt.onMemoSaved(sub);
              } else {
                memoStatus.textContent = (res && res.message) || "저장하지 못했습니다.";
              }
            },
            function () {
              memoBtn.disabled = false;
              memoStatus.textContent = "저장하지 못했습니다. 연결을 확인해 주세요.";
            }
          );
        }
      }
    });

    blocks.push(
      el("div", { class: "dgroup dmemo" }, [
        el("h3", { class: "dgroup__title", text: "교사 메모" }),
        el("label", { class: "sr-only", text: "교사 메모", attrs: { for: "detail-memo" } }),
        memoInput,
        el("div", { class: "btn-row" }, [memoBtn, memoStatus])
      ])
    );

    var closeBtn = el("button", {
      class: "btn btn--tiny",
      text: "닫기",
      attrs: { type: "button" },
      on: { click: close }
    });

    var printBtn = el("button", {
      class: "btn btn--tiny",
      text: "인쇄",
      attrs: { type: "button" },
      on: {
        click: function () {
          root.print();
        }
      }
    });

    var panel = el(
      "div",
      {
        class: "modal__panel",
        attrs: { role: "dialog", "aria-modal": "true", "aria-labelledby": titleId }
      },
      [
        el("div", { class: "modal__head" }, [
          el("h2", {
            class: "modal__title",
            id: titleId,
            text: AE.schema.studentLabel(sub) + " · " + AE.topics.titleOf(sub.topicId)
          }),
          el("div", { class: "btn-row" }, [printBtn, closeBtn])
        ]),
        el("div", { class: "modal__body" }, blocks)
      ]
    );

    openEl = el("div", { class: "modal", on: { click: function (e) {
      if (e.target === openEl) close();
    } } }, [panel]);

    document.body.appendChild(openEl);
    document.body.classList.add("modal-open");
    document.addEventListener("keydown", onKey);
    closeBtn.focus();
  }

  T.detail = { open: open, close: close };
})();
    </script>
    <script data-from="teacher/t60-analysis.js">
/**
 * 주제별 분석 (명세 6.6)
 *
 *   · 선택형 문항의 응답 인원과 비율을 막대로 보여 준다
 *   · 생각 변화 분포를 보여 준다
 *   · 서술형은 «원문 목록» 으로만 보여 준다. 요약하거나 점수를 매기지 않는다
 *   · 「아직 제출하지 않은 학생」 은 학생 명단이 있을 때만 쓸 수 있다 → 지금은 안내만 한다
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});
  var c = T.core;
  var el = c.el;

  /** 막대 하나 — 글자에 인원과 비율이 모두 들어 있어 색 없이도 읽힌다 */
  function bar(label, count, percent, tone) {
    var fill = el("div", { class: "bar__fill" + (tone ? " bar__fill--" + tone : "") });
    fill.style.width = Math.max(percent, 0) + "%";
    return el("li", { class: "bar" }, [
      el("span", { class: "bar__label", text: label }),
      el("span", { class: "bar__track" }, [fill]),
      el("span", { class: "bar__num", text: count + "명 (" + percent + "%)" })
    ]);
  }

  function barGroup(title, items, tone) {
    return el("div", { class: "chart" }, [
      el("h4", { class: "chart__title", text: title }),
      el(
        "ul",
        { class: "bars" },
        items.map(function (it) {
          return bar(it.label, it.count, it.percent, tone);
        })
      )
    ]);
  }

  function changeChart(rows) {
    var counts = {};
    AE.CHANGE_TYPES.forEach(function (ct) {
      counts[ct] = 0;
    });
    var total = 0;
    rows.forEach(function (r) {
      var ct = r.finalAnswer && r.finalAnswer.changeType;
      if (ct && Object.prototype.hasOwnProperty.call(counts, ct)) {
        counts[ct] += 1;
        total += 1;
      }
    });
    var items = AE.CHANGE_TYPES.map(function (ct) {
      return {
        label: ct,
        count: counts[ct],
        percent: total > 0 ? Math.round((counts[ct] / total) * 1000) / 10 : 0
      };
    });
    return barGroup("토론 후 생각 변화", items, "teal");
  }

  /** 서술형 원문 목록 — 학생 이름과 함께, 글자 그대로 */
  function textList(title, rows, getter) {
    var items = rows
      .map(function (r) {
        return { name: AE.schema.studentLabel(r), text: getter(r) };
      })
      .filter(function (x) {
        return x.text;
      });

    return el("details", { class: "rawlist" }, [
      el("summary", { class: "rawlist__summary", text: title + " (" + items.length + "건)" }),
      items.length === 0
        ? el("p", { class: "rawlist__empty", text: "해당하는 답변이 없습니다." })
        : el(
            "ul",
            { class: "rawlist__items" },
            items.map(function (x) {
              return el("li", { class: "rawlist__item" }, [
                el("p", { class: "rawlist__who", text: x.name }),
                el("p", { class: "rawlist__text", text: x.text })
              ]);
            })
          )
    ]);
  }

  function render(container, rows, filters) {
    c.clear(container);

    if (rows.length === 0) {
      container.appendChild(el("p", { class: "empty", text: "표시할 제출이 없습니다." }));
      return;
    }

    /* 거른 결과 안에 있는 주제들을 각각 분석한다 */
    var topicIds = [];
    rows.forEach(function (r) {
      if (topicIds.indexOf(r.topicId) === -1) topicIds.push(r.topicId);
    });
    topicIds.sort();

    topicIds.forEach(function (topicId) {
      var topic = AE.topics.byId(topicId);
      var subset = rows.filter(function (r) {
        return r.topicId === topicId;
      });

      var blocks = [
        el("p", { class: "chart-note", text: "제출 " + subset.length + "건" })
      ];

      if (topic) {
        blocks.push(
          barGroup("최초 판단 — " + topic.initial.choiceLabel, AE.schema.choiceCounts(subset, topicId, "initial"))
        );
        blocks.push(barGroup("최종 판단", AE.schema.choiceCounts(subset, topicId, "final"), "navy"));
      }
      blocks.push(changeChart(subset));

      if (topic) {
        if (topic.initial.reason) {
          blocks.push(
            textList("최초 이유 원문", subset, function (r) {
              return r.initialAnswer.reason;
            })
          );
        }
        blocks.push(
          textList("토론에서 새롭게 알게 된 점 원문", subset, function (r) {
            return r.discussion.newInsight;
          })
        );
        blocks.push(
          textList("최종 이유 원문", subset, function (r) {
            return r.finalAnswer.reason;
          })
        );
        AE.topics.fieldsOf(topic, "initial").forEach(function (f) {
          blocks.push(
            textList("최초 · " + AE.topics.labelOf(f), subset, function (r) {
              return r.initialAnswer.taskFields[f.key];
            })
          );
        });
        AE.topics.fieldsOf(topic, "final").forEach(function (f) {
          blocks.push(
            textList("최종 · " + AE.topics.labelOf(f), subset, function (r) {
              return r.finalAnswer.taskFields[f.key];
            })
          );
        });
        blocks.push(
          textList("나의 AI 활용 원칙 원문", subset, function (r) {
            return r.personalPrinciple;
          })
        );

        /* 교사 핵심 정리 — shared/teacher-notes.js 는 교사용만 읽는다 (명세 2장 2번) */
        blocks.push(
          el("div", { class: "teacher-note" }, [
            el("p", { class: "teacher-note__label", text: "교사 핵심 정리" }),
            el("p", { class: "teacher-note__text", text: AE.teacherNoteOf(topicId) })
          ])
        );
      }

      container.appendChild(
        el("section", { class: "panel" }, [
          el("h3", { class: "panel__title", text: topicId + " · " + AE.topics.titleOf(topicId) }),
          el("div", { class: "panel__body" }, blocks)
        ])
      );
    });

    container.appendChild(
      el("p", {
        class: "empty",
        text:
          "「아직 제출하지 않은 학생」 목록은 학생 명단 파일을 연결한 경우에만 표시됩니다. 지금은 제출된 자료만 보여 줍니다."
      })
    );
  }

  T.analysis = { render: render };
})();
    </script>
    <script data-from="teacher/t70-csv.js">
/**
 * CSV 내려받기 (명세 6.7)
 *
 *   · «지금 거르기 결과» 만 담는다
 *   · UTF-8 BOM 을 붙여 엑셀에서 한글이 깨지지 않게 한다
 *   · = + - @ 로 시작하는 학생 입력은 앞에 ' 를 붙여 수식으로 실행되지 않게 한다
 *     (실제 만드는 일은 shared/schema.js 가 한다. 여기서는 파일로 저장만 한다)
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});

  function download(rows, filters) {
    var text = AE.schema.toCsv(rows);
    var name = AE.schema.csvFileName(filters);

    /* text/csv 로 지정하고 BOM 은 이미 문자열 안에 들어 있다 */
    var blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
    return name;
  }

  T.csv = { download: download };
})();
    </script>
    <script data-from="teacher/t90-main.js">
/**
 * 교사용 대시보드 본체 (명세 6.2 · 9.2)
 *
 * 화면 순서 : 안내 → 요약 카드 → 거르기 → 차트 → 제출 목록
 * 거르기 조건은 한 곳(state.filters)에만 있고, 정렬·쪽 이동을 해도 그대로 남는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var T = AE.teacher || (AE.teacher = {});
  if (typeof document === "undefined") return;

  var c = T.core;
  var el = c.el;

  var state = {
    all: [],
    filters: T.filter.emptyFilters(),
    lastLoaded: null,
    source: "",
    loading: false,
    autoRefresh: false,
    timer: null,
    error: "",
    /** 지금 보고 있는 쪽 — 1 주제별 분석 · 2 제출 목록 */
    page: 1
  };

  /* ------------------------------------------------------------------ */
  /* 쪽 이동 (명세 9.2 를 두 쪽으로 나눴다)                                 */
  /* ------------------------------------------------------------------ */

  /**
   * 요약과 거르기는 위에 그대로 두고, 그 아래만 두 쪽으로 나눈다.
   * 거르기 조건은 한 곳(state.filters)에만 있으므로 쪽을 옮겨도 그대로 걸린다.
   */
  var PAGES = [
    { no: 1, label: "주제별 분석" },
    { no: 2, label: "제출 목록" }
  ];

  /**
   * 「한 쪽에 ○개씩」 — 제출 목록 단추 «옆에» 나란히 둔다.
   * 표 아래 좁은 칸에 있으면 「한 / 쪽에」로 갈라져 두 줄이 되기 때문이다.
   * (갈라지지 않도록 CSS 에서 white-space: nowrap 도 함께 준다)
   */
  function pageSizeControl() {
    var id = "page-size";
    var sel = el(
      "select",
      {
        class: "input pagesize__select",
        id: id,
        on: {
          change: function () {
            state.filters.pageSize = parseInt(sel.value, 10);
            state.filters.page = 1;
            renderData();
            /* 다시 그리면서 새로 만들어지므로 초점을 되돌려 준다 */
            var again = c.$("#" + id);
            if (again) again.focus();
          }
        }
      },
      T.filter.PAGE_SIZES.map(function (n) {
        return el("option", { text: n + "개씩", attrs: { value: String(n) } });
      })
    );
    sel.value = String(state.filters.pageSize);

    return el("div", { class: "pagesize" }, [
      el("label", { class: "pagesize__label", text: "한 쪽에", attrs: { for: id } }),
      sel
    ]);
  }

  function renderPageNav(rowCount) {
    var box = c.$("#pagenav-area");
    c.clear(box);

    var tabs = PAGES.map(function (p) {
      var on = state.page === p.no;
      var btn = el("button", {
        class: "pagetab" + (on ? " pagetab--on" : ""),
        id: "tab-" + p.no,
        attrs: {
          type: "button",
          role: "tab",
          "aria-selected": on ? "true" : "false",
          "aria-controls": "page-" + p.no,
          tabindex: on ? "0" : "-1"
        },
        on: {
          click: function () {
            goToPage(p.no);
          },
          keydown: function (e) {
            /* ← → 로도 쪽을 옮길 수 있게 한다 (명세 9.3 키보드) */
            if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
            e.preventDefault();
            var next = e.key === "ArrowRight" ? p.no + 1 : p.no - 1;
            if (next < 1) next = PAGES.length;
            if (next > PAGES.length) next = 1;
            goToPage(next);
            var moved = c.$("#tab-" + next);
            if (moved) moved.focus();
          }
        }
      }, [
        el("span", { class: "pagetab__no", text: String(p.no) }),
        el("span", { class: "pagetab__label", text: p.label })
      ]);

      /* 2쪽에는 지금 몇 건이 걸렸는지 함께 적어 준다 */
      if (p.no === 2) {
        btn.appendChild(el("span", { class: "pagetab__count", text: rowCount + "건" }));
      }
      return btn;
    });

    /* 「한 쪽에 ○개씩」 은 tablist «밖» 에 둔다.
       tablist 안에는 탭만 있어야 스크린 리더가 「1/2」 를 바르게 읽는다. */
    box.appendChild(
      el("div", { class: "pagenav" }, [
        el("div", { class: "pagetabs", attrs: { role: "tablist", "aria-label": "화면 이동" } }, tabs),
        state.page === 2 ? pageSizeControl() : null
      ])
    );
  }

  function showPage() {
    PAGES.forEach(function (p) {
      var panel = c.$("#page-" + p.no);
      if (panel) panel.hidden = state.page !== p.no;
    });
  }

  function goToPage(no) {
    if (state.page === no) return;
    state.page = no;
    renderPageNav(visibleRows().length);
    showPage();

    var panel = c.$("#page-" + no);
    if (panel) {
      panel.focus({ preventScroll: true });
      if (typeof panel.scrollIntoView === "function") panel.scrollIntoView({ block: "start" });
    }
    c.announce(PAGES[no - 1].label + " 화면입니다.");
  }

  /* ------------------------------------------------------------------ */
  /* 안내 · 접근                                                          */
  /* ------------------------------------------------------------------ */

  function renderNotice() {
    var box = c.$("#notice-area");
    c.clear(box);

    if (AE.config.isDemo()) {
      box.appendChild(
        el("div", { class: "notice notice--warn", attrs: { role: "note" } }, [
          el("p", { class: "notice__title", text: "개발용: 인증 미적용 · 데모 모드" }),
          el("p", {
            class: "notice__text",
            text:
              AE.config.demoReason() +
              " 지금 보이는 자료는 이 브라우저에 저장된 연습용 제출뿐입니다. 실제 수업에 쓰려면 shared/config.js 에 Apps Script 주소를 넣고 demoMode 를 false 로 바꾼 뒤 다시 빌드하세요."
          })
        ])
      );
      return;
    }

    box.appendChild(
      el("div", { class: "notice notice--info", attrs: { role: "note" } }, [
        el("p", { class: "notice__title", text: "학생 제출은 공유 드라이브에 JSON 파일로 쌓입니다" }),
        el("p", {
          class: "notice__text",
          text:
            "폴더에서 파일을 내려받아 아래에 끌어다 놓으면 바로 볼 수 있습니다. 주소로 한꺼번에 불러오려면 교사 확인 키가 필요하며, 키는 주소창에 남지 않고 탭을 닫으면 지워집니다."
        })
      ])
    );
  }

  /**
   * 자료 불러오기 — 두 가지 길 (명세 6.2)
   *   ① 파일에서   : 드라이브 폴더에서 내려받은 JSON 을 고르거나 끌어다 놓는다 (권장)
   *   ② 주소에서   : 학생에게 알려 준 /exec 주소 + 교사 확인 키로 한꺼번에 불러온다
   */
  function renderLoad() {
    var box = c.$("#access-area");
    c.clear(box);
    if (AE.config.isDemo()) return;

    /* ── ① 파일에서 ── */
    var fileInput = el("input", {
      class: "sr-only",
      id: "file-input",
      attrs: { type: "file", accept: ".json,application/json", multiple: true }
    });
    fileInput.addEventListener("change", function () {
      loadFromFiles(fileInput.files);
      fileInput.value = "";
    });

    var drop = el("div", { class: "dropzone", attrs: { tabindex: "0", role: "button" } }, [
      el("p", { class: "dropzone__title", text: "제출 파일을 여기에 끌어다 놓으세요" }),
      el("p", {
        class: "dropzone__text",
        text: "공유 드라이브 폴더의 .json 파일을 한꺼번에 선택해 끌어오면 됩니다."
      }),
      el("button", {
        class: "btn btn--primary",
        text: "파일 고르기",
        attrs: { type: "button" },
        on: {
          click: function () {
            fileInput.click();
          }
        }
      }),
      fileInput
    ]);

    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("dropzone--over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("dropzone--over");
      });
    });
    drop.addEventListener("drop", function (e) {
      var dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length) loadFromFiles(dt.files);
    });
    drop.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        fileInput.click();
      }
    });

    /* ── ② 주소에서 ── */
    var urlInput = el("input", {
      class: "input",
      id: "teacher-url",
      attrs: { type: "url", placeholder: "https://script.google.com/macros/s/.../exec", autocomplete: "off" }
    });
    urlInput.value = AE.config.fixedUrl() || T.api.getUrl();
    if (AE.config.fixedUrl()) urlInput.disabled = true;

    var keyInput = el("input", {
      class: "input input--short",
      id: "teacher-key",
      attrs: { type: "password", placeholder: "교사 확인 키", autocomplete: "off" }
    });
    keyInput.value = T.api.getKey();

    var fetchBtn = el("button", {
      class: "btn btn--ghost",
      text: "주소로 불러오기",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!AE.config.fixedUrl()) T.api.setUrl(urlInput.value.trim());
          T.api.setKey(keyInput.value.trim());
          load();
        }
      }
    });

    box.appendChild(
      el("div", { class: "load" }, [
        el("div", { class: "load__col" }, [
          el("h3", { class: "load__title", text: "① 파일에서 불러오기" }),
          drop
        ]),
        el("div", { class: "load__col" }, [
          el("h3", { class: "load__title", text: "② 주소로 불러오기" }),
          el("div", { class: "load__form" }, [
            el("label", { class: "field__label", text: "제출 주소", attrs: { for: "teacher-url" } }),
            urlInput,
            el("label", { class: "field__label", text: "교사 확인 키", attrs: { for: "teacher-key" } }),
            el("div", { class: "access__row" }, [keyInput, fetchBtn]),
            el("p", {
              class: "load__note",
              text: "제출이 많으면 주소로 불러오기가 느릴 수 있습니다. 그럴 때는 ① 을 쓰세요."
            })
          ])
        ])
      ])
    );
  }

  /** 고른(또는 끌어다 놓은) 파일에서 불러온다 */
  function loadFromFiles(files) {
    state.loading = true;
    state.error = "";
    renderToolbar();

    T.api.readFiles(files).then(
      function (res) {
        state.loading = false;
        if (!res.ok) {
          state.error = res.message || "읽을 수 있는 제출이 없습니다.";
          renderAll();
          return;
        }
        state.all = T.api.applyLocalMemos(res.submissions);
        state.source = "file";
        state.lastLoaded = res.generatedAt;
        setAutoRefresh(false); // 파일은 저절로 새로워지지 않는다
        renderAll();
        var msg = "제출 " + res.submissions.length + "건을 읽었습니다.";
        if (res.skipped && res.skipped.length) msg += " (건너뛴 파일 " + res.skipped.length + "개)";
        c.toast(msg);
        c.announce(msg);
        if (res.skipped && res.skipped.length) {
          state.error = "건너뛴 파일: " + res.skipped.join(", ");
          renderToolbar();
        }
      },
      function () {
        state.loading = false;
        state.error = "파일을 읽지 못했습니다.";
        renderAll();
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 도구 줄                                                              */
  /* ------------------------------------------------------------------ */

  function renderToolbar() {
    var box = c.$("#toolbar-area");
    c.clear(box);

    var canRefresh = AE.config.isDemo() || T.api.canFetch();
    var refreshBtn = el("button", {
      class: "btn btn--ghost",
      text: state.loading ? "불러오는 중…" : "새로고침",
      attrs: {
        type: "button",
        disabled: state.loading || !canRefresh,
        title: canRefresh ? null : "주소로 불러온 경우에만 쓸 수 있습니다"
      },
      on: { click: load }
    });

    var autoId = "auto-refresh";
    var autoBox = el("input", {
      id: autoId,
      attrs: { type: "checkbox", disabled: !canRefresh },
      class: "check__box"
    });
    autoBox.checked = state.autoRefresh;
    autoBox.addEventListener("change", function () {
      setAutoRefresh(autoBox.checked);
    });

    var csvBtn = el("button", {
      class: "btn btn--ghost",
      text: "CSV 내려받기",
      attrs: { type: "button" },
      on: {
        click: function () {
          var rows = visibleRows();
          if (!rows.length) {
            c.toast("내려받을 자료가 없습니다.");
            return;
          }
          var name = T.csv.download(rows, state.filters);
          c.toast(name + " 를 저장했습니다.");
        }
      }
    });

    box.appendChild(
      el("div", { class: "toolbar" }, [
        el("div", { class: "toolbar__left" }, [
          refreshBtn,
          el("div", { class: "toolbar__auto" }, [
            autoBox,
            el("label", {
              class: "toolbar__autolabel",
              text: "자동 새로고침 (" + (AE.CONFIG.teacherRefreshSeconds || 30) + "초)",
              attrs: { for: autoId }
            })
          ])
        ]),
        el("div", { class: "toolbar__right" }, [
          el("p", {
            class: "toolbar__time",
            text: state.lastLoaded
              ? (state.source === "file" ? "파일에서 읽음 " : "마지막 갱신 ") + c.fmtTime(state.lastLoaded, true)
              : "아직 불러오지 않았습니다"
          }),
          csvBtn
        ])
      ])
    );

    if (state.error) {
      box.appendChild(
        el("div", { class: "notice notice--warn", attrs: { role: "alert" } }, [
          el("p", { class: "notice__title", text: "⚠ 자료를 불러오지 못했습니다" }),
          el("p", { class: "notice__text", text: state.error })
        ])
      );
    }
  }

  function setAutoRefresh(on) {
    state.autoRefresh = on;
    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }
    if (on) {
      var sec = AE.CONFIG.teacherRefreshSeconds || 30;
      state.timer = setInterval(load, sec * 1000);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 거르기 줄                                                            */
  /* ------------------------------------------------------------------ */

  function selectField(id, label, options, value, onChange) {
    var sel = el(
      "select",
      {
        class: "input input--short",
        id: id,
        on: {
          change: function () {
            onChange(sel.value);
          }
        }
      },
      [el("option", { text: "전체", attrs: { value: "" } })].concat(
        options.map(function (o) {
          return el("option", { text: o.label, attrs: { value: String(o.value) } });
        })
      )
    );
    sel.value = value === null || value === undefined ? "" : String(value);
    return el("div", { class: "field field--inline" }, [
      el("label", { class: "field__label", text: label, attrs: { for: id } }),
      sel
    ]);
  }

  function renderFilters() {
    var box = c.$("#filter-area");
    c.clear(box);
    var opts = T.filter.optionsFrom(state.all);

    function set(key, value) {
      state.filters[key] = value;
      state.filters.page = 1;
      renderAll();
    }

    var topicOptions = AE.topics.all
      .filter(function (t) {
        return !state.filters.unitId || t.unitId === state.filters.unitId;
      })
      .map(function (t) {
        return { value: t.id, label: t.id + " · " + t.title };
      });

    var searchId = "q";
    var search = el("input", {
      class: "input",
      id: searchId,
      attrs: { type: "search", placeholder: "이름 또는 학번(예: 10312)" }
    });
    search.value = state.filters.query;
    search.addEventListener("input", function () {
      state.filters.query = search.value;
      state.filters.page = 1;
      /* 검색은 표와 요약만 다시 그린다 — 입력 칸이 다시 만들어지면 초점을 잃기 때문 */
      renderData();
    });

    var resetBtn = el("button", {
      class: "btn btn--tiny",
      text: "조건 초기화",
      attrs: { type: "button" },
      on: {
        click: function () {
          var keepSize = state.filters.pageSize;
          state.filters = T.filter.emptyFilters();
          state.filters.pageSize = keepSize;
          renderAll();
        }
      }
    });

    box.appendChild(
      el("div", { class: "filters" }, [
        selectField(
          "f-unit",
          "단원",
          AE.UNITS.map(function (u) {
            return { value: u.id, label: u.title };
          }),
          state.filters.unitId,
          function (v) {
            state.filters.unitId = v;
            /* 단원을 바꾸면 그 단원에 없는 주제 선택은 푼다 */
            var t = AE.topics.byId(state.filters.topicId);
            if (v && t && t.unitId !== v) state.filters.topicId = "";
            state.filters.page = 1;
            renderAll();
          }
        ),
        selectField("f-topic", "주제", topicOptions, state.filters.topicId, function (v) {
          set("topicId", v);
        }),
        selectField(
          "f-grade",
          "학년",
          opts.grades.map(function (v) {
            return { value: v, label: v + "학년" };
          }),
          state.filters.grade,
          function (v) {
            set("grade", v);
          }
        ),
        selectField(
          "f-class",
          "반",
          opts.classNumbers.map(function (v) {
            return { value: v, label: v + "반" };
          }),
          state.filters.classNumber,
          function (v) {
            set("classNumber", v);
          }
        ),
        selectField(
          "f-change",
          "생각 변화",
          AE.CHANGE_TYPES.map(function (v) {
            return { value: v, label: v };
          }),
          state.filters.changeType,
          function (v) {
            set("changeType", v);
          }
        ),
        el("div", { class: "field field--inline field--grow" }, [
          el("label", { class: "field__label", text: "이름·학번 찾기", attrs: { for: searchId } }),
          search
        ]),
        el("div", { class: "filters__actions" }, [resetBtn])
      ])
    );
  }

  /* ------------------------------------------------------------------ */
  /* 자료 그리기                                                          */
  /* ------------------------------------------------------------------ */

  function visibleRows() {
    var filtered = T.filter.applyFilters(state.all, state.filters);
    return T.filter.sortRows(filtered, state.filters.sortKey, state.filters.sortDir);
  }

  function renderData() {
    var rows = visibleRows();
    T.summary.render(c.$("#summary-area"), rows, state.filters);
    T.analysis.render(c.$("#chart-area"), rows, state.filters);
    renderPageNav(rows.length);
    showPage();

    var page = T.filter.paginate(rows, state.filters.page, state.filters.pageSize);
    T.table.render(c.$("#table-area"), {
      rows: rows,
      page: page,
      filters: state.filters,
      onSort: function (key) {
        if (state.filters.sortKey === key) {
          state.filters.sortDir = state.filters.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.filters.sortKey = key;
          state.filters.sortDir = "asc";
        }
        renderData();
      },
      onPage: function (n) {
        state.filters.page = n;
        renderData();
      },
      onDetail: function (sub) {
        T.detail.open(sub, {
          onMemoSaved: function () {
            renderData();
          }
        });
      }
    });
  }

  function renderAll() {
    renderNotice();
    renderLoad();
    renderToolbar();
    renderFilters();
    renderData();
  }

  /* ------------------------------------------------------------------ */
  /* 불러오기                                                             */
  /* ------------------------------------------------------------------ */

  function load() {
    if (state.loading) return;
    state.loading = true;
    state.error = "";
    renderToolbar();

    T.api.list({ topicId: state.filters.topicId }).then(
      function (res) {
        state.loading = false;
        state.all = T.api.applyLocalMemos(res.submissions);
        state.source = res.demo ? "demo" : "url";
        state.lastLoaded = res.generatedAt;
        renderAll();
        c.announce("제출 " + res.submissions.length + "건을 불러왔습니다.");
      },
      function (err) {
        state.loading = false;
        state.error = (err && err.message) || "연결하지 못했습니다.";
        renderAll();
      }
    );
  }

  function boot() {
    renderAll();
    /* 데모 모드에서는 바로 불러온다. 서버 모드에서는 키를 넣고 [확인하고 불러오기] 를 누른다. */
    if (AE.config.isDemo()) load();
    else if (T.api.canFetch() && T.api.getKey()) load();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
