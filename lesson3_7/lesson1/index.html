  <body>
    <a class="skip-link" href="#app-main">본문 바로가기</a>

    <div class="app">
      <!-- 4.1-7 / 11.2 : 현재 학습 진행 상태 표시 (화면 최상단 고정) -->
      <header class="app-progress" id="app-progress">
        <div class="app-progress__inner">
          <nav class="stepper" id="stepper" aria-label="학습 단계 이동">
            <ol class="stepper__list" id="stepper-list"></ol>
          </nav>
          <div class="app-progress__meter">
            <p class="app-progress__count">
              <span id="progress-current">1</span>
              <span class="app-progress__count-sep"> / </span>
              <span>6</span>
            </p>
            <div
              class="progressbar"
              role="progressbar"
              id="progressbar"
              aria-label="학습 진행률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="progressbar__fill" id="progressbar-fill"></div>
            </div>
          </div>
        </div>
      </header>

      <!-- 각 단계 화면은 main.js 가 이 안에 생성한다 -->
      <main class="app-main" id="app-main"></main>

      <!-- 4.1-6 : 이전 / 다음 단계 이동 버튼 (화면 하단 고정) -->
      <footer class="app-nav" id="app-nav">
        <div class="app-nav__inner">
          <button type="button" class="btn btn--secondary" id="btn-prev">← 이전</button>
          <p class="app-nav__hint" id="nav-hint" aria-live="polite"></p>
          <button type="button" class="btn btn--primary" id="btn-next">다음 →</button>
        </div>
      </footer>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div class="sr-only" id="sr-live" role="status" aria-live="polite"></div>

  </body>
</html>
