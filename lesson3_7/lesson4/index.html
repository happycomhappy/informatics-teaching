    <!-- 스타일은 나열한 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다. -->
    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================
   가운데 코드 칸의 너비는 «가장 긴 코드 줄» 에 맞춘다(max-content).
   남은 자리를 설명이 모두 쓰므로, 코드 상자가 필요 이상으로 넓어지지 않는다. */
.linenotes {
  display: grid;
  grid-template-columns: auto max-content minmax(0, 1fr);
  align-items: stretch;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow-x: auto;
  line-height: 1.9;
}

.linenotes__num,
.linenotes__code {
  background: var(--color-code-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.linenotes__num {
  padding: 2px var(--space-2);
  text-align: right;
  color: #94a3b8;
  user-select: none;
}

.linenotes__code {
  padding: 2px var(--space-4) 2px var(--space-1);
  white-space: pre;
}

.linenotes__desc {
  display: flex;
  align-items: center;
  padding: 2px var(--space-3);
  border-left: 1px dashed var(--color-border-strong);
  background: var(--color-surface);
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  line-height: 1.5;
}

/* 줄 사이 구분선. 마지막 줄에는 넣지 않는다(바깥 테두리와 겹친다). */
.linenotes > * {
  border-bottom: 1px solid var(--color-border);
}

.linenotes > *:nth-last-child(-n + 3) {
  border-bottom: none;
}

/* 모바일에서는 설명을 코드 아래 줄로 내린다 */
@media (max-width: 767px) {
  .linenotes {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .linenotes__desc {
    grid-column: 1 / -1;
    border-left: none;
    border-top: 1px dashed var(--color-border-strong);
    padding: var(--space-2) var(--space-3);
  }

  .linenotes__desc.is-empty {
    display: none;
  }
}

/* ===================== 용어 설명 · 묻고 답하기 (9.6) ===================== */
/* 교과 자료의 「용어 설명」 상자와 같은 모양으로 맞춘다. */
.term-card {
  padding: var(--space-3) var(--space-4);
  border-left: 5px solid var(--color-text);
  background: var(--color-muted-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.term-card__title {
  font-size: 17px;
  font-weight: 800;
}

.term-card__desc {
  margin-top: 2px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.qa {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: var(--fs-small);
  line-height: 1.75;
}

.qa__row {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
}

.qa__mark {
  flex: 0 0 auto;
  width: 1.4em;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
}

.qa__mark--q {
  color: var(--color-true-dark);
}

.qa__mark--a {
  color: var(--color-error);
}

.qa__row--q {
  font-weight: 700;
}

/* ===================== 안전 장치 안내 (11.6) ===================== */
/* 무한 반복 예제에서 반드시 읽어야 하는 문구라 상자로 크게 보인다. */
.safety-notice {
  display: flex;
  width: 100%;
  font-size: 15px;
}

/* ===================== 무작위 뽑기 (9.6) ===================== */
.dice-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.dice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: 17px;
  font-weight: 800;
  animation: dice-roll 600ms ease infinite;
}

.dice.is-done {
  animation: none;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
}

@keyframes dice-roll {
  0%,
  100% {
    transform: rotate(-8deg);
  }
  50% {
    transform: rotate(8deg);
  }
}

/* ===================== 형성평가 (10장) ===================== */
.quiz-item .panel__title {
  align-items: flex-start;
  line-height: 1.5;
}

.expected {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.expected__title {
  padding: 4px var(--space-3);
  background: var(--color-muted-bg);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.expected__body {
  margin: 0;
  padding: var(--space-3);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  white-space: pre-wrap;
}

/* 문항 진행 표시 (문항 n / 5) */
.quiz-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.quiz-progress__text {
  font-weight: 800;
  color: var(--color-primary-dark);
}

.quiz-progress__dots {
  display: flex;
  gap: var(--space-2);
}

.quiz-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.quiz-dot.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.quiz-dot.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.1);
}

/* 문항 아래 버튼 줄 (이전 · 다음 · 채점 · 제출) */
.quiz-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.quiz-nav__hint {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  min-height: 1.4em;
}

.quiz-retry {
  margin-top: var(--space-3);
}

/* 제출 결과 안내 */
.submit-note {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-true);
  border-left-width: 5px;
  background: var(--color-true-soft);
  font-size: var(--fs-small);
  line-height: 1.7;
}

.submit-note code {
  font-family: var(--font-mono);
  font-weight: 700;
}

/* 제출 대화상자의 오류 문구 */
.modal__error {
  margin-top: var(--space-2);
  color: var(--color-error);
  font-size: var(--fs-small);
  font-weight: 700;
  min-height: 1.2em;
}

@media (max-width: 767px) {
  .quiz-nav .btn {
    flex: 1 1 46%;
  }
}

.quiz-review {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-muted-bg);
  font-size: var(--fs-small);
}

.quiz-review.is-correct {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}

.quiz-review.is-wrong {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.quiz-review__head {
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.quiz-review__rows dt {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
  margin-top: var(--space-2);
}

.quiz-review__rows dd {
  margin: 2px 0 0;
}

.pre-line {

    <script data-from="js/20-codeview.js">
/**
 * 파이썬 코드 표시 컴포넌트 (명세 11.2 코드 표시 / 11.3 조건 실행 상태)
 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (중첩 조건의 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시

 * 이번 차시에서 추가된 것 : setState(index, 'unchecked')
 *   → 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다(명세 11.3 '검사 안 함').

(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  // 3차시는 반복문이 주제이므로 for · while · break · continue · import 를 키워드로 추가한다.
  var KEYWORDS = /^(if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range|sum|random|randint)$/;

  var TOKEN_RE = /(\b(?:if|else|elif|for|while|break|continue|import|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range|sum|random|randint)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\+=|-=|\/\/|[%+\-*/<>=])/g;

    return '<span class="' + cls + '">' + escapeHtml(textContent) + '</span>';
  }

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */
  function highlightSegment(segment) {
    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);
    }
    if (last < segment.length) out += escapeHtml(segment.slice(last));
    return out;
  }

   */
  function highlightPython(source) {

    var flush = function () {
      if (buffer) {

        buffer = '';
      }

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {

        out += span('tok-comment', src.slice(i));
        return out;
      }
      if (ch === '"' || ch === "'") {
        flush();
        var j = i + 1;
        while (j < src.length && src[j] !== ch) {
          if (src[j] === '\\') j += 1;
          j += 1;
        }
        out += span('tok-str', src.slice(i, Math.min(j + 1, src.length)));

      buffer += ch;
      i += 1;

    return out;

  /**

   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁

  function createCodeView(opts) {

    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);

      current.forEach(function (line, index) {

        }
        if (kind && !group) {

          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);

    build(o.lines || []);

      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;

      setLines: function (next) {

      lineEl: function (index) {

      count: function () {

      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';

      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');

        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  L.codeview = {
    createCodeView: createCodeView,
    highlightPython: highlightPython
  };
})();

   * 값은 문항 id 이며, 배열의 자리(0~4)가 화면에 나오는 차례다.
   */
  var ORDERS = [
    [1, 2, 3, 4, 5], // 기본
    [2, 4, 1, 5, 3], // 재도전 1
    [3, 1, 5, 2, 4] // 재도전 2

    var i = ((n % ORDERS.length) + ORDERS.length) % ORDERS.length;
    return ORDERS[i].slice();
  }

  function byId(id) {
    for (var i = 0; i < QUESTIONS.length; i += 1) {

    remainingHint: remainingHint,
    answeredCount: answeredCount

  /* ------------------------------------------------------------------ */
  /* 화면 3 : while len(selected) < 3                                     */
  /* ------------------------------------------------------------------ */

  /** 명세 8.1 : 학습용 기본 시퀀스 */
  var WHILE_SEQ = [3, 3, 5, 2];

        condText: 'len(selected) < ' + target + '  →  ' + lenBefore + ' < ' + target,

        pick: pick,
        notIn: notIn,
        appended: notIn,

  /**

  /* ------------------------------------------------------------------ */

  /** 명세 10장 기본 리스트 */

  /* ------------------------------------------------------------------ */

  /* ------------------------------------------------------------------ */

    WHILE_SEQ: WHILE_SEQ,
    NUMBERS: NUMBERS,
    BOOKS: BOOKS,
    countAtLeast: countAtLeast,
    TEST_CASES: TEST_CASES,

    runForWithCheck: runForWithCheck,
    runWhileUnique: runWhileUnique,

  /* while 흐름 고리 (화면 3)                                             */

   * 지금 어느 자리에 있는지를 표시한다.
   */
  function flowRing(nodesText) {
    var labels = nodesText || [
      '① 조건 검사',
      '② 값 뽑기',
      '③ 중복 검사',
      '④ 추가 / 건너뜀',
      '↺ 조건으로 되돌아가기'
    ];
    var nodes = labels.map(function (text) {
      return el('span', { 'class': 'flowring__node', text: text });
    });
    var root = el('div', { 'class': 'flowring' }, nodes);
    return {
      root: root,
      setActive: function (i) {
        nodes.forEach(function (node, k) {
          node.classList.toggle('is-active', k === i);
        });
      },
      clear: function () {
        nodes.forEach(function (node) {
          node.classList.remove('is-active');
        });
      }
    };
  }

  /* 몬스터 진행 트랙 (화면 4)                                             */
  /* ------------------------------------------------------------------ */

  /**
   * 1~49 칸 진행 경로. 모바일에서는 여러 줄 그리드로 접힌다(명세 9.2).
   *   setState(n, 'kill' | 'continue' | 'break' | 'notrun' | 'here')
   */
  function monsterTrack(opts) {
    var o = opts || {};
    var from = o.from === undefined ? 1 : o.from;
    var to = o.to === undefined ? 49 : o.to;
    var cells = {};
    var nodes = [];
    for (var n = from; n <= to; n += 1) {
      var cell = el('div', {
        'class': 'mcell',
        dataset: { no: String(n) },
        attrs: { 'aria-label': n + '번 몬스터' }
      }, [
        el('span', { 'class': 'mcell__no', text: String(n) }),
        el('span', { 'class': 'mcell__mark', text: '' })

      nodes.push(cell);

    var root = el('div', {
      'class': 'mtrack',
      attrs: { role: 'group', 'aria-label': '몬스터 진행 경로' }
    }, nodes);

      kill: '처치 ✓',
      'continue': '건너뜀 ↷',
      'break': '반복 종료 ■',
      notrun: '실행 안 함 —',
      here: '지금'
    };

    function setState(n, state) {
      var cell = cells[n];
      if (!cell) return;
      cell.className = 'mcell is-' + state;
      var mark = cell.querySelector('.mcell__mark');
      if (mark) mark.textContent = MARK[state] || '';
    }

    function setHere(n) {
      Object.keys(cells).forEach(function (key) {
        cells[key].classList.remove('is-here');
      });
      var cell = cells[n];
      if (!cell) return;
      cell.classList.add('is-here');
      if (typeof cell.scrollIntoView === 'function') {
        cell.scrollIntoView({ block: 'nearest', inline: 'center' });
      }
    }

    function reset() {
      Object.keys(cells).forEach(function (key) {
        cells[key].className = 'mcell';
        var mark = cells[key].querySelector('.mcell__mark');
        if (mark) mark.textContent = '';
      });
    }

    return { root: root, setState: setState, setHere: setHere, reset: reset };
  }

  /* ------------------------------------------------------------------ */
  /* 숫자 카드 줄 (화면 5)                                                 */
  /* ------------------------------------------------------------------ */

  /** 리스트 숫자를 카드로 늘어놓고 현재 처리 중인 카드를 강조한다. */
  function numberCards(numbers) {

      root: root,
      setCurrent: function (i, kind) {

          if (k === i && kind) card.classList.add(kind === 'even' ? 'is-even' : 'is-odd');
        });
      },
      reset: function () {
        cards.forEach(function (card) {
          card.className = 'numcard numcard--static';
        });
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 접었다 펼치는 상태 패널 (명세 20.2)                                    */
  /* ------------------------------------------------------------------ */

  /** 모바일에서 상태 패널을 접을 수 있게 감싸 준다. */
  function foldable(title, contentNode, opts) {
    var o = opts || {};
    var body = el('div', { 'class': 'fold__body' }, [contentNode]);
    var head = el('button', {
      type: 'button',
      'class': 'fold__head',
      attrs: { 'aria-expanded': 'true' }
    }, [
      el('span', { 'class': 'fold__title', text: title }),
      el('span', { 'class': 'fold__chevron', text: '▾', attrs: { 'aria-hidden': 'true' } })
    ]);
    var root = el('div', { 'class': 'fold is-open' + (o.className ? ' ' + o.className : '') }, [head, body]);
    head.addEventListener('click', function () {
      var open = root.classList.toggle('is-open');
      head.setAttribute('aria-expanded', String(open));
    });
    return root;
  }

  L.flow = {
    condBadge: condBadge,
    markText: markText,
    varRow: varRow,
    listView: listView,
    traceTable: traceTable,
    ballGrid: ballGrid,
    flowRing: flowRing,
    monsterTrack: monsterTrack,
    numberCards: numberCards,
    foldable: foldable
  };
})();

      values: ['A', 'B', 'C'],

    function showFrame(frame) {
      if (!frame) return;
      var row = frame.row;
      code.setStates({ 2: 'done', 3: 'running', 4: 'running' });
      balls.setCurrent(row.pick, { duplicated: row.duplicated });
      log.write(
        row.round + '회차 : pick = ' + row.pick + (row.duplicated ? '   ← 중복 ↻' : '')
      );
    }

    function finish() {
      var run = engine.runForPlain(currentCase().seq);
      code.setStates({ 2: 'done', 3: 'done', 4: 'done' });
      log.writeMuted(
        '출력 : ' + run.picks.join(' ') + '  →  서로 다른 반은 ' + run.distinct + '개'
      );
      result.innerHTML =
        '3번 시도했지만 서로 다른 반은 <strong>' + run.distinct + '개</strong>예요.';
      var list = st().ranCases || [];
      if (list.indexOf(currentCase().id) === -1) list.push(currentCase().id);
      st().ranCases = list;
      L.state.markChanged();
    }

    function ensurePlayer() {
      if (plainPlayer) return plainPlayer;
      plainPlayer = engine.createPlayer({
        frames: frames(),
        interval: ui.animMs(900) || 1,
        onFrame: showFrame,
        onEnd: finish

    var btnOne = ui.button({
      label: '한 번 뽑기',
      variant: 'secondary',
      onClick: function () {

    var btnAuto = ui.button({
      label: '3회 자동 실행',
      onClick: function () {
        ensurePlayer().play();
      }
    });
    var btnReset = ui.button({ label: '다시 시작', variant: 'ghost', onClick: reset });

    caseChips.setActive(st().caseId);

    var panel = ui.panel({
      title: '활동 1 · 단순 <code>for</code>문 실행',
      hint: '사례를 고르면 같은 결과를 몇 번이든 다시 확인할 수 있어요.'
    });
    panel.body.appendChild(caseChips.root);
    panel.body.appendChild(
      el('div', { 'class': 'split' }, [
        el('div', { 'class': 'stack' }, [code.root, ui.buttonRow([btnOne, btnAuto, btnReset])]),
        el('div', { 'class': 'stack' }, [
          flow.foldable('1~8반', balls.root),
          result,
          log.root
        ])
      ])
    );

    refs.act1 = { reset: reset };
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  /* 활동 1 뒤 질문                                                        */
  /* ------------------------------------------------------------------ */
  function buildQuestion1() {
    var feedback = ui.createFeedback({ emptyText: '보기를 골라 보세요.' });
    var OPTIONS = [
      '서로 다른 반이 3개 나온다.',
      '뽑기를 3번 시도한다.',
      '중복이 나오지 않는다.'
    ];
    var ANSWER = 2;
    var buttons = [];

    function pick(no) {
      var correct = no === ANSWER;
      buttons.forEach(function (btn, i) {
        btn.classList.toggle('is-selected', i + 1 === no);
        btn.classList.toggle('is-correct', correct && i + 1 === no);
        btn.classList.toggle('is-wrong', !correct && i + 1 === no);
      });
      feedback.show(
        correct ? 'success' : 'warning',
        correct
          ? '맞아요. <code>for range(3)</code>은 <strong>3번의 시도</strong>를 보장하지만, ' +
              '난수 결과가 중복되지 않는다는 것은 보장하지 않아요.'
          : '사례 B(3, 3, 5)와 사례 C(2, 2, 2)를 다시 보세요. 시도는 언제나 3번이지만 결과는 달라져요.'
      );
    }

    var panel = ui.panel({ title: '실행 후 질문' });
    panel.body.appendChild(
      el('p', { 'class': 'bigq', html: '<code>for i in range(3)</code>은 무엇을 보장할까?' })
    );
    panel.body.appendChild(
      el(
        'div',
        { 'class': 'options' },
        OPTIONS.map(function (text, i) {
          var btn = el('button', {
            type: 'button',
            'class': 'option',
            on: {
              click: function () {
                pick(i + 1);
              }
            }
          }, [
            el('span', { 'class': 'option__num', text: '①②③'[i] }),
            el('span', { 'class': 'option__text', text: text })
          ]);
          buttons.push(btn);
          return btn;
        })
      )
    );
    panel.body.appendChild(feedback.root);
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  /* 활동 2 — 중복 검사를 넣어도 해결될까?                                  */
  /* ------------------------------------------------------------------ */
  function buildActivity2() {
    var code = L.codeview.createCodeView({
      title: '활동 2 · 중복 검사를 넣은 코드',
      lines: CODE_CHECK.map(function (line) {
        return { code: line };
      })
    });

    var table = flow.traceTable({
      head: ['회차', 'pick', '<code>pick not in selected</code>', 'append', 'selected'],
      caption: '중복 검사 코드의 회차별 실행',
      emptyText: '[사례 B로 실행하기]를 누르면 회차별 기록이 쌓여요.'
    });
    var listView = flow.listView({ name: 'selected' });
    var result = el('p', { 'class': 'bigresult' });

    function reset() {
      if (checkPlayer) checkPlayer.pause();
      checkPlayer = null;
      table.clear();
      listView.render([]);
      result.textContent = '';
      code.clearStates();
    }

    function run() {
      reset();
      var data = engine.runForWithCheck(engine.CASES.B.seq);
      var i = 0;
      checkPlayer = engine.createPlayer({
        frames: data.rows,
        interval: ui.animMs(950) || 1,
        onFrame: function (row) {
          i += 1;
          code.setStates({ 2: 'running', 3: 'done', 5: row.notIn ? 'done' : 'unchecked', 6: row.appended ? 'done' : 'skipped' });
          code.showBadge(5, flow.markText(row.notIn), row.notIn ? 'true' : 'false');
          table.addRow([
            String(row.round),
            String(row.pick),
            flow.markText(row.notIn),
            row.appended ? '실행 ✓' : '실행 안 함 —',
            '<code>' + JSON.stringify(row.list) + '</code>'
          ]);
          listView.render(row.list, { highlightLast: row.appended });
        },
        onEnd: function () {
          code.setStates({ 2: 'done' });
          result.innerHTML =
            '최종 <code>selected</code> = <strong>' +
            JSON.stringify(data.selected) +
            '</strong> — 서로 다른 반이 <strong>' +
            data.selected.length +
            '개</strong>뿐이에요.';
          st().ranCheck = true;
          if (data.selected.length === 2) st().sawTwo = true;
          var list = st().ranCases || [];
          if (list.indexOf('B') === -1) list.push('B');
          st().ranCases = list;
          L.state.markChanged();
        }
      });
      checkPlayer.play();
    }

    var panel = ui.panel({
      title: '활동 2 · 중복 검사를 추가하면 해결될까?',
      hint: '사례 B(3, 3, 5)로 실행해 회차마다 리스트가 어떻게 변하는지 확인해요.'
    });
    panel.body.appendChild(
      el('div', { 'class': 'split' }, [
        el('div', { 'class': 'stack' }, [
          code.root,
          ui.buttonRow([
            ui.button({ label: '사례 B로 실행하기', onClick: run }),
            ui.button({ label: '다시 시작', variant: 'ghost', onClick: reset })
          ])
        ]),
        el('div', { 'class': 'stack' }, [listView.root, result, table.root])
      ])
    );
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  /* 문제 발견 활동 (명세 7.3)                                             */
  /* ------------------------------------------------------------------ */
  function buildDiscover() {
    var OPTIONS = [
      '중복 검사 코드가 잘못되었기 때문이다.',
      'for range(3)은 3번만 시도하고 끝나므로, 중복이 나온 만큼 추가로 뽑지 않기 때문이다.',
      'random.randint()가 같은 값을 만들면 안 되기 때문이다.'
    ];
    var ANSWER = 2;
    var feedback = ui.createFeedback({ emptyText: '생각을 골라 보고, 아래에 내 말로 적어 보세요.' });
    var buttons = [];

    function pick(no) {
      var correct = no === ANSWER;
      buttons.forEach(function (btn, i) {
        btn.classList.toggle('is-selected', i + 1 === no);
        btn.classList.toggle('is-correct', correct && i + 1 === no);
        btn.classList.toggle('is-wrong', !correct && i + 1 === no);
      });
      feedback.show(
        correct ? 'success' : 'info',
        correct
          ? '그렇습니다. 문제는 «중복 자체»가 아니라 <strong>시도 횟수 3회와 결과 개수 3개가 다르다</strong>는 데 있어요.'
          : '중복 검사는 잘 작동했어요. 그런데도 결과가 2개인 이유는 <strong>더 뽑을 기회가 없었기</strong> 때문이에요.'
      );
      st().discover = no;
      L.state.markChanged();
    }

    var textArea = ui.textAreaField({
      label: '내 말로 설명해 보기 (선택)',
      rows: 3,
      placeholder: '예) 3번만 뽑기 때문에 중복이 나오면 그만큼 부족해진다.',
      onInput: ui.debounce(function (value) {
        st().discoverText = value;
        L.state.markChanged();
      }, 400)
    });
    refs.discoverText = textArea;
    refs.discoverPick = pick;
    refs.discoverButtons = buttons;

    var panel = ui.panel({ title: '문제 발견하기' });
    panel.body.appendChild(
      el('p', { 'class': 'bigq', text: '중복은 막았는데 왜 서로 다른 반이 3개가 되지 않았을까?' })
    );
    panel.body.appendChild(
      el(
        'div',
        { 'class': 'options' },
        OPTIONS.map(function (text, i) {
          var btn = el('button', {
            type: 'button',
            'class': 'option',
            on: {
              click: function () {
                pick(i + 1);
              }
            }
          }, [
            el('span', { 'class': 'option__num', text: '①②③'[i] }),
            el('span', { 'class': 'option__text', text: text })
          ]);
          buttons.push(btn);
          return btn;
        })
      )
    );
    panel.body.appendChild(feedback.root);
    panel.body.appendChild(textArea.root);
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  function render(container) {
    container.appendChild(
      ui.stepHeader({
        step: 2,
        title: '3번 뽑으면 항상 서로 다른 반 3개가 될까?',
        lead: [
          '청소 당번을 뽑는 프로그램을 만들었어요. <code>for i in range(3)</code>으로 3번 뽑으면 될 것 같은데,',
          '정말 <strong>서로 다른 반 3개</strong>가 모일까요? 직접 확인해 봅시다.'
        ]
      })
    );
    container.appendChild(buildActivity1());
    container.appendChild(buildQuestion1());
    container.appendChild(buildActivity2());
    container.appendChild(buildDiscover());
  }

  L.registerStep(2, {
    title: L.CONST.STEP_TITLES[2],
    short: L.CONST.STEP_SHORTS[2],
    render: render,
    onEnter: function () {
      if (refs.discoverText) refs.discoverText.setValue(st().discoverText || '');
      if (st().discover && refs.discoverPick) refs.discoverPick(st().discover);
    },
    onLeave: function () {
      if (plainPlayer) plainPlayer.pause();
      if (checkPlayer) checkPlayer.pause();
    }
  });
})();
    </script>
    <script data-from="js/62-step3.js">
/**
 * 화면 3 — while문으로 중복 없는 반 3개 뽑기 (명세 8장)
 *
 *   4영역 구성 : ① 코드  ② 현재 조건과 변수  ③ 리스트 상태  ④ 실행 로그
 *   중복이 나온 회차에서는 리스트가 그대로이고 «다시 조건 검사로 되돌아간다»는 점을 강조한다.
 *   학습용 안전 제한 : 최대 30회 (L.CONST.MAX_LOOP)
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var flow = L.flow;
  var engine = L.engine;
  var MAX_LOOP = L.CONST.MAX_LOOP;

  var CODE = [
    'selected = []',
    '',
    'while len(selected) < 3:',
    '    pick = random.randint(1, 8)',
    '',
    '    if pick not in selected:',
    '        selected.append(pick)',
    '',
    'print(selected)'
  ];

  var LINE = { init: 0, whileCond: 2, pick: 3, ifCheck: 5, append: 6, print: 8 };

  var refs = {};
  var player = null;

  function st() {
    return L.state.appState.step3;
  }

  /* ------------------------------------------------------------------ */
  /* 시뮬레이션                                                           */
  /* ------------------------------------------------------------------ */

  /** 회차 배열을 「조건 검사 → 뽑기 → 중복 검사 → 추가/건너뜀」 4프레임으로 펼친다. */
  function buildFrames(seq) {
    var data = engine.runWhileUnique(seq, { target: 3, maxLoop: MAX_LOOP });
    var frames = [];
    data.rounds.forEach(function (r) {
      frames.push({ kind: 'cond', r: r });
      frames.push({ kind: 'pick', r: r });
      frames.push({ kind: 'check', r: r });
      frames.push({ kind: 'apply', r: r });
    });
    if (data.endCheck) frames.push({ kind: 'end', end: data.endCheck, selected: data.selected });
    else frames.push({ kind: 'stopped' });
    return { frames: frames, data: data };
  }

  function buildSim() {
    var code = L.codeview.createCodeView({
      title: '실행 중인 코드',
      lines: CODE.map(function (line) {
        return { code: line };
      })
    });

    var vars = flow.varRow([
      { label: '회차', value: '-' },
      { label: 'len(selected)', value: 0 },
      { label: 'pick', value: '-' }
    ]);

    var condLine = el('p', { 'class': 'condline' }, [
      el('span', { 'class': 'condline__label', text: 'while 조건' }),
      el('span', { 'class': 'condline__text', text: 'len(selected) < 3' }),
      el('span', { 'class': 'condline__mark', text: '검사 안 함 —' })
    ]);
    var memberLine = el('p', { 'class': 'condline' }, [
      el('span', { 'class': 'condline__label', text: '중복 검사' }),
      el('span', { 'class': 'condline__text', text: 'pick not in selected' }),
      el('span', { 'class': 'condline__mark', text: '검사 안 함 —' })
    ]);

    var ring = flow.flowRing();
    var listView = flow.listView({ name: 'selected' });
    var log = ui.createConsole({
      title: '실행 로그',
      emptyText: '[한 회차 실행] 또는 [자동 실행]을 눌러 보세요.'
    });
    var notice = el('p', { 'class': 'note-line' });
    var seqText = el('p', { 'class': 'meta-count' });

    function setMark(node, value) {
      var mark = node.querySelector('.condline__mark');
      mark.textContent = flow.markText(value);
      mark.className =
        'condline__mark' + (value === null || value === undefined ? '' : value ? ' is-true' : ' is-false');
    }

    function resetView() {
      code.clearStates();
      vars.setValue('회차', '-');
      vars.setValue('len(selected)', 0);
      vars.setValue('pick', '-');
      setMark(condLine, null);
      setMark(memberLine, null);
      ring.clear();
      listView.render([]);
      log.clear();
      notice.textContent = '';
    }

    function showFrame(frame) {
      if (!frame) return;
      var r = frame.r;
      if (frame.kind === 'cond') {
        code.clearBadges();
        code.setStates({ 0: 'done', 2: 'running', 3: 'idle', 5: 'idle', 6: 'idle' });
        vars.setValue('회차', r.round);
        vars.setValue('len(selected)', r.lenBefore);
        condLine.querySelector('.condline__text').textContent = r.condText;
        setMark(condLine, true);
        code.showBadge(LINE.whileCond, 'True ✓', 'true');
        ring.setActive(0);
        log.write(r.round + '회차 · 조건 검사 : ' + r.condText + ' → True ✓');
      } else if (frame.kind === 'pick') {
        code.setStates({ 2: 'done', 3: 'running' });
        vars.setValue('pick', r.pick);
        ring.setActive(1);
        log.write('  뽑은 값 pick = ' + r.pick);
      } else if (frame.kind === 'check') {
        code.setStates({ 3: 'done', 5: 'running' });
        setMark(memberLine, r.notIn);
        code.showBadge(LINE.ifCheck, flow.markText(r.notIn), r.notIn ? 'true' : 'false');
        ring.setActive(2);
        log.write('  pick not in selected → ' + flow.markText(r.notIn));
      } else if (frame.kind === 'apply') {
        code.setStates({ 5: 'done', 6: r.appended ? 'running' : 'skipped' });
        listView.render(r.list, { highlightLast: r.appended });
        vars.setValue('len(selected)', r.list.length);
        ring.setActive(3);
        if (r.appended) {
          log.write('  append(' + r.pick + ') 실행 → selected = ' + JSON.stringify(r.list));
        } else {
          log.writeHint(
            '  중복 ↻ append 실행 안 함 — 리스트는 그대로 ' +
              JSON.stringify(r.list) +
              ' 이고, 다시 while 조건 검사로 돌아가요.'
          );
          st().sawDup = true;
          L.state.markChanged();
        }
        ring.setActive(4);
      } else if (frame.kind === 'end') {
        code.clearBadges();
        code.setStates({ 2: 'done', 3: 'idle', 5: 'unchecked', 6: 'unchecked', 8: 'running' });
        condLine.querySelector('.condline__text').textContent = frame.end.condText;
        setMark(condLine, false);
        code.showBadge(LINE.whileCond, 'False ✕', 'false');
        ring.setActive(0);
        log.write('조건 검사 : ' + frame.end.condText + ' → False ✕  ⇒ 반복 종료 ■');
        log.write('print(selected) → ' + JSON.stringify(frame.selected));
        notice.textContent = '길이가 3이 되어 조건이 거짓이 되었고, 반복이 끝났어요.';
        st().sawEnd = true;
        st().simDone = true;
        L.state.markChanged();
      } else if (frame.kind === 'stopped') {
        notice.textContent =
          '학습용 안전 제한(' +
          MAX_LOOP +
          '회)에 도달했어요. [새 시퀀스 만들기] 또는 [다시 시작]으로 다시 확인해 보세요.';
        log.writeError('학습용 안전 제한에 도달해 시뮬레이션을 멈췄어요.');
      }
    }

    function makePlayer() {
      var built = buildFrames(st().seq);
      seqText.textContent = '이번 시퀀스 : ' + st().seq.join(', ');
      player = engine.createPlayer({
        frames: built.frames,
        interval: ui.animMs(800) || 1,
        onFrame: showFrame,
        onPlayState: function (playing) {
          refs.btnPause.disabled = !playing;
          refs.btnAuto.disabled = playing;
        }
      });
      return player;
    }

    function ensurePlayer() {
      if (!player) makePlayer();
      return player;
    }

    function restart() {
      if (player) player.pause();
      player = null;
      resetView();
      seqText.textContent = '이번 시퀀스 : ' + st().seq.join(', ');
    }

    refs.btnAuto = ui.button({
      label: '자동 실행',
      onClick: function () {
        ensurePlayer().play();
      }
    });
    refs.btnPause = ui.button({
      label: '일시 정지',
      variant: 'secondary',
      disabled: true,
      onClick: function () {
        if (player) player.pause();
      }
    });

    var controls = ui.buttonRow([
      ui.button({
        label: '한 회차 실행',
        variant: 'secondary',
        onClick: function () {
          var p = ensurePlayer();
          p.pause();
          // 한 회차 = 조건 검사 · 뽑기 · 중복 검사 · 추가 네 프레임
          for (var i = 0; i < 4; i += 1) {
            if (!p.stepOnce()) break;
          }
        }
      }),
      refs.btnAuto,
      refs.btnPause,
      ui.button({ label: '다시 시작', variant: 'ghost', onClick: restart }),
      ui.button({
        label: '새 시퀀스 만들기',
        variant: 'ghost',
        onClick: function () {
          st().seq = engine.makeSequence({ min: 1, max: 8, target: 3 });
          L.state.markChanged();
          restart();
        }
      })
    ]);

    var panel = ui.panel({
      title: 'while문 실행 시뮬레이션',
      hint: '회차마다 <strong>조건 · 뽑은 값 · 중복 검사 · 리스트</strong>가 어떻게 바뀌는지 함께 보세요.'
    });
    panel.body.appendChild(seqText);
    panel.body.appendChild(
      el('div', { 'class': 'split' }, [
        el('div', { 'class': 'stack' }, [code.root, controls, notice]),
        el('div', { 'class': 'stack' }, [
          flow.foldable('현재 조건과 변수', el('div', { 'class': 'stack' }, [vars.root, condLine, memberLine])),
          flow.foldable('리스트 상태', listView.root),
          flow.foldable('반복 흐름', ring.root),
          log.root
        ])
      ])
    );

    refs.sim = { restart: restart };
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  /* 코드 조립 활동 (명세 8.4)                                             */
  /* ------------------------------------------------------------------ */

  var CARDS = [
    { id: 'w1', text: 'while len(selected) < 3:' },
    { id: 'w2', text: 'while len(selected) == 3:' },
    { id: 'w3', text: 'while len(selected) <= 3:' },
    { id: 'p', text: 'pick = random.randint(1, 8)' },
    { id: 'i', text: 'if pick not in selected:' },
    { id: 'a', text: 'selected.append(pick)' }
  ];

  var SOLUTION = [
    { card: 'w1', indent: 0 },
    { card: 'p', indent: 4 },
    { card: 'i', indent: 4 },
    { card: 'a', indent: 8 }
  ];

  function cardText(id) {
    for (var i = 0; i < CARDS.length; i += 1) {
      if (CARDS[i].id === id) return CARDS[i].text;
    }
    return '';
  }

  function buildAssemble() {
    var feedback = ui.createFeedback({
      emptyText: '네 줄을 올바른 순서와 들여쓰기로 맞춘 뒤 [확인하기]를 누르세요.'
    });
    var slots = [];

    var rows = SOLUTION.map(function (_, i) {
      var cardSelect = ui.selectField({
        label: null,
        options: [{ value: '', label: '— 줄 고르기 —' }].concat(
          CARDS.map(function (c) {
            return { value: c.id, label: c.text };
          })
        ),
        onChange: function () {
          save();
        }
      });
      var indentSelect = ui.selectField({
        label: null,
        className: 'select--indent',
        options: [
          { value: '0', label: '들여쓰기 0칸' },
          { value: '4', label: '들여쓰기 4칸' },
          { value: '8', label: '들여쓰기 8칸' }
        ],
        onChange: function () {
          save();
        }
      });
      slots.push({ card: cardSelect, indent: indentSelect });
      return el('div', { 'class': 'asm-row' }, [
        el('span', { 'class': 'asm-row__no', text: i + 1 + '번째 줄' }),
        indentSelect.root,
        cardSelect.root
      ]);
    });

    function current() {
      return slots.map(function (s) {
        return { card: s.card.getValue(), indent: Number(s.indent.getValue()) };
      });
    }

    function save() {
      st().assemble = current();
      L.state.markChanged();
      preview();
    }

    var previewBox = el('pre', { 'class': 'asm-preview' });

    function preview() {
      var lines = current().map(function (row) {
        if (!row.card) return '(빈 줄)';
        return new Array(row.indent + 1).join(' ') + cardText(row.card);
      });
      previewBox.textContent = lines.join('\n');
    }

    /** 명세 8.4 : 구체적 오답 피드백 */
    function check() {
      var got = current();
      if (
        got.some(function (row) {
          return !row.card;
        })
      ) {
        feedback.show('info', '아직 고르지 않은 줄이 있어요. 네 줄을 모두 골라 주세요.');
        return;
      }

      var used = got.map(function (r) {
        return r.card;
      });
      if (used.indexOf('w2') !== -1) {
        feedback.show(
          'error',
          '<code>while len(selected) == 3</code> 은 처음에는 리스트 길이가 0이므로 조건이 False가 되어 ' +
            '<strong>한 번도 반복하지 않아요.</strong>'
        );
        return;
      }
      if (used.indexOf('w3') !== -1) {
        feedback.show(
          'error',
          '<code>while len(selected) &lt;= 3</code> 은 길이가 3일 때도 True이므로 ' +
            '<strong>한 번 더 반복</strong>할 수 있어요.'
        );
        return;
      }

      var appendRow = null;
      var ifIndex = -1;
      got.forEach(function (row, i) {
        if (row.card === 'a') appendRow = { row: row, index: i };
        if (row.card === 'i') ifIndex = i;
      });
      if (appendRow && ifIndex !== -1 && appendRow.index > ifIndex && appendRow.row.indent <= got[ifIndex].indent) {
        feedback.show(
          'error',
          '<code>append()</code>가 <code>if</code> 밖에 있어요. 중복인지 확인했더라도 append가 항상 실행되어 ' +
            '<strong>중복 값이 리스트에 들어갈 수 있어요.</strong>'
        );
        return;
      }

      var ok = SOLUTION.every(function (want, i) {
        return got[i].card === want.card && got[i].indent === want.indent;
      });
      if (ok) {
        feedback.show(
          'success',
          '정확해요! <code>while</code> 안에서 값을 뽑고, <code>if</code>로 중복을 검사한 뒤 ' +
            '새 값일 때만 <code>append()</code> 합니다.'
        );
        st().assembleDone = true;
        L.state.markChanged();
      } else {
        feedback.show(
          'warning',
          '순서 또는 들여쓰기가 아직 맞지 않아요. ' +
            '반복 안에서 일어나는 일은 <strong>4칸</strong>, <code>if</code> 안에서만 일어나는 일은 <strong>8칸</strong> 들여씁니다.'
        );
      }
    }

    var panel = ui.panel({
      title: '코드 조립하기',
      hint: '순서와 들여쓰기를 <strong>모두</strong> 맞혀야 정답이에요. 드래그 없이 골라서 맞춥니다.'
    });
    rows.forEach(function (row) {
      panel.body.appendChild(row);
    });
    panel.body.appendChild(el('p', { 'class': 'meta-count', text: '만들어진 코드 미리보기' }));
    panel.body.appendChild(previewBox);
    panel.body.appendChild(ui.buttonRow([ui.button({ label: '확인하기', onClick: check })]));
    panel.body.appendChild(feedback.root);

    refs.assemble = {
      restore: function () {
        var saved = st().assemble || [];
        saved.forEach(function (row, i) {
          if (!slots[i]) return;
          slots[i].card.setValue(row.card || '');
          slots[i].indent.setValue(String(row.indent === undefined ? 0 : row.indent));
        });
        preview();
      }
    };
    preview();
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  function render(container) {
    container.appendChild(
      ui.stepHeader({
        step: 3,
        title: 'while문으로 중복 없는 반 3개 뽑기',
        lead: [
          '「3번 뽑기」가 아니라 <strong>「서로 다른 3개가 모일 때까지 뽑기」</strong>로 목표를 바꿔 봅시다.',
          '조건을 <code>len(selected) &lt; 3</code> 으로 두면 결과의 «상태»를 기준으로 반복할 수 있어요.'
        ]
      })
    );
    container.appendChild(buildSim());
    container.appendChild(buildAssemble());
  }

  L.registerStep(3, {
    title: L.CONST.STEP_TITLES[3],
    short: L.CONST.STEP_SHORTS[3],
    render: render,
    onEnter: function () {
      if (refs.assemble) refs.assemble.restore();
    },
    onLeave: function () {
      if (player) player.pause();
    }
  });
})();
    </script>
    <script data-from="js/63-step4.js">
/**
 * 화면 4 — break와 continue 몬스터 게임 (명세 9장)
 *
 *  7번  : 함정 → continue → «현재 회차만» 건너뛰고 8번으로
 *  33번 : 보스 → break   → 반복 «전체» 종료, 34~49는 실행되지 않음
 *
 * 단어 뜻을 외우게 하지 않고 «실행 화살표가 어디로 가는지» 를 보게 한다.
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var flow = L.flow;
  var engine = L.engine;

  var CODE = [
    'for monster in range(1, 50):',
    '    if monster == 7:',
    '        print("7번 몬스터는 함정! 피해서 지나갑니다.")',
    '        continue',
    '',
    '    if monster == 33:',
    '        print("33번 보스 몬스터 등장! 도망갑니다.")',
    '        break',
    '',
    '    print(f"{monster}번 몬스터를 처치했습니다!")'
  ];

  var LINE = { forLine: 0, if7: 1, print7: 2, cont: 3, if33: 5, print33: 6, brk: 7, kill: 9 };

  var refs = {};
  var player = null;
  var swapped = false;

  function st() {
    return L.state.appState.step4;
  }

  /* ------------------------------------------------------------------ */
  /* 개념 설명 (몬스터 게임 앞에 먼저 읽는다)                                */
  /* ------------------------------------------------------------------ */

  /** break · continue 카드 한 장 : 코드 → 실행 결과 → 한 줄 설명 */
  function conceptCard(def) {
    return el('div', { 'class': 'cmd-card cmd-card--' + def.kind }, [
      el('p', { 'class': 'cmd-card__title' }, [
        el('code', { text: def.name }),
        el('span', { text: ' — ' + def.headline })
      ]),
      el('p', { 'class': 'cmd-card__desc', text: def.desc }),
      L.codeview.createCodeView({
        lines: def.code.split('\n').map(function (line) {
          return { code: line };
        }),
        showLineNumbers: false,
        ariaLabel: def.name + ' 예제 코드'
      }).root,
      el('div', { 'class': 'expected' }, [
        el('p', { 'class': 'expected__title', text: '실행 결과' }),
        el('pre', { 'class': 'expected__body', text: def.output })
      ]),
      el('p', { 'class': 'cmd-card__note', html: def.note })
    ]);
  }

  function buildIntro() {
    var panel = ui.panel({
      title: '먼저 알아 두기 · <code>break</code> 와 <code>continue</code>',
      hint:
        '두 명령은 <code>if</code>문 자체의 문법이 아니라 <strong>반복문(<code>for</code>, <code>while</code>) 안에서</strong> 쓰며, ' +
        '보통 <code>if</code>문과 함께 사용해 <strong>반복의 흐름을 제어</strong>합니다.'
    });

    panel.body.appendChild(
      el('div', { 'class': 'split' }, [
        conceptCard({
          kind: 'break',
          name: 'break',
          headline: '반복문 즉시 종료',
          desc: '특정 조건을 만족하면 반복문 전체를 즉시 끝낸다.',
          code: 'for i in range(1, 10):\n    if i == 5:\n        break\n    print(i)',
          output: '1 2 3 4',
          note: 'i가 5가 되는 순간 <strong>반복문을 종료</strong>한다.'
        }),
        conceptCard({
          kind: 'continue',
          name: 'continue',
          headline: '현재 반복만 건너뛰기',
          desc: '특정 조건을 만족하면 현재 회차의 나머지 코드를 실행하지 않고 다음 반복으로 넘어간다.',
          code: 'for i in range(1, 6):\n    if i == 3:\n        continue\n    print(i)',
          output: '1 2 4 5',
          note: 'i가 3일 때 <code>print(i)</code>를 실행하지 않고 <strong>다음 반복으로</strong> 넘어간다.'
        })
      ])
    );

    // 두 카드가 이미 같은 내용을 담고 있어 요약표는 두지 않는다(같은 말의 되풀이).
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  /* 시뮬레이션                                                            */
  /* ------------------------------------------------------------------ */
  function buildSim() {
    var code = L.codeview.createCodeView({
      title: '몬스터 사냥 코드',
      lines: CODE.map(function (line) {
        return { code: line };
      })
    });
    var track = flow.monsterTrack({ from: 1, to: 49 });
    var log = ui.createConsole({
      title: '실행 결과',
      emptyText: '[한 마리씩] 또는 [자동 실행]을 눌러 보세요.'
    });
    var flowNote = el('div', { 'class': 'flownote' });
    var counter = el('p', { 'class': 'meta-count' });

    function currentOpts() {
      return swapped
        ? { trapCmd: 'break', bossCmd: 'break' }
        : { trapCmd: 'continue', bossCmd: 'break' };
    }

    function showFlow(title, steps) {
      ui.clear(flowNote);
      flowNote.appendChild(el('p', { 'class': 'flownote__title', text: title }));
      flowNote.appendChild(
        el(
          'ol',
          { 'class': 'flownote__list' },
          steps.map(function (text) {
            return el('li', { html: text });
          })
        )
      );
    }

    function resetView() {
      code.clearStates();
      code.clearBadges();
      track.reset();
      log.clear();
      ui.clear(flowNote);
      counter.textContent = '';
    }

    function showEvent(ev, index, total) {
      track.setHere(ev.monster);
      counter.textContent = 'monster = ' + ev.monster + ' (' + (index + 1) + ' / ' + total + '번째 회차)';
      code.clearStates();
      code.clearBadges();
      code.setState(LINE.forLine, 'running');

      if (ev.kind === 'kill') {
        code.setStates({ 1: 'done', 5: 'done', 9: 'running' });
        code.showBadge(LINE.if7, 'False ✕', 'false');
        code.showBadge(LINE.if33, 'False ✕', 'false');
        track.setState(ev.monster, 'kill');
        log.write(ev.message);
      } else if (ev.kind === 'continue') {
        code.setStates({ 1: 'running', 2: 'done', 3: 'done', 5: 'unchecked', 9: 'skipped' });
        code.showBadge(LINE.if7, 'True ✓', 'true');
        code.showBadge(LINE.kill, '건너뜀 ↷', 'false');
        track.setState(ev.monster, 'continue');
        log.writeHint(ev.message);
        showFlow('7번에서 일어나는 일 — continue', [
          '<code>monster == 7</code> → <strong>True ✓</strong>',
          '함정 메시지 출력',
          '<code>continue</code> 실행',
          '이번 회차의 아래쪽 <code>처치했습니다!</code> 코드는 <strong>건너뜀 ↷</strong>',
          '다음 반복 <code>monster = 8</code> 로 이동 — 반복은 계속됩니다.'
        ]);
        st().sawContinue = true;
        L.state.markChanged();
      } else if (ev.kind === 'break') {
        code.setStates({ 1: 'done', 5: 'running', 6: 'done', 7: 'done', 9: 'unchecked' });
        code.showBadge(LINE.if33, 'True ✓', 'true');
        code.showBadge(LINE.brk, '반복 종료 ■', 'false');
        track.setState(ev.monster, 'break');
        log.writeError(ev.message);
        showFlow(ev.monster + '번에서 일어나는 일 — break', [
          '<code>monster == ' + ev.monster + '</code> → <strong>True ✓</strong>',
          '메시지 출력',
          '<code>break</code> 실행',
          '<code>for</code> 반복 <strong>전체 종료 ■</strong>',
          '다음 번호부터는 <strong>실행되지 않습니다.</strong>'
        ]);
        if (ev.monster === 33) {
          st().sawBreak = true;
          L.state.markChanged();
        }
      }
    }

    function finish(result) {
      result.notRun.forEach(function (n) {
        track.setState(n, 'notrun');
      });
      if (result.notRun.length) {
        log.writeMuted(
          result.notRun[0] +
            '번부터 ' +
            result.notRun[result.notRun.length - 1] +
            '번까지는 실행되지 않았어요 (반복이 이미 끝났기 때문).'
        );
      }
      log.writeMuted('처치한 몬스터 : ' + result.killed.length + '마리');
    }

    function makePlayer() {
      var result = engine.runMonsters(currentOpts());
      var total = result.events.length;
      player = engine.createPlayer({
        frames: result.events,
        interval: ui.animMs(260) || 1,
        onFrame: function (ev, i) {
          showEvent(ev, i, total);
        },
        onEnd: function () {
          finish(result);
        },
        onPlayState: function (playing) {
          refs.btnPause.disabled = !playing;
          refs.btnAuto.disabled = playing;
        }
      });
      return player;
    }

    function ensurePlayer() {
      if (!player) makePlayer();
      return player;
    }

    function restart() {
