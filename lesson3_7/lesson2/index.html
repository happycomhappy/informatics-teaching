    <!-- 스타일은 나열한 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다. -->
    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);

  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.nest-tree__leaf {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
  min-height: 40px;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.nest-tree__leaf .status-badge {
  margin-left: auto;
}

/* 「안쪽 조건은 검사하지 않음」 안내 문구.
   흐려진 영역 안에 넣으면 같이 흐려지므로 반드시 .is-dimmed 바깥에 둔다. */
.nest-tree__note {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  margin-top: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  font-size: var(--fs-small);
  font-weight: 700;
  line-height: 1.6;
}

.nest-tree__note:empty {
  display: none;
}

/* 바깥 조건이 False 일 때 안쪽 영역을 흐리게 (명세 8.3 / 9.5).
   투명도만 낮추면 색으로만 구분하는 셈이므로 회색조까지 함께 적용한다. */
.is-dimmed {
  opacity: 0.5;
  filter: grayscale(1);
}

/* 흐려진 영역 바로 아래에 안내 문구가 들어올 자리를 비워 둔다 */
.nest-tree__inner.is-dimmed {
  margin-bottom: var(--space-1);
}

/* ==================================================================
 * 4. 변수 상태 표시 (L.flow.createVarWatch)
 * ================================================================== */
.var-watch {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.var-watch__item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-muted-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
}

.var-watch__name {
  font-weight: 800;
  color: var(--color-primary-dark);
}

.var-watch__value {
  font-weight: 700;
  color: var(--color-text);
}

/* 아직 값이 정해지지 않은 변수는 빈칸 대신 — 로 보여 준다 */
.var-watch__value:empty::after {
  content: '—';
  color: var(--color-text-sub);
}

/* 방금 값이 바뀐 변수 */
.var-watch__item.is-changed {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

/* ==================================================================
 * 5. 규칙 표 (.data-table 위에 얹어 쓴다)
 * ================================================================== */
.rule-table td:first-child,
.rule-table th:first-child {
  white-space: nowrap;
}

.rule-table td:last-child {
  font-weight: 700;
}

/* 지금 입력값에 해당하는 규칙 줄 */
.rule-table tbody tr.is-active {
  background: var(--color-primary-soft);
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
}

.rule-table tbody tr.is-active td:first-child::before {
  content: '▶ ';
  color: var(--color-primary-dark);
  font-weight: 900;
}

/* ==================================================================
 * 6. 실행 추적표 (명세 7.3) — .table-scroll 안에 넣어 가로 스크롤한다
 * ================================================================== */
.trace-table {
  width: 100%;
  min-width: 560px;
  border-collapse: collapse;
  background: var(--color-surface);
  font-size: var(--fs-small);
}

.trace-table th,
.trace-table td {
  border: 1px solid var(--color-border);
  padding: var(--space-2);
  text-align: center;
  vertical-align: middle;
}

.trace-table thead th {
  background: var(--color-muted-bg);
  font-family: var(--font-mono);
  font-weight: 700;
  white-space: nowrap;
}

.trace-table tbody th {
  background: var(--color-muted-bg);
  font-family: var(--font-mono);
  font-weight: 800;
}

/* 선택 상자가 들어가는 칸은 여백을 줄여 표가 지나치게 커지지 않게 한다 */
.trace-table td.trace-cell {
  padding: var(--space-1);
}

.trace-cell__select {
  width: 100%;
  min-width: 120px;
  min-height: var(--touch-min);
  padding: 0 var(--space-2);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.trace-cell__select:hover {
  border-color: var(--color-primary);
}

/* 셀 단위 즉시 피드백 — 배경색과 함께 ✓ / ✕ 를 붙여 준다 */
.trace-cell.is-correct {
  background: var(--color-true-soft);
}

.trace-cell.is-correct .trace-cell__select {
  border-color: var(--color-true);
  color: var(--color-true-dark);
}

.trace-cell.is-wrong {
  background: var(--color-error-soft);
}

.trace-cell.is-wrong .trace-cell__select {
  border-style: dashed;
  border-color: var(--color-error);
  color: var(--color-error);
}

.trace-cell__mark {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  font-weight: 800;
}

.trace-cell.is-correct .trace-cell__mark {
  color: var(--color-true-dark);
}

.trace-cell.is-wrong .trace-cell__mark {
  color: var(--color-error);
}

/* ==================================================================
 * 7. 순서 바꾸기 카드 (명세 7.2)
 *    ▲▼ 버튼만으로도 조작할 수 있어야 한다(모바일 필수).
 * ================================================================== */
.sortable {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.sortable__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  transition: border-color var(--dur-highlight) ease, opacity var(--dur-highlight) ease;
}

.sortable__item.is-dragging {
  opacity: 0.6;
  border-style: dashed;
  border-color: var(--color-primary);
}

.sortable__item.is-over {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.sortable__handle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  min-height: var(--touch-min);
  color: var(--color-text-sub);
  font-size: 18px;
  cursor: grab;
  user-select: none;
}

.sortable__item.is-dragging .sortable__handle {
  cursor: grabbing;
}

.sortable__body {
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
}

.sortable__moves {
  flex: 0 0 auto;
  display: flex;
  gap: var(--space-1);
}

.sortable__moves .btn {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

/* ==================================================================
 * 8. 카드 분류 활동 (명세 8.1)
 *    데스크톱 2열 · 모바일 1열
 * ================================================================== */
.dropzones {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3);
  align-items: start;
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 168px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-muted-bg);
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.dropzone.is-over {
  border-style: solid;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.dropzone__title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 15px;
  font-weight: 800;
}

.dropzone__body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.dropzone__body:empty::after {
  content: '여기에 카드를 놓아 보세요.';
  display: block;
  padding: var(--space-4) 0;
  text-align: center;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.card-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  text-align: left;
  font-size: var(--fs-small);
  line-height: 1.6;
  cursor: grab;
}

.card-item:hover {
  border-color: var(--color-primary);
}

.card-item.is-dragging {
  opacity: 0.6;
  border-style: dashed;
  border-color: var(--color-primary);
  cursor: grabbing;
}

.card-item__tag {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: var(--color-primary);
  color: var(--color-surface);
  font-size: 13px;
  font-weight: 800;
}

.card-item__text {
  flex: 1 1 auto;
  min-width: 0;
}

/* 채점 결과 — 테두리 모양까지 달라진다 */
.card-item.is-correct,
.dropzone.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.card-item.is-wrong,
.dropzone.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

@media (max-width: 767px) {
  .dropzones {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ==================================================================
 * 9. 코드 빈칸 (명세 9.6 / 9.7)
 *    코드 줄 안에 들어가는 작은 입력칸이라 줄 높이를 크게 흔들지 않는다.
 * ================================================================== */
.blank {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: var(--touch-min);
  min-height: 38px;
  margin: 0 2px;
  padding: 0 var(--space-2);
  border: 2px dashed var(--color-primary);
  border-radius: var(--radius-sm);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  vertical-align: middle;
  cursor: pointer;
}

/* 손가락으로 누르는 기기에서는 터치 영역을 44px 로 넓힌다 */
@media (pointer: coarse) {
  .blank {
    min-height: var(--touch-min);
  }
}

.blank:hover {
  background: var(--color-surface);
}

.blank:focus-within {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.blank__num {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 50%;
  background: var(--color-primary);
  color: var(--color-surface);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 800;
}

.blank__input {
  flex: 1 1 auto;
  min-width: 72px;
  max-width: 100%;
  min-height: 30px;
  padding: 0 2px;
  border: none;
  background: transparent;
  color: inherit;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
}

.blank__input:focus {
  outline: none;
}

/* 토큰을 골라 넣는 모드에서는 입력칸 대신 고른 토큰 글자를 그대로 보여 준다 */
.blank__value {
  flex: 1 1 auto;
  min-width: 34px;
  text-align: center;
}

.blank__value:empty::after {
  content: '?';
  color: var(--color-text-sub);
}

/* 값이 채워진 빈칸 — 파선을 실선으로 바꿔 「채웠다」를 알린다 */
.blank--filled {
  border-style: solid;
  border-color: var(--color-primary);
  background: var(--color-surface);
  color: var(--color-text);
}

.blank--correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.blank--correct .blank__num {
  background: var(--color-true);
}

.blank--wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
  color: var(--color-error);
}

.blank--wrong .blank__num {
  background: var(--color-error);
}

/* ==================================================================
 * 10. 선택형 토큰 팔레트 (명세 9.7 모드 A)
 * ================================================================== */
.token-tray {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.token-tray__title {
  flex: 1 1 100%;
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text-sub);
}

.token-tray__list {
  flex: 1 1 100%;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.token {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--touch-min);
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
  color: var(--color-primary-dark);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  cursor: grab;
  transition: background-color var(--dur-highlight) ease, opacity var(--dur-highlight) ease;
}

.token:hover:not(.is-used) {
  background: var(--color-primary-soft);
}

.token.is-selected {
  background: var(--color-primary);
  color: var(--color-surface);
}

.token.is-dragging {
  opacity: 0.6;
  cursor: grabbing;
}

/* 이미 빈칸에 넣은 토큰 — 흐리게 + 점선으로 「사용함」을 표시 */
.token.is-used {
  border-style: dotted;
  border-color: var(--color-border-strong);
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  opacity: 0.45;
  cursor: not-allowed;
}

/* ==================================================================
 * 11. 자동 테스트 결과 (명세 9.9)
 * ================================================================== */
.testlist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.testlist__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
  min-height: 40px;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  font-size: var(--fs-small);
}

.testlist__mark {
  flex: 0 0 auto;
  width: 1.4em;
  text-align: center;
  font-size: 15px;
  font-weight: 900;
  color: var(--color-text-sub);
}

.testlist__label {
  flex: 1 1 auto;
  min-width: 0;
}

.testlist__expect {
  flex: 1 1 100%;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--color-text-sub);
  word-break: break-all;
}

.testlist__item.is-pass {
  border-color: var(--color-true);
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}

.testlist__item.is-pass .testlist__mark {
  color: var(--color-true-dark);
}

.testlist__item.is-fail {
  border-style: dashed;
  border-color: var(--color-error);
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.testlist__item.is-fail .testlist__mark {
  color: var(--color-error);
}

/* ==================================================================
 * 12. 형성평가 (명세 10장)
 * ================================================================== */
.quiz {
  max-width: 820px;
}

.quiz__nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.quiz__dots {
  display: flex;
  gap: var(--space-2);
}

.quiz__dot {
  position: relative;
  width: 12px;
  height: 12px;
  padding: 0;
  border: 2px solid var(--color-border-strong);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

/* 점 자체는 작게 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.quiz__dot::after {
  content: '';
  position: absolute;
  inset: -16px;
  border-radius: 50%;
}

.quiz__dot.is-answered {
  background: var(--color-primary);
  border-color: var(--color-primary);
}

.quiz__dot.is-current {
  transform: scale(1.35);
  border-color: var(--color-primary);
}

.quiz__item {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.quiz__stem {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.6;
}

.quiz__choices {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.quiz__result {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.quiz__score {
  padding: var(--space-5) var(--space-4);
  border: 2px solid var(--color-primary);
  border-radius: var(--radius-lg);
  background: var(--color-primary-soft);
  text-align: center;
}

.quiz__score-value {
  font-size: 46px;
  font-weight: 900;
  line-height: 1.1;
  color: var(--color-primary-dark);
}

.quiz__score-value small {
  font-size: 20px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.quiz__score-judge {
  margin-top: var(--space-2);
  font-size: 16px;
  font-weight: 800;
}

.quiz__review {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

/* ==================================================================
 * 13. 배지 · 보충 학습 · 선수 학습 · 비교 · 자신감 · 요약
 * ================================================================== */

/* 🏅 배지 카드 (명세 9.11) */
.award {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4);
  border: 2px solid var(--color-true);
  border-radius: var(--radius-lg);
  background: var(--color-true-soft);
  box-shadow: var(--shadow-sm);
}

.award__icon {
  flex: 0 0 auto;
  font-size: 40px;
  line-height: 1;
}

.award__body {
  flex: 1 1 auto;
  min-width: 0;
}

.award__title {
  font-size: 18px;
  font-weight: 900;
  color: var(--color-true-dark);
}

.award__text {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
  line-height: 1.6;
}

/* 보충 학습 바로가기 줄 (명세 10.3) */
.linkline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

.linkline__label {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text-sub);
}

.linkline a,
.linkline .linkline__link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
  color: var(--color-primary-dark);
  font-size: var(--fs-small);
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;

/**
 * 코어 — 전역 네임스페이스 · 단계 등록 · 단계 이동 중개 (명세 4장)
 *
 * 이번 차시의 모든 JS 는 ES 모듈이 아니라 "고전 스크립트"다.
 * import / export 를 쓰지 않고, 각 파일이 즉시실행 함수로 자신을 감싼 뒤
