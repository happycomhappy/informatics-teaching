    { code: "    mileage = '3만 마일리지'" },
    { code: 'elif 10 > reduce >= 5:' },
    { code: "    mileage = '1만 마일리지'" }
  ];
  var CARD_SLIM_LINES = [
    { code: 'if reduce >= 10:' },
    { code: "    mileage = '3만 마일리지'" },
    { code: 'elif reduce >= 5:' },
    { code: "    mileage = '1만 마일리지'" }
  ];

  /* --- 명세 6.8 생각해 보기 ------------------------------------------ */
  var THINK_QUESTION =
    '<code>reduce = 7</code>일 때 <code>elif reduce &gt;= 5</code>만 작성해도 ' +
    '5% 이상 10% 미만으로 판단되는 이유는 무엇일까?';

  /** 명세 6.8 성공 문구 (원문 그대로) */
  var THINK_OK = '✓ 첫 번째 조건의 결과까지 고려하여 elif의 범위를 잘 설명했습니다.';

  /** 명세 6.8 보조 문구 (원문 그대로) */
  var THINK_MORE =
    '조건을 위에서부터 확인한다는 점을 생각해 보세요.<br />' +
    '문장 시작: “첫 번째 조건 <code>reduce &gt;= 10</code>이 False이므로 …”';

  /**
   * 핵심어 묶음. 두 묶음 이상이 문장에 들어 있으면 핵심 개념을 담았다고 본다.
   * (띄어쓰기를 지운 뒤 비교하므로 키워드도 붙여 쓴다)
   */
  var KEY_GROUPS = [
    { id: 'order', keys: ['위에서아래', '위에서부터', '위부터', '순서대로', '차례대로', '차례로', '먼저검사', '먼저확인'] },
    { id: 'first', keys: ['첫번째조건', '첫조건', '앞의조건', '앞조건', '위의조건', 'reduce>=10', '첫번째if'] },
    { id: 'false', keys: ['false', '거짓'] },
    { id: 'under', keys: ['10미만', '10보다작', '10이상이아니', '10이상이아님'] }
  ];

  /* ------------------------------------------------------------------ */
  /* 조사 붙이기 (숫자 뒤 을/를 · 로/으로 가 어색해지지 않도록)             */
  /* ------------------------------------------------------------------ */
  // 끝자리 숫자를 한국어로 읽었을 때의 받침. 'ㄹ' 은 '로' 를 쓰는 특별한 받침이다.
  var LAST_DIGIT_FINAL = [true, 'ㄹ', false, true, false, false, true, 'ㄹ', 'ㄹ', false];

  function finalOf(number) {
    return LAST_DIGIT_FINAL[Math.abs(Math.trunc(Number(number) || 0)) % 10];
  }

  /** 12 → '12를' · 3 → '3을' */
  function withEul(number) {
    return String(number) + (finalOf(number) === false ? '를' : '을');
  }

  /** 12 → '12로' · 3 → '3으로' */
  function withRo(number) {
    var final = finalOf(number);
    return String(number) + (final === false || final === 'ㄹ' ? '로' : '으로');
  }

  /* ------------------------------------------------------------------ */
  /* 화면 요소 · 실행 상태                                                */
  /* ------------------------------------------------------------------ */
  var refs = {
    codeView: null,
    input: null,
    examples: null,
    inputFeedback: null,
    btnStep: null,
    btnAll: null,
    btnReset: null,
    stepFeedback: null,
    condList: null,
    varWatch: null,
    console: null,
    ruleRows: [],
    noteItems: [],
    branchItems: [],
    branchHint: null,
    think: null,
    thinkFeedback: null
  };

  /** 저장하지 않는 화면 전용 실행 상태 */
  var runState = { run: null, pos: 0, running: false, token: 0 };

  /** 가장 최근 입력 검증 결과 */
  var lastValid = { ok: false, value: null, message: '' };

  /* ------------------------------------------------------------------ */
  /* 코드뷰 칠하기                                                        */
  /* ------------------------------------------------------------------ */

  /** 실행하지 않은 블록 줄이 '검사하지 않음(—)' 인지 '지나감(↓)' 인지 가른다. */
  function bodySkipState(line) {
    var trace = runState.run ? runState.run.trace : [];
    var owner = null;
    trace.forEach(function (step) {
      // 블록 줄 바로 위가 그 블록을 지배하는 조건 줄이다.
      if (step.kind === 'cond' && step.line === line - 1) owner = step;
    });
    // 조건이 False 여서 건너뛴 줄은 '지나감', 아예 검사하지 않은 조건의 줄은 '검사하지 않음'
    return owner && owner.status === 'false' ? 'skipped' : 'unchecked';
  }

  /** 트레이스 한 걸음이 코드뷰에서 가져야 할 최종 상태 */
  function lineStateOf(step) {
    if (step.kind === 'skip') return bodySkipState(step.line);
    if (step.status === 'unchecked') return 'unchecked'; // 명세 11.3 : 흐리게 + — 마커
    return 'done';
  }

  /** 조건 줄에 붙일 결과 배지 (아이콘 + 텍스트를 함께 쓴다) */
  function badgeOf(step) {
    if (step.kind !== 'cond') return null;
    var text = flow.STATUS_TEXT[step.status];
    if (!text) return null;
    return { text: text, kind: BADGE_KIND[step.status] || 'primary' };
  }

  /* --- '지금 보고 있는 줄' 표시 -------------------------------------- */
  /* 실행 중(▶)과는 다른 표시다. 검사하지 않고 지나가는 줄에도 붙일 수 있어야 하므로
     마커를 바꾸지 않고 aria-current 와 is-cursor 클래스만 더한다. */

  function clearCursor() {
    var count = refs.codeView.count();
    for (var i = 0; i < count; i += 1) {
      var row = refs.codeView.lineEl(i);
      if (!row) continue;
      row.classList.remove('is-cursor');
      row.removeAttribute('aria-current');
      row.style.outline = '';
      row.style.outlineOffset = '';
    }
    refs.noteItems.forEach(function (item) {
      item.classList.remove('is-cursor');
      item.removeAttribute('aria-current');
    });
  }

  function markCursor(line) {
    var row = refs.codeView.lineEl(line);
    if (row) {
      row.classList.add('is-cursor');
      row.setAttribute('aria-current', 'step');
      // step2.css 가 아직 연결되지 않아도 위치가 보이도록 테두리는 직접 넣는다.
      row.style.outline = '2px solid var(--color-primary)';
      row.style.outlineOffset = '-2px';
    }
    var note = refs.noteItems[line];
    if (note) {
      note.classList.add('is-cursor');
      note.setAttribute('aria-current', 'step');
    }
  }

  /**
   * 지금까지 진행한 걸음만큼 코드뷰를 다시 칠한다.
   * cursorRunning 이 true 면 마지막 걸음이 '지금 보고 있는 줄' 이 된다.
   *
   * 주의 : '실행 중(▶)' 은 실제로 실행·검사하는 줄에만 붙인다.
   * 검사하지 않는 줄(—)이나 건너뛰는 줄(↓)에 ▶ 를 붙이면
   * 명세 14.4(False 와 검사 안 함을 명확히 구분)에 어긋난다.
   */
  function paintCode(cursorRunning) {
    refs.codeView.clearStates();
    clearCursor();
    if (!runState.run) return;
    var trace = runState.run.trace;
    for (var i = 0; i < runState.pos && i < trace.length; i += 1) {
      var step = trace[i];
      var state = lineStateOf(step);
      var isCursor = cursorRunning && i === runState.pos - 1;
      refs.codeView.setState(step.line, isCursor && state === 'done' ? 'running' : state);
      if (isCursor) markCursor(step.line);
      var mark = badgeOf(step);
      if (mark) refs.codeView.showBadge(step.line, mark.text, mark.kind);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 한 걸음 반영                                                         */
  /* ------------------------------------------------------------------ */
  function applyTraceStep(step) {
    refs.varWatch.setAll(step.vars);
    if (step.condId) {
      refs.condList.setStatus(step.condId, step.status);
      refs.condList.setHint(step.condId, COND_HINT[step.status] || '');
    }
    if (step.output) refs.console.write(step.output);
  }

  /** 조건 목록을 실행 결과 한 벌로 한 번에 맞춘다(복원·실행 완료용). */
  function applyConditions(result) {
    refs.condList.applyConditions(result.conditions);
    result.conditions.forEach(function (cond) {
      refs.condList.setHint(cond.id, COND_HINT[cond.status] || '');
    });
  }

  function stepHtml(step) {
    return (
      '<strong>' + (step.line + 1) + '줄</strong> · ' + ui.escapeHtml(step.desc || '')
    );
  }

  function doneHtml(result) {
    return (
      '탄소 절감률 <strong>' + result.input + '%</strong> → ' +
      '<strong>' + ui.escapeHtml(result.mileage) + '</strong><br />' +
      '출력 : <code>' + ui.escapeHtml(result.output) + '</code><br />' +
      '다시 보려면 <strong>[한 단계 실행]</strong> 이나 <strong>[전체 실행]</strong> 을 누르세요. ' +
      '다른 값을 넣어 볼 수도 있어요.'
    );
  }

  /** 전체 실행 중에는 걸음마다 낭독하지 않도록 잠시 꺼 둔다(명세 11.4). */
  function setStepFeedbackLive(mode) {
    refs.stepFeedback.root.setAttribute('aria-live', mode);
  }

  /* ------------------------------------------------------------------ */
  /* 실행 (명세 6.5)                                                      */
  /* ------------------------------------------------------------------ */

  /** 입력값을 확인해 실행 결과를 준비한다. 실패하면 오류 문구를 그대로 보여 준다. */
  function ensureRun() {
    if (runState.run) return true;
    var res = engine.validateReduce(refs.input.getValue());
    lastValid = res;
    if (!res.ok) {
      showInputError(res.message);
      updateButtons();
      return false;
    }
    clearInputError();
    runState.run = engine.runEco(res.value);
    runState.pos = 0;
    return true;
  }

  /** 실행 상태만 처음으로 되돌린다(입력값은 그대로 둔다). */
  function resetRun(keepFeedback) {
    runState.token += 1; // 진행 중인 전체 실행을 조용히 멈춘다
    runState.running = false;
    runState.run = null;
    runState.pos = 0;
    setStepFeedbackLive('polite');
    refs.codeView.clearStates();
    clearCursor();
    refs.condList.reset();
    refs.varWatch.reset();
    refs.console.clear();
    if (!keepFeedback) refs.stepFeedback.clear();
    updateButtons();
  }

  /** 실행이 끝났을 때의 마무리 : 상태 저장 + 분기 기록 */
  function finishRun(mode) {
    var result = runState.run;
    var st = L.state.appState.step2;
    if (mode === 'full') st.ranFull = true;
    else st.ranStep = true;

    var branch = BRANCH_OF_MILEAGE[result.mileage];
    if (branch) st.seenBranch[branch] = true;
    L.state.markChanged();

    setStepFeedbackLive('polite');
    paintCode(false);
    applyConditions(result);
    refs.varWatch.setAll(result.vars);
    updateBranchList();
    refs.stepFeedback.show('success', doneHtml(result), '🎉');
    updateButtons();
  }

  /** 6.5 [한 단계 실행] : 트레이스를 한 걸음씩 진행한다. */
  function stepOnce() {
    if (runState.running) return;
    // 끝까지 본 뒤에 다시 누르면 처음부터 한 줄씩 되짚는다.
    // (버튼을 비활성으로 두면 키보드 초점이 닿지 않아 안내를 읽을 수 없다)
    if (runState.run && runState.pos >= runState.run.trace.length) resetRun(true);
    if (!ensureRun()) return;
    var trace = runState.run.trace;

    var step = trace[runState.pos];
    runState.pos += 1;

    L.state.appState.step2.ranStep = true;
    applyTraceStep(step);
    paintCode(true);
    refs.codeView.scrollToLine(step.line);
    refs.stepFeedback.show('info', stepHtml(step));

    if (runState.pos >= trace.length) {
      finishRun('step');
    } else {
      L.state.markChanged();
      updateButtons();
    }
  }

  /** 6.5 [전체 실행] : 처음부터 끝까지 한 줄씩 자동으로 진행한다. */
  function runAll() {
    // 진행 중에 다시 눌러도 막지 않는다. resetRun 이 이전 진행을 취소하고 처음부터 다시 시작한다.
    resetRun(true);
    if (!ensureRun()) return;

    var trace = runState.run.trace;
    var token = (runState.token += 1);
    var index = 0;
    runState.running = true;
    setStepFeedbackLive('off'); // 걸음마다 낭독을 끊지 않도록
    updateButtons();

    function next() {
      if (token !== runState.token) return; // 다시 시작·입력 변경으로 취소됨
      if (index >= trace.length) {
        runState.running = false;
        finishRun('full');
        return;
      }
      var step = trace[index];
      index += 1;
      runState.pos = index;
      applyTraceStep(step);
      paintCode(true);
      refs.codeView.scrollToLine(step.line);
      refs.stepFeedback.show('info', stepHtml(step));
      setTimeout(next, ui.animMs(FULL_STEP_MS));
    }

    next();
  }

  /* ------------------------------------------------------------------ */
  /* 입력 (명세 6.4)                                                      */
  /* ------------------------------------------------------------------ */
  function showInputError(message) {
    refs.inputFeedback.show('error', ui.escapeHtml(message));
  }

  function clearInputError() {
    refs.inputFeedback.clear();
  }

  /**
   * 빠른 예시 칩의 선택 표시.
   * 공용 chipRow 는 색으로만 표시하므로, 화면낭독기도 알 수 있게 aria-pressed 를 함께 켠다.
   */
  function setExampleActive(value) {
    refs.examples.setActive(value);
    ui.$$('.chip', refs.examples.root).forEach(function (chip) {
      chip.setAttribute('aria-pressed', chip.classList.contains('is-active') ? 'true' : 'false');
    });
  }

  /** 규칙 표에서 지금 입력값에 해당하는 줄을 표시한다. */
  function updateRuleTable(value) {
    var mileage = value === null || value === undefined ? null : engine.ecoRule(value);
    refs.ruleRows.forEach(function (entry) {
      var on = mileage !== null && entry.mileage === mileage;
      entry.row.classList.toggle('is-active', on);
      if (on) entry.row.setAttribute('aria-current', 'true');
      else entry.row.removeAttribute('aria-current');
      // 색·화살표만으로 구분하지 않도록 화면낭독기용 문구도 함께 넣는다.
      entry.note.textContent = on ? '지금 입력한 값이 해당하는 규칙입니다.' : '';
    });
  }

  /** 입력이 바뀌었을 때 : 저장 · 검증 · 실행 상태 초기화 */
  function onInputChanged(showEmptyError) {
    var raw = refs.input.getValue();
    var st = L.state.appState.step2;
    var res = engine.validateReduce(raw);

    lastValid = res;
    st.lastInput = raw;
    if (res.ok) st.reduce = res.value;
    L.state.markChanged();

    resetRun(false); // 값이 달라졌으니 이전 실행 결과는 지운다
    setExampleActive(res.ok ? res.value : null);
    updateRuleTable(res.ok ? res.value : null);

    if (res.ok) clearInputError();
    else if (!String(raw).trim() && !showEmptyError) clearInputError();
    else showInputError(res.message); // 명세 6.4 오류 문구를 그대로 노출

    updateButtons();
  }

  function updateButtons() {
    var valid = Boolean(lastValid && lastValid.ok);
    var finished = Boolean(runState.run && runState.pos >= runState.run.trace.length);

    // [다시 시작] 은 언제나 누를 수 있어야 한다(명세 6.5).
    // 자동 진행 중에 멈추는 유일한 방법이기 때문이다.
    refs.btnStep.disabled = runState.running || !valid;
    refs.btnAll.disabled = !valid;
    refs.btnReset.disabled = false;

    refs.btnStep.title = !valid
      ? '먼저 탄소 절감률을 올바르게 입력해 주세요.'
      : finished
        ? '처음부터 한 줄씩 다시 봅니다.'
        : '';
    refs.btnAll.title = valid
      ? runState.running
        ? '처음부터 다시 자동으로 실행합니다.'
        : ''
      : '먼저 탄소 절감률을 올바르게 입력해 주세요.';
  }

  /* ------------------------------------------------------------------ */
  /* 세 가지 분기 확인 현황                                                */
  /* ------------------------------------------------------------------ */
  function updateBranchList() {
    var st = L.state.appState.step2;
    var seen = st.seenBranch || {};
    var left = [];

    refs.branchItems.forEach(function (item) {
      var on = Boolean(seen[item.key]);
      item.root.classList.toggle('is-pass', on);
      item.mark.textContent = on ? '✓' : '·';
      ui.clear(item.badgeHolder);
      item.badgeHolder.appendChild(
        on ? ui.badge('true', '확인함 ✓') : ui.badge('primary', '아직 확인 전')
      );
      if (!on) left.push(item.key);
    });

    var messages = [];
    if (left.length) {
      var first = left[0];
      var example = RULES.filter(function (rule) {
        return rule.key === first;
      })[0].example;
      messages.push(BRANCH_TODO[first] + ' ' + withEul(example) + ' 입력하고 실행해 보세요.');
    }
    if (!st.ranFull) messages.push('[전체 실행]도 한 번 이상 눌러야 다음 단계로 갈 수 있어요.');
    if (!messages.length) {
      messages.push('세 가지 경우를 모두 확인했어요! 아래 생각해 보기까지 적으면 다음 단계로 갈 수 있어요.');
    }
    refs.branchHint.textContent = messages.join(' ');
  }

  /* ------------------------------------------------------------------ */
  /* 생각해 보기 (명세 6.8)                                               */
  /* ------------------------------------------------------------------ */
  function judgeThink(text) {
    var normalized = String(text || '').toLowerCase().replace(/\s+/g, '');
    if (normalized.length < 6) return false;
    var hits = 0;
    KEY_GROUPS.forEach(function (group) {
      var found = group.keys.some(function (key) {
        return normalized.indexOf(key) !== -1;
      });
      if (found) hits += 1;
    });
    return hits >= 2;
  }

  /** 저장된 값만 보고 화면을 그린다(판정하지 않는다). */
  function renderThink() {
    var st = L.state.appState.step2;
    var text = String(st.thinkText || '');
    if (!text.trim()) {
      refs.thinkFeedback.clear();
      return;
    }
    if (st.thinkOk) refs.thinkFeedback.show('success', THINK_OK);
    else refs.thinkFeedback.show('info', THINK_MORE);
  }

  /** 지금 적힌 문장을 판정하고 저장한다. */
  function judgeAndSave() {
    var st = L.state.appState.step2;
    st.thinkText = refs.think.getValue();
    st.thinkOk = judgeThink(st.thinkText);
    L.state.markChanged();
    renderThink();
  }

  var judgeLater = ui.debounce(judgeAndSave, 700);

  /* ------------------------------------------------------------------ */
  /* 저장된 상태 되살리기                                                  */
  /* ------------------------------------------------------------------ */
  function syncFromState() {
    // 화면을 아직 만들지 않았다면(render 실패 등) 조용히 넘어간다.
    if (!refs.input) return;
    var st = L.state.appState.step2;

    runState.token += 1;
    runState.running = false;
    runState.run = null;
    runState.pos = 0;

    refs.input.setValue(st.lastInput === null || st.lastInput === undefined ? '' : st.lastInput);
    var res = engine.validateReduce(refs.input.getValue());
    lastValid = res;
    setExampleActive(res.ok ? res.value : null);
    updateRuleTable(res.ok ? res.value : null);
    if (res.ok || !String(st.lastInput || '').trim()) clearInputError();
    else showInputError(res.message);

    setStepFeedbackLive('polite');
    refs.codeView.clearStates();
    clearCursor();
    refs.condList.reset();
    refs.varWatch.reset();
    refs.console.clear();
    refs.stepFeedback.clear();

    // 새로고침·되돌아오기 복원 : 마지막으로 실행했던 결과를 그대로 다시 보여 준다.

  /* 조립 도우미                                                          */

  /** 명세 6.1 규칙 표 (.data-table + .rule-table) */
  function buildRuleTable() {
    refs.ruleRows = [];

    RULES.forEach(function (rule) {

        el('td', {}, [el('span', { text: rule.range }), note]),
        el('td', { text: rule.mileage })
      ]);
      body.appendChild(row);
      refs.ruleRows.push({ row: row, note: note, mileage: rule.mileage });
    });

    var table = el('table', { 'class': 'data-table rule-table' }, [
      el('caption', { 'class': 'sr-only', text: '탄소 절감률에 따른 에코 마일리지 규칙' }),

    ]);

        text: '·',

        badgeHolder,
        el('span', { 'class': 'testlist__expect', text: '예시 값 ' + withRo(rule.example) + ' 실행' })
      ]);
      list.appendChild(root);
      refs.branchItems.push({ key: rule.key, root: root, mark: mark, badgeHolder: badgeHolder });
    });
    return list;
  }

    thinkPanel.body.appendChild(refs.think.root);
    thinkPanel.body.appendChild(
      ui.buttonRow([
        ui.button({
          label: '문장 확인',
          variant: 'secondary',
          ariaLabel: '적은 문장에 핵심 개념이 들어 있는지 확인',

    thinkPanel.body.appendChild(refs.thinkFeedback.root);
    thinkPanel.body.appendChild(
      ui.callout(
        '핵심어 예 : <code>첫 번째 조건</code> · <code>False</code> · <code>10 미만</code> · ' +
          '<code>위에서 아래</code> · <code>순서대로 검사</code>',
        { muted: true }
      )
    );

    root.appendChild(header);
    root.appendChild(
      el('div', { 'class': 'stack stack--lg' }, [
        rulePanel.root,
        mainPanel.root,
        branchPanel.root,
        cardPanel.root,
        thinkPanel.root
      ])
    );

    // 저장된 학습 기록을 화면에 되살린다.
    syncFromState();
  }

  L.registerStep(2, {
    title: L.CONST.STEP_TITLES[2],
    short: L.CONST.STEP_SHORTS[2],
    render: render,
    onEnter: syncFromState,
    onLeave: function () {
      // 화면을 떠나면 진행 중인 전체 실행을 멈춘다.
      runState.token += 1;
      runState.running = false;
    }
  });
})();

    <script data-from="js/62-step3.js">
/**
 * 화면 3 — 조건 순서와 실행 흐름 추적 (명세 7장)
 *  - 7.1 조건 순서 오류 탐구 : score = 95 일 때의 출력을 먼저 예측한 뒤 실행해서 확인한다
 *  - 7.2 조건 카드 재배치   : 드래그 앤 드롭 · ▲ 위로 · ▼ 아래로 (버튼만으로도 완결된다)

 *

 *  - 7.2 : L.engine.runRightOrder(95)

(function () {

  var ui = L.ui;
  var el = ui.el;

  /* ------------------------------------------------------------------ */
  /* 7.1 자료                                                            */
  /* ------------------------------------------------------------------ */

  /** 명세 7.1 : 예측에 쓰는 점수 */
  var PREDICT_SCORE = 95;

  /** 명세 7.1 : 정답은 "C 이상" */
  var PREDICT_ANSWER = 'C';

  /** step3.predicted 에 저장하는 값과 화면에 보이는 글자 */
  var PREDICT_TEXT = {
    A: 'A',
    C: 'C 이상',
    none: '아무것도 출력되지 않는다',
    both: '둘 다 출력된다'
  };

  /**
   * 보기 목록.
   * label 은 화면에 보이는 HTML 이라서 그대로 읽어 주면 태그까지 읽힌다.
   * 그래서 스크린리더용 문장(ariaLabel)을 따로 적어 준다(명세 11.4).
   */
  var PREDICT_OPTIONS = [
    { value: 'A', label: '<code>A</code>', sub: '"A" 만 출력된다', ariaLabel: 'A 만 출력된다' },
    {

      label: '<code>C 이상</code>',
      sub: '"C 이상" 만 출력된다',
      ariaLabel: 'C 이상 만 출력된다'
    },
    {
      value: 'none',
      label: '아무것도 출력되지 않는다',
      sub: '두 조건이 모두 거짓이다',
      ariaLabel: '아무것도 출력되지 않는다'
    },
    {
      value: 'both',
      label: '둘 다 출력된다',
      sub: '"C 이상" 과 "A" 가 함께 나온다',
      ariaLabel: 'C 이상 과 A 가 둘 다 출력된다'
    }
  ];

  /** 명세 7.1 설명 문구 (원문 그대로) */
  var WHY_HTML =

  var PREDICT_WHY_WRONG = {

    none: '95 는 70 이상이므로 첫 번째 조건 <code>score &gt;= 70</code> 은 True 예요.',
    both: 'if - elif 는 <strong>처음으로 True 가 된 블록 하나만</strong> 실행해요. 두 블록이 함께 실행되지는 않아요.'
  };

  /* ------------------------------------------------------------------ */
  /* 7.2 자료                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 조건 블록 카드 한 장을 L.engine.RIGHT_ORDER_LINES 에서 그대로 떼어 온다.
   * (명세의 원본 코드 문자열을 이 파일에서 다시 쓰지 않기 위해서다 — 기반 계약 0-7)
   *   index   : 조건 줄의 위치. 바로 다음 줄이 그 블록의 print 줄이다.
   *   name    : 스크린리더가 읽어 줄 카드 이름
   */
  function makeOrderCard(index, name) {
    var lines = L.engine.RIGHT_ORDER_LINES;
    var condLine = lines[index]; // 예) 'if score >= 90:'
    var printLine = lines[index + 1]; // 예) '    print("A")'

      out: printLine.replace(/^\s*print\(/, '').replace(/\)\s*$/, ''),

  };

  /** 명세 7.2 올바른 순서 : 범위가 더 좁은 조건(score >= 90)이 위로 온다. */
  var RIGHT_ORDER = ['a', 'b'];

  /** 활동 시작 순서 (일부러 잘못된 순서로 시작한다) */
  var START_ORDER = ['b', 'a'];

  /* ------------------------------------------------------------------ */
  /* 7.3 자료                                                            */
  /* ------------------------------------------------------------------ */

  var TRACE_ROWS = [92, 83, 68];

  var TRACE_COLS = [
    { key: '90', head: 'score >= 90', limit: 90 },
    { key: '80', head: 'score >= 80', limit: 80 },
    { key: '70', head: 'score >= 70', limit: 70 }
  ];

  /**
   * 학생이 직접 고를 빈칸 (명세 7.3 : 최소 6칸 이상 → 모두 8칸)
   *   92 : 검사 안 함 두 칸
   *   83 : False → True 로 넘어가는 과정과 출력
   *   68 : 모두 False 인 경우와 출력
   */
  var TRACE_BLANKS = {
    92: ['80', '70'],
    83: ['90', '80', 'out'],
    68: ['80', '70', 'out']
  };

  /** 조건 칸 선택지 — 아이콘과 글자를 함께 보여 준다(색상만으로 구분하지 않는다). */
  var STATUS_OPTIONS = [
    { value: '', label: '고르기' },
    { value: 'true', label: 'True ✓' },
    { value: 'false', label: 'False ✕' },
    { value: 'unchecked', label: '검사 안 함 —' }
  ];

  var OUTPUT_OPTIONS = [
    { value: '', label: '고르기' },
    { value: 'A', label: 'A' },
    { value: 'B', label: 'B' },
    { value: 'C', label: 'C' },
    { value: 'D', label: 'D' }
  ];

  /* ------------------------------------------------------------------ */
  /* 화면 참조                                                            */
  /* ------------------------------------------------------------------ */
  var refs = {
    // 7.1
    predictGroup: null,
    predictSubmit: null,
    predictRun: null,
    predictFeedback: null,
    predictCode: null,
    predictCond: null,
    predictConsole: null,
    predictResult: null,
    // 7.2
    orderList: null,
    orderFeedback: null,
    orderResult: null,
    orderCond: null,
    orderCode: null,
    orderConsole: null,
    // 7.3
    traceCells: {},
    traceFeedback: null,
    // 공통
    hint: null
  };

  /** 아직 제출하지 않은 예측(라디오만 고른 상태) */
  var pendingPredict = null;

  /** 카드 DOM 조각 { root, body, pos, up, down } */
  var cardRefs = {};

  /** 카드를 한 번이라도 옮겼는지(처음부터 힌트를 띄우지 않기 위해) */
  var orderTouched = false;

  /** 드래그 중인 카드 id */
  var draggingId = null;

  /* ------------------------------------------------------------------ */
  /* 작은 도우미                                                          */
  /* ------------------------------------------------------------------ */

  function step3() {
    return L.state.appState.step3;
  }

  /** 엔진 상태값('true'/'false'/'unchecked'/'executed')을 배지 종류로 바꾼다. */
  function badgeKind(status) {
    if (status === 'true') return 'true';
    if (status === 'false') return 'false';
    return 'primary';
  }

  /**
   * 엔진의 trace 를 코드뷰 줄 상태로 옮긴다.
   *  - True / 실행       → done   (✔)
   *  - False             → skipped(↓)  조건을 검사했지만 거짓이라 그 블록을 건너뛴다
   *  - 검사 안 함        → unchecked(—) 앞에서 실행할 블록이 이미 정해진 뒤의 줄
   */
  function applyTraceToCode(view, result) {
    view.clearStates();
    var decided = false;
    (result.trace || []).forEach(function (step) {
      var state = 'idle';
      if (step.status === 'true' || step.status === 'executed') state = 'done';
      else if (step.status === 'false') state = 'skipped';
      else if (step.status === 'unchecked') state = decided ? 'unchecked' : 'skipped';
      view.setState(step.line, state);
      if (step.kind === 'cond' && step.status) {
        view.showBadge(step.line, L.flow.STATUS_TEXT[step.status] || '', badgeKind(step.status));
      }
      if (step.status === 'true' || step.status === 'executed') decided = true;
    });
  }

  /** 코드 문자열 배열을 코드뷰 lines 형식으로 바꾼다. */
  function toLines(list) {
    return list.map(function (code) {
      return { code: code };
    });
  }

  /* ================================================================== */
  /* 7.1 조건 순서 오류 탐구                                              */
  /* ================================================================== */

  function buildPredict() {
    var panel = ui.panel({
      title: '🔍 활동 1 · 조건 순서가 잘못된 코드',

    });

    refs.predictCode = L.codeview.createCodeView({
      lines: toLines(L.engine.WRONG_ORDER_LINES),

    });

    refs.predictGroup = ui.radioGroup({
      name: 'l2-step3-predict',
      legend: 'score 가 ' + PREDICT_SCORE + ' 일 때 무엇이 출력될까요?',
      options: PREDICT_OPTIONS,

      }

    refs.predictFeedback = ui.createFeedback({

    });

    refs.predictRun = ui.button({

      variant: 'primary',
      disabled: true,

      }
    });

    /* --- 실행 결과 영역 : 예측을 제출하기 전에는 감춰 둔다 --- */
    refs.predictCond = L.flow.createConditionList({
      title: '조건을 위에서 아래로 검사한 결과',
      ariaLabel: '잘못된 순서 코드의 조건 검사 결과',
      items: [
        { id: 'w1', expr: 'score >= 70', label: 'if' },
        { id: 'w2', expr: 'score >= 90', label: 'elif' }
      ]
    });
    refs.predictConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '[실행해서 확인하기] 를 누르면 결과가 나와요.',
      ariaLabel: '잘못된 순서 코드의 실행 결과'
    });
    refs.predictResult = el('div', { 'class': 'stack' }, [
      refs.predictCond.root,
      refs.predictConsole.root
    ]);
    // .stack 에는 display:flex 가 걸려 있어 hidden 속성이 통하지 않는다. 겉을 한 번 감싼다.
    var predictResultWrap = el('div', {}, [refs.predictResult]);
    predictResultWrap.hidden = true;
    refs.predictResultWrap = predictResultWrap;

    panel.body.appendChild(refs.predictCode.root);
    panel.body.appendChild(
      ui.sectionTitle('예측', 'score 가 ' + PREDICT_SCORE + ' 일 때 무엇이 출력될까요?')
    );
    panel.body.appendChild(refs.predictGroup.root);
    panel.body.appendChild(ui.buttonRow([refs.predictSubmit, refs.predictRun]));
    panel.body.appendChild(refs.predictFeedback.root);
    panel.body.appendChild(predictResultWrap);

    return panel.root;
  }

  function submitPredict() {
    if (!pendingPredict) return;
    step3().predicted = pendingPredict;
    L.state.markChanged();

    refs.predictRun.disabled = false;
    refs.predictFeedback.show(
      'info',
      '예측을 저장했어요 → <strong>' +
        ui.escapeHtml(PREDICT_TEXT[pendingPredict]) +
        '</strong><br />이제 [실행해서 확인하기] 를 눌러 실제 결과와 비교해 보세요.'
    );
    ui.announce('예측을 제출했습니다. 실행해서 확인해 보세요.');
    refreshHint();
  }

  /**
   * 실제 실행 결과를 보여 준다.
   * fromClick 이 false 면 저장된 기록을 되살리는 경우다(새로고침 복원).
   */
  function showPredictResult(fromClick) {
    var predicted = step3().predicted;
    if (predicted === null || predicted === undefined) return;

    var result = L.engine.runWrongOrder(PREDICT_SCORE);
    var realOut = ui.escapeHtml(result.output || ''); // 실제 출력도 엔진 결과를 그대로 쓴다
    refs.predictCond.applyConditions(result.conditions);
    refs.predictCond.setHint('w1', PREDICT_SCORE + ' >= 70 이므로 이 블록이 실행됩니다.');
    refs.predictCond.setHint('w2', '앞에서 이미 실행할 블록이 정해져 검사하지 않습니다.');
    applyTraceToCode(refs.predictCode, result);

    refs.predictConsole.clear();
    if (result.output) refs.predictConsole.write(result.output);
    else refs.predictConsole.writeMuted('(출력 없음)');

    refs.predictResultWrap.hidden = false;

    var ok = predicted === PREDICT_ANSWER;
    var html = ok
      ? '<strong>맞았어요!</strong> 실제 출력도 <code>' + realOut + '</code> 입니다.<br />' + WHY_HTML
      : '예측은 <strong>' +
        ui.escapeHtml(PREDICT_TEXT[predicted] || '') +
        '</strong> 였지만 실제 출력은 <code>' + realOut + '</code> 입니다.<br />' +
        (PREDICT_WHY_WRONG[predicted] ? PREDICT_WHY_WRONG[predicted] + '<br />' : '') +
        WHY_HTML;
    refs.predictFeedback.show(ok ? 'success' : 'warning', html);

    refs.predictGroup.setValue(predicted);
    refs.predictGroup.clearMarks();
    refs.predictGroup.mark(PREDICT_ANSWER, 'correct');
    if (!ok) refs.predictGroup.mark(predicted, 'wrong');
    markPredictChoices(predicted);
    // 결과와 설명이 화면에 남으므로 보기는 더 이상 바꾸지 않는다.
    refs.predictGroup.setDisabled(true);
    refs.predictSubmit.disabled = true;

    if (fromClick) {
      ui.announce(
        '실행 결과는 ' + (result.output || '출력 없음') + ' 입니다. ' +
          (ok ? '예측이 맞았습니다.' : '예측과 다릅니다.')
      );
    }
  }

  /**
   * 어느 보기가 실제 출력이고 어느 보기가 내 예측이었는지 <글자>로 붙여 준다.
   * (색이나 테두리만으로 구분하지 않기 위해 배지를 직접 붙인다 — 명세 11.3 · 11.4)
   */
  function markPredictChoices(predicted) {
    ui.$$('.choice', refs.predictGroup.root).forEach(function (wrap) {
      var old = wrap.querySelector('.choice__mark');
      if (old && old.parentNode) old.parentNode.removeChild(old);

      var input = wrap.querySelector('input');
      if (!input) return;
      var isAnswer = input.value === PREDICT_ANSWER;
      var isMine = input.value === predicted;
      if (!isAnswer && !isMine) return;

      var text = isAnswer
        ? isMine
          ? '✓ 실제 출력 · 내 예측'
          : '✓ 실제 출력'
        : '✕ 내 예측';
      var mark = ui.badge(isAnswer ? 'true' : 'false', text);
      mark.classList.add('choice__mark');
      mark.style.alignSelf = 'flex-start';
      mark.style.marginTop = '4px';
      (wrap.querySelector('.choice__body') || wrap).appendChild(mark);
    });
  }

  function clearPredictChoiceMarks() {
    ui.$$('.choice__mark', refs.predictGroup.root).forEach(function (mark) {
      if (mark.parentNode) mark.parentNode.removeChild(mark);
    });
  }

  /** 저장된 예측을 화면에 되살린다. */
  function restorePredict() {
    var predicted = step3().predicted;
    if (predicted === null || predicted === undefined) {
      pendingPredict = null;
      refs.predictGroup.setValue(null);
      refs.predictGroup.clearMarks();
      refs.predictGroup.setDisabled(false);
      clearPredictChoiceMarks();
      refs.predictSubmit.disabled = true;
      refs.predictRun.disabled = true;
      refs.predictFeedback.clear();
      refs.predictConsole.clear();
      refs.predictCond.reset();
      refs.predictCode.clearStates();
      refs.predictResultWrap.hidden = true;
      return;
    }
    pendingPredict = predicted;
    refs.predictRun.disabled = false;
    // 예측을 이미 제출했으므로 확인 결과까지 그대로 되살린다.
    showPredictResult(false);
  }

  /* ================================================================== */
  /* 7.2 조건 카드 재배치                                                 */
  /* ================================================================== */

  /** 저장된 순서를 안전하게 정리한다(값이 깨져 있어도 카드 두 장을 만든다). */
  function normalizeOrder(list) {
    var seen = {};
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function (id) {
      if (ORDER_CARDS[id] && !seen[id]) {
        seen[id] = true;
        out.push(id);
      }
    });
    RIGHT_ORDER.forEach(function (id) {
      if (!seen[id]) out.push(id);
    });
    return out;
  }

  function getOrder() {
    return normalizeOrder(step3().orderCards);
  }

  function isRightOrder(list) {
    return list.length === RIGHT_ORDER.length &&
      list.every(function (id, i) {
        return id === RIGHT_ORDER[i];
      });
  }

  /**
   * 활동을 시작할 때의 순서를 맞춘다.
   * 저장된 기본값이 이미 정답 순서라면(=아직 한 번도 풀지 않았다면) 일부러 뒤집어서 시작한다.
   */
  function ensureStartOrder() {
    var state = step3();
    if (!state.orderFixed && isRightOrder(getOrder())) {
      state.orderCards = START_ORDER.slice();
      L.state.markChanged();
    }
  }

  /** 카드 안에 들어갈 파이썬 코드(위치에 따라 if / elif 가 바뀐다) */
  function cardCodeHtml(id, index) {
    var card = ORDER_CARDS[id];
    var keyword = index === 0 ? 'if' : 'elif';
    var hl = L.codeview.highlightPython;
    // print 줄은 원본(L.engine.RIGHT_ORDER_LINES)의 문자열을 들여쓰기까지 그대로 쓴다.
    return hl(keyword + ' ' + card.cond + ':') + '\n' + hl(card.printLine);
  }

  /** 카드를 읽어 주는 문장(스크린리더용) */
  function cardReadAloud(id, index) {
    var card = ORDER_CARDS[id];
    var keyword = index === 0 ? 'if' : 'elif';
    return (index + 1) + '번째 카드, ' + keyword + ' ' + card.cond + ', ' + card.out + ' 출력';
  }

  function buildOrder() {
    var panel = ui.panel({
      title: '🔀 활동 2 · 조건 카드 재배치',
      hint: '카드를 끌어서 옮기거나 ▲ ▼ 단추로 순서를 바꿔요. 단추만으로도 끝까지 할 수 있어요.'
    });

    refs.orderList = el('div', {
      'class': 'sortable',
      attrs: { role: 'group', 'aria-label': '조건 블록 카드 순서 바꾸기' }
    });

    RIGHT_ORDER.forEach(function (id) {
      cardRefs[id] = buildCard(id);
      refs.orderList.appendChild(cardRefs[id].root);
    });

    refs.orderFeedback = ui.createFeedback({
      emptyText: '먼저 검사할 조건이 위로 오도록 카드를 옮겨 보세요.'
    });

    /* --- 올바른 순서가 되면 보여 줄 확인 영역 --- */
    refs.orderCond = L.flow.createConditionList({
      title: '순서를 고친 뒤 다시 검사한 결과',
      ariaLabel: '올바른 순서 코드의 조건 검사 결과',
      items: [
        { id: 'r1', expr: 'score >= 90', label: 'if' },
        { id: 'r2', expr: 'score >= 70', label: 'elif' }
      ]
    });
    refs.orderCode = L.codeview.createCodeView({
      lines: toLines(L.engine.RIGHT_ORDER_LINES),
      title: '올바른 순서 (score = ' + PREDICT_SCORE + ')',
      ariaLabel: '올바른 순서로 고친 파이썬 코드'
    });
    refs.orderConsole = ui.createConsole({
      title: '실행 결과',
      emptyText: '순서를 올바르게 맞추면 결과가 나와요.',
      ariaLabel: '올바른 순서 코드의 실행 결과'
    });
    var orderResultWrap = el('div', {}, [
      el('div', { 'class': 'stack' }, [
        refs.orderCode.root,
        refs.orderCond.root,
        refs.orderConsole.root
      ])
    ]);
    orderResultWrap.hidden = true;
    refs.orderResult = orderResultWrap;

    panel.body.appendChild(
      ui.callout(
        '아래 두 블록의 <strong>순서만</strong> 바꿀 수 있어요. ' +
          '위에 놓인 카드가 <code>if</code>, 아래 카드가 <code>elif</code> 가 됩니다.',
        { muted: true }
      )
    );
    panel.body.appendChild(refs.orderList);
    panel.body.appendChild(refs.orderFeedback.root);
    panel.body.appendChild(orderResultWrap);

    return panel.root;
  }

  function buildCard(id) {
    var body = el('span', { 'class': 'sortable__body' });
    var pos = el('span', { 'class': 'badge badge--primary' });
    var up = ui.button({
      label: '▲',
      variant: 'secondary',
      ariaLabel: '위로 이동',
      title: '위로 이동',
      onClick: function () {
        moveCard(id, -1);
      }
    });
    var down = ui.button({
      label: '▼',
      variant: 'secondary',
      ariaLabel: '아래로 이동',
      title: '아래로 이동',
      onClick: function () {
        moveCard(id, 1);
      }
    });

    var root = el(
      'div',
      {
        'class': 'sortable__item',
        draggable: true,
        dataset: { id: id },
        attrs: { role: 'group' }
      },
      [
        el('span', { 'class': 'sortable__handle', text: '⠿', attrs: { 'aria-hidden': 'true' } }),
        pos,
        body,
        el('span', { 'class': 'sortable__moves' }, [up, down])
      ]
    );

    /* --- 드래그 앤 드롭 (보조 경로. 주 경로는 ▲▼ 단추다) --- */
    root.addEventListener('dragstart', function (e) {
      draggingId = id;
      root.classList.add('is-dragging');
      try {
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
      } catch (err) {
        /* 일부 브라우저에서 실패해도 ▲▼ 단추로 조작할 수 있다. */
      }
    });
    root.addEventListener('dragend', function () {
      draggingId = null;
      root.classList.remove('is-dragging');
      clearDragMarks();
    });
    root.addEventListener('dragover', function (e) {
      if (!draggingId || draggingId === id) return;
      e.preventDefault();
      root.classList.add('is-over');
    });
    root.addEventListener('dragleave', function () {
      root.classList.remove('is-over');
    });
    root.addEventListener('drop', function (e) {
      e.preventDefault();
      root.classList.remove('is-over');
      var moved = draggingId;
      draggingId = null;
      if (!moved || moved === id) return;
      dropCard(moved, id);
    });

    return { root: root, body: body, pos: pos, up: up, down: down };
  }

  function clearDragMarks() {
    RIGHT_ORDER.forEach(function (id) {
      if (cardRefs[id]) cardRefs[id].root.classList.remove('is-over', 'is-dragging');
    });
  }

  /** 화면의 카드 순서·라벨·단추 상태를 상태값에 맞춘다. */
  function syncOrder() {
    var order = getOrder();
    order.forEach(function (id, index) {
      var card = cardRefs[id];
      if (!card) return;
      // 이미 화면에 있는 노드를 순서대로 다시 붙이면 그대로 자리가 바뀐다.
      refs.orderList.appendChild(card.root);
      card.body.innerHTML = cardCodeHtml(id, index);
      card.pos.textContent = index + 1 + '번째로 검사';
      card.up.disabled = index === 0;
      card.down.disabled = index === order.length - 1;
      card.root.setAttribute('aria-label', cardReadAloud(id, index));
      card.up.setAttribute('aria-label', ORDER_CARDS[id].name + '를 위로 이동');
      card.down.setAttribute('aria-label', ORDER_CARDS[id].name + '를 아래로 이동');
    });
  }

  /** ▲ ▼ 단추로 옮긴다. delta 는 -1(위) 또는 1(아래). */
  function moveCard(id, delta) {
    var order = getOrder();
    var from = order.indexOf(id);
    var to = from + delta;
    if (from < 0 || to < 0 || to >= order.length) return;
    order.splice(from, 1);
    order.splice(to, 0, id);
    commitOrder(order);

    // 순서가 바뀌면 단추가 비활성화될 수 있으므로 초점을 잃지 않게 옮겨 준다.
    var card = cardRefs[id];
    var target = delta < 0 ? card.up : card.down;
    if (target.disabled) target = delta < 0 ? card.down : card.up;
    if (target && !target.disabled) target.focus();

    ui.announce(cardReadAloud(id, getOrder().indexOf(id)) + ' 로 옮겼습니다.');
  }

  /** 드래그로 옮긴 카드를 대상 카드 자리에 넣는다. */
  function dropCard(movedId, targetId) {
    var order = getOrder();
    var from = order.indexOf(movedId);
    if (from >= 0) order.splice(from, 1);
    var to = order.indexOf(targetId);
    if (to < 0) to = order.length;
    order.splice(to, 0, movedId);
    commitOrder(order);
    ui.announce(cardReadAloud(movedId, getOrder().indexOf(movedId)) + ' 로 옮겼습니다.');
  }

  function commitOrder(order) {
    orderTouched = true;
    var state = step3();
    state.orderCards = order.slice();
    if (isRightOrder(order)) state.orderFixed = true;
    L.state.markChanged();
    clearDragMarks();
    syncOrder();
    showOrderResult();
    refreshHint();
  }

  /** 올바른 순서가 되면 runRightOrder(95) 결과를 보여 준다. */
  function showOrderResult() {
    var right = isRightOrder(getOrder());
    refs.orderResult.hidden = !right;

    if (!right) {
      refs.orderCode.clearStates();
      refs.orderCond.reset();
      refs.orderConsole.clear();
      if (orderTouched) {
        refs.orderFeedback.show(
          'warning',
          '아직 순서가 맞지 않아요. <strong>범위가 더 좁은 조건</strong>(더 큰 점수부터 확인하는 조건)이 위로 와야 해요.' +
            // 한 번 맞힌 기록은 지우지 않으므로, [다음] 이 켜져 있는 이유를 함께 알려 준다.
            (step3().orderFixed
              ? '<br /><small>앞에서 한 번 바르게 맞혔기 때문에 [다음] 으로 넘어갈 수는 있어요.</small>'
              : '')
        );
      } else {
        refs.orderFeedback.clear();
      }
      return;
    }

    var result = L.engine.runRightOrder(PREDICT_SCORE);
    refs.orderCond.applyConditions(result.conditions);
    refs.orderCond.setHint('r1', PREDICT_SCORE + ' >= 90 이므로 이 블록이 실행됩니다.');
    refs.orderCond.setHint('r2', '앞에서 실행할 블록이 정해져 검사하지 않습니다.');
    applyTraceToCode(refs.orderCode, result);
    refs.orderConsole.clear();
    if (result.output) refs.orderConsole.write(result.output);
    else refs.orderConsole.writeMuted('(출력 없음)');
    refs.orderFeedback.show(
      'success',
      '순서를 바르게 고쳤어요! 이제 <code>score = 95</code> 일 때 <strong>' +
        ui.escapeHtml(result.output) +
        ' 가 출력됩니다.</strong><br />' +
        '<code>score &gt;= 90</code> 을 먼저 검사하므로 90점 이상은 A 로, ' +
        '그렇지 않은 70점 이상만 <code>C 이상</code> 으로 갈라집니다.'
    );
  }

  function restoreOrder() {
    ensureStartOrder();
    // 아직 한 번도 맞히지 못한 상태로 들어왔다면 힌트를 미리 띄우지 않는다.
    orderTouched = Boolean(step3().orderFixed);
    syncOrder();
    showOrderResult();
  }

  /* ================================================================== */
  /* 7.3 실행 추적표                                                      */
  /* ================================================================== */

  function traceKey(score, colKey) {
    return String(score) + '_' + colKey;
  }

  function isBlankCell(score, colKey) {
    var list = TRACE_BLANKS[score] || [];
    return list.indexOf(colKey) !== -1;
  }

  /** 조건 칸이 틀렸을 때 보여 줄 한 줄 이유 (정답 판정은 runGrade 결과로 만든다) */
  function condReason(score, limit, status) {
    if (status === 'true') {
      return score + ' >= ' + limit + ' 이므로 True 예요.';
    }
    if (status === 'false') {
      return score + ' >= ' + limit + ' 은 거짓이에요. 조건을 검사했지만 결과가 False 인 칸이에요.';
    }
    return '앞 조건에서 실행할 블록이 이미 정해져서 score >= ' + limit + ' 은 아예 검사하지 않아요.';
  }

  /** 출력 칸이 틀렸을 때 보여 줄 한 줄 이유 */
  function outputReason(result) {
    var first = null;
    result.rows.forEach(function (row) {
      if (first === null && row.status === 'true') first = row;
    });
    if (first) {
      return '처음으로 True 가 된 조건이 ' + first.expr + ' 이므로 ' + result.output + ' 가 출력돼요.';
    }
    return '세 조건이 모두 False 라서 else 블록이 실행되고 ' + result.output + ' 가 출력돼요.';
  }

  function makeTraceCell(opts) {
    var select = el('select', {
      'class': 'select trace-cell__select',
      attrs: { 'aria-label': opts.ariaLabel }
    });
    opts.options.forEach(function (option) {
      select.appendChild(el('option', { value: option.value, text: option.label }));
    });
    // 맞음/틀림 표시는 색이 아니라 글자로 남는다. 스크린리더도 읽을 수 있어야 하므로
    // aria-hidden 을 걸지 않는다(명세 11.4 — 아이콘 + 텍스트 + 색상을 함께 쓴다).
    var mark = el('span', {
      'class': 'trace-cell__mark',
      // 이유 한 줄이 표를 지나치게 넓히지 않도록 폭을 제한한다(별도 CSS 없이).
      style: { maxWidth: '180px', margin: '2px auto 0', lineHeight: '1.45' }
    });
    var td = el('td', { 'class': 'trace-cell' }, [select, mark]);

    select.addEventListener('change', function () {
      onTraceChange(opts.key, select.value);
    });

    refs.traceCells[opts.key] = {
      td: td,
      select: select,
      mark: mark,
      correct: opts.correct,
      reason: opts.reason,
      // 안내 문구에 쓰는 짧은 이름(예: 92점 줄의 score >= 80 칸)
      label: opts.name
    };
    return td;
  }

  function buildTrace() {
    var panel = ui.panel({
      title: '🧾 활동 3 · 실행 추적표',
      hint: '빈칸을 골라 표를 완성해요. 고르는 즉시 맞았는지 알려 줄게요.'
    });

    var gradeCode = L.codeview.createCodeView({
      lines: toLines(L.engine.GRADE_LINES),
      title: '점수 등급 프로그램',
      ariaLabel: '점수 등급 파이썬 코드'
    });

    var headRow = el('tr', {}, [el('th', { scope: 'col', text: '점수' })]);
    TRACE_COLS.forEach(function (col) {
      headRow.appendChild(el('th', { scope: 'col', text: col.head }));
    });
    headRow.appendChild(el('th', { scope: 'col', text: '출력' }));

    var tbody = el('tbody');
    TRACE_ROWS.forEach(function (score) {
      var result = L.engine.runGrade(score); // 정답은 언제나 엔진이 계산한다
      var tr = el('tr', {}, [el('th', { scope: 'row', text: String(score) })]);

      TRACE_COLS.forEach(function (col, i) {
        var status = result.rows[i].status;
        if (!isBlankCell(score, col.key)) {
          tr.appendChild(el('td', {}, [L.flow.statusBadge(status)]));
          return;
        }
        tr.appendChild(
          makeTraceCell({
            key: traceKey(score, col.key),
            options: STATUS_OPTIONS,
            correct: status,
            reason: condReason(score, col.limit, status),
            name: score + '점 줄의 ' + col.head + ' 칸',
            ariaLabel: '점수 ' + score + ' 일 때 ' + col.head + ' 조건의 상태 고르기'
          })
        );
      });

      if (!isBlankCell(score, 'out')) {
        tr.appendChild(el('td', {}, [el('code', { text: result.output })]));
      } else {
        tr.appendChild(
          makeTraceCell({
            key: traceKey(score, 'out'),
            options: OUTPUT_OPTIONS,
            correct: result.output,
            reason: outputReason(result),
            name: score + '점 줄의 출력 칸',
            ariaLabel: '점수 ' + score + ' 일 때 출력 고르기'
          })
        );
      }
      tbody.appendChild(tr);
    });

    var table = el('table', { 'class': 'data-table trace-table' }, [
      el('caption', { 'class': 'sr-only', text: '점수별 조건 검사 상태와 출력을 채우는 실행 추적표' }),
      el('thead', {}, [headRow]),
      tbody
    ]);

    refs.traceFeedback = ui.createFeedback({
      emptyText: '빈칸을 고르면 칸마다 바로 확인해 줄게요.'
    });

    /* 명세 7.3 : False 와 검사 안 함의 차이를 표 아래에 상시 표시한다. */
    var diffCard = ui.callout(
      '<strong>False ✕ 와 검사 안 함 — 은 다릅니다.</strong><br />' +
        '· <strong>False ✕</strong> : 조건을 <strong>실제로 검사했지만</strong> 결과가 거짓이에요.<br />' +
        '· <strong>검사 안 함 —</strong> : 앞에서 이미 <strong>실행할 블록이 결정되어</strong> 조건 자체를 확인하지 않아요.'
    );

    panel.body.appendChild(gradeCode.root);
    panel.body.appendChild(el('div', { 'class': 'table-scroll' }, [table]));
    panel.body.appendChild(refs.traceFeedback.root);
    panel.body.appendChild(diffCard);

    return panel.root;
  }

  function traceMap() {
    var state = step3();
    if (!state.trace || typeof state.trace !== 'object') state.trace = {};
    return state.trace;
  }

  function onTraceChange(key, value) {
    var map = traceMap();
    if (value === '') delete map[key];
    else map[key] = value;

    var cell = refs.traceCells[key];
    var correct = value !== '' && value === cell.correct;
    refreshTraceDone();
    L.state.markChanged();
    paintTraceCell(key);

    if (value === '') {
      refs.traceFeedback.clear();
    } else if (correct) {
      refs.traceFeedback.show('success', '<strong>' + ui.escapeHtml(cell.label) + '</strong> — 맞았어요!');
    } else {
      refs.traceFeedback.show(
        'warning',
        '<strong>' + ui.escapeHtml(cell.label) + '</strong> — ' + ui.escapeHtml(cell.reason) +
          '<br />다시 골라 보세요.'
      );
    }
    // 자세한 이유는 위 안내 상자(aria-live)가 그대로 읽어 주므로 여기서는 짧게만 알린다.
    if (value !== '') ui.announce(correct ? '맞았어요.' : '다시 골라 보세요.');
    refreshTraceSummary(true);
    refreshHint();
  }

  /** 한 칸의 정답 표시(초록 ✓ / 이유 한 줄)를 다시 그린다. */
  function paintTraceCell(key) {
    var cell = refs.traceCells[key];
    var value = traceMap()[key] || '';
    cell.select.value = value;
    cell.td.classList.remove('is-correct', 'is-wrong');
    if (!value) {
      cell.mark.textContent = '';
      return;
    }
    if (value === cell.correct) {
      cell.td.classList.add('is-correct');
      cell.mark.textContent = '✓ 맞아요';
    } else {
      cell.td.classList.add('is-wrong');
      cell.mark.textContent = '✕ ' + cell.reason;
    }
  }

  function traceKeys() {
    return Object.keys(refs.traceCells);
  }

  function refreshTraceDone() {
    var map = traceMap();
    var done = traceKeys().every(function (key) {
      return map[key] === refs.traceCells[key].correct;
    });
    step3().traceDone = done;
    return done;
  }

  function refreshTraceSummary(fromChange) {
    var map = traceMap();
    var keys = traceKeys();
    var left = keys.filter(function (key) {
      return map[key] !== refs.traceCells[key].correct;
    }).length;

    if (left === 0) {
      refs.traceFeedback.show(
        'success',
        '<strong>표를 모두 맞혔어요! 🎉</strong><br />' +
          '조건은 위에서 아래로 검사하고, 한 블록이 정해지면 나머지 조건은 <strong>검사하지 않는다</strong>는 것을 확인했어요.',
        '🎉'
      );
      return;
    }
    if (!fromChange) {
      refs.traceFeedback.show('info', '아직 남은 칸이 ' + left + '칸 있어요.');
    }
  }

  function restoreTrace() {
    traceKeys().forEach(paintTraceCell);
    refreshTraceDone();
    var map = traceMap();
    var answered = traceKeys().some(function (key) {
      return map[key];
    });
    if (answered) refreshTraceSummary(false);
    else refs.traceFeedback.clear();
  }

  /* ================================================================== */
  /* 공통                                                                */
  /* ================================================================== */

  function refreshHint() {
    if (!refs.hint) return;
    if (L.state.canProceed(3)) {
      refs.hint.textContent = '세 활동을 모두 마쳤어요! 아래 [다음] 을 눌러 4단계로 넘어가요.';
      return;
    }
    var left = L.state.remainingHint(3);
    refs.hint.textContent = left.length
      ? '남은 활동: ' + left.join(', ')
      : L.state.blockedMessage(3);
  }

  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 3,
        title: L.CONST.STEP_TITLES[3],
        lead: [
          '조건이 여러 개일 때 프로그램은 <strong>위에서 아래로</strong> 하나씩 검사합니다. ' +
            '그래서 <strong>조건을 쓰는 순서</strong>가 결과를 바꿉니다.',
          '이번 화면에서는 순서가 잘못된 코드를 직접 고쳐 보고, 실행 흐름을 표로 따라가 봅니다.'
        ]
      })
    );

    refs.hint = el('p', { 'class': 'panel__hint', attrs: { 'aria-live': 'polite' } });

    root.appendChild(
      el('div', { 'class': 'stack stack--lg' }, [
        buildPredict(),
        buildOrder(),
        buildTrace(),
        refs.hint
      ])
    );

    // 저장된 학습 기록을 화면에 되살린다(새로고침해도 이어서 할 수 있게).
    restorePredict();
    restoreOrder();
    restoreTrace();
    refreshHint();
  }

  L.registerStep(3, {
    title: L.CONST.STEP_TITLES[3],
    short: L.CONST.STEP_SHORTS[3],
    render: render,
    onEnter: function () {
      restorePredict();
      restoreOrder();
      restoreTrace();
      refreshHint();
    }
  });
})();
    </script>
    <script data-from="js/63-step4.js">
/**
 * 화면 4 — 다중 조건문과 중첩 조건문 비교 (명세 8장)
 *  - 8.1 카드 분류 활동 (드래그 앤 드롭 + 버튼으로 보내기 두 가지 방법)
 *  - 8.2 두 프로그램 비교 (탄소 절감률 조건부 축약 · 상점 프로그램 뼈대)
 *  - 8.3 중첩 구조 흐름도 (바깥 조건 예/아니오 · 안쪽 점수 12 / 7 / 3)
 *
 * 원본 프로그램의 코드 줄은 절대 새로 쓰지 않고 L.engine.ECO_LINES / BONUS_LINES 를 가져다 쓴다.
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;

  /* ------------------------------------------------------------------ */
  /* 자료                                                                */
  /* ------------------------------------------------------------------ */

  /** 두 분류 영역. key 는 L.state.CARD_ANSWER 의 값과 같아야 한다. */
  var ZONES = [
    {
      key: 'multi',
      name: '다중 조건문',
      sub: 'if - elif - else 를 나란히',
      icon: '📋'
    },
    {
      key: 'nested',
      name: '중첩 조건문',
      sub: '조건 안에 또 조건',
      icon: '📦'
    }
  ];

  function zoneName(key) {
    for (var i = 0; i < ZONES.length; i += 1) {
      if (ZONES[i].key === key) return ZONES[i].name;
    }
    return '보관함';
  }

  /**
   * 명세 8.1 카드 4장.
   *  text : 명세 8.1 표의 "상황" 문장을 글자 그대로 옮긴 것 (고치지 않는다)
   *  why  : 정답을 맞혔을 때 보여 주는 "왜 그 구조가 적합한지" 설명
   *  hint : 틀렸을 때 보여 주는 되짚어 보기 질문 (정답을 바로 알려 주지 않는다)
   */
  var CARDS = [
    {
      id: 'A',
      text: '온도 구간에 따라 추움·선선함·더움을 정한다.',
      example: '예) 5도 미만이면 추움, 20도 미만이면 선선함, 그 밖에는 더움',
      why:
        '온도라는 <strong>값 하나</strong>를 여러 구간 중 하나로 나누는 문제예요. ' +

      hint:
        '온도를 판단하기 <em>전에</em> 반드시 먼저 확인해야 하는 다른 조건이 있나요? ' +
        '없다면 조건을 나란히 놓는 구조예요.'
    },
    {
      id: 'B',
      text: '로그인을 성공한 사용자에게만 관리자 여부를 확인한다.',
      example: '예) 로그인 실패한 사람에게는 관리자인지 묻지 않는다',
      why:
        '로그인에 성공했을 때<strong>만</strong> 관리자인지 따져요. ' +

        '<strong>중첩 조건문</strong>이 알맞아요.',
      hint:
        '로그인에 실패한 사람에게도 관리자냐고 물어봐야 할까요? ' +
        '먼저 통과해야 다음 질문을 할 수 있다면, 조건 안에 조건을 넣는 구조예요.'
    },
    {
      id: 'C',
      text: '점수 구간에 따라 A·B·C·D를 정한다.',
      example: '예) 90점 이상 A, 80점 이상 B, 70점 이상 C, 그 밖에는 D',
      why:
        '점수라는 <strong>값 하나</strong>를 네 등급 중 하나로 분류해요. ' +
        '위에서부터 차례로 검사해 <strong>한 곳만</strong> 실행하면 되니 ' +
        '<strong>다중 조건문</strong>이 알맞아요. 3단계에서 살펴본 등급 판정과 같은 모양이에요.',
      hint:
        '등급을 정하기 전에 먼저 통과해야 하는 조건이 있나요? ' +
        '등급끼리는 서로 겹치지 않고 나란히 이어집니다.'
    },
    {
      id: 'D',
      text: '수업 시간에 상점을 받은 경우에만 상점 수치를 판단하여 추가 상점을 준다.',
      example: '예) 상점을 받지 않았다면 점수를 아예 묻지 않는다',
      why:
        '먼저 상점을 받았는지 확인하고, <strong>받은 경우에만</strong> 점수를 다시 판단해요. ' +
        '바깥 조건이 True 일 때만 안쪽 조건을 검사하므로 <strong>중첩 조건문</strong>이 알맞아요. ' +
        '5단계에서 직접 만들어 볼 프로그램이랍니다.',
      hint:
        '상점을 받지 않은 사람의 점수도 판단해야 할까요? ' +
        '먼저 확인해야 할 조건이 있다면, 조건 안에 조건을 넣는 구조예요.'
    }
  ];

  /** 명세 8.3 흐름도의 안쪽 조건 (표현식은 L.engine.BONUS_EXPR 과 같은 문자열이다) */
  var INNER_IDS = ['i1', 'i2', 'ielse'];

  /** 명세 8.3 안쪽 점수 예시 */
  var SCORES = [12, 7, 3];

  /* ------------------------------------------------------------------ */
  /* 화면 참조                                                            */
  /* ------------------------------------------------------------------ */
  var refs = {
    trayBody: null,
    zoneBodies: {},
    cardRefs: {},
    sortFeedback: null,
    sortCount: null,
    awardWrap: null,
    gateWrap: null,
    compareWrap: null,
    tree: null,
    treeVars: null,
    treeFeedback: null,
    treeCheck: null,
    scoreChips: null,
    scoreButtons: [],
    scoreHint: null,
    nextHint: null
  };

  /** 8.2 · 8.3 을 펼쳐 두었는지 (카드를 다 맞히면 저절로 열린다) */
  var revealed = false;

  /**
   * 마지막으로 눌러 본 흐름도 상태를 담는 그릇.
   * appState.step4.tree 에 그대로 저장하므로 새로고침해도 되살아난다.
   * 복원 시 mergeInto 가 이 객체를 "새 객체"로 갈아 끼우므로,
   * 참조를 미리 붙잡아 두지 말고 쓸 때마다 이 함수로 다시 꺼내야 한다.
   */
  function treeLast() {
    var s4 = L.state.appState.step4;
    if (!s4.tree || typeof s4.tree !== 'object') s4.tree = {};
    if (!('mode' in s4.tree)) s4.tree.mode = null;
    if (!('score' in s4.tree)) s4.tree.score = null;
    return s4.tree;
  }

  /* ------------------------------------------------------------------ */
  /* 작은 도우미                                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 숨기기 / 보이기.
   * lesson.css 의 .btn · .row · .stack 은 display 를 직접 정하고 있어서
   * hidden 속성만으로는 숨겨지지 않는다. 그래서 style.display 도 함께 다룬다.
   */
  function setShown(node, show) {
    if (!node) return;
    node.hidden = !show;
    node.style.display = show ? '' : 'none';
  }

  /* ------------------------------------------------------------------ */
  /* 8.1 카드 분류                                                        */
  /* ------------------------------------------------------------------ */

  function cardsState() {
    return L.state.appState.step4.cards;
  }

  /** 드롭 대상으로 만든다. zoneKey 가 null 이면 "아직 분류하지 않은 카드" 보관함이다. */
  function makeDropTarget(node, zoneKey) {
    node.addEventListener('dragover', function (e) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      node.classList.add('is-over');
    });
    node.addEventListener('dragleave', function (e) {
      // 자식 위로 옮겨 갈 때도 dragleave 가 나므로, 정말 바깥으로 나갔을 때만 지운다.
      if (e.relatedTarget && node.contains(e.relatedTarget)) return;
      node.classList.remove('is-over');
    });
    node.addEventListener('drop', function (e) {
      e.preventDefault();
      node.classList.remove('is-over');
      var id = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
      if (!refs.cardRefs[id]) return;
      placeCard(id, zoneKey, true);
    });
  }

  /** 카드 한 장을 만든다. 드래그와 버튼 두 가지 방법을 모두 제공한다(명세 8.1). */
  function buildCard(card) {
    // .row 로 만들어야 배지와 설명 사이가 붙지 않는다(components.css 의 gap 을 그대로 쓴다).
    var verdictHolder = el('span', { 'class': 'card-item__verdict row' });
    var verdictRow = el('p', { 'class': 'row' }, [verdictHolder]);
    var whyBox = ui.callout('', { muted: true });
    setShown(verdictRow, false);
    setShown(whyBox, false);

    var moveButtons = ZONES.map(function (zone) {
      // 터치 대상 44px 을 지키려고 btn--sm(36px) 대신 기본 크기를 쓴다(명세 11.4).
      return ui.button({
        label: zone.icon + ' ' + zone.name + '으로',
        variant: 'secondary',
        ariaLabel: '카드 ' + card.id + ' 를 ' + zone.name + ' 영역으로 보내기',
        onClick: function () {
          placeCard(card.id, zone.key, true);
        }
      });
    });

    var backBtn = ui.button({
      label: '↩ 보관함으로',
      variant: 'ghost',
      ariaLabel: '카드 ' + card.id + ' 를 보관함으로 되돌리기',
      onClick: function () {
        placeCard(card.id, null, true);
      }
    });
    setShown(backBtn, false);

    var body = el('div', { 'class': 'card-item__text' }, [
      el('p', { 'class': 'mini-quiz__q', text: card.text }),
      el('p', { 'class': 'panel__hint', text: card.example }),
      ui.buttonRow(moveButtons.concat([backBtn])),
      verdictRow,
      whyBox
    ]);

    var root = el(
      'div',
      {
        'class': 'card-item',
        draggable: true,
        dataset: { card: card.id },
        attrs: { role: 'group', 'aria-label': '카드 ' + card.id + '. ' + card.text }
      },
      [
        el('span', { 'class': 'card-item__tag', text: card.id, attrs: { 'aria-hidden': 'true' } }),
        body
      ]
    );

    root.addEventListener('dragstart', function (e) {
      if (e.dataTransfer) {
        e.dataTransfer.setData('text/plain', card.id);
        e.dataTransfer.effectAllowed = 'move';
      }
      root.classList.add('is-dragging');
    });
    root.addEventListener('dragend', function () {
      root.classList.remove('is-dragging');
    });

    refs.cardRefs[card.id] = {
      card: card,
      root: root,
      verdictRow: verdictRow,
      verdictHolder: verdictHolder,
      whyBox: whyBox,
      backBtn: backBtn
    };
    return root;
  }

  /**
   * 카드를 영역으로 옮긴다.
   * @param {string} id    카드 A~D
   * @param {string|null} zoneKey 'multi' | 'nested' | null(보관함)
   * @param {boolean} announce 방금 학생이 옮긴 것이면 true (즉시 피드백 · 소리 안내)
   */
  function placeCard(id, zoneKey, announce) {
    var cards = cardsState();
    if (!(id in cards)) return;
    var entry = refs.cardRefs[id];

    // 카드를 옮기면 노드가 다른 영역으로 붙으면서 포커스가 날아간다.
    // 키보드만 쓰는 학생이 처음부터 다시 Tab 하지 않도록, 누르고 있던 버튼 자리를 기억해 둔다.
    var buttonsBefore = entry
      ? Array.prototype.slice.call(entry.root.querySelectorAll('button'))
      : [];
    var focusIndex = buttonsBefore.indexOf(document.activeElement);

    cards[id] = zoneKey;
    // 4장이 모두 제자리에 있을 때만 참이다. 나중에 잘못 옮기면 다시 거짓이 된다.
    L.state.appState.step4.sortDone = L.state.cardsAllCorrect();
    L.state.markChanged();

    syncCards();
    refreshSort(announce ? id : null);
    refreshGate();
    refreshNext();

    if (entry && focusIndex >= 0) {
      var buttonsAfter = entry.root.querySelectorAll('button');
      var target = buttonsAfter[focusIndex];
      if (!target || target.hidden || target.disabled) target = buttonsAfter[0];
      if (target && typeof target.focus === 'function') target.focus();
    }
  }

  /** 저장된 상태대로 카드 노드를 각 영역에 배치한다. */
  function syncCards() {
    var cards = cardsState();
    CARDS.forEach(function (card) {
      var entry = refs.cardRefs[card.id];
      if (!entry) return;
      var zoneKey = cards[card.id];
      var target = zoneKey && refs.zoneBodies[zoneKey] ? refs.zoneBodies[zoneKey] : refs.trayBody;
      // 이미 제자리에 있으면 건드리지 않는다(괜히 다시 붙이면 포커스가 풀린다).
      if (entry.root.parentNode !== target) target.appendChild(entry.root);
    });
  }

  /** 카드별 정오 표시 · 설명 · 전체 진행 문구를 새로 그린다. */
  function refreshSort(justMovedId) {
    var cards = cardsState();
    var answer = L.state.CARD_ANSWER;
    var placed = 0;
    var correct = 0;

    CARDS.forEach(function (card) {
      var entry = refs.cardRefs[card.id];
      var zoneKey = cards[card.id];
      var isPlaced = zoneKey === 'multi' || zoneKey === 'nested';
      var isRight = isPlaced && zoneKey === answer[card.id];
      if (isPlaced) placed += 1;
      if (isRight) correct += 1;

      entry.root.classList.toggle('is-correct', isRight);
      entry.root.classList.toggle('is-wrong', isPlaced && !isRight);
      setShown(entry.backBtn, isPlaced);

      ui.clear(entry.verdictHolder);
      if (!isPlaced) {
        setShown(entry.verdictRow, false);
        setShown(entry.whyBox, false);
        entry.whyBox.innerHTML = '';
        return;
      }
      setShown(entry.verdictRow, true);
      entry.verdictHolder.appendChild(
        isRight ? ui.badge('true', '맞아요 ✓') : ui.badge('false', '다시 생각해요 ✕')
      );
      // 두 영역 이름은 모두 '문' 으로 끝나므로 조사는 '이 / 은' 으로 고정해도 자연스럽다.
      entry.verdictHolder.appendChild(
        el('span', {
          text: isRight
            ? zoneName(zoneKey) + '이 맞아요.'
            : zoneName(zoneKey) + '은 아니에요. 다른 영역으로 옮겨 보세요.'
        })
      );
      setShown(entry.whyBox, true);
      entry.whyBox.innerHTML = isRight
        ? '<strong>왜 그럴까요?</strong> ' + card.why
        : '<strong>되짚어 볼까요?</strong> ' + card.hint;
    });

    refs.sortCount.textContent =
      '분류한 카드 ' + placed + ' / 4장 · 알맞게 놓은 카드 ' + correct + ' / 4장';

    var allRight = correct === 4;
    setShown(refs.awardWrap, allRight);

    if (justMovedId) {
      var moved = refs.cardRefs[justMovedId];
      var movedZone = cards[justMovedId];
      // 명세 8.1 : 카드를 놓을 때마다 맞았는지와 "왜 그 구조가 적합한지"를 즉시 알려 준다.
      // 마지막 한 장으로 4장을 다 맞혔더라도 그 카드의 이유 설명을 지우지 않고 함께 보여 준다.
      var done = allRight
        ? '<br />🎉 <strong>4장 모두 알맞게 분류했어요!</strong> ' +
          '아래에서 두 구조를 <strong>코드로</strong> 비교해 볼까요?'
        : '';
      if (!movedZone) {
        refs.sortFeedback.show('info', '카드 ' + justMovedId + '를 보관함으로 되돌렸어요.');
        ui.announce('카드 ' + justMovedId + '를 보관함으로 되돌렸습니다.');
      } else if (movedZone === answer[justMovedId]) {
        refs.sortFeedback.show(
          'success',
          '카드 ' + justMovedId + '는 <strong>' + zoneName(movedZone) + '</strong>이 맞아요! ' +
            moved.card.why + done,
          allRight ? '🎉' : undefined
        );
        ui.announce(
          '카드 ' + justMovedId + ' 정답입니다. ' + zoneName(movedZone) + '.' +
            (allRight ? ' 카드 4장을 모두 알맞게 분류했습니다.' : '')
        );
      } else {
        refs.sortFeedback.show(
          'warning',
          '카드 ' + justMovedId + '는 <strong>' + zoneName(movedZone) + '</strong>이 아니에요. ' +
            moved.card.hint
        );
        ui.announce('카드 ' + justMovedId + ' 다시 생각해 보세요.');
      }
    } else if (placed === 0) {
      refs.sortFeedback.clear();
    } else if (allRight) {
      refs.sortFeedback.show('success', '4장 모두 알맞게 분류했어요!', '🎉');
    }
  }

  /* ------------------------------------------------------------------ */
  /* 8.2 · 8.3 열기 (카드를 다 맞히기 전에는 답을 미리 보여 주지 않는다)     */
  /* ------------------------------------------------------------------ */
  function refreshGate() {
    // 한 번 열린 뒤에는 다시 닫지 않는다.
    // (카드를 다시 옮겨 보는 도중에 흐름도가 사라지면, 이미 눌러 본 [예]·[아니오] 결과까지
    //  화면에서 없어져 학생이 길을 잃는다.)
    if (L.state.cardsAllCorrect()) revealed = true;
    setShown(refs.compareWrap, revealed);
    setShown(refs.gateWrap, !revealed);
  }

  /* ------------------------------------------------------------------ */
  /* 8.3 중첩 구조 흐름도                                                 */
  /* ------------------------------------------------------------------ */

  /**
   * 점수 칩을 켜고 끈다.
   * lesson.css 에 .chip:disabled 모양이 따로 없어서, 꺼진 것을 눈으로도 알 수 있게
   * 인라인 스타일을 함께 준다(추가 CSS 파일 없이도 구분되어야 한다).
   */
  /**
   * 고른 점수 칩을 표시한다.
   * lesson.css 의 .chip.is-active 는 색만 바뀌므로(명세 11.4 · 색상 단독 구분 금지)
   * 글자 앞에 ✓ 를 붙이고 aria-pressed 로 눌림 상태를 함께 알려 준다.
   */
  function setScoreActive(value) {
    refs.scoreChips.setActive(value);
    refs.scoreButtons.forEach(function (btn, i) {
      var on = SCORES[i] === value;
      btn.textContent = (on ? '✓ ' : '') + SCORES[i] + '점';
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function setScoreEnabled(flag) {
    refs.scoreButtons.forEach(function (btn) {
      btn.disabled = !flag;
      btn.style.opacity = flag ? '' : '0.45';
      btn.style.cursor = flag ? '' : 'not-allowed';
    });
    if (refs.scoreHint) {
      refs.scoreHint.textContent = flag
        ? '점수를 고르면 안쪽 조건을 차례대로 검사해요.'
        : '바깥 조건이 예(True) 일 때만 고를 수 있어요.';
    }
  }

  /**
   * 흐름도를 mode 에 맞게 그린다.
   *  mode = null  : 아직 아무것도 고르지 않음
   *  mode = 'no'  : 바깥 조건 False → 안쪽 영역 비활성화 + '안쪽 조건은 검사하지 않음'
   *  mode = 'yes' : 바깥 조건 True → 안쪽이 살아남. score 를 고르면 runBonus 결과를 채운다.
   */
  function renderTree(mode, score, persist) {
    var last = treeLast();
    last.mode = mode;
    last.score = mode === 'yes' ? score : null;
    // 학생이 직접 누른 경우에만 저장한다(화면을 되살릴 때는 저장할 것이 없다).
    if (persist) L.state.markChanged();

    if (mode === null) {
      refs.tree.reset();
      refs.treeVars.reset();
      setScoreActive(null);
      setScoreEnabled(false);
      refs.treeFeedback.clear();
      return;
    }

    if (mode === 'no') {
      // 명세 8.3 : 바깥 조건이 False 이면 안쪽 조건은 아예 검사하지 않는다.
      var noResult = L.engine.runBonus('n', 0);
      refs.tree.applyResult(noResult); // setOuter('false') 가 setDimmed(true) 까지 해 준다
      refs.treeVars.setAll({ bonus_received: noResult.received, score: null, extra: null });
      setScoreActive(null);
      setScoreEnabled(false);
      refs.treeFeedback.show(
        'info',
        "바깥 조건 <code>bonus_received == 'y'</code> 가 <strong>False ✕</strong> 예요. " +
          '안쪽 조건 세 개는 <strong>검사 안 함 —</strong> 상태로 남고, 바깥 else 만 실행돼요.<br />' +
          '출력 → <code>' + ui.escapeHtml(noResult.output) + '</code>'
      );
      return;
    }

    setScoreEnabled(true);

    if (score === null || score === undefined) {
      refs.tree.setOuter('true');
      INNER_IDS.forEach(function (id) {
        refs.tree.setInner(id, 'idle');
      });
      refs.tree.setNote('안쪽 조건이 살아났어요. 받은 상점 점수를 골라 보세요.');
      refs.treeVars.setAll({ bonus_received: 'y', score: null, extra: null });
      setScoreActive(null);
      refs.treeFeedback.show(
        'info',
        "바깥 조건 <code>bonus_received == 'y'</code> 가 <strong>True ✓</strong> 예요. " +
          '이제 안쪽 조건을 검사할 차례입니다. 점수 <strong>12 · 7 · 3</strong> 중 하나를 골라 보세요.'
      );
      return;
    }

    var result = L.engine.runBonus('y', score);
    refs.tree.applyResult(result);
    refs.tree.setNote('바깥 조건이 True 라서 안쪽 조건까지 검사했어요.');
    refs.treeVars.setAll({
      bonus_received: result.received,
      score: result.score,
      extra: result.extra
    });
    setScoreActive(score);
    refs.treeFeedback.show(
      'success',
      'score 가 <strong>' + score + '</strong> 이므로 추가 상점은 <strong>' + result.extra +
        '점</strong> 이에요.<br />출력 → <code>' + ui.escapeHtml(result.output) + '</code>'
    );
  }

  /** 예/아니오를 모두 눌러 봤는지 표시 (명세 8.3 · 이동 조건) */
  function refreshTreeCheck() {
    var seen = L.state.appState.step4.treeSeen;
    ui.clear(refs.treeCheck);
    [
      { key: 'yes', label: '예(True) 확인' },
      { key: 'no', label: '아니오(False) 확인' }
    ].forEach(function (item) {
      var done = Boolean(seen[item.key]);
      refs.treeCheck.appendChild(
        ui.badge(done ? 'true' : 'primary', (done ? '✓ ' : '· ') + item.label)
      );
    });
  }

  /**
   * 새로고침 뒤에는 흐름도의 마지막 선택까지는 되살릴 수 없다.
   * (appState.step4 에 담을 자리가 없다 — 30-state.js 는 이 단계에서 고치지 않는다.)
   * 대신 "이미 확인한 활동"이라는 사실과 다시 보는 방법을 알려 준다.
   */
  function showTreeResumeHint() {
    var seen = L.state.appState.step4.treeSeen;
    if (treeLast().mode !== null) return;
    if (!seen.yes && !seen.no) return;
    refs.treeFeedback.show(
      'info',
      '지난번에 확인한 흐름도예요. <strong>[예(True)]</strong> 나 <strong>[아니오(False)]</strong> 를 ' +
        '다시 누르면 그때의 결과를 그대로 볼 수 있어요.'
    );
  }

  function markTreeSeen(key) {
    var seen = L.state.appState.step4.treeSeen;
    if (!seen[key]) {
      seen[key] = true;
      L.state.markChanged();
    }
    refreshTreeCheck();
    refreshNext();
  }

  /* ------------------------------------------------------------------ */
  /* 다음 단계 안내                                                       */
  /* ------------------------------------------------------------------ */
  function refreshNext() {
    var ok = L.state.canProceed(4);

   * (세 낱말 모두 받침으로 끝나므로 뒤에 '을' 을 붙이면 된다)
   */
  var BLANK_SPOT = {
    '1': '조건식',
    '2': '조건식',
    '3': '조건식',

  var BLANK_SIZE = { '1': 6, '2': 4, '3': 5, '4': 4, '5': 4, '6': 4, '7': 30 };

  /** 명세 9.7 모드 A 토큰 팔레트. 뒤쪽 4개는 일부러 섞어 둔 오답 토큰이다. */
  var TOKENS = [

  /** 시뮬레이션 진행 상황(학생 상태가 아니라 화면 상태라 저장하지 않는다) */
  var sim = { result: null, index: -1, playing: false, finished: false, token: 0 };
  /** 빈칸 노드는 모드별로 미리 만들어 두고 코드뷰에 끼워 넣는다. */
  var blankNodes = { token: {}, typing: {} };

  }

  /* ================================================================== */
  /* 2. 작은 도우미                                                       */
  /* ================================================================== */

  /** 코드로 비교하기 좋게 다듬는다(앞뒤 공백 제거 · 큰따옴표를 작은따옴표로). */
  function normalizeCode(raw) {
    var text = String(raw === undefined || raw === null ? '' : raw).trim();
    // 스마트 따옴표(’ “ ”)를 보통 따옴표로 바꾼다. 모바일 자판에서 자주 들어온다.
    text = text.replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
    // 큰따옴표로 감싼 문자열은 작은따옴표와 같은 뜻이므로 같게 본다.
    if (/^"[\s\S]*"$/.test(text)) text = "'" + text.slice(1, -1) + "'";
    return text;
  }

  function blankValue(num) {
    var v = state5().blanks[String(num)];
    return v === null || v === undefined ? '' : String(v);
  }

  function isBlankCorrect(num) {
    return normalizeCode(blankValue(num)) === BLANK_ANSWER[String(num)];
  }

  function allBlanksCorrect() {
    return BLANK_NUMS.every(isBlankCorrect);
  }

  /** 조건 줄에 붙일 배지 문구. 색이 아니라 글자+기호로 구분한다(명세 11.3). */
  function condBadge(status) {
    if (status === S.TRUE) return { text: 'True ✓', kind: 'true' };
    if (status === S.FALSE) return { text: 'False ✕', kind: 'false' };
    if (status === S.RUN) return { text: '실행 ▶', kind: 'primary' };
    return { text: '검사 안 함 —', kind: 'primary' };
  }

  /** 실행 기록 한 단계를 코드뷰의 어떤 상태로 보여 줄지 정한다. */
  function stateForStep(step) {
    if (step.kind === 'skip') return 'unchecked';
    if (step.status === S.SKIP) return 'unchecked';
    return 'done';
  }

  /** 상점을 받지 않았으면 점수 입력을 잠근다(명세 9.10). */
  function syncScoreEnabled() {
    var received = refs.ynGroup.getValue();
    var off = received !== 'y';
    refs.scoreField.input.disabled = off;
    refs.scoreHint.textContent = off
      ? '상점을 받지 않았으므로 점수는 입력하지 않아요. 안쪽 조건도 검사하지 않습니다.'
      : '상점을 받은 경우에만 점수를 입력해요. 1~50 사이의 정수만 쓸 수 있습니다.';
  }

  function saveSim(received, score) {
    var st = state5();
    var yn = engine.normalizeYN(received) || 'n';
    st.sim.received = yn;
    var n = Number(score);
    if (!isNaN(n) && n > 0) st.sim.score = Math.trunc(n);
    L.state.markChanged();
  }

  /** 입력값을 읽고 검사한다(명세 9.10). 문제가 있으면 ok:false 와 오류 문구를 돌려준다. */
  function readSim() {
    var received = engine.normalizeYN(refs.ynGroup.getValue());
    if (received === null) {
      return { ok: false, message: 'y 또는 n 중 하나를 골라 주세요.' };
    }
    if (received === 'n') return { ok: true, received: 'n', score: null };
    var check = engine.validateScore(refs.scoreField.getValue());
    if (!check.ok) return { ok: false, message: check.message };
    return { ok: true, received: 'y', score: check.value };
  }

  /** 실행 표시를 모두 지운다. */
  function resetSim() {
    sim.token += 1;
    sim.result = null;
    sim.index = -1;
    sim.playing = false;
    sim.finished = false;
    refs.simCode.clearStates();
    refs.simVars.reset();
    refs.simConsole.clear();
    refs.simFeedback.clear();
    refs.simProgress.textContent = '실행 전';
    refs.tree.reset();
    highlightRule(null);
    applyStructDim(null);
    setSimBusy(false);
  }

  function setSimBusy(busy) {
    refs.btnStep.disabled = busy;
    refs.btnAll.disabled = busy;
  }

  /** 새 실행을 준비한다. 입력이 잘못되면 false 를 돌려준다. */
  function startSim() {
    var input = readSim();
    if (!input.ok) {
      // 명세 9.10 의 오류 문구를 그대로 보여 준다.
      refs.simFeedback.show('error', ui.escapeHtml(input.message));
      ui.announce(input.message);
      refs.scoreField.input.focus();
      return false;
    }
    resetSim();
    saveSim(input.received, input.score);
    sim.result = engine.runBonus(input.received, input.score);
    sim.index = -1;
    refs.simConsole.writeMuted(
      "입력 : bonus_received = '" + input.received + "'" +
        (input.received === 'y' ? ' , score = ' + input.score : ' (점수는 입력하지 않음)')
    );
    refs.simProgress.textContent = '0 / ' + sim.result.trace.length + ' 단계';
    return true;
  }

  /** 지금까지 실행한 단계를 코드뷰·트리·변수에 반영한다. */
  function renderUpTo(index) {
    var result = sim.result;
    var i;
    refs.simCode.clearStates();
    refs.tree.reset();
    for (i = 0; i <= index; i += 1) {
      var step = result.trace[i];
      refs.simCode.setState(step.line, i === index ? 'running' : stateForStep(step));
      if (step.kind === 'cond') {
        var badge = condBadge(step.status);
        refs.simCode.showBadge(step.line, badge.text, badge.kind);
      }
      if (step.condId === 'outer') {
        refs.tree.setOuter(step.status);
        applyStructDim(step.status);
      } else if (step.condId) {
        refs.tree.setInner(step.condId, step.status);
      }
    }
    if (index >= 0) {
      // 코드가 13줄뿐이라 자동 스크롤은 하지 않는다.
      // (scrollToLine 은 페이지 전체를 움직여 읽던 자리를 잃게 만들 수 있다)
      refs.simVars.setAll(result.trace[index].vars);
    } else {
      refs.simVars.reset();
    }
    refs.simProgress.textContent = index + 1 + ' / ' + result.trace.length + ' 단계';
  }

  /** 한 단계 실행 (9.4) */
  function stepOnce() {
    if (sim.playing) return;
    if (!sim.result && !startSim()) return;
    if (sim.finished) {
      refs.simFeedback.show('info', '실행이 끝났어요. [다시 시작] 을 누르면 처음부터 다시 볼 수 있어요.');
      ui.announce('실행이 끝났어요.');
      return;
    }
    if (sim.index >= sim.result.trace.length - 1) {
      finishSim();
      return;
    }
    sim.index += 1;
    var step = sim.result.trace[sim.index];
    renderUpTo(sim.index);
    if (step.desc) refs.simConsole.writeMuted(step.desc);
    if (step.output) refs.simConsole.write(step.output);
    refs.simFeedback.show('info', ui.escapeHtml(step.desc || ''));
    if (sim.index === sim.result.trace.length - 1) finishSim();
  }

  /** 전체 실행 (9.4) — 한 줄씩 순서대로 보여 준다. */
  function runAll() {
    // 앞선 실행이 진행 중이어도 새 실행을 시작한다.
    // startSim() 안의 resetSim() 이 sim.token 을 올려 이전 실행을 멈춰 준다.
    if (!startSim()) return;
    var myToken = sim.token;
    sim.playing = true;
    setSimBusy(true);

    var next = function () {
      if (myToken !== sim.token) return; // 다시 시작을 눌렀으면 멈춘다
      if (sim.index >= sim.result.trace.length - 1) {
        sim.playing = false;
        setSimBusy(false);
        finishSim();
        return;
      }
      sim.index += 1;
      var step = sim.result.trace[sim.index];
      renderUpTo(sim.index);
      if (step.desc) refs.simConsole.writeMuted(step.desc);
      if (step.output) refs.simConsole.write(step.output);
      ui.sleep(280).then(next);
    };
    next();
  }

  /** 실행이 끝났을 때 마무리 표시 */
  function finishSim() {
    var result = sim.result;
    // 이미 마무리한 실행을 두 번 정리하면 출력이 겹쳐 쌓인다.
    if (!result || sim.finished) return;
    sim.finished = true;
    var i;

    // 마지막 줄까지 상태를 확정한다(실행 중 표시를 남기지 않는다).
    refs.simCode.clearStates();
    for (i = 0; i < result.trace.length; i += 1) {
      var step = result.trace[i];
      refs.simCode.setState(step.line, stateForStep(step));
      if (step.kind === 'cond') {
        var badge = condBadge(step.status);
        refs.simCode.showBadge(step.line, badge.text, badge.kind);
      }
    }

    // 명세 9.4 사례 A : 바깥 조건이 False 면 score 입력 줄과 안쪽 조건 세 줄은 '검사 안 함 —' 이다.
    if (result.outer.status === S.FALSE) {
      refs.simCode.setState(3, 'unchecked'); // score 입력
      refs.simCode.setState(4, 'unchecked'); // if score >= 10:
      refs.simCode.setState(6, 'unchecked'); // elif score >= 5:
      refs.simCode.setState(8, 'unchecked'); // 안쪽 else:
    }

    refs.simVars.setAll(result.vars);
    refs.tree.applyResult(result);
    applyStructDim(result.outer.status);
    highlightRule(result.extra);
    refs.simProgress.textContent = '실행 완료 · ' + result.trace.length + ' / ' + result.trace.length + ' 단계';
    sim.index = result.trace.length - 1;

    var summary =
      result.outer.status === S.FALSE
        ? '바깥 조건이 <strong>False ✕</strong> 라서 안쪽 조건은 한 번도 검사하지 않았어요.'
        : '바깥 조건이 <strong>True ✓</strong> 라서 안쪽 조건을 위에서부터 검사했어요. 추가 상점은 <strong>' +
          result.extra +
          '점</strong>입니다.';
    refs.simFeedback.show('success', summary + '<br />출력 : <code>' + ui.escapeHtml(result.output) + '</code>');
    // 마지막 줄이 '검사하지 않음' 설명으로 끝나면 결과가 묻히므로 최종 출력을 한 번 더 정리해 준다.
    refs.simConsole.writeHint('프로그램 종료 · 최종 출력 → ' + result.output);
    refs.btnStep.disabled = true; // 더 실행할 줄이 없다. [다시 시작] 으로 되돌린다.
    ui.announce('실행 결과 ' + result.output);
  }

  /** 명세 9.5 : 바깥 조건이 False 면 안쪽 코드 전체를 흐리게 하고 안내 문구를 보여 준다. */
  function applyStructDim(status) {
    var i;
    if (!refs.structCode) return;
    if (status === S.FALSE) {
      for (i = 3; i <= 10; i += 1) refs.structCode.setState(i, 'unchecked');
      refs.structCode.setState(11, 'done');
      refs.structCode.setState(12, 'done');
      refs.structNote.textContent = '바깥 조건이 False 이므로 안쪽 조건은 실행되지 않습니다.';
    } else if (status === S.TRUE) {
      for (i = 3; i <= 10; i += 1) refs.structCode.setState(i, 'idle');
      refs.structCode.setState(11, 'unchecked');
      refs.structCode.setState(12, 'unchecked');
      refs.structNote.textContent =
        '바깥 조건이 True 이므로 4칸 들여쓴 안쪽으로 들어가 점수를 검사합니다.';
    } else {
      refs.structCode.clearStates();
      refs.structNote.textContent = STRUCT_NOTE_DEFAULT;
    }
  }

  /* 8. 9.6 / 9.7 빈칸 완성                                               */
