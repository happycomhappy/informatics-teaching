  /**
   * 토큰 모드 빈칸 : 눌러서 넣고, 다시 눌러서 뺀다(모바일에서도 동작).
   * 마우스가 있는 기기에서는 토큰을 끌어다 놓을 수도 있다(명세 9.7 모드 A).
   */
  function makeTokenBlank(num) {
    var valueNode = el('span', { 'class': 'blank__value' });
    /** 끌어온 토큰을 받을 수 있는 빈칸인지 확인한다. */
    var canDrop = function () {
      return state5().mode !== 'typing' && blankValue(num) === '';
    };
    var setDropMark = function (on) {
      if (on) {
        root.style.outline = '3px dashed var(--color-primary)';
        root.style.outlineOffset = '2px';
        return;
      }
      // 끌기 표시를 지울 때 "고른 빈칸" 표시까지 지워지지 않게 되돌려 준다.
      var active = state5().mode !== 'typing' && activeBlank === num;
      root.style.outline = active ? '3px solid var(--color-primary)' : '';
      root.style.outlineOffset = active ? '2px' : '';
    };
    var root = el(
      'button',
      {
        type: 'button',
        'class': 'blank',
        dataset: { blank: num },
        on: {
          click: function () {
            onBlankClick(num);
          },
          dragover: function (e) {
            if (!canDrop()) return;
            e.preventDefault(); // 여기에 놓을 수 있다는 뜻
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
            setDropMark(true);
          },
          dragleave: function () {
            setDropMark(false);
          },
          drop: function (e) {
            e.preventDefault();
            setDropMark(false);
            if (!canDrop() || !e.dataTransfer) return;
            onTokenDrop(num, e.dataTransfer.getData('text/plain'));
          }
        }
      },
      [
        el('span', { 'class': 'blank__num', text: BLANK_MARK[num], attrs: { 'aria-hidden': 'true' } }),
        valueNode
      ]
    );
    if (num === '7') {
      // 출력 문자열은 길어서 줄바꿈을 허용해야 가로로 삐져나가지 않는다.
      Object.keys(LONG_TOKEN_STYLE).forEach(function (key) {
        root.style[key] = LONG_TOKEN_STYLE[key];
      });
    }
    return { root: root, valueNode: valueNode };
  }

  /** 직접 입력 모드 빈칸 */
  function makeTypingBlank(num) {
    var input = el('input', {
      type: 'text',
      'class': 'blank__input',
      size: BLANK_SIZE[num],
      attrs: {
        'aria-label': BLANK_MARK[num] + '번 빈칸에 들어갈 코드',
        autocomplete: 'off',
        autocapitalize: 'off',
        autocorrect: 'off',
        spellcheck: 'false'
      }
    });
    input.addEventListener('input', function () {
      setBlank(num, input.value, 'typing');
    });
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var order = BLANK_NUMS.indexOf(num);
      var next = BLANK_NUMS[order + 1];
      if (next && blankNodes.typing[next]) blankNodes.typing[next].input.focus();
    });
    var root = el('span', { 'class': 'blank', dataset: { blank: num } }, [
      el('span', { 'class': 'blank__num', text: BLANK_MARK[num], attrs: { 'aria-hidden': 'true' } }),
      input
    ]);
    return { root: root, input: input };
  }

  /** 코드뷰에 넣을 줄 정의를 만든다(명세 9.6 · CONTRACT 3절 parts). */
  function blankLines() {
    var mode = state5().mode === 'typing' ? 'typing' : 'token';
    var b = function (num) {
      return blankNodes[mode][num].root;
    };
    return [
      { code: "bonus_received = input('수업 시간에 상점을 받았나요? (y / n): ')" },
      { parts: ['if bonus_received == ', b('1'), ' ', b('2')], indent: 0 },
      { code: "    score = int(input('받은 상점의 점수를 입력하세요 (1~50): '))" },
      { parts: ['if score ', b('3'), ' 10:'], indent: 4 },
      { parts: ['extra = ', b('4')], indent: 8 },
      { parts: ['elif score >= ', b('5'), ':'], indent: 4 },
      { code: '        extra = 2' },
      { code: '    else:' },
      { parts: ['extra = ', b('6')], indent: 8 },
      { code: "    print(f'추가로 부여된 상점은 {extra}점입니다.')" },
      { code: 'else:' },
      { parts: ['print(', b('7'), ')'], indent: 4 }
    ];
  }

  function buildBlankPanel() {
    var panel = ui.panel({
      title: '✏️ 빈칸을 채워 프로그램을 완성해요',
      hint: '빈칸은 모두 7개예요. 두 가지 방법 중 편한 쪽을 고르세요.'
    });

    BLANK_NUMS.forEach(function (num) {
      blankNodes.token[num] = makeTokenBlank(num);
      blankNodes.typing[num] = makeTypingBlank(num);
    });

    refs.modeTabs = ui.tabs({
      items: [
        { id: 'token', label: '모드 A · 토큰 고르기' },
        { id: 'typing', label: '모드 B · 직접 입력' }
      ],
      value: state5().mode === 'typing' ? 'typing' : 'token',
      ariaLabel: '빈칸 입력 방식 고르기',
      onChange: function (id) {
        state5().mode = id;
        L.state.markChanged();
        activeBlank = null;
        selectedToken = null;
        refs.blankCode.setLines(blankLines());
        syncBlanks();
        syncModeHint();
      }
    });
    refs.modeHint = el('p', { 'class': 'panel__hint' });
    panel.body.appendChild(refs.modeTabs.root);
    panel.body.appendChild(refs.modeHint);

    refs.blankCode = L.codeview.createCodeView({
      lines: blankLines(),
      title: '내가 완성하는 프로그램',
      ariaLabel: '빈칸이 있는 상점 추가 지급 프로그램'
    });
    panel.body.appendChild(refs.blankCode.root);

    /* --- 토큰 팔레트 (모드 A) --- */
    refs.tokenList = el('div', { 'class': 'token-tray__list' });
    TOKENS.forEach(function (tok) {
      var node = el('button', {
        type: 'button',
        'class': 'token',
        text: tok.text,
        draggable: true,
        dataset: { token: tok.id },
        attrs: { 'aria-label': '토큰 ' + tok.text },
        on: {
          click: function () {
            onTokenClick(tok);
          },
          // 마우스로 끌어다 놓기(명세 9.7). 손가락·키보드에서는 아래 click 경로를 쓴다.
          dragstart: function (e) {
            if (state5().mode === 'typing' || node.classList.contains('is-used')) {
              e.preventDefault();
              return;
            }
            if (e.dataTransfer) {
              e.dataTransfer.setData('text/plain', tok.id);
              e.dataTransfer.effectAllowed = 'move';
            }
            node.classList.add('is-dragging');
          },
          dragend: function () {
            node.classList.remove('is-dragging');
          }
        }
      });
      if (tok.text.length > 12) {
        Object.keys(LONG_TOKEN_STYLE).forEach(function (key) {
          node.style[key] = LONG_TOKEN_STYLE[key];
        });
      }
      tokenEls[tok.id] = node;
      refs.tokenList.appendChild(node);
    });
    refs.tokenTray = el('div', { 'class': 'token-tray' }, [
      el('p', {
        'class': 'token-tray__title',
        text:
          '토큰을 빈칸으로 끌어다 놓거나, 토큰을 누른 다음 빈칸을 누르세요. ' +
          '(빈칸을 먼저 눌러도 됩니다) 채운 빈칸을 다시 누르면 토큰이 돌아와요.'
      }),
      refs.tokenList
    ]);
    panel.body.appendChild(refs.tokenTray);

    /* --- 채점 (9.11) --- */
    refs.gradeBtn = ui.button({
      label: '빈칸 채점하기',
      variant: 'primary',
      ariaLabel: '빈칸 채점하기. 7개 빈칸의 답을 확인합니다.',
      onClick: gradeBlanks
    });
    refs.clearBtn = ui.button({
      label: '빈칸 비우기',
      variant: 'ghost',
      ariaLabel: '빈칸 비우기. 채운 답을 모두 지웁니다.',
      onClick: function () {
        BLANK_NUMS.forEach(function (num) {
          state5().blanks[num] = null;
        });
        state5().blanksDone = false;
        L.state.markChanged();
        activeBlank = null;
        selectedToken = null;
        syncBlanks();
        clearBlankFeedback();
        refreshAward();
        ui.announce('빈칸을 모두 비웠어요.');
      }
    });
    panel.body.appendChild(ui.buttonRow([refs.gradeBtn, refs.clearBtn]));

    refs.blankFeedback = ui.createFeedback({
      emptyText: '빈칸을 모두 채운 뒤 [빈칸 채점하기] 를 눌러 보세요.'
    });
    panel.body.appendChild(refs.blankFeedback.root);
    return panel;
  }

  function syncModeHint() {
    var typing = state5().mode === 'typing';
    refs.modeHint.textContent = typing
      ? '빈칸에 직접 입력하세요. 들여쓰기는 자동으로 맞춰져 있으니 조건식과 값만 쓰면 됩니다. 큰따옴표로 써도 같은 답으로 봅니다.'
      : '아래 토큰 중에서 골라 넣으세요. 필요 없는 토큰도 섞여 있으니 잘 살펴봐요.';
    refs.tokenTray.hidden = typing;
  }

  /** 저장된 답안을 화면에 되살린다(새로고침 복원). */
  function syncBlanks() {
    var mode = state5().mode === 'typing' ? 'typing' : 'token';
    BLANK_NUMS.forEach(function (num) {
      var value = blankValue(num);
      var node = blankNodes[mode][num];
      if (mode === 'typing') {
        if (node.input.value !== value) node.input.value = value;
        // 이름표는 감싼 span 이 아니라 실제로 초점이 가는 input 에 붙여야 읽어 준다.
        // 값은 input 자체를 읽으면 알 수 있으므로 이름표에 다시 넣지 않는다.
        node.input.setAttribute('aria-label', BLANK_MARK[num] + '번 빈칸에 들어갈 코드');
      } else {
        node.valueNode.textContent = value;
        node.root.setAttribute(
          'aria-label',
          BLANK_MARK[num] + '번 빈칸' + (value ? ', 현재 값 ' + value + '. 누르면 비웁니다' : ', 비어 있음. 누르면 고릅니다')
        );
      }
      node.root.classList.toggle('blank--filled', value !== '');
      // 선택된 빈칸 표시 — step5 전용 CSS 없이도 보이도록 인라인으로 준다.
      var active = mode === 'token' && activeBlank === num;
      node.root.style.outline = active ? '3px solid var(--color-primary)' : '';
      node.root.style.outlineOffset = active ? '2px' : '';
    });
    syncTokens();
  }

  function syncTokens() {
    var used = {};
    BLANK_NUMS.forEach(function (num) {
      var v = blankValue(num);
      if (v) used[v] = true;
    });
    TOKENS.forEach(function (tok) {
      var node = tokenEls[tok.id];
      var isUsed = Boolean(used[tok.text]);
      node.classList.toggle('is-used', isUsed);
      node.classList.toggle('is-selected', selectedToken === tok.id);
      node.setAttribute('aria-pressed', String(selectedToken === tok.id));
      node.setAttribute(
        'aria-label',
        '토큰 ' + tok.text + (isUsed ? '. 이미 사용했습니다' : '')
      );
    });
  }

  /** 빈칸 값을 바꾸고 저장한다. 값이 바뀌면 채점 표시를 지운다. */
  function setBlank(num, value, source) {
    var text = value === undefined || value === null ? '' : String(value);
    state5().blanks[String(num)] = text === '' ? null : text;
    state5().blanksDone = false;
    L.state.markChanged();
    clearBlankMarks();
    if (source !== 'typing') syncBlanks();
    else syncTokens();
    refreshAward();
  }

  function clearBlankMarks() {
    BLANK_NUMS.forEach(function (num) {
      ['token', 'typing'].forEach(function (mode) {
        blankNodes[mode][num].root.classList.remove('blank--correct', 'blank--wrong');
      });
    });
  }

  function onBlankClick(num) {
    if (state5().mode === 'typing') return;
    var current = blankValue(num);
    if (current) {
      setBlank(num, '');
      activeBlank = num;
      selectedToken = null;
      syncBlanks();
      ui.announce(BLANK_MARK[num] + '번 빈칸을 비웠어요. 토큰이 팔레트로 돌아갔습니다.');
      return;
    }
    if (selectedToken) {
      var tok = null;
      TOKENS.forEach(function (t) {
        if (t.id === selectedToken) tok = t;
      });
      if (tok) {
        setBlank(num, tok.text);
        selectedToken = null;
        // 넣은 뒤에는 고른 빈칸을 풀어 둔다. 다음 토큰이 엉뚱한 칸에 들어가지 않게 하기 위해서다.
        activeBlank = null;
        syncBlanks();
        ui.announce(BLANK_MARK[num] + '번 빈칸에 ' + tok.text + ' 을(를) 넣었어요.');
        return;
      }
    }
    activeBlank = num;
    syncBlanks();
    ui.announce(BLANK_MARK[num] + '번 빈칸을 골랐어요. 아래 토큰을 눌러 넣어 주세요.');
  }

  /** 끌어다 놓기로 토큰을 빈칸에 넣는다(명세 9.7 모드 A). */
  function onTokenDrop(num, tokenId) {
    if (state5().mode === 'typing') return;
    if (blankValue(num) !== '') return;
    var tok = null;
    TOKENS.forEach(function (t) {
      if (t.id === tokenId) tok = t;
    });
    if (!tok) return;
    if (tokenEls[tok.id].classList.contains('is-used')) {
      ui.announce('이미 사용한 토큰이에요. 빈칸을 다시 누르면 되돌릴 수 있어요.');
      return;
    }
    setBlank(num, tok.text);
    selectedToken = null;
    activeBlank = null;
    syncBlanks();
    ui.announce(BLANK_MARK[num] + '번 빈칸에 ' + tok.text + ' 을(를) 넣었어요.');
  }

  function onTokenClick(tok) {
    if (state5().mode === 'typing') return;
    if (tokenEls[tok.id].classList.contains('is-used')) {
      ui.announce('이미 사용한 토큰이에요. 빈칸을 다시 누르면 되돌릴 수 있어요.');
      return;
    }
    if (activeBlank && !blankValue(activeBlank)) {
      var target = activeBlank;
      setBlank(target, tok.text);
      selectedToken = null;
      activeBlank = null;
      syncBlanks();
      ui.announce(BLANK_MARK[target] + '번 빈칸에 ' + tok.text + ' 을(를) 넣었어요.');
      return;
    }
    selectedToken = selectedToken === tok.id ? null : tok.id;
    syncTokens();
    ui.announce(
      selectedToken ? tok.text + ' 토큰을 골랐어요. 넣을 빈칸을 눌러 주세요.' : '토큰 선택을 취소했어요.'
    );
  }

  /* ================================================================== */
  /* 9. 9.11 자동 채점 피드백                                             */
  /* ================================================================== */

  /**
   * 빈칸 하나의 오답을 명세 9.11 의 오류 유형으로 나눈다.
   * 돌려주는 값 : { type, hint, snippet[] }
   */
  function diagnose(num, raw) {
    var value = normalizeCode(raw);
    var lower = value.toLowerCase();

    if (num === '1') {
      if (lower === 'y' || lower === 'bonus_received') {
        return {
          type: "== 'y' 오류",
          hint: 'y 는 글자(문자열)예요. 따옴표를 붙여 <code>\'y\'</code> 라고 써야 비교할 수 있습니다.',
          snippet: ["if bonus_received == 'y':"]
        };
      }
      return {
        type: '바깥 조건 오류',
        hint: "바깥 조건은 <strong>상점을 받았는지</strong>를 판단합니다. 입력값이 <code>'y'</code> 와 같은지 비교하세요.",
        snippet: ["if bonus_received == 'y':"]
      };
    }
    if (num === '2') {
      return {
        type: '콜론 누락',
        hint: 'if 조건식이 끝나면 반드시 콜론 <code>:</code> 을 붙입니다. 콜론이 있어야 아래 들여쓴 줄이 그 조건의 블록이 돼요.',
        snippet: ["if bonus_received == 'y':"]
      };
    }
    if (num === '3') {
      return {
        type: '>= 10 오류',
        hint: '10점 <strong>이상</strong>은 10점을 포함합니다. <code>&gt;</code> 를 쓰면 딱 10점인 경우가 빠지므로 <code>&gt;=</code> 를 씁니다.',
        snippet: ['if score >= 10:', '    extra = 3']
      };
    }
    if (num === '4') {
      return {
        type: 'extra 값 오류',
        hint: '규칙 카드에서 10점 이상이면 추가 상점은 <strong>3점</strong>입니다.',
        snippet: ['if score >= 10:', '    extra = 3']
      };
    }
    if (num === '5') {
      if (/^\d+$/.test(value) && Number(value) >= 10) {
        return {
          type: '내부 조건 순서 오류',
          hint: '10점 이상인 경우를 5점 이상보다 먼저 검사해야 합니다. 두 번째 조건에는 <strong>5</strong> 가 들어갑니다.',
          snippet: ['if score >= 10:', '    extra = 3', 'elif score >= 5:', '    extra = 2']
        };
      }
      return {
        type: '>= 5 오류',
        hint: '5점 이상 10점 미만이면 추가 상점 2점이므로 두 번째 조건은 <code>score &gt;= 5</code> 입니다.',
        snippet: ['elif score >= 5:', '    extra = 2']
      };
    }
    if (num === '6') {
      return {
        type: 'extra 값 오류',
        hint: '두 조건이 모두 False 인 경우, 곧 1점 이상 5점 미만이면 추가 상점은 <strong>1점</strong>입니다.',
        snippet: ['else:', '    extra = 1']
      };
    }
    // num === '7'
    if (value.indexOf('추가로 부여된') !== -1) {
      return {
        type: '바깥 else 위치 오류',
        hint:
          '바깥 <code>else</code> 는 <strong>상점을 받지 않았을 때</strong> 실행됩니다. 추가 상점을 알리는 문장은 안쪽 print 에 이미 있어요.',
        snippet: ['else:', "    print('상점을 받지 않았으므로 추가 상점이 없습니다.')"]
      };
    }
    return {
      type: '출력 문자열 오류',
      hint:
        '출력할 문장은 따옴표로 감싸고, 글자를 하나도 바꾸지 않아야 합니다 → <code>' +
        ui.escapeHtml(BLANK_ANSWER['7']) +
        '</code>',
      snippet: ['else:', "    print('상점을 받지 않았으므로 추가 상점이 없습니다.')"]
    };
  }

  /**
   * 빈칸 피드백을 보여 준다.
   * 3차 실패 때 붙였던 부분 정답 코드 조각이 다음 피드백에 남지 않도록 언제나 먼저 지운다.
   */
  function showBlankFeedback(type, html, snippetLines) {
    var old = ui.$('.step5-snippet', refs.blankFeedback.root);
    if (old && old.parentNode) old.parentNode.removeChild(old);
    refs.blankFeedback.show(type, html);
    if (!snippetLines || !snippetLines.length) return;
    var view = L.codeview.createCodeView({
      lines: snippetLines.map(function (code) {
        return { code: code };
      }),
      showLineNumbers: false,
      ariaLabel: '부분 정답 코드 조각'
    });
    refs.blankFeedback.root.appendChild(el('div', { 'class': 'step5-snippet' }, [view.root]));
  }

  function clearBlankFeedback() {
    var old = ui.$('.step5-snippet', refs.blankFeedback.root);
    if (old && old.parentNode) old.parentNode.removeChild(old);
    refs.blankFeedback.clear();
  }

  /** 빈칸 7개 채점 (명세 9.6 정답 · 9.11 단계별 피드백) */
  function gradeBlanks() {
    var st = state5();
    var empty = BLANK_NUMS.filter(function (num) {
      return blankValue(num) === '';
    });
    if (empty.length > 0) {
      showBlankFeedback(
        'warning',
        '아직 채우지 않은 빈칸이 있어요 : ' +
          empty
            .map(function (num) {
              return BLANK_MARK[num];
            })
            .join(' ') +
          '<br />모두 채운 뒤에 다시 눌러 주세요.'
      );
      ui.announce('아직 채우지 않은 빈칸이 있어요.');
      return;
    }

    clearBlankMarks();
    var wrong = [];
    BLANK_NUMS.forEach(function (num) {
      var ok = isBlankCorrect(num);
      ['token', 'typing'].forEach(function (mode) {
        blankNodes[mode][num].root.classList.add(ok ? 'blank--correct' : 'blank--wrong');
      });
      if (!ok) wrong.push(num);
    });

    if (wrong.length === 0) {
      st.blanksDone = true;
      st.hintLevel = 0;
      L.state.markChanged();
      showBlankFeedback(
        'success',
        '7개 빈칸을 모두 맞혔어요! 바깥 조건을 통과한 경우에만 안쪽 조건을 판단하는 <strong>중첩 조건문</strong>이 완성되었습니다.'
      );
      ui.announce('빈칸 7개를 모두 맞혔습니다.');
      refreshAward();
      return;
    }

    st.blanksDone = false;
    st.attempts += 1;
    st.hintLevel = Math.min(st.attempts, 3);
    L.state.markChanged();

    var level = st.hintLevel;
    var first = wrong[0];
    var info = diagnose(first, blankValue(first));

    // 1차 실패 : 명세 9.11 대로 "오류 위치만" 알려 준다.
    //           (이때 오류 유형까지 적어 주면 ② 콜론 누락 처럼 사실상 정답을 알려 주게 된다)
    var html =
      '<strong>' +
      BLANK_LINE[first] +
      '번째 줄의 ' +
      BLANK_SPOT[first] +
      '을 다시 확인해 보세요.</strong><br />' +
      '틀린 빈칸 : ' +
      wrong
        .map(function (num) {
          return BLANK_MARK[num] + '(' + BLANK_LINE[num] + '번째 줄)';
        })
        .join(' · ');

    // 2차 실패 : 오류 유형과 힌트를 덧붙인다.
    if (level >= 2) {
      html +=
        '<br />오류 유형 : ' +
        wrong
          .map(function (num) {
            return diagnose(num, blankValue(num)).type;
          })
          .join(' · ');
      html += '<br /><br />💡 <strong>힌트</strong> — ' + info.hint;
    }
    // 3차 실패 : 부분 정답 코드 조각을 실제 코드뷰로 보여 준다.
    if (level >= 3) {
      html += '<br /><br />🧩 <strong>부분 정답</strong> — 아래 모양을 참고해 고쳐 보세요.';
    }

    showBlankFeedback(level >= 2 ? 'info' : 'warning', html, level >= 3 ? info.snippet : null);

    ui.announce(
      BLANK_LINE[first] + '번째 줄의 ' + BLANK_SPOT[first] + '을 다시 확인해 보세요.'
    );
    refreshAward();
  }

  /* ================================================================== */
  /* 10. 9.6 별도 들여쓰기 활동                                            */
  /* ================================================================== */
  function buildIndentPanel() {
    var panel = ui.panel({
      title: '📐 들여쓰기 활동',
      hint: '중첩 조건문에서는 들여쓰기가 곧 구조예요.'
    });

    panel.body.appendChild(
      L.codeview.createCodeView({
        lines: [
          { code: "if bonus_received == 'y':", indentNote: '0칸' },
          { code: '    if score >= 10:', indentNote: '4칸' },
          { parts: ['extra = 3'], indent: 8, indentNote: '몇 칸?' }
        ],
        showLineNumbers: false,
        ariaLabel: '들여쓰기 활동 코드'
      }).root
    );
    panel.body.appendChild(
      el('p', {
        'class': 'section-title'
      }, [
        el('span', { 'class': 'section-title__tag', text: 'Q' }),
        el('span', {
          text: '안쪽 if 블록에 속한 extra = 3 은 몇 칸 들여쓰기해야 할까요?'
        })
      ])
    );

    refs.indentGroup = ui.radioGroup({
      name: 'l2-step5-indent',
      legend: '안쪽 if 블록의 들여쓰기 칸 수',
      options: [
        { value: '4', label: '4칸', sub: '바깥 if 블록과 같은 깊이' },
        { value: '8', label: '8칸', sub: '바깥 4칸 + 안쪽 4칸' },
        { value: '12', label: '12칸', sub: '한 단계 더 깊게' }
      ],
      onChange: function (value) {
        state5().indentAnswer = Number(value);
        L.state.markChanged();
        showIndentResult(true);
      }
    });
    panel.body.appendChild(refs.indentGroup.root);
    refs.indentFeedback = ui.createFeedback({ emptyText: '보기를 고르면 바로 확인해 줄게요.' });
    panel.body.appendChild(refs.indentFeedback.root);
    return panel;
  }

  function showIndentResult(answered) {
    var value = state5().indentAnswer;
    if (value === null || value === undefined) {
      refs.indentFeedback.clear();
      refs.indentGroup.setValue(null);
      refs.indentGroup.clearMarks();
      return;
    }
    if (!answered) refs.indentGroup.setValue(String(value));
    refs.indentGroup.clearMarks();
    if (Number(value) === 8) {
      refs.indentGroup.mark('8', 'correct');
      refs.indentFeedback.show(
        'success',
        '맞아요! 바깥 <code>if</code> 안이라 4칸, 안쪽 <code>if</code> 안이라 다시 4칸을 더해 <strong>8칸</strong>입니다.'
      );
    } else {
      refs.indentGroup.mark(String(value), 'wrong');
      refs.indentFeedback.show(
        'warning',
        '<strong>들여쓰기 오류</strong> — 바깥 <code>if</code> 블록 안에서 4칸, 안쪽 <code>if</code> 블록 안에서 다시 4칸을 들여씁니다. 4 + 4 는 몇 칸일까요?'
      );
    }
  }

  /* ================================================================== */
  /* 13. 9.11 배지 · 남은 활동 안내                                        */
  /* ================================================================== */
  function refreshAward() {
    if (!refs.awardBox) return;
    var st = state5();
    ui.clear(refs.awardBox);
    if (st.blanksDone) {
      refs.awardBox.appendChild(
        ui.award({
          icon: '🏅',
          title: '중첩 조건문 완성!',
          text: '바깥 조건을 통과한 경우에만 안쪽 조건을 판단하도록 프로그램을 작성했습니다.'
        })
      );
    }
    refreshRemaining();
  }

  function refreshRemaining() {
    if (!refs.remaining) return;
    if (L.state.canProceed(5)) {
      refs.remaining.textContent = '이 화면의 활동을 모두 마쳤어요. 아래 [다음] 으로 형성평가로 넘어가요.';
      return;
    }
    var left = L.state.remainingHint(5);
    refs.remaining.textContent = left.length
      ? '남은 활동 : ' + left.join(', ')
      : L.state.blockedMessage(5);
  }

  /* ================================================================== */
  /* 14. 화면 조립                                                        */
  /* ================================================================== */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 5,
        title: L.CONST.STEP_TITLES[5],
        lead: [
          '이제 <strong>중첩 조건문</strong>을 직접 완성해 봅니다. ' +
            '바깥 조건이 <strong>True 일 때만</strong> 안쪽 조건을 검사한다는 점이 오늘의 핵심이에요.',
          '활동 1 에서 실행 흐름을 눈으로 확인하고, 활동 2 에서 빈칸을 채워 프로그램을 완성합니다.'
        ]
      })
    );

    /* ---------------- 활동 1 ---------------- */
    root.appendChild(
      ui.activityHeader({
        tag: '활동 1',
        title: '실행 흐름 관찰',
        sub: '프로그램이 어떤 순서로 판단하는지 한 줄씩 따라가 봐요.',
        notice: '바깥 조건이 False 면 안쪽 조건은 아예 검사하지 않습니다.'
      })
    );
    var problemPanel = buildProblemPanel();
    var sourcePanel = buildSourcePanel();
    var rulePanel = buildRulePanel();
    var nestPanel = buildNestPanel(); // 트리를 먼저 만들어야 시뮬레이션이 참조할 수 있다
    var simPanel = buildSimPanel();
    root.appendChild(
      el('div', { 'class': 'stack stack--lg' }, [
        problemPanel.root,
        sourcePanel.root,
        rulePanel.root,
        simPanel.root,
        nestPanel.root
      ])
    );

    /* ---------------- 활동 2 ---------------- */
    root.appendChild(
      ui.activityHeader({
        tag: '활동 2',
        title: '빈칸 완성',
        sub: '활동 1 에서 본 실행 흐름을 떠올리며 프로그램을 직접 완성합니다.',
        divided: true
      })
    );
    var blankPanel = buildBlankPanel();
    var indentPanel = buildIndentPanel();

    // 9.11 배지 — 자동 테스트 패널 안에 있던 자리를 활동 2 끝으로 옮겼다.
    refs.awardBox = el('div', { 'class': 'stack' });
    refs.remaining = el('p', { 'class': 'panel__hint', attrs: { 'aria-live': 'polite' } });
    root.appendChild(
      el('div', { 'class': 'stack stack--lg' }, [
        blankPanel.root,
        indentPanel.root,
        refs.awardBox,
        el('div', { 'class': 'stack' }, [
          ui.linkLine({
            text: '중첩 구조가 헷갈린다면 4단계 비교 화면을 다시 볼 수 있어요.',
            step: 4,
            label: '4단계 다시 보기'
          }),
          refs.remaining
        ])
      ])
    );

    restore();
  }

  /* ================================================================== */
  /* 15. 저장된 상태 되살리기 (새로고침 복원)                              */
  /* ================================================================== */
  function restore() {
    // 화면을 아직 만들지 않았는데 onEnter 가 먼저 불리면 아무것도 하지 않는다.
    if (!refs.ynGroup) return;
    var st = state5();

    // 9.4 시뮬레이션 입력
    var received = engine.normalizeYN(st.sim.received) || 'y';
    refs.ynGroup.setValue(received);
    var score = Number(st.sim.score);
    refs.scoreField.setValue(isNaN(score) || score <= 0 ? '12' : String(Math.trunc(score)));
    syncScoreEnabled();
    resetSim();

    // 9.6 / 9.7 빈칸과 입력 모드
    var mode = st.mode === 'typing' ? 'typing' : 'token';
    refs.modeTabs.setValue(mode);
    refs.blankCode.setLines(blankLines());
    syncModeHint();
    syncBlanks();
    // 저장본이 손상되어 blanksDone 만 true 인 경우에는 표시를 실제 답안에 맞춘다.
    if (st.blanksDone && !allBlanksCorrect()) {
      st.blanksDone = false;
      L.state.markChanged();
    }
    if (st.blanksDone) {
      BLANK_NUMS.forEach(function (num) {
        blankNodes[mode][num].root.classList.add('blank--correct');
      });
      showBlankFeedback(
        'success',
        '7개 빈칸을 모두 맞혔어요! 바깥 조건을 통과한 경우에만 안쪽 조건을 판단하는 <strong>중첩 조건문</strong>이 완성되었습니다.'
      );
    } else {
      clearBlankFeedback();
    }

    // 9.6 들여쓰기 활동
    showIndentResult(false);

    refreshAward();
  }

  /* ================================================================== */
  /* 16. 등록                                                             */
  /* ================================================================== */
  L.registerStep(5, {
    title: L.CONST.STEP_TITLES[5],
    short: L.CONST.STEP_SHORTS[5],
    render: render,
    onEnter: function () {
      restore();
    },
    onLeave: function () {
      // 애니메이션이 남아 돌지 않도록 실행을 멈춘다.
      sim.token += 1;
      sim.playing = false;
      setSimBusy(false);
    }
  });
})();
    </script>
    <script data-from="js/65-step6.js">
/**
 * 화면 6 — 형성평가 및 학습 정리 (명세 10장 전체 · 11.1 저장 · 11.7 개인정보)
 *
 *  - 10.1 형성평가 : 5문항 · 각 2점 · 만점 10점. 한 번에 한 문항씩 보여 주고 이동한다.
 *         문항은 절대 새로 만들지 않고 L.quiz.buildQuiz(variant) 가 만든 것만 쓴다.
 *  - 10.2 평가 기준 : 6점 이상 이수 / 6점 미만 미이수 + 보충 학습 안내
 *  - 10.3 결과 화면 : 총점 · 이수 여부 · 문항별 정오 · 문항별 해설 · 다시 학습할 화면 링크
 *  - 10.4 재도전   : variant 를 1 올려 문항 순서와 입력값이 바뀐 새 문제지를 만든다.
 *                    최고 점수(bestScore) 와 최근 점수(lastScore) 를 항상 함께 표시한다.
 *  - 10.5 학습 정리 : 문장 완성 2개 · 자신감 3택 · 최종 요약 키워드 카드
 *  - 11.1 저장     : 값을 바꾼 뒤에는 반드시 L.state.markChanged() 를 부른다.
 *                    onEnter() 에서 저장된 상태를 화면에 되살린다(새로고침 복원).
 *  - 11.7 개인정보 : 학번·이름은 **필수가 아니다.** 비워 두어도 문제 풀이 · 채점 · 결과 확인이
 *                    모두 된다. 답안을 선생님께 제출할 때만 필요하다.
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var esc = ui.escapeHtml;

  /* ================================================================== */
  /* 답안 제출 설정 (선택 기능)                                            */
  /*                                                                     */
  /*  온라인 제출을 쓰지 않는 수업에서는 SUBMIT_ENABLED 를 false 로 두면    */
  /*  제출 버튼이 아예 나타나지 않는다.                                     */
  /*  주소는 ?endpoint= > localStorage > 아래 상수 순으로 찾고,             */
  /*  그래도 없으면 입력 대화상자를 띄운다.                                 */
  /* ================================================================== */
  var SUBMIT_ENABLED = true;
  var SUBMIT_ENDPOINT = "";

  /** 수업 중 주소를 바꿔야 할 때 쓰는 이 기기 전용 저장 칸 */
  var ENDPOINT_KEY = "lesson3_7_2_endpoint";

  /** 제출 본문에 넣는 차시 식별자 (apps-script/Code.gs 의 LESSON_ID 와 같아야 한다) */
  var LESSON_ID = "lesson3_7_2";

  /** 연결 확인(GET) 응답의 service 가 이 글자로 시작해야 올바른 주소로 인정한다 */
  var SERVICE_PREFIX = "lesson3_7_2";

  /* 응시자 정보 입력 규칙 (명세 11.7 — 필수가 아니다) */
  var ID_MIN = 3;
  var ID_MAX = 10;
  var NAME_MAX = 20;

  /* 명세 10.5 자신감 3택 */
  var CONFIDENCE = [
    { value: "good", label: "잘 설명할 수 있어요", icon: "😀" },
    { value: "more", label: "조금 더 연습할래요", icon: "🙂" },
    { value: "help", label: "도움이 필요해요", icon: "🙋" }
  ];

  /* 명세 10.5 최종 요약 카드 키워드 (원문 그대로) */
  var KEYWORDS = [
    "if",
    "elif",
    "else",
    "조건 순서",
    "처음 True인 블록",
    "검사 안 함",
    "중첩 조건",
    "바깥 조건",
    "안쪽 조건",
    "들여쓰기"
  ];

  /** 학생이 문장을 쓴 뒤에만 보여 주는 정리 문장 (정답을 먼저 보여 주지 않는다) */
  var MODEL_SENTENCE = {
    multi:
      "다중 조건문은 <strong>서로 겹치지 않는 여러 경우 중 하나만</strong> 골라 실행할 때 사용한다. " +
      "조건을 위에서 아래로 검사해 <strong>처음 True 가 된 블록 하나만</strong> 실행한다.",
    nested:
      "중첩 조건문은 <strong>바깥 조건을 만족한 경우에만</strong> 안쪽 조건을 따져야 할 때 사용한다. " +
      "바깥 조건이 False 면 안쪽 조건은 <strong>검사 자체를 하지 않는다</strong>."
  };

  var CIRCLED = "①②③④⑤";

  /* ------------------------------------------------------------------ */
  /* 모듈 안에서만 쓰는 값                                                 */
  /* ------------------------------------------------------------------ */
  var refs = {};
  var quiz = []; // 지금 화면에 올라온 문제지 (L.quiz.buildQuiz 결과)
  var builtVariant = -1; // 지금 문제지를 만든 variant. 상태와 다르면 다시 만든다.
  var current = 0; // 지금 보고 있는 문항 번호(0-based). 화면 표시용이라 저장하지 않는다.
  var submitting = false; // 제출 중 중복 클릭 방지
  var endpointOverridden = false; // 학생이 주소를 직접 다시 입력했는가(쿼리보다 우선)
  var verifiedEndpoint = ""; // 연결 확인(GET)을 이미 마친 주소. 같은 주소면 다시 확인하지 않는다.
  var ready = false; // L.quiz 를 찾지 못해 화면을 만들지 못한 경우 false

  /* ------------------------------------------------------------------ */
  /* 상태 접근 도우미 (저장본이 손상돼도 학습이 멈추지 않게 방어한다)          */
  /* ------------------------------------------------------------------ */
  function st6() {
    return L.state.appState.step6;
  }

  function student() {
    var s = st6();
    if (!s.student || typeof s.student !== "object") s.student = { id: "", name: "" };
    return s.student;
  }

  function submitState() {
    var s = st6();
    if (!s.submit || typeof s.submit !== "object") {
      s.submit = { status: "idle", at: null, count: 0, error: "", tried: false, locked: false };
    }
    if (s.submit.tried === undefined) s.submit.tried = s.submit.status === "done";
    if (s.submit.locked === undefined) s.submit.locked = s.submit.status === "done";
    return s.submit;
  }

  function summaryState() {
    var s = st6();
    if (!s.summary || typeof s.summary !== "object") s.summary = { multi: "", nested: "" };
    return s.summary;
  }

  function answers() {
    var s = st6();
    if (!Array.isArray(s.answers) || s.answers.length !== 5) {
      s.answers = [null, null, null, null, null];
    }
    return s.answers;
  }

  /** 응답이 있는가 (choice 는 0번 보기도 응답이다) */
  function isAnswered(value) {
    return value !== null && value !== undefined && String(value).trim() !== "";
  }

  function answeredCount() {
    return answers().filter(isAnswered).length;
  }

  function allAnswered() {
    return answeredCount() === 5;
  }

  function isGraded() {
    return st6().score !== null && st6().score !== undefined;
  }

  /** 이번 답안을 이미 제출했는지 */
  function isSubmitted() {
    return submitState().status === "done";
  }

  /**
   * 답안을 고칠 수 없는 상태인지.
   * 제출은 한 번뿐이므로 제출한 뒤에는 문항 입력을 잠근다.
   */
  function answersLocked() {
    return SUBMIT_ENABLED && submitState().locked === true;
  }

  /**
   * [채점하기] 가 막힌 이유 (없으면 빈 문자열).
   * 순서는 「5문항 응답 → 답안 제출 → 채점」 이다.
   */
  function gradeBlockReason() {
    var left = [];
    answers().forEach(function (a, i) {
      if (!isAnswered(a)) left.push(i + 1 + "번");
    });
    if (left.length) {
      return (
        "아직 답하지 않은 문항이 있어요 (" + left.join(", ") + "). 5문항에 모두 답해야 해요."
      );
    }
    if (!SUBMIT_ENABLED) return "";
    if (isSubmitted()) return "";
    // 제출을 시도했지만 실패한 경우까지 막으면 점수를 영영 볼 수 없으므로 열어 준다.
    if (submitState().tried) return "";
    return "먼저 [답안 제출하기] 로 답안을 제출해 주세요. 제출을 마치면 채점할 수 있어요.";
  }

  /** display 를 직접 다뤄 CSS 가 없어도 확실히 숨겨지게 한다. */
  function setShown(node, on) {
    if (!node) return;
    node.hidden = !on;
    node.style.display = on ? "" : "none";
  }

  /** 태그를 걷어낸 순수 문장 (기록 파일용). 여는 꺾쇠는 [<] 로 쓴다. */
  function stripHtml(html) {
    return String(html === undefined || html === null ? "" : html)
      .replace(/[<]br\s*\/?[>]/gi, " ")
      .replace(/[<][^>]+[>]/g, "")
      .replace(/&nbsp;/g, " ")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&amp;/g, "&")
      .replace(/\s+/g, " ")
      .trim();
  }

  function nowText() {
    try {
      return new Date().toLocaleString("ko-KR");
    } catch (err) {
      return new Date().toISOString();
    }
  }

  /* ------------------------------------------------------------------ */
  /* 응시자 정보 (명세 11.7 — 필수가 아니다)                                */
  /* ------------------------------------------------------------------ */
  function idOk(value) {
    return new RegExp("^\\d{" + ID_MIN + "," + ID_MAX + "}$").test(String(value || "").trim());
  }

  function nameOk(value) {
    var v = String(value || "").trim();
    return v.length >= 1 && v.length <= NAME_MAX;
  }

  /** 학번·이름이 둘 다 갖춰졌는가 (제출할 때만 필요하다) */
  function studentReady() {
    return idOk(student().id) && nameOk(student().name);
  }

  function studentBlockReason() {
    var s = student();
    var hasId = String(s.id || "").trim() !== "";
    var hasName = String(s.name || "").trim() !== "";
    if (!hasId && !hasName) return "제출하려면 학번과 이름이 필요해요.";
    if (!hasId) return "제출하려면 학번이 필요해요.";
    if (!idOk(s.id)) return "학번은 숫자 " + ID_MIN + "~" + ID_MAX + "자리로 입력해 주세요.";
    if (!hasName) return "제출하려면 이름이 필요해요.";
    if (!nameOk(s.name)) return "이름은 " + NAME_MAX + "자 이내로 입력해 주세요.";
    return "";
  }

  function studentLabel() {
    var s = student();
    var id = String(s.id || "").trim();
    var name = String(s.name || "").trim();
    if (!id && !name) return "(입력하지 않음)";
    return (id || "학번 미입력") + " · " + (name || "이름 미입력");
  }

  /* ================================================================== */
  /* 10.1 형성평가 — 문제지 만들기                                         */
  /* ================================================================== */

  /** 상태의 variant 로 문제지를 만든다. 문항 내용은 L.quiz 만 만든다. */
  function buildSheet() {
    var s = st6();
    var variant = Number(s.variant) || 0;
    quiz = L.quiz.buildQuiz(variant);
    builtVariant = variant;
    // 어떤 순서로 제시했는지 상태에 남긴다(기록·교사 확인용).
    s.order = quiz.map(function (q) {
      return q.id;
    });
  }

  /** 상태의 variant 와 지금 문제지가 어긋났으면 다시 만든다. */
  function ensureSheet() {
    if (builtVariant !== (Number(st6().variant) || 0)) buildSheet();
  }

  /* ------------------------------------------------------------------ */
  /* 한 문항 그리기                                                       */
  /* ------------------------------------------------------------------ */
  function questionNode(q, index) {
    var wrap = el("div", { "class": "quiz__item" });

    wrap.appendChild(
      el("p", { "class": "mini-quiz__no" }, [
        el("span", { text: "문항 " + (index + 1) }),
        ui.badge("primary", q.points + "점"),
        el("span", { "class": "choice__sub", text: q.topic })
      ])
    );

    wrap.appendChild(el("div", { "class": "quiz__stem", html: q.stem }));

    // 실행 결과를 묻는 문항은 입력값을 먼저 보여 준다.
    if (q.inputCode && q.inputCode.length) {
      var inputView = L.codeview.createCodeView({
        lines: q.inputCode.map(function (line) {
          return { code: line };
        }),
        title: q.inputLabel || "입력값",
        showLineNumbers: false,
        ariaLabel: "문항 " + (index + 1) + " 입력값"
      });
      wrap.appendChild(inputView.root);
    }

    // 문항에 code 가 있으면 코드 보기로 표시한다(명세 11.2 : 이미지가 아니라 실제 텍스트 코드).
    if (q.code && q.code.length) {
      var view = L.codeview.createCodeView({
        lines: q.code.map(function (line) {
          return { code: line };
        }),
        title: "파이썬 코드",
        ariaLabel: "문항 " + (index + 1) + " 파이썬 코드"
      });
      wrap.appendChild(view.root);
    }

    if (q.type === "choice") {
      var group = ui.radioGroup({
        name: "l2-step6-q" + index + "-v" + builtVariant,
        legend: stripHtml(q.stem),
        value: isAnswered(answers()[index]) ? String(answers()[index]) : null,
        options: q.choices.map(function (choice, i) {
          return {
            value: String(i),
            label: CIRCLED.charAt(i) + " " + esc(choice),
            ariaLabel: i + 1 + "번 보기. " + choice
          };
        }),
        onChange: function (value) {
          answers()[index] = Number(value);
          L.state.markChanged();
          refreshQuizChrome();
        }
      });
      group.root.classList.add("quiz__choices");
      if (answersLocked() && typeof group.setDisabled === "function") group.setDisabled(true);
      wrap.appendChild(group.root);
    } else if (q.type === "lines") {
      // 빈 줄 ① ② ③ 에 코드 한 줄씩을 직접 쓴다.
      var savedLines = Array.isArray(answers()[index]) ? answers()[index].slice() : [];
      var box = el("div", { "class": "stack quiz__lines" });

      q.blanks.forEach(function (blank, i) {
        var field = ui.textField({
          id: "step6-answer-" + index + "-" + i,
          label: blank.no + " " + blank.label,
          value: String(savedLines[i] == null ? "" : savedLines[i]),
          placeholder: blank.placeholder || "",
          className: "quiz__lineinput",
          maxLength: 60,
          onInput: function (value) {
            var list = Array.isArray(answers()[index]) ? answers()[index].slice() : [];
            while (list.length < q.blanks.length) list.push("");
            list[i] = value;
            // 세 칸이 모두 비면 '응답 없음' 과 같게 다룬다([다음] 버튼 판정과 맞춘다).
            var anyFilled = list.some(function (one) {
              return String(one || "").trim() !== "";
            });
            answers()[index] = anyFilled ? list : "";
            L.state.markChanged();
            refreshQuizChrome();
          },
          onEnter: function () {
            if (current < quiz.length - 1) goToQuestion(current + 1);
          }
        });
        field.input.setAttribute("spellcheck", "false");
        field.input.setAttribute("autocapitalize", "off");
        field.input.setAttribute("autocorrect", "off");
        if (answersLocked()) field.input.disabled = true;
        box.appendChild(field.root);
      });

      wrap.appendChild(box);
      wrap.appendChild(
        el("p", {
          "class": "panel__hint",
          text: "한 줄 전체를 적어 주세요. 줄 끝의 콜론(:)도 빠뜨리지 않아야 해요. 앞 공백은 채점에 영향을 주지 않습니다."
        })
      );
    }

    return wrap;
  }

  function renderQuestion() {
    ui.clear(refs.item);
    var q = quiz[current];
    if (!q) return;
    refs.item.appendChild(questionNode(q, current));
    if (answersLocked()) {
      refs.item.appendChild(
        el("p", {
          "class": "panel__hint",
          text: "제출을 마쳤기 때문에 답안을 고칠 수 없어요. 문항은 [← 이전] [다음 →] 으로 다시 볼 수 있어요."
        })
      );
    }
  }

  function goToQuestion(index) {
    var next = Math.min(quiz.length - 1, Math.max(0, index));
    if (next === current) return;
    current = next;
    renderQuestion();
    refreshQuizChrome();
    ui.announce(quiz.length + "문항 중 " + (current + 1) + "번 문항입니다.");
    if (refs.item.firstChild && typeof refs.item.firstChild.scrollIntoView === "function") {
      refs.item.firstChild.scrollIntoView({ block: "nearest" });
    }
  }

  /** 진행 표시(3 / 5) · 점 · 이동 버튼 · [채점하기] 상태를 한 번에 맞춘다. */
  function refreshQuizChrome() {
    refs.progressText.textContent = current + 1 + " / " + quiz.length;

    refs.dots.forEach(function (dot, i) {
      var done = isAnswered(answers()[i]);
      dot.classList.toggle("is-answered", done);
      dot.classList.toggle("is-current", i === current);
      // 색만으로 구분하지 않는다(명세 11.4) : 답한 점은 실선, 아직인 점은 점선으로 테두리 모양을 바꾼다.
      // 인라인 스타일이라 별도 CSS 파일이 없어도 그대로 보인다.
      dot.style.borderStyle = done ? "solid" : "dashed";
      var label =
        i + 1 + "번 문항으로 이동. " + (done ? "응답함" : "아직 응답하지 않음");
      dot.setAttribute("aria-label", label);
      dot.setAttribute("title", label);
      dot.setAttribute("aria-current", i === current ? "true" : "false");
    });

    refs.btnPrevQ.disabled = current === 0;

    // 지금 문항에 답해야 [다음 문항] 이 열린다.
    var atLast = current === quiz.length - 1;
    var thisAnswered = isAnswered(answers()[current]);
    refs.btnNextQ.disabled = atLast || !thisAnswered;
    refs.btnNextQ.title = atLast
      ? "마지막 문항이에요."
      : thisAnswered
        ? "다음 문항으로 이동합니다."
        : "이 문항에 먼저 답해 주세요.";

    // 명세 : 비활성 사유는 버튼 title 로 안내한다.
    var gradeReason = gradeBlockReason();
    refs.btnGrade.disabled = gradeReason !== "";
    refs.btnGrade.title = gradeReason || "제출한 답안을 채점합니다.";

    refs.answeredText.textContent = "응답한 문항 " + answeredCount() + " / " + quiz.length + "개";

    refreshSubmitUI();
  }

  /* ================================================================== */
  /* 10.2 / 10.3 채점과 결과 화면                                          */
  /* ================================================================== */
  function gradeNow() {
    var blocked = gradeBlockReason();
    if (blocked) {
      refs.quizFeedback.show("warning", esc(blocked));
      ui.announce(blocked);
      return;
    }

    var result = L.quiz.gradeAll(quiz, answers());
    var s = st6();
    s.score = result.score;
    s.passed = result.passed;
    s.lastScore = result.score;
    s.bestScore =
      s.bestScore === null || s.bestScore === undefined
        ? result.score
        : Math.max(Number(s.bestScore), result.score);
    // 도전 횟수 : [다시 풀기] 에서 1씩 올리므로, 첫 채점에서만 1 로 맞춰 준다.
    if (!s.attempts || Number(s.attempts) < 1) s.attempts = 1;
    L.state.markChanged();

    showResult(result);
    ui.announce(
      "채점을 마쳤습니다. 총점 " + result.score + "점, " + result.passedText + " 입니다."
    );
    // [채점하기] 버튼이 들어 있던 영역을 숨겼으므로 키보드 포커스가 사라진다.
    // 결과 패널로 포커스를 옮겨 키보드만 쓰는 학생도 이어서 읽을 수 있게 한다.
    if (typeof refs.result.focus === "function") refs.result.focus();
  }

  /** 문항 하나의 해설 카드(정오 · 내 답 · 정답 · 해설 · 다시 학습할 화면) */
  function reviewItem(q, detail, index) {
    var correct = detail.correct;
    var body = el("div", { "class": "accordion__body", id: "step6-review-body-" + index });

    body.appendChild(
      el("dl", { "class": "accordion__row" }, [
        el("dt", { text: "내가 고른 답" }),
        el("dd", { text: L.quiz.answerText(q, detail.answer) || "(응답 없음)" })
      ])
    );
    body.appendChild(
      el("dl", { "class": "accordion__row" }, [
        el("dt", { text: "정답" }),
        el("dd", { text: L.quiz.correctText(q) })
      ])
    );
    body.appendChild(
      el("dl", { "class": "accordion__row" }, [
        el("dt", { text: "해설" }),
        el("dd", { html: q.explain })
      ])
    );

    // 빈 줄 채우기 문항은 완성된 코드를 함께 보여 준다.
    if (q.solution && q.solution.length) {
      var solved = L.codeview.createCodeView({
        lines: q.solution.map(function (line) {
          return { code: line };
        }),
        title: "완성된 코드",
        ariaLabel: "문항 " + (index + 1) + " 완성된 코드"
      });
      body.appendChild(solved.root);
    }

    body.appendChild(
      ui.linkLine({
        text: "다시 학습할 화면",
        step: q.reviewStep,
        label: L.quiz.REVIEW_LABEL[q.reviewStep] || q.reviewStep + "단계로 이동"
      })
    );

    var head = el("button", {
      type: "button",
      "class": "accordion__head",
      attrs: {
        "aria-expanded": correct ? "false" : "true",
        "aria-controls": "step6-review-body-" + index
      }
    }, [
      el("span", {
        "class": "accordion__mark " + (correct ? "is-correct" : "is-wrong"),
        text: correct ? "✓" : "✕",
        attrs: { "aria-hidden": "true" }
      }),
      el("span", {
        "class": "accordion__title",
        text:
          "문항 " + (index + 1) + " · " + q.topic +
          " — " + (correct ? "정답" : "오답") +
          " (" + detail.earned + " / " + q.points + "점)"
      }),
      el("span", { "class": "accordion__chevron", text: "▾", attrs: { "aria-hidden": "true" } })
    ]);

    // 오답은 펼친 채로, 정답은 접은 채로 시작한다(필요한 해설을 먼저 보게 한다).
    var item = el("div", { "class": "accordion__item" + (correct ? "" : " is-open") }, [head, body]);
    head.addEventListener("click", function () {
      var open = item.classList.toggle("is-open");
      head.setAttribute("aria-expanded", String(open));
    });
    return item;
  }

  function showResult(result) {
    var s = st6();
    ui.clear(refs.resultBody);

    /* --- 총점 · 이수 여부 (색만이 아니라 아이콘 + 글자로 함께 표시) --- */
    var judgeIcon = result.passed ? "🎉" : "📚";
    var scoreCard = el("div", { "class": "quiz__score" }, [
      el("p", {
        "class": "quiz__score-value",
        html: esc(String(result.score)) + " <small>/ " + result.maxScore + "점</small>"
      }),
      el("p", {
        "class": "quiz__score-judge",
        text: judgeIcon + " " + result.passedText + " (6점 이상이면 이수)"
      }),
      el("p", {
        "class": "panel__hint",
        text:
          "최고 점수 " + (s.bestScore === null ? "-" : s.bestScore) + "점 · " +
          "최근 점수 " + (s.lastScore === null ? "-" : s.lastScore) + "점 · " +
          "도전 " + (Number(s.attempts) || 1) + "회"
      })
    ]);
    refs.resultBody.appendChild(scoreCard);

    /* --- 문항별 정오 한눈에 보기 --- */
    // 이름표만 붙은 div 는 보조 기기가 읽지 않으므로 role 을 함께 준다.
    var marks = el("div", {
      "class": "row",
      attrs: { role: "group", "aria-label": "문항별 정오" }
    });
    result.details.forEach(function (d, i) {
      marks.appendChild(
        ui.badge(d.correct ? "true" : "false", i + 1 + "번 " + (d.correct ? "정답 ✓" : "오답 ✕"))
      );
    });
    refs.resultBody.appendChild(ui.sectionTitle("정오", "문항별 채점 결과"));
    refs.resultBody.appendChild(marks);

    /* --- 미이수면 보충 학습 안내를 눈에 띄게 (명세 10.2) --- */
    if (!result.passed) {
      var notice = ui.createFeedback({});
      notice.show(
        "warning",
        "<strong>미이수</strong> 입니다. 아래 <strong>보충 학습 화면</strong>을 다시 살펴본 뒤 " +
          "<strong>[다시 풀기]</strong> 로 한 번 더 도전해 보세요. 점수는 최고 점수로 남습니다.",
        "📚"
      );
      refs.resultBody.appendChild(notice.root);

      var steps = result.wrongSteps.length ? result.wrongSteps : [2, 3, 4, 5];
      var links = el("div", { "class": "stack" });
      steps.forEach(function (step) {
        links.appendChild(
          ui.linkLine({
            text: "보충 학습",
            step: step,
            label: L.quiz.REVIEW_LABEL[step] || step + "단계로 이동"
          })
        );
      });
      refs.resultBody.appendChild(links);
    } else {
      refs.resultBody.appendChild(
        ui.award({
          icon: "🏅",
          title: "형성평가 이수!",
          text:
            "조건을 <strong>위에서 아래로</strong> 검사한다는 것, 그리고 <strong>바깥 조건을 통과했을 때만</strong> " +
            "안쪽 조건을 검사한다는 것을 잘 이해했어요."
        })
      );
    }

    /* --- 문항별 해설 · 다시 학습할 화면 링크 (명세 10.3) --- */
    refs.resultBody.appendChild(ui.sectionTitle("해설", "문항별 해설과 다시 학습할 화면"));
    var accordion = el("div", { "class": "accordion" });
    result.details.forEach(function (d, i) {
      accordion.appendChild(reviewItem(quiz[i], d, i));
    });
    refs.resultBody.appendChild(accordion);

    setShown(refs.quizBody, false);
    setShown(refs.result, true);
    refs.quizFeedback.clear();
    refreshBestLast(); // 최고 / 최근 점수는 채점 직후에도 항상 최신값으로 (명세 10.4)
    refreshSubmitUI();
  }

  /* ================================================================== */
  /* 10.4 재도전                                                          */
  /* ================================================================== */
  function retryQuiz() {
    var s = st6();
    s.variant = (Number(s.variant) || 0) + 1; // 문항 순서·입력값이 바뀐 새 문제지
    s.answers = [null, null, null, null, null];
    s.score = null;
    s.passed = null;
    s.attempts = (Number(s.attempts) || 0) + 1;
    // 이미 제출한 적이 있어도 "새 답안"은 아직 제출하지 않은 상태다.
    // 제출 횟수(count)와 시각(at)은 기록으로 남기고 상태만 되돌린다.
    var sub = submitState();
    if (sub.status === "done") sub.status = "idle";
    sub.error = "";
    // 새 답안이므로 제출·채점 순서를 처음부터 다시 밟고, 답안 잠금도 푼다.
    sub.tried = false;
    sub.locked = false;

    buildSheet(); // s.order 까지 바꾼 뒤에 저장한다
    L.state.markChanged();

    current = 0;
    renderQuestion();
    // 지난 회차의 해설·정답이 화면에 남아 있지 않게 비운다.
    ui.clear(refs.resultBody);
    setShown(refs.result, false);
    setShown(refs.quizBody, true);
    refreshQuizChrome();
    refreshBestLast();
    refs.quizFeedback.show(
      "info",
      "문항 순서와 숫자가 바뀐 <strong>새 문제지</strong>를 만들었어요. " +
        "최고 점수 <strong>" + (s.bestScore === null ? "-" : s.bestScore) + "점</strong> 은 그대로 남아 있어요.",
      "🔁"
    );
    ui.announce("새 문제지를 만들었습니다. 1번 문항부터 다시 풀어 주세요.");
    if (refs.quizBody.scrollIntoView) refs.quizBody.scrollIntoView({ block: "start" });
    // [다시 풀기] 버튼이 들어 있던 결과 패널을 숨겼으므로 포커스를 새 문항으로 옮긴다.
    focusQuestion();
  }

  /** 지금 보고 있는 문항의 첫 입력칸으로 키보드 포커스를 옮긴다. */
  function focusQuestion() {
    var first = refs.item.querySelector("input, textarea, select, button");
    if (first && typeof first.focus === "function") first.focus();
  }

  /**
   * 최고 점수 · 최근 점수 줄.
   * 명세 10.4 는 이 둘을 **항상 함께** 표시하라고 한다. 그래서
   *  - 결과 패널 안(refs.bestLast) 과
   *  - 결과 패널을 닫아 둔 동안에도 보이는 형성평가 패널 안(refs.scoreLine)
   * 두 곳에 같은 값을 쓴다. (다시 풀기 중에도 점수가 사라지지 않게 한다)
   */
  function refreshBestLast() {
    var s = st6();
    var best = s.bestScore === null || s.bestScore === undefined ? "-" : s.bestScore;
    var last = s.lastScore === null || s.lastScore === undefined ? "-" : s.lastScore;
    var record =
      "최고 점수 " + best + "점 · 최근 점수 " + last + "점 · 도전 " +
      (Number(s.attempts) || 0) + "회";

    refs.bestLast.textContent =
      "다시 풀면 문항 순서와 숫자가 바뀐 새 문제지가 나와요. 지금까지 — " + record;

    refs.scoreLine.textContent = "📌 지금까지 기록 — " + record;
    // 한 번도 채점하지 않았다면 "-점" 만 보여 줄 필요가 없으므로 숨긴다.
    setShown(refs.scoreLine, s.bestScore !== null && s.bestScore !== undefined);
  }

  /* ================================================================== */
  /* 10.5 학습 정리                                                       */
  /* ================================================================== */
  function refreshSentence() {
    var sum = summaryState();
    var multi = String(sum.multi || "").trim();
    var nested = String(sum.nested || "").trim();
    refs.multiPreview.textContent = "다중 조건문은 " + (multi || "…") + " 할 때 사용한다.";
    refs.nestedPreview.textContent = "중첩 조건문은 " + (nested || "…") + " 할 때 사용한다.";

    var bothWritten = multi !== "" && nested !== "";
    refs.btnModel.disabled = !bothWritten;
    refs.btnModel.title = bothWritten
      ? "선생님 정리 문장과 내 문장을 비교해 봐요."
      : "두 문장을 먼저 내 말로 써 보면 정리 문장을 볼 수 있어요.";
  }

  function refreshConfidence() {
    var value = st6().confidence;
    refs.confidenceBtns.forEach(function (btn) {
      var on = btn.dataset.value === String(value);
      btn.classList.toggle("is-selected", on);
      btn.setAttribute("aria-pressed", String(on));
      // 색만으로 고른 것을 나타내지 않는다(명세 11.4).
      // 글자 앞의 네모(☑ / ☐)로도 고른 것을 알 수 있게 한다.
      btn.textContent = (on ? "☑ " : "☐ ") + btn.dataset.face;
    });
  }

  /* ================================================================== */
  /* 학습 기록 내려받기 (.txt)                                             */
  /* ================================================================== */
  function buildRecordText() {
    var s = L.state.appState;
    var q6 = st6();
    var NL = "\r\n"; // 윈도우 메모장에서도 줄바꿈이 보이도록
    var out = [];
    var push = function (line) {
      out.push(line === undefined ? "" : String(line));
    };

    push("조건이 여러 개라면? · 다중 조건문과 중첩 조건문으로 판단하기");
    push("학습 기록 (저장 시각 : " + nowText() + ")");
    push("==================================================");
    push();

    push("[1] 응시자 정보 (선택 입력)");
    push("--------------------------------------------------");
    push("학번 : " + (String(student().id || "").trim() || "(입력하지 않음)"));
    push("이름 : " + (String(student().name || "").trim() || "(입력하지 않음)"));
    push("※ 학번·이름은 필수가 아닙니다. 답안을 선생님께 제출할 때만 필요해요.");
    push();

    push("[2] 형성평가 결과 (5문항 · 각 2점 · 만점 " + L.quiz.MAX_SCORE + "점)");
    push("--------------------------------------------------");
    if (!isGraded()) {
      push("아직 채점하지 않았습니다.");
    } else {
      push("총점 : " + q6.score + " / " + L.quiz.MAX_SCORE + "점");
      push("판정 : " + (q6.passed ? "이수" : "미이수") + " (6점 이상 이수)");
    }
    push(
      "최고 점수 : " + (q6.bestScore === null ? "-" : q6.bestScore) + "점 · " +
        "최근 점수 : " + (q6.lastScore === null ? "-" : q6.lastScore) + "점 · " +
        "도전 횟수 : " + (Number(q6.attempts) || 0) + "회"
    );
    push("문제지 번호(variant) : " + (Number(q6.variant) || 0));
    push();

    // 아직 채점하지 않았다면 정답·해설·정오를 기록하지 않는다.
    // (채점 전에 이 파일을 내려받아 정답을 미리 보는 일을 막는다 — 예측→실행→확인 흐름 유지)
    var showAnswerKey = isGraded();
    if (!showAnswerKey) {
      push("※ 아직 채점하지 않아 정답과 해설은 기록하지 않았어요.");
      push("   [채점하기] 를 누른 뒤 다시 내려받으면 정답·해설까지 함께 저장됩니다.");
      push();
    }

    var graded = showAnswerKey ? L.quiz.gradeAll(quiz, answers()) : null;
    quiz.forEach(function (q, i) {
      var answered = isAnswered(answers()[i]);
      // 채점 전에는 점수를 매기지 않는다.
      // (미응답을 0번 보기로 착각해 점수가 붙는 일도 함께 막힌다)
      var mark = !showAnswerKey
        ? answered ? "응답함 (채점 전)" : "미응답"
        : answered
          ? graded.details[i].correct
            ? "정답 — " + graded.details[i].earned + " / " + q.points + "점"
            : "오답 — 0 / " + q.points + "점"
          : "미응답 — 0 / " + q.points + "점";
      push("문항 " + (i + 1) + " (원문항 " + q.id + " · " + q.topic + ") : " + mark);
      // plainStem 은 태그만 걷어내므로 &gt; 같은 문자 표기가 남는다.
      // 사람이 읽는 기록 파일에서는 stripHtml 로 원래 글자(>)까지 되돌린다.
      push("  지문   : " + stripHtml(q.stem));
      if (q.code && q.code.length) {
        push("  코드   :");
        q.code.forEach(function (line) {
          push("    " + line);
        });
      }
      push("  내 답  : " + (L.quiz.answerText(q, answers()[i]) || "(응답 없음)"));
      if (showAnswerKey) {
        push("  정답   : " + L.quiz.correctText(q));
        push("  해설   : " + stripHtml(q.explain));
        push("  복습   : " + (L.quiz.REVIEW_LABEL[q.reviewStep] || q.reviewStep + "단계"));
      }
      push();
    });

    push("[3] 학습 정리 (내가 완성한 문장)");
    push("--------------------------------------------------");
    var sum = summaryState();
    push("다중 조건문은 " + (String(sum.multi || "").trim() || "(작성하지 않음)") + " 할 때 사용한다.");
    push("중첩 조건문은 " + (String(sum.nested || "").trim() || "(작성하지 않음)") + " 할 때 사용한다.");
    var conf = CONFIDENCE.filter(function (c) {
      return c.value === q6.confidence;
    })[0];
    push("자신감 : " + (conf ? conf.label : "(선택하지 않음)"));
    push();

    push("[4] 오늘의 핵심 키워드");
    push("--------------------------------------------------");
    push(KEYWORDS.join(" · "));
    push();

    push("[5] 답안 제출");
    push("--------------------------------------------------");
    var sub = submitState();
    push(
      "상태 : " +
        (sub.status === "done"
          ? "제출 완료 (" + (sub.at ? sub.at : "") + " · " + (Number(sub.count) || 0) + "회)"
          : sub.status === "failed"
            ? "제출 실패 (" + (sub.error || "사유 미상") + ")"
            : "아직 제출하지 않음")
    );
    push();

    push("※ 이 기록은 내 기기에만 저장됩니다. 필요할 때 선생님께 직접 전달해 주세요.");
    return out.join(NL);
  }

  function saveTextFile(text, fileName) {
    // UTF-8 BOM 을 붙여 윈도우 메모장에서도 한글이 깨지지 않게 한다.
    var blob = new Blob(["﻿" + text], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = el("a", { href: url, download: fileName });
    document.body.appendChild(link);
    link.click();
    if (link.parentNode) link.parentNode.removeChild(link);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function downloadRecord() {
    try {
      saveTextFile(buildRecordText(), "lesson3_7_2_학습기록.txt");
      ui.toast("학습 기록을 텍스트 파일로 저장했어요.");
      refs.endFeedback.show(
        "success",
        "학습 기록을 <strong>lesson3_7_2_학습기록.txt</strong> 파일로 저장했어요. 기록은 이 기기에만 저장됩니다."
      );
    } catch (err) {
      if (window.console) console.error("[step6] 학습 기록 저장 실패", err);
      refs.endFeedback.show(
        "error",
        "학습 기록을 저장하지 못했어요. 브라우저의 다운로드 설정을 확인한 뒤 다시 시도해 주세요."
      );
    }
  }

  /* ================================================================== */
  /* 답안 제출 (선택 기능)                                                 */
  /* ================================================================== */

  /** 쿼리(?endpoint=) > localStorage > 소스 상수 순으로 주소를 찾는다. */
  function findEndpoint() {
    if (!endpointOverridden) {
      try {
        var fromQuery = new URLSearchParams(window.location.search).get("endpoint");
        if (fromQuery) return fromQuery.trim();
      } catch (err) {
        /* file:// 등에서 실패해도 아래 경로로 계속 찾는다 */
      }
    }
    try {
      var saved = window.localStorage.getItem(ENDPOINT_KEY);
      if (saved) return saved.trim();
    } catch (err) {
      /* localStorage 를 못 쓰는 환경이면 소스 상수만 쓴다 */
    }
    return String(SUBMIT_ENDPOINT || "").trim();
  }

  function rememberEndpoint(url) {
    endpointOverridden = true;
    try {
      window.localStorage.setItem(ENDPOINT_KEY, url);
    } catch (err) {
      /* 저장을 못 해도 이번 제출에는 쓸 수 있다 */
    }
  }

  function forgetEndpoint() {
    endpointOverridden = false;
    try {
      window.localStorage.removeItem(ENDPOINT_KEY);
    } catch (err) {
      /* 못 지워도 아래 입력 대화상자로 새 주소를 받을 수 있다 */
    }
  }

  /**
   * ?endpoint=<주소> 로 한 번 열면 그 주소를 이 기기에 저장한다.
   * 배포 주소가 바뀌었을 때 링크 한 번으로 갈아끼우는 통로다.
   * (저장하지 않으면 다음에 링크 없이 열었을 때 옛 주소가 되살아난다)
   */
  function adoptEndpointFromQuery() {
    var fromQuery = "";
    try {
      fromQuery = String(new URLSearchParams(window.location.search).get("endpoint") || "").trim();
    } catch (err) {
      return;
    }
    if (!fromQuery) return;

    var stored = "";
    try {
      stored = String(window.localStorage.getItem(ENDPOINT_KEY) || "").trim();
    } catch (err) {
      /* 저장 칸을 못 읽어도 아래에서 새로 써 본다 */
    }
    if (stored === fromQuery) return;
    rememberEndpoint(fromQuery);
  }

  function endpointHost(value) {
    try {
      return new URL(String(value)).host;
    } catch (err) {
      return "";
    }
  }

  /**
   * 주소에 문제가 있으면 무엇이 잘못됐는지 한국어로 돌려준다(문제 없으면 빈 문자열).
   * 가장 흔한 실수는 **드라이브 폴더 주소**를 그대로 붙여넣는 것이다.
   */
  function endpointProblem(value) {
    var v = String(value || "").trim();
    if (!v) return "주소를 입력해 주세요.";

    var url;
    try {
      url = new URL(v);
    } catch (err) {
      return "주소 형식이 올바르지 않아요. 선생님이 알려 준 주소를 그대로 붙여넣어 주세요.";
    }

    var isLocal = url.hostname === "localhost" || url.hostname === "127.0.0.1";
    if (url.protocol !== "https:" && !(url.protocol === "http:" && isLocal)) {
      return "답안은 https:// 로 시작하는 주소로만 보낼 수 있어요.";
    }
    if (url.host === "drive.google.com" || url.host === "docs.google.com") {
      return (
        "이 주소는 <strong>구글 드라이브 폴더(또는 문서) 주소</strong>예요. " +
        "답안을 받으려면 선생님이 만든 Apps Script 웹앱 주소(.../macros/s/.../exec)가 필요해요."
      );
    }
    if (url.host === "script.google.com") {
      if (url.pathname.indexOf("/macros/s/") === -1) {
        return "Apps Script 웹앱 주소가 아니에요. 「배포 → 배포 관리」에 나오는 .../macros/s/.../exec 주소를 붙여넣어 주세요.";
      }
      if (!/\/(exec|dev)$/.test(url.pathname)) {
        return "주소 끝이 /exec 로 끝나야 해요. 웹앱 배포 주소를 다시 확인해 주세요.";
      }
    }
    return "";
  }

  /** 보내기 전에 GET 으로 연결을 확인한다(응답의 service 가 이 차시인지 본다). */
  function testEndpoint(url) {
    return fetch(url, { method: "GET", redirect: "follow" })
      .then(function (res) {
        if (!res.ok) {
          return { ok: false, message: "주소에 연결은 되지만 오류를 돌려줬어요 (HTTP " + res.status + ")." };
        }
        return res.json().then(
          function (data) {
            if (data && data.ok && String(data.service || "").indexOf(SERVICE_PREFIX) === 0) {
              return { ok: true, message: "이 주소로 답안을 보낼 수 있어요." };
            }
            return {
              ok: false,
              message: "응답은 왔지만 <strong>이 차시(2차시)의 답안 수집 주소가 아닌 것 같아요.</strong> 주소를 다시 확인해 주세요."
            };
          },
          function () {
            return {
              ok: false,
              message:
                "답안을 받는 주소가 아닌 것 같아요. 웹앱 배포 시 「액세스 권한」이 <strong>모든 사용자</strong>인지 확인해 주세요."
            };
          }
        );
      })
      .catch(function () {
        return {
          ok: false,
          message:
            "주소에 연결하지 못했어요. 주소가 맞는지, 웹앱이 <strong>모든 사용자</strong>로 배포되었는지 확인해 주세요."
        };
      });
  }

  /** 버튼이 여러 개인 간단한 선택 대화상자 (제출 실패 안내용) */
  function choiceDialog(opts) {
    var o = opts || {};
    return new Promise(function (resolve) {
      var dialog = el("dialog", { "class": "modal" });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el("div", { "class": "modal__body" }, [
          el("h2", { "class": "modal__title", text: o.title || "" }),
          el("p", { "class": "modal__text", html: o.message || "" }),
          el(
            "div",
            { "class": "modal__actions" },
            (o.options || []).map(function (opt) {
              return ui.button({
                label: opt.label,
                variant: opt.variant || "ghost",
                onClick: function () {
                  done(opt.value);
                }
              });
            })
          )
        ])
      );
      dialog.addEventListener("cancel", function (e) {
        e.preventDefault();
        done(null);
      });
      dialog.addEventListener("close", function () {
        done(null);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    });
  }

  /** 선생님이 알려 준 제출 주소를 입력받는다(연결 확인까지 한 뒤 돌려준다). */
  function askEndpoint(initial) {
    return new Promise(function (resolve) {
      var dialog = el("dialog", { "class": "modal" });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      var input = el("input", {
        type: "url",
        "class": "num-input",
        value: initial || "",
        style: { width: "100%", textAlign: "left" },
        attrs: {
          placeholder: "https://script.google.com/macros/s/.../exec",
          "aria-label": "선생님이 알려 준 제출 주소",
          autocomplete: "off",
          spellcheck: "false"
        }
      });
      var target = el("p", { "class": "panel__hint", attrs: { "aria-live": "polite" } });
      var error = el("p", { "class": "feedback__text", attrs: { "aria-live": "polite" } });

      function refreshTarget() {
        var host = endpointHost(input.value.trim());
        target.textContent = host ? "전송 대상 : " + host : "";
      }
      input.addEventListener("input", function () {
        error.textContent = "";
        refreshTarget();
      });

      var checked = "";
      var btnOk = ui.button({
        label: "주소 확인하고 계속",
        variant: "primary",
        onClick: function () {
          confirmValue();
        }
      });
      var btnForce = ui.button({
        label: "그래도 이 주소로 보내기",
        variant: "secondary",
        onClick: function () {
          // 확인에 실패했지만 학생이 직접 "그래도 보내기"를 골랐다.
          // 이미 경고를 본 뒤의 선택이므로 다시 확인하지 않고 그대로 보낸다.
          verifiedEndpoint = input.value.trim();
          done(input.value.trim());
        }
      });
      setShown(btnForce, false);

      function confirmValue() {
        var value = input.value.trim();
        var problem = endpointProblem(value);
        if (problem) {
          error.innerHTML = "⚠️ " + problem;
          setShown(btnForce, false);
          input.focus();
          return;
        }
        if (checked === value) {
          done(value);
          return;
        }
        error.textContent = "";
        btnOk.disabled = true;
        btnOk.textContent = "주소를 확인하는 중…";
        testEndpoint(value).then(function (result) {
          btnOk.disabled = false;
          btnOk.textContent = "주소 확인하고 계속";
          if (result.ok) {
            checked = value;
            verifiedEndpoint = value;
            done(value);
            return;
          }
          error.innerHTML = "⚠️ " + result.message + "<br />선생님께 <strong>제출 주소</strong>를 다시 여쭤보세요.";
          setShown(btnForce, true);
          input.focus();
        });
      }

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          confirmValue();
        }
      });

      dialog.appendChild(
        el("div", { "class": "modal__body" }, [
          el("h2", { "class": "modal__title", text: "제출 주소를 입력해 주세요" }),
          el("p", {
            "class": "modal__text",
            html:
              "선생님이 알려 주신 <strong>제출 주소</strong>를 붙여넣으면 답안이 그 주소로 저장돼요.<br />" +
              "주소는 보통 <code>https://script.google.com/macros/s/…/exec</code> 모양이에요."
          }),
          input,
          target,
          error,
          el("div", { "class": "modal__actions" }, [
            ui.button({
              label: "취소",
              variant: "ghost",
              onClick: function () {
                done(null);
              }
            }),
            btnForce,
            btnOk
          ])
        ])
      );
      dialog.addEventListener("cancel", function (e) {
        e.preventDefault();
        done(null);
      });
      dialog.addEventListener("close", function () {
        done(null);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
      refreshTarget();
      // 미리 채워 둔 주소가 이미 잘못된 주소(예: 드라이브 폴더 주소)라면 바로 알려 준다.
      var initialProblem = initial ? endpointProblem(initial) : "";
      if (initialProblem) error.innerHTML = "⚠️ " + initialProblem;
      setTimeout(function () {
        input.focus();
      }, 30);
    });
  }

  function resolveEndpoint(force) {
    var saved = findEndpoint();
    if (!force && saved && endpointProblem(saved) === "") return Promise.resolve(saved);
    return askEndpoint(saved || "").then(function (entered) {
      if (!entered) return "";
      rememberEndpoint(entered);
      return entered;
    });
  }

  /** 지금 이 기기에 저장된 제출 주소를 화면에 알려 준다. */
  function refreshEndpointState() {
    if (!refs.endpointState) return;
    var now = findEndpoint();
    if (!now) {
      refs.endpointState.textContent =
        "제출 주소가 아직 없어요. [답안 제출하기] 를 누르면 주소를 입력하는 창이 열립니다.";
      return;
    }
    var host = endpointHost(now);
    refs.endpointState.textContent =
      "지금 저장된 제출 주소 : " + (host || now) + " · 끝 " + now.slice(-14) +
      " — 선생님이 새 주소를 알려 주셨다면 [제출 주소 바꾸기] 를 누르세요.";
    refs.endpointState.title = now;
  }

  /** 배포 주소가 바뀌었을 때 저장된 주소를 새 주소로 갈아끼운다. */
  function changeEndpoint() {
    var before = findEndpoint();
    // 옛 주소를 지운 뒤 물어봐야, 취소했을 때 옛 주소가 남아 헷갈리지 않는다.
    forgetEndpoint();
    askEndpoint(before || "").then(function (entered) {
      if (!entered) {
        // 취소했으면 원래 주소를 되돌려 준다.
        if (before) rememberEndpoint(before);
        refreshEndpointState();
        refs.endFeedback.show("info", "주소를 바꾸지 않았어요. 원래 주소를 그대로 씁니다.", "💡");
        return;
      }
      rememberEndpoint(entered);

      // 앞서 «옛 주소»로 제출을 마친 상태라면, 그 제출은 새 주소에는 도착하지 않았다.
      // 새 주소로 한 번 더 보낼 수 있게 제출 잠금만 풀어 준다(답안은 계속 잠긴 채로 둔다).
      var sub = submitState();
      var resend = sub.status === "done";
      if (resend) {
        sub.status = "idle";
        L.state.markChanged();
      }

      refreshEndpointState();
      refreshQuizChrome();
      refs.endFeedback.show(
        "success",
        "제출 주소를 <strong>" + esc(endpointHost(entered) || entered) + "</strong> 로 바꿨어요. " +
          (resend
            ? "먼저 보낸 답안은 예전 주소로 갔으니, <strong>[답안 제출하기]</strong> 를 한 번 더 눌러 새 주소로 보내 주세요. (답안은 그대로 잠겨 있어요)"
            : "이제 [답안 제출하기] 를 누르면 새 주소로 전송됩니다.")
      );
      ui.announce("제출 주소를 바꿨습니다.");
    });
  }

  function newSubmissionId() {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
    } catch (err) {
      /* 아래 대체 방법을 쓴다 */
    }
    return "s-" + Date.now() + "-" + Math.random().toString(16).slice(2, 10);
  }

  /** 명세에 정해진 제출 본문을 만든다. */
  function buildSubmitPayload() {
    var s = st6();
    var graded = L.quiz.gradeAll(quiz, answers());
    var conf = CONFIDENCE.filter(function (c) {
      return c.value === s.confidence;
    })[0];

    return {
      lesson: LESSON_ID,
      studentId: String(student().id || "").trim(),
      name: String(student().name || "").trim(),
      answers: quiz.map(function (q, i) {
        return {
          questionId: q.id,
          question: L.quiz.plainStem(q),
          answer: L.quiz.answerText(q, answers()[i]),
          correctAnswer: L.quiz.correctText(q),
          isCorrect: graded.details[i].correct ? "정답" : "오답"
        };
      }),
      totalScore: graded.score,
      maxScore: L.quiz.MAX_SCORE,
      attempts: Number(s.attempts) || 1,
      summary: {
        multi: String(summaryState().multi || "").trim(),
        nested: String(summaryState().nested || "").trim()
      },
      confidence: conf ? conf.label : "",
      submissionId: newSubmissionId()
    };
  }

  /** 제출이 막힌 이유 (없으면 빈 문자열) */
  function submitBlockReason() {
    if (!SUBMIT_ENABLED) return "이 수업에서는 온라인 제출을 사용하지 않아요.";
    if (submitting) return "지금 제출하는 중이에요.";
    if (isSubmitted()) return "이미 제출했어요. 답안 제출은 한 번만 할 수 있어요.";
    if (!allAnswered()) {
      var left = [];
      answers().forEach(function (a, i) {
        if (!isAnswered(a)) left.push(i + 1 + "번");
      });
      return "아직 답하지 않은 문항이 있어요 (" + left.join(", ") + "). 5문항에 모두 답해야 제출할 수 있어요.";
    }
    if (!studentReady()) return studentBlockReason();
    return "";
  }

  function refreshSubmitUI() {
    if (!refs.btnSubmit) return;
    var reason = submitBlockReason();
    refs.btnSubmit.disabled = reason !== "";
    refs.btnSubmit.title = reason || "답안을 선생님께 보냅니다. 제출은 한 번만 할 수 있어요.";

    var sub = submitState();
    if (sub.status === "done") {
      refs.submitState.textContent =
        "제출 완료 (" + (sub.at || "") + ") · 이제 [채점하기] 로 점수를 확인할 수 있어요. 답안은 더 이상 고칠 수 없어요.";
    } else if (sub.status === "failed") {
      refs.submitState.textContent =
        "제출 실패 · " + (sub.error || "사유 미상") + " — 점수 확인을 위해 [채점하기] 는 열어 두었어요.";
    } else if (Number(sub.count) > 0) {
      // [다시 풀기] 로 새 문제지를 받은 뒤에는 "제출 완료"라고 하면 안 된다.
      refs.submitState.textContent =
        "이전 답안을 " + Number(sub.count) + "회 제출했어요. 지금 답안은 아직 제출하지 않았어요.";
    } else if (allAnswered()) {
      refs.submitState.textContent =
        "5문항에 모두 답했어요. [답안 제출하기] 를 누르면 제출됩니다. 제출은 한 번만 할 수 있어요.";
    } else {
      refs.submitState.textContent =
        "답안 제출은 5문항을 모두 답한 뒤에 한 번만 할 수 있어요.";
    }

    refreshEndpointState();
  }

  function markSubmitted(fileName) {
    var sub = submitState();
    sub.status = "done";
    sub.at = nowText();
    sub.count = (Number(sub.count) || 0) + 1;
    sub.error = "";
    sub.tried = true;
    sub.locked = true;
    L.state.markChanged();

    // 제출을 마쳤으니 답안을 잠그고 [채점하기] 를 연다.
    renderQuestion();
    refreshQuizChrome();

    refs.quizFeedback.show(
      "success",
      "답안을 제출했어요. 이제 <strong>[채점하기]</strong> 를 눌러 점수를 확인해요.<br />" +
        "제출은 한 번뿐이라 답안은 더 이상 고칠 수 없어요.",
      "🎉"
    );
    refs.endFeedback.show(
      "success",
      "<strong>" + esc(studentLabel()) + "</strong> 님의 답안을 제출했어요." +
        (fileName ? " (저장 파일 : " + esc(fileName) + ")" : ""),
      "🎉"
    );
    ui.announce("답안을 제출했습니다. 이제 채점하기 버튼을 누를 수 있습니다.");
    if (refs.btnGrade && !refs.btnGrade.disabled && typeof refs.btnGrade.focus === "function") {
      refs.btnGrade.focus();
    }
  }

  function handleSubmitFailure(message) {
    var sub = submitState();
    sub.status = "failed";
    sub.error = message || "알 수 없는 오류";
    // 제출이 안 된다고 점수까지 못 보게 하면 수업이 막힌다. 시도한 사실만 남기고 채점은 열어 준다.
    sub.tried = true;
    L.state.markChanged();
    refreshQuizChrome();

    refs.endFeedback.show(
      "error",
      "답안을 제출하지 못했어요. <strong>제출 주소</strong>와 <strong>인터넷 연결</strong>을 확인한 뒤 다시 시도해 주세요.<br />" +
        "점수 확인이 막히지 않도록 <strong>[채점하기]</strong> 는 열어 두었어요."
    );

    return choiceDialog({
      title: "답안을 제출하지 못했어요",
      message:
        "오류 내용 : <strong>" + esc(sub.error) + "</strong><br /><br />" +
        "자주 있는 원인이에요.<br />" +
        "· 제출 주소가 <strong>드라이브 폴더 주소</strong>인 경우 → Apps Script 웹앱 주소(.../macros/s/.../exec)가 필요해요.<br />" +
        "· 웹앱 배포 시 <strong>액세스 권한</strong>이 「모든 사용자」가 아닌 경우<br />" +
        "· 인터넷 연결이 끊긴 경우<br /><br />어떻게 할까요?",
      options: [
        { label: "닫기", value: "close", variant: "ghost" },
        { label: "답안 파일로 저장", value: "download", variant: "secondary" },
        { label: "주소 다시 입력", value: "endpoint", variant: "primary" }
      ]
    }).then(function (choice) {
      if (choice === "download") {
        downloadSubmissionJson();
      } else if (choice === "endpoint") {
        try {
          window.localStorage.removeItem(ENDPOINT_KEY);
        } catch (err) {
          /* 무시 */
        }
        endpointOverridden = true; // 쿼리 주소로 되돌아가지 않게 한다
        submitAnswers(true);
      }
    });
  }

  /** 제출 실패 시 대비책 : 제출 본문을 파일로 저장한다. */
  function downloadSubmissionJson() {
    try {
      var payload = buildSubmitPayload();
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var link = el("a", {
        href: url,
        // 드라이브에 저장되는 이름과 같은 형식으로 맞춘다 (예: 10101_전지현.json)
        download: (payload.studentId || "학번없음") + "_" + (payload.name || "이름없음") + ".json"
      });
      document.body.appendChild(link);
      link.click();
      if (link.parentNode) link.parentNode.removeChild(link);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      refs.endFeedback.show(
        "info",
        "답안을 <strong>파일로 저장</strong>했어요. 이 파일을 선생님께 전달하면 제출한 것으로 인정돼요.",
        "💡"
      );
    } catch (err) {
      if (window.console) console.error("[step6] 답안 파일 저장 실패", err);
      refs.endFeedback.show("error", "답안 파일을 저장하지 못했어요. 브라우저의 다운로드 설정을 확인해 주세요.");
    }
  }

  /** 확인을 마친 주소로 답안을 실제로 보낸다. */
  function postPayload(endpoint) {
    refs.endFeedback.show(
      "info",
      "답안을 제출하는 중이에요… (전송 대상 " + esc(endpointHost(endpoint) || endpoint) + ")",
      "📨"
    );

    // Apps Script 웹앱은 text/plain 으로 보내면 사전 요청(preflight) 없이 그대로 전달된다.
    return fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(buildSubmitPayload()),
      redirect: "follow"
    })
      .then(function (res) {
        return res.json().then(
          function (data) {
            return { res: res, data: data };
          },
          function () {
            return { res: res, data: null };
          }
        );
      })
      .then(function (wrapped) {
        submitting = false;
        if (!wrapped.res.ok) {
          return handleSubmitFailure("서버가 오류를 돌려줬어요 (HTTP " + wrapped.res.status + ")");
        }
        if (wrapped.data && wrapped.data.ok === false) {
          return handleSubmitFailure(wrapped.data.error || "서버가 저장을 거부했습니다.");
        }
        markSubmitted(wrapped.data && wrapped.data.fileName ? wrapped.data.fileName : "");
        return null;
      })
      .catch(function (err) {
        // 확인할 수 없는 전송은 성공으로 표시하지 않는다.
        submitting = false;
        return handleSubmitFailure((err && err.message) || "네트워크 오류");
      });
  }

  function submitAnswers(forceEndpoint) {
    var reason = submitBlockReason();
    if (reason) {
      refs.endFeedback.show("warning", esc(reason));
      ui.announce(reason);
      return;
    }

    // 명세 11.7 : 개인정보가 전송된다는 사실을 반드시 먼저 알린다.
    var ask = forceEndpoint
      ? Promise.resolve(true)
      : ui.confirmDialog({
          title: "답안을 제출할까요?",
          message:
            "⚠️ <strong>답안 제출은 한 번만 할 수 있어요.</strong><br />" +
            "제출한 뒤에는 <strong>답을 고칠 수 없고</strong>, 그다음에 [채점하기] 로 점수를 확인하게 됩니다.<br /><br />" +
            "제출하면 다음 내용이 <strong>선생님이 알려 준 주소</strong>로 전송됩니다.<br />" +
            "· 학번 <strong>" + esc(String(student().id || "").trim()) + "</strong> · " +
            "이름 <strong>" + esc(String(student().name || "").trim()) + "</strong><br />" +
            "· 문항별 답안과 정오 · 총점 · 학습 정리 문장 · 자신감 응답<br /><br />" +
            "답을 더 확인하고 싶으면 [취소] 를 누르고 문항을 다시 살펴봐도 괜찮아요.",
          okLabel: "제출하기",
          cancelLabel: "취소",
          dismissValue: false
        });

    ask.then(function (goOn) {
      if (!goOn) {
        refs.endFeedback.show("info", "제출을 취소했어요. 답을 더 확인한 뒤 제출해도 괜찮아요.", "💡");
        return;
      }

      submitting = true;
      refreshSubmitUI();

      resolveEndpoint(forceEndpoint === true)
        .then(function (endpoint) {
          if (!endpoint) {
            submitting = false;
            refreshSubmitUI();
            refs.endFeedback.show(
              "warning",
              "제출 주소를 입력해야 답안을 보낼 수 있어요. 선생님께 주소를 여쭤보세요."
            );
            return null;
          }

          // 보내기 전에 GET 으로 연결을 확인한다(응답의 service 가 이 차시인지 본다).
          if (endpoint === verifiedEndpoint) return postPayload(endpoint);

          refs.endFeedback.show("info", "제출 주소가 맞는지 먼저 확인하고 있어요…", "🔍");
          return testEndpoint(endpoint).then(function (check) {
            if (!check.ok) {
              submitting = false;
              return handleSubmitFailure(stripHtml(check.message));
            }
            verifiedEndpoint = endpoint;
            return postPayload(endpoint);
          });
        })
        .then(function () {
          submitting = false;
          refreshSubmitUI();
        });
    });
  }
