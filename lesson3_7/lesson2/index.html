    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 15px;
  cursor: pointer;
}

.select:hover {
  border-color: var(--color-primary);
}

        el('option', { value: String(option.value), text: option.label })
      );
    });
    if (o.value !== undefined && o.value !== null) sel.value = String(o.value);
    if (o.onChange) {
      sel.addEventListener('change', function () {
        o.onChange(sel.value);
      });
    }
    return {
      root: o.label
        ? el('div', { 'class': 'field' }, [
            el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }),
            sel
          ])
        : sel,
      select: sel,
      getValue: function () {
        return sel.value;
      },
      setValue: function (v) {
        sel.value = v === undefined || v === null ? '' : String(v);
      }
    };
  }

  /* ------------------------ 실행 결과 출력 창 ------------------------ */
  function createConsole(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '실행 버튼을 누르면 결과가 여기에 표시돼요.';
    var body = el('div', {
      'class': 'console__body',
      attrs: {
        role: 'log',
        'aria-live': 'polite',
        'aria-label': o.ariaLabel || '프로그램 실행 결과',
        tabindex: '0'
      }
    });
    var root = el('div', { 'class': 'console' }, [
      el('div', { 'class': 'console__head' }, [
        el('span', { 'class': 'console__dot' }),
        el('span', { text: o.title || '실행 결과' })
      ]),
      body
    ]);

    function showEmpty() {
      clear(body);
      body.appendChild(el('p', { 'class': 'console__empty', text: emptyText }));
    }

    function line(text, modifier) {
      if (body.querySelector('.console__empty')) clear(body);
      var node = el('div', { 'class': ('console__line ' + (modifier || '')).trim() }, [
        el('span', { 'class': 'console__prompt', text: '>' }),
        el('span', { 'class': 'console__text', text: text })
      ]);
      body.appendChild(node);
      body.scrollTop = body.scrollHeight;
      return node;
    }

    showEmpty();

    return {
      root: root,
      body: body,
      write: function (text) {
        return line(text);
      },
      writeMuted: function (text) {
        return line(text, 'console__line--muted');
      },
      writeError: function (text) {
        return line(text, 'console__line--error');
      },
      writeHint: function (text) {
        return line(text, 'console__line--hint');
      },
      clear: showEmpty,
      isEmpty: function () {
        return Boolean(body.querySelector('.console__empty'));
      }
    };
  }

  /* ------------------------ 피드백 영역 ------------------------ */
  var FEEDBACK_ICON = { success: '✅', info: '💡', warning: '⚠️', error: '❌' };

  function createFeedback(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '조작하면 이곳에 안내가 표시돼요.';
    var icon = el('span', { 'class': 'feedback__icon', text: '💬' });
    var textNode = el('div', { 'class': 'feedback__text', text: emptyText });
    var root = el('div', {
      'class': 'feedback is-empty',
      attrs: { 'aria-live': 'assertive', role: 'status' }
    });
    root.appendChild(icon);
    root.appendChild(textNode);

    return {
      root: root,
      /**
       * @param {'success'|'info'|'warning'|'error'} type
       * @param {string} html 표시할 내용(HTML 허용)
       * @param {string} [customIcon] 🎉 · 🏅 등 다른 아이콘을 쓰고 싶을 때
       */
      show: function (type, html, customIcon) {
        root.className = 'feedback feedback--' + type;
        icon.textContent = customIcon || FEEDBACK_ICON[type] || '💬';
        textNode.innerHTML = html;
      },
      clear: function () {
        root.className = 'feedback is-empty';
        icon.textContent = '💬';
        textNode.textContent = emptyText;
      }
    };
  }

  /* ------------------------------ 배지 · 표 ------------------------------ */
  function badge(kind, text) {
    var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
    return el('span', { 'class': ('badge ' + (map[kind] || '')).trim(), text: text });
  }

  function boolBadge(value) {
    return badge(value ? 'true' : 'false', value ? '○ 참(True)' : '× 거짓(False)');
  }

  function dataTable(opts) {
    var o = opts || {};
    var head = o.head || [];
    var rows = o.rows || [];
    var table = el('table', { 'class': ('data-table ' + (o.className || '')).trim() }, [
      o.caption ? el('caption', { 'class': 'sr-only', text: o.caption }) : null,
      el('thead', {}, [
        el(
          'tr',
          {},
          head.map(function (h) {
            return el('th', { scope: 'col', html: h });
          })
        )
      ]),
      el(
        'tbody',
        {},
        rows.map(function (row) {
          return el(
            'tr',
            {},
            row.map(function (cell, i) {
              var tag = i === 0 ? 'th' : 'td';
              var props = i === 0 ? { scope: 'row' } : {};
              if (cell instanceof Node) {
                var td = el(tag, props);
                td.appendChild(cell);
                return td;
              }
              props.html = cell;
              return el(tag, props);
            })
          );
        })
      )
    ]);
    return el('div', { 'class': 'table-scroll' }, [table]);
  }

  function callout(html, opts) {
    var o = opts || {};
    return el('div', { 'class': ('callout ' + (o.muted ? 'callout--muted' : '')).trim(), html: html });
  }

  /** 🏅 배지 카드 (명세 9.11 · 이번 차시 추가 헬퍼) */
  function award(opts) {
    var o = opts || {};
    return el('div', { 'class': 'award' }, [
      el('span', { 'class': 'award__icon', text: o.icon || '🏅', attrs: { 'aria-hidden': 'true' } }),
      el('div', { 'class': 'award__body' }, [
        el('p', { 'class': 'award__title', text: o.title || '' }),
        o.text ? el('p', { 'class': 'award__text', html: o.text }) : null
      ])
    ]);
  }

  /** 보충 학습 바로가기 줄 (명세 10.3 · 이번 차시 추가 헬퍼) */
  function linkLine(opts) {
    var o = opts || {};
    return el('div', { 'class': 'linkline' }, [
      el('span', { 'class': 'linkline__label', html: o.text || '' }),
      button({
        label: o.label || o.step + '단계로 이동',
        variant: 'secondary',
        className: 'linkline__link',
        ariaLabel: o.step + '단계 화면으로 이동',
        onClick: function () {
          L.nav.goToStep(o.step, { force: true });
        }
      })
    ]);
  }

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {
    var region = document.getElementById('toast-region');
    if (!region) return;
    var node = el('div', { 'class': 'toast', text: message });
    region.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, duration || 2600);
  }

  function announce(message) {
    var live = document.getElementById('sr-live');
    if (!live) return;
    live.textContent = '';
    setTimeout(function () {
      live.textContent = message;
    }, 30);
  }

  /**
   * 확인 대화상자 (저장된 진행 복원 · 초기화 확인)
   * dismissValue: Esc 키·백드롭 등으로 그냥 닫았을 때 돌려줄 값.
   */
  function confirmDialog(opts) {
    var o = opts || {};
    var dismissValue = o.dismissValue === undefined ? false : o.dismissValue;
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,
      tabindex: '0',
      dataset: { tip: tip },
      attrs: { 'aria-label': text + '. ' + tip }
    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');
    });
    return node;
  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;
  ui.badge = badge;
  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;
})();
    </script>
    <script data-from="js/20-codeview.js">
/**
 * 파이썬 코드 표시 컴포넌트 (명세 11.2 코드 표시 / 11.3 조건 실행 상태)
 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (중첩 조건의 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시
 *
 * 이번 차시에서 추가된 것 : setState(index, 'unchecked')
 *   → 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다(명세 11.3 '검사 안 함').
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  var KEYWORDS = /^(if|else|elif|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range)$/;

  var TOKEN_RE = /(\b(?:if|else|elif|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\/\/|[%+\-*/<>=])/g;

  function span(cls, textContent) {
    return '<span class="' + cls + '">' + escapeHtml(textContent) + '</span>';
  }

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */
  function highlightSegment(segment) {
    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);
    }
    if (last < segment.length) out += escapeHtml(segment.slice(last));
    return out;
  }

  /**
   * 파이썬 한 줄(들여쓰기 제외)을 하이라이팅한 HTML 문자열로 바꾼다.
   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.
   */
  function highlightPython(source) {
    var src = String(source === undefined || source === null ? '' : source);
    var out = '';
    var i = 0;
    var buffer = '';

    var flush = function () {
      if (buffer) {
        out += highlightSegment(buffer);
        buffer = '';
      }
    };

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {
        flush();
        out += span('tok-comment', src.slice(i));
        return out;
      }
      if (ch === '"' || ch === "'") {
        flush();
        var j = i + 1;
        while (j < src.length && src[j] !== ch) {
          if (src[j] === '\\') j += 1;
          j += 1;
        }
        out += span('tok-str', src.slice(i, Math.min(j + 1, src.length)));
        i = j + 1;
        continue;
      }
      buffer += ch;
      i += 1;
    }
    flush();
    return out;
  }

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */
  function indentHtml(spaces) {
    if (spaces <= 0) return '';
    var html = '';
    var left = spaces;
    var first = true;
    while (left > 0) {
      var width = Math.min(4, left);
      html +=
        '<span class="indent' +
        (first ? ' indent--first' : '') +
        '"' +
        (width === 4 ? '' : ' style="width:' + width + 'ch"') +
        '></span>';
      left -= width;
      first = false;
    }
    return html;
  }

  function splitIndent(code) {
    var normalized = String(code === undefined || code === null ? '' : code).replace(/\t/g, '    ');
    var match = normalized.match(/^ */);
    var spaces = match ? match[0].length : 0;
    return { spaces: spaces, rest: normalized.slice(spaces) };
  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{
   *   code?: string,                 // 원본 코드 한 줄(앞 공백 = 들여쓰기)
   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁
   * }>
   */
  function createCodeView(opts) {
    var o = opts || {};
    var showLineNumbers = o.showLineNumbers !== false;
    var linesWrap = el('div', { 'class': 'codeview__lines' });
    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);
    var head =
      o.title || o.headExtra
        ? el('div', { 'class': 'codeview__head' }, [
            o.title ? el('span', { 'class': 'codeview__title', html: o.title }) : el('span'),
            o.headExtra || null
          ])
        : null;
    var children = [];
    if (head) children.push(head);
    children.push(scroll);
    var root = el(
      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },
      children
    );

    var current = [];
    var lineEls = [];

    function build(nextLines) {
      current = nextLines || [];
      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }
        });

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.
        var usesParts = Array.isArray(line.parts);
        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  L.codeview = {
    createCodeView: createCodeView,
    highlightPython: highlightPython
  };
})();
    </script>
    <script data-from="js/40-engine.js">
/**
 * 실행 엔진 (명세 11.6 파이썬 실행 방식 · 12장 원본 프로그램 체크리스트)
 *
 * 실제 파이썬을 실행하지 않는다. 명세에 적힌 두 원본 프로그램만을 대상으로
 * "조건을 위에서 아래로 검사하는 과정" 을 JavaScript 로 시뮬레이션한다.
 *
 * 조건 상태는 언제나 네 가지 중 하나다.
 *   'true'      — 검사했고 참
 *   'false'     — 검사했고 거짓
 *   'unchecked' — 앞에서 실행할 블록이 정해져 아예 검사하지 않음(명세 11.3)
 *   'executed'  — else 처럼 조건식은 없지만 그 블록이 실행됨
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  var S = {
    TRUE: 'true',
    FALSE: 'false',
    SKIP: 'unchecked',
    RUN: 'executed'
  };

  /* ------------------------------------------------------------------ */
  /* 원본 프로그램 1 : 탄소 절감률 에코 마일리지 (명세 6.2)                 */
  /* ------------------------------------------------------------------ */
  var ECO_LINES = [
    "reduce = int(input('탄소 절감률을 입력하세요: '))",
    'if reduce >= 10:',
    "    mileage = '3만 마일리지'",
    'elif reduce >= 5:',
    "    mileage = '1만 마일리지'",
    'else:',
    "    mileage = '마일리지 없음'",
    "print(f'지급된 에코 마일리지: {mileage}')"
  ];

  /** 줄별 한국어 설명 (명세 6.3) */
  var ECO_NOTES = [
    '탄소 절감률을 정수로 입력받아 reduce 변수에 저장',
    '탄소 절감률이 10% 이상인지 확인',
    '첫 조건이 참이면 3만 마일리지',
    '첫 조건이 거짓인 상태에서 5% 이상인지 확인',
    '두 번째 조건이 참이면 1만 마일리지',
    '위 두 조건이 모두 거짓이면 실행',
    '5% 미만',
    '최종 결정된 마일리지 출력'
  ];

  /** 빠른 예시 버튼 값 (명세 6.4) */
  var ECO_EXAMPLES = [12, 10, 7, 5, 3];

  var ECO_EXPR = { c1: 'reduce >= 10', c2: 'reduce >= 5' };

  /* ------------------------------------------------------------------ */
  /* 원본 프로그램 2 : 상점 추가 지급 중첩 조건 (명세 9.2)                  */
  /* ------------------------------------------------------------------ */
  // 주석 1줄을 포함해 모두 13줄이다(0-based 인덱스 0~12).
  var BONUS_LINES = [
    '# 상점을 받았는지 여부 입력',
    "bonus_received = input('수업 시간에 상점을 받았나요? (y / n): ')",
    "if bonus_received == 'y':",
    "    score = int(input('받은 상점의 점수를 입력하세요 (1~50): '))",
    '    if score >= 10:',
    '        extra = 3',
    '    elif score >= 5:',
    '        extra = 2',
    '    else:',
    '        extra = 1',
    "    print(f'추가로 부여된 상점은 {extra}점입니다.')",
    'else:',
    "    print('상점을 받지 않았으므로 추가 상점이 없습니다.')"
  ];

  var BONUS_NOTES = [
    '무엇을 입력받는지 알려 주는 주석',
    "상점을 받았는지 y / n 으로 입력받아 bonus_received 에 저장",
    "바깥 조건 : 상점을 받았는지 확인 (여기가 True 일 때만 안쪽을 검사한다)",
    '상점을 받은 경우에만 상점 점수를 입력받는다',
    '안쪽 조건 1 : 받은 상점이 10점 이상인지 확인',
    '10점 이상이면 추가 상점 3점',
    '안쪽 조건 2 : (10점 미만인 상태에서) 5점 이상인지 확인',
    '5점 이상 10점 미만이면 추가 상점 2점',
    '안쪽 두 조건이 모두 거짓일 때 실행',
    '5점 미만이면 추가 상점 1점',
    '결정된 추가 상점을 출력',
    '바깥 조건이 거짓일 때 실행',
    '상점을 받지 않았으므로 추가 상점이 없다고 출력'
  ];

  var BONUS_EXPR = {
    outer: "bonus_received == 'y'",
    i1: 'score >= 10',
    i2: 'score >= 5'
  };

  /* ------------------------------------------------------------------ */
  /* 보조 프로그램 : 점수 등급 (명세 7.3 실행 추적표)                       */
  /* ------------------------------------------------------------------ */
  var GRADE_LINES = [
    'if score >= 90:',
    "    print('A')",
    'elif score >= 80:',
    "    print('B')",
    'elif score >= 70:',
    "    print('C')",
    'else:',
    "    print('D')"
  ];

  var GRADE_NOTES = [
    '90점 이상인지 확인',
    '90점 이상이면 A',
    '(90점 미만인 상태에서) 80점 이상인지 확인',
    '80점 이상 90점 미만이면 B',
    '(80점 미만인 상태에서) 70점 이상인지 확인',
    '70점 이상 80점 미만이면 C',
    '위 세 조건이 모두 거짓이면 실행',
    '70점 미만이면 D'
  ];

  /* ------------------------------------------------------------------ */
  /* 보조 프로그램 : 조건 순서 오류 / 올바른 순서 (명세 7.1 / 7.2)          */
  /* ------------------------------------------------------------------ */
  var WRONG_ORDER_LINES = [
    'if score >= 70:',
    '    print("C 이상")',
    'elif score >= 90:',
    '    print("A")'
  ];

  var RIGHT_ORDER_LINES = [
    'if score >= 90:',
    '    print("A")',
    'elif score >= 70:',
    '    print("C 이상")'
  ];

  /* ------------------------------------------------------------------ */
  /* 공용 도우미                                                          */
  /* ------------------------------------------------------------------ */
  function toInt(value, fallback) {
    var n = Number(value);
    if (isNaN(n) || !isFinite(n)) return fallback;
    return Math.trunc(n);
  }

  function snapshot(vars) {
    var out = {};
    Object.keys(vars).forEach(function (key) {
      out[key] = vars[key];
    });
    return out;
  }

  var DESC = {
    skipCond: '앞에서 실행할 블록이 이미 정해졌으므로 이 조건은 검사하지 않습니다.',
    skipBody: '검사하지 않은 조건의 블록이라 실행하지 않습니다.',
    falseBody: '조건이 거짓이므로 이 줄은 실행하지 않습니다.'
  };

  /** 조건 한 줄의 한국어 설명을 만든다. 예) reduce 는 7 이므로 7 >= 10 → False ✕ */
  function condDesc(name, value, expr, result) {
    var shown = expr.replace(name, String(value));
    return (
      name + ' 는 ' + value + ' 이므로 ' + shown + ' → ' + (result ? 'True ✓' : 'False ✕') + ' 입니다.'
    );
  }

  /* ------------------------------------------------------------------ */
  /* 규칙 함수                                                            */
  /* ------------------------------------------------------------------ */

  /** 명세 6.1 규칙 표 */
  function ecoRule(reduce) {
    var n = toInt(reduce, 0);
    if (n >= 10) return '3만 마일리지';
    if (n >= 5) return '1만 마일리지';
    return '마일리지 없음';
  }

  /** 명세 9.3 규칙 표 (상점을 받은 경우에만 쓰인다) */
  function bonusExtra(score) {
    var n = toInt(score, 0);
    if (n >= 10) return 3;
    if (n >= 5) return 2;
    return 1;
  }

  /* ------------------------------------------------------------------ */
  /* 입력 검증 (명세 6.4 / 9.10)                                          */
  /* ------------------------------------------------------------------ */
  function validateReduce(raw) {
    var text = String(raw === undefined || raw === null ? '' : raw).trim();
    if (text === '') return { ok: false, value: null, message: '숫자로 입력해 주세요.' };
    if (!/^-?\d+$/.test(text)) return { ok: false, value: null, message: '숫자로 입력해 주세요.' };
    var n = Number(text);
    if (n < 0) {
      return {
        ok: false,
        value: null,
        message: '탄소 절감률 예제는 0 이상의 값을 사용해 주세요.'
      };
    }
    if (n > 100) {
      return {
        ok: false,
        value: null,
        message: '탄소 절감률은 100 이하의 값을 사용해 주세요.'
      };
    }
    return { ok: true, value: n, message: '' };
  }

  function validateScore(raw) {
    var text = String(raw === undefined || raw === null ? '' : raw).trim();
    var message = '1~50 사이의 정수로 입력해 주세요.';
    if (text === '') return { ok: false, value: null, message: message };
    if (!/^-?\d+$/.test(text)) return { ok: false, value: null, message: message };
    var n = Number(text);
    if (n < 1 || n > 50) return { ok: false, value: null, message: message };
    return { ok: true, value: n, message: '' };
  }

  /** 대문자 Y / N 은 소문자로 정규화한다. 그 밖의 값은 null. */
  function normalizeYN(raw) {
    var text = String(raw === undefined || raw === null ? '' : raw).trim().toLowerCase();
    if (text === 'y') return 'y';
    if (text === 'n') return 'n';
    return null;
  }

  /* ------------------------------------------------------------------ */
  /* 프로그램 1 실행 : runEco(reduce)                                     */
  /* ------------------------------------------------------------------ */
  function runEco(reduceRaw) {
    var reduce = toInt(reduceRaw, 0);
    var vars = { reduce: reduce };
    var trace = [];
    var status = { c1: S.SKIP, c2: S.SKIP, els: S.SKIP };

    function push(line, kind, extra) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(extra || {}).forEach(function (key) {
        step[key] = extra[key];
      });
      trace.push(step);
    }

    // 1줄 : 입력
    push(0, 'input', {
      status: S.RUN,
      desc: '입력값 ' + reduce + ' 을(를) reduce 에 저장했어요.'
    });

    if (reduce >= 10) {
      status.c1 = S.TRUE;
      push(1, 'cond', {
        expr: ECO_EXPR.c1,
        status: S.TRUE,
        condId: 'c1',
        desc: condDesc('reduce', reduce, ECO_EXPR.c1, true) + ' 첫 번째 조건이 참이므로 바로 아래 블록을 실행합니다.'
      });
      vars.mileage = '3만 마일리지';
      push(2, 'assign', {
        status: S.RUN,
        desc: "mileage 에 '3만 마일리지' 를 저장했어요."
      });
      status.c2 = S.SKIP;
      push(3, 'cond', { expr: ECO_EXPR.c2, status: S.SKIP, condId: 'c2', desc: DESC.skipCond });
      push(4, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      status.els = S.SKIP;
      push(5, 'cond', { expr: 'else', status: S.SKIP, condId: 'else', desc: DESC.skipCond });
      push(6, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    } else if (reduce >= 5) {
      status.c1 = S.FALSE;
      push(1, 'cond', {
        expr: ECO_EXPR.c1,
        status: S.FALSE,
        condId: 'c1',
        desc: condDesc('reduce', reduce, ECO_EXPR.c1, false) + ' 다음 조건으로 내려갑니다.'
      });
      push(2, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      status.c2 = S.TRUE;
      push(3, 'cond', {
        expr: ECO_EXPR.c2,
        status: S.TRUE,
        condId: 'c2',
        desc:
          condDesc('reduce', reduce, ECO_EXPR.c2, true) +
          ' 여기까지 왔다는 것은 이미 reduce 가 10 미만이라는 뜻이에요.'
      });
      vars.mileage = '1만 마일리지';
      push(4, 'assign', {
        status: S.RUN,
        desc: "mileage 에 '1만 마일리지' 를 저장했어요."
      });
      status.els = S.SKIP;
      push(5, 'cond', { expr: 'else', status: S.SKIP, condId: 'else', desc: DESC.skipCond });
      push(6, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    } else {
      status.c1 = S.FALSE;
      push(1, 'cond', {
        expr: ECO_EXPR.c1,
        status: S.FALSE,
        condId: 'c1',
        desc: condDesc('reduce', reduce, ECO_EXPR.c1, false) + ' 다음 조건으로 내려갑니다.'
      });
      push(2, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      status.c2 = S.FALSE;
      push(3, 'cond', {
        expr: ECO_EXPR.c2,
        status: S.FALSE,
        condId: 'c2',
        desc: condDesc('reduce', reduce, ECO_EXPR.c2, false) + ' 이제 남은 것은 else 뿐입니다.'
      });
      push(4, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      status.els = S.RUN;
      push(5, 'cond', {
        expr: 'else',
        status: S.RUN,
        condId: 'else',
        desc: '두 조건이 모두 False 이므로 else 블록을 실행합니다.'
      });
      vars.mileage = '마일리지 없음';
      push(6, 'assign', {
        status: S.RUN,
        desc: "mileage 에 '마일리지 없음' 을 저장했어요."
      });
    }

    var output = '지급된 에코 마일리지: ' + vars.mileage;
    push(7, 'print', {
      status: S.RUN,
      output: output,
      desc: '최종 결정된 마일리지를 출력합니다 → ' + output
    });

    return {
      input: reduce,
      mileage: vars.mileage,
      output: output,
      vars: snapshot(vars),
      conditions: [
        { id: 'c1', expr: ECO_EXPR.c1, status: status.c1 },
        { id: 'c2', expr: ECO_EXPR.c2, status: status.c2 },
        { id: 'else', expr: 'else', status: status.els }
      ],
      trace: trace,
      lines: ECO_LINES
    };
  }

  /* ------------------------------------------------------------------ */
  /* 프로그램 2 실행 : runBonus(bonusReceived, score)                     */
  /* ------------------------------------------------------------------ */
  function runBonus(receivedRaw, scoreRaw) {
    var received = normalizeYN(receivedRaw) || 'n';
    var score = toInt(scoreRaw, 0);
    var vars = {};
    var trace = [];
    var status = { outer: S.FALSE, i1: S.SKIP, i2: S.SKIP, ielse: S.SKIP };
    var extra = null;
    var output = '';

    function push(line, kind, more) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(more || {}).forEach(function (key) {
        step[key] = more[key];
      });
      trace.push(step);
    }

    // 2줄 : 상점 수령 여부 입력 (1줄은 주석이라 실행 흐름에 나타나지 않는다)
    vars.bonus_received = received;
    push(1, 'input', {
      status: S.RUN,
      desc: "입력값 '" + received + "' 을(를) bonus_received 에 저장했어요."
    });

    if (received === 'y') {
      status.outer = S.TRUE;
      push(2, 'cond', {
        expr: BONUS_EXPR.outer,
        status: S.TRUE,
        condId: 'outer',
        desc: "bonus_received 가 'y' 이므로 바깥 조건은 True ✓ 입니다. 이제 안쪽 조건을 검사합니다."
      });

      vars.score = score;
      push(3, 'input', {
        status: S.RUN,
        desc: '상점을 받았으므로 점수 ' + score + ' 을(를) 입력받아 score 에 저장했어요.'
      });

      if (score >= 10) {
        status.i1 = S.TRUE;
        push(4, 'cond', {
          expr: BONUS_EXPR.i1,
          status: S.TRUE,
          condId: 'i1',
          desc: condDesc('score', score, BONUS_EXPR.i1, true)
        });
        extra = 3;
        vars.extra = 3;
        push(5, 'assign', { status: S.RUN, desc: 'extra 에 3 을 저장했어요.' });
        status.i2 = S.SKIP;
        push(6, 'cond', { expr: BONUS_EXPR.i2, status: S.SKIP, condId: 'i2', desc: DESC.skipCond });
        push(7, 'skip', { status: S.SKIP, desc: DESC.skipBody });
        status.ielse = S.SKIP;
        push(8, 'cond', { expr: 'else', status: S.SKIP, condId: 'ielse', desc: DESC.skipCond });
        push(9, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      } else if (score >= 5) {
        status.i1 = S.FALSE;
        push(4, 'cond', {
          expr: BONUS_EXPR.i1,
          status: S.FALSE,
          condId: 'i1',
          desc: condDesc('score', score, BONUS_EXPR.i1, false) + ' 다음 조건으로 내려갑니다.'
        });
        push(5, 'skip', { status: S.SKIP, desc: DESC.falseBody });
        status.i2 = S.TRUE;
        push(6, 'cond', {
          expr: BONUS_EXPR.i2,
          status: S.TRUE,
          condId: 'i2',
          desc: condDesc('score', score, BONUS_EXPR.i2, true)
        });
        extra = 2;
        vars.extra = 2;
        push(7, 'assign', { status: S.RUN, desc: 'extra 에 2 를 저장했어요.' });
        status.ielse = S.SKIP;
        push(8, 'cond', { expr: 'else', status: S.SKIP, condId: 'ielse', desc: DESC.skipCond });
        push(9, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      } else {
        status.i1 = S.FALSE;
        push(4, 'cond', {
          expr: BONUS_EXPR.i1,
          status: S.FALSE,
          condId: 'i1',
          desc: condDesc('score', score, BONUS_EXPR.i1, false) + ' 다음 조건으로 내려갑니다.'
        });
        push(5, 'skip', { status: S.SKIP, desc: DESC.falseBody });
        status.i2 = S.FALSE;
        push(6, 'cond', {
          expr: BONUS_EXPR.i2,
          status: S.FALSE,
          condId: 'i2',
          desc: condDesc('score', score, BONUS_EXPR.i2, false) + ' 이제 남은 것은 else 뿐입니다.'
        });
        push(7, 'skip', { status: S.SKIP, desc: DESC.falseBody });
        status.ielse = S.RUN;
        push(8, 'cond', {
          expr: 'else',
          status: S.RUN,
          condId: 'ielse',
          desc: '안쪽 두 조건이 모두 False 이므로 else 블록을 실행합니다.'
        });
        extra = 1;
        vars.extra = 1;
        push(9, 'assign', { status: S.RUN, desc: 'extra 에 1 을 저장했어요.' });
      }

      output = '추가로 부여된 상점은 ' + extra + '점입니다.';
      push(10, 'print', {
        status: S.RUN,
        output: output,
        desc: '추가 상점을 출력합니다 → ' + output
      });
      push(11, 'cond', {
        expr: 'else',
        status: S.SKIP,
        desc: '바깥 조건이 True 였으므로 바깥 else 는 실행하지 않습니다.'
      });
      push(12, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    } else {
      status.outer = S.FALSE;
      push(2, 'cond', {
        expr: BONUS_EXPR.outer,
        status: S.FALSE,
        condId: 'outer',
        desc:
          "bonus_received 가 'y' 가 아니므로 바깥 조건은 False ✕ 입니다. 안쪽은 아예 검사하지 않습니다."
      });
      // 명세 9.4 사례 A : score 입력 줄도 '검사하지 않음' 이다.
      push(3, 'skip', {
        status: S.SKIP,
        desc: '바깥 조건이 거짓이므로 score 입력 줄도 실행하지 않습니다.'
      });
      push(4, 'cond', { expr: BONUS_EXPR.i1, status: S.SKIP, condId: 'i1', desc: DESC.skipCond });
      push(5, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      push(6, 'cond', { expr: BONUS_EXPR.i2, status: S.SKIP, condId: 'i2', desc: DESC.skipCond });
      push(7, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      push(8, 'cond', { expr: 'else', status: S.SKIP, condId: 'ielse', desc: DESC.skipCond });
      push(9, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      push(10, 'skip', { status: S.SKIP, desc: DESC.skipBody });

      push(11, 'cond', {
        expr: 'else',

        desc: '바깥 조건이 False 이므로 바깥 else 블록을 실행합니다.'
      });
      output = '상점을 받지 않았으므로 추가 상점이 없습니다.';
      push(12, 'print', {
        status: S.RUN,
        output: output,
        desc: '추가 상점이 없다고 출력합니다 → ' + output
      });
    }

    return {
      received: received,
      score: received === 'y' ? score : null,
      extra: extra,
      output: output,
      vars: snapshot(vars),
      outer: { id: 'outer', expr: BONUS_EXPR.outer, status: status.outer },
      inner: [
        { id: 'i1', expr: BONUS_EXPR.i1, status: status.i1 },
        { id: 'i2', expr: BONUS_EXPR.i2, status: status.i2 },
        { id: 'ielse', expr: 'else', status: status.ielse }
      ],
      trace: trace,
      lines: BONUS_LINES
    };
  }

  /* ------------------------------------------------------------------ */
  /* 보조 실행 : runGrade(score)  (명세 7.3 실행 추적표)                   */
  /* ------------------------------------------------------------------ */
  function runGrade(scoreRaw) {
    var score = toInt(scoreRaw, 0);
    var vars = { score: score };
    var trace = [];
    var st = [S.SKIP, S.SKIP, S.SKIP];
    var exprs = ['score >= 90', 'score >= 80', 'score >= 70'];
    var grades = ['A', 'B', 'C'];
    var output = 'D';

    function push(line, kind, more) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(more || {}).forEach(function (key) {
        step[key] = more[key];
      });
      trace.push(step);
    }

    var decided = -1;
    for (var i = 0; i < 3; i += 1) {
      var limit = [90, 80, 70][i];
      if (decided >= 0) {
        st[i] = S.SKIP;
        push(i * 2, 'cond', { expr: exprs[i], status: S.SKIP, condId: 'g' + (i + 1), desc: DESC.skipCond });
        push(i * 2 + 1, 'skip', { status: S.SKIP, desc: DESC.skipBody });
        continue;
      }
      if (score >= limit) {
        st[i] = S.TRUE;
        decided = i;
        push(i * 2, 'cond', {
          expr: exprs[i],
          status: S.TRUE,
          condId: 'g' + (i + 1),
          desc: condDesc('score', score, exprs[i], true)
        });
        output = grades[i];
        push(i * 2 + 1, 'print', {
          status: S.RUN,
          output: output,
          desc: "'" + output + "' 를 출력합니다."
        });
      } else {
        st[i] = S.FALSE;
        push(i * 2, 'cond', {
          expr: exprs[i],
          status: S.FALSE,
          condId: 'g' + (i + 1),
          desc: condDesc('score', score, exprs[i], false) + ' 다음 조건으로 내려갑니다.'
        });
        push(i * 2 + 1, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      }
    }

    if (decided < 0) {
      push(6, 'cond', {
        expr: 'else',
        status: S.RUN,
        condId: 'gelse',
        desc: '세 조건이 모두 False 이므로 else 블록을 실행합니다.'
      });
      output = 'D';
      push(7, 'print', { status: S.RUN, output: output, desc: "'D' 를 출력합니다." });
    } else {
      push(6, 'cond', { expr: 'else', status: S.SKIP, condId: 'gelse', desc: DESC.skipCond });
      push(7, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    }

    return {
      input: score,
      rows: [
        { expr: exprs[0], status: st[0] },
        { expr: exprs[1], status: st[1] },
        { expr: exprs[2], status: st[2] }
      ],
      output: output,
      trace: trace,
      lines: GRADE_LINES
    };
  }

  /* ------------------------------------------------------------------ */
  /* 보조 실행 : 조건 순서 (명세 7.1 잘못된 순서 / 7.2 올바른 순서)          */
  /* ------------------------------------------------------------------ */
  function runOrder(scoreRaw, ids, exprs, limits, texts, lines) {
    var score = toInt(scoreRaw, 0);
    var vars = { score: score };
    var trace = [];
    var st = [S.SKIP, S.SKIP];
    var output = null;

    function push(line, kind, more) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(more || {}).forEach(function (key) {
        step[key] = more[key];
      });
      trace.push(step);
    }

    if (score >= limits[0]) {
      st[0] = S.TRUE;
      push(0, 'cond', {
        expr: exprs[0],
        status: S.TRUE,
        condId: ids[0],
        desc: condDesc('score', score, exprs[0], true) + ' 처음으로 True 가 된 조건이라 이 블록을 실행합니다.'
      });
      output = texts[0];
      push(1, 'print', { status: S.RUN, output: output, desc: "'" + output + "' 을(를) 출력합니다." });
      st[1] = S.SKIP;
      push(2, 'cond', { expr: exprs[1], status: S.SKIP, condId: ids[1], desc: DESC.skipCond });
      push(3, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    } else {
      st[0] = S.FALSE;
      push(0, 'cond', {
        expr: exprs[0],
        status: S.FALSE,
        condId: ids[0],
        desc: condDesc('score', score, exprs[0], false) + ' 다음 조건으로 내려갑니다.'
      });
      push(1, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      if (score >= limits[1]) {
        st[1] = S.TRUE;
        push(2, 'cond', {
          expr: exprs[1],
          status: S.TRUE,
          condId: ids[1],
          desc: condDesc('score', score, exprs[1], true)
        });
        output = texts[1];
        push(3, 'print', { status: S.RUN, output: output, desc: "'" + output + "' 을(를) 출력합니다." });
      } else {
        st[1] = S.FALSE;
        push(2, 'cond', {
          expr: exprs[1],
          status: S.FALSE,
          condId: ids[1],
          desc: condDesc('score', score, exprs[1], false) + ' 출력되는 것이 없습니다.'
        });
        push(3, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      }
    }

    return {
      input: score,
      conditions: [
        { id: ids[0], expr: exprs[0], status: st[0] },
        { id: ids[1], expr: exprs[1], status: st[1] }
      ],
      output: output,
      trace: trace,
      lines: lines
    };
  }

  /** 명세 7.1 : 잘못된 순서 (score >= 70 을 먼저 검사한다) */
  function runWrongOrder(score) {
    return runOrder(
      score,
      ['w1', 'w2'],
      ['score >= 70', 'score >= 90'],
      [70, 90],
      ['C 이상', 'A'],
      WRONG_ORDER_LINES

  /** 명세 7.2 : 올바른 순서 (score >= 90 을 먼저 검사한다) */
  function runRightOrder(score) {

      score,
      ['r1', 'r2'],
      ['score >= 90', 'score >= 70'],
      [90, 70],
      ['A', 'C 이상'],
      RIGHT_ORDER_LINES

  /* ------------------------------------------------------------------ */
  /* 자동 테스트 (명세 9.9)                                               */
  /* ------------------------------------------------------------------ */
  var BONUS_TESTS = [
    {
      id: 't1',

      id: 't2',

      received: 'y',
      score: 3,
      expected: '추가로 부여된 상점은 1점입니다.'
    },
    {
      id: 't3',
      label: '상점 받음 (y), 7점',
      received: 'y',
      score: 7,
      expected: '추가로 부여된 상점은 2점입니다.'
    },
    {
      id: 't4',
      label: '상점 받음 (y), 12점',
      received: 'y',
      score: 12,
      expected: '추가로 부여된 상점은 3점입니다.'
    }
  ];

  /** 경계값도 내부적으로 확인한다(명세 9.9). */
  var BONUS_EDGE_TESTS = [
    { id: 'e1', label: '경계값 score = 5', received: 'y', score: 5, expectedExtra: 2 },
    { id: 'e2', label: '경계값 score = 10', received: 'y', score: 10, expectedExtra: 3 }
  ];

  /** 4개 테스트 + 2개 경계값 테스트를 실행한 결과를 돌려준다. */
  function runBonusTests() {
    var results = BONUS_TESTS.map(function (test) {
      var actual = runBonus(test.received, test.score).output;
      return {
        id: test.id,
        label: test.label,
        expected: test.expected,
        actual: actual,
        pass: actual === test.expected
      };
    });
    var edge = BONUS_EDGE_TESTS.map(function (test) {
      var actual = runBonus(test.received, test.score).extra;
      return {
        id: test.id,
        label: test.label,
        expected: test.expectedExtra,
        actual: actual,
        pass: actual === test.expectedExtra
      };
    });
    var passed =
      results.every(function (r) {
        return r.pass;
      }) &&
      edge.every(function (r) {
        return r.pass;
      });
    return { results: results, edge: edge, passed: passed };
  }

  /* ------------------------------------------------------------------ */
  /* 공개                                                                */
  /* ------------------------------------------------------------------ */
  L.engine = {
    S: S,

    ECO_LINES: ECO_LINES,
    ECO_NOTES: ECO_NOTES,
    ECO_EXAMPLES: ECO_EXAMPLES,
    ECO_EXPR: ECO_EXPR,

    BONUS_LINES: BONUS_LINES,
    BONUS_NOTES: BONUS_NOTES,
    BONUS_EXPR: BONUS_EXPR,

    GRADE_LINES: GRADE_LINES,
    GRADE_NOTES: GRADE_NOTES,
    WRONG_ORDER_LINES: WRONG_ORDER_LINES,
    RIGHT_ORDER_LINES: RIGHT_ORDER_LINES,

    BONUS_TESTS: BONUS_TESTS,
    BONUS_EDGE_TESTS: BONUS_EDGE_TESTS,

    runEco: runEco,
    runBonus: runBonus,
    runGrade: runGrade,
    runWrongOrder: runWrongOrder,
    runRightOrder: runRightOrder,
    runBonusTests: runBonusTests,

    ecoRule: ecoRule,
    bonusExtra: bonusExtra,
    validateReduce: validateReduce,
    validateScore: validateScore,
    normalizeYN: normalizeYN
  };
})();

 *   - 같은 학생(학번+이름)이 여러 번 제출했으면 receivedAt 이 가장 늦은 것만 집계한다.

  var LESSON_ID = "lesson3_7_2";

  var QUESTION_IDS = [1, 2, 3, 4, 5];
  var POINT_PER_QUESTION = 2;
  var MAX_SCORE = 10;
  var PASS_SCORE = 6;

  /** 정오 표시 — 색이 아니라 «글자»로 읽는다 */
  var MARK_SYMBOL = { correct: "○", wrong: "✕", none: "−", unknown: "?" };
  var MARK_LABEL = { correct: "정답", wrong: "오답", none: "무응답", unknown: "알 수 없음" };

  /* 작은 도구들                                                          */
  /* ------------------------------------------------------------------ */

  /** 비교용 정규화 — 공백·따옴표를 지우고 소문자로 만든다. */

    return String(value === undefined || value === null ? "" : value)
      .replace(/\s+/g, "")
      .replace(/['"`]/g, "")

   * &amp;gt; 같은 HTML 문자 표기를 사람이 읽는 글자로 되돌린다.
   * 문항 지문은 HTML 로 쓰여 있어서, 태그만 걷어내면 &amp;gt; 가 그대로 남는다.

      .replace(/&lt;/g, "[<]".charAt(1))

      .replace(/&#39;/g, "'")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&");

      return (n < 10 ? "0" : "") + n;
    }
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes())
    );
  }

  /**
   * 정답 유무 표기를 표준형으로 바꾼다.
   *   '정답' · true · 'O' · '○'  → correct
   *   '오답' · false · 'X' · '✕' → wrong
   *   '무응답' · '-'             → none

    var v = String(value === undefined || value === null ? "" : value).trim().toLowerCase();
    if (!v) return null;
    if (["정답", "true", "o", "○", "◯", "맞음", "correct", "y"].indexOf(v) !== -1) return "correct";
    if (["오답", "false", "x", "✕", "×", "틀림", "wrong", "n"].indexOf(v) !== -1) return "wrong";
    if (["무응답", "미응답", "none", "-", "−", "미제출", "blank"].indexOf(v) !== -1) return "none";

  /** 「② elif reduce >= 5:」 처럼 앞에 붙은 보기 번호를 떼어 낸다. */

  /**

   * 보기 번호를 뗀 뒤 통째로 비교하는 것이 원칙이고,

   * (예전에는 곧바로 포함 관계로 봐서 「if reduce >= 5:」 가
   *  「elif reduce >= 5:」 안에 들어 있다는 이유로 잘못 짝지어질 수 있었다)
   */
  function sameChoiceText(correctText, choiceText) {
    var a = flat(stripCircled(correctText));
    var b = flat(choiceText);
    if (!a || !b) return false;
    if (a === b) return true;
    return b.length >= 8 && a.indexOf(b) !== -1;
  }

  /** 선택형 답안 문자열에서 학생이 고른 보기 번호(0부터)를 알아낸다. 모르면 -1 */

    var raw = String(answerText === undefined || answerText === null ? "" : answerText).trim();

    if (m) return Number(m[1]) - 1;

    if (choices && choices.length) {
      var target = flat(raw);
      var i;
      // ① 통째로 같은 보기를 먼저 찾는다.
      for (i = 0; i < choices.length; i += 1) {
        if (flat(choices[i]) === target) return i;
      }
      // ② 그래도 못 찾으면 «한 보기에만» 들어 있는 경우에 한해 그 보기로 본다.
      //    두 보기에 모두 들어 있으면(예 : if reduce >= 5 는 elif reduce >= 5 의 일부)
      //    어느 쪽인지 알 수 없으므로 고르지 않는다.
      var hit = -1;

  /** 여러 문자열 가운데 가장 자주 나온 것 (같으면 먼저 나온 것) */

    var best = "";
    var bestN = 0;
    (values || []).forEach(function (v) {
      var key = String(v === undefined || v === null ? "" : v).trim();
      if (!key) return;
      count[key] = (count[key] || 0) + 1;
      if (count[key] > bestN) {
        bestN = count[key];
        best = key;
      }
    });
    return best;
  }

  /**
   * 문항 원본 정보(보기 · 해설 · 보충 화면)를 모은다.
   * 문항 은행(L.quiz)이 있으면 그것을 쓴다.
   *
   * 은행이 실려 있지 않은 페이지에서도 표가 텅 비지 않도록,
   * 학생이 제출한 답안에 함께 저장된 «문제 지문(question)»과 «정답(correctAnswer)»으로
   * 빈자리를 메운다. 변형에 따라 정답이 달라지는 문항은 뒤에서 다시 학생별로 나눠 센다.

    var meta = {};
    QUESTION_IDS.forEach(function (id) {

        id: id,
        type: id === 5 ? "text" : "choice", // 은행이 없을 때의 기본값
        topic: "",
        stem: "",
        choices: null,
        answerIndex: -1,
        correct: "",
        explain: "",
        reviewStep: 0

    });

        var g = L.teacherKey.QUESTION_GUIDE[id];

        meta[id].topic = g.label || "";
        meta[id].reviewStep = g.reviewStep || 0;
      });
    }

    // 은행이 없을 때 : 학생 답안에 저장된 지문과 정답으로 빈자리를 메운다.
    QUESTION_IDS.forEach(function (id) {
      var stems = [];
      var corrects = [];
      var circledAnswers = 0;
      var answered = 0;
      list.forEach(function (r) {
        r.answers.forEach(function (a) {
          if (a.id !== id) return;

          corrects.push(a.correctAnswer);

          type: q.type,
          topic: q.topic,
          stem: decodeEntities(L.quiz.plainStem(q)),

  /* ------------------------------------------------------------------ */
  /* 정규화                                                               */
  /* ------------------------------------------------------------------ */

  /** 답안 한 칸을 표준 형태로 바꾼다. */
  function normalizeAnswer(entry, id) {
    var answer = String(pick(entry || {}, ["answer", "response", "value", "studentAnswer", "답"]));
    var correctAnswer = String(
      pick(entry || {}, ["correctAnswer", "correct_answer", "modelAnswer", "정답"])
    );
    var question = String(pick(entry || {}, ["question", "stem", "prompt", "문제"]));
    var explicit = entry
      ? parseMark(pick(entry, ["isCorrect", "correct", "mark", "정답유무", "result"]))
      : null;

    var mark;
    if (explicit === "correct") mark = "correct";
    // 답을 아예 쓰지 않았으면 «무응답»이다.
    // 저장 파일에 「오답」이라고 적혀 있어도 마찬가지다 — 점수는 어차피 0점이지만,
    // 명단 표와 오답 분포에서 «틀린 답을 고른 학생»과 «아무 답도 안 낸 학생»은 구별해야 한다.
    else if (!answer.trim()) mark = "none";
    else if (explicit === "wrong") mark = "wrong";
    else if (correctAnswer.trim()) mark = flat(answer) === flat(correctAnswer) ? "correct" : "wrong";
    else mark = "unknown";

    return {
      id: id,
      question: question,
      answer: answer,
      correctAnswer: correctAnswer,
      mark: mark,
      answered: Boolean(answer.trim())

  /**
   * 제출물에 변형 번호(variant)가 적혀 있지 않아도 어느 문제지를 풀었는지 알아낸다.

   * 두 변형에 똑같이 들어맞으면 «알 수 없음»(null)으로 둔다. 억지로 정하지 않는다.
   */
  function inferVariant(answers) {
    if (!L.quiz || typeof L.quiz.buildQuiz !== "function") return null;
    var known = (answers || []).filter(function (a) {
      return String(a.correctAnswer || "").trim() !== "";
    });
    if (!known.length) return null;

    var hit = null;
    for (var v = 0; v < L.quiz.VARIANT_COUNT; v += 1) {
      var byId = {};
      L.quiz.buildQuiz(v).forEach(function (q) {
        byId[q.id] = L.quiz.correctText(q);

      var fits = known.every(function (a) {
        return byId[a.id] !== undefined && flat(byId[a.id]) === flat(a.correctAnswer);
      });
      if (!fits) continue;
      if (hit !== null) return null; // 두 변형이 모두 들어맞으면 구별할 수 없다

    }
    return hit;
  }

  /**
   * 제출 하나를 표준 형태로 바꾼다.
   * 알아볼 수 없으면 null 을 돌려준다(건너뛴 건수로 센다).
   */
  function normalizeOne(raw, index) {
    if (!raw || typeof raw !== "object") return null;

    // 다른 차시 제출물은 걸러 낸다. lesson 키가 아예 없으면(학생이 내려받은 파일)

    if (lesson && lesson.indexOf(LESSON_ID) === -1) return { skipped: "otherLesson" };

    var studentId = String(pick(raw, ["studentId", "student_id", "id", "학번", "학생번호"])).trim();
    var name = String(pick(raw, ["name", "studentName", "student_name", "이름", "학생이름"])).trim();
    if (!studentId && !name) return { skipped: "noStudent" };

    var rawAnswers = Array.isArray(raw.answers)
      ? raw.answers

        ? raw.답안
        : [];

    // questionId 로 자리를 찾는다. 없으면 배열 순서를 문항 번호로 본다.
    var byId = {};
    rawAnswers.forEach(function (a, i) {
      if (!a || typeof a !== "object") return;
      var id = Number(pick(a, ["questionId", "question_id", "no", "number", "id", "문항", "문제번호"]));
      if (!id) id = i + 1;
      if (byId[id] === undefined) byId[id] = a;
    });

    var answers = QUESTION_IDS.map(function (id) {
      return normalizeAnswer(byId[id] || null, id);
    });

    // 어느 문제지(변형)를 풀었는지 알아낸다.
    // 제출물에 variant 가 적혀 있으면 그것을 쓰고, 없으면 저장된 정답으로 되짚는다.
    var variantRaw = pick(raw, ["variant", "variantIndex", "변형"]);
    var variant = variantRaw === "" ? null : Number(variantRaw);
    if (variant === null || isNaN(variant)) variant = inferVariant(answers);
    var variantGuessed = variantRaw === "" && variant !== null;

    // 마지막 근거 : 변형을 알 수 있으면 문항 은행으로 직접 채점해 본다.
    if (variant !== null && !isNaN(variant) && L.quiz && typeof L.quiz.buildQuiz === "function") {
      var quiz = L.quiz.buildQuiz(variant);
      var qById = {};
      quiz.forEach(function (q) {
        qById[q.id] = q;
      });
      answers.forEach(function (a) {
        if (a.mark !== "unknown") return;
        var q = qById[a.id];
        if (!q) return;
        // 선택형만 보기 번호로 되돌린다. 나머지(단답형·코드 작성형)는 쓴 글을 그대로 넘긴다.
        var given = q.type === "choice" ? pickedIndexOf(a.answer, q.choices) : a.answer;
        var judged = L.quiz.gradeOne(q, given);
        a.mark = judged.correct ? "correct" : "wrong";
        if (!a.correctAnswer) a.correctAnswer = L.quiz.correctText(q);
      });
    }

    var correctCount = answers.filter(function (a) {
      return a.mark === "correct";
    }).length;
    var unknownCount = answers.filter(function (a) {
      return a.mark === "unknown";
    }).length;

    var score = Math.min(MAX_SCORE, correctCount * POINT_PER_QUESTION);
    var reportedRaw = pick(raw, ["totalScore", "total_score", "score", "점수", "총점"]);
    var reported = reportedRaw === "" ? null : Number(reportedRaw);
    if (reported !== null && isNaN(reported)) reported = null;

    var receivedAt = String(
      pick(raw, [
        "receivedAt",
        "submittedAt",
        "timestamp",
        "createdAt",
        "_createdAt",
        "__receivedAt",
        "제출시각"
      ])
    );

    return {
      record: {
        studentId: studentId,
        name: name,
        key: (studentId || "") + "|" + (name || ""),
        answers: answers,
        correctCount: correctCount,
        unknownCount: unknownCount,
        score: score,
        maxScore: MAX_SCORE,
        passed: score >= PASS_SCORE,
        passedText: score >= PASS_SCORE ? "이수" : "미이수",
        reportedScore: reported,
        scoreMismatch: reported !== null && reported !== score,
        attempts: Number(pick(raw, ["attempts", "시도"])) || 1,
        variant: variant !== null && !isNaN(variant) ? variant : null,
        variantGuessed: variantGuessed,
        confidence: String(pick(raw, ["confidence", "자신감"])),
        summary: raw.summary || null,
        receivedAt: receivedAt,
        receivedTime: toTime(receivedAt),
        receivedText: receivedAt ? formatTime(receivedAt) : "",
        fileName: String(pick(raw, ["__fileName", "_fileName", "fileName", "파일명"])),
        order: index
      }
    };
  }

  /**
   * 제출 목록을 표준 형태로 바꾸고, 같은 학생의 재제출은 가장 나중 것만 남긴다.

   * @returns {{records:Array, total:number, kept:number,
   *            skipped:number, skippedReason:Object, replaced:number}}
   */

    var source = Array.isArray(list) ? list : [];
    var skippedReason = { invalid: 0, otherLesson: 0, noStudent: 0, noAnswers: 0 };
    var parsed = [];

    source.forEach(function (raw, i) {
      var out = normalizeOne(raw, i);
      if (!out) {
        skippedReason.invalid += 1;
        return;
      }
      if (out.skipped) {
        skippedReason[out.skipped] += 1;
        return;
      }
      parsed.push(out.record);
    });

    // 같은 학생(학번+이름)의 재제출 정리 — receivedAt 이 가장 늦은 것만 남긴다.
    var byKey = {};
    var replaced = 0;
    parsed.forEach(function (rec) {

      if (!prev) {
        byKey[rec.key] = rec;
        return;
      }
      replaced += 1;
      var a = rec.receivedTime;
      var b = prev.receivedTime;
      var newer;
      if (a === null && b === null) newer = rec.order >= prev.order; // 시각이 없으면 나중에 읽은 것
      else if (a === null) newer = false;
      else if (b === null) newer = true;
      else newer = a >= b;
      if (newer) byKey[rec.key] = rec;
