    var records = Object.keys(byKey).map(function (k) {
      return byKey[k];
    });

    // 학번 → 이름 순으로 정렬해 명단 표의 기본 순서를 만든다.
    records.sort(function (a, b) {
      var ia = String(a.studentId);
      var ib = String(b.studentId);
      if (ia !== ib) return ia < ib ? -1 : 1;
      return String(a.name) < String(b.name) ? -1 : 1;
    });

    var skipped =
      skippedReason.invalid +
      skippedReason.otherLesson +
      skippedReason.noStudent +
      skippedReason.noAnswers;

    return {
      records: records,
      total: source.length,
      kept: records.length,
      skipped: skipped,
      skippedReason: skippedReason,
      replaced: replaced
    };
  }

  /* ------------------------------------------------------------------ */
  /* 통계                                                                 */
  /* ------------------------------------------------------------------ */

  /** 전체 요약 — 제출 인원 · 평균/최고/최저 · 만점자 · 이수 인원과 이수율 */
  function summary(records) {
    var list = Array.isArray(records) ? records : [];
    var count = list.length;
    if (!count) {
      return {
        count: 0,
        average: 0,
        highest: 0,
        lowest: 0,
        perfect: 0,
        passedCount: 0,
        failedCount: 0,
        passRate: 0,
        maxScore: MAX_SCORE,
        passScore: PASS_SCORE,
        latest: "",
        mismatch: 0,
        unknown: 0
      };
    }

    var scores = list.map(function (r) {
      return r.score;
    });
    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);
    var passedCount = list.filter(function (r) {
      return r.passed;
    }).length;
    var times = list
      .map(function (r) {
        return r.receivedTime;
      })
      .filter(function (t) {
        return t !== null;
      });

    return {
      count: count,
      average: Math.round((sum / count) * 10) / 10,
      highest: Math.max.apply(null, scores),
      lowest: Math.min.apply(null, scores),
      perfect: scores.filter(function (s) {
        return s === MAX_SCORE;
      }).length,
      passedCount: passedCount,
      failedCount: count - passedCount,
      passRate: Math.round((passedCount / count) * 100),
      maxScore: MAX_SCORE,
      passScore: PASS_SCORE,
      latest: times.length ? formatTime(Math.max.apply(null, times)) : "",
      // 파일에 적힌 점수와 다시 채점한 점수가 다른 경우 (형식이 바뀐 파일일 수 있다)
      mismatch: list.filter(function (r) {
        return r.scoreMismatch;
      }).length,
      unknown: list.filter(function (r) {
        return r.unknownCount > 0;
      }).length
    };
  }

  /**
   * 상위 n명. 점수가 높은 순, 점수가 같으면 «먼저 제출한 학생»이 앞에 온다.
   * 동점자는 같은 등수(rank)를 갖는다.
   */
  function topStudents(records, n) {
    var list = (Array.isArray(records) ? records : []).slice();
    var limit = Number(n) || 3;

    list.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      var ta = a.receivedTime === null ? Infinity : a.receivedTime;
      var tb = b.receivedTime === null ? Infinity : b.receivedTime;
      if (ta !== tb) return ta - tb;
      return a.order - b.order;
    });

    var rank = 0;
    var lastScore = null;
    var ranked = list.map(function (r, i) {
      if (r.score !== lastScore) {
        rank = i + 1;
        lastScore = r.score;
      }
      var copy = {};
      Object.keys(r).forEach(function (k) {
        copy[k] = r[k];
      });
      copy.rank = rank;
      return copy;
    });

    return ranked.slice(0, limit);
  }

  /** 순위별 칭찬 문구 (교사가 그대로 읽어 줄 수 있는 문장) */
  function praiseFor(rank, record) {
    var perfect = record && record.score === MAX_SCORE;
    var table = {
      1: {
        medal: "🥇",
        title: "1등",
        message: perfect
          ? "만점이에요! 조건을 «위에서 아래로 차례대로» 검사한다는 원리를 정확히 이해했어요. 친구들에게 설명해 주는 도우미가 되어 주세요."
          : "가장 높은 점수예요! 조건의 순서에 따라 실행 흐름이 달라진다는 것을 잘 알고 있어요."
      },
      2: {
        medal: "🥈",
        title: "2등",
        message: perfect
          ? "만점이에요! 검사 안 함 과 False 를 정확히 구분했어요. 훌륭합니다."
          : "아주 잘했어요! 문제를 끝까지 차분히 읽고 판단하는 힘이 돋보여요."
      },
      3: {
        medal: "🥉",
        title: "3등",
        message: perfect
          ? "만점이에요! 다중 조건문과 중첩 조건문의 차이를 확실히 잡았어요."
          : "훌륭해요! 배운 내용을 문제에 잘 적용했어요. 조금만 더 하면 만점이에요."
      }
    };
    return table[rank] || { medal: "🎖️", title: rank + "등", message: "끝까지 잘 풀었어요!" };
  }

  /**
   * 답안 묶음 하나에서 «어떤 답을 몇 명이 골랐는지» 표를 만든다.
   * @param {Array}  cells       이 묶음에 속한 학생 답안
   * @param {Object} m           문항 정보(보기 목록 등)
   * @param {string} correctText 이 묶음이 본 정답 (없으면 문항 은행의 기본 정답)
   */
  function buildDistribution(cells, m, correctText) {
    var distribution;

    if (m.type === "choice" && m.choices && m.choices.length) {
      // 학생마다 «고른 보기 번호»를 한 번만 계산해 둔다.
      var picks = cells.map(function (c) {
        return c.answered ? pickedIndexOf(c.answer, m.choices) : -1;
      });
      distribution = m.choices.map(function (text, i) {
        return {
          index: i,
          label: CIRCLED.charAt(i) + " " + text,
          count: picks.filter(function (p) {
            return p === i;
          }).length,
          isAnswer: correctText ? sameChoiceText(correctText, text) : i === m.answerIndex
        };
      });
      var other = cells.filter(function (c, i) {
        return c.answered && picks[i] === -1;
      }).length;
      if (other) distribution.push({ index: -1, label: "그 밖의 답", count: other, isAnswer: false });
    } else {
      // 단답형 : 학생이 쓴 답을 같은 것끼리 묶는다.
      var bucket = {};
      cells.forEach(function (c) {
        if (!c.answered) return;
        var key = String(c.answer).trim();
        bucket[key] = (bucket[key] || 0) + 1;
      });
      distribution = Object.keys(bucket).map(function (key) {
        return {
          index: -1,
          label: key,
          count: bucket[key],
          isAnswer: correctText ? flat(correctText) === flat(key) : false
        };
      });
      distribution.sort(function (a, b) {
        return b.count - a.count;
      });
    }

    var blank = cells.filter(function (c) {
      return c.mark === "none";
    }).length;
    if (blank) distribution.push({ index: -2, label: "무응답", count: blank, isAnswer: false });

    return distribution;
  }

  /**
   * 문항별 오답률과 «어떤 오답을 많이 골랐는지» 분포.
   * 오답률이 높은 순서로 돌려준다.
   *
   * 변형(재도전 문제지)에 따라 정답이 달라지는 문항은 «문제지별로 나누어» 센다.
   * 그러지 않으면 한 표 안에 정답이 여러 개 있는 것처럼 보여 읽을 수 없다.
   */
  function hardestQuestions(records) {
    var list = Array.isArray(records) ? records : [];
    var meta = questionMeta(list);
    var total = list.length;

    var rows = QUESTION_IDS.map(function (id) {
      var m = meta[id];
      var cells = list.map(function (r) {
        var found = null;
        r.answers.forEach(function (a) {
          if (a.id === id) found = a;
        });
        var base = found || { id: id, answer: "", correctAnswer: "", mark: "none", answered: false };
        return {
          answer: base.answer,
          correctAnswer: base.correctAnswer,
          mark: base.mark,
          answered: base.answered,
          variant: r.variant
        };
      });

      var wrong = cells.filter(function (c) {
        return c.mark !== "correct";
      }).length;
      var blank = cells.filter(function (c) {
        return c.mark === "none";
      }).length;

      // 학생 답안에 저장된 «정답» 을 모은다. 변형에 따라 정답이 다른 문항을 알아내기 위해서다.
      var correctSet = [];
      cells.forEach(function (c) {
        var v = String(c.correctAnswer || "").trim();
        if (v && correctSet.indexOf(v) === -1) correctSet.push(v);
      });

      // 정답이 같은 학생끼리 묶는다(= 같은 문제지를 푼 학생끼리).
      var groups;
      if (correctSet.length > 1) {
        groups = correctSet.map(function (answerText) {
          var mine = cells.filter(function (c) {
            return String(c.correctAnswer || "").trim() === answerText;
          });
          // 이 묶음이 모두 같은 변형이면 변형 이름을, 아니면 정답으로 이름을 붙인다.
          var vs = [];
          mine.forEach(function (c) {
            if (c.variant !== null && c.variant !== undefined && vs.indexOf(c.variant) === -1) {
              vs.push(c.variant);
            }
          });
          // 변형 번호를 알아낸 경우에만 「재도전 1」 같은 이름을 붙인다.
          // 알 수 없으면 빈 이름을 두고, 화면에서 정답으로 부르게 한다.
          var label =
            vs.length === 1 && L.teacherKey && L.teacherKey.VARIANT_LABEL[vs[0]]
              ? L.teacherKey.VARIANT_LABEL[vs[0]]
              : "";
          return {
            label: label,
            correct: answerText,
            count: mine.length,
            wrong: mine.filter(function (c) {
              return c.mark !== "correct";
            }).length,
            distribution: buildDistribution(mine, m, answerText)
          };
        });
        groups.sort(function (a, b) {
          return b.count - a.count;
        });
      } else {
        groups = [
          {
            label: "",
            correct: correctSet[0] || m.correct || "",
            count: cells.length,
            wrong: wrong,
            distribution: buildDistribution(cells, m, correctSet[0] || m.correct || "")
          }
        ];
      }

      return {
        id: id,
        type: m.type,
        topic: m.topic,
        stem: m.stem,
        choices: m.choices,
        explain: m.explain,
        reviewStep: m.reviewStep,
        total: total,
        wrong: wrong,
        correct: total - wrong,
        blank: blank,
        wrongRate: total ? Math.round((wrong / total) * 100) : 0,
        // 문제지별로 나눈 분포. 변형이 섞이지 않았으면 묶음이 하나뿐이다.
        groups: groups,
        distribution: groups.length === 1 ? groups[0].distribution : [],
        // 변형에 따라 정답이 달라지는 문항이면 목록을 그대로 보여 준다.
        correctTexts: correctSet.length ? correctSet : m.correct ? [m.correct] : [],
        variantMixed: correctSet.length > 1
      };
    });

    rows.sort(function (a, b) {
      if (b.wrongRate !== a.wrongRate) return b.wrongRate - a.wrongRate;
      if (b.wrong !== a.wrong) return b.wrong - a.wrong;
      return a.id - b.id;
    });
    return rows;
  }

  /* ------------------------------------------------------------------ */
  /* 학생 명단 (선택) — 미제출 학생까지 표에 넣기 위한 것                     */
  /* ------------------------------------------------------------------ */

  /** 학번으로 볼 만한 열 이름 */
  var ID_HEADERS = ["학번", "학번호", "번호", "id", "studentid", "student_id", "학생번호"];
  /** 이름으로 볼 만한 열 이름 */
  var NAME_HEADERS = ["이름", "성명", "학생이름", "학생명", "name", "studentname", "student_name"];

  /** 머리글 비교용 (공백 제거 + 소문자) */
  function headerKey(value) {
    return String(value === undefined || value === null ? "" : value)
      .trim()
      .replace(/\s+/g, "")
      .toLowerCase();
  }

  /** 학번 비교용 표준형 (앞의 0 과 공백·기호를 없앤다) */
  function normalizeId(value) {
    var raw = String(value === undefined || value === null ? "" : value).trim();
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  /* --------------------------- csv / tsv 읽기 --------------------------- */
  /** 쉼표(또는 탭)로 나뉜 글을 2차원 배열로. 따옴표 안의 쉼표는 그대로 둔다. */
  function splitDelimited(text) {
    var clean = String(text || "").replace(/^﻿/, "");
    var delimiter = clean.indexOf("\t") !== -1 && clean.indexOf(",") === -1 ? "\t" : ",";
    var rows = [];
    var row = [];
    var cell = "";
    var quoted = false;

    for (var i = 0; i < clean.length; i += 1) {
      var ch = clean.charAt(i);
      if (quoted) {
        if (ch === '"') {
          if (clean.charAt(i + 1) === '"') {
            cell += '"';
            i += 1;
          } else quoted = false;
        } else cell += ch;
        continue;
      }
      if (ch === '"') quoted = true;
      else if (ch === delimiter) {
        row.push(cell.trim());
        cell = "";
      } else if (ch === "\n") {
        row.push(cell.trim());
        rows.push(row);
        row = [];
        cell = "";
      } else if (ch !== "\r") cell += ch;
    }
    row.push(cell.trim());
    if (
      row.some(function (c) {
        return c !== "";
      })
    ) {
      rows.push(row);
    }
    return rows;
  }

  /* ----------------------------- xlsx 읽기 ----------------------------- */
  /* 외부 라이브러리를 쓰지 않는다. 브라우저 내장 기능만으로 zip 을 푼다. */

  function findEocd(view) {
    var max = Math.min(view.byteLength, 66000);
    for (var i = view.byteLength - 22; i >= view.byteLength - max && i >= 0; i -= 1) {
      if (view.getUint32(i, true) === 0x06054b50) return i;
    }
    return -1;
  }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "function") {
      throw new Error("이 브라우저에서는 엑셀 파일을 직접 읽을 수 없어요. CSV 로 저장해 올려 주세요.");
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /** xlsx(zip) 안에서 필요한 항목만 { 경로: 글 } 로 꺼낸다. */
  async function readZipEntries(buffer, wanted) {
    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var eocd = findEocd(view);
    if (eocd < 0) throw new Error("엑셀 파일 형식을 읽지 못했어요.");

    var count = view.getUint16(eocd + 10, true);
    var offset = view.getUint32(eocd + 16, true);
    var decoder = new TextDecoder("utf-8");
    var out = {};

    for (var i = 0; i < count; i += 1) {
      if (view.getUint32(offset, true) !== 0x02014b50) break;
      var method = view.getUint16(offset + 10, true);
      var compressedSize = view.getUint32(offset + 20, true);
      var nameLen = view.getUint16(offset + 28, true);
      var extraLen = view.getUint16(offset + 30, true);
      var commentLen = view.getUint16(offset + 32, true);
      var localOffset = view.getUint32(offset + 42, true);
      var name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));

      if (wanted(name)) {
        var lNameLen = view.getUint16(localOffset + 26, true);
        var lExtraLen = view.getUint16(localOffset + 28, true);
        var start = localOffset + 30 + lNameLen + lExtraLen;
        var raw = bytes.subarray(start, start + compressedSize);
        var data = method === 0 ? raw : await inflateRaw(raw);
        out[name] = decoder.decode(data);
      }
      offset += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }

  /** "B7" → 1 (0부터 세는 열 번호) */
  function colIndex(ref) {
    var letters = String(ref).replace(/[0-9]/g, "");
    var n = 0;
    for (var i = 0; i < letters.length; i += 1) n = n * 26 + (letters.charCodeAt(i) - 64);
    return Math.max(0, n - 1);
  }

  function sheetToRows(xml, shared) {
    var doc = new DOMParser().parseFromString(xml, "application/xml");
    var rows = [];

    Array.prototype.slice.call(doc.getElementsByTagName("row")).forEach(function (rowEl) {
      var cells = [];
      Array.prototype.slice.call(rowEl.getElementsByTagName("c")).forEach(function (c) {
        var ref = c.getAttribute("r") || "";
        var type = c.getAttribute("t");
        var text = "";
        var v;
        if (type === "s") {
          v = c.getElementsByTagName("v")[0];
          var idx = v ? Number(v.textContent) : -1;
          text = shared[idx] === undefined ? "" : shared[idx];
        } else if (type === "inlineStr") {
          text = Array.prototype.slice
            .call(c.getElementsByTagName("t"))
            .map(function (t) {
              return t.textContent;
            })
            .join("");
        } else {
          v = c.getElementsByTagName("v")[0];
          text = v ? v.textContent : "";
        }
        cells[ref ? colIndex(ref) : cells.length] = String(text === null ? "" : text).trim();
      });
      rows.push(cells);
    });
    return rows;
  }

  async function readXlsx(file) {
    var buffer = await file.arrayBuffer();
    var entries = await readZipEntries(buffer, function (name) {
      return name === "xl/sharedStrings.xml" || /^xl\/worksheets\/sheet\d+\.xml$/.test(name);
    });

    var shared = [];
    if (entries["xl/sharedStrings.xml"]) {
      var doc = new DOMParser().parseFromString(entries["xl/sharedStrings.xml"], "application/xml");
      Array.prototype.slice.call(doc.getElementsByTagName("si")).forEach(function (si) {
        shared.push(
          Array.prototype.slice
            .call(si.getElementsByTagName("t"))
            .map(function (t) {
              return t.textContent;
            })
            .join("")
        );
      });
    }

    var sheetName = Object.keys(entries)
      .filter(function (n) {
        return /^xl\/worksheets\/sheet\d+\.xml$/.test(n);
      })
      .sort()[0];
    if (!sheetName) throw new Error("엑셀에서 시트를 찾지 못했어요.");
    return sheetToRows(entries[sheetName], shared);
  }

  /* --------------------------- 행 → 학생 명단 --------------------------- */
  function pickColumns(rows) {
    // 앞쪽 5줄 안에서 머리글을 찾는다.
    for (var r = 0; r < Math.min(rows.length, 5); r += 1) {
      var cells = rows[r] || [];
      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = headerKey(cell);
        if (idCol < 0 && ID_HEADERS.indexOf(v) !== -1) idCol = c;
        if (nameCol < 0 && NAME_HEADERS.indexOf(v) !== -1) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    // 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다.
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /**
   * 명단 파일(.xlsx / .csv / .tsv / .txt)을 읽어 { students, warnings } 를 돌려준다.
   * students : [{ id, name }] — 파일에 적힌 순서를 그대로 지킨다.
   */
  async function parseRosterFile(file) {
    var lower = String(file && file.name ? file.name : "").toLowerCase();
    var rows;

    if (/\.xlsx$/.test(lower)) rows = await readXlsx(file);
    else if (/\.xls$/.test(lower)) {
      throw new Error("예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV 로 저장해 올려 주세요.");
    } else rows = splitDelimited(await file.text());

    var picked = pickColumns(rows);
    var students = [];
    var warnings = [];
    var seen = {};

    rows.forEach(function (cells, r) {
      if (r <= picked.headerRow) return;
      var list = cells || [];
      var id = String(list[picked.idCol] === undefined ? "" : list[picked.idCol]).trim();
      var name = String(list[picked.nameCol] === undefined ? "" : list[picked.nameCol]).trim();
      if (!id && !name) return;

      // 머리글을 못 찾은 경우, 첫 줄이 「학번/이름」 같은 글자면 건너뛴다.
      if (
        picked.headerRow < 0 &&
        r === 0 &&
        (ID_HEADERS.indexOf(headerKey(id)) !== -1 || NAME_HEADERS.indexOf(headerKey(name)) !== -1)
      ) {
        return;
      }
      if (!id) {
        warnings.push(r + 1 + "행: 학번이 비어 있어 건너뛰었어요. (" + (name || "이름 없음") + ")");
        return;
      }
      var key = normalizeId(id);
      if (seen[key]) {
        warnings.push(r + 1 + "행: 학번 " + id + " 이 여러 번 나와 한 번만 사용했어요.");
        return;
      }
      seen[key] = true;
      students.push({ id: id, name: name });
    });

    if (!students.length) {
      throw new Error("명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.");
    }
    return { students: students, warnings: warnings, fileName: String(file.name || "") };
  }

  /**
   * 명단과 제출 결과를 맞춰 «표에 그릴 줄»을 만든다.
   * 명단이 없으면 제출한 학생만, 있으면 명단 순서대로 + 미제출 학생까지 돌려준다.
   *
   * @returns {{rows:Array, hasRoster:boolean, submittedCount:number,
   *            missingCount:number, extraCount:number, missing:Array}}
   */
  function mergeRoster(records, roster) {
    var list = Array.isArray(records) ? records : [];
    var byId = {};
    list.forEach(function (r) {
      var key = normalizeId(r.studentId);
      if (key && byId[key] === undefined) byId[key] = r;
    });

    if (!roster || !roster.students || !roster.students.length) {
      return {
        rows: list.map(function (r) {
          return { studentId: r.studentId, name: r.name, record: r, submitted: true, inRoster: false };
        }),
        hasRoster: false,
        submittedCount: list.length,
        missingCount: 0,
        extraCount: 0,
        missing: []
      };
    }

    var rows = [];
    var used = {};
    roster.students.forEach(function (s) {
      var key = normalizeId(s.id);
      var found = byId[key] || null;
      if (found) used[key] = true;
      rows.push({
        studentId: s.id,
        name: s.name || (found ? found.name : ""),
        record: found,
        submitted: Boolean(found),
        inRoster: true
      });
    });

    // 명단에 없는 제출자(학번 오타 등)도 빠뜨리지 않는다.
    var extra = 0;
    list.forEach(function (r) {
      var key = normalizeId(r.studentId);
      if (used[key]) return;
      extra += 1;
      rows.push({ studentId: r.studentId, name: r.name, record: r, submitted: true, inRoster: false });
    });

    var missing = rows.filter(function (row) {
      return row.inRoster && !row.submitted;
    });

    return {
      rows: rows,
      hasRoster: true,
      submittedCount: roster.students.length - missing.length,
      missingCount: missing.length,
      extraCount: extra,
      missing: missing
    };
  }

  /* ------------------------------------------------------------------ */
  /* 내려받기용 CSV                                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 학번 · 이름 · 문항별 정오 · 총점 · 이수 · 제출시각 을 담은 CSV 문자열.
   * 맨 앞에 BOM 을 붙여 엑셀에서 한글이 깨지지 않게 한다.
   * 명단(roster)을 함께 주면 «미제출» 학생도 한 줄씩 들어간다.
   */
  function toCsv(records, roster) {
    var merged = mergeRoster(records, roster);

    function cell(value) {
      return '"' + String(value === undefined || value === null ? "" : value).replace(/"/g, '""') + '"';
    }

    var header = ["학번", "이름"]
      .concat(
        QUESTION_IDS.map(function (id) {
          return id + "번";
        })
      )
      .concat(["총점", "이수", "제출시각"]);

    var lines = [header.map(cell).join(",")];

    merged.rows.forEach(function (item) {
      var r = item.record;
      var row = [item.studentId, item.name];
      if (!r) {
        QUESTION_IDS.forEach(function () {
          row.push("");
        });
        row.push("");
        row.push("미제출");
        row.push("");
        lines.push(row.map(cell).join(","));
        return;
      }
      QUESTION_IDS.forEach(function (id) {
        var mark = "none";
        r.answers.forEach(function (a) {
          if (a.id === id) mark = a.mark;
        });
        row.push(MARK_SYMBOL[mark] || "−");
      });
      row.push(r.score);
      row.push(r.passedText);
      row.push(r.receivedText || r.receivedAt || "");
      lines.push(row.map(cell).join(","));
    });

    return "﻿" + lines.join("\r\n") + "\r\n";
  }

  /* ------------------------------------------------------------------ */
  /* 공개                                                                 */
  /* ------------------------------------------------------------------ */
  L.teacherAnalysis = {
    LESSON_ID: LESSON_ID,
    QUESTION_IDS: QUESTION_IDS,
    POINT_PER_QUESTION: POINT_PER_QUESTION,
    MAX_SCORE: MAX_SCORE,
    PASS_SCORE: PASS_SCORE,
    MARK_SYMBOL: MARK_SYMBOL,
    MARK_LABEL: MARK_LABEL,

    normalizeRecords: normalizeRecords,
    normalizeOne: normalizeOne,
    summary: summary,
    topStudents: topStudents,
    praiseFor: praiseFor,
    hardestQuestions: hardestQuestions,
    toCsv: toCsv,

    // 학생 명단(선택) — 미제출 학생까지 표에 넣을 때 쓴다
    parseRosterFile: parseRosterFile,
    normalizeId: normalizeId,
    mergeRoster: mergeRoster,

    // 화면 조립과 단위 테스트에서 함께 쓰는 도우미
    parseMark: parseMark,
    inferVariant: inferVariant,
    sameChoiceText: sameChoiceText,
    stripCircled: stripCircled,
    pickedIndexOf: pickedIndexOf,
    decodeEntities: decodeEntities,
    formatTime: formatTime,
    questionMeta: questionMeta,
    markSymbol: function (mark) {
      return MARK_SYMBOL[mark] || "−";
    },
    markLabel: function (mark) {
      return MARK_LABEL[mark] || "무응답";
    }
  };
})();

      ariaLabel: "이전 장 보기",
      onClick: function () {
        goToPage(currentPage - 1);
      }
    });
    refs.btnNext = ui.button({
      label: "다음 →",
      variant: "primary",
      ariaLabel: "다음 장 보기",
      onClick: function () {
        // 마지막 장에서는 「마침」 버튼으로 바뀐다.
        if (currentPage === PAGES.length) finishReview();
        else goToPage(currentPage + 1);
      }
    });
    refs.pageHint = el("p", { "class": "t-pager__hint", attrs: { "aria-live": "polite" } });

    root.appendChild(el("footer", { "class": "t-pager" }, [refs.btnPrev, refs.pageHint, refs.btnNext]));
  }

  /**
   * 아래쪽 이동 버튼의 상태를 정한다.
   *  · 1장에서는 자료를 불러와야 다음 장으로 넘어갈 수 있다.
   *  · 3장에서는 틀린 문제를 «모두» 확인해야 다음 장으로 넘어갈 수 있다.
   *  · 마지막 장에서는 「마침」 버튼이 된다.
   */
  function updatePager() {
    if (!refs.btnNext) return;
    var last = currentPage === PAGES.length;

    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = "다음 →";
      refs.btnNext.classList.remove("btn--finish");
      refs.btnNext.setAttribute("aria-label", "다음 장 보기");

      if (currentPage === 3) {
        var total = wrongList().length;
        // 볼 문제가 아예 없으면(모두 맞혔거나 아직 자료가 없으면) 막지 않는다.
        var ready = view.hardSeen || total === 0;
        refs.btnNext.disabled = !ready;
        refs.btnNext.title = ready
          ? ""
          : "틀린 문제 " + total + "개를 모두 확인하면 넘어갈 수 있어요. (" +
            Math.max(0, view.hardIndex + 1) + " / " + total + ")";
        return;
      }

      var locked = !navUnlocked() && currentPage === 1;
      refs.btnNext.disabled = locked;
      refs.btnNext.title = locked
        ? "먼저 제출 결과를 불러오거나, 아래 [자료 없이 정답표 · 지도 자료 보기] 를 눌러 주세요."
        : "";
      return;
    }

    refs.btnNext.textContent = "마침";
    refs.btnNext.classList.add("btn--finish");
    refs.btnNext.disabled = false;
    refs.btnNext.title = "";
    refs.btnNext.setAttribute("aria-label", "분석 마치기");
  }

  /** 「마침」을 눌렀을 때 */
  function finishReview() {
    refs.pageHint.textContent = "분석을 마쳤어요 🎉 위 번호나 「← 이전」으로 다시 볼 수 있어요.";
    refs.btnNext.disabled = true;
    ui.toast("결과 분석을 마쳤어요.");
    ui.announce("결과 분석을 마쳤습니다.");
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    if (next > 1 && !navUnlocked()) {
      setStatus(
        "error",
        "먼저 제출 결과를 불러와 주세요. 정답표와 지도 자료만 보려면 아래 [자료 없이 정답표 · 지도 자료 보기] 를 누르세요."
      );
      ui.announce("먼저 제출 결과를 불러와 주세요.");
      return;
    }
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;

    [refs.page1, refs.page2, refs.page3, refs.page4].forEach(function (page, i) {
      page.classList.toggle("is-active", i + 1 === no);
    });

    ui.$$(".t-steps__btn", refs.stepper).forEach(function (btn) {
      var n = Number(btn.dataset.page);
      btn.classList.toggle("is-current", n === no);
      btn.classList.toggle("is-locked", n > 1 && !navUnlocked());
      btn.setAttribute("aria-current", n === no ? "page" : "false");
      // 잠긴 장은 색만이 아니라 «글자»로도 알려 준다.
      btn.setAttribute(
        "aria-label",
        n + "장 " + PAGES[n - 1].label +
          (n > 1 && !navUnlocked() ? " (잠김 · 먼저 결과를 불러와 주세요)" : " 보기")
      );
    });

    // 수업 준비 상태에서는 2·4장의 «분석» 자리가 비어 있으므로 그 이유를 알려 준다.
    refs.prepNotes.forEach(function (note) {
      note.hidden = !(prepMode && !dataLoaded);
    });

    updatePager();
    refs.pageHint.textContent =
      no + " / " + PAGES.length + "장 · " + PAGES[no - 1].label +
      (prepMode && !dataLoaded ? " (수업 준비 · 결과 없음)" : "");

    window.scrollTo({ top: 0, behavior: "auto" });
    var page = [refs.page1, refs.page2, refs.page3, refs.page4][no - 1];
    if (page) page.focus({ preventScroll: true });
    ui.announce(no + "장 " + PAGES[no - 1].label);
  }

  /** 자료를 불러온 뒤 나머지 장을 열어 준다. */
  function unlockPages() {
    var first = !dataLoaded;
    dataLoaded = true;
    // 처음 불러왔을 때만 2장으로 넘어간다. (이미 보던 장이 있으면 그 자리에 머문다)
    if (first) showPage(2);
    else showPage(currentPage);
  }

  /** 잠금을 다시 걸고 1장으로 되돌린다. (「불러온 자료 지우기」) */
  function lockPages() {
    dataLoaded = false;
    prepMode = false;
    showPage(1);
  }

  /**
   * 제출 결과 없이 정답표·지도 자료만 보러 간다(수업 준비).
   * 분석 자리는 비어 있으므로 그 사실을 안내하고 3장으로 데려간다.
   */
  function enterPrepMode() {
    prepMode = true;
    setStatus(
      "ok",
      "수업 준비 상태로 열었어요. 3장 아래 «정답표» 와 4장 아래 «화면별 지도 자료» 를 펼쳐 보세요. " +
        "제출 결과를 불러오면 2~4장의 분석이 함께 채워집니다."
    );
    showPage(3);
    ui.toast("정답표와 지도 자료를 열었어요.");
    ui.announce("수업 준비 상태로 3장을 열었습니다.");
  }

  /** 수업 준비 상태에서 «분석이 비어 있는 이유»를 알려 주는 안내 상자 */
  function prepNote() {
    var note = ui.callout(
      "🧭 <strong>수업 준비 상태</strong>입니다. 제출 결과를 아직 불러오지 않아 이 자리의 분석은 비어 있어요.<br />" +
        "정답표는 <strong>3장 아래쪽</strong>, 화면별 지도 자료는 <strong>4장 아래쪽</strong> 접이식 상자에 있습니다. " +
        "결과를 불러오려면 <strong>1장</strong>으로 돌아가세요.",
      { muted: true }
    );
    note.hidden = true;
    refs.prepNotes.push(note);
    return note;
  }

  /* ================================================================== */
  /* 1장 · 제출 결과 불러오기                                              */
  /* ================================================================== */

  function buildSource() {
    var box = ui.panel({
      title: "📥 제출 결과 불러오기",
      hint: "세 가지 방법 중 편한 것을 쓰면 됩니다. 불러오면 2장부터 결과가 열려요.",
      className: "t-source no-print"
    });

    var saved = "";
    try {
      saved = localStorage.getItem(ENDPOINT_KEY) || "";
    } catch (err) {
      saved = "";
    }

    refs.endpoint = el("input", {
      type: "url",
      "class": "t-source__input",
      id: "t-endpoint",
      value: saved,
      attrs: {
        "aria-label": "결과를 읽어올 Apps Script 주소",
        placeholder: "https://script.google.com/macros/s/.../exec",
        spellcheck: "false",
        autocomplete: "off"
      }
    });
    refs.endpoint.addEventListener("keydown", function (e) {
      if (e.key === "Enter") loadFromEndpoint();
    });

    refs.btnLoad = ui.button({
      label: "주소에서 불러오기",
      variant: "primary",
      onClick: loadFromEndpoint
    });

    refs.fileInput = el("input", {
      type: "file",
      accept: ".json,application/json",
      multiple: true,
      "class": "sr-only",
      id: "t-file",
      attrs: { "aria-label": "제출 JSON 파일 열기" }
    });
    refs.fileInput.addEventListener("change", function () {
      if (refs.fileInput.files && refs.fileInput.files.length) {
        readFiles(Array.prototype.slice.call(refs.fileInput.files));
      }
    });

    var btnFile = ui.button({
      label: "JSON 파일 열기",
      variant: "secondary",
      ariaLabel: "제출 JSON 파일 열기. 여러 개를 한꺼번에 고를 수 있습니다.",
      onClick: function () {
        refs.fileInput.click();
      }
    });

    var btnClear = ui.button({
      label: "불러온 자료 지우기",
      variant: "ghost",
      onClick: function () {
        view.records = [];
        view.load = null;
        view.hard = [];
        view.hardIndex = -1;
        view.hardSeen = false;
        refs.fileInput.value = "";
        setStatus("", "불러온 자료를 지웠어요.");
        renderAll();
        lockPages();
        ui.announce("불러온 자료를 지웠습니다. 1장으로 돌아갑니다.");
      }
    });

    refs.status = el("p", {
      "class": "t-status",
      attrs: { "aria-live": "polite" },
      text: "주소를 넣고 「주소에서 불러오기」를 누르거나, JSON 파일을 열어 주세요."
    });

    refs.drop = el("div", {
      "class": "t-drop",
      text: "또는 제출 JSON 파일들을 이 페이지 위로 끌어다 놓으세요."
    });
    setupDragAndDrop();

    box.body.appendChild(
      el("div", { "class": "t-source__row" }, [refs.endpoint, refs.btnLoad, btnFile, btnClear, refs.fileInput])
    );
    box.body.appendChild(refs.status);
    box.body.appendChild(refs.drop);
    box.body.appendChild(
      el("ul", { "class": "t-hint-list" }, [
        el("li", {
          html:
            "주소에서 바로 읽으려면 <code>apps-script/Analytics.gs</code> 를 «별도 프로젝트»로 배포한 " +
            "<code>/exec</code> 주소가 필요합니다. (답안을 저장하는 <code>Code.gs</code> 주소로는 목록을 읽을 수 없어요)"
        }),
        el("li", {
          text: "한 번 입력한 주소는 이 브라우저에 저장되어 다음에 열 때 그대로 남습니다."
        }),
        el("li", {
          text: "배포가 어렵다면 드라이브 폴더에서 JSON 파일을 내려받아 여러 개를 한꺼번에 골라도 됩니다."
        })
      ])
    );

    return box.root;
  }

  function setStatus(kind, message) {
    if (!refs.status) return;
    refs.status.className = "t-status" + (kind ? " is-" + kind : "");
    refs.status.textContent = message;
    refs.status.hidden = !message;
  }

  /* ------------------------------ 끌어다 놓기 ------------------------------ */
  function setupDragAndDrop() {
    var depth = 0;

    function over(e) {
      if (!e.dataTransfer) return;
      e.preventDefault();
      refs.drop.classList.add("is-over");
    }
    function leave() {
      depth -= 1;
      if (depth <= 0) {
        depth = 0;
        refs.drop.classList.remove("is-over");
      }
    }

    document.addEventListener("dragenter", function (e) {
      depth += 1;
      over(e);
    });
    document.addEventListener("dragover", over);
    document.addEventListener("dragleave", leave);
    document.addEventListener("drop", function (e) {
      e.preventDefault();
      depth = 0;
      refs.drop.classList.remove("is-over");
      var all = e.dataTransfer ? Array.prototype.slice.call(e.dataTransfer.files || []) : [];
      var files = all.filter(function (f) {
        return /\.json$/i.test(f.name);
      });
      if (files.length) readFiles(files);
      else if (all.length) setStatus("error", "JSON 파일만 읽을 수 있어요. (" + all.length + "개를 건너뛰었습니다)");
    });
  }

  /* ------------------------------ 주소에서 ------------------------------ */
  function loadFromEndpoint() {
    var url = String(refs.endpoint.value || "").trim();
    if (!url) {
      setStatus("error", "주소를 입력해 주세요.");
      refs.endpoint.focus();
      return;
    }
    if (typeof fetch !== "function") {
      setStatus("error", "이 브라우저에서는 주소로 불러올 수 없어요. 「JSON 파일 열기」를 써 주세요.");
      return;
    }

    refs.btnLoad.disabled = true;
    setStatus("loading", "제출 결과를 불러오는 중입니다…");

    fetch(url, { method: "GET", redirect: "follow" })
      .then(function (res) {
        if (!res.ok) throw new Error("서버 응답 오류 (HTTP " + res.status + ")");
        return res.json();
      })
      .then(function (data) {
        // 서버가 스스로 문제를 알려 온 경우에는 그 내용을 그대로 보여 준다
        // (폴더 권한·폴더 ID 문제를 바로 알아볼 수 있게).
        if (data && data.ok === false) {
          setStatus("error", "서버가 오류를 알려 왔어요. " + (data.error || "내용이 없습니다."));
          return;
        }
        var list = extractItems(data);
        if (!list) {
          setStatus(
            "error",
            "이 주소는 제출 목록(items)을 돌려주지 않아요. 답안을 «저장»하는 주소가 아니라 " +
              "apps-script/Analytics.gs 를 배포한 «조회용» 주소가 필요합니다."
          );
          return;
        }
        if (!list.length) {
          setStatus("error", "아직 제출된 답안이 없어요.");
          return;
        }
        try {
          localStorage.setItem(ENDPOINT_KEY, url);
        } catch (err) {
          /* 저장하지 못해도 불러오기는 끝났으므로 넘어간다 */
        }
        applyRecords(list, "주소에서 " + list.length + "건을 받았어요.");
      })
      ["catch"](function (err) {
        setStatus(
          "error",
          "불러오지 못했어요. (" +
            ((err && err.message) || "알 수 없는 오류") +
            ") 주소가 맞는지, 웹앱이 「모든 사용자」로 배포되었는지 확인해 주세요."
        );
      })
      .then(function () {
        refs.btnLoad.disabled = false;
      });
  }

  /** 응답에서 제출 배열을 찾아낸다. Analytics.gs 는 items 로 준다. */
  function extractItems(data) {
    if (Array.isArray(data)) return data;
    if (!data || typeof data !== "object") return null;
    var keys = ["items", "submissions", "data", "results", "list", "files"];
    for (var i = 0; i < keys.length; i += 1) {
      if (Array.isArray(data[keys[i]])) return data[keys[i]];
    }
    return null;
  }

  /* ------------------------------ 파일에서 ------------------------------ */
  function readOne(file) {
    if (typeof file.text === "function") return file.text();
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        resolve(String(reader.result || ""));
      };
      reader.onerror = function () {
        reject(new Error("파일을 읽지 못했습니다."));
      };
      reader.readAsText(file, "utf-8");
    });
  }

  function readFiles(files) {
    setStatus("loading", files.length + "개 파일을 읽는 중입니다…");

    var list = [];
    var broken = 0;

    var jobs = files.map(function (file) {
      return readOne(file)
        .then(function (text) {
          var parsed = JSON.parse(String(text).replace(/^﻿/, ""));
          if (Array.isArray(parsed)) {
            parsed.forEach(function (one) {
              if (one && typeof one === "object") one.__fileName = file.name;
              list.push(one);
            });
          } else {
            if (parsed && typeof parsed === "object") parsed.__fileName = file.name;
            list.push(parsed);
          }
        })
        ["catch"](function () {
          broken += 1;
        });
    });

    Promise.all(jobs).then(function () {
      if (!list.length) {
        setStatus("error", "읽을 수 있는 JSON 이 없어요. 파일 형식을 확인해 주세요. (" + broken + "개 실패)");
        return;
      }
      applyRecords(
        list,
        "파일 " + files.length + "개에서 " + list.length + "건을 읽었어요." +
          (broken ? " (" + broken + "개는 읽지 못했습니다)" : "")
      );
    });
  }

  /* ------------------------------ 반영 ------------------------------ */
  function applyRecords(rawList, headline) {
    var load = A.normalizeRecords(rawList);
    view.load = load;
    view.records = load.records;
    view.hard = A.hardestQuestions(load.records);
    view.hardIndex = -1;
    view.hardSeen = false;

    if (!load.records.length) {
      setStatus(
        "error",
        headline + " 그런데 이 차시의 제출로 알아볼 수 있는 자료가 없어요. " + skipText(load)
      );
      renderAll();
      // 볼 자료가 없으므로 2~4장을 다시 잠그고 1장으로 돌아온다.
      // (그대로 두면 2~4장이 빈 화면이 되어 왜 비었는지 알 수 없다)
      lockPages();
      ui.announce("불러올 수 있는 자료가 없어 1장으로 돌아갑니다.");
      return;
    }

    var parts = [headline, "학생 " + load.kept + "명을 집계했어요."];
    if (load.replaced) parts.push("같은 학생의 재제출 " + load.replaced + "건은 가장 나중 것만 썼어요.");
    var skip = skipText(load);
    if (skip) parts.push(skip);

    setStatus(skip ? "error" : "ok", parts.join(" "));
    ui.announce("제출 " + load.kept + "명의 결과를 정리했습니다.");
    renderAll();
    unlockPages(); // 처음 불러오면 2장(요약 · 상위 3명)으로 넘어간다
  }

  /** 건너뛴 파일이 몇 건인지, 왜 건너뛰었는지 한 문장으로 */
  function skipText(load) {
    if (!load.skipped) return "";
    var r = load.skippedReason;
    var why = [];
    if (r.otherLesson) why.push("다른 차시 " + r.otherLesson + "건");
    if (r.noStudent) why.push("학번·이름을 못 찾음 " + r.noStudent + "건");
    if (r.noAnswers) why.push("답안이 없음 " + r.noAnswers + "건");
    if (r.invalid) why.push("형식이 다름 " + r.invalid + "건");
    return "형식이 맞지 않아 " + load.skipped + "건을 건너뛰었어요. (" + why.join(" · ") + ")";
  }

  /* ================================================================== */
  /* 2~4장 그리기                                                         */
  /* ================================================================== */

  /** 불러온 자료가 바뀔 때마다 2·3·4장을 통째로 다시 그린다. */
  function renderAll() {
    // 문항 은행이 없을 때 쓰는 «간이 정답표»도 같은 자료를 보므로 함께 새로 그린다.
    renderKeyFallback();

    ui.clear(refs.summarySection);
    ui.clear(refs.podiumSection);
    ui.clear(refs.hardSection);

    var has = view.records.length > 0;
    refs.empty.hidden = has;

    if (has) {
      refs.summarySection.appendChild(renderSummary());
      refs.podiumSection.appendChild(renderPodium());
      refs.hardSection.appendChild(renderHardest());
    }

    renderRosterArea();
    updatePager();
  }

  /**
   * 4장의 「전체 명단 · 정오표」 자리만 다시 그린다.
   *
   * 명단을 올리거나 지웠을 때는 «답안»이 바뀐 것이 아니므로 이 자리만 고쳐 그린다.
   * (renderAll 을 부르면 3장의 「가장 많이 틀린 문제」가 처음으로 되돌아가면서
   *  이미 다 보고 열어 둔 아래쪽 「다음 →」 이 다시 잠겨 버린다)
   */
  function renderRosterArea() {
    ui.clear(refs.rosterSection);

    if (!view.records.length) {
      // 명단만 먼저 올려 둔 경우에는 그 사실을 알려 준다.
      if (view.roster) {
        refs.rosterSection.appendChild(
          el("div", { "class": "panel t-empty" }, [
            el("p", {
              text:
                "학생 명단 " + view.roster.students.length +
                "명은 준비됐어요. 답안을 불러오면 누가 제출하지 않았는지 바로 표시됩니다."
            })
          ])
        );
      }
      return;
    }

    refs.rosterSection.appendChild(renderRoster());
  }

  /* ------------------------------ 전체 요약 ------------------------------ */
  function renderSummary() {
    var s = A.summary(view.records);
    var box = ui.panel({
      title: "📊 전체 요약",
      hint: "총 " + s.maxScore + "점 만점 · " + s.passScore + "점 이상이면 이수입니다."
    });

    box.body.appendChild(
      el("div", { "class": "t-stats" }, [
        statCard("제출 학생", s.count, "명"),
        statCard("평균 점수", s.average, "/ " + s.maxScore + "점"),
        statCard("최고 점수", s.highest, "점"),
        statCard("최저 점수", s.lowest, "점"),
        statCard("만점자", s.perfect, "명"),
        statCard("이수", s.passedCount, "명 (" + s.passRate + "%)")
      ])
    );

    if (s.latest) {
      box.body.appendChild(el("p", { "class": "panel__hint", text: "마지막 제출 : " + s.latest }));
    }
    if (s.failedCount) {
      box.body.appendChild(
        el("p", {
          "class": "panel__hint",
          text:
            "미이수 " + s.failedCount + "명은 틀린 문항의 보충 화면으로 돌아가 다시 학습하도록 안내해 주세요."
        })
      );
    }
    if (view.load && view.load.replaced) {
      box.body.appendChild(
        el("p", {
          "class": "panel__hint",
          text:
            "제출 파일 " + view.load.total + "건 가운데 같은 학생의 재제출 " + view.load.replaced +
            "건은 가장 나중 것만 집계했어요."
        })
      );
    }
    if (s.mismatch) {
      box.body.appendChild(
        el("div", { "class": "t-warn" }, [
          el("p", {
            html:
              "파일에 적힌 점수와 다시 채점한 점수가 다른 제출이 <strong>" + s.mismatch +
              "명</strong> 있어요. 이 화면의 점수는 답안(정오 표시)을 근거로 <strong>다시 채점한 값</strong>입니다."
          })
        ])
      );
    }
    if (s.unknown) {
      box.body.appendChild(
        el("div", { "class": "t-warn" }, [
          el("p", {
            html:
              "정답 여부를 알아볼 수 없는 답안이 있는 학생이 <strong>" + s.unknown +
              "명</strong> 있어요. 저장 형식이 바뀌지 않았는지 확인해 주세요. (알 수 없는 답안은 0점으로 셉니다)"
          })
        ])
      );
    }

    return box.root;
  }

  /* ------------------------------ 상위 3명 ------------------------------ */
  function renderPodium() {
    var top = A.topStudents(view.records, 3);
    var box = ui.panel({
      title: "🏆 상위 3명",
      hint: "점수가 같으면 먼저 제출한 학생을 앞에 둡니다."
    });

    if (!top.length) {
      box.body.appendChild(el("p", { "class": "t-empty", text: "표시할 학생이 없어요." }));
      return box.root;
    }

    box.body.appendChild(
      el(
        "div",
        { "class": "t-podium" },
        top.map(function (student) {
          var praise = A.praiseFor(student.rank, student);
          return el("article", { "class": "t-card t-card--" + Math.min(student.rank, 3) }, [
            el("div", {}, [
              el("span", { "class": "t-card__medal", text: praise.medal, attrs: { "aria-hidden": "true" } }),
              el("span", { "class": "t-card__rank", text: praise.title })
            ]),
            el("h3", { "class": "t-card__name", text: student.name || "(이름 없음)" }),
            el("p", { "class": "t-card__meta", text: "학번 " + (student.studentId || "-") }),
            el("p", {
              "class": "t-card__score",
              html: student.score + " <small>점 / " + A.MAX_SCORE + "점</small>"
            }),
            el("p", {
              "class": "t-card__praise",
              text: (student.name || "학생") + " 님, " + praise.message
            })
          ]);
        })
      )
    );

    return box.root;
  }

  /* ------------------------ 3장 · 가장 많이 틀린 문제 ------------------------ */

  /** 틀린 학생이 한 명이라도 있는 문항만 (오답률 높은 순) */
  function wrongList() {
    return view.hard.filter(function (q) {
      return q.wrong > 0;
    });
  }

  function renderHardest() {
    var list = wrongList();

    var box = ui.panel({
      title: "📌 가장 많이 틀린 문제",
      hint: "버튼을 누를 때마다 한 문제씩, 오답률이 높은 순서로 보여 줍니다."
    });

    // 이 자리를 새로 그리면 보여 주던 문제 카드도 사라지므로 순서를 처음으로 되돌린다.
    view.hardIndex = -1;

    refs.btnHard = ui.button({
      label: "가장 많이 틀린 문제 보기",
      variant: "primary",
      onClick: showNextHard
    });
    refs.hardProgress = el("p", { "class": "t-wrong__progress", attrs: { "aria-live": "polite" } });
    refs.hardBody = el("div", {});

    box.body.appendChild(el("div", { "class": "t-wrong__controls no-print" }, [refs.btnHard, refs.hardProgress]));
    box.body.appendChild(refs.hardBody);

    if (!list.length) {
      refs.btnHard.disabled = true;
      refs.btnHard.title = "모든 학생이 전 문항을 맞혔어요.";
      refs.hardProgress.textContent = "🎉 틀린 문항이 없어요. 모두 잘 이해했습니다!";
      view.hardSeen = true; // 볼 문제가 없으면 바로 다음 장으로 넘어갈 수 있다
    } else {
      refs.hardProgress.textContent =
        "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요. 모두 확인하면 다음 장이 열려요.";
      view.hardSeen = false;
    }

    return box.root;
  }

  function showNextHard() {
    var list = wrongList();
    if (!list.length) return;

    view.hardIndex += 1;

    // 마지막까지 본 뒤 한 번 더 누르면 처음으로 돌아간다.
    if (view.hardIndex >= list.length) {
      view.hardIndex = -1;
      ui.clear(refs.hardBody);
      refs.btnHard.textContent = "가장 많이 틀린 문제 보기";
      refs.hardProgress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
      ui.announce("처음으로 돌아갔습니다.");
      updatePager();
      return;
    }

    var item = list[view.hardIndex];
    ui.clear(refs.hardBody);
    refs.hardBody.appendChild(hardCard(item, view.hardIndex + 1));

    var isLast = view.hardIndex === list.length - 1;
    refs.btnHard.textContent = isLast ? "처음부터 다시 보기" : "다음 문제 보기";
    refs.hardProgress.textContent = view.hardIndex + 1 + " / " + list.length + " 문제 보는 중";
    ui.announce(
      "오답 " + (view.hardIndex + 1) + "위, " + item.id + "번 문항입니다. 오답률 " + item.wrongRate + "퍼센트."
    );

    // 마지막 문제까지 확인하면 아래쪽 「다음 →」 이 열린다.
    if (isLast && !view.hardSeen) {
      view.hardSeen = true;
      ui.toast("틀린 문제를 모두 확인했어요. 아래 「다음 →」 으로 넘어갈 수 있어요.");
    }
    updatePager();
  }

  function hardCard(item, order) {
    var card = el("div", { "class": "t-wrong__card" });
    var guide = K.questionGuide(item.id);

    card.appendChild(el("span", { "class": "t-wrong__rank", text: "오답 " + order + "위" }));
    card.appendChild(
      el("h3", {
        "class": "t-wrong__title",
        text: item.id + "번 · " + (item.topic || "형성평가 문항")
      })
    );
    if (item.stem) {
      card.appendChild(el("p", { "class": "t-wrong__prompt", text: item.stem }));
    }

    /* 오답률 막대 — 숫자를 글자로도 함께 적는다 */
    card.appendChild(
      el(
        "div",
        {
          "class": "t-bar",
          attrs: {
            role: "img",
            "aria-label": item.total + "명 중 " + item.wrong + "명이 틀렸습니다. 오답률 " + item.wrongRate + "퍼센트."
          }
        },
        [
          el("div", { "class": "t-bar__fill", style: { width: item.wrongRate + "%" } }),
          el("span", {
            "class": "t-bar__label",
            text: item.total + "명 중 " + item.wrong + "명이 틀렸어요 (" + item.wrongRate + "%)"
          })
        ]
      )
    );

    /* 어떤 답을 골랐는지 — 변형(문제지)에 따라 정답이 다르면 문제지별로 나누어 센다 */
    var groups = (item.groups || []).filter(function (g) {
      return g.distribution && g.distribution.length;
    });
    if (groups.length) {
      groups.forEach(function (g) {
        if (groups.length > 1) {
          card.appendChild(
            ui.sectionTitle(
              "문제지",
              (g.label || "정답 " + g.correct) + " — " + g.count + "명 (틀린 학생 " + g.wrong + "명)"
            )
          );
        }
        var wrongCounts = g.distribution
          .filter(function (d) {
            return !d.isAnswer && d.index !== -2;
          })
          .map(function (d) {
            return d.count;
          });
        var topWrong = wrongCounts.length ? Math.max.apply(null, wrongCounts) : 0;

        card.appendChild(
          el(
            "div",
            { "class": "t-options" },
            g.distribution.map(function (d) {
              var cls = "t-option";
              if (d.isAnswer) cls += " is-answer";
              else if (d.index !== -2 && d.count > 0 && d.count === topWrong) cls += " is-top-wrong";
              return el("div", { "class": cls }, [
                el("span", {
                  "class": "t-option__text",
                  text: d.label + (d.isAnswer ? "  ← 정답" : "")
                }),
                el("span", { "class": "t-option__count", text: d.count + "명" })
              ]);
            })
          )
        );
      });

      card.appendChild(
        el("p", {
          "class": "panel__hint",
          text:
            groups.length > 1
              ? "이 문항은 재도전 문제지마다 정답이 달라서 문제지별로 나누어 셌어요. " +
                "각 표 안에서 「← 정답」 글자가 붙은 줄이 그 문제지의 정답입니다."
              : "「← 정답」 글자가 붙은 줄이 정답입니다. 색이 보이지 않아도 글자로 구분할 수 있어요."
        })
      );
    }

    /* 정답과 해설 */
    var explain = el("div", { "class": "t-explain" });
    explain.appendChild(el("p", { "class": "t-explain__label", text: "정답" }));
    if (item.correctTexts.length > 1) {
      explain.appendChild(
        el("p", { text: "재도전 문제지마다 정답이 다른 문항이에요. 문제지별 정답은 다음과 같습니다." })
      );
      explain.appendChild(
        el(
          "ul",
          { "class": "t-hint-list" },
          (item.groups || []).map(function (g) {
            return el("li", { text: (g.label ? g.label + " → " + g.correct : "정답 " + g.correct) + " (" + g.count + "명)" });
          })
        )
      );
    } else {
      explain.appendChild(el("p", { text: item.correctTexts[0] || "(정답 정보를 찾지 못했어요)" }));
    }
    if (item.explain) {
      explain.appendChild(
        el("p", { "class": "t-explain__label", style: { marginTop: "10px" }, text: "해설" })
      );
      explain.appendChild(el("p", { html: item.explain }));
      if (item.variantMixed) {
        explain.appendChild(
          el("p", {
            "class": "panel__hint",
            text: "해설은 기본 변형 기준입니다. 재도전 변형은 숫자만 달라지고 원리는 같습니다."
          })
        );
      }
    }
    card.appendChild(explain);

    /* 수업 팁 */
    if (guide) {
      card.appendChild(
        el("div", { "class": "t-teach" }, [
          el("p", { html: "<strong>💡 이렇게 짚어 주세요</strong>" }),
          el("p", { text: "자주 나오는 오답 — " + guide.watch }),
          el("p", { text: "왜 그럴까요 — " + guide.why }),
          el("p", { text: "수업에서 — " + guide.tip })
        ])
      );
    }
    if (item.reviewStep) {
      card.appendChild(
        el("p", {
          "class": "panel__hint",
          text: "보충 화면 : " + K.reviewLabel(item.reviewStep)
        })
      );
    }

    return card;
  }

  /* ================================================================== */
  /* 4장 · 학생 명단 올리기                                                */
  /* ================================================================== */

  /**
   * 명단은 «선택 사항»이다. 올리지 않으면 제출한 학생만 표에 나오고,
   * 올리면 제출하지 않은 학생까지 「미제출」로 함께 나온다.
   */
  function buildRosterSource() {
    var box = ui.panel({
      title: "📎 학생 명단 올리기 (선택)",
      hint:
        "엑셀(.xlsx) 또는 CSV 파일을 올리면 «제출하지 않은 학생»까지 아래 전체 명단에 표시됩니다. " +
        "올리지 않아도 나머지 기능은 모두 그대로 쓸 수 있어요.",
      className: "t-roster-src no-print"
    });

    refs.rosterFile = el("input", {
      type: "file",
      accept: ".xlsx,.csv,.tsv,.txt",
      "class": "sr-only",
      id: "t-roster-file",
      attrs: { "aria-label": "학생 명단 파일 선택" }
    });
    refs.rosterFile.addEventListener("change", function () {
      var file = refs.rosterFile.files && refs.rosterFile.files[0];
      if (file) loadRoster(file);
    });

    var btnPick = ui.button({
      label: "명단 파일 선택",
      variant: "secondary",
      ariaLabel: "학생 명단 파일 선택. 엑셀 또는 CSV 파일 하나를 고릅니다.",
      onClick: function () {
        refs.rosterFile.click();
      }
    });

    refs.btnRosterClear = ui.button({
      label: "명단 지우기",
      variant: "ghost",
      disabled: true,
      onClick: function () {
        view.roster = null;
        refs.rosterFile.value = "";
        refs.btnRosterClear.disabled = true;
        setRosterStatus("", "명단을 올리면 제출하지 않은 학생까지 확인할 수 있어요.");
        renderRosterArea();
        ui.announce("학생 명단을 지웠습니다.");
      }
    });

    refs.rosterStatus = el("p", {
      "class": "t-status",
      attrs: { "aria-live": "polite" },
      text: "명단을 올리면 제출하지 않은 학생까지 확인할 수 있어요."
    });

    box.body.appendChild(
      el("div", { "class": "t-source__row" }, [btnPick, refs.btnRosterClear, refs.rosterFile])
    );
    box.body.appendChild(refs.rosterStatus);
    box.body.appendChild(
      el("ul", { "class": "t-hint-list" }, [
        el("li", {
          html:
            "첫 줄에 <code>학번</code> · <code>이름</code> 머리글이 있으면 자동으로 찾아요. " +
            "머리글이 없으면 <strong>첫 번째 열을 학번, 두 번째 열을 이름</strong>으로 읽습니다."
        }),
        el("li", { text: "엑셀이 열리지 않으면 「다른 이름으로 저장 → CSV UTF-8」로 저장해 올려 주세요." }),
        el("li", { text: "명단도 이 브라우저 안에서만 쓰이고 어디로도 전송되지 않습니다." })
      ])
    );

    return box.root;
  }

  function setRosterStatus(kind, message) {
    if (!refs.rosterStatus) return;
    refs.rosterStatus.className = "t-status" + (kind ? " is-" + kind : "");
    refs.rosterStatus.textContent = message;
  }

  function loadRoster(file) {
    setRosterStatus("loading", file.name + " 을(를) 읽는 중입니다…");
    A.parseRosterFile(file)
      .then(function (result) {
        view.roster = result;
        refs.btnRosterClear.disabled = false;
        setRosterStatus(
          "ok",
          "명단 " + result.students.length + "명을 읽었어요. (" + file.name + ")" +
            (result.warnings.length ? " · 건너뛴 줄 " + result.warnings.length + "개" : "")
        );
        ui.announce("학생 명단 " + result.students.length + "명을 불러왔습니다.");
        renderRosterArea();
      })
      ["catch"](function (err) {
        view.roster = null;
        refs.btnRosterClear.disabled = true;
        setRosterStatus("error", (err && err.message) || "명단을 읽지 못했어요.");
      });
  }

  /* ------------------------- 4장 · 전체 명단 · 정오표 ------------------------- */
  function renderRoster() {
    var merged = A.mergeRoster(view.records, view.roster);

    var box = ui.panel({
      title: "📋 전체 명단 · 정오표",
      hint:
        "문항별 정오와 총점, 이수 여부를 한 표로 봅니다. ○ 정답 · ✕ 오답 · − 무응답 · ? 알 수 없음" +
        (merged.hasRoster ? " · 제출하지 않은 학생은 「미제출」로 표시합니다." : ""),
      className: "t-fulllist"
    });

    if (merged.hasRoster) {
      box.body.appendChild(
        el("div", { "class": "t-stats" }, [
          statCard("명단 인원", view.roster.students.length, "명"),
          statCard("제출", merged.submittedCount, "명"),
          statCard("미제출", merged.missingCount, "명")
        ])
      );
      if (merged.missingCount) {
        box.body.appendChild(
          el("p", {
            "class": "panel__hint",
            text:
              "미제출 " + merged.missingCount + "명 : " +
              merged.missing
                .map(function (row) {
                  return (row.name || "이름 없음") + "(" + row.studentId + ")";
                })
                .join(" · ")
          })
        );
      }
      if (merged.extraCount) {
        box.body.appendChild(
          el("div", { "class": "t-warn" }, [
            el("p", {
              html:
                "명단에 없는 학번으로 제출한 학생이 <strong>" + merged.extraCount +
                "명</strong> 있어요. 표 아래쪽에 「명단 밖」으로 표시했습니다. 학번을 잘못 적었는지 확인해 주세요."
            })
          ])
        );
      }
    } else {
      box.body.appendChild(
        el("p", {
          "class": "panel__hint no-print",
          text: "위에서 학생 명단을 올리면 명단 순서대로, 제출하지 않은 학생까지 빠짐없이 표시됩니다."
        })
      );
    }

    var head = el("tr", {}, [
      el("th", { scope: "col", text: "학번" }),
      el("th", { scope: "col", text: "이름" })
    ]);
    A.QUESTION_IDS.forEach(function (id) {
      head.appendChild(el("th", { scope: "col", text: id + "번" }));
    });
    head.appendChild(el("th", { scope: "col", text: "총점" }));
    head.appendChild(el("th", { scope: "col", text: "이수" }));
    head.appendChild(el("th", { scope: "col", text: "제출 시각" }));

    var body = merged.rows.map(function (item) {
      var r = item.record;
      var tr = el("tr", { "class": r ? "" : "is-missing" }, [
        el("th", { scope: "row", text: item.studentId || "-" }),
        el("td", {
          text: (item.name || "-") + (merged.hasRoster && !item.inRoster ? " (명단 밖)" : "")
        })
      ]);

      if (!r) {
        // 제출하지 않은 학생 — 문항 칸을 통째로 묶어 「미제출」이라고 적는다.
        tr.appendChild(
          el("td", {
            "class": "t-missing",
            colSpan: A.QUESTION_IDS.length + 3,
            text: "미제출",
            attrs: { "aria-label": (item.name || item.studentId) + " 미제출" }
          })
        );
        return tr;
      }

      A.QUESTION_IDS.forEach(function (id) {
        var mark = "none";
        r.answers.forEach(function (a) {
          if (a.id === id) mark = a.mark;
        });
        tr.appendChild(
          el("td", {
            "class": "t-mark " + (mark === "correct" ? "is-o" : mark === "wrong" ? "is-x" : "is-none"),
            text: A.markSymbol(mark),
            attrs: { "aria-label": id + "번 " + A.markLabel(mark) }
          })
        );
      });
      tr.appendChild(el("td", { "class": "t-score", text: r.score + "점" }));
      tr.appendChild(el("td", { text: r.passedText }));
      tr.appendChild(el("td", { text: r.receivedText || "-" }));
      return tr;
    });

    box.body.appendChild(
      // 좁은 화면에서는 표만 옆으로 밀린다. 키보드로도 밀 수 있게 초점을 받을 수 있게 한다.
      el(
        "div",
        {
          "class": "t-table-wrap",
          attrs: { tabindex: "0", role: "region", "aria-label": "전체 명단 표 (좌우로 밀어서 볼 수 있어요)" }
        },
        [
        el("table", { "class": "data-table t-list-table" }, [
          el("caption", { "class": "sr-only", text: "형성평가 제출 학생 전체 명단과 문항별 정오표" }),
          el("thead", {}, [head]),
          el("tbody", {}, body)
        ])
        ]
      )
    );

    box.body.appendChild(
      ui.buttonRow([
        ui.button({
          label: "🖨 이 표 인쇄하기",
          variant: "primary",
          onClick: function () {
            stampPrintDate();
            window.print();
          }
        }),
        ui.button({
          label: "⬇ CSV 로 내려받기",
          variant: "secondary",
          onClick: downloadCsv
        })
      ])
    );
    box.body.appendChild(
      el("p", {
        "class": "panel__hint no-print",
        text:
          "인쇄하면 지금 보고 있는 장만 나옵니다. 인쇄 창에서 「머리글/바닥글」을 끄면 " +
          "브라우저가 장마다 넣는 날짜와 주소가 사라져 깔끔합니다."
      })
    );

    return box.root;
  }

  function downloadCsv() {
    var text = A.toCsv(view.records, view.roster);
    var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = el("a", { href: url, download: "조건이여러개라면_형성평가_결과.csv" });
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
    ui.toast("CSV 파일로 저장했어요.");
  }

  /* ================================================================== */
  /* 3장 접이식 · 정답표                                                   */
  /* ================================================================== */

  function buildAnswerKeyPanel(root) {
    if (!K.hasQuiz()) {
      var box = ui.panel({ title: "📄 정답표" });
      box.body.appendChild(
        el("div", { "class": "t-warn" }, [
          el("p", { text: K.MISSING_QUIZ_NOTICE }),
          el("p", {
            html:
              "고치는 방법 — <code>src/teacher.html</code> 의 " +
              "<code>teacher/t10-answerkey.js</code> 줄 <strong>바로 앞</strong>에 " +
              "<code>&lt;script src=\"js/45-quiz.js\"&gt;&lt;/script&gt;</code> 한 줄을 넣고 " +
              "<code>node build.mjs</code> 를 다시 실행하면 문항·보기·해설이 모두 나타납니다."
          })
        ])
      );
      // 문항 은행이 없어도, 불러온 답안에 함께 저장된 지문과 정답으로 «간이 정답표»를 만든다.
      refs.keyFallback = el("div", { "class": "stack stack--lg" });
      box.body.appendChild(refs.keyFallback);
      root.appendChild(box.root);
      renderKeyFallback();
      return;
    }

    /* --- 변형 0~2 한눈에 보기 --- */
    var over = K.overview();
    var overBox = ui.panel({
      title: "📄 문항 한눈에 보기 (변형 " + over.variants.length + "가지)",
      hint:
        "재도전하면 문항 순서와 숫자가 바뀐 변형이 나옵니다. 변형에 따라 정답이 달라지는 문항은 " +
        "「변형마다 다름」으로 표시했어요."
    });

    var overHead = el("tr", {}, [
      el("th", { scope: "col", text: "문항" }),
      el("th", { scope: "col", text: "묻는 것" }),
      el("th", { scope: "col", text: "배점" }),
      el("th", { scope: "col", text: "보충 화면" })
    ]);
    over.variants.forEach(function (v) {
      overHead.appendChild(el("th", { scope: "col", text: v.label }));
    });

    var overBody = over.rows.map(function (row) {
      var tr = el("tr", {}, [
        el("th", { scope: "row" }, [
          el("div", { text: row.id + "번" }),
          // 변형에 따라 정답이 달라지는 문항은 여기에서 바로 알아볼 수 있게 표시한다.
          row.sameAnswer ? null : el("div", { "class": "panel__hint", text: "변형마다 정답 다름" })
        ]),
        el("td", { text: row.topic }),
        el("td", { text: row.points + "점" }),
        // 화면 이름 전체는 아래 카드에 있으므로 표에서는 번호만 짧게 적는다.
        el("td", { text: "화면 " + row.reviewStep })
      ]);
      row.cells.forEach(function (cell) {
        tr.appendChild(
          // 칸이 좁아도 읽히도록 「제시 순서 · 정답 번호」만 넣고, 정답 전문은 title 로 붙인다.
          el("td", {
            attrs: { title: cell.correct, "aria-label": cell.order + "번째로 제시, 정답 " + cell.correct }
          }, [
            el("div", { text: cell.order + "번째" }),
            el("div", { html: "<strong>정답 " + ui.escapeHtml(cell.correctShort) + "</strong>" })
          ])
        );
      });
      return tr;
    });

    overBox.body.appendChild(
      el(
        "div",
        {
          "class": "t-table-wrap",
          attrs: { tabindex: "0", role: "region", "aria-label": "변형별 문항 정답표 (좌우로 밀어서 볼 수 있어요)" }
        },
        [
        el("table", { "class": "data-table" }, [
          el("caption", { "class": "sr-only", text: "변형별 문항 제시 순서와 정답" }),
          el("thead", {}, [overHead]),
          el("tbody", {}, overBody)
        ])
        ]
      )
    );
    overBox.body.appendChild(
      el("p", {
        "class": "panel__hint",
        text:
          "표의 ①②③④ 는 보기 번호입니다. 문제 내용과 해설 전문은 아래 「변형별 문항 · 정답 · 해설」에 있어요."
      })
    );
    overBox.body.appendChild(
      el("p", {
        "class": "panel__hint",
        text:
          "채점 : 5문항 × " + K.POINT_PER_QUESTION + "점 = " + K.MAX_SCORE + "점 만점, " +
          K.PASS_SCORE + "점 이상이면 이수입니다."
      })
    );
    root.appendChild(overBox.root);

    /* --- 변형별 자세히 보기 --- */
    var detailBox = ui.panel({
      title: "📝 변형별 문항 · 정답 · 해설",
      hint: "보고 싶은 변형을 고르세요. 학생이 실제로 푼 문항을 그대로 보여 줍니다."
    });

    refs.keyChips = ui.chipRow({
      values: over.variants.map(function (v) {
        return v.index;
      }),
      format: function (index) {
        return K.VARIANT_LABEL[index] || "변형 " + (index + 1);
      },
      ariaLabel: "정답표에서 볼 변형 고르기",
      onSelect: function (index) {
        view.keyVariant = index;
        saveView();
        selectKeyVariant(index);
        renderAnswerKeyDetail();
      }
    });
    refs.keyChipButtons = ui.$$(".chip", refs.keyChips.root);
    refs.keyDetail = el("div", { "class": "stack" });

    detailBox.body.appendChild(refs.keyChips.root);
    detailBox.body.appendChild(refs.keyDetail);
    root.appendChild(detailBox.root);

    if (view.keyVariant >= over.variants.length) view.keyVariant = 0;
    selectKeyVariant(view.keyVariant);
    renderAnswerKeyDetail();
  }

  /**
   * 지금 보고 있는 변형을 표시한다.
   * 색만으로 구분하지 않도록 aria-pressed 와 「✓」 글자를 함께 붙인다.
   */
  function selectKeyVariant(index) {
    refs.keyChips.setActive(index);
    refs.keyChipButtons.forEach(function (chip, i) {
      var on = i === index;
      var label = K.VARIANT_LABEL[i] || "변형 " + (i + 1);
      chip.textContent = (on ? "✓ " : "") + label;
      chip.setAttribute("aria-pressed", String(on));
      chip.setAttribute("aria-label", label + " 문제지의 정답표 보기");
    });
  }

  /**
   * 문항 은행이 실려 있지 않을 때 쓰는 «간이 정답표».
   * 문항 내용을 여기서 새로 쓰지 않는다. 학생이 제출한 답안에 함께 저장된
   * 지문(question)과 정답(correctAnswer)을 그대로 모아 보여 줄 뿐이다.
   */
  function renderKeyFallback() {
    if (!refs.keyFallback) return;
    ui.clear(refs.keyFallback);

    if (!view.records.length) {
      refs.keyFallback.appendChild(
        el("p", {
          "class": "panel__hint",
          text:
            "제출 결과를 불러오면, 학생 답안에 함께 저장된 문제 지문과 정답으로 간이 정답표를 만들어 여기에 보여 줍니다."
        })
      );
      return;
    }

    var rows = A.hardestQuestions(view.records).slice().sort(function (a, b) {
      return a.id - b.id;
    });

    refs.keyFallback.appendChild(
      el("p", {
        "class": "panel__hint",
        text:
          "불러온 답안 " + view.records.length + "명분에서 모은 간이 정답표입니다. " +
          "보기 목록과 해설은 문항 은행이 있어야 나옵니다."
      })
    );

    rows.forEach(function (row) {
      var guide = K.questionGuide(row.id);
      var card = el("article", { "class": "t-card" }, [
        el("h3", { "class": "t-wrong__title", text: row.id + "번 · " + (row.topic || "형성평가 문항") }),
        el("p", { "class": "t-wrong__prompt", text: row.stem || "(지문을 찾지 못했어요)" })
      ]);

      var explain = el("div", { "class": "t-explain" }, [
        el("p", { "class": "t-explain__label", text: "정답" })
      ]);
      if (row.correctTexts.length > 1) {
        explain.appendChild(
          el(
            "ul",
            { "class": "t-hint-list" },
            row.groups.map(function (g) {
              return el("li", { text: (g.label ? g.label + " → " + g.correct : "정답 " + g.correct) + " (" + g.count + "명)" });
            })
          )
        );
      } else {
        explain.appendChild(el("p", { text: row.correctTexts[0] || "(정답을 찾지 못했어요)" }));
      }
      if (row.reviewStep) {
        explain.appendChild(
          el("p", { "class": "t-explain__label", style: { marginTop: "10px" }, text: "틀렸을 때 돌아갈 화면" })
        );
        explain.appendChild(el("p", { text: K.reviewLabel(row.reviewStep) }));
      }
      card.appendChild(explain);

      if (guide) {
        card.appendChild(
          el("div", { "class": "t-teach" }, [
            el("p", { html: "<strong>💡 지도 포인트</strong>" }),
            el("p", { text: "자주 나오는 오답 — " + guide.watch }),
            el("p", { text: "왜 그럴까요 — " + guide.why }),
            el("p", { text: "수업에서 — " + guide.tip })
          ])
        );
      }
      refs.keyFallback.appendChild(card);
    });
  }

  function renderAnswerKeyDetail() {
    var rows = K.answerRows(view.keyVariant);
    ui.clear(refs.keyDetail);

    refs.keyDetail.appendChild(
      el("p", {
        "class": "panel__hint",
        text:
          (K.VARIANT_LABEL[view.keyVariant] || "변형") +
          " — 학생에게 보여 주는 순서 그대로입니다. 괄호 안은 원래 문항 번호예요."
      })
    );

    rows.forEach(function (row) {
      var guide = K.questionGuide(row.id);
      var card = el("article", { "class": "t-card" }, [
        // 초록·빨강 배지는 이 차시에서 True / False 를 뜻하므로 여기서는 쓰지 않는다.
        // (문항 유형이 「False」로 읽히면 안 된다)
        el("div", {}, [
          ui.badge("primary", row.order + "번째로 제시"),
          el("span", { text: " " }),
          ui.badge("neutral", "원래 " + row.id + "번"),
          el("span", { text: " " }),
          ui.badge("neutral", row.typeLabel + " · " + row.points + "점")
        ]),
        el("h3", { "class": "t-wrong__title", text: row.topic }),
        el("p", { "class": "t-wrong__prompt", html: row.stemHtml })
      ]);

      if (row.code) card.appendChild(codeBlock(row.code, row.id + "번 문항 코드"));

      if (row.choices) {
        card.appendChild(
          el(
            "div",
            { "class": "t-options" },
            row.choices.map(function (text, i) {
              return el("div", { "class": "t-option" + (i === row.answerIndex ? " is-answer" : "") }, [
                el("span", { "class": "t-option__num", text: "①②③④⑤".charAt(i) }),
                el("span", {
                  "class": "t-option__text",
                  text: text + (i === row.answerIndex ? "  ← 정답" : "")
                })
              ]);
            })
          )
        );
      }

      var explain = el("div", { "class": "t-explain" }, [
        el("p", { "class": "t-explain__label", text: "정답" }),
        el("p", { text: row.correct + (row.accept ? "  (인정 : " + row.accept.join(", ") + ")" : "") }),
        el("p", { "class": "t-explain__label", style: { marginTop: "10px" }, text: "해설" }),
        el("p", { html: row.explain }),
        el("p", { "class": "t-explain__label", style: { marginTop: "10px" }, text: "틀렸을 때 돌아갈 화면" }),
        el("p", { text: row.reviewLabel })
      ]);
      card.appendChild(explain);

      if (guide) {
        card.appendChild(
          el("div", { "class": "t-teach" }, [
            el("p", { html: "<strong>💡 지도 포인트</strong>" }),
            el("p", { text: "자주 나오는 오답 — " + guide.watch }),
            el("p", { text: "왜 그럴까요 — " + guide.why }),
            el("p", { text: "수업에서 — " + guide.tip })
          ])
        );
      }

      refs.keyDetail.appendChild(card);
    });
  }

  /* ================================================================== */
  /* 4장 접이식 · 화면별 지도 자료                                          */
  /* ================================================================== */

  function buildGuidePanel(root) {
    /* --- 오늘 꼭 잡아야 할 오개념 --- */
    var topBox = ui.panel({
      title: "🧭 오늘 꼭 잡아야 할 세 가지",
      hint: "이번 차시 전체를 관통하는 오개념입니다. 수업을 마칠 때 다시 한 번 짚어 주세요."
    });
    topBox.body.appendChild(
      el(
        "ul",
        { "class": "stack" },
        K.COMMON_MISCONCEPTIONS.map(function (item) {
          var li = misconceptionRow(item);
          li.appendChild(
            el("p", {
              "class": "panel__hint",
              text: "관련 화면 : " + item.screens.map(function (n) {
                return "화면 " + n;
              }).join(" · ")
            })
          );
          return li;
        })
      )
    );
    topBox.body.appendChild(
      el("p", {
        "class": "panel__hint",
        text:
          "형성평가 채점 기준 : 5문항 × " + K.POINT_PER_QUESTION + "점 = " + K.MAX_SCORE + "점 만점, " +
          K.PASS_SCORE + "점 이상 이수. 예상 학습 시간 " + L.CONST.STUDY_TIME + "."
      })
    );
    root.appendChild(topBox.root);

    /* --- 화면 1~6 지도 자료 --- */
    K.SCREEN_GUIDE.forEach(function (guide) {
      var box = ui.panel({
        title: "화면 " + guide.step + " · " + guide.title,
        hint: guide.focus
      });

      box.body.appendChild(ui.sectionTitle("지도", "이렇게 진행해 주세요"));
      box.body.appendChild(bulletList(guide.points));

      box.body.appendChild(ui.sectionTitle("오개념", "학생이 자주 갖는 생각"));
      box.body.appendChild(el("ul", { "class": "stack" }, guide.misconceptions.map(misconceptionRow)));

      box.body.appendChild(ui.sectionTitle("발문", "이렇게 물어보세요"));
      box.body.appendChild(bulletList(guide.asks));

      root.appendChild(box.root);
    });
  }

  /* ================================================================== */
  /* 시작                                                                 */
  /* ================================================================== */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount, { once: true });
  } else {
    mount();
  }
})();
    </script>
  </body>
</html>
