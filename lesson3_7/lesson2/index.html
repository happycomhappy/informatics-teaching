    (o.options || []).forEach(function (option) {
      sel.appendChild(
        el('option', { value: String(option.value), text: option.label })
      );
    });
    if (o.value !== undefined && o.value !== null) sel.value = String(o.value);
    if (o.onChange) {
      sel.addEventListener('change', function () {
        o.onChange(sel.value);
      });
    }
    return {
      root: o.label
        ? el('div', { 'class': 'field' }, [
            el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }),
            sel
          ])
        : sel,
      select: sel,
      getValue: function () {
        return sel.value;
      },
      setValue: function (v) {
        sel.value = v === undefined || v === null ? '' : String(v);
      }
    };
  }

  /* ------------------------ 실행 결과 출력 창 ------------------------ */
  function createConsole(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '실행 버튼을 누르면 결과가 여기에 표시돼요.';
    var body = el('div', {
      'class': 'console__body',
      attrs: {
        role: 'log',
        'aria-live': 'polite',
        'aria-label': o.ariaLabel || '프로그램 실행 결과',
        tabindex: '0'
      }
    });
    var root = el('div', { 'class': 'console' }, [
      el('div', { 'class': 'console__head' }, [
        el('span', { 'class': 'console__dot' }),
        el('span', { text: o.title || '실행 결과' })
      ]),
      body
    ]);

    function showEmpty() {
      clear(body);
      body.appendChild(el('p', { 'class': 'console__empty', text: emptyText }));
    }

    function line(text, modifier) {
      if (body.querySelector('.console__empty')) clear(body);
      var node = el('div', { 'class': ('console__line ' + (modifier || '')).trim() }, [
        el('span', { 'class': 'console__prompt', text: '>' }),
        el('span', { 'class': 'console__text', text: text })
      ]);
      body.appendChild(node);
      body.scrollTop = body.scrollHeight;
      return node;
    }

    showEmpty();

    return {
      root: root,
      body: body,
      write: function (text) {
        return line(text);
      },
      writeMuted: function (text) {
        return line(text, 'console__line--muted');
      },
      writeError: function (text) {
        return line(text, 'console__line--error');
      },
      writeHint: function (text) {
        return line(text, 'console__line--hint');
      },
      clear: showEmpty,
      isEmpty: function () {
        return Boolean(body.querySelector('.console__empty'));
      }
    };
  }

  /* ------------------------ 피드백 영역 ------------------------ */
  var FEEDBACK_ICON = { success: '✅', info: '💡', warning: '⚠️', error: '❌' };

  function createFeedback(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '조작하면 이곳에 안내가 표시돼요.';
    var icon = el('span', { 'class': 'feedback__icon', text: '💬' });
    var textNode = el('div', { 'class': 'feedback__text', text: emptyText });
    var root = el('div', {
      'class': 'feedback is-empty',
      attrs: { 'aria-live': 'assertive', role: 'status' }
    });
    root.appendChild(icon);
    root.appendChild(textNode);

    return {
      root: root,
      /**
       * @param {'success'|'info'|'warning'|'error'} type
       * @param {string} html 표시할 내용(HTML 허용)
       * @param {string} [customIcon] 🎉 · 🏅 등 다른 아이콘을 쓰고 싶을 때
       */
      show: function (type, html, customIcon) {
        root.className = 'feedback feedback--' + type;
        icon.textContent = customIcon || FEEDBACK_ICON[type] || '💬';
        textNode.innerHTML = html;
      },
      clear: function () {
        root.className = 'feedback is-empty';
        icon.textContent = '💬';
        textNode.textContent = emptyText;
      }
    };
  }

  /* ------------------------------ 배지 · 표 ------------------------------ */
  function badge(kind, text) {
    var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
    return el('span', { 'class': ('badge ' + (map[kind] || '')).trim(), text: text });
  }

  function boolBadge(value) {
    return badge(value ? 'true' : 'false', value ? '○ 참(True)' : '× 거짓(False)');
  }

  function dataTable(opts) {
    var o = opts || {};
    var head = o.head || [];
    var rows = o.rows || [];
    var table = el('table', { 'class': ('data-table ' + (o.className || '')).trim() }, [
      o.caption ? el('caption', { 'class': 'sr-only', text: o.caption }) : null,
      el('thead', {}, [
        el(
          'tr',
          {},
          head.map(function (h) {
            return el('th', { scope: 'col', html: h });
          })
        )
      ]),
      el(
        'tbody',
        {},
        rows.map(function (row) {
          return el(
            'tr',
            {},
            row.map(function (cell, i) {
              var tag = i === 0 ? 'th' : 'td';
              var props = i === 0 ? { scope: 'row' } : {};
              if (cell instanceof Node) {
                var td = el(tag, props);
                td.appendChild(cell);
                return td;
              }
              props.html = cell;
              return el(tag, props);
            })
          );
        })
      )
    ]);
    return el('div', { 'class': 'table-scroll' }, [table]);
  }

  function callout(html, opts) {
    var o = opts || {};
    return el('div', { 'class': ('callout ' + (o.muted ? 'callout--muted' : '')).trim(), html: html });
  }

  /** 🏅 배지 카드 (명세 9.11 · 이번 차시 추가 헬퍼) */
  function award(opts) {
    var o = opts || {};
    return el('div', { 'class': 'award' }, [
      el('span', { 'class': 'award__icon', text: o.icon || '🏅', attrs: { 'aria-hidden': 'true' } }),
      el('div', { 'class': 'award__body' }, [
        el('p', { 'class': 'award__title', text: o.title || '' }),
        o.text ? el('p', { 'class': 'award__text', html: o.text }) : null
      ])
    ]);
  }

  /** 보충 학습 바로가기 줄 (명세 10.3 · 이번 차시 추가 헬퍼) */
  function linkLine(opts) {
    var o = opts || {};
    return el('div', { 'class': 'linkline' }, [
      el('span', { 'class': 'linkline__label', html: o.text || '' }),
      button({
        label: o.label || o.step + '단계로 이동',
        variant: 'secondary',
        className: 'linkline__link',
        ariaLabel: o.step + '단계 화면으로 이동',
        onClick: function () {
          L.nav.goToStep(o.step, { force: true });
        }
      })
    ]);
  }

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {
    var region = document.getElementById('toast-region');
    if (!region) return;
    var node = el('div', { 'class': 'toast', text: message });
    region.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, duration || 2600);
  }

  function announce(message) {
    var live = document.getElementById('sr-live');
    if (!live) return;
    live.textContent = '';
    setTimeout(function () {
      live.textContent = message;
    }, 30);
  }

  /**
   * 확인 대화상자 (저장된 진행 복원 · 초기화 확인)
   * dismissValue: Esc 키·백드롭 등으로 그냥 닫았을 때 돌려줄 값.
   */
  function confirmDialog(opts) {
    var o = opts || {};
    var dismissValue = o.dismissValue === undefined ? false : o.dismissValue;
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,
      tabindex: '0',
      dataset: { tip: tip },
      attrs: { 'aria-label': text + '. ' + tip }
    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');
    });
    return node;
  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;
  ui.badge = badge;
  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;
})();
    </script>
    <script data-from="js/20-codeview.js">
/**
 * 파이썬 코드 표시 컴포넌트 (명세 11.2 코드 표시 / 11.3 조건 실행 상태)
 *  - 외부 하이라이팅 라이브러리 없이 자체 정규식 기반 토큰 색칠
 *  - 들여쓰기 4칸마다 세로 가이드선 표시 (중첩 조건의 깊이를 눈으로 확인)
 *  - 실행 상태(대기 / 실행 중 / 완료 / 건너뜀 / 검사하지 않음 / 오류) 표시
 *
 * 이번 차시에서 추가된 것 : setState(index, 'unchecked')
 *   → 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다(명세 11.3 '검사 안 함').
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;
  var escapeHtml = L.ui.escapeHtml;

  var KEYWORDS = /^(if|else|elif|and|or|not|in|is|True|False|None)$/;
  var BUILTINS = /^(print|int|input|str|float|abs|len|range)$/;

  var TOKEN_RE = /(\b(?:if|else|elif|and|or|not|in|is|True|False|None)\b)|(\b(?:print|int|input|str|float|abs|len|range)\b)|(\b\d+\b)|(:)|(==|!=|>=|<=|\/\/|[%+\-*/<>=])/g;

  function span(cls, textContent) {
    return '<span class="' + cls + '">' + escapeHtml(textContent) + '</span>';
  }

  /** 문자열·주석을 제외한 구간의 토큰을 색칠한다. */
  function highlightSegment(segment) {
    var out = '';
    var last = 0;
    TOKEN_RE.lastIndex = 0;
    var match = TOKEN_RE.exec(segment);
    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);
    }
    if (last < segment.length) out += escapeHtml(segment.slice(last));
    return out;
  }

  /**
   * 파이썬 한 줄(들여쓰기 제외)을 하이라이팅한 HTML 문자열로 바꾼다.
   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.
   */
  function highlightPython(source) {
    var src = String(source === undefined || source === null ? '' : source);
    var out = '';
    var i = 0;
    var buffer = '';

    var flush = function () {
      if (buffer) {
        out += highlightSegment(buffer);
        buffer = '';
      }
    };

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {
        flush();
        out += span('tok-comment', src.slice(i));
        return out;
      }
      if (ch === '"' || ch === "'") {
        flush();
        var j = i + 1;
        while (j < src.length && src[j] !== ch) {
          if (src[j] === '\\') j += 1;
          j += 1;
        }
        out += span('tok-str', src.slice(i, Math.min(j + 1, src.length)));
        i = j + 1;
        continue;
      }
      buffer += ch;
      i += 1;
    }
    flush();
    return out;
  }

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */
  function indentHtml(spaces) {
    if (spaces <= 0) return '';
    var html = '';
    var left = spaces;
    var first = true;
    while (left > 0) {
      var width = Math.min(4, left);
      html +=
        '<span class="indent' +
        (first ? ' indent--first' : '') +
        '"' +
        (width === 4 ? '' : ' style="width:' + width + 'ch"') +
        '></span>';
      left -= width;
      first = false;
    }
    return html;
  }

  function splitIndent(code) {
    var normalized = String(code === undefined || code === null ? '' : code).replace(/\t/g, '    ');
    var match = normalized.match(/^ */);
    var spaces = match ? match[0].length : 0;
    return { spaces: spaces, rest: normalized.slice(spaces) };
  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{
   *   code?: string,                 // 원본 코드 한 줄(앞 공백 = 들여쓰기)
   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁
   * }>
   */
  function createCodeView(opts) {
    var o = opts || {};
    var showLineNumbers = o.showLineNumbers !== false;
    var linesWrap = el('div', { 'class': 'codeview__lines' });
    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);
    var head =
      o.title || o.headExtra
        ? el('div', { 'class': 'codeview__head' }, [
            o.title ? el('span', { 'class': 'codeview__title', html: o.title }) : el('span'),
            o.headExtra || null
          ])
        : null;
    var children = [];
    if (head) children.push(head);
    children.push(scroll);
    var root = el(
      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },
      children
    );

    var current = [];
    var lineEls = [];

    function build(nextLines) {
      current = nextLines || [];
      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }
        });

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.
        var usesParts = Array.isArray(line.parts);
        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  L.codeview = {
    createCodeView: createCodeView,
    highlightPython: highlightPython
  };
})();
    </script>
    <script data-from="js/30-state.js">
/**
 * 전역 상태 관리 (명세 11.1 학습 상태 저장 / 4장 단계 이동 규칙)
 *  - localStorage 저장 · 복원 · 초기화 (서버로 아무것도 보내지 않는다)
 *  - 단계 완료 판정 canProceed() 와 미충족 안내 문구
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var STORAGE_KEY = L.CONST.STORAGE_KEY; // 'lesson3_7_2_state'
  var TOTAL_STEPS = L.CONST.TOTAL_STEPS; // 6

  /** 명세 8.1 카드 분류 정답 (A·C = 다중 조건문, B·D = 중첩 조건문) */
  var CARD_ANSWER = { A: 'multi', B: 'nested', C: 'multi', D: 'nested' };

  /** 저장 항목(명세 11.1)을 모두 담은 초기 상태를 만든다. */
  function createInitialState() {
    return {
      currentStep: 1,
      visitedSteps: [1],

      // 화면 1 : 선수 학습 미니 문항 2개 (정답을 고르면 true, 오답이면 false, 아직이면 null)
      step1: { q1: null, q2: null },

      // 화면 2 : 탄소 절감률 에코 마일리지
      step2: {
        reduce: 7,
        lastInput: '7',
        ranFull: false,
        ranStep: false,
        seenBranch: { high: false, mid: false, none: false },
        thinkText: '',
        thinkOk: false
      },

      // 화면 3 : 조건 순서와 실행 추적
      step3: {
        predicted: null,
        orderCards: ['a', 'b'],
        orderFixed: false,
        trace: {},
        traceDone: false
      },

      // 화면 4 : 다중 / 중첩 비교
      step4: {
        cards: { A: null, B: null, C: null, D: null },
        sortDone: false,
        treeSeen: { yes: false, no: false },
        // 흐름도에서 마지막으로 고른 값(바깥 예/아니오 · 안쪽 점수).
        // 빈 객체는 mergeInto 가 통째로 복사하므로 새로고침 후에도 그대로 되살아난다.
        tree: {}
      },

      // 화면 5 : 상점 추가 지급 중첩 조건 프로그램
      step5: {
        mode: 'token',
        blanks: { '1': null, '2': null, '3': null, '4': null, '5': null, '6': null, '7': null },
        indentAnswer: null,
        blanksDone: false,
        predictQuiz: null,
        predictAnswer: '',
        predictOk: false,
        attempts: 0,
        hintLevel: 0,
        testsPassed: false,
        sim: { received: 'y', score: 12 }
      },

      // 화면 6 : 형성평가 및 학습 정리
      step6: {
        student: { id: '', name: '' },
        order: [1, 2, 3, 4, 5],
        answers: [null, null, null, null, null],
        score: null,
        passed: null,
        attempts: 0,
        bestScore: null,
        lastScore: null,
        // tried  : 제출을 한 번이라도 시도했는지(실패 포함). 채점 버튼을 열지 판단할 때 쓴다.
        // locked : 제출을 마쳐 답안을 고칠 수 없는 상태인지.
        //          제출 주소를 바꿔 다시 보낼 때도 답안은 잠긴 채로 두어야 하므로 status 와 따로 둔다.
        submit: { status: 'idle', at: null, count: 0, error: '', tried: false, locked: false },
        summary: { multi: '', nested: '' },
        confidence: null,
        variant: 0
      }
    };
  }

  /** 살아있는 전역 상태 객체(참조 유지). 직접 수정한 뒤 markChanged() 를 호출한다. */
  var appState = createInitialState();

  /* ------------------------------------------------------------------ */
  /* 구독                                                                */
  /* ------------------------------------------------------------------ */
  var listeners = [];

  /** 상태 변경 구독. 해제 함수를 돌려준다. */
  function onChange(fn) {
    if (typeof fn !== 'function') return function () {};
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function emit() {
    listeners.slice().forEach(function (fn) {
      try {
        fn(appState);
      } catch (err) {
        if (window.console) console.error('[state] listener error', err);
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* 저장 · 복원                                                          */
  /* ------------------------------------------------------------------ */
  var saveTimer = null;

  function hasStorage() {
    try {
      return typeof window.localStorage !== 'undefined' && window.localStorage !== null;
    } catch (err) {
      return false;
    }
  }

  /** 디바운스 500ms 저장. */
  function saveState() {
    if (!hasStorage()) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        // 저장 실패(용량 초과 · 프라이빗 모드)해도 학습은 계속 가능해야 한다.
        if (window.console) console.warn('[state] 저장에 실패했습니다.', err);
      }
    }, 500);
  }

  /** 상태를 바꾼 뒤 호출: 저장 예약 + 구독자 알림. */
  function markChanged() {
    saveState();
    emit();
  }

  /** 저장된 상태를 읽어온다. 없거나 손상되었으면 null. */
  function readSavedState() {
    if (!hasStorage()) return null;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (err) {
      return null;
    }
  }

  function deepCopy(value) {
    return JSON.parse(JSON.stringify(value));
  }

  /** 얕은 병합이 아닌 "키 단위 깊은 병합"으로 저장본을 현재 상태에 적용한다. */
  function mergeInto(target, source) {
    Object.keys(source).forEach(function (key) {
      var value = source[key];
      if (!(key in target)) return; // 모르는 키는 무시한다(저장본 손상 대비)
      var cur = target[key];
      if (Array.isArray(value)) {
        target[key] = value.slice();
        return;
      }
      if (value && typeof value === 'object') {
        if (cur && typeof cur === 'object' && !Array.isArray(cur)) {
          // step3.trace 처럼 키가 정해지지 않은 자유 형식 맵은 통째로 복사한다.
          if (Object.keys(cur).length === 0) target[key] = deepCopy(value);
          else mergeInto(cur, value);
        }
        return;
      }
      if (value !== undefined) target[key] = value;
    });
  }

  /** 저장본을 현재 상태에 반영한다. */
  function applySavedState(saved) {
    if (!saved) return;
    mergeInto(appState, saved);
    if (!Array.isArray(appState.visitedSteps) || appState.visitedSteps.length === 0) {
      appState.visitedSteps = [1];
    }
    appState.currentStep = clampStep(appState.currentStep);
    emit();
  }

  /** 저장된 학습 기록을 지우고 초기 상태로 되돌린다. */
  function resetState() {
    if (hasStorage()) {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        /* 무시 */
      }
    }
    mergeInto(appState, createInitialState());
    appState.step3.trace = {};
    appState.visitedSteps = [1];
    appState.currentStep = 1;
    emit();
  }

  /** 저장된 진행 기록이 "이어서 학습할 만한 상태"인지 판단한다. */
  function hasMeaningfulProgress(saved) {
    if (!saved) return false;
    if (typeof saved.currentStep === 'number' && saved.currentStep > 1) return true;
    if (Array.isArray(saved.visitedSteps) && saved.visitedSteps.length > 1) return true;
    var s1 = saved.step1 || {};
    var s2 = saved.step2 || {};
    var s3 = saved.step3 || {};
    var s4 = saved.step4 || {};
    var s5 = saved.step5 || {};
    var s6 = saved.step6 || {};
    var cards = s4.cards || {};

    var filled = function (value) {
      return value !== null && value !== undefined && value !== '';
    };

    if (filled(s1.q1) || filled(s1.q2)) return true;
    if (s2.ranFull || s2.ranStep || filled(s2.thinkText)) return true;
    if (filled(s3.predicted) || s3.orderFixed || s3.traceDone) return true;
    if (s4.sortDone || filled(cards.A) || filled(cards.B) || filled(cards.C) || filled(cards.D)) return true;
    if (s5.blanksDone || s5.testsPassed || filled(s5.predictAnswer)) return true;
    if (filled(s6.score) || filled(s6.bestScore)) return true;
    if (Array.isArray(s6.answers) && s6.answers.some(filled)) return true;
    return false;
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function clampStep(step) {
    var n = Number(step) || 1;
    return Math.min(TOTAL_STEPS, Math.max(1, Math.round(n)));
  }

  function visitStep(step) {
    var n = clampStep(step);
    if (appState.visitedSteps.indexOf(n) === -1) {
      appState.visitedSteps.push(n);
      appState.visitedSteps.sort(function (a, b) {
        return a - b;
      });
    }
    appState.currentStep = n;
    markChanged();
  }

  function isVisited(step) {
    return appState.visitedSteps.indexOf(clampStep(step)) !== -1;
  }

  /* ------------------------------------------------------------------ */
  /* 단계 완료 판정 (명세 4장)                                             */
  /* ------------------------------------------------------------------ */

  /** 화면 4 카드 4장이 모두 올바르게 분류되었는지 */
  function cardsAllCorrect() {
    var cards = appState.step4.cards || {};
    return ['A', 'B', 'C', 'D'].every(function (key) {
      return cards[key] === CARD_ANSWER[key];
    });
  }

  /** 화면 5 빈칸 7개가 모두 채워졌는지(정답 판정은 step5 모듈이 blanksDone 으로 알려 준다) */
  function blanksAllFilled() {
    var blanks = appState.step5.blanks || {};
    return ['1', '2', '3', '4', '5', '6', '7'].every(function (key) {
      return blanks[key] !== null && blanks[key] !== undefined && String(blanks[key]) !== '';
    });
  }

  function canProceed(step) {
    var s = clampStep(step);
    var st = appState;
    if (s === 1) {
      // 선수 학습 2문항 모두 정답 선택
      return st.step1.q1 === true && st.step1.q2 === true;
    }
    if (s === 2) {
      // 전체 실행 1회 이상 + 세 가지 분기 모두 확인 + 생각해 보기 입력
      var seen = st.step2.seenBranch || {};
      return Boolean(
        st.step2.ranFull &&
          seen.high &&
          seen.mid &&
          seen.none &&
          String(st.step2.thinkText || '').trim().length > 0
      );
    }
    if (s === 3) {
      // 출력 예측 완료 + 조건 카드 올바른 순서 + 추적표 완성
      return Boolean(
        st.step3.predicted !== null && st.step3.predicted !== undefined &&
          st.step3.orderFixed &&
          st.step3.traceDone
      );
    }
    if (s === 4) {
      // 카드 4장 모두 올바르게 분류 + 중첩 트리 예/아니오 모두 확인
      var tree = st.step4.treeSeen || {};
      return Boolean((st.step4.sortDone || cardsAllCorrect()) && tree.yes && tree.no);
    }
    if (s === 5) {
      // 빈칸 7개 정답 (실행 전 예상·자동 테스트 활동은 화면에서 뺐다)
      return Boolean(st.step5.blanksDone);
    }
    if (s === 6) {
      // 형성평가 5문항 모두 응답
      return (st.step6.answers || []).length === 5 &&
        st.step6.answers.every(function (a) {
          return a !== null && a !== undefined && String(a) !== '';
        });
    }
    return true;
  }

  /** 이동 조건 미충족 시 안내 문구 */
  function blockedMessage(step) {
    var s = clampStep(step);
    if (s === 1) return '선수 학습 문항 2개를 모두 맞혀야 학습을 시작할 수 있어요.';
    if (s === 2) return '전체 실행과 세 가지 분기를 모두 확인하고 생각해 보기를 적어 주세요.';
    if (s === 3) return '출력 예측 · 조건 카드 순서 · 실행 추적표를 모두 완성해 주세요.';
    if (s === 4) return '카드 4장을 모두 알맞게 분류하고 중첩 트리를 예/아니오 모두 확인해 주세요.';
    if (s === 5) return '빈칸 7개를 모두 맞혀 주세요.';
    if (s === 6) return '아직 답하지 않은 문항이 있어요.';
    return '';
  }

  /** 단계별 남은 활동을 구체적으로 알려 주는 보조 문구 */
  function remainingHint(step) {
    var s = clampStep(step);
    var st = appState;
    var parts = [];

    if (s === 1) {
      if (st.step1.q1 !== true) parts.push('미니 문항 1');
      if (st.step1.q2 !== true) parts.push('미니 문항 2');
    } else if (s === 2) {
      var seen = st.step2.seenBranch || {};
      if (!st.step2.ranFull) parts.push('전체 실행');
      if (!seen.high) parts.push('3만 마일리지 분기');
      if (!seen.mid) parts.push('1만 마일리지 분기');
      if (!seen.none) parts.push('마일리지 없음 분기');
      if (!String(st.step2.thinkText || '').trim()) parts.push('생각해 보기 입력');
    } else if (s === 3) {
      if (st.step3.predicted === null || st.step3.predicted === undefined) parts.push('출력 예측');
      if (!st.step3.orderFixed) parts.push('조건 카드 순서 정리');
      if (!st.step3.traceDone) parts.push('실행 추적표 완성');
    } else if (s === 4) {
      if (!(st.step4.sortDone || cardsAllCorrect())) parts.push('카드 4장 분류');
      var tree = st.step4.treeSeen || {};
      if (!tree.yes) parts.push('중첩 트리 예(True) 확인');
      if (!tree.no) parts.push('중첩 트리 아니오(False) 확인');
    } else if (s === 5) {
      if (!st.step5.blanksDone) parts.push('빈칸 7개 정답');
    } else if (s === 6) {
      var left = (st.step6.answers || []).filter(function (a) {
        return a === null || a === undefined || String(a) === '';
      }).length;
      if (left > 0) parts.push('남은 문항 ' + left + '개');
    }
    return parts;
  }

  /* ------------------------------------------------------------------ */
  /* 공개                                                                */
  /* ------------------------------------------------------------------ */
  L.state = {
    STORAGE_KEY: STORAGE_KEY,
    TOTAL_STEPS: TOTAL_STEPS,
    CARD_ANSWER: CARD_ANSWER,
    appState: appState,
    createInitialState: createInitialState,
    onChange: onChange,
    markChanged: markChanged,
    saveState: saveState,
    readSavedState: readSavedState,
    applySavedState: applySavedState,
    resetState: resetState,
    hasMeaningfulProgress: hasMeaningfulProgress,
    clampStep: clampStep,
    visitStep: visitStep,
    isVisited: isVisited,
    canProceed: canProceed,
    blockedMessage: blockedMessage,
    remainingHint: remainingHint,
    cardsAllCorrect: cardsAllCorrect,
    blanksAllFilled: blanksAllFilled
  };
})();
    </script>
    <script data-from="js/40-engine.js">
/**
 * 실행 엔진 (명세 11.6 파이썬 실행 방식 · 12장 원본 프로그램 체크리스트)
 *
 * 실제 파이썬을 실행하지 않는다. 명세에 적힌 두 원본 프로그램만을 대상으로
 * "조건을 위에서 아래로 검사하는 과정" 을 JavaScript 로 시뮬레이션한다.
 *
 * 조건 상태는 언제나 네 가지 중 하나다.
 *   'true'      — 검사했고 참
 *   'false'     — 검사했고 거짓
 *   'unchecked' — 앞에서 실행할 블록이 정해져 아예 검사하지 않음(명세 11.3)
 *   'executed'  — else 처럼 조건식은 없지만 그 블록이 실행됨
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  var S = {
    TRUE: 'true',
    FALSE: 'false',
    SKIP: 'unchecked',
    RUN: 'executed'
  };

  /* ------------------------------------------------------------------ */
  /* 원본 프로그램 1 : 탄소 절감률 에코 마일리지 (명세 6.2)                 */
  /* ------------------------------------------------------------------ */
  var ECO_LINES = [
    "reduce = int(input('탄소 절감률을 입력하세요: '))",
    'if reduce >= 10:',
    "    mileage = '3만 마일리지'",
    'elif reduce >= 5:',
    "    mileage = '1만 마일리지'",
    'else:',
    "    mileage = '마일리지 없음'",
    "print(f'지급된 에코 마일리지: {mileage}')"
  ];

  /** 줄별 한국어 설명 (명세 6.3) */
  var ECO_NOTES = [
    '탄소 절감률을 정수로 입력받아 reduce 변수에 저장',
    '탄소 절감률이 10% 이상인지 확인',
    '첫 조건이 참이면 3만 마일리지',
    '첫 조건이 거짓인 상태에서 5% 이상인지 확인',
    '두 번째 조건이 참이면 1만 마일리지',
    '위 두 조건이 모두 거짓이면 실행',
    '5% 미만',
    '최종 결정된 마일리지 출력'
  ];

  /** 빠른 예시 버튼 값 (명세 6.4) */
  var ECO_EXAMPLES = [12, 10, 7, 5, 3];

  var ECO_EXPR = { c1: 'reduce >= 10', c2: 'reduce >= 5' };

  /* ------------------------------------------------------------------ */
  /* 원본 프로그램 2 : 상점 추가 지급 중첩 조건 (명세 9.2)                  */
  /* ------------------------------------------------------------------ */
  // 주석 1줄을 포함해 모두 13줄이다(0-based 인덱스 0~12).
  var BONUS_LINES = [
    '# 상점을 받았는지 여부 입력',
    "bonus_received = input('수업 시간에 상점을 받았나요? (y / n): ')",
    "if bonus_received == 'y':",
    "    score = int(input('받은 상점의 점수를 입력하세요 (1~50): '))",
    '    if score >= 10:',
    '        extra = 3',
    '    elif score >= 5:',
    '        extra = 2',
    '    else:',
    '        extra = 1',
    "    print(f'추가로 부여된 상점은 {extra}점입니다.')",
    'else:',
    "    print('상점을 받지 않았으므로 추가 상점이 없습니다.')"
  ];

  var BONUS_NOTES = [
    '무엇을 입력받는지 알려 주는 주석',
    "상점을 받았는지 y / n 으로 입력받아 bonus_received 에 저장",
    "바깥 조건 : 상점을 받았는지 확인 (여기가 True 일 때만 안쪽을 검사한다)",
    '상점을 받은 경우에만 상점 점수를 입력받는다',
    '안쪽 조건 1 : 받은 상점이 10점 이상인지 확인',
    '10점 이상이면 추가 상점 3점',
    '안쪽 조건 2 : (10점 미만인 상태에서) 5점 이상인지 확인',
    '5점 이상 10점 미만이면 추가 상점 2점',
    '안쪽 두 조건이 모두 거짓일 때 실행',
    '5점 미만이면 추가 상점 1점',
    '결정된 추가 상점을 출력',
    '바깥 조건이 거짓일 때 실행',
    '상점을 받지 않았으므로 추가 상점이 없다고 출력'
  ];

  var BONUS_EXPR = {
    outer: "bonus_received == 'y'",
    i1: 'score >= 10',
    i2: 'score >= 5'
  };

  /* ------------------------------------------------------------------ */
  /* 보조 프로그램 : 점수 등급 (명세 7.3 실행 추적표)                       */
  /* ------------------------------------------------------------------ */
  var GRADE_LINES = [
    'if score >= 90:',
    "    print('A')",
    'elif score >= 80:',
    "    print('B')",
    'elif score >= 70:',
    "    print('C')",
    'else:',
    "    print('D')"
  ];

  var GRADE_NOTES = [
    '90점 이상인지 확인',
    '90점 이상이면 A',
    '(90점 미만인 상태에서) 80점 이상인지 확인',
    '80점 이상 90점 미만이면 B',
    '(80점 미만인 상태에서) 70점 이상인지 확인',
    '70점 이상 80점 미만이면 C',
    '위 세 조건이 모두 거짓이면 실행',
    '70점 미만이면 D'
  ];

  /* ------------------------------------------------------------------ */
  /* 보조 프로그램 : 조건 순서 오류 / 올바른 순서 (명세 7.1 / 7.2)          */
  /* ------------------------------------------------------------------ */
  var WRONG_ORDER_LINES = [
    'if score >= 70:',
    '    print("C 이상")',
    'elif score >= 90:',
    '    print("A")'
  ];

  var RIGHT_ORDER_LINES = [
    'if score >= 90:',
    '    print("A")',
    'elif score >= 70:',
    '    print("C 이상")'
  ];

  /* ------------------------------------------------------------------ */
  /* 공용 도우미                                                          */
  /* ------------------------------------------------------------------ */
  function toInt(value, fallback) {
    var n = Number(value);
    if (isNaN(n) || !isFinite(n)) return fallback;
    return Math.trunc(n);
  }

  function snapshot(vars) {
    var out = {};
    Object.keys(vars).forEach(function (key) {
      out[key] = vars[key];
    });
    return out;
  }

  var DESC = {
    skipCond: '앞에서 실행할 블록이 이미 정해졌으므로 이 조건은 검사하지 않습니다.',
    skipBody: '검사하지 않은 조건의 블록이라 실행하지 않습니다.',
    falseBody: '조건이 거짓이므로 이 줄은 실행하지 않습니다.'
  };

  /** 조건 한 줄의 한국어 설명을 만든다. 예) reduce 는 7 이므로 7 >= 10 → False ✕ */
  function condDesc(name, value, expr, result) {
    var shown = expr.replace(name, String(value));
    return (
      name + ' 는 ' + value + ' 이므로 ' + shown + ' → ' + (result ? 'True ✓' : 'False ✕') + ' 입니다.'
    );
  }

  /* ------------------------------------------------------------------ */
  /* 규칙 함수                                                            */
  /* ------------------------------------------------------------------ */

  /** 명세 6.1 규칙 표 */
  function ecoRule(reduce) {
    var n = toInt(reduce, 0);
    if (n >= 10) return '3만 마일리지';
    if (n >= 5) return '1만 마일리지';
    return '마일리지 없음';
  }

  /** 명세 9.3 규칙 표 (상점을 받은 경우에만 쓰인다) */
  function bonusExtra(score) {
    var n = toInt(score, 0);
    if (n >= 10) return 3;
    if (n >= 5) return 2;
    return 1;
  }

  /* ------------------------------------------------------------------ */
  /* 입력 검증 (명세 6.4 / 9.10)                                          */
  /* ------------------------------------------------------------------ */
  function validateReduce(raw) {
    var text = String(raw === undefined || raw === null ? '' : raw).trim();
    if (text === '') return { ok: false, value: null, message: '숫자로 입력해 주세요.' };
    if (!/^-?\d+$/.test(text)) return { ok: false, value: null, message: '숫자로 입력해 주세요.' };
    var n = Number(text);
    if (n < 0) {
      return {
        ok: false,
        value: null,
        message: '탄소 절감률 예제는 0 이상의 값을 사용해 주세요.'
      };
    }
    if (n > 100) {
      return {
        ok: false,
        value: null,
        message: '탄소 절감률은 100 이하의 값을 사용해 주세요.'
      };
    }
    return { ok: true, value: n, message: '' };
  }

  function validateScore(raw) {
    var text = String(raw === undefined || raw === null ? '' : raw).trim();
    var message = '1~50 사이의 정수로 입력해 주세요.';
    if (text === '') return { ok: false, value: null, message: message };
    if (!/^-?\d+$/.test(text)) return { ok: false, value: null, message: message };
    var n = Number(text);
    if (n < 1 || n > 50) return { ok: false, value: null, message: message };
    return { ok: true, value: n, message: '' };
  }

  /** 대문자 Y / N 은 소문자로 정규화한다. 그 밖의 값은 null. */
  function normalizeYN(raw) {
    var text = String(raw === undefined || raw === null ? '' : raw).trim().toLowerCase();
    if (text === 'y') return 'y';
    if (text === 'n') return 'n';
    return null;
  }

  /* ------------------------------------------------------------------ */
  /* 프로그램 1 실행 : runEco(reduce)                                     */
  /* ------------------------------------------------------------------ */
  function runEco(reduceRaw) {
    var reduce = toInt(reduceRaw, 0);
    var vars = { reduce: reduce };
    var trace = [];
    var status = { c1: S.SKIP, c2: S.SKIP, els: S.SKIP };

    function push(line, kind, extra) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(extra || {}).forEach(function (key) {
        step[key] = extra[key];
      });
      trace.push(step);
    }

    // 1줄 : 입력
    push(0, 'input', {
      status: S.RUN,
      desc: '입력값 ' + reduce + ' 을(를) reduce 에 저장했어요.'
    });

    if (reduce >= 10) {
      status.c1 = S.TRUE;
      push(1, 'cond', {
        expr: ECO_EXPR.c1,
        status: S.TRUE,
        condId: 'c1',
        desc: condDesc('reduce', reduce, ECO_EXPR.c1, true) + ' 첫 번째 조건이 참이므로 바로 아래 블록을 실행합니다.'
      });
      vars.mileage = '3만 마일리지';
      push(2, 'assign', {
        status: S.RUN,
        desc: "mileage 에 '3만 마일리지' 를 저장했어요."
      });
      status.c2 = S.SKIP;
      push(3, 'cond', { expr: ECO_EXPR.c2, status: S.SKIP, condId: 'c2', desc: DESC.skipCond });
      push(4, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      status.els = S.SKIP;
      push(5, 'cond', { expr: 'else', status: S.SKIP, condId: 'else', desc: DESC.skipCond });
      push(6, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    } else if (reduce >= 5) {
      status.c1 = S.FALSE;
      push(1, 'cond', {
        expr: ECO_EXPR.c1,
        status: S.FALSE,
        condId: 'c1',
        desc: condDesc('reduce', reduce, ECO_EXPR.c1, false) + ' 다음 조건으로 내려갑니다.'
      });
      push(2, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      status.c2 = S.TRUE;
      push(3, 'cond', {
        expr: ECO_EXPR.c2,
        status: S.TRUE,
        condId: 'c2',
        desc:
          condDesc('reduce', reduce, ECO_EXPR.c2, true) +
          ' 여기까지 왔다는 것은 이미 reduce 가 10 미만이라는 뜻이에요.'
      });
      vars.mileage = '1만 마일리지';
      push(4, 'assign', {
        status: S.RUN,
        desc: "mileage 에 '1만 마일리지' 를 저장했어요."
      });
      status.els = S.SKIP;
      push(5, 'cond', { expr: 'else', status: S.SKIP, condId: 'else', desc: DESC.skipCond });
      push(6, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    } else {
      status.c1 = S.FALSE;
      push(1, 'cond', {
        expr: ECO_EXPR.c1,
        status: S.FALSE,
        condId: 'c1',
        desc: condDesc('reduce', reduce, ECO_EXPR.c1, false) + ' 다음 조건으로 내려갑니다.'
      });
      push(2, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      status.c2 = S.FALSE;
      push(3, 'cond', {
        expr: ECO_EXPR.c2,
        status: S.FALSE,
        condId: 'c2',
        desc: condDesc('reduce', reduce, ECO_EXPR.c2, false) + ' 이제 남은 것은 else 뿐입니다.'
      });
      push(4, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      status.els = S.RUN;
      push(5, 'cond', {
        expr: 'else',
        status: S.RUN,
        condId: 'else',
        desc: '두 조건이 모두 False 이므로 else 블록을 실행합니다.'
      });
      vars.mileage = '마일리지 없음';
      push(6, 'assign', {
        status: S.RUN,
        desc: "mileage 에 '마일리지 없음' 을 저장했어요."
      });
    }

    var output = '지급된 에코 마일리지: ' + vars.mileage;
    push(7, 'print', {
      status: S.RUN,
      output: output,
      desc: '최종 결정된 마일리지를 출력합니다 → ' + output
    });

    return {
      input: reduce,
      mileage: vars.mileage,
      output: output,
      vars: snapshot(vars),
      conditions: [
        { id: 'c1', expr: ECO_EXPR.c1, status: status.c1 },
        { id: 'c2', expr: ECO_EXPR.c2, status: status.c2 },
        { id: 'else', expr: 'else', status: status.els }
      ],
      trace: trace,
      lines: ECO_LINES
    };
  }

  /* ------------------------------------------------------------------ */
  /* 프로그램 2 실행 : runBonus(bonusReceived, score)                     */
  /* ------------------------------------------------------------------ */
  function runBonus(receivedRaw, scoreRaw) {
    var received = normalizeYN(receivedRaw) || 'n';
    var score = toInt(scoreRaw, 0);
    var vars = {};
    var trace = [];
    var status = { outer: S.FALSE, i1: S.SKIP, i2: S.SKIP, ielse: S.SKIP };
    var extra = null;
    var output = '';

    function push(line, kind, more) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(more || {}).forEach(function (key) {
        step[key] = more[key];
      });
      trace.push(step);
    }

    // 2줄 : 상점 수령 여부 입력 (1줄은 주석이라 실행 흐름에 나타나지 않는다)
    vars.bonus_received = received;
    push(1, 'input', {
      status: S.RUN,
      desc: "입력값 '" + received + "' 을(를) bonus_received 에 저장했어요."
    });

    if (received === 'y') {
      status.outer = S.TRUE;
      push(2, 'cond', {
        expr: BONUS_EXPR.outer,
        status: S.TRUE,
        condId: 'outer',
        desc: "bonus_received 가 'y' 이므로 바깥 조건은 True ✓ 입니다. 이제 안쪽 조건을 검사합니다."
      });

      vars.score = score;
      push(3, 'input', {
        status: S.RUN,
        desc: '상점을 받았으므로 점수 ' + score + ' 을(를) 입력받아 score 에 저장했어요.'
      });

      if (score >= 10) {
        status.i1 = S.TRUE;
        push(4, 'cond', {
          expr: BONUS_EXPR.i1,
          status: S.TRUE,
          condId: 'i1',
          desc: condDesc('score', score, BONUS_EXPR.i1, true)
        });
        extra = 3;
        vars.extra = 3;
        push(5, 'assign', { status: S.RUN, desc: 'extra 에 3 을 저장했어요.' });
        status.i2 = S.SKIP;
        push(6, 'cond', { expr: BONUS_EXPR.i2, status: S.SKIP, condId: 'i2', desc: DESC.skipCond });
        push(7, 'skip', { status: S.SKIP, desc: DESC.skipBody });
        status.ielse = S.SKIP;
        push(8, 'cond', { expr: 'else', status: S.SKIP, condId: 'ielse', desc: DESC.skipCond });
        push(9, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      } else if (score >= 5) {
        status.i1 = S.FALSE;
        push(4, 'cond', {
          expr: BONUS_EXPR.i1,
          status: S.FALSE,
          condId: 'i1',
          desc: condDesc('score', score, BONUS_EXPR.i1, false) + ' 다음 조건으로 내려갑니다.'
        });
        push(5, 'skip', { status: S.SKIP, desc: DESC.falseBody });
        status.i2 = S.TRUE;
        push(6, 'cond', {
          expr: BONUS_EXPR.i2,
          status: S.TRUE,
          condId: 'i2',
          desc: condDesc('score', score, BONUS_EXPR.i2, true)
        });
        extra = 2;
        vars.extra = 2;
        push(7, 'assign', { status: S.RUN, desc: 'extra 에 2 를 저장했어요.' });
        status.ielse = S.SKIP;
        push(8, 'cond', { expr: 'else', status: S.SKIP, condId: 'ielse', desc: DESC.skipCond });
        push(9, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      } else {
        status.i1 = S.FALSE;
        push(4, 'cond', {
          expr: BONUS_EXPR.i1,
          status: S.FALSE,
          condId: 'i1',
          desc: condDesc('score', score, BONUS_EXPR.i1, false) + ' 다음 조건으로 내려갑니다.'
        });
        push(5, 'skip', { status: S.SKIP, desc: DESC.falseBody });
        status.i2 = S.FALSE;
        push(6, 'cond', {
          expr: BONUS_EXPR.i2,
          status: S.FALSE,
          condId: 'i2',
          desc: condDesc('score', score, BONUS_EXPR.i2, false) + ' 이제 남은 것은 else 뿐입니다.'
        });
        push(7, 'skip', { status: S.SKIP, desc: DESC.falseBody });
        status.ielse = S.RUN;
        push(8, 'cond', {
          expr: 'else',
          status: S.RUN,
          condId: 'ielse',
          desc: '안쪽 두 조건이 모두 False 이므로 else 블록을 실행합니다.'
        });
        extra = 1;
        vars.extra = 1;
        push(9, 'assign', { status: S.RUN, desc: 'extra 에 1 을 저장했어요.' });
      }

      output = '추가로 부여된 상점은 ' + extra + '점입니다.';
      push(10, 'print', {
        status: S.RUN,
        output: output,
        desc: '추가 상점을 출력합니다 → ' + output
      });
      push(11, 'cond', {
        expr: 'else',
        status: S.SKIP,
        desc: '바깥 조건이 True 였으므로 바깥 else 는 실행하지 않습니다.'
      });
      push(12, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    } else {
      status.outer = S.FALSE;
      push(2, 'cond', {
        expr: BONUS_EXPR.outer,
        status: S.FALSE,
        condId: 'outer',
        desc:
          "bonus_received 가 'y' 가 아니므로 바깥 조건은 False ✕ 입니다. 안쪽은 아예 검사하지 않습니다."
      });
      // 명세 9.4 사례 A : score 입력 줄도 '검사하지 않음' 이다.
      push(3, 'skip', {
        status: S.SKIP,
        desc: '바깥 조건이 거짓이므로 score 입력 줄도 실행하지 않습니다.'
      });
      push(4, 'cond', { expr: BONUS_EXPR.i1, status: S.SKIP, condId: 'i1', desc: DESC.skipCond });
      push(5, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      push(6, 'cond', { expr: BONUS_EXPR.i2, status: S.SKIP, condId: 'i2', desc: DESC.skipCond });
      push(7, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      push(8, 'cond', { expr: 'else', status: S.SKIP, condId: 'ielse', desc: DESC.skipCond });
      push(9, 'skip', { status: S.SKIP, desc: DESC.skipBody });
      push(10, 'skip', { status: S.SKIP, desc: DESC.skipBody });

      push(11, 'cond', {
        expr: 'else',
        status: S.RUN,
        desc: '바깥 조건이 False 이므로 바깥 else 블록을 실행합니다.'
      });
      output = '상점을 받지 않았으므로 추가 상점이 없습니다.';
      push(12, 'print', {
        status: S.RUN,
        output: output,
        desc: '추가 상점이 없다고 출력합니다 → ' + output
      });
    }

    return {
      received: received,
      score: received === 'y' ? score : null,
      extra: extra,
      output: output,
      vars: snapshot(vars),
      outer: { id: 'outer', expr: BONUS_EXPR.outer, status: status.outer },
      inner: [
        { id: 'i1', expr: BONUS_EXPR.i1, status: status.i1 },
        { id: 'i2', expr: BONUS_EXPR.i2, status: status.i2 },
        { id: 'ielse', expr: 'else', status: status.ielse }
      ],
      trace: trace,
      lines: BONUS_LINES
    };
  }

  /* ------------------------------------------------------------------ */
  /* 보조 실행 : runGrade(score)  (명세 7.3 실행 추적표)                   */
  /* ------------------------------------------------------------------ */
  function runGrade(scoreRaw) {
    var score = toInt(scoreRaw, 0);
    var vars = { score: score };
    var trace = [];
    var st = [S.SKIP, S.SKIP, S.SKIP];
    var exprs = ['score >= 90', 'score >= 80', 'score >= 70'];
    var grades = ['A', 'B', 'C'];
    var output = 'D';

    function push(line, kind, more) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(more || {}).forEach(function (key) {
        step[key] = more[key];
      });
      trace.push(step);
    }

    var decided = -1;
    for (var i = 0; i < 3; i += 1) {
      var limit = [90, 80, 70][i];
      if (decided >= 0) {
        st[i] = S.SKIP;
        push(i * 2, 'cond', { expr: exprs[i], status: S.SKIP, condId: 'g' + (i + 1), desc: DESC.skipCond });
        push(i * 2 + 1, 'skip', { status: S.SKIP, desc: DESC.skipBody });
        continue;
      }
      if (score >= limit) {
        st[i] = S.TRUE;
        decided = i;
        push(i * 2, 'cond', {
          expr: exprs[i],
          status: S.TRUE,
          condId: 'g' + (i + 1),
          desc: condDesc('score', score, exprs[i], true)
        });
        output = grades[i];
        push(i * 2 + 1, 'print', {
          status: S.RUN,
          output: output,
          desc: "'" + output + "' 를 출력합니다."
        });
      } else {
        st[i] = S.FALSE;
        push(i * 2, 'cond', {
          expr: exprs[i],
          status: S.FALSE,
          condId: 'g' + (i + 1),
          desc: condDesc('score', score, exprs[i], false) + ' 다음 조건으로 내려갑니다.'
        });
        push(i * 2 + 1, 'skip', { status: S.SKIP, desc: DESC.falseBody });
      }
    }

    if (decided < 0) {
      push(6, 'cond', {
        expr: 'else',
        status: S.RUN,
        condId: 'gelse',
        desc: '세 조건이 모두 False 이므로 else 블록을 실행합니다.'
      });
      output = 'D';
      push(7, 'print', { status: S.RUN, output: output, desc: "'D' 를 출력합니다." });
    } else {
      push(6, 'cond', { expr: 'else', status: S.SKIP, condId: 'gelse', desc: DESC.skipCond });
      push(7, 'skip', { status: S.SKIP, desc: DESC.skipBody });
    }

    return {
      input: score,
      rows: [
        { expr: exprs[0], status: st[0] },
        { expr: exprs[1], status: st[1] },
        { expr: exprs[2], status: st[2] }
      ],
      output: output,
      trace: trace,
      lines: GRADE_LINES
    };
  }

  /* ------------------------------------------------------------------ */
  /* 보조 실행 : 조건 순서 (명세 7.1 잘못된 순서 / 7.2 올바른 순서)          */
  /* ------------------------------------------------------------------ */
  function runOrder(scoreRaw, ids, exprs, limits, texts, lines) {
    var score = toInt(scoreRaw, 0);
    var vars = { score: score };
    var trace = [];
    var st = [S.SKIP, S.SKIP];
    var output = null;

    function push(line, kind, more) {
      var step = { line: line, kind: kind, vars: snapshot(vars) };
      Object.keys(more || {}).forEach(function (key) {
        step[key] = more[key];
      });
      trace.push(step);
    }

    if (score >= limits[0]) {
      st[0] = S.TRUE;
      push(0, 'cond', {
        expr: exprs[0],
        status: S.TRUE,

   * 각 문항의 id 는 원래 문항 번호(1~5)를 그대로 유지한다.
   */
  function buildQuiz(variantIndex) {
    var n = Number(variantIndex) || 0;
    var v = VARIANTS[((n % VARIANTS.length) + VARIANTS.length) % VARIANTS.length];
    return v.order.map(function (id) {
      return QUESTIONS[id];
    });
  }

  /** 단답 비교용 정규화(공백·따옴표 통일, 소문자화) */
  function normalizeText(value) {
    return String(value == null ? '' : value)
      .replace(/\s+/g, '')
      .replace(/[“”]/g, '"')
      .replace(/[‘’]/g, "'")
      .replace(/[：]/g, ':')
      .toLowerCase();
  }

  /** 코드 한 줄 비교용 정규화. 공백을 모두 지우므로 들여쓰기 차이는 무시된다. */
  function normalizeCode(value) {
    return normalizeText(value);
  }

  /** 빈 줄 하나가 맞았는지 */
  function blankCorrect(blank, given) {
    if (!blank) return false;
    var got = normalizeCode(given);
    if (!got) return false;
    var list = blank.accept && blank.accept.length ? blank.accept : [blank.answer];
    return list.some(function (ok) {
      return normalizeCode(ok) === got;
    });
  }

  /** 문항 하나 채점. answer 는 choice 면 인덱스(number), lines 면 문자열 배열. */
  function gradeOne(question, answer) {
    if (!question) return { correct: false, earned: 0, marks: [] };

    if (question.type === 'lines') {
      var given = Array.isArray(answer) ? answer : [];
      var marks = question.blanks.map(function (blank, i) {
        return blankCorrect(blank, given[i]);
      });
      var all = marks.length > 0 && marks.every(Boolean);
      return { correct: all, earned: all ? question.points : 0, marks: marks };
    }

    // 미응답을 Number() 가 0 으로 바꿔 ①번을 고른 것처럼 채점하는 사고를 막는다.
    if (answer === null || answer === undefined || answer === '') {
      return { correct: false, earned: 0, marks: [] };
    }
    var picked = Number(answer);
    var hit = Number.isInteger(picked) && picked === question.answer;
    return { correct: hit, earned: hit ? question.points : 0, marks: [] };
  }

  /**
   * 전체 채점.
   * @param {Array} quiz    buildQuiz() 결과
   * @param {Array} answers quiz 와 같은 순서의 학생 답안
   */
  function gradeAll(quiz, answers) {
    var details = quiz.map(function (q, i) {
      var one = gradeOne(q, answers ? answers[i] : null);
      return {
        index: i,
        id: q.id,
        topic: q.topic,
        reviewStep: q.reviewStep,
        answer: answers ? answers[i] : null,
        correct: one.correct,
        earned: one.earned,
        points: q.points,
        marks: one.marks,
      };
    });
    var score = details.reduce(function (sum, d) {
      return sum + d.earned;
    }, 0);
    return {
      score: score,
      maxScore: MAX_SCORE,
      passed: score >= PASS_SCORE,
      passedText: score >= PASS_SCORE ? '이수' : '미이수',
      details: details,
      wrongSteps: details
        .filter(function (d) {
          return !d.correct;
        })
        .map(function (d) {
          return d.reviewStep;
        })
        .filter(function (s, i, arr) {
          return arr.indexOf(s) === i;
        })
        .sort(function (a, b) {
          return a - b;
        }),
    };
  }

  /** 학생이 낸 답을 사람이 읽는 문자열로 바꾼다(제출·기록·교사용 표시). */
  function answerText(question, answer) {
    if (!question) return '';

    if (question.type === 'lines') {
      var given = Array.isArray(answer) ? answer : [];
      var written = question.blanks.map(function (blank, i) {
        return blank.no + ' ' + String(given[i] == null ? '' : given[i]).trim();
      });
      return written
        .filter(function (line) {
          return line.replace(/^[①-⑤]\s*/, '') !== '';
        })
        .join(' / ');
    }

    if (answer === null || answer === undefined || answer === '') return '';
    var i2 = Number(answer);
    if (!Number.isInteger(i2) || !question.choices || !question.choices[i2]) return '';
    return '①②③④⑤'.charAt(i2) + ' ' + question.choices[i2];
  }

  /** 정답을 사람이 읽는 문자열로 바꾼다. */
  function correctText(question) {
    if (!question) return '';
    if (question.type === 'lines') {
      return question.blanks
        .map(function (blank) {
          return blank.no + ' ' + blank.answer;
        })
        .join(' / ');
    }
    return '①②③④⑤'.charAt(question.answer) + ' ' + question.choices[question.answer];
  }

  /** 문제 지문에서 HTML 태그를 걷어낸 순수 문장(제출 JSON·CSV용) */
  function plainStem(question) {
    return String(question && question.stem ? question.stem : '')
      .replace(/<br\s*\/?>/gi, ' ')
      .replace(/<[^>]+>/g, '')
      .replace(/&nbsp;/g, ' ')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&amp;/g, '&')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /** 보충 학습 연결 (명세 10.3) */
  var REVIEW_LABEL = {
    2: '화면 2 · 다중 조건문 확인',
    3: '화면 3 · 조건 순서와 실행 추적',
    4: '화면 4 · 다중 조건문과 중첩 조건문 비교',
    5: '화면 5 · 중첩 조건문 확인',
  };

  L.quiz = {
    MAX_SCORE: MAX_SCORE,
    PASS_SCORE: PASS_SCORE,
    POINT_PER_QUESTION: POINT_PER_QUESTION,
    VARIANT_COUNT: VARIANTS.length,
    REVIEW_LABEL: REVIEW_LABEL,
    QUESTIONS: QUESTIONS,
    buildQuiz: buildQuiz,
    gradeOne: gradeOne,
    gradeAll: gradeAll,
    blankCorrect: blankCorrect,
    answerText: answerText,
    correctText: correctText,
    plainStem: plainStem,
    normalizeText: normalizeText,
    normalizeCode: normalizeCode,
  };
})();

    <script data-from="js/50-flow.js">
/**
 * 조건 상태 시각화 (명세 6.6 다중 조건 / 8.3 중첩 트리 / 9.5 / 11.3)
 *
 * 명세 11.3 : 조건 상태는 반드시 True ✓ / False ✕ / 검사하지 않음 — 세 가지로 구분하고,
 *             색상만으로 구분하지 않는다. 그래서 모든 상태 표시는 "아이콘 + 텍스트" 다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var el = L.ui.el;
  var clear = L.ui.clear;

  /** 상태별 전체 문구 (스크린리더 안내 · 표 셀 등에 그대로 쓸 수 있다) */
  var STATUS_TEXT = {
    'true': 'True ✓',
    'false': 'False ✕',
    unchecked: '검사 안 함 —',
    executed: '실행 ▶',
    idle: '대기 ·'
  };

  var STATUS_ICON = {
    'true': '✓',
    'false': '✕',
    unchecked: '—',
    executed: '▶',
    idle: '·'
  };

  var STATUS_LABEL = {
    'true': 'True',
    'false': 'False',
    unchecked: '검사 안 함',
    executed: '실행',
    idle: '대기'
  };

  var STATE_CLASSES = ['is-true', 'is-false', 'is-unchecked', 'is-executed', 'is-idle'];

  function normalize(status) {
    var s = String(status || 'idle');
    return STATUS_TEXT[s] ? s : 'idle';
  }

  /** 상태 배지 엘리먼트 : 아이콘 span + 텍스트 span (색상만으로 구분하지 않는다) */
  function statusBadge(status) {
    var s = normalize(status);
    return el(
      'span',
      {
        'class': 'status-badge status-badge--' + s,
        dataset: { status: s },
        attrs: { title: STATUS_TEXT[s] }
      },
      [
        // 명세 11.3 의 표기 순서(True ✓ / False ✕ / 검사 안 함 —)에 맞춰
        // 글자를 먼저 두고 아이콘을 뒤에 붙인다.
        el('span', { 'class': 'status-badge__text', text: STATUS_LABEL[s] }),
        el('span', {
          'class': 'status-badge__icon',
          text: STATUS_ICON[s],
          attrs: { 'aria-hidden': 'true' }
        })
      ]
    );
  }

  /** 배지를 새 상태로 갈아 끼운다(같은 위치를 유지). */
  function replaceBadge(holder, status) {
    clear(holder);
    holder.appendChild(statusBadge(status));
  }

  /* ------------------------------------------------------------------ */
  /* 다중 조건 목록 (명세 6.6)                                            */
  /* ------------------------------------------------------------------ */
  /**
   * createConditionList({
   *   items: [{ id, expr, label, hint }],   // label 은 조건 왼쪽에 붙는 순서/이름, hint 는 아래 작은 설명
   *   ariaLabel, title
   * })
   */
  function createConditionList(opts) {
    var o = opts || {};
    var items = o.items || [];
    var map = {};

    var root = el('section', {
      'class': 'cond-list',
      attrs: { 'aria-label': o.ariaLabel || '조건 검사 순서' }
    });

    if (o.title) {
      root.appendChild(el('p', { 'class': 'cond-list__title panel__hint', text: o.title }));
    }

    items.forEach(function (item, index) {
      var statusHolder = el('span', { 'class': 'cond-item__status' }, [statusBadge('idle')]);
      var hintNode = el('span', {
        'class': 'cond-item__hint',
        text: item.hint || ''
      });
      var row = el(
        'div',
        {
          'class': 'cond-item is-idle',
          dataset: { id: item.id, index: String(index) }
        },
        [
          // 몇 번째 조건인지는 lesson.css 의 .cond-item::before 가 자동으로 붙인다.
          // label 에는 번호가 아니라 'if' · 'elif' 같은 이름을 넣는다.
          item.label ? el('span', { 'class': 'cond-item__label', text: item.label }) : null,
          el('span', { 'class': 'cond-item__expr', text: item.expr }),
          statusHolder,
          hintNode
        ]
      );
      root.appendChild(row);
      map[item.id] = { row: row, statusHolder: statusHolder, hintNode: hintNode };
    });

    function setStatus(id, status) {
      var entry = map[id];
      if (!entry) return;
      var s = normalize(status);
      STATE_CLASSES.forEach(function (cls) {
        entry.row.classList.remove(cls);
      });
      entry.row.classList.add('is-' + s);
      replaceBadge(entry.statusHolder, s);
    }

    function setAll(statusMap) {
      Object.keys(statusMap || {}).forEach(function (id) {
        setStatus(id, statusMap[id]);
      });
    }

    function setHint(id, text) {
      var entry = map[id];
      if (!entry) return;
      entry.hintNode.textContent = text || '';
    }

    function reset() {
      items.forEach(function (item) {
        setStatus(item.id, 'idle');
        setHint(item.id, item.hint || '');
      });
    }

    return {
      root: root,
      setStatus: setStatus,
      setAll: setAll,
      setHint: setHint,
      reset: reset,
      /** conditions 배열([{id,status}...])을 그대로 넘길 때 쓴다. */
      applyConditions: function (conditions) {
        (conditions || []).forEach(function (c) {
          setStatus(c.id, c.status);
        });
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 중첩 조건 트리 (명세 8.3 / 9.5)                                      */
  /* ------------------------------------------------------------------ */
  /**
   * createNestedTree({
   *   outerLabel: "상점을 받았는가?  bonus_received == 'y'",
   *   branches: {
   *     no:  { label: '아니오 (False)', leaf: '추가 상점 없음' },
   *     yes: {
   *       label: '예 (True)',
   *       innerTitle: '받은 상점 점수는?',
   *       items: [ { id:'i1', expr:'score >= 10', leaf:'추가 3점' }, ... ]
   *     }
   *   },
   *   note: '기본 안내 문구'
   * })
   */
  var DIM_NOTE = '안쪽 조건은 검사하지 않음';

  function createNestedTree(opts) {
    var o = opts || {};
    var branches = o.branches || {};
    var yes = branches.yes || {};
    var no = branches.no || {};
    var defaultNote = o.note || '';
    var innerMap = {};

    var outerStatusHolder = el('span', { 'class': 'cond-item__status' }, [statusBadge('idle')]);
    var outerRow = el('div', { 'class': 'nest-tree__outer' }, [
      el('span', { 'class': 'cond-item__expr', text: o.outerLabel || '' }),
      outerStatusHolder
    ]);

    // 아니오 가지 (바깥 조건이 False 일 때 실행되는 쪽)
    var noStatusHolder = el('span', { 'class': 'cond-item__status' }, [statusBadge('idle')]);
    var noBranch = el('div', { 'class': 'nest-tree__branch nest-tree__branch--no' }, [
      el('span', { 'class': 'nest-tree__label', text: no.label || '아니오 (False)' }),
      el('div', { 'class': 'nest-tree__leaf' }, [
        el('span', { 'class': 'nest-tree__leaf-text', text: no.leaf || '' }),
        noStatusHolder
      ])
    ]);

    // 예 가지 (바깥 조건이 True 일 때만 안쪽 조건을 검사한다)
    var inner = el('div', { 'class': 'nest-tree__inner' });
    if (yes.innerTitle) {
      inner.appendChild(
        el('p', { 'class': 'nest-tree__inner-title panel__hint', text: yes.innerTitle })
      );
    }
    (yes.items || []).forEach(function (item) {
      var holder = el('span', { 'class': 'cond-item__status' }, [statusBadge('idle')]);
      var leaf = el(
        'div',
        { 'class': 'nest-tree__leaf', dataset: { id: item.id } },
        [
          el('span', { 'class': 'cond-item__expr' }, [el('code', { text: item.expr })]),
          el('span', { 'class': 'nest-tree__leaf-text', text: item.leaf || '' }),
          holder
        ]
      );
      inner.appendChild(leaf);
      innerMap[item.id] = { leaf: leaf, holder: holder };
    });

    var yesStatusHolder = el('span', { 'class': 'cond-item__status' }, [statusBadge('idle')]);
    var yesBranch = el('div', { 'class': 'nest-tree__branch nest-tree__branch--yes' }, [
      el('div', { 'class': 'row' }, [
        el('span', { 'class': 'nest-tree__label', text: yes.label || '예 (True)' }),
        yesStatusHolder
      ]),
      inner
    ]);

    var noteNode = el('p', { 'class': 'nest-tree__note', text: defaultNote });

    var root = el(
      'section',
      { 'class': 'nest-tree', attrs: { 'aria-label': o.ariaLabel || '중첩 조건 흐름도' } },
      [outerRow, yesBranch, noBranch, noteNode]
    );

    function setOuter(status) {
      var s = normalize(status);
      STATE_CLASSES.forEach(function (cls) {
        outerRow.classList.remove(cls);
      });
      outerRow.classList.add('is-' + s);
      replaceBadge(outerStatusHolder, s);

      if (s === 'true') {
        replaceBadge(yesStatusHolder, 'executed');
        replaceBadge(noStatusHolder, 'unchecked');
        setDimmed(false);
        setNote(defaultNote);
      } else if (s === 'false') {
        replaceBadge(yesStatusHolder, 'unchecked');
        replaceBadge(noStatusHolder, 'executed');
        // 명세 8.3 : 바깥 조건이 False 면 안쪽 영역을 비활성화하고 문구를 보여 준다.
        setDimmed(true);
        setNote(DIM_NOTE);
      } else {
        replaceBadge(yesStatusHolder, 'idle');
        replaceBadge(noStatusHolder, 'idle');
        setDimmed(false);
        setNote(defaultNote);
      }
    }

    function setInner(id, status) {
      var entry = innerMap[id];
      if (!entry) return;
      var s = normalize(status);
      STATE_CLASSES.forEach(function (cls) {
        entry.leaf.classList.remove(cls);
      });
      entry.leaf.classList.add('is-' + s);
      replaceBadge(entry.holder, s);
    }

    function setDimmed(flag) {
      inner.classList.toggle('is-dimmed', Boolean(flag));
      inner.setAttribute('aria-disabled', flag ? 'true' : 'false');
    }

    function setNote(text) {
      noteNode.textContent = text || '';
    }

    function reset() {
      setOuter('idle');
      Object.keys(innerMap).forEach(function (id) {
        setInner(id, 'idle');
      });
      setDimmed(false);
      setNote(defaultNote);
    }

    reset();

    return {
      root: root,
      setOuter: setOuter,
      setInner: setInner,
      setDimmed: setDimmed,
      setNote: setNote,
      reset: reset,
      /** runBonus() 결과를 그대로 넣으면 트리 전체가 갱신된다. */
      applyResult: function (result) {
        if (!result) return;
        setOuter(result.outer ? result.outer.status : 'idle');
        (result.inner || []).forEach(function (c) {
          setInner(c.id, c.status);
        });
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 변수 상태 표시                                                       */
  /* ------------------------------------------------------------------ */
  /** createVarWatch({ names: ['reduce', 'mileage'], quoteStrings: true }) */
  function createVarWatch(opts) {
    var o = opts || {};
    var names = o.names || [];
    var quoteStrings = o.quoteStrings !== false;
    var map = {};

    var root = el('div', {
      'class': 'var-watch',
      attrs: { role: 'group', 'aria-label': o.ariaLabel || '변수 상태' }
    });

    names.forEach(function (name) {
      // 값이 없을 때는 비워 둔다. lesson.css 의 .var-watch__value:empty::after 가 — 를 보여 준다.
      var valueNode = el('span', { 'class': 'var-watch__value' });
      var item = el('div', { 'class': 'var-watch__item', dataset: { name: name } }, [
        el('span', { 'class': 'var-watch__name', text: name }),
        valueNode
      ]);
      root.appendChild(item);
      map[name] = valueNode;
    });

    function format(value) {
      if (value === undefined || value === null || value === '') return '';
      if (typeof value === 'string' && quoteStrings) return "'" + value + "'";
      return String(value);
    }

    /** 값을 넣는다. 방금 바뀐 변수에는 is-changed 를 붙여 눈에 띄게 한다. */
    function set(name, value) {
      var node = map[name];
      if (!node) return;
      var next = format(value);
      var changed = next !== '' && node.textContent !== next;
      node.textContent = next;
      node.parentNode.classList.toggle('is-changed', changed);
    }

    function setAll(obj) {
      names.forEach(function (name) {
        set(name, obj ? obj[name] : null);
      });
    }

    function reset() {
      names.forEach(function (name) {
        set(name, null);
      });
    }

    return { root: root, set: set, setAll: setAll, reset: reset };
  }

  /* ------------------------------------------------------------------ */
  /* 공개                                                                */
  /* ------------------------------------------------------------------ */
  L.flow = {
    STATUS_TEXT: STATUS_TEXT,
    STATUS_ICON: STATUS_ICON,
    STATUS_LABEL: STATUS_LABEL,
    statusBadge: statusBadge,
    createConditionList: createConditionList,
    createNestedTree: createNestedTree,
    createVarWatch: createVarWatch
  };
})();

    <script data-from="js/60-step1.js">
/**
 * 화면 1 — 시작 및 선수 학습 확인 (명세 5장)
 *  - 5.1 제목 / 부제
 *  - 5.2 학습 목표 2개 · 예상 학습 시간 45~50분 · 지난 시간 핵심 내용 카드
 *  - 5.3 미니 문항 1 (조건식의 결과)
 *  - 5.4 미니 문항 2 (올바른 들여쓰기 고르기)
 *  - 5.5 두 문항을 모두 맞히면 [학습 시작] 버튼 활성화
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;

  /* 명세 2장 학습 목표 — 원문 그대로 표기한다. */
  var GOALS = [
    '여러 조건을 순서대로 판단하는 <strong>if-elif-else문의 실행 흐름</strong>을 설명할 수 있다.',
    '<strong>다중 조건문과 중첩 조건문의 차이</strong>를 이해하고, 문제 상황에 알맞은 구조를 선택하여 프로그램을 작성할 수 있다.'
  ];

  /* 명세 5.2 지난 시간 핵심 내용 — 한눈에 훑고 지나가도록 짧은 낱말로 줄였다. */
  var RECALL = [
