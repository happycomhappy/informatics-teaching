      f.input.style.textAlign = 'left';
      f.input.style.width = '100%';
      f.input.setAttribute('aria-label', label);
      inputs[key] = f;
      return f.input;
    };

    var code = L.codeview.createCodeView({
      lines: [
        { code: 'count = 1' },
        { parts: [mk('l1', '첫 번째 줄을 작성하세요')] },
        { indent: 4, parts: [mk('l2', '두 번째 줄을 작성하세요')] },
        { indent: 4, parts: [mk('l3', '세 번째 줄을 작성하세요')] },
        { code: 'print("응원 완료!")' }
      ],
      title: '완성할 프로그램',
      ariaLabel: '5번 문항 프로그램'
    });

    var body = el('div', { 'class': 'stack' }, [
      el('p', { text: q.desc }),
      expectedBox(q.expected),
      code.root,
      ui.callout(
        '들여쓰기는 이미 되어 있습니다. <strong>한 줄 전체</strong>를 그대로 적어 주세요. ' +
          '공백의 차이는 정답 판정에 영향을 주지 않습니다.',
        { muted: true }
      )
    ]);

    return { body: body, inputs: inputs };
  }

  /** 🙋 응시자 정보 — 제출할 때 쓰는 학번·이름 (2차시 6단계와 같은 자리) */

  /* ------------------------------------------------------------------ */
  /* 답안 제출 (명세 10.7)                                                 */
  /* ------------------------------------------------------------------ */
  function readEndpoint() {
    // ?endpoint=... 로 넘어온 주소를 먼저 쓰고, 없으면 지난번에 저장해 둔 주소를 쓴다.
    var fromQuery = '';
    try {
      fromQuery = String(new URL(window.location.href).searchParams.get('endpoint') || '').trim();
    } catch (err) {
      fromQuery = '';
    }
    if (fromQuery) {
      rememberEndpoint(fromQuery);
      return fromQuery;
    }
    try {
      return String(window.localStorage.getItem(ENDPOINT_KEY) || '').trim();
    } catch (err) {
      return '';
    }
  }

  function rememberEndpoint(value) {
    try {
      window.localStorage.setItem(ENDPOINT_KEY, value);
    } catch (err) {
      /* 저장하지 못해도 이번 제출에는 지장이 없다 */
    }
  }

  function safeFileName(studentId, name) {
    var clean = String(name || '')
      .replace(/[\\/:*?"<>|]/g, '')
      .replace(/\s+/g, '');
    return String(studentId).trim() + '_' + (clean || '이름없음') + '.json';
  }

  /** 저장할 답안 꾸러미를 만든다(Apps Script 가 그대로 파일로 저장한다). */
  function buildPayload(student) {
    // 교사용 분석 페이지가 보기별 응답까지 셀 수 있도록 고른 번호(choice)와
    // 5번의 세 줄(lines)을 함께 담는다.
    var answers = QUESTIONS.map(function (q, i) {
      var raw = st.step6.answers[i];
      var item = {
        questionId: q.no,
        type: q.type,
        answer: answerText(i),
        correct: isCorrect(i)
      };
      if (q.type === 'code') {
        item.lines = {
          l1: String((raw && raw.l1) || ''),
          l2: String((raw && raw.l2) || ''),
          l3: String((raw && raw.l3) || '')
        };
      } else {
        item.choice = raw === null || raw === undefined ? null : Number(raw);
      }
      return item;
    });
    var score = totalScore();
    return {
      lesson: LESSON_ID,
      lessonTitle: 'for문과 while문으로 구현하는 반복 제어',
      studentId: student.id,
      name: student.name,
      answers: answers,
      totalScore: score,
      maxScore: MAX_SCORE,
      passed: score >= PASS_SCORE ? '이수' : '미이수',
      attempts: Number(st.step6.attempts) || 1,
      submissionId: String(Date.now()) + '-' + Math.random().toString(36).slice(2, 10),
      submittedAt: new Date().toISOString()
    };
  }

  /** 학번·이름을 받고 「제출은 한 번만」을 분명히 알린다. */
  function askStudent() {
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      var idInput = el('input', {
        type: 'text',
        'class': 'num-input',
        value: st.step6.student.id || '',
        style: { width: '100%', textAlign: 'left' },
        attrs: {
          placeholder: '예) 10307',
          'aria-label': '학번',
          inputmode: 'numeric',
          autocomplete: 'off'
        }
      });
      var nameInput = el('input', {
        type: 'text',
        'class': 'num-input',
        value: st.step6.student.name || '',
        style: { width: '100%', textAlign: 'left' },
        attrs: { placeholder: '예) 김수연', 'aria-label': '이름', autocomplete: 'off' }
      });
      var error = el('p', { 'class': 'modal__error', attrs: { 'aria-live': 'polite' } });

      function confirmValue() {
        var id = idInput.value.trim();
        var name = nameInput.value.trim();
        if (!/^\d{3,10}$/.test(id)) {
          error.textContent = '학번은 숫자 3~10자리로 적어 주세요.';
          idInput.focus();
          return;
        }
        if (!name) {
          error.textContent = '이름을 적어 주세요.';
          nameInput.focus();
          return;
        }
        done({ id: id, name: name });
      }

      [idInput, nameInput].forEach(function (input) {
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            confirmValue();
          }
        });
      });

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: '답안을 제출할까요?' }),
          el('p', {
            'class': 'modal__text',
            html:
              '<strong>답안 제출은 한 번만 가능합니다.</strong> 제출한 뒤에는 답을 고칠 수 없어요.<br />' +
              '제출을 마치면 [채점하기]가 열려 점수를 확인할 수 있습니다.'
          }),
          el('div', { 'class': 'field' }, [
            el('label', { 'class': 'field__label', text: '학번' }),
            idInput
          ]),
          el('div', { 'class': 'field' }, [
            el('label', { 'class': 'field__label', text: '이름' }),
            nameInput
          ]),
          error,
          el('div', { 'class': 'modal__actions' }, [
            ui.button({
              label: '다시 확인하기',
              variant: 'ghost',
              onClick: function () {
                done(null);
              }
            }),
            ui.button({ label: '제출하기', variant: 'primary', onClick: confirmValue })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(null);
      });
      dialog.addEventListener('close', function () {
        done(null);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
      setTimeout(function () {
        idInput.focus();
      }, 30);
    });
  }

  /** 선생님이 알려 준 제출 주소를 물어본다(비워 두면 파일로 내려받는다). */
  function askEndpoint(initial) {
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      var input = el('input', {
        type: 'url',
        'class': 'num-input',
        value: initial || '',
        style: { width: '100%', textAlign: 'left' },
        attrs: {
          placeholder: 'https://script.google.com/macros/s/.../exec',
          'aria-label': '선생님이 알려 준 제출 주소',
          autocomplete: 'off',
          spellcheck: 'false'
        }
      });

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: '제출 주소가 필요해요' }),
          el('p', {
            'class': 'modal__text',
            html:
              '선생님이 알려 주신 <strong>제출 주소</strong>를 붙여넣으면 답안이 선생님 폴더에 저장돼요.<br />' +
              '주소는 보통 <code>https://script.google.com/macros/s/…/exec</code> 모양이에요.<br />' +
              '주소가 없으면 <strong>답안 파일을 기기에 내려받아</strong> 선생님께 낼 수도 있어요.'
          }),
          input,
          el('div', { 'class': 'modal__actions' }, [
            ui.button({
              label: '파일로 내려받기',
              variant: 'ghost',
              onClick: function () {
                done('');
              }
            }),
            ui.button({
              label: '이 주소로 보내기',
              variant: 'primary',
              onClick: function () {
                done(input.value.trim());
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(null);
      });
      dialog.addEventListener('close', function () {
        done(null);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /**
   * Apps Script 웹앱으로 보낸다.
   * Content-Type 을 text/plain 으로 두면 사전 요청(preflight) 없이 전송된다.
   */
  function sendToEndpoint(url, payload) {
    return fetch(url, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().catch(function () {
          return { ok: false, error: '응답을 읽지 못했습니다.' };
        });
      })
      .catch(function (err) {
        return { ok: false, error: '주소에 연결하지 못했습니다. ' + (err && err.message ? err.message : '') };
      });
  }

  /** 답안 파일을 기기에 내려받는다(제출 주소가 없을 때). */
  function downloadPayload(payload) {
    var fileName = safeFileName(payload.studentId, payload.name);
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: fileName });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return fileName;
    } catch (err) {
      return '';
    }
  }

  function submit() {
    if (st.step6.submitted) return;
    if (L.state.answeredCount() < 5) {
      ui.toast('아직 답하지 않은 문항이 있어요.');
      return;
    }

    askStudent().then(function (student) {
      if (!student) return;
      st.step6.student.id = student.id;
      st.step6.student.name = student.name;
      st.step6.attempts = (Number(st.step6.attempts) || 0) + 1;
      L.state.markChanged();

      var payload = buildPayload(student);
      var endpoint = readEndpoint();

      var run = endpoint
        ? Promise.resolve(endpoint)
        : askEndpoint('').then(function (value) {
            if (value === null) return null; // 대화상자를 그냥 닫음
            if (value) rememberEndpoint(value);
            return value;
          });

      run.then(function (url) {
        if (url === null) return; // 제출을 멈춘다(아직 제출하지 않은 상태 유지)
        if (!url) {
          finishSubmit(payload, {
            ok: true,
            mode: 'download',
            fileName: downloadPayload(payload)
          });
          return;
        }
        refs.btnSubmit.disabled = true;
        refs.btnSubmit.textContent = '제출하는 중…';
        sendToEndpoint(url, payload).then(function (result) {
          refs.btnSubmit.textContent = '답안 제출하기';
          if (result && result.ok) {
            finishSubmit(payload, {
              ok: true,
              mode: 'drive',
              fileName: result.fileName || safeFileName(payload.studentId, payload.name)
            });
            return;
          }
          // 보내지 못했으면 파일로 내려받아 제출을 마칠 수 있게 한다.
          ui.confirmDialog({
            title: '제출 주소로 보내지 못했어요',
            message:
              (result && result.error ? ui.escapeHtml(result.error) + '<br />' : '') +
              '대신 <strong>답안 파일을 기기에 내려받아</strong> 선생님께 낼 수 있어요.',
            okLabel: '파일로 내려받기',
            cancelLabel: '다시 시도하기',
            dismissValue: false
          }).then(function (goDownload) {
            if (!goDownload) {
              refs.btnSubmit.disabled = false;
              syncItems();
              return;
            }
            finishSubmit(payload, {
              ok: true,
              mode: 'download',
              fileName: downloadPayload(payload)
            });
          });
        });
      });
    });
  }

  function finishSubmit(payload, result) {
    st.step6.submitted = true;
    st.step6.submitInfo.at = payload.submittedAt;
    st.step6.submitInfo.fileName = result.fileName || '';
    st.step6.submitInfo.mode = result.mode;
    L.state.markChanged();
    syncItems();
    ui.toast('답안을 제출했어요. 이제 채점하기를 눌러 보세요.');
    ui.announce('답안 제출이 끝났습니다. 채점하기 버튼이 열렸습니다.');
    refs.navRow.scrollIntoView({ block: 'center', behavior: ui.prefersReducedMotion() ? 'auto' : 'smooth' });
  }

  /* ------------------------------------------------------------------ */
  /* 채점 · 결과                                                          */
  /* ------------------------------------------------------------------ */
  function grade() {
    if (!st.step6.submitted) {
      ui.toast('답안을 먼저 제출해 주세요.');
      return;
    }
    var score = totalScore();
    st.step6.graded = true;
    st.step6.score = score;
    st.step6.passed = score >= PASS_SCORE;
    st.step6.bestScore = st.step6.bestScore === null ? score : Math.max(st.step6.bestScore, score);
    L.state.markChanged();

    syncItems();
    showScore();
    ui.announce('채점이 끝났습니다. 총점 ' + score + '점, ' + (st.step6.passed ? '이수' : '미이수') + '입니다.');
    refs.scoreCard.scrollIntoView({ block: 'center', behavior: ui.prefersReducedMotion() ? 'auto' : 'smooth' });
  }

  function showScore() {
    var score = st.step6.score;
    var passed = st.step6.passed;
    refs.scoreCard.hidden = false;
    ui.clear(refs.scoreCard);
    refs.scoreCard.appendChild(el('p', { 'class': 'score-card__title', text: '형성평가 결과' }));
    refs.scoreCard.appendChild(
      el('p', { 'class': 'score-card__value' }, [
        el('span', { text: String(score) }),
        el('small', { text: ' / 10' })
      ])
    );
    refs.scoreCard.appendChild(
      el(
        'div',
        { 'class': 'score-dots' },
        QUESTIONS.map(function (q, i) {
          return el('span', {
            'class': 'score-dot' + (isCorrect(i) ? ' is-correct' : ''),
            text: String(q.no),
            attrs: { 'aria-label': q.no + '번 ' + (isCorrect(i) ? '정답' : '오답') }
          });
        })
      )
    );
    refs.scoreCard.appendChild(
      el('p', {
        'class': 'score-card__comment',
        html: passed
          ? '✅ <strong>이수</strong> — 반복문의 개념과 실행 과정을 잘 이해했습니다.'
          : '📌 <strong>미이수</strong> — 6점 이상이면 이수입니다. 아래 해설을 읽고 오답 문항만 다시 풀어 보세요.'
      })
    );
  }

  /** 다시 풀기 : 제출은 이미 끝났으므로 점수 확인용으로만 다시 푼다. */
  function restart(wrongOnly) {
    var list = [];
    QUESTIONS.forEach(function (q, i) {
      if (wrongOnly && isCorrect(i)) return;
      list.push(i);
      st.step6.answers[i] = q.type === 'code' ? { l1: '', l2: '', l3: '' } : null;
    });
    if (!list.length) {
      ui.toast('다시 풀 오답 문항이 없어요.');
      return;
    }
    st.step6.queue = list;
    st.step6.index = 0;
    st.step6.graded = false;
    st.step6.retrying = true;
    st.step6.score = null;
    st.step6.passed = null;
    L.state.markChanged();
    refs.scoreCard.hidden = true;
    syncItems();
    ui.toast(wrongOnly ? '오답 문항만 다시 풀 수 있어요.' : '모든 문항을 다시 풀 수 있어요.');
    refs.items[list[0]].panel.scrollIntoView({ block: 'start' });
  }

  /* ------------------------------------------------------------------ */
  /* 화면 갱신                                                            */
  /* ------------------------------------------------------------------ */
  function answerText(index) {
    var q = QUESTIONS[index];
    var a = st.step6.answers[index];
    if (q.type === 'code') {
      if (!a) return '(작성하지 않음)';
      return [a.l1, a.l2, a.l3]
        .map(function (line, i) {
          return i + 1 + '번째 줄: ' + (String(line || '').trim() || '(비어 있음)');
        })
        .join('\n');
    }
    if (!a) return '(고르지 않음)';
    return NUM[a - 1] + ' ' + q.options[a - 1];
  }

  function correctText(index) {
    var q = QUESTIONS[index];
    if (q.type === 'code') {
      return q.answerLines
        .map(function (line, i) {
          return i + 1 + '번째 줄: ' + line;
        })
        .join('\n');
    }
    return NUM[q.answer - 1] + ' ' + q.options[q.answer - 1];
  }

  function syncItems() {
    var mode = phase();
    var showAll = mode !== 'quiz';
    var current = currentIndex();
    var list = queue();

    refs.items.forEach(function (item) {
      var q = item.q;
      var index = item.index;
      var answer = st.step6.answers[index];
      var locked = mode !== 'quiz';

      // 문항 풀이 중에는 지금 문항 하나만 보여 준다.
      item.panel.hidden = showAll ? false : index !== current;

      item.buttons.forEach(function (btn) {
        var num = Number(btn.dataset.num);
        btn.classList.toggle('is-selected', Number(answer) === num);
        btn.classList.remove('is-correct', 'is-wrong');
        btn.disabled = locked;
        if (mode !== 'result') return;
        if (num === q.answer) btn.classList.add('is-correct');
        else if (Number(answer) === num) btn.classList.add('is-wrong');
      });

      if (item.inputs) {
        var a = answer && typeof answer === 'object' ? answer : { l1: '', l2: '', l3: '' };
        ['l1', 'l2', 'l3'].forEach(function (key) {
          var f = item.inputs[key];
          if (f.getValue() !== (a[key] || '')) f.setValue(a[key] || '');
          f.input.disabled = locked;
          f.input.classList.remove('is-correct', 'is-wrong');
        });
        if (mode === 'result') {
          var marks = gradeQ5(a).marks;
          ['l1', 'l2', 'l3'].forEach(function (key, i) {
            item.inputs[key].input.classList.add(marks[i] ? 'is-correct' : 'is-wrong');
          });
        }
      }

      /* 해설은 채점 뒤에만 보여 준다 */
      item.review.hidden = mode !== 'result';
      if (mode !== 'result') return;
      var ok = isCorrect(index);
      ui.clear(item.review);
      item.review.className = 'quiz-review ' + (ok ? 'is-correct' : 'is-wrong');
      item.review.appendChild(
        el('p', { 'class': 'quiz-review__head', text: (ok ? '⭕ 정답' : '❌ 오답') + ' · ' + q.no + '번 문항' })
      );
      item.review.appendChild(
        el('dl', { 'class': 'quiz-review__rows' }, [
          el('dt', { text: '내 답' }),
          el('dd', { 'class': 'pre-line', text: answerText(index) }),
          el('dt', { text: '정답' }),
          el('dd', { 'class': 'pre-line', text: correctText(index) }),
          el('dt', { text: '해설' }),
          el('dd', { html: q.explain }),
          el('dt', { text: '평가 요소' }),
          el('dd', { text: q.point })
        ])
      );
      if (!ok) {
        item.review.appendChild(
          ui.linkLine({ text: q.relatedLabel, step: q.relatedStep, label: q.relatedStep + '단계로 이동' })
        );
      }
    });

    /* 진행 표시 */
    refs.progressText.textContent =
      mode === 'quiz'
        ? '문항 ' + QUESTIONS[current].no + ' / 5   (' + (position() + 1) + ' / ' + list.length + ' 번째)'
        : mode === 'submitted'
        ? '답안 제출 완료 — 채점하기를 누르세요'
        : '채점 결과';
    syncNav();
  }

  /** 진행 점(문항 번호)은 글자를 칠 때마다 바로 갱신한다. */
  function syncDots() {
    var mode = phase();
    var current = currentIndex();
    Array.prototype.slice.call(refs.progressDots.children).forEach(function (dot, i) {
      dot.classList.toggle('is-current', mode === 'quiz' && i === current);
      dot.classList.toggle('is-done', isAnswered(i));
    });
  }

  function syncNav() {
    syncDots();
    var mode = phase();
    var list = queue();
    var pos = position();
    var current = currentIndex();
    var allAnswered = L.state.answeredCount() === 5;

    var quizMode = mode === 'quiz';
    setShown(refs.btnPrev, quizMode);
    setShown(refs.btnNext, quizMode);
    setShown(refs.btnSubmit, mode !== 'result');
    setShown(refs.btnGrade, true);
    setShown(refs.retryRow, mode === 'result');

    refs.btnPrev.disabled = pos === 0;
    // 1~4번은 그 문항에 답해야 [다음 문항] 이 열린다.
    refs.btnNext.disabled = pos >= list.length - 1 || !isAnswered(current);
    refs.btnSubmit.disabled = !allAnswered || st.step6.submitted;
    // 채점은 «제출을 마친 뒤» 열린다. 다시 풀 때에도 모든 문항에 답해야 채점할 수 있다.
    refs.btnGrade.disabled = !st.step6.submitted || st.step6.graded || !allAnswered;

    if (st.step6.submitted) {
      refs.btnSubmit.textContent = '제출 완료';
    }

    if (mode === 'result') {
      refs.navHint.textContent = '해설을 읽고, 필요하면 아래 버튼으로 다시 풀어 볼 수 있어요.';
    } else if (mode === 'submitted') {
      refs.navHint.textContent = '답안을 제출했어요. [채점하기]를 누르면 점수와 해설을 볼 수 있어요.';
    } else if (st.step6.retrying) {
      refs.navHint.textContent = allAnswered
        ? '다시 푼 답으로 [채점하기]를 누르면 점수를 다시 확인할 수 있어요. (답안 제출은 이미 끝났어요)'
        : '다시 풀고 있어요. 남은 문항에 답하면 [채점하기]가 열려요.';
    } else if (!isAnswered(current)) {
      refs.navHint.textContent = '이 문항에 답하면 [다음 문항]이 열려요.';
    } else if (!allAnswered) {
      refs.navHint.textContent = '5문항을 모두 풀면 [답안 제출하기]가 열려요.';
    } else {
      refs.navHint.textContent = '모든 문항에 답했어요. ⚠ 답안 제출은 한 번만 가능합니다.';
    }

    /* 제출 결과 안내 */
    refs.submitNote.hidden = !st.step6.submitted;
    if (st.step6.submitted) {
      var info = st.step6.submitInfo;
      var where =
        info.mode === 'drive'
          ? '선생님 폴더에 저장되었습니다.'
          : '답안 파일을 기기에 내려받았습니다. 선생님께 제출해 주세요.';
      refs.submitNote.innerHTML =
        '📮 <strong>' +
        ui.escapeHtml(st.step6.student.name || '') +
        '</strong> 학생의 답안을 제출했습니다. ' +
        where +
        (info.fileName ? ' (파일 이름 <code>' + ui.escapeHtml(info.fileName) + '</code>)' : '') +
        '<br />답안 제출은 한 번만 가능하므로 다시 제출할 수 없습니다.';
    }
  }

  function setShown(node, shown) {
    if (!node) return;
    node.hidden = !shown;
    node.style.display = shown ? '' : 'none';
  }

  /* ------------------------------------------------------------------ */
  /* 학습 정리 · 자기 점검 (명세 10.8 ~ 10.10)                              */
  /* ------------------------------------------------------------------ */
  var CONCEPTS = [
    { key: '반복', desc: '같은 명령을 여러 번 실행하기' },
    { key: '반복 변수', desc: '반복할 때마다 값이 바뀌는 변수 (i, step, count)' },
    { key: 'for', desc: '반복 횟수·데이터가 정해졌을 때' },
    { key: 'while', desc: '조건이 참인 동안 반복' },
    { key: 'range', desc: 'range(시작값, 끝값, 증감값)' },
    { key: '끝값 미포함', desc: 'range(1, 6) → 1 2 3 4 5' },
    { key: '증감값', desc: '값이 커지거나 작아지는 크기 (0은 불가)' },
    { key: '종료 조건', desc: '조건이 False가 되면 반복 끝' },
    { key: '무한 반복', desc: '값이 변하지 않아 끝나지 않는 반복' },
    { key: '누적', desc: 'total = total + i 처럼 값을 쌓기' }
  ];

  function buildSummary(root) {
    root.appendChild(ui.sectionTitle('2', '학습 정리'));

    var panel = ui.panel({ title: '문장을 완성해 보세요.' });
    refs.s1 = ui.textField({
      id: 's6-sum1',
      label: '① for문은 (          ) 가 정해져 있을 때 사용하기 편리하다.',
      placeholder: '빈칸에 들어갈 말',
      width: '14rem',
      onInput: function (v) {
        st.step6.summary.s1 = v;
        L.state.markChanged();
      }
    });
    refs.s2 = ui.textField({
      id: 's6-sum2',
      label: '② while문은 (          ) 이 참인 동안 반복한다.',
      placeholder: '빈칸에 들어갈 말',
      width: '14rem',
      onInput: function (v) {
        st.step6.summary.s2 = v;
        L.state.markChanged();
      }
    });
    panel.body.appendChild(refs.s1.root);
    panel.body.appendChild(refs.s2.root);
    refs.sumFeedback = ui.createFeedback({ emptyText: '두 문장을 채우고 확인하기를 누르세요.' });
    panel.body.appendChild(
      ui.buttonRow([
        ui.button({
          label: '확인하기',
          variant: 'secondary',
          onClick: function () {
            var a = String(st.step6.summary.s1 || '');
            var b = String(st.step6.summary.s2 || '');
            var ok1 = /반복\s*횟수|횟수/.test(a);
            var ok2 = /조건/.test(b);
            if (ok1 && ok2) {
              refs.sumFeedback.show(
                'success',
                '잘 정리했습니다. for문은 <strong>반복 횟수</strong>가 정해져 있을 때, ' +
                  'while문은 <strong>조건</strong>이 참인 동안 반복합니다.'
              );
            } else {
              refs.sumFeedback.show(
                'info',
                '예상 답 — ① <strong>반복 횟수</strong> ② <strong>조건</strong> ' +
                  '<br />오늘 배운 내용을 떠올리며 다시 적어 보세요.'
              );
            }
          }
        })
      ])
    );
    panel.body.appendChild(refs.sumFeedback.root);
    root.appendChild(panel.root);

    /* 핵심 개념 카드 */
    var cardPanel = ui.panel({ title: '🔑 핵심 개념 카드' });
    cardPanel.body.appendChild(
      el(
        'div',
        { 'class': 'concept-grid' },
        CONCEPTS.map(function (c) {
          return el('div', { 'class': 'concept-card' }, [
            el('span', { 'class': 'concept-card__key', text: c.key }),
            el('span', { 'class': 'concept-card__desc', text: c.desc })
          ]);
        })
      )
    );
    root.appendChild(cardPanel.root);
  }

  var SELF_ITEMS = [
    { key: 'a', text: 'for문의 실행 과정을 설명할 수 있다.' },
    { key: 'b', text: 'while문의 종료 조건을 설명할 수 있다.' },
    { key: 'c', text: '상황에 따라 for문과 while문을 선택할 수 있다.' }
  ];
  var SELF_LEVELS = ['잘 모르겠다', '어느 정도 안다', '설명할 수 있다'];

  function buildSelfCheck(root) {
    root.appendChild(ui.sectionTitle('3', '스스로 점검하기'));
    var panel = ui.panel({ title: '오늘 학습을 스스로 점검해 보세요.' });
    refs.selfButtons = {};

    SELF_ITEMS.forEach(function (item, i) {
      var buttons = SELF_LEVELS.map(function (label, level) {
        return el('button', {
          type: 'button',
          'class': 'check-btn',
          text: label,
          dataset: { level: String(level) },
          attrs: { 'aria-label': item.text + ' — ' + label },
          on: {
            click: function () {
              st.step6.selfCheck[item.key] = level;
              L.state.markChanged();
              syncSelf();
            }
          }
        });
      });
      refs.selfButtons[item.key] = buttons;
      panel.body.appendChild(
        el('div', { 'class': 'self-check__row' }, [
          el('p', { 'class': 'self-check__text', text: ['①', '②', '③'][i] + ' ' + item.text }),
          el('div', { 'class': 'row' }, buttons)
        ])
      );
    });
    root.appendChild(panel.root);

    root.appendChild(
      el('div', { 'class': 'next-lesson' }, [
        el('p', {
          html: '📅 <strong>다음 차시 예고</strong><br />' +
            '다음 시간에는 조건문과 반복문을 함께 사용하여 더 다양한 문제를 해결합니다.'
        })
      ])
    );
  }

  function syncSelf() {
    SELF_ITEMS.forEach(function (item) {
      var picked = st.step6.selfCheck[item.key];
      refs.selfButtons[item.key].forEach(function (btn) {
        btn.classList.toggle('is-selected', Number(btn.dataset.level) === picked);
      });
    });
  }

  /* ------------------------------------------------------------------ */
  /* 조립                                                                */
  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 6,
        title: '형성평가 및 학습 정리',
        lead: [
          '오늘 배운 <strong>for문과 while문</strong>을 확인합니다. 총 5문항 10점이며 <strong>6점 이상이면 이수</strong>입니다.',
          '한 문항씩 풀고 <strong>답안을 제출한 뒤</strong> 채점 결과와 해설을 볼 수 있습니다. ' +
            '<strong>답안 제출은 한 번만 가능합니다.</strong>'
        ]
      })
    );
    buildWho(root);
    buildQuiz(root);
    buildSummary(root);
    buildSelfCheck(root);
  }

  function onEnter() {
    syncItems();
    syncSelf();
    refs.idField.setValue(st.step6.student.id);
    refs.nameField.setValue(st.step6.student.name);
    refs.s1.setValue(st.step6.summary.s1);
    refs.s2.setValue(st.step6.summary.s2);
    if (st.step6.graded) showScore();
  }

  L.registerStep(6, {
    title: L.CONST.STEP_TITLES[6],
    short: L.CONST.STEP_SHORTS[6],
    render: render,
    onEnter: onEnter
  });

  /** 교사용 : 콘솔에서 제출 주소를 미리 넣어 둘 수 있다. */
  L.setSubmitEndpoint = function (url) {
    rememberEndpoint(String(url || '').trim());
    return '제출 주소를 저장했습니다: ' + url + '\n저장 폴더: ' + DRIVE_FOLDER_URL;
  };
})();
    </script>
    <script data-from="js/90-app.js">
/**
 * 앱 부팅 (명세 4장 단계 구성 / 11.1 상태 복원 / 11.4 접근성)
 *  - 상단 스테퍼 생성·갱신, 진행률 바
 *  - 하단 [이전] / [다음] 버튼, 이동 조건 미충족 안내
 *  - 상단 메뉴로는 조건과 관계없이 자유 이동(교사 시연용, 명세 4장)
 *  - 저장된 진행 복원 확인 대화상자
 *  - 주소창 해시(#step3) 동기화
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var TOTAL = L.CONST.TOTAL_STEPS;

  var refs = {
    main: null,
    stepperList: null,
    progressCurrent: null,
    progressBar: null,
    progressFill: null,
    btnPrev: null,
    btnNext: null,
    navHint: null,
    nav: null
  };

  var sections = {};
  var hashLock = false;

  /* ------------------------------------------------------------------ */
  /* 화면 골격 확보                                                       */
  /* ------------------------------------------------------------------ */
  /**
   * index.html 에 골격이 이미 있으면 그대로 쓰고, 없으면 여기서 만든다.
   * (index.html 이 아주 단순해도 앱이 뜨도록 하기 위한 안전장치)
   */
  function ensureShell() {
    if (!document.getElementById('app-main')) {
      var stepperList = el('ol', { 'class': 'stepper__list', id: 'stepper-list' });
      var progressFill = el('div', { 'class': 'progressbar__fill', id: 'progressbar-fill' });
      var app = el('div', { 'class': 'app' }, [
        el('header', { 'class': 'app-progress', id: 'app-progress' }, [
          el('div', { 'class': 'app-progress__inner' }, [
            el(
              'nav',
              { 'class': 'stepper', id: 'stepper', attrs: { 'aria-label': '학습 단계 이동' } },
              [stepperList]
            ),
            el('div', { 'class': 'app-progress__meter' }, [
              el('p', { 'class': 'app-progress__count' }, [
                el('span', { id: 'progress-current', text: '1' }),
                el('span', { 'class': 'app-progress__count-sep', text: ' / ' }),
                el('span', { text: String(TOTAL) })
              ]),
              el(
                'div',
                {
                  'class': 'progressbar',
                  id: 'progressbar',
                  attrs: {
                    role: 'progressbar',
                    'aria-label': '학습 진행률',
                    'aria-valuemin': '0',
                    'aria-valuemax': '100',
                    'aria-valuenow': '0'
                  }
                },
                [progressFill]
              )
            ])
          ])
        ]),
        el('main', { 'class': 'app-main', id: 'app-main' }),
        el('footer', { 'class': 'app-nav', id: 'app-nav' }, [
          el('div', { 'class': 'app-nav__inner' }, [
            el('button', { type: 'button', 'class': 'btn btn--secondary', id: 'btn-prev', text: '← 이전' }),
            el('p', { 'class': 'app-nav__hint', id: 'nav-hint', attrs: { 'aria-live': 'polite' } }),
            el('button', { type: 'button', 'class': 'btn btn--primary', id: 'btn-next', text: '다음 →' })
          ])
        ])
      ]);
      document.body.appendChild(app);
    }

    if (!document.getElementById('toast-region')) {
      document.body.appendChild(
        el('div', {
          'class': 'toast-region',
          id: 'toast-region',
          attrs: { 'aria-live': 'polite', 'aria-atomic': 'true' }
        })
      );
    }
    if (!document.getElementById('sr-live')) {
      document.body.appendChild(
        el('div', {
          'class': 'sr-only',
          id: 'sr-live',
          attrs: { role: 'status', 'aria-live': 'polite' }
        })
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 화면 · 스테퍼 만들기                                             */
  /* ------------------------------------------------------------------ */
  function eachStep(fn) {
    for (var i = 1; i <= TOTAL; i += 1) fn(i, L.steps[i] || null);
  }

  function buildSections() {
    eachStep(function (id, step) {
      var section = el('section', {
        'class': 'step-screen',
        id: 'step-' + id,
        dataset: { step: String(id) },
        attrs: {
          'aria-label': id + '단계 ' + (step ? step.title : ''),
          tabindex: '-1'
        }
      });
      refs.main.appendChild(section);
      sections[id] = section;

      if (!step) {
        section.appendChild(el('p', { text: id + '단계가 아직 등록되지 않았어요.' }));
        return;
      }
      try {
        step.render(section);
        step.rendered = true;
      } catch (err) {
        if (window.console) console.error('[app] ' + id + '단계 화면을 만들지 못했습니다.', err);
        section.appendChild(el('p', { text: id + '단계 화면을 불러오지 못했어요.' }));
      }
    });
  }

  function buildStepper() {
    ui.clear(refs.stepperList);
    eachStep(function (id, step) {
      var title = step ? step.title : id + '단계';
      var node = el('button', {
        type: 'button',
        'class': 'stepper__node',
        text: String(id),
        attrs: { 'aria-label': id + '단계 ' + title + '로 이동' },
        on: {
          click: function () {
            // 명세 4장 : 교사의 시연을 위해 상단 메뉴에서는 자유롭게 이동할 수 있다.
            goToStep(id, { force: true });
          }
        }
      });
      refs.stepperList.appendChild(
        el('li', { 'class': 'stepper__item', dataset: { step: String(id) } }, [
          node,
          el('span', { 'class': 'stepper__label', text: step ? step.short : String(id) })
        ])
      );
    });
  }

  /* ------------------------------------------------------------------ */
  /* 진행 상태 · 이동 버튼 갱신                                            */
  /* ------------------------------------------------------------------ */
  function updateChrome() {
    var current = L.state.appState.currentStep;

    Array.prototype.slice.call(refs.stepperList.children).forEach(function (item) {
      var step = Number(item.dataset.step);
      var visited = L.state.isVisited(step);
      item.classList.toggle('is-current', step === current);
      item.classList.toggle('is-done', visited && step !== current);
      item.classList.toggle('is-locked', !visited);
      var node = item.querySelector('.stepper__node');
      node.textContent = visited && step !== current ? '✔' : String(step);
      node.setAttribute('aria-current', step === current ? 'step' : 'false');
    });

    refs.progressCurrent.textContent = String(current);
    var percent = Math.round(((current - 1) / (TOTAL - 1)) * 100);
    refs.progressFill.style.width = percent + '%';
    refs.progressBar.setAttribute('aria-valuenow', String(percent));
    refs.progressBar.setAttribute(
      'aria-valuetext',
      TOTAL + '단계 중 ' + current + '단계, ' + percent + '%'
    );

    refs.btnPrev.disabled = current === 1;
    refs.nav.classList.toggle('app-nav--start', current === 1);

    var last = current === TOTAL;
    refs.btnNext.textContent = last ? '학습 마치기' : '다음 →';

    var ok = L.state.canProceed(current);
    refs.btnNext.disabled = !ok;
    refs.btnNext.title = ok ? '' : L.state.blockedMessage(current);

    if (ok) {
      refs.navHint.textContent = '';
    } else {
      var left = L.state.remainingHint(current);
      refs.navHint.textContent = left.length
        ? L.state.blockedMessage(current) + ' (남은 활동: ' + left.join(', ') + ')'
        : L.state.blockedMessage(current);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function showStep(step) {
    Object.keys(sections).forEach(function (key) {
      sections[key].classList.toggle('is-active', Number(key) === step);
    });
  }

  function syncHash(step) {
    hashLock = true;
    try {
      if (window.location.hash !== '#step' + step) window.location.hash = 'step' + step;
    } catch (err) {
      /* file:// 등에서 실패해도 학습에는 지장이 없다. */
    }
    setTimeout(function () {
      hashLock = false;
    }, 0);
  }

  /**
   * 단계 이동.
   * options.force  = true 면 이동 조건을 무시한다(상단 메뉴 · 오답 복습 바로가기).
   * options.silent = true 면 막혔을 때 안내를 띄우지 않는다.
   */
  function goToStep(target, options) {
    var o = options || {};
    var current = L.state.appState.currentStep;
    var next = L.state.clampStep(target);

    // 같은 단계로의 이동이라도 화면은 다시 맞춰 준다.
    // (학습 기록 초기화 후처럼 상태만 바뀌고 화면이 그대로 남는 일을 막는다)
    if (next === current) {
      showStep(next);
      var same = L.steps[next];
      if (same && typeof same.onEnter === 'function') {
        try {
          same.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      return;
    }

    // 앞으로 이동할 때만 이동 조건을 확인한다(되돌아가는 것은 언제나 자유).
    if (!o.force && next > current && !L.state.canProceed(current)) {
      var message = L.state.blockedMessage(current);
      if (!o.silent && message) {
        ui.toast(message);
        ui.announce(message);
      }
      return;
    }

    var from = L.steps[current];
    if (from && typeof from.onLeave === 'function') {
      try {
        from.onLeave();
      } catch (err) {
        if (window.console) console.error('[app] onLeave 오류', err);
      }
    }

    L.state.visitStep(next);
    showStep(next);

    var to = L.steps[next];
    if (to && typeof to.onEnter === 'function') {
      try {
        to.onEnter();
      } catch (err) {
        if (window.console) console.error('[app] onEnter 오류', err);
      }
    }

    updateChrome();
    syncHash(next);

    var section = sections[next];
    if (section && typeof section.focus === 'function') section.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    ui.announce(next + '단계 ' + (to ? to.title : '') + ' 화면으로 이동했습니다.');
  }

  function finishLearning() {
    return ui.confirmDialog({
      title: '학습을 모두 마쳤어요 🎉',
      message:
        '오늘 배운 <strong>for문</strong>과 <strong>while문</strong>은 조건문과 함께 프로그램의 흐름을 만드는 바탕이 됩니다.<br />' +
        '다음 시간에는 조건문과 반복문을 함께 사용해 더 다양한 문제를 해결합니다.<br />' +
        '상단 메뉴를 눌러 오늘 배운 화면을 다시 살펴볼 수 있어요.',
      okLabel: '닫기',
      cancelLabel: '되돌아가기',
      dismissValue: true
    });
  }

  /* ------------------------------------------------------------------ */
  /* 해시 동기화                                                          */
  /* ------------------------------------------------------------------ */
  function stepFromHash() {
    var match = String(window.location.hash || '').match(/^#step(\d+)$/);
    if (!match) return null;
    return L.state.clampStep(Number(match[1]));
  }

  function onHashChange() {
    if (hashLock) return;
    var target = stepFromHash();
    if (target === null) return;
    if (target === L.state.appState.currentStep) return;
    goToStep(target, { force: true });
  }

  /* ------------------------------------------------------------------ */
  /* 부팅                                                                */
  /* ------------------------------------------------------------------ */
  function boot() {
    ensureShell();

    refs.main = document.getElementById('app-main');
    refs.stepperList = document.getElementById('stepper-list');
    refs.progressCurrent = document.getElementById('progress-current');
    refs.progressBar = document.getElementById('progressbar');
    refs.progressFill = document.getElementById('progressbar-fill');
    refs.btnPrev = document.getElementById('btn-prev');
    refs.btnNext = document.getElementById('btn-next');
    refs.navHint = document.getElementById('nav-hint');
    refs.nav = document.getElementById('app-nav');

    L.nav.setNavigator(goToStep);

    // 저장된 진행 기록이 있으면 이어서 학습할지 확인한다(명세 11.1).
    var saved = L.state.readSavedState();
    var restore = Promise.resolve();
    if (L.state.hasMeaningfulProgress(saved)) {
      restore = ui
        .confirmDialog({
          title: '이어서 학습하시겠어요?',
          message:
            '이전에 <strong>' +
            (saved.currentStep || 1) +
            '단계</strong>까지 진행한 기록이 남아 있어요.<br />처음부터 다시 시작하면 이전 기록은 지워집니다.',
          okLabel: '이어서 학습하기',
          cancelLabel: '처음부터 시작',
          // Esc 등으로 그냥 닫으면 기록을 지우지 않고 이어서 학습하는 쪽으로 처리한다.
          dismissValue: true
        })
        .then(function (resume) {
          if (resume) L.state.applySavedState(saved);
          else L.state.resetState();
        });
    } else if (saved) {
      L.state.resetState();
    }

    restore.then(function () {
      buildStepper();
      buildSections();

      refs.btnPrev.addEventListener('click', function () {
        goToStep(L.state.appState.currentStep - 1, { force: true });
      });
      refs.btnNext.addEventListener('click', function () {
        if (L.state.appState.currentStep === TOTAL) {
          if (L.state.canProceed(TOTAL)) finishLearning();
          else ui.toast(L.state.blockedMessage(TOTAL));
          return;
        }
        goToStep(L.state.appState.currentStep + 1);
      });

      // 상태가 바뀌면 이동 가능 여부·진행 표시를 즉시 갱신한다.
      L.state.onChange(function () {
        updateChrome();
      });

      window.addEventListener('hashchange', onHashChange);

      // 첫 화면 : 주소창 해시가 있으면 그 단계, 없으면 복원된 단계
      var start = stepFromHash();
      if (start === null) start = L.state.appState.currentStep;
      L.state.visitStep(start);
      showStep(start);
      var startStep = L.steps[start];
      if (startStep && typeof startStep.onEnter === 'function') {
        try {
          startStep.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      syncHash(start);
    });
  }

  L.app = {
    boot: boot,
    goToStep: goToStep,
    refresh: updateChrome,
    /** 저장된 학습 기록을 지우고 1단계로 되돌린다(교사용). */
    resetAll: function () {
      L.state.resetState();
      goToStep(1, { force: true });
      updateChrome();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
