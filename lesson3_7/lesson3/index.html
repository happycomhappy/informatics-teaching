    <!-- 스타일은 나열한 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다. -->
    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);

.choice.is-selected {

.has-tip::after {

.has-tip:hover::after,

}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================
   가운데 코드 칸의 너비는 «가장 긴 코드 줄» 에 맞춘다(max-content).
   남은 자리를 설명이 모두 쓰므로, 코드 상자가 필요 이상으로 넓어지지 않는다. */
.linenotes {
  display: grid;
  grid-template-columns: auto max-content minmax(0, 1fr);
  align-items: stretch;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow-x: auto;
  line-height: 1.9;
}

.linenotes__num,
.linenotes__code {
  background: var(--color-code-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.linenotes__num {
  padding: 2px var(--space-2);
  text-align: right;
  color: #94a3b8;
  user-select: none;
}

.linenotes__code {
  padding: 2px var(--space-4) 2px var(--space-1);
  white-space: pre;
}

.linenotes__desc {
  display: flex;
  align-items: center;
  padding: 2px var(--space-3);
  border-left: 1px dashed var(--color-border-strong);
  background: var(--color-surface);
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  line-height: 1.5;
}

/* 줄 사이 구분선. 마지막 줄에는 넣지 않는다(바깥 테두리와 겹친다). */
.linenotes > * {
  border-bottom: 1px solid var(--color-border);
}

.linenotes > *:nth-last-child(-n + 3) {
  border-bottom: none;
}

/* 모바일에서는 설명을 코드 아래 줄로 내린다 */
@media (max-width: 767px) {
  .linenotes {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .linenotes__desc {
    grid-column: 1 / -1;
    border-left: none;
    border-top: 1px dashed var(--color-border-strong);
    padding: var(--space-2) var(--space-3);
  }

  .linenotes__desc.is-empty {
    display: none;
  }
}

/* ===================== 용어 설명 · 묻고 답하기 (9.6) ===================== */
/* 교과 자료의 「용어 설명」 상자와 같은 모양으로 맞춘다. */
.term-card {
  padding: var(--space-3) var(--space-4);
  border-left: 5px solid var(--color-text);
  background: var(--color-muted-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.term-card__title {
  font-size: 17px;
  font-weight: 800;
}

.term-card__desc {
  margin-top: 2px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.qa {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: var(--fs-small);
  line-height: 1.75;
}

.qa__row {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
}

.qa__mark {
  flex: 0 0 auto;
  width: 1.4em;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
}

.qa__mark--q {
  color: var(--color-true-dark);
}

.qa__mark--a {
  color: var(--color-error);
}

.qa__row--q {
  font-weight: 700;
}

/* ===================== 안전 장치 안내 (11.6) ===================== */
/* 무한 반복 예제에서 반드시 읽어야 하는 문구라 상자로 크게 보인다. */
.safety-notice {
  display: flex;
  width: 100%;
  font-size: 15px;
}

/* ===================== 무작위 뽑기 (9.6) ===================== */
.dice-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.dice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: 17px;
  font-weight: 800;
  animation: dice-roll 600ms ease infinite;
}

.dice.is-done {
  animation: none;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
}

@keyframes dice-roll {
  0%,
  100% {
    transform: rotate(-8deg);
  }
  50% {
    transform: rotate(8deg);
  }
}

/* ===================== 형성평가 (10장) ===================== */
.quiz-item .panel__title {
  align-items: flex-start;
  line-height: 1.5;
}

.expected {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.expected__title {
  padding: 4px var(--space-3);
  background: var(--color-muted-bg);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.expected__body {
  margin: 0;
  padding: var(--space-3);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  white-space: pre-wrap;
}

/* 문항 진행 표시 (문항 n / 5) */
.quiz-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.quiz-progress__text {
  font-weight: 800;
  color: var(--color-primary-dark);
}

.quiz-progress__dots {
  display: flex;
  gap: var(--space-2);
}

.quiz-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.quiz-dot.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.quiz-dot.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.1);
}

/* 문항 아래 버튼 줄 (이전 · 다음 · 채점 · 제출) */
.quiz-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.quiz-nav__hint {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  min-height: 1.4em;
}

.quiz-retry {
  margin-top: var(--space-3);
}

/* 제출 결과 안내 */
.submit-note {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-true);
  border-left-width: 5px;
  background: var(--color-true-soft);
  font-size: var(--fs-small);
  line-height: 1.7;
}

.submit-note code {
  font-family: var(--font-mono);
  font-weight: 700;
}

/* 제출 대화상자의 오류 문구 */
.modal__error {
  margin-top: var(--space-2);
  color: var(--color-error);
  font-size: var(--fs-small);
  font-weight: 700;
  min-height: 1.2em;
}

@media (max-width: 767px) {
  .quiz-nav .btn {
    flex: 1 1 46%;
  }
}

.quiz-review {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-muted-bg);
  font-size: var(--fs-small);
}

.quiz-review.is-correct {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}

.quiz-review.is-wrong {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.quiz-review__head {
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.quiz-review__rows dt {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
  margin-top: var(--space-2);
}

.quiz-review__rows dd {
  margin: 2px 0 0;
}

.pre-line {

/**
 * 코어 — 전역 네임스페이스 · 단계 등록 · 단계 이동 중개 (명세 4장)
 *

 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});

  L.codeview = L.codeview || {};
  L.state = L.state || {};
  L.engine = L.engine || {};
  L.steps = L.steps || {};
  L.nav = L.nav || {};
  L.app = L.app || {};

  /* ------------------------------------------------------------------ */
  /* 공용 상수                                                            */
  /* ------------------------------------------------------------------ */

  /** 단계 제목 (명세 4장) */
  var STEP_TITLES = {
    1: '시작 및 선수 학습 확인',
    2: '같은 명령 반복하기 비교',
    3: 'for문과 range 실행 시뮬레이션',
    4: 'while문과 무한 반복 안전 시뮬레이션',
    5: 'for문과 while문 활용 프로그램',
    6: '형성평가 및 학습 정리'
  };

  /** 상단 스테퍼에 쓰는 짧은 이름(2~5자) */
  var STEP_SHORTS = {
    1: '시작',
    2: '반복 비교',
    3: 'for · range',
    4: 'while',
    5: '활용',
    6: '형성평가'
  };

  L.CONST = {
    STORAGE_KEY: 'lesson3_7_3_state',
    TOTAL_STEPS: 6,
    LESSON_TITLE: 'for문과 while문으로 구현하는 반복 제어',
    LESSON_SUBTITLE: '반복 횟수와 조건에 따라 반복하기',
    STUDY_TIME: '45~50분',
    /** 명세 11.6 : 브라우저가 멈추지 않도록 시뮬레이션이 도는 최대 횟수 */
    MAX_LOOP: 10,
    STEP_TITLES: STEP_TITLES,
    STEP_SHORTS: STEP_SHORTS
  };

  /** 아무 일도 하지 않는 함수 (선택 콜백 자리에 넣는다) */
  L.noop = function () {};

  /* ------------------------------------------------------------------ */
  /* 단계 등록                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 단계 화면 모듈 등록.
   * L.registerStep(n, { title, short, render(container), onEnter(), onLeave() })
   *  - render(container) : 부팅 시 1회만 호출. container 는 이미 만들어진 section.step-screen
   *  - onEnter()         : 그 단계로 이동할 때마다 호출(선택). 저장된 상태를 화면에 되살릴 때 쓴다.
   *  - onLeave()         : 그 단계를 떠날 때 호출(선택). 돌아가는 시뮬레이션을 멈출 때 쓴다.
   */
  L.registerStep = function (n, def) {
    var id = Number(n) || 0;
    var d = def || {};
    var entry = {
      id: id,
      title: d.title || STEP_TITLES[id] || (id + '단계'),
      short: d.short || STEP_SHORTS[id] || String(id),
      render: typeof d.render === 'function' ? d.render : L.noop,
      onEnter: typeof d.onEnter === 'function' ? d.onEnter : null,
      onLeave: typeof d.onLeave === 'function' ? d.onLeave : null,
      rendered: false
    };
    L.steps[id] = entry;
    return entry;
  };

  /** 등록된 단계 정의를 돌려준다(없으면 null). */
  L.getStep = function (n) {
    return L.steps[Number(n)] || null;
  };

  /* ------------------------------------------------------------------ */
  /* 단계 이동 중개                                                       */
  /* ------------------------------------------------------------------ */
  // 90-app.js 가 실제 이동 함수를 등록하고, 각 단계 모듈은 L.nav.goToStep 만 호출한다.
  var navigate = null;

  L.nav.setNavigator = function (fn) {
    navigate = typeof fn === 'function' ? fn : null;
  };

  /**

  L.nav.goToStep = function (step, options) {
    if (typeof navigate === 'function') navigate(step, options || {});
  };

  L.nav.isReady = function () {
    return typeof navigate === 'function';
  };
})();

/**
 * 공용 UI 헬퍼 (명세 11.2 코드 표시 / 11.4 접근성 / 11.5 반응형)
 * 이전 차시 ui.js 를 고전 스크립트로 옮긴 것이라 함수 이름과 사용법이 같다.

(function () {

    text: true,

    on: true,

    if (p.html !== undefined && p.html !== null) node.innerHTML = p.html;

      if (RESERVED[key]) return;
      var value = p[key];
      if (value === undefined || value === null || value === false) return;
      if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    });

    if (p.attrs) {
      Object.keys(p.attrs).forEach(function (key) {
        var value = p.attrs[key];
        if (value === undefined || value === null || value === false) return;
        node.setAttribute(key, value);
      });

    if (p.dataset) {
      Object.keys(p.dataset).forEach(function (key) {
        node.dataset[key] = p.dataset[key];
      });
    }
    if (p.style) {
      Object.keys(p.style).forEach(function (key) {
        node.style[key] = p.style[key];
      });
    }

  // 빌드(build.mjs)가 스크립트를 HTML 안에 넣을 때 "</" 를 모두 "<\/" 로 바꾸는데,

    while (match !== null) {
      if (match.index > last) out += escapeHtml(segment.slice(last, match.index));
      var value = match[0];
      if (match[1]) out += span(KEYWORDS.test(value) ? 'tok-kw' : 'tok-ph', value);
      else if (match[2]) out += span(BUILTINS.test(value) ? 'tok-fn' : 'tok-ph', value);
      else if (match[3]) out += span('tok-num', value);
      else if (match[4]) out += span('tok-colon', value);
      else out += span('tok-op', value);
      last = match.index + value.length;
      match = TOKEN_RE.exec(segment);
    }
    if (last < segment.length) out += escapeHtml(segment.slice(last));
    return out;
  }

  /**
   * 파이썬 한 줄(들여쓰기 제외)을 하이라이팅한 HTML 문자열로 바꾼다.
   * 문자열 리터럴과 주석을 먼저 분리한 뒤 나머지를 토큰 색칠한다.
   */
  function highlightPython(source) {
    var src = String(source === undefined || source === null ? '' : source);
    var out = '';
    var i = 0;
    var buffer = '';

    var flush = function () {
      if (buffer) {
        out += highlightSegment(buffer);
        buffer = '';
      }
    };

    while (i < src.length) {
      var ch = src[i];
      if (ch === '#') {
        flush();
        out += span('tok-comment', src.slice(i));
        return out;
      }
      if (ch === '"' || ch === "'") {
        flush();
        var j = i + 1;
        while (j < src.length && src[j] !== ch) {
          if (src[j] === '\\') j += 1;
          j += 1;
        }
        out += span('tok-str', src.slice(i, Math.min(j + 1, src.length)));
        i = j + 1;
        continue;
      }
      buffer += ch;
      i += 1;
    }
    flush();
    return out;
  }

  /** 앞쪽 공백을 들여쓰기 가이드선 스팬으로 바꾼 HTML 을 만든다. */
  function indentHtml(spaces) {
    if (spaces <= 0) return '';
    var html = '';
    var left = spaces;
    var first = true;
    while (left > 0) {
      var width = Math.min(4, left);
      html +=
        '<span class="indent' +
        (first ? ' indent--first' : '') +
        '"' +
        (width === 4 ? '' : ' style="width:' + width + 'ch"') +
        '></span>';
      left -= width;
      first = false;
    }
    return html;
  }

  function splitIndent(code) {
    var normalized = String(code === undefined || code === null ? '' : code).replace(/\t/g, '    ');
    var match = normalized.match(/^ */);
    var spaces = match ? match[0].length : 0;
    return { spaces: spaces, rest: normalized.slice(spaces) };
  }

  /**
   * 코드 뷰를 만든다.
   *
   * lines: Array<{
   *   code?: string,                 // 원본 코드 한 줄(앞 공백 = 들여쓰기)
   *   parts?: Array<string|Node>,    // code 대신 사용. 문자열은 하이라이팅, Node 는 그대로 삽입(빈칸 채우기)
   *   indent?: number,               // parts 사용 시 들여쓰기 칸 수
   *   block?: 'true'|'false'|null,   // 블록 배경 박스 종류
   *   note?: string,                 // 줄 오른쪽 라벨
   *   indentNote?: string,           // 들여쓰기 옆 작은 라벨 (예: '들여쓰기 4칸')
   *   tip?: string,                  // 줄에 붙는 title 툴팁
   * }>
   */
  function createCodeView(opts) {
    var o = opts || {};
    var showLineNumbers = o.showLineNumbers !== false;
    var linesWrap = el('div', { 'class': 'codeview__lines' });
    var scroll = el('div', { 'class': 'codeview__scroll' }, [linesWrap]);
    var head =
      o.title || o.headExtra
        ? el('div', { 'class': 'codeview__head' }, [
            o.title ? el('span', { 'class': 'codeview__title', html: o.title }) : el('span'),
            o.headExtra || null
          ])
        : null;
    var children = [];
    if (head) children.push(head);
    children.push(scroll);
    var root = el(
      'div',
      { 'class': 'codeview', attrs: { role: 'group', 'aria-label': o.ariaLabel || '파이썬 코드' } },
      children
    );

    var current = [];
    var lineEls = [];

    function build(nextLines) {
      current = nextLines || [];
      lineEls = [];
      clear(linesWrap);

      var group = null;
      var groupKind = null;

      current.forEach(function (line, index) {
        var kind = line.block || null;

        if (kind !== groupKind) {
          group = null;
          groupKind = kind;
        }
        if (kind && !group) {
          group = el('div', { 'class': 'code-group code-group--' + kind });
          linesWrap.appendChild(group);
        }

        var row = el('div', {
          'class': 'code-line',
          dataset: { index: String(index) },
          attrs: { title: line.tip || undefined }
        });

        if (showLineNumbers) {
          row.appendChild(el('span', { 'class': 'code-line__num', text: String(index + 1) }));
        }
        row.appendChild(el('span', { 'class': 'code-line__marker', text: '·' }));

        var codeSpan = el('span', { 'class': 'code-line__code' });

        // 들여쓰기 가이드선을 먼저 그리고, 라벨(예: '들여쓰기 4칸')을 가이드선 바로 옆에 붙인다.
        var usesParts = Array.isArray(line.parts);
        var sp = usesParts ? null : splitIndent(line.code || '');
        var indentSpaces = usesParts ? line.indent || 0 : sp.spaces;

        if (indentSpaces) codeSpan.insertAdjacentHTML('beforeend', indentHtml(indentSpaces));
        if (line.indentNote) {
          codeSpan.appendChild(el('span', { 'class': 'indent-note', text: line.indentNote }));
        }

        if (usesParts) {
          line.parts.forEach(function (part) {
            if (part instanceof Node) codeSpan.appendChild(part);
            else codeSpan.insertAdjacentHTML('beforeend', highlightPython(String(part)));
          });
        } else {
          codeSpan.insertAdjacentHTML('beforeend', highlightPython(sp.rest));
        }
        row.appendChild(codeSpan);

        if (line.note) {
          row.appendChild(el('span', { 'class': 'code-group__note', text: line.note }));
        }

        (group || linesWrap).appendChild(row);
        lineEls.push(row);
      });
    }

    build(o.lines || []);

    var STATE_CLASSES = ['is-running', 'is-done', 'is-skipped', 'is-error', 'is-unchecked'];

    var api = {
      root: root,
      linesWrap: linesWrap,
      get lines() {
        return current;
      },
      setLines: function (next) {
        build(next);
      },
      lineEl: function (index) {
        return lineEls[index] || null;
      },
      count: function () {
        return lineEls.length;
      },
      /**
       * 줄 상태 표시.
       * state: 'idle' | 'running' | 'done' | 'skipped' | 'unchecked' | 'error'
       *   - 'unchecked' : 명세 11.3 '검사하지 않음'. 마커를 '—' 로 바꾸고 줄을 흐리게 표시한다.
       */
      setState: function (index, state) {
        var row = lineEls[index];
        if (!row) return;
        STATE_CLASSES.forEach(function (cls) {
          row.classList.remove(cls);
        });
        var marker = row.querySelector('.code-line__marker');
        if (state === 'running') {
          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {
          // is-skipped 를 함께 붙여 lesson.css 가 없어도 흐리게 보이도록 한다.
          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }
      },
      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);
        });
      },
      clearStates: function () {
        lineEls.forEach(function (_, i) {
          api.setState(i, 'idle');
        });
        api.clearBadges();
      },
      /** 조건식 평가 결과 배지 */
      showBadge: function (index, text, kind) {
        var row = lineEls[index];
        if (!row) return;
        var existing = row.querySelector('.code-line__badge');
        if (existing) existing.remove();
        var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };
        row.appendChild(
          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text
          })
        );
      },
      clearBadges: function () {
        lineEls.forEach(function (row) {
          var b = row.querySelector('.code-line__badge');
          if (b) b.remove();
        });
      },
      /** 특정 줄을 화면 안으로 스크롤한다(코드가 길 때). */
      scrollToLine: function (index) {
        var row = lineEls[index];
        if (!row || typeof row.scrollIntoView !== 'function') return;
        row.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    };

    return api;
  }

  L.codeview = {
    createCodeView: createCodeView,
    highlightPython: highlightPython
  };
})();
    </script>
    <script data-from="js/30-state.js">
/**
 * 전역 상태 관리 (명세 11.8 학습 상태 저장 / 4장 단계 이동 규칙)
 *  - localStorage 저장 · 복원 · 초기화 (서버로 아무것도 보내지 않는다)
 *  - 단계 완료 판정 canProceed() 와 미충족 안내 문구
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var STORAGE_KEY = L.CONST.STORAGE_KEY; // 'lesson3_7_3_state'
  var TOTAL_STEPS = L.CONST.TOTAL_STEPS; // 6

  /** 명세 9.2 상황 카드 정답 (1·3 = for문, 2·4 = while문) */
  var CARD_ANSWER = { c1: 'for', c2: 'while', c3: 'for', c4: 'while' };

  /** 저장 항목(명세 11.8)을 모두 담은 초기 상태를 만든다. */
  function createInitialState() {
    return {
      currentStep: 1,
      visitedSteps: [1],

      // 화면 1 : 선수 학습 확인 + 생각 열기
      step1: {
        q1: null, // 미니 문항 1 (다중 조건문의 실행 결과) — 맞히면 true
        q1pick: null, // 미니 문항 1 에서 고른 보기 (되돌아왔을 때 복원용)
        q2: null, // 미니 문항 2 (중첩 조건문 구조) — 맞히면 true
        choice: null, // 생각 열기에서 고른 방법 : 'manual' | 'loop'
        thinkText: ''
      },

      // 화면 2 : 순차 코드와 반복 코드 비교
      step2: {
        ranSeq: false,
        ranLoop: false,
        count: 5, // 3 · 5 · 10
        countChanged: false,
        quizPicked: [], // 고른 보기 번호 배열
        quizDone: false
      },

      // 화면 3 : for문과 range
      step3: {
        ranList: false, // 리스트 for문 전체 실행
        sameAnswer: null, // 두 프로그램 결과가 같은가 : true / false
        rangeStart: 1,
        rangeEnd: 6,
        rangeStep: 1,
        rangeTried: false,
        ranFor: false, // range(1,6) 시뮬레이션 전체 실행
        predict: [], // 예측 활동에서 배치한 숫자 카드
        predictDone: false
      },

      // 화면 4 : while문과 무한 반복
      step4: {
        ranCompare: { list: false, range: false, loop: false },
        ranWhile: false, // 정상 while 시뮬레이션 끝까지
        ranInfinite: false, // 무한 반복 예제 실행(안전 장치 작동)
        infQuiz: null, // 무한 반복 원인 3지선다 : 1 · 2 · 3
        fixed: false, // i += 1 활성화 토글
        ranFixed: false // 수정 후 정상 종료 확인
      },

      // 화면 5 : for문과 while문 활용
      step5: {
        robotFor: false,
        robotWhile: false,
        cards: { c1: null, c2: null, c3: null, c4: null },
        cardsDone: false,
        accumRan: false, // 1~5 누적값 시각화 실행
        blanks: { b1: '', b2: '', b3: '', b4: '' },
        blanksDone: false,
        ranRandom: false
      },

      // 화면 6 : 형성평가 및 학습 정리
      step6: {
        // 1~4 번은 고른 보기 번호(1~5), 5 번은 { l1, l2, l3 } 세 줄
        answers: [null, null, null, null, null],
        // 한 문항씩 푸는 화면. queue 는 지금 풀고 있는 문항 번호(0부터) 목록
        queue: [0, 1, 2, 3, 4],
        index: 0,
        // 답안 제출은 한 번만 가능하다(명세 10.7).
        submitted: false,
        // 제출을 마친 뒤 「다시 풀기」로 돌아온 상태(점수 확인용 · 다시 제출은 못 한다)
        retrying: false,
        student: { id: '', name: '' },
        submitInfo: { at: '', fileName: '', mode: '' },
        graded: false,
        score: null,
        passed: null,
        attempts: 0,
        bestScore: null,
        retryOnly: false, // 오답 문항만 다시 풀기 모드
        summary: { s1: '', s2: '' },
        selfCheck: { a: null, b: null, c: null }
      }
    };
  }

  /** 살아있는 전역 상태 객체(참조 유지). 직접 수정한 뒤 markChanged() 를 호출한다. */
  var appState = createInitialState();

  /* ------------------------------------------------------------------ */
  /* 구독                                                                */
  /* ------------------------------------------------------------------ */
  var listeners = [];

  /** 상태 변경 구독. 해제 함수를 돌려준다. */
  function onChange(fn) {
    if (typeof fn !== 'function') return function () {};
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function emit() {
    listeners.slice().forEach(function (fn) {
      try {
        fn(appState);
      } catch (err) {
        if (window.console) console.error('[state] listener error', err);
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* 저장 · 복원                                                          */
  /* ------------------------------------------------------------------ */
  var saveTimer = null;

  function hasStorage() {
    try {
      return typeof window.localStorage !== 'undefined' && window.localStorage !== null;
    } catch (err) {
      return false;
    }
  }

  /** 디바운스 500ms 저장. */
  function saveState() {
    if (!hasStorage()) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        // 저장 실패(용량 초과 · 프라이빗 모드)해도 학습은 계속 가능해야 한다.
        if (window.console) console.warn('[state] 저장에 실패했습니다.', err);
      }
    }, 500);
  }

  /** 상태를 바꾼 뒤 호출: 저장 예약 + 구독자 알림. */
  function markChanged() {
    saveState();
    emit();
  }

  /** 저장된 상태를 읽어온다. 없거나 손상되었으면 null. */
  function readSavedState() {
    if (!hasStorage()) return null;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (err) {
      return null;
    }
  }

  function deepCopy(value) {
    return JSON.parse(JSON.stringify(value));
  }

  /** 얕은 병합이 아닌 "키 단위 깊은 병합"으로 저장본을 현재 상태에 적용한다. */
  function mergeInto(target, source) {
    Object.keys(source).forEach(function (key) {
      var value = source[key];
      if (!(key in target)) return; // 모르는 키는 무시한다(저장본 손상 대비)
      var cur = target[key];
      if (Array.isArray(value)) {
        target[key] = deepCopy(value);
        return;
      }
      if (value && typeof value === 'object') {
        if (cur && typeof cur === 'object' && !Array.isArray(cur)) {
          if (Object.keys(cur).length === 0) target[key] = deepCopy(value);
          else mergeInto(cur, value);
        }
        return;
      }
      if (value !== undefined) target[key] = value;
    });
  }

  /** 저장본을 현재 상태에 반영한다. */
  function applySavedState(saved) {
    if (!saved) return;
    mergeInto(appState, saved);
    if (!Array.isArray(appState.visitedSteps) || appState.visitedSteps.length === 0) {
      appState.visitedSteps = [1];
    }
    appState.currentStep = clampStep(appState.currentStep);
    emit();
  }

  /** 저장된 학습 기록을 지우고 초기 상태로 되돌린다. */
  function resetState() {
    if (hasStorage()) {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        /* 무시 */
      }
    }
    mergeInto(appState, createInitialState());
    appState.step2.quizPicked = [];
    appState.step3.predict = [];
    appState.step6.answers = [null, null, null, null, null];
    appState.step6.queue = [0, 1, 2, 3, 4];
    appState.step6.index = 0;
    appState.visitedSteps = [1];
    appState.currentStep = 1;
    emit();
  }

  /** 저장된 진행 기록이 "이어서 학습할 만한 상태"인지 판단한다. */
  function hasMeaningfulProgress(saved) {
    if (!saved) return false;
    if (typeof saved.currentStep === 'number' && saved.currentStep > 1) return true;
    if (Array.isArray(saved.visitedSteps) && saved.visitedSteps.length > 1) return true;

    var filled = function (value) {
      return value !== null && value !== undefined && value !== '';
    };
    var s1 = saved.step1 || {};
    var s2 = saved.step2 || {};
    var s3 = saved.step3 || {};
    var s4 = saved.step4 || {};
    var s5 = saved.step5 || {};
    var s6 = saved.step6 || {};

    if (filled(s1.q1) || filled(s1.q2) || filled(s1.choice) || filled(s1.thinkText)) return true;
    if (s2.ranSeq || s2.ranLoop || s2.quizDone) return true;
    if (s3.ranList || filled(s3.sameAnswer) || s3.ranFor || s3.predictDone) return true;
    if (s4.ranWhile || s4.ranInfinite || filled(s4.infQuiz)) return true;
    if (s5.robotFor || s5.robotWhile || s5.cardsDone || s5.blanksDone) return true;
    if (filled(s6.score) || filled(s6.bestScore)) return true;
    if (Array.isArray(s6.answers) && s6.answers.some(filled)) return true;
    return false;
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function clampStep(step) {
    var n = Number(step) || 1;
    return Math.min(TOTAL_STEPS, Math.max(1, Math.round(n)));
  }

  function visitStep(step) {
    var n = clampStep(step);
    if (appState.visitedSteps.indexOf(n) === -1) {
      appState.visitedSteps.push(n);
      appState.visitedSteps.sort(function (a, b) {
        return a - b;
      });
    }
    appState.currentStep = n;
    markChanged();
  }

  function isVisited(step) {
    return appState.visitedSteps.indexOf(clampStep(step)) !== -1;
  }

  /* ------------------------------------------------------------------ */
  /* 단계 완료 판정 (명세 4장)                                             */
  /* ------------------------------------------------------------------ */

  /** 명세 9.2 상황 카드 4장이 모두 올바르게 분류되었는지 */
  function cardsAllCorrect() {
    var cards = appState.step5.cards || {};
    return ['c1', 'c2', 'c3', 'c4'].every(function (key) {
      return cards[key] === CARD_ANSWER[key];
    });
  }

  /** 형성평가 5번(세 줄 작성)이 모두 채워졌는지 */
  function q5Filled(answer) {
    if (!answer || typeof answer !== 'object') return false;
    return ['l1', 'l2', 'l3'].every(function (key) {
      return String(answer[key] || '').trim().length > 0;
    });
  }

  function answeredCount() {
    var answers = appState.step6.answers || [];
    var n = 0;
    for (var i = 0; i < 4; i += 1) {

      if (!playing) return;
      if (!stepOnce()) return;
      if (index >= frames.length - 1) {
        playing = false;
        notify();
        return;
      }
      timer = setTimeout(tick, delay());
    }

    function play() {
      if (playing || index >= frames.length - 1) return;
      playing = true;
      notify();
      tick();
    }

    function pause() {
      playing = false;
      clearTimeout(timer);
      timer = null;
      notify();
    }

    function reset() {
      pause();
      index = -1;
      ended = false;
      if (o.onReset) o.onReset();
      notify();
    }

    return {
      stepOnce: stepOnce,
      stepRound: stepRound,
      play: play,
      pause: pause,
      reset: reset,
      /** 끝까지 즉시 이동(애니메이션 없이) */
      jumpToEnd: function () {
        pause();
        if (frames.length === 0) return;
        show(frames.length - 1);
        finish();
      },
      setFrames: function (next) {
        pause();
        frames = next || [];
        index = -1;
        ended = false;
        if (o.onReset) o.onReset();
        notify();
      },
      setSpeed: function (key) {
        if (SPEED[key]) speedKey = key;
      },
      getSpeed: function () {
        return speedKey;
      },
      isPlaying: function () {
        return playing;
      },
      isEnded: function () {
        return ended;
      },
      isStarted: function () {
        return index >= 0;
      },
      currentIndex: function () {
        return index;
      },
      frameCount: function () {
        return frames.length;
      }
    };
  }

  engine.SPEED = SPEED;
  engine.rangeValues = rangeValues;
  engine.validateRange = validateRange;
  engine.buildForFrames = buildForFrames;
  engine.buildWhileFrames = buildWhileFrames;
  engine.createPlayer = createPlayer;
})();

    <script data-from="js/50-widgets.js">
/**
 * 반복 학습 전용 화면 조각 (명세 11.2 ~ 11.6)
 *  - 변수 상태 상자 · 반복 회차 표시 · 값 카드 · 실행 추적표
 *  - 재생 컨트롤(한 회차 / 전체 / 일시 정지 / 다시 시작 · 속도)
 *  - 누적 출력 창 · 로봇 이동 트랙
 *
 * 공용 컴포넌트(버튼·패널·표)는 10-ui.js 에 있고, 이 파일은 그 위에 얹는다.
 */
(function () {
  "use strict";

  var L = window.L || (window.L = {});
  var ui = L.ui;
  var el = ui.el;
  var W = (L.widgets = {});

  /* ------------------------------------------------------------------ */
  /* 변수 상태 상자 (명세 11.4)                                           */
  /* ------------------------------------------------------------------ */
  /**
   * 값이 바뀌면 짧은 강조 애니메이션이 붙는다.
   * varBox({ label: '현재 i', value: 1 })
   */
  function varBox(opts) {
    var o = opts || {};
    var valueNode = el('span', {
      'class': 'varbox__value',
      text: o.value === undefined || o.value === null ? '–' : String(o.value)
    });
    var root = el('div', { 'class': 'varbox ' + (o.className || '') }, [
      el('span', { 'class': 'varbox__label', text: o.label || '' }),
      valueNode
    ]);
    var last = o.value;

    return {
      root: root,
      /** @param {*} value 표시할 값. null/undefined 면 '–' */
      set: function (value) {
        var text = value === undefined || value === null ? '–' : String(value);
        var changed = String(last) !== text;
        valueNode.textContent = text;
        last = text;
        if (!changed) return;
        root.classList.remove('is-changed');
        // 클래스를 다시 붙이려면 브라우저가 한 번 그리도록 강제해야 한다.
        void root.offsetWidth;
        root.classList.add('is-changed');
      },
      setLabel: function (text) {
        root.firstChild.textContent = text;
      }
    };
  }

  /** 변수 상자를 가로로 늘어놓는다. */
  function varBoxRow(boxes) {
    return el(
      'div',
      { 'class': 'varbox-row' },
      (boxes || []).map(function (b) {
        return b.root;
      })
    );
  }

  /* ------------------------------------------------------------------ */
  /* 반복 회차 표시 (명세 11.3)                                            */
  /* ------------------------------------------------------------------ */
  function roundMeter(opts) {
    var o = opts || {};
    var total = o.total || 0;
    var text = el('span', { 'class': 'round-meter__text', text: '현재 반복: –' });
    var fill = el('span', { 'class': 'round-meter__fill' });
    var root = el('div', {
      'class': 'round-meter',
      attrs: { role: 'status', 'aria-live': 'polite', 'aria-label': '반복 회차' }
    }, [
      text,
      el('span', { 'class': 'round-meter__bar' }, [fill])
    ]);

    return {
      root: root,
      set: function (round) {
        if (!round) {
          text.textContent = '현재 반복: 시작 전';
          fill.style.width = '0%';
          return;
        }
        text.textContent = total
          ? '현재 반복: ' + round + '회차 (' + round + ' / ' + total + ')'
          : '현재 반복: ' + round + '회차';
        fill.style.width = total ? Math.min(100, (round / total) * 100) + '%' : '0%';
      },
      setTotal: function (n) {
        total = n;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 값 카드 (명세 7.1 리스트 요소 / 7.3 range 결과)                        */
  /* ------------------------------------------------------------------ */
  /**
   * valueCards({ values: [1,2,3], excluded: 6, excludedNote: '포함되지 않음' })
   *  - setCurrent(i) : i 번째 카드에 ↑ 표시
   *  - markUsed(i)   : 이미 사용한 카드로 흐리게
   */
  function valueCards(opts) {
    var o = opts || {};
    var track = el('div', { 'class': 'valuecards' });
    var cards = [];
    var pointer = el('div', { 'class': 'valuecards__pointer is-hidden' }, [
      el('span', { 'class': 'valuecards__arrow', text: '↑', attrs: { 'aria-hidden': 'true' } }),
      el('span', { 'class': 'valuecards__pointer-label', text: o.pointerLabel || '현재 i' })
    ]);
    var root = el('div', { 'class': 'valuecards-wrap' }, [track, pointer]);

    function build(values, excluded, note) {
      ui.clear(track);
      cards = [];
      (values || []).forEach(function (v) {
        var card = el('span', { 'class': 'valuecard', text: String(v) });
        track.appendChild(card);
        cards.push(card);
      });
      if (excluded !== undefined && excluded !== null) {
        track.appendChild(
          el('span', { 'class': 'valuecard valuecard--excluded' }, [
            el('span', { text: String(excluded) }),
            el('span', { 'class': 'valuecard__note', text: note || '포함되지 않음' })
          ])
        );
      }
      if ((values || []).length === 0 && (excluded === undefined || excluded === null)) {
        track.appendChild(el('span', { 'class': 'valuecards__empty', text: '값이 없습니다' }));
      }
      pointer.classList.add('is-hidden');
    }

    build(o.values, o.excluded, o.excludedNote);

    return {
      root: root,
      setValues: build,
      setCurrent: function (index) {
        cards.forEach(function (card, i) {
          card.classList.toggle('is-current', i === index);
        });
        if (index === null || index === undefined || !cards[index]) {
          pointer.classList.add('is-hidden');
          return;
        }
        pointer.classList.remove('is-hidden');
        pointer.style.transform = 'translateX(' + cards[index].offsetLeft + 'px)';
      },
      markUsed: function (index) {
        if (cards[index]) cards[index].classList.add('is-used');
      },
      clearMarks: function () {
        cards.forEach(function (card) {
          card.classList.remove('is-used', 'is-current');
        });
        pointer.classList.add('is-hidden');
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실행 추적표 (명세 7.4 / 8.2)                                          */
  /* ------------------------------------------------------------------ */
  function traceTable(opts) {
    var o = opts || {};
    var head = o.head || [];
    var tbody = el('tbody');
    var table = el('table', { 'class': 'data-table trace-table' }, [
      o.caption ? el('caption', { 'class': 'sr-only', text: o.caption }) : null,
      el('thead', {}, [
        el(
          'tr',
          {},
          head.map(function (h) {
            return el('th', { scope: 'col', text: h });
          })
        )
      ]),
      tbody
    ]);
    var empty = el('p', { 'class': 'trace-table__empty', text: o.emptyText || '실행하면 한 줄씩 채워집니다.' });
    var root = el('div', { 'class': 'table-scroll' }, [table, empty]);

    return {
      root: root,
      addRow: function (cells) {
        if (!cells) return;
        empty.style.display = 'none';
        tbody.appendChild(
          el(
            'tr',
            { 'class': 'trace-row' },
            cells.map(function (cell, i) {
              return el(i === 0 ? 'th' : 'td', {
                scope: i === 0 ? 'row' : undefined,
                text: String(cell)
              });
            })
          )
        );
      },
      rowCount: function () {
        return tbody.children.length;
      },
      clear: function () {
        ui.clear(tbody);
        empty.style.display = '';
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 누적 출력 창 (명세 11.5)                                              */
  /* ------------------------------------------------------------------ */
  /**
   * print(i, end=" ") 처럼 한 줄에 이어 붙는 출력을 그대로 보여 준다.
   * ui.createConsole() 은 줄 단위라서, 이어 붙는 출력에는 이쪽을 쓴다.
   */
  function outputPane(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '실행 버튼을 누르면 결과가 여기에 표시돼요.';
    var body = el('pre', {
      'class': 'outpane__body is-empty',
      text: emptyText,
      attrs: {
        role: 'log',
        'aria-live': 'polite',
        'aria-label': o.ariaLabel || '프로그램 실행 결과',
        tabindex: '0'
      }
    });
    var root = el('div', { 'class': 'outpane' }, [
      el('div', { 'class': 'outpane__head' }, [
        el('span', { 'class': 'outpane__dot' }),
        el('span', { text: o.title || '실행 결과' })
      ]),
      body
    ]);

    return {
      root: root,
      set: function (text) {
        if (text === '' || text === null || text === undefined) {
          body.classList.add('is-empty');
          body.textContent = emptyText;
          return;
        }
        body.classList.remove('is-empty');
        body.textContent = String(text);
      },
      append: function (text) {
        if (body.classList.contains('is-empty')) {
          body.classList.remove('is-empty');
          body.textContent = '';
        }
        body.textContent += String(text);
      },
      get: function () {
        return body.classList.contains('is-empty') ? '' : body.textContent;
      },
      clear: function () {
        body.classList.add('is-empty');
        body.textContent = emptyText;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 재생 컨트롤 (명세 7.4)                                                */
  /* ------------------------------------------------------------------ */
  /**
   * loopControls({ player, onAny })
   * 한 회차 실행 · 전체 실행 · 일시 정지 · 다시 시작 + 속도 선택
   * 명세 11.6 : 중지 버튼은 항상 제공한다.
   */
  function loopControls(opts) {
    var o = opts || {};
    var player = o.player;

    var btnStep = ui.button({
      label: '▶ 한 회차 실행',
      variant: 'secondary',
      onClick: function () {
        player.stepRound();
        if (o.onAny) o.onAny('step');
      }
    });
    var btnPlay = ui.button({
      label: '▶▶ 전체 실행',
      variant: 'primary',
      onClick: function () {
        player.play();
        if (o.onAny) o.onAny('play');
      }
    });
    var btnPause = ui.button({
      label: '⏸ 일시 정지',
      variant: 'ghost',
      onClick: function () {
        player.pause();
        if (o.onAny) o.onAny('pause');
      }
    });
    var btnReset = ui.button({
      label: '↻ 다시 시작',
      variant: 'ghost',
      onClick: function () {
        player.reset();
        if (o.onAny) o.onAny('reset');
      }
    });

    var speed = ui.chipRow({
      values: ['slow', 'normal', 'fast'],
      ariaLabel: '실행 속도',
      format: function (v) {
        return v === 'slow' ? '느리게' : v === 'normal' ? '보통' : '빠르게';
      },
      onSelect: function (v) {
        player.setSpeed(v);
        speed.setActive(v);
      }
    });
    speed.setActive(player.getSpeed());

    var root = el('div', { 'class': 'loop-controls' }, [
      ui.buttonRow([btnStep, btnPlay, btnPause, btnReset]),
      el('div', { 'class': 'loop-controls__speed' }, [
        el('span', { 'class': 'loop-controls__speed-label', text: '속도' }),
        speed.root
      ])
    ]);

    return {
      root: root,
      /** 재생 상태에 맞추어 버튼을 켜고 끈다. */
      sync: function () {
        var playing = player.isPlaying();
        var ended = player.isEnded();
        btnStep.disabled = playing || ended;
        btnPlay.disabled = playing || ended;
        btnPause.disabled = !playing;
        btnReset.disabled = !player.isStarted() && !ended;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 로봇 이동 트랙 (명세 9.1)                                             */
  /* ------------------------------------------------------------------ */
  function robotTrack(opts) {
    var o = opts || {};
    var total = o.total || 5;
    var cells = [];
    var track = el('div', { 'class': 'robot-track' });
    var robot = el('span', {
      'class': 'robot',
      text: '🤖',
      attrs: { 'aria-hidden': 'true' }
    });
    track.appendChild(robot);
    for (var i = 0; i < total; i += 1) {
      var cell = el('span', { 'class': 'robot-cell', text: String(i + 1) });
      track.appendChild(cell);
      cells.push(cell);
    }
    var label = el('p', {
      'class': 'robot-track__label',
      text: '출발 위치',
      attrs: { role: 'status', 'aria-live': 'polite' }
    });
    var root = el('div', { 'class': 'robot-wrap' }, [track, label]);

    return {
      root: root,
      /** @param {number} step 0 = 출발, 1~total = 그 칸 */
      moveTo: function (step) {
        cells.forEach(function (cell, i) {
          cell.classList.toggle('is-passed', i < step);
          cell.classList.toggle('is-here', i === step - 1);
        });
        if (!step) {
          robot.style.transform = 'translateX(0)';
          label.textContent = '출발 위치';
          return;
        }
        var cell = cells[step - 1];
        if (cell) robot.style.transform = 'translateX(' + (cell.offsetLeft - robot.offsetLeft) + 'px)';
        label.textContent = step + '칸 이동했습니다.';
      },
      reset: function () {
        cells.forEach(function (cell) {
          cell.classList.remove('is-passed', 'is-here');
        });
        robot.style.transform = 'translateX(0)';
        label.textContent = '출발 위치';
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 코드 + 줄별 설명 (명세 9.6)                                            */
  /* ------------------------------------------------------------------ */
  /**
   * 코드 한 줄과 그 줄의 설명을 «같은 줄에» 나란히 놓는다.
   *
   *   1 | import random              | 무작위 수를 뽑아 주는 …
   *   3 | for i in range(3):         | 3번 반복한다
   *
   * 표(코드 / 하는 일)와 달리 몇 번째 줄 이야기인지 눈으로 바로 이어진다.
   * 가운데 코드 칸의 너비는 «가장 긴 코드 줄» 에 맞춰지고(grid max-content),
   * 남은 자리를 설명이 모두 쓴다.
   *
   * lines: Array<{ code: string, note?: string }>
   */
  function codeWithNotes(opts) {
    var o = opts || {};
    var root = el('div', {
      'class': 'linenotes',
      attrs: { role: 'group', 'aria-label': o.ariaLabel || '코드와 줄별 설명' }
    });

    (o.lines || []).forEach(function (line, i) {
      var code = String(line.code === undefined || line.code === null ? '' : line.code);
      root.appendChild(el('span', { 'class': 'linenotes__num', text: String(i + 1) }));

      var codeCell = el('span', { 'class': 'linenotes__code' });
      // 빈 줄도 높이를 지켜야 설명 줄과 어긋나지 않는다.
      if (code === '') codeCell.innerHTML = '&nbsp;';
      else codeCell.innerHTML = L.codeview.highlightPython(code);
      root.appendChild(codeCell);

      root.appendChild(
        el('span', {
          'class': 'linenotes__desc' + (line.note ? '' : ' is-empty'),
          text: line.note || ''
        })
      );
    });

    return root;
  }

  /* ------------------------------------------------------------------ */
  /* 코드 줄 강조 헬퍼 (명세 11.2)                                          */
  /* ------------------------------------------------------------------ */
  /** 프레임의 line 만 '실행 중'으로, 이미 지나온 줄은 '완료'로 표시한다. */
  function highlightFrame(codeView, frame, doneLines) {
    codeView.clearStates();
    (doneLines || []).forEach(function (n) {
      codeView.setState(n, 'done');
    });
    if (frame && frame.line !== null && frame.line !== undefined) {
      codeView.setState(frame.line, 'running');
      codeView.scrollToLine(frame.line);
    }
  }

  W.varBox = varBox;
  W.varBoxRow = varBoxRow;
  W.roundMeter = roundMeter;
  W.valueCards = valueCards;
  W.traceTable = traceTable;
  W.outputPane = outputPane;
  W.loopControls = loopControls;
  W.robotTrack = robotTrack;
  W.codeWithNotes = codeWithNotes;
  W.highlightFrame = highlightFrame;
})();

    <script data-from="js/60-step1.js">
/**
 * 화면 1 — 시작 및 선수 학습 확인 (명세 5장)
 *
 * 화면 구성은 1·2차시 시작 화면과 같은 형식을 따른다.
 *   제목 / 부제 → 오늘의 학습 목표 → 지난 시간 핵심 내용 → 학습 순서 → 예상 학습 시간
 *   → 선수 학습 미니 문항 1 · 2 → 생각 열기 → [학습 시작]
 *
 * 미니 문항 2개를 모두 맞히고 생각 열기까지 마치면 [학습 시작] 이 열린다.
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;

  /* 명세 2장 학습 목표 — 원문 그대로 표기한다. */
  var GOALS = [
    '반복문의 필요성을 이해하고 <strong>for문과 while문의 실행 원리</strong>를 설명할 수 있다.',
    '반복 횟수 또는 종료 조건에 따라 <strong>적절한 반복문을 선택</strong>하여 간단한 프로그램을 작성할 수 있다.'
  ];

  /* 지난 시간(2차시 — 다중 조건문과 중첩 조건문) 핵심 내용.
     ../lesson3_7_2 의 학습 목표와 원본 프로그램(에코 마일리지 · 상점 추가 지급)에서 뽑았다.
     한눈에 훑고 지나가도록 짧은 낱말로 줄였다. */
  var RECALL = [
    { key: 'if - elif - else', text: '조건을 위에서 아래로 차례대로 검사' },
    { key: 'elif', text: '앞 조건이 거짓일 때만 검사' },
    { key: 'else', text: '위 조건이 모두 거짓일 때 실행' },
    { key: '중첩 조건문', text: '조건 안에 또 조건' },
    { key: '들여쓰기', text: '콜론 다음 줄은 안으로' }
  ];

  /* 오늘 학습 순서 (명세 4장) — 한 줄에 들어오도록 짧게 적는다. */
  var AGENDA = [
    { marker: '①', text: '같은 명령 반복하기 비교' },
    { marker: '②', text: 'for문과 range()' },
    { marker: '③', text: 'while문과 무한 반복' },
    { marker: '④', text: '활용 프로그램 실습' },
    { marker: '⑤', text: '형성평가 및 정리' }
  ];

  var INFO_MESSAGE =
    '각 단계에서 직접 실행해 보며 위 <strong>두 가지 목표</strong>를 하나씩 달성하게 돼요.';

  /* 미니 문항 1 — 지난 시간 「탄소 절감률에 따른 에코 마일리지」 프로그램 그대로 */

    { value: 'c', label: "<code>'마일리지 없음'</code>" }
  ];
