    if (q.type === 'choice') renderChoices(q, answers, locked);
    else if (q.type === 'text') renderTextAnswer(q, answers, locked);
    else if (q.type === 'blanks') renderBlanks(q, answers, locked);

    // 채점을 마친 뒤에만 정답과 해설을 보여 준다(명세 1.2 · 15.1).
    if (st().graded) {
      var given = answers[q.id];
      var state = !QUIZ.isAnswered(q, given)
        ? 'none'
        : QUIZ.gradeAnswer(q, given)
        ? 'correct'
        : 'wrong';
      refs.quizBody.appendChild(reviewBox(q, given, state));
    }

    refs.btnPrevQ.disabled = index === 0;
    refs.btnNextQ.disabled = index === QUIZ.QUESTIONS.length - 1;
    updateQuizNote();
  }

  /** 응답을 저장한 뒤 공통으로 하는 일 */
  function afterAnswer() {
    L.state.markChanged();
    buildDots();
    updateQuizNote();
  }

  function answerFeedback(message) {
    var left = QUIZ.QUESTIONS.length - L.state.answeredCount();
    refs.feedback.show(
      'info',
      message +
        (left === 0
          ? ' 모든 문항에 답했어요. 이제 <strong>채점하기</strong> 를 누를 수 있어요.'
          : ' 남은 문항 ' + left + '개예요.')
    );
  }

  /** ① 오지선다형 */
  function renderChoices(q, answers, locked) {
    var buttons = [];
    refs.quizBody.appendChild(
      el(
        'div',
        { 'class': 'options', attrs: { role: 'group', 'aria-label': q.prompt } },
        q.options.map(function (text, i) {
          var btn = el('button', {
            type: 'button',
            'class': 'option' + (Number(answers[q.id]) === i + 1 ? ' is-selected' : ''),
            disabled: locked,
            on: {
              click: function () {
                st().answers[q.id] = i + 1;
                buttons.forEach(function (b, k) {
                  b.classList.toggle('is-selected', k === i);
                });
                afterAnswer();
                answerFeedback('<strong>' + CIRCLED[i] + '</strong> 를 골랐어요.');
              }
            }
          }, [
            el('span', { 'class': 'option__num', text: CIRCLED[i] }),
            el('span', { 'class': 'option__text', text: text })
          ]);
          buttons.push(btn);
          return btn;
        })
      )
    );
  }

  /** ② 실행 결과 쓰기 — 고정폭 여러 줄 입력 */
  function renderTextAnswer(q, answers, locked) {
    var area = el('textarea', {
      'class': 'textarea textarea--code',
      rows: q.rows || 4,
      placeholder: q.placeholder || '',
      disabled: locked,
      attrs: { 'aria-label': q.prompt, spellcheck: 'false' }
    });
    area.value = String(answers[q.id] || '');
    area.addEventListener(
      'input',
      ui.debounce(function () {
        st().answers[q.id] = area.value;
        afterAnswer();
      }, 300)
    );
    refs.quizBody.appendChild(area);
    refs.quizBody.appendChild(
      el('p', {
        'class': 'quiz__essay-hint',
        text: '줄 수와 각 줄의 문자가 모두 같아야 정답이에요. 줄 끝의 공백은 무시합니다.'
      })
    );
    refs.quizBody.appendChild(
      ui.buttonRow([
        ui.button({
          label: '입력 확인',
          variant: 'secondary',
          disabled: locked,
          onClick: function () {
            st().answers[q.id] = area.value;
            afterAnswer();
            var lines = QUIZ.outputLines(area.value);
            answerFeedback('<strong>' + lines.length + '줄</strong>을 입력했어요.');
          }
        })
      ])
    );
  }

  /** ③ 프로그램 완성하기 — 빈칸 ① ② ③ */
  function renderBlanks(q, answers, locked) {
    var stored = answers[q.id] || {};
    var inputs = {};

    function makeInput(blank, width) {
      var input = el('input', {
        type: 'text',
        'class': 'blank-input',
        value: String(stored[blank.key] || ''),
        disabled: locked,
        style: { width: width },
        attrs: { 'aria-label': blank.mark + ' ' + blank.label, spellcheck: 'false' }
      });
      input.addEventListener(
        'input',
        ui.debounce(function () {
          var cur = st().answers[q.id];
          if (!cur || typeof cur !== 'object') cur = st().answers[q.id] = {};
          cur[blank.key] = input.value;
          afterAnswer();
        }, 300)
      );
      inputs[blank.key] = input;
      return input;
    }

    var b = q.blanks;
    refs.quizBody.appendChild(
      L.codeview.createCodeView({
        showLineNumbers: false,
        ariaLabel: '완성할 프로그램',
        lines: [
          { parts: ['for d in ', makeInput(b[0], '150px'), ':'], indent: 0 },
          { parts: ['for s in ', makeInput(b[1], '150px'), ':'], indent: 4 },
          { parts: [makeInput(b[2], '190px')], indent: 8 }
        ]
      }).root
    );
    refs.quizBody.appendChild(
      el(
        'ul',
        { 'class': 'hint-list' },
        b.map(function (blank) {
          return el('li', { text: blank.mark + ' ' + blank.label });
        })
      )
    );
    refs.quizBody.appendChild(
      ui.buttonRow([
        ui.button({
          label: '입력 확인',
          variant: 'secondary',
          disabled: locked,
          onClick: function () {
            var cur = st().answers[q.id] || {};
            b.forEach(function (blank) {
              cur[blank.key] = inputs[blank.key].value;
            });
            st().answers[q.id] = cur;
            afterAnswer();
            var filled = b.filter(function (blank) {
              return String(cur[blank.key] || '').trim();
            }).length;
            answerFeedback('빈칸 <strong>' + filled + ' / ' + b.length + '곳</strong>을 채웠어요.');
          }
        })
      ])
    );
  }

  /**
   * 명세 23.1 : 진행 순서는 «모두 응답 → 답안 제출 → 답안 잠금 → 채점 → 결과·해설» 이다.
   *   · 제출 기능을 쓰는 수업에서는 **제출을 마쳐야 [채점하기]가 열린다.**
   *   · 답안은 한 번만 제출할 수 있고, 제출 뒤에는 답을 고칠 수 없다.
   *   · 제출이 «실패» 하면 학습이 막히지 않도록 [채점 계속하기] 로 채점을 열어 준다(명세 23.3).
   */
  function updateQuizNote() {
    var total = QUIZ.QUESTIONS.length;
    var answered = L.state.answeredCount();
    var all = answered === total;
    var submitted = Boolean(st().submitted);
    var needSubmit = C.SUBMIT_ENABLED && !submitted && !gradeUnlocked;

    if (C.SUBMIT_ENABLED && refs.btnSubmit) {
      refs.btnSubmit.disabled = !all || submitted;
      refs.btnSubmit.textContent = submitted ? '제출 완료 ✓ (1회)' : '답안 제출하기';
      refs.btnSubmit.classList.toggle('btn--submitted', submitted);
      refs.btnSubmit.title = submitted
        ? '답안은 한 번만 제출할 수 있어요. 이미 제출을 마쳤습니다.'
        : all
        ? '답안을 선생님께 보냅니다. 한 번만 제출할 수 있어요.'
        : '모든 문항에 답하면 제출할 수 있어요.';
    }
    refs.btnGrade.disabled = !all || needSubmit;
    refs.btnGrade.title = !all
      ? '모든 문항에 답해 주세요.'
      : needSubmit
      ? '먼저 [답안 제출하기] 로 답안을 제출해 주세요.'
      : '';

    refs.quizNote.textContent = !all
      ? '응답한 문항 ' + answered + ' / ' + total + '개 · ' + total +
        '문항에 모두 답하면 답안을 제출할 수 있어요.'
      : needSubmit
      ? total + '문항에 모두 답했어요. 먼저 [답안 제출하기] 로 답안을 보낸 뒤 [채점하기] 를 누를 수 있어요.'
      : submitted
      ? '제출을 마쳤어요(제출은 1회). 이제 [채점하기] 로 총점과 해설을 볼 수 있어요.'
      : '제출을 건너뛰고 채점합니다. [채점하기] 를 누르면 총점과 해설을 볼 수 있어요.';

    paintSubmitNotice(all, submitted);
  }

  /** 버튼 바로 아래에 「한 번만 제출」 안내를 눈에 보이게 남긴다. */
  function paintSubmitNotice(all, submitted) {
    if (!refs.submitNotice) return;
    var box = refs.submitNotice;
    ui.clear(box);
    if (!C.SUBMIT_ENABLED) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    if (submitted) {
      box.className = 'submit-notice is-done';
      box.appendChild(
        el('p', {
          html:
            '✓ <strong>제출 완료</strong>' +
            (st().submitInfo.at ? ' — ' + ui.escapeHtml(st().submitInfo.at) : '') +
            '<br />답안은 한 번만 제출할 수 있어요. 이제 <strong>[채점하기]</strong> 로 결과를 확인하세요.'
        })
      );
      return;
    }
    box.className = 'submit-notice';
    box.appendChild(
      el('p', {
        html:
          '⚠ <strong>답안은 한 번만 제출할 수 있어요.</strong> 제출한 뒤에는 답을 고칠 수 없습니다.<br />' +
          (all
            ? '제출하려면 위쪽 <strong>응시자 정보</strong>(학번 · 이름)를 채운 뒤 <strong>[답안 제출하기]</strong> 를 누르세요. ' +
              '<strong>채점은 제출한 뒤에 열립니다.</strong>'
            : '모든 문항에 답하면 <strong>[답안 제출하기]</strong> 가 열립니다.')
      })
    );
  }

  /** 명세 24장 : 오답 문항에는 내 답 · 정답 · 해설 · 오답 유형 · 관련 차시 · 보충 화면 이동을 준다. */
  function reviewBox(q, given, state) {
    var mark = state === 'correct' ? '○ 정답' : state === 'wrong' ? '✕ 오답' : '− 미응답';
    var myText = QUIZ.answerToText(q, given);
    var rows = [
      el('dt', { text: '내 답' }),
      el('dd', { 'class': q.type === 'text' ? 'pre-line' : '', text: myText || '응답하지 않음' }),
      el('dt', { text: '정답' }),
      el('dd', { 'class': q.type === 'text' ? 'pre-line' : '', text: QUIZ.correctToText(q) })
    ];
    // 빈칸형은 어느 칸이 틀렸는지 함께 보여 준다.
    if (q.type === 'blanks' && state !== 'none') {
      var marks = QUIZ.blankMarks(q, given);
      rows.push(el('dt', { text: '빈칸별 결과' }));
      rows.push(
        el('dd', {
          html: q.blanks
            .map(function (b) {
              return b.mark + ' ' + (marks[b.key] ? '정답 ○' : '다시 확인 ✕');
            })
            .join(' · ')
        })
      );
    }
    rows.push(el('dt', { text: '해설' }));
    rows.push(el('dd', { html: q.explain }));
    rows.push(el('dt', { text: '오답 유형' }));
    rows.push(el('dd', { text: q.category + ' · 관련 차시 ' + q.lessonRef }));

    var box = el('div', {
      'class':
        'quiz-review ' + (state === 'correct' ? 'is-correct' : state === 'wrong' ? 'is-wrong' : '')
    }, [
      el('p', { 'class': 'quiz-review__head', text: mark + ' · 배점 ' + q.points + '점' }),
      el('dl', { 'class': 'quiz-review__rows' }, rows)
    ]);
    if (q.type === 'blanks' && state !== 'correct') {
      box.appendChild(
        L.codeview.createCodeView({
          title: '완성된 프로그램',
          showLineNumbers: false,
          ariaLabel: '완성된 프로그램',
          lines: q.modelCode.split('\n').map(function (line) {
            return { code: line };
          })
        }).root
      );
    }
    if (state !== 'correct') {
      box.appendChild(
        ui.linkLine({
          text: '이 문항은 <strong>화면 ' + q.reviewStep + '</strong> 에서 다시 확인할 수 있어요.',
          label: '보충 화면으로 돌아가기',
          step: q.reviewStep
        })
      );
    }
    return box;
  }

  /* ------------------------------------------------------------------ */
  /* 채점 (명세 24장)                                                       */
  /* ------------------------------------------------------------------ */
  function grade() {
    var result = QUIZ.grade(st().answers);
    st().graded = true;
    st().score = result.score;
    st().passed = result.passed;
    st().lastScore = result.score;
    st().attempts = (st().attempts || 0) + 1;
    if (st().bestScore === null || result.score > st().bestScore) st().bestScore = result.score;
    L.state.markChanged();

    // 오른쪽 출력 창에 채점 과정을 남긴다(1차시와 같은 형식).
    refs.console.clear();
    refs.console.write(QUIZ.QUESTIONS.length + '문항 채점을 시작합니다.');
    result.details.forEach(function (d, i) {
      var q = QUIZ.byId(d.id);
      refs.console.write(
        (i + 1) + '번 [' + q.category + '] ' +
          (d.state === 'correct' ? '정답 ○ +' + q.points + '점' : d.state === 'wrong' ? '오답 ✕ 0점' : '미응답 − 0점')
      );
    });
    refs.console.write('총점 ' + result.score + ' / ' + result.maxScore + '점');
    refs.console.writeHint('판정 : ' + QUIZ.passLabel(result.score) + ' (8점 이상 이수)');

    renderResult(result);
    renderQuestion();
    applySections(true);
    refs.feedback.show(
      result.passed ? 'success' : 'warning',
      '채점을 마쳤어요. <strong>' + result.score + ' / ' + result.maxScore + '점</strong> · ' +
        QUIZ.passLabel(result.score) + '. 아래 <strong>② 채점 결과 및 해설</strong>을 확인해 보세요.',
      verdictOf(result.score).icon
    );
    ui.announce('채점을 마쳤어요. ' + result.score + '점, ' + QUIZ.passLabel(result.score) + '입니다.');
    ui.scrollToNode(refs.resultSection);
  }

  function applySections(graded) {
    if (refs.resultSection) refs.resultSection.hidden = !graded;
  }

  function accordionItem(opts) {
    var body = el('div', { 'class': 'accordion__body' });
    (opts.rows || []).forEach(function (row) {
      body.appendChild(
        el('dl', { 'class': 'accordion__row' }, [
          el('dt', { text: row[0] }),
          el('dd', { html: row[1] })
        ])
      );
    });
    if (opts.extra) body.appendChild(opts.extra);

    var item = el('div', { 'class': 'accordion__item' + (opts.open ? ' is-open' : '') });
    var head = el('button', {
      type: 'button',
      'class': 'accordion__head',
      attrs: { 'aria-expanded': String(Boolean(opts.open)), 'aria-label': opts.title + ' 해설 펼치기/접기' },
      on: {
        click: function () {
          var next = !item.classList.contains('is-open');
          item.classList.toggle('is-open', next);
          head.setAttribute('aria-expanded', String(next));
        }
      }
    }, [
      el('span', { 'class': ('accordion__mark ' + (opts.markClass || '')).trim(), text: opts.mark }),
      el('span', { 'class': 'accordion__title', text: opts.title }),
      el('span', { 'class': 'accordion__chevron', text: '▾', attrs: { 'aria-hidden': 'true' } })
    ]);
    item.appendChild(head);
    item.appendChild(body);
    return item;
  }

  function renderResult(result) {
    var body = refs.resultBody;
    ui.clear(body);

    /* 총점 카드 */
    var dots = el(
      'div',
      { 'class': 'score-dots', attrs: { role: 'list', 'aria-label': '문항별 결과' } },
      result.details.map(function (d, i) {
        return el('span', {
          'class': 'score-dot' + (d.state === 'correct' ? ' is-correct' : ''),
          text: String(i + 1),
          attrs: {
            role: 'listitem',
            'aria-label':
              i + 1 + '번 문항 ' +
              (d.state === 'correct' ? '정답' : d.state === 'wrong' ? '오답' : '미응답'),
            title: i + 1 + '번 ' + d.points + ' / ' + QUIZ.POINT + '점'
          }
        });
      })
    );

    var v = verdictOf(result.score);
    var lv = levelOf(result.score);
    var label = studentLabel();
    body.appendChild(
      el('div', { 'class': 'score-card' }, [
        el('p', { 'class': 'score-card__title', text: '종합 형성평가 결과' }),
        label
          ? el('p', { 'class': 'score-card__student', html: ui.escapeHtml(label) })
          : null,
        el('p', { 'class': 'score-card__value' }, [
          el('span', { text: String(result.score) }),
          el('small', { text: ' 점 / ' + result.maxScore + ' 점' })
        ]),
        dots,
        el('p', {
          'class': 'score-card__count',
          text:
            '(' + result.correctCount + ' / ' + QUIZ.QUESTIONS.length + ' 문항 정답 · 문항당 ' +
            QUIZ.POINT + '점)'
        }),
        el('p', {
          'class': 'score-card__level',
          html: '성취 수준 <strong>' + lv.grade + '</strong> · ' + lv.judgement
        }),
        el('p', { 'class': 'score-card__comment', text: v.icon + ' ' + v.text }),
        el('p', {
          'class': 'score-card__meta',
          text:
            '판정 ' + QUIZ.passLabel(result.score) + ' (8점 이상 이수) · 도전 ' + (st().attempts || 0) +
            '회 · 최고 ' + (st().bestScore === null ? '-' : st().bestScore) + '점 · 최근 ' +
            (st().lastScore === null ? '-' : st().lastScore) + '점'
        })
      ])
    );

    /* 오답 복습 바로가기 */
    var wrong = result.details.filter(function (d) {
      return d.state !== 'correct';
    });
    if (wrong.length) {
      var steps = [];
      wrong.forEach(function (d) {
        var q = QUIZ.byId(d.id);
        if (steps.indexOf(q.reviewStep) === -1) steps.push(q.reviewStep);
      });
      steps.sort(function (a, b) {
        return a - b;
      });
      body.appendChild(
        el('div', { 'class': 'review-links' }, [
          el('p', {
            'class': 'review-links__title',
            text: '헷갈린 개념을 다시 보고 오면 좋아요. 아래 버튼으로 바로 이동할 수 있어요.'
          }),
          ui.buttonRow(
            steps.map(function (n) {
              return ui.button({
                label: n + '단계 · ' + C.STEP_SHORTS[n] + ' 다시 보기',
                variant: 'secondary',
                ariaLabel: n + '단계 화면으로 이동해 복습하기',
                onClick: function () {
                  L.nav.goToStep(n, { force: true });
                }
              });
            })
          )
        ])
      );
    }

    /* 영역별 결과 (5차시는 단원 종합 평가 · 명세 43장 화면 6) */
    body.appendChild(ui.sectionTitle('영역', '오답 유형별 결과'));
    body.appendChild(
      ui.dataTable({
        head: ['오답 유형(영역)', '문항', '관련 차시', '결과'],
        caption: '영역별 결과',
        rows: result.details.map(function (d) {
          var q = QUIZ.byId(d.id);
          return [
            q.category,
            q.id + '번',
            q.lessonRef,
            d.state === 'correct' ? '○ 정답' : d.state === 'wrong' ? '✕ 오답' : '− 미응답'
          ];
        })
      })
    );

    /* 문항별 해설 아코디언 */
    body.appendChild(ui.sectionTitle('해설', '문항별 정답과 해설'));
    var accordion = el('div', { 'class': 'accordion' });
    result.details.forEach(function (d, i) {
      var q = QUIZ.byId(d.id);
      var ok = d.state === 'correct';
      var myText = QUIZ.answerToText(q, d.answer);
      var toHtml = function (text) {
        return ui.escapeHtml(text).replace(/\n/g, '<br />');
      };
      var rows = [
        ['내 답', myText ? toHtml(myText) : '<span class="is-muted">응답하지 않음</span>'],
        ['정답', toHtml(QUIZ.correctToText(q))],
        ['해설', q.explain],
        ['오답 유형', q.category + ' · 관련 차시 ' + q.lessonRef]
      ];
      accordion.appendChild(
        accordionItem({
          open: !ok,
          mark: ok ? '○' : d.state === 'wrong' ? '✕' : '−',
          markClass: ok ? 'is-correct' : d.state === 'wrong' ? 'is-wrong' : '',
          title:
            '문항 ' + q.id + ' · ' + q.title + ' — ' +
            (ok ? '정답' : d.state === 'wrong' ? '오답' : '미응답') +
            ' (' + d.points + ' / ' + q.points + '점)',
          rows: rows,
          extra: ok
            ? null
            : ui.buttonRow([
                ui.button({
                  label: '화면 ' + q.reviewStep + ' 다시 보기',
                  variant: 'ghost',
                  ariaLabel: '문항 ' + q.id + ' 복습을 위해 ' + q.reviewStep + '단계로 이동',
                  onClick: function () {
                    L.nav.goToStep(q.reviewStep, { force: true });
                  }
                })
              ])
        })
      );
    });
    body.appendChild(accordion);

    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '🔁 다시 풀기', variant: 'secondary', onClick: retry }),
        ui.button({ label: '⬇ 학습 기록 내려받기', variant: 'ghost', onClick: downloadRecord }),
        ui.button({
          label: '🖨 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
  }

  /** 명세 22장 : 문항과 정답은 그대로, 제시 순서만 바뀌는 3벌을 순환한다. */
  function retry() {
    var wasSubmitted = Boolean(st().submitted);
    st().order = QUIZ.orderFor(st().attempts || 0);
    st().answers = {};
    st().index = 0;
    st().graded = false;
    st().score = null;
    st().passed = null;
    st().submitLocked = false; // 다시 풀 수 있게 잠금을 푼다(제출 자체는 1회 그대로)
    L.state.markChanged();
    // 이미 제출을 마쳤다면 다시 제출할 수 없으므로 채점은 열어 둔다.
    if (wasSubmitted) gradeUnlocked = true;

    ui.clear(refs.resultBody);
    applySections(false);
    refs.console.clear();
    refs.feedback.show(
      'info',
      '새 순서로 다시 시작했어요. 최고 점수 <strong>' +
        (st().bestScore === null ? '-' : st().bestScore) + '점</strong>은 그대로 남아 있어요.' +
        (wasSubmitted
          ? '<br />답안은 <strong>이미 제출</strong>했으므로 다시 제출할 수는 없어요. 연습으로 다시 풀어 보세요.'
          : '')
    );
    renderQuestion();
    ui.scrollToNode(refs.quizPanel);
    ui.toast('문항 순서를 바꿔 다시 시작했어요.');
  }

  /* ------------------------------------------------------------------ */
  /* 답안 제출 (명세 23장 · 30장)                                            */
  /* ------------------------------------------------------------------ */
  function projectPayload() {
    var s = p5();
    var best = s.bestScore === null ? 0 : s.bestScore;
    return {
      score: best,
      maxScore: C.PROJECT_MAX,
      passed: best >= C.PROJECT_PASS,
      attempts: s.attempts || 0,
      challenge: s.challengeId ? P.task(s.challengeId).name : '',
      challengeScore: s.challengeScore === null ? null : s.challengeScore,
      hintLevel: s.hintLevel || 0,
      revealed: Boolean(s.revealed),
      rubric: s.rubric || null
    };
  }

  /** 명세 30장 : 제출 JSON */
  function buildPayload() {
    var result = QUIZ.grade(st().answers);
    var answers = (st().order || []).map(function (id) {
      var q = QUIZ.byId(id);
      var picked = st().answers[id];
      var d = result.details.filter(function (x) {
        return x.id === id;
      })[0];
      return {
        questionId: q.id,
        question: q.title + ' — ' + q.prompt,
        type: q.type,
        answer: QUIZ.answerToText(q, picked),
        correctAnswer: QUIZ.correctToText(q),
        isCorrect: d.state === 'correct' ? '정답' : d.state === 'wrong' ? '오답' : '미응답',
        category: q.category
      };
    });
    return {
      lesson: C.LESSON_ID,
      lessonTitle: C.LESSON_TITLE + ' · 중첩 반복문과 복합 제어 구조',
      studentId: st().student.id || '',
      name: st().student.name || '',
      answers: answers,
      totalScore: result.score,
      maxScore: result.maxScore,
      passed: QUIZ.passLabel(result.score),
      attempts: (st().attempts || 0) + (st().graded ? 0 : 1),
      project: projectPayload()
      // 명세 25장 : 자기 점검 · 학습 회고 · 자신감 입력을 두지 않으므로
      //             summary · confidence 항목은 보내지 않는다.
    };
  }

  function validStudent() {
    var id = String(st().student.id || '').trim();
    var name = String(st().student.name || '').trim();
    if (!/^[0-9]{3,10}$/.test(id)) return '학번을 숫자 3~10자리로 입력해 주세요.';
    if (!name) return '이름을 입력해 주세요.';
    if (name.length > 20) return '이름은 20자 이내로 입력해 주세요.';
    return '';
  }

  /** 제출 전 「무엇이 전송되는지」 확인 모달 (명세 14장) */
  function openSubmitDialog() {
    if (st().submitted) {
      ui.toast('답안은 한 번만 제출할 수 있어요. 이미 제출을 마쳤습니다.');
      return;
    }
    if (L.state.answeredCount() !== QUIZ.QUESTIONS.length) {
      ui.toast('모든 문항에 답한 뒤 제출할 수 있어요.');
      return;
    }
    var problem = validStudent();
    if (problem) {
      // 버튼 바로 아래(submitNotice)에도 이유를 남긴다.
      // 오른쪽 피드백만 바꾸면 «버튼이 아무 반응도 없다»고 느끼기 쉽다.
      ui.clear(refs.submitNotice);
      refs.submitNotice.hidden = false;
      refs.submitNotice.className = 'submit-notice is-blocked';
      refs.submitNotice.appendChild(
        el('p', {
          html:
            '! <strong>' + ui.escapeHtml(problem) + '</strong><br />' +
            '제출에는 <strong>학번과 이름</strong>이 필요해요. 위쪽 <strong>응시자 정보</strong> 칸을 채운 뒤 다시 눌러 주세요. ' +
            '(학습과 채점은 학번·이름 없이도 할 수 있어요)'
        })
      );
      refs.feedback.show('warning', '! ' + problem + ' 위쪽 <strong>응시자 정보</strong>를 채워 주세요.');
      ui.toast(problem);
      ui.scrollToNode(refs.studentCard);
      if (refs.idField) refs.idField.input.focus();
      ui.announce(problem);
      return;
    }
    var payload = buildPayload();
    var endpoint = L.state.readEndpoint();

    var urlInput = el('input', {
      type: 'url',
      'class': 'endpoint-modal__input',
      value: endpoint,
      placeholder: 'https://script.google.com/macros/s/…/exec',
      attrs: { 'aria-label': '선생님이 알려 준 제출 주소' }
    });
    var errorLine = el('p', { 'class': 'endpoint-modal__error' });

    var dialog = el('dialog', { 'class': 'modal endpoint-modal' });
    var busy = false;

    function close() {
      if (dialog.open) dialog.close();
      if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
    }

    // 명세 23.3 : 제출 실패 뒤에도 채점할 수 있어야 한다. 실패했을 때만 나타난다.
    var btnKeepGrading = ui.button({
      label: '채점 계속하기',
      variant: 'secondary',
      onClick: function () {
        gradeUnlocked = true;
        close();
        updateQuizNote();
        refs.feedback.show(
          'info',
          '제출은 하지 못했지만 <strong>채점을 계속할 수 있어요.</strong> ' +
            '나중에 [답안 제출하기] 로 다시 보낼 수 있습니다.'
        );
        ui.scrollToNode(refs.quizPanel);
      }
    });
    btnKeepGrading.hidden = true;

    var btnSend = ui.button({
      label: '보내기',
      onClick: function () {
        if (busy) return;
        var url = String(urlInput.value || '').trim();
        if (!/^https?:\/\//i.test(url)) {
          errorLine.textContent = '제출 주소를 확인해 주세요. https:// 로 시작하는 주소가 필요해요.';
          return;
        }
        busy = true;
        btnSend.disabled = true;
        errorLine.textContent = '보내는 중이에요…';
        L.state.saveEndpoint(url);
        refs.console.write('답안을 보내는 중… (' + url.replace(/^https?:\/\//, '').split('/')[0] + ')');
        send(url, payload)
          .then(function () {
            // 제출 성공 → 답안 잠금 → [채점하기] 열림 (명세 23.1)
            st().submitted = true;
            st().submitLocked = true;
            st().submitInfo = {
              at: new Date().toLocaleString('ko-KR'),
              mode: 'online',
              fileName: ''
            };
            L.state.markChanged();
            close();
            refs.console.write('제출 완료 (' + st().submitInfo.at + ') · 답안을 잠갔어요.');
            refs.feedback.show(
              'success',
              '제출을 마쳤어요. <strong>답안은 한 번만 제출</strong>할 수 있어 이제 답을 고칠 수 없어요.<br />' +
                '이어서 <strong>[채점하기]</strong> 를 눌러 결과를 확인해 보세요.',
              '📨'
            );
            ui.toast('제출을 마쳤어요. 이제 채점할 수 있어요.');
            renderQuestion();
            ui.announce('제출을 마쳤습니다. 채점하기 버튼을 사용할 수 있습니다.');
          })
          .catch(function (err) {
            busy = false;
            btnSend.disabled = false;
            var message = err && err.message ? err.message : '연결 실패';
            errorLine.textContent =
              '보내지 못했어요 (' + message + '). [답안 파일로 저장] 으로 파일을 만들어 선생님께 제출해도 되고, ' +
              '[채점 계속하기] 로 채점만 먼저 할 수도 있어요.';
            btnKeepGrading.hidden = false;
            refs.console.writeError('제출 실패 : ' + message);
            refs.feedback.show(
              'warning',
              '제출에 실패했어요. <strong>[답안 파일로 저장]</strong> 으로 파일을 만들어 제출하거나, ' +
                '<strong>[채점 계속하기]</strong> 로 채점만 먼저 할 수 있어요.'
            );
          });
      }
    });

    dialog.appendChild(
      el('div', { 'class': 'modal__body' }, [
        el('h2', { 'class': 'modal__title', text: '이 내용을 선생님께 보냅니다' }),
        el('div', { 'class': 'modal__text' }, [
          el('p', {
            html:
              '<strong>학번</strong> ' + ui.escapeHtml(payload.studentId) +
              ' · <strong>이름</strong> ' + ui.escapeHtml(payload.name)
          }),
          el('p', {
            text:
              '종합 형성평가 ' + QUIZ.QUESTIONS.length + '문항의 답과 총점(' + payload.totalScore + ' / ' + payload.maxScore +
              '), 프로젝트 점수(' + payload.project.score + ' / 100)가 함께 전송돼요.'
          }),
          el('p', {
            'class': 'endpoint-modal__notice',
            html:
              '⚠ <strong>답안은 한 번만 제출할 수 있어요.</strong> ' +
              '보내고 나면 답을 고칠 수 없고, 다시 제출할 수도 없습니다.'
          }),
          el('p', { 'class': 'meta-count', text: '[취소] 를 누르면 아무것도 전송하지 않습니다.' })
        ]),
        urlInput,
        errorLine,
        el('div', { 'class': 'modal__actions' }, [
          ui.button({ label: '취소', variant: 'ghost', onClick: close }),
          ui.button({ label: '답안 파일로 저장', variant: 'secondary', onClick: downloadAnswers }),
          btnKeepGrading,
          btnSend
        ])
      ])
    );
    dialog.addEventListener('cancel', function (e) {
      e.preventDefault();
      close();
    });
    document.body.appendChild(dialog);
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
  }

  /** Apps Script 로 보낸다. 미리 검사 요청(preflight)이 생기지 않도록 text/plain 으로 보낸다. */
  function send(url, payload) {
    if (typeof window.fetch !== 'function') {
      return Promise.reject(new Error('이 브라우저에서는 전송을 지원하지 않아요'));
    }
    return window
      .fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(function (res) {
        if (!res.ok) throw new Error('서버 응답 ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var data = null;
        try {
          data = JSON.parse(text);
        } catch (err) {
          data = null;
        }
        if (data && data.ok === false) throw new Error(data.message || '서버가 거절했어요');
        if (data && data.lesson && data.lesson !== C.LESSON_ID) {
          throw new Error('응답은 왔지만 이 차시의 답안 수집 주소가 아닌 것 같아요');
        }
        return data;
      });
  }

  function saveFile(name, text) {
    try {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: name });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (err) {
      ui.toast('파일을 만들지 못했어요.');
      return false;
    }
  }

  function downloadAnswers() {
    var payload = buildPayload();
    var name = (payload.studentId || '학번없음') + '_' + (payload.name || '이름없음') + '.json';
    if (saveFile(name, JSON.stringify(payload, null, 2))) {
      st().submitInfo = { at: new Date().toLocaleString('ko-KR'), mode: 'file', fileName: name };
      L.state.markChanged();
      // 파일 제출도 «제출»로 보아 채점을 열어 준다(명세 23.3). 온라인 재전송은 그대로 가능하다.
      gradeUnlocked = true;
      updateQuizNote();
      refs.console.write(name + ' 파일로 저장했어요. 채점을 계속할 수 있어요.');
      ui.toast(name + ' 파일을 저장했어요. 이제 채점할 수 있어요.');
    }
  }

  /** 명세 28장 : 학습 기록 내려받기 (채점 전에는 정답·해설을 넣지 않는다) */
  function downloadRecord() {
    var lines = [];
    var graded = st().graded;
    var s = p5();

    lines.push('반복 속의 반복, 패턴을 코드로 — 학습 기록');
    lines.push('중첩 반복문과 조건문으로 조합과 텍스트 도형 만들기 (제어 구조 5차시)');
    lines.push('');
    lines.push('[1] 응시자 정보');
    lines.push('  학번 : ' + (st().student.id || '(입력하지 않음)'));
    lines.push('  이름 : ' + (st().student.name || '(입력하지 않음)'));
    lines.push('');
    lines.push('[2] 프로젝트 결과');
    lines.push('  최고 점수 : ' + (s.bestScore === null ? '아직 채점하지 않음' : s.bestScore + ' / 100'));
    lines.push('  최근 점수 : ' + (s.lastScore === null ? '-' : s.lastScore + ' / 100'));
    lines.push('  도전 횟수 : ' + (s.attempts || 0) + '회 · 힌트 ' + (s.hintLevel || 0) + '단계 사용');
    lines.push(
      '  판정 : ' + (s.bestScore === null ? '-' : P.projectLabel(s.bestScore) + ' (60점 이상 이수)')
    );
    if (s.rubric) {
      lines.push(
        '  루브릭 : 문법·들여쓰기 ' + s.rubric.syntaxIndent + ' / 조건식 ' + s.rubric.condition +
          ' / 출력 ' + s.rubric.output + ' / 예측·설명 ' + s.rubric.predictionRule
      );
    }
    if (s.challengeId) {
      lines.push(
        '  도전 과제 : ' + P.task(s.challengeId).name +
          (s.challengeScore === null
            ? ''
            : ' (' + s.challengeScore + '점' + (s.challengeDone ? ' · 완성' : '') + ')')
      );
    }
    if (s.ruleText) lines.push('  내가 찾은 규칙 : ' + s.ruleText);
    lines.push('');
    lines.push('[3] 종합 형성평가');
    if (graded) {
      lines.push('  총점 : ' + st().score + ' / ' + QUIZ.MAX_SCORE);
      lines.push('  판정 : ' + QUIZ.passLabel(st().score) + ' (8점 이상 이수)');
      lines.push('  성취 수준 : ' + levelOf(st().score).grade);
      lines.push('  최고 점수 : ' + st().bestScore + '점 · 도전 횟수 : ' + st().attempts + '회');
    } else {
      lines.push('  아직 채점하지 않았어요.');
    }
    (st().order || []).forEach(function (id, i) {
      var q = QUIZ.byId(id);
      var given = st().answers[id];
      var answered = QUIZ.isAnswered(q, given);
      lines.push(
        '  ' + (i + 1) + '. ' + q.title + ' [' + q.category + '] → ' +
          (answered ? QUIZ.answerToText(q, given).replace(/\n/g, ' / ') : '응답하지 않음') +
          (graded
            ? '  [' + (!answered ? '미응답' : QUIZ.gradeAnswer(q, given) ? '정답' : '오답') + ']'
            : '')
      );
    });
    lines.push('');
    lines.push('[4] 답안 제출 상태');
    lines.push(
      '  ' +
        (st().submitted
          ? '제출 완료 (' + st().submitInfo.at + ')'
          : st().submitInfo.fileName
          ? '파일로 저장함 (' + st().submitInfo.fileName + ')'
          : '아직 제출하지 않음')
    );

    // 엑셀·메모장에서 한글이 깨지지 않도록 UTF-8 BOM 을 붙인다(명세 28장).
    if (saveFile('lesson3_7_5_학습기록.txt', '﻿' + lines.join('\r\n'))) {
      refs.console.write('학습 기록 파일을 저장했어요.');
    }
  }

  /* ------------------------------------------------------------------ */
  /* ③ 학습 정리 (명세 25장)                                                */
  /* ------------------------------------------------------------------ */
  function buildSummary(body) {
    /* ① 오늘 배운 내용 요약 */
    body.appendChild(ui.sectionTitle('①', '오늘 배운 내용 요약'));
    body.appendChild(
      el(
        'div',

          return el('div', { 'class': 'summary-item' }, [
            el('span', { 'class': 'summary-item__num', text: String(i + 1) }),
            el('span', { 'class': 'summary-item__text', html: line })
          ]);
        })
      )
    );

    /* ② 핵심 문법 카드 */
    body.appendChild(ui.sectionTitle('②', '핵심 문법 카드'));
    var cards = ui.split({});
    cards.left.appendChild(
      L.codeview.createCodeView({
        title: '중첩 반복문',
        showLineNumbers: false,
        ariaLabel: '중첩 반복문 기본 문법',
        lines: [
          { code: '# 바깥 1회마다 안쪽은 처음부터 끝까지' },
          { code: 'for i in range(3):' },
          { code: '    for j in range(1, 6):', note: '행 안의 열' },
          { code: '        print(j, end=" ")' },
          { code: '    print()', note: '줄 바꿈 ↵' }
        ]
      }).root
    );
    cards.right.appendChild(
      L.codeview.createCodeView({

        showLineNumbers: false,

        lines: [
          { code: 'for i in range(0, 5):' },
          { code: '    if i % 2 == 0:', block: 'true' },
          { code: '        print("@" * 5)', block: 'true', note: '짝수 행' },

        ]
      }).root
    );

    /* ③ 핵심 키워드 (명세 25장 — 입력·선택 활동은 두지 않는다) */
    body.appendChild(ui.sectionTitle('③', '오늘의 핵심 키워드'));
    body.appendChild(
      el(
        'div',
        { 'class': 'concept-grid' },

          return el('div', { 'class': 'concept-card' }, [

  }


  /* ------------------------------------------------------------------ */
  /* ④ 마무리 (명세 26장)                                                   */
  /* ------------------------------------------------------------------ */
  function buildClosing(body) {
    /* 단원 마무리 (명세 26장 — 「내 5차시 기록」·「1~5차시 학습 요약」은 두지 않는다) */
    body.appendChild(
      el('div', { 'class': 'next-lesson' }, [
        el('p', { 'class': 'next-lesson__label', text: '단원 마무리' }),
        el('p', { text: NEXT_LESSON })
      ])
    );

    body.appendChild(
      ui.buttonRow([
        ui.button({ label: '⬇ 학습 기록 내려받기', variant: 'secondary', onClick: downloadRecord }),
        ui.button({
          label: '🖨 인쇄하기',
          variant: 'ghost',
          onClick: function () {
            window.print();
          }
        })
      ])
    );
  }

  /* ------------------------------------------------------------------ */
  function render(root) {
    root.appendChild(
      ui.stepHeader({
        step: 6,
        title: '제어 구조, 이제 생활 속 문제에 적용해 보자',
        lead: [
          '1~5차시에서 배운 내용을 <strong>생활 속 문제 해결 상황</strong>으로 확인합니다.',
          '문항은 <strong>한 번에 하나씩</strong> 나오고, 정답 여부는 바로 알려주지 않아요. ' +
            '4문항에 모두 답한 뒤 <strong>채점하기</strong> 를 누르면 한꺼번에 채점됩니다.',
          '각 문항 3점 · 총 <strong>12점 만점</strong>이며 <strong>8점 이상이면 이수</strong>입니다.',
          '채점이 끝나면 <strong>문항별 해설</strong>이 이어서 나타나고, 아래쪽 <strong>학습 정리</strong>와 ' +
            '<strong>마무리</strong>는 언제든지 볼 수 있어요.'
        ]
      })
    );

    /* ---------------- ① 종합 형성평가 + 출력 창 · 피드백 ---------------- */
    var layout = ui.split({ className: 'split--wide-left' });

    var quiz = ui.panel({
      title: '① 종합 형성평가',
      hint:
        '문항을 읽고 답을 고른 뒤 <strong>다음 문항</strong>으로 이동해요. ' +
        '<strong>이전 문항</strong>으로 돌아가 답을 고칠 수 있고, 위쪽 점을 눌러 바로 이동할 수도 있어요.',
      className: 'quiz'
    });
    refs.quizPanel = quiz.root;

    // 응시자 정보 (선택) — 문항 위에 둔다
    buildStudentCard(quiz.body);

    refs.quizCounter = el('span', { 'class': 'quiz__counter', text: '문항 1 / ' + QUIZ.QUESTIONS.length });
    refs.quizDots = el('div', {
      'class': 'quiz__dots',
      attrs: { role: 'group', 'aria-label': '형성평가 문항 이동' }
    });
    quiz.body.appendChild(el('div', { 'class': 'quiz__meta' }, [refs.quizCounter, refs.quizDots]));

    refs.quizBody = el('div', { 'class': 'stack' });
    quiz.body.appendChild(refs.quizBody);

    refs.btnPrevQ = ui.button({
      label: '← 이전 문항',
      variant: 'secondary',
      ariaLabel: '이전 문항 보기',
      onClick: function () {
        if (st().index > 0) {
          st().index -= 1;
          L.state.markChanged();
          renderQuestion();
        }
      }
    });
    refs.btnNextQ = ui.button({
      label: '다음 문항 →',
      variant: 'secondary',
      ariaLabel: '다음 문항 보기',
      onClick: function () {
        if (st().index < QUIZ.QUESTIONS.length - 1) {
          st().index += 1;
          L.state.markChanged();
          renderQuestion();
        }
      }
    });
    refs.btnGrade = ui.button({
      label: '채점하기',
      ariaLabel: '종합 형성평가 채점하기',
      onClick: grade
    });
    refs.btnSubmit = C.SUBMIT_ENABLED
      ? ui.button({ label: '답안 제출하기', onClick: openSubmitDialog })
      : null;
    quiz.body.appendChild(
      ui.buttonRow([refs.btnPrevQ, refs.btnNextQ, refs.btnGrade, refs.btnSubmit])
    );

    refs.quizNote = el('p', { 'class': 'quiz__note', attrs: { 'aria-live': 'polite' } });
    quiz.body.appendChild(refs.quizNote);

    // 「한 번만 제출」 안내 — 버튼 바로 아래에 두어 누른 자리에서 보이게 한다.
    refs.submitNotice = el('div', { 'class': 'submit-notice', attrs: { role: 'status' } });
    quiz.body.appendChild(refs.submitNotice);
    layout.left.appendChild(quiz.root);

    refs.console = ui.createConsole({
      title: '채점·제출 진행 상황',
      emptyText: '4문항에 모두 답한 뒤 [채점하기] 를 누르면 채점 과정과 제출 결과가 여기에 표시돼요.',
      ariaLabel: '형성평가 채점 및 답안 제출 진행 상황'
    });
    refs.feedback = ui.createFeedback({ emptyText: '문항에 답하면 이곳에 안내가 표시돼요.' });
    layout.right.appendChild(refs.console.root);
    layout.right.appendChild(refs.feedback.root);
    root.appendChild(layout.root);

    /* ---------------- ② 채점 결과 및 해설 ---------------- */
    var result = ui.panel({ title: '② 채점 결과 및 해설', className: 'step6-result' });
    refs.resultSection = result.root;
    refs.resultBody = result.body;
    refs.resultSection.hidden = true;
    root.appendChild(refs.resultSection);

    /* ---------------- ③ 학습 정리 ---------------- */
    var summary = ui.panel({ title: '③ 학습 정리', className: 'step6-summary' });
    buildSummary(summary.body);
    root.appendChild(summary.root);

    /* ---------------- ④ 마무리 ---------------- */
    var closing = ui.panel({ title: '④ 마무리', className: 'step6-closing' });
    buildClosing(closing.body);
    root.appendChild(closing.root);

    renderQuestion();
  }

  L.registerStep(6, {
    title: C.STEP_TITLES[6],
    short: C.STEP_SHORTS[6],
    render: render,
    onEnter: function () {
      if (refs.idField) refs.idField.input.value = st().student.id || '';
      if (refs.nameField) refs.nameField.input.value = st().student.name || '';
      updateStudentUI();
      renderQuestion();
      if (st().graded) {
        renderResult(QUIZ.grade(st().answers));
        applySections(true);
      } else {
        applySections(false);
      }
    }
  });
})();

    <script data-from="js/90-app.js">
/**
 * 앱 부팅 (명세 4장 단계 구성 / 11.1 상태 복원 / 11.4 접근성)
 *  - 상단 스테퍼 생성·갱신, 진행률 바
 *  - 하단 [이전] / [다음] 버튼, 이동 조건 미충족 안내
 *  - 상단 메뉴로는 조건과 관계없이 자유 이동(교사 시연용, 명세 4장)
 *  - 저장된 진행 복원 확인 대화상자
 *  - 주소창 해시(#step3) 동기화
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var TOTAL = L.CONST.TOTAL_STEPS;

  var refs = {
    main: null,
    stepperList: null,
    progressCurrent: null,
    progressBar: null,
    progressFill: null,
    btnPrev: null,
    btnNext: null,
    navHint: null,
    nav: null
  };

  var sections = {};
  var hashLock = false;

  /* ------------------------------------------------------------------ */
  /* 화면 골격 확보                                                       */
  /* ------------------------------------------------------------------ */
  /**
   * index.html 에 골격이 이미 있으면 그대로 쓰고, 없으면 여기서 만든다.
   * (index.html 이 아주 단순해도 앱이 뜨도록 하기 위한 안전장치)
   */
  function ensureShell() {
    if (!document.getElementById('app-main')) {
      var stepperList = el('ol', { 'class': 'stepper__list', id: 'stepper-list' });
      var progressFill = el('div', { 'class': 'progressbar__fill', id: 'progressbar-fill' });
      var app = el('div', { 'class': 'app' }, [
        el('header', { 'class': 'app-progress', id: 'app-progress' }, [
          el('div', { 'class': 'app-progress__inner' }, [
            el(
              'nav',
              { 'class': 'stepper', id: 'stepper', attrs: { 'aria-label': '학습 단계 이동' } },
              [stepperList]
            ),
            el('div', { 'class': 'app-progress__meter' }, [
              el('p', { 'class': 'app-progress__count' }, [
                el('span', { id: 'progress-current', text: '1' }),
                el('span', { 'class': 'app-progress__count-sep', text: ' / ' }),
                el('span', { text: String(TOTAL) })
              ]),
              el(
                'div',
                {
                  'class': 'progressbar',
                  id: 'progressbar',
                  attrs: {
                    role: 'progressbar',
                    'aria-label': '학습 진행률',
                    'aria-valuemin': '0',
                    'aria-valuemax': '100',
                    'aria-valuenow': '0'
                  }
                },
                [progressFill]
              )
            ])
          ])
        ]),
        el('main', { 'class': 'app-main', id: 'app-main' }),
        el('footer', { 'class': 'app-nav', id: 'app-nav' }, [
          el('div', { 'class': 'app-nav__inner' }, [
            el('button', { type: 'button', 'class': 'btn btn--secondary', id: 'btn-prev', text: '← 이전' }),
            el('p', { 'class': 'app-nav__hint', id: 'nav-hint', attrs: { 'aria-live': 'polite' } }),
            el('button', { type: 'button', 'class': 'btn btn--primary', id: 'btn-next', text: '다음 →' })
          ])
        ])
      ]);
      document.body.appendChild(app);
    }

    if (!document.getElementById('toast-region')) {
      document.body.appendChild(
        el('div', {
          'class': 'toast-region',
          id: 'toast-region',
          attrs: { 'aria-live': 'polite', 'aria-atomic': 'true' }
        })
      );
    }
    if (!document.getElementById('sr-live')) {
      document.body.appendChild(
        el('div', {
          'class': 'sr-only',
          id: 'sr-live',
          attrs: { role: 'status', 'aria-live': 'polite' }
        })
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 화면 · 스테퍼 만들기                                             */
  /* ------------------------------------------------------------------ */
  function eachStep(fn) {
    for (var i = 1; i <= TOTAL; i += 1) fn(i, L.steps[i] || null);
  }

  function buildSections() {
    eachStep(function (id, step) {
      var section = el('section', {
        'class': 'step-screen',
        id: 'step-' + id,
        dataset: { step: String(id) },
        attrs: {
          'aria-label': id + '단계 ' + (step ? step.title : ''),
          tabindex: '-1'
        }
      });
      refs.main.appendChild(section);
      sections[id] = section;

      if (!step) {
        section.appendChild(el('p', { text: id + '단계가 아직 등록되지 않았어요.' }));
        return;
      }
      try {
        step.render(section);
        step.rendered = true;
      } catch (err) {
        if (window.console) console.error('[app] ' + id + '단계 화면을 만들지 못했습니다.', err);
        section.appendChild(el('p', { text: id + '단계 화면을 불러오지 못했어요.' }));
      }
    });
  }

  function buildStepper() {
    ui.clear(refs.stepperList);
    eachStep(function (id, step) {
      var title = step ? step.title : id + '단계';
      var node = el('button', {
        type: 'button',
        'class': 'stepper__node',
        text: String(id),
        attrs: { 'aria-label': id + '단계 ' + title + '로 이동' },
        on: {
          click: function () {
            // 명세 4장 : 교사의 시연을 위해 상단 메뉴에서는 자유롭게 이동할 수 있다.
            goToStep(id, { force: true });
          }
        }
      });
      refs.stepperList.appendChild(
        el('li', { 'class': 'stepper__item', dataset: { step: String(id) } }, [
          node,
          el('span', { 'class': 'stepper__label', text: step ? step.short : String(id) })
        ])
      );
    });
  }

  /* ------------------------------------------------------------------ */
  /* 진행 상태 · 이동 버튼 갱신                                            */
  /* ------------------------------------------------------------------ */
  function updateChrome() {
    var current = L.state.appState.currentStep;

    Array.prototype.slice.call(refs.stepperList.children).forEach(function (item) {
      var step = Number(item.dataset.step);
      var visited = L.state.isVisited(step);
      item.classList.toggle('is-current', step === current);
      item.classList.toggle('is-done', visited && step !== current);
      item.classList.toggle('is-locked', !visited);
      var node = item.querySelector('.stepper__node');
      node.textContent = visited && step !== current ? '✔' : String(step);
      node.setAttribute('aria-current', step === current ? 'step' : 'false');
    });

    refs.progressCurrent.textContent = String(current);
    var percent = Math.round(((current - 1) / (TOTAL - 1)) * 100);
    refs.progressFill.style.width = percent + '%';
    refs.progressBar.setAttribute('aria-valuenow', String(percent));
    refs.progressBar.setAttribute(
      'aria-valuetext',
      TOTAL + '단계 중 ' + current + '단계, ' + percent + '%'
    );

    refs.btnPrev.disabled = current === 1;
    refs.nav.classList.toggle('app-nav--start', current === 1);

    var last = current === TOTAL;
    refs.btnNext.textContent = last ? '학습 마치기' : '다음 →';

    var ok = L.state.canProceed(current);
    refs.btnNext.disabled = !ok;
    refs.btnNext.title = ok ? '' : L.state.blockedMessage(current);

    if (ok) {
      refs.navHint.textContent = '';
    } else {
      var left = L.state.remainingHint(current);
      refs.navHint.textContent = left.length
        ? L.state.blockedMessage(current) + ' (남은 활동: ' + left.join(', ') + ')'
        : L.state.blockedMessage(current);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 단계 이동                                                            */
  /* ------------------------------------------------------------------ */
  function showStep(step) {
    Object.keys(sections).forEach(function (key) {
      sections[key].classList.toggle('is-active', Number(key) === step);
    });
  }

  function syncHash(step) {
    hashLock = true;
    try {
      if (window.location.hash !== '#step' + step) window.location.hash = 'step' + step;
    } catch (err) {
      /* file:// 등에서 실패해도 학습에는 지장이 없다. */
    }
    setTimeout(function () {
      hashLock = false;
    }, 0);
  }

  /**
   * 단계 이동.
   * options.force  = true 면 이동 조건을 무시한다(상단 메뉴 · 오답 복습 바로가기).
   * options.silent = true 면 막혔을 때 안내를 띄우지 않는다.
   */
  function goToStep(target, options) {
    var o = options || {};
    var current = L.state.appState.currentStep;
    var next = L.state.clampStep(target);

    // 같은 단계로의 이동이라도 화면은 다시 맞춰 준다.
    // (학습 기록 초기화 후처럼 상태만 바뀌고 화면이 그대로 남는 일을 막는다)
    if (next === current) {
      showStep(next);
      var same = L.steps[next];
      if (same && typeof same.onEnter === 'function') {
        try {
          same.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      return;
    }

    // 앞으로 이동할 때만 이동 조건을 확인한다(되돌아가는 것은 언제나 자유).
    if (!o.force && next > current && !L.state.canProceed(current)) {
      var message = L.state.blockedMessage(current);
      if (!o.silent && message) {
        ui.toast(message);
        ui.announce(message);
      }
      return;
    }

    var from = L.steps[current];
    if (from && typeof from.onLeave === 'function') {
      try {
        from.onLeave();
      } catch (err) {
        if (window.console) console.error('[app] onLeave 오류', err);
      }
    }

    L.state.visitStep(next);
    showStep(next);

    var to = L.steps[next];
    if (to && typeof to.onEnter === 'function') {
      try {
        to.onEnter();
      } catch (err) {
        if (window.console) console.error('[app] onEnter 오류', err);
      }
    }

    updateChrome();
    syncHash(next);

    var section = sections[next];
    if (section && typeof section.focus === 'function') section.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    ui.announce(next + '단계 ' + (to ? to.title : '') + ' 화면으로 이동했습니다.');
  }

  function finishLearning() {
    return ui.confirmDialog({
      title: '학습을 모두 마쳤어요 🎉',
      message:
        '오늘은 <strong>바깥 반복 한 번마다 안쪽 반복이 처음부터 끝까지 실행된다</strong>는 것을 확인하고,<br />' +
        '조합 목록과 텍스트 도형을 <strong>행의 규칙 → 조건식 → 코드</strong> 순서로 만들어 보았어요.<br />' +
        '이번 차시로 「다양한 제어 구조」 단원을 마칩니다. 상단 메뉴를 눌러 오늘 배운 화면을 다시 살펴볼 수 있어요.',
      okLabel: '닫기',
      cancelLabel: '되돌아가기',
      dismissValue: true
    });
  }

  /* ------------------------------------------------------------------ */
  /* 해시 동기화                                                          */
  /* ------------------------------------------------------------------ */
  function stepFromHash() {
    var match = String(window.location.hash || '').match(/^#step(\d+)$/);
    if (!match) return null;
    return L.state.clampStep(Number(match[1]));
  }

  function onHashChange() {
    if (hashLock) return;
    var target = stepFromHash();
    if (target === null) return;
    if (target === L.state.appState.currentStep) return;
    goToStep(target, { force: true });
  }

  /* ------------------------------------------------------------------ */
  /* 부팅                                                                */
  /* ------------------------------------------------------------------ */
  function boot() {
    ensureShell();

    refs.main = document.getElementById('app-main');
    refs.stepperList = document.getElementById('stepper-list');
    refs.progressCurrent = document.getElementById('progress-current');
    refs.progressBar = document.getElementById('progressbar');
    refs.progressFill = document.getElementById('progressbar-fill');
    refs.btnPrev = document.getElementById('btn-prev');
    refs.btnNext = document.getElementById('btn-next');
    refs.navHint = document.getElementById('nav-hint');
    refs.nav = document.getElementById('app-nav');

    L.nav.setNavigator(goToStep);

    // 저장된 진행 기록이 있으면 이어서 학습할지 확인한다(명세 11.1).
    var saved = L.state.readSavedState();
    var restore = Promise.resolve();
    if (L.state.hasMeaningfulProgress(saved)) {
      restore = ui
        .confirmDialog({
          title: '이어서 학습하시겠어요?',
          message:
            '이전에 <strong>' +
            (saved.currentStep || 1) +
            '단계</strong>까지 진행한 기록이 남아 있어요.<br />처음부터 다시 시작하면 이전 기록은 지워집니다.',
          okLabel: '이어서 학습하기',
          cancelLabel: '처음부터 시작',
          // Esc 등으로 그냥 닫으면 기록을 지우지 않고 이어서 학습하는 쪽으로 처리한다.
          dismissValue: true
        })
        .then(function (resume) {
          if (resume) L.state.applySavedState(saved);
          else L.state.resetState();
        });
    } else if (saved) {
      L.state.resetState();
    }

    restore.then(function () {
      buildStepper();
      buildSections();

      refs.btnPrev.addEventListener('click', function () {
        goToStep(L.state.appState.currentStep - 1, { force: true });
      });
      refs.btnNext.addEventListener('click', function () {
        if (L.state.appState.currentStep === TOTAL) {
          if (L.state.canProceed(TOTAL)) finishLearning();
          else ui.toast(L.state.blockedMessage(TOTAL));
          return;
        }
        goToStep(L.state.appState.currentStep + 1);
      });

      // 상태가 바뀌면 이동 가능 여부·진행 표시를 즉시 갱신한다.
      L.state.onChange(function () {
        updateChrome();
      });

      window.addEventListener('hashchange', onHashChange);

      // 첫 화면 : 주소창 해시가 있으면 그 단계, 없으면 복원된 단계
      var start = stepFromHash();
      if (start === null) start = L.state.appState.currentStep;
      L.state.visitStep(start);
      showStep(start);
      var startStep = L.steps[start];
      if (startStep && typeof startStep.onEnter === 'function') {
        try {
          startStep.onEnter();
        } catch (err) {
          if (window.console) console.error('[app] onEnter 오류', err);
        }
      }
      updateChrome();
      syncHash(start);
    });
  }

  L.app = {
    boot: boot,
    goToStep: goToStep,
    refresh: updateChrome,
    /** 저장된 학습 기록을 지우고 1단계로 되돌린다(교사용). */
    resetAll: function () {
      L.state.resetState();
      goToStep(1, { force: true });
      updateChrome();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
    </script>
  </body>
</html>
