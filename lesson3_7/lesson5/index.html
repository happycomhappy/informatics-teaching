    refs.cmpAOut = el('div', { 'class': 'outpane__body' });
    refs.cmpBOut = el('div', { 'class': 'outpane__body' });

    function card(title, code, onRun, outBody) {
      return el('div', { 'class': 'compare-card' }, [
        el('div', { 'class': 'compare-card__head' }, [
          el('p', { 'class': 'compare-card__title', text: title })

        L.codeview.createCodeView({
          lines: code.map(function (line) {
            return { code: line };
          }),
          showLineNumbers: false,
          ariaLabel: title + ' 코드'

        ui.buttonRow([ui.button({ label: '[' + title + '] 실행', variant: 'secondary', onClick: onRun })]),
        el('div', { 'class': 'outpane' }, [
          el('div', { 'class': 'outpane__head' }, [
            el('span', { 'class': 'outpane__dot' }),
            el('span', { text: '출력' })
          ]),
          outBody
        ])
      ]);
    }

    panel.body.appendChild(
      el('div', { 'class': 'split' }, [
        card(
          'A',
          ['for i in range(2):', '    for j in range(1, 5):', '        print(j, end=" ")', '    print()'],
          function () {
            runCompare('A');
          },
          refs.cmpAOut
        ),
        card(
          'B',
          ['for j in range(1, 5):', '    for i in range(2):', '        print(i, end=" ")', '    print()'],
          function () {
            runCompare('B');

          refs.cmpBOut

    refs.cmpFeedback = ui.createFeedback({ emptyText: 'A 와 B 를 각각 실행해 보세요.' });
    panel.body.appendChild(refs.cmpFeedback.root);
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  function render(container) {
    container.appendChild(
      ui.stepHeader({
        step: 2,
        title: '반복문 안의 반복문은 어떻게 움직일까?',
        lead: [
          '바깥 반복이 한 번 움직일 때 안쪽 반복은 어디까지 실행되는지 <strong>격자</strong>로 확인해 봅니다.'

    buildSim();

    // 코드와 격자를 나란히 둔다 (명세 7.2 · 7.3)
    // 줄별 설명 표는 두지 않고, 실행 중인 줄에 표시되는 상태(▶ ✔)와 아래 안내 문구로 대신한다.
    var simPanel = ui.panel({
      title: '원본 프로그램과 3 × 5 실행 격자',
      hint:
        '<strong>[한 줄 실행]</strong> 은 파이썬의 실행 사건 하나, ' +
        '<strong>[한 단계 실행]</strong> 은 <strong>격자 한 칸을 완성하는 것</strong>으로 생각하면 됩니다.'
    });

    refs.btnLine = ui.button({
      label: '한 줄 실행',
      variant: 'secondary',
      onClick: function () {
        sim.player.stepEvent();
      }
    });
    refs.btnCell = ui.button({
      label: '한 단계 실행',
      variant: 'secondary',
      onClick: function () {
        sim.player.stepCell();
      }
    });
    refs.btnPlay = ui.button({
      label: '전체 실행',
      onClick: function () {
        sim.player.play();
        updateButtons();
      }
    });
    refs.btnPause = ui.button({
      label: '일시 정지',
      variant: 'ghost',
      disabled: true,
      onClick: function () {
        sim.player.pause();
      }
    });
    refs.btnReset = ui.button({ label: '다시 시작', variant: 'ghost', onClick: resetSim });

    simPanel.body.appendChild(
      ui.buttonRow([refs.btnLine, refs.btnCell, refs.btnPlay, refs.btnPause, refs.btnReset])
    );

    refs.progressLine = el('p', { 'class': 'meta-count', text: '내부 print 실행 횟수 0 / ' + TOTAL });
    simPanel.body.appendChild(refs.progressLine);

    // 왼쪽 : 원본 코드(실행 중인 줄이 ▶ ✔ 로 표시된다) · 오른쪽 : 3×5 격자
    simPanel.body.appendChild(
      el('div', { 'class': 'nl-run' }, [sim.codeview.root, sim.grid.root])
    );

    // 그 아래 : 실행 상태 카드 · 실제 출력
    refs.outBody = el('div', { 'class': 'outpane__body' });
    var infoSplit = ui.split({});
    infoSplit.left.appendChild(sim.stateCard.root);
    infoSplit.right.appendChild(
      el('div', { 'class': 'outpane' }, [
        el('div', { 'class': 'outpane__head' }, [
          el('span', { 'class': 'outpane__dot' }),
          el('span', { text: '실제 출력' })
        ]),
        refs.outBody
      ])
    );
    simPanel.body.appendChild(infoSplit.root);

    refs.feedback = ui.createFeedback({
      emptyText: '실행 버튼을 누르면 지금 무슨 일이 일어나는지 알려 드려요.'
    });
    simPanel.body.appendChild(refs.feedback.root);

    // 3 × 5 = 15 연결 (명세 7.7)
    refs.mathCard = el('button', {
      type: 'button',
      'class': 'nl-math',
      attrs: { 'aria-label': '3 곱하기 5 는 15. 누르면 행과 열이 강조됩니다.' },
      on: {
        click: function () {
          var next = refs.mathCard.dataset.mode === 'rows' ? 'cols' : refs.mathCard.dataset.mode === 'cols' ? 'both' : 'rows';
          refs.mathCard.dataset.mode = next;
          sim.grid.emphasize(next);
          refs.feedback.show(
            'info',
            next === 'rows'
              ? '행 3개를 강조했어요. 바깥 반복 <code>i</code> 가 만드는 것이 행입니다.'
              : next === 'cols'
              ? '열 5개를 강조했어요. 안쪽 반복 <code>j</code> 가 만드는 것이 열입니다.'
              : '행 3개 × 각 행의 열 5개 = 내부 print <strong>15회</strong>.'
          );
        }
      }
    }, [
      el('span', { 'class': 'nl-math__eq', text: '행 3개 × 각 행의 열 5개 = 내부 print 15회' }),
      el('span', { 'class': 'nl-math__hint', text: '누르면 행 · 열을 번갈아 강조합니다' })
    ]);
    simPanel.body.appendChild(refs.mathCard);
    container.appendChild(simPanel.root);

    container.appendChild(buildPredict());
    container.appendChild(buildCompare());

    resetSim();
  }

  L.registerStep(2, {
    title: C.STEP_TITLES[2],
    short: C.STEP_SHORTS[2],
    render: render,
    onEnter: function () {
      if (refs.pRows) {
        refs.pRows.setValue(st().predict.rows || '');
        refs.pCols.setValue(st().predict.cols || '');
        refs.pPrints.setValue(st().predict.prints || '');
      }
    },
    onLeave: function () {
      if (sim && sim.player) sim.player.pause();
    }
  });
})();

    <script data-from="js/62-step3.js">
/**
 * 화면 3 — 시럽·베이스 메뉴 조합 만들기 (명세 8장)
 *
 *   모든 조합은 «첫 목록의 한 값마다 두 번째 목록의 모든 값»을 연결하여 만든다(명세 62.3).
 *   그래서 조합의 개수는 언제나 두 목록 길이의 «곱» 이다.
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var E = L.engine;

  var refs = {};
  var player = null;
  var outLines = [];

  function st() {
    return L.state.appState.step3;
  }

  /* ------------------------------------------------------------------ */
  /* 목록 편집 (명세 8.3)                                                  */
  /* ------------------------------------------------------------------ */
  function listPanel(which) {
    var isSyrup = which === 'syrup';
    var label = isSyrup ? '시럽' : '베이스';
    var box = el('div', { 'class': 'combo-col__cards' });
    var input = ui.textField({
      placeholder: label + ' 이름',
      maxLength: E.LIST_RULES.maxLen,
      label: label + ' 추가 입력',
      width: '120px',
      align: 'left',
      onEnter: function () {
        addItem(which, input);
      }
    });

    var root = el('div', { 'class': 'combo-col' }, [
      el('p', { 'class': 'combo-col__title', text: (isSyrup ? '왼쪽 — ' : '가운데 — ') + label }),
      box,
      el('div', { 'class': 'row' }, [
        input.root,
        ui.button({
          label: '+ ' + label + ' 추가',
          variant: 'secondary',
          onClick: function () {
            addItem(which, input);
          }
        })
      ])
    ]);
    refs[which + 'Box'] = box;
    refs[which + 'Input'] = input;
    return root;
  }

  function addItem(which, input) {
    var list = st()[which];
    var label = which === 'syrup' ? '시럽' : '베이스';
    var res = E.validateItem(list, input.getValue(), label);
    if (!res.ok) {
      refs.listFeedback.show('error', '✕ ' + res.message);
      return;
    }
    list.push(res.value);
    input.setValue('');
    st().ranBasic = st().ranBasic; // 목록이 바뀌어도 이미 실행한 사실은 유지한다
    L.state.markChanged();
    paintLists();
    resetRun();
    clearCompare(); // 목록이 바뀌면 이전 비교 결과는 더 이상 맞지 않는다
    refs.listFeedback.show('success', '✓ ' + res.value + ' 을(를) 추가했어요.');
  }

  function removeItem(which, index) {
    var list = st()[which];
    var label = which === 'syrup' ? '시럽' : '베이스';
    if (!E.canRemove(list)) {
      refs.listFeedback.show(
        'warning',
        '! ' + label + '은(는) 최소 ' + E.LIST_RULES.min + '개가 필요해요.'
      );
      return;
    }
    list.splice(index, 1);
    L.state.markChanged();
    paintLists();
    resetRun();
    clearCompare();
  }

  function restoreDefaults() {
    st().syrup = E.DEFAULT_SYRUP.slice();
    st().base = E.DEFAULT_BASE.slice();
    L.state.markChanged();
    paintLists();
    resetRun();
    clearCompare();
    refs.listFeedback.show('info', '기본값으로 되돌렸어요.');
  }

  function paintLists() {
    ['syrup', 'base'].forEach(function (which) {
      var box = refs[which + 'Box'];
      var list = st()[which];
      ui.clear(box);
      list.forEach(function (name, index) {
        box.appendChild(
          el('div', { 'class': 'combo-card', dataset: { which: which, index: String(index) } }, [
            el('span', { 'class': 'combo-card__name', text: name }),
            ui.button({
              label: '삭제',
              variant: 'ghost',
              className: 'btn--sm',
              ariaLabel: name + ' 삭제',
              onClick: function () {
                removeItem(which, index);
              }
            })
          ])
        );
      });
    });
    var n = st().syrup.length;
    var m = st().base.length;
    refs.guessLabel.textContent = '시럽 ' + n + '개 × 베이스 ' + m + '개 · 예상 조합 수';
    refs.countLine.textContent =
      '현재 목록 : 시럽 ' + n + '개 · 베이스 ' + m + '개 (각 ' + E.LIST_RULES.min + '~' +
      E.LIST_RULES.max + '개, 한 항목 ' + E.LIST_RULES.maxLen + '자 이내)';
  }

  /* ------------------------------------------------------------------ */
  /* 조합 실행 (명세 8.5 · 8.6)                                            */
  /* ------------------------------------------------------------------ */
  function resetRun() {
    outLines = [];
    ui.clear(refs.resultBody);
    ui.clear(refs.outBody);
    refs.outBody.appendChild(
      el('p', { 'class': 'console__empty', text: '[조합 실행] 을 누르면 출력이 나타나요.' })
    );
    refs.resultBody.appendChild(
      el('p', { 'class': 't-empty', text: '아직 만든 조합이 없어요.' })
    );
    Array.prototype.slice.call(refs.syrupBox.children).forEach(function (card) {
      card.classList.remove('is-active', 'is-visited');
    });
    Array.prototype.slice.call(refs.baseBox.children).forEach(function (card) {
      card.classList.remove('is-active', 'is-visited');
    });
    if (player) player.pause();
    player = null;
    refs.runFeedback.clear();
  }

  function cardAt(which, index) {
    var box = refs[which + 'Box'];
    return box.children[index] || null;
  }

  function addResultRow(pair, order) {
    if (refs.resultBody.querySelector('.t-empty')) ui.clear(refs.resultBody);
    refs.resultBody.appendChild(
      el('div', { 'class': 'combo-row' }, [
        el('span', { 'class': 'combo-row__no', text: String(order) }),
        el('span', { 'class': 'combo-row__part', text: pair.a }),
        el('span', { 'class': 'combo-row__plus', text: '+' }),
        el('span', { 'class': 'combo-row__part', text: pair.b }),
        el('span', { 'class': 'combo-row__arrow', text: '→' }),
        el('span', { 'class': 'combo-row__menu', text: pair.text })
      ])
    );
  }

  function paintOut() {
    ui.clear(refs.outBody);
    if (!outLines.length) {
      refs.outBody.appendChild(el('p', { 'class': 'console__empty', text: '출력 대기 중' }));
      return;
    }
    outLines.forEach(function (line) {
      refs.outBody.appendChild(
        el('div', { 'class': 'outpane__line' }, [
          el('span', { 'class': 'outpane__text', text: line.text }),
          line.closed ? el('span', { 'class': 'outpane__nl', text: '↵' }) : null
        ])
      );
    });
  }

  /**
   * 비교용 출력창(코드 완성 패널 안)을 채운다.
   * 두 버튼이 위쪽 시뮬레이션만 돌리면 화면 밖에서 실행되어 «아무 일도 없어» 보인다.
   * 그래서 결과를 버튼 바로 아래에도 함께 남긴다(명세 8.8).
   */
  function paintCompare(insideNewline, lines) {
    var box = insideNewline ? refs.cmpInside : refs.cmpOutside;
    if (!box) return;
    ui.clear(box);
    lines.forEach(function (text) {
      box.appendChild(
        el('div', { 'class': 'outpane__line' }, [
          el('span', { 'class': 'outpane__text', text: text }),
          el('span', { 'class': 'outpane__nl', text: '↵' })
        ])
      );
    });
    box.appendChild(
      el('p', { 'class': 'console__empty', text: '→ 모두 ' + lines.length + '줄' })
    );
  }

  function clearCompare() {
    [refs.cmpOutside, refs.cmpInside].forEach(function (box) {
      if (!box) return;
      ui.clear(box);
      box.appendChild(el('p', { 'class': 'console__empty', text: '아직 실행하지 않았어요.' }));
    });
  }

  /**
   * @param {boolean} insideNewline print() 가 안쪽 반복 «안»에 있는 잘못된 형태인가
   * @param {object}  [opts] { from:'code' } 코드 완성 패널의 버튼에서 눌렀는지
   */
  function run(insideNewline, opts) {
    var o = opts || {};
    resetRun();
    var syrup = st().syrup;
    var base = st().base;
    var events = E.comboEvents(syrup, base, insideNewline);
    var order = 0;

    // 코드 패널에서 눌렀다면 위쪽 시뮬레이션이 보이도록 옮겨 준다.
    if (o.from === 'code') {
      ui.scrollToNode(refs.simRoot);
      if (refs.codeFeedback) {
        refs.codeFeedback.show(
          'info',
          (insideNewline
            ? '<strong>안쪽 반복 «안»</strong>에 <code>print()</code> 가 있는 코드로 실행 중이에요. '
            : '<strong>올바른 코드</strong>로 실행 중이에요. ') +
            '위쪽 <strong>조합 시뮬레이션</strong>에서 진행되고, 결과는 아래 «줄 바꿈 위치 비교»에도 남아요.'
        );
      }
    }

    player = L.flow.createPlayer({
      events: events,
      speed: C.CELL_MS,
      onEvent: function (ev) {
        if (ev.type === 'outer') {
          Array.prototype.slice.call(refs.syrupBox.children).forEach(function (card, i) {
            card.classList.toggle('is-active', i === ev.outer);
            if (i < ev.outer) card.classList.add('is-visited');
          });
          Array.prototype.slice.call(refs.baseBox.children).forEach(function (card) {
            card.classList.remove('is-active', 'is-visited');
          });
          refs.runFeedback.show(
            'info',
            '바깥 반복 <code>s = "' + ev.a + '"</code> 고정 — 이제 모든 베이스를 차례로 방문합니다.'
          );
        } else if (ev.type === 'pair') {
          var card = cardAt('base', ev.inner);
          Array.prototype.slice.call(refs.baseBox.children).forEach(function (c, i) {
            c.classList.toggle('is-active', i === ev.inner);
            if (i < ev.inner) c.classList.add('is-visited');
          });
          void card;
          order += 1;
          addResultRow(ev, order);
          if (!outLines.length || outLines[outLines.length - 1].closed) {
            outLines.push({ text: '', closed: false });
          }
          var cur = outLines[outLines.length - 1];
          cur.text = cur.text ? cur.text + ' ' + ev.text : ev.text;
          paintOut();
          ui.announce(ev.a + ' 와 ' + ev.b + ' 를 연결해 ' + ev.text + ' 를 만들었어요.');
        } else if (ev.type === 'newline') {
          if (outLines.length) outLines[outLines.length - 1].closed = true;
          paintOut();
        } else if (ev.type === 'end') {
          var total = E.comboCount(syrup, base);
          if (!insideNewline) {
            st().ranBasic = true;
            L.state.markChanged();
          } else {
            st().sawInsideNewline = true;
            L.state.markChanged();
          }
          refs.runFeedback.show(
            'success',
            insideNewline
              ? '이 <code>print()</code> 는 안쪽 반복 «안»에 있어 <strong>메뉴 하나를 출력할 때마다 줄이 바뀝니다.</strong> ' +
                  '시럽 하나의 조합을 한 줄에 모으려면 안쪽 반복이 끝난 뒤 줄을 바꿔야 해요.'
              : '조합 <strong>' + total + '개</strong>를 모두 만들었어요. 시럽 하나마다 모든 베이스가 한 번씩 연결되므로 ' +
                  '<code>' + syrup.length + ' × ' + base.length + ' = ' + total + '</code> 입니다.',
            insideNewline ? '↵' : '🎉'
          );
          paintCompare(insideNewline, E.comboLines(syrup, base, insideNewline));
          checkGuess(true);
        }
      }
    });
    player.play();
  }

  /* ------------------------------------------------------------------ */
  /* 조합 수 예측 (명세 8.4)                                               */
  /* ------------------------------------------------------------------ */
  function checkGuess(afterRun) {
    var raw = String(refs.guessField.getValue() || '').trim();
    if (!raw) {
      if (!afterRun) refs.guessFeedback.show('warning', '! 예상 조합 수를 입력해 주세요.');
      return;
    }
    var actual = E.comboCount(st().syrup, st().base);
    var ok = Number(raw) === actual;
    st().guess = raw;
    st().guessDone = true;
    st().guessOk = ok;
    L.state.markChanged();
    refs.guessFeedback.show(
      ok ? 'success' : 'error',
      (ok ? '✓ 맞았어요. ' : '✕ 실제 조합 수는 ' + actual + '개예요. ') +
        '시럽 하나마다 모든 베이스가 한 번씩 연결되므로 <code>시럽 개수 × 베이스 개수</code> 만큼 조합이 생깁니다. ' +
        '(<code>' + st().syrup.length + ' × ' + st().base.length + ' = ' + actual + '</code>)'
    );
  }

  /* ------------------------------------------------------------------ */
  /* 코드 완성 (명세 8.7 · 8.8)                                            */
  /* ------------------------------------------------------------------ */
  function blankInput(key, width) {
    var input = el('input', {
      type: 'text',
      'class': 'blank-input',
      value: st().blanks[key] || '',
      style: { width: width || '110px' },
      attrs: { 'aria-label': '빈칸 ' + key, spellcheck: 'false' }
    });
    input.addEventListener(
      'input',
      ui.debounce(function () {
        st().blanks[key] = input.value;
        L.state.markChanged();
      }, 300)
    );
    refs.blankInputs[key] = input;
    return input;

/**

 *
 *   텍스트 도형은 문자부터 쓰지 않는다. «행을 분류 → 각 행의 규칙 찾기 → 조건문으로 표현» 순서로 간다(명세 62.4).
 *   공백 보기 토글은 «화면 표시만» 바꾸고 실제 문자열은 건드리지 않는다(명세 9.2).

(function () {
  "use strict";

  var L = window.L;

  var el = ui.el;
  var C = L.CONST;
  var P = L.pattern;

  var BASE = P.TASKS.base;

  /** 명세 9.3 : 행 분류 */
  var GROUPS = [
    { id: 'even', label: '짝수 행', rule: '"@" * 5', rows: [0, 2, 4] },
    { id: 'one', label: '1번 행', rule: '" " * 4 + "@"', rows: [1] },
    { id: 'other', label: '그 외 행', rule: '"@"', rows: [3] }
  ];

  /** 규칙 카드(출력식)는 분류와 다른 순서로 배치한다. */
  var RULE_ORDER = ['one', 'other', 'even'];

  var CHECK_ROWS = [0, 1, 3];

  var refs = {};
  var pickedGroup = null;

  function st() {
    return L.state.appState.step4;
  }

  function groupById(id) {
    for (var i = 0; i < GROUPS.length; i += 1) {
      if (GROUPS[i].id === id) return GROUPS[i];
    }
    return null;
  }

  function expectedGroup(row) {
    for (var i = 0; i < GROUPS.length; i += 1) {

    }
    return null;
  }

  /* ------------------------------------------------------------------ */
  /* 도형 표시 (명세 9.1 · 9.2)                                            */
  /* ------------------------------------------------------------------ */
  function renderShape(lines, opts) {
    var o = opts || {};
    var showSpace = o.showSpace === true;
    return el(
      'div',
      { 'class': 'pat-shape', attrs: { role: 'group', 'aria-label': o.ariaLabel || '텍스트 도형' } },
      lines.map(function (line, i) {
        return el('div', { 'class': 'pat-shape__row' }, [
          o.rowNumbers === false ? null : el('span', { 'class': 'pat-shape__no', text: String(i) }),
          el('span', {
            'class': 'pat-shape__text' + (showSpace ? ' is-spacevis' : ''),
            text: showSpace ? P.spaceView(line) : line,
            attrs: { 'aria-label': P.describeLine(line, i) }
          })
        ]);
      })
    );
  }

  function paintBaseShape() {
    ui.clear(refs.shapeBox);
    refs.shapeBox.appendChild(
      renderShape(BASE.lines, {

      })

    refs.spaceBtn.setAttribute('aria-pressed', String(st().showSpace));
    refs.spaceBtn.textContent = st().showSpace ? '공백 보기 ●' : '공백 보기 ○';
    refs.spaceNote.textContent = st().showSpace

      : '2번 줄의 @ 앞에는 공백 4칸이 있습니다. [공백 보기] 로 확인해 보세요.';
  }

  /* ------------------------------------------------------------------ */
  /* 행 분류 (명세 9.3)                                                    */
  /* ------------------------------------------------------------------ */
  function paintClassify() {
    var groups = st().groups || {};
    refs.rowButtons.forEach(function (btn) {
      var row = Number(btn.dataset.row);
      var chosen = groups[row];
      var g = chosen ? groupById(chosen) : null;
      btn.querySelector('.pat-row__pick').textContent = g ? g.label : '분류 선택';
      btn.classList.toggle('is-set', Boolean(g));
      btn.classList.remove('is-correct', 'is-wrong');
      if (st().classifyDone && g) {
        btn.classList.add(chosen === expectedGroup(row) ? 'is-correct' : 'is-wrong');
      }
      btn.setAttribute(
        'aria-label',
        row + '번 행, 현재 분류 ' + (g ? g.label : '없음') + '. 먼저 분류 카드를 고른 뒤 이 행을 누르세요.'
      );

      btn.classList.toggle('is-picked', pickedGroup === btn.dataset.id);

  }

  function assignRow(row) {
    if (!pickedGroup) {
      ui.toast('먼저 위에서 분류 카드(짝수 행 · 1번 행 · 그 외 행)를 골라 주세요.');
      return;
    }
    st().groups[row] = pickedGroup;
    st().classifyDone = false;
    L.state.markChanged();
    paintClassify();
  }

  function checkClassify() {
    var groups = st().groups || {};
    var wrong = [];
    for (var row = 0; row < 5; row += 1) {
      if (groups[row] !== expectedGroup(row)) wrong.push(row);
    }
    st().classifyDone = wrong.length === 0;
    L.state.markChanged();
    paintClassify();
    if (st().classifyDone) {
      refs.classifyFeedback.show(
        'success',
        '✓ 정확해요. <strong>0 · 2 · 4행</strong>은 같은 모양이라 «짝수 행» 하나로 묶을 수 있습니다.',
        '🎉'
      );
    } else {
      refs.classifyFeedback.show(
        'error',
        '✕ 다시 확인해 주세요. 아직 맞지 않은 행 : <strong>' + wrong.join(', ') + '번 행</strong>. ' +

      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 규칙 카드 연결 (명세 9.3)                                             */
  /* ------------------------------------------------------------------ */
  function paintRules() {
    var rules = st().rules || {};
    refs.ruleSelects.forEach(function (item) {
      item.select.setValue(rules[item.groupId] || '');
      var ok = rules[item.groupId] === item.groupId;
      item.wrap.classList.remove('is-correct', 'is-wrong');
      if (st().ruleDone || (rules[item.groupId] && st().ruleChecked)) {
        item.wrap.classList.add(ok ? 'is-correct' : 'is-wrong');
      }
    });
  }

  function checkRules() {
    var rules = st().rules || {};
    var allOk = GROUPS.every(function (g) {
      return rules[g.id] === g.id;
    });
    st().ruleDone = allOk;
    st().ruleChecked = true;
    L.state.markChanged();
    paintRules();
    refs.ruleFeedback.show(
      allOk ? 'success' : 'error',
      allOk
        ? '✓ 세 규칙을 모두 연결했어요. 이제 이 규칙을 조건문으로 옮기면 됩니다.'
        : '✕ 아직 맞지 않은 연결이 있어요. 각 분류가 실제로 어떤 문자열을 만드는지 도형과 비교해 보세요.'
    );

  /* ------------------------------------------------------------------ */
  /* 조건 검사 순서 (명세 9.4)                                             */
  /* ------------------------------------------------------------------ */
  var BASE_RUN = P.runProgram({

  function showCheckFlow(row) {

        el('div', {
          'class': 'condline ' + (!check.checked ? 'is-unchecked' : check.value ? 'is-true' : 'is-false')

          el('span', { 'class': 'condline__mark', text: text })
        ])
      );
    });
    refs.flowBox.appendChild(
      el('div', {
        'class': 'condline ' + (info.branch === 2 ? 'is-true' : 'is-unchecked')
      }, [
        el('span', { 'class': 'condline__label', text: 'else' }),
        el('span', { 'class': 'condline__mark', text: info.branch === 2 ? '실행 ✓' : '실행 안 함 —' })
      ])

  }

  /* ------------------------------------------------------------------ */
  /* 행별 추적표 (명세 9.5)                                                */

  function buildTrace(panelBody) {

    var rows = CHECK_ROWS.map(function (row) {

      var s2 = ui.selectField({

    });

    panelBody.appendChild(
      ui.dataTable({
        head: ['i', '<code>i % 2 == 0</code>', '<code>i == 1</code>', '실행되는 출력'],

    panelBody.appendChild(ui.buttonRow([ui.button({ label: '추적표 확인', onClick: checkTrace })]));
    panelBody.appendChild(refs.traceFeedback.root);

  function checkTrace() {
    if (!BASE_RUN.ok) return;
    var wrong = [];
    CHECK_ROWS.forEach(function (row) {
      var info = BASE_RUN.rows[row];
      var f = refs.traceFields[row];
      var want1 = info.checks[0].value ? 'True' : 'False';
      var want2 = !info.checks[1].checked ? 'skip' : info.checks[1].value ? 'True' : 'False';
      var got1 = f.s1.getValue();
      var got2 = f.s2.getValue();
      var got3 = f.t3.getValue();
      if (got1 !== want1 || got2 !== want2 || got3 !== info.line) wrong.push(row);
    });

  /* ------------------------------------------------------------------ */

    });
    compare.body.appendChild(refs.compareAnswer.root);
    compare.body.appendChild(
      ui.callout(

          '조건문으로 표현</strong>하면 쉽게 만들 수 있습니다.'

          { id: 'compare', label: '비교', node: el('div', { 'class': 'stack' }, [compare.root]) }
        ]

    paintBaseShape();

  L.registerStep(4, {
    title: C.STEP_TITLES[4],
    short: C.STEP_SHORTS[4],

      paintBaseShape();

      if (refs.compareAnswer) refs.compareAnswer.setValue(st().compareAnswer || '');
      if (refs.traceFields) {
        CHECK_ROWS.forEach(function (row) {

      refs.tabCount.textContent =

  });

    <script data-from="js/64-step5.js">
/**
 * 화면 5 — 텍스트 도형 코딩 프로젝트 (명세 10장 · 11장 · 12장)
 *
 *   · 브라우저에서 임의 파이썬 코드를 실행하지 않는다. 55-pattern.js 의 제한 문법 파서만 쓴다.
 *   · 자동 채점은 결과를 «행 배열»로 비교한다. 공백도 채점 대상이다(명세 10.6).
 *   · 힌트는 실패 횟수에 따라 단계적으로 열리고, 완성 코드 전체는 자동으로 공개하지 않는다(명세 11.5).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var P = L.pattern;

  var BASE = P.TASKS.base;

  /** 명세 10.2 : 실행 전 예측 후보 */
  var CANDIDATES = [
    { id: 'A', lines: BASE.lines },
    { id: 'B', lines: ['@', '@@', '@@@', '@@@@', '@@@@@'] },
    { id: 'C', lines: ['@@@@@', '@@@@@', '@@@@@', '@@@@@', '@@@@@'] }
  ];

  /** 빈칸 정의 (명세 10.3 : 최소 6개) */
  var BLANKS = [
    { key: 'range', kind: 'range', width: '150px', label: '반복 범위' },
    { key: 'c1', kind: 'cond', width: '150px', label: '첫 번째 조건식' },
    { key: 'o1', kind: 'num', width: '70px', label: '@ 반복 횟수' },
    { key: 'c2', kind: 'cond', width: '150px', label: '두 번째 조건식' },
    { key: 'o2', kind: 'num', width: '70px', label: '공백 반복 횟수' },
    { key: 'o3', kind: 'out', width: '130px', label: 'else 출력식' }
  ];

  /** 토큰 조립 모드에 놓는 카드 (명세 11.4) */
  var TOKENS = {
    range: ['range(0, 5)', 'range(5)', 'range(1, 5)'],
    cond: ['i % 2 == 0', 'i == 1', 'i == 0 or i == 4', 'i % 2 == 1'],
    num: ['3', '4', '5'],
    out: ['"@"', '"@" * 5', '" " * 4 + "@"', '" " * i + "@"', '"@" + " " * 3 + "@"']
  };

  var CH_BLANKS = [
    { key: 'range', kind: 'range', width: '150px', label: '반복 범위' },
    { key: 'c1', kind: 'cond', width: '160px', label: '조건식' },
    { key: 'o1', kind: 'out', width: '170px', label: '조건이 참일 때 출력식' },
    { key: 'o3', kind: 'out', width: '170px', label: 'else 출력식' }
  ];

  var refs = { inputs: {}, chInputs: {} };
  var activeBlank = null;
  var showSpace = false;

  function st() {
    return L.state.appState.step5;
  }

  /* ------------------------------------------------------------------ */
  /* 코드 → 실행 규격                                                     */
  /* ------------------------------------------------------------------ */

  /** 기본 과제 : 빈칸 6개를 실행 규격으로 조립한다. */
  function baseSpec() {
    var s = st().spec;
    return {
      range: s.range,
      branches: [
        { cond: s.c1, out: '"@" * ' + String(s.o1 || '').trim() },
        { cond: s.c2, out: '" " * ' + String(s.o2 || '').trim() + ' + "@"' }
      ],
      elseOut: s.o3
    };
  }

  function challengeSpec() {
    var s = st().challengeSpec;
    return {
      range: s.range,
      branches: [{ cond: s.c1, out: s.o1 }],
      elseOut: s.o3
    };
  }

  /* ------------------------------------------------------------------ */
  /* 빈칸 · 토큰                                                          */
  /* ------------------------------------------------------------------ */
  /**
   * 빈칸 하나를 만든다.
   * @param {string} boxKey 이 빈칸이 쓸 토큰 카드 상자 ('tokenBox' = 기본 과제 / 'chTokenBox' = 도전 과제)
   *   ★ 도전 과제 빈칸이 기본 과제의 카드 상자를 보면, 학생 눈에는 «글씨가 안 들어가는 칸»이 된다.
   *     그래서 각 구역이 자기 카드 상자를 갖는다.
   */
  function makeBlank(def, store, inputs, boxKey) {
    var input = el('input', {
      type: 'text',
      'class': 'blank-input',
      value: store()[def.key] || '',
      style: { width: def.width },
      attrs: {
        'aria-label': def.label,
        spellcheck: 'false',
        readonly: st().mode === 'token' ? 'readonly' : false
      }
    });
    input.addEventListener('focus', function () {
      activeBlank = {
        key: def.key,
        kind: def.kind,
        input: input,
        store: store,
        boxKey: boxKey || 'tokenBox',
        label: def.label
      };
      paintTokens();
    });
    input.addEventListener('click', function () {
      activeBlank = {
        key: def.key,
        kind: def.kind,
        input: input,
        store: store,
        boxKey: boxKey || 'tokenBox',
        label: def.label
      };
      paintTokens();
    });
    input.addEventListener(
      'input',
      ui.debounce(function () {
        store()[def.key] = input.value;
        L.state.markChanged();
      }, 300)
    );
    inputs[def.key] = input;
    return input;
  }

  function paintTokens() {
    var boxes = [
      { key: 'tokenBox', node: refs.tokenBox },
      { key: 'chTokenBox', node: refs.chTokenBox }
    ].filter(function (b) {
      return Boolean(b.node);
    });
    if (!boxes.length) return;

    var activeKey = activeBlank ? activeBlank.boxKey : null;

    boxes.forEach(function (box) {
      ui.clear(box.node);
      if (st().mode !== 'token') {
        box.node.appendChild(
          el('p', { 'class': 'meta-count', text: '직접 입력 모드예요. 옆 코드의 빈칸에 식을 직접 적어 주세요.' })
        );
        return;
      }
      if (box.key !== activeKey) {
        box.node.appendChild(
          el('p', {
            'class': 'meta-count',
            text: '먼저 옆 코드에서 채울 빈칸을 누르면 넣을 수 있는 카드가 나타나요.'
          })
        );
        return;
      }
      box.node.appendChild(
        el('p', {
          'class': 'meta-count',
          text: '「' + (activeBlank.label || activeBlank.key) + '」 칸에 넣을 카드'
        })
      );
      var cards = (TOKENS[activeBlank.kind] || []).map(function (text) {
        return el('button', {
          type: 'button',
          'class': 'token-card',
          text: text,
          on: {
            click: function () {
              activeBlank.store()[activeBlank.key] = text;
              activeBlank.input.value = text;
              activeBlank.input.classList.add('is-filled');
              L.state.markChanged();
            }
          }
        });
      });
      box.node.appendChild(el('div', { 'class': 'row' }, cards));
      box.node.appendChild(
        ui.buttonRow([
          ui.button({
            label: '이 칸 비우기',
            variant: 'ghost',
            onClick: function () {
              activeBlank.store()[activeBlank.key] = '';
              activeBlank.input.value = '';
              activeBlank.input.classList.remove('is-filled');
              L.state.markChanged();
            }
          })
        ])
      );
    });
  }

  function setMode(mode) {
    st().mode = mode;
    L.state.markChanged();
    // 두 모드는 언제든 전환할 수 있고 입력값은 유지한다(명세 11.4).
    Object.keys(refs.inputs).forEach(function (key) {
      if (mode === 'token') refs.inputs[key].setAttribute('readonly', 'readonly');
      else refs.inputs[key].removeAttribute('readonly');
    });
    Object.keys(refs.chInputs).forEach(function (key) {
      if (mode === 'token') refs.chInputs[key].setAttribute('readonly', 'readonly');
      else refs.chInputs[key].removeAttribute('readonly');
    });
    refs.modeTabs.setValue(mode);
    paintTokens();
  }

  /* ------------------------------------------------------------------ */
  /* 출력 창 (명세 10.5)                                                   */
  /* ------------------------------------------------------------------ */
  function paintOutput(box, lines, marks) {
    ui.clear(box);
    if (!lines || !lines.length) {
      box.appendChild(el('p', { 'class': 'console__empty', text: '실행하면 출력이 여기에 표시돼요.' }));
      return;
    }
    lines.forEach(function (line, i) {
      var mark = marks ? marks[i] : null;
      box.appendChild(
        el('div', {
          'class':
            'pat-out__line' +
            (mark === 'ok' ? ' is-ok' : mark === 'diff' || mark === 'extra' ? ' is-diff' : ''),
          attrs: { 'aria-label': P.describeLine(line, i) }
        }, [
          el('span', { 'class': 'pat-out__no', text: String(i) }),
          el('span', { 'class': 'pat-out__text', text: showSpace ? P.spaceView(line) : line }),
          mark ? el('span', { 'class': 'pat-out__mark', text: mark === 'ok' ? '✓' : '✕' }) : null
        ])
      );
    });
  }

  /* ------------------------------------------------------------------ */
  /* 기본 과제 채점 (명세 12장)                                            */
  /* ------------------------------------------------------------------ */
  function runAndScore() {
    // 빈칸이 남아 있으면 채점하지 않는다.
    // (빈칸 상태로 채점하면 «실패»로 세어 힌트 단계만 소모된다)
    var empty = BLANKS.filter(function (b) {
      return !String(st().spec[b.key] || '').trim();
    });
    if (empty.length) {
      refs.projFeedback.show(
        'warning',
        '! 아직 비어 있는 칸이 <strong>' + empty.length + '곳</strong> 있어요 — ' +
          empty
            .map(function (b) {
              return b.label;
            })
            .join(' · ') +
          (st().mode === 'token' ? '<br />빈칸을 누른 뒤 아래 카드를 골라 채워 주세요.' : '')
      );
      var first = refs.inputs[empty[0].key];
      if (first && typeof first.focus === 'function') first.focus();
      ui.announce('빈칸 ' + empty.length + '곳이 남아 있어 채점하지 않았어요.');
      return;
    }

    var result = P.scoreProject({
      taskId: 'base',
      spec: baseSpec(),
      predicted: st().predictDone,
      ruleText: st().ruleText
    });

    st().attempts = (st().attempts || 0) + 1;
    st().score = result.score;
    st().lastScore = result.score;
    st().rubric = result.rubric;
    st().passed = result.passed;
    if (st().bestScore === null || result.score > st().bestScore) st().bestScore = result.score;
    if (!result.compare.same) {
      st().failCount = (st().failCount || 0) + 1;
      st().hintLevel = Math.min(3, st().failCount);
    }
    L.state.markChanged();

    paintOutput(refs.outBody, result.run.ok ? result.run.lines : [], result.compare.marks);
    renderScore(result);
    paintHint();

    // 버튼 바로 아래에 결과 요약을 먼저 알려 준다(점수 카드는 아래쪽에 그려지므로).
    refs.projFeedback.show(
      result.compare.same ? 'success' : 'error',
      (result.compare.same ? '✓ ' : '✕ ') +
        '채점을 마쳤어요 — <strong>' + result.score + '점 / 100</strong> (' +
        P.projectLabel(result.score) + ')<br />' +
        (result.compare.same
          ? '출력이 기대 도형과 완전히 같아요.'
          : result.messages[0] || '아래 출력과 점수를 확인해 보세요.'),
      result.compare.same ? '🎉' : undefined
    );

    // 좁은 화면에서는 [출력] 구역으로 전환하고, 넓은 화면에서는 출력 구역으로 화면을 옮긴다.
    if (refs.projTabs && refs.projTabs.isMobile()) refs.projTabs.setActive('out');
    ui.scrollToNode(refs.outNode);

    ui.announce(
      '채점을 마쳤어요. ' + result.score + '점, ' + P.projectLabel(result.score) + '입니다.'
    );
  }

  function renderScore(result) {
    var box = refs.scoreBox;
    ui.clear(box);

    box.appendChild(
      el('div', { 'class': 'score-card' }, [
        el('p', { 'class': 'score-card__title', text: '프로젝트 점수' }),
        el('p', { 'class': 'score-card__value' }, [
          el('span', { text: String(result.score) }),
          el('small', { text: ' / 100' })
        ]),
        el('p', {
          'class': 'score-card__comment',
          text:
            P.projectLabel(result.score) +
            ' (60점 이상 이수) · 최고 ' + (st().bestScore === null ? '-' : st().bestScore) +
            '점 · 최근 ' + (st().lastScore === null ? '-' : st().lastScore) +
            '점 · 도전 ' + (st().attempts || 0) + '회' +
            (st().hintLevel ? ' · 힌트 ' + st().hintLevel + '단계 사용' : '')
        })
      ])
    );

    // 루브릭 4영역
    box.appendChild(
      el(
        'div',
        { 'class': 'rubric' },
        P.RUBRIC.map(function (item) {
          var got = result.rubric[item.key];
          var percent = Math.round((got / item.max) * 100);
          return el('div', { 'class': 'rubric__row' }, [
            el('span', { 'class': 'rubric__label', text: item.label }),
            el('span', { 'class': 'rubric__bar' }, [
              el('span', { 'class': 'rubric__fill', style: { width: percent + '%' } })
            ]),
            el('span', { 'class': 'rubric__score', text: got + ' / ' + item.max + '점' })
          ]);
        })
      )
    );

    // 세부 항목
    var acc = el('div', { 'class': 'accordion' });
    var item = el('div', { 'class': 'accordion__item is-open' });
    var head = el('button', { type: 'button', 'class': 'accordion__head' }, [
      el('span', { 'class': 'accordion__mark', text: result.compare.same ? '○' : '✕' }),
      el('span', { 'class': 'accordion__title', text: '세부 채점 내용' }),
      el('span', { 'class': 'accordion__chevron', text: '▾', attrs: { 'aria-hidden': 'true' } })
    ]);
    head.addEventListener('click', function () {
      item.classList.toggle('is-open');
    });
    var body = el('div', { 'class': 'accordion__body' }, [
      ui.dataTable({
        head: ['평가 항목', '점수', '안내'],
        caption: '프로젝트 세부 채점',
        rows: result.detail.map(function (d) {
          return [d.label, d.point + ' / ' + d.max, d.note || (d.point === d.max ? '✓ 통과' : '')];
        })
      })
    ]);
    item.appendChild(head);
    item.appendChild(body);
    acc.appendChild(item);
    box.appendChild(acc);

    if (result.messages.length) {
      box.appendChild(
        el('div', { 'class': 'callout callout--warn' }, [
          el('p', { html: '<strong>고쳐야 할 곳</strong>' }),
          el(
            'ul',
            { 'class': 'hint-list' },
            result.messages.slice(0, 6).map(function (m) {
              return el('li', { html: ui.escapeHtml(m) });
            })
          )
        ])
      );
    } else if (result.compare.same) {
      box.appendChild(
        ui.award({
          icon: '🏅',
          title: '출력이 기대 도형과 완전히 같아요',
          text: '줄 수 · 문자 · 공백 · 줄 바꿈이 모두 정확합니다.'
        })
      );
    }
  }

  function paintHint() {
    ui.clear(refs.hintBox);
    var hint = P.hintFor('base', st().hintLevel || 0);
    if (!hint) {
      refs.hintBox.appendChild(
        el('p', { 'class': 'meta-count', text: '채점에서 틀리면 힌트가 한 단계씩 열려요.' })
      );
      return;
    }
    refs.hintBox.appendChild(
      el('div', { 'class': 'hint-item' }, [
        el('span', { 'class': 'hint-item__num', text: String(hint.level) }),
        el('span', { html: hint.text })
      ])
    );
    if (st().hintLevel >= 3) {
      refs.hintBox.appendChild(
        el('p', {
          'class': 'meta-count',
          text: '완성 코드 전체는 자동으로 공개하지 않아요. 직접 보고 싶으면 아래 [완성 코드 보기] 를 누르세요.'
        })
      );
    }
  }

  function revealAnswer() {
    ui.confirmDialog({
      title: '완성 코드를 볼까요?',
      message:
        '완성 코드를 보면 <strong>스스로 규칙을 찾는 연습 기회</strong>가 줄어들어요.<br />' +
        '프로젝트 점수는 그대로 유지되지만, 학습 기록에 «완성 코드 확인» 으로 남습니다.',
      okLabel: '그래도 보기',
      cancelLabel: '조금 더 해 보기'
    }).then(function (ok) {
      if (!ok) return;
      st().revealed = true;
      L.state.markChanged();
      ui.clear(refs.answerBox);
      refs.answerBox.appendChild(
        L.codeview.createCodeView({
          title: '학습용 완성 코드',
          showLineNumbers: false,
          ariaLabel: '완성 코드',
          lines: P.answerCode('base').split('\n').map(function (line) {
            return { code: line };
          })
        }).root
      );
    });
  }

  /* ------------------------------------------------------------------ */
  /* 도전 과제 (명세 11장)                                                 */
  /* ------------------------------------------------------------------ */
  function selectChallenge(id) {
    st().challengeId = id;
    L.state.markChanged();
    renderChallenge();
  }

  function renderChallenge() {
    var box = refs.chBody;
    ui.clear(box);
    refs.chInputs = {};
    refs.chTokenBox = null; // 아래에서 다시 만든다
    if (activeBlank && activeBlank.boxKey === 'chTokenBox') activeBlank = null;
    var id = st().challengeId;
    if (!id) {
      box.appendChild(
        el('p', { 'class': 't-empty', text: '도전 과제를 하나 고르면 목표 도형과 입력 칸이 나타나요.' })
      );
      return;
    }
    var t = P.task(id);

    box.appendChild(el('p', { 'class': 'act-head__title', text: t.name }));
    box.appendChild(
      el(
        'div',
        { 'class': 'pat-shape' },
        t.lines.map(function (line, i) {
          return el('div', { 'class': 'pat-shape__row' }, [
            el('span', { 'class': 'pat-shape__no', text: String(i) }),
            el('span', {
              'class': 'pat-shape__text' + (showSpace ? ' is-spacevis' : ''),
              text: showSpace ? P.spaceView(line) : line,
              attrs: { 'aria-label': P.describeLine(line, i) }
            })
          ]);
        })
      )
    );
    box.appendChild(
      ui.dataTable({
        head: ['행', '규칙'],
        caption: t.name + ' 규칙표',
        rows: t.ruleTable.map(function (row) {
          return [row[0], '<code>' + ui.escapeHtml(row[1]) + '</code>'];
        })
      })
    );

    var store = function () {
      return st().challengeSpec;
    };
    var cv = L.codeview.createCodeView({
      showLineNumbers: true,
      ariaLabel: '도전 과제 코드',
      lines: [
        { parts: ['for i in ', makeBlank(CH_BLANKS[0], store, refs.chInputs, 'chTokenBox'), ':'], indent: 0 },
        { parts: ['if ', makeBlank(CH_BLANKS[1], store, refs.chInputs, 'chTokenBox'), ':'], indent: 4 },
        { parts: ['print(', makeBlank(CH_BLANKS[2], store, refs.chInputs, 'chTokenBox'), ')'], indent: 8 },
        { code: '    else:' },
        { parts: ['print(', makeBlank(CH_BLANKS[3], store, refs.chInputs, 'chTokenBox'), ')'], indent: 8 }
      ]
    });
    // 도전 과제 전용 토큰 카드 상자 (기본 과제 상자와 따로 둔다) — 코드 «옆»에 나란히 둔다.
    refs.chTokenBox = el('div', { 'class': 'token-box' });
    box.appendChild(el('div', { 'class': 'proj-code' }, [cv.root, refs.chTokenBox]));
    box.appendChild(
      ui.callout(
        '빈칸을 누른 뒤 <strong>옆에 나타나는 카드</strong>를 고르면 채워져요. ' +
          '위쪽 <strong>[직접 입력 모드]</strong>로 바꾸면 키보드로 직접 적을 수도 있어요.',
        { muted: true }
      )
    );

    refs.chOut = el('div', { 'class': 'pat-out__body' });
    box.appendChild(
      el('div', { 'class': 'outpane' }, [
        el('div', { 'class': 'outpane__head' }, [
          el('span', { 'class': 'outpane__dot' }),
          el('span', { text: '도전 과제 출력' })
        ]),
        refs.chOut
      ])
    );
    refs.chFeedback = ui.createFeedback({ emptyText: '입력한 뒤 [도전 과제 채점] 을 누르세요.' });
    box.appendChild(
      ui.buttonRow([
        ui.button({ label: '도전 과제 채점', onClick: scoreChallenge }),
        ui.button({
          label: '힌트 보기',
          variant: 'ghost',
          onClick: function () {
            var hint = P.hintFor(id, Math.min(3, (st().chFail || 0) + 1));
            refs.chFeedback.show('info', hint ? hint.text : '먼저 한 번 채점해 보세요.');
          }
        })
      ])
    );
    box.appendChild(refs.chFeedback.root);
    paintOutput(refs.chOut, [], null);
    // 새로 만든 도전 과제 빈칸에도 현재 입력 모드(읽기 전용 여부)를 그대로 적용한다.
    setMode(st().mode || 'token');
  }

  function scoreChallenge() {
    var id = st().challengeId;
    if (!id) return;
    var result = P.scoreProject({
      taskId: id,
      spec: challengeSpec(),
      predicted: true, // 도전 과제는 예측 활동이 없으므로 그 항목은 만점 처리한다
      ruleText: st().ruleText || '도전 과제'
    });
    st().challengeScore = result.score;
    st().challengeDone = result.compare.same;
    if (!result.compare.same) st().chFail = (st().chFail || 0) + 1;
    L.state.markChanged();

    paintOutput(refs.chOut, result.run.ok ? result.run.lines : [], result.compare.marks);
    if (result.compare.same) {
      refs.chFeedback.show(
        'success',
        '✓ 목표 도형과 완전히 같아요. 도전 과제 점수 <strong>' + result.score + '점</strong>.',
        '🏅'
      );
    } else {
      refs.chFeedback.show(
        'error',
        '✕ 아직 달라요. ' + (result.messages[0] || '출력 결과를 다시 비교해 보세요.') +
          ' (현재 ' + result.score + '점)'
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 실행 전 예측 (명세 10.2)                                              */
  /* ------------------------------------------------------------------ */
  function buildPredict() {
    var panel = ui.panel({
      title: '실행 전 예측',
      hint: '아래 코드를 실행하면 어떤 도형이 나올까요? 예측이 틀려도 코드 활동을 계속할 수 있어요.'
    });
    panel.body.appendChild(
      L.codeview.createCodeView({
        showLineNumbers: false,
        ariaLabel: '기본 과제 완성 예시 코드',
        lines: [
          { code: 'for i in range(0, 5):' },
          { code: '    if i % 2 == 0:' },
          { code: '        print("@" * 5)' },
          { code: '    elif i == 1:' },
          { code: '        print(" " * 4 + "@")' },
          { code: '    else:' },
          { code: '        print("@")' }
        ]
      }).root
    );

    refs.predictGroup = ui.radioGroup({
      name: 'p5-predict',
      legend: '실행 결과 예측',
      value: st().predict,
      options: CANDIDATES.map(function (cand) {
        return {
          value: cand.id,
          label: '후보 ' + cand.id,
          sub:
            '<span class="pat-mini">' +
            cand.lines
              .map(function (line) {
                return ui.escapeHtml(P.spaceView(line));
              })
              .join('<br />') +
            '</span>'
        };
      }),
      onChange: function (v) {
        st().predict = v;
        L.state.markChanged();
      }
    });
    panel.body.appendChild(refs.predictGroup.root);
    refs.predictFeedback = ui.createFeedback({ emptyText: '후보를 하나 고르고 [예측 제출] 을 누르세요.' });
    panel.body.appendChild(
      ui.buttonRow([
        ui.button({
          label: '예측 제출',
          onClick: function () {
            if (!st().predict) {
              refs.predictFeedback.show('warning', '! 후보를 하나 골라 주세요.');
              return;
            }
            st().predictDone = true;
            L.state.markChanged();
            var ok = st().predict === 'A';
            refs.predictGroup.clearMarks();
            refs.predictGroup.mark('A', 'correct');
            if (!ok) refs.predictGroup.mark(st().predict, 'wrong');
            refs.predictFeedback.show(
              ok ? 'success' : 'info',
              ok
                ? '✓ 맞았어요. 정답은 <strong>후보 A</strong> 입니다. 2번 줄은 공백 4칸 뒤에 @ 가 옵니다.'
                : '정답은 <strong>후보 A</strong> 예요. 짝수 행은 <code>@@@@@</code>, 1번 행은 공백 4칸 뒤 @, ' +
                    '3번 행은 <code>@</code> 하나입니다. 예측이 틀려도 코드 활동은 그대로 진행하세요.'
            );
          }
        })
      ])
    );
    panel.body.appendChild(refs.predictFeedback.root);
    return panel.root;
  }

  /* ------------------------------------------------------------------ */
  function render(container) {
    container.appendChild(
      ui.stepHeader({
        step: 5,
        title: '내가 찾은 규칙을 코드로 만들기',
        lead: [
          '이제 행의 규칙을 <strong>조건식</strong>과 <strong>출력식</strong>으로 바꾸어 텍스트 도형을 직접 완성합니다.'
        ]
      })
    );

    container.appendChild(buildPredict());

    /* 프로젝트 1 — 기본 과제 */
    var proj = ui.panel({
      title: '프로젝트 1 — 기본 과제',
      hint: '빈칸 6곳을 채우면 자동으로 채점합니다. 점수는 100점 만점이고 <strong>60점 이상이면 이수</strong>예요.'
    });

    var codeNode = el('div', { 'class': 'stack' });
    var ruleNode = el('div', { 'class': 'stack' });
    var outNode = el('div', { 'class': 'stack' });

    refs.modeTabs = ui.tabs({
      value: st().mode,
      ariaLabel: '입력 모드 전환',
      items: [
        { id: 'token', label: '토큰 조립 모드' },
        { id: 'direct', label: '직접 입력 모드' }
      ],
      onChange: setMode
    });
    codeNode.appendChild(refs.modeTabs.root);

    var store = function () {
      return st().spec;
    };
    var cv = L.codeview.createCodeView({
      showLineNumbers: true,
      ariaLabel: '기본 과제 코드 빈칸',
      lines: [
        { parts: ['for i in ', makeBlank(BLANKS[0], store, refs.inputs, 'tokenBox'), ':'], indent: 0 },
        { parts: ['if ', makeBlank(BLANKS[1], store, refs.inputs, 'tokenBox'), ':'], indent: 4 },
        { parts: ['print("@" * ', makeBlank(BLANKS[2], store, refs.inputs, 'tokenBox'), ')'], indent: 8 },
        { parts: ['elif ', makeBlank(BLANKS[3], store, refs.inputs, 'tokenBox'), ':'], indent: 4 },

    refs.projFeedback = ui.createFeedback({

  function paintExpected() {

    refs.expectedBox.appendChild(

    <script data-from="js/65-step6.js">
/**

 *
 *   · 문항 · 정답 · 해설은 45-quiz.js(문항 은행) 하나만 본다. 여기서 다시 적지 않는다.
 *   · 채점 전에는 정답과 해설을 절대 노출하지 않는다(명세 1.2 · 15.1).
 *   · 학번·이름이 없어도 학습·채점·해설·재도전이 모두 가능하다(명세 14장).
 *     그래서 1차시와 달리 «문제 풀이 잠금(quiz-gate)» 은 두지 않는다.
 *   · 제출 실패가 학습과 채점을 막지 않는다(명세 23.3).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var QUIZ = L.quiz;
  var P = L.pattern;

  /** ③ 학습 정리 — 오늘 배운 내용 요약 */
  var SUMMARY_LINES = [

    '중첩 반복문의 내부 실행 횟수는 <strong>바깥 반복 횟수 × 안쪽 반복 횟수</strong>다. (3 × 5 = 15)',
    '두 목록의 모든 조합은 첫 목록의 값 하나마다 두 번째 목록의 <strong>모든 값</strong>을 연결해 만들므로 개수는 <strong>곱</strong>이다.',
    '<code>print()</code>가 <strong>안쪽 반복 밖</strong>에 있으면 바깥 값마다 한 줄, <strong>안쪽에</strong> 있으면 조합마다 한 줄이 된다.',
    '텍스트 도형은 <strong>행을 분류 → 규칙 찾기 → 조건문으로 표현</strong> 순서로 만들고, <strong>공백도 출력의 일부</strong>다.'
  ];

  var KEYWORDS = [
    ['중첩 반복문', '반복 안의 반복'],

    ['실행 횟수', '바깥 × 안쪽'],

  var refs = {};

  var gradeUnlocked = false;

    return L.state.appState.step5;
  }

  /* ------------------------------------------------------------------ */
  /* 판정 · 성취 수준                                                      */

  function verdictOf(score) {
    if (score >= QUIZ.MAX_SCORE) return { icon: '🎉', text: '만점이에요. 단원 내용을 정확히 이해했습니다.' };
    if (score >= QUIZ.PASS_SCORE) return { icon: '✅', text: '이수 기준(8점)을 넘었어요. 틀린 영역만 다시 확인해 보세요.' };
    return { icon: '💪', text: '보충 학습 대상이에요. 아래 오답 해설과 보충 화면으로 다시 확인해 보세요.' };
  }

  /** 12점 만점 기준 성취 수준 */
  function levelOf(score) {
    if (score >= 12) return { grade: '상', judgement: '4문항을 모두 맞혔어요.' };
    if (score >= 10) return { grade: '중상', judgement: '대부분의 영역을 이해했어요.' };
    if (score >= 8) return { grade: '중', judgement: '이수 기준을 넘었어요.' };
    return { grade: '하', judgement: '보충 학습이 필요해요.' };
  }

  function studentLabel() {
    var id = String(st().student.id || '').trim();
    var name = String(st().student.name || '').trim();
    if (!id && !name) return '';
    return (id ? '학번 ' + id : '') + (id && name ? ' · ' : '') + (name ? '이름 ' + name : '');
  }

  /* ------------------------------------------------------------------ */
  /* 응시자 정보 카드 (명세 14장)                                            */
  /* ------------------------------------------------------------------ */
  function studentField(opts) {
    var input = el('input', {
      type: 'text',
      'class': 'student-field__input',
      id: opts.id,
      value: opts.value || '',
      maxLength: opts.maxLength,
      attrs: {
        inputmode: opts.inputmode || undefined,
        autocomplete: 'off',
        placeholder: opts.placeholder || '',
        'aria-label': opts.label
      }
    });
    input.addEventListener(
      'input',
      ui.debounce(function () {
        opts.onInput(input.value);
        updateStudentUI();
      }, 300)
    );
    return {
      input: input,
      root: el('div', { 'class': 'student-field' }, [
        el('label', { 'class': 'student-field__label', text: opts.label, htmlFor: opts.id }),
        input
      ])
    };
  }

  function buildStudentCard(container) {
    var idField = studentField({
      id: 'step6-student-id',
      label: '학번 (숫자 3~10자리)',
      inputmode: 'numeric',
      maxLength: 10,
      placeholder: '예) 10312',
      value: st().student.id || '',
      onInput: function (v) {
        st().student.id = v.replace(/[^0-9]/g, '');
        L.state.markChanged();
      }
    });
    var nameField = studentField({
      id: 'step6-student-name',
      label: '이름 (20자 이내)',
      maxLength: 20,
      placeholder: '예) 김정보',
      value: st().student.name || '',
      onInput: function (v) {
        st().student.name = v;
        L.state.markChanged();
      }
    });
    refs.idField = idField;
    refs.nameField = nameField;

    refs.studentNote = el('p', {
      'class': 'student-card__note',
      attrs: { 'aria-live': 'polite' }
    });
    refs.studentCard = el('div', { 'class': 'student-card' }, [
      el('div', { 'class': 'student-card__head' }, [
        el('span', { 'class': 'student-card__title', text: '👤 응시자 정보' }),
        el('span', { 'class': 'student-card__badge', text: '선택 · 제출할 때만 필요' })
      ]),
      el('div', { 'class': 'student-card__fields' }, [idField.root, nameField.root]),
      refs.studentNote,
      el('p', {
        'class': 'student-card__privacy',
        text:
          '학번과 이름은 이 기기에만 저장되고, [답안 제출하기] 를 눌러 선생님께 보낼 때만 함께 전송돼요. ' +
          '비워 두어도 학습 · 채점 · 해설 · 재도전 · 기록 내려받기는 모두 할 수 있어요.'
      })
    ]);
    container.appendChild(refs.studentCard);
    updateStudentUI();
  }

    if (!refs.studentCard) return;
    var problem = validStudent();

    refs.studentCard.classList.toggle('is-ready', !problem);

  /* ------------------------------------------------------------------ */
  /* ① 형성평가 문항 (한 번에 한 문항 · 명세 15.1)                            */
  /* ------------------------------------------------------------------ */
  function currentQuestion() {
    var order = st().order || QUIZ.orderFor(0);

  function buildDots() {
    ui.clear(refs.quizDots);

  function renderQuestion() {

    // 제출을 마치면 답안을 고칠 수 없다(명세 23.1). [다시 풀기] 를 누르면 다시 풀 수 있다.

    refs.quizBody.appendChild(
      el('div', { 'class': 'quiz__tags' }, [
        ui.badge('primary', q.category),
        ui.badge('primary', q.lessonRef),

    );
    refs.quizBody.appendChild(
      el('p', { 'class': 'quiz__question' }, [
