    <!-- 스타일은 나열한 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다. -->
    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 11.3 색상 토큰 / 11.4 타이포그래피 / 11.7 애니메이션 시간
 * 외부 폰트를 불러오지 않고 시스템 글꼴 스택으로 대체한다(명세 16장).
 * ------------------------------------------------------------------ */
:root {
  /* 색상 토큰 (명세 11.3) */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-true: #059669;
  --color-false: #d97706;
  --color-error: #dc2626;
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  /* 어두운 출력 창 위에서 대비비 4.5:1 을 확보한 오류·해설 색 (13.3) */
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;
  --color-code-bg: #f1f5f9;
  --color-indent-guide: #94a3b8;

  /* 파생 색상 (대비비 4.5:1 이상 유지) */
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;
  --color-true-soft: #ecfdf5;
  --color-true-dark: #047857;
  --color-false-soft: #fffbeb;
  --color-false-dark: #b45309;
  --color-error-soft: #fef2f2;
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 타이포그래피 (명세 11.4) */
  --font-sans: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: D2Coding, 'D2Coding ligature', Consolas, 'Cascadia Mono', 'SFMono-Regular',
    Menlo, 'Nanum Gothic Coding', monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* 간격 · 형태 */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 (명세 11.7) */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;
  --dur-seq-step: 800ms;
  --dur-flow-node: 700ms;

  /* 터치 대상 최소 크기 (명세 11.5) */
  --touch-min: 44px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 11.7 : prefers-reduced-motion 설정 시 모든 애니메이션을 즉시 전환으로 대체 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

    <style data-from="styles/base.css">
/* ------------------------------------------------------------------
 * 기본 리셋 · 앱 골격 (명세 11.1 화면 골격 / 11.2 진행 상태 표시)
 * ------------------------------------------------------------------ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}

.skip-link:focus {
  left: 0;
}

/* ---------------------------- 앱 골격 ---------------------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-main {
  flex: 1 1 auto;
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

@media (max-width: 767px) {
  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
}

/* ------------------------ 상단 진행 표시 바 ------------------------ */
.app-progress {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--color-border);
}

.app-progress__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-5);
}

.stepper {
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__list {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: 1 1 auto;
  min-width: 0;
}

.stepper__item + .stepper__item::before {
  content: '';
  flex: 1 1 auto;
  height: 2px;
  min-width: 8px;
  background: var(--color-border);
  border-radius: 2px;
}

.stepper__item.is-done + .stepper__item::before,
.stepper__item.is-current::before {
  background: var(--color-primary);
}

.stepper__node {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--dur-highlight) ease, background-color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, color var(--dur-highlight) ease;
}

/* 11.5 : 원 모양은 그대로 두고 터치 영역만 44 × 44 px 로 넓힌다 */
.stepper__node::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
}

.stepper__item.is-done .stepper__node {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.stepper__item.is-current .stepper__node {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-soft);
  transform: scale(1.18);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.stepper__item.is-locked .stepper__node {
  cursor: not-allowed;
  opacity: 0.55;
}

.stepper__label {
  font-size: 12px;
  color: var(--color-text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stepper__item.is-current .stepper__label {
  color: var(--color-primary);
  font-weight: 700;
}

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

.app-progress__meter {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.app-progress__count {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.app-progress__count-sep {
  color: var(--color-border-strong);
}

.progressbar {
  width: 140px;
  height: 8px;
  border-radius: 99px;
  background: var(--color-muted-bg);
  overflow: hidden;
}

.progressbar__fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--color-primary), #60a5fa);
  transition: width var(--dur-progress) ease;
}

@media (max-width: 767px) {
  .app-progress__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }
}

/* 11.5 : 태블릿(768~1023px) — 좌우 2단은 유지하고 여백만 줄인다 */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-main {
    padding: var(--space-5) var(--space-3) var(--space-6);
  }

  .app-progress__inner,
  .app-nav__inner {
    padding-left: var(--space-3);
    padding-right: var(--space-3);
  }

  .split,
  .split--wide-left {
    gap: var(--space-3);
  }

  .panel {
    padding: var(--space-3);
  }
}

/* ------------------------ 하단 이동 버튼 바 ------------------------ */
.app-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}

.app-nav__inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.app-nav__hint {
  flex: 1 1 auto;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  min-height: 1.2em;
}

.app-nav--start .app-nav__inner #btn-prev {
  display: none;
}

@media (max-width: 767px) {
  .app-nav__inner {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-2);
  }

  .app-nav__hint {
    font-size: 12px;
  }
}

/* ------------------------- 단계 화면 전환 ------------------------- */
.step-screen {
  display: none;
}

.step-screen.is-active {
  display: block;
  animation: screen-fade var(--dur-screen) ease;
}

@keyframes screen-fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
    </style>
    <style data-from="styles/components.css">
/* ------------------------------------------------------------------
 * 공용 컴포넌트 (명세 11.6 버튼 유형 / 4.1 공통 요소 / 3.3 들여쓰기 시각화)
 * ------------------------------------------------------------------ */

/* ------------------------------ 헤더 ------------------------------ */
.step-header {
  margin-bottom: var(--space-5);
}

.step-header__eyebrow {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.step-header__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.step-header__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.step-header__lead p + p {
  margin-top: var(--space-1);
}

.step-header__lead strong {
  color: var(--color-primary-dark);
}

/* ---- 활동 머리말 (한 화면에 활동이 여러 개일 때 · 5단계 활동 1·2) ----
   두 활동이 같은 모양이어야 하므로 칩·제목·핵심 설명 상자를 한곳에서 정의한다. */
.act-head {
  margin-bottom: var(--space-5);
}

.act-head--divided {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 2px dashed var(--color-border-strong);
}

.act-head__tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.act-head__title {
  margin-top: var(--space-2);
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
}

.act-head__sub {
  margin-top: 2px;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 꼭 읽어야 하는 안내 — 작은 회색 글씨로는 지나치기 쉬워 상자로 눈에 띄게 한다 */
.act-head__notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--space-2);
  padding: 7px 13px;
  border: 1px solid var(--color-false);
  border-left: 4px solid var(--color-false);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  color: var(--color-false-dark);
  font-size: var(--fs-base);
  font-weight: 700;
}

.act-head__notice-icon {
  font-size: 15px;
}

.act-head__lead {
  margin-top: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.act-head__lead p + p {
  margin-top: var(--space-1);
}

.act-head__lead strong {
  color: var(--color-primary-dark);
}

/* ------------------------------ 패널 ------------------------------ */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.panel--muted {
  background: var(--color-muted-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

/* 11.5 : ≥1024px 좌우 2단 / <768px 상하 1단 */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}

@media (max-width: 767px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-width: 0;
}

/* 11.5 : flex 항목의 자동 최소 크기 때문에 넓은 자식(코드·흐름도)이 화면을 밀어내지 않게 한다 */
.stack > * {
  min-width: 0;
}

.stack--lg {
  gap: var(--space-5);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

/* ------------------------------ 버튼 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--secondary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--ghost {
  color: var(--color-text-sub);
  background: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--danger {
  border-color: var(--color-error);
  color: var(--color-error);
  background: var(--color-surface);
}

.btn--danger:hover:not(:disabled) {
  background: var(--color-error-soft);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--sm {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

/* 11.6 Disabled : 투명도 0.45 + not-allowed 커서 */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* --------------------------- 입력 컨트롤 --------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.field__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.num-input {
  width: 96px;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.num-input:hover {
  border-color: var(--color-primary);
}

.slider {
  flex: 1 1 160px;
  min-width: 120px;
  height: var(--touch-min);
  accent-color: var(--color-primary);
  cursor: pointer;
}

.select {
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);

}

/* ===================== 실행 추적표 (7.4 · 8.2) ===================== */
.trace-table th,
.trace-table td {
  text-align: center;
  font-family: var(--font-mono);
}

.trace-table thead th {
  font-family: var(--font-sans);
}

.trace-row {
  animation: screen-fade var(--dur-highlight) ease;
}

.trace-row:last-child td,
.trace-row:last-child th {
  background: var(--color-primary-soft);
}

.trace-table__empty {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ===================== 누적 출력 창 (11.5) ===================== */
.outpane {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.outpane__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.outpane__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.outpane__body {
  margin: 0;
  min-height: 86px;
  max-height: 260px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.outpane__body.is-empty {
  color: #64748b;
}

/* ===================== 재생 컨트롤 (7.4) ===================== */
.loop-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.loop-controls__speed {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.loop-controls__speed-label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== range 생성기 (7.3) ===================== */
.range-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .range-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.range-fields .num-input {
  width: 100%;
}

/* ===================== 예측 활동 (7.5) ===================== */
.predict-area {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.predict-slot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: 64px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.predict-slot.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.predict-slot__empty {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.predict-pool {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.numcard {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: all var(--dur-highlight) ease;
}

.numcard:hover:not(:disabled) {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.numcard:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.numcard--placed {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  cursor: default;
}

/* ===================== while 흐름 고리 (8.2) ===================== */
.flowring {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.flowring__node {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-2) var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: 99px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  transition: all var(--dur-highlight) ease;
}

.flowring__node + .flowring__node::before {
  content: '→';
  position: absolute;
  margin-left: -22px;
  color: var(--color-border-strong);
}

.flowring__node.is-active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.05);
  box-shadow: var(--shadow);
}

.flowring__icon {
  font-size: 15px;
}

/* ===================== 구조 비교 카드 (8.1) ===================== */
.struct-card {
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-primary);
  background: var(--color-primary-soft);
}

.struct-card--while {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.struct-card__title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.struct-card__flow {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* ===================== 주석 토글 (8.4) ===================== */
.toggle-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.toggle-line__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 핵심 카드 ===================== */
.key-card {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-console-bg);
  color: var(--color-console-text);
}

.key-card__icon {
  font-size: 22px;
}

.key-card__text strong {
  color: var(--color-hint-on-dark);
}

/* ===================== 로봇 트랙 (9.1) ===================== */
.robot-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.robot-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  overflow-x: auto;
}

.robot {
  position: absolute;
  left: var(--space-2);
  top: 2px;
  font-size: 22px;
  transition: transform var(--dur-seq-step) cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 2;
}

.robot-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  margin-top: 18px;
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-text-sub);
}

.robot-cell.is-passed {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.robot-cell.is-here {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
}

.robot-track__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ===================== 상황 카드 분류 (9.2) ===================== */
.card-tray {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 72px;
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
}

.card-tray__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.dropzone {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  transition: all var(--dur-highlight) ease;
}

.dropzone--for {
  border-color: var(--color-primary);
}

.dropzone--while {
  border-color: var(--color-false);
}

.dropzone.is-over {
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
}

.dropzone__head {
  display: flex;
  flex-direction: column;
}

.dropzone__title {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 800;
}

.dropzone__sub {
  font-size: 12px;
  color: var(--color-text-sub);
}

.dropzone__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 60px;
}

.situ-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}

.situ-card.is-dragging {
  opacity: 0.5;
}

.situ-card__text {
  font-size: var(--fs-small);
  font-weight: 600;
}

.situ-card__mark {
  font-weight: 900;
}

.situ-card__buttons {
  display: flex;
  gap: var(--space-2);
}

.situ-card.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.situ-card.is-correct .situ-card__mark {
  color: var(--color-true-dark);
}

.situ-card.is-wrong {
  border-style: dashed;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.situ-card.is-wrong .situ-card__mark {
  color: var(--color-error);
}

/* ===================== 누적값 시각화 (9.4) ===================== */
.accum-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.accum-steps__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.accum-step {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  animation: screen-fade var(--dur-highlight) ease;
}

.accum-step__i {
  flex: 0 0 auto;
  min-width: 64px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.accum-step__calc {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
}

.accum-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.accum-chain__value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  animation: varbox-pop 420ms ease;
}

.accum-chain__arrow {
  color: #94a3b8;
  font-weight: 800;
}

/* ===================== 빈칸 코드 입력 (9.5 · 10.6) ===================== */
.blank-input,
.answer-line {
  min-height: 40px;
  padding: 0 var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  border-width: 2px;
  border-style: dashed;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.answer-line {
  border-style: solid;
}

.num-input.is-correct {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.num-input.is-wrong {
  border-style: solid;
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

/* ===================== 코드 + 줄별 설명 (9.6) =====================
   가운데 코드 칸의 너비는 «가장 긴 코드 줄» 에 맞춘다(max-content).
   남은 자리를 설명이 모두 쓰므로, 코드 상자가 필요 이상으로 넓어지지 않는다. */
.linenotes {
  display: grid;
  grid-template-columns: auto max-content minmax(0, 1fr);
  align-items: stretch;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow-x: auto;
  line-height: 1.9;
}

.linenotes__num,
.linenotes__code {
  background: var(--color-code-bg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.linenotes__num {
  padding: 2px var(--space-2);
  text-align: right;
  color: #94a3b8;
  user-select: none;
}

.linenotes__code {
  padding: 2px var(--space-4) 2px var(--space-1);
  white-space: pre;
}

.linenotes__desc {
  display: flex;
  align-items: center;
  padding: 2px var(--space-3);
  border-left: 1px dashed var(--color-border-strong);
  background: var(--color-surface);
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  line-height: 1.5;
}

/* 줄 사이 구분선. 마지막 줄에는 넣지 않는다(바깥 테두리와 겹친다). */
.linenotes > * {
  border-bottom: 1px solid var(--color-border);
}

.linenotes > *:nth-last-child(-n + 3) {
  border-bottom: none;
}

/* 모바일에서는 설명을 코드 아래 줄로 내린다 */
@media (max-width: 767px) {
  .linenotes {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .linenotes__desc {
    grid-column: 1 / -1;
    border-left: none;
    border-top: 1px dashed var(--color-border-strong);
    padding: var(--space-2) var(--space-3);
  }

  .linenotes__desc.is-empty {
    display: none;
  }
}

/* ===================== 용어 설명 · 묻고 답하기 (9.6) ===================== */
/* 교과 자료의 「용어 설명」 상자와 같은 모양으로 맞춘다. */
.term-card {
  padding: var(--space-3) var(--space-4);
  border-left: 5px solid var(--color-text);
  background: var(--color-muted-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.term-card__title {
  font-size: 17px;
  font-weight: 800;
}

.term-card__desc {
  margin-top: 2px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.qa {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: var(--fs-small);
  line-height: 1.75;
}

.qa__row {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
}

.qa__mark {
  flex: 0 0 auto;
  width: 1.4em;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
}

.qa__mark--q {
  color: var(--color-true-dark);
}

.qa__mark--a {
  color: var(--color-error);
}

.qa__row--q {
  font-weight: 700;
}

/* ===================== 안전 장치 안내 (11.6) ===================== */
/* 무한 반복 예제에서 반드시 읽어야 하는 문구라 상자로 크게 보인다. */
.safety-notice {
  display: flex;
  width: 100%;
  font-size: 15px;
}

/* ===================== 무작위 뽑기 (9.6) ===================== */
.dice-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.dice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-size: 17px;
  font-weight: 800;
  animation: dice-roll 600ms ease infinite;
}

.dice.is-done {
  animation: none;
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
}

@keyframes dice-roll {
  0%,
  100% {
    transform: rotate(-8deg);
  }
  50% {
    transform: rotate(8deg);
  }
}

/* ===================== 형성평가 (10장) ===================== */
.quiz-item .panel__title {
  align-items: flex-start;
  line-height: 1.5;
}

.expected {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.expected__title {
  padding: 4px var(--space-3);
  background: var(--color-muted-bg);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.expected__body {
  margin: 0;
  padding: var(--space-3);
  background: var(--color-surface);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  white-space: pre-wrap;
}

/* 문항 진행 표시 (문항 n / 5) */
.quiz-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.quiz-progress__text {
  font-weight: 800;
  color: var(--color-primary-dark);
}

.quiz-progress__dots {
  display: flex;
  gap: var(--space-2);
}

.quiz-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.quiz-dot.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.quiz-dot.is-current {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: #fff;
  transform: scale(1.1);
}

/* 문항 아래 버튼 줄 (이전 · 다음 · 채점 · 제출) */
.quiz-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.quiz-nav__hint {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
  min-height: 1.4em;
}

.quiz-retry {
  margin-top: var(--space-3);
}

/* 제출 결과 안내 */
.submit-note {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-true);
  border-left-width: 5px;
  background: var(--color-true-soft);
  font-size: var(--fs-small);
  line-height: 1.7;
}

.submit-note code {
  font-family: var(--font-mono);
  font-weight: 700;
}

/* 제출 대화상자의 오류 문구 */
.modal__error {
  margin-top: var(--space-2);
  color: var(--color-error);
  font-size: var(--fs-small);
  font-weight: 700;
  min-height: 1.2em;
}

@media (max-width: 767px) {
  .quiz-nav .btn {
    flex: 1 1 46%;
  }
}

.quiz-review {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-muted-bg);
  font-size: var(--fs-small);
}

.quiz-review.is-correct {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}

.quiz-review.is-wrong {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}

.quiz-review__head {
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.quiz-review__rows dt {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
  margin-top: var(--space-2);
}

.quiz-review__rows dd {
  margin: 2px 0 0;
}

.pre-line {

  L.nav.goToStep = function (step, options) {

  L.nav.isReady = function () {
    return typeof navigate === 'function';
  };
})();

  /** 라디오 카드 그룹 (True/False 선택 등) */
  function radioGroup(opts) {
    var o = opts || {};
    var options = o.options || [];
    var items = options.map(function (opt) {
      var input = el('input', {
        type: 'radio',
        name: o.name,
        value: String(opt.value),
        checked: String(opt.value) === String(o.value),
        attrs: { 'aria-label': opt.ariaLabel || opt.label }
      });
      var wrap = el('label', { 'class': ('choice ' + (opt.className || '')).trim() }, [
        input,
        el('span', { 'class': 'choice__body' }, [
          el('span', { 'class': 'choice__label', html: opt.label }),
          opt.sub ? el('span', { 'class': 'choice__sub', html: opt.sub }) : null
        ])
      ]);
      input.addEventListener('change', function () {
        if (!input.checked) return;
        update(opt.value);
        if (o.onChange) o.onChange(opt.value);
      });
      return { opt: opt, input: input, wrap: wrap };
    });

    function update(next) {
      items.forEach(function (item) {
        var on = String(item.opt.value) === String(next);
        item.input.checked = on;
        item.wrap.classList.toggle('is-selected', on);
      });
    }

    var root = el(
      'div',
      { 'class': 'choice-group', attrs: { role: 'radiogroup', 'aria-label': o.legend } },
      items.map(function (i) {
        return i.wrap;
      })
    );
    update(o.value === undefined ? null : o.value);

    return {
      root: root,
      setValue: update,
      getValue: function () {
        for (var i = 0; i < items.length; i += 1) {
          if (items[i].input.checked) return items[i].opt.value;
        }
        return null;
      },
      /** 정답/오답 표시를 지운다(다시 풀기). */
      clearMarks: function () {
        items.forEach(function (item) {
          item.wrap.classList.remove('is-correct', 'is-wrong');
        });
      },
      /** 특정 선택지에 정답/오답 표시를 붙인다. */
      mark: function (value, kind) {
        items.forEach(function (item) {
          if (String(item.opt.value) !== String(value)) return;
          item.wrap.classList.toggle('is-correct', kind === 'correct');
          item.wrap.classList.toggle('is-wrong', kind === 'wrong');
        });
      },
      setDisabled: function (flag) {
        items.forEach(function (item) {
          item.input.disabled = Boolean(flag);
        });
      }
    };
  }

  function tabs(opts) {
    var o = opts || {};
    var items = o.items || [];
    var buttons = items.map(function (item) {
      return el('button', {
        type: 'button',
        'class': 'tab',
        text: item.label,
        dataset: { id: item.id },
        attrs: { role: 'tab', 'aria-selected': String(item.id === o.value) },
        on: {
          click: function () {
            setValue(item.id);
            if (o.onChange) o.onChange(item.id);
          }
        }
      });
    });
    function setValue(next) {
      buttons.forEach(function (btn) {
        var on = btn.dataset.id === next;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', String(on));
      });
    }
    var root = el(
      'div',
      { 'class': 'tabs', attrs: { role: 'tablist', 'aria-label': o.ariaLabel || '보기 전환' } },
      buttons
    );
    setValue(o.value !== undefined && o.value !== null ? o.value : items[0] ? items[0].id : null);
    return { root: root, setValue: setValue };
  }

  /**
   * 좁은 화면(768px 미만)에서만 켜지는 구역 탭 (명세 51장)
   *   768px 이상에서는 탭 줄을 숨기고 모든 구역을 한 화면에 나란히 보여 준다.
   *   768px 미만에서는 [코드] [규칙] [출력] 처럼 한 구역씩만 보여 준다.
   *
   * items: Array<{ id, label, node }>
   */
  function mobileTabs(opts) {
    var o = opts || {};
    var items = (o.items || []).filter(function (item) {
      return item && item.node;
    });
    var current = items.length ? items[0].id : null;

    var query =
      typeof window.matchMedia === 'function' ? window.matchMedia('(max-width: 767px)') : null;

    var buttons = items.map(function (item) {
      return el('button', {
        type: 'button',
        'class': 'tab',
        text: item.label,
        dataset: { id: item.id },
        attrs: { role: 'tab', 'aria-selected': String(item.id === current) },
        on: {
          click: function () {
            setActive(item.id);
          }
        }
      });
    });

    var bar = el(
      'div',
      {
        'class': 'tabs mtabs__bar',
        attrs: { role: 'tablist', 'aria-label': o.ariaLabel || '구역 전환' }
      },
      buttons
    );

    var root = el('div', { 'class': 'mtabs' }, [bar].concat(
      items.map(function (item) {
        item.node.classList.add('mtabs__panel');
        item.node.dataset.mtab = item.id;
        return item.node;
      })
    ));

    function isMobile() {
      return query ? query.matches : window.innerWidth < 768;
    }

    function paint() {
      var mobile = isMobile();
      bar.style.display = mobile ? '' : 'none';
      items.forEach(function (item) {
        var on = !mobile || item.id === current;
        item.node.classList.toggle('is-mtab-hidden', !on);
      });
      buttons.forEach(function (btn) {
        var on = btn.dataset.id === current;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', String(on));
      });
    }

    function setActive(id) {
      current = id;
      paint();
    }

    // 좌우 화살표로도 이동할 수 있게 한다(명세 52장).
    bar.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var index = items.findIndex(function (item) {
        return item.id === current;
      });
      var next = (index + (e.key === 'ArrowRight' ? 1 : items.length - 1)) % items.length;
      setActive(items[next].id);
      buttons[next].focus();
      e.preventDefault();
    });

    if (query) {
      if (typeof query.addEventListener === 'function') query.addEventListener('change', paint);
      else if (typeof query.addListener === 'function') query.addListener(paint);
    }
    // 창 크기 변경(화면 회전 · 창 조절)에도 반드시 다시 그린다.
    window.addEventListener('resize', debounce(paint, 150));
    paint();

    return { root: root, setActive: setActive, isMobile: isMobile };
  }

  /** 숫자 입력 + 슬라이더 */
  function numberField(opts) {
    var o = opts || {};
    var min = o.min === undefined ? 0 : o.min;
    var max = o.max === undefined ? 100 : o.max;
    var step = o.step === undefined ? 1 : o.step;
    var value = o.value === undefined ? 0 : o.value;
    var withSlider = o.withSlider !== false;

    var input = el('input', {
      type: 'number',
      'class': 'num-input',
      min: min,
      max: max,
      step: step,
      value: String(value),
      id: o.id,
      attrs: { 'aria-label': o.label, inputmode: 'numeric' }
    });
    var slider = withSlider
      ? el('input', {
          type: 'range',
          'class': 'slider',
          min: min,
          max: max,
          step: step,
          value: String(value),
          attrs: { 'aria-label': (o.label || '값') + ' 슬라이더' }
        })
      : null;

    var current = value;

    function apply(next, from) {
      var n = Number(next);
      if (isNaN(n)) return;
      n = Math.min(max, Math.max(min, n));
      current = n;
      if (from !== 'input') input.value = String(n);
      if (slider && from !== 'slider') slider.value = String(n);
      if (o.onChange) o.onChange(n);
    }

    input.addEventListener('input', function () {
      var raw = input.value;
      if (raw === '' || raw === '-') return;
      apply(raw, 'input');
    });
    input.addEventListener('blur', function () {
      apply(input.value === '' ? current : input.value);
    });
    if (slider) {
      slider.addEventListener('input', function () {
        apply(slider.value, 'slider');
      });
    }

    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [
        input,
        o.suffix ? el('span', { text: o.suffix }) : null,
        slider
      ])
    ]);

    return {
      root: root,
      input: input,
      slider: slider,
      getValue: function () {
        return current;
      },
      setValue: function (v) {
        apply(v);
      }
    };
  }

  /** 한 줄 텍스트 입력 (이번 차시 추가 헬퍼) */
  function textField(opts) {
    var o = opts || {};
    var input = el('input', {
      type: 'text',
      'class': ('num-input ' + (o.className || '')).trim(),
      id: o.id,
      value: o.value === undefined || o.value === null ? '' : String(o.value),
      placeholder: o.placeholder || '',
      style: o.width ? { width: o.width, textAlign: o.align || 'center' } : null,
      attrs: {
        'aria-label': o.label || o.placeholder || '입력',
        inputmode: o.inputmode || undefined,
        maxlength: o.maxLength || undefined
      }
    });

    if (o.onEnter) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') o.onEnter(input.value);
      });
    }
    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      el('div', { 'class': 'field__row' }, [input, o.suffix ? el('span', { text: o.suffix }) : null])
    ]);
    return {
      root: root,
      input: input,
      getValue: function () {
        return input.value;
      },
      setValue: function (v) {
        input.value = v === undefined || v === null ? '' : String(v);
      }
    };

  /** 여러 줄 입력 (생각해 보기 · 학습 정리 문장 완성 · 이번 차시 추가 헬퍼) */
  function textAreaField(opts) {
    var o = opts || {};
    var input = el('textarea', {
      'class': 'textarea' + (o.code ? ' textarea--code' : ''),
      id: o.id,
      value: o.value === undefined || o.value === null ? '' : String(o.value),
      placeholder: o.placeholder || '',
      rows: o.rows || 3,
      attrs: { 'aria-label': o.label || o.placeholder || '입력' }
    });
    if (o.onInput) {
      input.addEventListener('input', function () {
        o.onInput(input.value);
      });
    }
    var root = el('div', { 'class': 'field' }, [
      o.label ? el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }) : null,
      input
    ]);
    return {
      root: root,
      input: input,
      getValue: function () {

      setValue: function (v) {

  /** 드롭다운 (실행 추적표 셀 등 · 이번 차시 추가 헬퍼) */

      );
    });
    if (o.value !== undefined && o.value !== null) sel.value = String(o.value);
    if (o.onChange) {
      sel.addEventListener('change', function () {
        o.onChange(sel.value);
      });
    }
    return {
      root: o.label
        ? el('div', { 'class': 'field' }, [
            el('label', { 'class': 'field__label', text: o.label, htmlFor: o.id }),

      select: sel,
      getValue: function () {

      },

        sel.value = v === undefined || v === null ? '' : String(v);
      }

  /* ------------------------ 실행 결과 출력 창 ------------------------ */
  function createConsole(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '실행 버튼을 누르면 결과가 여기에 표시돼요.';
    var body = el('div', {
      'class': 'console__body',

    function showEmpty() {

    function line(text, modifier) {

    return {
      root: root,
      body: body,
      write: function (text) {

      writeMuted: function (text) {

      },
      writeError: function (text) {

      },
      writeHint: function (text) {
        return line(text, 'console__line--hint');

      clear: showEmpty,
      isEmpty: function () {
        return Boolean(body.querySelector('.console__empty'));

    };

  /* ------------------------ 피드백 영역 ------------------------ */
  var FEEDBACK_ICON = { success: '✅', info: '💡', warning: '⚠️', error: '❌' };

  function createFeedback(opts) {
    var o = opts || {};
    var emptyText = o.emptyText || '조작하면 이곳에 안내가 표시돼요.';
    var icon = el('span', { 'class': 'feedback__icon', text: '💬' });
    var textNode = el('div', { 'class': 'feedback__text', text: emptyText });
    var root = el('div', {
      'class': 'feedback is-empty',

    });
    root.appendChild(icon);
    root.appendChild(textNode);

    return {
      root: root,
      /**
       * @param {'success'|'info'|'warning'|'error'} type
       * @param {string} html 표시할 내용(HTML 허용)
       * @param {string} [customIcon] 🎉 · 🏅 등 다른 아이콘을 쓰고 싶을 때
       */
      show: function (type, html, customIcon) {
        root.className = 'feedback feedback--' + type;
        icon.textContent = customIcon || FEEDBACK_ICON[type] || '💬';
        textNode.innerHTML = html;
      },
      clear: function () {
        root.className = 'feedback is-empty';
        icon.textContent = '💬';
        textNode.textContent = emptyText;

  /* ------------------------------ 배지 · 표 ------------------------------ */
  function badge(kind, text) {
    var map = { 'true': 'badge--true', 'false': 'badge--false', primary: 'badge--primary' };

  }

  function boolBadge(value) {

  function dataTable(opts) {
    var o = opts || {};
    var head = o.head || [];
    var rows = o.rows || [];

      o.caption ? el('caption', { 'class': 'sr-only', text: o.caption }) : null,

        el(
          'tr',

            return el('th', { scope: 'col', html: h });

        'tbody',

            'tr',

  function callout(html, opts) {
    var o = opts || {};

  }

  /** 🏅 배지 카드 (명세 9.11 · 이번 차시 추가 헬퍼) */
  function award(opts) {
    var o = opts || {};
    return el('div', { 'class': 'award' }, [
      el('span', { 'class': 'award__icon', text: o.icon || '🏅', attrs: { 'aria-hidden': 'true' } }),
      el('div', { 'class': 'award__body' }, [
        el('p', { 'class': 'award__title', text: o.title || '' }),

      ])
    ]);
  }

  /** 보충 학습 바로가기 줄 (명세 10.3 · 이번 차시 추가 헬퍼) */
  function linkLine(opts) {
    var o = opts || {};

      el('span', { 'class': 'linkline__label', html: o.text || '' }),
      button({
        label: o.label || o.step + '단계로 이동',
        variant: 'secondary',
        className: 'linkline__link',
        ariaLabel: o.step + '단계 화면으로 이동',
        onClick: function () {
          L.nav.goToStep(o.step, { force: true });
        }
      })

  }

  /* ------------------------------ 알림 ------------------------------ */
  function toast(message, duration) {
    var region = document.getElementById('toast-region');
    if (!region) return;
    var node = el('div', { 'class': 'toast', text: message });
    region.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);

  function announce(message) {
    var live = document.getElementById('sr-live');
    if (!live) return;
    live.textContent = '';
    setTimeout(function () {
      live.textContent = message;
    }, 30);

  /**
   * 확인 대화상자 (저장된 진행 복원 · 초기화 확인)
   * dismissValue: Esc 키·백드롭 등으로 그냥 닫았을 때 돌려줄 값.
   */
  function confirmDialog(opts) {
    var o = opts || {};
    var dismissValue = o.dismissValue === undefined ? false : o.dismissValue;
    return new Promise(function (resolve) {
      var dialog = el('dialog', { 'class': 'modal' });
      var settled = false;
      var done = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
        if (dialog.open) dialog.close();
        setTimeout(function () {
          if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        }, 0);
      };

      dialog.appendChild(
        el('div', { 'class': 'modal__body' }, [
          el('h2', { 'class': 'modal__title', text: o.title }),
          el('p', { 'class': 'modal__text', html: o.message }),
          el('div', { 'class': 'modal__actions' }, [
            button({
              label: o.cancelLabel || '취소',
              variant: 'ghost',
              onClick: function () {
                done(false);
              }
            }),
            button({
              label: o.okLabel || '확인',
              variant: o.danger ? 'danger' : 'primary',
              onClick: function () {
                done(true);
              }
            })
          ])
        ])
      );
      dialog.addEventListener('cancel', function (e) {
        e.preventDefault();
        done(dismissValue);
      });
      dialog.addEventListener('close', function () {
        done(dismissValue);
      });

      document.body.appendChild(dialog);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    });
  }

  /** 툴팁이 달린 인라인 텍스트 (터치에서는 탭으로 토글) */
  function tipText(text, tip) {
    var node = el('span', {
      'class': 'has-tip',
      text: text,
      tabindex: '0',
      dataset: { tip: tip },
      attrs: { 'aria-label': text + '. ' + tip }
    });
    node.addEventListener('click', function () {
      node.classList.toggle('is-tip-open');
    });
    return node;
  }

  /* ------------------------------ 공개 ------------------------------ */
  ui.$ = $;
  ui.$$ = $$;
  ui.el = el;
  ui.clear = clear;
  ui.escapeHtml = escapeHtml;
  ui.debounce = debounce;
  ui.prefersReducedMotion = prefersReducedMotion;
  ui.animMs = animMs;
  ui.sleep = sleep;
  ui.scrollToNode = scrollToNode;
  ui.stepHeader = stepHeader;
  ui.activityHeader = activityHeader;
  ui.panel = panel;
  ui.split = split;
  ui.sectionTitle = sectionTitle;
  ui.button = button;
  ui.buttonRow = buttonRow;
  ui.chipRow = chipRow;
  ui.radioGroup = radioGroup;
  ui.tabs = tabs;
  ui.mobileTabs = mobileTabs;
  ui.numberField = numberField;
  ui.textField = textField;
  ui.textAreaField = textAreaField;
  ui.selectField = selectField;
  ui.createConsole = createConsole;
  ui.createFeedback = createFeedback;
  ui.badge = badge;
  ui.boolBadge = boolBadge;
  ui.dataTable = dataTable;
  ui.callout = callout;
  ui.award = award;
  ui.linkLine = linkLine;
  ui.toast = toast;
  ui.announce = announce;
  ui.confirmDialog = confirmDialog;
  ui.tipText = tipText;
})();

          row.classList.add('is-running');
          if (marker) marker.textContent = '▶';
        } else if (state === 'done' || state === 'executed') {
          row.classList.add('is-done');
          if (marker) marker.textContent = '✔';
        } else if (state === 'skipped') {
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '↓';
        } else if (state === 'unchecked') {

          row.classList.add('is-unchecked');
          row.classList.add('is-skipped');
          if (marker) marker.textContent = '—';
        } else if (state === 'error') {
          row.classList.add('is-error');
          if (marker) marker.textContent = '✕';
        } else if (marker) {
          marker.textContent = '·';
        }

      /** { 0:'done', 1:'unchecked', ... } 형태로 한 번에 지정한다. */
      setStates: function (map) {
        Object.keys(map || {}).forEach(function (key) {
          api.setState(Number(key), map[key]);

      },

          api.setState(i, 'idle');
        });
        api.clearBadges();

        var existing = row.querySelector('.code-line__badge');

          el('span', {
            'class': 'badge ' + (map[kind] || 'badge--primary') + ' code-line__badge',
            text: text

  /**
   * 재도전 변형(명세 22장) — 문항 내용과 정답은 그대로 두고 제시 순서만 바꾼다.
   * 값은 문항 id 이며, 배열의 자리(0~3)가 화면에 나오는 차례다.
   * 4번째 도전부터는 다시 기본 순서로 순환한다.
   */
  var ORDERS = [
    [1, 2, 3, 4], // 기본
    [3, 1, 4, 2], // 재도전 1
    [4, 3, 2, 1] // 재도전 2
  ];

  /** attempt(0부터) 에 맞는 제시 순서를 돌려준다. 3벌을 순환한다. */
  function orderFor(attempt) {
    var n = Number(attempt) || 0;
    var i = ((n % ORDERS.length) + ORDERS.length) % ORDERS.length;
    return ORDERS[i].slice();
  }

  function byId(id) {
    for (var i = 0; i < QUESTIONS.length; i += 1) {
      if (QUESTIONS[i].id === Number(id)) return QUESTIONS[i];
    }
    return null;
  }

  /* 유형별 응답 처리                                                      */
  /* ------------------------------------------------------------------ */

  /** 응답이 있는가(미응답과 구분) */
  function isAnswered(q, answer) {
    if (answer === null || answer === undefined) return false;
    if (q.type === 'choice') return answer !== '' && !isNaN(Number(answer));
    if (q.type === 'text') return outputLines(answer).length > 0;
    if (q.type === 'blanks') {
      return q.blanks.some(function (b) {
        return String((answer || {})[b.key] || '').trim().length > 0;
      });
    }
    return false;
  }

  /** 빈칸 하나가 정답인가 */
  function blankOk(blank, value) {
    var got = squeeze(value);
    if (!got) return false;
    return blank.accepted.some(function (ok) {

    });
  }

  /** 문항 하나를 채점한다. 부분 점수는 주지 않는다(명세 15.1). */
  function gradeAnswer(q, answer) {
    if (!isAnswered(q, answer)) return false;
    if (q.type === 'choice') return Number(answer) === q.answer;
    if (q.type === 'text') {
      var got = outputLines(answer);
      if (got.length !== q.expected.length) return false;
      return got.every(function (line, i) {
        return line === q.expected[i];
      });
    }
    if (q.type === 'blanks') {
      return q.blanks.every(function (b) {
        return blankOk(b, (answer || {})[b.key]);
      });
    }
    return false;
  }

  /** 빈칸별 정오 (해설 화면에서 어느 칸이 틀렸는지 보여 줄 때) */
  function blankMarks(q, answer) {
    if (q.type !== 'blanks') return {};
    var marks = {};
    q.blanks.forEach(function (b) {
      marks[b.key] = blankOk(b, (answer || {})[b.key]);
    });
    return marks;
  }

  /** 화면·기록·제출에 쓰는 「내 답」 문자열 */
  function answerToText(q, answer) {
    if (!isAnswered(q, answer)) return '';
    if (q.type === 'choice') {
      var i = Number(answer) - 1;
      return '①②③④⑤'[i] + ' ' + q.options[i];
    }
    if (q.type === 'text') return outputLines(answer).join('\n');
    if (q.type === 'blanks') {
      return q.blanks
        .map(function (b) {
          return b.mark + ' ' + String((answer || {})[b.key] || '').trim();

        .join(' / ');
    }
    return '';
  }

  /** 정답 문자열 */
  function correctToText(q) {
    if (q.type === 'choice') return '①②③④⑤'[q.answer - 1] + ' ' + q.options[q.answer - 1];
    if (q.type === 'text') return q.expected.join('\n');
    if (q.type === 'blanks') {
      return q.blanks
        .map(function (b) {
          return b.mark + ' ' + b.model;
        })
        .join(' / ');
    }
    return '';
  }

  /**
   * answerToText() 로 저장된 문자열을 응답 값으로 되돌린다.
   * 교사용이 제출 JSON 만으로 다시 채점할 때 쓴다(명세 34장).
   */
  function answerFromText(q, text) {
    var s = String(text === undefined || text === null ? '' : text).trim();
    if (!s) return null;
    if (q.type === 'choice') {
      var idx = '①②③④⑤'.indexOf(s.charAt(0));
      if (idx !== -1) return idx + 1;
      var m = s.match(/^([1-5])[).\s]/);
      return m ? Number(m[1]) : null;
    }
    if (q.type === 'text') return s;
    if (q.type === 'blanks') {
      var out = {};
      s.split('/').forEach(function (piece) {

          return b.mark === mark;
        })[0];
        if (blank) out[blank.key] = t.slice(1).trim();
      });
      return out;
    }
    return null;
  }

  /**
   * 채점 (명세 15.1)
   * @param {object} answers  { 문항id : 응답 }  미응답은 null / undefined
   * @returns {{score, maxScore, passed, correctCount, details:Array}}
   *   details[i] = { id, answer, state:'correct'|'wrong'|'none', points, category }
   */
  function grade(answers) {
    var a = answers || {};
    var details = QUESTIONS.map(function (q) {
      var picked = a[q.id];
      var answered = isAnswered(q, picked);
      var state = !answered ? 'none' : gradeAnswer(q, picked) ? 'correct' : 'wrong';
      return {
        id: q.id,
        answer: answered ? picked : null,
        // 예전 형식과의 호환 : 선택형은 picked 번호를 그대로 둔다
        picked: q.type === 'choice' && answered ? Number(picked) : null,
        state: state,
        points: state === 'correct' ? q.points : 0,
        category: q.category
      };
    });
    var score = details.reduce(function (sum, d) {
      return sum + d.points;
    }, 0);
    return {
      score: score,
      maxScore: MAX_SCORE,
      passed: score >= PASS_SCORE,
      correctCount: details.filter(function (d) {
        return d.state === 'correct';
      }).length,
      details: details
    };
  }

  /** 이수 여부를 글자로. 색에 기대지 않도록 항상 이 문자열을 함께 쓴다(명세 50.4). */
  function passLabel(score) {
    return Number(score) >= PASS_SCORE ? '이수' : '보충 학습 대상';
  }

  /** 영역(오답 유형)별 문항 묶음 — 교사용 38장 영역 분석에 쓴다. */
  function byCategory() {
    return CATEGORIES.map(function (name) {
      return {
        category: name,
        questions: QUESTIONS.filter(function (q) {
          return q.category === name;
        })
      };
    });
  }

  return {
    POINT: POINT,
    MAX_SCORE: MAX_SCORE,
    PASS_SCORE: PASS_SCORE,
    CATEGORIES: CATEGORIES,
    QUESTIONS: QUESTIONS,
    ORDERS: ORDERS,
    orderFor: orderFor,
    byId: byId,
    // 유형별 응답 처리
    isAnswered: isAnswered,
    gradeAnswer: gradeAnswer,
    blankMarks: blankMarks,
    answerToText: answerToText,
    correctToText: correctToText,
    answerFromText: answerFromText,
    outputLines: outputLines,
    squeeze: squeeze,
    // 채점
    grade: grade,
    passLabel: passLabel,
    byCategory: byCategory
  };
});

    try {

    } catch (err) {

  function remainingHint(step) {

    var st = appState;
    var parts = [];

    if (s === 1) {

      if (!st.step2.predictDone) parts.push('2×4 예측');
    } else if (s === 3) {
      if (!st.step3.ranBasic) parts.push('조합 시뮬레이션 실행');
      if (!st.step3.guessDone) parts.push('조합 수 예측');
      if (!st.step3.blanksDone) parts.push('코드 완성');

      if (!st.step4.classifyDone) parts.push('행 분류');

      if (!(st.step4.tabsSeen || []).length) parts.push('다른 패턴 1개 비교');

      if (!(best >= L.CONST.PROJECT_PASS)) {

    onChange: onChange,
    markChanged: markChanged,

    remainingHint: remainingHint,
    answeredCount: answeredCount

  /* ================================================================== */
  /* 4. 프로그램 실행 (명세 10.6)                                         */
  /* ================================================================== */

  /**
   * 학생이 채운 코드를 실행한다.
   * @param {object} spec { range, branches:[{cond, out}, ...], elseOut }
   * @returns {{ok:boolean, lines:Array<string>, rows:Array, error:string}}

    if (!range.ok) return { ok: false, lines: [], rows: [], error: range.message };

    var branches = (s.branches || []).filter(function (b) {
      return b && String(b.cond || '').trim().length > 0;
    });
    if (!branches.length) {
      return { ok: false, lines: [], rows: [], error: '조건식을 입력해 주세요.' };
    }
    if (!String(s.elseOut || '').trim()) {
      return { ok: false, lines: [], rows: [], error: 'else 에서 출력할 식을 입력해 주세요.' };
    }

    var lines = [];
    var rows = [];
    for (var k = 0; k < range.values.length; k += 1) {
      var i = range.values[k];
      var checks = [];
      var chosen = -1;
      for (var b = 0; b < branches.length; b += 1) {

        i: i,
        branch: chosen === -1 ? branches.length : chosen,

  function leadingSpaces(text) {

    var max = Math.max(actual.length, expected.length);

    if (!lineCountOk) {
      messages.unshift(
        '줄 수가 달라요. ' + expected.length + '줄이어야 하는데 현재 ' + actual.length + '줄입니다.'
      );
    }
    return {
      same: lineCountOk && sameRows === total,
      lineCountOk: lineCountOk,
      sameRows: sameRows,
      total: total,
      spaceOk: spaceOk,
      messages: messages,
      marks: marks
    };
  }

  /* ================================================================== */
  /* 6. 프로젝트 루브릭 채점 (명세 12장)                                   */
  /* ================================================================== */

  /** 명세 12장 : 100점 만점 배점표 */
  var RUBRIC = [
    { key: 'syntaxIndent', label: '문법과 들여쓰기', max: 30 },
    { key: 'condition', label: '행을 구분하는 조건식', max: 30 },
    { key: 'output', label: '출력 모양과 공백', max: 30 },

  /**

  /**

   *
   * @param {object} input
   *   taskId       'base' | 'A' | 'B' | 'C'
   *   spec         { range, branches:[{cond,out}], elseOut }
   *   predicted    실행 전 예측을 제출했는가(boolean)
   *   ruleText     행별 규칙 한 문장 설명(string)
   * @returns {{
   *   score:number, maxScore:number, passed:boolean,
   *   rubric:object, detail:Array, run:object, compare:object, messages:Array<string>
   * }}
   */
  function scoreProject(input) {
    var o = input || {};
    var t = task(o.taskId) || TASKS.base;
    var spec = o.spec || {};
    var messages = [];

    var rubric = { syntaxIndent: 0, condition: 0, output: 0, predictionRule: 0 };
    var detail = [];

    /* --- 문법과 들여쓰기 30점 : 반복 구조 10 · 분기 구조 10 · print 위치 10 --- */
    var range = parseRange(spec.range);
    if (range.ok && range.values.length === t.lines.length) {
      rubric.syntaxIndent += 10;
      detail.push({ label: '반복 구조(range) 정상', point: 10, max: 10 });
    } else {
      detail.push({
        label: '반복 구조(range) 정상',
        point: 0,
        max: 10,
        note: range.ok
          ? 'range 가 만드는 행 수가 ' + range.values.length + '개예요. ' + t.lines.length + '개가 필요해요.'
          : range.message
      });
      messages.push(
        range.ok
          ? '반복 범위를 확인해 주세요. 행이 ' + t.lines.length + '개 필요합니다.'
          : range.message
      );
    }

    var branches = (spec.branches || []).filter(function (b) {
      return b && String(b.cond || '').trim();
    });
    var needBranches = t.useElif ? 2 : 1;
    var hasElse = String(spec.elseOut || '').trim().length > 0;
    if (branches.length >= needBranches && hasElse) {
      rubric.syntaxIndent += 10;
      detail.push({ label: 'if / ' + (t.useElif ? 'elif / ' : '') + 'else 구조 정상', point: 10, max: 10 });
    } else {
      detail.push({
        label: 'if / ' + (t.useElif ? 'elif / ' : '') + 'else 구조 정상',
        point: 0,
        max: 10,
        note: '조건식과 else 출력식을 모두 채워야 해요.'
      });
    }

    var allOutputsFilled = branches.every(function (b) {
      return String(b.out || '').trim().length > 0;
    }) && hasElse;
    if (allOutputsFilled) {
      rubric.syntaxIndent += 10;
      detail.push({ label: 'print 위치와 출력식 정상', point: 10, max: 10 });
    } else {
      detail.push({
        label: 'print 위치와 출력식 정상',
        point: 0,
        max: 10,
        note: '각 분기의 print(...) 안에 출력식을 넣어야 해요.'
      });
    }

    /* --- 실행 --- */
    var run = runProgram(spec);
    if (!run.ok) messages.push(run.error);

    /* --- 조건식 30점 : 첫 분기 15 · 두 번째 분기/else 15 --- */
    if (run.ok) {
      var first = branchMatch(run.rows, t.rowBranch, 0);
      if (first) {
        rubric.condition += 15;
        detail.push({ label: '첫 번째 분기가 맡을 행을 정확히 구분', point: 15, max: 15 });
      } else {
        detail.push({
          label: '첫 번째 분기가 맡을 행을 정확히 구분',
          point: 0,
          max: 15,
          note: '첫 조건식이 골라야 하는 행과 실제로 고른 행이 달라요.'
        });
      }
      var secondIndex = t.useElif ? 1 : null;
      var secondOk = t.useElif
        ? branchMatch(run.rows, t.rowBranch, 1) && branchMatch(run.rows, t.rowBranch, 2)
        : branchMatch(run.rows, t.rowBranch, 1);
      if (secondOk) {
        rubric.condition += 15;
        detail.push({
          label: t.useElif ? '두 번째 분기와 else 가 정확' : 'else 가 맡을 행이 정확',
          point: 15,
          max: 15
        });
      } else {
        detail.push({
          label: t.useElif ? '두 번째 분기와 else 가 정확' : 'else 가 맡을 행이 정확',
          point: 0,
          max: 15,
          note: '나머지 행을 어느 분기가 맡는지 다시 확인해 주세요.'
        });
      }
      if (secondIndex === null && !secondOk) {
        messages.push('나머지 행(else)이 맡아야 하는 모양을 확인해 주세요.');
      }
    } else {
      detail.push({ label: '조건식', point: 0, max: 30, note: run.error });
    }

    /* --- 출력 30점 : 행 수 5 · 각 행 문자열 15 · 공백 위치 5 · 줄 바꿈 5 --- */
    var cmp = compareOutput(run.ok ? run.lines : [], t.lines);
    if (cmp.lineCountOk) {
      rubric.output += 5;
      detail.push({ label: '행 수 정확 (' + t.lines.length + '줄)', point: 5, max: 5 });
    } else {
      detail.push({ label: '행 수 정확 (' + t.lines.length + '줄)', point: 0, max: 5 });
    }
    var rowPoint = cmp.total ? Math.round((cmp.sameRows / cmp.total) * 15) : 0;
    rubric.output += rowPoint;
    detail.push({
      label: '각 행 문자열 정확 (' + cmp.sameRows + ' / ' + cmp.total + '줄)',
      point: rowPoint,
      max: 15
    });
    if (cmp.spaceOk) {
      rubric.output += 5;
      detail.push({ label: '공백 위치 정확', point: 5, max: 5 });
    } else {
      detail.push({ label: '공백 위치 정확', point: 0, max: 5, note: '공백도 출력 결과의 일부예요.' });
    }
    var newlineOk =
      cmp.lineCountOk &&
      (run.lines || []).every(function (line) {
        return String(line).indexOf('\n') === -1;
      });
    if (newlineOk) {
      rubric.output += 5;
      detail.push({ label: '줄 바꿈 정확', point: 5, max: 5 });
    } else {
      detail.push({ label: '줄 바꿈 정확', point: 0, max: 5 });
    }

    /* --- 예측 · 설명 10점 : 예측 제출 4 · 규칙 설명 6 --- */
    if (o.predicted) {
      rubric.predictionRule += 4;
      detail.push({ label: '실행 전 예측 제출', point: 4, max: 4 });
    } else {
      detail.push({ label: '실행 전 예측 제출', point: 0, max: 4, note: '실행 전 예측을 한 번 제출해 주세요.' });
    }
    var ruleText = String(o.ruleText || '').trim();
    if (ruleText.length >= 5) {
      rubric.predictionRule += 6;
      detail.push({ label: '행별 규칙 한 문장 설명', point: 6, max: 6 });
    } else {
      detail.push({
        label: '행별 규칙 한 문장 설명',
        point: 0,
        max: 6,
        note: '어떤 행들을 같은 규칙으로 묶었는지 한 문장으로 적어 주세요(5자 이상).'
      });
    }

    var score =
      rubric.syntaxIndent + rubric.condition + rubric.output + rubric.predictionRule;

    return {
      score: score,
      maxScore: 100,
      passed: score >= 60,
      rubric: rubric,
      detail: detail,
      run: run,
      compare: cmp,
      messages: messages.concat(cmp.messages)
    };
  }

  /** 명세 12.1 : 프로젝트 이수 여부를 글자로 */
  function projectLabel(score) {
    return Number(score) >= 60 ? '프로젝트 이수' : '프로젝트 보충 필요';
  }

  /** 명세 11.5 : 실패 횟수에 따른 단계형 힌트. 완성 코드 전체는 절대 자동 공개하지 않는다. */
  function hintFor(taskId, failCount) {
    var t = task(taskId) || TASKS.base;
    var n = Math.max(0, Number(failCount) || 0);
    if (n <= 0) return null;
    var index = Math.min(n, t.hints.length) - 1;
    return { level: index + 1, text: t.hints[index] };
  }

  /** 명세 11.5 : 학생이 [완성 코드 보기]를 명시적으로 눌렀을 때만 쓰는 학습용 정답 코드 */
  function answerCode(taskId) {
    var t = task(taskId) || TASKS.base;
    var lines = ['for i in ' + t.rangeAnswer[0] + ':'];
    lines.push('    if ' + t.condAnswer[0][0] + ':');
    lines.push('        print(' + t.outAnswer[0][0] + ')');
    if (t.useElif) {
      lines.push('    elif ' + t.condAnswer[1][0] + ':');
      lines.push('        print(' + t.outAnswer[1][0] + ')');
      lines.push('    else:');
      lines.push('        print(' + t.outAnswer[2][0] + ')');
    } else {
      lines.push('    else:');
      lines.push('        print(' + t.outAnswer[1][0] + ')');
    }
    return lines.join('\n');
  }

  return {
    SPACE_DOT: SPACE_DOT,
    TASKS: TASKS,
    COMPARE_TABS: COMPARE_TABS,
    task: task,
    // 공백
    spaceView: spaceView,
    viewLines: viewLines,
    describeLine: describeLine,
    // 제한 문법 파서
    tokenize: tokenize,
    evaluate: evaluate,
    evalCondition: evalCondition,
    evalOutput: evalOutput,
    parseRange: parseRange,
    // 실행 · 채점
    runProgram: runProgram,
    compareOutput: compareOutput,
    RUBRIC: RUBRIC,
    scoreProject: scoreProject,
    projectLabel: projectLabel,
    hintFor: hintFor,
    answerCode: answerCode
  };
});

    <script data-from="js/61-step2.js">
/**
 * 화면 2 — 중첩 반복문 행·열 실행 시뮬레이션 (명세 7장)
 *
 *   바깥 반복 i = 행, 안쪽 반복 j = 열.
 *   바깥 반복이 «한 번» 실행될 때 안쪽 반복은 «처음부터 끝까지» 실행된다(명세 62.1).
 */
(function () {
  "use strict";

  var L = window.L;
  var ui = L.ui;
  var el = ui.el;
  var C = L.CONST;
  var E = L.engine;

  var SRC = [
    'for i in range(3):',
    '    for j in range(1, 6):',
    '        print(j, end=" ")',
    '    print()'
  ];

  var ROWS = 3;
  var COLS = 5;
  var TOTAL = ROWS * COLS;

  var refs = {};
  var sim = null; // { grid, player, codeview, stateCard, lines }

  function st() {
    return L.state.appState.step2;
  }

  /* ------------------------------------------------------------------ */
  /* 시뮬레이션                                                           */
  /* ------------------------------------------------------------------ */
  function resetSim() {
    sim.grid.clear();
    sim.codeview.clearStates();
    sim.stateCard.reset(TOTAL);
    sim.lines = [];
    paintOutput();
    sim.player.reset();
    refs.feedback.clear();
    refs.progressLine.textContent = '내부 print 실행 횟수 0 / ' + TOTAL;
    updateButtons();
  }

  function paintOutput() {
    ui.clear(refs.outBody);
    if (!sim.lines.length) {
      refs.outBody.appendChild(
        el('p', { 'class': 'console__empty', text: '실행 버튼을 누르면 출력이 여기에 나타나요.' })
      );
      return;
    }
    sim.lines.forEach(function (line, i) {
      refs.outBody.appendChild(
        el('div', { 'class': 'outpane__line' }, [
          el('span', { 'class': 'outpane__text', text: line.text }),
          line.closed ? el('span', { 'class': 'outpane__nl', text: '↵' }) : null
        ])
      );
      void i;
    });
  }

  function currentLine() {
    if (!sim.lines.length || sim.lines[sim.lines.length - 1].closed) {
      sim.lines.push({ text: '', closed: false });
    }
    return sim.lines[sim.lines.length - 1];
  }

  function onEvent(ev) {
    var cv = sim.codeview;
    if (ev.type === 'outer-enter') {
      cv.clearStates();
      cv.setState(0, 'running');
      sim.grid.setCurrentRow(ev.i);
      sim.stateCard.set({
        i: ev.i,
        j: '-',
        pos: ev.row + '행 시작',
        count: ev.count,
        total: TOTAL
      });
      refs.feedback.show('info', '바깥 반복 <code>i = ' + ev.i + '</code> 진입 — 이제 안쪽 반복이 처음부터 실행됩니다.');
    } else if (ev.type === 'inner-enter') {
      cv.setState(0, 'done');
      cv.setState(1, 'running');
      sim.stateCard.set({ i: ev.i, j: ev.j, pos: ev.row + '행 1열 준비', count: ev.count });
      refs.feedback.show('info', '안쪽 반복 시작 — <code>j</code> 는 다시 <strong>1</strong> 부터 시작합니다.');
    } else if (ev.type === 'print') {
      cv.setState(1, 'done');
      cv.setState(2, 'running');
      cv.setState(3, 'idle');
      sim.grid.setValue(ev.row - 1, ev.col - 1, ev.value, { i: ev.i, j: ev.j });
      sim.grid.setCurrent(ev.row - 1, ev.col - 1);
      var line = currentLine();
      line.text = line.text ? line.text + ' ' + ev.value : String(ev.value);
      paintOutput();
      sim.stateCard.set({
        i: ev.i,
        j: ev.j,
        pos: ev.row + '행 ' + ev.col + '열',
        count: ev.count + ' / ' + TOTAL,
        total: TOTAL
      });
      refs.progressLine.textContent = '내부 print 실행 횟수 ' + ev.count + ' / ' + TOTAL;
      if (ev.count > (st().cells || 0)) {
        st().cells = ev.count;
        L.state.markChanged();
      }
      ui.announce(ev.row + '행 ' + ev.col + '열, i는 ' + ev.i + ', j는 ' + ev.j + ', 값 ' + ev.value + ' 출력 완료');
    } else if (ev.type === 'inner-exit') {
      cv.setState(2, 'done');
      refs.feedback.show(
        'info',
        '안쪽 반복 종료 — <code>j</code> 가 5까지 끝났습니다. 이제 4번째 줄 <code>print()</code> 가 실행됩니다.'
      );
    } else if (ev.type === 'newline') {
      cv.setState(3, 'running');
      sim.grid.showNewline(ev.row - 1);
      currentLine().closed = true;
      paintOutput();
      if (!st().sawNewline) {
        st().sawNewline = true;
        L.state.markChanged();
      }
      refs.feedback.show(
        'success',
        '줄 바꿈 ↵ — <code>i</code> 가 1 증가하면 <code>j</code> 가 이어서 6이 되는 것이 아니라 ' +
          '<strong>안쪽 반복이 다시 처음부터 시작</strong>합니다.',
        '↵'
      );
    } else if (ev.type === 'end') {
      sim.codeview.clearStates();
      sim.grid.setCurrentRow(-1);
      if (!st().ranFull) {
        st().ranFull = true;
        L.state.markChanged();
      }
      refs.feedback.show(
        'success',
        '전체 실행을 마쳤어요. 행 ' + ROWS + '개 × 각 행의 열 ' + COLS + '개 = 내부 print <strong>' +
          TOTAL + '회</strong>입니다.',
        '🎉'
      );
      refs.mathCard.classList.add('is-on');
    }
    updateButtons();
  }

  function updateButtons() {
    var playing = sim.player.isPlaying();
    refs.btnPlay.disabled = playing;
    refs.btnPause.disabled = !playing;
    refs.btnLine.disabled = playing;
    refs.btnCell.disabled = playing;
  }

  function buildSim() {
    var codeview = L.codeview.createCodeView({
      title: '원본 프로그램',
      lines: SRC.map(function (line) {
        return { code: line };
      }),
      ariaLabel: '중첩 반복문 파이썬 코드'
    });

    var grid = L.flow.createGrid({
      rows: ROWS,
      cols: COLS,
      caption: '중첩 반복문 실행 격자. 행은 바깥 반복 i, 열은 안쪽 반복 j 입니다.',
      rowLabel: function (r) {
        return 'i = ' + r;
      },
      colLabel: function (c) {
        return 'j = ' + (c + 1);
      }
    });

    var stateCard = L.flow.createStateCard({ title: '실행 상태' });

    var events = E.nestedEvents({ outerCount: ROWS, innerFrom: 1, innerTo: 6 }).events;
    var player = L.flow.createPlayer({
      events: events,
      speed: C.CELL_MS,
      onEvent: onEvent,
      onStateChange: updateButtons
    });

    sim = { grid: grid, player: player, codeview: codeview, stateCard: stateCard, lines: [] };
    return sim;
  }

  /* ------------------------------------------------------------------ */
  /* 2×4 예측 (명세 7.8)                                                   */
  /* ------------------------------------------------------------------ */
  function buildPredict() {
    var panel = ui.panel({
      title: '예측 활동 — 코드가 이렇게 바뀌면?',
      hint: '실행하기 전에 먼저 예측해 보세요. 예측이 틀려도 다음 단계로 갈 수 있어요.'
    });

    panel.body.appendChild(
      L.codeview.createCodeView({
        lines: [
          'for i in range(2):',
          '    for j in range(1, 5):',
          '        print(j, end=" ")',
          '    print()'
        ].map(function (line) {
          return { code: line };
        }),
        showLineNumbers: false,
        ariaLabel: '2×4 예측용 코드'
      }).root
    );

    refs.pRows = ui.textField({ label: '행 수', width: '90px', inputmode: 'numeric', maxLength: 3 });
    refs.pCols = ui.textField({ label: '열 수', width: '90px', inputmode: 'numeric', maxLength: 3 });
    refs.pPrints = ui.textField({
      label: '내부 print(j...) 실행 횟수',
      width: '110px',
      inputmode: 'numeric',
      maxLength: 4
    });
    panel.body.appendChild(
      el('div', { 'class': 'row' }, [refs.pRows.root, refs.pCols.root, refs.pPrints.root])
    );

    refs.pFeedback = ui.createFeedback({ emptyText: '세 칸을 채운 뒤 [예측 확인] 을 누르세요.' });
    panel.body.appendChild(
      ui.buttonRow([ui.button({ label: '예측 확인', onClick: checkPredict })])
    );
    panel.body.appendChild(refs.pFeedback.root);
    return panel.root;
  }

  function checkPredict() {
    var rows = String(refs.pRows.getValue() || '').trim();
    var cols = String(refs.pCols.getValue() || '').trim();
    var prints = String(refs.pPrints.getValue() || '').trim();
    if (!rows || !cols || !prints) {
      refs.pFeedback.show('warning', '! 세 칸을 모두 채워 주세요.');
      return;
    }
    var info = E.nestedInfo(2, 4);
    var ok = Number(rows) === info.rows && Number(cols) === info.cols && Number(prints) === info.prints;

    st().predict = { rows: rows, cols: cols, prints: prints };
    st().predictDone = true;
    st().predictOk = ok;
    L.state.markChanged();

    if (ok) {
      refs.pFeedback.show(
        'success',
        '✓ 정확해요. <strong>2행 · 4열 · 내부 실행 8회</strong>입니다. ' +
          '바깥 반복 횟수 × 안쪽 반복 횟수 = <code>2 × 4 = 8</code>.',
        '🎉'
      );
    } else {
      refs.pFeedback.show(
        'error',
        '✕ 다시 확인해 보세요. 바깥 반복은 <strong>행의 개수</strong>, 안쪽 반복은 ' +
          '<strong>한 행에서 실행되는 횟수</strong>입니다.<br />' +
          '전체 내부 실행 횟수는 <code>2 × 4</code> 로 생각해 보세요. ' +
          '(정답 : 2행 · 4열 · 8회 — 예측이 틀려도 다음으로 갈 수 있어요.)'
      );
    }
    ui.announce(ok ? '예측이 맞았습니다.' : '예측이 틀렸습니다. 정답은 2행 4열 8회입니다.');
  }

  /* ------------------------------------------------------------------ */
  /* 반복 순서 비교 (명세 7.9)                                              */
  /* ------------------------------------------------------------------ */
  function runCompare(which) {
    var pane = which === 'A' ? refs.cmpAOut : refs.cmpBOut;
    // A : 바깥 i(2회) · 안쪽 j(1~4) → 2줄
    // B : 바깥 j(1~4) · 안쪽 i(0~1) → 4줄. 출력되는 값은 안쪽 변수 i 이므로 0, 1 이다.
    var lines =
      which === 'A'
        ? E.nestedEvents({ outerCount: 2, innerFrom: 1, innerTo: 5 }).lines
        : E.nestedEvents({ outerCount: 4, innerFrom: 0, innerTo: 2 }).lines;

    ui.clear(pane);
    lines.forEach(function (line) {
      pane.appendChild(el('div', { 'class': 'outpane__line' }, [
        el('span', { 'class': 'outpane__text', text: line }),
        el('span', { 'class': 'outpane__nl', text: '↵' })
      ]));
    });

    if ((st().compared || []).indexOf(which) === -1) {
      st().compared = (st().compared || []).concat([which]);
      L.state.markChanged();
    }
    if ((st().compared || []).length >= 2) {
      refs.cmpFeedback.show(
        'success',
        '어떤 변수가 바깥 반복에 있느냐에 따라 <strong>행을 묶는 기준</strong>이 달라집니다. ' +
          'A 는 <code>i</code> 마다 한 줄(2줄), B 는 <code>j</code> 마다 한 줄(4줄)이 됩니다.'
      );
    } else {

  function buildCompare() {
    var panel = ui.panel({
      title: '반복 순서 비교 — 바깥과 안쪽을 바꾸면?',
      hint: '두 코드를 각각 실행해 출력 배열을 비교해 보세요.'
